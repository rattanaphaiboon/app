<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1b3e">
<title>SMR Service Desk v1.3 · Rattana</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{
  --font:'IBM Plex Sans Thai',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-display:'Anuphan','IBM Plex Sans Thai',sans-serif;
  --font-data:'IBM Plex Mono',ui-monospace,Consolas,monospace;

  --paper:#f5f2ea; --paper-2:#ede8dc; --surface:#ffffff; --surface-2:#faf8f3; --sunken:#f1ede3;
  --line:#e4ddcd; --line-strong:#cfc5b0;
  --ink:#0d1b3e; --ink-2:#2b3858; --muted:#5f6577; --faint:#7b7f8c;
  --navy:#0d1b3e; --navy-2:#16274f; --navy-3:#23386a; --on-navy:#ffffff; --on-navy-2:#b9c3da;
  --gold:#c9a84c; --gold-hi:#e3c66f; --gold-ink:#7d5f0f; --gold-wash:#f7efd8;
  --pri-bg:#0d1b3e; --pri-fg:#ffffff; --pri-hover:#1b2e5c;
  --sel-bg:#0d1b3e; --sel-fg:#ffffff; --sel-icon:#e3c66f;

  --st-new:#a33d0b; --st-new-bg:#fbe9df;
  --st-work:#1e4fc2; --st-work-bg:#e5ecfc;
  --st-wait:#7a5600; --st-wait-bg:#fbf0cf;
  --st-done:#0d6b62; --st-done-bg:#dcf1ec;
  --danger:#b42318; --danger-bg:#fdecea;
  --ty-short:#b42318; --ty-exp:#8a5a00; --ty-other:#1e4fc2;

  --fs-2xs:11px; --fs-xs:12px; --fs-sm:13.5px; --fs-md:15px; --fs-lg:17px; --fs-xl:21px; --fs-2xl:28px;
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px; --sp-6:32px; --sp-7:48px;
  --pad-page:16px; --pad-card:18px; --gap-list:10px; --gap-col:40px;
  --r-xs:6px; --r-sm:10px; --r-md:14px; --r-lg:20px; --r-pill:999px;
  --thumb:72px; --ctl-h:48px;
  --hdr-h:60px; --tabs-h:48px; --side-w:232px; --list-w:420px; --aside-w:380px;
  --shadow-1:0 1px 2px rgba(13,27,62,.05),0 6px 18px -8px rgba(13,27,62,.14);
  --shadow-2:0 24px 60px -12px rgba(4,8,20,.35);
  --shadow-focus:0 0 0 3px rgba(201,168,76,.45);
  --ease:cubic-bezier(.16,1,.3,1);
  --z-sticky-sub:90; --z-sticky:100; --z-dropdown:1000; --z-modal:2000; --z-toast:3000;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0a0f1d; --paper-2:#0f1628; --surface:#121a2e; --surface-2:#162038; --sunken:#0d1424;
  --line:#232f4b; --line-strong:#33426a;
  --ink:#eef1f8; --ink-2:#c9d1e4; --muted:#9aa5bf; --faint:#8490ae;
  --pri-bg:#d8b95d; --pri-fg:#0d1b3e; --pri-hover:#e3c66f;
  --sel-bg:#d8b95d; --sel-fg:#0d1b3e; --sel-icon:#0d1b3e; --gold-ink:#e3c66f; --gold-wash:#2a2412;
  --st-new:#ffb08a; --st-new-bg:#3a1f12; --st-work:#9fbaff; --st-work-bg:#17254a;
  --st-wait:#f5cf6b; --st-wait-bg:#33290f; --st-done:#72d6c7; --st-done-bg:#0f2f2b;
  --danger:#ff9c94; --danger-bg:#3a1a18; --ty-short:#ff9c94; --ty-exp:#f5cf6b; --ty-other:#9fbaff;
  --shadow-1:0 1px 2px rgba(0,0,0,.4),0 8px 22px -10px rgba(0,0,0,.6);
}}
:root[data-theme="dark"]{
  --paper:#0a0f1d; --paper-2:#0f1628; --surface:#121a2e; --surface-2:#162038; --sunken:#0d1424;
  --line:#232f4b; --line-strong:#33426a;
  --ink:#eef1f8; --ink-2:#c9d1e4; --muted:#9aa5bf; --faint:#8490ae;
  --pri-bg:#d8b95d; --pri-fg:#0d1b3e; --pri-hover:#e3c66f;
  --sel-bg:#d8b95d; --sel-fg:#0d1b3e; --sel-icon:#0d1b3e; --gold-ink:#e3c66f; --gold-wash:#2a2412;
  --st-new:#ffb08a; --st-new-bg:#3a1f12; --st-work:#9fbaff; --st-work-bg:#17254a;
  --st-wait:#f5cf6b; --st-wait-bg:#33290f; --st-done:#72d6c7; --st-done-bg:#0f2f2b;
  --danger:#ff9c94; --danger-bg:#3a1a18; --ty-short:#ff9c94; --ty-exp:#f5cf6b; --ty-other:#9fbaff;
  --shadow-1:0 1px 2px rgba(0,0,0,.4),0 8px 22px -10px rgba(0,0,0,.6);
}
@media (min-width:960px){:root{--pad-page:32px;--hdr-h:64px}}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:var(--fs-md);line-height:1.5}
::selection{background:var(--gold);color:var(--navy)}
*{scrollbar-width:thin;scrollbar-color:var(--line-strong) transparent}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:none;box-shadow:var(--shadow-focus)}
input,textarea{caret-color:var(--gold-ink)}
.num{font-variant-numeric:tabular-nums}
.code{font-family:var(--font-data);font-size:var(--fs-xs);letter-spacing:.01em;color:var(--muted);font-variant-numeric:tabular-nums}
.l1{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.row{display:flex;align-items:center;gap:var(--sp-2);min-width:0}
.row>*{min-width:0}
.grow{flex:1 1 auto;min-width:0}
.ico{width:18px;height:18px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}


.hdr{position:sticky;top:0;z-index:var(--z-sticky);height:calc(var(--hdr-h) + env(safe-area-inset-top));padding:env(safe-area-inset-top) var(--pad-page) 0;background:var(--navy);color:var(--on-navy);display:flex;align-items:center;gap:var(--sp-3);box-shadow:inset 0 -1px 0 rgba(201,168,76,.35)}
.mark{flex:0 0 auto;width:34px;height:34px;border-radius:9px;background:linear-gradient(150deg,#e3c66f,#b8932f);color:#0d1b3e;display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:12px;letter-spacing:.04em;box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.brand{min-width:0;line-height:1.2}
.brand b{font-family:var(--font-display);font-weight:600;font-size:var(--fs-lg);letter-spacing:-.01em}
.brand small{display:block;font-size:var(--fs-2xs);color:var(--on-navy-2)}
.me{display:none;align-items:center;gap:var(--sp-2);font-size:var(--fs-xs);color:var(--on-navy-2);max-width:300px}
.avatar{flex:0 0 auto;width:30px;height:30px;border-radius:50%;background:var(--navy-3);color:var(--gold-hi);display:grid;place-items:center;font-size:var(--fs-xs);font-weight:600}
.hub{flex:0 0 auto;display:inline-flex;align-items:center;gap:4px;height:32px;padding:0 12px;border-radius:var(--r-pill);background:var(--gold);color:#0d1b3e;font-size:var(--fs-xs);font-weight:600;text-decoration:none}
.hub .ico{width:14px;height:14px;stroke-width:2.4}
@media (min-width:960px){.me{display:flex}}

.tabs{position:sticky;top:calc(var(--hdr-h) + env(safe-area-inset-top));z-index:var(--z-sticky-sub);height:var(--tabs-h);background:var(--surface);display:flex;box-shadow:0 1px 0 var(--line)}
.tabs button{flex:1;border:0;background:var(--surface);color:var(--muted);font-weight:500;position:relative;white-space:nowrap}
.tabs button.on{color:var(--ink);font-weight:600}
.tabs button.on::after{content:"";position:absolute;left:28%;right:28%;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--gold)}
.cnt{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;margin-left:6px;border-radius:var(--r-pill);background:var(--sunken);font-size:var(--fs-2xs);font-weight:600;color:var(--ink-2)}
.tabs .on .cnt,.nav .on .cnt{background:var(--gold);color:#0d1b3e}

.cust{display:grid;gap:var(--gap-col);padding:var(--sp-5) var(--pad-page) 128px;max-width:1180px;margin:0 auto}
.cust-aside{display:none}
@media (min-width:960px){
  .cust{grid-template-columns:minmax(0,1fr) var(--aside-w);align-items:start;padding-top:var(--sp-6);padding-bottom:var(--sp-7)}
  .cust-aside{display:block;position:sticky;top:calc(var(--hdr-h) + var(--sp-6))}
}
@media (max-width:959px){.cust.show-mine .cust-form{display:none}.cust.show-mine .cust-aside{display:block}}

.h1{font-family:var(--font-display);font-weight:600;font-size:var(--fs-2xl);letter-spacing:-.02em;line-height:1.25;margin:0;text-wrap:balance}
.lede{color:var(--muted);margin:var(--sp-1) 0 0;font-size:var(--fs-sm)}
.h2{font-family:var(--font-display);font-weight:600;font-size:var(--fs-lg);margin:0;letter-spacing:-.01em}
.sec{margin-top:var(--sp-6)}
.sec-hd{display:flex;align-items:baseline;gap:var(--sp-2);margin-bottom:var(--sp-3)}
.sec-hd .h2{flex:0 1 auto;width:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.sec-hd .note{font-size:var(--fs-xs);color:var(--faint);margin-left:auto;flex:0 0 auto;white-space:nowrap}
.req{color:var(--danger)}

.types{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--sp-2)}
.type{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-md);padding:var(--sp-4) var(--sp-3);text-align:left;display:flex;flex-direction:column;gap:var(--sp-3);min-width:0;transition:background .25s var(--ease),border-color .25s var(--ease),transform .25s var(--ease);box-shadow:var(--shadow-1)}
.type:hover{border-color:var(--line-strong)}
.type:active{transform:scale(.98)}
.type .ti{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--sunken);color:var(--ink-2);transition:background .25s,color .25s}
.type .ti .ico{width:20px;height:20px}
.type b{font-family:var(--font-display);font-weight:600;font-size:var(--fs-md)}
.type small{display:block;color:var(--muted);font-size:var(--fs-xs)}
.type.on{background:var(--sel-bg);border-color:var(--sel-bg);color:var(--sel-fg)}
.type.on small{color:inherit;opacity:.75}
.type.on .ti{background:rgba(255,255,255,.1);color:var(--sel-icon)}
@media (max-width:420px){.type{padding:var(--sp-3) var(--sp-2);gap:var(--sp-2)}.type small{display:none}.type b{font-size:var(--fs-sm)}}

.items{display:flex;flex-direction:column;gap:var(--gap-list)}
.item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:var(--sp-3);display:flex;flex-direction:column;gap:var(--sp-3);box-shadow:var(--shadow-1)}
.picker{display:flex;align-items:center;gap:var(--sp-3);width:100%;min-height:58px;border:1px solid var(--line-strong);border-radius:var(--r-sm);background:var(--surface-2);padding:var(--sp-2) var(--sp-3);text-align:left;transition:border-color .2s}
.picker:hover{border-color:var(--ink-2)}
.picker .pm{flex:0 0 auto;width:40px;height:40px;border-radius:var(--r-xs);background:var(--sunken);display:grid;place-items:center;color:var(--faint)}
.picker .pn{font-weight:600}
.picker .ph{color:var(--muted)}
.picker .car{flex:0 0 auto;color:var(--faint);display:grid}
.item-ft{display:flex;gap:var(--sp-2);align-items:stretch;flex-wrap:wrap}
.stepper{display:flex;align-items:center;height:44px;border:1px solid var(--line-strong);border-radius:var(--r-sm);background:var(--surface);flex:0 0 132px;overflow:hidden}
.stepper button{width:40px;height:100%;border:0;background:transparent;color:var(--ink-2);display:grid;place-items:center}
.stepper button:hover{background:var(--sunken)}
.stepper input{width:100%;min-width:0;border:0;background:transparent;text-align:center;font-weight:600;font-variant-numeric:tabular-nums;outline:none}
.seg{flex:1 1 170px;display:flex;padding:3px;gap:2px;background:var(--sunken);border-radius:var(--r-sm);height:44px}
.seg button{flex:1;border:0;background:transparent;border-radius:7px;font-size:var(--fs-sm);color:var(--muted);white-space:nowrap;transition:background .2s,color .2s}
.seg button.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:var(--shadow-1)}
.seg button:disabled{opacity:.35;cursor:not-allowed}
.exp{display:flex;align-items:center;gap:var(--sp-2);font-size:var(--fs-sm);color:var(--muted)}
.exp input{height:40px;border:1px solid var(--line-strong);border-radius:var(--r-sm);background:var(--surface);padding:0 var(--sp-3);min-width:0;flex:1;outline:none}
.conv{font-size:var(--fs-xs);color:var(--gold-ink);background:var(--gold-wash);padding:6px var(--sp-3);border-radius:var(--r-xs)}
.rm{flex:0 0 auto;width:34px;height:34px;border:0;border-radius:50%;background:transparent;color:var(--faint);display:grid;place-items:center}
.rm:hover{background:var(--danger-bg);color:var(--danger)}
.add{display:flex;align-items:center;justify-content:center;gap:var(--sp-2);height:48px;border:1.5px dashed var(--line-strong);border-radius:var(--r-md);background:transparent;color:var(--ink-2);font-weight:500;width:100%}
.add:hover{border-color:var(--ink-2);background:var(--surface)}
.ta{display:block;width:100%;min-height:120px;border:1px solid var(--line-strong);border-radius:var(--r-md);background:var(--surface);padding:var(--sp-3) var(--sp-4);resize:vertical;line-height:1.6;outline:none}
.ta::placeholder,.exp input::placeholder{color:var(--faint)}
.ta:focus,.exp input:focus{border-color:var(--gold);box-shadow:var(--shadow-focus)}
.err{font-size:var(--fs-xs);color:var(--danger)}
.item.bad .picker{border-color:var(--danger)}

.photos{display:flex;gap:var(--sp-2);flex-wrap:wrap}
.shot{position:relative;width:var(--thumb);height:var(--thumb);border-radius:var(--r-sm);overflow:hidden;background:var(--sunken);box-shadow:var(--shadow-1);flex:0 0 auto}
.shot img{width:100%;height:100%;object-fit:cover;display:block}
.shot .x{position:absolute;top:4px;right:4px;width:22px;height:22px;border:0;border-radius:50%;background:rgba(13,27,62,.82);color:#fff;display:grid;place-items:center;padding:0}
.shot .x .ico{width:12px;height:12px;stroke-width:2.6}
.shot.up::after{content:"";position:absolute;left:0;bottom:0;height:3px;background:var(--gold);animation:up 1.1s var(--ease) infinite}
@keyframes up{from{width:0}to{width:100%}}
.shot-add{width:var(--thumb);height:var(--thumb);border:1.5px dashed var(--line-strong);border-radius:var(--r-sm);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);font-size:var(--fs-2xs);cursor:pointer;background:var(--surface)}
.shot-add:hover{border-color:var(--ink-2);color:var(--ink)}
.shot-add .ico{width:22px;height:22px}
.hint{font-size:var(--fs-xs);color:var(--faint);margin-top:var(--sp-2)}

.submit{position:fixed;left:0;right:0;bottom:0;z-index:var(--z-sticky-sub);background:var(--surface);box-shadow:0 -1px 0 var(--line),0 -12px 30px -18px rgba(0,0,0,.22);padding:var(--sp-3) var(--pad-page) calc(var(--sp-3) + env(safe-area-inset-bottom))}
.submit-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:var(--sp-3)}
.sum{font-size:var(--fs-xs);color:var(--muted);line-height:1.35}
.sum b{color:var(--ink);font-size:var(--fs-sm)}
.btn{height:var(--ctl-h);border:0;border-radius:var(--r-md);padding:0 var(--sp-5);font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-2);transition:background .2s,transform .2s var(--ease)}
.btn:active{transform:scale(.98)}
.btn-pri{background:var(--pri-bg);color:var(--pri-fg)}
.btn-pri:hover{background:var(--pri-hover)}
.btn-pri[disabled]{opacity:.7;cursor:progress}
.btn-gold{background:var(--gold);color:#0d1b3e}
.btn-gold:hover{background:var(--gold-hi)}
.btn-ghost{background:var(--sunken);color:var(--ink)}
.btn-line{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line-strong)}
.btn-line:hover{box-shadow:inset 0 0 0 1px var(--ink-2)}
.btn-sm{height:38px;padding:0 var(--sp-4);font-size:var(--fs-sm);border-radius:var(--r-sm)}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (min-width:960px){
  .cust-form .submit{position:static;box-shadow:none;background:transparent;padding:0;margin-top:var(--sp-6);border-top:1px solid var(--line);padding-top:var(--sp-5)}
  .cust-form .submit-in{max-width:none}
}

.banner{display:flex;gap:var(--sp-3);align-items:flex-start;background:var(--danger-bg);color:var(--danger);border-radius:var(--r-md);padding:var(--sp-3) var(--sp-4);font-size:var(--fs-sm);margin-top:var(--sp-5)}
.banner b{display:block}
.banner .ico{margin-top:2px}

.done{display:flex;flex-direction:column;align-items:center;text-align:center;padding:var(--sp-7) var(--sp-4);gap:var(--sp-3)}
.stamp{width:140px;height:140px;border-radius:50%;border:2px solid var(--gold);display:grid;place-items:center;color:var(--gold-ink);position:relative;animation:stamp .8s var(--ease) both;margin-bottom:var(--sp-3)}
.stamp::before{content:"";position:absolute;inset:8px;border-radius:50%;border:1px dashed var(--gold)}
.stamp div{font-family:var(--font-display);font-weight:700;font-size:var(--fs-lg);line-height:1.15}
.stamp small{display:block;font-size:var(--fs-2xs);font-weight:500;letter-spacing:.08em}
@keyframes stamp{from{transform:scale(1.6) rotate(-16deg);opacity:0;filter:blur(8px)}to{transform:rotate(-6deg);opacity:1;filter:none}}
.done p{color:var(--muted);margin:0;max-width:36ch;font-size:var(--fs-sm)}

.panel-hd{display:flex;align-items:center;gap:var(--sp-2);margin-bottom:var(--sp-3)}
.list{display:flex;flex-direction:column;gap:var(--gap-list)}
.tk{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:var(--sp-4);display:flex;flex-direction:column;gap:var(--sp-2);box-shadow:var(--shadow-1);text-align:left;width:100%;transition:border-color .2s,box-shadow .2s;min-width:0}
button.tk:hover{border-color:var(--line-strong)}
.tk.sel{border-color:var(--gold);box-shadow:var(--shadow-1),0 0 0 3px var(--gold-wash)}
.tk-top{display:flex;align-items:center;gap:var(--sp-2);min-width:0}
.tk-ty{flex:0 0 auto;display:inline-flex;align-items:center;gap:5px;font-size:var(--fs-xs);font-weight:600}
.tk-ty .ico{width:15px;height:15px}
.t-short{color:var(--ty-short)} .t-exp{color:var(--ty-exp)} .t-other{color:var(--ty-other)}
.tk-no{flex:0 0 auto;font-family:var(--font-data);font-size:var(--fs-2xs);color:var(--faint)}
.pill{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:var(--r-pill);font-size:var(--fs-2xs);font-weight:600;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-new{background:var(--st-new-bg);color:var(--st-new)} .s-work{background:var(--st-work-bg);color:var(--st-work)}
.s-wait{background:var(--st-wait-bg);color:var(--st-wait)} .s-done{background:var(--st-done-bg);color:var(--st-done)}
.tk-title{font-weight:600}
.tk-meta{font-size:var(--fs-xs);color:var(--muted)}
.tk-thumbs{display:flex;gap:4px;flex:0 0 auto}
.tk-thumbs .shot{width:32px;height:32px;border-radius:var(--r-xs);box-shadow:none}
.reply{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:var(--sp-3);font-size:var(--fs-sm);display:flex;flex-direction:column;gap:var(--sp-2);margin-top:var(--sp-1)}
.reply .who{font-size:var(--fs-xs);color:var(--muted)}
.reply-act{display:flex;gap:var(--sp-2)}
.reply-act .btn{flex:1;padding:0 var(--sp-2)}
.reopen{display:flex;gap:var(--sp-2)}
.reopen input{flex:1;min-width:0;height:38px;border:1px solid var(--line-strong);border-radius:var(--r-sm);background:var(--surface);padding:0 var(--sp-3);outline:none}
.reopen input:focus{border-color:var(--gold);box-shadow:var(--shadow-focus)}

.adm{display:block}
.side{display:none}
.adm-list{padding:0 0 120px}
.adm-detail{display:none}
@media (min-width:960px){
  .adm{display:grid;grid-template-columns:var(--side-w) var(--list-w) minmax(0,1fr);height:calc(100dvh - var(--hdr-h) - 38px)}
  .adm .tabs{display:none}
  .side{display:flex;flex-direction:column;gap:2px;padding:var(--sp-5) var(--sp-3);border-right:1px solid var(--line);background:var(--paper-2)}
  .adm-list{overflow:auto;border-right:1px solid var(--line);padding:0 0 var(--sp-5)}
  .adm-detail{display:block;overflow:auto;padding:var(--sp-6) clamp(24px,4vw,56px) var(--sp-7);background:var(--surface-2)}
  .adm-detail>.dwrap{max-width:760px}
  .adm-list .sbar{top:0}
}
.nav button{display:flex;align-items:center;gap:var(--sp-3);width:100%;height:42px;border:0;background:transparent;border-radius:var(--r-sm);padding:0 var(--sp-3);color:var(--ink-2);font-weight:500;text-align:left}
.nav button:hover{background:var(--surface)}
.nav button.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:var(--shadow-1)}
.nav button .cnt{margin-left:auto}
.side-ft{margin-top:auto;font-size:var(--fs-2xs);color:var(--faint);padding:0 var(--sp-3);line-height:1.6}

.sbar{position:sticky;top:calc(var(--hdr-h) + var(--tabs-h) + env(safe-area-inset-top));z-index:var(--z-sticky-sub);background:var(--paper);padding:var(--sp-3) var(--pad-page);box-shadow:0 1px 0 var(--line)}
@media (min-width:960px){.sbar{padding:var(--sp-5) var(--sp-5) var(--sp-3)}}
.search{display:flex;align-items:center;gap:var(--sp-2);height:44px;padding:0 6px 0 var(--sp-3);border-radius:var(--r-pill);background:var(--surface);border:1px solid var(--line-strong);color:var(--faint)}
.search:focus-within{border-color:var(--gold);box-shadow:var(--shadow-focus)}
.search input{flex:1;min-width:0;border:0;background:transparent;outline:none;color:var(--ink)}
.search input::placeholder{color:var(--faint)}
.clr{flex:0 0 auto;width:32px;height:32px;border:0;border-radius:50%;background:var(--sunken);color:var(--muted);display:grid;place-items:center}
.clr .ico{width:14px;height:14px;stroke-width:2.4}
.chips{display:flex;gap:6px;margin-top:var(--sp-3);overflow-x:auto;scrollbar-width:none}
.chip{flex:0 0 auto;height:32px;padding:0 12px;border-radius:var(--r-pill);border:1px solid var(--line-strong);background:var(--surface);font-size:var(--fs-xs);font-weight:500;color:var(--ink-2);white-space:nowrap}
.chip.on{background:var(--sel-bg);border-color:var(--sel-bg);color:var(--sel-fg)}
.adm-list .list{padding:var(--sp-3) var(--pad-page)}
@media (min-width:960px){.adm-list .list{padding:var(--sp-3) var(--sp-5)}}
.empty{text-align:center;color:var(--muted);padding:var(--sp-7) var(--sp-4);font-size:var(--fs-sm)}

.dt-hd{display:flex;align-items:center;gap:var(--sp-3)}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;margin-top:var(--sp-5)}
@media (min-width:1280px){.facts{grid-template-columns:repeat(4,minmax(0,1fr))}}
.facts div{background:var(--surface);padding:var(--sp-3) var(--sp-4);min-width:0}
.facts small{display:block;font-size:var(--fs-2xs);color:var(--faint)}
.facts span{font-size:var(--fs-sm);font-weight:500}
.lines{margin-top:var(--sp-4);border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);overflow:hidden}
.ln{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--sp-3);padding:var(--sp-3) var(--sp-4);border-top:1px solid var(--line);align-items:center}
.ln:first-child{border-top:0}
.ln .q{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.ln .q small{display:block;font-weight:400;font-size:var(--fs-2xs);color:var(--faint)}
.free{margin-top:var(--sp-4);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:var(--sp-4);line-height:1.7}
.gal{display:flex;gap:var(--sp-2);margin-top:var(--sp-4);flex-wrap:wrap}
.gal .shot{width:96px;height:96px}
.tl{list-style:none;margin:var(--sp-4) 0 0;padding:0;position:relative}
.tl::before{content:"";position:absolute;left:6px;top:10px;bottom:14px;width:1.5px;background:var(--line-strong)}
.tl li{position:relative;padding:0 0 var(--sp-4) 28px;font-size:var(--fs-sm)}
.tl li::before{content:"";position:absolute;left:0;top:6px;width:14px;height:14px;border-radius:50%;background:var(--surface-2);border:2px solid var(--line-strong);box-sizing:border-box}
.tl li.hot::before{border-color:var(--gold);background:var(--gold)}
.tl small{display:block;color:var(--faint);font-size:var(--fs-xs)}
.act-box{margin-top:var(--sp-5);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:var(--pad-card);box-shadow:var(--shadow-1)}
.act-row{display:flex;gap:var(--sp-2);flex-wrap:wrap;margin-top:var(--sp-4)}
.act-row .btn{flex:1 1 140px}
.closed-by{margin-top:var(--sp-5);background:var(--st-done-bg);color:var(--st-done);border-radius:var(--r-md);padding:var(--sp-4);font-size:var(--fs-sm)}
.closed-by b{display:block}

.sheet{position:fixed;inset:0;z-index:var(--z-modal);background:var(--paper);overflow:auto;animation:slide .35s var(--ease)}
@keyframes slide{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.sheet-hd{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:var(--sp-2);height:calc(56px + env(safe-area-inset-top));padding:env(safe-area-inset-top) var(--pad-page) 0;background:var(--surface);box-shadow:0 1px 0 var(--line)}
.back{border:0;background:transparent;display:flex;align-items:center;gap:4px;color:var(--ink);font-weight:600;padding:0;height:40px}
.sheet-bd{padding:var(--sp-5) var(--pad-page) var(--sp-7)}

.pop{position:fixed;z-index:var(--z-dropdown);background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-md);box-shadow:var(--shadow-2);display:flex;flex-direction:column;overflow:hidden;animation:pop .22s var(--ease)}
@keyframes pop{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.pop-s{padding:var(--sp-2);border-bottom:1px solid var(--line)}
.pop-s .search{height:40px;border-radius:var(--r-sm)}
.pop-n{font-size:var(--fs-2xs);color:var(--faint);padding:6px var(--sp-3) 2px}
.pop-l{overflow:auto;max-height:320px;padding-bottom:4px}
.grp{position:sticky;top:0;background:var(--surface-2);font-size:var(--fs-2xs);font-weight:600;color:var(--gold-ink);padding:5px var(--sp-3);box-shadow:0 1px 0 var(--line)}
.opt{display:block;width:100%;border:0;background:transparent;text-align:left;padding:9px var(--sp-3)}
.opt.act,.opt:hover{background:var(--gold-wash)}
.opt b{font-weight:600;font-size:var(--fs-sm)}

.login{min-height:calc(100dvh - 38px);display:grid;grid-template-columns:1fr}
.login-art{display:none}
.login-main{display:flex;flex-direction:column;justify-content:center;gap:var(--sp-5);padding:var(--sp-7) var(--pad-page);max-width:440px;width:100%;margin:0 auto}
@media (min-width:960px){
  .login{grid-template-columns:1.1fr 1fr}
  .login-art{display:flex;flex-direction:column;justify-content:space-between;background:var(--navy);color:var(--on-navy);padding:var(--sp-7);position:relative;overflow:hidden}
  .login-art::after{content:"";position:absolute;right:-140px;bottom:-140px;width:460px;height:460px;border-radius:50%;border:1px solid rgba(201,168,76,.35);box-shadow:0 0 0 70px rgba(201,168,76,.05),0 0 0 140px rgba(201,168,76,.03);pointer-events:none}
}
.login-art h2{font-family:var(--font-display);font-weight:600;font-size:clamp(32px,3.2vw,44px);line-height:1.2;letter-spacing:-.02em;margin:0;max-width:13ch;text-wrap:balance}
.login-art h2 em{font-style:normal;color:var(--gold-hi)}
.login-art p{color:var(--on-navy-2);max-width:40ch}
.gbtn{display:flex;align-items:center;justify-content:center;gap:var(--sp-3);height:52px;border-radius:var(--r-md);border:1px solid var(--line-strong);background:var(--surface);font-weight:600;box-shadow:var(--shadow-1)}
.gbtn:hover{border-color:var(--ink-2)}
.who-list{display:flex;flex-direction:column;gap:var(--sp-4);font-size:var(--fs-sm);color:var(--muted);border-top:1px solid var(--line);padding-top:var(--sp-5)}
.who-list div{display:grid;grid-template-columns:30px 1fr;gap:var(--sp-3);align-items:start}
.who-list .wi{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--sunken);color:var(--ink-2)}
.who-list .wi .ico{width:16px;height:16px}
.who-list b{color:var(--ink);font-weight:600}

.doc{max-width:980px;margin:0 auto;padding:var(--sp-6) var(--pad-page) var(--sp-7)}
.flow{list-style:none;padding:0;margin:var(--sp-6) 0 0;display:grid;gap:var(--sp-3)}
.step{display:grid;grid-template-columns:40px minmax(0,1fr);gap:var(--sp-4);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:var(--sp-4);box-shadow:var(--shadow-1)}
.step .n{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-family:var(--font-display);font-weight:700;background:var(--navy);color:var(--gold-hi)}
.step h3{margin:0;font-family:var(--font-display);font-weight:600;font-size:var(--fs-md)}
.step p{margin:var(--sp-1) 0 0;color:var(--muted);font-size:var(--fs-sm)}
.fix{margin-top:var(--sp-3);font-size:var(--fs-xs);color:var(--st-done);background:var(--st-done-bg);border-radius:var(--r-xs);padding:7px var(--sp-3)}
.fix b{font-weight:600}
.states{display:flex;flex-wrap:wrap;gap:var(--sp-2);align-items:center;margin-top:var(--sp-4);font-size:var(--fs-xs);color:var(--muted)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);margin-top:var(--sp-3)}
table{border-collapse:collapse;font-size:var(--fs-xs);white-space:nowrap;font-variant-numeric:tabular-nums}
th,td{padding:8px 12px;border-bottom:1px solid var(--line);text-align:left}
th{background:var(--surface-2);color:var(--muted);font-weight:600}
tr:last-child td{border-bottom:0}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);z-index:var(--z-toast);background:var(--navy);color:#fff;padding:11px 18px;border-radius:var(--r-pill);font-size:var(--fs-sm);box-shadow:var(--shadow-2);white-space:nowrap;animation:pop .3s var(--ease)}
:root[data-theme="dark"] .toast{background:#e3c66f;color:#0d1b3e}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ── เพิ่มจาก mockup ── */
:root{--ty-bill:#a33d0b;--ty-over:#6d28d9;--ty-swap:#0d6b62}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ty-bill:#ffb08a;--ty-over:#c4b0ff;--ty-swap:#72d6c7}}
:root[data-theme="dark"]{--ty-bill:#ffb08a;--ty-over:#c4b0ff;--ty-swap:#72d6c7}
.t-bill{color:var(--ty-bill)} .t-over{color:var(--ty-over)} .t-swap{color:var(--ty-swap)}
.field-in{display:block;width:100%;height:var(--ctl-h);border:1px solid var(--line-strong);border-radius:var(--r-md);background:var(--surface);padding:0 var(--sp-4);font-family:var(--font-data);letter-spacing:.02em;outline:none}
.field-in::placeholder{color:var(--faint);font-family:var(--font)}
.field-in:focus{border-color:var(--gold);box-shadow:var(--shadow-focus)}
.swap-pair{display:flex;flex-direction:column;gap:var(--sp-2)}
.pick-lbl{flex:0 0 44px;font-size:var(--fs-2xs);font-weight:600;color:var(--muted);text-align:right}
.rm-sp{flex:0 0 34px}
.cust>*,.adm>*,.item,.swap-pair{min-width:0}
.age{font-weight:600;color:var(--ink-2)}
.age.old{color:var(--danger)}
.shot-btn{border:0;padding:0;cursor:zoom-in;display:block}
.shot-btn img{transition:transform .3s var(--ease)}
.shot-btn:hover img{transform:scale(1.04)}
.lb{position:fixed;inset:0;z-index:2100;background:rgba(4,8,20,.97);display:flex;flex-direction:column;animation:pop .2s var(--ease);touch-action:pan-y}
.lb-top{display:flex;align-items:center;gap:var(--sp-3);padding:calc(var(--sp-3) + env(safe-area-inset-top)) var(--pad-page) var(--sp-3);color:#fff}
.lb-n{flex:1 1 auto;min-width:0;font-size:var(--fs-sm);color:#c9d1e4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-open{flex:0 0 auto;color:#e3c66f;font-size:var(--fs-sm);text-decoration:none;white-space:nowrap}
.lb-x{flex:0 0 auto;width:44px;height:44px;border:0;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;display:grid;place-items:center}
.lb-x .ico{width:20px;height:20px;stroke-width:2.2}
.lb-stage{flex:1 1 auto;min-height:0;display:grid;place-items:center;padding:0 var(--pad-page) calc(var(--sp-5) + env(safe-area-inset-bottom));position:relative}
.lb-stage img{max-width:100%;max-height:100%;object-fit:contain;border-radius:var(--r-sm);box-shadow:0 20px 60px rgba(0,0,0,.5);user-select:none;-webkit-user-drag:none}
.lb-spin{position:absolute;width:32px;height:32px;border-width:3px;color:#e3c66f;display:none}
.lb.loading .lb-spin{display:block}
.lb.loading .lb-stage img{opacity:0}
.lb-err{display:none;color:#c9d1e4;font-size:var(--fs-sm);text-align:center}
.lb.err .lb-err{display:block}
.lb.err .lb-stage img{display:none}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border:0;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;display:grid;place-items:center}
.lb-nav .ico{width:22px;height:22px;stroke-width:2.2}
.lb-prev{left:var(--sp-3)}
.lb-next{right:var(--sp-3)}
.lb-next .ico{transform:scaleX(-1)}
.lb.single .lb-nav{display:none}
@media (hover:none){.lb-nav{top:auto;bottom:calc(var(--sp-5) + env(safe-area-inset-bottom));transform:none}}
.boot{min-height:100dvh;display:grid;place-items:center;color:var(--muted);font-size:var(--fs-sm)}
.boot .spin{width:28px;height:28px;border-width:3px;color:var(--gold);margin:0 auto var(--sp-3)}
.login{min-height:100dvh}
.adm{height:auto}
@media (min-width:960px){.adm{height:calc(100dvh - var(--hdr-h))}}
.gsi{min-height:52px;display:flex;justify-content:center}
.login-err{background:var(--danger-bg);color:var(--danger);border-radius:var(--r-md);padding:var(--sp-3) var(--sp-4);font-size:var(--fs-sm);word-break:break-word}
.login-err b{display:block}
.who-btn{flex:0 0 auto;border:0;background:transparent;color:inherit;display:flex;align-items:center;gap:var(--sp-2);padding:0;min-width:0;max-width:300px}
.menu{position:fixed;z-index:var(--z-dropdown);background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-md);box-shadow:var(--shadow-2);min-width:220px;max-width:calc(100vw - 16px);padding:6px;animation:pop .2s var(--ease)}
.menu .mh{padding:8px 10px;font-size:var(--fs-xs);color:var(--muted);border-bottom:1px solid var(--line);margin-bottom:4px}
.menu .mh b{display:block;color:var(--ink);font-size:var(--fs-sm)}
.menu button,.menu a{display:flex;align-items:center;gap:var(--sp-2);width:100%;height:40px;border:0;background:transparent;border-radius:var(--r-sm);padding:0 10px;text-align:left;color:var(--ink);text-decoration:none;font-size:var(--fs-sm)}
.menu button:hover,.menu a:hover{background:var(--sunken)}
.state{padding:var(--sp-6) var(--sp-4);text-align:center;color:var(--muted);font-size:var(--fs-sm)}
.state .btn{margin-top:var(--sp-3)}
.shot a{display:block;width:100%;height:100%}
.more{font-size:var(--fs-2xs);color:var(--faint);padding:8px var(--sp-3) 10px;text-align:center}
.uform{display:grid;grid-template-columns:1fr;gap:var(--sp-2);margin-top:var(--sp-3)}
@media (min-width:640px){.uform{grid-template-columns:1.4fr 1.2fr .8fr auto}}
.uform input{height:44px;border:1px solid var(--line-strong);border-radius:var(--r-sm);background:var(--surface);padding:0 var(--sp-3);min-width:0;outline:none}
.uform input:focus{border-color:var(--gold);box-shadow:var(--shadow-focus)}
.urow{display:flex;align-items:center;gap:var(--sp-3);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:var(--sp-3) var(--sp-4);box-shadow:var(--shadow-1)}
.urow.off{opacity:.6}
.urow .avatar{background:var(--sunken);color:var(--ink-2)}
.toggle{flex:0 0 auto;width:46px;height:28px;border-radius:14px;border:0;background:var(--line-strong);position:relative;transition:background .2s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .25s var(--ease)}
.toggle.on{background:var(--st-done)}
.toggle.on::after{transform:translateX(18px)}
.users-pg{padding:var(--sp-5) var(--pad-page) 120px;max-width:860px}
@media (min-width:960px){.users-pg{grid-column:2 / 4;overflow:auto;padding:var(--sp-6) var(--sp-6) var(--sp-7)}}
.refresh{border:0;background:transparent;color:var(--faint);display:inline-flex;align-items:center;gap:4px;font-size:var(--fs-2xs);padding:4px 0}
.refresh:hover{color:var(--ink)}
</style>

<script>
const VER = 'v1.3';
const API = 'https://script.google.com/macros/s/AKfycbwKPKAIN-VAHb-1heXOnWdSO19RoqpTguwSLI3N40zVPVo_6sYh4cwYs-R1iNHwOrXe/exec';
const CLIENT_ID = '615875645128-gasjjvkt6lu8g449cbnhl40k1pu25r0b.apps.googleusercontent.com';
const SHEET_URL = 'https://docs.google.com/spreadsheets/d/1BYd5noO3n95hV01ftp-nhV3bwCwcLnvo4dMpmXWHGCc/edit';

const LS = { token: 'smrDesk.token', user: 'smrDesk.user', prod: 'smrDesk.products.v1', draft: 'smrDesk.draft.v1', theme: 'smrDesk.theme' };
const MAX_PHOTOS = 5, PHOTO_MAX_SIDE = 1600, LIST_LIMIT = 120;

/* key: [ชื่อเต็ม (ตรงกับหลังบ้าน), icon, สี, คำอธิบายใต้ปุ่ม, ชื่อสั้นบนปุ่ม, หัวข้อรายการสินค้า] */
const TYPE = {

  exp: ['ใกล้หมดอายุ', 'clock', 't-exp', 'เลือกสินค้า', 'ใกล้หมดอายุ', 'สินค้าที่ใกล้หมดอายุ'],
  nogoods: ['ไม่ได้ของตามบิล', 'receipt', 't-bill', 'มีบิล ไม่มีของ', 'ไม่ได้ของ', 'สินค้าในบิลที่ไม่ได้รับ'],
  over: ['ส่งเกิน', 'stack', 't-over', 'ได้มากกว่าบิล', 'ส่งเกิน', 'สินค้าที่ได้เกินมา'],
  swap: ['สินค้าสลับตัว', 'swap', 't-swap', 'ได้ผิดตัว', 'สลับตัว', 'สินค้าที่สลับตัว'],
  other: ['อื่นๆ', 'chat', 't-other', 'พิมพ์เอง', 'อื่นๆ', '']
};
const TYPE_BY_TH = Object.fromEntries(Object.entries(TYPE).map(([k, v]) => [v[0], k]));
const BILL = ['nogoods', 'over', 'swap'];

const OPEN = s => s === 'รอรับเรื่อง' || s === 'กำลังดำเนินการ';

const I = (id, c = '') => `<svg class="ico ${c}" aria-hidden="true"><use href="#i-${id}"/></svg>`;
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = id => document.getElementById(id);
const isDesk = () => matchMedia('(min-width:960px)').matches;
const keep = fn => { const y = scrollY; fn(); scrollTo(0, y); };
const hm = t => String(t || '').slice(0, 16);
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } };
const lsDel = k => { try { localStorage.removeItem(k); } catch (e) {} };
const rid = () => (crypto.randomUUID ? crypto.randomUUID() : (Date.now().toString(36) + Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2))).replace(/-/g, '');
const driveId = url => (/\/d\/([\w-]{20,})/.exec(url || '') || [])[1] || '';
const thumb = (url, w = 200) => { const id = driveId(url); return id ? `https://drive.google.com/thumbnail?id=${id}&sz=w${w}` : ''; };

const newItem = () => ({ p: null, p2: null, q: 1, u: 'ชิ้น', x: '' });
const newForm = () => ({ type: 'short', bill: '', items: [newItem()], text: '', photos: [], rid: rid() });
const S = {
  user: null, token: lsGet(LS.token), tickets: [], loaded: false, loadErr: '',
  products: null, prodState: 'idle',
  view: 'tickets', ctab: 'new', form: newForm(), tried: false, sending: false, sendErr: '', sent: null,
  q: '', chip: 'open', sel: null, closing: false, reopenFor: null, busy: '', users: null
};

/* ───────────── API ───────────── */
async function api(action, body = {}, timeoutMs = 60000) {
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), timeoutMs);
  try {
    const res = await fetch(API, { method: 'POST', body: JSON.stringify(Object.assign({ action, token: S.token }, body)), signal: ctl.signal });
    const txt = await res.text();
    let j; try { j = JSON.parse(txt); } catch (e) { throw new Error('หลังบ้านตอบกลับผิดรูปแบบ (HTTP ' + res.status + ')'); }
    if (j.auth === false) { signOut(true); throw new Error(j.error || 'หมดเวลาเข้าสู่ระบบ'); }
    if (!j.ok) throw new Error(j.error || 'ทำรายการไม่สำเร็จ');
    return j;
  } catch (e) {
    if (e.name === 'AbortError') throw new Error('เน็ตช้าหรือหลุด ลองอีกครั้ง');
    if (e instanceof TypeError) throw new Error('ต่อหลังบ้านไม่ได้ เช็คอินเทอร์เน็ตแล้วลองใหม่');
    throw e;
  } finally { clearTimeout(t); }
}

/* ───────────── theme ───────────── */
(function () { const t = lsGet(LS.theme); if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t; })();
function toggleTheme() {
  const d = document.documentElement, dark = d.dataset.theme ? d.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme:dark)').matches;
  d.dataset.theme = dark ? 'light' : 'dark'; lsSet(LS.theme, d.dataset.theme);
}

/* ───────────── login ───────────── */
function vLogin(errHtml) {
  $('root').innerHTML = `<div class="login">
    <div class="login-art"><div class="row"><div class="mark">SMR</div><b style="font-family:var(--font-display)">Service Desk</b></div>
      <div><h2>ของขาด ของใกล้หมดอายุ <em>แจ้งที่เดียว</em> รัตนไพบูลย์ตามให้จนจบ</h2><p>ทุกเรื่องมีเลขเรื่อง มีคนรับผิดชอบ มีเวลาปิดงาน และเห็นสถานะได้ตลอด</p></div>
      <small style="color:var(--on-navy-2)">${VER}</small></div>
    <div class="login-main">
      <div><div class="row" style="margin-bottom:var(--sp-4)"><div class="mark">SMR</div><span class="lede" style="margin:0">Service Desk · ${VER}</span></div>
        <h1 class="h1">เข้าสู่ระบบ</h1><p class="lede">ใช้บัญชี Google ของคุณ</p></div>
      <div class="gsi" id="gsiBtn"></div>
      <div id="loginMsg">${errHtml || ''}</div>
      <div class="who-list">
        <div><span class="wi">${I('mail')}</span><span><b>พนักงาน SMR</b> — ทีมรัตนไพบูลย์ต้องเพิ่มอีเมลของคุณก่อน จึงเข้าหน้าแจ้งเรื่องได้</span></div>
        <div><span class="wi">${I('shield')}</span><span><b>ทีมรัตนไพบูลย์</b> — ใช้อีเมลบริษัท เข้าหน้ารับเรื่องและปิดงาน</span></div>
      </div>
    </div></div>`;
  renderGsi();
}
let gsiReady = false;
function renderGsi() {
  const el = $('gsiBtn'); if (!el) return;
  if (!(window.google && google.accounts && google.accounts.id)) { setTimeout(renderGsi, 200); return; }
  if (!gsiReady) { google.accounts.id.initialize({ client_id: CLIENT_ID, callback: onCredential, auto_select: false, ux_mode: 'popup' }); gsiReady = true; }
  google.accounts.id.renderButton(el, { theme: 'outline', size: 'large', shape: 'pill', text: 'signin_with', width: Math.min(360, el.clientWidth || 320), locale: 'th' });
}
async function onCredential(resp) {
  const msg = $('loginMsg');
  if (msg) msg.innerHTML = `<div class="state" style="padding:var(--sp-3)"><span class="spin" style="display:inline-block;vertical-align:middle;margin-right:8px"></span>กำลังตรวจสอบสิทธิ์…</div>`;
  try {
    const j = await fetch(API, { method: 'POST', body: JSON.stringify({ action: 'login', credential: resp.credential }) }).then(r => r.json());
    if (!j.ok) {
      const h = j.denied
        ? `<div class="login-err"><b>อีเมลนี้ยังไม่มีสิทธิ์ใช้งาน</b>${esc(j.email)} · ส่งอีเมลนี้ให้ทีมรัตนไพบูลย์เพิ่มสิทธิ์ แล้วเข้าสู่ระบบใหม่</div>`
        : `<div class="login-err"><b>เข้าสู่ระบบไม่สำเร็จ</b>${esc(j.error || '')}</div>`;
      if (msg) msg.innerHTML = h; return;
    }
    S.token = j.token; S.user = j.user;
    lsSet(LS.token, j.token); lsSet(LS.user, JSON.stringify(j.user));
    startApp();
  } catch (e) {
    if (msg) msg.innerHTML = `<div class="login-err"><b>ต่อหลังบ้านไม่ได้</b>เช็คอินเทอร์เน็ตแล้วลองใหม่</div>`;
  }
}
function signOut(expired) {
  lsDel(LS.token); lsDel(LS.user);
  S.token = null; S.user = null; S.tickets = []; S.loaded = false; S.users = null;
  try { google.accounts.id.disableAutoSelect(); } catch (e) {}
  closePops(); document.querySelector('.sheet')?.remove(); document.body.style.overflow = '';
  vLogin(expired ? `<div class="login-err"><b>หมดเวลาเข้าสู่ระบบ</b>กรุณาเข้าสู่ระบบอีกครั้ง</div>` : '');
}

/* ───────────── boot / load ───────────── */
async function startApp() {
  try { S.user = S.user || JSON.parse(lsGet(LS.user) || 'null'); } catch (e) { S.user = null; }
  if (!S.token) return vLogin();
  if (S.user) render();
  else $('root').innerHTML = `<div class="boot"><div><div class="spin"></div>กำลังโหลด…</div></div>`;
  await load();
  if (S.user && S.user.kind === 'smr') loadProducts();
  restoreDraft();
}
async function load(quiet) {
  try {
    const j = await api('boot');
    S.user = j.user; lsSet(LS.user, JSON.stringify(j.user));
    S.tickets = j.tickets || []; S.loaded = true; S.loadErr = '';
    if (S.user.kind === 'rattana' && !S.sel && S.tickets.length) S.sel = sortAdmin(S.tickets)[0].no;
  } catch (e) {
    if (!S.token) return;
    S.loadErr = String(e.message || e);
    if (!S.user) { $('root').innerHTML = `<div class="boot"><div class="state">${esc(S.loadErr)}<br><button class="btn btn-pri btn-sm" onclick="startApp()">ลองใหม่</button></div></div>`; return; }
  }
  if (!S.user) return;
  if (quiet) refreshViews(); else keep(render);
}
async function loadProducts(force) {
  if (S.prodState === 'loading') return;
  const today = new Date().toISOString().slice(0, 10);
  if (!force) {
    try { const c = JSON.parse(lsGet(LS.prod) || 'null'); if (c && c.d === today && Array.isArray(c.p) && c.p.length) { S.products = c.p; S.prodState = 'ready'; return; } } catch (e) {}
  }
  S.prodState = 'loading';
  try {
    const j = await api('products', {}, 90000);
    S.products = j.products || []; S.prodState = 'ready';
    lsSet(LS.prod, JSON.stringify({ d: today, p: S.products }));
  } catch (e) { S.prodState = 'error'; S.prodErr = String(e.message || e); }
  if (pop && pop.dataset.kind === 'prod') pop._draw && pop._draw();
}
setInterval(() => { if (S.user && document.visibilityState === 'visible' && !S.sending) load(true); }, 90000);
document.addEventListener('visibilitychange', () => { if (S.user && document.visibilityState === 'visible') load(true); });

/* ───────────── shared header ───────────── */
function header() {

    ${u.kind === 'rattana' ? `<a href="${SHEET_URL}" target="_blank" rel="noopener">${I('sheet')}เปิดชีตหลังบ้าน</a><a href="${FOLDER_URL}" target="_blank" rel="noopener">${I('folder')}เปิดโฟลเดอร์ Drive</a>` : ''}
    <button data-m="out">${I('out')}ออกจากระบบ</button>`;

function render() {

  const rank = s => s === 'รอลูกค้ายืนยัน' ? 0 : OPEN(s) ? 1 : 2;

  const n = t === 'other' ? (F.text.trim() ? 1 : 0) : F.items.filter(i => i.p).length;

function restoreDraft() {

function readImage(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const k = Math.min(1, PHOTO_MAX_SIDE / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', 0.8));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('เปิดรูปไม่ได้')); };
    img.src = url;
  });
}

async function send() {
  const F = S.form;
  S.tried = true;
  const ok = F.type === 'other' ? F.text.trim().length >= 3
    : F.items.every(i => i.p && (F.type !== 'exp' || i.x) && (F.type !== 'swap' || (i.p2 && i.p2[P.n] !== i.p[P.n]))) && (!BILL.includes(F.type) || F.bill.trim().length >= 3);
  if (!ok) { paintForm(); toast('ยังกรอกไม่ครบ'); return; }
  S.sending = true; S.sendErr = ''; paintForm();
  const items = F.type === 'other' ? [] : F.items.map(i => {
    const u = unitInfo(i.p).find(x => x[0] === i.u) || unitInfo(i.p)[0];
    return { name: i.p[P.n], code: String(u[2] || i.p[P.ea] || ''), ea: String(i.p[P.ea] || ''), qty: String(i.q), unit: i.u, pcs: u[1] ? String(i.q * u[1]) : '', exp: F.type === 'exp' ? String(i.x) : '',
      got: F.type === 'swap' && i.p2 ? i.p2[P.n] : '', gotEa: F.type === 'swap' && i.p2 ? String(i.p2[P.ea] || i.p2[P.cs] || '') : '' };
  });
  try {
    const j = await api('submit', { requestId: F.rid, type: F.type, bill: BILL.includes(F.type) ? F.bill.trim() : '', items, text: F.text.trim(), photos: F.photos }, 120000);
    const t = j.ticket;
    if (t) { S.tickets = [t].concat(S.tickets.filter(x => x.no !== t.no)); }
    S.sent = t ? t.no : 'ส่งแล้ว'; S.form = newForm(); S.tried = false; lsDel(LS.draft);
    S.sending = false; vCust(); scrollTo(0, 0);
  } catch (e) {
    S.sending = false; S.sendErr = String(e.message || e); paintForm();
  }
}

async function custAct(action, no, note) {
  if (S.busy) return;
  S.busy = no; refreshViews();
  try {
    const j = await api(action, { no, note });
    if (j.ticket) S.tickets = S.tickets.map(x => x.no === no ? j.ticket : x);
    S.reopenFor = null;
    toast(action === 'confirm' ? no + ' จบแล้ว ขอบคุณครับ' : 'ส่งกลับให้รัตนไพบูลย์แล้ว');
  } catch (e) { toast(String(e.message || e)); load(true); }
  S.busy = ''; refreshViews();
}

      ${S.closing ? `<p class="lede">ข้อความนี้ลูกค้าจะเห็นที่ "เรื่องของฉัน" แล้วกดยืนยันว่าเรียบร้อยไหม</p><textarea class="ta" id="cn" maxlength="1000" style="min-height:88px;margin-top:var(--sp-3)" placeholder="เช่น ส่งพร้อมรอบพรุ่งนี้เช้า"></textarea>
        <div class="act-row"><button class="btn btn-ghost" data-act="cclose">ยกเลิก</button><button class="btn btn-pri" data-act="doclose" ${S.busy ? 'disabled' : ''}>${S.busy ? '<span class="spin"></span>กำลังบันทึก' : 'ยืนยันปิดงาน'}</button></div>`
        : `<p class="lede l1">${t.status === 'กำลังดำเนินการ' ? 'รับเรื่องแล้ว · ' : ''}<b class="${ageCls(t)}">${ageText(t)}</b> · บันทึกเวลาให้อัตโนมัติ</p>
          <div class="act-row">${t.status === 'รอรับเรื่อง' ? `<button class="btn btn-line" data-act="take" ${S.busy ? 'disabled' : ''}>รับเรื่อง</button>` : ''}<button class="btn btn-gold" data-act="close">ปิดงาน</button></div>`}</div>`;
  } else {
    act = `<div class="closed-by"><b>ปิดงานโดย ${esc(t.closedBy)}</b>${esc(t.closedEmail)} · ${hm(t.closedAt)}${t.closeNote ? '<br>' + esc(t.closeNote) : ''}${t.confirm ? '<br>ลูกค้า: ' + esc(t.confirm) + (t.confirmAt ? ' · ' + hm(t.confirmAt) : '') : ''}</div>`;
  }
  return `<div class="dt-hd"><span class="tk-ty ${tc}">${I(ti)}${tn}</span>${Number(t.reopen) > 0 ? `<span class="tk-meta">เปิดซ้ำ ${esc(t.reopen)} ครั้ง</span>` : ''}<span class="grow"></span><span class="pill ${ST[t.status] || 's-new'}">${esc(t.status)}</span></div>
    <h1 class="h1" style="margin-top:var(--sp-2)">${esc(t.no)}</h1>
    <div class="facts"><div><small>ผู้แจ้ง</small><span class="l1" title="${esc(t.by)}">${esc(t.by)}</span></div><div><small>อีเมล</small><span class="l1" title="${esc(t.email)}">${esc(t.email)}</span></div><div><small>สาขา</small><span class="l1">${esc(t.branch || '-')}</span></div><div><small>วันที่แจ้ง</small><span class="l1 num">${hm(t.at)}</span></div>${t.bill ? `<div><small>เลขบิล</small><span class="l1 num" title="${esc(t.bill)}">${esc(t.bill)}</span></div>` : ''}</div>
    ${body}
    ${t.photos.length ? `<div class="gal">${t.photos.map((u, i) => `<button class="shot shot-btn" data-photo="${i}" data-pno="${esc(t.no)}" aria-label="ดูรูปที่ ${i + 1}"><img src="${thumb(u, 300)}" alt="" loading="lazy"></button>`).join('')}</div>` : ''}
    ${act}
    <div class="sec"><h2 class="h2">ประวัติ</h2><ul class="tl">${(t.log || []).map((l, i) => `<li class="${i === 0 ? 'hot' : ''}">${esc(l.action)}${l.detail && l.action !== 'แจ้งเรื่อง' ? ': ' + esc(l.detail) : l.detail ? ' · ' + esc(l.detail) : ''}<small>${esc(l.by)} · ${hm(l.at)}</small></li>`).join('')}</ul></div>`;
}
function openDetail(no) {
  S.sel = no; S.closing = false;
  if (isDesk()) {
    const d = $('detail'); d.innerHTML = `<div class="dwrap">${detailHtml(no)}</div>`; d.scrollTop = 0;
    document.querySelectorAll('#tkList .tk').forEach(b => b.classList.toggle('sel', b.dataset.open === no));
    return;
  }
  let sh = document.querySelector('.sheet');
  if (!sh) { sh = document.createElement('div'); sh.className = 'sheet'; document.body.appendChild(sh); document.body.style.overflow = 'hidden'; }
  sh.innerHTML = `<div class="sheet-hd"><button class="back" data-act="back">${I('left')}งานทั้งหมด</button></div><div class="sheet-bd" id="detail-m">${detailHtml(no)}</div>`;
}
function paintDetail() { const d = isDesk() ? document.querySelector('#detail .dwrap') : $('detail-m'); if (d) d.innerHTML = detailHtml(S.sel); }
async function adminAct(action, note) {
  if (S.busy) return;

    const j = await api(action, { no, note });

/* ผู้ใช้ SMR */

  const p = $('usersPg'); if (p) keep(() => { p.innerHTML = usersHtml(); });
}
function usersHtml() {

    <div class="act-box"><h2 class="h2">เพิ่มผู้ใช้</h2>
      <div class="uform"><input id="uEmail" type="email" placeholder="อีเมล เช่น name@smr.co.th" autocomplete="off"><input id="uName" placeholder="ชื่อ - สกุล" autocomplete="off"><input id="uBranch" placeholder="สาขา" autocomplete="off"><button class="btn btn-pri" data-act="adduser" ${S.busy ? 'disabled' : ''}>เพิ่ม</button></div></div>

      list.map(u => `<div class="urow ${u.active ? '' : 'off'}" data-tweak-card="แถวผู้ใช้"><span class="avatar">${esc((u.name || u.email).charAt(0))}</span><span class="grow"><b class="l1">${esc(u.name || u.email)}</b><span class="tk-meta l1">${esc(u.email)}${u.branch ? ' · ' + esc(u.branch) : ''}</span></span><button class="toggle ${u.active ? 'on' : ''}" data-utoggle="${esc(u.email)}" aria-label="${u.active ? 'ปิดการใช้งาน' : 'เปิดการใช้งาน'}" title="${u.active ? 'กดเพื่อปิดการใช้งาน' : 'กดเพื่อเปิดการใช้งาน'}"></button></div>`).join('')}</div></div>`;

async function saveUser(body, okMsg) {
  if (S.busy) return;
  S.busy = 'user';
  try { const j = await api('saveUser', body); S.users = j.users || []; toast(okMsg); }

/* ───────────── ดูรูป (popup เต็มจอ) ───────────── */
const LB = { el: null, list: [], i: 0, x0: null };
function openPhotos(list, i) {
  closePops();
  LB.list = list; LB.i = i;
  if (!LB.el) {
    const el = document.createElement('div'); el.className = 'lb'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-modal', 'true');
    el.innerHTML = `<div class="lb-top"><span class="lb-n" id="lbN"></span><a class="lb-open" id="lbOpen" target="_blank" rel="noopener">เปิดใน Drive</a><button class="lb-x" data-lb="x" aria-label="ปิด">${I('x')}</button></div>
      <div class="lb-stage" data-lb="bg"><div class="spin lb-spin" id="lbSpin"></div><img id="lbImg" alt=""><div class="lb-err" id="lbErr">เปิดรูปไม่ได้ · กด "เปิดใน Drive" ด้านบน</div></div>
      <button class="lb-nav lb-prev" data-lb="prev" aria-label="รูปก่อนหน้า">${I('left')}</button><button class="lb-nav lb-next" data-lb="next" aria-label="รูปถัดไป">${I('left')}</button>`;
    el.addEventListener('click', e => {
      const k = (e.target.closest('[data-lb]') || {}).dataset?.lb;
      if (k === 'x' || (k === 'bg' && e.target.dataset.lb === 'bg')) closePhotos();
      if (k === 'prev') stepPhoto(-1);
      if (k === 'next') stepPhoto(1);
    });
    el.addEventListener('touchstart', e => { LB.x0 = e.touches.length === 1 ? e.touches[0].clientX : null; }, { passive: true });
    el.addEventListener('touchend', e => {
      if (LB.x0 == null) return;
      const dx = e.changedTouches[0].clientX - LB.x0; LB.x0 = null;
      if (Math.abs(dx) > 50) stepPhoto(dx < 0 ? 1 : -1);
    });
    const img = el.querySelector('#lbImg');
    img.addEventListener('load', () => { el.classList.remove('loading'); });
    img.addEventListener('error', () => { el.classList.remove('loading'); el.classList.add('err'); });
    LB.el = el;
  }
  if (!LB.el.isConnected) { document.body.appendChild(LB.el); LB.lock = document.body.style.overflow; document.body.style.overflow = 'hidden'; }
  paintPhoto();
}
function paintPhoto() {
  const el = LB.el, u = LB.list[LB.i], n = LB.list.length;
  el.classList.add('loading'); el.classList.remove('err');
  el.querySelector('#lbImg').src = thumb(u, 1600);
  el.querySelector('#lbN').textContent = n > 1 ? `รูปที่ ${LB.i + 1} / ${n}` : 'รูป';
  el.querySelector('#lbOpen').href = u;
  el.classList.toggle('single', n < 2);
}
function stepPhoto(d) { if (LB.list.length < 2) return; LB.i = (LB.i + d + LB.list.length) % LB.list.length; paintPhoto(); }
function closePhotos() {
  if (!LB.el || !LB.el.isConnected) return;
  LB.el.remove();
  document.body.style.overflow = document.querySelector('.sheet') ? 'hidden' : (LB.lock || '');
}
addEventListener('keydown', e => {
  if (!LB.el || !LB.el.isConnected) return;
  if (e.key === 'Escape') { e.stopImmediatePropagation(); closePhotos(); }
  if (e.key === 'ArrowRight') stepPhoto(1);
  if (e.key === 'ArrowLeft') stepPhoto(-1);
}, true);

/* ───────────── dropdown สินค้า (portal ที่ body) ───────────── */
let pop = null;
function closePops() { if (pop) { pop.remove(); pop = null; } }
function openDD(btn, idx, slot) {
  closePops();
  if (S.prodState === 'idle' || S.prodState === 'error') loadProducts();
  const r = btn.getBoundingClientRect(), h = Math.min(440, innerHeight - 16);
  const el = document.createElement('div'); el.className = 'pop'; el.dataset.kind = 'prod';
  const below = innerHeight - r.bottom >= h || r.top < h;
  Object.assign(el.style, { left: Math.max(8, r.left) + 'px', width: Math.min(r.width, innerWidth - 16) + 'px', top: (below ? Math.max(8, Math.min(r.bottom + 6, innerHeight - h - 8)) : Math.max(8, r.top - h - 6)) + 'px' });
  el.innerHTML = `<div class="pop-s"><div class="search">${I('search')}<input id="ddq" placeholder="พิมพ์ชื่อ บาร์โค้ด แบรนด์" autocomplete="off"><button class="clr" data-ddx aria-label="ล้าง">${I('x')}</button></div></div><div class="pop-n" id="ddn"></div><div class="pop-l" id="ddl"></div>`;
  document.body.appendChild(el); pop = el;
  let act = 0, cur = [];
  const inp = el.querySelector('#ddq');
  el._draw = () => {
    if (S.prodState !== 'ready') {
      el.querySelector('#ddn').textContent = '';
      el.querySelector('#ddl').innerHTML = S.prodState === 'error'
        ? `<div class="empty" style="padding:24px">${esc(S.prodErr || 'โหลดรายการสินค้าไม่ได้')}<br><button class="btn btn-line btn-sm" style="margin-top:10px" data-ddretry>ลองใหม่</button></div>`
        : `<div class="empty" style="padding:24px"><span class="spin" style="display:inline-block;vertical-align:middle;margin-right:8px"></span>กำลังโหลดรายการสินค้า…</div>`;
      return;
    }
    const w = inp.value.trim().toLowerCase().split(/\s+/).filter(Boolean);
    cur = w.length ? S.products.filter(p => { const s = (p._h || (p._h = p.join(' ').toLowerCase())); return w.every(x => s.includes(x)); }) : S.products;
    const shown = cur.slice(0, LIST_LIMIT);
    el.querySelector('#ddn').textContent = 'พบ ' + cur.length.toLocaleString() + ' รายการ';
    let last = null, out = '';
    shown.forEach((p, i) => {
      if (p[P.v] !== last) { out += `<div class="grp l1">${esc(p[P.v] || 'ไม่ระบุบริษัท')}</div>`; last = p[P.v]; }
      out += `<button class="opt ${i === act ? 'act' : ''}" data-i="${i}"><b class="l1" title="${esc(p[P.n])}">${esc(p[P.n])}</b><span class="code l1">${esc(p[P.ea] || p[P.cs] || p[P.pa])} · ${esc(p[P.b])} · ${esc(p[P.s])}</span></button>`;
    });
    if (cur.length > LIST_LIMIT) out += `<div class="more">แสดง ${LIST_LIMIT} รายการแรก · พิมพ์เพิ่มเพื่อกรอง</div>`;
    el.querySelector('#ddl').innerHTML = out || '<div class="empty" style="padding:24px">ไม่พบ</div>';
    const a = el.querySelector('.opt.act'); if (a) a.scrollIntoView({ block: 'nearest' });
  };
  const pick = i => {
    const p = cur[i]; if (!p) return;
    const it = S.form.items[idx];
    if (slot === 'p2') it.p2 = Array.from(p).slice(0, 9); else { it.p = Array.from(p).slice(0, 9); it.u = 'ชิ้น'; }
    closePops(); paintForm();
  };
  el._draw(); inp.focus({ preventScroll: true });
  let tm; inp.addEventListener('input', () => { clearTimeout(tm); tm = setTimeout(() => { act = 0; el._draw(); }, 120); });
  inp.addEventListener('keydown', e => {
    const n = Math.min(cur.length, LIST_LIMIT);
    if (e.key === 'ArrowDown') { act = Math.min(act + 1, n - 1); el._draw(); e.preventDefault(); }
    if (e.key === 'ArrowUp') { act = Math.max(act - 1, 0); el._draw(); e.preventDefault(); }
    if (e.key === 'Enter') { e.preventDefault(); pick(act); }
    if (e.key === 'Escape') closePops();
  });
  el.addEventListener('click', e => {
    if (e.target.closest('[data-ddx]')) { inp.value = ''; act = 0; el._draw(); inp.focus(); return; }
    if (e.target.closest('[data-ddretry]')) { loadProducts(true); el._draw(); return; }
    const o = e.target.closest('.opt'); if (o) pick(+o.dataset.i);
  });
}
document.addEventListener('pointerdown', e => { if (pop && !pop.contains(e.target) && !e.target.closest('[data-dd],[data-act="menu"]')) closePops(); }, true);
addEventListener('scroll', e => { if (pop && !pop.contains(e.target)) closePops(); }, true);
addEventListener('keydown', e => { if (e.key === 'Escape') closePops(); });
let lastDesk = isDesk();
addEventListener('resize', () => {
  if (pop && pop.dataset.kind === 'menu') closePops();
  if (isDesk() !== lastDesk) { lastDesk = isDesk(); closePops(); document.querySelector('.sheet')?.remove(); document.body.style.overflow = ''; if (S.user) render(); }
});

function toast(m) { const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); }

/* ───────────── events ───────────── */
document.addEventListener('click', e => {
  const d = e.target.closest('button'); if (!d || d.closest('.pop') || d.closest('.menu') || d.closest('.lb')) return;
  const ds = d.dataset, F = S.form;
  if (ds.act === 'menu') { pop && pop.dataset.kind === 'menu' ? closePops() : openMenu(d); return; }
  if (ds.ctab) { S.ctab = ds.ctab; vCust(); scrollTo(0, 0); return; }
  if (ds.nav) { S.view = ds.nav; document.querySelector('.sheet')?.remove(); document.body.style.overflow = ''; vAdmin(); scrollTo(0, 0); return; }
  if (ds.t) { F.type = ds.t; S.tried = false; paintForm(); return; }
  if (ds.dd !== undefined) { openDD(d, +ds.dd, ds.slot || 'p'); return; }
  if (ds.inc !== undefined) { F.items[ds.inc].q = Math.min(999999, F.items[ds.inc].q + 1); paintForm(); return; }
  if (ds.dec !== undefined) { F.items[ds.dec].q = Math.max(1, F.items[ds.dec].q - 1); paintForm(); return; }
  if (ds.unit !== undefined) { F.items[ds.unit].u = ds.u; paintForm(); return; }
  if (ds.rm !== undefined) { F.items.splice(+ds.rm, 1); paintForm(); return; }
  if (ds.rmph !== undefined) { F.photos.splice(+ds.rmph, 1); paintForm(); return; }
  if (ds.ok) { custAct('confirm', ds.ok, ''); return; }
  if (ds.ro) { S.reopenFor = ds.ro; keep(() => { $('mineList').innerHTML = mineHtml(); }); $('ro')?.focus({ preventScroll: true }); return; }
  if (ds.roSend) { const why = ($('ro')?.value || '').trim(); if (why.length < 3) { toast('พิมพ์ว่ายังไม่เรียบร้อยเรื่องอะไร'); return; } custAct('reopen', ds.roSend, why); return; }
  if (ds.chip) { S.chip = ds.chip; paintChips(); keep(() => { $('tkList').innerHTML = listHtml(); }); return; }
  if (ds.photo !== undefined) { const t = S.tickets.find(x => x.no === ds.pno); if (t && t.photos.length) openPhotos(t.photos, +ds.photo); return; }
  if (ds.open) { openDetail(ds.open); return; }
  if (ds.utoggle) { const u = (S.users || []).find(x => x.email === ds.utoggle); if (u) saveUser({ email: u.email, active: !u.active }, (u.active ? 'ปิดการใช้งาน ' : 'เปิดการใช้งาน ') + u.email); return; }
  const a = ds.act; if (!a) return;
  if (a === 'add') { F.items.push(newItem()); paintForm(); }
  else if (a === 'send') send();
  else if (a === 'again') { S.sent = null; S.ctab = 'new'; vCust(); scrollTo(0, 0); }
  else if (a === 'mine') { S.sent = null; S.ctab = 'mine'; vCust(); scrollTo(0, 0); }
  else if (a === 'reload') load();
  else if (a === 'sheet') window.open(SHEET_URL, '_blank', 'noopener');
  else if (a === 'clr') { S.q = ''; S.chip = 'all'; const q = $('q'); if (q) q.value = ''; paintChips(); keep(() => { $('tkList').innerHTML = listHtml(); }); q && q.focus({ preventScroll: true }); }
  else if (a === 'back') { document.querySelector('.sheet')?.remove(); document.body.style.overflow = ''; S.closing = false; }
  else if (a === 'take') adminAct('take', '');
  else if (a === 'close') { S.closing = true; paintDetail(); $('cn')?.focus({ preventScroll: true }); }
  else if (a === 'cclose') { S.closing = false; paintDetail(); }
  else if (a === 'doclose') { const n = ($('cn')?.value || '').trim(); if (n.length < 3) { toast('พิมพ์หมายเหตุถึงลูกค้าก่อน'); return; } adminAct('close', n); }
  else if (a === 'adduser') {
    const email = ($('uEmail').value || '').trim(), name = ($('uName').value || '').trim(), branch = ($('uBranch').value || '').trim();
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { toast('อีเมลไม่ถูกต้อง'); return; }
    if (!name) { toast('ใส่ชื่อ - สกุล ก่อน'); return; }
    saveUser({ email, name, branch, active: true }, 'เพิ่ม ' + email + ' แล้ว');
  }
});
document.addEventListener('input', e => {
  const t = e.target, F = S.form;
  if (t.id === 'q') { S.q = t.value; $('tkList').innerHTML = listHtml(); }
  if (t.id === 'otherTxt') { F.text = t.value; saveDraft(); }
  if (t.id === 'billIn') { F.bill = t.value; saveDraft(); }
  if (t.dataset.qty !== undefined) { F.items[t.dataset.qty].q = Math.min(999999, Math.max(1, parseInt(t.value, 10) || 1)); saveDraft(); }
  if (t.dataset.exp !== undefined) { F.items[t.dataset.exp].x = t.value; saveDraft(); }
});
document.addEventListener('change', async e => {
  if (e.target.dataset.qty !== undefined) { paintForm(); return; }
  if (e.target.id !== 'phIn') return;
  const files = [...e.target.files].slice(0, MAX_PHOTOS - S.form.photos.length);
  for (const f of files) { try { S.form.photos.push(await readImage(f)); } catch (err) { toast(err.message); } }
  paintForm();
});

startApp();
</script>
<script>
(function () {

  if (W.RK.tweak) return;

  var KEY = 'rk_tweak_' + location.pathname;
  var root = document.documentElement;
  var orig = {};      // token เดิม
  var live = {};      // token ที่เปลี่ยน
  var cards = {};     // selector -> {prop:value}
  var deepSel = {};   // selector -> 1 = ให้ตัวหนังสือมีผลกับของข้างในด้วย
  var swaps = {};     // container selector -> ลำดับ order ของลูกแต่ละตัว
  var blocks = [];    // [{el,name,hidden}]
  var fontPick = '';
  var panel = null, tab = 'pick', picked = null, swapFrom = null, mode = null;
  var cardStyle = null, selEl = null, hoverTag = null;

  var FONTS = [['ตามแอป',''], ['Sarabun',"'Sarabun',sans-serif"], ['Noto Sans Thai',"'Noto Sans Thai',sans-serif"],

  /* ─────────── แถวควบคุม ─────────── */
  function tokenRow(name, val) {
    var g = group(name, val), d = el('div', 'rkt-r');
    var n = el('span', 'rkt-n', name); n.title = name; d.appendChild(n);

    if (g === 'สี') {
      var isInk = !/bg|back|surface|border|line|shadow|glow|soft|tint|fill/i.test(name);
      var cr = el('span', 'rkt-cr'), c = el('input'), t = el('input');
      c.type = 'color'; c.className = 'rkt-c'; t.type = 'text'; t.className = 'rkt-t';
      var cur = live[name] || val;
      try { c.value = hex(cur); } catch (e) {}
      t.value = cur;
      var paint = function (v) {
        if (!isInk) { cr.textContent = 'พื้น'; cr.className = 'rkt-cr'; cr.title = 'สีพื้น/ขอบ ไม่ต้องวัด contrast'; return; }
        var r = ratio(v, solidBg(document.body));
        if (r == null) { cr.textContent = '?'; cr.className = 'rkt-cr'; return; }
        cr.textContent = r.toFixed(2);
        cr.className = 'rkt-cr ' + (r >= 4.5 ? 'ok' : 'no');
        cr.title = 'ถ้าใช้เป็นตัวหนังสือบนพื้นหน้านี้ ' + r.toFixed(2) + ':1 ' + (r >= 4.5 ? 'ผ่าน' : 'ไม่ผ่าน 4.5:1');
      };
      paint(cur);
      c.oninput = function () { t.value = c.value; setToken(name, c.value); paint(c.value); };
      t.onchange = function () { setToken(name, t.value); try { c.value = hex(t.value); } catch (e) {} paint(t.value); };
      d.appendChild(cr); d.appendChild(c); d.appendChild(t);
    } else {
      var num = parseFloat(live[name] || val);
      var max = g === 'ตัวอักษร' ? 44 : (g === 'มุมโค้ง' ? 44 : 90);
      var s = el('input'); s.type = 'range'; s.className = 'rkt-s'; s.min = 0; s.max = max; s.step = 0.5; s.value = num;
      var v = el('span', 'rkt-v', num + 'px');
      s.oninput = function () { v.textContent = s.value + 'px'; setToken(name, s.value + 'px'); };
      d.appendChild(s); d.appendChild(v);
    }
    return d;
  }

  function cardRow(label, prop, kind) {
    var d = el('div', 'rkt-r'), first = cardTargets(picked)[0];
    if (!first) return d;

    var cur = (cards[picked] && cards[picked][prop]) || cs.getPropertyValue(prop);
    d.appendChild(el('span', 'rkt-n', label));

    function set(v) { (cards[picked] = cards[picked] || {})[prop] = v; applyCards(); }

    if (kind === 'color') {
      var cr = el('span', 'rkt-cr'), c = el('input'), t = el('input');
      c.type = 'color'; c.className = 'rkt-c'; t.type = 'text'; t.className = 'rkt-t';
      /* โปร่งใสต้องอ่านออกว่าโปร่งใส ไม่ใช่โชว์ #000000 ให้เข้าใจผิดว่าพื้นดำ */
      try { c.value = hex(isClear(cur) ? solidBg(first) : cur); } catch (e) {}
      t.value = isClear(cur) ? 'โปร่งใส' : hex(cur);
      t.title = 'พิมพ์ #rrggbb หรือคำว่า โปร่งใส';
      var paint = function (v) {
        if (prop !== 'color') { cr.textContent = isClear(v) ? 'ใส' : 'พื้น'; cr.className = 'rkt-cr'; return; }
        var r = ratio(v, (cards[picked] && cards[picked]['background-color']) || solidBg(first));
        if (r == null) { cr.textContent = '?'; return; }
        cr.textContent = r.toFixed(2); cr.className = 'rkt-cr ' + (r >= 4.5 ? 'ok' : 'no');
      };
      paint(isClear(cur) ? 'transparent' : t.value);
      c.oninput = function () { t.value = c.value; set(c.value); paint(c.value); };
      t.onchange = function () {
        var v = /โปร่งใส|ใส|transparent|none/i.test(t.value) ? 'transparent' : t.value;
        set(v); try { c.value = hex(v === 'transparent' ? solidBg(first) : v); } catch (e) {}
        t.value = v === 'transparent' ? 'โปร่งใส' : v; paint(v);
      };
      d.appendChild(cr); d.appendChild(c); d.appendChild(t);

      var num = parseInt(cur) || 400;

      s.oninput = function () { v.textContent = s.value + 'px'; set(s.value + 'px'); };
      d.appendChild(s); d.appendChild(v);
    }
    return d;
  }

  /* ─────────── build แต่ละแท็บ ─────────── */
  function buildTone(bd) {
    bd.appendChild(el('div', 'rkt-gt', 'ฟอนต์ทั้งหน้า'));
    var fb = el('div', 'rkt-fb');
    FONTS.forEach(function (f) {
      var b = el('button', null, f[0]);
      b.onclick = function () { fontPick = f[1]; document.body.style.fontFamily = f[1]; };
      fb.appendChild(b);
    });
    bd.appendChild(fb);

    bd.appendChild(el('div', 'rkt-gt', 'ความแน่นโดยรวม'));
    var db = el('div', 'rkt-fb');
    [['แน่น',0.8], ['ปกติ',1], ['โปร่ง',1.25]].forEach(function (p) {
      var b = el('button', null, p[0]);
      b.onclick = function () {
        Object.keys(orig).forEach(function (n) {
          if (group(n, orig[n]) === 'ระยะห่าง') setToken(n, (parseFloat(orig[n]) * p[1]).toFixed(1) + 'px');
        });
        rebuild();
      };
      db.appendChild(b);
    });
    bd.appendChild(db);

    var gs = {};
    Object.keys(orig).forEach(function (n) { var g = group(n, orig[n]); if (g) (gs[g] = gs[g] || []).push(n); });
    ['สี','ตัวอักษร','ระยะห่าง','มุมโค้ง','ขนาดอื่น'].forEach(function (g) {
      if (!gs[g]) return;
      bd.appendChild(el('div', 'rkt-gt', g + ' (' + gs[g].length + ')'));
      gs[g].sort().forEach(function (n) { bd.appendChild(tokenRow(n, orig[n])); });
    });
  }

  function buildCard(bd) {
    var pick = el('button', 'rkt-b go', mode === 'pick' ? 'กำลังชี้… (กด Esc เพื่อออก)' : '🎯 ชี้แล้วปรับ');

    var quick = el('div', 'rkt-fb');

    if (!picked || !selEl) {

        'ไม่ต้องไล่หาในรายการยาวๆ<br><b>พื้นหลัง</b> ชี้ที่ว่างๆ ในหน้าก็เลือกได้ หรือกดปุ่มทางลัดข้างบน<br><b>ปรับแล้วไม่เปลี่ยน?</b> กด ↓ ตัวข้างใน หรือ รวมตัวข้างในด้วย';

    /* ข้างในมีตัวหนังสือที่ตั้งขนาด/สีเองอยู่กี่จุด — ตัวการที่ทำให้ "ปรับแล้วไม่เปลี่ยน" */

    bd.appendChild(cardRow('ขนาดตัวอักษร', 'font-size', 'px'));

    /* โทเคนที่จุดนี้กินอยู่ — แก้ตรงนี้เปลี่ยนทั้งแอป ไม่ใช่แค่ตรงที่ชี้ */

      toks.forEach(function (t) {
        var r = tokenRow(t.name, orig[t.name]);
        var lbl = r.querySelector('.rkt-n');

  function buildPos(bd) {

      toast('แตะใบแรก แล้วแตะใบที่จะสลับด้วย');
    };
    bd.appendChild(sw);
    bd.appendChild(el('div', 'rkt-note', 'สลับได้เฉพาะของที่อยู่ในกล่องเดียวกัน · ใช้กับการ์ดในลิสต์เดียวกันได้เลย'));

    if (!blocks.length) blocks = scanBlocks();
    bd.appendChild(el('div', 'rkt-gt', 'บล็อกใหญ่ (' + blocks.length + ')'));
    if (!blocks.length) {
      bd.appendChild(el('div', 'rkt-note', 'หน้านี้ยังไม่มี element ที่ติด data-tweak="ชื่อบล็อก" บอก Claude ให้ติดให้ก่อน'));
      return;
    }
    blocks.forEach(function (b, i) {
      var d = el('div', 'rkt-sec');
      d.appendChild(el('span', 'nm', (i+1) + '. ' + b.name));
      var up = el('button', 'rkt-mini', '↑'), dn = el('button', 'rkt-mini', '↓');
      var ey = el('button', 'rkt-mini' + (b.hidden ? ' off' : ''), '👁');
      up.onclick = function () { if (i > 0) { blocks.splice(i-1, 0, blocks.splice(i,1)[0]); applyBlocks(); rebuild(); } };
      dn.onclick = function () { if (i < blocks.length-1) { blocks.splice(i+1, 0, blocks.splice(i,1)[0]); applyBlocks(); rebuild(); } };
      ey.onclick = function () { b.hidden = !b.hidden; applyBlocks(); rebuild(); };
      d.appendChild(up); d.appendChild(dn); d.appendChild(ey);
      bd.appendChild(d);
    });
  }

  /* ─────────── แผง ─────────── */
  function rebuild() {
    if (!panel) return;
    var bd = panel.querySelector('.rkt-bd');
    bd.innerHTML = '';
    panel.querySelectorAll('.rkt-tb').forEach(function (b) {
      b.className = 'rkt-tb' + (b.dataset.t === tab ? ' on' : '');
    });
    if (tab === 'pick') buildCard(bd);
    else if (tab === 'tone') buildTone(bd);
    else buildPos(bd);
  }

  function open() {
    if (panel) { panel.style.display = 'flex'; return; }
    orig = readTokens();
    if (!Object.keys(orig).length) { toast('แอปนี้ยังไม่ได้ใช้ CSS variable ปรับไม่ได้'); return; }
    if (!document.getElementById('rk-tweak-style')) {
      var st = el('style'); st.id = 'rk-tweak-style'; st.textContent = CSS; document.head.appendChild(st);
    }

    panel = el('div', 'rkt d-' + dock);
    var hd = el('div', 'rkt-hd'); hd.appendChild(el('b', null, 'ปรับหน้าตา'));

    /* ย้ายกล่องไปมุมที่ไม่บังของที่กำลังดู */
    var dk = el('div', 'rkt-dk');
    [['left','◧','ชิดซ้าย'], ['right','◨','ชิดขวา'], ['bottom','▤','ด้านล่าง'],
     ['float','❐','ลอย'], ['min','—','ย่อ']].forEach(function (d) {
      var b = el('button', dock === d[0] ? 'on' : '', d[1]); b.title = d[2];
      b.onclick = function () {
        dock = d[0];
        panel.className = 'rkt d-' + dock;
        try { localStorage.setItem(DOCKKEY, dock); } catch (e) {}
        dk.querySelectorAll('button').forEach(function (q, i) {
          q.className = (['left','right','bottom','float','min'][i] === dock) ? 'on' : '';
        });
      };
      dk.appendChild(b);
    });
    hd.appendChild(dk);
    var x = el('button', 'rkt-x', '✕'); x.onclick = close; hd.appendChild(x);
    panel.appendChild(hd);

    var tabs = el('div', 'rkt-tabs');
    [['pick','ชี้แล้วปรับ'], ['tone','โทนรวม'], ['pos','ตำแหน่ง']].forEach(function (t) {
      var b = el('button', 'rkt-tb', t[1]); b.dataset.t = t[0];
      b.onclick = function () { stopMode(); tab = t[0]; rebuild(); };
      tabs.appendChild(b);
    });
    panel.appendChild(tabs);
    panel.appendChild(el('div', 'rkt-bd'));

    var ft = el('div', 'rkt-ft');
    var out = el('textarea'); out.className = 'rkt-out'; out.readOnly = true;
    out.placeholder = 'ปรับเสร็จแล้วกดปุ่มเขียวข้างบน ข้อความจะมาอยู่ตรงนี้';

    /* ปุ่มเดียวจบ: เขียนข้อตกลงลงตัวไฟล์ mockup เอง ไม่สร้างไฟล์ชื่อใหม่ */
    var b1 = el('button', 'rkt-b go', 'เสร็จแล้ว · เซฟลง mockup');
    b1.title = 'เขียนหน้าตาที่ปรับไว้ลงในไฟล์ mockup ตัวนี้เลย';
    b1.onclick = function () { saveLocal(true); saveSelf(out); };

    var help = el('div', 'rkt-note');
    help.innerHTML = 'กดปุ่มเขียว → เลือกทับไฟล์เดิม <b>' + selfName() + '</b> → กด Save<br>' +
      'แล้ว<b>พิมพ์บอก Claude ว่า "ปรับไว้แล้ว"</b> พอเลย ไม่ต้องก๊อปอะไร';
    var b2 = el('button', 'rkt-b', 'ดู CSS');
    b2.onclick = function () { out.value = cssText(); out.focus(); out.select(); };
    var b3 = el('button', 'rkt-b', 'คัดลอกแทน');
    b3.onclick = function () { copy(agreedBlockText(), out, 'คัดลอกแล้ว วางในแชท กด Ctrl+V'); };
    var b4 = el('button', 'rkt-b warn', 'ล้างทั้งหมด'); b4.onclick = resetAll;
    var bs = el('div', 'rkt-btns');
    [b2, b3, b4].forEach(function (b) { bs.appendChild(b); });
    ft.appendChild(b1); ft.appendChild(help); ft.appendChild(out); ft.appendChild(bs);
    panel.appendChild(ft);

    document.body.appendChild(panel);
    document.addEventListener('click', onPageClick, true);
    document.addEventListener('mouseover', onPageOver, true);
    rebuild();
  }
  function close() {
    stopMode();
    document.removeEventListener('click', onPageClick, true);
    document.removeEventListener('mouseover', onPageOver, true);
    if (panel) { panel.remove(); panel = null; }
  }

  W.RK.tweak = { open: open, close: close, css: cssText, agreed: agreedBlockText,
                 html: buildSelfHtml, save: function () { saveSelf(null); }, reset: resetAll };

  document.addEventListener('keydown', function (e) {
    if (e.ctrlKey && e.shiftKey && (e.key === 'T' || e.key === 't')) { e.preventDefault(); panel ? close() : open(); }
    if (e.key === 'Escape' && mode) { stopMode(); rebuild(); }
  });

  function boot() {
    orig = readTokens();
    blocks = scanBlocks();
    /* 1) ข้อตกลงที่ฝังไว้ในไฟล์ (ของจริงต้องสร้างตามนี้) */
    var tag = document.getElementById('rk-tweak-agreed');
    if (tag) { try { applyAgreement(JSON.parse(tag.textContent)); } catch (e) {} }
    /* 2) ของที่ยังลองอยู่ในเครื่องนี้ ทับข้อตกลงได้ */
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) applyAgreement(JSON.parse(raw));
    } catch (e) {}
    if (/[?&]tweak=1/.test(location.search)) open();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
