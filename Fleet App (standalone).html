document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

>เช็คสภาพ<\u002Fbutton>\n              <button onclick=\"{{ detailRepair }}\" style=\"flex:1;height:50px;border:none;border-radius:14px;background:#1C4DE0;color:#fff;font-family:'IBM Plex Sans Thai',sans-serif;font-size:14.5px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M14.7 6.3a4 4 0 0 0-5.4 5.2L4 17v3h3l5.5-5.3a4 4 0 0 0 5.2-5.4l-2.4 2.4-2-2 2.4-2.4z\"><\u002Fpath><\u002Fsvg>แจ้งซ่อม<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n      <\u002Fdiv>\n\n      <!-- bottom tab bar -->\n      <div style=\"flex:none;height:74px;background:#fff;border-top:1px solid #EAECF0;display:flex;align-items:stretch;padding:0 8px;position:relative;z-index:6;\">\n        <div onclick=\"{{ goHome }}\" style=\"flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;color:{{ cHome }};padding-top:8px;\">\n          <svg width=\"23\" height=\"23\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 10.5 12 3l9 7.5\"><\u002Fpath><path d=\"M5 9.4V21h5v-6h4v6h5V9.4\"><\u002Fpath><\u002Fsvg>\n          <span style=\"font-size:10.5px;font-weight:500;\">หน้าหลัก<\u002Fspan>\n        <\u002Fdiv>\n        <div onclick=\"{{ goVehicles }}\" style=\"flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;color:{{ cVeh }};padding-top:8px;\">\n          <svg width=\"23\" height=\"23\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 11l1.5-4.5A2 2 0 0 1 8.4 5h7.2a2 2 0 0 1 1.9 1.4L19 11\"><\u002Fpath><path d=\"M3 16v-3a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v3\"><\u002Fpath><path d=\"M4 16v2M20 16v2\"><\u002Fpath><\u002Fsvg>\n          <span style=\"font-size:10.5px;font-weight:500;\">ข้อมูลรถ<\u002Fspan>\n        <\u002Fdiv>\n        <div onclick=\"{{ goRepair }}\" style=\"flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;color:{{ cRepair }};padding-top:8px;\">\n          <svg width=\"23\" height=\"23\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M14.7 6.3a4 4 0 0 0-5.4 5.2L4 17v3h3l5.5-5.3a4 4 0 0 0 5.2-5.4l-2.4 2.4-2-2 2.4-2.4z\"><\u002Fpath><\u002Fsvg>\n          <span style=\"font-size:10.5px;font-weight:500;\">แจ้งซ่อม<\u002Fspan>\n        <\u002Fdiv>\n        <div onclick=\"{{ goInspect }}\" style=\"flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;color:{{ cInspect }};padding-top:8px;\">\n          <svg width=\"23\" height=\"23\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"6\" y=\"4\" width=\"12\" height=\"17\" rx=\"2.5\"><\u002Frect><path d=\"M9.5 4V3.2A1 1 0 0 1 10.5 2.2h3a1 1 0 0 1 1 1V4\"><\u002Fpath><path d=\"M9 13l2 2 4-4\"><\u002Fpath><\u002Fsvg>\n          <span style=\"font-size:10.5px;font-weight:500;\">เช็คสภาพ<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"font-size:12.5px;color:#98A2B3;text-align:center;\">แอพจัดการรถบริษัท · Company Fleet App &nbsp;·&nbsp; แตะเมนูด้านล่างเพื่อสลับหน้า<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = {\n    tab: 'home',\n    detailId: null,\n    filter: 'all',\n    search: '',\n    repairMode: 'list',\n    repairStep: 0,\n    repairSubmitted: false,\n    newRepair: { vehicleId: null, type: null, symptom: '', photos: 0 },\n    requests: [\n      { id:'r1', vehicleId:'v4', type:'ตัวถัง / สี', symptom:'กันชนหน้ามีรอยขูดยาว', date:'1 ก.ค. 69', status:'inprogress' },\n      { id:'r2', vehicleId:'v2', type:'ระบบแอร์', symptom:'แอร์ไม่เย็น มีกลิ่นอับ', date:'28 มิ.ย. 69', status:'pending' },\n    ],\n    inspectMode: 'list',\n    inspectVehicleId: null,\n    inspectCycle: 'daily',\n    inspectMileage: '',\n    checks: {},\n    inspectedToday: false,\n  };\n\n  vehicles = [\n    { id:'v1', plate:'กท 4821', brand:'Toyota', model:'Hilux Revo', type:'กระบะ', color:'ขาว', dot:'#F2F4F7', status:'available', owner:'สมชาย ใจดี', dept:'ฝ่ายขาย', mileage:84230, fuel:75, nextInspect:'พรุ่งนี้' },\n    { id:'v2', plate:'2กจ 1055', brand:'Isuzu', model:'D-Max', type:'กระบะ', color:'เทา', dot:'#98A2B3', status:'inuse', owner:'วิภา สุขใจ', dept:'ฝ่ายจัดส่ง', mileage:120540, fuel:40, nextInspect:'3 ก.ค.' },\n    { id:'v3', plate:'ฮบ 302', brand:'Toyota', model:'Commuter', type:'รถตู้', color:'ขาว', dot:'#F2F4F7', status:'inuse', owner:'ธนา มั่นคง', dept:'ฝ่ายบุคคล', mileage:65120, fuel:60, nextInspect:'5 ก.ค.' },\n    { id:'v4', plate:'8กก 7789', brand:'Honda', model:'City', type:'เก๋ง', color:'ดำ', dot:'#101828', status:'repair', owner:'ส่วนกลาง', dept:'คลังรถ', mileage:99870, fuel:20, nextInspect:'รอซ่อมเสร็จ' },\n    { id:'v5', plate:'1ขค 4410', brand:'Mitsubishi', model:'Triton', type:'กระบะ', color:'เงิน', dot:'#D0D5DD', status:'available', owner:'ส่วนกลาง', dept:'คลังรถ', mileage:45300, fuel:90, nextInspect:'8 ก.ค.' },\n  ];\n\n  repairTypes = ['เครื่องยนต์','ระบบไฟฟ้า','ยาง / ช่วงล่าง','ระบบแอร์','ตัวถัง / สี','อื่น ๆ'];\n\n  checklist = [\n    { key:'tires', label:'ยางและลมยาง', hint:'ดอกยาง · แรงดันลม', daily:true },\n    { key:'lights', label:'ไฟหน้า / ท้าย / เลี้ยว', hint:'ไฟส่องสว่างทุกดวง', daily:true },\n    { key:'brake', label:'ระบบเบรก', hint:'แป้นเบรก · เบรกมือ', daily:true },\n    { key:'fuel', label:'ระดับน้ำมันเชื้อเพลิง', hint:'เพียงพอต่อการใช้งาน', daily:true },\n    { key:'wipers', label:'ที่ปัดน้ำฝน / กระจก', hint:'ใบปัด · น้ำฉีดกระจก', daily:true },\n    { key:'horn', label:'แตร / สัญญาณเสียง', hint:'ทำงานปกติ', daily:true },\n    { key:'engine_oil', label:'น้ำมันเครื่อง', hint:'ระดับ · สีของน้ำมัน', daily:false },\n    { key:'coolant', label:'น้ำหล่อเย็น / หม้อน้ำ', hint:'ระดับในถัง', daily:false },\n    { key:'belt', label:'เข็มขัดนิรภัยทุกที่นั่ง', hint:'ดึง-ล็อกได้ปกติ', daily:false },\n    { key:'body', label:'สภาพตัวถังภายนอก', hint:'รอยบุบ · รอยขูด', daily:false },\n  ];\n\n  statusMap = {\n    available: { label:'ว่าง', color:'#067647', bg:'#ECFDF3', dot:'#12B76A' },\n    inuse:     { label:'กำลังใช้งาน', color:'#1C4DE0', bg:'#EEF2FF', dot:'#1C4DE0' },\n    repair:    { label:'อยู่ระหว่างซ่อม', color:'#B54708', bg:'#FFFAEB', dot:'#F79009' },\n  };\n  reqStatusMap = {\n    pending:    { label:'รออนุมัติ', color:'#B54708', bg:'#FFFAEB' },\n    approved:   { label:'อนุมัติแล้ว', color:'#067647', bg:'#ECFDF3' },\n    inprogress: { label:'กำลังซ่อม', color:'#1C4DE0', bg:'#EEF2FF' },\n    rejected:   { label:'ไม่อนุมัติ', color:'#B42318', bg:'#FEF3F2' },\n  };\n\n  vFind(id){ return this.vehicles.find(v => v.id === id) || null; }\n  withStatus(v){ return v ? Object.assign({}, v, { _s: this.statusMap[v.status], _mi: v.mileage.toLocaleString('en-US') }) : null; }\n  nf(n){ return Number(n||0).toLocaleString('en-US'); }\n\n  // ---- nav ----\n  setTab = (t) => this.setState({ tab: t, detailId: null });\n  openVehicle = (id) => this.setState({ detailId: id });\n  closeDetail = () => this.setState({ detailId: null });\n  setFilter = (f) => this.setState({ filter: f });\n  onSearch = (e) => this.setState({ search: e.target.value });\n\n  // ---- repair ----\n  startRepair = (vehicleId) => this.setState({ tab:'repair', detailId:null, repairMode:'new', repairStep:0, repairSubmitted:false, newRepair:{ vehicleId: vehicleId||null, type:null, symptom:'', photos:0 } });\n  cancelRepair = () => this.setState({ repairMode:'list', repairSubmitted:false });\n  pickRepairVehicle = (id) => this.setState(s => ({ newRepair: Object.assign({}, s.newRepair, { vehicleId:id }) }));\n  pickRepairType = (t) => this.setState(s => ({ newRepair: Object.assign({}, s.newRepair, { type:t }) }));\n  onSymptom = (e) => { const val = e.target.value; this.setState(s => ({ newRepair: Object.assign({}, s.newRepair, { symptom: val }) })); };\n  addPhoto = () => this.setState(s => ({ newRepair: Object.assign({}, s.newRepair, { photos: Math.min(4, s.newRepair.photos + 1) }) }));\n  nextRepair = () => { if (this.state.repairStep >= 3) { this.submitRepair(); } else { this.setState(s => ({ repairStep: s.repairStep + 1 })); } };\n  prevRepair = () => { if (this.state.repairStep === 0) this.cancelRepair(); else this.setState(s => ({ repairStep: s.repairStep - 1 })); };\n  submitRepair = () => this.setState(s => ({\n    repairSubmitted: true,\n    requests: [{ id:'r'+Date.now(), vehicleId:s.newRepair.vehicleId, type:s.newRepair.type, symptom:s.newRepair.symptom, date:'วันนี้', status:'pending' }, ...s.requests],\n  }));\n\n  // ---- inspection ----\n  startInspect = (vehicleId) => this.setState({ tab:'inspect', detailId:null, inspectMode:'run', inspectVehicleId: vehicleId||null, inspectMileage:'', checks:{} });\n  backToInspectList = () => this.setState({ inspectMode:'list' });\n  setCycle = (c) => this.setState({ inspectCycle:c, checks:{} });\n  pickInspectVehicle = (id) => this.setState({ inspectVehicleId:id });\n  onMileage = (e) => { const val = e.target.value.replace(/[^0-9]/g,''); this.setState({ inspectMileage: val }); };\n  setCheck = (key, val) => this.setState(s => ({ checks: Object.assign({}, s.checks, { [key]: val }) }));\n  finishInspect = () => this.setState({ inspectMode:'result', inspectedToday:true });\n\n  activeChecklist(){ return this.state.inspectCycle === 'daily' ? this.checklist.filter(i => i.daily) : this.checklist; }\n\n  renderVals(){\n    const s = this.state;\n    const T = this;\n\n    // tab colors\n    const tc = (name) => s.tab === name ? '#1C4DE0' : '#98A2B3';\n\n    // vehicle list (filter + search)\n    const q = s.search.trim();\n    const list = this.vehicles\n      .filter(v => s.filter === 'all' ? true : v.status === s.filter)\n      .filter(v => !q ? true : (v.plate + v.brand + v.model).toLowerCase().includes(q.toLowerCase()))\n      .map(v => Object.assign({}, this.withStatus(v), { _open: () => T.openVehicle(v.id) }));\n\n    const filters = [\n      { key:'all', label:'ทั้งหมด' },\n      { key:'available', label:'ว่าง' },\n      { key:'inuse', label:'ใช้งาน' },\n      { key:'repair', label:'ซ่อม' },\n    ].map(f => Object.assign({}, f, {\n      _sel: s.filter === f.key,\n      _bg: s.filter === f.key ? '#101828' : '#FFFFFF',\n      _fg: s.filter === f.key ? '#FFFFFF' : '#475467',\n      _bd: s.filter === f.key ? '#101828' : '#EAECF0',\n      _set: () => T.setFilter(f.key),\n    }));\n\n    const detail = this.withStatus(this.vFind(s.detailId));\n\n    // assigned + home\n    const assigned = this.withStatus(this.vFind('v1'));\n    const pendingCount = s.requests.filter(r => r.status === 'pending').length;\n    const activeCount = s.requests.filter(r => r.status !== 'rejected').length;\n\n    // requests mapped\n    const reqs = s.requests.map(r => {\n      const v = this.vFind(r.vehicleId);\n      return Object.assign({}, r, { plate: v ? v.plate : '-', model: v ? (v.brand+' '+v.model) : '', _s: this.reqStatusMap[r.status] });\n    });\n\n    // repair new flow\n    const rStep = s.repairStep;\n    const nr = s.newRepair;\n    const repairVehicle = this.withStatus(this.vFind(nr.vehicleId));\n    const selectableVehicles = this.vehicles.map(v => Object.assign({}, this.withStatus(v), {\n      _sel: nr.vehicleId === v.id,\n      _select: () => T.pickRepairVehicle(v.id),\n    }));\n    const typeChips = this.repairTypes.map(t => ({\n      label: t, _sel: nr.type === t, _select: () => T.pickRepairType(t),\n    }));\n    const photoTiles = Array.from({ length: nr.photos }, (_, i) => ({ n: i + 1 }));\n    const canNext = rStep === 0 ? !!nr.vehicleId : rStep === 1 ? !!nr.type : rStep === 2 ? nr.symptom.trim().length > 0 : true;\n    const stepDots = [0,1,2,3].map(i => ({ _bg: i <= rStep ? '#1C4DE0' : '#E4E7EC' }));\n\n    // inspection\n    const active = this.activeChecklist();\n    const inspVehicle = this.withStatus(this.vFind(s.inspectVehicleId));\n    const inspSelectable = this.vehicles.filter(v => v.status !== 'repair').map(v => Object.assign({}, this.withStatus(v), {\n      _sel: s.inspectVehicleId === v.id, _select: () => T.pickInspectVehicle(v.id),\n    }));\n    const items = active.map(it => {\n      const val = s.checks[it.key] || null;\n      return Object.assign({}, it, {\n        _val: val,\n        _passSel: val === 'pass',\n        _failSel: val === 'fail',\n        _passBg: val === 'pass' ? '#12B76A' : '#F2F4F7',\n        _passFg: val === 'pass' ? '#FFFFFF' : '#667085',\n        _failBg: val === 'fail' ? '#F04438' : '#F2F4F7',\n        _failFg: val === 'fail' ? '#FFFFFF' : '#667085',\n        _rowBd: val === 'fail' ? '#FDA29B' : val === 'pass' ? '#EAECF0' : '#EAECF0',\n        _pass: () => T.setCheck(it.key, 'pass'),\n        _fail: () => T.setCheck(it.key, 'fail'),\n      });\n    });\n    const answered = active.filter(i => s.checks[i.key]).length;\n    const passed = active.filter(i => s.checks[i.key] === 'pass').length;\n    const failedItems = active.filter(i => s.checks[i.key] === 'fail');\n    const total = active.length;\n    const progressPct = total ? Math.round(answered / total * 100) : 0;\n    const scorePct = total ? Math.round(passed / total * 100) : 0;\n    const verdictPass = answered === total && failedItems.length === 0;\n    const cycleLabel = s.inspectCycle === 'daily' ? 'รายวัน · ก่อนใช้งาน' : 'รายสัปดาห์ · เต็มรูปแบบ';\n\n    const cycleTabs = [\n      { key:'daily', label:'รายวัน', sub:'ก่อนใช้งาน' },\n      { key:'weekly', label:'รายสัปดาห์', sub:'เต็มรูปแบบ' },\n    ].map(c => Object.assign({}, c, {\n      _sel: s.inspectCycle === c.key,\n      _bg: s.inspectCycle === c.key ? '#FFFFFF' : 'transparent',\n      _fg: s.inspectCycle === c.key ? '#101828' : '#667085',\n      _sh: s.inspectCycle === c.key ? '0 1px 3px rgba(16,24,40,.12)' : 'none',\n      _set: () => T.setCycle(c.key),\n    }));\n\n    return {\n      // nav\n      isHome: s.tab === 'home', isVehicles: s.tab === 'vehicles', isRepair: s.tab === 'repair', isInspect: s.tab === 'inspect',\n      goHome: () => T.setTab('home'), goVehicles: () => T.setTab('vehicles'), goRepair: () => T.setTab('repair'), goInspect: () => T.setTab('inspect'),\n      cHome: tc('home'), cVeh: tc('vehicles'), cRepair: tc('repair'), cInspect: tc('inspect'),\n\n      // home\n      assigned, pendingCount, activeCount, inspectedToday: s.inspectedToday, notInspectedToday: !s.inspectedToday,\n      startRepairHome: () => T.startRepair('v1'),\n      startInspectHome: () => T.startInspect('v1'),\n      recentReqs: reqs.slice(0, 2),\n\n      // vehicles\n      list, filters, hasResults: list.length > 0, resultCount: list.length,\n      search: s.search, onSearch: T.onSearch,\n      hasDetail: !!detail, detail, closeDetail: T.closeDetail,\n      detailRepair: () => T.startRepair(s.detailId),\n      detailInspect: () => T.startInspect(s.detailId),\n\n      // repair\n      repairIsList: s.repairMode === 'list',\n      repairIsNew: s.repairMode === 'new' && !s.repairSubmitted,\n      repairIsDone: s.repairMode === 'new' && s.repairSubmitted,\n      requests: reqs, hasRequests: reqs.length > 0,\n      startNewRepair: () => T.startRepair(null),\n      cancelRepair: T.cancelRepair, prevRepair: T.prevRepair, nextRepair: T.nextRepair, submitRepair: T.submitRepair,\n      rStep, rStep0: rStep===0, rStep1: rStep===1, rStep2: rStep===2, rStep3: rStep===3,\n      stepDots, canNext, nextDisabledBg: canNext ? '#1C4DE0' : '#C7D0E8', nextDisabledCursor: canNext ? 'pointer' : 'not-allowed',\n      nextLabel: rStep === 3 ? 'ส่งคำขอ' : 'ถัดไป',\n      selectableVehicles, typeChips, photoTiles, canAddPhoto: nr.photos < 4,\n      addPhoto: T.addPhoto, onSymptom: T.onSymptom, symptom: nr.symptom,\n      repairVehicle, repairType: nr.type, photoCount: nr.photos,\n      doneVehicle: repairVehicle, doneType: nr.type, doneSymptom: nr.symptom,\n\n      // inspection\n      inspectIsList: s.inspectMode === 'list',\n      inspectIsRun: s.inspectMode === 'run',\n      inspectIsResult: s.inspectMode === 'result',\n      cycleTabs, cycleLabel,\n      startInspectList: () => T.startInspect(null),\n      backToInspectList: T.backToInspectList,\n      inspNeedsVehicle: !s.inspectVehicleId, inspVehicle, inspSelectable,\n      items, answered, total, progressPct, passed, scorePct,\n      failedItems: failedItems.map(f => f.label), failedCount: failedItems.length, hasFailed: failedItems.length > 0,\n      canFinish: answered === total && s.inspectMileage.length > 0,\n      finishBg: (answered === total && s.inspectMileage.length > 0) ? '#101828' : '#C1C7D0',\n      finishCursor: (answered === total && s.inspectMileage.length > 0) ? 'pointer' : 'not-allowed',\n      finishInspect: T.finishInspect,\n      inspectMileage: s.inspectMileage, onMileage: T.onMileage,\n      verdictPass, verdictBg: verdictPass ? '#ECFDF3' : '#FEF3F2', verdictColor: verdictPass ? '#067647' : '#B42318',\n      verdictRing: verdictPass ? '#12B76A' : '#F04438',\n      verdictLabel: verdictPass ? 'ผ่านการตรวจสอบ' : 'พบข้อบกพร่อง',\n      verdictSub: verdictPass ? 'พร้อมใช้งาน' : 'ควรแจ้งซ่อมก่อนใช้งาน',\n      resVehicle: inspVehicle, resMileage: this.nf(s.inspectMileage),\n      goRepairFromResult: () => T.startRepair(s.inspectVehicleId),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
