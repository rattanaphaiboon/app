<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Rattana กำลังคน v1.3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0d1b3e;--navy-mid:#1a2f5e;--gold:#c9a84c;
  --success:#1e9e5a;--danger:#d63a2c;--warning:#f39c12;
  --bg:#f4f6fb;--text:#0d1b3e;--card-bg:#ffffff;--border:#dde3f0;--muted:#5f6b88;--row-alt:#fafbfd;--soft:#f0f3f9;
  --gap-bg:#fde8e6;--gap-fg:#c0392b;--ok-bg:#e6f6ec;--ok-fg:#1e8449;--track:#e7ebf4;
  --radius-sm:6px;--radius-md:12px;--radius-lg:16px;--shadow-md:0 2px 8px rgba(0,0,0,.08);
  --c-W1:#f1c40f;--c-W2:#3498db;--c-W3:#e74c3c;--c-W4:#27ae60;--c-C4:#16a085;--c-HQ:#5d6d7e;
}
body.dark{
  --bg:#05080f;--text:#ffffff;--card-bg:#0d1b3e;--border:#1f3563;--muted:#b8c2dc;--row-alt:#0a1226;--soft:#0a1226;
  --gap-bg:transparent;--gap-fg:#ff8a7e;--ok-bg:transparent;--ok-fg:#7be0a3;--track:#1f3563;--c-HQ:#9aa9bd;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Sarabun',Tahoma,sans-serif;font-size:15px;line-height:1.5;min-height:100dvh;overflow-x:hidden;background:var(--bg);color:var(--text)}
button{font-family:inherit;cursor:pointer;border:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.num{font-variant-numeric:tabular-nums}

header{background:var(--navy);color:#fff;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:8px;border-bottom:3px solid var(--gold)}
.logo-text{font-weight:800;letter-spacing:1.2px;font-size:18px;color:#fff;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo-text span{color:var(--gold)}
.logo-text small{font-size:11px;font-weight:500;letter-spacing:0;color:rgba(255,255,255,.55);margin-left:6px}
.icon-btn{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.25);height:38px;min-width:38px;padding:0 10px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;gap:5px;font-size:14px;font-weight:600}
.icon-btn:hover{background:rgba(255,255,255,.12)}
.icon-btn:disabled{opacity:.5}
.hub-btn{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:var(--radius-sm);padding:5px 10px;font-size:13px;font-weight:600;text-decoration:none;white-space:nowrap;min-height:38px}
.hub-btn-icon{width:22px;height:22px;border-radius:5px;background:var(--gold);color:var(--navy);display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
@media(max-width:420px){.logo-text small,.lbl{display:none}.logo-text{font-size:16px;letter-spacing:.4px}}

.content{max-width:1100px;margin:0 auto;padding:14px;padding-bottom:max(40px,env(safe-area-inset-bottom));display:grid;gap:14px}
@media(min-width:640px){.content{padding:20px;gap:18px}}

.status{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);font-weight:600}
.dot{width:10px;height:10px;border-radius:50%;background:var(--muted);flex:none}
.status.on{color:var(--ok-fg)}
.status.on .dot{background:var(--success);animation:pulse 2s infinite}
.status.warn .dot{background:var(--warning)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(30,158,90,.55)}70%{box-shadow:0 0 0 8px rgba(30,158,90,0)}100%{box-shadow:0 0 0 0 rgba(30,158,90,0)}}

.sum{background:var(--card-bg);border:1px solid var(--border);border-top:4px solid var(--gold);border-radius:var(--radius-lg);box-shadow:var(--shadow-md);padding:18px;display:grid;gap:10px}
.sum .q{font-size:17px;font-weight:700;color:var(--muted)}
.sum .big{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sum .big b{font-size:clamp(54px,14vw,72px);line-height:1;font-weight:800;color:var(--gap-fg)}
.sum .big b.zero{color:var(--ok-fg)}
.sum .big span{font-size:24px;font-weight:700}
.sum .line{font-size:18px}
.sum .line b{font-weight:800}
.bar{height:12px;border-radius:99px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--success)}

.share{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.share button{min-height:52px;border-radius:var(--radius-md);font-size:16px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px;padding:6px 10px}
.b-gold{background:var(--gold);color:var(--navy)}
.b-navy{background:var(--navy);color:#fff;border:2px solid var(--gold)!important}
body.dark .b-navy{background:transparent}

.grid{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:760px){.grid{grid-template-columns:1fr 1fr;align-items:start}}
.card{background:var(--card-bg);border:1px solid var(--border);border-top:6px solid var(--c,var(--gold));border-radius:var(--radius-md);box-shadow:var(--shadow-md);overflow:hidden}
.card-head{padding:14px 16px 12px;display:grid;gap:8px;border-bottom:1px solid var(--border)}
.ch-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.ch-name{font-size:19px;font-weight:800;min-width:0}
.pill{flex:none;font-size:18px;font-weight:800;padding:4px 14px;border-radius:99px;background:var(--gap-bg);color:var(--gap-fg);border:1.5px solid var(--gap-fg);white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok-fg);border-color:var(--ok-fg)}
.ch-sub{font-size:15px;color:var(--muted)}
.ch-sub b{color:var(--text)}
.thead{display:grid;grid-template-columns:minmax(0,1fr) 4.2em 4.2em 3.6em;gap:8px;padding:8px 16px;font-size:13px;font-weight:700;color:var(--muted);background:var(--soft)}
.thead span:not(:first-child),.prow span:not(:first-child){text-align:right}
.prow{display:grid;grid-template-columns:minmax(0,1fr) 4.2em 4.2em 3.6em;gap:8px;align-items:center;padding:11px 16px;border-top:1px solid var(--border);font-size:15.5px}
.prow:nth-child(odd){background:var(--row-alt)}
.prow .p{font-weight:600;min-width:0}
.prow .gp{font-weight:800;color:var(--gap-fg)}
.okmsg{padding:14px 16px;color:var(--ok-fg);font-weight:700;font-size:16px}
.note{font-size:13.5px;color:var(--muted);line-height:1.6;padding:2px 4px}
.err{background:var(--gap-bg);color:var(--gap-fg);border:1.5px solid var(--gap-fg);border-radius:var(--radius-md);padding:12px 14px;font-weight:600}

.modal{position:fixed;inset:0;background:rgba(13,27,62,.7);z-index:9000;display:none;align-items:flex-start;justify-content:center;padding:16px;overflow-y:auto}
.modal.open{display:flex}
.mbox{background:var(--card-bg);border-radius:var(--radius-lg);border-top:4px solid var(--gold);max-width:520px;width:100%;padding:14px;display:grid;gap:10px;margin:auto 0}
.mbox h3{font-size:17px;font-weight:800}
.mbox img{width:100%;border-radius:var(--radius-md);border:1px solid var(--border)}
.mbox p{font-size:14px;color:var(--muted)}
.mbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mbtns button{min-height:48px;border-radius:var(--radius-md);font-size:15px;font-weight:800}
.b-out{background:transparent;border:2px solid var(--border)!important;color:var(--text)}
.sw:focus-visible,.icon-btn:focus-visible,.hub-btn:focus-visible,.share button:focus-visible,.mbtns button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#backToTop{position:fixed;bottom:max(24px,calc(16px + env(safe-area-inset-bottom)));right:16px;background:var(--gold);color:var(--navy);border-radius:50%;width:46px;height:46px;display:none;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(201,168,76,.35);z-index:90;font-size:18px;font-weight:800}
#backToTop.show{display:flex}
.toast{position:fixed;bottom:max(24px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);padding:12px 20px;border-radius:var(--radius-md);color:#fff;z-index:9999;font-weight:600;font-size:14px;box-shadow:0 8px 24px rgba(13,27,62,.2);max-width:90vw}
.toast-success{background:var(--success)}.toast-error{background:var(--danger)}.toast-info{background:var(--navy-mid)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <span class="logo-text">RATTANA <span>กำลังคน</span><small>v1.3</small></span>
  <button class="icon-btn" id="btnRefresh" type="button" title="ดึงข้อมูลล่าสุด">⟳<span class="lbl">อัปเดต</span></button>
  <button class="icon-btn" id="themeBtn" type="button" title="สลับโหมดสว่าง/มืด">🌙</button>
  <a href="https://rattanaphaiboon.github.io/app/rattana-hub.html" class="hub-btn" title="กลับ Hub"><span class="hub-btn-icon">R</span><span>Hub</span></a>
</header>

<main class="content" id="main">
  <div class="status" id="status"><i class="dot"></i><span id="statusTxt">กำลังโหลดข้อมูล…</span></div>

  <section class="sum" aria-live="polite">
    <div class="q">ตอนนี้ยังขาดพนักงาน</div>
    <div class="big"><b class="num" id="sGap">–</b><span>คน</span></div>
    <div class="line num" id="sLine"></div>
    <div class="bar" aria-hidden="true"><i id="sBar" style="width:0"></i></div>
  </section>

  <div class="share">
    <button class="b-gold" id="btnImg" type="button">📷 ส่งรูปเข้า LINE</button>
    <button class="b-navy" id="btnTxt" type="button">📋 คัดลอกข้อความ</button>
  </div>

  <section class="grid" id="view"></section>

  <p class="note">ข้อมูลจากชีท 2. ค่างาน › Update ค่างาน · นับเฉพาะตำแหน่งที่เปิดไว้ · แก้ในชีทแล้วตัวเลขในแอปเปลี่ยนตามภายในประมาณ 5 นาที</p>
</main>

<div class="modal" id="imgModal" role="dialog" aria-modal="true" aria-labelledby="imgTitle">
  <div class="mbox">
    <h3 id="imgTitle">รูปสรุปกำลังคน</h3>
    <img id="imgPrev" alt="รูปสรุปกำลังคน">
    <p>กด “ส่ง/บันทึกรูป” หรือกดค้างที่รูปเพื่อบันทึก แล้วส่งเข้า LINE ได้เลย</p>
    <div class="mbtns">
      <button class="b-gold" id="btnSave" type="button">📤 ส่ง/บันทึกรูป</button>
      <button class="b-out" id="btnClose" type="button">ปิด</button>
    </div>
  </div>
</div>
<button id="backToTop" type="button" aria-label="กลับด้านบน">↑</button>

<script>
const CSV_URL='https://docs.google.com/spreadsheets/d/e/2PACX-1vRJJj0Ag4kOmzOwFgm7oVaX_-MsvWSfVissZQZAXZryrUauLQblx3WbhWkkvYEN3tCLUo6vL_Rcda1m/pub?gid=1639155684&single=true&output=csv';
const BACKUP_URL='rattana-manpower-data.json';   // สำรอง: สรุปทุกวันจันทร์
const APP_URL='https://rattanaphaiboon.github.io/app/rattana-manpower.html';
const REFRESH_SEC=60;
const CENTERS={
  W1:{n:'ศูนย์สมุทรสงคราม',e:'🟡',hex:'#f1c40f'},W2:{n:'ศูนย์สุพรรณบุรี',e:'🔵',hex:'#3498db'},W3:{n:'ศูนย์ราชบุรี',e:'🔴',hex:'#e74c3c'},
  W4:{n:'ศูนย์นครปฐม',e:'🟢',hex:'#27ae60'},C4:{n:'รัตนมาร์ท ดอนตูม',e:'🟩',hex:'#16a085'},HQ:{n:'สำนักงานใหญ่',e:'⬛',hex:'#5d6d7e'}
};
const ORDER=['W1','W2','W3','W4','C4','HQ'];
const TH_MON=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];

const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Number(n).toLocaleString('th-TH');
const sum=(a,f)=>a.reduce((s,x)=>s+f(x),0);
const cName=k=>CENTERS[k]?CENTERS[k].n:k;
const cEmoji=k=>CENTERS[k]?CENTERS[k].e:'⬜';
const cColor=k=>CENTERS[k]?`var(--c-${k})`:'var(--gold)';
const pad=n=>String(n).padStart(2,'0');
const thDT=d=>`${d.getDate()} ${TH_MON[d.getMonth()]} ${d.getFullYear()+543} เวลา ${pad(d.getHours())}.${pad(d.getMinutes())} น.`;
function showToast(msg,type='info'){const t=document.createElement('div');t.className=`toast toast-${type}`;t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),3000)}

/* ---------- data ---------- */
let rows=[],asOf=null;
function setRows(list){rows=list.map(([c,d,p,need,have])=>({c:String(c).trim(),d:String(d).trim(),p:String(p).trim(),need:+need||0,have:+have||0})).filter(r=>r.c&&r.p&&r.need>0).map(r=>({...r,gap:Math.max(0,r.need-r.have)}))}
function parseCsv(text){
  if(text.charCodeAt(0)===0xFEFF)text=text.slice(1);
  const out=[];let row=[],cell='',q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){cell+='"';i++}else q=false}else cell+=ch}
    else if(ch==='"')q=true;else if(ch===','){row.push(cell);cell=''}else if(ch==='\r'){}else if(ch==='\n'){row.push(cell);out.push(row);row=[];cell=''}else cell+=ch}
  if(cell.length||row.length){row.push(cell);out.push(row)}
  return out;
}
// แท็บ แอปกำลังคน: ตารางสรุปอยู่คอลัมน์ H:L (ศูนย์, ฝ่าย, ตำแหน่ง, ต้องมี, มีคน) · O2 = เวลาที่ชีทคำนวณ
function fromCsv(text){
  const v=parseCsv(text);
  const H=(v[0]||[]).map(s=>String(s).trim());
  let i=H.indexOf('ศูนย์');if(i<0)i=7;
  const list=v.slice(1).map(r=>[r[i],r[i+1],r[i+2],r[i+3],r[i+4]]).filter(r=>r[0]&&String(r[0]).trim()&&/^\d+$/.test(String(r[3]).trim()));
  if(list.length<5)throw new Error('ข้อมูลไม่ครบ');
  const t=v[1]&&v[1][14];const m=t&&/(\d{4})-(\d{2})-(\d{2}) (\d{2}):(\d{2})/.exec(t);
  return{list,when:m?new Date(+m[1],+m[2]-1,+m[3],+m[4],+m[5]):new Date()};
}

/* ---------- render ---------- */
function centerStats(){
  const keys=[...ORDER,...new Set(rows.map(r=>r.c).filter(k=>!ORDER.includes(k)))].filter(k=>rows.some(r=>r.c===k));
  return keys.map(k=>{const rs=rows.filter(r=>r.c===k);return{k,rs,need:sum(rs,r=>r.need),have:sum(rs,r=>r.have),gap:sum(rs,r=>r.gap)}})
    .sort((a,b)=>b.gap-a.gap||ORDER.indexOf(a.k)-ORDER.indexOf(b.k));
}
function render(){
  const need=sum(rows,r=>r.need),have=sum(rows,r=>r.have),gap=sum(rows,r=>r.gap);
  $('sGap').textContent=fmt(gap);$('sGap').classList.toggle('zero',!gap);
  $('sLine').innerHTML=`มีอยู่ <b>${fmt(have)}</b> คน จากที่ต้องการ <b>${fmt(need)}</b> คน`;
  $('sBar').style.width=(need?have/need*100:100)+'%';
  $('view').innerHTML=centerStats().map(s=>{
    const miss=s.rs.filter(r=>r.gap).sort((a,b)=>b.gap-a.gap||a.p.localeCompare(b.p,'th'));
    return `<article class="card" style="--c:${cColor(s.k)}">
      <div class="card-head">
        <div class="ch-top"><div class="ch-name">${cEmoji(s.k)} ${esc(s.k)} ${esc(cName(s.k))}</div><div class="pill num${s.gap?'':' ok'}">${s.gap?`ขาด ${s.gap} คน`:'ครบ'}</div></div>
        <div class="ch-sub num">มีอยู่ <b>${s.have}</b> คน จากที่ต้องการ <b>${s.need}</b> คน</div>
      </div>
      ${miss.length?`<div class="thead"><span>ตำแหน่งที่ขาด</span><span>มีอยู่</span><span>ต้องการ</span><span>ขาด</span></div>
        ${miss.map(r=>`<div class="prow num"><span class="p">${esc(r.p)}</span><span>${r.have}</span><span>${r.need}</span><span class="gp">${r.gap}</span></div>`).join('')}`
      :'<div class="okmsg">✅ คนครบทุกตำแหน่ง</div>'}
    </article>`;
  }).join('');
}
function setStatus(kind,txt){$('status').className='status '+kind;$('statusTxt').textContent=txt}

/* ---------- load ---------- */
let loading=false,live=false;
async function loadLive(){
  const r=await fetch(CSV_URL+'&t='+Date.now(),{cache:'no-store'});
  if(!r.ok)throw new Error('HTTP '+r.status);
  return fromCsv(await r.text());
}
async function loadBackup(){
  const r=await fetch(BACKUP_URL+'?t='+Date.now(),{cache:'no-store'});
  const d=await r.json();const w=(d.weeks||[]).sort((a,b)=>b.date.localeCompare(a.date))[0];
  if(!w)throw new Error('no backup');
  const [y,m,dd]=w.date.split('-').map(Number);
  return{list:w.rows,when:new Date(y,m-1,dd,7,30)};
}
async function load(manual){
  if(loading)return false;loading=true;
  try{
    const x=await loadLive();setRows(x.list);asOf=x.when;live=true;
    try{localStorage.setItem('rattana_manpower_live',JSON.stringify({list:x.list,when:+x.when}))}catch(e){}
    render();setStatus('on',`ข้อมูลสดจากชีท · ${thDT(asOf)}`);return true;
  }catch(e){
    if(!rows.length){
      try{const b=await loadBackup();setRows(b.list);asOf=b.when;render();setStatus('warn',`ดึงข้อมูลสดไม่ได้ · แสดงข้อมูลสรุปวันจันทร์ ${thDT(asOf)}`)}
      catch(_){ $('main').insertAdjacentHTML('afterbegin','<div class="err">โหลดข้อมูลไม่สำเร็จ · ลองกด ⟳ อัปเดต อีกครั้ง</div>') }
    }else setStatus('warn',`ดึงข้อมูลใหม่ไม่ได้ · แสดงตัวเลขเมื่อ ${thDT(asOf)}`);
    return false;
  }finally{loading=false}
}

/* ---------- LINE text ---------- */
function reportText(){
  const need=sum(rows,r=>r.need),have=sum(rows,r=>r.have),gap=sum(rows,r=>r.gap);
  const L=['📊 สรุปกำลังคน',asOf?thDT(asOf):'','',`ยังขาดทั้งหมด ${fmt(gap)} คน`,`มีอยู่ ${fmt(have)} จากที่ต้องการ ${fmt(need)} คน`];
  centerStats().forEach(s=>{
    L.push('',`${cEmoji(s.k)} ${s.k} ${cName(s.k)} — ${s.gap?`ขาด ${s.gap} คน`:'ครบ ✅'} (มีอยู่ ${s.have}/${s.need})`);
    s.rs.filter(r=>r.gap).sort((a,b)=>b.gap-a.gap).forEach(r=>L.push(`   • ${r.p} ขาด ${r.gap} (มีอยู่ ${r.have}/${r.need})`));
  });
  L.push('',`ดูในแอป: ${APP_URL}`);
  return L.join('\n');
}
$('btnTxt').addEventListener('click',async()=>{
  const t=reportText();
  try{await navigator.clipboard.writeText(t);showToast('คัดลอกแล้ว วางใน LINE ได้เลย ✓','success')}
  catch(e){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');showToast('คัดลอกแล้ว ✓','success')}catch(_){showToast('คัดลอกไม่ได้','error')}ta.remove()}
});

/* ---------- image ---------- */
function rr(x,a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath()}
async function drawReport(){
  try{await Promise.all(['500','700','800'].map(w=>document.fonts.load(`${w} 40px Sarabun`)))}catch(e){}
  const st=centerStats(),need=sum(rows,r=>r.need),have=sum(rows,r=>r.have),gap=sum(rows,r=>r.gap);
  const F='Sarabun, Tahoma, sans-serif',W=1080;
  const blockH=s=>96+Math.max(1,s.rs.filter(r=>r.gap).length)*52+20;
  const H=520+sum(st,s=>blockH(s)+20)+90;
  const cv=document.createElement('canvas');cv.width=W;cv.height=H;const x=cv.getContext('2d');
  x.fillStyle='#f4f6fb';x.fillRect(0,0,W,H);
  x.fillStyle='#0d1b3e';x.fillRect(0,0,W,160);x.fillStyle='#c9a84c';x.fillRect(0,160,W,8);
  x.fillStyle='#fff';x.font=`800 44px ${F}`;x.fillText('RATTANA',60,78);x.fillStyle='#c9a84c';x.fillText('กำลังคน',290,78);
  x.fillStyle='rgba(255,255,255,.85)';x.font=`500 32px ${F}`;x.fillText(asOf?`ข้อมูล ณ ${thDT(asOf)}`:'',60,130);
  x.fillStyle='#fff';rr(x,40,200,1000,280,24);x.fill();
  x.fillStyle='#5f6b88';x.font=`700 36px ${F}`;x.fillText('ตอนนี้ยังขาดพนักงาน',80,260);
  x.fillStyle=gap?'#c0392b':'#1e8449';x.font=`800 130px ${F}`;const gs=fmt(gap);x.fillText(gs,76,385);
  const gw=x.measureText(gs).width;x.fillStyle='#0d1b3e';x.font=`700 48px ${F}`;x.fillText('คน',100+gw,385);
  const p=need?have/need:1;x.fillStyle='#e7ebf4';rr(x,80,410,920,20,10);x.fill();x.fillStyle='#1e9e5a';rr(x,80,410,Math.max(20,920*p),20,10);x.fill();
  x.fillStyle='#0d1b3e';x.font=`600 30px ${F}`;x.fillText(`มีอยู่ ${fmt(have)} คน จากที่ต้องการ ${fmt(need)} คน`,80,465);
  let y=520;
  st.forEach(s=>{
    const miss=s.rs.filter(r=>r.gap).sort((a,b)=>b.gap-a.gap);const h=blockH(s);
    x.fillStyle='#fff';rr(x,40,y,1000,h,18);x.fill();
    x.fillStyle=CENTERS[s.k]?CENTERS[s.k].hex:'#c9a84c';rr(x,40,y,1000,12,6);x.fill();x.fillRect(40,y+6,1000,6);
    x.fillStyle='#0d1b3e';x.font=`800 36px ${F}`;x.fillText(`${s.k} ${cName(s.k)}`,70,y+62);
    const t=s.gap?`ขาด ${s.gap} คน`:'ครบ ✓';x.font=`800 36px ${F}`;x.fillStyle=s.gap?'#c0392b':'#1e8449';x.fillText(t,1010-x.measureText(t).width,y+62);
    x.fillStyle='#5f6b88';x.font=`500 26px ${F}`;const sub=`มีอยู่ ${s.have}/${s.need}`;x.fillText(sub,1010-x.measureText(sub).width,y+96);
    let yy=y+118;
    if(!miss.length){x.fillStyle='#1e8449';x.font=`700 30px ${F}`;x.fillText('คนครบทุกตำแหน่ง',70,yy+18);}
    miss.forEach((r,i)=>{
      if(i%2===0){x.fillStyle='#f4f6fb';rr(x,56,yy-16,968,48,8);x.fill();}
      x.fillStyle='#0d1b3e';x.font=`600 30px ${F}`;x.fillText(`• ${r.p}`,70,yy+18);
      x.fillStyle='#5f6b88';x.font=`500 26px ${F}`;const m=`มีอยู่ ${r.have}/${r.need}`;
      x.fillStyle='#c0392b';x.font=`800 30px ${F}`;const g=`ขาด ${r.gap}`;const gw2=x.measureText(g).width;x.fillText(g,1010-gw2,yy+18);
      x.fillStyle='#5f6b88';x.font=`500 26px ${F}`;x.fillText(m,1010-gw2-28-x.measureText(m).width,yy+17);
      yy+=52;});
    y+=h+20;
  });
  x.fillStyle='#5f6b88';x.font=`500 24px ${F}`;x.fillText('นับเฉพาะตำแหน่งที่เปิดไว้ · ดูสด: rattanaphaiboon.github.io/app/rattana-manpower.html',50,y+30);
  return cv;
}
let lastBlob=null;
$('btnImg').addEventListener('click',async()=>{
  if(!rows.length)return;
  const b=$('btnImg');b.disabled=true;b.textContent='กำลังทำรูป…';
  try{const cv=await drawReport();lastBlob=await new Promise(r=>cv.toBlob(r,'image/png'));$('imgPrev').src=URL.createObjectURL(lastBlob);$('imgModal').classList.add('open');$('btnSave').focus()}
  catch(e){showToast('ทำรูปไม่สำเร็จ','error')}
  finally{b.disabled=false;b.textContent='📷 ส่งรูปเข้า LINE'}
});
$('btnSave').addEventListener('click',async()=>{
  if(!lastBlob)return;
  const d=asOf||new Date();const name=`กำลังคน-${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}.png`;
  const file=new File([lastBlob],name,{type:'image/png'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:'สรุปกำลังคน'});return}catch(e){if(e.name==='AbortError')return}}
  const a=document.createElement('a');a.href=URL.createObjectURL(lastBlob);a.download=name;document.body.appendChild(a);a.click();a.remove();showToast('บันทึกรูปแล้ว ✓','success');
});
const closeModal=()=>$('imgModal').classList.remove('open');
$('btnClose').addEventListener('click',closeModal);
$('imgModal').addEventListener('click',e=>{if(e.target.id==='imgModal')closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});

/* ---------- misc ---------- */
$('btnRefresh').addEventListener('click',async()=>{const b=$('btnRefresh');b.disabled=true;const ok=await load(true);b.disabled=false;showToast(ok?'อัปเดตแล้ว ✓':'ดึงข้อมูลไม่สำเร็จ',ok?'success':'error')});
const THEME_KEY='rattana_theme';
function applyTheme(t){document.body.classList.toggle('dark',t==='dark');$('themeBtn').textContent=t==='dark'?'☀️':'🌙'}
$('themeBtn').addEventListener('click',()=>{const n=document.body.classList.contains('dark')?'light':'dark';try{localStorage.setItem(THEME_KEY,n)}catch(e){}applyTheme(n)});
try{applyTheme(localStorage.getItem(THEME_KEY)||'light')}catch(e){applyTheme('light')}
window.addEventListener('scroll',()=>$('backToTop').classList.toggle('show',window.scrollY>300),{passive:true});
$('backToTop').addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));

(function start(){
  try{const c=JSON.parse(localStorage.getItem('rattana_manpower_live')||'null');if(c&&c.list){setRows(c.list);asOf=new Date(c.when);render();setStatus('warn','กำลังดึงข้อมูลล่าสุด…')}}catch(e){}
  load(false);
  setInterval(()=>{if(!document.hidden)load(false)},REFRESH_SEC*1000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)load(false)});
})();
</script>
