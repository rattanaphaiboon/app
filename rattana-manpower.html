<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Rattana กำลังคน v1.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0d1b3e;--navy-mid:#1a2f5e;--navy-light:#243b73;--gold:#c9a84c;--gold-light:#e8c86a;
  --success:#1e9e5a;--danger:#d63a2c;--warning:#f39c12;--info:#3498db;
  --bg:#f4f6fb;--text:#0d1b3e;--card-bg:#ffffff;--border:#dde3f0;--muted:#5f6b88;--row-alt:#fafbfd;
  --gap-bg:#fde8e6;--gap-fg:#c0392b;--ok-bg:#e6f6ec;--ok-fg:#1e8449;--track:#e7ebf4;
  --radius-sm:6px;--radius-md:12px;--radius-lg:16px;
  --shadow-md:0 2px 8px rgba(0,0,0,.08);
  --c-W1:#f1c40f;--c-W2:#3498db;--c-W3:#e74c3c;--c-W4:#27ae60;--c-C4:#16a085;--c-HQ:#5d6d7e;
}
body.dark{
  --bg:#05080f;--text:#ffffff;--card-bg:#0d1b3e;--border:#1f3563;--muted:#b8c2dc;--row-alt:#0a1226;
  --gap-bg:transparent;--gap-fg:#ff8a7e;--ok-bg:transparent;--ok-fg:#7be0a3;--track:#1f3563;--c-HQ:#9aa9bd;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Sarabun',Tahoma,sans-serif;font-size:15px;line-height:1.5;min-height:100dvh;overflow-x:hidden;background:var(--bg);color:var(--text);transition:background .25s,color .25s}
button{font-family:inherit;cursor:pointer;border:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.num{font-variant-numeric:tabular-nums}

/* header */
header{background:var(--navy);color:#fff;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:10px;border-bottom:3px solid var(--gold)}
.logo-text{font-weight:800;letter-spacing:1.2px;font-size:18px;color:#fff;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo-text span{color:var(--gold)}
.logo-text small{font-size:11px;font-weight:500;letter-spacing:0;color:rgba(255,255,255,.55);margin-left:6px}
.icon-btn{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.25);height:38px;min-width:38px;padding:0 10px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;gap:5px;font-size:14px;font-weight:600;transition:background .15s}
.icon-btn:hover{background:rgba(255,255,255,.12)}
.icon-btn:disabled{opacity:.5}
.icon-btn .ic{display:inline-block;transition:transform .6s}
.icon-btn.spin .ic{transform:rotate(360deg)}
.hub-btn{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:var(--radius-sm);padding:5px 10px;font-size:13px;font-weight:600;text-decoration:none;white-space:nowrap;min-height:38px}
.hub-btn:hover{background:rgba(255,255,255,.18)}
.hub-btn-icon{width:22px;height:22px;border-radius:5px;flex-shrink:0;background:var(--gold);color:var(--navy);display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
@media(max-width:420px){.lbl-hide,.logo-text small{display:none}.logo-text{font-size:16px;letter-spacing:.4px}header{gap:7px}.sw{font-size:15px}}

.content{max-width:1100px;margin:0 auto;padding:14px;padding-bottom:max(40px,env(safe-area-inset-bottom));display:grid;gap:14px}
@media(min-width:640px){.content{padding:20px;gap:18px}}

/* summary */
.sum{background:var(--card-bg);border:1px solid var(--border);border-top:4px solid var(--gold);border-radius:var(--radius-lg);box-shadow:var(--shadow-md);padding:18px 18px 16px;display:grid;gap:10px}
.sum .q{font-size:16px;font-weight:600;color:var(--muted)}
.sum .big{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sum .big b{font-size:clamp(46px,12vw,64px);line-height:1;font-weight:800;color:var(--gap-fg)}
.sum .big span{font-size:22px;font-weight:700}
.sum .big b.zero{color:var(--ok-fg)}
.sum .line{font-size:16px}
.sum .line b{font-weight:700}
.bar{height:12px;border-radius:99px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--success)}
.status{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--muted);flex-wrap:wrap}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
.status.on .dot{background:var(--success);animation:pulse 2s infinite}
.status.on{color:var(--ok-fg)}
.status.warn .dot{background:var(--warning)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(30,158,90,.55)}70%{box-shadow:0 0 0 8px rgba(30,158,90,0)}100%{box-shadow:0 0 0 0 rgba(30,158,90,0)}}

/* view switch */
.switch{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sw{min-height:52px;border-radius:var(--radius-md);background:var(--card-bg);border:2px solid var(--border);color:var(--text);font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;padding:6px 10px}
.sw.active{background:var(--navy);border-color:var(--gold);color:#fff}
body.dark .sw.active{background:var(--gold);color:var(--navy)}
.sw:focus-visible,.icon-btn:focus-visible,.hub-btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* cards */
.grid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:760px){.grid{grid-template-columns:1fr 1fr;align-items:start}}
.card{background:var(--card-bg);border:1px solid var(--border);border-top:5px solid var(--c,var(--gold));border-radius:var(--radius-md);box-shadow:var(--shadow-md);overflow:hidden}
.card-head{padding:14px 16px 12px;display:grid;gap:8px;border-bottom:1px solid var(--border)}
.ch-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.ch-name{font-size:18px;font-weight:700;min-width:0}
.ch-name small{display:block;font-size:13px;font-weight:500;color:var(--muted)}
.pill{flex:none;font-size:17px;font-weight:800;padding:4px 12px;border-radius:99px;background:var(--gap-bg);color:var(--gap-fg);border:1.5px solid var(--gap-fg);white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok-fg);border-color:var(--ok-fg)}
.ch-sub{font-size:14px;color:var(--muted)}
.rows{list-style:none}
.rows li{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 16px;border-bottom:1px solid var(--border)}
.rows li:last-child{border-bottom:none}
.rows li:nth-child(even){background:var(--row-alt)}
.r-name{font-size:15.5px;font-weight:600;min-width:0}
.r-name small{display:block;font-size:13px;font-weight:400;color:var(--muted)}
.r-gap{flex:none;font-size:16px;font-weight:800;color:var(--gap-fg);white-space:nowrap}
.tag{display:inline-block;font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:99px;margin-left:6px;vertical-align:2px;border:1px solid var(--border);color:var(--muted)}
.okmsg{padding:14px 16px;color:var(--ok-fg);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 14px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;padding:4px 10px;border-radius:99px;border:1px solid var(--border);background:var(--row-alt)}
.chip i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.chip b{color:var(--gap-fg)}
.pos-card{border-top-color:var(--navy-light)}
body.dark .pos-card{border-top-color:var(--gold)}

.note{font-size:13.5px;color:var(--muted);line-height:1.6;padding:2px 4px}
.note b{color:var(--text)}

#backToTop{position:fixed;bottom:max(24px,calc(16px + env(safe-area-inset-bottom)));right:16px;background:var(--gold);color:var(--navy);border-radius:50%;width:46px;height:46px;display:none;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(201,168,76,.35);z-index:90;font-size:18px;font-weight:800}
#backToTop.show{display:flex}
.toast{position:fixed;bottom:max(24px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);padding:12px 20px;border-radius:var(--radius-md);color:#fff;z-index:9999;font-weight:600;font-size:14px;box-shadow:0 8px 24px rgba(13,27,62,.2);max-width:90vw;animation:up .25s ease}
.toast-success{background:var(--success)}.toast-error{background:var(--danger)}.toast-info{background:var(--navy-mid);border-left:3px solid var(--gold)}
@keyframes up{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <span class="logo-text">RATTANA <span>กำลังคน</span><small>v1.0</small></span>
  <button class="icon-btn" id="btnRefresh" type="button" title="ดึงข้อมูลล่าสุด"><span class="ic">⟳</span><span class="lbl-hide">อัปเดต</span></button>
  <button class="icon-btn" id="themeBtn" type="button" title="สลับโหมดสว่าง/มืด">🌙</button>
  <a href="https://rattanaphaiboon.github.io/app/rattana-hub.html" class="hub-btn" title="กลับ Hub"><span class="hub-btn-icon">R</span><span>Hub</span></a>
</header>

<main class="content">
  <section class="sum" aria-live="polite">
    <div class="q">ตอนนี้ขาดพนักงานทั้งหมด</div>
    <div class="big"><b class="num" id="sGap">–</b><span>คน</span></div>
    <div class="line" id="sLine"></div>
    <div class="bar" aria-hidden="true"><i id="sBar" style="width:0"></i></div>
    <div class="status" id="status"><i class="dot"></i><span id="statusTxt">กำลังโหลด…</span></div>
  </section>

  <nav class="switch" aria-label="เลือกมุมมอง">
    <button class="sw active" id="swCenter" type="button" data-v="center">🏢 แยกตามศูนย์</button>
    <button class="sw" id="swPos" type="button" data-v="pos">👤 แยกตามตำแหน่ง</button>
  </nav>

  <section class="grid" id="view"></section>

  <p class="note"><b>วิธีนับ</b> · นับเฉพาะตำแหน่งที่ <b>เปิดไว้</b> (ช่อง L “ตำแหน่ง เปิด/ปิด” = เปิด) ตำแหน่งที่ปิดไว้ไม่นับ<span id="closedTxt"></span> · ในตำแหน่งที่เปิด ถ้าช่อง M = <b>ขาด</b> คือยังไม่มีคน ต้องสรรหาเพิ่ม · ข้อมูลจากชีท 2. ค่างาน › Update ค่างาน</p>
</main>

<button id="backToTop" type="button" title="กลับด้านบน" aria-label="กลับด้านบน">↑</button>

const cEmoji=k=>CENTERS[k]?CENTERS[k].e:'⬜';
const cColor=k=>CENTERS[k]?`var(--c-${k})`:'var(--gold)';
const isSpecial=p=>p==='คนพิการ'||p==='พนักงานฝึกงาน';
const isLead=p=>/หัวหน้า|ผู้จัดการ/.test(p);
const tagOf=p=>isSpecial(p)?'<span class="tag">อัตราพิเศษ</span>':isLead(p)?'<span class="tag">ระดับหัวหน้า</span>':'';
const pad=n=>String(n).padStart(2,'0');
const thDate=d=>`${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()+543}`;
const thTime=d=>`${pad(d.getHours())}.${pad(d.getMinutes())}`;
function showToast(msg,type='info'){const t=document.createElement('div');t.className=`toast toast-${type}`;t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),3000)}

/* ---------- state ---------- */
const VIEW_KEY='rattana_manpower_view';
let view='center';
try{view=localStorage.getItem(VIEW_KEY)||'center'}catch(e){}
let rows=[],closed=SNAP_CLOSED;

function setData(list,closedN){
  rows=list.map(([c,d,p,need,have])=>({c:String(c),d:String(d),p:String(p),need:+need||0,have:+have||0}))
           .map(r=>({...r,gap:Math.max(0,r.need-r.have)}));
  closed=closedN;
  render();
}

/* ---------- render ---------- */
function render(){
  const NEED=sum(rows,r=>r.need),HAVE=sum(rows,r=>r.have),GAP=NEED-HAVE;
  const pct=NEED?HAVE/NEED*100:100;
  $('sGap').textContent=fmt(GAP);
  $('sGap').classList.toggle('zero',!GAP);
  $('sLine').innerHTML=`มีคนแล้ว <b class="num">${fmt(HAVE)}</b> จาก <b class="num">${fmt(NEED)}</b> ตำแหน่งที่เปิดไว้ · บรรจุแล้ว <b class="num">${pct.toFixed(0)}%</b>`;
  $('sBar').style.width=pct+'%';
  $('closedTxt').textContent=` (ปิดไว้ ${fmt(closed)} ตำแหน่ง)`;
  document.querySelectorAll('.sw').forEach(b=>{b.classList.toggle('active',b.dataset.v===view);b.setAttribute('aria-pressed',b.dataset.v===view)});
  $('view').innerHTML=view==='pos'?renderPos():renderCenters();
}

function renderCenters(){
  const keys=[...ORDER,...new Set(rows.map(r=>r.c).filter(k=>!ORDER.includes(k)))].filter(k=>rows.some(r=>r.c===k));
  const stats=keys.map(k=>{const rs=rows.filter(r=>r.c===k);return{k,rs,need:sum(rs,r=>r.need),have:sum(rs,r=>r.have),gap:sum(rs,r=>r.gap)}})
    .sort((a,b)=>b.gap-a.gap||ORDER.indexOf(a.k)-ORDER.indexOf(b.k));
  return stats.map(s=>{
    const pct=s.need?s.have/s.need*100:100;
    const miss=s.rs.filter(r=>r.gap).sort((a,b)=>b.gap-a.gap);
    return `<article class="card" style="--c:${cColor(s.k)}">
      <div class="card-head">
        <div class="ch-top">
          <div class="ch-name">${cEmoji(s.k)} ${esc(s.k)} ${esc(cName(s.k))}</div>
          <div class="pill num${s.gap?'':' ok'}">${s.gap?`ขาด ${s.gap} คน`:'ครบ'}</div>
        </div>
        <div class="ch-sub num">มีคน ${s.have} จาก ${s.need} ตำแหน่ง (${pct.toFixed(0)}%)</div>
        <div class="bar"><i style="width:${pct}%"></i></div>
      </div>
      ${miss.length?`<ul class="rows">${miss.map(r=>`<li><div class="r-name">${esc(r.p)}${tagOf(r.p)}<small class="num">${esc(r.d)} · มีคน ${r.have} จาก ${r.need}</small></div><div class="r-gap num">ขาด ${r.gap}</div></li>`).join('')}</ul>`
        :`<div class="okmsg">✅ คนครบทุกตำแหน่ง</div>`}
    </article>`;
  }).join('');
}

function renderPos(){
  const map={};
  rows.forEach(r=>{if(!r.gap)return;(map[r.p]=map[r.p]||{t:0,need:0,by:{}});map[r.p].t+=r.gap;map[r.p].need+=r.need;map[r.p].by[r.c]=(map[r.p].by[r.c]||0)+r.gap});
  const list=Object.entries(map).sort((a,b)=>b[1].t-a[1].t||a[0].localeCompare(b[0],'th'));
  if(!list.length)return `<article class="card pos-card"><div class="okmsg">✅ ทุกตำแหน่งมีคนครบ</div></article>`;
  return list.map(([p,o])=>{
    const by=Object.entries(o.by).sort((a,b)=>b[1]-a[1]);
    return `<article class="card pos-card">
      <div class="card-head" style="border-bottom:none">
        <div class="ch-top"><div class="ch-name">${esc(p)}${tagOf(p)}</div><div class="pill num">ขาด ${o.t} คน</div></div>
      </div>
      <div class="chips">${by.map(([k,n])=>`<span class="chip" style="--c:${cColor(k)}"><i></i>${esc(k)} ${esc(cName(k).replace('ศูนย์',''))} <b class="num">${n}</b></span>`).join('')}</div>
    </article>`;
  }).join('');
}

/* ---------- status ---------- */
function setStatus(kind,txt){const s=$('status');s.className='status '+kind;$('statusTxt').textContent=txt}

/* ---------- load ---------- */
let lastOk=0,loading=false;
const withTimeout=(p,ms)=>Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),ms))]);

async function loadData(fresh){
  if(!CONFIG.gasUrl){
    setData(SNAP,SNAP_CLOSED);
    setStatus('warn',`ข้อมูล ณ ${SNAP_DATE} · ยังไม่ได้เชื่อมชีทแบบสด`);
    return false;
  }
  if(loading)return false;
  loading=true;
  try{
    const url=CONFIG.gasUrl+'?action=data'+(fresh?'&fresh=1':'')+'&t='+Date.now();
    const res=await withTimeout(fetch(url),25000);
    const out=await res.json();
    if(!out.ok||!Array.isArray(out.rows))throw new Error(out.error||'ข้อมูลผิดรูปแบบ');
    setData(out.rows,out.closed||0);
    const d=out.updated?new Date(out.updated):new Date();
    lastOk=d.getTime();
    try{localStorage.setItem('rattana_manpower_cache',JSON.stringify(out))}catch(e){}
    setStatus('on',`ข้อมูลสดจากชีท · อัปเดต ${thDate(d)} ${thTime(d)} น. · ดึงใหม่ทุก 1 นาที`);
    return true;
  }catch(err){
    if(!rows.length)setData(SNAP,SNAP_CLOSED);
    setStatus('warn',lastOk?`เชื่อมชีทไม่สำเร็จ · แสดงตัวเลขล่าสุดเมื่อ ${thTime(new Date(lastOk))} น.`:`เชื่อมชีทไม่สำเร็จ · แสดงข้อมูล ณ ${SNAP_DATE}`);
    return false;
  }finally{loading=false}
}

/* ---------- events ---------- */
document.querySelectorAll('.sw').forEach(b=>b.addEventListener('click',()=>{
  view=b.dataset.v;try{localStorage.setItem(VIEW_KEY,view)}catch(e){}
  render();
}));
$('btnRefresh').addEventListener('click',async()=>{
  const b=$('btnRefresh');b.disabled=true;b.classList.add('spin');
  const ok=await loadData(true);
  setTimeout(()=>{b.classList.remove('spin');b.disabled=false},600);
  if(CONFIG.gasUrl)showToast(ok?'อัปเดตเรียบร้อย ✓':'ดึงข้อมูลไม่สำเร็จ ลองใหม่อีกครั้ง',ok?'success':'error');
  else showToast(`ยังไม่ได้เชื่อมชีท · แสดงข้อมูล ณ ${SNAP_DATE}`,'info');
});

/* theme (ใช้ key เดียวกับทุกแอป Rattana) */
const THEME_KEY='rattana_theme';
function applyTheme(t){document.body.classList.toggle('dark',t==='dark');$('themeBtn').textContent=t==='dark'?'☀️':'🌙'}
$('themeBtn').addEventListener('click',()=>{const n=document.body.classList.contains('dark')?'light':'dark';try{localStorage.setItem(THEME_KEY,n)}catch(e){}applyTheme(n)});
try{applyTheme(localStorage.getItem(THEME_KEY)||'light')}catch(e){applyTheme('light')}

window.addEventListener('scroll',()=>$('backToTop').classList.toggle('show',window.scrollY>300),{passive:true});
$('backToTop').addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));

/* start: แสดงแคชล่าสุดทันที แล้วค่อยดึงใหม่ */
(function start(){
  let cached=null;
  if(CONFIG.gasUrl){try{cached=JSON.parse(localStorage.getItem('rattana_manpower_cache')||'null')}catch(e){}}
  if(cached&&cached.ok&&Array.isArray(cached.rows)){setData(cached.rows,cached.closed||0);setStatus('warn','กำลังดึงข้อมูลล่าสุด…')}
  else setData(SNAP,SNAP_CLOSED);
  loadData(false);
  if(CONFIG.gasUrl)setInterval(()=>{if(!document.hidden)loadData(false)},CONFIG.refreshSec*1000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&CONFIG.gasUrl&&Date.now()-lastOk>CONFIG.refreshSec*1000)loadData(false)});
})();
</script>
</body>
