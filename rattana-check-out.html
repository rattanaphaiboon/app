<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d1b3e">
<title>Rattana Check Out v2.7</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  /* ===== Front-end aligned with D-MAN / จัดรถ — Kanit font · D-MAN design system · palette: navy #0d1b3e + gold #c9a84c ===== */
  :root{
    --navy:#0d1b3e; --navy-mid:#1a2f5e; --navy-light:#243b73;
    --gold:#c9a84c; --gold-light:#e0c47e; --gold-soft:rgba(201,168,76,.18); --gold-ink:#8b6f21;
    --success:#2ecc71; --danger:#e74c3c; --warning:#f39c12; --info:#3498db;
    --bg:#f4f6fb; --text:#0d1b3e; --card-bg:#ffffff; --border:#dde3f0;
    --muted:#6b7896; --row-alt:#fafbfd;
    --radius-sm:6px; --radius-md:12px; --radius-lg:16px; --radius-xl:20px;
    --shadow-sm:0 1px 4px rgba(0,0,0,.06); --shadow-md:0 2px 8px rgba(0,0,0,.08);
    --shadow-lg:0 8px 24px rgba(13,27,62,.12); --shadow-gold:0 4px 12px rgba(201,168,76,.35);
    --font-head:'Kanit',sans-serif; --font-body:'Kanit',sans-serif; --font-mono:'Kanit',sans-serif;
    /* legacy aliases (คงชื่อเดิมไว้ให้โค้ดในไฟล์ทำงานต่อได้) */
    --card:var(--card-bg); --navy2:var(--navy-mid); --gold-d:var(--gold-ink); --red:var(--danger);
    --w1:#FBBF24; --w2:#0EA5E9; --w3:#EF4444; --w4:#15803D; --c4:#4ADE80; --hq:#C9A84C;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100dvh}
  body{font-family:var(--font-body);font-size:14px;line-height:1.5;background:var(--bg);color:var(--text);-webkit-tap-highlight-color:transparent;overflow-x:hidden;padding-bottom:env(safe-area-inset-bottom)}
  button{font-family:inherit;cursor:pointer;border:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
  input,select,textarea{font-family:inherit;font-size:16px}
  h1,h2,h3,h4{font-family:var(--font-head);font-weight:700}
  a{color:inherit}

  /* ===== Login ===== */
  #loginScreen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;background:linear-gradient(135deg,var(--navy) 0%,var(--navy-mid) 100%);color:#fff;z-index:100}
  .login-card{background:rgba(255,255,255,.07);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.15);border-radius:var(--radius-xl);padding:32px 28px;max-width:380px;width:100%;text-align:center;border-top:4px solid var(--gold)}
  .login-logo{width:80px;height:80px;border-radius:20px;margin:0 auto 14px;background:var(--navy-mid);color:var(--gold);display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:700;box-shadow:0 0 26px rgba(201,168,76,.35)}
  .login-card h1{font-size:24px;letter-spacing:1px;margin-bottom:6px;color:#fff}
  .login-card h1 span{color:var(--gold)}
  .login-card .sub{color:rgba(255,255,255,.7);font-size:13px;margin-bottom:20px}
  #googleSignInBtn{display:flex;justify-content:center;margin:16px 0}
  .login-bypass{background:var(--gold);color:var(--navy);border-radius:var(--radius-sm);padding:11px 18px;width:100%;font-size:14px;font-weight:700;margin-top:8px}
  #loginError{display:none;color:#ffb3ad;background:rgba(231,76,60,.15);border:1px solid rgba(231,76,60,.4);padding:10px 14px;border-radius:var(--radius-sm);font-size:13px;margin-top:14px;text-align:left}
  #loginSpinner{display:none;margin-top:14px;color:rgba(255,255,255,.7)}
  .login-ver{margin-top:18px;font-size:11px;color:rgba(255,255,255,.5)}

  /* ===== App shell (D-MAN header + tab-nav pattern) ===== */
  #app{display:none}
  header.appbar{background:var(--navy);color:#fff;padding:10px 14px;position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:10px;padding-top:max(10px,env(safe-area-inset-top))}
  header.appbar .logo-text,header.appbar .title{font-family:var(--font-head);font-weight:700;letter-spacing:.5px;font-size:16px;white-space:nowrap;flex-shrink:0;display:flex;align-items:center;gap:6px;color:#fff}
  header.appbar .logo-text span{color:var(--gold)}
  header.appbar .ver{background:var(--gold);color:var(--navy);font-size:10.5px;font-weight:700;padding:1px 8px;border-radius:20px;margin-left:6px}
  header.appbar .spacer{flex:1}
  header.appbar .who{font-size:11px;color:#cbd5e1;text-align:right;line-height:1.3;min-width:0;max-width:38vw;overflow:hidden;text-overflow:ellipsis}
  .icon-btn{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.22);width:36px;height:36px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-size:16px;text-decoration:none;flex:none}
  @media(hover:hover){.icon-btn:hover{background:rgba(255,255,255,.12)}}
  .hub-btn{background:var(--gold);color:var(--navy);border:none;border-radius:var(--radius-sm);padding:6px 10px;font-weight:700;font-size:12.5px;display:flex;align-items:center;gap:4px;text-decoration:none;flex:none}

  /* Tab nav — icon-card style (top on desktop, fixed bottom on mobile) */
  nav.bottomnav{display:flex;background:var(--navy);padding:8px;gap:6px;overflow-x:auto;scrollbar-width:none}
  nav.bottomnav::-webkit-scrollbar{display:none}
  nav.bottomnav .bn{background:rgba(255,255,255,.06);color:rgba(255,255,255,.7);padding:8px 14px;font-size:12px;font-weight:600;border-radius:var(--radius-md);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;white-space:nowrap;transition:all .18s;min-width:80px;position:relative;border:none;border-top:none}
  nav.bottomnav .bn span{font-size:20px;line-height:1}
  @media(hover:hover){nav.bottomnav .bn:hover{color:#fff;background:rgba(255,255,255,.13)}}
  nav.bottomnav .bn.active{color:var(--navy);background:var(--gold);font-weight:700;box-shadow:0 3px 10px rgba(201,168,76,.4);border-top:none}
  @media(max-width:639px){
    nav.bottomnav{position:fixed;bottom:0;left:0;right:0;top:auto;padding:6px 4px max(6px,env(safe-area-inset-bottom)) 4px;z-index:1200;box-shadow:0 -4px 16px rgba(0,0,0,.2);gap:4px;overflow-x:visible}
    nav.bottomnav .bn{flex:1;min-width:0;min-height:56px;padding:6px 4px;font-size:11px;line-height:1.15}
    nav.bottomnav .bn span{font-size:22px}
  }

  .wrap{padding:12px;max-width:980px;margin:0 auto;width:100%}
  @media(max-width:639px){.wrap{padding:12px 10px calc(96px + env(safe-area-inset-bottom))}}
  .panel{display:none;animation:fadeIn .2s}
  .panel.active{display:block}
  @keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

  /* ===== D-MAN design-system primitives (cards / buttons / badges / forms / pills) ===== */
  .card{background:var(--card-bg);border-radius:var(--radius-md);border:1px solid var(--border);box-shadow:var(--shadow-md);margin-bottom:8px}
  .card-gold{border-top:2px solid var(--gold)}
  .card-danger{border-top:2px solid var(--danger)}
  .card-success{border-top:2px solid var(--success)}
  .card-head{display:flex;align-items:center;justify-content:space-between;padding:7px 10px;border-bottom:1px solid var(--border);background:linear-gradient(to right,var(--gold-soft),transparent);gap:6px;flex-wrap:wrap;border-radius:var(--radius-md) var(--radius-md) 0 0}
  .card-head h3{font-size:14px}
  .card-body{padding:9px 10px}
  .card-foot{padding:7px 10px;border-top:1px solid var(--border);display:flex;gap:6px;flex-wrap:wrap;border-radius:0 0 var(--radius-md) var(--radius-md)}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;cursor:pointer;border:1px solid transparent;min-height:42px;transition:opacity .15s,transform .1s}
  @media(hover:hover){.btn:hover{opacity:.88}}
  .btn:active{transform:scale(.97)}
  .btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
  .btn-primary{background:var(--navy);color:#fff;border-color:var(--navy)}
  .btn-gold{background:var(--gold);color:var(--navy);border-color:var(--gold);font-weight:700}
  .btn-outline{background:transparent;color:var(--text);border-color:var(--border)}
  .btn-danger{background:var(--danger);color:#fff}
  .btn-success{background:var(--success);color:#fff}
  .btn-sm{padding:5px 10px;font-size:12px;min-height:32px}
  .btn-lg{padding:14px 22px;font-size:15px;min-height:52px;border-radius:var(--radius-md)}
  .btn-block{width:100%}

  .badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;white-space:nowrap}
  .badge-ok{background:#e8f7ee;color:#1e8449}
  .badge-warn{background:#fef3d7;color:#a87800}
  .badge-danger{background:#ffd5d0;color:#c0392b}
  .badge-info{background:#e3f0fd;color:#1a6fb8}
  .badge-gold{background:var(--gold-soft);color:var(--gold-ink);border:1px solid var(--gold)}

  .field{display:flex;flex-direction:column;gap:3px;margin-bottom:8px;min-width:0}
  .field>label{font-size:10px;font-weight:600;color:var(--muted);letter-spacing:.3px;text-transform:uppercase}
  .input{height:38px;padding:0 10px;border-radius:var(--radius-sm);border:1.5px solid var(--border);background:var(--card-bg);color:var(--text);font-size:16px;width:100%;max-width:100%;box-sizing:border-box;transition:border-color .15s;outline:none}
  .input:focus{border-color:var(--gold)}

  .pills{display:flex;gap:8px;flex-wrap:wrap}
  .pill{padding:8px 14px;border-radius:999px;border:1.5px solid var(--border);background:var(--card-bg);color:var(--text);font-size:13px;font-weight:600;cursor:pointer;min-height:38px}
  .pill.active{background:var(--navy);color:#fff;border-color:var(--navy)}
  .pill.gold.active{background:var(--gold);color:var(--navy);border-color:var(--gold)}
  /* scanbar (ชุดเดียวกับ Picker v3.32) */
  .scanbar{display:flex;align-items:center;gap:7px;background:var(--card);border:1.5px solid var(--border);border-radius:12px;padding:5px 6px 5px 13px;margin-bottom:11px;box-shadow:0 2px 10px rgba(13,27,62,.06);position:sticky;top:52px;z-index:30}
  .scanbar:focus-within{border-color:var(--gold);box-shadow:0 2px 12px rgba(201,168,76,.22)}
  .scanbar .sb-ico{font-size:16px;opacity:.5;flex:none}
  .scanbar input{flex:1;min-width:60px;width:100%;font-size:16px;padding:11px 2px;border:none;outline:none;font-family:inherit;background:transparent;color:var(--navy)}
  .scanbar .sb-x{flex:none;display:none;background:#e2e8f0;border:none;color:#475569;font-size:13px;line-height:1;cursor:pointer;padding:6px 9px;border-radius:50%;font-family:inherit}
  .scanbar .sb-x.on{display:block}
  .scanbar .sb-find{flex:none;background:var(--navy);color:#fff;border:none;border-radius:9px;padding:11px 14px;font-weight:700;font-size:14px;font-family:inherit;white-space:nowrap}
  .scanbar .sb-cam{flex:none;background:#fff;color:var(--navy);border:1.5px solid var(--navy);border-radius:9px;padding:10px 11px;font-weight:700;font-size:13.5px;font-family:inherit;white-space:nowrap}
  @media(max-width:560px){ .scanbar .sb-find{padding:11px 11px} .scanbar .sb-cam{padding:10px 9px;font-size:13px} }
  #co-qr-reader,#mtf-qr-reader{border-radius:12px;overflow:hidden;margin-bottom:10px}
  /* card / list */
  .scan-card{background:#fff;border:1.5px solid var(--gold);border-radius:14px;padding:13px;margin-bottom:11px;box-shadow:0 4px 16px rgba(201,168,76,.15)}
  .pname{font-weight:800;font-size:16px;color:var(--navy);line-height:1.3}
  .pbar{font-size:12px;color:var(--muted);margin-top:3px}
  .ord{font-size:13.5px}
  .dist{background:#f8fafc;border:1px solid var(--border);border-radius:10px;padding:8px 10px}
  .dist-h{font-size:12px;font-weight:800;color:var(--navy);margin-bottom:5px}
  .recv-box{display:flex;gap:9px;align-items:center;margin-top:5px}
  .recv-box input{flex:1;text-align:center;font-size:24px;font-weight:800;padding:10px;border:2px solid var(--gold);border-radius:12px;font-family:inherit;color:var(--navy);min-width:70px;outline:none}
  .stp{width:54px;height:54px;font-size:26px;border:none;border-radius:12px;background:var(--navy);color:#fff;font-weight:800;flex:none}
  .chip{background:#eef1f7;border:none;border-radius:20px;padding:9px 15px;font-size:13.5px;font-weight:700;color:#475569;white-space:nowrap;font-family:inherit}
  .scan-btn{padding:11px 16px;border-radius:10px;border:none;font-weight:800;font-size:14px;font-family:inherit;background:#e2e8f0;color:var(--navy)}
  .scan-btn.gold{background:var(--gold);color:var(--navy)}
  .scan-btn.gray{background:#e2e8f0;color:#475569}
  .scan-btn:disabled{opacity:.5;cursor:not-allowed}
  .ico-btn{background:#eef1f7;border:none;border-radius:8px;padding:8px 11px;font-size:15px;cursor:pointer}
  .row-sel{background:#fff;border:1px solid var(--border);border-radius:12px;padding:9px 12px;margin-bottom:9px;display:flex}
  body.no-select, body.no-select *{user-select:none}   /* ระหว่างลากติ๊ก — กันไฮไลท์ข้อความในเซลล์ */
  .tbl-wrap{background:#fff;border:1px solid var(--border);border-radius:12px;overflow:auto;max-height:62vh}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{position:sticky;top:0;background:var(--navy);color:#fff;padding:8px 8px;font-size:11.5px;text-align:center;white-space:nowrap;z-index:2}
  td{padding:8px 8px;border-top:1px solid var(--border);text-align:center}
  .num{text-align:center}
  .empty{background:#fff;border:1.5px dashed var(--border);border-radius:12px;padding:26px 14px;text-align:center;color:var(--muted);font-size:13.5px}
  .muted{color:var(--muted)}
  .scan-reject{background:#fef2f2;border:1.5px solid #fca5a5;color:#b91c1c;border-radius:12px;padding:12px 13px;font-weight:700;margin-bottom:10px;font-size:14px}
  .scan-reject span{display:block;font-size:12px;font-weight:500;margin-top:3px}
  .scan-stat{font-size:11px;border-radius:12px;padding:2px 9px;font-weight:700}
  .scan-stat.saved{background:#dcfce7;color:#166534}
  .scan-stat.dirty{background:#fef9c3;color:#854d0e}
  .recon{border-radius:10px;padding:9px 12px;font-size:13px}
  .cut-row td{opacity:.55}
  .alloc-cut{font-size:11px;color:#b91c1c;font-weight:700}
  .dup-note{background:#eff6ff;border:1px solid #93c5fd;color:#1d4ed8;border-radius:8px;padding:6px 10px;margin:6px 0;font-size:12.5px;font-weight:700}
  .cap-warn{background:#fef2f2;border:1px solid #fca5a5;color:#b91c1c;border-radius:8px;padding:5px 10px;font-size:12px;font-weight:700;margin-top:4px}
  .recon.ok{background:#ecfdf5;border:1px solid #86efac;color:#166534}
  #toast{display:none;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(82px + env(safe-area-inset-bottom));background:var(--navy);color:#fff;border-radius:12px;padding:11px 18px;font-size:13.5px;font-weight:600;z-index:2000;box-shadow:0 8px 30px rgba(0,0,0,.35);max-width:92vw}
  #loadOverlay{display:none;position:fixed;inset:0;background:rgba(13,27,62,.55);z-index:1900;align-items:center;justify-content:center}
  #loadOverlay .box{background:#fff;border-radius:14px;padding:20px 26px;font-weight:700;color:var(--navy)}
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-card">
    <div class="login-logo">📷</div>
    <h1>Rattana <span>Check Out</span></h1>
    <div class="sub">ยิงเช็คสินค้าออก · ยิงโอนย้าย (มือถือ)</div>
    <div id="googleSignInBtn"></div>
    <button class="login-bypass" onclick="bypassLogin()">เข้าแบบพรีวิว (ไม่บันทึกชื่อจริง)</button>
    <div id="loginSpinner">⏳ กำลังเข้าสู่ระบบ…</div>
    <div id="loginError"></div>
    <div class="login-ver">เวอร์ชัน v2.7 · หลังบ้านเดียวกับ Pre-order Picker</div>
  </div>
</div>

<div id="app">
  <header class="appbar">
    <div class="logo-text">📷 Rattana <span>Check Out</span></div>
    <span class="ver">v2.7</span>
    <div class="spacer"></div>
    <div class="who" id="whoBox"></div>
    <a class="hub-btn" href="https://rattanaphaiboon.github.io/app/rattana-hub.html">← Hub</a>
  </header>
  <nav class="bottomnav">
    <button class="bn" data-bn="tf" onclick="switchTab('tf')"><span>📦</span>โอน Non-CS</button>
    <button class="bn active" data-bn="co" onclick="switchTab('co')"><span>📤</span>เช็คออก</button>
    <button class="bn" data-bn="scan" onclick="switchTab('scan')"><span>🔁</span>โอนย้าย</button>
  </nav>
  <div class="wrap">
    <div id="panel-co" class="panel active"></div>
    <div id="panel-scan" class="panel"></div>
    <div id="panel-tf" class="panel"></div>
  </div>
</div>

<div id="toast"></div>
<div id="loadOverlay"><div class="box" id="loadMsg">กำลังโหลด…</div></div>

<script>

function parseUnit(u){
  const m = String(u||'').match(/x\s*(\d+)\s*\(([A-Za-z]+)\)/i);
  if (m){ const c=m[2].toUpperCase(); const level=/CS/.test(c)?'CS':/BP/.test(c)?'BP':/PA/.test(c)?'PA':'EA'; return { eaPer:parseInt(m[1],10)||1, level }; }
  if (/ลัง/.test(u)) return { eaPer:1, level:'CS' };
  if (/แพ็ค/.test(u)) return { eaPer:1, level:'PA' };
  return { eaPer:1, level:'EA' };
}

/* ═══════════ v2.7 — ยิงหน่วยไหนก็ได้ แล้วรวมยอดเป็น EA (Surat: "จัดมา 2 ลัง ลังละ 6 แพ็ค ยิง 12 แพ็ค ต้องขึ้นครบ") ═══════════
 * หน่วยภายใน = EA เสมอ · ทุกอัตราแปลงมาจาก PDDT (QTY CS/PA/BP) ไม่ใช่เลขในสตริงหน่วยของบิล
 *   → ยิงหน่วยเดียวกับบิลก็ได้ผลเท่าเดิมเป๊ะ · ยิงคนละหน่วยก็บวกเข้ากองเดียวกันถูกต้อง
 * PDDT ไม่มี QTY ของหน่วยนั้น (0/ว่าง) → fallback เลขในสตริงหน่วย (พฤติกรรมเดิม) */
const UNIT_TH={CS:'ลัง',BP:'Big Pack',PA:'แพ็ค',EA:'ชิ้น'};
function eaPerOf(prod, level, fallback){
  const f=Math.max(1, +fallback||1);
  if(!prod) return f;
  const q = level==='CS'?+prod.qtyCS : level==='BP'?+prod.qtyBP : level==='PA'?+prod.qtyPA : 1;
  return (q>0) ? q : f;
}
/* บาร์โค้ดที่ยิง = หน่วยไหน (จาก PDDT) → {level, eaPer} · ไม่รู้จัก → null */
function unitOfBarcode(code){
  const c=String(code||'').trim(), p=(DATA.prodIdx||{})[c]; if(!p) return null;
  if(String(p.codeCS||'').trim()===c) return {level:'CS', eaPer:eaPerOf(p,'CS',1), prod:p};
  if(String(p.codeBP||'').trim()===c) return {level:'BP', eaPer:eaPerOf(p,'BP',1), prod:p};
  if(String(p.codePA||'').trim()===c) return {level:'PA', eaPer:eaPerOf(p,'PA',1), prod:p};
  if(String(p.codeEA||'').trim()===c) return {level:'EA', eaPer:1, prod:p};
  return null;
}
/* EA → ข้อความหน่วยที่คนอ่านรู้เรื่อง "2 ลัง 3 แพ็ค" · ไม่ยกหน่วยใหญ่เกิน "หน่วยของเอกสาร" (topLevel)
 * เช่น ใบโอน Non-CS หน่วยเป็นแพ็ค → 72 ชิ้น ต้องอ่านว่า "12 แพ็ค" ไม่ใช่ "2 ลัง" (ของที่โอนคือแพ็คจริงๆ) */
function fmtEaUnits(ea, prod, topLevel, topEaPer){
  let r=Math.max(0, Math.round(+ea||0)); if(!r) return '0';
  const lv=['CS','BP','PA','EA'], from=Math.max(0, lv.indexOf(topLevel||'CS')), out=[];
  for(let k=from;k<lv.length;k++){
    const u=lv[k], per=(u===topLevel)?eaPerOf(prod,u,topEaPer):eaPerOf(prod,u,0);
    if(u!=='EA' && !(per>1)) continue;
    const n=(u==='EA')?r:Math.floor(r/per);
    if(n>0){ out.push(n+' '+UNIT_TH[u]); r-=(u==='EA')?r:n*per; }
    if(r<=0) break;
  }
  return out.length?out.join(' '):'0';
}
/* อธิบายอัตราแปลงในทิศที่คนอ่านเข้าใจ — "1 ลัง = 6 แพ็ค" (ไม่ใช่ 1 แพ็ค = 0.17 ลัง) */
function unitRatioText(aLv, aPer, bLv, bPer){
  const [big,bigPer,small,smallPer] = (aPer>=bPer) ? [aLv,aPer,bLv,bPer] : [bLv,bPer,aLv,aPer];
  const n=Math.round(bigPer/smallPer*100)/100;
  return `1 ${UNIT_TH[big]||big} = ${n} ${UNIT_TH[small]||small}`;
}
/* ยอดที่ยิงของ 1 รายการ = ผลรวมทุกหน่วยที่ยิง (units:{CS:2,PA:3}) → EA */
function pickedEa(p){
  if(!p) return 0;
  if(p.units && typeof p.units==='object'){
    const prod=(DATA.prodIdx||{})[String(p.barcode||'').trim()]||null;
    let s=0; Object.keys(p.units).forEach(u=>{ const n=+p.units[u]||0; if(n>0) s += n*eaPerOf(prod,u,(u===p.level?p.eaPer:1)); });
    return Math.round(s);
  }
  return Math.round((+p.qty||0) * Math.max(1,+p.eaPer||1));   // แถวเก่า (ก่อน v2.7) — qty อยู่ในหน่วยของบิล
}

async function gvizFetch(sheetId, opt){
  opt=opt||{};
  const parts=[];
  if(opt.gid!=null&&opt.gid!=='') parts.push('gid='+opt.gid);
  else if(opt.sheet) parts.push('sheet='+encodeURIComponent(opt.sheet));
  const hdr = (opt.headers!=null) ? opt.headers : 1;
  parts.push('headers='+hdr);
  if(opt.tq) parts.push('tq='+encodeURIComponent(opt.tq));
  if(opt.bust) parts.push('_cb='+Date.now());
  const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json&${parts.join('&')}`;
  const res = await fetch(url);
  if(!res.ok) throw new Error('โหลดชีทไม่สำเร็จ ('+res.status+')');
  const text = await res.text();
  const json = JSON.parse(text.replace(/^[^(]+\(/,'').replace(/\);?\s*$/,''));
  const cols = (json.table.cols||[]).map(c=>c.label||c.id||'');
  const rows = json.table.rows||[];
  const cv = c => {
    if(!c) return '';
    if(c.f!=null && c.f!=='') return String(c.f).trim();
    let v=c.v; if(v==null) return '';
    if(typeof v==='string' && /^Date\(/.test(v)){
      const m=v.match(/Date\((-?\d+),(\d+),(\d+)/);
      if(m) return `${+m[1]}/${String(+m[2]+1).padStart(2,'0')}/${String(+m[3]).padStart(2,'0')}`;
    }
    return String(v).trim();
  };
  const matrix = rows.map(r => (r.c||[]).map(cv));
  return { cols, matrix };
}
function asObjects({cols,matrix}){
  return matrix.map(r=>{ const o={}; cols.forEach((h,i)=>{ if(h&&o[h]===undefined) o[h]=r[i]||''; }); return o; });
}

function showLoginError(m){ const e=document.getElementById('loginError'); e.innerHTML=String(m).replace(/\n/g,'<br>'); e.style.display='block'; }
const AUTH_KEY='mp_auth_v1', AUTH_TTL=30*864e5;
function saveAuth(u){ try{ localStorage.setItem(AUTH_KEY,JSON.stringify({u,ts:Date.now()})); }catch(e){} }
function loadAuth(){ try{ const o=JSON.parse(localStorage.getItem(AUTH_KEY)||'null'); if(o&&o.u&&o.ts&&(Date.now()-o.ts<AUTH_TTL)) return o.u; }catch(e){} return null; }
function logout(){ try{ localStorage.removeItem(AUTH_KEY); }catch(e){} try{ if(window.google&&google.accounts) google.accounts.id.disableAutoSelect(); }catch(e){} location.reload(); }
function passesGate(u){ const role=parseInt(u&&u.role)||0; const dept=String((u&&u.dept)||'').trim(); return role>=CONFIG.minRole || (CONFIG.adminDepts||[]).includes(dept); }
function initGoogleSignIn(){
  if(!window.google||!window.google.accounts){ setTimeout(initGoogleSignIn,300); return; }
  google.accounts.id.initialize({ client_id:CONFIG.clientId, callback:handleGoogleCredential, auto_select:false });

  if(btn) google.accounts.id.renderButton(btn,{type:'standard',theme:'outline',size:'large',text:'signin_with',shape:'rectangular',width:300});

async function handleGoogleCredential(resp){
  document.getElementById('loginSpinner').style.display='block';
  document.getElementById('loginError').style.display='none';
  try{
    const p = JSON.parse(atob(resp.credential.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));
    const email = normalizeEmail(p.email);
    if(!email) throw new Error('ไม่พบ email จาก Google');
    const users = asObjects(await gvizFetch(CONFIG.usersId,{sheet:CONFIG.usersTab}));
    const u = users.find(x=>normalizeEmail(x['E-mail']||x['Email']||'')===email);
    if(!u) throw new Error(`ไม่พบบัญชี ${email} ในระบบ\nติดต่อผู้ดูแลเพื่อเพิ่มอีเมล`);
    const role = parseInt(u['User Role'])||3;
    const dept = String(u['แผนก']||'').trim();
    const cu = { email, name:u['ชื่อ - สกุล']||email, role, wh:u['คลังส่ง']||u['W']||'', dept };
    if(!passesGate(cu)) throw new Error(`สิทธิ์ไม่พอ (Role ${role}${dept?' · '+dept:''})\nแอปนี้สำหรับ Role ${CONFIG.minRole}+ หรือแผนก ${(CONFIG.adminDepts||[]).join('/')}`);
    currentUser = cu;
    saveAuth(currentUser);
    enterApp();
  }catch(e){
    showLoginError(e.message||'เข้าสู่ระบบไม่สำเร็จ');
    document.getElementById('loginSpinner').style.display='none';
  }
}

async function loadProducts(){
  const {cols,matrix} = await gvizFetch(CONFIG.productId,{sheet:CONFIG.productTab});
  const ci = name => cols.indexOf(name);
  const C = {name:ci('PRODUCT NAME'),short:ci('SHORT NAME'),
    cEA:ci('CODE EA'),cPA:ci('CODE PA'),cBP:ci('CODE BP'),cCS:ci('CODE CS'),
    qEA:ci('QTY EA'),qPA:ci('QTY PA'),qBP:ci('QTY BP'),qCS:ci('QTY CS'),
    img:ci('SKU_USAGE')};
  /* ดึงคลังทั้งหมดจากหัวคอลัมน์ "STOCK *" (ตามที่ตั้งไว้ใน PDDT) — คลังใหม่/เก่าเปลี่ยนที่ชีทได้เลย */
  const stockCols = cols.map((h,i)=>({h:String(h||'').trim(), i})).filter(x=>/^STOCK\s+\S+/i.test(x.h))
    .map(x=>({wh:x.h.replace(/^STOCK\s+/i,'').trim().toUpperCase(), i:x.i}));
  WH_LIST = stockCols.map(x=>x.wh);
  const idx = {};
  for(const r of matrix){
    const stockRaw = {};
    stockCols.forEach(s=>{ stockRaw[s.wh] = String(r[s.i]||'').trim(); });
    const rec = {

/* ===== ลาก checkbox เลือกหลายแถวรวด (drag-to-select · เมาส์/desktop — ไม่ทำ touch กันชนกับ scroll) =====
 * ระหว่างลากอัปเดตแค่ checkbox+Set+สีแถว (ห้าม re-render ทั้งตาราง = DOM หายกลางลาก) → ปล่อยเมาส์ค่อย commit ทีเดียว
 * preventDefault ต้องอยู่ที่ click (native toggle เกิดตอน click ไม่ใช่ mousedown) · e.detail>0 = เมาส์จริง (keyboard Space ให้ 0 → ปล่อยผ่านไป onchange) */
let _dsOn=false, _dsTarget=false, _dsDirty=false, _dsCommit=null;
document.addEventListener('mouseup', ()=>{
  if(!_dsOn) return;
  _dsOn=false; document.body.classList.remove('no-select');
  const c=_dsCommit; _dsCommit=null;
  if(_dsDirty){ _dsDirty=false; if(c) c(); }
});
function wireDragSelect(root, cfg){
  if(!root) return;
  root.querySelectorAll(cfg.rowSel).forEach(tr=>{
    const cb=tr.querySelector('input[type="checkbox"]'); if(!cb) return;
    const key=cfg.keyOf(tr);
    let fromDrag=false;
    const apply=on=>{
      if(cb.checked===on) return;
      cb.checked=on; cfg.set(key,on);
      if(cfg.paint) cfg.paint(tr,on);
      _dsDirty=true; if(cfg.live) cfg.live();
    };
    cb.addEventListener('mousedown', e=>{
      if(e.button!==0) return;
      fromDrag=true; _dsOn=true; _dsTarget=!cb.checked; _dsCommit=cfg.commit;
      document.body.classList.add('no-select');
      apply(_dsTarget);
    });
    cb.addEventListener('click', e=>{ if(fromDrag && e.detail>0) e.preventDefault(); fromDrag=false; });
    cb.addEventListener('change', ev=>{ if(fromDrag) return; cfg.set(key, ev.target.checked); if(cfg.paint) cfg.paint(tr, ev.target.checked); if(cfg.commit) cfg.commit(); });
    tr.addEventListener('mouseenter', e=>{ if(_dsOn && e.buttons===1) apply(_dsTarget); });
  });
}

/* สร้าง state การ์ดยิง — หน่วยที่กรอก = หน่วยที่เพิ่งยิง (scanLevel) · หน่วยอื่นที่เคยยิงไว้ของสินค้าตัวเดียวกัน ยังอยู่ครบ (otherEa) */
function coMakeCur(dem, su, note, subBc, subName){
  const bc=dem.barcode, ex=coPicked.find(p=>p.barcode===bc);

/* v2.7: ยอดทีมนับเป็น EA — แถวจากชีทใช้ .ea (gas-v17) · ไม่มี (แถวเก่า/GAS เก่า) → แปลงจาก qty × EA-ต่อหน่วยของแถวนั้น */
function rowEa(r){
  const ea=Math.round(num(r.ea)||0); if(ea>0) return ea;
  const q=parseInt(r.qty)||0; if(q<=0) return 0;
  const pu=parseUnit(String(r.unit||'')), prod=(DATA.prodIdx||{})[String(r.barcode||'').trim()]||null;
  return Math.round(q*eaPerOf(prod, pu.level, pu.eaPer));
}
function coTeamCalc(){
  const me=tfDevId(), t={};
  const add=(nm,bc,q,ts)=>{ nm=String(nm||'').trim()||'(ไม่ระบุชื่อ)'; if(!t[nm]) t[nm]={qty:{},total:0,items:0,lastTs:'',mine:nm===coMyName()}; const g=t[nm]; g.qty[bc]=(g.qty[bc]||0)+q; g.total+=q; g.items++; if(ts&&ts>g.lastTs) g.lastTs=ts; };
  (coSheetRows||[]).forEach(r=>{ if(String(r.device||'')===me) return; const bc=String(r.barcode||'').trim(); if(!bc) return; const q=rowEa(r); if(q<=0) return; add(r.by,bc,q,String(r.ts||'')); });
  coPicked.forEach(p=>{ const q=pickedEa(p); if(q>0) add(coMyName(),p.barcode,q,String(p.ts||'')); });
  return t;
}

function allocProp(custs, totalCS, weightFn){
  const res={}; custs.forEach(c=>res[c.code]=0);
  let total=Math.floor((+totalCS||0)+1e-9); if(total<=0) return res;
  const cap={}, w={}; custs.forEach(c=>{ cap[c.code]=Math.floor(c.orderedCS+1e-9); w[c.code]=Math.max(0,weightFn(c)||0); });
  let active=custs.filter(c=>w[c.code]>0 && cap[c.code]>0).map(c=>c.code), guard=0;
  while(total>0 && active.length && guard++<2000){
    const wsum=active.reduce((a,c)=>a+w[c],0); if(wsum<=0) break;
    const raw=active.map(c=>({code:c, q:total*w[c]/wsum}));
    let asg=0; raw.forEach(r=>{ const g=Math.min(Math.floor(r.q), cap[r.code]-res[r.code]); if(g>0){ res[r.code]+=g; asg+=g; } });
    let left=total-asg; raw.sort((a,b)=>(b.q-Math.floor(b.q))-(a.q-Math.floor(a.q)));
    for(const r of raw){ if(left<=0) break; if(res[r.code]<cap[r.code]){ res[r.code]++; left--; } }
    total=left; active=active.filter(c=>res[c]<cap[c]);

function allocByChannel(custs, availCS){
  const res={}; custs.forEach(c=>res[c.code]=0);
  let total=(+availCS||0); if(total<=1e-9) return res;
  const retail=custs.filter(c=>c.chan==='ปลีก'), whole=custs.filter(c=>c.chan!=='ปลีก');
  const retailDemand=retail.reduce((a,c)=>a+c.orderedCS,0);
  if(total>=retailDemand-1e-9){
    retail.forEach(c=>res[c.code]=Math.round(c.orderedCS*100)/100);
    const left=Math.floor(total-retailDemand+1e-9);
    if(left>0) Object.assign(res, allocProp(whole, left, c=>c.histCS));
  } else { Object.assign(res, allocProp(retail, total, c=>(c.histCS>0?c.histCS:c.orderedCS))); }
  return res;
}

function tfAllocHtml(c){
  if(!(parseInt(c.qty)>0)) return `<div class="muted" style="font-size:12px;padding:2px 0 6px">ใส่ "จำนวนที่โอนได้จริง" ก่อน → แบ่งโควต้า: ปลีกเต็มก่อน → ส่งตามประวัติซื้อ ${allocMonths} ด.</div>`;
  const mk=rows=>`<div class="tbl-wrap" style="max-height:200px"><table style="font-size:12px"><thead><tr><th style="text-align:left">เซล · ร้าน</th><th class="num">ต้องการ</th><th class="num">จัดให้</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  const rowH=s=>{ const nm=smShort(s.salesman,s.salesmanName); return `<tr class="${s.give===0?'cut-row':''}"><td style="text-align:left"><b>${esc(s.salesman||'')}${nm?' '+esc(nm):''}</b> <span class="muted" style="font-size:10.5px">· ${esc(s.store)}${s.chan?' · '+esc(s.chan):''}</span></td><td class="num">${s.need}</td><td class="num">${s.give?'<b>'+s.give+'</b>':'<span class="alloc-cut">✂ ไม่ได้</span>'}</td></tr>`; };
  if(c.histErr) return `<div style="font-size:11.5px;color:#b45309;padding:2px 0">⚠️ ดึงประวัติ BQ ไม่ได้ — ใช้ "บิลใหญ่ก่อน" แทน</div>`+mk(tfAlloc(c).map(rowH).join(''));
  if(!c.histReady) return '<div class="muted" style="font-size:12px;padding:2px 0 6px">⏳ กำลังดึงประวัติซื้อ (BQ)…</div>';
  return mk(tfAlloc(c).map(rowH).join(''));
}
function tfRenderResult(){
  const r=document.getElementById('tfResult'); if(!r) return;
  if(!tfCur){ r.innerHTML=''; return; }
  const c=tfCur;
  const already=c.already||0, D=c.demandQty||0, U=esc(UNIT_TH[c.tfUnit]||c.tfUnit||'');
  const SU=esc(UNIT_TH[c.scanLevel]||c.scanLevel||'');
  const roomEa=Math.max(0,(c.demandEa||0)-(c.othersEa||0)-(c.alreadyEa||0));
  const maxAdd=Math.floor((roomEa+0.001)/Math.max(1,c.scanEaPer||1));
  const inputVal=(c._add>0?c._add:'');
  const isDup=!!c.dup && (c.alreadyEa||0)>0;
  r.innerHTML=`<div class="scan-card">
    <div class="pname">${esc(c.product)}</div>
    <div class="pbar">บาร์โค้ด: ${esc(c.barcode)} · หน่วย ${esc(c.unit)}</div>
    <div class="ord">📦 ต้องโอน <b>${D} ${U}</b> <span class="muted">(= ${esc(fmtEaUnits(c.demandEa,c.prod,c.tfUnit,c.eaPerTf))})</span> · ${c.stores.length} ร้าน${(c.alreadyEa||0)>0?` · <span style="color:#166534;font-weight:700">เรายิงแล้ว ${esc(fmtEaUnits(c.alreadyEa,c.prod,c.tfUnit,c.eaPerTf))}</span>`:''}${(c.othersEa||0)>0?` · <span style="color:#b45309;font-weight:700">👥 คนอื่น ${esc(fmtEaUnits(c.othersEa,c.prod,c.tfUnit,c.eaPerTf))}</span>`:''}</div>
    ${c.scanNote?`<div style="background:#fffbeb;border:1px solid #fcd34d;color:#92400e;border-radius:8px;padding:6px 10px;margin:6px 0;font-size:12px">${c.scanNote}</div>`:''}
    ${c.subBarcode?`<div style="background:#eff6ff;border:1.5px solid #93c5fd;color:#1d4ed8;border-radius:8px;padding:7px 10px;margin:6px 0;font-size:12.5px;font-weight:700">🔁 ทดแทน — <b>บิลจะออกเป็นบาร์ ${esc(c.subBarcode)}</b>${c.subName?` (${esc(c.subName)})`:''} แทนของ "${esc(c.product)}"<br><span style="font-weight:400;color:#64748b">เลือกผิด → ยกเลิก/ยิงใหม่ · ยืนยันแล้ว → กด ✕ ที่แถว ลบแล้วทำใหม่</span></div>`:''}
    ${isDup?`<div class="dup-note">🔁 ยิงซ้ำ · ยิงไปแล้ว <b>${already}</b> ${U} · เพิ่มได้อีก <b>${remain}</b></div>`:''}
    <label style="font-size:13px;color:var(--muted);font-weight:700;margin-top:6px;display:block">${isDup?'ยิงเพิ่มอีก':'จำนวนที่โอนได้จริง'} — กรอกเป็น <b style="color:var(--navy);font-size:15px">${SU}</b> <span class="muted">(หน่วยที่เพิ่งยิง · เพิ่มได้อีกไม่เกิน ${maxAdd})</span></label>
    <div class="recv-box"><button class="stp" onclick="tfStep(-1)">−</button>
      <input id="tfQty" type="number" inputmode="numeric" value="${inputVal}" oninput="tfQtyInput(this)" placeholder="0">
      <button class="stp" onclick="tfStep(1)">+</button></div>
    <div id="tfRunTot" style="font-size:12.5px;font-weight:700;margin-top:5px;color:${((c.ea||0)+(c.othersEa||0))>=(c.demandEa||0)?'#166534':'#b45309'}">${esc(tfRunTotText(c))}</div>
    <div id="tfCapWarn" class="cap-warn" style="display:${c._capped?'block':'none'}">⚠️ เกินยอดที่ต้องโอนไม่ได้ — เพิ่มได้อีกไม่เกิน ${maxAdd} ${SU}</div>
    <div style="display:flex;gap:6px;margin:8px 0"><button class="chip" onclick="tfSet(${maxAdd})">${isDup?`เพิ่มจนครบ (+${maxAdd} ${SU})`:`โอนครบ (${maxAdd} ${SU})`}</button><button class="chip" onclick="tfSet(0)">ล้าง</button></div>
    <div class="dist"><div class="dist-h">📍 จัดให้ร้านไหน (โควต้า: ปลีกก่อน→ส่งตามประวัติซื้อ)</div><div id="tfAllocBox">${tfAllocHtml(c)}</div></div>
    <div style="display:flex;gap:8px;margin-top:8px">
      <button class="scan-btn gold" style="flex:1" onclick="tfConfirm()">✓ เพิ่มลงใบโอน</button>
      <button class="scan-btn gray" onclick="tfCancel()">ยกเลิก</button></div></div>`;
  setTimeout(()=>{ const q=document.getElementById('tfQty'); if(q){ q.focus(); q.select(); } },50);
}
/* v2.7: ช่องกรอก = จำนวน "หน่วยที่เพิ่งยิง" (add) → รวมเป็น EA → แปลงกลับเป็นหน่วยใบโอน (ปัดลง) ให้ tfAlloc เหมือนเดิม */
function tfSetAdd(add){
  const c=tfCur; if(!c) return;
  const a=Math.max(0,parseInt(add)||0);
  const room=Math.max(0,(c.demandEa||0)-(c.othersEa||0));
  let ea=(c.alreadyEa||0)+a*(c.scanEaPer||1);
  c._capped = ea>room+0.001; if(c._capped) ea=room;
  c.ea=Math.round(ea);
  c.qty=Math.floor((c.ea+0.001)/Math.max(1,c.eaPerTf||1));
  c._add=Math.max(0, Math.round((c.ea-(c.alreadyEa||0))/(c.scanEaPer||1)));
}
function tfRunTotText(c){
  const all=(c.ea||0)+(c.othersEa||0), left=Math.max(0,(c.demandEa||0)-all);
  const s=`รวมที่ยิง ${fmtEaUnits(all,c.prod,c.tfUnit,c.eaPerTf)} / ต้องโอน ${fmtEaUnits(c.demandEa,c.prod,c.tfUnit,c.eaPerTf)}`;
  return all>=(c.demandEa||0) ? ('✅ ครบแล้ว — '+s) : ('🟡 '+s+' · ยังขาด '+fmtEaUnits(left,c.prod,c.tfUnit,c.eaPerTf));
}
function tfQtyInput(el){ if(!tfCur) return; tfSetAdd(el.value); if(tfCur._capped) el.value=tfCur._add;
  const w=document.getElementById('tfCapWarn'); if(w) w.style.display=tfCur._capped?'block':'none';
  const t=document.getElementById('tfRunTot'); if(t){ t.textContent=tfRunTotText(tfCur); t.style.color=((tfCur.ea||0)+(tfCur.othersEa||0))>=(tfCur.demandEa||0)?'#166534':'#b45309'; }
  const a=document.getElementById('tfAllocBox'); if(a) a.innerHTML=tfAllocHtml(tfCur); }
function tfStep(d){ if(!tfCur) return; tfSetAdd((parseInt(tfCur._add)||0)+d); tfRenderResult(); }
function tfSet(v){ if(!tfCur) return; tfSetAdd(v); tfRenderResult(); }
function tfCancel(){ tfCur=null; tfSubPending=null; tfRenderResult(); const i=document.getElementById('tfInput'); if(i) i.focus(); }
function tfConfirm(){
  if(!tfCur) return;
  const c=tfCur, add=Math.max(0,parseInt(c._add)||0), qty=tfClamp(c.qty);
  if(add<=0){ toast('ใส่จำนวนก่อน'); return; }
  if(qty<=0){ beep(true); toast('⚠️ ยังไม่ครบ 1 '+(UNIT_TH[c.tfUnit]||c.tfUnit)+' — ยิงเพิ่มอีก (ตอนนี้ '+fmtEaUnits(c.ea,c.prod,c.tfUnit,c.eaPerTf)+')'); return; }
  const units={...(c.units||{})}; units[c.scanLevel]=(+units[c.scanLevel]||0)+add;   // ยิงเพิ่ม = บวกทบหน่วยเดิม (tf เป็นโหมด "เพิ่ม")
  const alloc=tfAlloc(c).filter(s=>s.give>0);
  const i=tfPicked.findIndex(p=>p.barcode===c.barcode && p.wh===tfWh);
  const sub=c.subBarcode?{bc:c.subBarcode, name:c.subName||''}:(c._exSub||(i>=0?(tfPicked[i].sub||null):null));   // ยิงทดแทน→เก็บ · ยิงปกติทับตัวที่เคยทดแทน→คงโน้ต
  const row={barcode:c.barcode, product:c.product, unit:c.unit, eaPer:c.eaPer, level:c.tfUnit, wh:tfWh, qty, units, ea:c.ea, demandQty:c.demandQty, alloc, sub, ts:nowStamp()};
  if(i>=0) tfPicked[i]=row; else tfPicked.push(row);
  tfDirty=true; tfCur=null; tfSaveLS(); tfRenderResult(); tfRenderList();
  if(CONFIG.gasUrl) tfSave(true);
  toast('✓ เพิ่มแล้ว — ยิงตัวต่อไป'); const inp=document.getElementById('tfInput'); if(inp) inp.focus();
}
function tfEditPick(bc){ tfScanLookup(bc); }
function tfDelPick(bc){ const i=tfPicked.findIndex(p=>p.barcode===bc && p.wh===tfWh); if(i>=0){ tfPicked.splice(i,1); tfDirty=true; tfSaveLS(); tfRenderList(); if(CONFIG.gasUrl) tfSave(true); } }
function tfRenderList(){
  const w=document.getElementById('tfList'); if(!w) return;
  const demAll=tfDemand(), q=tfQ.trim().toLowerCase();
  const dem=demAll.filter(d=>!q||(d.product+' '+d.barcode).toLowerCase().includes(q));
  const total=demAll.length, done=demAll.filter(d=>d.scannedEa!=null && d.scannedEa>=d.qtyEa).length;
  const rows=dem.slice(0,300).map(d=>{ const sc=d.scannedEa, scanned=(sc!=null), short=Math.max(0,d.qtyEa-(sc||0));
    const bg=!scanned?'':(short>0?'background:#fffbeb':'background:#ecfdf5');
    const st=!scanned?'':(short>0?' <span style="font-size:9px;background:#fef9c3;color:#854d0e;border-radius:4px;padding:1px 5px;font-weight:700">🟡</span>':' <span style="font-size:9px;background:#dcfce7;color:#166534;border-radius:4px;padding:1px 5px;font-weight:700">✅</span>');
    const myp=tfPicked.find(p=>p.barcode===d.barcode&&p.wh===tfWh), subBadge=(myp&&myp.sub)?` <span style="font-size:9px;background:#dbeafe;color:#1d4ed8;border-radius:4px;padding:1px 5px;font-weight:700" title="ใช้บาร์ ${esc(myp.sub.bc)} แทน">🔁</span>`:'';
    const mixBadge=(myp&&myp.units&&Object.keys(myp.units).filter(u=>+myp.units[u]>0).length>1)?' <span style="font-size:9px;background:#ede9fe;color:#6d28d9;border-radius:4px;padding:1px 5px;font-weight:700">🧩</span>':'';
    return `<tr style="${bg}"><td style="text-align:left">${esc(d.product)} <span class="muted" style="font-size:10px">${esc(d.tfUnit)}</span>${st}${subBadge}${mixBadge}</td><td class="num"><b>${d.qty}</b></td><td class="num">${scanned?'<b style="color:#166534">'+esc(fmtEaUnits(sc,d.prod,d.tfUnit,d.eaPerTf))+'</b>':'-'}</td><td class="num">${short>0?'<b style="color:var(--red)">'+esc(fmtEaUnits(short,d.prod,d.tfUnit,d.eaPerTf))+'</b>':(scanned?'✓':'-')}</td><td style="white-space:nowrap">${(tfPicked.some(p=>p.barcode===d.barcode&&p.wh===tfWh))?`<button class="ico-btn" onclick="tfEditPick('${esc(d.barcode)}')">✎</button> <button class="ico-btn" onclick="tfDelPick('${esc(d.barcode)}')">✕</button>`:''}</td></tr>`; }).join('');
  w.innerHTML=`<div class="row-sel" style="justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
      <b style="color:var(--navy)">โอนครบ ${done}/${total}</b>
      <input id="tfQIn" value="${esc(tfQ)}" oninput="tfSetQ(this.value)" placeholder="🔍 กรอง" style="flex:1;min-width:110px;padding:8px 13px;border:1.5px solid var(--border);border-radius:20px;outline:none;font-family:inherit;font-size:13px"></div>
    ${total?`<div class="tbl-wrap" style="max-height:52vh"><table><thead><tr><th>สินค้า</th><th class="num">ต้องโอน</th><th class="num">ยิงแล้ว</th><th class="num">ขาด</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`:'<div class="empty">ไม่มีรายการโอน (W4 · '+esc(tfDate||'-')+')</div>'}`;
}
async function tfSave(silent){
  if(!CONFIG.gasUrl) return;
  if(!silent) loading(true,'กำลังบันทึกลงชีท…');
  try{
    const by=(currentUser&&currentUser.name)||'', dev=tfDevId();
    const rows=tfPicked.map(p=>{ const short=Math.max(0,(p.demandQty||0)-(parseInt(p.qty)||0));
      const subN=p.sub?('ใช้บาร์ '+p.sub.bc+(p.sub.name?' '+p.sub.name:'')+' แทน'):'';
      const who=(p.alloc||[]).map(a=>`${a.store||a.storeCode}:${a.give}`).join(' · ')+(subN?(' · 🔁 '+subN):'');   // col8 human — ต่อโน้ตทดแทน (อ่านในชีท)
      const allocJson=JSON.stringify(p.sub?[...(p.alloc||[]),{_subBc:String(p.sub.bc),_subName:p.sub.name||''}]:(p.alloc||[]));   // col9 — ฝัง marker {_subBc} · buildShareExport ข้าม (no give) · Picker เอา _subBc ไปแทนบาร์ในบิล DC (ข้ามเครื่อง · col9 = readTransfer คืน)
      const ts=String(p.ts||nowStamp()), tsP=ts.split(' ');
      const ea=pickedEa(p), mix=p.units?Object.keys(p.units).filter(u=>+p.units[u]>0).map(u=>(+p.units[u])+' '+(UNIT_TH[u]||u)).join(' + '):'';   // col14 = EA รวมทุกหน่วย (v2.7) · col15 = แยกหน่วยให้คนอ่าน
      return [tfDate||'', p.wh||tfWh||'', p.barcode, p.product, p.unit, String(p.demandQty||''), String(p.qty||''), String(short), who, allocJson, by, tsP[0]||'', tsP[1]||'', dev, String(ea||''), mix]; });
    const res=await fetch(CONFIG.gasUrl,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'saveTransfer',tab:'ยิงโอนย้าย',header:TF_SYNC_HEADER,rows,date:tfDate||'',wh:tfWh||'',device:dev})});
    const txt=(await res.text()).trim(); let j={}; try{ j=JSON.parse(txt); }catch(e){}
    if(j.ok){ tfDirty=false; tfSaveLS(); tfSyncPull(); if(!silent) toast(`✅ บันทึก ${j.saved} รายการ`); }
    else throw new Error(j.error||txt||'บันทึกไม่สำเร็จ');
  }catch(e){ if(!silent){ console.error(e); toast('❌ '+(e.message||'บันทึกไม่สำเร็จ')); } else tfDirty=true; }
  finally{ if(!silent) loading(false); }
}
async function tfSyncPull(force){
  if(!CONFIG.gasUrl || !tfDate || !tfWh) return;
  if(!force){ const w=document.getElementById('tfList'); if(!w || !w.offsetParent) return; }
  try{
    const res=await fetch(CONFIG.gasUrl,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'readTransfer',tab:'ยิงโอนย้าย',date:tfDate,wh:tfWh})});
    const j=JSON.parse((await res.text()).trim()||'{}'); if(!j.ok || !Array.isArray(j.rows)) return;
    const me=tfDevId(), rem={};
    j.rows.forEach(r=>{ if(String(r.device||'')===me) return; const bc=String(r.barcode||'').trim(); if(!bc) return;
      const q=parseInt(r.qty)||0, e=rowEa(r); if(q<=0 && e<=0) return;
      if(!rem[bc]) rem[bc]={qty:0,ea:0}; rem[bc].qty+=q; rem[bc].ea+=e; });
    tfRemote=rem; tfSyncAt=(nowStamp().split(' ')[1])||'';
    if(!tfCur){ tfRenderList(); tfRenderHead(); }
  }catch(e){}
}
function tfSyncStart(){
  if(!_tfVisBound){ _tfVisBound=true; document.addEventListener('visibilitychange',()=>{ if(!document.hidden) tfSyncPull(); }); }
  if(tfSyncTimer) return; tfSyncTimer=setInterval(tfSyncPull, 15000); tfSyncPull();
}
function tfToggleCam(){ tfCamOn?tfStopCam():tfStartCam(); }
async function tfStartCam(){
  if(!window.Html5Qrcode){ toast('กล้องยังโหลดไม่เสร็จ ลองใหม่'); return; }
  try{
    tfCam=new Html5Qrcode('tf-qr-reader',{verbose:false,experimentalFeatures:{useBarCodeDetectorIfSupported:true}});
    const F=Html5QrcodeSupportedFormats;
    const config={fps:25,qrbox:{width:320,height:180},aspectRatio:1.7777,videoConstraints:{facingMode:{ideal:'environment'},width:{ideal:1920,min:1280},height:{ideal:1080,min:720},advanced:[{focusMode:'continuous'},{zoom:1.5}]},formatsToSupport:[F.EAN_13,F.EAN_8,F.UPC_A,F.UPC_E,F.CODE_128,F.CODE_39,F.CODE_93,F.ITF,F.QR_CODE]};
    await tfCam.start({facingMode:'environment'},config,tfOnCode,()=>{});
    tfCamOn=true; const b=document.getElementById('tfCamBtn'); if(b){ b.textContent='⏹ ปิดกล้อง'; b.classList.add('on'); }
  }catch(e){ toast('เปิดกล้องไม่ได้: '+(e.message||e)); }
}
async function tfStopCam(){ try{ if(tfCam){ await tfCam.stop(); await tfCam.clear(); } }catch(e){} tfCam=null; tfCamOn=false; const b=document.getElementById('tfCamBtn'); if(b){ b.textContent='📷 กล้อง'; b.classList.remove('on'); } }
function tfOnCode(txt){ const now=Date.now(); const code=String(txt||'').trim(); if(code===tfLast.code && now-tfLast.t<1500) return; tfLast={code,t:now}; tfScanLookup(code); }

/* ================= init ================= */
(function(){
  const cached=loadAuth();
  if(cached && passesGate(cached)){ currentUser=cached; enterApp(); }
  else initGoogleSignIn();
})();
</script>
