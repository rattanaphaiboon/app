<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Rattana ROO by Sales v1.3</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --navy:#0d1b3e;--navy-mid:#1a2f5e;--navy-light:#243b73;--gold:#c9a84c;--gold-light:#e8c86a;
  --success:#2ecc71;--danger:#e74c3c;--warning:#f39c12;--info:#3498db;
  --bg:#f4f6fb;--text:#0d1b3e;--card-bg:#fff;--border:#dde3f0;--muted:#6b7896;--row-alt:#fafbfd;
  --ok-bg:#e8f7ee;--ok-tx:#1e8449;--no-bg:#ffe9e6;--no-tx:#c0392b;
  --radius-sm:6px;--radius-md:12px;--radius-lg:16px;
  --shadow-md:0 2px 8px rgba(0,0,0,.08);--shadow-lg:0 8px 24px rgba(13,27,62,.12);--shadow-gold:0 4px 12px rgba(201,168,76,.35);
}
body.dark{--bg:#0a1020;--text:#e8eaf0;--card-bg:#111c35;--border:#243b73;--muted:#8a98b8;--row-alt:#0f1830;--ok-bg:#1a3a25;--ok-tx:#7be0a3;--no-bg:#3a1a17;--no-tx:#ff8a7e}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Sarabun',sans-serif;font-size:14px;line-height:1.5;min-height:100dvh;overflow-x:hidden;background:var(--bg);color:var(--text);transition:background .25s,color .25s}
button{font-family:inherit;cursor:pointer;border:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
input,select{font-family:inherit;font-size:16px}

header{background:var(--navy);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:8px;border-bottom:3px solid var(--gold);padding-top:max(12px,env(safe-area-inset-top))}
.logo-text{font-weight:700;letter-spacing:1px;font-size:18px;flex:1;display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.logo-text span{color:var(--gold)}
.ver-badge{font-size:11px;font-weight:600;background:rgba(201,168,76,.18);border:1px solid rgba(201,168,76,.5);color:var(--gold-light)!important;padding:2px 8px;border-radius:10px}
.icon-btn{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.2);width:40px;height:40px;border-radius:var(--radius-sm);font-size:18px;flex-shrink:0}
.icon-btn:hover{background:rgba(255,255,255,.12)}

.content{padding:12px;max-width:1200px;margin:0 auto}
@media(min-width:640px){.content{padding:16px}}

.toolbar{display:grid;grid-template-columns:1fr;gap:8px;margin-bottom:12px}
@media(min-width:768px){.toolbar{grid-template-columns:1fr auto auto}}
.grp-seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
.grp-seg button{background:var(--card-bg);color:var(--text);border:1.5px solid var(--border);border-radius:var(--radius-md);padding:8px 6px;font-size:14px;font-weight:700;min-height:52px;line-height:1.25}
.grp-seg button small{display:block;font-size:11px;font-weight:400;color:var(--muted)}
.grp-seg button.on{background:var(--navy);color:#fff;border-color:var(--gold)}
.grp-seg button.on small{color:var(--gold-light)}
.grp-title{grid-column:1/-1;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-top:6px;padding:8px 2px 2px;border-bottom:2px solid var(--gold)}
.grp-title h3{font-size:17px;font-weight:700}
.grp-title span{font-size:12px;color:var(--muted)}
.grp-title b{color:var(--success)}
.input{height:44px;padding:0 12px;border-radius:var(--radius-sm);border:1.5px solid var(--border);background:var(--card-bg);color:var(--text);outline:none;width:100%}
.input:focus{border-color:var(--gold)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 14px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;border:1px solid transparent;min-height:44px}
.btn:hover{opacity:.88}
.btn-gold{background:var(--gold);color:var(--navy)}
.seg{display:inline-flex;border:1.5px solid var(--border);border-radius:var(--radius-sm);overflow:hidden;grid-column:1/-1}
@media(min-width:768px){.seg{grid-column:auto}}
.seg button{flex:1;background:var(--card-bg);color:var(--text);padding:0 12px;font-size:13px;font-weight:600;min-height:41px;white-space:nowrap}
.seg button.on{background:var(--navy);color:#fff}
.toolbar .btn-gold{grid-column:1/-1}
@media(min-width:768px){.toolbar .btn-gold{grid-column:auto}}

.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
@media(min-width:768px){.stat-grid{grid-template-columns:repeat(4,1fr)}}
.stat-card{background:var(--card-bg);border-radius:var(--radius-md);padding:14px;border:1px solid var(--border);border-top:3px solid var(--gold);box-shadow:var(--shadow-md)}
.stat-card .s-label{font-size:11px;color:var(--muted);font-weight:600}
.stat-card .s-value{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.stat-card .s-sub{font-size:11px;color:var(--muted)}
.stat-card.success{border-top-color:var(--success)}.stat-card.success .s-value{color:var(--success)}
.stat-card.danger{border-top-color:var(--danger)}.stat-card.danger .s-value{color:var(--danger)}

.legend{display:flex;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--muted);align-items:center;margin-bottom:10px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:12px;font-size:12px;font-weight:600;white-space:nowrap;margin:2px}
.chip.ok{background:var(--ok-bg);color:var(--ok-tx)}
.chip.no{background:var(--no-bg);color:var(--no-tx)}
.chip small{font-weight:400;opacity:.8}

.card-grid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:700px){.card-grid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1050px){.card-grid{grid-template-columns:repeat(3,1fr)}}
.sc{background:var(--card-bg);border:1px solid var(--border);border-top:3px solid var(--gold);border-radius:var(--radius-md);box-shadow:var(--shadow-md);overflow:hidden;display:flex;flex-direction:column}
.sc-head{display:flex;gap:12px;align-items:center;padding:14px;border-bottom:1px solid var(--border)}
.ring{--p:0;width:64px;height:64px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:conic-gradient(var(--success) calc(var(--p)*1%),var(--border) 0)}
.ring span{width:50px;height:50px;border-radius:50%;background:var(--card-bg);display:flex;align-items:center;justify-content:center;flex-direction:column;line-height:1}
.ring b{font-size:18px}
.ring small{font-size:9px;color:var(--muted)}
.sc-name{font-weight:700;font-size:15px}
.sc-meta{font-size:12px;color:var(--muted)}
.sc-xl{margin-left:auto;background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:var(--radius-sm);font-size:12px;padding:4px 8px;min-height:32px;flex-shrink:0}
.sc-xl:hover{border-color:var(--gold);color:var(--text)}
.sc-nums{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;border-bottom:1px solid var(--border)}
.sc-nums div{padding:8px 4px;font-size:11px;color:var(--muted)}
.sc-nums div+div{border-left:1px solid var(--border)}
.sc-nums b{display:block;font-size:18px;color:var(--text)}
.sc-nums .g b{color:var(--success)}.sc-nums .r b{color:var(--danger)}
.sc-body{padding:10px 12px 12px}
.sc-body h4{font-size:12px;color:var(--muted);margin:4px 0 2px}
.sc-more{background:none;color:var(--info);font-size:12px;font-weight:600;padding:6px 4px;min-height:32px}
.empty{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius-md);padding:40px;text-align:center;color:var(--muted);grid-column:1/-1}

#spinner{display:none;position:fixed;inset:0;background:rgba(13,27,62,.55);align-items:center;justify-content:center;z-index:99999;backdrop-filter:blur(3px)}
#spinner.show{display:flex}
.spinner-box{background:var(--card-bg);color:var(--text);border-radius:var(--radius-lg);padding:30px 40px;text-align:center;border-top:4px solid var(--gold)}
.spinner-ring{width:48px;height:48px;border:5px solid #dde3f0;border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px}
.toast{position:fixed;bottom:max(24px,env(safe-area-inset-bottom));right:16px;padding:12px 20px;border-radius:var(--radius-md);color:#fff;z-index:9999;animation:slideIn .3s ease;font-weight:500;box-shadow:var(--shadow-lg);max-width:90vw;font-size:13px}
.toast-success{background:var(--success)}.toast-error{background:var(--danger)}.toast-info{background:var(--navy-mid);border-left:3px solid var(--gold)}
#backToTop{position:fixed;bottom:max(24px,calc(16px + env(safe-area-inset-bottom)));right:16px;background:var(--gold);color:var(--navy);border-radius:50%;width:46px;height:46px;display:none;align-items:center;justify-content:center;box-shadow:var(--shadow-gold);z-index:90;font-size:18px;font-weight:700}
#backToTop.show{display:flex}
.foot{text-align:center;font-size:11px;color:var(--muted);padding:16px 0 32px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes slideIn{from{transform:translateX(120%);opacity:0}to{transform:translateX(0);opacity:1}}
</style>
</head>
<body>
<div id="spinner" class="show"><div class="spinner-box"><div class="spinner-ring"></div><p>กำลังโหลดข้อมูลจากชีต Customer...</p></div></div>

<header>
  <div class="logo-text">Rattana <span>ROO by Sales</span> <span class="ver-badge">v1.3 · 2026-10-29</span></div>
  <button class="icon-btn" id="btnRefresh" title="โหลดข้อมูลใหม่" onclick="refreshData()">⟳</button>
  <button class="icon-btn" title="โหมดมืด/สว่าง" onclick="toggleDark()">◐</button>
</header>

<main class="content">
  <div class="grp-seg" id="grpSeg"></div>
  <div class="toolbar">
    <input class="input" id="q" type="search" placeholder="🔍 ค้นหาชื่อเซลล์ หรือ ตำบล" oninput="render()" autocomplete="off">
    <div class="seg" id="seg">
      <button data-v="roo" class="on">เรียงตามร้าน ROO</button>
      <button data-v="no">เรียงตามตำบลที่ยังไม่ทำ</button>
    </div>
    <button class="btn btn-gold" onclick="exportAll()">⬇ Excel</button>
  </div>

  <div class="stat-grid">
    <div class="stat-card"><div class="s-label">เซลล์ที่ดูแลร้าน</div><div class="s-value" id="stSales">-</div><div class="s-sub" id="stShops"></div></div>
    <div class="stat-card success"><div class="s-label">ร้านที่ทำ ROO แล้ว</div><div class="s-value" id="stRoo">-</div><div class="s-sub" id="stRooPct"></div></div>
    <div class="stat-card"><div class="s-label">ตำบลที่ดูแลทั้งหมด</div><div class="s-value" id="stTam">-</div><div class="s-sub">นับตามตำบลของร้าน</div></div>
    <div class="stat-card danger"><div class="s-label">ตำบลที่ยังไม่ได้ทำ ROO</div><div class="s-value" id="stTamNo">-</div><div class="s-sub">ยังไม่มีร้าน ROO แม้แต่ร้านเดียว</div></div>
  </div>

  <div class="legend"><span class="chip ok">ตำบล <small>ROO/ทั้งหมด</small></span> ทำ ROO แล้ว <span class="chip no">✗ ตำบล <small>ร้าน</small></span> ยังไม่ทำ ROO (เรียงตามจำนวนร้าน)</div>
  <div class="card-grid" id="cards"></div>

  <div class="foot" id="foot"></div>
</main>

<button id="backToTop" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>

<script>
const SHEET_ID = '1dAxF4Mz-zhJIVbuJ_Ql126gt08qvVS1wndJD50pqCZI';
const SHEET_NAME = 'Customer';
const CACHE_KEY = 'rooSalesData_v1';
const TTL = 5 * 60 * 1000;
const NONE = '(ไม่ระบุเซลล์)';
const LIMIT = 12;
// Salespeople shown in the app, by team (names without "คุณ")
const GROUPS = [
  { key: 'send', label: 'พรีออเดอร์ส่ง', sales: ['วิรชัย หัตถกรรม', 'นพดล พุทธรักษา'] },
  { key: 'retail', label: 'พรีออเดอร์ปลีก', sales: ['ชัยสิทธิ์ มีศิริ', 'จารุพัฒน์ หอมวิเชียร', 'สุกรี สรสิทธิ์', 'จิรายุ วันจันทร์'] },
];
const groupOf = new Map(GROUPS.flatMap(g => g.sales.map(n => [n, g])));
let ALL = [], SALES = [], sortBy = 'roo', curGroup = '';
const expanded = new Set();

/* ── Load (gviz JSONP so it also works when opened as a local file) ── */
function loadSheet() {
  return new Promise((resolve, reject) => {
    const cb = 'gviz_cb_' + Date.now(), s = document.createElement('script');
    const timer = setTimeout(() => { done(); reject(new Error('timeout')); }, 30000);
    function done() { clearTimeout(timer); delete window[cb]; s.remove(); }
    window[cb] = res => { done(); res.status === 'error' ? reject(new Error('sheet error')) : resolve(toRows(res.table)); };
    s.onerror = () => { done(); reject(new Error('network')); };
    s.src = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?headers=1&sheet=${encodeURIComponent(SHEET_NAME)}&tqx=responseHandler:${cb}`;
    document.head.appendChild(s);
  });
}
const clean = s => String(s ?? '').replace(/[​‌‍﻿]/g, '').replace(/ /g, ' ').trim();
// "คุณ ชยพล พูลศรี" and "ชยพล พูลศรี" are the same person
const saleName = s => clean(s).replace(/^คุณ\s*/, '').replace(/\s+/g, ' ') || NONE;
function toRows(t) {
  const H = t.cols.map(c => clean(c.label)), ix = n => H.indexOf(n);
  const I = { name: ix('ชื่อร้านค้า'), addr: ix('ต.,อ.,จ. ขอพร'), wh: ix('WH'), sale: ix('เซลล์ผู้ดูแล'), roo: ix('ROO') };
  const g = (r, i) => (i < 0 || !r.c[i] || r.c[i].v == null) ? '' : clean(r.c[i].v);
  return t.rows.map(r => {
    if (!g(r, I.name)) return null;
    const p = g(r, I.addr).split(',').map(x => x.trim());
    return { wh: g(r, I.wh) || '(ไม่ระบุ)', sale: saleName(g(r, I.sale)), isRoo: g(r, I.roo).toUpperCase() === 'ROO',
             tam: p[0] || '(ไม่ระบุ)', amp: p[1] || '(ไม่ระบุ)', prov: p[2] || '' };
  }).filter(Boolean);
}
const getCached = () => { try { const i = JSON.parse(localStorage.getItem(CACHE_KEY)); return i && Date.now() - i.ts < TTL ? i : null; } catch { return null; } };
const setCache = d => { try { localStorage.setItem(CACHE_KEY, JSON.stringify({ ts: Date.now(), data: d })); } catch {} };

async function loadData(showSpin) {
  if (showSpin) document.getElementById('spinner').classList.add('show');
  try {
    const d = await loadSheet();
    ALL = d; setCache(d); stamp(Date.now()); render();
    return true;
  } catch (e) {
    showToast('โหลดข้อมูลไม่สำเร็จ: ' + e.message, 'error');
    return false;
  } finally { document.getElementById('spinner').classList.remove('show'); }
}
async function refreshData() {
  const b = document.getElementById('btnRefresh');
  b.disabled = true; b.style.transition = 'transform .6s'; b.style.transform = 'rotate(360deg)';
  const ok = await loadData(true);
  b.disabled = false; setTimeout(() => { b.style.transform = ''; b.style.transition = ''; }, 600);
  if (ok) showToast('อัพเดทเรียบร้อย ✓', 'success');
}
function stamp(ts) {
  const d = new Date(ts), p = n => String(n).padStart(2, '0');
  set('foot', `ข้อมูลจากชีต Customer (เซลล์ผู้ดูแล + ROO) · อัพเดท ${p(d.getDate())}/${p(d.getMonth() + 1)}/${d.getFullYear() + 543} ${p(d.getHours())}.${p(d.getMinutes())}`);
}

/* ── Aggregation per salesperson ── */
function bySales(rows) {
  const m = new Map();
  rows.forEach(r => {
    let s = m.get(r.sale);
    if (!s) { s = { name: r.sale, total: 0, roo: 0, tams: new Map() }; m.set(r.sale, s); }
    s.total++; if (r.isRoo) s.roo++;
    const k = r.amp + '|' + r.tam;
    let t = s.tams.get(k);
    if (!t) { t = { amp: r.amp, tam: r.tam, prov: r.prov, total: 0, roo: 0 }; s.tams.set(k, t); }
    t.total++; if (r.isRoo) t.roo++;
  });
  return [...m.values()].map(s => {
    const tams = [...s.tams.values()];
    const ok = tams.filter(t => t.roo > 0).sort((a, b) => b.roo - a.roo || b.total - a.total);
    const no = tams.filter(t => t.roo === 0).sort((a, b) => b.total - a.total);
    return { ...s, tams, ok, no, pct: s.total ? s.roo / s.total * 100 : 0 };
  });
}

/* ── Render ── */
const chipOk = t => `<span class="chip ok" title="อ.${esc(t.amp)}">${esc(t.tam)} <small>${t.roo}/${t.total}</small></span>`;
const chipNo = t => `<span class="chip no" title="อ.${esc(t.amp)}">✗ ${esc(t.tam)} <small>${t.total} ร้าน</small></span>`;
function renderGroupSeg() {
  const all = ALL.filter(r => groupOf.has(r.sale));
  const stat = rows => `${rows.filter(r => r.isRoo).length} ROO / ${rows.length.toLocaleString()} ร้าน`;
  const btns = [{ key: '', label: 'ทั้งหมด', rows: all },
    ...GROUPS.map(g => ({ key: g.key, label: g.label, rows: all.filter(r => groupOf.get(r.sale) === g) }))];
  const seg = document.getElementById('grpSeg');
  seg.innerHTML = btns.map(b => `<button data-g="${b.key}" class="${b.key === curGroup ? 'on' : ''}">${b.label}<small>${stat(b.rows)}</small></button>`).join('');
  seg.querySelectorAll('button').forEach(b => b.onclick = () => { curGroup = b.dataset.g; render(); });
}
function render() {
  renderGroupSeg();
  const rows = ALL.filter(r => groupOf.has(r.sale) && (!curGroup || groupOf.get(r.sale).key === curGroup));
  SALES = bySales(rows);
  const roo = rows.filter(r => r.isRoo).length;
  const tamAll = new Map();
  rows.forEach(r => { const k = r.amp + '|' + r.tam; tamAll.set(k, (tamAll.get(k) || 0) + (r.isRoo ? 1 : 0)); });
  set('stSales', SALES.length);
  set('stShops', `ดูแลร้านรวม ${rows.length.toLocaleString()} ร้าน`);
  set('stRoo', roo.toLocaleString());
  set('stRooPct', `${rows.length ? (roo / rows.length * 100).toFixed(1) : 0}% ของร้านทั้งหมด`);
  set('stTam', tamAll.size);
  set('stTamNo', [...tamAll.values()].filter(v => v === 0).length);

  const q = document.getElementById('q').value.trim().toLowerCase();
  const list = SALES
    .filter(s => !q || s.name.toLowerCase().includes(q) || s.tams.some(t => t.tam.toLowerCase().includes(q)))
    .sort(sortBy === 'no' ? (a, b) => b.no.length - a.no.length || b.total - a.total
                          : (a, b) => b.roo - a.roo || b.pct - a.pct || b.total - a.total);
  const hit = t => q && t.tam.toLowerCase().includes(q) ? ' style="outline:2px solid var(--gold)"' : '';
  const card = s => {
    const exp = expanded.has(s.name);
    const no = exp ? s.no : s.no.slice(0, LIMIT);
    return `<div class="sc">
      <div class="sc-head">
        <div class="ring" style="--p:${s.pct.toFixed(1)}"><span><b>${s.roo}</b><small>ROO</small></span></div>
        <div><div class="sc-name">${esc(s.name)}</div><div class="sc-meta">ROO ${s.pct.toFixed(1)}% ของ ${s.total.toLocaleString()} ร้าน</div></div>
        <button class="sc-xl" data-n="${esc(s.name)}" title="Export ตำบลของเซลล์คนนี้">⬇ xlsx</button>
      </div>
      <div class="sc-nums">
        <div><b>${s.tams.length}</b>ตำบลที่ดูแล</div>
        <div class="g"><b>${s.ok.length}</b>ทำ ROO แล้ว</div>
        <div class="r"><b>${s.no.length}</b>ยังไม่ทำ</div>
      </div>
      <div class="sc-body">
        <h4>ทำ ROO แล้ว</h4>${s.ok.map(t => chipOk(t).replace('<span', '<span' + hit(t))).join('') || '<span class="sc-meta">— ยังไม่มี —</span>'}
        <h4>ยังไม่ได้ทำ ROO</h4>${no.map(t => chipNo(t).replace('<span', '<span' + hit(t))).join('') || '<span class="sc-meta">— ครบทุกตำบลแล้ว —</span>'}
        ${s.no.length > LIMIT ? `<div><button class="sc-more" data-n="${esc(s.name)}">${exp ? 'ย่อ ▴' : `ดูอีก ${s.no.length - LIMIT} ตำบล ▾`}</button></div>` : ''}
      </div>
    </div>`;
  };
  const sections = GROUPS.map(g => {
    const mem = list.filter(s => groupOf.get(s.name) === g);
    if (!mem.length) return '';
    const tot = mem.reduce((a, s) => a + s.total, 0), roo = mem.reduce((a, s) => a + s.roo, 0);
    return `<div class="grp-title"><h3>${g.label}</h3><span>${mem.length} คน · ROO <b>${roo}</b> จาก ${tot.toLocaleString()} ร้าน (${tot ? (roo / tot * 100).toFixed(1) : 0}%)</span></div>` + mem.map(card).join('');
  }).join('');
  document.getElementById('cards').innerHTML = sections || '<div class="empty">ไม่พบเซลล์หรือตำบลที่ค้นหา</div>';
  document.querySelectorAll('.sc-more').forEach(b => b.onclick = () => {
    const n = b.dataset.n; expanded.has(n) ? expanded.delete(n) : expanded.add(n); render();
  });
  document.querySelectorAll('.sc-xl').forEach(b => b.onclick = () => exportSales(SALES.filter(s => s.name === b.dataset.n), b.dataset.n));
}
document.querySelectorAll('#seg button').forEach(b => b.onclick = () => {
  sortBy = b.dataset.v;
  document.querySelectorAll('#seg button').forEach(x => x.classList.toggle('on', x === b));
  render();
});

/* ── Export ── */
function exportSales(list, suffix) {
  const summary = list.map(s => ({
    'กลุ่ม': groupOf.get(s.name).label, 'เซลล์ผู้ดูแล': s.name, 'ร้านทั้งหมด': s.total, 'ร้าน ROO': s.roo, '% ROO': +s.pct.toFixed(1),
    'ตำบลที่ดูแล': s.tams.length, 'ตำบลที่ทำ ROO แล้ว': s.ok.length, 'ตำบลที่ยังไม่ทำ ROO': s.no.length,
  }));
  const detail = list.flatMap(s => [...s.ok, ...s.no].map(t => ({
    'กลุ่ม': groupOf.get(s.name).label, 'เซลล์ผู้ดูแล': s.name, 'ตำบล': t.tam, 'อำเภอ': t.amp, 'จังหวัด': t.prov,
    'ร้านทั้งหมด': t.total, 'ร้าน ROO': t.roo, 'สถานะ': t.roo ? 'ทำ ROO แล้ว' : 'ยังไม่ทำ ROO',
  })));
  if (!detail.length) return showToast('ไม่มีข้อมูลให้ export', 'info');
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(summary), 'สรุปรายเซลล์');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(detail), 'รายตำบล');
  XLSX.writeFile(wb, `Rattana ROO by Sales - ${suffix}`.replace(/[\\/:*?"<>|]/g, '') + '.xlsx');
}
const exportAll = () => exportSales(SALES, GROUPS.find(g => g.key === curGroup)?.label || 'ทุกกลุ่ม');

/* ── Helpers ── */
function toggleDark() {
  document.body.classList.toggle('dark');
  try { localStorage.setItem('rooSalesDark', document.body.classList.contains('dark') ? '1' : ''); } catch {}
}
const set = (id, v) => document.getElementById(id).textContent = v;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function showToast(msg, type = 'info') {
  const t = document.createElement('div'); t.className = `toast toast-${type}`; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 3500);
}
window.addEventListener('scroll', () => document.getElementById('backToTop').classList.toggle('show', window.scrollY > 300));

/* ── Boot ── */
(function init() {
  try { if (localStorage.getItem('rooSalesDark')) document.body.classList.add('dark'); } catch {}
  const c = getCached();
  if (c) {
    ALL = c.data; stamp(c.ts); render();
    document.getElementById('spinner').classList.remove('show');
    loadData(false);
  } else loadData(true);
  setInterval(() => loadData(false), 5 * 60 * 1000);
})();
</script>
</body>
</html>
