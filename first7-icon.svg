<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- ไอคอนแอป "Rattana 7 วันแรก" — ปฏิทิน 7 วัน + ต้นกล้า (พนักงานใหม่เติบโต) + เครื่องหมายถูก
       พื้นเต็มกรอบ (iOS/Android ตัดมุมเอง) · ของสำคัญอยู่ในวงกลมรัศมี 205 (safe zone ของ maskable) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b3a78"/>
      <stop offset="1" stop-color="#0d1b3e"/>
    </linearGradient>
    <linearGradient id="gd" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8c86a"/>
      <stop offset="1" stop-color="#c9a84c"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- ปฏิทิน -->
  <rect x="106" y="118" width="300" height="290" rx="34" fill="#f7f3e8"/>
  <path d="M106 152 a34 34 0 0 1 34 -34 h232 a34 34 0 0 1 34 34 v48 h-300 z" fill="url(#gd)"/>
  <rect x="168" y="92" width="26" height="62" rx="13" fill="#0d1b3e"/>
  <rect x="318" y="92" width="26" height="62" rx="13" fill="#0d1b3e"/>
  <!-- เลข 7 -->
  <text x="236" y="378" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" font-weight="900" font-size="190" fill="#0d1b3e">7</text>
  <!-- ต้นกล้า -->
  <path d="M330 390 C330 350 330 330 330 300" stroke="#1e8449" stroke-width="12" stroke-linecap="round" fill="none"/>
  <path d="M330 318 C300 316 286 296 284 270 C312 270 328 288 330 318 Z" fill="#2ecc71"/>
  <path d="M330 300 C334 268 356 250 386 250 C384 282 364 300 330 300 Z" fill="#27ae60"/>
  <!-- เครื่องหมายถูก -->
  <circle cx="372" cy="384" r="52" fill="#1e8449" stroke="#0d1b3e" stroke-width="10"/>
  <path d="M348 384 l17 18 l32 -36" stroke="#fff" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
