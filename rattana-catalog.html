<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Rattana Catalog v1.5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* ═══ Theme tokens — same system as Rattana Checkout (BUILD 99/148): ทางการ · มัทฉะ · ฟ้าใส · มาการอง · คาร์บอน · กลางคืน ═══ */
:root{
  --navy:#0d1b3e; --navy-mid:#1a2f5e; --navy-light:#243b73;
  --gold:#c9a84c; --gold-light:#e8c86a;
  --success:#2ecc71; --danger:#e74c3c; --warning:#f39c12; --info:#3498db;
  --bg:#eef1f7; --text:#0d1b3e; --card-bg:#ffffff; --muted:#6b7896; --row-alt:#fafbfd;
  --radius-sm:12px; --radius-md:18px; --radius-lg:22px; --radius-xl:28px;
  --navy-rgb:13,27,62; --gold-rgb:201,168,76; --glow-rgb:36,59,115;
  --gold-hi:#ecd27e; --gold-pale:#f3dc93; --bg-top:#f4f6fb; --bg-bot:#e8ecf4; --dk-top:#070c18; --dk-bot:#04070f;
  --glass:rgba(255,255,255,.66); --glass-bd:rgba(255,255,255,.78);
}
body.dark{
  --bg:#060a14; --text:#ffffff; --card-bg:#0f1d42; --border:rgba(255,255,255,.08);
  --muted:#b8c2dc; --row-alt:#0a1226;
  --glass:rgba(255,255,255,.07); --glass-bd:rgba(255,255,255,.10); --bar-glass:rgba(5,9,20,.80);
}
body{
  --shadow-lg:0 8px 24px rgba(var(--navy-rgb),.12); --shadow-gold:0 4px 12px rgba(var(--gold-rgb),.35);
  --border:rgba(var(--navy-rgb),.09); --bar-glass:rgba(var(--navy-rgb),.82);
  --gold-grad:linear-gradient(180deg,var(--gold-hi),var(--gold));
  --shadow-sm:0 1px 2px rgba(var(--navy-rgb),.04),0 6px 18px rgba(var(--navy-rgb),.06);
  --shadow-md:0 1px 2px rgba(var(--navy-rgb),.05),0 12px 32px rgba(var(--navy-rgb),.09);
  /* catalog-level roles (resolved per theme below) */
  --sel-bg:var(--gold-grad); --sel-fg:var(--navy); --price:var(--navy); --thead:var(--navy);
}
body.dark{--border:rgba(255,255,255,.08); --bar-glass:rgba(5,9,20,.80); --price:var(--gold-light)}
body.pastel{--sel-bg:var(--acc-grad); --sel-fg:var(--on-acc,#fff); --price:var(--ink); --thead:var(--ink)}

body[data-theme="macaron"]{
  --text:#5b4a6b; --muted:#a291b3; --navy:#5b4a6b; --navy-rgb:91,74,107; --navy-mid:#7a6690; --navy-light:#a291b3;
  --ink:#d9547d; --ink-rgb:217,84,125;
  --gold:#ffb3c7; --gold-rgb:255,179,199; --gold-light:#ffd3e0; --gold-hi:#ffd3e0; --gold-pale:#ffe3eb;
  --acc-grad:linear-gradient(135deg,#ff9bb8 0%,#c9a6ff 100%); --acc-shadow:0 6px 14px rgba(217,84,125,.28); --gold-grad:var(--acc-grad);
  --head-bg:linear-gradient(120deg,#ffd3e0 0%,#e9dcff 50%,#d4ecff 100%); --head-border:3px dashed rgba(255,255,255,.7);
  --head-shadow:0 4px 14px rgba(200,140,190,.18); --head-btn:rgba(255,255,255,.65); --head-btn-shadow:0 2px 6px rgba(160,100,160,.15);
  --bg:#fff7fa; --dot:#ffe3ec; --card-bg:#ffffff; --row-alt:#fffbfd; --border:#f4e4ee; --glass-bd:#f4e4ee;
  --shadow-sm:0 6px 18px rgba(217,84,125,.10); --shadow-md:0 14px 34px rgba(150,90,170,.18); --shadow-lg:0 14px 34px rgba(150,90,170,.18);
  --p1:#ffc7d6; --on-p:#5b4a6b}
body[data-theme="sky"]{
  --text:#1d3347; --muted:#6c8197; --navy:#1d3347; --navy-rgb:29,51,71; --navy-mid:#2f4e6a; --navy-light:#6c8197;
  --ink:#1688d0; --ink-rgb:22,136,208;
  --gold:#4cb8f0; --gold-rgb:76,184,240; --gold-light:#bfe3fb; --gold-hi:#bfe3fb; --gold-pale:#e0f1fc;
  --acc-grad:linear-gradient(135deg,#5cc6f6,#1f86c9); --acc-shadow:0 6px 14px rgba(31,134,201,.28); --gold-grad:var(--acc-grad);
  --head-bg:linear-gradient(120deg,#d4edfc 0%,#e8f6ff 55%,#dcf3ec 100%); --head-border:2px solid #cde4f4;
  --head-shadow:0 3px 10px rgba(40,110,170,.12); --head-btn:rgba(255,255,255,.78); --head-btn-shadow:0 1px 4px rgba(40,110,170,.14);
  --bg:#eef6fc; --dot:#dcebf7; --card-bg:#ffffff; --row-alt:#f5f9fe; --border:#d9e7f2; --glass-bd:#d9e7f2;
  --shadow-sm:0 4px 14px rgba(40,110,170,.10); --shadow-md:0 12px 30px rgba(30,90,150,.18); --shadow-lg:0 12px 30px rgba(30,90,150,.18);
  --p1:#d4ecfb; --on-p:#24425c}
body[data-theme="matcha"]{
  --text:#2f3a2c; --muted:#857f6c; --navy:#2f3a2c; --navy-rgb:47,58,44; --navy-mid:#4a5646; --navy-light:#857f6c;
  --ink:#557a46; --ink-rgb:85,122,70;
  --gold:#7fa36c; --gold-rgb:127,163,108; --gold-light:#c9dcb6; --gold-hi:#c9dcb6; --gold-pale:#e3ecd6;
  --acc-grad:linear-gradient(135deg,#86ab72,#557a46); --acc-shadow:0 6px 14px rgba(85,122,70,.25); --gold-grad:var(--acc-grad);
  --head-bg:linear-gradient(120deg,#e6eed6 0%,#f3ead2 100%); --head-border:2px solid #e0d6bd;
  --head-shadow:0 3px 10px rgba(120,110,80,.10); --head-btn:rgba(255,255,255,.7); --head-btn-shadow:0 1px 4px rgba(120,110,80,.12);
  --bg:#f5f1e6; --dot:#ebe4d1; --card-bg:#fffdf7; --row-alt:#faf6ec; --border:#e6dfcc; --glass-bd:#e6dfcc;
  --shadow-sm:0 4px 14px rgba(110,100,70,.09); --shadow-md:0 12px 30px rgba(90,80,50,.16); --shadow-lg:0 12px 30px rgba(90,80,50,.16);
  --p1:#dfe8d2; --on-p:#3b4636}
body[data-theme="carbon"]{
  --navy:#1c1e22; --navy-mid:#2d3036; --navy-light:#3a3e45; --navy-rgb:28,30,34;
  --gold:#f5a524; --gold-light:#f7b13c; --gold-rgb:245,165,36; --gold-hi:#f7b13c; --gold-pale:#f9d08a;
  --acc-grad:linear-gradient(135deg,#f7b13c,#e08a0b); --gold-grad:var(--acc-grad);
  --glow-rgb:110,116,126;
  --bg:#1c1e22; --dk-top:#1c1e22; --dk-bot:#1c1e22; --card-bg:#26292e; --row-alt:#2d3036;
  --text:#f1f2f4; --muted:#a9afb8; --border:#3a3e45; --glass-bd:#3a3e45; --bar-glass:linear-gradient(180deg,#2c2f35 0%,#232529 100%);
  --shadow-sm:0 1px 0 rgba(255,255,255,.04),0 6px 16px rgba(0,0,0,.28); --shadow-md:0 12px 30px rgba(0,0,0,.4);
  --sel-bg:var(--acc-grad); --sel-fg:#111; --thead:#383c43}
body[data-theme="formal"]{
  --text:#0f1e36; --muted:#475569; --navy:#011e3e; --navy-rgb:1,30,62; --navy-mid:#1c3b5c; --navy-light:#566579;
  --glow-rgb:28,59,92; --ink:#011e3e; --ink-rgb:1,30,62;
  --gold:#fcb70f; --gold-rgb:252,183,15; --gold-light:#ffe7a0; --gold-hi:#ffd35a; --gold-pale:#fff3d2;
  --acc-grad:linear-gradient(180deg,#ffd35a 0%,#fcb70f 55%,#eaa300 100%); --on-acc:#011e3e; --gold-grad:var(--acc-grad);
  --acc-shadow:inset 0 1px 0 rgba(255,255,255,.7),inset 0 -2px 0 rgba(138,98,0,.22),0 8px 18px -8px rgba(234,163,0,.6);
  --shadow-gold:0 8px 18px -8px rgba(234,163,0,.6);
  --head-bg:rgba(255,255,255,.74); --head-border:1px solid rgba(1,30,62,.08); --head-shadow:0 12px 30px -20px rgba(1,30,62,.45);
  --head-btn:rgba(255,255,255,.9); --head-btn-shadow:inset 0 0 0 1px rgba(1,30,62,.12),0 2px 8px rgba(1,30,62,.06);
  --bg:#eef3f9; --dot:transparent; --card-bg:#ffffff; --row-alt:#f6f9fc; --border:rgba(1,30,62,.10); --glass-bd:rgba(1,30,62,.07);
  --shadow-sm:0 2px 8px rgba(1,30,62,.06); --shadow-md:0 8px 24px rgba(1,30,62,.10); --shadow-lg:0 16px 48px rgba(1,30,62,.14);
  --p1:#fff3d2; --on-p:#011e3e; --price:#011e3e}

/* ═══ Base ═══ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Inter","IBM Plex Sans Thai",-apple-system,BlinkMacSystemFont,sans-serif;font-size:14px;line-height:1.5;letter-spacing:.1px;
  min-height:100dvh;overflow-x:hidden;color:var(--text);transition:background .25s,color .25s;
  background:radial-gradient(900px 520px at -10% -10%,rgba(var(--gold-rgb),.20),transparent 60%),
             radial-gradient(800px 600px at 115% 0%,rgba(var(--glow-rgb),.18),transparent 60%),
             linear-gradient(180deg,var(--bg-top) 0%,var(--bg-bot) 100%) fixed}
body.dark{background:radial-gradient(900px 520px at -10% -10%,rgba(var(--gold-rgb),.12),transparent 60%),
             radial-gradient(800px 600px at 115% 0%,rgba(var(--glow-rgb),.35),transparent 60%),
             linear-gradient(180deg,var(--dk-top) 0%,var(--dk-bot) 100%) fixed}
body.pastel{background:radial-gradient(var(--dot) 1.6px,transparent 1.7px) 0 0/22px 22px,var(--bg)}
body[data-theme="carbon"]{background:var(--bg)}
body[data-theme="formal"]{background:radial-gradient(640px 460px at 100% -140px,rgba(147,197,253,.55),rgba(147,197,253,0) 70%),
             radial-gradient(580px 480px at -160px 100%,rgba(252,183,15,.20),rgba(252,183,15,0) 70%),#eef3f9;background-attachment:fixed}
button{font-family:inherit;cursor:pointer;border:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
input,select{font-family:inherit;font-size:16px}

/* ═══ Header ═══ */
header{position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:8px;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));
  background:var(--bar-glass);color:#fff;-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px)}
body.pastel header{background:var(--head-bg);color:var(--text);border-bottom:var(--head-border);box-shadow:var(--head-shadow)}
body[data-theme="carbon"] header{border-bottom:2px solid #b9bfc7}
.logo-text{font-weight:700;letter-spacing:1.2px;font-size:16px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.logo-text span{color:var(--gold)}
body.pastel .logo-text span{color:var(--ink)}
body[data-theme="formal"] .logo-text span{color:#8a6200}
.ver{font-size:9.5px;font-weight:800;padding:2px 5px;border-radius:6px;background:var(--gold);color:var(--navy);letter-spacing:.2px;font-style:normal}
body.pastel .ver{background:var(--ink);color:#fff}
.hgrow{flex:1}
.icon-btn,.hub-btn{border-radius:999px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.16);color:#fff;flex-shrink:0;transition:background .15s}
.icon-btn{width:38px;height:38px;display:flex;align-items:center;justify-content:center;font-size:17px}
.icon-btn:hover,.hub-btn:hover{background:rgba(255,255,255,.2)}
.hub-btn{display:flex;align-items:center;gap:6px;padding:5px 12px 5px 6px;font-size:13px;font-weight:600;text-decoration:none;white-space:nowrap;min-height:38px}

body.pastel .icon-btn,body.pastel .hub-btn{background:var(--head-btn);color:var(--text);border-color:transparent;box-shadow:var(--head-btn-shadow)}
body[data-theme="carbon"] .icon-btn,body[data-theme="carbon"] .hub-btn{background:#383c43;border-color:transparent}
@media(max-width:420px){.logo-text{font-size:14.5px;letter-spacing:.8px}.hub-btn-text{display:none}.hub-btn{padding:5px}}

/* ═══ Filter bar ═══ */
.filters{position:sticky;top:var(--hdr-h,58px);z-index:90;padding:10px 12px;background:var(--glass);border-bottom:1px solid var(--glass-bd);
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px)}
@media(max-width:639px){.filters.adv-open{position:static}}
.filters-inner{max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.search-row{display:flex;gap:8px}
.search-box{flex:1;position:relative}
.search-box input{width:100%;height:44px;border-radius:13px;border:1px solid var(--border);background:var(--card-bg);color:var(--text);padding:0 40px;outline:none;box-shadow:var(--shadow-sm);transition:border-color .15s,box-shadow .15s}
.search-box input:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(var(--gold-rgb),.22)}
.search-box input::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
.search-box .s-ico{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none;display:flex}
.search-box .s-clear{position:absolute;right:7px;top:50%;transform:translateY(-50%);background:var(--row-alt);color:var(--muted);font-size:13px;width:28px;height:28px;border-radius:50%;display:none}
.search-box .s-clear.show{display:block}
.adv-btn{height:44px;min-width:44px;padding:0 14px;border-radius:13px;background:var(--card-bg);color:var(--text);border:1px solid var(--border);box-shadow:var(--shadow-sm);font-weight:600;font-size:13px;display:flex;align-items:center;gap:6px;position:relative}
.adv-btn.on{background:var(--sel-bg);color:var(--sel-fg);border-color:transparent}
.adv-btn .dot{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--danger);display:none}
.adv-btn.active .dot{display:block}
@media(max-width:420px){.adv-btn .ab-t{display:none}}

.f-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(min-width:760px){.f-grid{grid-template-columns:repeat(4,1fr)}}
.f-lbl{display:block;font-size:11px;font-weight:600;color:var(--muted);margin:0 0 3px 4px}
.adv{display:none;grid-template-columns:repeat(2,1fr);gap:8px}
.adv.open{display:grid}
@media(min-width:760px){.adv{grid-template-columns:repeat(4,1fr)}}
.sel{width:100%;height:44px;padding:0 10px;border-radius:13px;border:1px solid var(--border);background:var(--card-bg);color:var(--text);outline:none;font-size:15px}
.tg{display:flex;align-items:center;gap:8px;height:44px;padding:0 12px;border-radius:13px;border:1px solid var(--border);background:var(--card-bg);color:var(--text);font-size:13.5px;cursor:pointer;user-select:none;align-self:end}
.tg input{width:18px;height:18px;accent-color:var(--gold)}

/* searchable dropdown (Checkout .dd look) */
.dd-wrap{position:relative;width:100%}
.dd-trigger{width:100%;height:44px;padding:0 8px 0 12px;background:var(--card-bg);border:1px solid var(--border);border-radius:13px;color:var(--text);font-size:14.5px;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:6px;box-shadow:var(--shadow-sm)}
.dd-trigger .dd-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dd-trigger .dd-label.ph{color:var(--muted)}
.dd-chev{width:26px;height:26px;border-radius:50%;background:var(--row-alt);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--muted);font-size:10px;transition:transform .15s}
.dd-wrap.has .dd-trigger{border-color:var(--gold);box-shadow:0 0 0 3px rgba(var(--gold-rgb),.18)}
.dd-wrap.has .dd-chev{background:var(--sel-bg);color:var(--sel-fg)}
.dd-wrap.open .dd-chev{transform:rotate(180deg)}
.dd-panel{position:absolute;top:calc(100% + 6px);left:0;min-width:100%;width:max-content;max-width:min(92vw,380px);background:var(--card-bg);border:1px solid var(--border);border-radius:16px;z-index:500;box-shadow:var(--shadow-md);max-height:320px;display:none;flex-direction:column;overflow:hidden}
.dd-wrap.right .dd-panel{left:auto;right:0}
.dd-wrap.open .dd-panel{display:flex}
.dd-search{padding:11px 14px;font-size:16px;border:none;border-bottom:1px solid var(--border);background:transparent;color:var(--text);outline:none}
.dd-list{overflow-y:auto;flex:1;list-style:none;padding:4px}
.dd-list li{padding:9px 10px;cursor:pointer;font-size:14px;border-radius:10px;display:flex;justify-content:space-between;gap:10px}
.dd-list li span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dd-list li .c-n{color:var(--muted);font-size:12px;flex-shrink:0}
.dd-list li:hover{background:var(--row-alt)}
.dd-list li.sel-on{background:var(--sel-bg);color:var(--sel-fg);font-weight:600}
.dd-list li.sel-on .c-n{color:inherit;opacity:.75}

/* ═══ Content ═══ */
.content{max-width:1200px;margin:0 auto;padding:12px;padding-bottom:90px}
.result-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.r-count{font-size:13px;color:var(--muted)}
.r-count b{color:var(--text);font-size:15px}
.link-btn{background:transparent;color:var(--price);font-weight:600;font-size:13px;text-decoration:underline;padding:4px}

.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr);gap:14px}}
@media(min-width:900px){.grid{grid-template-columns:repeat(4,1fr)}}
@media(min-width:1150px){.grid{grid-template-columns:repeat(5,1fr)}}
.p-card{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;cursor:pointer;transition:transform .12s,box-shadow .15s;animation:fadeIn .25s ease}
.p-card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px)}
.p-card:active{transform:scale(.98)}
.p-img{aspect-ratio:1/1;background:#fff;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
body.dark .p-img{margin:6px 6px 0;border-radius:12px}
.p-img img{width:100%;height:100%;object-fit:contain;padding:8px}
.p-img .noimg{font-size:38px;opacity:.3}
.p-stock{position:absolute;top:7px;left:7px;font-size:10.5px;font-weight:700;color:#1e8449;background:rgba(255,255,255,.92);padding:1px 7px;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.p-body{padding:9px 11px 11px;display:flex;flex-direction:column;gap:2px;flex:1}
.p-type{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-name{font-size:13.5px;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:36px}
.p-code{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;color:var(--muted)}
.p-price{margin-top:auto;padding-top:6px}
.p-main{display:flex;align-items:baseline;gap:4px;flex-wrap:wrap}
.p-main .lv{font-size:9.5px;font-weight:800;padding:1px 5px;border-radius:5px;background:var(--sel-bg);color:var(--sel-fg);align-self:center}
.p-main .pv{font-size:17px;font-weight:800;color:var(--price);font-variant-numeric:tabular-nums}
.p-main .pu{font-size:11px;color:var(--muted)}
.p-sub{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:1px}
.p-sub b{font-weight:600;color:var(--text);opacity:.8}

.empty{text-align:center;padding:60px 20px;color:var(--muted);grid-column:1/-1}
.empty .e-ico{font-size:46px;margin-bottom:8px}
.sentinel{height:40px}
.skeleton{background:linear-gradient(90deg,var(--border) 25%,var(--row-alt) 50%,var(--border) 75%);background-size:200% 100%;animation:shimmer 1.2s infinite;border-radius:var(--radius-md);aspect-ratio:3/4.5}

/* ═══ Product sheet ═══ */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(10,10,20,.45);z-index:9000;align-items:flex-end;justify-content:center;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.modal-overlay.open{display:flex}
@media(min-width:640px){.modal-overlay{align-items:center;padding:16px}}
.modal{background:var(--card-bg);color:var(--text);border-radius:24px 24px 0 0;max-width:600px;width:100%;max-height:92dvh;overflow-y:auto;animation:thUp .25s ease;position:relative;padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -10px 30px rgba(0,0,0,.2)}
@media(min-width:640px){.modal{border-radius:24px}}
.m-grip{width:44px;height:5px;border-radius:3px;background:var(--border);margin:10px auto 0}
.modal-close{position:sticky;top:8px;float:right;margin:4px 10px 0 0;width:36px;height:36px;border-radius:50%;background:var(--row-alt);border:1px solid var(--border);color:var(--muted);font-size:16px;z-index:2}
.m-img{background:#fff;display:flex;align-items:center;justify-content:center;min-height:220px;max-height:360px;margin:8px 14px 0;border-radius:18px;border:1px solid var(--border);overflow:hidden}
.m-img img{max-width:100%;max-height:340px;object-fit:contain;padding:10px}
.m-img .noimg{font-size:70px;opacity:.3;padding:40px}
.m-body{padding:14px 18px 22px}
.m-crumb{font-size:12px;color:var(--muted);margin-bottom:2px}
.m-name{font-size:19px;font-weight:700;line-height:1.35}
.m-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;font-size:12.5px;color:var(--muted)}
.m-meta .ok{color:#1e8449;font-weight:700}
body.dark .m-meta .ok{color:#7be0a3}
.m-meta .no{color:var(--danger);font-weight:700}
.m-sec{margin-top:16px}
.m-sec h4{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:14px}
.price-tbl{width:100%;border-collapse:collapse;min-width:420px}
.price-tbl th{background:var(--thead);color:#fff;font-size:12px;font-weight:600;padding:9px 10px;text-align:left;white-space:nowrap}
.price-tbl th.r{text-align:right}
.price-tbl th.main{background:var(--sel-bg);color:var(--sel-fg)}
.price-tbl td{padding:9px 10px;font-size:13px;border-top:1px solid var(--border);white-space:nowrap}
.price-tbl td.num{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.price-tbl td.num.main{font-weight:800;color:var(--price);font-size:14px}
.price-tbl td.code{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:12px;padding-left:18px}
.price-tbl th:last-child{padding-left:18px}
.copy-btn{background:transparent;color:var(--muted);font-size:13px;padding:0 4px}
.kv{display:grid;grid-template-columns:100px 1fr;gap:7px 10px;font-size:13px;background:var(--row-alt);border-radius:14px;padding:12px 14px}
.kv dt{color:var(--muted)}
.kv dd{font-weight:500;word-break:break-word}
.stock-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.st{background:var(--row-alt);border:1px solid var(--border);border-radius:14px;padding:8px;text-align:center}
.st.has{border-color:rgba(46,204,113,.55);background:rgba(46,204,113,.08)}
.st .w{font-size:11px;color:var(--muted);font-weight:600}
.st .v{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.m-desc{font-size:13px;line-height:1.6;background:var(--row-alt);border-radius:14px;padding:10px 12px}

/* ═══ Theme picker (same as Checkout) ═══ */
.th-ov{position:fixed;inset:0;background:rgba(10,10,20,.45);z-index:9600;display:none;align-items:flex-end;justify-content:center;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.th-ov.open{display:flex}
.th-sheet{background:var(--card-bg);color:var(--text);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:10px 16px max(18px,env(safe-area-inset-bottom));max-height:88dvh;overflow-y:auto;animation:thUp .25s ease;box-shadow:0 -10px 30px rgba(0,0,0,.2)}
.th-grip{width:44px;height:5px;border-radius:3px;background:var(--border);margin:0 auto 10px}
.th-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.th-head h3{font-size:17px;font-weight:800}
.th-head small{display:block;font-size:12px;color:var(--muted);font-weight:400}
.th-x{width:36px;height:36px;border-radius:50%;flex-shrink:0;background:var(--row-alt);border:1px solid var(--border);font-size:16px;color:var(--muted)}
.th-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding-top:8px}
@media(min-width:520px){.th-grid{grid-template-columns:repeat(3,1fr)}}
.th-card{border:2px solid var(--border);border-radius:16px;padding:7px 7px 9px;text-align:left;background:var(--row-alt);color:var(--text);position:relative;transition:transform .12s,border-color .15s}
.th-card:active{transform:scale(.97)}
.th-card.sel{border-color:var(--gold);box-shadow:0 0 0 3px rgba(var(--gold-rgb),.28)}
body.pastel .th-card.sel{border-color:var(--ink);box-shadow:0 0 0 3px rgba(var(--ink-rgb),.2)}
body[data-theme="formal"] .th-card.sel{border-color:#eaa300;box-shadow:0 0 0 3px rgba(252,183,15,.35)}
.th-prev{height:82px;border-radius:11px;overflow:hidden;position:relative;border:1px solid rgba(0,0,0,.06)}
.th-prev .pv-h{height:20px;display:flex;align-items:center;gap:4px;padding:0 7px}
.th-prev .pv-h i{width:9px;height:9px;border-radius:3px}
.th-prev .pv-h b{height:5px;width:34px;border-radius:3px;opacity:.85}
.th-prev .pv-card{position:absolute;left:7px;right:7px;top:27px;height:22px;border-radius:7px;display:flex;align-items:center;gap:5px;padding:0 6px}
.th-prev .pv-card i{width:12px;height:12px;border-radius:50%}
.th-prev .pv-card b{height:4px;flex:1;border-radius:2px;opacity:.5}
.th-prev .pv-row{position:absolute;left:7px;right:7px;bottom:7px;height:20px;display:flex;gap:5px}
.th-prev .pv-row span{flex:1;border-radius:6px}
.th-prev .pv-row em{width:30px;border-radius:10px}
.th-name{font-weight:700;font-size:14px;margin-top:7px;display:flex;align-items:center;gap:5px}
.th-desc{font-size:11.5px;color:var(--muted);line-height:1.35;margin-top:1px}
.th-rec{position:absolute;top:-8px;right:8px;background:var(--gold-grad);color:var(--navy);font-size:10.5px;font-weight:700;padding:1px 8px;border-radius:10px;box-shadow:var(--shadow-gold)}
.th-check{margin-left:auto;width:18px;height:18px;border-radius:50%;background:var(--gold);color:var(--navy);font-size:11px;display:none;align-items:center;justify-content:center}
.th-card.sel .th-check{display:flex}
body.pastel .th-rec,body.pastel .th-check{background:var(--acc-grad);color:var(--on-acc,#fff)}

/* ═══ View toggle ═══ */
.rb-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.seg{display:inline-flex;background:var(--card-bg);border:1px solid var(--border);border-radius:12px;padding:3px;box-shadow:var(--shadow-sm)}
.seg button{background:transparent;color:var(--muted);font-size:12.5px;font-weight:600;padding:6px 11px;border-radius:9px;display:flex;align-items:center;gap:5px;white-space:nowrap}
.seg button.on{background:var(--sel-bg);color:var(--sel-fg)}

/* ═══ Book mode ═══ */
body.book-mode .filters{position:relative}
body.book-mode .grid,body.book-mode .sentinel{display:none}
.book-wrap{display:none;user-select:none;-webkit-user-select:none}
body.book-mode .book-wrap{display:block}
.bk-empty{display:none;text-align:center;padding:60px 20px;color:var(--muted)}
.bk-empty .e-ico{font-size:46px;margin-bottom:8px}
.book-stage{display:flex;justify-content:center;padding:4px 0 2px;overflow-x:clip}
.book{position:relative;perspective:2800px;transition:transform .5s ease;touch-action:pan-y;flex-shrink:0}
.bk-page{position:absolute;top:0;height:100%}
.book.single .bk-left{display:none}
.book.single .bk-right{left:0;width:100%}
.book.spread .bk-left{left:0;width:50%}
.book.spread .bk-right{left:50%;width:50%}
.book.spread::after{content:'';position:absolute;left:50%;top:0;bottom:0;width:2px;margin-left:-1px;background:rgba(0,0,0,.10);z-index:3;pointer-events:none}
.bk-leaf{position:absolute;top:0;height:100%;transform-origin:left center;transform-style:preserve-3d;display:none;z-index:5;will-change:transform}
.book.single .bk-leaf{left:0;width:100%}
.book.spread .bk-leaf{left:50%;width:50%}
.bk-leaf.on{display:block}
.bk-face{position:absolute;inset:0;-webkit-backface-visibility:hidden;backface-visibility:hidden}
.bk-back{transform:rotateY(180deg)}
.pgc{position:absolute;inset:0}
.shade,.ushade{position:absolute;inset:0;pointer-events:none;opacity:0}
.bk-front .shade{background:linear-gradient(to right,rgba(0,0,0,.12),rgba(0,0,0,.45))}
.bk-back .shade{background:linear-gradient(to left,rgba(0,0,0,.12),rgba(0,0,0,.45))}
.bk-right .ushade{background:linear-gradient(to right,rgba(0,0,0,.5),rgba(0,0,0,.1) 35%,transparent 70%)}
.bk-left .ushade{background:linear-gradient(to left,rgba(0,0,0,.5),rgba(0,0,0,.1) 35%,transparent 70%)}

/* paper */
.pg{position:absolute;inset:0;background:var(--card-bg);color:var(--text);display:flex;flex-direction:column;padding:12px 14px 8px;border:1px solid var(--border);box-shadow:var(--shadow-md);overflow:hidden}
.pg.S,.pg.R{border-radius:4px 14px 14px 4px}
.pg.L{border-radius:14px 4px 4px 14px}
.pg.L::before,.pg.R::before,.pg.S::before{content:'';position:absolute;top:0;bottom:0;width:34px;pointer-events:none;z-index:1}
.pg.L::before{right:0;background:linear-gradient(to left,rgba(0,0,0,.10),transparent)}
.pg.R::before,.pg.S::before{left:0;background:linear-gradient(to right,rgba(0,0,0,.10),transparent)}
.pg.empty{background:transparent;border:none;box-shadow:none}
.pg.empty::before{display:none}
.pg.back-paper{background:linear-gradient(to left,var(--row-alt),var(--card-bg))}
.pg-head{display:flex;justify-content:space-between;gap:8px;font-size:10.5px;color:var(--muted);font-weight:600;letter-spacing:.3px;padding-bottom:6px;border-bottom:1px solid var(--border);margin-bottom:8px;flex-shrink:0}
.pg-head span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pg-head span:last-child{flex-shrink:0;letter-spacing:1px}
.pg-band{background:var(--sel-bg);color:var(--sel-fg);border-radius:10px;padding:0 12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:8px;height:38px;flex-shrink:0}
.pg-band b{font-size:15px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pg-band small{font-size:11px;font-weight:600;opacity:.8;flex-shrink:0}
.pg-grid{flex:1;display:grid;gap:6px;min-height:0}
.pg-foot{text-align:center;font-size:10.5px;color:var(--muted);padding-top:6px;font-variant-numeric:tabular-nums;flex-shrink:0}
.bi{display:flex;flex-direction:column;min-height:0;min-width:0;border-radius:10px;padding:5px;cursor:pointer;transition:background .12s}
.bi:hover{background:var(--row-alt)}
.bi-img{flex:1;min-height:40px;background:#fff;border-radius:8px;display:flex;align-items:center;justify-content:center;overflow:hidden;border:1px solid var(--border)}
.bi-img img{width:100%;height:100%;object-fit:contain;padding:4px}
.bi-img .noimg{font-size:26px;opacity:.3}
.bi-name{font-size:11.5px;font-weight:600;line-height:1.3;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:30px;flex-shrink:0}
.bi-price{display:flex;align-items:baseline;gap:3px;margin-top:2px;flex-shrink:0;white-space:nowrap}
.bi-price .lv{font-size:8.5px;font-weight:800;padding:0 4px;border-radius:4px;background:var(--sel-bg);color:var(--sel-fg);align-self:center}
.bi-price b{font-size:14px;font-weight:800;color:var(--price);font-variant-numeric:tabular-nums}
.bi-price small{font-size:10px;color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.bi-sub,.bi-code{font-size:9.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:0;font-variant-numeric:tabular-nums}
.bi-code{font-family:ui-monospace,'SF Mono',Menlo,monospace}
.c3 .bi-name{font-size:12.5px;min-height:33px}
.c3 .bi-price b{font-size:16px}
.c3 .bi-sub,.c3 .bi-code{font-size:10.5px}

/* cover / end */
.pg.cover{background:radial-gradient(circle at 85% 8%,rgba(var(--gold-rgb),.38),transparent 55%),radial-gradient(circle at 0% 100%,rgba(255,255,255,.10),transparent 50%),var(--thead);color:#fff;border:none;padding:calc(var(--pw)*.07) calc(var(--pw)*.07) calc(var(--pw)*.05);cursor:pointer}
.cv-top{font-size:calc(var(--pw)*.032);letter-spacing:3px;font-weight:700;opacity:.9}
.cv-top span{color:var(--gold)}
body.pastel .cv-top span{color:#fff;opacity:.75}
.cv-year{font-size:calc(var(--pw)*.028);opacity:.6;margin-top:2px}
.cv-art{flex:1;min-height:0;width:100%;margin:calc(var(--pw)*.03) 0 calc(var(--pw)*.02)}
.cv-art .halo{fill:rgba(var(--gold-rgb),.16)}
.cv-art .ring{fill:none;stroke:rgba(255,255,255,.18);stroke-width:1;stroke-dasharray:3 5}
.cv-art .box rect:first-child{fill:rgba(255,255,255,.10);stroke:rgba(255,255,255,.7);stroke-width:1.6}
.cv-art .ln{stroke:rgba(255,255,255,.35);stroke-width:1.2}
.cv-art .tape{fill:var(--gold)}
.cv-art .string{fill:none;stroke:rgba(255,255,255,.6);stroke-width:1.2}
.cv-art .tag{fill:var(--gold)}
.cv-art .hole{fill:var(--thead)}
.cv-art .tag-t{fill:var(--thead);font-weight:800;font-size:17px;text-anchor:middle;font-family:inherit}
.cv-art .spark{fill:var(--gold)}
.cv-art .spark.sm{opacity:.7}
.cv-title{font-size:calc(var(--pw)*.095);font-weight:800;line-height:1.15;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;flex-shrink:0}
.cv-sub{font-size:calc(var(--pw)*.034);opacity:.8;margin-top:6px;flex-shrink:0}
.cv-rule{width:48px;height:4px;border-radius:2px;background:var(--gold);margin:calc(var(--pw)*.04) 0 calc(var(--pw)*.03);flex-shrink:0}

/* ═══ Misc ═══ */
#loadingBar{position:fixed;top:0;left:0;height:3px;background:var(--gold);width:0;transition:width .4s;z-index:10000}
.spinner-overlay{display:none;position:fixed;inset:0;background:rgba(10,10,20,.45);align-items:center;justify-content:center;z-index:99999;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.spinner-overlay.show{display:flex}
.spinner-box{background:var(--card-bg);color:var(--text);border-radius:22px;padding:28px 38px;text-align:center;min-width:230px;box-shadow:var(--shadow-md)}
.spinner-ring{width:46px;height:46px;border:5px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
.toast{position:fixed;bottom:max(24px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);padding:11px 20px;border-radius:14px;color:#fff;z-index:9999;animation:fadeIn .3s ease;font-weight:500;box-shadow:var(--shadow-lg);max-width:90vw;font-size:13px}
.toast-success{background:#1e8449}.toast-error{background:var(--danger)}.toast-info{background:var(--navy-mid)}
#backToTop{position:fixed;bottom:max(24px,calc(16px + env(safe-area-inset-bottom)));right:max(16px,calc(12px + env(safe-area-inset-right)));background:var(--sel-bg);color:var(--sel-fg);border-radius:50%;width:46px;height:46px;display:none;align-items:center;justify-content:center;box-shadow:var(--shadow-md);z-index:90;font-size:18px;font-weight:700}
#backToTop.show{display:flex}
.foot{text-align:center;font-size:11px;color:var(--muted);padding:22px 0 0}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes thUp{from{transform:translateY(40px);opacity:0}}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes shimmer{to{background-position:-200% 0}}
</style>
</head>

<script>
/* ================= CONFIG ================= */
const APP_VERSION = '1.5';
const SHEET_ID = '16mYDqAqqJma-_0vCIAajy6bcjdOZ7F6VagxkdkqAB2I';
const SHEET_GID = '635140262'; // PDDT
/* Columns fetched (gviz select keeps payload small) — [n] = position in the CSV
   [0]A name [1]B code EA [2]H code CS [3]D code PA [4]J unit EA [5]K unit PA [6]M unit CS
   [7-9]AW,AX,AZ S03 EA/PA/CS  [10-12]AS,AT,AV S02  [13-15]AO,AP,AR S01
   [16]BB CAT TYPE [17]BC CAT GROUP [18]BD CAT BRAND [19]BE CAT SIZE [20]BF CAT VENDOR
   [21]BK DESCRIPTION [22]BL FIRST STOCK DATE [23-26]BN-BQ STOCK W1-W4 [27]CV image */
const COLS = ['A','B','H','D','J','K','M','AW','AX','AZ','AS','AT','AV','AO','AP','AR','BB','BC','BD','BE','BF','BK','BL','BN','BO','BP','BQ','CV'];
const CACHE_KEY = 'rattana_catalog_v1_1';
const CACHE_TTL = 30 * 60 * 1000;
const PAGE = 48;
const WH = ['W1','W2','W3','W4'];
const LV = ['S03','S02','S01'];

/* ================= THEME (same set as Rattana Checkout) ================= */
const THEME_KEY = 'rattana_theme', SKIN_KEY = 'rattana_catalog_skin';
const THEMES = [
  { id:'formal', name:'ทางการ', emo:'🏛️', desc:'Rattana CI · กรมท่า-ทอง กระจกใส', dark:false, pastel:true, color:'#f4f7fb',
    pv:{ head:'rgba(255,255,255,.9)', bg:'radial-gradient(90px 60px at 100% 0,#bfdbfe,transparent 70%),#eef3f9', card:'#ffffff', fg:'#011e3e', a:'#fcb70f', b:'#011e3e', c:'#dbeafe' } },
  { id:'matcha', name:'มัทฉะ', emo:'🍵', desc:'กระดาษอุ่น เขียวชา อ่านง่าย สบายตาทั้งวัน', dark:false, pastel:true, color:'#e6eed6', rec:true,
    pv:{ head:'linear-gradient(120deg,#e6eed6,#f3ead2)', bg:'#f5f1e6', card:'#fffdf7', fg:'#2f3a2c', a:'#7fa36c', b:'#d9b26a', c:'#c98b6b' } },
  { id:'sky', name:'ฟ้าใส', emo:'☁️', desc:'ฟ้าสดใส โปร่ง สบายตา เหมือนวันฟ้าเปิด', dark:false, pastel:true, color:'#d4edfc',
    pv:{ head:'linear-gradient(120deg,#d4edfc,#e8f6ff,#dcf3ec)', bg:'#eef6fc', card:'#ffffff', fg:'#1d3347', a:'#4cb8f0', b:'#ffcf5c', c:'#4fc3a1' } },
  { id:'macaron', name:'มาการอง', emo:'🧁', desc:'พาสเทลหวานๆ สดใส', dark:false, pastel:true, color:'#ffd3e0',
    pv:{ head:'linear-gradient(120deg,#ffd3e0,#e9dcff,#d4ecff)', bg:'#fff7fa', card:'#ffffff', fg:'#5b4a6b', a:'#ffb3c7', b:'#c5b0ff', c:'#93dfc0' } },
  { id:'carbon', name:'คาร์บอน', emo:'🖤', desc:'กราไฟต์แซมเงิน เรียบ เท่ สีเดียวพอ', dark:true, color:'#2c2f35',
    pv:{ head:'linear-gradient(180deg,#2c2f35,#232529)', bg:'#1c1e22', card:'#e9ebee', fg:'#9aa0a9', a:'#f5a524', b:'#4b5059', c:'#2e3237' } },
  { id:'night', name:'กลางคืน', emo:'🌙', desc:'กรมท่า-ทอง โหมดมืด (แบบเดิม)', dark:true, color:'#05080f',
    pv:{ head:'#0b1430', bg:'#060a14', card:'#0f1d42', fg:'#b8c2dc', a:'#c9a84c', b:'#1f3563', c:'#0a1226' } },
];
let curTheme = THEMES[0];
const themeById = id => THEMES.find(t => t.id === id) || THEMES[0];
function LSget(k){ try{ return localStorage.getItem(k); }catch{ return null; } }
function LSset(k,v){ try{ localStorage.setItem(k,v); }catch{} }
function applyTheme(id, persist){
  const t = themeById(id); curTheme = t;
  document.body.dataset.theme = t.id;
  document.body.classList.toggle('dark', t.dark);
  document.body.classList.toggle('pastel', !!t.pastel);
  document.querySelector('meta[name="theme-color"]').content = t.color;
  if(persist){ LSset(SKIN_KEY, t.id); LSset(THEME_KEY, t.dark ? 'dark' : 'light'); }
  if(document.getElementById('thOv').classList.contains('open')) renderThemeGrid();
}
function renderThemeGrid(){
  document.getElementById('themeGrid').innerHTML = THEMES.map(t => { const p = t.pv; return `
    <button type="button" class="th-card ${t.id === curTheme.id ? 'sel' : ''}" onclick="applyTheme('${t.id}', true)">
      ${t.rec ? '<span class="th-rec">✨ แนะนำ</span>' : ''}
      <div class="th-prev" style="background:${p.bg}">
        <div class="pv-h" style="background:${p.head}"><i style="background:${p.a}"></i><b style="background:${t.pastel ? p.fg : '#fff'}"></b></div>
        <div class="pv-card" style="background:${p.card}"><i style="background:${p.b}"></i><b style="background:${p.fg}"></b></div>
        <div class="pv-row"><span style="background:${p.c}"></span><span style="background:${p.card}"></span><em style="background:${p.a}"></em></div>
      </div>
      <div class="th-name">${t.emo} ${t.name}<span class="th-check">✓</span></div>
      <div class="th-desc">${t.desc}</div>
    </button>`; }).join('');
}
function openThemes(){ renderThemeGrid(); document.getElementById('thOv').classList.add('open'); }
function closeThemes(){ document.getElementById('thOv').classList.remove('open'); }
applyTheme(LSget(SKIN_KEY) || (LSget(THEME_KEY) === 'dark' ? 'night' : 'formal'));

/* ================= UI HELPERS ================= */
const $ = id => document.getElementById(id);
const showSpinner = (m='กำลังโหลด...') => { $('spinnerMsg').textContent = m; $('spinner').classList.add('show'); };
const hideSpinner = () => $('spinner').classList.remove('show');
const setLoading = on => $('loadingBar').style.width = on ? '85%' : '0';
function showToast(msg, type='info'){ const t=document.createElement('div'); t.className=`toast toast-${type}`; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),3000); }
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtPrice = n => n.toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtNum = n => n.toLocaleString('th-TH',{maximumFractionDigits:2});
function formatThaiDate(s){ if(!s) return '-'; const d=new Date(String(s).replace(/\//g,'-')); if(isNaN(d)) return '-'; return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()+543}`; }
function formatThaiDateTime(ts){ const d=new Date(ts); return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()+543} ${String(d.getHours()).padStart(2,'0')}.${String(d.getMinutes()).padStart(2,'0')}`; }

/* ================= CSV ================= */
function parseCsvRows(text){
  if(!text) return [];
  if(text.charCodeAt(0)===0xFEFF) text=text.slice(1);
  const rows=[]; let row=[], cell='', q=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=ch; }
    else if(ch==='"') q=true;
    else if(ch===','){ row.push(cell); cell=''; }
    else if(ch==='\r'){}
    else if(ch==='\n'){ row.push(cell); rows.push(row); row=[]; cell=''; }
    else cell+=ch;
  }
  if(cell.length||row.length){ row.push(cell); rows.push(row); }
  return rows;
}
const clean = s => String(s||'').replace(/[​‌‍﻿]/g,'').replace(/ /g,' ').trim();
const num = s => { const n = parseFloat(String(s||'').replace(/,/g,'')); return isFinite(n) ? n : 0; };
function driveId(url){ if(!url) return ''; const m = url.match(/[?&]id=([\w-]{10,})/) || url.match(/\/d\/([\w-]{10,})/); return m ? m[1] : ''; }
const thumb = (id, w=400) => `https://drive.google.com/thumbnail?id=${id}&sz=w${w}`;
// "ลังx12(CS)" -> {name:'ลัง', qty:12}
function unitInfo(s){ s=clean(s); if(!s) return null; const m=s.match(/^(.*?)x\s*([\d.]+)/i); return m ? {name:m[1].trim()||s, qty:num(m[2]), raw:s} : {name:s, qty:1, raw:s}; }

function toProducts(rows){
  const out=[];
  for(let i=1;i<rows.length;i++){
    const r=rows[i].map(clean);
    if(!r[0]) continue;
    out.push({
      n:r[0], ea:r[1], cs:r[2], pa:r[3], uEA:r[4], uPA:r[5], uCS:r[6],
      // pr[level][unit] : level 0=S03 1=S02 2=S01 · unit 0=EA 1=PA 2=CS
      pr:[[num(r[7]),num(r[8]),num(r[9])],[num(r[10]),num(r[11]),num(r[12])],[num(r[13]),num(r[14]),num(r[15])]],
      ty:r[16]||'ไม่ระบุ', gr:r[17]||'ไม่ระบุ', br:r[18]||'ไม่ระบุ', sz:r[19]||'ไม่ระบุ', vd:r[20]||'ไม่ระบุ',
      ds:r[21], fd:r[22], st:[num(r[23]),num(r[24]),num(r[25]),num(r[26])], img:driveId(r[27])
    });
  }
  return out;
}

/* ================= CACHE (IndexedDB) ================= */
const idb = {
  db:null,
  open(){ return this.db ? Promise.resolve(this.db) : new Promise((res,rej)=>{ const q=indexedDB.open('rattana_catalog',1); q.onupgradeneeded=()=>q.result.createObjectStore('kv'); q.onsuccess=()=>{this.db=q.result;res(this.db)}; q.onerror=()=>rej(q.error); }); },
  async get(k){ const db=await this.open(); return new Promise(res=>{ const q=db.transaction('kv').objectStore('kv').get(k); q.onsuccess=()=>res(q.result); q.onerror=()=>res(null); }); },
  async set(k,v){ const db=await this.open(); return new Promise(res=>{ const t=db.transaction('kv','readwrite'); t.objectStore('kv').put(v,k); t.oncomplete=()=>res(); t.onerror=()=>res(); }); },
  async del(k){ const db=await this.open(); return new Promise(res=>{ const t=db.transaction('kv','readwrite'); t.objectStore('kv').delete(k); t.oncomplete=()=>res(); t.onerror=()=>res(); }); }
};
async function fetchProducts(){
  const tq = encodeURIComponent('select ' + COLS.join(','));
  const res = await fetch(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&gid=${SHEET_GID}&tq=${tq}`);
  if(!res.ok) throw new Error('HTTP '+res.status);
  const prods = toProducts(parseCsvRows(await res.text()));
  if(!prods.length) throw new Error('empty');
  return prods;
}

/* ================= STATE / FILTER ================= */
let ALL = [], filtered = [], shown = 0;
const FKEYS = ['gr','br','vd','sz'];
const state = { q:'', qTokens:[], gr:'', br:'', vd:'', sz:'', wh:'', imgOnly:false, priceOnly:false, sort:'name' };

// main price = S03 (EA → PA → CS)
function mainUnitIdx(p){ const a=p.pr[0]; return a[2]?2:a[1]?1:a[0]?0:-1; }
function mainPrice(p){ const i=mainUnitIdx(p); return i<0 ? 0 : p.pr[0][i]; }
function totalStock(p){ return p.st[0]+p.st[1]+p.st[2]+p.st[3]; }

function matchBase(p){
  if(state.qTokens.length){ const hay = p._s || (p._s = (p.n+' '+p.ea+' '+p.cs+' '+p.pa+' '+p.br+' '+p.gr+' '+p.vd).toLowerCase()); for(const t of state.qTokens) if(!hay.includes(t)) return false; }
  if(state.imgOnly && !p.img) return false;
  if(state.priceOnly && !mainPrice(p)) return false;
  if(state.wh==='ALL' && totalStock(p)<=0) return false;
  if(state.wh && state.wh!=='ALL' && p.st[WH.indexOf(state.wh)]<=0) return false;
  return true;
}
const matchFacets = (p, skip) => FKEYS.every(k => k===skip || !state[k] || p[k]===state[k]);

const collator = new Intl.Collator('th');
function apply(resetScroll=true){
  state.qTokens = state.q.toLowerCase().split(/\s+/).filter(Boolean);
  const base = ALL.filter(matchBase);
  filtered = base.filter(p => matchFacets(p));
  // each dropdown lists the values available under the OTHER filters (faceted counts)
  for(const k of FKEYS){
    const m = new Map();
    for(const p of base) if(matchFacets(p,k)) m.set(p[k],(m.get(p[k])||0)+1);
    if(state[k] && !m.has(state[k])) m.set(state[k],0);
    buildDD(k, m);
  }
  sortList(filtered);
  const anyFilter = FKEYS.some(k=>state[k]) || state.q || state.wh || state.imgOnly || state.priceOnly;
  $('resetBtn').style.display = anyFilter ? '' : 'none';
  $('advBtn').classList.toggle('active', !!(state.wh || state.imgOnly || state.priceOnly || state.sort!=='name'));
  $('rCount').innerHTML = `พบ <b>${filtered.length.toLocaleString('th-TH')}</b> รายการ <span style="font-size:11px">จาก ${ALL.length.toLocaleString('th-TH')}</span>`;
  if(view==='book') buildBook(); else { $('grid').innerHTML=''; shown=0; renderMore(); }
  if(resetScroll && window.scrollY>200) window.scrollTo({top:0});
  saveState();
}
function sortList(l){
  const s=state.sort;
  if(s==='name') l.sort((a,b)=>collator.compare(a.n,b.n));
  else if(s==='priceAsc') l.sort((a,b)=>(mainPrice(a)||1e12)-(mainPrice(b)||1e12));
  else if(s==='priceDesc') l.sort((a,b)=>mainPrice(b)-mainPrice(a));
  else if(s==='stockDesc'){ const wi=WH.indexOf(state.wh); l.sort((a,b)=> wi>=0 ? b.st[wi]-a.st[wi] : totalStock(b)-totalStock(a)); }
  else if(s==='newest') l.sort((a,b)=>String(b.fd).localeCompare(String(a.fd)));
}

function cardHTML(p, idx){
  const ui = mainUnitIdx(p);
  const price = mainPrice(p);
  const u = ui>=0 ? unitInfo([p.uEA,p.uPA,p.uCS][ui]) : null;
  const sub = ui>=0 ? [1,2].map(l=>p.pr[l][ui] ? `${LV[l]} <b>฿${fmtPrice(p.pr[l][ui])}</b>` : '').filter(Boolean).join(' · ') : '';
  const wi = WH.indexOf(state.wh);
  const stockTag = wi>=0 ? `<span class="p-stock">${state.wh}: ${fmtNum(p.st[wi])}</span>` : (totalStock(p)>0 ? '<span class="p-stock">มีสต็อก</span>' : '');
  return `<div class="p-card" data-i="${idx}">
    <div class="p-img">${p.img?`<img loading="lazy" src="${thumb(p.img,320)}" alt="" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'noimg',textContent:'📦'}))">`:'<span class="noimg">📦</span>'}${stockTag}</div>
    <div class="p-body">
      <div class="p-type">${esc(p.gr)} · ${esc(p.br)}</div>
      <div class="p-name">${esc(p.n)}</div>
      <div class="p-code">${esc(p.ea||p.cs)}</div>
      <div class="p-price">${price
        ? `<div class="p-main"><span class="lv">S03</span><span class="pv">฿${fmtPrice(price)}</span><span class="pu">/ ${esc(u?.name||'')}</span></div>${sub?`<div class="p-sub">${sub}</div>`:''}`
        : '<div class="p-sub">ไม่มีราคา S03</div>'}</div>
    </div></div>`;
}
function renderMore(){
  if(view==='book') return;
  if(!filtered.length){
    $('grid').innerHTML = ALL.length ? `<div class="empty"><div class="e-ico">🔎</div>ไม่พบสินค้าที่ตรงกับเงื่อนไข<br><button class="link-btn" onclick="resetFilters()">ล้างตัวกรองทั้งหมด</button></div>` : '';
    return;
  }
  const next = filtered.slice(shown, shown+PAGE);
  $('grid').insertAdjacentHTML('beforeend', next.map((p,i)=>cardHTML(p, shown+i)).join(''));
  shown += next.length;
}
new IntersectionObserver(es=>{ if(es[0].isIntersecting && shown<filtered.length) renderMore(); },{rootMargin:'600px'}).observe($('sentinel'));
$('grid').addEventListener('click',e=>{ const c=e.target.closest('.p-card'); if(c) openModal(filtered[+c.dataset.i]); });
function skeleton(){ $('grid').innerHTML = Array.from({length:10},()=>'<div class="skeleton"></div>').join(''); }

function resetFilters(){

const DD_ID = {gr:'ddGroup', br:'ddBrand', vd:'ddVendor', sz:'ddSize'};
document.querySelectorAll('.dd-wrap').forEach(w=>{
  w.innerHTML = `<button class="dd-trigger" type="button"><span class="dd-label ph">${w.dataset.all}</span><span class="dd-chev">▼</span></button>
    <div class="dd-panel"><input class="dd-search" placeholder="🔍 พิมพ์ค้นหา..." autocomplete="off"><ul class="dd-list"></ul></div>`;
  w.querySelector('.dd-trigger').addEventListener('click',()=>toggleDD(w));
  w.querySelector('.dd-search').addEventListener('input',e=>filterDD(w,e.target.value));
  w.querySelector('.dd-list').addEventListener('click',e=>{ const li=e.target.closest('li'); if(!li) return; w.classList.remove('open'); state[w.dataset.key]=li.dataset.v; apply(); });
});
function buildDD(key, countMap){
  const w=$(DD_ID[key]), cur=state[key];
  const lbl=w.querySelector('.dd-label'); lbl.textContent = cur || w.dataset.all; lbl.classList.toggle('ph',!cur);
  w.classList.toggle('has',!!cur);
  const arr=[...countMap.entries()].sort((a,b)=>collator.compare(a[0],b[0]));
  const total=arr.reduce((s,x)=>s+x[1],0);
  w.querySelector('.dd-list').innerHTML = `<li data-v="" class="${!cur?'sel-on':''}"><span>${w.dataset.all}</span><span class="c-n">${total.toLocaleString('th-TH')}</span></li>` +
    arr.map(([v,c])=>`<li data-v="${esc(v)}" class="${cur===v?'sel-on':''}"><span>${esc(v)}</span><span class="c-n">${c.toLocaleString('th-TH')}</span></li>`).join('');
  const s=w.querySelector('.dd-search'); if(s.value) filterDD(w,s.value);
}
function filterDD(w,q){ q=q.toLowerCase(); w.querySelectorAll('.dd-list li').forEach(li=>li.style.display=li.textContent.toLowerCase().includes(q)?'':'none'); }
function toggleDD(w){
  const open=w.classList.contains('open');
  document.querySelectorAll('.dd-wrap.open').forEach(x=>x.classList.remove('open'));
  if(!open){
    const r=w.getBoundingClientRect(); w.classList.toggle('right', r.left > window.innerWidth/2); // open toward the side with more room
    w.classList.add('open'); const s=w.querySelector('.dd-search'); s.value=''; filterDD(w,''); s.focus();
  }
}

      <div class="m-sec"><h4>ราคา / หน่วย / บาร์โค้ด</h4>
        <div class="tbl-wrap"><table class="price-tbl"><thead><tr><th>หน่วย</th><th class="r main">S03</th><th class="r">S02</th><th class="r">S01</th><th>บาร์โค้ด</th></tr></thead><tbody>${rows||'<tr><td colspan="5">-</td></tr>'}</tbody></table></div></div>
      <div class="m-sec"><h4>สต็อกคงเหลือ</h4><div class="stock-grid">${stock}</div></div>

        <dt>ผู้จำหน่าย</dt><dd>${esc(p.vd)}</dd>
        <dt>เข้าระบบ</dt><dd>${formatThaiDate(p.fd)}</dd>
      </dl></div>
    </div>`;
  $('modal').classList.add('open'); document.body.style.overflow='hidden';
  history.pushState({modal:1},'');
}
$('modalBox').addEventListener('click',e=>{ const b=e.target.closest('[data-copy]'); if(b) navigator.clipboard?.writeText(b.dataset.copy).then(()=>showToast('คัดลอก '+b.dataset.copy,'success')); });
function closeModal(fromPop){ if(!$('modal').classList.contains('open')) return; $('modal').classList.remove('open'); document.body.style.overflow=''; if(!fromPop && history.state?.modal) history.back(); }

const VIEW_KEY = 'rattana_catalog_view';
let view = LSget(VIEW_KEY) === 'book' ? 'book' : 'grid';
let DATA_TS = 0;
const BK = { pages:[], list:[], chapters:[], key:'gr', pos:0, spread:false, busy:false, dir:0, angle:0,
             pw:0, ph:0, cols:2, rows:3, rowsFirst:2, vw:0, vh:0 };
const CH_LABEL = { gr:'ประเภท', br:'แบรนด์', sz:'ขนาด' };
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const pgc = id => $(id).firstElementChild;
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const PRE = new Set();

function paintViewToggle(){
  document.body.classList.toggle('book-mode', view==='book');
  $('vGrid').classList.toggle('on', view==='grid');
  $('vBook').classList.toggle('on', view==='book');
}
function setView(v){
  if(v===view) return;
  view = v; LSset(VIEW_KEY, v); paintViewToggle();
  if(v==='book'){ buildBook(); const top=$('bookWrap').getBoundingClientRect().top + window.scrollY - document.querySelector('header').offsetHeight - 8; if(window.innerWidth<900) window.scrollTo({top:Math.max(0,top),behavior:'smooth'}); }
  else { $('grid').innerHTML=''; shown=0; renderMore(); }
}

function bookLayout(){
  const hdr = document.querySelector('header').offsetHeight;
  const availW = Math.min(document.querySelector('.content').clientWidth - 24, 1200);
  const availH = Math.max(420, window.innerHeight - hdr - 84);
  const spread = window.innerWidth >= 900;
  let pw, ph;
  if(spread){ pw = Math.floor(Math.min(availW/2, availH*.72)); ph = Math.floor(pw/.72); }
  else { pw = Math.floor(Math.min(availW, availH*.66, 520)); ph = Math.floor(pw/.66); }
  const cols = pw >= 440 ? 3 : 2, cell = cols===3 ? 190 : 165, usable = ph - 74;
  return { spread, pw, ph, cols, rows:clamp(Math.floor(usable/cell),2,4), rowsFirst:clamp(Math.floor((usable-46)/cell),1,4) };
}
const chapterKey = () => !state.gr ? 'gr' : !state.br ? 'br' : 'sz';

function buildBook(anchor){
  const has = filtered.length > 0;
  $('bkEmpty').style.display = has ? 'none' : 'block';
  $('bkEmpty').innerHTML = !ALL.length ? '<div class="e-ico">📖</div>กำลังโหลดสินค้า...'
    : '<div class="e-ico">🔎</div>ไม่พบสินค้าที่ตรงกับเงื่อนไข<br><button class="link-btn" onclick="resetFilters()">ล้างตัวกรองทั้งหมด</button>';
  $('bookStage').style.display = has ? '' : 'none';
  $('bkCtrl').style.display = has ? '' : 'none';
  BK.busy = false; BK.dir = 0; $('bkLeaf').classList.remove('on');
  if(!has){ BK.pages = []; return; }

  const L = bookLayout(); Object.assign(BK, L, { vw:window.innerWidth, vh:window.innerHeight });
  const book = $('book');
  book.className = 'book ' + (L.spread ? 'spread' : 'single');
  book.style.width = (L.spread ? L.pw*2 : L.pw) + 'px';
  book.style.height = L.ph + 'px';
  book.style.setProperty('--pw', L.pw + 'px');

  // one chapter per ประเภท (or แบรนด์ when a ประเภท is chosen); keep the current sort inside each chapter
  const key = chapterKey(), m = new Map();
  for(const p of filtered){ const k = p[key]; if(!m.has(k)) m.set(k, []); m.get(k).push(p); }
  const names = [...m.keys()].sort(collator.compare);
  const per = L.cols*L.rows, perFirst = L.cols*L.rowsFirst;
  const pages = [{t:'cover'}];
  BK.list = []; BK.chapters = [];
  for(const nm of names){
    const items = m.get(nm), start = BK.list.length;
    BK.list.push(...items);
    BK.chapters.push({ name:nm, count:items.length, page:pages.length });
    for(let i=0, first=true; i<items.length; first=false){
      const n = first ? perFirst : per;
      pages.push({ t:'prod', ch:nm, first, count:items.length, from:start+i, to:start+Math.min(items.length, i+n) });
      i += n;
    }
  }
  pages.push({t:'end'});
  Object.assign(BK, { pages, key });

  let page = 0;
  if(anchor != null){ const pi = pages.findIndex(pg => pg.t==='prod' && anchor>=pg.from && anchor<pg.to); if(pi >= 0) page = pi; }
  BK.pos = L.spread ? Math.ceil(page/2) : page;
  renderBook();
}

function pageHTML(i, side){
  const pg = BK.pages[i];

  if(pg.t==='end') return endHTML(side);

  const foot = `<div class="pg-foot">${i}</div>`;
  const rows = pg.first ? BK.rowsFirst : BK.rows;
  return `<div class="pg ${side} c${BK.cols}">${head}
    ${pg.first ? `<div class="pg-band"><b>${esc(pg.ch)}</b><small>${pg.count.toLocaleString('th-TH')} รายการ</small></div>` : ''}

const maxPos = () => BK.spread ? Math.floor(BK.pages.length/2) : BK.pages.length-1;
const visPages = (pos=BK.pos) => BK.spread ? [2*pos-1, 2*pos] : [pos];
function pgLabel(pos){
  const v = visPages(pos).filter(i => i>=0 && i<BK.pages.length);
  const nums = v.filter(i => i>0);
  return nums.length ? `หน้า <b>${nums.join('–')}</b> / ${BK.pages.length-1}` : 'หน้าปก';
}
function setShift(pos){ // in two-page view, centre the closed book (cover alone / back cover alone)
  const b = $('book');
  b.style.transform = !BK.spread ? '' : pos===0 ? 'translateX(-25%)' : 2*pos >= BK.pages.length ? 'translateX(25%)' : '';
}
function updateCtrl(){
  $('bkRange').max = maxPos(); $('bkRange').value = BK.pos;
  $('bkPg').innerHTML = pgLabel(BK.pos);
  $('bkPrev').disabled = BK.pos <= 0; $('bkNext').disabled = BK.pos >= maxPos();
  setShift(BK.pos);
}
function resetShades(){ for(const id of ['bkL','bkR','bkF','bkB']) $(id).lastElementChild.style.opacity = 0; }
function renderBook(){
  if(BK.spread){ const [a,b] = visPages(); pgc('bkL').innerHTML = pageHTML(a,'L'); pgc('bkR').innerHTML = pageHTML(b,'R'); }
  else pgc('bkR').innerHTML = pageHTML(BK.pos,'S');
  $('bkLeaf').classList.remove('on'); resetShades(); updateCtrl(); preload();
}
function preload(){
  const s = BK.pos, ids = BK.spread ? [2*s+1,2*s+2,2*s+3,2*s+4,2*s-2,2*s-3] : [s+1,s+2,s-1];
  for(const i of ids){
    const pg = BK.pages[i]; if(!pg || pg.t!=='prod') continue;
    for(let k=pg.from; k<pg.to; k++){ const p = BK.list[k]; if(!p.img) continue;
      const u = thumb(p.img, BK.cols===3?360:280); if(PRE.has(u)) continue; PRE.add(u); const im = new Image(); im.src = u; }
  }
}

/* ---- page turn: a two-sided leaf rotates around the spine (or the left edge on a phone) ---- */
function move(from, to){ pgc(to).replaceChildren(...pgc(from).childNodes); }
function prepFlip(dir){
  const s = BK.pos;
  if(!BK.pages.length || (dir>0 && s>=maxPos()) || (dir<0 && s<=0)) return false;
  if(BK.spread){
    if(dir>0){ move('bkR','bkF'); pgc('bkB').innerHTML = pageHTML(2*s+1,'L'); pgc('bkR').innerHTML = pageHTML(2*s+2,'R'); }
    else     { move('bkL','bkB'); pgc('bkF').innerHTML = pageHTML(2*s-2,'R'); pgc('bkL').innerHTML = pageHTML(2*s-3,'L'); }
  } else {
    pgc('bkB').innerHTML = '<div class="pg back-paper S"></div>';
    if(dir>0){ move('bkR','bkF'); pgc('bkR').innerHTML = pageHTML(s+1,'S'); }
    else pgc('bkF').innerHTML = pageHTML(s-1,'S');
  }
  BK.dir = dir; BK.busy = true;
  $('bkLeaf').classList.add('on');
  setAngle(dir>0 ? 0 : -180);
  setShift(s+dir);
  return true;
}
function setAngle(a){
  BK.angle = a;
  $('bkLeaf').style.transform = `rotateY(${a}deg)`;
  const t = -a/180; // 0 = lying on the right, 1 = lying on the left
  $('bkF').lastElementChild.style.opacity = Math.min(1, t*2) * .6;
  $('bkB').lastElementChild.style.opacity = Math.min(1, (1-t)*2) * .6;
  if(BK.spread && BK.dir<0) $('bkL').lastElementChild.style.opacity = t * .6;
  else $('bkR').lastElementChild.style.opacity = (1-t) * .6;
}
function animateTo(to, dur, done){
  const from = BK.angle;
  dur = REDUCED ? 0 : dur * Math.abs(to-from) / 180;
  if(dur < 16){ setAngle(to); done(); return; }
  const t0 = performance.now();
  const step = now => {
    const k = clamp((now-t0)/dur, 0, 1), e = k<.5 ? 4*k*k*k : 1 - Math.pow(-2*k+2, 3)/2;
    setAngle(from + (to-from)*e);
    if(k < 1) requestAnimationFrame(step); else done();
  };
  requestAnimationFrame(step);
}
function endFlip(commit, to){
  if(to === 0) move('bkF','bkR');            // leaf lies on the right → it is the right page
  else if(BK.spread) move('bkB','bkL');      // leaf lies on the left → it is the left page
  if(commit) BK.pos += BK.dir;
  BK.dir = 0; BK.busy = false;
  $('bkLeaf').classList.remove('on'); resetShades(); updateCtrl(); preload();
}
function flip(dir){
  if(BK.busy || !prepFlip(dir)) return;
  const to = dir>0 ? -180 : 0;
  animateTo(to, 700, () => endFlip(true, to));
}
function gotoPage(page){ if(BK.busy) return; BK.pos = clamp(BK.spread ? Math.ceil(page/2) : page, 0, maxPos()); renderBook(); }

/* drag / swipe with the finger or mouse */
let drag = null, noClickUntil = 0;
const bookEl = $('book');
bookEl.addEventListener('pointerdown', e => { if(BK.busy || e.button>0) return; drag = { x0:e.clientX, y0:e.clientY, on:false, lx:e.clientX, lt:performance.now(), v:0 }; });
bookEl.addEventListener('pointermove', e => {
  if(!drag) return;
  const dx = e.clientX - drag.x0, dy = e.clientY - drag.y0;
  if(!drag.on){
    if(Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy)){
      const dir = dx<0 ? 1 : -1;
      if(!prepFlip(dir)){ drag = null; return; }
      drag.on = true; drag.dir = dir;
      try{ bookEl.setPointerCapture(e.pointerId); }catch{}
    } else if(Math.abs(dy) > 14) drag = null;
    return;
  }
  const now = performance.now();
  drag.v = (e.clientX - drag.lx) / Math.max(1, now - drag.lt); drag.lx = e.clientX; drag.lt = now;
  const p = clamp((drag.dir>0 ? -dx : dx) / (BK.pw * (BK.spread ? 1.6 : 1.1)), 0, 1);
  drag.p = p;
  setAngle(drag.dir>0 ? -180*p : -180*(1-p));
});
function endDrag(){
  if(!drag) return;
  const d = drag; drag = null;
  if(!d.on) return;
  noClickUntil = performance.now() + 400;
  const fast = Math.abs(d.v) > .45 && Math.sign(-d.v) === d.dir;
  const commit = (d.p||0) > .3 || fast;
  const to = (d.dir>0) === commit ? -180 : 0;
  animateTo(to, 520, () => endFlip(commit, to));
}
bookEl.addEventListener('pointerup', endDrag);
bookEl.addEventListener('pointercancel', endDrag);
bookEl.addEventListener('click', e => {
  if(performance.now() < noClickUntil || BK.busy) return;
  const g = e.target.closest('[data-goto]'); if(g){ gotoPage(+g.dataset.goto); return; }
  const it = e.target.closest('.bi'); if(it){ openModal(BK.list[+it.dataset.bi]); return; }
  const r = bookEl.getBoundingClientRect(), x = (e.clientX - r.left) / r.width;
  if(BK.spread) flip(x < .5 ? -1 : 1); else flip(x < .3 ? -1 : 1);
});
$('bkRange').addEventListener('input', e => { $('bkPg').innerHTML = pgLabel(+e.target.value); });
$('bkRange').addEventListener('change', e => { if(BK.busy) return; BK.pos = +e.target.value; renderBook(); });
document.addEventListener('keydown', e => {
  if(view!=='book' || $('modal').classList.contains('open') || $('thOv').classList.contains('open')) return;
  if(/INPUT|SELECT|TEXTAREA/.test(document.activeElement?.tagName || '')) return;
  if(e.key==='ArrowRight'){ flip(1); e.preventDefault(); }
  else if(e.key==='ArrowLeft'){ flip(-1); e.preventDefault(); }
});
let rzT;
window.addEventListener('resize', () => {
  if(view!=='book' || !BK.pages.length) return;
  // ignore the phone address bar showing/hiding (height-only wobble)
  if(window.innerWidth===BK.vw && Math.abs(window.innerHeight-BK.vh) < 150) return;
  clearTimeout(rzT);
  rzT = setTimeout(() => {
    const L = bookLayout();
    if(L.spread===BK.spread && L.pw===BK.pw && L.ph===BK.ph) return;
    const anchor = visPages().map(i => BK.pages[i]).find(pg => pg && pg.t==='prod');
    buildBook(anchor ? anchor.from : null);
  }, 200);
});

/* ================= STATE PERSIST ================= */
function saveState(){ try{ const {qTokens,...s}=state; sessionStorage.setItem('rattana_catalog_state11', JSON.stringify(s)); }catch{} }
function loadState(){ try{ const s=JSON.parse(sessionStorage.getItem('rattana_catalog_state11')||'null'); if(!s) return; Object.assign(state,s);
  $('q').value=state.q; $('qClear').classList.toggle('show',!!state.q); $('whSel').value=state.wh; $('sortSel').value=state.sort; $('imgOnly').checked=state.imgOnly; $('priceOnly').checked=state.priceOnly; }catch{} }

/* ================= LOAD ================= */
function setData(prods, ts){ ALL=prods; DATA_TS=ts; apply(false); $('foot').textContent=`Rattana Catalog v${APP_VERSION} · ข้อมูลจาก Stocksync / PDDT · อัพเดท ${formatThaiDateTime(ts)}`; }
async function loadData(force=false){
  let cached=null;
  try{ cached=await idb.get(CACHE_KEY); }catch{}
  if(cached && !force){ setData(cached.data, cached.ts); if(Date.now()-cached.ts < CACHE_TTL) return; }
  setLoading(true);
  try{
    const prods=await fetchProducts(); const ts=Date.now();
    setData(prods, ts);
    idb.set(CACHE_KEY,{ts,data:prods}).catch(()=>{});
  }catch(e){
    console.error(e);
    if(!ALL.length){ $('rCount').textContent='โหลดข้อมูลไม่สำเร็จ'; $('grid').innerHTML=`<div class="empty"><div class="e-ico">⚠️</div>โหลดข้อมูลไม่สำเร็จ<br><button class="link-btn" onclick="refreshData()">ลองใหม่</button></div>`; }
    showToast('โหลดข้อมูลไม่สำเร็จ','error');
    throw e;
  }finally{ setLoading(false); }
}
async function refreshData(){
  const b=$('btnRefresh'); b.disabled=true; b.style.transition='transform .6s'; b.style.transform='rotate(360deg)';
  showSpinner('กำลังดึงข้อมูลสินค้า...');
  try{ await loadData(true); showToast('อัพเดทเรียบร้อย ✓','success'); }catch{}
  finally{ hideSpinner(); b.disabled=false; setTimeout(()=>{b.style.transform='';b.style.transition='';},600); }
}
window.addEventListener('scroll',()=>$('backToTop').classList.toggle('show', window.scrollY>300),{passive:true});

new ResizeObserver(()=>document.documentElement.style.setProperty('--hdr-h', document.querySelector('header').offsetHeight+'px')).observe(document.querySelector('header'));
idb.del('rattana_catalog_v1').catch(()=>{}); // drop the v1.0 cache (different columns)
loadState();
paintViewToggle();
if(view==='book') buildBook(); else skeleton();
loadData().catch(()=>{});
setInterval(()=>{ if(document.visibilityState==='visible') fetchProducts().then(p=>{ const ts=Date.now(); setData(p,ts); idb.set(CACHE_KEY,{ts,data:p}); }).catch(()=>{}); }, CACHE_TTL);
</script>
