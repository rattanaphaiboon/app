<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>Rattana Catalog v1.0</title>

<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0d1b3e;--navy-mid:#1a2f5e;--navy-light:#243b73;--gold:#c9a84c;--gold-light:#e8c86a;
  --success:#2ecc71;--danger:#e74c3c;--warning:#f39c12;--info:#3498db;
  --bg:#f4f6fb;--text:#0d1b3e;--card-bg:#fff;--border:#dde3f0;--muted:#6b7896;--row-alt:#fafbfd;
  --img-bg:#f0f3f9;--chip-bg:#fff;
  --radius-sm:6px;--radius-md:12px;--radius-lg:16px;
  --shadow-sm:0 1px 4px rgba(0,0,0,.06);--shadow-md:0 2px 8px rgba(0,0,0,.08);--shadow-lg:0 8px 24px rgba(13,27,62,.12);--shadow-gold:0 4px 12px rgba(201,168,76,.35);
}
body.dark{
  --bg:#05080f;--text:#fff;--card-bg:#0d1b3e;--border:#1f3563;--muted:#b8c2dc;--row-alt:#0a1226;
  --img-bg:#fff;--chip-bg:#0d1b3e;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Sarabun',sans-serif;font-size:14px;line-height:1.5;min-height:100dvh;overflow-x:hidden;background:var(--bg);color:var(--text);transition:background .25s,color .25s}
button{font-family:inherit;cursor:pointer;border:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
input,select{font-family:inherit;font-size:16px}

/* Header */
header{background:var(--navy);color:#fff;padding:10px 12px;position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:10px;border-bottom:3px solid var(--gold);padding-top:max(10px,env(safe-area-inset-top))}
.logo-img{height:36px;width:36px;border-radius:50%;object-fit:contain;background:#fff;flex-shrink:0}
.logo-text{font-weight:700;letter-spacing:1.5px;font-size:17px;color:#fff;white-space:nowrap}
.logo-text span{color:var(--gold)}
.ver{font-size:10px;color:rgba(255,255,255,.55);margin-left:4px;font-weight:500;letter-spacing:0}
.hdr-spacer{flex:1}
.icon-btn{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.2);width:38px;height:38px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-size:17px;transition:background .15s;flex-shrink:0}
.icon-btn:hover{background:rgba(255,255,255,.12)}
.hub-btn{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:var(--radius-sm);padding:5px 10px;font-size:13px;font-weight:600;text-decoration:none;transition:background .15s;white-space:nowrap;min-height:38px}
.hub-btn:hover{background:rgba(255,255,255,.18)}

@media(max-width:420px){.logo-text{font-size:15px;letter-spacing:1px}.hub-btn-text{display:none}.ver{display:none}}

/* Filter bar */
.filters{position:sticky;top:59px;z-index:90;background:var(--bg);padding:10px 12px 6px;border-bottom:1px solid var(--border)}
.filters-inner{max-width:1200px;margin:0 auto}
.search-row{display:flex;gap:8px}
.search-box{flex:1;position:relative}
.search-box input{width:100%;height:44px;border-radius:22px;border:1.5px solid var(--border);background:var(--card-bg);color:var(--text);padding:0 40px 0 42px;outline:none;transition:border-color .15s}
.search-box input:focus{border-color:var(--gold)}
.search-box input::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
@media(max-width:639px){.filters.adv-open{position:static}}
.search-box .s-ico{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:16px;pointer-events:none}
.search-box .s-clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:transparent;color:var(--muted);font-size:18px;width:30px;height:30px;border-radius:50%;display:none}
.search-box .s-clear.show{display:block}
.filter-toggle{height:44px;min-width:44px;padding:0 14px;border-radius:22px;background:var(--navy);color:#fff;font-weight:600;font-size:13px;display:flex;align-items:center;gap:6px;position:relative}
.filter-toggle .dot{position:absolute;top:6px;right:6px;width:9px;height:9px;border-radius:50%;background:var(--gold);display:none}
.filter-toggle.active .dot{display:block}

.chips{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:8px 0 4px}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:6px 12px;border-radius:18px;border:1.5px solid var(--border);background:var(--chip-bg);color:var(--text);font-size:13px;font-weight:500;white-space:nowrap;min-height:34px;transition:all .15s}
.chip .c-n{color:var(--muted);font-size:11px;margin-left:4px}
.chip:hover{border-color:var(--gold)}
.chip.active{background:var(--gold);border-color:var(--gold);color:var(--navy);font-weight:700}
.chip.active .c-n{color:var(--navy)}
.chips.sub .chip{font-size:12px;min-height:30px;padding:4px 10px;border-style:dashed}
.chips.sub .chip.active{border-style:solid;background:var(--navy-mid);border-color:var(--navy-mid);color:#fff}
.chips.sub .chip.active .c-n{color:var(--gold-light)}
.chips.sub:empty{display:none}

.adv{display:none;grid-template-columns:1fr;gap:8px;padding:8px 0 4px}
.adv.open{display:grid}
@media(min-width:640px){.adv{grid-template-columns:repeat(4,1fr)}}
.field label{display:block;font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.3px;text-transform:uppercase;margin-bottom:3px}
.sel{width:100%;height:44px;padding:0 12px;border-radius:10px;border:1.5px solid var(--border);background:var(--card-bg);color:var(--text);outline:none}
.toggles{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.tg{display:flex;align-items:center;gap:6px;height:44px;padding:0 12px;border-radius:10px;border:1.5px solid var(--border);background:var(--card-bg);color:var(--text);font-size:13px;cursor:pointer;user-select:none}
.tg input{width:18px;height:18px;accent-color:var(--gold)}

/* Searchable dropdown */
.dd-wrap{position:relative;width:100%}
.dd-trigger{width:100%;min-height:44px;padding:0 12px;background:var(--card-bg);border:1.5px solid var(--border);border-radius:10px;color:var(--text);font-size:15px;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:6px}
.dd-trigger span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dd-panel{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--card-bg);border:1.5px solid var(--border);border-radius:10px;z-index:500;box-shadow:0 8px 24px rgba(0,0,0,.15);max-height:280px;display:none;flex-direction:column}
.dd-panel.open{display:flex}
.dd-search{padding:10px 14px;font-size:16px;border:none;border-bottom:1px solid var(--border);background:transparent;color:var(--text);outline:none;border-radius:10px 10px 0 0}
.dd-list{overflow-y:auto;flex:1;list-style:none;padding:4px 0}
.dd-list li{padding:9px 14px;cursor:pointer;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;justify-content:space-between;gap:8px}
.dd-list li .c-n{color:var(--muted);font-size:12px;flex-shrink:0}
.dd-list li:hover,.dd-list li.sel-on{background:var(--navy-light);color:#fff}
.dd-list li:hover .c-n,.dd-list li.sel-on .c-n{color:var(--gold-light)}

/* Content */
.content{max-width:1200px;margin:0 auto;padding:12px;padding-bottom:90px}
.result-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.result-bar .r-count{font-size:13px;color:var(--muted)}
.result-bar .r-count b{color:var(--text);font-size:15px}
.active-tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;gap:4px;background:rgba(201,168,76,.18);color:var(--text);border:1px solid rgba(201,168,76,.45);border-radius:12px;padding:2px 4px 2px 10px;font-size:12px}
.tag button{background:transparent;color:var(--muted);font-size:14px;width:20px;height:20px;border-radius:50%}
.link-btn{background:transparent;color:var(--gold);font-weight:600;font-size:12px;text-decoration:underline;padding:4px}

.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr);gap:14px}}
@media(min-width:900px){.grid{grid-template-columns:repeat(4,1fr)}}
@media(min-width:1150px){.grid{grid-template-columns:repeat(5,1fr)}}
.p-card{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;cursor:pointer;transition:transform .12s,box-shadow .15s;animation:fadeIn .25s ease}
.p-card:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px)}
.p-card:active{transform:scale(.98)}
.p-img{aspect-ratio:1/1;background:var(--img-bg);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.p-img img{width:100%;height:100%;object-fit:contain;padding:6px}
.p-img .noimg{font-size:38px;opacity:.35}
.p-img .stock-dot{position:absolute;top:6px;left:6px}
.p-body{padding:8px 10px 10px;display:flex;flex-direction:column;gap:3px;flex:1;border-top:3px solid var(--gold)}
.p-type{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-name{font-size:13.5px;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:36px}
.p-code{font-family:'Courier New',monospace;font-size:11px;color:var(--muted)}
.p-price{margin-top:auto;padding-top:4px;display:flex;align-items:baseline;gap:4px;flex-wrap:wrap}
.p-price .pv{font-size:17px;font-weight:700;color:var(--navy)}
body.dark .p-price .pv{color:var(--gold-light)}
.p-price .pu{font-size:11px;color:var(--muted)}
.p-price .pcs{font-size:11px;color:var(--muted);width:100%}

.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;white-space:nowrap}
.badge-ok{background:#e8f7ee;color:#1e8449}
.badge-danger{background:#ffd5d0;color:#c0392b}
.badge-gold{background:rgba(201,168,76,.18);color:var(--text);border:1px solid rgba(201,168,76,.4)}
body.dark .badge-ok{background:#1a3a25;color:#7be0a3}
body.dark .badge-danger{background:#3a1a17;color:#ff8a7e}

.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty .e-ico{font-size:46px;margin-bottom:8px}
.sentinel{height:40px}
.skeleton{background:linear-gradient(90deg,var(--border) 25%,var(--row-alt) 50%,var(--border) 75%);background-size:200% 100%;animation:shimmer 1.2s infinite;border-radius:var(--radius-md);aspect-ratio:3/4.4}

/* Modal */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(13,27,62,.65);z-index:9000;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px)}
.modal-overlay.open{display:flex}
@media(min-width:640px){.modal-overlay{align-items:center;padding:16px}}
.modal{background:var(--card-bg);border-radius:var(--radius-lg) var(--radius-lg) 0 0;max-width:560px;width:100%;max-height:92dvh;overflow-y:auto;border-top:4px solid var(--gold);animation:slideUp .22s ease;position:relative;padding-bottom:env(safe-area-inset-bottom)}
@media(min-width:640px){.modal{border-radius:var(--radius-lg)}}
.modal-close{position:sticky;top:8px;float:right;margin:8px 8px 0 0;background:rgba(13,27,62,.75);color:#fff;font-size:22px;width:38px;height:38px;border-radius:50%;z-index:2;line-height:1}
.m-img{background:var(--img-bg);display:flex;align-items:center;justify-content:center;min-height:220px;max-height:360px}
.m-img img{max-width:100%;max-height:360px;object-fit:contain;padding:10px}
.m-img .noimg{font-size:70px;opacity:.3;padding:40px}
.m-body{padding:16px 18px 20px}
.m-crumb{font-size:12px;color:var(--muted);margin-bottom:4px}
.m-name{font-size:19px;font-weight:700;line-height:1.35;margin-bottom:10px}
.m-sec{margin-top:14px}
.m-sec h4{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.5px;text-transform:uppercase;margin-bottom:6px}
.price-tbl{width:100%;border-collapse:collapse;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.price-tbl th{background:var(--navy);color:#fff;font-size:12px;font-weight:600;padding:8px 10px;text-align:left;border-bottom:2px solid var(--gold)}
.price-tbl td{padding:8px 10px;font-size:13px;border-bottom:1px solid var(--border)}
.price-tbl tr:last-child td{border-bottom:none}
.price-tbl td.num{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.price-tbl td.code{font-family:'Courier New',monospace;font-size:12px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 10px;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{font-weight:500;word-break:break-word}
.stock-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.st{border:1px solid var(--border);border-radius:10px;padding:8px;text-align:center;border-top:3px solid var(--border)}
.st.has{border-top-color:var(--success)}
.st .w{font-size:11px;color:var(--muted);font-weight:600}
.st .v{font-size:16px;font-weight:700}
.m-desc{font-size:13px;line-height:1.6;background:var(--row-alt);border-radius:10px;padding:10px 12px}
.copy-btn{background:transparent;color:var(--gold);font-size:13px;padding:0 4px}

/* Spinner / toast / misc */
#loadingBar{position:fixed;top:0;left:0;height:3px;background:var(--gold);width:0;transition:width .4s;z-index:10000}
.spinner-overlay{display:none;position:fixed;inset:0;background:rgba(13,27,62,.55);align-items:center;justify-content:center;z-index:99999;backdrop-filter:blur(3px)}
.spinner-overlay.show{display:flex}
.spinner-box{background:var(--card-bg);color:var(--text);border-radius:var(--radius-lg);padding:30px 40px;text-align:center;border-top:4px solid var(--gold);min-width:240px}
.spinner-ring{width:48px;height:48px;border:5px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px}
.toast{position:fixed;bottom:max(24px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);padding:11px 20px;border-radius:var(--radius-md);color:#fff;z-index:9999;animation:fadeIn .3s ease;font-weight:500;box-shadow:var(--shadow-lg);max-width:90vw;font-size:13px}
.toast-success{background:#1e8449}.toast-error{background:var(--danger)}.toast-info{background:var(--navy-mid);border-left:3px solid var(--gold)}
#backToTop{position:fixed;bottom:max(24px,calc(16px + env(safe-area-inset-bottom)));right:max(16px,calc(12px + env(safe-area-inset-right)));background:var(--gold);color:var(--navy);border-radius:50%;width:46px;height:46px;display:none;align-items:center;justify-content:center;box-shadow:var(--shadow-gold);z-index:90;font-size:18px;font-weight:700}
#backToTop.show{display:flex}
.foot{text-align:center;font-size:11px;color:var(--muted);padding:20px 0 0}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes slideUp{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes shimmer{to{background-position:-200% 0}}
</style>
</head>
<body>
<div id="loadingBar"></div>

<header>
  <span class="logo-text">RATTANA <span>CATALOG</span><span class="ver">v1.0</span></span>
  <span class="hdr-spacer"></span>
  <button class="icon-btn" id="btnRefresh" onclick="refreshData()" title="รีเฟรชข้อมูล">⟳</button>
  <button class="icon-btn" id="themeBtn" onclick="toggleTheme()" title="สลับโหมด">🌙</button>
  <a href="https://rattanaphaiboon.github.io/app/rattana-hub.html" class="hub-btn" title="กลับ Hub"><span class="hub-btn-icon"></span><span class="hub-btn-text">Hub</span></a>
</header>

<div class="filters">
  <div class="filters-inner">
    <div class="search-row">
      <div class="search-box">
        <span class="s-ico">🔍</span>
        <input id="q" type="search" placeholder="ค้นหาชื่อสินค้า / บาร์โค้ด / แบรนด์" autocomplete="off" enterkeyhint="search">
        <button class="s-clear" id="qClear" onclick="clearSearch()" aria-label="ล้าง">✕</button>
      </div>
      <button class="filter-toggle" id="advBtn" onclick="toggleAdv()"><span>⚙</span><span class="ft-txt">ตัวกรอง</span><span class="dot"></span></button>
    </div>
    <div class="chips" id="typeChips"></div>
    <div class="chips sub" id="groupChips"></div>
    <div class="adv" id="adv">
      <div class="field"><label>หน่วยธุรกิจ (BU)</label>
        <div class="dd-wrap" id="ddBU"><button class="dd-trigger" type="button" onclick="toggleDD('ddBU')"><span class="dd-label">ทั้งหมด</span>▾</button>
          <div class="dd-panel"><input class="dd-search" placeholder="🔍 ค้นหา..." oninput="filterDD(this)" autocomplete="off"><ul class="dd-list"></ul></div></div>
      </div>
      <div class="field"><label>แบรนด์</label>
        <div class="dd-wrap" id="ddBrand"><button class="dd-trigger" type="button" onclick="toggleDD('ddBrand')"><span class="dd-label">ทั้งหมด</span>▾</button>
          <div class="dd-panel"><input class="dd-search" placeholder="🔍 ค้นหาแบรนด์..." oninput="filterDD(this)" autocomplete="off"><ul class="dd-list"></ul></div></div>
      </div>
      <div class="field"><label>เรียงตาม</label>
        <select class="sel" id="sortSel" onchange="state.sort=this.value;apply()">
          <option value="name">ชื่อ ก-ฮ</option>
          <option value="priceAsc">ราคา น้อย → มาก</option>
          <option value="priceDesc">ราคา มาก → น้อย</option>
          <option value="stockDesc">สต็อกมากสุด</option>
          <option value="newest">เข้าระบบล่าสุด</option>
        </select>
      </div>
      <div class="field"><label>สต็อกที่คลัง</label>
        <select class="sel" id="whSel" onchange="state.wh=this.value;apply()">
          <option value="">ไม่กรองสต็อก</option>
          <option value="ALL">มีสต็อก (คลังใดก็ได้)</option>
          <option value="W1">W1 สมุทรสงคราม</option>
          <option value="W2">W2 สุพรรณบุรี</option>
          <option value="W3">W3 ราชบุรี</option>
          <option value="W4">W4 นครปฐม</option>
        </select>
      </div>
      <div class="toggles">
        <label class="tg"><input type="checkbox" id="imgOnly" onchange="state.imgOnly=this.checked;apply()">มีรูปเท่านั้น</label>
        <label class="tg"><input type="checkbox" id="priceOnly" onchange="state.priceOnly=this.checked;apply()">มีราคาเท่านั้น</label>
      </div>
    </div>
  </div>
</div>

<main class="content">
  <div class="result-bar">
    <div class="r-count" id="rCount">กำลังโหลดสินค้า...</div>
    <div class="active-tags" id="tags"></div>
  </div>
  <div class="grid" id="grid"></div>
  <div class="sentinel" id="sentinel"></div>
  <div class="foot" id="foot"></div>
</main>

<div class="modal-overlay" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modalBox"></div>
</div>

<div class="spinner-overlay" id="spinner"><div class="spinner-box"><div class="spinner-ring"></div><p id="spinnerMsg">กำลังโหลด...</p></div></div>
<button id="backToTop" onclick="window.scrollTo({top:0,behavior:'smooth'})" aria-label="กลับด้านบน">↑</button>

<script>
/* ================= CONFIG ================= */
const APP_VERSION = '1.0';
const SHEET_ID = '16mYDqAqqJma-_0vCIAajy6bcjdOZ7F6VagxkdkqAB2I';
const SHEET_GID = '635140262'; // PDDT
// Only the columns the catalog needs (gviz query keeps the payload small)
// A name | B code EA | H code CS | J unit EA | K unit PA | M unit CS | AK S00 EA | AL S00 PA | AN S00 CS
// BA BU | BB TYPE | BC GROUP | BD BRAND | BF VENDOR | BK DESCRIPTION | BL FIRST STOCK DATE
// BN-BQ STOCK W1-W4 | CV image (SKU_USAGE) | D code PA
const COLS = ['A','B','H','J','K','M','AK','AL','AN','BA','BB','BC','BD','BF','BK','BL','BN','BO','BP','BQ','CV','D'];
const CACHE_KEY = 'rattana_catalog_v1';
const CACHE_TTL = 30 * 60 * 1000;
const PAGE = 48;

/* ================= THEME ================= */
const THEME_KEY = 'rattana_theme';
function applyTheme(t){ document.body.classList.toggle('dark', t==='dark'); document.getElementById('themeBtn').textContent = t==='dark' ? '☀️' : '🌙'; }
function toggleTheme(){ const n = document.body.classList.contains('dark') ? 'light' : 'dark'; localStorage.setItem(THEME_KEY, n); applyTheme(n); }
applyTheme(localStorage.getItem(THEME_KEY) || 'light');

/* ================= UI HELPERS ================= */
const $ = id => document.getElementById(id);
const showSpinner = (m='กำลังโหลด...') => { $('spinnerMsg').textContent = m; $('spinner').classList.add('show'); };
const hideSpinner = () => $('spinner').classList.remove('show');
const setLoading = on => $('loadingBar').style.width = on ? '85%' : '0';
function showToast(msg, type='info'){ const t=document.createElement('div'); t.className=`toast toast-${type}`; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),3000); }
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtPrice = n => n.toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtNum = n => n.toLocaleString('th-TH',{maximumFractionDigits:2});
function formatThaiDate(s){ if(!s) return '-'; const d=new Date(String(s).replace(/\//g,'-')); if(isNaN(d)) return '-'; return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()+543}`; }
function formatThaiDateTime(ts){ const d=new Date(ts); return `${formatThaiDate(d.toISOString().slice(0,10))} ${String(d.getHours()).padStart(2,'0')}.${String(d.getMinutes()).padStart(2,'0')}`; }

/* ================= CSV ================= */
function parseCsvRows(text){
  if(!text) return [];
  if(text.charCodeAt(0)===0xFEFF) text=text.slice(1);
  const rows=[]; let row=[], cell='', q=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=ch; }
    else if(ch==='"') q=true;
    else if(ch===','){ row.push(cell); cell=''; }
    else if(ch==='\r'){}
    else if(ch==='\n'){ row.push(cell); rows.push(row); row=[]; cell=''; }
    else cell+=ch;
  }
  if(cell.length||row.length){ row.push(cell); rows.push(row); }
  return rows;
}
const clean = s => String(s||'').replace(/[​‌‍﻿]/g,'').replace(/ /g,' ').trim();
const num = s => { const n = parseFloat(String(s||'').replace(/,/g,'')); return isFinite(n) ? n : 0; };

function driveId(url){
  if(!url) return '';
  let m = url.match(/[?&]id=([\w-]{10,})/) || url.match(/\/d\/([\w-]{10,})/);
  return m ? m[1] : '';
}
const thumb = (id, w=400) => `https://drive.google.com/thumbnail?id=${id}&sz=w${w}`;
// "ลังx12(CS)" -> {name:'ลัง', qty:12}
function unitInfo(s){ s=clean(s); if(!s) return null; const m=s.match(/^(.*?)x\s*([\d.]+)/i); return m ? {name:m[1].trim()||s, qty:num(m[2]), raw:s} : {name:s, qty:1, raw:s}; }

function toProducts(rows){
  const out=[];
  for(let i=1;i<rows.length;i++){
    const r=rows[i].map(clean);
    if(!r[0]) continue;
    const st=[num(r[16]),num(r[17]),num(r[18]),num(r[19])];
    out.push({
      n:r[0], ea:r[1], cs:r[2], pa:r[21]||'',
      uEA:r[3], uPA:r[4], uCS:r[5],
      pEA:num(r[6]), pPA:num(r[7]), pCS:num(r[8]),
      bu:r[9]||'-', ty:r[10]||'ไม่ระบุ', gr:r[11]||'ไม่ระบุ', br:r[12]||'-', vd:r[13], ds:r[14], fd:r[15],
      st, img:driveId(r[20])
    });
  }
  return out;
}

/* ================= CACHE (IndexedDB — data too big for localStorage) ================= */
const idb = {
  db:null,
  open(){ return this.db ? Promise.resolve(this.db) : new Promise((res,rej)=>{ const q=indexedDB.open('rattana_catalog',1); q.onupgradeneeded=()=>q.result.createObjectStore('kv'); q.onsuccess=()=>{this.db=q.result;res(this.db)}; q.onerror=()=>rej(q.error); }); },
  async get(k){ const db=await this.open(); return new Promise(res=>{ const q=db.transaction('kv').objectStore('kv').get(k); q.onsuccess=()=>res(q.result); q.onerror=()=>res(null); }); },
  async set(k,v){ const db=await this.open(); return new Promise(res=>{ const t=db.transaction('kv','readwrite'); t.objectStore('kv').put(v,k); t.oncomplete=()=>res(); t.onerror=()=>res(); }); }
};

async function fetchProducts(){
  const tq = encodeURIComponent('select ' + COLS.join(','));
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&gid=${SHEET_GID}&tq=${tq}`;
  const res = await fetch(url);
  if(!res.ok) throw new Error('HTTP '+res.status);
  const prods = toProducts(parseCsvRows(await res.text()));
  if(!prods.length) throw new Error('empty');
  return prods;
}

/* ================= STATE ================= */
let ALL = [];
let lastSync = 0;
let filtered = [];
let shown = 0;
const state = { q:'', type:'', group:'', bu:'', brand:'', wh:'', imgOnly:false, priceOnly:false, sort:'name' };

function mainPrice(p){ return p.pEA || p.pPA || p.pCS || 0; }
function totalStock(p){ return p.st[0]+p.st[1]+p.st[2]+p.st[3]; }
const WH = ['W1','W2','W3','W4'];

function matchBase(p, skip){
  if(state.q){ const hay = p._s || (p._s = (p.n+' '+p.ea+' '+p.cs+' '+p.pa+' '+p.br+' '+p.gr+' '+p.vd).toLowerCase()); for(const t of state.qTokens) if(!hay.includes(t)) return false; }
  if(skip!=='bu' && state.bu && p.bu!==state.bu) return false;
  if(skip!=='brand' && state.brand && p.br!==state.brand) return false;
  if(state.imgOnly && !p.img) return false;
  if(state.priceOnly && !mainPrice(p)) return false;
  if(state.wh==='ALL' && totalStock(p)<=0) return false;
  if(state.wh && state.wh!=='ALL' && p.st[WH.indexOf(state.wh)]<=0) return false;
  return true;
}

const collator = new Intl.Collator('th');
function apply(resetScroll=true){
  state.qTokens = state.q.toLowerCase().split(/\s+/).filter(Boolean);
  // base = everything except category filters → used for chip counts
  const base = ALL.filter(p => matchBase(p));
  // type chips
  const tc = new Map(); base.forEach(p => tc.set(p.ty,(tc.get(p.ty)||0)+1));
  if(state.type && !tc.has(state.type)) tc.set(state.type,0);
  renderTypeChips(tc, base.length);
  // group chips (only inside the chosen type)
  const inType = state.type ? base.filter(p=>p.ty===state.type) : base;
  const gc = new Map(); if(state.type) inType.forEach(p => gc.set(p.gr,(gc.get(p.gr)||0)+1));
  if(state.group && state.type && !gc.has(state.group)) gc.set(state.group,0);
  renderGroupChips(gc, inType.length);
  filtered = inType.filter(p => !state.group || p.gr===state.group);
  // dropdown option lists reflect current category selection
  const catScope = ALL.filter(p => (!state.type||p.ty===state.type) && (!state.group||p.gr===state.group));
  buildDD('ddBU', countBy(catScope.filter(p=>matchBase(p,'bu')), 'bu'), state.bu, v=>{state.bu=v;apply();});
  buildDD('ddBrand', countBy(catScope.filter(p=>matchBase(p,'brand')), 'br'), state.brand, v=>{state.brand=v;apply();});
  sortList(filtered);
  renderTags();
  $('rCount').innerHTML = `พบ <b>${filtered.length.toLocaleString('th-TH')}</b> รายการ <span style="font-size:11px">จาก ${ALL.length.toLocaleString('th-TH')}</span>`;
  $('grid').innerHTML=''; shown=0; renderMore();
  if(resetScroll && window.scrollY>200) window.scrollTo({top:0});
  saveState();
}
function countBy(list,key){ const m=new Map(); list.forEach(p=>m.set(p[key],(m.get(p[key])||0)+1)); return m; }
function sortList(l){
  const s=state.sort;
  if(s==='name') l.sort((a,b)=>collator.compare(a.n,b.n));
  else if(s==='priceAsc') l.sort((a,b)=>(mainPrice(a)||1e12)-(mainPrice(b)||1e12));
  else if(s==='priceDesc') l.sort((a,b)=>mainPrice(b)-mainPrice(a));
  else if(s==='stockDesc') l.sort((a,b)=>(state.wh&&state.wh!=='ALL'? b.st[WH.indexOf(state.wh)]-a.st[WH.indexOf(state.wh)] : totalStock(b)-totalStock(a)));
  else if(s==='newest') l.sort((a,b)=>String(b.fd).localeCompare(String(a.fd)));
}

/* ================= RENDER ================= */
function renderTypeChips(tc, total){
  const arr=[...tc.entries()].sort((a,b)=>b[1]-a[1]);
  let h=`<button class="chip ${!state.type?'active':''}" data-t="">ทั้งหมด<span class="c-n">${total.toLocaleString('th-TH')}</span></button>`;
  for(const [t,c] of arr) h+=`<button class="chip ${state.type===t?'active':''}" data-t="${esc(t)}">${esc(t)}<span class="c-n">${c.toLocaleString('th-TH')}</span></button>`;
  const el=$('typeChips'); el.innerHTML=h;
  const act=el.querySelector('.chip.active'); if(act && state.type) act.scrollIntoView({block:'nearest',inline:'center'});
}
function renderGroupChips(gc, total){
  const el=$('groupChips');
  if(!state.type || gc.size<=1){ el.innerHTML=''; return; }
  const arr=[...gc.entries()].sort((a,b)=>b[1]-a[1]);
  let h=`<button class="chip ${!state.group?'active':''}" data-g="">ทุกกลุ่ม<span class="c-n">${total}</span></button>`;
  for(const [g,c] of arr) h+=`<button class="chip ${state.group===g?'active':''}" data-g="${esc(g)}">${esc(g)}<span class="c-n">${c}</span></button>`;
  el.innerHTML=h;
}
$('typeChips').addEventListener('click',e=>{ const b=e.target.closest('.chip'); if(!b) return; state.type=b.dataset.t; state.group=''; apply(); });
$('groupChips').addEventListener('click',e=>{ const b=e.target.closest('.chip'); if(!b) return; state.group=b.dataset.g; apply(); });

function cardHTML(p, idx){
  const price = mainPrice(p);
  const u = unitInfo(p.pEA?p.uEA:p.pPA?p.uPA:p.uCS);
  const cs = unitInfo(p.uCS);
  const ts = totalStock(p);
  const stockBadge = state.wh ? '' : (ts>0 ? '<span class="badge badge-ok stock-dot">มีสต็อก</span>' : '');
  const whStock = state.wh && state.wh!=='ALL' ? `<span class="badge badge-ok stock-dot">${state.wh}: ${fmtNum(p.st[WH.indexOf(state.wh)])}</span>` : (state.wh==='ALL'?'<span class="badge badge-ok stock-dot">มีสต็อก</span>':'');
  return `<div class="p-card" data-i="${idx}">
    <div class="p-img">${p.img?`<img loading="lazy" src="${thumb(p.img,320)}" alt="" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'noimg',textContent:'📦'}))">`:'<span class="noimg">📦</span>'}${stockBadge||whStock}</div>
    <div class="p-body">
      <div class="p-type">${esc(p.ty)} › ${esc(p.gr)}</div>
      <div class="p-name">${esc(p.n)}</div>
      <div class="p-code">${esc(p.ea||p.cs)}</div>
      <div class="p-price">${price?`<span class="pv">฿${fmtPrice(price)}</span><span class="pu">/ ${esc(u?.name||'')}</span>`:'<span class="pu">ไม่มีราคา</span>'}
      ${p.pCS && cs && price!==p.pCS ? `<span class="pcs">${esc(cs.name)}x${fmtNum(cs.qty)} ฿${fmtPrice(p.pCS)}</span>`:''}</div>
    </div></div>`;
}
function renderMore(){
  if(!filtered.length){
    $('grid').innerHTML = ALL.length ? `<div class="empty" style="grid-column:1/-1"><div class="e-ico">🔎</div>ไม่พบสินค้าที่ตรงกับเงื่อนไข<br><button class="link-btn" onclick="resetFilters()">ล้างตัวกรองทั้งหมด</button></div>` : '';
    return;
  }
  const next = filtered.slice(shown, shown+PAGE);
  $('grid').insertAdjacentHTML('beforeend', next.map((p,i)=>cardHTML(p, shown+i)).join(''));
  shown += next.length;
}
new IntersectionObserver(es=>{ if(es[0].isIntersecting && shown<filtered.length) renderMore(); },{rootMargin:'600px'}).observe($('sentinel'));
$('grid').addEventListener('click',e=>{ const c=e.target.closest('.p-card'); if(c) openModal(filtered[+c.dataset.i]); });

function skeleton(){ $('grid').innerHTML = Array.from({length:10},()=>'<div class="skeleton"></div>').join(''); }

/* ---- tags ---- */
function renderTags(){
  const t=[];
  if(state.bu) t.push(['bu','BU: '+state.bu]);
  if(state.brand) t.push(['brand','แบรนด์: '+state.brand]);
  if(state.wh) t.push(['wh', state.wh==='ALL'?'มีสต็อก':'สต็อก '+state.wh]);
  if(state.imgOnly) t.push(['imgOnly','มีรูป']);
  if(state.priceOnly) t.push(['priceOnly','มีราคา']);
  $('tags').innerHTML = t.map(([k,l])=>`<span class="tag">${esc(l)}<button onclick="clearTag('${k}')">✕</button></span>`).join('') + (t.length||state.type||state.q?'<button class="link-btn" onclick="resetFilters()">ล้างทั้งหมด</button>':'');
  $('advBtn').classList.toggle('active', t.length>0);
}
function clearTag(k){
  if(k==='imgOnly'||k==='priceOnly'){ state[k]=false; $(k).checked=false; }
  else { state[k]=''; if(k==='wh') $('whSel').value=''; }
  apply();
}
function resetFilters(){
  Object.assign(state,{q:'',type:'',group:'',bu:'',brand:'',wh:'',imgOnly:false,priceOnly:false});
  $('q').value=''; $('qClear').classList.remove('show'); $('whSel').value=''; $('imgOnly').checked=false; $('priceOnly').checked=false;
  apply();
}

/* ---- search ---- */
let qTimer;
$('q').addEventListener('input',e=>{ $('qClear').classList.toggle('show',!!e.target.value); clearTimeout(qTimer); qTimer=setTimeout(()=>{ state.q=e.target.value.trim(); apply(); },220); });
$('q').addEventListener('keydown',e=>{ if(e.key==='Enter') e.target.blur(); });
function clearSearch(){ $('q').value=''; $('qClear').classList.remove('show'); state.q=''; apply(); }
function toggleAdv(){ const o=$('adv').classList.toggle('open'); document.querySelector('.filters').classList.toggle('adv-open',o); }

/* ---- searchable dropdown ---- */
const ddHandlers={};
function buildDD(id, countMap, current, onPick){
  ddHandlers[id]=onPick;
  const wrap=$(id);
  wrap.querySelector('.dd-label').textContent = current || 'ทั้งหมด';
  const arr=[...countMap.entries()].sort((a,b)=>collator.compare(a[0],b[0]));
  const total=arr.reduce((s,x)=>s+x[1],0);
  wrap.querySelector('.dd-list').innerHTML = `<li data-v="" class="${!current?'sel-on':''}"><span>ทั้งหมด</span><span class="c-n">${total}</span></li>` +
    arr.map(([v,c])=>`<li data-v="${esc(v)}" class="${current===v?'sel-on':''}"><span>${esc(v)}</span><span class="c-n">${c}</span></li>`).join('');
  const s=wrap.querySelector('.dd-search'); if(s.value) filterDD(s);
}
function filterDD(inp){ const q=inp.value.toLowerCase(); inp.nextElementSibling.querySelectorAll('li').forEach(li=>li.style.display=li.textContent.toLowerCase().includes(q)?'':'none'); }
function toggleDD(id){
  const p=$(id).querySelector('.dd-panel'); const open=p.classList.contains('open');
  document.querySelectorAll('.dd-panel').forEach(x=>x.classList.remove('open'));
  if(!open){ p.classList.add('open'); const s=p.querySelector('.dd-search'); s.value=''; filterDD(s); s.focus(); }
}
document.querySelectorAll('.dd-wrap').forEach(w=>w.querySelector('.dd-list').addEventListener('click',e=>{
  const li=e.target.closest('li'); if(!li) return; w.querySelector('.dd-panel').classList.remove('open'); ddHandlers[w.id]?.(li.dataset.v);
}));
document.addEventListener('click',e=>{ if(!e.target.closest('.dd-wrap')) document.querySelectorAll('.dd-panel').forEach(x=>x.classList.remove('open')); });

/* ================= DETAIL MODAL ================= */
function openModal(p){
  if(!p) return;
  const rows=[];
  const add=(label,code,unit,price)=>{ const u=unitInfo(unit); if(code||price) rows.push(`<tr><td>${esc(u?u.raw:label)}</td><td class="code">${esc(code||'-')} ${code?`<button class="copy-btn" onclick="copyText('${esc(code)}')" title="คัดลอก">⧉</button>`:''}</td><td class="num">${price?'฿'+fmtPrice(price):'-'}</td></tr>`); };
  add('EA',p.ea,p.uEA,p.pEA); add('PA',p.pa,p.uPA,p.pPA); add('CS',p.cs,p.uCS,p.pCS);
  const stock = WH.map((w,i)=>`<div class="st ${p.st[i]>0?'has':''}"><div class="w">${w}</div><div class="v">${fmtNum(p.st[i])}</div></div>`).join('');
  $('modalBox').innerHTML = `
    <button class="modal-close" onclick="closeModal()" aria-label="ปิด">×</button>
    <div class="m-img">${p.img?`<img src="${thumb(p.img,1000)}" alt="" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'noimg',textContent:'📦'}))">`:'<span class="noimg">📦</span>'}</div>
    <div class="m-body">
      <div class="m-crumb">${esc(p.bu)} › ${esc(p.ty)} › ${esc(p.gr)}</div>
      <div class="m-name">${esc(p.n)}</div>
      <span class="badge badge-gold">${esc(p.br)}</span> ${totalStock(p)>0?'<span class="badge badge-ok">มีสต็อก</span>':'<span class="badge badge-danger">ไม่มีสต็อก</span>'}
      <div class="m-sec"><h4>หน่วย / บาร์โค้ด / ราคา S00</h4>
        <table class="price-tbl"><thead><tr><th>หน่วย</th><th>รหัส</th><th style="text-align:right">ราคา</th></tr></thead><tbody>${rows.join('')||'<tr><td colspan="3">-</td></tr>'}</tbody></table></div>
      <div class="m-sec"><h4>สต็อกคงเหลือ</h4><div class="stock-grid">${stock}</div></div>
      ${p.ds?`<div class="m-sec"><h4>รายละเอียด</h4><div class="m-desc">${esc(p.ds)}</div></div>`:''}
      <div class="m-sec"><h4>ข้อมูลสินค้า</h4><dl class="kv">
        <dt>หน่วยธุรกิจ</dt><dd>${esc(p.bu)}</dd>
        <dt>ประเภท</dt><dd>${esc(p.ty)}</dd>
        <dt>กลุ่ม</dt><dd>${esc(p.gr)}</dd>
        <dt>แบรนด์</dt><dd>${esc(p.br)}</dd>
        <dt>ผู้จำหน่าย</dt><dd>${esc(p.vd||'-')}</dd>
        <dt>เข้าระบบครั้งแรก</dt><dd>${formatThaiDate(p.fd)}</dd>
      </dl></div>
    </div>`;
  $('modal').classList.add('open'); document.body.style.overflow='hidden';
  history.pushState({modal:1},'');
}
function closeModal(fromPop){ if(!$('modal').classList.contains('open')) return; $('modal').classList.remove('open'); document.body.style.overflow=''; if(!fromPop && history.state?.modal) history.back(); }
window.addEventListener('popstate',()=>closeModal(true));
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });
function copyText(t){ navigator.clipboard?.writeText(t).then(()=>showToast('คัดลอก '+t,'success')); }

/* ================= STATE PERSIST ================= */
function saveState(){ try{ const {qTokens,...s}=state; sessionStorage.setItem('rattana_catalog_state', JSON.stringify(s)); }catch{} }
function loadState(){ try{ const s=JSON.parse(sessionStorage.getItem('rattana_catalog_state')||'null'); if(!s) return; Object.assign(state,s);
  $('q').value=state.q; $('qClear').classList.toggle('show',!!state.q); $('whSel').value=state.wh; $('sortSel').value=state.sort; $('imgOnly').checked=state.imgOnly; $('priceOnly').checked=state.priceOnly; }catch{} }

/* ================= LOAD ================= */
function setData(prods, ts){ ALL=prods; lastSync=ts; apply(false); $('foot').textContent=`Rattana Catalog v${APP_VERSION} · ข้อมูลจาก Stocksync / PDDT · อัพเดท ${formatThaiDateTime(ts)}`; }

async function loadData(force=false){
  let cached=null;
  try{ cached=await idb.get(CACHE_KEY); }catch{}
  if(cached && !force){
    setData(cached.data, cached.ts);
    if(Date.now()-cached.ts < CACHE_TTL) return;
  }
  setLoading(true);
  try{
    const prods=await fetchProducts(); const ts=Date.now();
    setData(prods, ts);
    idb.set(CACHE_KEY,{ts,data:prods}).catch(()=>{});
  }catch(e){
    console.error(e);
    if(!ALL.length){ $('rCount').textContent='โหลดข้อมูลไม่สำเร็จ'; $('grid').innerHTML=`<div class="empty" style="grid-column:1/-1"><div class="e-ico">⚠️</div>โหลดข้อมูลไม่สำเร็จ<br><button class="link-btn" onclick="refreshData()">ลองใหม่</button></div>`; }
    showToast('โหลดข้อมูลไม่สำเร็จ','error');
    throw e;
  }finally{ setLoading(false); }
}
async function refreshData(){
  const b=$('btnRefresh'); b.disabled=true; b.style.transition='transform .6s'; b.style.transform='rotate(360deg)';
  showSpinner('กำลังดึงข้อมูลสินค้า...');
  try{ await loadData(true); showToast('อัพเดทเรียบร้อย ✓','success'); }catch{}
  finally{ hideSpinner(); b.disabled=false; setTimeout(()=>{b.style.transform='';b.style.transition='';},600); }
}
window.addEventListener('scroll',()=>$('backToTop').classList.toggle('show', window.scrollY>300),{passive:true});

loadState();
skeleton();
loadData().catch(()=>{});
// background refresh every 30 min while the tab is open (no spinner)
setInterval(()=>{ if(document.visibilityState==='visible') fetchProducts().then(p=>{ const ts=Date.now(); ALL=p; lastSync=ts; apply(false); idb.set(CACHE_KEY,{ts,data:p}); }).catch(()=>{}); }, CACHE_TTL);
</script>
</body>
</html>
