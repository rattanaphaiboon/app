<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,viewport-fit=cover">
<title>Rattana Promotion v1.34</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&family=Prompt:wght@400;600;700;800&family=Kanit:wght@400;600;700;800&family=Mitr:wght@400;500;600;700&family=Chakra+Petch:wght@400;600;700&family=IBM+Plex+Sans+Thai:wght@400;600;700&family=Bai+Jamjuree:wght@600;700&family=Anuphan:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700;800&family=Sriracha&family=Athiti:wght@400;500;600;700&family=Pridi:wght@400;500;600;700&family=Taviraj:wght@400;500;600;700&family=Charm:wght@400;500;600;700&family=Charmonman:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0d1b3e;--navy-mid:#1a2f5e;--navy-light:#243b73;
  --gold:#c9a84c;--gold-light:#e8c86a;
  --red:#e63946;--red-dark:#c81d2a;
  --success:#2ecc71;--danger:#e74c3c;--warning:#f39c12;--info:#3498db;
  --bg:#f4f6fb;--text:#0d1b3e;--card-bg:#ffffff;--border:#dde3f0;--muted:#6b7896;--row-alt:#fafbfd;
  --shadow-sm:0 1px 4px rgba(0,0,0,.06);
  --shadow-md:0 2px 8px rgba(0,0,0,.08);
  --shadow-lg:0 8px 24px rgba(13,27,62,.12);
  --shadow-gold:0 4px 12px rgba(201,168,76,.35);
  --radius-sm:6px;--radius-md:12px;--radius-lg:16px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{font-family:'Sarabun',sans-serif;min-height:100dvh;overflow-x:clip;background:var(--bg);color:var(--text);-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
input,select,textarea{font-family:inherit;font-size:16px}
img{max-width:100%;display:block}

/* Header */
header{background:var(--navy);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:10px;border-bottom:3px solid var(--gold);padding-top:max(12px,env(safe-area-inset-top));flex-wrap:wrap}
.logo-text{font-weight:700;letter-spacing:1px;font-size:16px;color:#fff;flex:1;min-width:0}
.logo-text span.brand{color:var(--gold)}
.logo-text .v{font-size:11px;opacity:.65;font-weight:400;margin-left:6px}
.icon-btn{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.2);height:38px;min-width:38px;padding:0 12px;border-radius:var(--radius-sm);display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:600;transition:background .15s;white-space:nowrap}
.icon-btn:hover{background:rgba(255,255,255,.12)}
.icon-btn.gold{background:var(--gold);color:var(--navy);border-color:var(--gold);font-weight:700}
.icon-btn.gold:hover{background:var(--gold-light)}
.icon-btn:disabled{opacity:.5;cursor:not-allowed}

/* Filter bar */
/* v1.31 — Compact sticky control block (no internal scroll) */
.control-block{position:sticky;top:63px;z-index:90;background:var(--card-bg);border-bottom:1px solid var(--border);box-shadow:var(--shadow-sm);overflow:visible;transition:max-height .2s ease,opacity .2s ease}
.control-block.collapsed{max-height:0;overflow:hidden;border-bottom:none;opacity:0;pointer-events:none}
.control-collapse-btn{position:sticky;top:63px;z-index:91;background:var(--gold);color:var(--navy);border:none;border-radius:0 0 8px 8px;padding:2px 12px;font-size:10px;font-weight:800;cursor:pointer;font-family:inherit;box-shadow:var(--shadow-sm);margin-left:14px;letter-spacing:.5px;line-height:1.4}
.control-collapse-btn:hover{background:var(--gold-light)}

.filter-bar{background:transparent;padding:5px 10px;display:flex;flex-wrap:wrap;gap:5px 8px;align-items:center;border-bottom:1px dashed var(--border)}
.filter-bar .f-field{display:flex;flex-direction:column;gap:1px;min-width:0}
.filter-bar .f-field label{font-size:9px;font-weight:700;color:var(--muted);letter-spacing:.3px;text-transform:uppercase;line-height:1;margin-bottom:0}
.filter-bar .f-input{height:26px;font-size:12px;padding:0 6px;border-radius:4px;border:1px solid var(--border);background:var(--card-bg);color:var(--text);font-family:inherit;outline:none;min-width:0}
.filter-bar .f-input:focus{border-color:var(--gold)}
.filter-bar .f-check{gap:3px;font-size:11px;padding:0 4px;height:26px}
.filter-bar .f-check input{width:14px;height:14px}
.filter-bar .f-full{flex:1 1 auto;min-width:130px}
.filter-bar .f-check-group{display:flex;gap:4px;flex-wrap:wrap;align-items:center;margin-left:auto}

/* v1.31 — Compact action row (action + stats + scale in one row) */
.action-row{padding:5px 10px;display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.mini-btn{background:#fff;color:var(--navy);border:1px solid var(--border);border-radius:5px;padding:0 8px;height:26px;font-size:11px;font-weight:700;font-family:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:3px;line-height:1;transition:all .12s;white-space:nowrap}
.mini-btn:hover{background:#f5f5f5;border-color:var(--gold)}
.mini-btn.gold{background:var(--gold);color:var(--navy);border-color:var(--gold);font-weight:800}
.mini-btn.gold:hover{background:var(--gold-light)}
.mini-btn.danger{background:#fff0f0;color:#dc2626;border-color:#fca5a5}
.mini-btn.danger:hover{background:#fee2e2}
.img-edit-tools{display:inline-flex;gap:3px;align-items:center;padding-left:4px;border-left:1px solid rgba(201,168,76,.4)}

/* v1.33 — floating "+" corner button to add extra product image slots */
.promo-img{position:relative}
.img-add-corner{position:absolute;bottom:2px;right:2px;width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.92);border:1.5px dashed #cbd5e0;color:#94a3b8;font-size:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:6;opacity:.6;transition:all .15s;padding:0;font-family:inherit}
.img-add-corner:hover{opacity:1;border-color:var(--gold);color:var(--gold);background:#fff;transform:scale(1.15)}
.tmpl-festive .prod-slot.buy{position:relative}
.tmpl-festive .prod-slot.buy .img-add-corner{background:rgba(255,255,255,.92)}
@media print{
  .img-add-corner{display:none!important}
}
.cat-ex-badge{background:var(--red);color:#fff;padding:0 6px;border-radius:8px;font-size:9px;margin-left:3px;display:none;font-weight:800}
.cat-ex-badge:not(:empty){display:inline-block}
.action-row .stats{margin-left:6px}
.f-field{display:flex;flex-direction:column;gap:3px}
.f-field label{font-size:10px;font-weight:600;color:var(--muted);letter-spacing:.4px;text-transform:uppercase}
.f-input{height:38px;padding:0 12px;border-radius:var(--radius-sm);border:1.5px solid var(--border);background:var(--card-bg);color:var(--text);font-size:14px;font-family:inherit;outline:none;transition:border-color .15s;width:100%}
.f-input:focus{border-color:var(--gold)}
.f-check{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--text);cursor:pointer;user-select:none;height:38px;padding:0 4px}
.f-check input{width:18px;height:18px;accent-color:var(--gold);cursor:pointer}
/* CAT filter modal */
.cat-modal{display:none;position:fixed;inset:0;background:rgba(13,27,62,.55);z-index:1000;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(3px)}
.cat-modal.open{display:flex}
.cat-modal-inner{background:var(--card-bg);border-radius:14px;width:100%;max-width:900px;max-height:88vh;display:flex;flex-direction:column;box-shadow:var(--shadow-lg);border-top:4px solid var(--gold);animation:slideUp .22s ease;overflow:hidden}
.cat-modal-head{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.cat-modal-body{padding:14px 18px;overflow-y:auto;flex:1;display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:800px){.cat-modal-body{grid-template-columns:1fr 1fr}}
.cat-modal-foot{padding:12px 18px;border-top:1px solid var(--border);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.cat-section{border:1.5px solid var(--border);border-radius:10px;padding:10px;background:var(--card-bg);display:flex;flex-direction:column;min-height:0}
.cat-section h4{font-size:13px;font-weight:800;color:var(--navy);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:6px}
.cat-section h4 .cnt{font-size:10px;font-weight:600;color:var(--muted)}
.cat-section h4 .ex{background:var(--red);color:#fff;font-size:10px;padding:2px 8px;border-radius:8px}
.cat-actions{display:flex;gap:4px;margin-bottom:6px;flex-wrap:wrap}
.cat-actions button{font-size:11px;padding:3px 8px;border-radius:6px;background:#f0f0f0;border:1px solid transparent;color:var(--navy);cursor:pointer;font-family:inherit;font-weight:600}
.cat-actions button:hover{background:#e0e0e0}
.cat-search{width:100%;padding:5px 8px;font-size:12px;border:1px solid var(--border);border-radius:6px;margin-bottom:6px;outline:none;font-family:inherit}
.cat-search:focus{border-color:var(--gold)}
.cat-list{max-height:180px;overflow-y:auto;border:1px solid #eee;border-radius:6px;padding:4px}
.cat-list label{display:flex;align-items:center;gap:6px;padding:4px 6px;cursor:pointer;font-size:12px;border-radius:4px;user-select:none}
.cat-list label:hover{background:#f5f5f5}
.cat-list label input{accent-color:var(--gold);cursor:pointer;flex-shrink:0}
.cat-list label .val{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat-list label .n{color:var(--muted);font-size:10px;font-weight:600;flex-shrink:0}
.cat-list label.excluded{opacity:.5;text-decoration:line-through;color:var(--red)}
.cat-list .empty{padding:20px;text-align:center;color:var(--muted);font-size:12px}

.sort-chips{display:flex;gap:3px;flex-wrap:wrap;padding:0}
.sort-chip{display:inline-flex;align-items:center;gap:3px;padding:2px 8px 2px 3px;border-radius:11px;background:#f0f0f0;color:#666;font-size:10.5px;font-weight:600;cursor:pointer;user-select:none;border:1px solid transparent;transition:all .12s;-webkit-tap-highlight-color:transparent;font-family:inherit;line-height:1.2;min-height:22px}
.sort-chip:hover{background:#e8e8e8}
.sort-chip.active{background:linear-gradient(135deg,rgba(201,168,76,.18),rgba(201,168,76,.08));border-color:var(--gold);color:var(--navy)}
.sort-chip .prio{background:transparent;color:#bbb;border-radius:50%;width:16px;height:16px;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:9px;border:1px solid #ddd}
.sort-chip.active .prio{background:var(--gold);color:var(--navy);border-color:var(--gold)}
.sort-chip .cx{opacity:0;width:0;margin-left:0;transition:all .15s;overflow:hidden}
.sort-chip.active .cx{opacity:.55;width:14px;margin-left:2px;text-align:center;font-size:14px;line-height:1}
.sort-chip.active:hover .cx{opacity:1}

/* Stats */
/* v1.31 — Compact stats as inline pill chips */
.stats{display:flex;gap:6px;padding:0;max-width:none;margin:0;align-items:center;flex-wrap:wrap}
.stat-card{background:transparent;border-radius:10px;padding:2px 8px;border:1px solid var(--border);border-top:2px solid var(--gold);text-align:center;display:inline-flex;align-items:center;gap:5px;min-width:0}
.stat-card .s-label{font-size:10px;color:var(--muted);font-weight:600;letter-spacing:.3px;text-transform:uppercase;margin-bottom:0;white-space:nowrap}
.stat-card .s-value{font-size:14px;font-weight:800;line-height:1;color:var(--navy);font-variant-numeric:tabular-nums}
.stat-card.blue{border-top-color:var(--info)}
.stat-card.blue .s-value{color:var(--info)}
.stat-card.gold .s-value{color:var(--gold)}
.stat-card.red{border-top-color:var(--red)}
.stat-card.red .s-value{color:var(--red)}

/* Grid */
.pages-wrap{max-width:1400px;margin:0 auto;padding:0 12px 20px}
.page-a4{background:#fff;margin:12px auto;box-shadow:var(--shadow-md);border-radius:var(--radius-md);overflow:hidden;position:relative}
.page-inner{display:flex;flex-direction:column;min-height:520px;padding:14px 12px;position:relative}
@media(min-width:640px){.page-inner{min-height:700px}}
.page-head{background:linear-gradient(135deg,var(--red) 0%,var(--red-dark) 100%);color:#fff;margin:-14px -12px 10px;padding:12px 16px;text-align:center;position:relative}
.page-head h1{font-size:28px;font-weight:800;letter-spacing:3px;line-height:1}
.page-head .period{margin-top:4px;font-size:13px;font-weight:600;opacity:.95}
.page-head .badge-wh{position:absolute;top:10px;right:12px;background:var(--gold);color:var(--navy);padding:3px 10px;border-radius:12px;font-size:11px;font-weight:700;letter-spacing:.5px}
.page-head .page-num{position:absolute;top:10px;left:12px;background:rgba(255,255,255,.2);color:#fff;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:600}

.promo-grid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(4,1fr);gap:8px;flex:1;align-content:stretch}
.promo-cell{background:#fff;border:1.5px solid var(--red);border-radius:8px;padding:6px;display:flex;flex-direction:column;position:relative;min-height:0;overflow:hidden;cursor:pointer;transition:opacity .15s,transform .1s}
.promo-cell:hover{transform:translateY(-1px);box-shadow:var(--shadow-md)}
.promo-cell.empty{background:#fafbfd;border:1.5px dashed #d0d5dd;opacity:.4;cursor:default}
.promo-cell.empty:hover{transform:none;box-shadow:none}
.promo-cell.deselected{opacity:.35;filter:grayscale(.7)}
.promo-cell.deselected::after{content:'ตัดออก';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-8deg);background:rgba(230,57,70,.9);color:#fff;padding:4px 14px;border-radius:6px;font-size:13px;font-weight:800;letter-spacing:2px;pointer-events:none;box-shadow:0 2px 8px rgba(0,0,0,.2);z-index:5}
.sel-tick{position:absolute;top:6px;left:6px;width:26px;height:26px;border-radius:50%;background:#fff;border:2px solid var(--success);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;color:var(--success);z-index:10;transition:all .15s;box-shadow:0 1px 3px rgba(0,0,0,.15);cursor:pointer;padding:0;font-family:inherit}
.sel-tick:hover{transform:scale(1.15);box-shadow:0 2px 6px rgba(0,0,0,.25)}
.promo-cell.deselected .sel-tick{border-color:var(--red);color:var(--red);background:#fff}
.promo-cell .sel-tick::before{content:'✓'}
.promo-cell.deselected .sel-tick::before{content:'✕'}

/* v1.31 — Compact scale bar (inline with action row) */
.scale-bar{margin:0;padding:0;display:inline-flex;gap:5px;align-items:center;background:rgba(201,168,76,.08);border-radius:8px;padding:3px 8px;border:1px solid rgba(201,168,76,.3)}
.scale-bar .scale-label{font-weight:700;font-size:11px;color:var(--navy);white-space:nowrap}
.scale-bar input[type=range]{flex:0 0 120px;min-width:100px;accent-color:var(--gold);height:4px;cursor:pointer;margin:0}
.scale-bar .scale-val{font-weight:800;font-size:11px;color:var(--gold);min-width:36px;text-align:right;font-family:inherit;font-variant-numeric:tabular-nums}
.scale-bar .scale-mode{display:none}

/* v1.29 — Upload slot for empty images (clickable + placeholder) */
.img-upload-slot{
  display:flex;align-items:center;justify-content:center;
  width:100%;height:100%;min-width:60px;min-height:60px;
  background:transparent;
  border:2px dashed #cbd5e0;
  border-radius:8px;
  color:#94a3b8;
  font-family:inherit;font-size:12px;font-weight:600;
  cursor:pointer;
  transition:all .15s;
  padding:8px;
}
.img-upload-slot:hover{
  border-color:var(--gold);
  color:var(--gold);
  background:rgba(201,168,76,.06);
  transform:scale(1.02);
}
.img-upload-slot:active{transform:scale(.98)}
.gift-img.empty{background:transparent;border:none}
.promo-cell img[data-custom="1"]{outline:1.5px solid rgba(46,204,113,.5);outline-offset:1px}
@media print{
  .img-upload-slot{display:none!important}
  .gift-img.empty{display:none!important}
  .promo-cell img[data-custom="1"]{outline:none!important}
}

/* v1.27 — Apply --img-scale to individual images (each img has its own --img-scale) */
.promo-cell img[data-imgkey]{
  transform:translate(var(--img-x,0px), var(--img-y,0px)) rotate(var(--img-rot,0deg)) scale(var(--img-scale,1)) scaleX(var(--img-flip-x,1)) scaleY(var(--img-flip-y,1));
  transform-origin:center center;
  cursor:pointer;
  transition:outline .12s;
  touch-action:none;                /* v1.30 — allow drag-pan on touch without scrolling */
  user-select:none;-webkit-user-drag:none;
}
.promo-cell img.img-selected{
  outline:3px solid var(--gold)!important;
  outline-offset:3px;
  box-shadow:0 0 0 5px rgba(201,168,76,.28)!important;
  border-radius:4px;
  position:relative;
  z-index:9;
}
@media print{
  .scale-bar{display:none!important}
  .promo-cell img.img-selected{outline:none!important;box-shadow:none!important}
}
.cat-header{grid-column:1/-1;background:linear-gradient(90deg,rgba(201,168,76,.18),transparent);border-left:4px solid var(--gold);padding:4px 10px;margin:6px 0 2px;font-size:12px;font-weight:700;color:var(--navy);letter-spacing:.5px;border-radius:3px}
.cat-header .cnt{color:var(--muted);font-weight:500;font-size:11px;margin-left:6px}
.deselected-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:640px){.deselected-grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1024px){.deselected-grid{grid-template-columns:repeat(4,1fr)}}
.deselected-grid .promo-cell{min-height:150px}
.promo-body{display:flex;gap:8px;flex:1;align-items:stretch}
.promo-img{width:50%;flex-shrink:0;background:transparent;border-radius:6px;display:flex;align-items:center;justify-content:center;overflow:visible;min-height:300px;gap:4px;padding:4px}
.promo-img.multi{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;align-content:center;justify-items:center}
.promo-img .prod-slot{flex:1 1 0;min-width:0;height:100%;display:flex;align-items:center;justify-content:center;overflow:visible}
.promo-img.multi .prod-slot{width:100%;height:auto;aspect-ratio:1/1}
.promo-img .prod-slot img{max-width:100%;max-height:100%;object-fit:contain;mix-blend-mode:multiply}
.promo-img img{width:100%;height:100%;object-fit:contain;padding:4px;mix-blend-mode:multiply}
.promo-img.no-img{color:var(--muted);font-size:10px;text-align:center;padding:8px}
.promo-info{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}
.promo-title{font-size:12px;font-weight:700;color:var(--navy);line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;padding-right:20px}
.promo-cell.merged .promo-title{padding-right:56px}
.promo-buy{background:var(--navy);color:#fff;padding:3px 8px;border-radius:4px;font-size:11px;font-weight:700;text-align:center;letter-spacing:.3px}
.promo-buy .n{font-size:14px}
.tier-list{display:flex;flex-direction:column;gap:2px}
.tier-row{display:grid;grid-template-columns:1fr 12px 1fr;align-items:center;gap:2px;background:linear-gradient(90deg,var(--navy) 0 calc(50% - 8px),#fff3cd calc(50% + 4px) 100%);border-radius:4px;overflow:hidden;font-size:10.5px;font-weight:700;line-height:1.35;min-height:22px}
.tier-buy{color:#fff;padding:3px 6px;text-align:center;letter-spacing:.2px;white-space:nowrap}
.tier-buy b{font-size:12.5px}
.tier-arrow{color:var(--gold);font-size:12px;text-align:center;background:var(--navy);height:100%;display:flex;align-items:center;justify-content:center;font-weight:800}
.tier-gift{color:#8a5a00;padding:3px 6px;text-align:center;white-space:nowrap}
.tier-gift .tg-n{font-size:12.5px;color:var(--red);font-weight:800}
.badge-tier{background:#ffe4b5;color:#8a5a00;border:1px solid #ffc107}
.promo-gift{background:linear-gradient(135deg,#fff3cd,#ffe69c);border:1px solid #ffc107;border-radius:4px;padding:4px 6px;font-size:11px;color:#8a5a00;line-height:1.3;flex:1;display:flex;flex-direction:row;align-items:center;gap:6px}
.promo-gift .gift-info{flex:1;display:flex;flex-direction:column;justify-content:center;min-width:0}
.promo-gift .gift-img{width:114px;height:114px;flex-shrink:0;background:transparent;border-radius:6px;display:flex;align-items:center;justify-content:center;overflow:visible}
.promo-gift .gift-img img{width:100%;height:100%;object-fit:contain;padding:4px;mix-blend-mode:multiply}
.promo-gift .gift-img.no-img{color:#996800;font-size:11px}

/* Spinner */
#spinner{display:none;position:fixed;inset:0;background:rgba(13,27,62,.55);align-items:center;justify-content:center;z-index:99999;backdrop-filter:blur(3px)}
#spinner.show{display:flex}
.spinner-box{background:#fff;border-radius:var(--radius-lg);padding:28px 40px;text-align:center;border-top:4px solid var(--gold);min-width:220px}

/* Toast */
.toast{position:fixed;bottom:max(24px,env(safe-area-inset-bottom));right:16px;padding:12px 20px;border-radius:var(--radius-md);color:#fff;z-index:9999;animation:slideIn .3s ease;font-weight:500;box-shadow:var(--shadow-lg);max-width:90vw;font-size:13px}
.toast-success{background:var(--success)}
.toast-error{background:var(--danger)}
.toast-warning{background:var(--warning);color:var(--navy)}
.toast-info{background:var(--navy-mid);border-left:3px solid var(--gold)}

/* Back to top */
#backToTop{position:fixed;bottom:max(24px,calc(16px + env(safe-area-inset-bottom)));right:max(16px,calc(12px + env(safe-area-inset-right)));background:var(--gold);color:var(--navy);border:none;border-radius:50%;width:46px;height:46px;display:none;align-items:center;justify-content:center;box-shadow:var(--shadow-gold);z-index:90;font-size:20px;font-weight:700;cursor:pointer}
#backToTop.show{display:flex}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes slideIn{from{transform:translateX(120%);opacity:0}to{transform:translateX(0);opacity:1}}

/* Larger screens — show 3 columns for browsing (not printing) */
@media(min-width:900px){

}

<script>
'use strict';

/* ══════════════════════════════════════════════════════════════
   CONFIG
   ══════════════════════════════════════════════════════════════ */
const CFG = {
  productsSheetId:  '16mYDqAqqJma-_0vCIAajy6bcjdOZ7F6VagxkdkqAB2I',
  promoSheetId:     '1CqHARklgveAeJ6rTkNeyUSku__puTiNE7-c6ebn93W8',
  promoSheetName:   'Promotion',
  perPage:          8,     // 2×4 grid per printed page
  cacheTTL:         5*60*1000,
  contact:          { phone:'080-3897765', line:'@RPBSALE' },
};

/* ══════════════════════════════════════════════════════════════
   STATE
   ══════════════════════════════════════════════════════════════ */
const CAT_COLS = ['CAT BU','CAT TYPE','CAT GROUP','CAT BRAND','CAT SIZE','CAT VENDOR'];
let state = {
  products: [],
  productByName: new Map(),
  productByCatSize: new Map(),
  productByCatBrand: new Map(),
  productByBarcode: new Map(),
  promotions: [],
  template: 'classic',
  sortOrder: ['catBrand'],
  deselected: new Set(),
  catExcluded: Object.fromEntries(CAT_COLS.map(c => [c, new Set()])),
  catSearch: Object.fromEntries(CAT_COLS.map(c => [c, ''])),
  // v1.26 — image scale controls
  imgScaleGlobal: 100,          // page-wide %
  imgScaleOverrides: {},        // cellKey → pct
  selectedImgKey: null,         // string cellKey (currently selected image for size adjust)
  // v1.29 — user-uploaded custom images per slot
  userImages: {},               // imgKey (e.g. "9:g") → dataURL
  // v1.30 — per-image pan position (unscaled px offset from center)
  imgPosOverrides: {},          // imgKey → {x, y}
  // v1.33 — rotate/flip/remove/add-slot
  imgRotation: {},              // imgKey → degrees (0/90/180/270)
  imgFlip: {},                  // imgKey → {h:bool, v:bool}
  removedSlots: new Set(),      // imgKey → hidden (cleared back to upload-placeholder)
  extraProductSlots: {},        // cellKey → count of extra empty product slots added
};

/* ══════════════════════════════════════════════════════════════
   IMAGE EDIT — rotate / flip / remove / add extra slot (v1.33)
   ══════════════════════════════════════════════════════════════ */
function saveImgRotation(){ try{ localStorage.setItem('rp_img_rot', JSON.stringify(state.imgRotation)); } catch{} }
function saveImgFlip(){ try{ localStorage.setItem('rp_img_flip', JSON.stringify(state.imgFlip)); } catch{} }
function saveRemovedSlots(){ try{ localStorage.setItem('rp_removed_slots', JSON.stringify([...state.removedSlots])); } catch{} }
function saveExtraSlots(){ try{ localStorage.setItem('rp_extra_slots', JSON.stringify(state.extraProductSlots)); } catch{} }
function loadImgRotation(){ try{ state.imgRotation = JSON.parse(localStorage.getItem('rp_img_rot') || '{}') || {}; } catch{ state.imgRotation = {}; } }
function loadImgFlip(){ try{ state.imgFlip = JSON.parse(localStorage.getItem('rp_img_flip') || '{}') || {}; } catch{ state.imgFlip = {}; } }
function loadRemovedSlots(){ try{ state.removedSlots = new Set(JSON.parse(localStorage.getItem('rp_removed_slots') || '[]')); } catch{ state.removedSlots = new Set(); } }
function loadExtraSlots(){ try{ state.extraProductSlots = JSON.parse(localStorage.getItem('rp_extra_slots') || '{}') || {}; } catch{ state.extraProductSlots = {}; } }

function rotateSelectedImg(){
  if(!state.selectedImgKey) return;
  const k = state.selectedImgKey;
  state.imgRotation[k] = ((state.imgRotation[k] || 0) + 90) % 360;
  saveImgRotation();
  reapplyImgScales();
}
function flipSelectedImgH(){
  if(!state.selectedImgKey) return;
  const k = state.selectedImgKey;
  const f = state.imgFlip[k] || {};
  f.h = !f.h;
  state.imgFlip[k] = f;
  saveImgFlip();
  reapplyImgScales();
}
function flipSelectedImgV(){
  if(!state.selectedImgKey) return;
  const k = state.selectedImgKey;
  const f = state.imgFlip[k] || {};
  f.v = !f.v;
  state.imgFlip[k] = f;
  saveImgFlip();
  reapplyImgScales();
}
function removeSelectedImg(){
  if(!state.selectedImgKey) return;
  const k = state.selectedImgKey;
  state.removedSlots.add(k);
  delete state.imgScaleOverrides[k];
  delete state.imgPosOverrides[k];
  delete state.imgRotation[k];
  delete state.imgFlip[k];
  delete state.userImages[k];
  state.selectedImgKey = null;
  saveRemovedSlots(); saveImgScale(); saveImgPos(); saveImgRotation(); saveImgFlip(); saveUserImages();
  updateScaleUI();
  render();
}
function addProductSlot(cellKey){
  state.extraProductSlots[cellKey] = (state.extraProductSlots[cellKey] || 0) + 1;
  saveExtraSlots();
  render();
}
// Build product image slots for a cell (shared by Classic grid + Festive left box)
function buildProductSlots(cellKey, productImages, imgTag, uploadSlotHtml){
  const extra = state.extraProductSlots[cellKey] || 0;
  const total = Math.max(1, productImages.length) + extra;
  const parts = [];
  for(let i = 0; i < total; i++){
    const key = cellKey + ':p' + i;
    const fallback = productImages[i];
    if(state.removedSlots.has(key) || (!fallback && !state.userImages[key])){
      parts.push(`<div class="prod-slot">${uploadSlotHtml(key)}</div>`);
    } else {
      parts.push(`<div class="prod-slot">${imgTag(fallback, key)}</div>`);
    }
  }
  return { html: parts.join(''), count: total };
}

/* ══════════════════════════════════════════════════════════════
   IMAGE PAN — drag to reposition selected image (v1.30)
   ══════════════════════════════════════════════════════════════ */
function loadImgPos(){
  try{ state.imgPosOverrides = JSON.parse(localStorage.getItem('rp_img_pos') || '{}') || {}; }
  catch{ state.imgPosOverrides = {}; }
}
function saveImgPos(){
  try{ localStorage.setItem('rp_img_pos', JSON.stringify(state.imgPosOverrides)); }
  catch{}
}
function applyImgPos(img, key){
  const p = state.imgPosOverrides[key];
  if(p && (p.x || p.y)){
    img.style.setProperty('--img-x', (p.x||0) + 'px');
    img.style.setProperty('--img-y', (p.y||0) + 'px');
  } else {
    img.style.removeProperty('--img-x');
    img.style.removeProperty('--img-y');
  }
}
// Attach drag handlers (mouse + touch) to allow panning while dragging selected image
let _dragState = null;
function onImgPointerDown(e){
  const img = e.target.closest('img[data-imgkey]');
  if(!img) return;
  const key = img.dataset.imgkey;
  // Only pan if image is currently selected (matches the price-tag UX)
  if(state.selectedImgKey !== key) return;
  e.preventDefault();
  const p0 = state.imgPosOverrides[key] || {x:0, y:0};
  const pt = ('touches' in e) ? e.touches[0] : e;
  _dragState = { key, img, startX: pt.clientX, startY: pt.clientY, x0: p0.x||0, y0: p0.y||0, moved: false };
  img.style.cursor = 'grabbing';
  window.addEventListener('mousemove', onImgPointerMove);
  window.addEventListener('mouseup',   onImgPointerUp);
  window.addEventListener('touchmove', onImgPointerMove, {passive:false});
  window.addEventListener('touchend',  onImgPointerUp);
}
function onImgPointerMove(e){
  if(!_dragState) return;
  const pt = ('touches' in e) ? e.touches[0] : e;
  const dx = pt.clientX - _dragState.startX;
  const dy = pt.clientY - _dragState.startY;
  if(Math.abs(dx) > 2 || Math.abs(dy) > 2) _dragState.moved = true;
  const nx = _dragState.x0 + dx;
  const ny = _dragState.y0 + dy;
  _dragState.img.style.setProperty('--img-x', nx + 'px');
  _dragState.img.style.setProperty('--img-y', ny + 'px');
  if('touches' in e) e.preventDefault();
}
function onImgPointerUp(){
  if(!_dragState) return;
  const {key, img, moved} = _dragState;
  const x = parseFloat(img.style.getPropertyValue('--img-x')) || 0;
  const y = parseFloat(img.style.getPropertyValue('--img-y')) || 0;
  if(x === 0 && y === 0) delete state.imgPosOverrides[key];
  else state.imgPosOverrides[key] = {x, y};
  saveImgPos();
  img.style.cursor = 'grab';
  _dragState = null;
  window.removeEventListener('mousemove', onImgPointerMove);
  window.removeEventListener('mouseup',   onImgPointerUp);
  window.removeEventListener('touchmove', onImgPointerMove);
  window.removeEventListener('touchend',  onImgPointerUp);
  // Suppress the click that would otherwise deselect after a real drag
  if(moved){
    const suppress = ev => { ev.stopPropagation(); ev.preventDefault(); };
    img.addEventListener('click', suppress, {once:true, capture:true});
    setTimeout(() => img.removeEventListener('click', suppress, true), 300);
  }
}
function resetImgPos(key){
  if(key){ delete state.imgPosOverrides[key]; }
  else   { state.imgPosOverrides = {}; }
  saveImgPos();
  reapplyImgScales();
}

/* ══════════════════════════════════════════════════════════════
   USER-UPLOADED IMAGES (v1.29)
   ══════════════════════════════════════════════════════════════ */
function loadUserImages(){
  try{
    const raw = localStorage.getItem('rp_user_imgs');
    if(raw) state.userImages = JSON.parse(raw) || {};
  } catch{ state.userImages = {}; }
}
function saveUserImages(){
  try{ localStorage.setItem('rp_user_imgs', JSON.stringify(state.userImages)); }
  catch(e){ showToast('พื้นที่เก็บรูปภาพเต็ม (localStorage)', 'warning'); }
}
function resizeImageDataUrl(src, maxW){
  return new Promise(resolve => {
    const im = new Image();
    im.onload = () => {
      const w = im.naturalWidth, h = im.naturalHeight;
      const s = Math.min(1, maxW / w);
      const c = document.createElement('canvas');
      c.width = Math.round(w * s); c.height = Math.round(h * s);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      resolve(c.toDataURL('image/jpeg', 0.85));
    };
    im.onerror = () => resolve(src);
    im.src = src;
  });
}
function uploadUserImage(key){
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/*';
  inp.onchange = async e => {
    const file = e.target.files && e.target.files[0]; if(!file) return;
    showSpinner('กำลังใส่รูป...');
    try{
      const reader = new FileReader();
      const dataUrl = await new Promise((res, rej) => {
        reader.onload = ev => res(ev.target.result);
        reader.onerror = rej;
        reader.readAsDataURL(file);
      });
      const small = await resizeImageDataUrl(dataUrl, 500);
      state.userImages[key] = small;
      state.removedSlots.delete(key);   // v1.33 — re-adding an image un-removes the slot
      saveUserImages();
      saveRemovedSlots();
      render();
      showToast('ใส่รูปแล้ว ✓', 'success');
    } catch(err){
      console.error(err);
      showToast('ใส่รูปไม่สำเร็จ', 'error');
    } finally { hideSpinner(); }
  };
  inp.click();
}
function clearUserImage(key){
  if(!state.userImages[key]) return;
  if(!confirm('ลบรูปที่ใส่ไว้?')) return;
  delete state.userImages[key];
  saveUserImages();
  render();
  showToast('ลบรูปแล้ว', 'info');
}
// Return user's uploaded image if any (overrides Drive image)
function resolvedImg(key, fallback){
  return state.userImages[key] || fallback || '';
}

/* ══════════════════════════════════════════════════════════════
   IMAGE SCALE — page-wide OR per-cell override (v1.26)
   ══════════════════════════════════════════════════════════════ */
function saveImgScale(){
  try{
    localStorage.setItem('rp_img_scale', String(state.imgScaleGlobal));
    localStorage.setItem('rp_img_overrides', JSON.stringify(state.imgScaleOverrides));
  } catch{}
}
function loadImgScale(){
  try{
    const g = parseInt(localStorage.getItem('rp_img_scale')); if(!isNaN(g)) state.imgScaleGlobal = g;
    const o = JSON.parse(localStorage.getItem('rp_img_overrides') || '{}'); if(o && typeof o === 'object') state.imgScaleOverrides = o;
  } catch{}
}
function scaleForKey(k){
  return state.imgScaleOverrides[k] != null ? state.imgScaleOverrides[k] : state.imgScaleGlobal;
}
function reapplyImgScales(){
  const wrap = $('#pagesWrap');
  if(!wrap) return;
  wrap.style.setProperty('--img-scale', (state.imgScaleGlobal/100).toFixed(2));
  document.querySelectorAll('.promo-cell img[data-imgkey]').forEach(img => {
    const k = img.dataset.imgkey;
    if(state.imgScaleOverrides[k] != null){
      img.style.setProperty('--img-scale', (state.imgScaleOverrides[k]/100).toFixed(2));
    } else {
      img.style.removeProperty('--img-scale');
    }
    applyImgPos(img, k);   // v1.30 — apply pan offset
    // v1.33 — rotation + flip
    const rot = state.imgRotation[k] || 0;
    if(rot) img.style.setProperty('--img-rot', rot + 'deg'); else img.style.removeProperty('--img-rot');
    const flip = state.imgFlip[k];
    if(flip && flip.h) img.style.setProperty('--img-flip-x', '-1'); else img.style.removeProperty('--img-flip-x');
    if(flip && flip.v) img.style.setProperty('--img-flip-y', '-1'); else img.style.removeProperty('--img-flip-y');
    img.classList.toggle('img-selected', state.selectedImgKey === k);
    // Cursor hint: grab if selected (pannable), pointer otherwise
    img.style.cursor = state.selectedImgKey === k ? 'grab' : 'pointer';
  });
  document.querySelectorAll('.promo-cell').forEach(c => c.classList.remove('img-selected'));
}
function selectImg(key){
  key = String(key);
  state.selectedImgKey = (key && key === state.selectedImgKey) ? null : key;
  updateScaleUI();
  reapplyImgScales();
}
function updateScaleUI(){
  const cur = state.selectedImgKey ? scaleForKey(state.selectedImgKey) : state.imgScaleGlobal;
  const sl = $('#imgScale'), lb = $('#imgScaleVal'), mode = $('#imgScaleMode');
  if(sl) sl.value = cur;
  if(lb) lb.textContent = cur + '%';
  if(mode){
    mode.textContent = state.selectedImgKey
      ? `🎯 กำลังปรับรูปที่เลือก — ลากรูปเพื่อขยับตำแหน่ง · Slider = ขนาด · คลิกรูปอื่นเพื่อสลับ`
      : `🖼️ ปรับทั้งหน้า — คลิกที่รูปสินค้าหรือของแถมเพื่อปรับ (ขนาด/ตำแหน่ง) รูปนั้น`;
    mode.classList.toggle('targeted', !!state.selectedImgKey);
  }
  const tools = $('#imgEditTools');
  if(tools) tools.style.display = state.selectedImgKey ? 'inline-flex' : 'none';
}
function applyImgScale(pct){
  const v = Math.max(20, Math.min(500, parseInt(pct) || 100));
  if(state.selectedImgKey){
    state.imgScaleOverrides[state.selectedImgKey] = v;
  } else {
    state.imgScaleGlobal = v;
  }
  saveImgScale();
  const lb = $('#imgScaleVal'); if(lb) lb.textContent = v + '%';
  reapplyImgScales();
}
function resetImgScale(){
  if(state.selectedImgKey){
    delete state.imgScaleOverrides[state.selectedImgKey];
    delete state.imgPosOverrides[state.selectedImgKey];
    delete state.imgRotation[state.selectedImgKey];       // v1.33
    delete state.imgFlip[state.selectedImgKey];
  } else {
    state.imgScaleGlobal = 100;
    state.imgScaleOverrides = {};
    state.imgPosOverrides = {};
    state.imgRotation = {};
    state.imgFlip = {};
  }
  saveImgScale();
  saveImgPos();
  saveImgRotation();
  saveImgFlip();
  updateScaleUI();
  reapplyImgScales();
}
function selectAllImages(){
  state.selectedImgKey = null;
  updateScaleUI();
  reapplyImgScales();
}

/* ══════════════════════════════════════════════════════════════
   CAT FILTER
   ══════════════════════════════════════════════════════════════ */
function saveCatFilter(){
  try{
    const obj = Object.fromEntries(CAT_COLS.map(c => [c, [...state.catExcluded[c]]]));
    localStorage.setItem('rp_cat_excluded', JSON.stringify(obj));
  } catch{}
}
function loadCatFilter(){
  try{
    const raw = localStorage.getItem('rp_cat_excluded');
    if(!raw) return;
    const obj = JSON.parse(raw);
    for(const c of CAT_COLS) if(Array.isArray(obj[c])) state.catExcluded[c] = new Set(obj[c]);
  } catch{}
}

function catFilterCounts(){
  // For each CAT col, count unique values from all filtered promos' products (before catExcluded filter)
  const counts = Object.fromEntries(CAT_COLS.map(c => [c, new Map()]));
  for(const promo of state.promotions){
    if(!clean(promo['ชื่อโปร'])) continue;
    const prod = findProduct(promo);
    if(!prod) continue;
    for(const c of CAT_COLS){
      const v = clean(prod[c]) || '(ว่าง)';
      counts[c].set(v, (counts[c].get(v) || 0) + 1);
    }
  }
  return counts;
}

function renderCatModal(){
  const counts = catFilterCounts();
  const body = document.getElementById('catModalBody');
  body.innerHTML = CAT_COLS.map(c => {
    const values = [...counts[c].entries()].sort((a,b) => String(a[0]).localeCompare(String(b[0]),'th'));
    const excluded = state.catExcluded[c];
    const search = (state.catSearch[c] || '').toLowerCase();
    const filtered = search ? values.filter(([v]) => v.toLowerCase().includes(search)) : values;
    const listHtml = filtered.length
      ? filtered.map(([v, n]) => {
          const isEx = excluded.has(v);
          return `<label class="${isEx?'excluded':''}"><input type="checkbox" ${isEx?'':'checked'} onchange="toggleCatValue('${escapeAttr(c)}','${escapeAttr(v)}')"><span class="val">${escapeHtml(v)}</span><span class="n">${n}</span></label>`;
        }).join('')
      : `<div class="empty">— ไม่พบ —</div>`;
    return `
      <div class="cat-section" data-col="${escapeAttr(c)}">
        <h4>${escapeHtml(c)}
          <span class="cnt">${values.length} ค่า</span>
          ${excluded.size ? `<span class="ex">ตัด ${excluded.size}</span>` : ''}
        </h4>
        <div class="cat-actions">

/* ══════════════════════════════════════════════════════════════
   SORTING — multi-key with priority order
   ══════════════════════════════════════════════════════════════ */
const cmpTh = (a,b) => String(a??'').localeCompare(String(b??''), 'th');
const FAR_FUTURE = new Date(2999,0,1).getTime();

function warehouseSortKey(promo){
  const list = clean(promo['Warehouses']).toUpperCase().split(/[\s,;/]+/).filter(Boolean).sort();
  return list.join(',');
}
function sortKeyFor(promo, key){
  const prod = findProduct(promo);
  const catCol = col => clean(prod?.[col]) || 'ฮ'.repeat(10);   // missing = sort to end
  switch(key){
    case 'catBu':     return catCol('CAT BU');
    case 'catType':   return catCol('CAT TYPE');
    case 'catGroup':  return catCol('CAT GROUP');
    case 'catBrand':  return catCol('CAT BRAND');
    case 'catSize':   return catCol('CAT SIZE');
    case 'catVendor': return catCol('CAT VENDOR');
    case 'name':      return clean(promo['ชื่อ']) || clean(promo['ชื่อโปร']);
    case 'expire':    return parsePeriod(promo['Period'])?.getTime() ?? FAR_FUTURE;
    case 'warehouse': return warehouseSortKey(promo);
    case 'original':  return promo._idx ?? 0;
  }
  return '';
}
function cmpByKey(a, b, key){
  const va = sortKeyFor(a, key), vb = sortKeyFor(b, key);
  if(typeof va === 'number' && typeof vb === 'number') return va - vb;
  return cmpTh(va, vb);
}
function sortPromos(list){
  const order = state.sortOrder && state.sortOrder.length ? state.sortOrder : ['catBrand'];
  return list.slice().sort((a, b) => {
    for(const key of order){
      const c = cmpByKey(a, b, key);
      if(c !== 0) return c;
    }
    return (a._idx ?? 0) - (b._idx ?? 0);   // stable fallback
  });
}

// RFC-4180 CSV parser — handles quoted cells with newlines
function parseCsv(text){
  if(!text) return [];
  if(text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  const rows=[]; let row=[], cell='', q=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){
      if(ch==='"'){ if(text[i+1]==='"'){cell+='"'; i++;} else q=false; }
      else cell+=ch;
    } else {
      if(ch==='"') q=true;
      else if(ch===','){ row.push(cell); cell=''; }
      else if(ch==='\r'){}
      else if(ch==='\n'){ row.push(cell); rows.push(row); row=[]; cell=''; }
      else cell+=ch;
    }
  }
  if(cell.length||row.length){ row.push(cell); rows.push(row); }
  return rows;
}
const clean = s => String(s??'').replace(/[​‌‍﻿]/g,'').replace(/ /g,' ').trim();

// Strip leading item-code + @ prefix (e.g., "12023939@คาร์เนชั่น..." → "คาร์เนชั่น...")
const stripCode = s => clean(s).replace(/^[A-Za-z0-9._-]{3,}@\s*/, '');

function csvToObjects(text){
  const rows = parseCsv(text);
  if(rows.length < 2) return [];
  const headers = rows[0].map(clean);
  return rows.slice(1)
    .filter(r => r.some(c => clean(c)))
    .map(r => Object.fromEntries(headers.map((k,i)=>[k, clean(r[i])])));
}

  return csvToObjects(await res.text());
}

// (from rattana-price-tag) Google Drive URL → embeddable + CORS-friendly + html2canvas-friendly
// Uses lh3.googleusercontent.com (works cross-origin, doesn't taint canvas)
function fixImageUrl(url){
  url = String(url||'').trim();
  if(!url) return '';
  if(url.includes('drive.google.com') || url.includes('googleusercontent.com')){
    const m = url.match(/[?&]id=([a-zA-Z0-9_-]+)/)
           || url.match(/\/d\/([a-zA-Z0-9_-]+)/)
           || url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
    if(m) return `https://lh3.googleusercontent.com/d/${m[1]}=w600`;
  }
  return url;
}

function imgAtWidth(url, w){

/* ── Bake white background → real transparency (for print/export) ─────
   mix-blend-mode:multiply gives the effect on screen, but html2canvas /
   window.print() ignore blend modes. This canvases each image, sets
   near-white pixels' alpha to 0, and swaps src to the transparent PNG.
   Cached per URL. Falls back to original on CORS taint. */
const _bakeCache = new Map();
function bakeWhiteTransparent(url){
  if(!url) return Promise.resolve(url);
  if(_bakeCache.has(url)) return _bakeCache.get(url);
  const p = new Promise(resolve => {
    const im = new Image();
    im.crossOrigin = 'anonymous';
    im.onload = () => {
      try{
        const c = document.createElement('canvas');
        c.width = im.naturalWidth; c.height = im.naturalHeight;
        const ctx = c.getContext('2d');
        ctx.drawImage(im, 0, 0);
        const data = ctx.getImageData(0, 0, c.width, c.height);
        const a = data.data;
        for(let i = 0; i < a.length; i += 4){
          if(a[i] > 240 && a[i+1] > 240 && a[i+2] > 240) a[i+3] = 0;   // near-white → transparent
        }
        ctx.putImageData(data, 0, 0);
        resolve(c.toDataURL('image/png'));
      } catch(e){ resolve(url); }
    };
    im.onerror = () => resolve(url);
    im.src = url;
  });
  _bakeCache.set(url, p);
  return p;
}
// Bake every image inside .pages-wrap (called before print/export)
async function bakeAllImages(){
  const imgs = Array.from(document.querySelectorAll('#pagesWrap img'));
  await Promise.all(imgs.map(async img => {
    if(img.dataset.baked === '1') return;
    const src = img.src;
    if(!src || src.startsWith('data:')) return;
    const baked = await bakeWhiteTransparent(src);
    if(baked && baked !== src){ img.src = baked; img.dataset.baked = '1'; }
  }));
}

// Convert Thai/Buddhist year format if needed
function formatBuddhistDate(d){
  if(!(d instanceof Date) || isNaN(d)) return '-';
  const dd = String(d.getDate()).padStart(2,'0');
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const yyyy = d.getFullYear() + 543;
  return `${dd}/${mm}/${yyyy}`;
}
function parsePeriod(s){
  // Accept 2027/07/27, 2027-07-27, 27/07/2027, 27/07/2570
  s = clean(s);
  if(!s) return null;
  // YYYY/MM/DD or YYYY-MM-DD
  let m = s.match(/^(\d{4})[/-](\d{1,2})[/-](\d{1,2})$/);
  if(m){
    let y = +m[1]; if(y >= 2500) y -= 543;
    return new Date(y, +m[2]-1, +m[3]);
  }
  m = s.match(/^(\d{1,2})[/-](\d{1,2})[/-](\d{4})$/);
  if(m){
    let y = +m[3]; if(y >= 2500) y -= 543;
    return new Date(y, +m[2]-1, +m[1]);
  }
  const d = new Date(s);
  return isNaN(d) ? null : d;
}

async function loadAll(useCache=true){

  try{
    let products = useCache && getCached('rp_products');
    let promos   = useCache && getCached('rp_promos');

    if(!products) jobs.push(fetchSheet(CFG.productsSheetId).then(d => products = d));
    if(!promos)   jobs.push(fetchSheet(CFG.promoSheetId, CFG.promoSheetName).then(d => promos = d));
    await Promise.all(jobs);

    if(products) setCached('rp_products', products);
    if(promos)   setCached('rp_promos',   promos);

    state.products = products || [];
    // Normalize promo headers — sheet's col E (จำนวน) sometimes has blank header
    // Map known columns by position if the canonical key is missing.
    const CANON = ['ชื่อโปร','วิธีวัด','ชื่อ','ราคาขายกำหนด','จำนวน','รูปแบบขาย','ลดราคา','แถมสินค้า','Barcode สินค้าแถมEA','จำนวนแถมEA','รายละเอียดโปร','หมายเหตุ','Period','Warehouses','Role','เช็คแล้ว','แถมร่วม','การเคลม','ขอบเขตโปร','ST ตั้งต้น'];
    state.promotions = (promos || []).map((p,i) => {
      const origKeys = Object.keys(p);
      const fixed = {};
      CANON.forEach((c, idx) => { fixed[c] = origKeys[idx] !== undefined ? (p[origKeys[idx]] ?? '') : ''; });
      // Preserve any extra fields that don't fit CANON
      for(const k of origKeys){ if(!(k in fixed) && k) fixed[k] = p[k]; }
      fixed._idx = i;
      return fixed;
    });
    state.deselected.clear();

    buildIndexes();
    updateStats();
    render();
    showToast(`โหลดสำเร็จ · ${state.promotions.length} โปร · ${state.products.length} สินค้า`, 'success');
  } catch(err){
    console.error(err);

function buildIndexes(){
  const byName = new Map(), byCatSize = new Map(), byCatBrand = new Map(), byBarcode = new Map();
  const listCatSize = new Map(), listCatBrand = new Map();   // v1.23 — full product lists per CAT key
  const barcodeCols = ['CODE EA','CODE PA','CODE BP','CODE CS'];
  for(const p of state.products){
    const name = clean(p['PRODUCT NAME']);
    const catSize = clean(p['CAT SIZE']);
    const catBrand = clean(p['CAT BRAND']);
    if(name && !byName.has(name)) byName.set(name, p);
    if(catSize){
      if(!byCatSize.has(catSize)) byCatSize.set(catSize, p);
      if(!listCatSize.has(catSize)) listCatSize.set(catSize, []);
      listCatSize.get(catSize).push(p);
    }
    if(catBrand){
      if(!byCatBrand.has(catBrand)) byCatBrand.set(catBrand, p);
      if(!listCatBrand.has(catBrand)) listCatBrand.set(catBrand, []);
      listCatBrand.get(catBrand).push(p);
    }
    for(const c of barcodeCols){
      const bc = clean(p[c]);
      if(bc && !byBarcode.has(bc)) byBarcode.set(bc, p);
    }
  }
  state.productByName = byName;
  state.productByCatSize = byCatSize;
  state.productByCatBrand = byCatBrand;
  state.productByBarcode = byBarcode;
  state.productsByCatSize = listCatSize;
  state.productsByCatBrand = listCatBrand;
}

// v1.23 — All products that match a promo (single for PRODUCT NAME, many for CAT)
function findAllProductsForPromo(promo){
  const method = clean(promo['วิธีวัด']).toUpperCase();
  const key = clean(promo['ชื่อ']);
  if(!key) return [];
  if(method === 'CAT SIZE')  return state.productsByCatSize.get(key)  || [];
  if(method === 'CAT BRAND') return state.productsByCatBrand.get(key) || [];
  // PRODUCT NAME (or unknown): single
  const p = state.productByName.get(key);
  return p ? [p] : [];
}

function findGiftProduct(promo){
  const bc = clean(promo['Barcode สินค้าแถมEA']);
  if(bc && state.productByBarcode.has(bc)) return state.productByBarcode.get(bc);
  const name = stripCode(promo['แถมสินค้า']);
  if(name){
    if(state.productByName.has(name)) return state.productByName.get(name);
    // fuzzy: startsWith
    for(const [k, v] of state.productByName){
      if(k.startsWith(name) || name.startsWith(k)) return v;
    }
  }
  return null;
}

function findProduct(promo){
  const method = clean(promo['วิธีวัด']).toUpperCase();
  const key = clean(promo['ชื่อ']);
  if(!key) return null;
  if(method === 'PRODUCT NAME') return state.productByName.get(key) || null;
  if(method === 'CAT SIZE')     return state.productByCatSize.get(key) || null;
  if(method === 'CAT BRAND')    return state.productByCatBrand.get(key) || null;
  // fallback: try all
  return state.productByName.get(key) || state.productByCatSize.get(key) || state.productByCatBrand.get(key) || null;
}

function findProductImage(product){
  if(!product) return '';
  // Column labelled SKU_USAGE (col 100) but actually holds Drive URLs in this sheet
  // Also scan other candidate columns just in case
  const candidates = ['SKU_USAGE','DESCRIPTION','IMAGE','IMG','รูปภาพ','GOODS_WEIGHT'];
  for(const c of candidates){
    const v = product[c];
    if(v && /drive\.google\.com/.test(v)) return driveImg(v);
  }
  // Scan any column for a Drive URL
  for(const [,v] of Object.entries(product)){
    if(v && /drive\.google\.com/.test(v)) return driveImg(v);
  }
  return '';
}

  const end = parsePeriod(promo['Period']);
  if(!end) return true; // no date → assume active
  const today = new Date(); today.setHours(0,0,0,0);

function matchesWarehouse(promo, wh){
  if(!wh) return true;
  const list = clean(promo['Warehouses']).toUpperCase().split(/[\s,;/]+/).filter(Boolean);
  return list.length === 0 || list.includes(wh.toUpperCase());

function passesCatFilter(promo){
  // Any CAT dimension with excluded values → skip promos whose product's CAT value is in that set
  const anyExcluded = CAT_COLS.some(c => state.catExcluded[c].size > 0);
  if(!anyExcluded) return true;
  const prod = findProduct(promo);
  for(const c of CAT_COLS){
    const set = state.catExcluded[c];
    if(!set.size) continue;
    const val = clean(prod?.[c]) || '(ว่าง)';
    if(set.has(val)) return false;
  }
  return true;
}
function filterPromos(){
  const f = getFilters();
  return state.promotions.filter(p => {
    if(!clean(p['ชื่อโปร'])) return false;
    if(f.hideRole4 && clean(p['Role']) === '4') return false;
    if(f.checked && clean(p['เช็คแล้ว']).toLowerCase() !== 'เช็คแล้ว') return false;
    if(f.active && !isActive(p)) return false;
    if(!matchesWarehouse(p, f.warehouse)) return false;
    if(!passesCatFilter(p)) return false;
    if(f.search){
      const hay = [p['ชื่อโปร'],p['ชื่อ'],p['แถมสินค้า'],p['รายละเอียดโปร']].map(x=>clean(x).toLowerCase()).join(' ');
      if(!hay.includes(f.search)) return false;
    }
    return true;
  });
}

}

  return `
    <div class="promo-cell${isDeselected ? ' deselected' : ''}${tiers.length > 1 ? ' merged' : ''}" data-idx="${primaryIdx}" data-idxs="${idxsAttr}" data-cellkey="${cellKey}">

/* ══════════════════════════════════════════════════════════════
   GROUPING BY CATEGORY
   ══════════════════════════════════════════════════════════════ */
function catOf(promo){
  const p = findProduct(promo);
  if(p){
    return clean(p['CAT BRAND']) || clean(p['CAT GROUP']) || clean(p['CAT SIZE']) || 'อื่น ๆ';
  }
  // fallback: match value or first word of promo title
  return clean(promo['ชื่อ']) || clean(promo['ชื่อโปร']).split(/\s+/)[0] || 'อื่น ๆ';
}
function groupByCat(list){
  // Stable sort by cat, preserving original order within each group
  const withCat = list.map((p, origIdx) => ({p, origIdx, cat: catOf(p)}));
  withCat.sort((a,b) => {
    const c = a.cat.localeCompare(b.cat, 'th');
    return c !== 0 ? c : a.origIdx - b.origIdx;
  });
  return withCat.map(x => x.p);
}

// Merge promos that share (a) same รายละเอียดโปร text, OR (b) same product+gift
// Detail-match wins if present. Aliases are cross-registered so subsequent rows can join
// either way (e.g., row A merges to B by detail, row C can then merge to that group by product+gift).
function mergePromos(list){
  const byDetail = new Map();
  const byPG = new Map();
  const merged = [];
  for(const promo of list){
    const detail = clean(promo['รายละเอียดโปร']);
    const prod = findProduct(promo);
    const gift = findGiftProduct(promo);
    const productKey = clean(prod?.['PRODUCT NAME']) || clean(promo['ชื่อ']) || '';
    const giftKey = clean(gift?.['PRODUCT NAME']) || clean(promo['Barcode สินค้าแถมEA']) || clean(promo['แถมสินค้า']) || '';
    const dK = detail || null;
    const pgK = (productKey && giftKey) ? productKey + '||' + giftKey : null;

    let groupIdx = null;
    if(dK  && byDetail.has(dK))  groupIdx = byDetail.get(dK);
    else if(pgK && byPG.has(pgK)) groupIdx = byPG.get(pgK);

    if(groupIdx !== null){
      merged[groupIdx].tiers.push(promo);
    } else {
      groupIdx = merged.length;
      merged.push({promo, tiers:[promo], productKey, giftKey});
    }
    // Register aliases so a later row matching either key joins this group
    if(dK  && !byDetail.has(dK))  byDetail.set(dK, groupIdx);
    if(pgK && !byPG.has(pgK))     byPG.set(pgK, groupIdx);
  }
  return merged;
}

function emptyCellHTML(){
  return `<div class="promo-cell empty"></div>`;
}

function currentPeriodText(list){
  // Find earliest period date among filtered list
  const dates = list.map(p => parsePeriod(p['Period'])).filter(Boolean);
  if(!dates.length) return '';
  const latest = new Date(Math.max(...dates.map(d => d.getTime())));
  return `ถึง ${formatBuddhistDate(latest)}`;
}

function render(){
  const filtered = filterPromos();
  const selectedOnly = filtered.filter(p => !state.deselected.has(p._idx));
  $('#stShown').textContent = filtered.length.toLocaleString('th-TH');
  $('#stSelected').textContent = selectedOnly.length.toLocaleString('th-TH');

  const wrap = $('#pagesWrap');
  if(!filtered.length){
    wrap.innerHTML = `
      <div class="empty-state">
        <div class="icon">📦</div>
        <h2>ไม่พบโปรโมชัน</h2>
        <div>ลองปรับตัวกรองด้านบน</div>
      </div>`;
    $('#stPages').textContent = 0;
    return;
  }

  // Apply chosen sort, then merge same product+gift into tiered entries
  const sorted = sortPromos(filtered);
  const mergedAll = mergePromos(sorted);
  // Split merged into selected vs deselected for browse layout
  const selectedEntries = mergedAll.filter(e => !e.tiers.every(t => state.deselected.has(t._idx)));
  const deselectedEntries = mergedAll.filter(e =>  e.tiers.every(t => state.deselected.has(t._idx)));

  const printPages = Math.max(1, Math.ceil(selectedEntries.length / CFG.perPage));
  $('#stPages').textContent = selectedEntries.length ? printPages : 0;

  const wh = $('#fWarehouse').value;
  const whBadge = wh ? `<span class="badge-wh">${wh}</span>` : '';
  const periodText = currentPeriodText(filtered);

  const pagesHtml = [];
  for(let pageIdx = 0; pageIdx < printPages; pageIdx++){
    const start = pageIdx * CFG.perPage;
    const chunk = selectedEntries.slice(start, start + CFG.perPage);
    const cellsHtml = [];
    for(let i = 0; i < CFG.perPage; i++){
      const entry = chunk[i];
      if(entry) cellsHtml.push(promoCellHTML(entry));
      else       cellsHtml.push(emptyCellHTML());
    }
    pagesHtml.push(`
      <div class="page-a4">
        <div class="page-inner">
          <div class="page-head">
            ${whBadge}
            <span class="page-num">${pageIdx+1}/${printPages}</span>
            <h1>PROMOTION</h1>
            ${periodText ? `<div class="period">${escapeHtml(periodText)}</div>` : ''}
          </div>
          <div class="promo-grid">${cellsHtml.join('')}</div>
          <div class="page-foot">
            <span class="fi"><span class="lbl">โทร</span> ${CFG.contact.phone}</span>
            <span class="fi"><span class="lbl">LINE</span> ${CFG.contact.line}</span>
          </div>
        </div>
      </div>
    `);
  }

  let deselectedHtml = '';
  if(deselectedEntries.length){
    const cells = deselectedEntries.map(e => promoCellHTML(e)).join('');
    const totalPromos = deselectedEntries.reduce((s,e) => s + e.tiers.length, 0);
    deselectedHtml = `
      <div class="no-print" style="max-width:1400px;margin:20px auto 0;padding:0 12px 20px">
        <div style="background:#fff3cd;border:1px solid #ffc107;color:#8a5a00;padding:10px 14px;border-radius:8px;font-weight:600;font-size:13px;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
          <span>ตัดออก ${totalPromos} รายการ (ไม่พิมพ์)</span>
          <button class="icon-btn" style="background:#fff;color:#8a5a00;border:1px solid #ffc107;height:32px;font-size:12px" onclick="selectAll()">เอากลับทั้งหมด</button>
        </div>
        <div class="deselected-grid">${cells}</div>
      </div>`;
  }

  wrap.innerHTML = pagesHtml.join('') + deselectedHtml;
  reapplyImgScales();   // v1.26 — apply page-wide + per-cell scale overrides
}

   EXCEL EXPORT — 2 คอลัมน์: Promotion / Free (ตามรูปแบบที่ user ส่ง)
   ══════════════════════════════════════════════════════════════ */
function displayName(promo){
  const method = clean(promo['วิธีวัด']).toUpperCase();
  const key = clean(promo['ชื่อ']);
  const prod = findProduct(promo);
  if(method === 'CAT SIZE')  return key + ' รสใดก็ได้';    // ขนาดเดียวกัน, รสไหนก็ได้
  if(method === 'CAT BRAND') return key + ' ขนาดใดก็ได้';  // ยี่ห้อเดียวกัน, ขนาดไหนก็ได้
  // PRODUCT NAME (หรือไม่ระบุ): ใช้ PRODUCT NAME เต็ม
  return clean(prod?.['PRODUCT NAME']) || key;
}
function buildBuyText(promo){
  const qty = clean(promo['จำนวน']) || '1';
  const unit = clean(promo['รูปแบบขาย']).toUpperCase();
  const unitLabel = UNIT_LABEL[unit] || unit || 'หน่วย';
  return `ซื้อ${displayName(promo)} ${qty} ${unitLabel}`;
}
function buildFreeText(promo){
  const giftName = stripCode(promo['แถมสินค้า']);
  const giftQty = clean(promo['จำนวนแถมEA']);
  const disc = clean(promo['ลดราคา']);
  if(giftName){
    return `แถมฟรี ${giftName}${giftQty ? ' ' + giftQty + ' ชิ้น' : ''}`;
  }
  if(disc) return `ลด ${disc} บาท`;
  return clean(promo['รายละเอียดโปร']);
}
function exportExcel(){
  if(!window.XLSX){
    showToast('SheetJS ยังไม่โหลด — รอสักครู่แล้วลองใหม่','warning');
    return;
  }
  const filtered = filterPromos();
  const selectedOnly = filtered.filter(p => !state.deselected.has(p._idx));
  const sorted = sortPromos(selectedOnly);
  if(!sorted.length){
    showToast('ไม่มีโปรที่เลือก','warning');
    return;
  }

  // Apply the SAME merge as on-screen: 1 row per merged group, tiers stacked with newlines
  const groups = mergePromos(sorted);

  const rows = [['Promotion', 'Free', 'หมดโปรวันที่', 'รายละเอียด', 'คลัง']];
  const rowHeights = [{hpx:32}];
  const WH_ORDER = ['W1','W2','W3','W4'];
  groups.forEach(g => {
    const buyLines  = g.tiers.map(t => buildBuyText(t));
    const freeLines = g.tiers.map(t => buildFreeText(t));
    const detailLines = [];
    g.tiers.forEach((_, i) => {
      detailLines.push(buyLines[i]);
      detailLines.push(freeLines[i]);
    });
    const dates = g.tiers.map(t => parsePeriod(t['Period'])).filter(Boolean);
    const endStr = dates.length ? formatBuddhistDate(new Date(Math.min(...dates.map(d => d.getTime())))) : '-';
    // Union of warehouses across all tiers, sorted W1→W4 then any extras
    const whSet = new Set();
    g.tiers.forEach(t => clean(t['Warehouses']).toUpperCase().split(/[\s,;/]+/).filter(Boolean).forEach(w => whSet.add(w)));
    const whList = [...WH_ORDER.filter(w => whSet.has(w)), ...[...whSet].filter(w => !WH_ORDER.includes(w))];
    const whStr = whList.join(', ') || '-';

    rows.push([ buyLines.join('\n'), freeLines.join('\n'), endStr, detailLines.join('\n'), whStr ]);
    rowHeights.push({hpx: Math.max(26, 20 + g.tiers.length * 20)});
  });

  const ws = XLSX.utils.aoa_to_sheet(rows);

  const headerStyle = (bg) => ({
    font:{bold:true, sz:12, color:{rgb:'FFFFFF'}, name:'Sarabun'},
    fill:{fgColor:{rgb:bg}, patternType:'solid'},
    alignment:{horizontal:'center', vertical:'center', wrapText:true},
    border:{
      top:{style:'thin', color:{rgb:'666666'}},
      bottom:{style:'thin', color:{rgb:'666666'}},
      left:{style:'thin', color:{rgb:'666666'}},
      right:{style:'thin', color:{rgb:'666666'}},
    },
  });
  ws['A1'].s = headerStyle('1F4E79');   // Promotion   — Excel blue
  ws['B1'].s = headerStyle('548235');   // Free        — Excel green
  ws['C1'].s = headerStyle('C55A11');   // หมดโปรวันที่ — Excel orange
  ws['D1'].s = headerStyle('7030A0');   // รายละเอียด  — Excel purple
  ws['E1'].s = headerStyle('008B8B');   // คลัง        — Excel teal

  const dataStyle = (align) => ({
    font:{sz:11, name:'Sarabun'},
    alignment:{horizontal:align, vertical:'center', wrapText:true},
    border:{
      top:{style:'thin', color:{rgb:'CCCCCC'}},
      bottom:{style:'thin', color:{rgb:'CCCCCC'}},
      left:{style:'thin', color:{rgb:'CCCCCC'}},
      right:{style:'thin', color:{rgb:'CCCCCC'}},
    },
  });
  for(let r = 1; r < rows.length; r++){
    const cells = ['A','B','C','D','E'].map(col => col + (r + 1));
    if(ws[cells[0]]) ws[cells[0]].s = dataStyle('left');
    if(ws[cells[1]]) ws[cells[1]].s = dataStyle('left');
    if(ws[cells[2]]) ws[cells[2]].s = dataStyle('center');
    if(ws[cells[3]]) ws[cells[3]].s = dataStyle('center');
    if(ws[cells[4]]) ws[cells[4]].s = dataStyle('center');
  }

  ws['!cols'] = [{wch:45}, {wch:45}, {wch:16}, {wch:60}, {wch:16}];
  ws['!rows'] = rowHeights;

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Promotion');

  const today = new Date();
  const dd = String(today.getDate()).padStart(2,'0');
  const mm = String(today.getMonth()+1).padStart(2,'0');
  const yyyy = today.getFullYear() + 543;
  const wh = $('#fWarehouse').value;
  const filename = `Promotion${wh ? '_' + wh : ''}_${dd}${mm}${yyyy}.xlsx`;
  XLSX.writeFile(wb, filename);
  showToast(`ส่งออก ${groups.length} กลุ่ม (${sorted.length} โปร) → ${filename}`,'success');
}

   BOOT
   ══════════════════════════════════════════════════════════════ */
window.addEventListener('scroll', ()=>{
  $('#backToTop').classList.toggle('show', window.scrollY > 300);
});
document.addEventListener('DOMContentLoaded', ()=>{
  const get = k => { try{ return localStorage.getItem(k); } catch{ return null; } };
  setFont(get('rp_font') || 'Anuphan');
  setBg(get('rp_bg') || 'plain', true);
  const savedOrder = (get('rp_sort_order') || 'catBrand').split(',')
    .map(k => k === 'cat' ? 'catBrand' : k)   // migrate legacy 'cat' → 'catBrand'
    .filter(k => SORT_KEYS.includes(k));
  state.sortOrder = savedOrder.length ? savedOrder : ['catBrand'];
  renderSortChips();
  loadCatFilter();
  updateCatExCountBadge();
  loadImgScale();
  updateScaleUI();
  loadUserImages();
  loadImgPos();
  loadImgRotation();
  loadImgFlip();
  loadRemovedSlots();
  loadExtraSlots();
  // v1.30 — pan: mousedown/touchstart on images anywhere in the pages wrap
  document.addEventListener('mousedown', onImgPointerDown);
  document.addEventListener('touchstart', onImgPointerDown, {passive:false});
  // v1.30 — restore collapsed state of control block
  if(get('rp_ctrl_collapsed') === '1'){
    setTimeout(() => {
      const cb = document.querySelector('.control-block');
      const btn = document.getElementById('ctrlCollapseBtn');
      if(cb){ cb.classList.add('collapsed'); if(btn) btn.textContent = '◢ แสดง'; }
    }, 0);
  }
  setTemplate(get('rp_template') || 'classic');
  loadAll(true);
});
</script>
</body>
</html>
