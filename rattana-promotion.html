<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,viewport-fit=cover">
<title>Rattana Promotion v1.5</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0d1b3e;--navy-mid:#1a2f5e;--navy-light:#243b73;
  --gold:#c9a84c;--gold-light:#e8c86a;
  --red:#e63946;--red-dark:#c81d2a;
  --success:#2ecc71;--danger:#e74c3c;--warning:#f39c12;--info:#3498db;
  --bg:#f4f6fb;--text:#0d1b3e;--card-bg:#ffffff;--border:#dde3f0;--muted:#6b7896;--row-alt:#fafbfd;
  --shadow-sm:0 1px 4px rgba(0,0,0,.06);
  --shadow-md:0 2px 8px rgba(0,0,0,.08);
  --shadow-lg:0 8px 24px rgba(13,27,62,.12);
  --shadow-gold:0 4px 12px rgba(201,168,76,.35);
  --radius-sm:6px;--radius-md:12px;--radius-lg:16px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{font-family:'Sarabun',sans-serif;min-height:100dvh;overflow-x:hidden;background:var(--bg);color:var(--text);-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
input,select,textarea{font-family:inherit;font-size:16px}
img{max-width:100%;display:block}

/* Header */
header{background:var(--navy);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:10px;border-bottom:3px solid var(--gold);padding-top:max(12px,env(safe-area-inset-top));flex-wrap:wrap}
.logo-text{font-weight:700;letter-spacing:1px;font-size:16px;color:#fff;flex:1;min-width:0}
.logo-text span.brand{color:var(--gold)}
.logo-text .v{font-size:11px;opacity:.65;font-weight:400;margin-left:6px}
.icon-btn{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.2);height:38px;min-width:38px;padding:0 12px;border-radius:var(--radius-sm);display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:600;transition:background .15s;white-space:nowrap}
.icon-btn:hover{background:rgba(255,255,255,.12)}
.icon-btn.gold{background:var(--gold);color:var(--navy);border-color:var(--gold);font-weight:700}
.icon-btn.gold:hover{background:var(--gold-light)}
.icon-btn:disabled{opacity:.5;cursor:not-allowed}

/* Filter bar */
.filter-bar{background:var(--card-bg);border-bottom:1px solid var(--border);padding:10px 12px;position:sticky;top:60px;z-index:90;display:grid;grid-template-columns:1fr 1fr;gap:8px;box-shadow:var(--shadow-sm)}
.filter-bar .f-full{grid-column:1/-1}
@media(min-width:640px){
  .filter-bar{grid-template-columns:170px 170px 1fr auto;padding:12px 16px;align-items:center;top:63px}
  .filter-bar .f-full{grid-column:auto}
}
.f-field{display:flex;flex-direction:column;gap:3px}
.f-field label{font-size:10px;font-weight:600;color:var(--muted);letter-spacing:.4px;text-transform:uppercase}
.f-input{height:38px;padding:0 12px;border-radius:var(--radius-sm);border:1.5px solid var(--border);background:var(--card-bg);color:var(--text);font-size:14px;font-family:inherit;outline:none;transition:border-color .15s;width:100%}
.f-input:focus{border-color:var(--gold)}
.f-check{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--text);cursor:pointer;user-select:none;height:38px;padding:0 4px}
.f-check input{width:18px;height:18px;accent-color:var(--gold);cursor:pointer}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:12px;max-width:1400px;margin:0 auto}
.stat-card{background:var(--card-bg);border-radius:var(--radius-md);padding:12px;border:1px solid var(--border);border-top:3px solid var(--gold);text-align:center}
.stat-card .s-label{font-size:10px;color:var(--muted);font-weight:600;letter-spacing:.4px;text-transform:uppercase;margin-bottom:4px}
.stat-card .s-value{font-size:20px;font-weight:800;line-height:1.1;color:var(--navy)}
.stat-card.blue{border-top-color:var(--info)}
.stat-card.blue .s-value{color:var(--info)}
.stat-card.gold .s-value{color:var(--gold)}
.stat-card.red{border-top-color:var(--red)}
.stat-card.red .s-value{color:var(--red)}
@media(min-width:640px){.stat-card .s-value{font-size:24px}}

/* Grid */
.pages-wrap{max-width:1400px;margin:0 auto;padding:0 12px 20px}
.page-a4{background:#fff;margin:12px auto;box-shadow:var(--shadow-md);border-radius:var(--radius-md);overflow:hidden;position:relative}
.page-inner{display:flex;flex-direction:column;min-height:520px;padding:14px 12px;position:relative}
@media(min-width:640px){.page-inner{min-height:700px}}
.page-head{background:linear-gradient(135deg,var(--red) 0%,var(--red-dark) 100%);color:#fff;margin:-14px -12px 10px;padding:12px 16px;text-align:center;position:relative}
.page-head h1{font-size:28px;font-weight:800;letter-spacing:3px;line-height:1}
.page-head .period{margin-top:4px;font-size:13px;font-weight:600;opacity:.95}
.page-head .badge-wh{position:absolute;top:10px;right:12px;background:var(--gold);color:var(--navy);padding:3px 10px;border-radius:12px;font-size:11px;font-weight:700;letter-spacing:.5px}
.page-head .page-num{position:absolute;top:10px;left:12px;background:rgba(255,255,255,.2);color:#fff;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:600}

.promo-grid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(4,1fr);gap:8px;flex:1;align-content:stretch}
.promo-cell{background:#fff;border:1.5px solid var(--red);border-radius:8px;padding:6px;display:flex;flex-direction:column;position:relative;min-height:0;overflow:hidden;cursor:pointer;transition:opacity .15s,transform .1s}
.promo-cell:hover{transform:translateY(-1px);box-shadow:var(--shadow-md)}
.promo-cell.empty{background:#fafbfd;border:1.5px dashed #d0d5dd;opacity:.4;cursor:default}
.promo-cell.empty:hover{transform:none;box-shadow:none}
.promo-cell.deselected{opacity:.35;filter:grayscale(.7)}
.promo-cell.deselected::after{content:'ตัดออก';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-8deg);background:rgba(230,57,70,.9);color:#fff;padding:4px 14px;border-radius:6px;font-size:13px;font-weight:800;letter-spacing:2px;pointer-events:none;box-shadow:0 2px 8px rgba(0,0,0,.2);z-index:5}
.sel-tick{position:absolute;top:6px;left:6px;width:22px;height:22px;border-radius:50%;background:#fff;border:2px solid var(--success);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;color:var(--success);z-index:4;transition:all .15s;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.promo-cell.deselected .sel-tick{border-color:var(--red);color:var(--red);background:#fff}
.promo-cell .sel-tick::before{content:'✓'}
.promo-cell.deselected .sel-tick::before{content:'✕'}
.cat-header{grid-column:1/-1;background:linear-gradient(90deg,rgba(201,168,76,.18),transparent);border-left:4px solid var(--gold);padding:4px 10px;margin:6px 0 2px;font-size:12px;font-weight:700;color:var(--navy);letter-spacing:.5px;border-radius:3px}
.cat-header .cnt{color:var(--muted);font-weight:500;font-size:11px;margin-left:6px}
.deselected-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:640px){.deselected-grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1024px){.deselected-grid{grid-template-columns:repeat(4,1fr)}}
.deselected-grid .promo-cell{min-height:150px}
.promo-body{display:flex;gap:8px;flex:1;align-items:stretch}
.promo-img{width:38%;flex-shrink:0;background:#f7f8fa;border-radius:6px;display:flex;align-items:center;justify-content:center;overflow:hidden;min-height:100px}
.promo-img img{width:100%;height:100%;object-fit:contain;padding:4px}
.promo-img.no-img{color:var(--muted);font-size:10px;text-align:center;padding:8px}
.promo-info{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}
.promo-title{font-size:12px;font-weight:700;color:var(--navy);line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.promo-buy{background:var(--navy);color:#fff;padding:3px 8px;border-radius:4px;font-size:11px;font-weight:700;text-align:center;letter-spacing:.3px}
.promo-buy .n{font-size:14px}
.tier-list{display:flex;flex-direction:column;gap:2px}
.tier-row{display:grid;grid-template-columns:1fr 12px 1fr;align-items:center;gap:2px;background:linear-gradient(90deg,var(--navy) 0 calc(50% - 8px),#fff3cd calc(50% + 4px) 100%);border-radius:4px;overflow:hidden;font-size:10.5px;font-weight:700;line-height:1.35;min-height:22px}
.tier-buy{color:#fff;padding:3px 6px;text-align:center;letter-spacing:.2px;white-space:nowrap}
.tier-buy b{font-size:12.5px}
.tier-arrow{color:var(--gold);font-size:12px;text-align:center;background:var(--navy);height:100%;display:flex;align-items:center;justify-content:center;font-weight:800}
.tier-gift{color:#8a5a00;padding:3px 6px;text-align:center;white-space:nowrap}
.tier-gift .tg-n{font-size:12.5px;color:var(--red);font-weight:800}
.badge-tier{background:#ffe4b5;color:#8a5a00;border:1px solid #ffc107}
.promo-gift{background:linear-gradient(135deg,#fff3cd,#ffe69c);border:1px solid #ffc107;border-radius:4px;padding:4px 6px;font-size:11px;color:#8a5a00;line-height:1.3;flex:1;display:flex;flex-direction:row;align-items:center;gap:6px}
.promo-gift .gift-info{flex:1;display:flex;flex-direction:column;justify-content:center;min-width:0}
.promo-gift .gift-img{width:38px;height:38px;flex-shrink:0;background:#fff;border-radius:4px;border:1px solid rgba(255,193,7,.5);display:flex;align-items:center;justify-content:center;overflow:hidden}
.promo-gift .gift-img img{width:100%;height:100%;object-fit:contain;padding:2px}
.promo-gift .gift-img.no-img{color:#996800;font-size:9px}
.promo-gift .lbl{font-size:9px;color:#996800;font-weight:700;letter-spacing:.5px;text-transform:uppercase;margin-bottom:1px}
.promo-gift .gift-name{font-weight:700;color:#5a3d00;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.promo-gift .gift-qty{font-weight:800;font-size:13px;color:var(--red)}
.promo-detail{font-size:10px;color:var(--muted);line-height:1.3;margin-top:2px}
.promo-badges{position:absolute;top:4px;right:4px;display:flex;gap:3px;flex-wrap:wrap;max-width:60%;justify-content:flex-end}
.badge-mini{font-size:9px;padding:1px 5px;border-radius:8px;font-weight:700;letter-spacing:.3px;line-height:1.4}
.badge-w{background:#e3f0fd;color:#1a6fb8}
.badge-check{background:#e8f7ee;color:#1e8449}

.page-foot{margin:8px -12px -14px;padding:8px 16px;background:var(--navy);color:#fff;text-align:center;font-size:11px;font-weight:600;letter-spacing:.5px;display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap}
.page-foot .fi{display:inline-flex;align-items:center;gap:4px}
.page-foot .fi .lbl{color:var(--gold);font-weight:800}

/* Empty state */
.empty-state{padding:60px 20px;text-align:center;color:var(--muted)}
.empty-state h2{font-size:16px;font-weight:700;margin-bottom:8px;color:var(--text)}
.empty-state .icon{font-size:44px;margin-bottom:8px;opacity:.5}

/* Spinner */
#spinner{display:none;position:fixed;inset:0;background:rgba(13,27,62,.55);align-items:center;justify-content:center;z-index:99999;backdrop-filter:blur(3px)}
#spinner.show{display:flex}
.spinner-box{background:#fff;border-radius:var(--radius-lg);padding:28px 40px;text-align:center;border-top:4px solid var(--gold);min-width:220px}
.spinner-ring{width:44px;height:44px;border:5px solid #dde3f0;border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
#spinnerMsg{font-size:14px;color:var(--text);font-weight:600}

/* Toast */
.toast{position:fixed;bottom:max(24px,env(safe-area-inset-bottom));right:16px;padding:12px 20px;border-radius:var(--radius-md);color:#fff;z-index:9999;animation:slideIn .3s ease;font-weight:500;box-shadow:var(--shadow-lg);max-width:90vw;font-size:13px}
.toast-success{background:var(--success)}
.toast-error{background:var(--danger)}
.toast-warning{background:var(--warning);color:var(--navy)}
.toast-info{background:var(--navy-mid);border-left:3px solid var(--gold)}

/* Back to top */
#backToTop{position:fixed;bottom:max(24px,calc(16px + env(safe-area-inset-bottom)));right:max(16px,calc(12px + env(safe-area-inset-right)));background:var(--gold);color:var(--navy);border:none;border-radius:50%;width:46px;height:46px;display:none;align-items:center;justify-content:center;box-shadow:var(--shadow-gold);z-index:90;font-size:20px;font-weight:700;cursor:pointer}
#backToTop.show{display:flex}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes slideIn{from{transform:translateX(120%);opacity:0}to{transform:translateX(0);opacity:1}}

/* Larger screens — show 3 columns for browsing (not printing) */
@media(min-width:900px){
  .promo-grid{grid-template-columns:1fr 1fr}
}

/* ═══════════════════════════════════════════
   TEMPLATES — swap via .tmpl-* on .pages-wrap
   Default is Classic (already styled above).
   ═══════════════════════════════════════════ */

/* ── PDF Style — เหมือน PDF ตัวอย่างของรัตนไพบูลย์ ── */
.tmpl-pdf .page-head{background:linear-gradient(135deg,#e63946 0%,#a11526 100%);padding:14px 16px 12px}
.tmpl-pdf .page-head h1{font-size:32px;letter-spacing:5px;text-shadow:0 2px 4px rgba(0,0,0,.15)}
.tmpl-pdf .promo-cell{border:2px solid #e63946;background:linear-gradient(180deg,#fff 0%,#fff8f8 100%);padding:8px;box-shadow:0 1px 3px rgba(230,57,70,.15)}
.tmpl-pdf .promo-body{flex-direction:column;gap:6px}
.tmpl-pdf .promo-img{width:100%;min-height:75px;flex:0 0 auto;background:#fff;border:1px solid #ffe6e8;border-radius:6px}
.tmpl-pdf .promo-img img{padding:2px;object-fit:contain}
.tmpl-pdf .promo-title{font-size:13px;text-align:center;-webkit-line-clamp:2}
.tmpl-pdf .promo-buy{background:linear-gradient(135deg,#e63946,#c81d2a);color:#fff;font-size:12px;padding:5px 10px;border-radius:20px;box-shadow:0 2px 4px rgba(230,57,70,.3);align-self:center;min-width:100px}
.tmpl-pdf .promo-buy .n{font-size:18px;font-weight:800}
.tmpl-pdf .promo-gift{background:linear-gradient(135deg,#fff8dc,#ffec99);border:1.5px solid #ffb800;border-radius:8px;padding:5px;font-size:11px;gap:6px}
.tmpl-pdf .promo-gift .gift-info{text-align:center}
.tmpl-pdf .promo-gift .gift-img{width:42px;height:42px;border:1.5px solid #ffb800;background:#fff}
.tmpl-pdf .promo-gift .lbl{font-size:9px;background:#ffb800;color:#fff;padding:1px 8px;border-radius:8px;display:inline-block;margin-bottom:3px}
.tmpl-pdf .promo-gift .gift-name{color:#5a3d00;font-weight:700;font-size:11.5px}
.tmpl-pdf .promo-gift .gift-qty{font-size:15px;color:#e63946}
.tmpl-pdf .page-foot{background:linear-gradient(135deg,#a11526,#e63946)}
.tmpl-pdf .page-foot .fi .lbl{color:#ffec99}
.tmpl-pdf .promo-badges{top:4px;right:4px}
.tmpl-pdf .badge-w{background:rgba(230,57,70,.12);color:#c81d2a}

/* ── Minimal — ขาว·เทา·เรียบง่าย ── */
.tmpl-minimal .page-head{background:#fff;color:var(--navy);border-bottom:3px solid var(--navy);padding:10px 16px}
.tmpl-minimal .page-head h1{color:var(--navy);font-weight:700;letter-spacing:2px;font-size:22px}
.tmpl-minimal .page-head .period{color:var(--muted)}
.tmpl-minimal .page-head .page-num,.tmpl-minimal .page-head .badge-wh{background:var(--navy);color:#fff}
.tmpl-minimal .promo-cell{border:1px solid #e5e7eb;background:#fff;box-shadow:none}
.tmpl-minimal .promo-title{color:var(--navy);font-weight:600}
.tmpl-minimal .promo-buy{background:var(--navy);color:#fff;font-weight:600;border-radius:3px}
.tmpl-minimal .promo-gift{background:#f9fafb;border:1px solid #e5e7eb;color:var(--text)}
.tmpl-minimal .promo-gift .lbl{color:var(--muted);background:transparent}
.tmpl-minimal .promo-gift .gift-name{color:var(--text)}
.tmpl-minimal .promo-gift .gift-qty{color:var(--navy)}
.tmpl-minimal .page-foot{background:#fff;color:var(--navy);border-top:1px solid #e5e7eb}
.tmpl-minimal .page-foot .fi .lbl{color:var(--muted)}

/* ── Landscape — A4 นอน, 4×2 grid ── */
.tmpl-landscape .promo-grid{grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(4,1fr)}
@media(min-width:900px){.tmpl-landscape .promo-grid{grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,1fr)}}

/* PRINT — default A4 portrait */
@page{size:A4 portrait;margin:8mm}
@media print{
  html,body{background:#fff!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;color-adjust:exact}
  header,.filter-bar,.stats,#backToTop,.no-print,.sel-tick,.cat-header{display:none!important}
  .promo-cell{cursor:default!important;box-shadow:none!important}
  .promo-cell:hover{transform:none!important}
  .pages-wrap{max-width:none;margin:0;padding:0}
  .page-a4{width:100%;margin:0;box-shadow:none;border-radius:0;page-break-after:always;page-break-inside:avoid;break-inside:avoid}
  .page-a4:last-child{page-break-after:auto}
  .page-inner{height:281mm;min-height:281mm;max-height:281mm;padding:0;overflow:hidden}
  .page-head{margin:0 0 4mm;border-radius:0;padding:5mm 8mm;flex-shrink:0}
  .page-head h1{font-size:26pt;letter-spacing:4px}
  .promo-grid{gap:3mm;padding:0 4mm;grid-template-rows:repeat(4,1fr)}
  .promo-cell{min-height:0;padding:2.5mm;border-width:1.2pt}
  .promo-title{font-size:11pt;-webkit-line-clamp:2}
  .promo-buy{font-size:10pt;padding:2mm 4mm}
  .promo-buy .n{font-size:13pt}
  .promo-gift{font-size:9pt;padding:2mm}
  .promo-gift .gift-qty{font-size:11pt}
  .promo-detail{font-size:8pt}
  .promo-img{min-height:0}
  .page-foot{margin:4mm 0 0;padding:3mm 8mm;border-radius:0;flex-shrink:0}
  .badge-mini{font-size:7pt}
  /* PDF template — bigger, punchier print */
  .tmpl-pdf .page-head h1{font-size:32pt;letter-spacing:6px}
  .tmpl-pdf .promo-cell{border-width:1.5pt}
  .tmpl-pdf .promo-buy{font-size:11pt}
  .tmpl-pdf .promo-buy .n{font-size:16pt}
  .tmpl-pdf .promo-gift .gift-qty{font-size:14pt}
}
/* Landscape orientation — active when body has tmpl-landscape-print */
@media print{
  body.print-landscape .promo-grid{grid-template-columns:repeat(4,1fr)!important;grid-template-rows:repeat(2,1fr)!important;gap:3mm}
  body.print-landscape .page-inner{height:198mm;min-height:198mm;max-height:198mm}
  body.print-landscape .promo-cell{min-height:0}
  body.print-landscape .promo-title{-webkit-line-clamp:2;font-size:10pt}
  body.print-landscape .promo-img{min-height:0}
  body.print-landscape .promo-buy .n{font-size:12pt}
}
.print-landscape-css{display:none}
</style>
</head>
<body>

<header>
  <div class="logo-text">RATTANA <span class="brand">PROMOTION</span><span class="v">v1.5</span></div>
  <button class="icon-btn" id="btnRefresh" onclick="refreshData()" title="โหลดข้อมูลใหม่">↻ รีเฟรช</button>
  <button class="icon-btn gold" onclick="window.print()" title="พิมพ์/บันทึก PDF">🖨 พิมพ์</button>
</header>

<div class="filter-bar">
  <div class="f-field">
    <label>รูปแบบ</label>
    <select id="fTemplate" class="f-input" onchange="setTemplate(this.value)">
      <option value="classic">Classic · ขาว·แดง</option>
      <option value="pdf">PDF Style · ตามใบเดิม</option>
      <option value="minimal">Minimal · เรียบง่าย</option>
      <option value="landscape">Landscape · A4 นอน</option>
    </select>
  </div>
  <div class="f-field">
    <label>คลัง</label>
    <select id="fWarehouse" class="f-input" onchange="render()">
      <option value="">ทุกคลัง</option>
      <option value="W1">W1 · สมุทรสงคราม</option>
      <option value="W2">W2 · สุพรรณบุรี</option>
      <option value="W3">W3 · ราชบุรี</option>

<script>
'use strict';

/* ══════════════════════════════════════════════════════════════
   CONFIG
   ══════════════════════════════════════════════════════════════ */
const CFG = {
  productsSheetId:  '16mYDqAqqJma-_0vCIAajy6bcjdOZ7F6VagxkdkqAB2I',
  promoSheetId:     '1CqHARklgveAeJ6rTkNeyUSku__puTiNE7-c6ebn93W8',
  promoSheetName:   'Promotion',
  perPage:          8,     // 2×4 grid per printed page
  cacheTTL:         5*60*1000,
  contact:          { phone:'080-3897765', line:'@RPBSALE' },

/* ══════════════════════════════════════════════════════════════
   STATE
   ══════════════════════════════════════════════════════════════ */
let state = {
  products: [],
  productByName: new Map(),
  productByCatSize: new Map(),
  productByCatBrand: new Map(),
  productByBarcode: new Map(),
  promotions: [],
  template: 'classic',

};
let renderTimer = null;

/* ══════════════════════════════════════════════════════════════
   SELECTION
   ══════════════════════════════════════════════════════════════ */
function toggleSelect(idx){
  if(state.deselected.has(idx)) state.deselected.delete(idx);
  else state.deselected.add(idx);
  render();
}
function toggleSelectMany(idxs){
  const allDeselected = idxs.every(i => state.deselected.has(i));
  if(allDeselected) idxs.forEach(i => state.deselected.delete(i));
  else idxs.forEach(i => state.deselected.add(i));
  render();
}
function selectAll(){ state.deselected.clear(); render(); showToast('เลือกทั้งหมดแล้ว','success'); }
function deselectAll(){
  const shown = filterPromos();
  shown.forEach(p => state.deselected.add(p._idx));
  render();
  showToast('ล้างการเลือกแล้ว','info');
}
function invertSelection(){
  const shown = filterPromos();
  const newSet = new Set();
  shown.forEach(p => { if(!state.deselected.has(p._idx)) newSet.add(p._idx); });
  state.deselected = newSet;
  render();
}

/* ══════════════════════════════════════════════════════════════
   TEMPLATES
   ══════════════════════════════════════════════════════════════ */
const TEMPLATES = ['classic','pdf','minimal','landscape'];
function setTemplate(name){
  if(!TEMPLATES.includes(name)) name = 'classic';
  state.template = name;
  try{ localStorage.setItem('rp_template', name); } catch{}
  const wrap = $('#pagesWrap');
  TEMPLATES.forEach(t => wrap.classList.remove('tmpl-'+t));
  wrap.classList.add('tmpl-'+name);
  document.body.classList.toggle('print-landscape', name === 'landscape');
  const styleEl = $('#printOrientation');
  if(styleEl){
    styleEl.textContent = name === 'landscape'
      ? '@page{size:A4 landscape;margin:6mm}'
      : '@page{size:A4 portrait;margin:8mm}';
  }
  const sel = $('#fTemplate');
  if(sel && sel.value !== name) sel.value = name;
}

/* ══════════════════════════════════════════════════════════════
   HELPERS
   ══════════════════════════════════════════════════════════════ */
const $ = sel => document.querySelector(sel);
const show = el => el && (el.style.display = '');
const hide = el => el && (el.style.display = 'none');
function showSpinner(msg='กำลังโหลด...'){ $('#spinnerMsg').textContent=msg; $('#spinner').classList.add('show'); }
function hideSpinner(){ $('#spinner').classList.remove('show'); }
function showToast(msg,type='info'){
  const t=document.createElement('div'); t.className=`toast toast-${type}`; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(),3500);
}
function renderDebounced(){ clearTimeout(renderTimer); renderTimer = setTimeout(render, 200); }

// RFC-4180 CSV parser — handles quoted cells with newlines
function parseCsv(text){
  if(!text) return [];
  if(text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  const rows=[]; let row=[], cell='', q=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){
      if(ch==='"'){ if(text[i+1]==='"'){cell+='"'; i++;} else q=false; }
      else cell+=ch;
    } else {
      if(ch==='"') q=true;
      else if(ch===','){ row.push(cell); cell=''; }
      else if(ch==='\r'){}
      else if(ch==='\n'){ row.push(cell); rows.push(row); row=[]; cell=''; }
      else cell+=ch;
    }
  }
  if(cell.length||row.length){ row.push(cell); rows.push(row); }
  return rows;
}
const clean = s => String(s??'').replace(/[​‌‍﻿]/g,'').replace(/ /g,' ').trim();

function csvToObjects(text){
  const rows = parseCsv(text);
  if(rows.length < 2) return [];
  const headers = rows[0].map(clean);
  return rows.slice(1)
    .filter(r => r.some(c => clean(c)))
    .map(r => Object.fromEntries(headers.map((k,i)=>[k, clean(r[i])])));
}

async function fetchSheet(sheetId, sheetName){
  const p = new URLSearchParams({ tqx:'out:csv', headers:'0' });
  if(sheetName) p.set('sheet', sheetName);
  const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?${p.toString()}`;
  const res = await fetch(url);
  if(!res.ok) throw new Error(`fetch failed: ${res.status}`);
  return csvToObjects(await res.text());
}

// Cache
function getCached(key){
  try{
    const raw = localStorage.getItem(key);
    if(!raw) return null;
    const {ts, data} = JSON.parse(raw);
    if(Date.now() - ts > CFG.cacheTTL) return null;
    return data;
  } catch { return null; }
}
function setCached(key, data){
  try{ localStorage.setItem(key, JSON.stringify({ts:Date.now(), data})); }
  catch(e){ /* quota — ignore */ }
}

// Drive image URL → embeddable thumbnail URL
function driveImg(url){
  if(!url) return '';
  const m = String(url).match(/[?&]id=([a-zA-Z0-9_-]+)/) || String(url).match(/\/d\/([a-zA-Z0-9_-]+)/);
  if(!m) return url;
  return `https://drive.google.com/thumbnail?id=${m[1]}&sz=w300`;
}

// Convert Thai/Buddhist year format if needed
function formatBuddhistDate(d){
  if(!(d instanceof Date) || isNaN(d)) return '-';
  const dd = String(d.getDate()).padStart(2,'0');
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const yyyy = d.getFullYear() + 543;
  return `${dd}/${mm}/${yyyy}`;
}
function parsePeriod(s){
  // Accept 2027/07/27, 2027-07-27, 27/07/2027, 27/07/2570
  s = clean(s);
  if(!s) return null;
  // YYYY/MM/DD or YYYY-MM-DD
  let m = s.match(/^(\d{4})[/-](\d{1,2})[/-](\d{1,2})$/);
  if(m){
    let y = +m[1]; if(y >= 2500) y -= 543;
    return new Date(y, +m[2]-1, +m[3]);
  }
  m = s.match(/^(\d{1,2})[/-](\d{1,2})[/-](\d{4})$/);
  if(m){
    let y = +m[3]; if(y >= 2500) y -= 543;
    return new Date(y, +m[2]-1, +m[1]);
  }
  const d = new Date(s);
  return isNaN(d) ? null : d;
}

/* ══════════════════════════════════════════════════════════════
   DATA LOADING
   ══════════════════════════════════════════════════════════════ */
async function loadAll(useCache=true){
  showSpinner('กำลังโหลดข้อมูล...');
  try{
    let products = useCache && getCached('rp_products');
    let promos   = useCache && getCached('rp_promos');

    const jobs = [];
    if(!products) jobs.push(fetchSheet(CFG.productsSheetId).then(d => products = d));
    if(!promos)   jobs.push(fetchSheet(CFG.promoSheetId, CFG.promoSheetName).then(d => promos = d));
    await Promise.all(jobs);

    if(products) setCached('rp_products', products);
    if(promos)   setCached('rp_promos',   promos);

    state.products = products || [];
    state.promotions = (promos || []).map((p,i) => (p._idx = i, p));
    state.deselected.clear();

    buildIndexes();
    updateStats();
    render();
    showToast(`โหลดสำเร็จ · ${state.promotions.length} โปร · ${state.products.length} สินค้า`, 'success');
  } catch(err){
    console.error(err);
    showToast('โหลดข้อมูลไม่สำเร็จ: ' + err.message, 'error');
  } finally {
    hideSpinner();
  }
}

function buildIndexes(){
  const byName = new Map(), byCatSize = new Map(), byCatBrand = new Map(), byBarcode = new Map();
  const barcodeCols = ['CODE EA','CODE PA','CODE BP','CODE CS'];
  for(const p of state.products){
    const name = clean(p['PRODUCT NAME']);
    const catSize = clean(p['CAT SIZE']);
    const catBrand = clean(p['CAT BRAND']);
    if(name && !byName.has(name)) byName.set(name, p);
    if(catSize && !byCatSize.has(catSize)) byCatSize.set(catSize, p);
    if(catBrand && !byCatBrand.has(catBrand)) byCatBrand.set(catBrand, p);
    for(const c of barcodeCols){
      const bc = clean(p[c]);
      if(bc && !byBarcode.has(bc)) byBarcode.set(bc, p);
    }
  }
  state.productByName = byName;
  state.productByCatSize = byCatSize;
  state.productByCatBrand = byCatBrand;
  state.productByBarcode = byBarcode;
}

function findGiftProduct(promo){
  const bc = clean(promo['Barcode สินค้าแถมEA']);
  if(bc && state.productByBarcode.has(bc)) return state.productByBarcode.get(bc);
  const name = clean(promo['แถมสินค้า']);
  if(name){
    if(state.productByName.has(name)) return state.productByName.get(name);
    // fuzzy: startsWith
    for(const [k, v] of state.productByName){
      if(k.startsWith(name) || name.startsWith(k)) return v;
    }
  }
  return null;
}

function findProduct(promo){
  const method = clean(promo['วิธีวัด']).toUpperCase();
  const key = clean(promo['ชื่อ']);
  if(!key) return null;
  if(method === 'PRODUCT NAME') return state.productByName.get(key) || null;
  if(method === 'CAT SIZE')     return state.productByCatSize.get(key) || null;
  if(method === 'CAT BRAND')    return state.productByCatBrand.get(key) || null;
  // fallback: try all
  return state.productByName.get(key) || state.productByCatSize.get(key) || state.productByCatBrand.get(key) || null;
}

function findProductImage(product){
  if(!product) return '';
  // Column labelled SKU_USAGE (col 100) but actually holds Drive URLs in this sheet
  // Also scan other candidate columns just in case
  const candidates = ['SKU_USAGE','DESCRIPTION','IMAGE','IMG','รูปภาพ','GOODS_WEIGHT'];
  for(const c of candidates){
    const v = product[c];
    if(v && /drive\.google\.com/.test(v)) return driveImg(v);
  }
  // Scan any column for a Drive URL
  for(const [,v] of Object.entries(product)){
    if(v && /drive\.google\.com/.test(v)) return driveImg(v);
  }
  return '';
}

/* ══════════════════════════════════════════════════════════════
   FILTERING
   ══════════════════════════════════════════════════════════════ */
function getFilters(){
  return {
    warehouse: $('#fWarehouse').value,
    search:    clean($('#fSearch').value).toLowerCase(),
    checked:   $('#fChecked').checked,
    active:    $('#fActive').checked,
  };
}
function isActive(promo){
  const end = parsePeriod(promo['Period']);
  if(!end) return true; // no date → assume active
  const today = new Date(); today.setHours(0,0,0,0);
  return end >= today;
}
function matchesWarehouse(promo, wh){
  if(!wh) return true;
  const list = clean(promo['Warehouses']).toUpperCase().split(/[\s,;/]+/).filter(Boolean);
  return list.length === 0 || list.includes(wh.toUpperCase());
}
function filterPromos(){
  const f = getFilters();
  return state.promotions.filter(p => {
    if(!clean(p['ชื่อโปร'])) return false;
    if(f.checked && clean(p['เช็คแล้ว']).toLowerCase() !== 'เช็คแล้ว') return false;
    if(f.active && !isActive(p)) return false;
    if(!matchesWarehouse(p, f.warehouse)) return false;
    if(f.search){
      const hay = [p['ชื่อโปร'],p['ชื่อ'],p['แถมสินค้า'],p['รายละเอียดโปร']].map(x=>clean(x).toLowerCase()).join(' ');
      if(!hay.includes(f.search)) return false;
    }
    return true;
  });
}

/* ══════════════════════════════════════════════════════════════
   RENDER

function updateStats(){

function escapeHtml(s){
  return String(s??'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function extractGift(promo){
  const name = clean(promo['แถมสินค้า']);
  const qty  = clean(promo['จำนวนแถมEA']);
  const disc = clean(promo['ลดราคา']);
  const parts = [];
  if(name) parts.push({name, qty, img: findProductImage(findGiftProduct(promo))});
  if(disc && !name) parts.push({name:`ลด ${disc} บาท`, qty:'', img:''});
  return parts;
}

const UNIT_LABEL = {CS:'ลัง', PA:'แพ็ค', BP:'แถว', EA:'ชิ้น'};

function promoCellHTML(entry){
  // entry = { promo, tiers:[promo, promo, ...] }
  const {promo, tiers} = entry;
  const product = findProduct(promo);
  const giftProduct = findGiftProduct(promo);
  const idxs = tiers.map(t => t._idx);
  const primaryIdx = idxs[0];
  const allDeselected = idxs.every(i => state.deselected.has(i));
  const isDeselected = allDeselected;

  const title = clean(promo['ชื่อโปร']);
  const price = clean(promo['ราคาขายกำหนด']);
  const detail = clean(promo['รายละเอียดโปร']);
  const note = clean(promo['หมายเหตุ']);
  const checked = clean(promo['เช็คแล้ว']).toLowerCase() === 'เช็คแล้ว';
  const warehouses = clean(promo['Warehouses']).split(/[\s,;/]+/).filter(Boolean);
  const img = findProductImage(product);
  const shortName = product ? (clean(product['SHORT NAME']) || clean(product['PRODUCT NAME'])) : clean(promo['ชื่อ']);
  const giftName = clean(promo['แถมสินค้า']);
  const giftImg = findProductImage(giftProduct);

  const badgesHtml = [
    ...warehouses.map(w => `<span class="badge-mini badge-w">${escapeHtml(w)}</span>`),
    checked ? `<span class="badge-mini badge-check">✓</span>` : '',
    tiers.length > 1 ? `<span class="badge-mini badge-tier">${tiers.length} แบบ</span>` : '',
  ].join('');

  const priceLine = price ? ` (${escapeHtml(price)}฿)` : '';

  // Build tier rows
  const tiersHtml = tiers.map(t => {
    const bq = clean(t['จำนวน']) || '1';
    const bu = clean(t['รูปแบบขาย']).toUpperCase();
    const buLabel = UNIT_LABEL[bu] || bu || 'หน่วย';
    const gq = clean(t['จำนวนแถมEA']);
    const disc = clean(t['ลดราคา']);
    const giftText = gq ? `<span class="tg-n">${escapeHtml(gq)}</span> ชิ้น` : (disc ? `ลด ${escapeHtml(disc)}฿` : 'ฟรี');
    return `
      <div class="tier-row">
        <div class="tier-buy">ซื้อ <b>${escapeHtml(bq)}</b> ${escapeHtml(buLabel)}</div>
        <div class="tier-arrow">→</div>
        <div class="tier-gift">แถม ${giftText}</div>
      </div>`;
  }).join('');

  const giftPreview = giftName
    ? `<div class="promo-gift">
        ${giftImg ? `<div class="gift-img"><img src="${escapeHtml(giftImg)}" alt="" loading="lazy" onerror="this.parentElement.classList.add('no-img');this.remove()"></div>` : ''}
        <div class="gift-info">
          <div class="lbl">ของแถม</div>
          <div class="gift-name">${escapeHtml(giftName)}</div>
        </div>
      </div>`
    : (detail ? `<div class="promo-gift"><div class="gift-info"><div class="gift-name">${escapeHtml(detail)}</div></div></div>` : '');

  const imgHtml = img
    ? `<div class="promo-img"><img src="${escapeHtml(img)}" alt="" loading="lazy" onerror="this.parentElement.classList.add('no-img');this.parentElement.textContent='ไม่มีรูป'"></div>`
    : `<div class="promo-img no-img">ไม่มีรูป</div>`;

  const idxsAttr = idxs.join(',');
  return `
    <div class="promo-cell${isDeselected ? ' deselected' : ''}${tiers.length > 1 ? ' merged' : ''}" data-idx="${primaryIdx}" data-idxs="${idxsAttr}" onclick="toggleSelectMany([${idxsAttr}])">
      <div class="sel-tick" title="${isDeselected ? 'คลิกเพื่อเอากลับ' : 'คลิกเพื่อตัดออก'}"></div>
      ${badgesHtml ? `<div class="promo-badges">${badgesHtml}</div>` : ''}
      <div class="promo-body">
        ${imgHtml}
        <div class="promo-info">
          <div class="promo-title">${escapeHtml(shortName)}${priceLine}</div>
          <div class="tier-list">${tiersHtml}</div>
          ${giftPreview}
          ${note ? `<div class="promo-detail">${escapeHtml(note)}</div>` : ''}
        </div>
      </div>
    </div>`;
}

/* ══════════════════════════════════════════════════════════════
   GROUPING BY CATEGORY
   ══════════════════════════════════════════════════════════════ */
function catOf(promo){
  const p = findProduct(promo);
  if(p){
    return clean(p['CAT BRAND']) || clean(p['CAT GROUP']) || clean(p['CAT SIZE']) || 'อื่น ๆ';
  }
  // fallback: match value or first word of promo title
  return clean(promo['ชื่อ']) || clean(promo['ชื่อโปร']).split(/\s+/)[0] || 'อื่น ๆ';
}
function groupByCat(list){
  // Stable sort by cat, preserving original order within each group
  const withCat = list.map((p, origIdx) => ({p, origIdx, cat: catOf(p)}));
  withCat.sort((a,b) => {
    const c = a.cat.localeCompare(b.cat, 'th');
    return c !== 0 ? c : a.origIdx - b.origIdx;
  });
  return withCat.map(x => x.p);
}

// Merge promos that share the same product + same gift (different quantities)
function mergePromos(list){
  const byKey = new Map();
  const merged = [];
  for(const promo of list){
    const prod = findProduct(promo);
    const gift = findGiftProduct(promo);
    const productKey = clean(prod?.['PRODUCT NAME']) || clean(promo['ชื่อ']) || '';
    const giftKey = clean(gift?.['PRODUCT NAME']) || clean(promo['Barcode สินค้าแถมEA']) || clean(promo['แถมสินค้า']) || '';
    if(!productKey || !giftKey){
      merged.push({promo, tiers:[promo], productKey, giftKey});
      continue;
    }
    const key = productKey + '||' + giftKey;
    if(byKey.has(key)){
      merged[byKey.get(key)].tiers.push(promo);
    } else {
      byKey.set(key, merged.length);
      merged.push({promo, tiers:[promo], productKey, giftKey});
    }
  }
  return merged;
}

function emptyCellHTML(){
  return `<div class="promo-cell empty"></div>`;
}

function currentPeriodText(list){
  // Find earliest period date among filtered list
  const dates = list.map(p => parsePeriod(p['Period'])).filter(Boolean);
  if(!dates.length) return '';
  const latest = new Date(Math.max(...dates.map(d => d.getTime())));
  return `ถึง ${formatBuddhistDate(latest)}`;
}

function render(){
  const filtered = filterPromos();
  const selectedOnly = filtered.filter(p => !state.deselected.has(p._idx));
  $('#stShown').textContent = filtered.length.toLocaleString('th-TH');
  $('#stSelected').textContent = selectedOnly.length.toLocaleString('th-TH');

  const wrap = $('#pagesWrap');
  if(!filtered.length){
    wrap.innerHTML = `
      <div class="empty-state">
        <div class="icon">📦</div>
        <h2>ไม่พบโปรโมชัน</h2>
        <div>ลองปรับตัวกรองด้านบน</div>
      </div>`;
    $('#stPages').textContent = 0;
    return;
  }

  // Sort by cat, then merge same product+gift into tiered entries
  const grouped = groupByCat(filtered);
  const mergedAll = mergePromos(grouped);
  // Split merged into selected vs deselected for browse layout
  const selectedEntries = mergedAll.filter(e => !e.tiers.every(t => state.deselected.has(t._idx)));
  const deselectedEntries = mergedAll.filter(e =>  e.tiers.every(t => state.deselected.has(t._idx)));

  const printPages = Math.max(1, Math.ceil(selectedEntries.length / CFG.perPage));
  $('#stPages').textContent = selectedEntries.length ? printPages : 0;

  const wh = $('#fWarehouse').value;
  const whBadge = wh ? `<span class="badge-wh">${wh}</span>` : '';
  const periodText = currentPeriodText(filtered);

  const pagesHtml = [];
  for(let pageIdx = 0; pageIdx < printPages; pageIdx++){
    const start = pageIdx * CFG.perPage;
    const chunk = selectedEntries.slice(start, start + CFG.perPage);
    const cellsHtml = [];
    for(let i = 0; i < CFG.perPage; i++){
      const entry = chunk[i];
      if(entry) cellsHtml.push(promoCellHTML(entry));
      else       cellsHtml.push(emptyCellHTML());
    }
    pagesHtml.push(`
      <div class="page-a4">
        <div class="page-inner">
          <div class="page-head">
            ${whBadge}
            <span class="page-num">${pageIdx+1}/${printPages}</span>
            <h1>PROMOTION</h1>
            ${periodText ? `<div class="period">${escapeHtml(periodText)}</div>` : ''}
          </div>
          <div class="promo-grid">${cellsHtml.join('')}</div>
          <div class="page-foot">
            <span class="fi"><span class="lbl">โทร</span> ${CFG.contact.phone}</span>
            <span class="fi"><span class="lbl">LINE</span> ${CFG.contact.line}</span>
          </div>
        </div>
      </div>
    `);
  }

  let deselectedHtml = '';
  if(deselectedEntries.length){
    const cells = deselectedEntries.map(e => promoCellHTML(e)).join('');
    const totalPromos = deselectedEntries.reduce((s,e) => s + e.tiers.length, 0);
    deselectedHtml = `
      <div class="no-print" style="max-width:1400px;margin:20px auto 0;padding:0 12px 20px">
        <div style="background:#fff3cd;border:1px solid #ffc107;color:#8a5a00;padding:10px 14px;border-radius:8px;font-weight:600;font-size:13px;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
          <span>ตัดออก ${totalPromos} รายการ (ไม่พิมพ์)</span>
          <button class="icon-btn" style="background:#fff;color:#8a5a00;border:1px solid #ffc107;height:32px;font-size:12px" onclick="selectAll()">เอากลับทั้งหมด</button>
        </div>
        <div class="deselected-grid">${cells}</div>
      </div>`;
  }

  wrap.innerHTML = pagesHtml.join('') + deselectedHtml;
}

/* ══════════════════════════════════════════════════════════════
   REFRESH
   ══════════════════════════════════════════════════════════════ */
async function refreshData(){
  const b = $('#btnRefresh');
  b.disabled = true; b.style.transform='rotate(360deg)'; b.style.transition='transform .6s';
  try {
    // Bypass cache
    localStorage.removeItem('rp_products');
    localStorage.removeItem('rp_promos');
    await loadAll(false);
  } finally {
    b.disabled = false;
    setTimeout(()=>{ b.style.transform=''; b.style.transition=''; }, 600);
  }
}

/* ══════════════════════════════════════════════════════════════
   BOOT
   ══════════════════════════════════════════════════════════════ */
window.addEventListener('scroll', ()=>{
  $('#backToTop').classList.toggle('show', window.scrollY > 300);
});
document.addEventListener('DOMContentLoaded', ()=>{
  const savedTmpl = (()=>{ try{ return localStorage.getItem('rp_template'); } catch{ return null; } })();
  setTemplate(savedTmpl || 'classic');
  loadAll(true);
});
</script>
</body>
