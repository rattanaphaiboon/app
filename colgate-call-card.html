<style id="rk-base">
:root{
  --rk-z-sticky-sub: 90; --rk-z-sticky: 100; --rk-z-dropdown: 1000; --rk-z-modal: 2000; --rk-z-toast: 3000;
  --rk-navy:#0d1b3e; --rk-gold:#c9a84c;
  --rk-surface: var(--card-bg,#ffffff); --rk-surface-2: var(--bg,#f1f5f9);
  --rk-text: var(--text,#0f172a); --rk-muted: var(--muted,#64748b); --rk-line: var(--border,#e2e8f0);
  --rk-radius:12px; --rk-hdr-h:56px;
}
.rk-1line{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rk-row{display:flex;align-items:center;gap:8px;min-width:0}
.rk-row>*{min-width:0}
.rk-grow{flex:1 1 auto;min-width:0}
.rk-nogrow{flex:0 0 auto}
.rk-scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.rk-sticky{position:sticky;top:0;z-index:var(--rk-z-sticky);background:var(--rk-surface);padding-top:env(safe-area-inset-top);box-shadow:0 1px 0 var(--rk-line)}
.rk-sticky-sub{position:sticky;top:var(--rk-hdr-h);z-index:var(--rk-z-sticky-sub);background:var(--rk-surface-2);box-shadow:0 1px 0 var(--rk-line)}
.rk-sticky-bottom{position:sticky;bottom:0;z-index:var(--rk-z-sticky-sub);background:var(--rk-surface);padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -1px 0 var(--rk-line)}
</style>
<script id="rk-base-js">
window.RK = window.RK || {};
RK.esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
RK.num = v => { const n = parseFloat(String(v==null?'':v).replace(/,/g,'')); return isFinite(n) ? n : 0; };
RK.debounce = (fn, ms=120) => { let t; return function(){ clearTimeout(t); const a=arguments, s=this; t=setTimeout(()=>fn.apply(s,a), ms); }; };
RK.shortNum = n => { n = RK.num(n); const a = Math.abs(n);
  if (a >= 1e9) return (n/1e9).toFixed(a>=1e10?0:1).replace(/\.0$/,'') + 'B';
  if (a >= 1e6) return (n/1e6).toFixed(a>=1e7?0:1).replace(/\.0$/,'') + 'M';
  if (a >= 1e4) return (n/1e3).toFixed(0) + 'K';
  return n.toLocaleString('th-TH', {maximumFractionDigits:0}); };
RK.audit = function(opts){
  opts = opts || {};
  const oneLineSel = opts.oneLineSel || 'button,label,option,.chip,.tab,.badge,.pill,th,.rk-1line,[data-1line]';
  const out = {transparentSticky:[], clipRisk:[], wrapped:[], zTop:[]};
  const own = el => el.closest('#rkScan,.rk-dd,.rk-dd-backdrop,.sheet-backdrop');
  const alpha0 = c => { if (!c || c === 'transparent') return true;
    const m = /rgba?\(([^)]+)\)/.exec(c); if (!m) return false;
    const p = m[1].split(','); return p.length > 3 && parseFloat(p[3]) < 0.9; };
  const lineCount = el => { const rng = document.createRange(); let n = 0;
    el.childNodes.forEach(nd => { if (nd.nodeType === 3 && nd.textContent.trim()){ rng.selectNodeContents(nd); n = Math.max(n, rng.getClientRects().length); } });
    return n; };
  document.querySelectorAll('*').forEach(el=>{ if (own(el)) return;
    const cs = getComputedStyle(el);
    if (cs.position==='sticky' || cs.position==='fixed'){
      if (alpha0(cs.backgroundColor) && !(cs.backdropFilter||'').includes('blur')) out.transparentSticky.push({el, bg:cs.backgroundColor, z:cs.zIndex});
      if (cs.position==='sticky' && cs.zIndex!=='auto' && +cs.zIndex >= 1000) out.zTop.push({el, z:cs.zIndex});
    } });
  document.querySelectorAll('[data-rk-menu-anchor],.rk-dd-btn,select').forEach(el=>{ if (own(el)) return;
    let p = el.parentElement;
    while (p && p!==document.body){ const cs = getComputedStyle(p);
      if (/hidden|auto|scroll/.test(cs.overflow + cs.overflowX + cs.overflowY) && cs.position!=='static'){ out.clipRisk.push({trigger:el, clippedBy:p}); break; }
      p = p.parentElement; } });
  document.querySelectorAll(oneLineSel).forEach(el=>{ if (own(el) || !el.offsetParent || !el.textContent.trim()) return;
    const n = lineCount(el); if (n > 1) out.wrapped.push({el, lines:n, text:el.textContent.trim().slice(0,40)}); });
  console.group('%cRK.audit @ ' + window.innerWidth + 'px', 'font-weight:700');
  console.log('sticky พื้นใส:', out.transparentSticky.length, out.transparentSticky);
  console.log('dropdown เสี่ยงโดนตัด/ทับ:', out.clipRisk.length, out.clipRisk);
  console.log('sticky z-index >=1000:', out.zTop.length, out.zTop);
  console.log('ตกบรรทัด (>1 บรรทัด):', out.wrapped.length, out.wrapped);
  console.groupEnd(); return out;
};
</script>

<style>
/* ══ ธีมแอป ══ */
:root{
  --bg:#f1f5f9; --card-bg:#fff; --text:#0f172a; --muted:#64748b; --border:#e2e8f0;
  --navy:#0d1b3e; --gold:#c9a84c; --red:#DA291C; --green:#15803d; --amber:#b45309; --blue:#0369a1;
  --hdr-h:56px; --rk-hdr-h:56px;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0b1220; --card-bg:#111a2e; --text:#e8eefc; --muted:#93a4c3; --border:#22304d; }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans Thai","Sarabun",Roboto,sans-serif;
  font-size:15px; line-height:1.4; -webkit-text-size-adjust:100%;
}
button{font:inherit;color:inherit}
.screen{display:none;min-height:100dvh;flex-direction:column}
.screen.on{display:flex}
.pad{padding:12px}
.muted{color:var(--muted)}
.tiny{font-size:12px}
.sm{font-size:13px}

/* ══ header ══ */
.hdr{background:var(--navy);color:#fff;box-shadow:0 1px 0 rgba(0,0,0,.25)}
.hdr .bar{height:var(--hdr-h);display:flex;align-items:center;gap:8px;padding:0 10px;min-width:0}
.hdr .ttl{font-weight:700;font-size:16px}
.hdr .sub{font-size:11.5px;color:#c7d2e8}
.iconbtn{flex:0 0 auto;width:38px;height:38px;border:0;border-radius:11px;background:rgba(255,255,255,.12);color:#fff;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.iconbtn:active{background:rgba(255,255,255,.24)}
.hubbtn{flex:0 0 auto;display:flex;align-items:center;gap:5px;height:34px;padding:0 10px;border:1px solid rgba(201,168,76,.5);border-radius:10px;background:rgba(201,168,76,.14);color:var(--gold);font-size:13px;font-weight:600;text-decoration:none;white-space:nowrap}

/* ══ การ์ดทั่วไป ══ */
.card{background:var(--card-bg);border:1px solid var(--border);border-radius:14px;padding:12px;margin-bottom:10px}
.big-pick{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card-bg);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:10px;cursor:pointer}
.big-pick:active{border-color:var(--gold)}
.avatar{flex:0 0 auto;width:44px;height:44px;border-radius:12px;background:var(--navy);color:var(--gold);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px}
.chev{flex:0 0 auto;color:var(--muted);font-size:18px}

/* ══ ช่องค้นหา (RK 4️⃣) ══ */
.rk-searchwrap{padding:8px 12px;display:flex;flex-direction:column;gap:6px}
.rk-search{display:flex;align-items:center;gap:6px;min-width:0;border:1px solid var(--border);border-radius:12px;background:var(--card-bg);padding:0 4px 0 10px}
.rk-search:focus-within{border-color:var(--gold)}
.rk-search input{flex:1 1 auto;min-width:0;border:0;background:transparent;color:var(--text);font:inherit;font-size:16px;padding:11px 2px;outline:none}
.rk-search input::-webkit-search-cancel-button{display:none}
.rk-search-x{flex:0 0 auto;width:36px;height:36px;border:0;border-radius:10px;background:transparent;color:var(--muted);font-size:16px;cursor:pointer;display:none}
.rk-search.has .rk-search-x{display:block}
.scanbtn{flex:0 0 auto;height:36px;padding:0 12px;border:0;border-radius:10px;background:var(--navy);color:#fff;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px}
.rk-chips{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.rk-chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:flex;align-items:center;gap:5px;border:1px solid var(--border);border-radius:999px;background:var(--card-bg);color:var(--text);padding:6px 11px;font-size:13px;white-space:nowrap;cursor:pointer}
.chip .n{font-size:11px;color:var(--muted)}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.chip.on .n{color:#c7d2e8}
/* header มี padding-top ตาม safe-area → sticky ชั้น 2 ต้องบวกตามด้วย ไม่งั้นมุดใต้ header บน iPhone */
.rk-sticky-sub{top:calc(var(--rk-hdr-h) + env(safe-area-inset-top))}

/* ══ การ์ดสินค้า ══ */
.grp{display:flex;align-items:center;gap:8px;min-width:0;padding:12px 12px 5px;font-size:12.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.grp .ln{flex:1 1 auto;height:1px;background:var(--border)}
.plist{padding:0 12px 4px}
.pcard{background:var(--card-bg);border:1px solid var(--border);border-radius:13px;padding:10px;margin-bottom:8px}
.pcard.done{border-color:rgba(21,128,61,.45)}
.pcard.need{border-color:rgba(218,41,28,.45)}
.pname{font-weight:600;font-size:14.5px}
.pmeta{font-size:12px;color:var(--muted);margin-top:2px}
.badge{flex:0 0 auto;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:999px;white-space:nowrap}
.b-hot{background:rgba(218,41,28,.12);color:var(--red)}
.b-new{background:rgba(3,105,161,.12);color:var(--blue)}
.b-gap{background:rgba(180,83,9,.14);color:var(--amber)}
.b-ok{background:rgba(21,128,61,.13);color:var(--green)}

.ctl{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}
.ctl .lab{font-size:11px;color:var(--muted);margin-bottom:3px;display:flex;align-items:center;gap:4px;min-width:0}
.step{display:flex;align-items:center;border:1px solid var(--border);border-radius:11px;overflow:hidden;background:var(--bg)}
.step button{flex:0 0 auto;width:36px;height:38px;border:0;background:transparent;color:var(--text);font-size:19px;line-height:1;cursor:pointer}
.step button:active{background:var(--border)}
.step input{flex:1 1 auto;min-width:0;width:100%;border:0;background:transparent;color:var(--text);font:inherit;font-size:16px;font-weight:700;text-align:center;padding:0;outline:none;-moz-appearance:textfield}
.step input::-webkit-outer-spin-button,.step input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.step.filled{border-color:var(--gold);background:var(--card-bg)}
.step.sug{border-color:rgba(218,41,28,.5)}
.step.sug input{color:var(--red)}
.ctl .hint{font-size:10.5px;color:var(--muted);margin-top:3px;height:14px}
.linkbtn{border:0;background:transparent;color:var(--gold);font-size:11.5px;font-weight:700;padding:2px 0;cursor:pointer}

/* ══ รายละเอียดที่กางออก ══ */
.detail{margin-top:9px;padding-top:9px;border-top:1px dashed var(--border);display:none}
.detail.on{display:block}
.spark{display:flex;align-items:flex-end;gap:4px;height:52px;margin:4px 0 2px}
.spark .b{flex:1 1 0;min-width:0;background:var(--border);border-radius:3px 3px 0 0;position:relative}
.spark .b.v{background:var(--navy)}
.spark .b.last{background:var(--gold)}
.sparkx{display:flex;gap:4px;font-size:9.5px;color:var(--muted)}
.sparkx span{flex:1 1 0;min-width:0;text-align:center}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:12px;margin-top:7px}
.kv .k{color:var(--muted);white-space:nowrap}
.kv .v{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}

/* ══ แถบล่าง ══ */
.botbar{padding:9px 12px}
.btn{width:100%;border:0;border-radius:13px;padding:14px;font-size:15.5px;font-weight:700;cursor:pointer}
.btn-primary{background:var(--gold);color:#0d1b3e}
.btn-primary:disabled{opacity:.45;cursor:not-allowed}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text)}
.sum{display:flex;gap:10px;font-size:12.5px;color:var(--muted);margin-bottom:8px;min-width:0}
.sum b{color:var(--text);font-variant-numeric:tabular-nums}
.savestate{font-size:11.5px;color:var(--muted);margin-bottom:8px;gap:6px}
.savestate .dot{flex:0 0 auto;width:7px;height:7px;border-radius:50%;background:var(--border)}
.savestate .dot.ok{background:var(--green)}
.savestate .dot.warn{background:var(--amber)}
.savestate .dot.bad{background:var(--red)}
.banner{background:var(--card-bg);border:1px solid rgba(180,83,9,.45);border-left:3px solid var(--amber);
  border-radius:12px;padding:10px 12px;margin-bottom:10px}
.banner>.rk-row{margin-bottom:2px}
.rowline.slim{padding:7px 0;border-bottom:0;background:transparent;font-size:13px}
.rowline.slim+.rowline.slim{border-top:1px solid var(--border)}

/* ══ toast ══ */
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 84px);transform:translateX(-50%) translateY(14px);
  z-index:var(--rk-z-toast);background:var(--navy);color:#fff;border-radius:11px;padding:11px 15px;font-size:13.5px;font-weight:600;
  max-width:88vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;pointer-events:none;transition:opacity .16s,transform .16s;box-shadow:0 8px 24px rgba(0,0,0,.3)}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.bad{background:var(--red)}
#toast.good{background:var(--green)}

.empty{padding:40px 20px;text-align:center;color:var(--muted);font-size:14px}
.rowline{display:flex;align-items:center;gap:8px;min-width:0;padding:11px 12px;border-bottom:1px solid var(--border);background:var(--card-bg);cursor:pointer}
.rowline:active{background:var(--bg)}
table.prev{width:100%;border-collapse:collapse;font-size:12px}
table.prev th,table.prev td{border-bottom:1px solid var(--border);padding:7px 6px;text-align:left;white-space:nowrap}
table.prev th{color:var(--muted);font-weight:600;font-size:11px}
table.prev td.n{text-align:right;font-variant-numeric:tabular-nums}
.wrapx{overflow-x:auto;-webkit-overflow-scrolling:touch}
pre.json{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:10px;font-size:11px;overflow-x:auto;margin:0}

/* ══ แผงกรอก + ส่งทีละรายการ (portal ที่ body · position:fixed → sticky ทับไม่ได้) ══ */
.sheet-backdrop{position:fixed;inset:0;z-index:calc(var(--rk-z-modal) - 1);background:rgba(15,23,42,.45);opacity:0;transition:opacity .15s;display:none}
.sheet-backdrop.on{display:block;opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:var(--rk-z-modal);background:var(--card-bg);color:var(--text);
  border-radius:18px 18px 0 0;box-shadow:0 -8px 32px rgba(15,23,42,.28);transform:translateY(101%);transition:transform .2s ease-out;
  max-height:92dvh;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
.sheet.on{transform:translateY(0)}
.sheet-grip{flex:0 0 auto;width:38px;height:4px;border-radius:2px;background:var(--border);margin:9px auto 2px}
.sheet-body{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 14px 16px}
.sheet-body .pmeta{margin-top:3px}
.sheet-body .ctl{margin-top:12px}
@media (min-width:600px){ .sheet{left:50%;right:auto;width:520px;transform:translate(-50%,101%);border-radius:18px 18px 0 0}
  .sheet.on{transform:translate(-50%,0)} }
.iconbtn.ghost{background:transparent;color:var(--muted);width:34px;height:34px;font-size:15px}
.iconbtn.ghost:active{background:var(--border)}

/* ══ แถบสรุปบนหน้าคอลการ์ด ══ */
.strip{background:var(--card-bg);border:1px solid var(--border);border-radius:12px;margin:10px 12px 2px;padding:9px 11px;font-size:13px}
.strip.tip{color:var(--muted);font-size:12.5px;border-style:dashed}
.savestate{font-size:11.5px;color:var(--muted);gap:6px}
.savestate .dot{flex:0 0 auto;width:7px;height:7px;border-radius:50%;background:var(--border)}
.savestate .dot.ok{background:var(--green)} .savestate .dot.warn{background:var(--amber)} .savestate .dot.bad{background:var(--red)}
.banner{background:var(--card-bg);border:1px solid rgba(180,83,9,.45);border-left:3px solid var(--amber);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.banner>.rk-row{margin-bottom:2px}
.rowline.slim{padding:7px 0;border-bottom:0;background:transparent;font-size:13px}
.rowline.slim+.rowline.slim{border-top:1px solid var(--border)}
.pcard{cursor:pointer}
.pcard:active{border-color:var(--gold)}

/* ══ หน้าสรุปงานรายวัน ══ */
.dateinp{border:1px solid var(--border);border-radius:12px;background:var(--card-bg);color:var(--text);
  font:inherit;font-size:16px;padding:10px 11px;outline:none;min-width:0}
.dateinp:focus{border-color:var(--gold)}
.daycard{background:var(--card-bg);border:1px solid var(--border);border-radius:13px;margin:0 12px 8px;overflow:hidden}
.dayhead{padding:11px;cursor:pointer}
.dayhead .chev{transition:transform .15s}
.daycard.open .dayhead .chev{transform:rotate(180deg)}
.daylist{display:none;border-top:1px solid var(--border);padding:4px 11px 8px}
.daycard.open .daylist{display:block}
.dayitem{padding:7px 0;font-size:13px}
.dayitem+.dayitem{border-top:1px solid var(--border)}
</style>
</head>
<body>

<!-- ══════════ 1 · เลือกเซล ══════════ -->
<section class="screen on" id="scRep">
  <header class="hdr rk-sticky" style="background:var(--navy)">
    <div class="bar">
      <div class="rk-grow" style="min-width:0">
        <div class="ttl rk-1line">Colgate Call Card</div>
        <div class="sub rk-1line" id="repSub">เลือกเซลก่อนเริ่มเยี่ยมร้าน</div>
      </div>
      <a class="hubbtn" href="https://rattanaphaiboon.github.io/app/rattana-hub.html">← Hub</a>
    </div>
  </header>
  <div class="pad" id="repBanner" style="padding-bottom:0"></div>
  <div class="pad" id="repList"></div>
  <div class="pad tiny muted" id="dataNote" style="padding-top:0"></div>
</section>

<!-- ══════════ 2 · เลือกร้าน ══════════ -->
<section class="screen" id="scStore">
  <header class="hdr rk-sticky">
    <div class="bar">
      <button class="iconbtn" onclick="backToReps()" aria-label="ย้อนกลับ">←</button>
      <div class="rk-grow" style="min-width:0">
        <div class="ttl rk-1line">เลือกร้านค้า</div>
        <div class="sub rk-1line" id="storeSub"></div>
      </div>
      <button class="iconbtn" id="btnDay1" aria-label="สรุปงานรายวัน">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>
      </button>
    </div>
  </header>
  <div class="rk-sticky-sub rk-searchwrap">
    <div class="rk-search">
      <input id="qStore" type="search" autocomplete="off" placeholder="ค้นหา ชื่อร้าน · รหัสร้าน · route">
      <button class="rk-search-x" type="button" aria-label="ล้างทั้งหมด">✕</button>
    </div>
    <div class="rk-chips" id="storeChips"></div>
  </div>
  <div class="pad" id="storeBanner" style="padding-bottom:0"></div>
  <div id="storeList"></div>
</section>

<!-- ══════════ 3 · คอลการ์ด — สแกน/ค้น แล้วส่งทีละรายการ ══════════ -->
<section class="screen" id="scCard">
  <header class="hdr rk-sticky">
    <div class="bar">
      <button class="iconbtn" onclick="backToStores()" aria-label="ย้อนกลับ">←</button>

<script id="rk-dropdown-js">
(function(){
  window.RK = window.RK || {};
  let el, backdrop, inp, list, cntEl, headEl, st = null, act = -1;
  function build(){
    if (el) return;
    backdrop = document.createElement('div'); backdrop.className = 'rk-dd-backdrop';
    el = document.createElement('div'); el.className = 'rk-dd'; el.setAttribute('role','listbox');
    el.innerHTML = '<div class="rk-dd-grip"></div><div class="rk-dd-head"><span class="rk-1line rk-grow"></span></div>'+
      '<div class="rk-dd-srch"><input type="search" inputmode="search" autocomplete="off" placeholder="พิมพ์ค้นหา…"><button class="rk-dd-x" type="button" aria-label="ล้าง">✕</button></div>'+
      '<div class="rk-dd-list"></div><div class="rk-dd-cnt"></div>';
    document.body.appendChild(backdrop); document.body.appendChild(el);
    inp = el.querySelector('input'); list = el.querySelector('.rk-dd-list');
    cntEl = el.querySelector('.rk-dd-cnt'); headEl = el.querySelector('.rk-dd-head span');
    inp.addEventListener('input', paint);
    el.querySelector('.rk-dd-x').addEventListener('click', ()=>{ inp.value=''; paint(); inp.focus(); });
    backdrop.addEventListener('click', close);
    el.addEventListener('keydown', key); inp.addEventListener('keydown', key);
    list.addEventListener('click', e=>{ const it = e.target.closest('.rk-dd-it'); if (!it) return; pick(st.view[+it.dataset.i]); });
    window.addEventListener('resize', close);
    window.addEventListener('scroll', e=>{ if (st && !el.contains(e.target)) close(); }, true);
  }
  const norm = s => String(s==null?'':s).toLowerCase().trim();
  function match(hay, q){ return norm(q).split(/\s+/).filter(Boolean).every(x => hay.indexOf(x) >= 0); }
  function paint(){
    const q = inp.value;
    st.view = st.items.filter(it => !q || match(it._s, q));
    act = st.view.findIndex(it => String(it.v) === String(st.value));
    el.querySelector('.rk-dd-srch').classList.toggle('has', !!q);
    list.innerHTML = st.view.length
      ? st.view.map((it,i)=> '<div class="rk-dd-it'+(String(it.v)===String(st.value)?' sel':'')+'" data-i="'+i+'" role="option">'+
          (it.color?'<span class="dot" style="background:'+RK.esc(it.color)+'"></span>':'')+
          '<span class="lb" title="'+RK.esc(it.label)+'">'+RK.esc(it.label)+'</span>'+
          (String(it.v)===String(st.value)?'<span class="tick">✓</span>':'')+'</div>').join('')
      : '<div class="rk-dd-none">ไม่พบ "'+RK.esc(q)+'"</div>';
    cntEl.textContent = st.view.length + ' / ' + st.items.length + ' รายการ';
    cntEl.style.display = st.items.length > 8 ? '' : 'none';
    const sel = list.querySelector('.sel'); if (sel) sel.scrollIntoView({block:'nearest'});
  }
  function key(e){
    if (!st) return;
    if (e.key === 'Escape'){ e.preventDefault(); close(); return; }
    if (e.key === 'Enter'){ e.preventDefault(); if (st.view[act]) pick(st.view[act]); else if (st.view.length===1) pick(st.view[0]); return; }
    if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
    e.preventDefault();
    act = Math.max(0, Math.min(st.view.length-1, act + (e.key==='ArrowDown'?1:-1)));
    [...list.children].forEach((c,i)=> c.classList.toggle('act', i===act));
    if (list.children[act]) list.children[act].scrollIntoView({block:'nearest'});
  }
  function place(anchor){
    if (window.innerWidth <= 480) return;
    const r = anchor.getBoundingClientRect(), M = 8;
    const w = Math.min(Math.max(r.width, 220), window.innerWidth - M*2);
    el.style.width = w + 'px';
    el.style.left  = Math.round(Math.min(Math.max(M, r.left), window.innerWidth - w - M)) + 'px';
    const below = window.innerHeight - r.bottom - M, above = r.top - M;
    const h = Math.min(el.scrollHeight || 320, 420);
    if (below >= Math.min(h, 220) || below >= above){ el.style.top = Math.round(r.bottom + 4) + 'px'; el.style.maxHeight = (below - 4) + 'px'; }
    else { el.style.top = Math.round(Math.max(M, r.top - 4 - Math.min(h, above))) + 'px'; el.style.maxHeight = (above - 4) + 'px'; }
  }
  function pick(it){ if (!it) return; const cb = st.onPick; close(); if (cb) cb(it); }
  function close(){
    if (!st) return;
    const a = st.anchor; st = null;
    el.classList.remove('on'); backdrop.classList.remove('on'); backdrop.style.display = 'none';
    if (a && a.focus) try{ a.focus({preventScroll:true}); }catch(e){}
  }
  RK.dropdown = function(anchor, o){
    build(); if (st) close();
    const items = (o.items||[]).map(it => {
      const x = (typeof it === 'string') ? {v:it, label:it} : Object.assign({}, it);
      x.label = x.label==null ? String(x.v) : String(x.label);
      x._s = norm(x.label + ' ' + x.v + ' ' + (x.search||''));
      return x;
    });
    st = {anchor, items, view:items, value:o.value, onPick:o.onPick};
    headEl.textContent = o.title || 'เลือก';
    const searchable = o.search !== false && (o.search === true || items.length > 10);
    el.querySelector('.rk-dd-srch').style.display = searchable ? '' : 'none';
    inp.value = ''; inp.placeholder = o.placeholder || 'พิมพ์ค้นหา…';
    backdrop.style.display = ''; backdrop.classList.add('on');
    el.classList.add('on'); paint(); place(anchor);
    if (searchable && window.innerWidth > 480) setTimeout(()=>inp.focus(), 30);
    return {close};
  };
  RK.closeDropdown = close;
})();
</script>

<script id="rk-searchbar-js">
(function(){
  window.RK = window.RK || {};
  const norm = s => String(s==null?'':s).toLowerCase().trim();
  RK.blob = function(obj, fields){
    if (obj == null) return '';
    if (typeof obj !== 'object') return norm(obj);
    if (obj.__rkBlob && !fields) return obj.__rkBlob;
    const keys = fields || Object.keys(obj);
    let s = '';
    for (const k of keys){
      if (k === '__rkBlob') continue;
      const v = obj[k];
      if (v == null || v === '') continue;
      if (typeof v === 'object') s += ' ' + Object.values(v).filter(x=>x!=null&&typeof x!=='object').join(' ');
      else s += ' ' + v;
    }
    s = norm(s.replace(/\s+/g,' '));
    if (!fields) { try { Object.defineProperty(obj,'__rkBlob',{value:s,enumerable:false,configurable:true}); } catch(e){} }
    return s;
  };
  RK.match = function(rec, q, fields){
    const w = norm(q).split(/\s+/).filter(Boolean);
    if (!w.length) return true;
    const hay = typeof rec === 'string' ? norm(rec) : RK.blob(rec, fields);
    return w.every(x => hay.indexOf(x) >= 0);
  };
  RK.filter = function(list, q, fields){ if (!q || !norm(q)) return list || []; return (list||[]).filter(r => RK.match(r, q, fields)); };
  RK.q = sel => { const el = typeof sel==='string' ? document.querySelector(sel) : sel; return el ? el.value : ''; };
  RK.bindSearch = function(input, o){
    o = o || {};
    const el = typeof input === 'string' ? document.querySelector(input) : input;
    if (!el || el.dataset.rkBound) return;
    el.dataset.rkBound = '1';
    const wrap = el.closest('.rk-search') || el.parentElement;
    let x = wrap && wrap.querySelector('.rk-search-x');
    if (wrap && !x){ x = document.createElement('button'); x.type='button'; x.className='rk-search-x'; x.textContent='✕'; wrap.appendChild(x); }
    const paintX = () => { if (wrap) wrap.classList.toggle('has', !!el.value); };
    const fire = RK.debounce(()=>{ if (o.onQuery) o.onQuery(el.value); }, o.delay==null?120:o.delay);
    el.addEventListener('input', ()=>{ paintX(); fire(); });
    el.addEventListener('keydown', e=>{ if (e.key === 'Escape'){ e.preventDefault(); clear(); } });
    function clear(){
      const y = window.scrollY;
      el.value = ''; paintX();
      if (o.onReset) o.onReset();
      if (o.onQuery) o.onQuery('');
      el.focus({preventScroll:true});
      window.scrollTo({top:y});
    }
    if (x) x.addEventListener('click', clear);
    paintX();
    return {clear, value:()=>el.value, set:v=>{ el.value=v; paintX(); if(o.onQuery) o.onQuery(v); }};
  };
})();
</script>

<style id="rk-scanner-css">
#rkScan{position:fixed;inset:0;z-index:var(--rk-z-modal);display:none;flex-direction:column;background:#000;color:#fff;height:100dvh;overscroll-behavior:contain}

<script id="rk-scanner-js">
(function(){
  window.RK = window.RK || {};
  const CDN = 'https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js';
  const UNITS = [
    {u:'CS', code:'CODE CS', qty:'QTY CS', th:'ลัง'},
    {u:'BP', code:'CODE BP', qty:'QTY BP', th:'Big Pack'},
    {u:'PA', code:'CODE PA', qty:'QTY PA', th:'แพ็ค'},
    {u:'EA', code:'CODE EA', qty:'QTY EA', th:'ชิ้น'}
  ];
  let sc = null, el = null, busy = false, opt = {}, IDX = {};
  const clean = v => String(v==null?'':v).replace(/[\s'"]/g,'').trim();
  RK.scan = RK.scan || {};
  RK.scan.index = function(products){
    IDX = {};
    (products||[]).forEach(p=>{
      UNITS.forEach(U=>{
        const bc = clean(p[U.code] || '');
        if (!bc || bc === '0') return;
        if (!IDX[bc]) IDX[bc] = {product:p, unit:U.u, unitTh:U.th, eaPerUnit: Math.max(1, RK.num(p[U.qty]) || 1)};
      });
    });
    return Object.keys(IDX).length;
  };
  RK.scan.lookup = function(code){
    const bc = clean(code);
    const hit = IDX[bc] || IDX[bc.replace(/^0+/,'')] || null;
    if (!hit) return {code:bc, product:null, unit:null, eaPerUnit:1, label:''};
    return {code:bc, product:hit.product, unit:hit.unit, unitTh:hit.unitTh, eaPerUnit:hit.eaPerUnit,
            label: hit.unit === 'EA' ? '1 ชิ้น' : ('1 ' + hit.unitTh + ' = ' + hit.eaPerUnit.toLocaleString('th-TH') + ' ชิ้น')};
  };
  RK.scan.toEA = (r, qty) => Math.round((RK.num(qty)||0) * (r && r.eaPerUnit ? r.eaPerUnit : 1));
  function build(){
    if (el) return;
    el = document.createElement('div'); el.id = 'rkScan';
    el.innerHTML = '<div class="rk-sc-top"><span class="t"></span>'+
        '<button class="rk-sc-btn rk-sc-torch" type="button" style="display:none">ไฟฉาย</button>'+
        '<button class="rk-sc-btn rk-sc-close" type="button" aria-label="ปิด">✕</button></div>'+
      '<div class="rk-sc-stage"><div id="rkScanReader"></div><div class="rk-sc-frame"></div>'+
        '<div class="rk-sc-hint">เล็งบาร์โค้ดให้อยู่ในกรอบ · สแกนติดแล้วกล้องจะปิดเอง</div></div>'+
      '<div class="rk-sc-bottom"><div class="rk-sc-manual">'+
        '<input type="text" inputmode="numeric" autocomplete="off" placeholder="อ่านไม่ออก → พิมพ์เลขบาร์โค้ด">'+
        '<button type="button">ตกลง</button></div><div class="rk-sc-err"></div></div>';
    document.body.appendChild(el);
    el.querySelector('.rk-sc-close').addEventListener('click', ()=>RK.scan.close());
    el.querySelector('.rk-sc-manual button').addEventListener('click', manual);
    el.querySelector('.rk-sc-manual input').addEventListener('keydown', e=>{ if (e.key==='Enter') manual(); });
    el.querySelector('.rk-sc-torch').addEventListener('click', torch);
  }
  function err(msg){ const e = el.querySelector('.rk-sc-err'); e.textContent = msg||''; e.classList.toggle('on', !!msg); }
  function manual(){ const i = el.querySelector('.rk-sc-manual input'), v = clean(i.value); if (!v) return; i.value = ''; done(v, true); }
  function load(cb){
    if (typeof Html5Qrcode !== 'undefined') return cb();
    const s = document.createElement('script'); s.src = CDN;
    s.onload = cb; s.onerror = ()=>err('โหลดตัวสแกนไม่ได้ — เช็คเน็ต แล้วพิมพ์เลขบาร์โค้ดแทนได้');
    document.head.appendChild(s);
  }
  async function release(){
    if (sc){ try{ await sc.stop(); }catch(e){} try{ sc.clear(); }catch(e){} sc = null; }
    try{ const st = await navigator.mediaDevices.getUserMedia({video:true}); st.getTracks().forEach(t=>t.stop()); }catch(e){}
  }
  function done(code, isManual){
    if (busy) return; busy = true;
    try{ navigator.vibrate && navigator.vibrate(60); }catch(e){}
    const r = RK.scan.lookup(code); r.manual = !!isManual;
    RK.scan.close();
    setTimeout(()=>{ busy = false; if (opt.onResult) opt.onResult(r); }, 60);
  }
  async function torch(){
    try{
      const t = sc && sc.getRunningTrackSettings ? sc.getRunningTrackSettings() : null;
      await sc.applyVideoConstraints({advanced:[{torch:!(t && t.torch)}]});
    }catch(e){ err('เครื่องนี้เปิดไฟฉายไม่ได้'); }
  }
  RK.scan.open = function(o){
    build(); opt = o || {}; busy = false; err('');
    el.querySelector('.rk-sc-manual input').value = '';
    el.querySelector('.t').textContent = opt.title || 'สแกนบาร์โค้ด';
    el.classList.add('on');
    document.body.style.overflow = 'hidden';
    load(async ()=>{
      try{
        await release();
        sc = new Html5Qrcode('rkScanReader', {
          verbose:false,
          experimentalFeatures:{ useBarCodeDetectorIfSupported:true },
          formatsToSupport:[
            Html5QrcodeSupportedFormats.EAN_13, Html5QrcodeSupportedFormats.EAN_8,

/* ── สูตรแนะนำจำนวนสั่ง ────────────────────────────────────────────

function stat(h, cust){

  const prevMonth = pw.length ? Math.max(0, pw.reduce((a,b)=>a+b,0) / pw.length) : 0;
  const avgDay = avgMonth / 30.4;
  const cover = (cust.cyc || 15) + S.safety;
  return { m, avgMonth, prevMonth, avgDay, cover, target: avgDay * cover,
           total: m.reduce((a,b)=>a+b,0), baht: h ? h.baht : 0,
           last: h ? h.last : '', lq: h ? h.lq : 0 };

function deficit(st, stock){ return st.target - (RK.num(stock) || 0); }

function suggestQty(st, stock){
  const d = deficit(st, stock);
  if (d <= 0) return 0;
  return d < 1 ? Math.round(d) : Math.ceil(d);
}

function starterQty(p, cust){
  if (!p.ns || p.ns < 3 || !p.md) return 0;
  return Math.max(1, Math.round(p.md * ((cust.cyc || 15) + S.safety) / 30.4));

function autoQty(p, st, h, stock, cust){ return h ? suggestQty(st, stock) : starterQty(p, cust); }

function go(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on', s.id===id));
  window.scrollTo({top:0});
}
function backToReps(){ renderReps(); go('scRep'); }
function backToStores(){ renderStores(); go('scStore'); }
function backFromDay(){ if (S.cust) { renderCard(); go('scCard'); } else if (S.rep) backToStores(); else backToReps(); }

/* ══════════ 1 · เลือกเซล ══════════ */
function renderReps(){
  const m0 = DB.months[0], mz = dOf(DB.asOf.slice(2).replace(/-/g,''));
  el('dataNote').innerHTML = '<span class="rk-1line" style="display:block">ยอดขาย ' +
    THM[+m0.slice(5,7)-1] + '–' + mz.getDate() + ' ' + THM[mz.getMonth()] + ' ' + mz.getFullYear() +
    ' · ' + DB.custs.length + ' ร้าน · ' + DB.prods.length + ' สินค้า · ' + VER + '</span>';
  el('repBanner').innerHTML = bannerHtml();
  el('repList').innerHTML = DB.reps.map(([code,name])=>{
    const n = DB.custs.filter(c=>c.r===code).length, tel = repTel(name);
    return '<button class="big-pick" onclick="pickRep(\''+code+'\')">'+
      '<span class="avatar">'+esc(repNm(name).slice(0,2))+'</span>'+
      '<span class="rk-grow" style="min-width:0">'+
        '<span class="rk-1line" style="display:block;font-weight:700">'+esc(repNm(name))+'</span>'+
        '<span class="rk-1line tiny muted" style="display:block">'+esc(code)+' · '+n+' ร้าน'+(tel?' · '+esc(tel):'')+'</span>'+
      '</span><span class="chev">›</span></button>';
  }).join('');
}
function pickRep(code){ S.rep = code; S.cust = null; S.qStore = ''; S.storeF = ''; qStoreBind.set(''); renderStores(); go('scStore'); }

/* ══════════ 2 · เลือกร้าน ══════════ */
const ST_BADGE = {draft:['b-gap','ค้างส่ง'], pending:['b-hot','รอส่ง'], sent:['b-ok','ส่งแล้ว']};
function storeStat(code){
  const list = items.forStore(code, isoToday());
  if (!list.length) return null;
  const openN = list.filter(x=>x.status!=='sent').length;
  return { n:list.length, open:openN,
           status: list.some(x=>x.status==='pending') ? 'pending' : (openN ? 'draft' : 'sent') };
}
function renderStores(){
  el('storeSub').textContent = repNm(REPNAME[S.rep]) + ' · ' + S.rep;
  const mine = DB.custs.filter(c=>c.r===S.rep);
  const nOpen = mine.filter(c=>{ const s = storeStat(c.c); return s && s.open; }).length;
  const nSent = mine.filter(c=>{ const s = storeStat(c.c); return s && !s.open; }).length;
  el('storeChips').innerHTML =
    '<span class="chip'+(!S.storeF?' on':'')+'" onclick="setStoreF(\'\')">ทั้งหมด <span class="n">'+mine.length+'</span></span>'+
    '<span class="chip'+(S.storeF==='open'?' on':'')+'" onclick="setStoreF(\'open\')">ยังไม่ส่ง <span class="n">'+nOpen+'</span></span>'+
    '<span class="chip'+(S.storeF==='sent'?' on':'')+'" onclick="setStoreF(\'sent\')">ส่งแล้ววันนี้ <span class="n">'+nSent+'</span></span>';
  let list = RK.filter(mine, S.qStore, ['_s']);
  if (S.storeF === 'open') list = list.filter(c=>{ const s = storeStat(c.c); return s && s.open; });
  if (S.storeF === 'sent') list = list.filter(c=>{ const s = storeStat(c.c); return s && !s.open; });
  /* ไม่มี deadline → ล่าสุดอยู่บน · แต่ของที่ยังไม่ส่งต้องขึ้นก่อน ไม่งั้นเซลลืมว่ามีค้าง */
  const rank = c => { const s = storeStat(c.c); return !s ? 2 : (s.status==='pending'?0:(s.open?1:3)); };
  list = list.slice().sort((a,b)=> (rank(a)-rank(b)) || (b.last||'').localeCompare(a.last||''));
  el('storeBanner').innerHTML = bannerHtml();
  el('storeList').innerHTML = list.length ? list.map(c=>{
    const s = storeStat(c.c), b = s && ST_BADGE[s.status];
    return '<div class="rowline" onclick="pickCust('+c.i+')">'+
      '<span class="rk-grow" style="min-width:0">'+
        '<span class="rk-1line" style="display:block;font-weight:600">'+esc(c.n)+'</span>'+
        '<span class="rk-1line tiny muted" style="display:block">'+esc(c.c)+' · ซื้อล่าสุด '+esc(c.last)+' · รอบ '+c.cyc+' วัน'+
          (s ? ' · วันนี้ '+s.n+' รายการ' : '')+'</span>'+
      '</span>'+
      (b ? '<span class="badge '+b[0]+'">'+b[1]+'</span>' : '')+
      '<span class="chev">›</span></div>';
  }).join('') : '<div class="empty">ไม่พบร้านที่ตรงกับคำค้น</div>';
}
function setStoreF(k){ const y = window.scrollY; S.storeF = k; renderStores(); window.scrollTo({top:y}); }

/* แบนเนอร์ "ยังไม่ได้ส่ง" — เปิดแอปมาต้องเห็นทันที ไม่ต้องจำเองว่าค้างตัวไหน */
function bannerHtml(){
  const open = items.open();
  if (!open.length) return '';
  const byStore = {};
  open.forEach(x=>{ (byStore[x.cust] = byStore[x.cust] || {name:x.custName, n:0, d:x.d}).n++; });
  const keys = Object.keys(byStore);
  return '<div class="banner">'+
    '<div class="rk-row"><b class="rk-grow rk-1line">ยังไม่ได้ส่งขึ้นชีท '+open.length+' รายการ · '+keys.length+' ร้าน</b>'+
      '<button class="linkbtn rk-nogrow" onclick="sendAllOpen()">ส่งทั้งหมด</button></div>'+
    keys.slice(0,4).map(k=>
      '<div class="rowline slim" onclick="resume(\''+k+'\')">'+
        '<span class="rk-grow rk-1line">'+esc(byStore[k].name)+'</span>'+
        '<span class="rk-nogrow tiny muted">'+byStore[k].n+' รายการ · '+byStore[k].d+'</span>'+
        '<span class="chev">›</span></div>').join('')+
    (keys.length>4 ? '<div class="tiny muted" style="padding:6px 2px 0">และอีก '+(keys.length-4)+' ร้าน</div>' : '')+
  '</div>';
}
function resume(code){
  const c = CBYCODE[code]; if (!c) return;
  S.rep = c.r; pickCust(c.i);
}

/* ══════════ 3 · คอลการ์ด ══════════ */
function pickCust(i){
  S.cust = DB.custs[i];
  S.qProd = ''; S.filter = 'all';
  qProdBind.set('');
  renderCard(); go('scCard');
  const mine = items.forStore(S.cust.c, isoToday());
  if (mine.length) toast('ร้านนี้วันนี้ส่งไปแล้ว ' + mine.filter(x=>x.status==='sent').length + '/' + mine.length + ' รายการ');
}
function itemOf(code){ return items.get(iKey(isoToday(), S.cust.c, code)); }

function rowsFor(){
  const h = HIST[S.cust.i] || {};
  return DB.prods.map(p=>{
    const st = stat(h[p.i], S.cust);
    const it = itemOf(p.c);
    return { p, st, it, sold: st.total > 0 || !!st.last };
  });
}
/* ชิป = ล็อคความหมายของตัวเองเป๊ะๆ · ค้นหาก็ยังอยู่ในชิปที่เลือก */
function passFilter(r){
  switch (S.filter){
    case 'sold':  return r.sold;
    case 'sent':  return !!r.it && r.it.status === 'sent';
    case 'open':  return !!r.it && r.it.status !== 'sent';
    case 'todo':  return r.sold && !r.it;
    case 'never': return !r.sold;
    default:      return true;
  }
}
const CHIP_LABEL = {all:'ทั้งหมด', sold:'เคยซื้อ', todo:'เคยซื้อ·ยังไม่ทำ', sent:'ส่งแล้ว', open:'ยังไม่ได้ส่ง', never:'ยังไม่เคยขาย'};

function renderCard(){ const all = rowsFor(); paintHead(all); renderStrip(); renderList(all); }

function paintHead(all){
  const c = S.cust;
  el('cardTtl').textContent = c.n;
  el('cardSub').textContent = c.c + ' · ' + repNm(REPNAME[S.rep]) + ' · ' + isoToday();
  const cnt = {
    all: all.length, sold: all.filter(r=>r.sold).length, never: all.filter(r=>!r.sold).length,
    todo: all.filter(r=>r.sold && !r.it).length,
    sent: all.filter(r=>r.it && r.it.status==='sent').length,
    open: all.filter(r=>r.it && r.it.status!=='sent').length
  };
  el('prodChips').innerHTML = ['all','sold','todo','sent','open','never'].map(k=>
    '<span class="chip'+(S.filter===k?' on':'')+'" onclick="setFilter(\''+k+'\')">'+CHIP_LABEL[k]+
    ' <span class="n">'+cnt[k]+'</span></span>').join('');
}
function setFilter(k){ const y = window.scrollY; S.filter = k; renderCard(); window.scrollTo({top:y}); }

/* แถบบนสุด: ส่งแล้วกี่ตัว ค้างกี่ตัว + 3 ตัวล่าสุด (ล่าสุดอยู่บน — § Sort Rule) */
function renderStrip(){
  const mine = items.forStore(S.cust.c, isoToday());
  if (!mine.length){
    el('sentStrip').innerHTML = '<div class="strip tip"><span class="rk-1line">สแกนบาร์โค้ด หรือพิมพ์ชื่อสินค้า แล้วกดส่งทีละรายการ</span></div>';
    return;
  }
  const sent = mine.filter(x=>x.status==='sent'), open = mine.filter(x=>x.status!=='sent');
  const recent = mine.slice().sort((a,b)=>(b.at||'').localeCompare(a.at||'')).slice(0,3);
  el('sentStrip').innerHTML = '<div class="strip">'+
    '<div class="rk-row"><b class="rk-grow rk-1line">วันนี้ส่งแล้ว '+sent.length+' รายการ'+
      (open.length ? ' · ค้าง '+open.length : '')+'</b>'+
      (open.length ? '<button class="linkbtn rk-nogrow" onclick="sendStoreOpen()">ส่งที่ค้าง</button>' : '')+'</div>'+
    recent.map(x=>'<div class="rowline slim" onclick="openEntry('+(PBYCODE[x.code]?PBYCODE[x.code].i:-1)+')">'+
      '<span class="rk-grow rk-1line">'+esc(x.name)+'</span>'+
      '<span class="rk-nogrow tiny muted">สต็อก '+x.s+' · สั่ง '+x.o+'</span>'+
      '<span class="badge '+ST_BADGE[x.status][0]+'">'+ST_BADGE[x.status][1]+'</span></div>').join('')+
  '</div>';
}

function renderList(all){
  let rows = all.filter(passFilter);
  if (S.qProd) rows = rows.filter(r=>RK.match(r.p, S.qProd, ['_s']));

  /* § UI 2️⃣ · เรียง 2 ชั้นด้วย "ยอดรวมของกลุ่ม" มาก→น้อย (หน้านี้เรื่องสต็อก/สั่งซื้อ → ใช้ยอดขายเป็นลัง)
     กลุ่มที่ร้านนี้ยังไม่เคยซื้อ ยอดเป็น 0 เท่ากันหมด → ใช้ "ร้านอื่นกี่ร้านขาย" จัดอันดับต่อ */
  const gTot = {}, gOpp = {}, groups = {};
  rows.forEach(r=>{
    const g = r.p.b || 'อื่นๆ';
    gTot[g] = (gTot[g]||0) + Math.max(0, r.st.total);
    gOpp[g] = (gOpp[g]||0) + (r.sold ? 0 : (r.p.ns||0));
    (groups[g] = groups[g] || []).push(r);
  });
  const order = Object.keys(groups).sort((a,b)=> (gTot[b]-gTot[a]) || (gOpp[b]-gOpp[a]) || a.localeCompare(b,'th'));

  el('prodList').innerHTML = rows.length ? order.map(g=>
    '<div class="grp"><span class="rk-1line">'+esc(g)+'</span><span class="ln"></span>'+
      '<span class="rk-nogrow tiny" style="text-transform:none">'+
        (gTot[g] > 0 ? fmt(gTot[g],1)+' ลัง' : (gOpp[g] ? 'โอกาส '+gOpp[g]+' ร้าน' : '—'))+'</span></div>'+
    '<div class="plist">'+ groups[g].slice().sort((a,b)=>
        (b.st.total - a.st.total) || ((b.p.ns||0) - (a.p.ns||0)) || a.p.n.localeCompare(b.p.n,'th'))
        .map(pcard).join('') +'</div>'
  ).join('') : '<div class="empty">ไม่พบสินค้าใน "'+esc(CHIP_LABEL[S.filter])+'"'+
      (S.qProd ? ' ที่ตรงกับ "'+esc(S.qProd)+'"<br><button class="linkbtn" onclick="setFilter(\'all\')">ค้นในทั้งหมด '+DB.prods.length+' รายการ</button>' : '')+'</div>';
}

function pcard(r){
  const p = r.p, st = r.st, it = r.it;
  const dAgo = daysAgo(st.last);
  let badge = '';
  if (it) { const b = ST_BADGE[it.status]; badge = '<span class="badge '+b[0]+'">'+b[1]+'</span>'; }
  else if (!r.sold) badge = '<span class="badge b-new">ยังไม่เคยขาย</span>';
  else if (dAgo != null && st.avgMonth > 0 && dAgo > (S.cust.cyc + S.safety) * 1.5)
    badge = '<span class="badge b-gap">หายไป '+dAgo+' วัน</span>';
  else if (st.total > 0 && st.avgMonth >= 3) badge = '<span class="badge b-hot">ขายดี</span>';

  const meta = r.sold
    ? esc(p.c) + ' · ซื้อล่าสุด ' + fmtD(st.last) + ' ' + fmt(st.lq,1) + ' ลัง' + (dAgo != null ? ' (' + dAgo + ' วัน)' : '')
    : esc(p.c) + ' · ' + (p.ns ? 'ร้านอื่น '+p.ns+' ร้านขาย' : 'ยังไม่มีร้านไหนในเขตนี้ซื้อ');
  const meta2 = it
    ? 'บันทึกไว้ สต็อก ' + it.s + ' ลัง · สั่ง ' + it.o + ' ลัง · ' + (it.at||'')
    : (r.sold ? 'เฉลี่ย ' + fmt(st.avgMonth,1) + ' ลัง/เดือน · ควรมี ' + fmt(st.target,1) + ' ลัง'
              : (p.md ? 'ร้านอื่นเฉลี่ย ' + fmt(p.md,1) + ' ลัง/เดือน' : (p.pk ? 'บรรจุ '+esc(p.pk) : '')));

  return '<div class="pcard'+(it ? (it.status==='sent'?' done':' need') : '')+'" id="pc'+p.i+'" onclick="openEntry('+p.i+')">'+
    '<div class="rk-row"><span class="rk-grow rk-1line pname" title="'+esc(p.n)+'">'+esc(p.n)+'</span>'+badge+'</div>'+
    '<div class="rk-1line pmeta">'+meta+'</div>'+
    (meta2 ? '<div class="rk-1line pmeta">'+meta2+'</div>' : '')+
  '</div>';
}

/* ══════════════════════════════════════════════════════════════════════════
   แผงกรอก + ส่งทีละรายการ
   ══════════════════════════════════════════════════════════════════════════ */
function openEntry(pi){
  if (pi < 0) return;
  const p = DB.prods[pi];
  const h = (HIST[S.cust.i] || {})[pi];
  const st = stat(h, S.cust);
  const prev = itemOf(p.c);
  const s = prev ? prev.s : '';
  S.entry = { pi, p, st, h, s, o: prev ? prev.o : '', prev };
  paintEntry();
  el('entryBack').classList.add('on');
  el('entry').classList.add('on');
  document.body.style.overflow = 'hidden';
  setTimeout(()=>{ const i = el('eStock'); if (i){ i.focus(); i.select(); } }, 120);
}
function closeEntry(){
  el('entryBack').classList.remove('on');
  el('entry').classList.remove('on');
  document.body.style.overflow = '';
  S.entry = null;
  renderCard();
}
function paintEntry(){
  const E = S.entry; if (!E) return;
  const {p, st, h, prev} = E;
  const counted = String(E.s) !== '';
  const sug = counted ? autoQty(p, st, h, E.s, S.cust) : null;
  const dAgo = daysAgo(st.last);
  const info = h
    ? 'ซื้อล่าสุด ' + fmtD(st.last) + ' ' + fmt(st.lq,1) + ' ลัง' + (dAgo!=null?' ('+dAgo+' วัน)':'') +
      ' · เฉลี่ย ' + fmt(st.avgMonth,1) + ' ลัง/เดือน'
    : (p.ns ? 'ร้านนี้ยังไม่เคยซื้อ · ร้านอื่น ' + p.ns + ' ร้านขาย เฉลี่ย ' + fmt(p.md,1) + ' ลัง/เดือน'
            : 'ร้านนี้ยังไม่เคยซื้อ · ยังไม่มีร้านไหนในเขตนี้ซื้อ SKU นี้');
  const bcs = [p.be && 'IND '+p.be, p.bb && 'BUN '+p.bb, p.bc && 'CASE '+p.bc].filter(Boolean).join('  ');
  const hintS = counted
    ? [ p.cv ? '= ' + fmt(RK.num(E.s) * p.cv) + ' ' + esc(uTh(p.u)) : '',
        st.avgDay > 0 ? 'พอขาย ' + fmt(RK.num(E.s)/st.avgDay) + ' วัน' : '' ].filter(Boolean).join(' · ')
    : '&nbsp;';
  const hintO = !counted ? 'ใส่สต็อกก่อน ระบบจะคำนวณให้'
    : RK.num(E.o) !== sug
      ? '<button class="linkbtn" onclick="setEntry(\'o\','+sug+')">ใช้ค่าแนะนำ '+sug+' ลัง</button>'
      : !h ? (sug > 0 ? 'ล็อตเปิดบิล '+sug+' ลัง (อิงร้านอื่น)' : 'ยังไม่มีฐานให้แนะนำ — เซลกรอกเอง')
      : (sug === 0 && deficit(st, E.s) > 0 && p.cv
          ? 'ขาดอีก ~' + fmt(deficit(st, E.s) * p.cv) + ' ' + esc(uTh(p.u)) + ' (ไม่ถึงลัง)'
          : 'ระบบแนะนำ ' + sug + ' ลัง');

  const sentBefore = prev && prev.status === 'sent';
  el('entryBody').innerHTML =
    '<div class="rk-row"><b class="rk-grow rk-1line" title="'+esc(p.n)+'" style="font-size:16px">'+esc(p.n)+'</b>'+
      '<button class="iconbtn ghost rk-nogrow" onclick="closeEntry()" aria-label="ปิด">✕</button></div>'+
    '<div class="rk-1line pmeta">'+esc(p.c)+' · '+(p.pk?esc(p.pk)+' · ':'')+fmt(p.cv)+' '+esc(uTh(p.u))+'/ลัง</div>'+
    '<div class="rk-1line pmeta">'+info+'</div>'+
    (h ? '<div class="rk-1line pmeta">ควรมีถึงรอบหน้า '+fmt(st.target,1)+' ลัง (รอบ '+S.cust.cyc+'+'+S.safety+' วัน)</div>' : '')+
    (bcs ? '<div class="rk-1line pmeta" title="'+esc(bcs)+'">'+esc(bcs)+'</div>' : '')+
    (h ? sparkHtml(st) : '')+
    '<div class="ctl">'+
      '<div><div class="lab rk-1line">สต็อกที่นับได้ (ลัง)</div>'+
        '<div class="step'+(counted?' filled':'')+'">'+
          '<button type="button" onclick="bumpEntry(\'s\',-1)">−</button>'+
          '<input id="eStock" type="number" inputmode="decimal" step="0.5" min="0" placeholder="—" value="'+esc(E.s)+'" '+
            'oninput="setEntry(\'s\',this.value,1)" onchange="setEntry(\'s\',this.value)" onfocus="this.select()">'+
          '<button type="button" onclick="bumpEntry(\'s\',1)">+</button>'+
        '</div><div class="hint rk-1line">'+hintS+'</div></div>'+
      '<div><div class="lab rk-1line">สั่งรอบนี้ (ลัง)</div>'+
        '<div class="step'+(counted && RK.num(E.o)>0 ?' sug':'')+'">'+
          '<button type="button" onclick="bumpEntry(\'o\',-1)">−</button>'+
          '<input id="eOrder" type="number" inputmode="numeric" step="1" min="0" placeholder="—" value="'+esc(E.o)+'" '+
            'oninput="setEntry(\'o\',this.value,1)" onchange="setEntry(\'o\',this.value)" onfocus="this.select()">'+
          '<button type="button" onclick="bumpEntry(\'o\',1)">+</button>'+
        '</div><div class="hint rk-1line">'+hintO+'</div></div>'+
    '</div>'+
    (prev ? '<div class="savestate rk-row" style="margin-top:8px"><span class="dot '+(prev.status==='sent'?'ok':'warn')+'"></span>'+
        '<span class="rk-1line">'+(prev.status==='sent'
          ? 'ส่งขึ้นชีทแล้ว '+(prev.at||'')+' — แก้แล้วส่งใหม่จะเป็นรอบที่ '+((prev.rev||1)+1)
          : 'เก็บในเครื่องแล้ว '+(prev.at||'')+' · ยังไม่ขึ้นชีท'+(prev.err?' — '+esc(prev.err):''))+'</span></div>' : '')+
    '<button class="btn btn-primary" id="eSend" style="margin-top:10px" onclick="sendEntry()"'+(counted?'':' disabled')+'>'+
      (sentBefore ? 'ส่งใหม่ (รอบที่ '+((prev.rev||1)+1)+')' : 'ส่งรายการนี้')+'</button>'+
    '<button class="btn btn-ghost" style="margin-top:6px" onclick="closeEntry()">ปิด</button>';
}
function sparkHtml(st){
  const mx = Math.max(1, ...st.m.map(v=>Math.max(0,v)));
  return '<div class="spark">'+st.m.map((v,i)=>
      '<div class="b'+(v>0?' v':'')+(i===MN-1&&v>0?' last':'')+'" style="height:'+Math.max(2,Math.round(Math.max(0,v)/mx*100))+'%" title="'+DB.months[i]+' · '+fmt(v,1)+' ลัง"></div>').join('')+'</div>'+
    '<div class="sparkx">'+st.m.map(v=>'<span>'+(v?fmt(v,v<10?1:0):'·')+'</span>').join('')+'</div>'+
    '<div class="sparkx">'+DB.months.map(m=>'<span>'+THM[+m.slice(5,7)-1].replace('.','')+'</span>').join('')+'</div>';
}
/* quiet=1 → กำลังพิมพ์: เก็บลงเครื่องทันที ❌ ห้ามวาดใหม่ ไม่งั้นโฟกัสหลุดกลางคัน */
function setEntry(f, v, quiet){
  const E = S.entry; if (!E) return;
  if (f === 's'){
    const s = String(v).trim();
    E.s = s === '' ? '' : String(Math.max(0, RK.num(s)));
    if (E.s !== '' && (E.o === '' || !E.touchedO)) E.o = String(autoQty(E.p, E.st, E.h, E.s, S.cust));
  } else {
    if (String(E.s) === '') { if (!quiet) toast('ใส่สต็อกที่นับได้ก่อน แล้วระบบจะคำนวณจำนวนสั่งให้','bad'); return; }
    E.o = String(Math.max(0, Math.round(RK.num(v)))); E.touchedO = true;
  }
  stash();
  if (quiet){
    const oi = el('eOrder');
    if (f === 's' && oi && document.activeElement !== oi) oi.value = E.o;
    const b = el('eSend'); if (b) b.disabled = String(E.s) === '';
  } else paintEntry();
}
function bumpEntry(f, d){
  const E = S.entry; if (!E) return;
  if (f === 's') setEntry('s', String(Math.max(0, (E.s===''?0:RK.num(E.s)) + d)));
  else           setEntry('o', String(Math.max(0, RK.num(E.o||0) + d)));
}
/* เขียนลงเครื่องทุกครั้งที่ค่าเปลี่ยน — ยังไม่ส่งก็ไม่หาย */
function stash(){
  const E = S.entry; if (!E || String(E.s) === '') return;
  const k = iKey(isoToday(), S.cust.c, E.p.c);
  const prev = E.prev;
  const it = {
    k, d:isoToday(), cust:S.cust.c, custName:S.cust.n, rep:S.rep, repName:REPNAME[S.rep],
    code:E.p.c, name:E.p.n, s:RK.num(E.s), o:RK.num(E.o||0),
    status: (prev && prev.status === 'sent') ? 'draft' : (prev ? prev.status === 'pending' ? 'pending' : 'draft' : 'draft'),
    rev: (prev && prev.status === 'sent') ? (prev.rev||1) + 1 : (prev ? prev.rev||1 : 1),
    batchId: (prev && prev.status === 'sent') ? uid() : (prev ? prev.batchId : uid()),
    at: hhmm(), err:''
  };
  if (prev && prev.status === 'sent'){ it.prevSentAt = prev.at; }
  items.put(it);
  E.stashed = it;
}

function rowOf(it){
  const p = PBYCODE[it.code], c = CBYCODE[it.cust];
  const h = (HIST[c.i]||{})[p.i], st = stat(h, c);
  return {
    'วันที่': it.d,
    'รหัสเซล': it.rep, 'ชื่อเซล': repNm(it.repName), 'เบอร์เซล': repTel(it.repName),
    'รหัสร้าน': it.cust, 'ชื่อร้าน': it.custName,
    'รหัสสินค้า': p.c, 'ชื่อสินค้า': p.n,
    'บาร์โค้ด_IND': p.be || '', 'บาร์โค้ด_BUN': p.bb || '', 'บาร์โค้ด_CASE': p.bc || '',
    'สต็อกที่นับ_CS': it.s, 'สั่งรอบนี้_CS': it.o,
    'ระบบแนะนำ_CS': autoQty(p, st, h, it.s, c),
    'ควรมี_CS': Math.round(st.target*10)/10,
    'ขาดอีก_ชิ้น': Math.max(0, Math.round(deficit(st, it.s) * (p.cv||0))),
    'เฉลี่ยต่อเดือน_CS': Math.round(st.avgMonth*10)/10,
    'ซื้อล่าสุด': st.last ? iso(dOf(st.last)) : '',
    'ซื้อล่าสุดจำนวน_CS': st.lq || 0,
    'สินค้าใหม่ของร้าน': h ? '' : 'ใช่',
    'ร้านอื่นที่ขาย_ร้าน': p.ns || 0,
    'รอบที่': it.rev || 1
  };
}

/* ══════════ ส่งขึ้นชีท ══════════ */
const EXEC_URL = (function(){ try{ return localStorage.getItem('colgateExec') || 'https://script.google.com/macros/s/AKfycby0Mw-__7f873AgK5R00Rq4Kh3KUEQDuyvlkDdxdvTh4AZdU_8r4nA2D0i-YoZFEHQldg/exec'; }
                              catch(e){ return 'https://script.google.com/macros/s/AKfycby0Mw-__7f873AgK5R00Rq4Kh3KUEQDuyvlkDdxdvTh4AZdU_8r4nA2D0i-YoZFEHQldg/exec'; } })();
const execReady = () => !!EXEC_URL && EXEC_URL.indexOf('__') !== 0;
async function post(body){
  if (!execReady()) throw new Error('ยังไม่ได้ตั้งค่า URL หลังบ้าน');
  if (!navigator.onLine) throw new Error('ไม่มีเน็ต');
  const res = await fetch(EXEC_URL, { method:'POST', redirect:'follow',
    headers:{'Content-Type':'text/plain;charset=utf-8'},    /* text/plain = ไม่โดน CORS preflight ของ GAS */
    body: JSON.stringify(body) });
  return await readJson(res);
}
/* GAS คืนหน้า HTML (ไม่ใช่ JSON) เวลาสิทธิ์ไม่ผ่าน → แปลงเป็นข้อความที่อ่านรู้เรื่อง
   ไม่งั้นเซลเห็นแค่ "Unexpected token '<'" แล้วไม่รู้ว่าต้องทำอะไร */
async function readJson(res){
  const txt = await res.text();
  let j = null;
  try { j = JSON.parse(txt); } catch(e){}
  if (!j){
    if (res.status === 403 || /ต้องมีสิทธิ์เข้าถึง|Access denied|การเข้าถึงถูกปฏิเสธ/.test(txt))
      throw new Error('หลังบ้านยังไม่เปิดสิทธิ์ (403) — เจ้าของสคริปต์ต้องกด Authorize 1 ครั้ง');
    if (/accounts\.google\.com|ServiceLogin|signin/.test(txt))
      throw new Error('หลังบ้านตั้งเป็น "ต้องล็อกอิน" — ต้องตั้ง Who has access = Anyone');
    throw new Error('หลังบ้านตอบกลับไม่ใช่ JSON (HTTP ' + res.status + ')');
  }
  if (!j.ok) throw new Error(j.error || 'หลังบ้านปฏิเสธ');
  return j;
}
/* ยิงซ้ำด้วย batchId เดิมเสมอ → หลังบ้านกันเขียนซ้ำให้ */
async function sendItem(it, quiet){
  it.status = 'pending'; items.put(it);
  try {
    const j = await post({action:'save', batchId:it.batchId, rows:[rowOf(it)]});
    it.status = 'sent'; it.err = ''; it.at = hhmm();
    items.put(it);
    if (!quiet) toast(j.duplicate ? 'ส่งไปแล้วก่อนหน้านี้ ไม่เขียนซ้ำ' : ('ส่งขึ้นชีทแล้ว: ' + it.name), 'good');
    return true;
  } catch (err) {
    it.err = String(err.message || err); items.put(it);
    if (!quiet) toast('ส่งไม่สำเร็จ: ' + it.err + ' — เก็บไว้ในเครื่องแล้ว กดส่งใหม่ได้', 'bad');
    return false;
  }
}
async function sendEntry(){
  const E = S.entry; if (!E || S.sending) return;
  if (String(E.s) === '') return toast('ใส่สต็อกที่นับได้ก่อน','bad');
  stash();
  const it = items.get(E.stashed.k);
  S.sending = true;
  const b = el('eSend'); if (b){ b.disabled = true; b.textContent = 'กำลังส่ง…'; }
  const ok = await sendItem(it);
  S.sending = false;
  if (ok){ closeEntry(); focusSearch(); }
  else { E.prev = items.get(it.k); paintEntry(); }
}
async function sendMany(list){
  if (!list.length) return toast('ไม่มีรายการค้าง');
  toast('กำลังส่ง ' + list.length + ' รายการ…');
  let ok = 0;
  for (const it of list) if (await sendItem(it, true)) ok++;
  toast(ok === list.length ? ('ส่งครบ ' + ok + ' รายการ') : ('ส่งได้ ' + ok + '/' + list.length + ' — ที่เหลือยังอยู่ในเครื่อง'),
        ok === list.length ? 'good' : 'bad');
  if (S.cust) renderCard();
  if (S.rep) renderStores();
  renderReps();
}
const sendAllOpen   = () => sendMany(items.open());
const sendStoreOpen = () => sendMany(items.forStore(S.cust.c, isoToday()).filter(x=>x.status!=='sent'));

function focusSearch(){
  const i = el('qProd'); if (!i) return;
  i.value = ''; S.qProd = '';
  const w = i.closest('.rk-search'); if (w) w.classList.remove('has');
  renderCard();
}

/* ══════════ สแกน ══════════ */
function openScan(){
  RK.scan.open({
    title:'สแกนสินค้า Colgate',
    onResult: r => {
      if (!r.product){ toast('ไม่พบบาร์โค้ด ' + r.code + ' — ลองค้นด้วยรหัสสินค้า','bad'); qProdBind.set(r.code); return; }
      const p = DB.prods[r.product._i];
      toast('เจอ: ' + p.n + (r.unit !== 'CS' ? ' (สแกน' + (r.unitTh||r.unit) + ' → นับเป็นลัง)' : ''), 'good');
      openEntry(p.i);                       /* สแกนติด = เปิดแผงกรอกให้เลย ไม่ต้องหาในลิสต์ */
    },
    onCancel: () => {}                      /* กฎ 3️⃣ · ปิดกล้อง = ไม่ค้างผลรอบก่อน (แผงยังไม่เปิด) */
  });
}

/* ══════════ ตั้งค่าการคำนวณ ══════════ */
function openSettings(e){
  RK.dropdown(e.currentTarget, {
    title:'เผื่อสต็อกกี่วัน (นอกเหนือรอบเยี่ยม '+S.cust.cyc+' วัน)',
    search:false, value:String(S.safety),
    items:[0,3,5,7,10,14].map(v=>({v:String(v), label:'เผื่อ '+v+' วัน · ควรมีของคลุม '+(S.cust.cyc+v)+' วัน'})),
    onPick: it => { S.safety = +it.v; renderCard(); toast('คำนวณใหม่: คลุม '+(S.cust.cyc+S.safety)+' วัน'); }
  });
}

/* ══════════════════════════════════════════════════════════════════════════
   4 · สรุปงานรายวัน — เลือกวันได้ · ดึงจากชีท + รวมของที่ยังค้างในเครื่อง
   ══════════════════════════════════════════════════════════════════════════ */
function openDay(d){
  S.day.date = d || S.day.date || isoToday();
  el('dayDate').value = S.day.date;
  go('scDay'); renderDay(); loadDay();
}
function shiftDay(n){
  const p = S.day.date.split('-').map(Number);
  const dt = new Date(p[0], p[1]-1, p[2] + n);
  openDay(iso(dt));
}
async function loadDay(){
  if (!execReady()){ S.day.rows = []; S.day.err = 'ยังไม่ได้ตั้งค่า URL หลังบ้าน — แสดงเฉพาะข้อมูลในเครื่อง'; return renderDay(); }
  S.day.loading = true; S.day.err = ''; renderDay();
  try {
    const q = EXEC_URL + '?action=day&date=' + encodeURIComponent(S.day.date) + (S.day.repOnly && S.rep ? '&rep=' + encodeURIComponent(S.rep) : '');
    const j = await readJson(await fetch(q, {redirect:'follow'}));
    S.day.rows = j.rows || [];
  } catch (err) {
    S.day.rows = []; S.day.err = String(err.message || err);
  }
  S.day.loading = false; renderDay();
}
/* รวม 2 แหล่ง: ขึ้นชีทแล้ว (จริง) + ยังค้างในเครื่อง (ต้องเห็นด้วย ไม่งั้นนึกว่าหาย) */
function dayRows(){
  const sheet = (S.day.rows || []).map(r=>({
    cust:r['รหัสร้าน'], custName:r['ชื่อร้าน'], code:r['รหัสสินค้า'], name:r['ชื่อสินค้า'],
    s:r['สต็อกที่นับ_CS'], o:r['สั่งรอบนี้_CS'], rep:r['รหัสเซล'], repName:r['ชื่อเซล'],
    at:String(r['เวลาที่ส่ง']||'').slice(11,16), rev:r['รอบที่'], status:'sent'
  }));
  const local = items.list().filter(x=>x.d === S.day.date && x.status !== 'sent'
      && (!S.day.repOnly || !S.rep || x.rep === S.rep))
    .map(x=>({cust:x.cust, custName:x.custName, code:x.code, name:x.name, s:x.s, o:x.o,
              rep:x.rep, repName:repNm(x.repName), at:x.at, rev:x.rev, status:x.status}));
  return sheet.concat(local);
}
function renderDay(){
  el('daySub').textContent = fmtISO(S.day.date) + (S.day.repOnly && S.rep ? ' · ' + repNm(REPNAME[S.rep]) : ' · ทุกเซล');
  el('dayChips').innerHTML =
    '<span class="chip'+(S.day.repOnly?' on':'')+'" onclick="setDayRep(1)">เฉพาะเซลนี้</span>'+
    '<span class="chip'+(!S.day.repOnly?' on':'')+'" onclick="setDayRep(0)">ทุกเซล</span>'+
    '<span class="chip" onclick="openDay(\''+isoToday()+'\')">วันนี้</span>';

  const rows = dayRows();
  const byStore = {};
  rows.forEach(r=>{
    const g = byStore[r.cust] = byStore[r.cust] || {cust:r.cust, name:r.custName, rep:r.repName, items:[], order:0, open:0, at:''};
    g.items.push(r); g.order += RK.num(r.o);
    if (r.status !== 'sent') g.open++;
    if ((r.at||'') > g.at) g.at = r.at || '';
  });
  /* ไม่มี deadline → ล่าสุดอยู่บน (§ Sort Rule ข้อ 2) */
  const list = Object.values(byStore).sort((a,b)=> (b.at||'').localeCompare(a.at||''));
  const totalOrder = rows.reduce((a,r)=>a + RK.num(r.o), 0);

  el('dayBody').innerHTML =
    (S.day.loading ? '<div class="empty">กำลังโหลดจากชีท…</div>' : '')+
    (S.day.err ? '<div class="pad"><div class="banner"><div class="rk-row"><b class="rk-grow rk-1line">'+esc(S.day.err)+'</b>'+
        '<button class="linkbtn rk-nogrow" onclick="loadDay()">ลองใหม่</button></div></div></div>' : '')+
    (!list.length && !S.day.loading ? '<div class="empty">วันนี้ยังไม่มีการบันทึก</div>' :
      '<div class="pad"><div class="card"><div class="rk-row"><b class="rk-grow rk-1line">รวม '+list.length+' ร้าน · '+rows.length+' รายการ</b>'+
        '<span class="rk-nogrow">สั่งรวม <b>'+fmt(totalOrder)+'</b> ลัง</span></div></div></div>'+
      list.map(g=>
        '<div class="daycard">'+
          '<div class="rk-row dayhead" onclick="this.parentElement.classList.toggle(\'open\')">'+
            '<span class="rk-grow" style="min-width:0">'+
              '<span class="rk-1line" style="display:block;font-weight:700">'+esc(g.name)+'</span>'+
              '<span class="rk-1line tiny muted" style="display:block">'+esc(g.cust)+' · '+g.items.length+' รายการ · สั่ง '+fmt(g.order)+' ลัง'+(g.at?' · '+g.at:'')+'</span>'+
            '</span>'+
            (g.open ? '<span class="badge b-hot">ค้าง '+g.open+'</span>' : '<span class="badge b-ok">ส่งครบ</span>')+
            '<span class="chev">▾</span></div>'+
          '<div class="daylist">'+ g.items.slice().sort((a,b)=>(b.at||'').localeCompare(a.at||'')).map(r=>
            '<div class="rk-row dayitem"><span class="rk-grow rk-1line">'+esc(r.name)+'</span>'+
              '<span class="rk-nogrow tiny muted">สต็อก '+r.s+' · สั่ง '+r.o+(RK.num(r.rev)>1?' · รอบ '+r.rev:'')+'</span>'+
              (r.status!=='sent'?'<span class="badge b-hot">ค้าง</span>':'')+'</div>').join('')+
          '</div>'+
        '</div>').join(''));
}
function setDayRep(v){ S.day.repOnly = !!v; loadDay(); }

/* ══════════ init ══════════ */
const qStoreBind = RK.bindSearch('#qStore', {
  onQuery: q => { S.qStore = q; renderStores(); },
  onReset: () => { S.storeF = ''; }
});
const qProdBind = RK.bindSearch('#qProd', {
  onQuery: q => { S.qProd = q; renderCard(); },
  onReset: () => { S.filter = 'all'; }      /* กฎ 4️⃣ · X ล้างฟิลเตอร์กลับ default */
});
el('btnScan').addEventListener('click', openScan);
el('btnSet').addEventListener('click', openSettings);
el('btnDay1').addEventListener('click', ()=>openDay());
el('btnDayReload').addEventListener('click', loadDay);
el('dayDate').addEventListener('change', e=>openDay(e.target.value));
el('dayPrev').addEventListener('click', ()=>shiftDay(-1));
el('dayNext').addEventListener('click', ()=>shiftDay(1));
el('entryBack').addEventListener('click', closeEntry);
document.addEventListener('keydown', e=>{ if (e.key === 'Escape' && S.entry) closeEntry(); });

/* เน็ตกลับมา = ลองส่งของที่ค้างเองเลย ไม่ต้องรอเซลกด */
window.addEventListener('online', ()=>{ const q = items.list().filter(x=>x.status==='pending'); if (q.length) sendMany(q); });
renderReps();
{ const q = items.list().filter(x=>x.status==='pending'); if (q.length) setTimeout(()=>sendMany(q), 1200); }
</script>
