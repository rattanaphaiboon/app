<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d1b3e">
<title>Rattana Audit v4.0 — ตรวจมาตรฐานสาขา</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{
  --navy:#0d1b3e;--navy-mid:#1a2f5e;--gold:#c9a84c;--gold-light:#e8c86a;
  --ok:#1fa463;--ok-bg:#e7f6ee;--bad:#d64535;--bad-bg:#fdecea;--warn:#e08a00;--warn-bg:#fff4e0;--info:#2f7fd1;
  --bg:#f4f6fb;--text:#0d1b3e;--card:#fff;--border:#dde3f0;--muted:#6b7896;--soft:#f7f9fd;
  --r:14px;--sh:0 2px 10px rgba(13,27,62,.07);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Sarabun',sans-serif;font-size:15px;line-height:1.55;background:var(--bg);color:var(--text);min-height:100dvh;overflow-x:hidden}
button{font-family:inherit;cursor:pointer;border:none;color:inherit;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
input,select,textarea{font-family:inherit;font-size:16px;color:inherit}
.hidden{display:none!important}
header{background:var(--navy);color:#fff;padding:10px 14px;position:sticky;top:env(safe-area-inset-top,0px);z-index:50;display:flex;align-items:center;gap:10px;border-bottom:3px solid var(--gold)}
.logo{font-weight:800;letter-spacing:1.5px;font-size:18px;white-space:nowrap}.logo span{color:var(--gold)}
.hsub{font-size:12px;color:rgba(255,255,255,.7);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.sp{flex:1}
.hbtn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);color:#fff;border-radius:9px;padding:7px 11px;font-size:13px;display:flex;align-items:center;gap:6px;white-space:nowrap}
main{max-width:860px;margin:0 auto;padding:16px 16px 120px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--sh);padding:16px;margin-bottom:14px}
h2{font-size:19px;font-weight:700;margin-bottom:4px}
h3{font-size:16px;font-weight:700}
.muted{color:var(--muted)}.sm{font-size:13px}.xs{font-size:12px}
.row{display:flex;align-items:center;gap:10px}.wrap{flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:11px;padding:11px 16px;font-weight:700;font-size:15px;background:var(--soft);border:1px solid var(--border)}
.btn.pri{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.gold{background:var(--gold);color:var(--navy);border-color:var(--gold)}
.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn.full{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:3px 10px;font-size:12.5px;font-weight:600;background:var(--soft);border:1px solid var(--border);white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok);border-color:#bfe6cf}
.chip.bad{background:var(--bad-bg);color:var(--bad);border-color:#f5c6c0}
.chip.warn{background:var(--warn-bg);color:var(--warn);border-color:#f6d9a6}
.chip.gold{background:rgba(201,168,76,.15);color:#8a6d1c;border-color:rgba(201,168,76,.5)}
.note{border-radius:11px;padding:10px 12px;font-size:13.5px;background:var(--soft);border:1px solid var(--border)}
.note.warn{background:var(--warn-bg);border-color:#f6d9a6}
.note.ok{background:var(--ok-bg);border-color:#bfe6cf}
.note.bad{background:var(--bad-bg);border-color:#f5c6c0}
/* login */
.login{max-width:420px;margin:40px auto;text-align:center}
.login .big{font-size:44px}
.pick{display:grid;gap:8px;margin-top:14px;text-align:left}
.pick button{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;font-size:15px;text-align:left;gap:10px}
.pick button:hover{border-color:var(--gold)}
/* home */
.hello{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin:4px 2px 14px;flex-wrap:wrap}
.br-grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.br{padding:0;overflow:hidden}
.br-top{padding:16px;display:flex;gap:16px;align-items:center}
.ring{--p:0;--c:var(--ok);width:92px;height:92px;border-radius:50%;flex-shrink:0;background:conic-gradient(var(--c) calc(var(--p)*1%),#e8ecf5 0);display:grid;place-items:center}
.ring>div{width:72px;height:72px;border-radius:50%;background:var(--card);display:grid;place-items:center;text-align:center;line-height:1.1}
.ring b{font-size:22px}.ring small{font-size:12px;color:var(--muted)}
.br-name{font-size:21px;font-weight:800}
.br-meta{font-size:13px;color:var(--muted)}
.trend{font-size:12.5px;font-weight:700}
.trend.up{color:var(--ok)}.trend.dn{color:var(--bad)}
.br-todo{border-top:1px dashed var(--border);padding:12px 16px;background:var(--soft);display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.br-act{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 16px 16px}
/* audit */
.abar{position:sticky;top:57px;z-index:40;background:var(--bg);padding:10px 0 8px;margin:-16px 0 10px}
.abar-in{background:var(--navy);color:#fff;border-radius:var(--r);padding:12px 14px}
.prog{height:8px;border-radius:99px;background:rgba(255,255,255,.18);overflow:hidden;margin-top:8px}
.prog>i{display:block;height:100%;background:var(--gold);width:0;transition:width .25s}
.cats{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cats button{flex-shrink:0;background:var(--card);border:1px solid var(--border);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600}
.cats button.on{background:var(--gold);border-color:var(--gold);color:var(--navy)}
.cat-h{display:flex;align-items:center;gap:8px;margin:20px 2px 10px;font-weight:800;font-size:16px}
.cat-h .ln{flex:1;height:1px;background:var(--border)}
.item{padding:0;overflow:hidden;border-left:5px solid var(--border);scroll-margin-top:190px}
.item.pass{border-left-color:var(--ok)}.item.fail{border-left-color:var(--bad)}
.it-h{padding:14px 14px 4px;display:flex;gap:12px}
.no{width:34px;height:34px;border-radius:10px;background:var(--navy);color:#fff;font-weight:800;display:grid;place-items:center;flex-shrink:0;font-size:14px}
.it-t{font-weight:700;font-size:15.5px;line-height:1.45}
.it-b{padding:4px 14px 14px 60px}
.key{background:#fff8e6;border:1px solid #f0d99a;border-radius:10px;padding:8px 11px;font-size:14px;white-space:pre-line;margin-top:8px}
.key b{color:#8a6d1c;font-size:12px;display:block}
details.crit{margin-top:8px;font-size:13.5px}
details.crit summary{cursor:pointer;color:var(--info);font-weight:600;list-style:none}
details.crit summary::-webkit-details-marker{display:none}
details.crit div{white-space:pre-line;color:#3a4766;background:var(--soft);border-radius:10px;padding:10px 12px;margin-top:6px;max-height:320px;overflow:auto}
.prev{margin-top:8px;font-size:12.5px}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.yn button{border-radius:12px;padding:13px 8px;font-size:16px;font-weight:800;background:var(--card);border:2px solid var(--border)}
.yn .y.on{background:var(--ok);border-color:var(--ok);color:#fff}
.yn .n.on{background:var(--bad);border-color:var(--bad);color:#fff}
.yn .y:not(.on){color:var(--ok)}.yn .n:not(.on){color:var(--bad)}
textarea{width:100%;border:1px solid var(--border);border-radius:10px;padding:10px 12px;min-height:74px;resize:vertical;background:#fff;margin-top:10px}
textarea.need{border-color:var(--bad);background:#fffafa}
input.in{width:100%;border:1px solid var(--border);border-radius:10px;padding:10px 12px;background:#fff}
.lbl{font-size:12.5px;font-weight:700;color:var(--muted);margin:10px 0 0;display:block}
.photos{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.photos img{width:64px;height:64px;object-fit:cover;border-radius:9px;border:1px solid var(--border)}
.ph-add{border:1px dashed var(--muted);border-radius:9px;height:40px;padding:0 12px;display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);background:var(--card);cursor:pointer}
.bbar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-top:1px solid var(--border);padding:10px 16px max(10px,env(safe-area-inset-bottom))}
.bbar-in{max-width:860px;margin:0 auto;display:flex;gap:10px;align-items:center}
/* result */
.score-hero{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.score-hero .ring{width:120px;height:120px}.score-hero .ring>div{width:94px;height:94px}.score-hero .ring b{font-size:28px}
.bars{display:grid;gap:9px;margin-top:6px}
.bar{display:grid;grid-template-columns:150px 1fr 64px;gap:10px;align-items:center;font-size:13.5px}
.bar .t{height:12px;border-radius:99px;background:#eceff6;overflow:hidden}
.bar .t>i{display:block;height:100%;border-radius:99px}
.bar .v{text-align:right;font-weight:700}
.fx{border-left:5px solid var(--bad)}
.fx.done{border-left-color:var(--ok)}
.fx-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 12px}
.tabs button{flex-shrink:0;padding:8px 14px;border-radius:10px;background:var(--card);border:1px solid var(--border);font-weight:700;font-size:13.5px}
.tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:12px;font-weight:600;z-index:99;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:90vw;text-align:center}
.modal{position:fixed;inset:0;background:rgba(13,27,62,.45);z-index:120;display:grid;place-items:center;padding:16px}
.th{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.th img{width:62px;height:62px;object-fit:cover;border-radius:10px;cursor:zoom-in;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.who-l{margin-top:6px;font-size:13px;color:var(--muted);white-space:normal}.who-l b{color:var(--ink)}
.zoom{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.88);display:grid;place-items:center;padding:16px;cursor:zoom-out}
.zoom img{max-width:100%;max-height:86vh;border-radius:10px;object-fit:contain}
.zoom button{position:fixed;top:14px;right:14px;background:#fff;color:#111;border:0;border-radius:99px;padding:8px 14px;font-weight:800;font-family:inherit}
.fx-pg img{cursor:zoom-in}
.fx-ph{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.fx-pc{border-radius:14px;padding:10px;border:1.5px solid}
.fx-pc.bf{background:#fff6f5;border-color:#f7c9c2}.fx-pc.af{background:#effaf3;border-color:#bfe8cf}
.fx-pl{font-weight:800;font-size:14.5px;margin-bottom:8px}.bf .fx-pl{color:#c0392b}.af .fx-pl{color:#0a7a45}
.fx-pg{display:flex;flex-wrap:wrap;gap:6px}
.fx-pg img{width:58px;height:58px;object-fit:cover;border-radius:10px;display:block}
.fx-new{position:relative}.fx-new button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;background:#333;color:#fff;border:0;font-size:11px;cursor:pointer;padding:0}
.fx-add{width:58px;height:58px;border-radius:10px;border:1.5px dashed #b9c0cc;background:#fff;display:grid;place-content:center;text-align:center;cursor:pointer;font-size:20px;line-height:1}
.fx-add small{font-size:10.5px;color:var(--muted);font-weight:700;margin-top:2px}
.fx-pn{grid-column:1/-1;font-size:12.5px;color:var(--muted);text-align:center}
.ds-in{max-width:420px;text-align:center;max-height:88vh;overflow:auto}
.ds-ic{font-size:44px;line-height:1}.ds-t{font-size:21px;font-weight:800;margin-top:6px}.ds-s{color:var(--muted);font-size:14px;margin-top:2px}
.ds-g{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0 6px}
.ds-g>div{border-radius:16px;padding:14px 8px}.ds-g b{display:block;font-size:40px;font-weight:800;line-height:1.1}.ds-g span{font-weight:700;font-size:15px}
.ds-ok{background:#e3f6ec;color:#0a7a45}.ds-ng{background:#fde8e6;color:#c0392b}
.ds-all{color:var(--muted);font-size:13.5px}
.ds-lh{text-align:left;font-weight:800;margin:14px 0 6px;color:#c0392b}
.ds-l{text-align:left;margin:0;padding-left:0;list-style:none;display:grid;gap:6px}
.ds-l li{background:#fff6f5;border:1px solid #f7d4cf;border-radius:10px;padding:8px 10px;font-size:14px}.ds-l small{display:block;color:var(--muted);margin-top:2px}
.ds-good{margin-top:14px;font-weight:700;color:#0a7a45}
.ds-b{display:flex;gap:10px;margin-top:16px}.ds-b .btn{flex:1;min-height:46px;font-size:15.5px}
.modal-in{background:var(--card);border-radius:16px;padding:20px;max-width:380px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.3)}
.sm-btn{padding:5px 11px;font-size:12.5px;border-radius:99px}
.locked{background:var(--soft);border:1px dashed var(--border);border-radius:12px;padding:12px;margin-top:12px}
.item.is-locked{opacity:.92}
.cat-h{flex-wrap:wrap}
.demo-pill{background:var(--warn);color:#fff;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px}
.spin{width:36px;height:36px;border:4px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:sp 1s linear infinite;margin:40px auto 10px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (max-width:560px){
  .it-b{padding-left:14px}
  .bar{grid-template-columns:104px 1fr 52px;font-size:12.5px}
  .fx-grid{grid-template-columns:1fr}
  .hsub{display:none}
  .logo{font-size:15.5px;letter-spacing:1px}
  .hl{display:none}
  #demoPill{display:none}
  .hbtn{padding:6px 9px;font-size:12.5px}
}
/* v1.2 หน้าตรวจแบบง่าย */
.item{padding:16px;border-left-width:6px}
.item .it-t{font-size:17px;line-height:1.5;font-weight:700}
.item .key{font-size:15px;margin-top:10px;background:#fff8e6;border-color:#f0d99a}
.item .prev{font-size:13px;color:var(--warn);margin-top:8px}
.item details.crit{margin-top:8px}
.item .yn{margin-top:14px}
.item .yn button{padding:16px 8px;font-size:18px}
.who{font-size:13px;color:var(--muted);margin-top:12px;font-weight:600}
.who.me{color:var(--ok)}
.locked{margin-top:10px;background:var(--soft);border-radius:12px;padding:12px 14px;font-size:14.5px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.link-btn{background:none;color:var(--info);font-weight:700;font-size:14px;padding:4px 0;margin-left:auto}
.link-sm{position:relative;color:var(--info);font-weight:700;margin-left:6px;cursor:pointer}
.link-sm input{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}
.pbar{height:10px;border-radius:99px;background:#e8ecf5;overflow:hidden;margin-top:12px}
.pbar>i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .3s}
.pbar.sm{height:6px;margin-top:8px;background:rgba(255,255,255,.2)}
.pbar.sm>i{background:var(--gold)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;background:var(--card);border:2px solid var(--border);border-radius:16px;padding:14px;min-height:160px;box-shadow:var(--sh)}
.tile-ic{font-size:28px;line-height:1}
.tile-n{font-size:16px;font-weight:800;line-height:1.3;margin-top:4px}
.tile-c{font-size:13px;color:var(--muted)}
.tile-bar{width:100%;height:6px;border-radius:99px;background:#e8ecf5;overflow:hidden;margin-top:auto}
.tile-bar>i{display:block;height:100%;background:var(--ok)}
.tile-s{font-size:12.5px;font-weight:700;margin-top:6px}
.tile{position:relative;--tc:#c9a24a;border-color:color-mix(in srgb,var(--tc) 45%,#fff);background:linear-gradient(165deg,color-mix(in srgb,var(--tc) 16%,#fff),#fff 70%)}
.tile .tile-ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--tc) 22%,#fff);font-size:26px}
.tile .tile-n{color:color-mix(in srgb,var(--tc) 70%,#111)}
.tile .tile-bar{background:color-mix(in srgb,var(--tc) 14%,#eef0f4)}.tile .tile-bar>i{background:var(--tc)}
.tile .tile-s{align-self:stretch;text-align:center;border-radius:99px;padding:4px 8px;background:color-mix(in srgb,var(--tc) 14%,#fff);color:color-mix(in srgb,var(--tc) 75%,#111)}
.tile:hover{transform:translateY(-2px);box-shadow:0 8px 20px color-mix(in srgb,var(--tc) 25%,transparent)}
.tile-ok{position:absolute;top:10px;right:10px;width:26px;height:26px;border-radius:50%;background:#1f9d55;color:#fff;font-weight:800;display:grid;place-items:center;font-size:14px}
.tile.mine{border-width:3px;border-color:var(--tc)}
.ap-h{background:linear-gradient(135deg,color-mix(in srgb,var(--bc) 14%,#fff),#fff 60%);border:2px solid color-mix(in srgb,var(--bc) 35%,#fff)}
.ap-h .pbar i{background:var(--bc)}

.tile.mine .tile-s{background:var(--tc);color:#fff}
.tile.busy{background:var(--soft);opacity:.8}
.tile.busy{filter:grayscale(.5)}.tile.busy .tile-s{background:#fff3d6;color:#a35f00}
.tile.done .tile-s{background:#e3f6ec;color:#0a7a45}
.cbar{position:sticky;top:calc(var(--hdr,56px) + env(safe-area-inset-top,0px));z-index:40;background:var(--bg);padding:8px 0;margin:-16px 0 12px}
.cbar-in{background:var(--navy);color:#fff;border-radius:14px;padding:10px 14px 12px}
.cbar-t{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:18px;margin-top:4px}
.cbar-t span{font-size:14px;opacity:.85}
.back{background:none;color:var(--gold-light);font-weight:700;font-size:14px;padding:2px 0}
/* v1.3 มือถือ: ปุ่มกดง่าย (สูง ≥ 44px) · แท็บไม่ต้องเลื่อนข้าง */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--navy)}
.hbtn{min-height:40px;min-width:44px;justify-content:center}
.back{min-height:40px;padding:8px 12px 8px 0;font-size:15px}
details.crit summary{padding:10px 0;font-size:14.5px}
.link-sm{display:inline-flex;align-items:center;min-height:36px;padding:0 10px;border:1px solid var(--border);border-radius:99px;background:var(--card);margin-left:8px;font-size:13.5px}
.link-btn{min-height:40px;padding:8px 4px}
.tabs button{flex:1 1 auto;min-height:44px;padding:10px 12px;font-size:14px}
.ph-add{height:44px;font-size:14px}
.br-act .btn,.br-todo .btn{min-height:48px}
.tiles{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
.photos img{width:72px;height:72px}
.bbar .btn{min-height:46px}
@media (max-width:560px){
  main{padding:12px max(16px,env(safe-area-inset-right,0px)) 130px max(16px,env(safe-area-inset-left,0px))}
  .card{padding:14px}
  .item{padding:14px}
  .item .it-t{font-size:16.5px}
  .tile{min-height:140px;padding:12px}
  .tile-n{font-size:15.5px}
  .br-top{padding:14px;gap:12px}
  .ring{width:82px;height:82px}.ring>div{width:64px;height:64px}.ring b{font-size:20px}
  .br-name{font-size:19px}
  .score-hero .ring{width:104px;height:104px}.score-hero .ring>div{width:82px;height:82px}
  .bar{grid-template-columns:96px 1fr 44px}
  .bbar{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.chips-f{flex-wrap:wrap}.chips-f button.cf-done{color:#0a7a45;border-color:#bfe8cf;background:#effaf3}.chips-f button.cf-done.on{background:#1f9d55;border-color:#1f9d55;color:#fff}

function parseCSV(t){const out=[];let row=[],f='',q=false;for(let i=0;i<t.length;i++){const c=t[i];

/* ---------- data model ---------- */
// DATA: A ครั้งที่ B สาขา C ใช้/ไม่ใช้ D หัวข้อหลัก E ที่ F จุดตรวจ G เกณฑ์ H คำอธิบายเพิ่มเติม I ผล J comment K สาเหตุ L การแก้ไข M วันที่เสร็จ N ผู้รับผิดชอบ O วันที่ตรวจ P รูปตรวจ Q รูปหลังแก้
function buildModel(table){
  const rows=[];
  for(let i=1;i<table.length;i++){const r=table[i];if(!r[1]&&!r[4])continue;
    rows.push({round:(r[0]||'').trim(),branch:(r[1]||'').trim(),use:(r[2]||'').trim()==='ใช้',cat:(r[3]||'').trim(),no:+(r[4]||0),
      title:(r[5]||'').trim(),crit:(r[6]||'').trim(),note:(r[7]||'').trim(),res:(r[8]||'').trim(),comment:(r[9]||'').trim(),
      cause:(r[10]||'').trim(),fix:(r[11]||'').trim(),done:(r[12]||'').trim(),owner:(r[13]||'').trim(),date:(r[14]||'').trim(),
      photo:(r[15]||'').trim(),photoAfter:(r[16]||'').trim(),by:(r[17]||'').trim(),at:(r[18]||'').trim()});}
  // คลังข้อความของแต่ละข้อ (เอาจากแถวที่มีข้อความ)
  const items={};
  rows.forEach(r=>{const it=items[r.no]||(items[r.no]={no:r.no,cat:r.cat,title:'',crit:'',note:''});
    if(r.title&&!it.title)it.title=r.title;if(r.crit&&!it.crit)it.crit=r.crit;if(r.note)it.note=r.note;if(r.cat)it.cat=r.cat;});
  // แบ่งเป็นชุด (สาขา × ครั้งที่) — ข้อ 1 เริ่มชุดใหม่
  const blocks=[];let cur=null;
  rows.forEach(r=>{if(!cur||cur.branch!==r.branch||r.no<=cur.lastNo){cur={branch:r.branch,rows:[],lastNo:0};blocks.push(cur);}cur.rows.push(r);cur.lastNo=r.no;});
  blocks.forEach(b=>{
    const rd=b.rows.map(r=>+r.round).filter(Boolean);b.round=rd.length?Math.max(...rd):0;
    b.rows.forEach(r=>{if(!r.round)r.round=String(b.round);});
    const ds=b.rows.map(r=>parseD(r.date)).filter(Boolean);b.date=ds.length?new Date(Math.max(...ds)):null;
    calcBlock(b);});
  return {rows,items,blocks};
}

const typeOf=k=>CONFIG.types.find(t=>t.key===k)||CONFIG.types[0];
function useType(k){st.type=typeOf(k).key;const m=st.models[st.type]||{rows:[],items:{},blocks:[]};st.rows=m.rows;st.items=m.items;st.blocks=m.blocks;lsSet('type',st.type);}
function typesFor(){return CONFIG.types.filter(t=>{const m=st.models[t.key];if(isHQ())return true;return m&&m.blocks.some(b=>b.branch===st.user.branch);});}
function calcBlock(b){
  const used=b.rows.filter(r=>r.use);b.used=used;
  b.pass=used.filter(r=>r.res==='1').length;b.fail=used.filter(r=>r.res==='0').length;
  b.scored=b.pass+b.fail;b.total=used.length;b.complete=b.total>0&&b.scored>=b.total;
  b.score=pct(b.pass,b.scored);
}
const branches=()=>[...new Set(st.blocks.map(b=>b.branch))];
const blocksOf=br=>st.blocks.filter(b=>b.branch===br).sort((a,b)=>a.round-b.round);
const blockOf=(br,rd)=>st.blocks.find(b=>b.branch===br&&b.round===+rd);

function nextTask(br){
  const bl=blocksOf(br);const last=bl[bl.length-1];
  if(last&&!last.complete)return {mode:'continue',round:last.round,date:last.date,block:last};
  return {mode:'new',round:(last?last.round:0)+1,date:new Date(),block:last};
}
const BR_PAL=['#7c4dff','#0096c7','#e76f51','#2a9d8f','#d6336c','#f4a100'];
const brCol=bi=>BR_PAL[bi%BR_PAL.length];
function resBox(b){const fails=b.used.filter(r=>r.res==='0');const fx=fails.filter(r=>r.fix).length;const sc=Math.round(b.score),col=colorOf(b.score);
  return `<div class="rb"><div class="rb-ring" style="--p:${sc};--c:${col}"><div><b>${sc}%</b><small>คะแนนที่ได้</small></div></div>
    <div class="rb-g"><div class="rb-ok"><b>${b.pass}</b><span>✅ ผ่าน</span></div><div class="rb-ng"><b>${fails.length}</b><span>❌ ไม่ผ่าน</span></div><div class="rb-fx"><b>${fx}<i>/${fails.length}</i></b><span>🛠️ แก้แล้ว</span></div></div>
    <div class="rb-n">ตรวจทั้งหมด ${b.scored} ข้อ · ได้ ${b.pass} คะแนน จาก ${b.scored}</div></div>`;}
function renderBranchHome(brs,ty,tl){

    if(!last)return `<div class="sb" style="--bc:${brCol(branches().indexOf(br))}"><div class="sb-band"><span class="sb-ic">${ty.icon}</span><div class="sb-nm"><small>สาขาของฉัน</small>${ty.label} ${esc(br)}</div></div><div class="sb-none">ยังไม่มีผลตรวจ</div>${run?`<div class="sb-run">🔄 HQ กำลังตรวจครั้งที่ ${run.round} · ${run.scored}/${run.total} ข้อ</div>`:''}</div>`;
    const fails=last.used.filter(r=>r.res==='0');const wrote=fails.filter(r=>r.fix).length;const left=fails.length-wrote;

    return `<div class="sb" style="--bc:${brCol(branches().indexOf(br))}"><div class="sb-band"><span class="sb-ic">${ty.icon}</span><div class="sb-nm"><small>สาขาของฉัน</small>${ty.label} ${esc(br)}</div></div>

    ${cards||`<div class="card empty-ty"><div class="ety-ic">${ty.icon}</div><h3>ยังไม่มีผลตรวจของสาขา${esc(st.user.branch)}</h3></div>`}
    <p class="xs muted" style="margin-top:14px;text-align:center"><a href="#" onclick="reload();return false">🔄 โหลดใหม่</a></p>`;

function renderHome(){
  if(!st.typePicked&&typesFor().length>1)return renderTypePick();
  const brs=branches().filter(canSee);
  const ty=typeOf(st.type),tl=typesFor();
  if(!isHQ())return renderBranchHome(brs,ty,tl);
  let sumScore=0,nScore=0,sumOpen=0,sumGot=0,sumTot=0,nRun=0,nDone=0;
  const cards=brs.map((br,bi)=>{
    const bl=blocksOf(br);const done=bl.filter(b=>b.complete);const last=done[done.length-1];const prev=done[done.length-2];
    const t=nextTask(br);const draft=lsGet('draft:'+st.type+':'+br+':'+t.round,null);
    const diff=last&&prev?Math.round((last.score-prev.score)*10)/10:null;
    const fails=last?last.used.filter(r=>r.res==='0'):[];const fixed=fails.filter(r=>r.fix).length;const openFix=fails.length-fixed;
    const answered=t.mode==='continue'?t.block.scored:0;const dAns=draft?Object.keys(draft.ans||{}).length:0;const started=dAns||answered;
    if(last){sumScore+=last.score;nScore++;sumOpen+=openFix;}
    const tot=t.mode==='continue'?t.block.total:(last?last.total:0);const got=Math.min(tot,Math.max(answered,dAns));
    sumGot+=got;sumTot+=tot;if(started&&got<tot)nRun++;if(tot&&got>=tot)nDone++;
    const pg=tot?Math.round(got/tot*100):0,pcol=pg>=100?'#2a9d55':pg>0?'#1f6fd1':'#9aa3b2';
    const run=started&&got<tot;
    const btn=`<button class="lb-go" onclick="startAudit('${esc(br)}')">▶ ${started?'ตรวจต่อ':'เริ่มตรวจ'} ครั้งที่ ${t.round}</button>`;
    let body;
    if(run)body=`<div class="sb-tag run">🔄 กำลังตรวจ ครั้งที่ ${t.round}</div>
      <div class="sb-sc" style="--c:#1f6fd1"><b>${pg}%</b><span class="lb-bar"><i style="width:${pg}%;background:#1f6fd1"></i></span></div>
      <div class="sb-r">ตรวจแล้ว ${got} จาก ${tot} ข้อ</div>${btn}`;
    else if(last)body=`<div class="sb-tag done">✅ ตรวจเสร็จแล้ว ครั้งที่ ${last.round}${last.date?' · '+fmtD(last.date):''}</div>${resBox(last)}
      <div class="sb-2"><button class="sb-all" onclick="openResult('${esc(br)}',${last.round},'sum')">📊 ดูผลทุกข้อ</button>${btn}</div>`;
    else body=`<div class="sb-tag">⏳ ยังไม่เคยตรวจ</div>${btn}`;
    return {sc:(run?2000:0)+(last?last.score:0),html:`<div class="sb" style="--bc:${brCol(branches().indexOf(br))}"><div class="sb-band"><span class="sb-ic">${ty.icon}</span><div class="sb-nm"><small>${ty.sub}</small>${ty.label} ${esc(br)}</div><span class="sb-no">#RANK#</span></div>${body}</div>`};}).sort((a,b)=>b.sc-a.sc).map((r,i)=>r.html.replace('#RANK#',i+1)).join('');
  const avg=nScore?Math.round(sumScore/nScore):null;
  const hero=`<div class="bh tyc-${ty.key}">
      <span class="tyc-bg" aria-hidden="true">${ty.icon}</span>
      ${tl.length>1?`<button class="bh-back" onclick="st.typePicked=false;renderHome()">‹ เลือกประเภท</button>`:''}
      <div class="bh-row"><span class="bh-ic">${ty.icon}</span><div><div class="bh-t">${ty.label}</div><div class="bh-s">${ty.sub} · ${isHQ()?'ผู้ตรวจ HQ':'สาขา'+esc(st.user.branch)} · คุณ${esc(short(st.user.name))}</div></div></div>
      ${brs.length?`<div class="bh-stats"><div><b>${brs.length}</b><small>สาขา</small></div><div><b>${nRun}</b><small>กำลังตรวจ</small></div><div><b>${sumGot}/${sumTot}</b><small>ข้อที่ตรวจแล้ว</small></div></div>`:''}
    </div>`;
  $('#hsub').textContent=ty.label+' · '+ty.sub;
  $('#app').innerHTML=`${hero}
    ${brs.length?`<div class="bcs">${cards}</div>`:`<div class="card empty-ty"><div class="ety-ic">${ty.icon}</div><h3>ยังไม่มีหัวข้อตรวจของ${ty.label}</h3><p>เพิ่มหัวข้อในแท็บ <b>${esc(ty.tab)}</b> ของชีต<br>ใช้คอลัมน์เหมือนแท็บ DATA (ครั้งที่ · สาขา · ใช้/ไม่ใช้ · หัวข้อหลัก · ที่ · จุดตรวจสอบ …)<br>ใส่ครบแล้วกด 🔄 โหลดใหม่</p></div>`}
    <p class="xs muted" style="margin-top:14px;text-align:center">ข้อมูลจากแท็บ ${esc(ty.tab)} · ตรวจเฉพาะหัวข้อที่ตั้งเป็น "ใช้" · <a href="#" onclick="reload();return false">🔄 โหลดใหม่</a></p>`;
}

/* ---------- audit (ตรวจหลายคนพร้อมกัน · แบบง่าย v1.2) ----------

function nowTxt(){const d=new Date();return d.getDate()+'/'+(d.getMonth()+1)+'/'+d.getFullYear()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
const hhmm=s=>(String(s||'').match(/\d{1,2}:\d{2}/)||[''])[0];
const catsOf=()=>[...new Set(st.list.map(i=>i.cat))];
const itemsOf=c=>st.list.filter(i=>i.cat===c);

const CAT_ICON={'การบริการ':'🙂','เสื่อมสภาพ':'🥐','เตรียมอาหาร':'🍳','หมดอายุ':'📅','Cleanliness(ความสะอาด)':'🧽','การสื่อสาร':'📢','การบริหาร':'📋','สินค้า ทั่วไป':'🛒','Value(คุณค่า)':'🏷️','สะดวก':'🧰','สินค้าขาด':'📦'};

function startAudit(br){
  if(PENDING){toast('ยังเริ่มตรวจไม่ได้ · รอเปิดระบบบันทึกผล (หลังบ้าน) ก่อนค่ะ',4000);return;}
  const t=nextTask(br);const key='draft:'+st.type+':'+br+':'+t.round;
  const src=t.block?t.block.rows:[];
  const list=src.filter(r=>r.use).map(r=>({...st.items[r.no],no:r.no,cat:r.cat||st.items[r.no].cat}));
  const prevDone=blocksOf(br).filter(b=>b.complete&&b.round<t.round).pop();
  let d=lsGet(key,null);
  if(!d){d={br,round:t.round,mode:t.mode,date:isoOf(t.date||new Date()),ans:{},cm:{},ph:{},by:{}};
    if(t.mode==='continue')t.block.used.forEach(r=>{if(r.res!==''){d.ans[r.no]=r.res;d.by[r.no]={name:r.by||'',at:r.at||''};}if(r.comment)d.cm[r.no]=r.comment;});}
  d.by=d.by||{};
  st.draft=d;st.draftKey=key;st.list=list;st.prevDone=prevDone;st.cat=null;st.claims=st.claims||{};st.unlock={};
  st.view='audit';$('#btnHome').classList.remove('hidden');window.scrollTo(0,0);
  if(DEMO)demoSeed();
  renderAudit();startLive();
}

function startLive(){stopLive();pullLive();st.liveT=setInterval(()=>{if(st.view!=='audit'){stopLive();return;}pullLive();},10000);}
function stopLive(){if(st.liveT)clearInterval(st.liveT);st.liveT=null;}
async function pullLive(){
  const d=st.draft;let o;
  try{
    if(DEMO)o=demoLive();
    else{o=await gasPost({action:'live',token:st.user.token,branch:d.br,round:d.round});if(!o.ok)throw new Error(o.error);}
    st.liveOk=true;
  }catch(e){st.liveOk=false;setLive();return;}
  const changed=[];
  Object.entries(o.items||{}).forEach(([no,v])=>{no=+no;if(st.pending&&st.pending[no])return;
    if(d.ans[no]!==v.res||(d.by[no]||{}).name!==v.by||(d.cm[no]||'')!==(v.comment||'')){
      if(v.by===me()&&d.ans[no]!=null)return;
      d.ans[no]=v.res;d.cm[no]=v.comment||'';d.by[no]={name:v.by,at:v.at};changed.push(no);}});
  const cl=JSON.stringify(o.claims||{})!==JSON.stringify(st.claims);st.claims=o.claims||{};
  saveDraft();
  if(st.cat==null){if(cl||changed.length)renderAudit();}
  else{changed.forEach(no=>{const el=$('#it'+no);if(el&&document.activeElement!==el.querySelector('textarea'))el.outerHTML=itemCard(st.list.find(i=>i.no===no));});
    if(changed.length){updateProg();renderBbar();}}
  setLive();
}

async function pushItem(no,force){

  const body={action:'saveItem',token:st.user.token,branch:d.br,round:d.round,no,res:d.ans[no]==null?'':d.ans[no],comment:d.cm[no]||'',date:toDMY(fromIso(d.date)),force:!!force};

  let rows='',lastCat='';
  shown.forEach(r=>{
    if(r.cat!==lastCat){lastCat=r.cat;const cu=b.used.filter(x=>x.cat===r.cat&&x.res!=='');const cp=cu.filter(x=>x.res==='1').length;
      rows+=`<tr class="grp"><td colspan="5">${esc(catName(r.cat))} <span>ผ่าน ${cp}/${cu.length}</span></td></tr>`;}
    const fail=r.res==='0',done=parseD(r.done);
    const fixCell=!fail?'':r.fix
      ?`<div>${esc(r.fix)}</div><div class="sub">${r.owner?'👤 '+esc(r.owner):''}${done?' · เสร็จ '+fmtD(done):''}</div>${canEdit?`<button class="tbtn ghost" onclick="openFix(${r.no})">แก้ไข</button>`:''}`
      :canEdit?`<button class="tbtn" onclick="openFix(${r.no})">✍️ เขียนแก้ไข</button>`:'<span class="sub">รอสาขาแก้ไข</span>';
    rows+=`<tr class="${fail?(r.fix?'is-fixed':'is-fail'):''}">
      <td class="c-no" data-l="ที่">${r.no}</td>
      <td class="c-t" data-l="จุดตรวจ">${esc(st.items[r.no].title)}${fail&&isRep(r)?' <span class="rep">ไม่ผ่านซ้ำ</span>':''}</td>
      <td class="c-r" data-l="ผล">${r.res==='1'?'<span class="ok">✓ ผ่าน</span>':fail?'<span class="bad">✗ ไม่ผ่าน</span>':'<span class="muted">–</span>'}</td>
      <td class="c-f" data-l="สิ่งที่พบ">${fail?esc(r.comment||'-')+thumbs(r.photo):''}${fail?whoLine(r):''}</td>
      <td class="c-x" data-l="การแก้ไข">${fixCell}</td></tr>`;});
  h+=`<div class="tbl-wrap"><table class="rt"><thead><tr><th>ที่</th><th>จุดตรวจ</th><th>ผล</th><th>สิ่งที่พบ</th><th>การแก้ไข / ป้องกัน</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  $('#app').innerHTML=h;
}
function openFix(no){
  const b=blockOf(st.branch,st.round),r=b.rows.find(x=>x.no===no),done=parseD(r.done);
  const w=document.createElement('div');w.className='modal';w.id='fixModal';
  w.innerHTML=`<div class="modal-in fx-modal">
    <div class="xs muted">ข้อ ${r.no} · ${esc(catName(r.cat))}</div>
    <div style="font-weight:800;font-size:16px;margin:2px 0 8px">${esc(st.items[r.no].title)}</div>
    <div class="found"><span>สิ่งที่พบ</span>${esc(r.comment||'-')}${thumbs(r.photo)}</div>
    ${whoLine(r)}
    <label class="lbl" for="f${no}">การแก้ไข / ป้องกัน <span style="color:var(--bad)">*</span></label>
    <textarea id="f${no}" placeholder="เช่น ทำความสะอาดทุกเช้า และให้หัวหน้ากะตรวจซ้ำ">${esc(r.fix)}</textarea>
    <label class="lbl" for="c${no}">สาเหตุ</label>
    <textarea id="c${no}" placeholder="เช่น ไม่มีคนรับผิดชอบเช็คจุดนี้" style="min-height:56px">${esc(r.cause)}</textarea>
    <div class="fx-grid">
      <div><label class="lbl" for="d${no}">เสร็จวันที่</label><input class="in" type="date" id="d${no}" value="${done?isoOf(done):''}"></div>
      <div><label class="lbl" for="o${no}">ผู้รับผิดชอบ</label><input class="in" id="o${no}" value="${esc(r.owner)}" placeholder="ชื่อพนักงาน"></div>
    </div>
    <div class="fx-ph" id="fxPh"></div>
    <div class="row" style="margin-top:16px;justify-content:flex-end;gap:8px"><button class="btn" onclick="document.getElementById('fixModal').remove()">ยกเลิก</button><button class="btn pri" onclick="saveFix(${no})">💾 บันทึก</button></div>
  </div>`;
  w.addEventListener('click',e=>{if(e.target===w)w.remove();});
  st.fxPh={b:[],a:[],r};document.body.appendChild(w);fxRender();
}
function thumbs(s){const l=phList(s);return l.length?`<div class="th">${l.map(u=>`<img src="${esc(u)}" alt="รูปที่ตรวจ" loading="lazy" onclick="event.stopPropagation();zoomImg(this.src)">`).join('')}</div>`:'';}
function whoLine(r){if(!r.by&&!r.at&&!r.date)return '';const at=String(r.at||'').trim().split(/\s+/);const dt=at[0]&&/\//.test(at[0])?at[0]:r.date;const tm=at.find(x=>/^\d{1,2}:\d{2}/.test(x));
  return `<div class="who-l">👤 ตรวจโดย <b>${esc(r.by?'คุณ'+short(r.by):'-')}</b>${dt?` · 📅 ${esc((dt instanceof Date?fmtD(dt):parseD(dt)?fmtD(parseD(dt)):dt))}`:''}${tm?` · 🕐 ${esc(tm)} น.`:''}</div>`;}
function zoomImg(u){const big=String(u).replace(/sz=w\d+/,'sz=w2000');const w=document.createElement('div');w.className='zoom';w.innerHTML=`<img src="${esc(big)}" alt=""><button aria-label="ปิด">✕ ปิด</button>`;w.onclick=()=>w.remove();document.body.appendChild(w);}
const phList=s=>String(s||'').split(/\n/).map(x=>x.trim()).filter(Boolean);
function fxRender(){const p=st.fxPh,box=document.getElementById('fxPh');if(!box)return;
  const col=(k,lab,old,cls)=>`<div class="fx-pc ${cls}"><div class="fx-pl">${lab}</div><div class="fx-pg">
    ${phList(old).map(u=>`<img src="${esc(u)}" alt="" onclick="zoomImg(this.src)">`).join('')}
    ${p[k].map((d,i)=>`<span class="fx-new"><img src="${d}" alt=""><button onclick="fxDel('${k}',${i})" aria-label="ลบรูป">✕</button></span>`).join('')}
    <label class="fx-add">📷<small>เพิ่มรูป</small><input type="file" accept="image/*" class="hidden" onchange="fxAdd('${k}',this)"></label></div></div>`;
  box.innerHTML=col('b','📸 ก่อนทำ','','bf')+col('a','✨ หลังทำ',p.r.photoAfter,'af')+'<div class="fx-pn">ใส่รูปหรือไม่ใส่ก็ได้ · แตะ 📷 เพื่อถ่ายหรือเลือกรูป</div>';}
function fxAdd(k,inp){const f=inp.files[0];if(!f)return;shrink(f,1280,.72).then(d=>{st.fxPh[k].push(d);fxRender();});}
function fxDel(k,i){st.fxPh[k].splice(i,1);fxRender();}
async function saveFix(no){
  if(PENDING){toast('ยังบันทึกไม่ได้ · รอเปิดระบบบันทึกผล (หลังบ้าน) ก่อนค่ะ',4000);return;}
  const b=blockOf(st.branch,st.round);const r=b.rows.find(x=>x.no===no);
  const v={cause:$('#c'+no).value.trim(),fix:$('#f'+no).value.trim(),done:$('#d'+no).value?toDMY(fromIso($('#d'+no).value)):'',owner:$('#o'+no).value.trim()};
  if(!v.fix){toast('กรุณาเขียนการแก้ไข/ป้องกันก่อนบันทึก');$('#f'+no).focus();return;}
  try{
    const pb=(st.fxPh||{}).b||[],pa=(st.fxPh||{}).a||[];
    if(pb.length||pa.length)toast('กำลังอัปโหลดรูป…',8000);
    if(!DEMO){const o=await gasPost({action:'saveFix',token:st.user.token,branch:st.branch,round:st.round,no,...v,photoBefore:pb,photoAfter:pa});if(!o.ok)throw new Error(o.error);
      if(o.photo!=null)r.photo=o.photo;if(o.photoAfter!=null)r.photoAfter=o.photoAfter;}
    else{if(pb.length)r.photo=[...phList(r.photo),...pb].join('\n');if(pa.length)r.photoAfter=[...phList(r.photoAfter),...pa].join('\n');}
    Object.assign(r,v);const m=document.getElementById('fixModal');m&&m.remove();
    toast(DEMO?'✅ (ตัวอย่าง) บันทึกในเครื่องแล้ว':'✅ บันทึกลงชีตแล้ว');renderResult();
  }catch(e){toast('บันทึกไม่สำเร็จ: '+e.message);}
}
function printReport(){
  const b=blockOf(st.branch,st.round);
  $('#printArea').innerHTML=`<h2>รายงานผลตรวจมาตรฐานร้าน 7-11 · สาขา${esc(b.branch)} ครั้งที่ ${b.round}</h2>
  <div>วันที่ตรวจ ${fmtD(b.date)} · คะแนน ${Math.round(b.score)}% (ผ่าน ${b.pass}/${b.scored} ข้อ)</div>
  <table><tr><th>ที่</th><th>หัวข้อหลัก</th><th>จุดตรวจสอบ</th><th>ผล</th><th>สิ่งที่พบ</th><th>สาเหตุ</th><th>การแก้ไข/ป้องกัน</th><th>เสร็จ</th><th>ผู้รับผิดชอบ</th></tr>
  ${b.used.map(r=>`<tr><td>${r.no}</td><td>${esc(r.cat)}</td><td>${esc(st.items[r.no].title)}</td><td>${r.res==='1'?'ผ่าน':r.res==='0'?'<b>ไม่ผ่าน</b>':'-'}</td><td style="white-space:pre-line">${esc(r.comment)}</td><td>${esc(r.cause)}</td><td>${esc(r.fix)}</td><td>${esc(r.done)}</td><td>${esc(r.owner)}</td></tr>`).join('')}</table>
  <div style="display:flex;justify-content:space-around;margin-top:40px"><div>ลงชื่อ ............................ ผู้ตรวจ</div><div>ลงชื่อ ............................ ผู้จัดการสาขา</div></div>`;
  window.print();
}
function setHdr(){const h=document.querySelector('header');if(h)document.documentElement.style.setProperty('--hdr',h.offsetHeight+'px');}
addEventListener('resize',setHdr);setHdr();try{new ResizeObserver(setHdr).observe(document.querySelector('header'));}catch(e){}
boot();
</script>
</body>
