<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Rattana Member v1.1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.6/JsBarcode.all.min.js"></script>
<style>
/* ══════════════ Design tokens — Macaron Pastel ══════════════ */
:root{
  --bg:#fff7fa; --dot:#ffe3ec;
  --card:#ffffff; --card-2:#fffbfd;
  --text:#5b4a6b; --muted:#a291b3; --border:#f4e4ee;
  --ink:#d9547d;                       /* strawberry ink — links / emphasis */
  --pink:#ffb3c7;  --pink-soft:#ffe3eb;
  --mint:#93dfc0;  --mint-soft:#dbf6ea;
  --lav:#c5b0ff;   --lav-soft:#ede5ff;
  --lemon:#ffe17d; --lemon-soft:#fff5cc;
  --peach:#ffc19e; --peach-soft:#ffe8da;
  --sky:#a3d4ff;   --sky-soft:#e1f1ff;
  --danger:#ff7a8f; --ok:#4cc79a;
  --shadow:0 6px 18px rgba(217,84,125,.10);
  --shadow-lg:0 14px 34px rgba(150,90,170,.18);
  --r-sm:12px; --r-md:18px; --r-lg:24px;
  --head-bg:linear-gradient(120deg,#ffd3e0 0%,#e9dcff 50%,#d4ecff 100%);
}
body.dark{
  --bg:#1b1624; --dot:#251d31;
  --card:#271f35; --card-2:#2e2540;
  --text:#f7effc; --muted:#c3b4d6; --border:#3a2f4d;
  --ink:#ff9ab6;
  --pink-soft:rgba(255,179,199,.16); --mint-soft:rgba(147,223,192,.16);
  --lav-soft:rgba(197,176,255,.18);  --lemon-soft:rgba(255,225,125,.14);
  --peach-soft:rgba(255,193,158,.16);--sky-soft:rgba(163,212,255,.16);
  --shadow:0 6px 18px rgba(0,0,0,.35); --shadow-lg:0 14px 34px rgba(0,0,0,.45);
  --head-bg:linear-gradient(120deg,#3a2540 0%,#2d2550 50%,#1f2f4a 100%);
}

/* ══════════════ Base ══════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Sarabun',sans-serif;font-size:14px;line-height:1.5;color:var(--text);min-height:100dvh;overflow-x:hidden;
  background-color:var(--bg);
  background-image:radial-gradient(var(--dot) 1.6px,transparent 1.7px);background-size:22px 22px;
  transition:background-color .25s,color .25s}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
input{font-family:inherit;font-size:16px;color:var(--text)}
h1,h2,h3,.mitr{font-family:'Mitr','Sarabun',sans-serif;font-weight:500}
.num{font-variant-numeric:tabular-nums}

/* ══════════════ Header ══════════════ */
header{position:sticky;top:0;z-index:100;background:var(--head-bg);padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));
  display:flex;align-items:center;gap:10px;box-shadow:0 4px 14px rgba(200,140,190,.18);border-bottom:3px dashed rgba(255,255,255,.7)}
body.dark header{border-bottom-color:rgba(255,255,255,.12)}
.logo{display:flex;align-items:center;gap:9px;flex:1;min-width:0}
.logo-mac{width:38px;height:38px;flex-shrink:0;position:relative}
.logo-mac i{position:absolute;left:3px;right:3px;height:12px;border-radius:12px}
.logo-mac i:nth-child(1){top:4px;background:var(--pink)}
.logo-mac i:nth-child(2){top:14px;left:6px;right:6px;height:8px;background:#fff8e7;border-radius:4px}
.logo-mac i:nth-child(3){top:21px;background:var(--pink)}
.logo-text{line-height:1.1;min-width:0}
.logo-text b{font-family:'Mitr';font-weight:600;font-size:18px;letter-spacing:.3px;display:block;white-space:nowrap}
.logo-text b span{color:var(--ink)}
.logo-text small{font-size:11px;color:var(--muted)}
.icon-btn{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.65);display:flex;align-items:center;justify-content:center;font-size:17px;box-shadow:0 2px 6px rgba(160,100,160,.15);transition:transform .15s}
body.dark .icon-btn{background:rgba(255,255,255,.1)}
.icon-btn:active{transform:scale(.92)}
.hub-btn{display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.65);color:var(--text);border-radius:20px;padding:0 12px;height:40px;font-size:13px;font-weight:700;text-decoration:none;white-space:nowrap;box-shadow:0 2px 6px rgba(160,100,160,.15)}
body.dark .hub-btn{background:rgba(255,255,255,.1)}

/* ══════════════ Layout ══════════════ */
.screen{display:none;max-width:760px;margin:0 auto;padding:14px 14px 90px;animation:fadeUp .25s ease}
.screen.active{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card{background:var(--card);border-radius:var(--r-md);box-shadow:var(--shadow);border:1px solid var(--border)}
.sec-title{display:flex;align-items:center;gap:8px;font-family:'Mitr';font-size:16px;margin:20px 4px 10px}
.sec-title .em{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px}
.sec-title small{margin-left:auto;font-family:'Sarabun';font-size:12px;color:var(--muted);font-weight:400}

/* ══════════════ Tier chips (stats) ══════════════ */
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.chip{border-radius:var(--r-md);padding:10px 6px 9px;text-align:center;border:2px solid transparent;transition:transform .15s,border-color .15s;position:relative;overflow:hidden}
.chip:active{transform:scale(.96)}
.chip .c-emo{font-size:18px;line-height:1}
.chip .c-val{font-family:'Mitr';font-size:19px;font-weight:500;line-height:1.3}
.chip .c-lbl{font-size:11px;color:var(--muted);font-weight:600}
.chip.sel{border-color:var(--ink)}
.chip.all{background:var(--pink-soft)} .chip.std{background:var(--mint-soft)}
.chip.gold{background:var(--lemon-soft)} .chip.plat{background:var(--lav-soft)}

/* ══════════════ Search box ══════════════ */
.search-box{padding:12px;margin-bottom:10px}
.search-row{display:flex;gap:8px}
.search-input-wrap{position:relative;flex:1}
.search-input-wrap .s-ico{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:16px;opacity:.6;pointer-events:none}
.search-input{width:100%;height:50px;border:2px solid var(--border);border-radius:25px;padding:0 42px 0 40px;background:var(--card-2);outline:none;transition:border-color .2s,box-shadow .2s}
.search-input:focus{border-color:var(--pink);box-shadow:0 0 0 4px var(--pink-soft)}
.search-input::placeholder{color:var(--muted)}
.clear-btn{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:50%;display:none;align-items:center;justify-content:center;background:var(--pink-soft);color:var(--ink);font-size:15px;font-weight:700}
.clear-btn.visible{display:flex}
.scan-btn{height:50px;padding:0 18px;border-radius:25px;flex-shrink:0;display:flex;align-items:center;gap:7px;font-weight:700;font-size:14px;color:#fff;
  background:linear-gradient(135deg,#ff9bb8 0%,#c9a6ff 100%);box-shadow:0 6px 14px rgba(217,84,125,.28);transition:transform .12s}
.scan-btn svg{width:20px;height:20px;fill:#fff}
.scan-btn:active{transform:scale(.95)}
.stat-line{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);margin:8px 4px 0;min-height:20px}
.sdot{width:9px;height:9px;border-radius:50%;background:var(--muted);flex-shrink:0}
.sdot.ok{background:var(--ok)} .sdot.err{background:var(--danger)} .sdot.loading{background:var(--lemon);animation:pulse 1.1s infinite}
@keyframes pulse{50%{opacity:.4;transform:scale(.8)}}

/* ══════════════ Result list ══════════════ */
.list{display:flex;flex-direction:column;gap:9px}
.m-row{display:flex;align-items:center;gap:12px;padding:11px 13px;text-align:left;width:100%;transition:transform .12s,box-shadow .15s}
.m-row:active{transform:scale(.985)}
@media(hover:hover){.m-row:hover{box-shadow:var(--shadow-lg)}}
.ava{width:46px;height:46px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:'Mitr';font-size:19px;font-weight:500;color:#6b4f7d}
body.dark .ava{color:#2a2035}
.m-main{flex:1;min-width:0}
.m-name{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-sub{font-size:12.5px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.m-right{text-align:right;flex-shrink:0}
.m-pts{font-family:'Mitr';font-size:17px;color:var(--ink);line-height:1.2}
.m-pts small{font-family:'Sarabun';font-size:11px;color:var(--muted);display:block}
.badge{display:inline-flex;align-items:center;gap:3px;padding:2px 9px;border-radius:12px;font-size:11px;font-weight:700;white-space:nowrap;color:#5b4a6b}
.b-std{background:var(--mint)} .b-gold{background:var(--lemon)} .b-plat{background:var(--lav)} .b-oth{background:var(--sky)}
.b-exp{background:#ffd0d8;color:#c23a59} .b-soon{background:var(--peach);color:#8a4a22}
.more-note{text-align:center;font-size:12px;color:var(--muted);padding:10px}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty .e-emo{font-size:46px;margin-bottom:6px}
.empty b{display:block;font-family:'Mitr';font-weight:500;color:var(--text);font-size:16px;margin-bottom:2px}

/* ══════════════ Skeleton ══════════════ */
.skel{height:68px;border-radius:var(--r-md);background:linear-gradient(90deg,var(--card) 0%,var(--pink-soft) 50%,var(--card) 100%);background-size:200% 100%;animation:shimmer 1.2s infinite}
@keyframes shimmer{to{background-position:-200% 0}}

/* ══════════════ Detail — back bar ══════════════ */
.back-bar{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.back-btn{height:42px;padding:0 16px 0 12px;border-radius:21px;background:var(--card);border:1px solid var(--border);box-shadow:var(--shadow);font-weight:700;font-size:14px;display:flex;align-items:center;gap:4px}
.back-btn:active{transform:scale(.96)}

/* ══════════════ Member card (macaron) ══════════════ */
.mcard{border-radius:var(--r-lg);padding:18px 18px 14px;position:relative;overflow:hidden;color:#4f3c60;box-shadow:var(--shadow-lg)}
.mcard::before,.mcard::after{content:'';position:absolute;border-radius:50%;background:rgba(255,255,255,.35)}
.mcard::before{width:180px;height:180px;right:-60px;top:-70px}
.mcard::after{width:110px;height:110px;left:-40px;bottom:-50px;background:rgba(255,255,255,.25)}
.mc-std{background:linear-gradient(135deg,#c9f3e2 0%,#a6e3cf 45%,#bfe3ff 100%)}
.mc-gold{background:linear-gradient(135deg,#fff3b0 0%,#ffd99a 50%,#ffc2b4 100%)}
.mc-plat{background:linear-gradient(135deg,#eadfff 0%,#d6c2ff 45%,#ffc6dc 100%)}
.mc-oth{background:linear-gradient(135deg,#d9eeff 0%,#c4dcff 100%)}
.mc-top{display:flex;align-items:flex-start;justify-content:space-between;position:relative;z-index:1}
.mc-brand{font-family:'Mitr';font-size:12px;letter-spacing:1.5px;opacity:.75}
.mc-tier{font-family:'Mitr';font-size:13px;font-weight:600;background:rgba(255,255,255,.6);padding:3px 12px;border-radius:14px}
.mc-name{font-family:'Mitr';font-size:23px;font-weight:500;margin-top:14px;line-height:1.25;position:relative;z-index:1;word-break:break-word}
.mc-code{font-size:13px;opacity:.8;position:relative;z-index:1}
.mc-pts{display:flex;align-items:flex-end;justify-content:space-between;margin-top:12px;position:relative;z-index:1;gap:10px}
.mc-pts .big{font-family:'Mitr';font-size:36px;font-weight:600;line-height:1}
.mc-pts .big small{font-size:14px;font-weight:400;margin-left:4px}
.mc-pts .exp{font-size:12px;text-align:right;opacity:.85}
.mc-bc{margin-top:12px;background:rgba(255,255,255,.75);border-radius:14px;padding:6px 10px 2px;position:relative;z-index:1;text-align:center}
.mc-bc svg{max-width:100%;height:58px}

/* ══════════════ Info grid ══════════════ */
.info-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:12px}
.info{padding:11px 13px;border-radius:var(--r-sm);background:var(--card);border:1px solid var(--border)}
.info.wide{grid-column:1/-1}
.info .i-lbl{font-size:11px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:5px}
.info .i-val{font-size:14.5px;font-weight:600;margin-top:1px;word-break:break-word}
.info a{color:var(--ink);text-decoration:none}

/* ══════════════ Summary tiles ══════════════ */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
@media(min-width:620px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{border-radius:var(--r-md);padding:12px 13px}
.tile .t-lbl{font-size:11.5px;font-weight:600;color:var(--muted)}
.tile .t-val{font-family:'Mitr';font-size:21px;font-weight:500;line-height:1.3}
.tile .t-sub{font-size:11px;color:var(--muted)}
.t1{background:var(--pink-soft)} .t2{background:var(--mint-soft)} .t3{background:var(--lemon-soft)} .t4{background:var(--sky-soft)}

/* ══════════════ Charts (pure CSS) ══════════════ */
.chart-card{padding:14px}
.mbars{display:flex;align-items:flex-end;gap:5px;height:130px;padding-top:16px}
.mbar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;min-width:0}
.mbar .bar{width:100%;max-width:30px;border-radius:9px 9px 5px 5px;min-height:4px;position:relative;transition:height .5s cubic-bezier(.2,.8,.3,1)}
.mbar .bar span{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:9.5px;color:var(--muted);white-space:nowrap}
.mbar .lbl{font-size:10px;color:var(--muted);white-space:nowrap}
.top-item{display:flex;align-items:center;gap:10px;padding:7px 0}
.top-item .ti-emo{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.top-item .ti-main{flex:1;min-width:0}
.top-item .ti-name{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-item .ti-track{height:9px;border-radius:5px;background:var(--border);margin-top:4px;overflow:hidden}
.top-item .ti-fill{height:100%;border-radius:5px}
.top-item .ti-qty{font-size:12px;color:var(--muted);text-align:right;flex-shrink:0;min-width:58px}
.cat-stack{display:flex;height:16px;border-radius:9px;overflow:hidden;margin:6px 0 10px}
.cat-legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px}
.cat-legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}

/* ══════════════ History timeline ══════════════ */
.month-h{font-family:'Mitr';font-size:13.5px;color:var(--muted);margin:14px 6px 7px;display:flex;justify-content:space-between}
.bill{margin-bottom:8px;overflow:hidden}
.bill-head{width:100%;display:flex;align-items:center;gap:11px;padding:11px 13px;text-align:left}
.bill-date{width:46px;height:50px;border-radius:13px;color:#5b4a6b;flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05}
.bill-date b{font-family:'Mitr';font-size:19px;font-weight:500}
.bill-date small{font-size:10px}
.bill-main{flex:1;min-width:0}
.bill-main .bm-1{font-weight:700;font-size:14px}
.bill-main .bm-2{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bill-amt{text-align:right;flex-shrink:0}
.bill-amt b{font-family:'Mitr';font-weight:500;font-size:16px;display:block}
.bill-amt small{font-size:11px;color:var(--ok);font-weight:700}
.bill-arrow{transition:transform .2s;color:var(--muted);font-size:12px}
.bill.open .bill-arrow{transform:rotate(180deg)}
.bill-items{display:none;border-top:2px dashed var(--border);padding:8px 13px 11px;background:var(--card-2)}
.bill.open .bill-items{display:block}
.bi-row{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:4px 0}
.bi-row .q{color:var(--muted);font-size:12px}
.bi-total{display:flex;justify-content:space-between;border-top:1px solid var(--border);margin-top:5px;padding-top:6px;font-weight:700;font-size:13.5px}

.bob{display:inline-block;animation:bob 1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(-6deg)}}
.retry-btn{margin-top:10px;background:var(--pink);color:#5b4a6b;border-radius:999px;padding:8px 18px;font-weight:700;font-size:13px}
.camp{display:inline-block;background:var(--peach-soft);color:#8a4a22;border-radius:6px;font-size:10.5px;font-weight:700;padding:0 5px;margin-left:4px}
body.dark .camp{background:#ffd6c2;color:#6e3416}

/* ══════════════ Scanner ══════════════ */
.scan-status{display:flex;align-items:center;gap:8px;padding:10px 14px;margin-bottom:10px;font-size:13px;color:var(--muted);min-height:44px}
.scanner-wrap{background:#2a2035;border-radius:var(--r-lg) var(--r-lg) 0 0;overflow:hidden;position:relative;min-height:220px}
#html5-qr-reader{width:100%;border:none!important}
#html5-qr-reader video{width:100%!important;object-fit:cover;display:block}
#html5-qr-reader img,#html5-qr-reader__dashboard,#html5-qr-reader__header_message{display:none!important}
.scanner-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:10}
.scanner-frame{width:min(300px,80%);height:170px;border-radius:18px;position:relative;box-shadow:0 0 0 2000px rgba(42,32,53,.42)}
.scanner-line{position:absolute;left:12px;right:12px;height:3px;border-radius:3px;background:linear-gradient(90deg,var(--pink),var(--lav),var(--sky));animation:scanline 1.8s ease-in-out infinite}
@keyframes scanline{0%{top:8px}50%{top:156px}100%{top:8px}}
.scan-corner{position:absolute;width:24px;height:24px;border:0 solid #ffd3e0}
.sc-tl{top:-2px;left:-2px;border-top-width:4px;border-left-width:4px;border-top-left-radius:12px}
.sc-tr{top:-2px;right:-2px;border-top-width:4px;border-right-width:4px;border-top-right-radius:12px}
.sc-bl{bottom:-2px;left:-2px;border-bottom-width:4px;border-left-width:4px;border-bottom-left-radius:12px}
.sc-br{bottom:-2px;right:-2px;border-bottom-width:4px;border-right-width:4px;border-bottom-right-radius:12px}
.scanner-hint{background:var(--card);border:1px solid var(--border);border-top:none;border-radius:0 0 var(--r-lg) var(--r-lg);padding:10px;text-align:center;font-size:12.5px;color:var(--muted);margin-bottom:10px}
.scanner-controls{display:flex;gap:8px;margin-bottom:10px}
.stop-btn{flex:1;height:48px;border-radius:24px;background:#ff8fa5;color:#fff;font-weight:700;font-size:14px}
.torch-btn{display:none;align-items:center;gap:6px;height:48px;padding:0 18px;border-radius:24px;background:var(--lemon-soft);color:var(--text);font-weight:700;font-size:13px;border:2px solid var(--lemon)}
.torch-btn.on{background:var(--lemon)}
.manual-row{display:flex;gap:8px}
.manual-input{flex:1;height:48px;border:2px solid var(--border);border-radius:24px;padding:0 16px;background:var(--card);outline:none}
.manual-input:focus{border-color:var(--lav)}
.manual-btn{height:48px;padding:0 20px;border-radius:24px;background:var(--lav);color:#4f3c60;font-weight:700}

/* ══════════════ Misc ══════════════ */
#backToTop{position:fixed;bottom:max(22px,calc(14px + env(safe-area-inset-bottom)));right:16px;width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#ffb3c7,#c5b0ff);color:#fff;font-size:20px;font-weight:700;display:none;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(217,84,125,.35);z-index:90}
#backToTop.show{display:flex}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(24px,env(safe-area-inset-bottom));background:var(--card);color:var(--text);border:2px solid var(--pink);padding:10px 18px;border-radius:22px;box-shadow:var(--shadow-lg);z-index:9999;font-size:13.5px;font-weight:600;animation:toastIn .25s ease;max-width:90vw}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,12px)}}

<script>
/* ══════════════════════════ CONFIG ══════════════════════════ */
const APP_VERSION = '1.1';
const MEMBER_SOURCE = { sheetId: '1u4e35nyexgtuHkx_ztf2sJ-mgc3ZEHBNEl2_hve_JFc', sheetName: 'SQL Member' };
/* ประวัติการซื้อ — ไฟล์ใหญ่ (~30MB) จึงดึงทีละสมาชิกด้วย gviz query (ไม่โหลดทั้งไฟล์)
   คอลัมน์ในชีต: E DATE · F BILL_NO · H PRODUCT_NAME · I UNIT · J SALES_QTY · K FREE_QTY · N TOTAL · O CAMPAIGN · P TIME_SLOTS · Q MEMBER · W CAT_TYPE
   ถ้าย้าย/เพิ่มคอลัมน์ในชีต ให้แก้ตัวอักษรคอลัมน์ตรงนี้ */
const SALES_SOURCE  = { sheetId: '1czh9qncb_3_liBxQwS6XEDhvwlgFdqtc', memberCol: 'Q', select: 'E,F,H,I,J,K,N,O,P,W' };
const CACHE_KEY = 'rattana_member_cache_v1';
const TTL = 5 * 60 * 1000;
const LIST_LIMIT = 60;

/* ══════════════════════════ STATE ══════════════════════════ */
let allMembers = [];
const salesCache = new Map();  // code → { bills, ts } | { loading } | { error }
let tierFilter = 'all';
let currentMember = null;

/* ══════════════════════════ HELPERS ══════════════════════════ */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const digits = s => String(s || '').replace(/\D/g, '');
const fmtNum = (n, d = 0) => Number(n || 0).toLocaleString('th-TH', { minimumFractionDigits: d, maximumFractionDigits: d });
const fmtQty = n => Number(n || 0).toLocaleString('th-TH', { maximumFractionDigits: 3 });   // 0.585 กก. ไม่ปัดเป็น 1
const TH_MONTH_S = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const TH_MONTH_L = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];

function parseDMY(s) {                     // "18/11/2030" → Date (handles พ.ศ. too)
  const m = String(s || '').match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if (!m) return null;
  let y = +m[3]; if (y > 2400) y -= 543;
  const d = new Date(y, +m[2] - 1, +m[1]);
  return isNaN(d) ? null : d;
}
function formatThaiDate(d) {
  if (!d) return '-';
  return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()+543}`;
}
function formatThaiTime(d) { return d ? `${String(d.getHours()).padStart(2,'0')}.${String(d.getMinutes()).padStart(2,'0')}` : '-'; }
function ageOf(b) {
  if (!b) return null; const t = new Date();
  let a = t.getFullYear() - b.getFullYear();
  if (t.getMonth() < b.getMonth() || (t.getMonth() === b.getMonth() && t.getDate() < b.getDate())) a--;
  return a;
}
function dispName(m) {                    // "คุณสมชาย ใจดี" / "คุณ Natthiya Mairoojob"
  if (!m.full) return '-';
  return m.title ? m.title + (/^[A-Za-z]/.test(m.full) ? ' ' : '') + m.full : m.full;
}
function fmtPhone(p) { const d = digits(p); return d.length === 10 ? `${d.slice(0,3)}-${d.slice(3,6)}-${d.slice(6)}` : (p || '-'); }
function hashStr(s) { let h = 2166136261; for (const c of String(s)) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }

const PASTELS = ['#ffc7d6','#c8f0dd','#e2d6ff','#fff0a8','#ffd6c2','#cbe6ff'];
const TIER = {
  Standard: { cls:'std',  badge:'b-std',  card:'mc-std',  emo:'🍃', label:'Standard' },
  Gold:     { cls:'gold', badge:'b-gold', card:'mc-gold', emo:'⭐', label:'Gold' },
  Platinum: { cls:'plat', badge:'b-plat', card:'mc-plat', emo:'💎', label:'Platinum' },
};
const tierOf = t => TIER[t] || { cls:'oth', badge:'b-oth', card:'mc-oth', emo:'🎀', label: t || 'ไม่ระบุ' };

function expiryState(d) {
  if (!d) return null;
  const days = Math.ceil((d - new Date()) / 86400000);
  if (days < 0) return { cls:'b-exp', text:'หมดอายุแล้ว', days };
  if (days <= 60) return { cls:'b-soon', text:`เหลือ ${days} วัน`, days };
  return { cls:'', text:'', days };
}

/* ══════════════════════════ UI helpers ══════════════════════════ */
function showToast(msg) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 3000); }
function setLoading(on) { $('loadingBar').style.width = on ? '85%' : '0'; }
function setStat(text, kind) { $('stat-text').textContent = text; $('stat-dot').className = 'sdot' + (kind ? ' ' + kind : ''); }
function setScanStatus(text, kind) { $('scan-status-text').textContent = text; $('scan-status').querySelector('.sdot').className = 'sdot' + (kind ? ' ' + kind : ''); }
function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === id));
  window.scrollTo(0, 0);
}

/* ── Theme (shared key across Rattana apps) ── */
const THEME_KEY = 'rattana_theme';
function applyTheme(t) { document.body.classList.toggle('dark', t === 'dark'); $('themeBtn').textContent = t === 'dark' ? '☀️' : '🌙'; }
function toggleTheme() { const n = document.body.classList.contains('dark') ? 'light' : 'dark'; try { localStorage.setItem(THEME_KEY, n); } catch {} applyTheme(n); }
try { applyTheme(localStorage.getItem(THEME_KEY) || 'light'); } catch { applyTheme('light'); }

/* ══════════════════════════ DATA ══════════════════════════ */
function parseCsv(text) {
  if (!text) return [];
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i+1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch; }
    else if (ch === '"') q = true;
    else if (ch === ',') { row.push(cell); cell = ''; }
    else if (ch === '\r') {}
    else if (ch === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += ch;
  }
  if (cell.length || row.length) { row.push(cell); rows.push(row); }
  if (!rows.length) return [];
  const clean = s => String(s || '').replace(/[​‌‍﻿]/g, '').replace(/ /g, ' ').trim();
  const headers = rows[0].map(clean);
  return rows.slice(1).filter(r => r.some(c => clean(c))).map(r => Object.fromEntries(headers.map((k, i) => [k, clean(r[i])]).filter(([k]) => k)));
}
async function loadFromSheets(sheetId, sheetName) {
  const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(sheetName)}`;
  const res = await fetch(url, { cache: 'no-store' });
  if (!res.ok) throw new Error('fetch failed ' + res.status);
  return parseCsv(await res.text());
}
function normalizeMember(r) {
  const code = String(r.MB_CODE || '').trim();
  const name = r.MB_NAME || '', surname = r.MB_SURNME || '';
  const addr = [r.MB_ADDR_1, r.MB_ADDR_2, r.MB_ADDR_3,
    r.MB_ADDR_SUB_DISTRICT && 'ต.' + r.MB_ADDR_SUB_DISTRICT,
    r.MB_ADDR_DISTRICT && 'อ.' + r.MB_ADDR_DISTRICT,
    r.MB_ADDR_PROVINCE && 'จ.' + r.MB_ADDR_PROVINCE, r.MB_POST].filter(Boolean).join(' ');
  return {
    code, title: r.MB_INTL || '', name, surname, full: `${name} ${surname}`.trim(),
    sex: r.MB_SEX || '', tier: r.MT_NAME || '', points: parseFloat(r.MB_SH_POINT) || 0,
    birth: parseDMY(r.MB_BIRTH), expire: parseDMY(r.MB_EXPIRE),
    phone: String(r.MB_PHONE_HND || '').trim(), addr, province: r.MB_ADDR_PROVINCE || '',
    note: r.Note || '',
    _key: `${code} ${digits(r.MB_PHONE_HND)} ${name} ${surname}`.toLowerCase(),
  };
}
function hydrate(raw) {
  allMembers = raw.map(normalizeMember).filter(m => m.code);
  allMembers.forEach(m => { m.birth = m.birth ? new Date(m.birth) : null; m.expire = m.expire ? new Date(m.expire) : null; });
}

async function loadData(force = false) {
  setLoading(true);
  try {
    if (!force) {
      try {
        const c = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
        if (c && Date.now() - c.ts < TTL) { hydrate(c.data); renderAll(); }
      } catch {}
    }
    const raw = await loadFromSheets(MEMBER_SOURCE.sheetId, MEMBER_SOURCE.sheetName);
    try { localStorage.setItem(CACHE_KEY, JSON.stringify({ ts: Date.now(), data: raw })); } catch {}
    hydrate(raw);
    renderAll();
  } catch (e) {
    if (!allMembers.length) {
      setStat('โหลดข้อมูลไม่สำเร็จ — ตรวจสอบอินเทอร์เน็ตแล้วกด 🔄', 'err');
      $('results-area').innerHTML = `<div class="empty"><div class="e-emo">🥺</div><b>โหลดข้อมูลไม่ได้</b>ลองกดปุ่มรีเฟรชด้านบนอีกครั้ง</div>`;
    } else showToast('อัปเดตไม่สำเร็จ ใช้ข้อมูลล่าสุดในเครื่อง');
  } finally { setLoading(false); }
}
/* ── ประวัติการซื้อ: ดึงเฉพาะแถวของสมาชิกคนเดียว ── */
async function fetchSales(code) {
  const safe = String(code).replace(/['"\\]/g, '');
  const tq = `select ${SALES_SOURCE.select} where ${SALES_SOURCE.memberCol} = '${safe}'`;
  const url = `https://docs.google.com/spreadsheets/d/${SALES_SOURCE.sheetId}/gviz/tq?tqx=out:csv&tq=${encodeURIComponent(tq)}`;
  const ctl = new AbortController(); const timer = setTimeout(() => ctl.abort(), 30000);
  try {
    const res = await fetch(url, { cache: 'no-store', signal: ctl.signal });
    if (!res.ok) throw new Error('fetch failed ' + res.status);
    const text = await res.text();
    if (/^\s*</.test(text)) throw new Error('not csv');          // หน้า login/error ของ Google
    return groupBills(parseCsv(text));
  } finally { clearTimeout(timer); }
}
function groupBills(rows) {
  const bills = new Map();
  rows.forEach(r => {
    const no = r.BILL_NO; if (!no) return;
    if (!bills.has(no)) bills.set(no, { no, date: parseDMY(r.DATE) || new Date(NaN), slot: r.TIME_SLOTS || '', byItem: new Map(), amount: 0 });
    const b = bills.get(no); const amt = parseFloat(r.TOTAL) || 0;
    const name = r.PRODUCT_NAME || '-', unit = String(r.UNIT || '').replace(/\s*\([^)]*\)\s*$/, '').replace(/x1$/, '');
    // สินค้าเดียวกันในบิลเดียวกัน (bplus แยกบรรทัดตามแคมเปญ: บรรทัดจำนวน ฿0 + บรรทัดราคา จำนวน 0) → รวมเป็นบรรทัดเดียว
    const key = name + '|' + unit; let it = b.byItem.get(key);
    if (!it) { const cat = r.CAT_TYPE || 'อื่นๆ'; it = { name, unit, cat, qty: 0, free: 0, amount: 0, emo: catEmo(cat), camp: '' }; b.byItem.set(key, it); }
    it.qty += parseFloat(r.SALES_QTY) || 0; it.free += parseFloat(r.FREE_QTY) || 0; it.amount += amt;
    if (r.CAMPAIGN && !it.camp) it.camp = r.CAMPAIGN;
    b.amount += amt;
  });
  return [...bills.values()].map(({ byItem, ...b }) => ({ ...b, items: [...byItem.values()] }))
    .filter(b => !isNaN(b.date)).sort((a, b) => b.date - a.date || (a.no < b.no ? 1 : -1));
}
function salesOf(m) {                       // คืนสถานะปัจจุบัน และสั่งโหลดถ้ายังไม่มี/หมดอายุ
  const c = salesCache.get(m.code);
  if (c && (c.loading || c.error || Date.now() - c.ts < TTL)) return c;
  const st = { loading: true, bills: c?.bills || null, ts: c?.ts || 0 };   // เก็บข้อมูลเก่าไว้โชว์ระหว่างโหลดใหม่
  salesCache.set(m.code, st);
  fetchSales(m.code)
    .then(bills => salesCache.set(m.code, { bills, ts: Date.now() }))
    .catch(() => salesCache.set(m.code, { error: true, bills: st.bills, ts: st.ts }))
    .finally(() => { if (currentMember && currentMember.code === m.code && $('s-detail').classList.contains('active')) showDetail(currentMember, true); });
  return st;
}
function retrySales() { if (!currentMember) return; salesCache.delete(currentMember.code); showDetail(currentMember, true); }

async function refreshData() {
  const b = $('btnRefresh'); b.disabled = true; b.style.transition = 'transform .6s'; b.style.transform = 'rotate(360deg)';
  if (currentMember) salesCache.delete(currentMember.code);
  await loadData(true);
  b.disabled = false; setTimeout(() => { b.style.transform = ''; b.style.transition = ''; }, 600);
  if (currentMember && $('s-detail').classList.contains('active')) {
    const m = allMembers.find(x => x.code === currentMember.code); if (m) showDetail(m, true);
  }
  showToast('อัปเดตข้อมูลเรียบร้อย ✨');
}

/* ══════════════════════════ หมวดสินค้า / ช่วงเวลา ══════════════════════════ */
const CAT_EMO = [
  [/ขนม/,'🍪'],[/ไอศครีม/,'🍦'],[/วัตถุดิบ/,'🧂'],[/อาหารสำเร็จรูป/,'🍜'],[/แช่แข็ง/,'🧊'],[/เนื้อสด/,'🥩'],[/ผักสด/,'🥬'],
  [/^ข้าว/,'🍚'],[/แป้ง/,'🌾'],[/น้ำมัน/,'🫗'],[/น้ำตาล/,'🍬'],[/น้ำเชื่อม/,'🍯'],[/Bakery/i,'🧁'],[/นมผง|ทารก|เด็ก/,'🍼'],[/นม/,'🥛'],
  [/น้ำดื่ม|น้ำผลไม้/,'💧'],[/อัดลม/,'🥤'],[/ชูกำลัง/,'⚡'],[/ชา|กาแฟ|โกโก้|มอลต์|ธัญญา/,'☕'],[/แอลกอฮอล์/,'🍺'],
  [/ใบหน้า/,'🧖'],[/ร่างกาย/,'🧴'],[/ฟัน|บ้วนปาก/,'🪥'],[/เสื้อผ้า/,'🧺'],[/ครัว/,'🍽️'],[/พื้น/,'🧽'],[/กระดาษ/,'🧻'],
  [/สัตว์/,'🐾'],[/แมลง/,'🦟'],[/ยา|เวชภัณฑ์/,'💊'],[/พลาสติก/,'🛍️'],[/ถ่าน|ไฟฟ้า/,'🔋'],[/เครื่องเขียน/,'✏️'],[/หอม/,'🌸'],
];
function catEmo(c) { const hit = CAT_EMO.find(([re]) => re.test(c)); return hit ? hit[1] : '🛍️'; }
const CAT_PAL = ['#ffb3c7','#a3d4ff','#ffe17d','#93dfc0','#c5b0ff','#ffc19e'];
const CAT_OTHER = '#d9d0e3';
const SLOT = {
  T1: { emo:'🌅', lbl:'เช้าตรู่', time:'06–08 น.' }, T2: { emo:'☀️', lbl:'ช่วงเช้า', time:'08–11 น.' },
  T3: { emo:'🍱', lbl:'ช่วงเที่ยง', time:'11–14 น.' }, T4: { emo:'🌤️', lbl:'ช่วงบ่าย', time:'14–17 น.' },
  T5: { emo:'🌇', lbl:'ช่วงเย็น', time:'17–20 น.' },  T6: { emo:'🌙', lbl:'ช่วงค่ำ', time:'20–22 น.' },
};

/* ══════════════════════════ RENDER — main ══════════════════════════ */
function renderAll() { renderChips(); doSearch($('search-input').value); }

function renderChips() {
  const c = { all: allMembers.length, Standard: 0, Gold: 0, Platinum: 0 };
  allMembers.forEach(m => { if (c[m.tier] !== undefined) c[m.tier]++; });
  const chip = (key, cls, emo, lbl, val) =>
    `<button class="chip ${cls} ${tierFilter === key ? 'sel' : ''}" onclick="setTier('${key}')"><div class="c-emo">${emo}</div><div class="c-val num">${fmtNum(val)}</div><div class="c-lbl">${lbl}</div></button>`;
  $('chips').innerHTML = chip('all','all','🧁','ทั้งหมด',c.all) + chip('Standard','std','🍃','Standard',c.Standard)
    + chip('Gold','gold','⭐','Gold',c.Gold) + chip('Platinum','plat','💎','Platinum',c.Platinum);
}
function setTier(t) { tierFilter = tierFilter === t && t !== 'all' ? 'all' : t; renderChips(); doSearch($('search-input').value); }

function searchMembers(q) {
  q = String(q || '').trim().toLowerCase();
  let pool = tierFilter === 'all' ? allMembers : allMembers.filter(m => m.tier === tierFilter);
  if (!q) return { list: [...pool].sort((a, b) => b.points - a.points), q };
  const d = digits(q);
  if (d && d.length === q.replace(/[\s-]/g, '').length) {           // numeric query → code / phone
    const hits = pool.filter(m => m.code.includes(d) || digits(m.phone).includes(d));
    hits.sort((a, b) => ((b.code === d || digits(b.phone) === d) - (a.code === d || digits(a.phone) === d)) || b.points - a.points);
    return { list: hits, q };
  }
  const toks = q.split(/\s+/).filter(Boolean);
  const hits = pool.filter(m => toks.every(t => m._key.includes(t)));
  hits.sort((a, b) => (b.name.toLowerCase().startsWith(toks[0]) - a.name.toLowerCase().startsWith(toks[0])) || b.points - a.points);
  return { list: hits, q };
}

function memberRow(m) {
  const t = tierOf(m.tier); const ex = expiryState(m.expire);
  const col = PASTELS[hashStr(m.code) % PASTELS.length];
  return `<button class="card m-row" onclick="openMember('${esc(m.code)}')">
    <div class="ava" style="background:${col}">${esc((m.name || '?').charAt(0))}</div>
    <div class="m-main">
      <div class="m-name">${esc(dispName(m))}</div>
      <div class="m-sub"><span>📞 ${esc(fmtPhone(m.phone))}</span><span class="badge ${t.badge}">${t.emo} ${esc(t.label)}</span>${ex && ex.cls ? `<span class="badge ${ex.cls}">${ex.text}</span>` : ''}</div>
    </div>
    <div class="m-right"><div class="m-pts num">${fmtNum(m.points)}<small>แต้ม</small></div></div>
  </button>`;
}

function doSearch(val) {
  if (!allMembers.length) return;
  const { list, q } = searchMembers(val);
  const area = $('results-area');
  const tierTxt = tierFilter === 'all' ? '' : ` (${tierFilter})`;
  if (!q) {
    $('list-title').innerHTML = `<div class="sec-title"><span class="em" style="background:var(--lemon-soft)">🏆</span>สมาชิกแต้มสูงสุด${esc(tierTxt)}<small>พิมพ์หรือสแกนเพื่อค้นหา</small></div>`;
    setStat(`พร้อมค้นหา · สมาชิก ${fmtNum(allMembers.length)} คน`, 'ok');
  } else {
    $('list-title').innerHTML = `<div class="sec-title"><span class="em" style="background:var(--pink-soft)">🔎</span>ผลการค้นหา${esc(tierTxt)}<small>${fmtNum(list.length)} คน</small></div>`;
    setStat(list.length ? `พบ ${fmtNum(list.length)} คน สำหรับ “${val.trim()}”` : `ไม่พบ “${val.trim()}”`, list.length ? 'ok' : 'err');
  }
  if (!list.length) {
    area.innerHTML = `<div class="empty"><div class="e-emo">🍡</div><b>ไม่พบสมาชิก</b>ลองค้นด้วยชื่อ นามสกุล หรือเบอร์โทร 10 หลัก</div>`;
    return;
  }
  const shown = q ? list.slice(0, LIST_LIMIT) : list.slice(0, 10);
  area.innerHTML = shown.map(memberRow).join('') + (q && list.length > LIST_LIMIT ? `<div class="more-note">แสดง ${LIST_LIMIT} จาก ${fmtNum(list.length)} คน — พิมพ์ให้เจาะจงขึ้นอีกนิดนะ</div>` : '');
}

function openMember(code) { const m = allMembers.find(x => x.code === code); if (m) showDetail(m); }

function showDetail(m, silent) {
  currentMember = m;
  const t = tierOf(m.tier); const ex = expiryState(m.expire); const age = ageOf(m.birth);
  const sales = salesOf(m);
  const bills = sales.bills || [];
  const salesLoading = !sales.bills && sales.loading;
  const salesFailed  = !sales.bills && sales.error;
  const total = bills.reduce((s, b) => s + b.amount, 0);
  const lastBill = bills[0];
  const daysSince = lastBill ? Math.max(0, Math.floor((Date.now() - lastBill.date) / 86400000)) : null;

  // top items + categories (top 6 หมวดได้สีของตัวเอง ที่เหลือรวมเป็น "อื่นๆ")

  const catSorted = [...catAgg.entries()].filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1]);
  const catColor = new Map(catSorted.slice(0, 6).map(([c], i) => [c, CAT_PAL[i]]));
  const cats = catSorted.slice(0, 6);

  </div>

  <div class="info-grid">

    <div class="info"><div class="i-lbl">🏷️ ระดับ</div><div class="i-val"><span class="badge ${t.badge}">${t.emo} ${esc(t.label)}</span></div></div>

    ${m.note ? `<div class="info wide"><div class="i-lbl">📝 หมายเหตุ</div><div class="i-val" style="font-weight:500">${esc(m.note)}</div></div>` : ''}
  </div>

    <div class="tile t3"><div class="t-lbl">มาช่วงไหนบ่อย</div><div class="t-val">${favSlot ? SLOT[favSlot[0]].emo + ' ' + SLOT[favSlot[0]].lbl : '-'}</div><div class="t-sub">${favSlot ? `${SLOT[favSlot[0]].time} · ${fmtNum(favSlot[1])} บิล` : 'ยังไม่มีข้อมูล'}</div></div>
    <div class="tile t4"><div class="t-lbl">มาล่าสุด</div><div class="t-val num">${lastBill ? (daysSince === 0 ? 'วันนี้' : daysSince + ' วัน') : '-'}</div><div class="t-sub">${lastBill ? formatThaiDate(lastBill.date) : 'ยังไม่มีการซื้อ'}</div></div>

  <div class="sec-title"><span class="em" style="background:var(--mint-soft)">💖</span>ซื้ออะไรบ่อย</div>
  <div class="card chart-card">
    ${topItems.map((it, i) => `<div class="top-item"><div class="ti-emo" style="background:${PASTELS[i % PASTELS.length]}">${it.emo}</div>
      <div class="ti-main"><div class="ti-name">${esc(it.name)}</div><div class="ti-track"><div class="ti-fill" style="width:${it.times / maxTimes * 100}%;background:${colorOf(it.cat)}"></div></div></div>
      <div class="ti-qty">${it.times} ครั้ง<br>${fmtQty(it.qty)} ${esc(it.unit.replace(/x\d+$/, '') || 'ชิ้น')}</div></div>`).join('')}
    <div style="font-weight:700;font-size:13px;margin-top:12px">หมวดที่ชอบ</div>
    <div class="cat-stack">${cats.map(([c, v]) => `<div style="width:${v / catTotal * 100}%;background:${colorOf(c)}"></div>`).join('')}</div>
    <div class="cat-legend">${cats.map(([c, v]) => `<span><i style="background:${colorOf(c)}"></i>${esc(c)} ${Math.round(v / catTotal * 100)}%</span>`).join('')}</div>
  </div>

  <div class="sec-title"><span class="em" style="background:var(--lav-soft)">🧾</span>ประวัติการซื้อ<small>แตะบิลเพื่อดูรายการ</small></div>
  ${groups.map(g => `<div class="month-h"><span>${g.label}</span><span class="num">฿${fmtNum(g.amt)}</span></div>
    ${g.bills.map((b, i) => `<div class="card bill">
      <button class="bill-head" onclick="this.parentElement.classList.toggle('open')">
        <div class="bill-date" style="background:${PASTELS[(b.date.getDate() + i) % PASTELS.length]}"><b>${b.date.getDate()}</b><small>${TH_MONTH_S[b.date.getMonth()]}</small></div>
        <div class="bill-main"><div class="bm-1">${b.items.length} รายการ${SLOT[b.slot] ? ` · ${SLOT[b.slot].emo} ${SLOT[b.slot].time}` : ''}</div><div class="bm-2">${b.items.map(x => x.emo + ' ' + esc(x.name)).join(', ')}</div></div>
        <div class="bill-amt"><b class="num">฿${fmtNum(b.amount)}</b></div>
        <span class="bill-arrow">▼</span>
      </button>
      <div class="bill-items">
        <div class="bi-row q"><span>บิล ${esc(b.no)}</span><span>${formatThaiDate(b.date)}${SLOT[b.slot] ? ' · ' + SLOT[b.slot].lbl : ''}</span></div>
        ${b.items.map(x => `<div class="bi-row"><span>${x.emo} ${esc(x.name)} <span class="q">${x.qty ? `× ${fmtQty(x.qty)} ${esc(x.unit)}` : ''}${x.free ? `${x.qty ? ' + ' : ''}แถม ${fmtQty(x.free)} ${esc(x.unit)}` : ''}</span>${x.camp ? `<span class="camp">🎁 ${esc(x.camp)}</span>` : ''}</span><span class="num">฿${fmtNum(x.amount, x.amount % 1 ? 2 : 0)}</span></div>`).join('')}
        <div class="bi-total"><span>รวม</span><span class="num">฿${fmtNum(b.amount, b.amount % 1 ? 2 : 0)}</span></div>

  `}
  `;
  $('detail-body').innerHTML = html;
  try { JsBarcode('#mc-barcode', m.code, { format: 'CODE128', displayValue: false, height: 50, margin: 2, lineColor: '#4f3c60', background: 'transparent' }); }
  catch { $('mc-barcode').closest('.mc-bc').style.display = 'none'; }
  if (!silent) { show('s-detail'); history.pushState({ s: 'detail' }, ''); }
}

/* ══════════════════════════ SCANNER (Rattana pattern) ══════════════════════════ */
let html5QrScanner = null, scannerActive = false, lastScanned = '', torchOn = false, torchTrack = null;
function beep() { try { const ctx = new (window.AudioContext || window.webkitAudioContext)(); const o = ctx.createOscillator(), g = ctx.createGain(); o.connect(g); g.connect(ctx.destination); o.frequency.value = 1180; g.gain.value = .1; o.start(); setTimeout(() => { o.stop(); ctx.close(); }, 90); } catch {} }
function vibrate(p) { try { navigator.vibrate && navigator.vibrate(p); } catch {} }

async function startScan() {
  setScanStatus('กำลังเปิดกล้อง...', 'loading');
  lastScanned = ''; scannerActive = true; torchOn = false; torchTrack = null;
  $('torch-btn').classList.remove('on'); $('torch-btn').style.display = 'none';
  if (typeof Html5Qrcode === 'undefined') { setScanStatus('โหลดตัวสแกนไม่ได้ — ใช้ช่องพิมพ์ด้านล่าง', 'err'); return; }
  try {
    await navigator.mediaDevices.getUserMedia({ video: true }).then(s => s.getTracks().forEach(t => t.stop())).catch(() => {});
    const devices = await Html5Qrcode.getCameras().catch(() => []);
    let camId = null;
    if (devices && devices.length) { const back = devices.find(d => /(back|rear|environment|0)/i.test(d.label)); camId = (back || devices[devices.length - 1]).id; }
    if (html5QrScanner) { try { await html5QrScanner.stop(); } catch {} html5QrScanner = null; }
    if (!scannerActive) return;
    html5QrScanner = new Html5Qrcode('html5-qr-reader', { verbose: false, experimentalFeatures: { useBarCodeDetectorIfSupported: true } });
    const F = Html5QrcodeSupportedFormats;
    const config = {
      fps: 25, qrbox: { width: 320, height: 180 }, aspectRatio: 1.7777,
      videoConstraints: { facingMode: { ideal: 'environment' }, width: { ideal: 1920, min: 1280 }, height: { ideal: 1080, min: 720 },
        focusMode: 'continuous', advanced: [{ focusMode: 'continuous' }, { zoom: 1.5 }] },
      formatsToSupport: [F.EAN_13, F.EAN_8, F.UPC_A, F.UPC_E, F.CODE_128, F.CODE_39, F.CODE_93, F.ITF, F.QR_CODE],
    };
    const camCfg = camId ? { deviceId: { exact: camId } } : { facingMode: { exact: 'environment' } };
    await html5QrScanner.start(camCfg, config, text => {
      if (!scannerActive || text === lastScanned) return;
      lastScanned = text; beep(); vibrate([60, 40, 60]); onScanFound(text);
    }, () => {});
    setTimeout(() => {
      try {
        const v = document.querySelector('#html5-qr-reader video');
        const track = v && v.srcObject && v.srcObject.getVideoTracks()[0];
        if (!track) return;
        const caps = track.getCapabilities ? track.getCapabilities() : {};
        if (caps.torch) { torchTrack = track; $('torch-btn').style.display = 'flex'; }
        const adv = [];
        if (caps.focusMode && caps.focusMode.includes('continuous')) adv.push({ focusMode: 'continuous' });
        if (caps.zoom && caps.zoom.max >= 1.5) adv.push({ zoom: Math.min(1.5, caps.zoom.max) });
        if (adv.length) track.applyConstraints({ advanced: adv }).catch(() => {});
      } catch {}
    }, 800);
    setScanStatus('กล้องพร้อม — วางบาร์โค้ดบัตรสมาชิกให้อยู่ในกรอบ', 'ok');
    $('scan-hint').textContent = 'ถือห่าง 15–25 ซม. · แสงน้อยให้เปิดไฟฉาย';
  } catch (e) {
    let msg = 'เปิดกล้องไม่ได้ — ลองพิมพ์รหัสด้านล่าง';
    if (e.name === 'NotAllowedError' || String(e).includes('Permission')) msg = 'กรุณาอนุญาตกล้อง: Settings → Browser → Camera → Allow';
    else if (e.name === 'NotFoundError') msg = 'ไม่พบกล้อง — ใช้ช่องพิมพ์ด้านล่างแทน';
    setScanStatus(msg, 'err');
  }
}
async function stopScan() {
  scannerActive = false;
  if (torchOn && torchTrack) { try { await torchTrack.applyConstraints({ advanced: [{ torch: false }] }); } catch {} }
  torchOn = false; torchTrack = null;
  if (html5QrScanner) { try { await html5QrScanner.stop(); } catch {} try { html5QrScanner.clear(); } catch {} html5QrScanner = null; }
  $('manual-bc').value = '';
}
function onScanFound(code) {
  stopScan();
  show('s-main');
  const raw = String(code).trim(); const d = digits(raw);
  $('search-input').value = raw; $('clear-btn').classList.add('visible');
  tierFilter = 'all'; renderChips();
  const exact = allMembers.filter(m => m.code === raw || (d && (m.code === d || digits(m.phone) === d)));
  if (exact.length === 1) { setStat('พบ: ' + exact[0].full, 'ok'); doSearch(raw); showDetail(exact[0]); }
  else if (exact.length > 1) { doSearch(raw); setStat(`พบ ${exact.length} คน — กรุณาเลือก`, 'ok'); $('results-area').innerHTML = exact.map(memberRow).join(''); }
  else { doSearch(raw); setStat(`ไม่พบรหัส ${raw} ในระบบ`, 'err'); }
}

/* ══════════════════════════ EVENTS ══════════════════════════ */
function clearSearch() { $('search-input').value = ''; $('clear-btn').classList.remove('visible'); doSearch(''); }
$('clear-btn').onclick = () => { clearSearch(); $('search-input').focus(); };
let searchTimer;
$('search-input').addEventListener('input', function () {
  $('clear-btn').classList.toggle('visible', this.value.length > 0);
  clearTimeout(searchTimer); searchTimer = setTimeout(() => doSearch(this.value), 250);
});
$('search-input').addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const { list } = searchMembers(e.target.value);
  if (list.length === 1) showDetail(list[0]);
  e.target.blur();
});
$('open-scanner').onclick = () => { show('s-scanner'); history.pushState({ s: 'scanner' }, ''); startScan(); };
const manualGo = () => { const v = $('manual-bc').value.trim(); if (v) onScanFound(v); };
$('manual-search-btn').onclick = manualGo;
$('manual-bc').addEventListener('keydown', e => { if (e.key === 'Enter') manualGo(); });
$('torch-btn').onclick = async function () {
  if (!torchTrack) return;
  try { torchOn = !torchOn; await torchTrack.applyConstraints({ advanced: [{ torch: torchOn }] }); this.classList.toggle('on', torchOn); }
  catch { this.style.display = 'none'; }
};
async function leaveScanner() { await stopScan(); clearSearch(); show('s-main'); }
$('scanner-back').onclick = () => history.state ? history.back() : leaveScanner();
$('stop-scan').onclick = () => history.state ? history.back() : leaveScanner();
$('detail-back').onclick = () => history.state ? history.back() : show('s-main');
window.addEventListener('popstate', () => {
  if ($('s-scanner').classList.contains('active')) leaveScanner();
  else if ($('s-detail').classList.contains('active')) show('s-main');
});
window.addEventListener('scroll', () => $('backToTop').classList.toggle('show', window.scrollY > 400));

/* skeleton while loading */
$('results-area').innerHTML = Array(5).fill('<div class="skel"></div>').join('');
loadData();
setInterval(() => { if (!document.hidden && $('s-main').classList.contains('active')) loadData(true); }, 5 * 60 * 1000);
</script>
</body>
</html>
