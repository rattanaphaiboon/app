<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffd3e0">
<title>Rattana Member v1.3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600&family=Mitr:wght@400;500;600&family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.6/JsBarcode.all.min.js"></script>
<style>
/* ══════════════ Design tokens — Macaron Pastel ══════════════ */
:root{
  --bg:#fff7fa; --dot:#ffe3ec;
  --card:#ffffff; --card-2:#fffbfd;
  --text:#5b4a6b; --muted:#a291b3; --border:#f4e4ee;
  --ink:#d9547d;                       /* strawberry ink — links / emphasis */
  --pink:#ffb3c7;  --pink-soft:#ffe3eb;
  --mint:#93dfc0;  --mint-soft:#dbf6ea;
  --lav:#c5b0ff;   --lav-soft:#ede5ff;
  --lemon:#ffe17d; --lemon-soft:#fff5cc;
  --peach:#ffc19e; --peach-soft:#ffe8da;
  --sky:#a3d4ff;   --sky-soft:#e1f1ff;
  --silver:#d3dbe8; --silver-soft:#eef1f7;
  --danger:#ff7a8f; --ok:#4cc79a;
  --shadow:0 6px 18px rgba(217,84,125,.10);
  --shadow-lg:0 14px 34px rgba(150,90,170,.18);
  --r-sm:12px; --r-md:18px; --r-lg:24px;
  --font-head:'Mitr','Sarabun',sans-serif; --head-w:400;
  /* header */
  --head-bg:linear-gradient(120deg,#ffd3e0 0%,#e9dcff 50%,#d4ecff 100%);
  --head-fg:var(--text); --head-muted:var(--muted); --head-accent:var(--ink);
  --head-shadow:0 4px 14px rgba(200,140,190,.18); --head-border:3px dashed rgba(255,255,255,.7);
  --head-btn:rgba(255,255,255,.65); --head-btn-shadow:0 2px 6px rgba(160,100,160,.15);
  --logo-a:var(--pink); --logo-b:#fff8e7;
  /* accents */
  --focus:var(--pink); --focus-ring:var(--pink-soft);
  --accent-grad:linear-gradient(135deg,#ff9bb8 0%,#c9a6ff 100%); --on-accent:#fff; --accent-shadow:0 6px 14px rgba(217,84,125,.28);
  --on-badge:#5b4a6b;
  /* พาเลตต์สำหรับอวตาร / วันที่บิล / ไอคอนสินค้า (--p*) และกราฟหมวด (--c*) */
  --p1:#ffc7d6; --p2:#c8f0dd; --p3:#e2d6ff; --p4:#fff0a8; --p5:#ffd6c2; --p6:#cbe6ff; --on-p:#5b4a6b;
  --c1:#ffb3c7; --c2:#a3d4ff; --c3:#ffe17d; --c4:#93dfc0; --c5:#c5b0ff; --c6:#ffc19e; --c0:#d9d0e3;
  /* บัตรสมาชิก */
  --mc-fg:#4f3c60;
  --mc-std:linear-gradient(135deg,#c9f3e2 0%,#a6e3cf 45%,#bfe3ff 100%);
  --mc-silv:linear-gradient(135deg,#f6f8fc 0%,#d9e1ee 50%,#e6def7 100%);
  --mc-gold:linear-gradient(135deg,#fff3b0 0%,#ffd99a 50%,#ffc2b4 100%);
  --mc-plat:linear-gradient(135deg,#eadfff 0%,#d6c2ff 45%,#ffc6dc 100%);
  --mc-oth:linear-gradient(135deg,#d9eeff 0%,#c4dcff 100%);
  --mc-blob:rgba(255,255,255,.35); --mc-chip:rgba(255,255,255,.6); --mc-bc:rgba(255,255,255,.75); --bc-line:#4f3c60;
  --camp-bg:var(--peach-soft); --camp-fg:#8a4a22;
  --emo-filter:none;
  --scan-bg:#2a2035;
}
/* ตัวแปรที่อ้างตัวแปรอื่น ต้องประกาศที่ body เพื่อให้คำนวณใหม่ตามธีม (ประกาศที่ :root จะล็อกค่าธีมมาการอง) */
body{--head-fg:var(--text); --head-muted:var(--muted); --head-accent:var(--ink); --logo-a:var(--pink);
  --focus:var(--pink); --focus-ring:var(--pink-soft); --camp-bg:var(--peach-soft)}

/* ── 🌙 มาการองกลางคืน ── */
body[data-theme="macaron-night"]{
  --bg:#1b1624; --dot:#251d31;
  --card:#271f35; --card-2:#2e2540;
  --text:#f7effc; --muted:#c3b4d6; --border:#3a2f4d;
  --ink:#ff9ab6;
  --pink-soft:rgba(255,179,199,.16); --mint-soft:rgba(147,223,192,.16);
  --lav-soft:rgba(197,176,255,.18);  --lemon-soft:rgba(255,225,125,.14);
  --peach-soft:rgba(255,193,158,.16);--sky-soft:rgba(163,212,255,.16);
  --silver-soft:rgba(211,219,232,.16);
  --shadow:0 6px 18px rgba(0,0,0,.35); --shadow-lg:0 14px 34px rgba(0,0,0,.45);
  --head-bg:linear-gradient(120deg,#3a2540 0%,#2d2550 50%,#1f2f4a 100%);
  --head-border:3px dashed rgba(255,255,255,.12); --head-btn:rgba(255,255,255,.1);
  --on-p:#3d3049; --camp-bg:#ffd6c2; --camp-fg:#6e3416;
}

/* ── 🖤 คาร์บอน — ดำเทา สีเดียว ── */
body[data-theme="carbon"]{
  --bg:#0e0f11; --dot:transparent;
  --card:#16181b; --card-2:#1c1f23;
  --text:#e9eaec; --muted:#8d939c; --border:#272b31;
  --ink:#f5a524;
  --pink:#f5a524; --mint:#2a2e34; --lav:#2a2e34; --lemon:#3d3018; --peach:#3d2c1c; --sky:#2a2e34; --silver:#353a41;
  --pink-soft:#1a1d21; --mint-soft:#1a1d21; --lav-soft:#1a1d21; --lemon-soft:#1a1d21;
  --peach-soft:#1a1d21; --sky-soft:#1a1d21; --silver-soft:#1a1d21;
  --danger:#ff5d5d; --ok:#3ecf8e;
  --shadow:0 1px 0 rgba(255,255,255,.03),0 6px 16px rgba(0,0,0,.4); --shadow-lg:0 12px 30px rgba(0,0,0,.55);
  --r-sm:8px; --r-md:12px; --r-lg:16px;
  --font-head:'Kanit','Sarabun',sans-serif; --head-w:500;
  --head-bg:#121417; --head-fg:#e9eaec; --head-muted:#8d939c; --head-accent:#f5a524;
  --head-shadow:none; --head-border:1px solid #272b31;
  --head-btn:#1f2226; --head-btn-shadow:none;
  --logo-a:#f5a524; --logo-b:#121417;
  --focus:#f5a524; --focus-ring:rgba(245,165,36,.15);
  --accent-grad:linear-gradient(135deg,#f7b13c,#e08a0b); --on-accent:#111; --accent-shadow:0 6px 14px rgba(245,165,36,.22);
  --on-badge:#d5d8dc;
  --p1:#23272c; --p2:#2a2e34; --p3:#262a30; --p4:#2e3238; --p5:#24282d; --p6:#2c3036; --on-p:#e9eaec;
  --c1:#f5a524; --c2:#d0d3d8; --c3:#959ba4; --c4:#636a73; --c5:#454b53; --c6:#33383f; --c0:#272b31;
  --bar:#f5a524;
  --mc-fg:#f1f2f4;
  --mc-std:linear-gradient(135deg,#2c3036 0%,#17191c 100%);
  --mc-silv:linear-gradient(135deg,#545a63 0%,#25292e 100%);
  --mc-gold:linear-gradient(135deg,#6b5122 0%,#231c10 100%);
  --mc-plat:linear-gradient(135deg,#3d3c4a 0%,#141419 100%);
  --mc-oth:linear-gradient(135deg,#2c3036 0%,#17191c 100%);
  --mc-blob:rgba(255,255,255,.04); --mc-chip:rgba(255,255,255,.1); --mc-bc:rgba(255,255,255,.92); --bc-line:#111;
  --camp-bg:#2b2416; --camp-fg:#f5a524;
  --emo-filter:grayscale(1);
  --scan-bg:#0e0f11;
}

/* ── 🏛️ ทางการ — กรมท่า/ทอง ตาม Rattana design system ── */
body[data-theme="formal"]{
  --bg:#f4f6fb; --dot:transparent;
  --card:#ffffff; --card-2:#fafbfd;
  --text:#0d1b3e; --muted:#6b7896; --border:#dde3f0;
  --ink:#1a2f5e;
  --pink:#c9a84c; --mint:#dfe6f2; --lav:#c9d2e8; --lemon:#ecd9a0; --peach:#f3d9c4; --sky:#d8e6f7; --silver:#d5dbe5;
  --pink-soft:#e9edf6; --mint-soft:#eef2f8; --lav-soft:#ebeef6; --lemon-soft:#f8f1dc;
  --peach-soft:#fbeee3; --sky-soft:#e8f0fa; --silver-soft:#eef1f5;
  --danger:#e74c3c; --ok:#2ecc71;
  --shadow:0 2px 8px rgba(0,0,0,.06); --shadow-lg:0 8px 24px rgba(13,27,62,.12);
  --r-sm:6px; --r-md:12px; --r-lg:16px;
  --font-head:'Sarabun',sans-serif; --head-w:700;
  --head-bg:#0d1b3e; --head-fg:#ffffff; --head-muted:rgba(255,255,255,.65); --head-accent:#c9a84c;
  --head-shadow:0 2px 8px rgba(0,0,0,.12); --head-border:3px solid #c9a84c;
  --head-btn:rgba(255,255,255,.1); --head-btn-shadow:none;
  --logo-a:#c9a84c; --logo-b:#0d1b3e;
  --focus:#c9a84c; --focus-ring:rgba(201,168,76,.2);
  --accent-grad:linear-gradient(135deg,#e8c86a,#c9a84c); --on-accent:#0d1b3e; --accent-shadow:0 4px 12px rgba(201,168,76,.35);
  --on-badge:#0d1b3e;
  --p1:#e3e8f2; --p2:#eef1f6; --p3:#f3ead0; --p4:#e6eaf3; --p5:#dde4f0; --p6:#ece6d6; --on-p:#0d1b3e;
  --c1:#0d1b3e; --c2:#c9a84c; --c3:#3d5a99; --c4:#e8c86a; --c5:#7f93bd; --c6:#b9c4dc; --c0:#dde3f0;
  --bar:#1a2f5e;
  --mc-fg:#ffffff;
  --mc-std:linear-gradient(135deg,#243b73 0%,#0d1b3e 100%);
  --mc-silv:linear-gradient(135deg,#8a96ab 0%,#4d5a70 100%);
  --mc-gold:linear-gradient(135deg,#f0d27a 0%,#c9a84c 55%,#a07830 100%); --mc-gold-fg:#0d1b3e;
  --mc-plat:linear-gradient(135deg,#0d1b3e 0%,#243b73 60%,#6b5a2e 130%);
  --mc-oth:linear-gradient(135deg,#243b73 0%,#0d1b3e 100%);
  --mc-blob:rgba(255,255,255,.07); --mc-chip:rgba(255,255,255,.18); --mc-bc:rgba(255,255,255,.95); --bc-line:#0d1b3e;
  --camp-bg:#f8f1dc; --camp-fg:#7a5a12;
  --emo-filter:grayscale(1);
  --scan-bg:#0d1b3e;
}

/* ── 🍵 มัทฉะ — กระดาษอุ่น เขียวชา (ธีมแนะนำ) ── */
body[data-theme="matcha"]{
  --bg:#f5f1e6; --dot:#ebe4d1;
  --card:#fffdf7; --card-2:#faf6ec;
  --text:#2f3a2c; --muted:#857f6c; --border:#e6dfcc;
  --ink:#557a46;
  --pink:#8fb47c; --mint:#c9dcb6; --lav:#d9cfc0; --lemon:#ecd9a0; --peach:#e9c9ab; --sky:#cfe0d6; --silver:#d8d7cf;
  --pink-soft:#ebe5d1; --mint-soft:#e3ecd6; --lav-soft:#ece6dc; --lemon-soft:#f4ebcd;
  --peach-soft:#f3e3d4; --sky-soft:#e0e9e3; --silver-soft:#ebeae4;
  --danger:#c8553d; --ok:#5f9a4f;
  --shadow:0 4px 14px rgba(110,100,70,.09); --shadow-lg:0 12px 30px rgba(90,80,50,.16);
  --r-sm:10px; --r-md:16px; --r-lg:22px;
  --head-bg:linear-gradient(120deg,#e6eed6 0%,#f3ead2 100%); --head-accent:#557a46;
  --head-shadow:0 3px 10px rgba(120,110,80,.10); --head-border:2px solid #e0d6bd;
  --head-btn:rgba(255,255,255,.7); --head-btn-shadow:0 1px 4px rgba(120,110,80,.12);
  --logo-a:#7fa36c; --logo-b:#f7f1df;
  --focus:#7fa36c; --focus-ring:rgba(127,163,108,.2);
  --accent-grad:linear-gradient(135deg,#86ab72,#557a46); --on-accent:#fff; --accent-shadow:0 6px 14px rgba(85,122,70,.25);
  --on-badge:#2f3a2c;
  --p1:#dfe8d2; --p2:#efe6cc; --p3:#e8dccb; --p4:#d8e4dc; --p5:#ece3d2; --p6:#e2dccd; --on-p:#3b4636;
  --c1:#7fa36c; --c2:#d9b26a; --c3:#c98b6b; --c4:#a7bf8f; --c5:#8c9a7b; --c6:#e2cfa3; --c0:#e2dccd;
  --bar:#8fb47c;
  --mc-fg:#2f3a2c;
  --mc-std:linear-gradient(135deg,#e4edd5 0%,#b9cfa3 100%);
  --mc-silv:linear-gradient(135deg,#f3f1ea 0%,#d4d2c8 100%);
  --mc-gold:linear-gradient(135deg,#f5e6b8 0%,#d9b26a 100%);
  --mc-plat:linear-gradient(135deg,#86ab72 0%,#3f5f36 100%); --mc-plat-fg:#fffdf7;
  --mc-oth:linear-gradient(135deg,#e0e9e3 0%,#bfd3c6 100%);
  --mc-blob:rgba(255,255,255,.3); --mc-chip:rgba(255,255,255,.55); --mc-bc:rgba(255,253,247,.9); --bc-line:#2f3a2c;
  --camp-bg:#f3e3d4; --camp-fg:#7a4a26;
  --scan-bg:#2f3a2c;
}

/* ══════════════ Base ══════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Sarabun',sans-serif;font-size:14px;line-height:1.5;color:var(--text);min-height:100dvh;overflow-x:hidden;
  background-color:var(--bg);
  background-image:radial-gradient(var(--dot) 1.6px,transparent 1.7px);background-size:22px 22px;
  transition:background-color .25s,color .25s}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
input{font-family:inherit;font-size:16px;color:var(--text)}
h1,h2,h3,.mitr{font-family:var(--font-head);font-weight:500}
.num{font-variant-numeric:tabular-nums}

/* ══════════════ Header ══════════════ */
header{position:sticky;top:0;z-index:100;background:var(--head-bg);padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));
  display:flex;align-items:center;gap:10px;box-shadow:var(--head-shadow);border-bottom:var(--head-border);color:var(--head-fg)}
.logo{display:flex;align-items:center;gap:9px;flex:1;min-width:0}
.logo-mac{width:38px;height:38px;flex-shrink:0;position:relative}
.logo-mac i{position:absolute;left:3px;right:3px;height:12px;border-radius:12px}
.logo-mac i:nth-child(1){top:4px;background:var(--logo-a)}
.logo-mac i:nth-child(2){top:14px;left:6px;right:6px;height:8px;background:var(--logo-b);border-radius:4px}
.logo-mac i:nth-child(3){top:21px;background:var(--logo-a)}
.logo-text{line-height:1.1;min-width:0}
.logo-text b{font-family:var(--font-head);font-weight:600;font-size:18px;letter-spacing:.3px;display:block;white-space:nowrap}
.logo-text b span{color:var(--head-accent)}
.logo-text small{font-size:11px;color:var(--head-muted)}
.icon-btn{width:40px;height:40px;border-radius:50%;background:var(--head-btn);color:var(--head-fg);display:flex;align-items:center;justify-content:center;font-size:17px;box-shadow:var(--head-btn-shadow);transition:transform .15s}
.icon-btn:active{transform:scale(.92)}
.hub-btn{display:flex;align-items:center;gap:4px;background:var(--head-btn);color:var(--head-fg);border-radius:20px;padding:0 12px;height:40px;font-size:13px;font-weight:700;text-decoration:none;white-space:nowrap;box-shadow:var(--head-btn-shadow)}

/* ══════════════ Layout ══════════════ */
.screen{display:none;max-width:760px;margin:0 auto;padding:14px 14px 90px;animation:fadeUp .25s ease}
.screen.active{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card{background:var(--card);border-radius:var(--r-md);box-shadow:var(--shadow);border:1px solid var(--border)}
.sec-title{display:flex;align-items:center;gap:8px;font-family:var(--font-head);font-weight:var(--head-w);font-size:16px;margin:20px 4px 10px}
.sec-title .em{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px}
.sec-title small{margin-left:auto;font-family:'Sarabun';font-size:12px;color:var(--muted);font-weight:400}

/* ══════════════ Tier chips (stats) ══════════════ */
.chips{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.chip-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(64px,1fr));gap:8px}
.chip.big{display:flex;align-items:center;justify-content:center;gap:14px;padding:12px 16px}
.chip.big .c-emo{font-size:32px}
.chip.big .c-txt{text-align:left}
.chip.big .c-val{font-size:30px;line-height:1.1}
.chip.big .c-lbl{font-size:12.5px}
.chip{border-radius:var(--r-md);padding:10px 6px 9px;text-align:center;border:2px solid transparent;transition:transform .15s,border-color .15s;position:relative;overflow:hidden}
.chip:active{transform:scale(.96)}
.chip .c-emo{font-size:18px;line-height:1}
.chip .c-val{font-family:var(--font-head);font-size:19px;font-weight:500;line-height:1.3}
.chip .c-lbl{font-size:11px;color:var(--muted);font-weight:600}
.chip.sel{border-color:var(--ink)}
.chip.all{background:var(--pink-soft)} .chip.std{background:var(--mint-soft)}
.chip.gold{background:var(--lemon-soft)} .chip.plat{background:var(--lav-soft)}
.chip.silv{background:var(--silver-soft)} .chip.oth{background:var(--sky-soft)}

/* ══════════════ Search box ══════════════ */
.search-box{padding:12px;margin-bottom:10px}
.search-row{display:flex;gap:8px}
.search-input-wrap{position:relative;flex:1}
.search-input-wrap .s-ico{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:16px;opacity:.6;pointer-events:none}
.search-input{width:100%;height:50px;border:2px solid var(--border);border-radius:25px;padding:0 42px 0 40px;background:var(--card-2);outline:none;transition:border-color .2s,box-shadow .2s}
.search-input:focus{border-color:var(--focus);box-shadow:0 0 0 4px var(--focus-ring)}
.search-input::placeholder{color:var(--muted)}
.clear-btn{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:50%;display:none;align-items:center;justify-content:center;background:var(--pink-soft);color:var(--ink);font-size:15px;font-weight:700}
.clear-btn.visible{display:flex}
.scan-btn{height:50px;padding:0 18px;border-radius:25px;flex-shrink:0;display:flex;align-items:center;gap:7px;font-weight:700;font-size:14px;color:var(--on-accent);
  background:var(--accent-grad);box-shadow:var(--accent-shadow);transition:transform .12s}
.scan-btn svg{width:20px;height:20px;fill:currentColor}
.scan-btn:active{transform:scale(.95)}
.stat-line{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);margin:8px 4px 0;min-height:20px}
.sdot{width:9px;height:9px;border-radius:50%;background:var(--muted);flex-shrink:0}
.sdot.ok{background:var(--ok)} .sdot.err{background:var(--danger)} .sdot.loading{background:var(--lemon);animation:pulse 1.1s infinite}
@keyframes pulse{50%{opacity:.4;transform:scale(.8)}}

/* ══════════════ Result list ══════════════ */
.list{display:flex;flex-direction:column;gap:9px}
.m-row{display:flex;align-items:center;gap:12px;padding:11px 13px;text-align:left;width:100%;transition:transform .12s,box-shadow .15s}
.m-row:active{transform:scale(.985)}
@media(hover:hover){.m-row:hover{box-shadow:var(--shadow-lg)}}
.ava{width:46px;height:46px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:var(--font-head);font-size:19px;font-weight:500;color:var(--on-p)}
.m-main{flex:1;min-width:0}
.m-name{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-sub{font-size:12.5px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.m-right{text-align:right;flex-shrink:0}
.m-pts{font-family:var(--font-head);font-size:17px;color:var(--ink);line-height:1.2}
.m-pts small{font-family:'Sarabun';font-size:11px;color:var(--muted);display:block}
.badge{display:inline-flex;align-items:center;gap:3px;padding:2px 9px;border-radius:12px;font-size:11px;font-weight:700;white-space:nowrap;color:var(--on-badge)}
.b-std{background:var(--mint)} .b-silv{background:var(--silver)} .b-gold{background:var(--lemon)} .b-plat{background:var(--lav)} .b-oth{background:var(--sky)}
.b-exp{background:#ffd0d8;color:#c23a59} .b-soon{background:var(--peach);color:#8a4a22}
.more-note{text-align:center;font-size:12px;color:var(--muted);padding:10px}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty .e-emo{font-size:46px;margin-bottom:6px}
.empty b{display:block;font-family:var(--font-head);font-weight:500;color:var(--text);font-size:16px;margin-bottom:2px}

/* ══════════════ Skeleton ══════════════ */
.skel{height:68px;border-radius:var(--r-md);background:linear-gradient(90deg,var(--card) 0%,var(--pink-soft) 50%,var(--card) 100%);background-size:200% 100%;animation:shimmer 1.2s infinite}
@keyframes shimmer{to{background-position:-200% 0}}

/* ══════════════ Detail — back bar ══════════════ */
.back-bar{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.back-btn{height:42px;padding:0 16px 0 12px;border-radius:21px;background:var(--card);border:1px solid var(--border);box-shadow:var(--shadow);font-weight:700;font-size:14px;display:flex;align-items:center;gap:4px}
.back-btn:active{transform:scale(.96)}

/* ══════════════ Member card (macaron) ══════════════ */
.mcard{border-radius:var(--r-lg);padding:18px 18px 14px;position:relative;overflow:hidden;color:var(--mc-fg);box-shadow:var(--shadow-lg)}
.mcard::before,.mcard::after{content:'';position:absolute;border-radius:50%;background:var(--mc-blob)}
.mcard::before{width:180px;height:180px;right:-60px;top:-70px}
.mcard::after{width:110px;height:110px;left:-40px;bottom:-50px;background:var(--mc-blob)}
.mc-std{background:var(--mc-std);color:var(--mc-std-fg,var(--mc-fg))}
.mc-silv{background:var(--mc-silv);color:var(--mc-silv-fg,var(--mc-fg))}
.mc-gold{background:var(--mc-gold);color:var(--mc-gold-fg,var(--mc-fg))}
.mc-plat{background:var(--mc-plat);color:var(--mc-plat-fg,var(--mc-fg))}
.mc-oth{background:var(--mc-oth);color:var(--mc-oth-fg,var(--mc-fg))}
.mc-top{display:flex;align-items:flex-start;justify-content:space-between;position:relative;z-index:1}
.mc-brand{font-family:var(--font-head);font-size:12px;letter-spacing:1.5px;opacity:.75}
.mc-tier{font-family:var(--font-head);font-size:13px;font-weight:600;background:var(--mc-chip);padding:3px 12px;border-radius:14px}
.mc-name{font-family:var(--font-head);font-size:23px;font-weight:500;margin-top:14px;line-height:1.25;position:relative;z-index:1;word-break:break-word}
.mc-code{font-size:13px;opacity:.8;position:relative;z-index:1}
.mc-pts{display:flex;align-items:flex-end;justify-content:space-between;margin-top:12px;position:relative;z-index:1;gap:10px}
.mc-pts .big{font-family:var(--font-head);font-size:36px;font-weight:600;line-height:1}
.mc-pts .big small{font-size:14px;font-weight:400;margin-left:4px}
.mc-pts .exp{font-size:12px;text-align:right;opacity:.85}
.mc-bc{margin-top:12px;background:var(--mc-bc);border-radius:14px;padding:6px 10px 2px;position:relative;z-index:1;text-align:center}
.mc-bc svg{max-width:100%;height:58px}

/* ══════════════ Info grid ══════════════ */
.info-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:12px}
.info{padding:11px 13px;border-radius:var(--r-sm);background:var(--card);border:1px solid var(--border)}
.info.wide{grid-column:1/-1}
.info .i-lbl{font-size:11px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:5px}
.info .i-val{font-size:14.5px;font-weight:600;margin-top:1px;word-break:break-word}
.info a{color:var(--ink);text-decoration:none}

/* ══════════════ Summary tiles ══════════════ */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
@media(min-width:620px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{border-radius:var(--r-md);padding:12px 13px}
.tile .t-lbl{font-size:11.5px;font-weight:600;color:var(--muted)}
.tile .t-val{font-family:var(--font-head);font-size:21px;font-weight:500;line-height:1.3}
.tile .t-sub{font-size:11px;color:var(--muted)}
.t1{background:var(--pink-soft)} .t2{background:var(--mint-soft)} .t3{background:var(--lemon-soft)} .t4{background:var(--sky-soft)}

/* ══════════════ Charts (pure CSS) ══════════════ */
.chart-card{padding:14px}
.mbars{display:flex;align-items:flex-end;gap:5px;height:130px;padding-top:16px}
.mbar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;min-width:0}
.mbar .bar{width:100%;max-width:30px;border-radius:9px 9px 5px 5px;min-height:4px;position:relative;transition:height .5s cubic-bezier(.2,.8,.3,1)}
.mbar .bar span{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:9.5px;color:var(--muted);white-space:nowrap}
.mbar .lbl{font-size:10px;color:var(--muted);white-space:nowrap}
.top-item{display:flex;align-items:center;gap:10px;padding:7px 0}
.top-item .ti-emo{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.top-item .ti-main{flex:1;min-width:0}
.top-item .ti-name{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-item .ti-track{height:9px;border-radius:5px;background:var(--border);margin-top:4px;overflow:hidden}
.top-item .ti-fill{height:100%;border-radius:5px}
.top-item .ti-qty{font-size:12px;color:var(--muted);text-align:right;flex-shrink:0;min-width:58px}
.cat-stack{display:flex;height:16px;border-radius:9px;overflow:hidden;margin:6px 0 10px}
.cat-legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px}
.cat-legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}

/* ══════════════ History timeline ══════════════ */
.month-h{font-family:var(--font-head);font-size:13.5px;color:var(--muted);margin:14px 6px 7px;display:flex;justify-content:space-between}
.bill{margin-bottom:8px;overflow:hidden}
.bill-head{width:100%;display:flex;align-items:center;gap:11px;padding:11px 13px;text-align:left}
.bill-date{width:46px;height:50px;border-radius:13px;color:var(--on-p);flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05}
.bill-date b{font-family:var(--font-head);font-size:19px;font-weight:500}
.bill-date small{font-size:10px}
.bill-main{flex:1;min-width:0}
.bill-main .bm-1{font-weight:700;font-size:14px}
.bill-main .bm-2{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bill-amt{text-align:right;flex-shrink:0}
.bill-amt b{font-family:var(--font-head);font-weight:500;font-size:16px;display:block}
.bill-amt small{font-size:11px;color:var(--ok);font-weight:700}
.bill-arrow{transition:transform .2s;color:var(--muted);font-size:12px}
.bill.open .bill-arrow{transform:rotate(180deg)}
.bill-items{display:none;border-top:2px dashed var(--border);padding:8px 13px 11px;background:var(--card-2)}
.bill.open .bill-items{display:block}
.bi-row{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:4px 0}
.bi-row .q{color:var(--muted);font-size:12px}
.bi-total{display:flex;justify-content:space-between;border-top:1px solid var(--border);margin-top:5px;padding-top:6px;font-weight:700;font-size:13.5px}

.bob{display:inline-block;animation:bob 1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(-6deg)}}
.retry-btn{margin-top:10px;background:var(--accent-grad);color:var(--on-accent);border-radius:999px;padding:8px 18px;font-weight:700;font-size:13px}
.camp{display:inline-block;background:var(--camp-bg);color:var(--camp-fg);border-radius:6px;font-size:10.5px;font-weight:700;padding:0 5px;margin-left:4px}

/* ══════════════ Scanner ══════════════ */
.scan-status{display:flex;align-items:center;gap:8px;padding:10px 14px;margin-bottom:10px;font-size:13px;color:var(--muted);min-height:44px}
.scanner-wrap{background:var(--scan-bg);border-radius:var(--r-lg) var(--r-lg) 0 0;overflow:hidden;position:relative;min-height:220px}
#html5-qr-reader{width:100%;border:none!important}
#html5-qr-reader video{width:100%!important;object-fit:cover;display:block}
#html5-qr-reader img,#html5-qr-reader__dashboard,#html5-qr-reader__header_message{display:none!important}
.scanner-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:10}
.scanner-frame{width:min(300px,80%);height:170px;border-radius:18px;position:relative;box-shadow:0 0 0 2000px rgba(42,32,53,.42)}
.scanner-line{position:absolute;left:12px;right:12px;height:3px;border-radius:3px;background:linear-gradient(90deg,var(--pink),var(--lav),var(--sky));animation:scanline 1.8s ease-in-out infinite}
@keyframes scanline{0%{top:8px}50%{top:156px}100%{top:8px}}
.scan-corner{position:absolute;width:24px;height:24px;border:0 solid var(--pink)}
.sc-tl{top:-2px;left:-2px;border-top-width:4px;border-left-width:4px;border-top-left-radius:12px}
.sc-tr{top:-2px;right:-2px;border-top-width:4px;border-right-width:4px;border-top-right-radius:12px}
.sc-bl{bottom:-2px;left:-2px;border-bottom-width:4px;border-left-width:4px;border-bottom-left-radius:12px}
.sc-br{bottom:-2px;right:-2px;border-bottom-width:4px;border-right-width:4px;border-bottom-right-radius:12px}
.scanner-hint{background:var(--card);border:1px solid var(--border);border-top:none;border-radius:0 0 var(--r-lg) var(--r-lg);padding:10px;text-align:center;font-size:12.5px;color:var(--muted);margin-bottom:10px}
.scanner-controls{display:flex;gap:8px;margin-bottom:10px}
.stop-btn{flex:1;height:48px;border-radius:24px;background:var(--danger);color:#fff;font-weight:700;font-size:14px}
.torch-btn{display:none;align-items:center;gap:6px;height:48px;padding:0 18px;border-radius:24px;background:var(--lemon-soft);color:var(--text);font-weight:700;font-size:13px;border:2px solid var(--lemon)}
.torch-btn.on{background:var(--lemon)}
.manual-row{display:flex;gap:8px}
.manual-input{flex:1;height:48px;border:2px solid var(--border);border-radius:24px;padding:0 16px;background:var(--card);outline:none}
.manual-input:focus{border-color:var(--lav)}
.manual-btn{height:48px;padding:0 20px;border-radius:24px;background:var(--accent-grad);color:var(--on-accent);font-weight:700}

/* ══════════════ Misc ══════════════ */
#backToTop{position:fixed;bottom:max(22px,calc(14px + env(safe-area-inset-bottom)));right:16px;width:48px;height:48px;border-radius:50%;background:var(--accent-grad);color:var(--on-accent);font-size:20px;font-weight:700;display:none;align-items:center;justify-content:center;box-shadow:var(--accent-shadow);z-index:90}
#backToTop.show{display:flex}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(24px,env(safe-area-inset-bottom));background:var(--card);color:var(--text);border:2px solid var(--focus);padding:10px 18px;border-radius:22px;box-shadow:var(--shadow-lg);z-index:9999;font-size:13.5px;font-weight:600;animation:toastIn .25s ease;max-width:90vw}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,12px)}}
#loadingBar{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--pink),var(--lav),var(--sky));width:0;transition:width .5s;z-index:10000}
footer{text-align:center;font-size:11px;color:var(--muted);padding:8px 0 0}
.logo-text b{overflow:hidden;text-overflow:ellipsis}
@media(max-width:420px){header{gap:6px;padding-left:10px;padding-right:10px}.logo{gap:6px}.logo-mac{width:30px;height:32px}.logo-text b{font-size:16px}.icon-btn{width:36px;height:36px;font-size:15px}.hub-btn{height:36px;padding:0 10px;font-size:12px}}
@media(max-width:380px){.logo-text small{display:none}.scan-btn span{display:none}.scan-btn{padding:0 14px}}

/* ══════════════ Theme extras ══════════════ */
/* ธีมโทนเรียบ: อีโมจิเป็นขาวดำ ให้ดูเป็นไอคอน ไม่ใช่สติกเกอร์ */
.c-emo,.sec-title .em,.ti-emo,.e-emo,.i-lbl,.mc-tier,.bm-1,.bm-2,.bi-row>span:first-child,.s-ico,.icon-btn,.hub-btn,.torch-btn,.tile .t-val{filter:var(--emo-filter)}
body[data-theme="carbon"] .badge,body[data-theme="carbon"] .m-sub>span:first-child{filter:grayscale(1)}
/* โลโก้: คาร์บอน/ทางการ ใช้ตัว R แทนมาการอง */
body[data-theme="carbon"] .logo-mac i,body[data-theme="formal"] .logo-mac i{display:none}
body[data-theme="carbon"] .logo-mac,body[data-theme="formal"] .logo-mac{background:var(--logo-a);border-radius:10px;display:flex;align-items:center;justify-content:center}
body[data-theme="carbon"] .logo-mac::after,body[data-theme="formal"] .logo-mac::after{content:'R';font-family:var(--font-head);font-weight:700;font-size:20px;color:var(--logo-b)}
body[data-theme="formal"] .logo-text b{letter-spacing:1px}

/* ══════════════ Theme picker (bottom sheet) ══════════════ */
.sheet-ov{position:fixed;inset:0;background:rgba(10,10,20,.45);z-index:9000;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px)}
.sheet-ov.open{display:flex}
.sheet{background:var(--card);color:var(--text);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:10px 16px max(18px,env(safe-area-inset-bottom));max-height:88dvh;overflow-y:auto;animation:sheetUp .25s ease;box-shadow:0 -10px 30px rgba(0,0,0,.2)}
@keyframes sheetUp{from{transform:translateY(40px);opacity:0}}
.sheet-grip{width:44px;height:5px;border-radius:3px;background:var(--border);margin:0 auto 10px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sheet-head h3{font-family:var(--font-head);font-weight:var(--head-w);font-size:17px}
.sheet-head small{display:block;font-size:12px;color:var(--muted);font-family:'Sarabun',sans-serif;font-weight:400}
.sheet-x{width:36px;height:36px;border-radius:50%;background:var(--card-2);border:1px solid var(--border);font-size:16px;color:var(--muted)}
.th-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:520px){.th-grid{grid-template-columns:repeat(3,1fr)}}
.th-card{border:2px solid var(--border);border-radius:16px;padding:7px 7px 9px;text-align:left;background:var(--card-2);position:relative;transition:transform .12s,border-color .15s}
.th-card:active{transform:scale(.97)}
.th-card.sel{border-color:var(--ink);box-shadow:0 0 0 3px var(--focus-ring)}
.th-prev{height:82px;border-radius:11px;overflow:hidden;position:relative;border:1px solid rgba(0,0,0,.06)}
.th-prev .pv-h{height:20px;display:flex;align-items:center;gap:4px;padding:0 7px}
.th-prev .pv-h i{width:9px;height:9px;border-radius:3px}
.th-prev .pv-h b{height:5px;width:34px;border-radius:3px;opacity:.8}
.th-prev .pv-card{position:absolute;left:7px;right:7px;top:27px;height:22px;border-radius:7px;display:flex;align-items:center;gap:5px;padding:0 6px}
.th-prev .pv-card i{width:12px;height:12px;border-radius:50%}
.th-prev .pv-card b{height:4px;flex:1;border-radius:2px;opacity:.5}
.th-prev .pv-row{position:absolute;left:7px;right:7px;bottom:7px;height:20px;display:flex;gap:5px}
.th-prev .pv-row span{flex:1;border-radius:6px}
.th-prev .pv-row em{width:30px;border-radius:10px}
.th-name{font-weight:700;font-size:14px;margin-top:7px;display:flex;align-items:center;gap:5px}
.th-desc{font-size:11.5px;color:var(--muted);line-height:1.35;margin-top:1px}
.th-rec{position:absolute;top:-8px;right:8px;background:var(--accent-grad);color:var(--on-accent);font-size:10.5px;font-weight:700;padding:1px 8px;border-radius:10px;box-shadow:var(--accent-shadow)}
.th-check{margin-left:auto;width:18px;height:18px;border-radius:50%;background:var(--ink);color:var(--card);font-size:11px;display:none;align-items:center;justify-content:center}
.th-card.sel .th-check{display:flex}
</style>
</head>
<body>
<div id="loadingBar"></div>

<header>
  <div class="logo">
    <div class="logo-mac"><i></i><i></i><i></i></div>

</header>

<!-- ═════════ MAIN: search ═════════ -->
<section class="screen active" id="s-main">
  <div class="chips" id="chips"></div>

  <div class="card search-box">
    <div class="search-row">
      <div class="search-input-wrap">
        <span class="s-ico">🔍</span>
        <input id="search-input" class="search-input" type="search" inputmode="search" autocomplete="off"
               placeholder="ชื่อ, นามสกุล, เบอร์โทร หรือรหัสสมาชิก">

<!-- ═════════ SCANNER ═════════ -->
<section class="screen" id="s-scanner">
  <div class="back-bar"><button class="back-btn" id="scanner-back">‹ กลับ</button><h3 style="font-size:16px">สแกนบัตรสมาชิก</h3></div>
  <div class="card scan-status" id="scan-status"><span class="sdot"></span><span id="scan-status-text">กำลังเปิดกล้อง...</span></div>

    <button class="manual-btn" id="manual-search-btn">ค้นหา</button>
  </div>
</section>

<!-- ═════════ DETAIL ═════════ -->
<section class="screen" id="s-detail">
  <div class="back-bar"><button class="back-btn" id="detail-back">‹ กลับ</button></div>
  <div id="detail-body"></div>
</section>

<div class="sheet-ov" id="themeSheet" onclick="if(event.target===this)closeThemes()">

/* ══════════════════════════ DATA ══════════════════════════ */
function parseCsv(text) {
  if (!text) return [];
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i+1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch; }
    else if (ch === '"') q = true;
    else if (ch === ',') { row.push(cell); cell = ''; }
    else if (ch === '\r') {}
    else if (ch === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += ch;
  }
  if (cell.length || row.length) { row.push(cell); rows.push(row); }
  if (!rows.length) return [];
  const clean = s => String(s || '').replace(/[​‌‍﻿]/g, '').replace(/ /g, ' ').trim();
  const headers = rows[0].map(clean);
  return rows.slice(1).filter(r => r.some(c => clean(c))).map(r => Object.fromEntries(headers.map((k, i) => [k, clean(r[i])]).filter(([k]) => k)));
}
async function loadFromSheets(sheetId, sheetName) {
  const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(sheetName)}`;
  const res = await fetch(url, { cache: 'no-store' });
  if (!res.ok) throw new Error('fetch failed ' + res.status);
  return parseCsv(await res.text());
}
function normalizeMember(r) {
  const code = String(r.MB_CODE || '').trim();
  const name = r.MB_NAME || '', surname = r.MB_SURNME || '';
  const addr = [r.MB_ADDR_1, r.MB_ADDR_2, r.MB_ADDR_3,
    r.MB_ADDR_SUB_DISTRICT && 'ต.' + r.MB_ADDR_SUB_DISTRICT,
    r.MB_ADDR_DISTRICT && 'อ.' + r.MB_ADDR_DISTRICT,
    r.MB_ADDR_PROVINCE && 'จ.' + r.MB_ADDR_PROVINCE, r.MB_POST].filter(Boolean).join(' ');
  return {
    code, title: r.MB_INTL || '', name, surname, full: `${name} ${surname}`.trim(),
    sex: r.MB_SEX || '', tier: r.MT_NAME || '', points: parseFloat(r.MB_SH_POINT) || 0,
    birth: parseDMY(r.MB_BIRTH), expire: parseDMY(r.MB_EXPIRE),
    phone: String(r.MB_PHONE_HND || '').trim(), addr, province: r.MB_ADDR_PROVINCE || '',
    note: r.Note || '',
    _key: `${code} ${digits(r.MB_PHONE_HND)} ${name} ${surname}`.toLowerCase(),
  };
}
function hydrate(raw) {
  allMembers = raw.map(normalizeMember).filter(m => m.code);
  allMembers.forEach(m => { m.birth = m.birth ? new Date(m.birth) : null; m.expire = m.expire ? new Date(m.expire) : null; });
}

async function loadData(force = false) {

    if (!force) {

      } catch {}
    }
    const raw = await loadFromSheets(MEMBER_SOURCE.sheetId, MEMBER_SOURCE.sheetName);
    try { localStorage.setItem(CACHE_KEY, JSON.stringify({ ts: Date.now(), data: raw })); } catch {}
    hydrate(raw);
    renderAll();

    if (!allMembers.length) {
      setStat('โหลดข้อมูลไม่สำเร็จ — ตรวจสอบอินเทอร์เน็ตแล้วกด 🔄', 'err');

    } else showToast('อัปเดตไม่สำเร็จ ใช้ข้อมูลล่าสุดในเครื่อง');

}
/* ── ประวัติการซื้อ: ดึงเฉพาะแถวของสมาชิกคนเดียว ── */
async function fetchSales(code) {
  const safe = String(code).replace(/['"\\]/g, '');
  const tq = `select ${SALES_SOURCE.select} where ${SALES_SOURCE.memberCol} = '${safe}'`;
  const url = `https://docs.google.com/spreadsheets/d/${SALES_SOURCE.sheetId}/gviz/tq?tqx=out:csv&tq=${encodeURIComponent(tq)}`;
  const ctl = new AbortController(); const timer = setTimeout(() => ctl.abort(), 30000);
  try {
    const res = await fetch(url, { cache: 'no-store', signal: ctl.signal });
    if (!res.ok) throw new Error('fetch failed ' + res.status);
    const text = await res.text();
    if (/^\s*</.test(text)) throw new Error('not csv');          // หน้า login/error ของ Google
    return groupBills(parseCsv(text));
  } finally { clearTimeout(timer); }
}
function groupBills(rows) {
  const bills = new Map();
  rows.forEach(r => {
    const no = r.BILL_NO; if (!no) return;
    if (!bills.has(no)) bills.set(no, { no, date: parseDMY(r.DATE) || new Date(NaN), slot: r.TIME_SLOTS || '', byItem: new Map(), amount: 0 });
    const b = bills.get(no); const amt = parseFloat(r.TOTAL) || 0;
    const name = r.PRODUCT_NAME || '-', unit = String(r.UNIT || '').replace(/\s*\([^)]*\)\s*$/, '').replace(/x1$/, '');
    // สินค้าเดียวกันในบิลเดียวกัน (bplus แยกบรรทัดตามแคมเปญ: บรรทัดจำนวน ฿0 + บรรทัดราคา จำนวน 0) → รวมเป็นบรรทัดเดียว
    const key = name + '|' + unit; let it = b.byItem.get(key);
    if (!it) { const cat = r.CAT_TYPE || 'อื่นๆ'; it = { name, unit, cat, qty: 0, free: 0, amount: 0, emo: catEmo(cat), camp: '' }; b.byItem.set(key, it); }
    it.qty += parseFloat(r.SALES_QTY) || 0; it.free += parseFloat(r.FREE_QTY) || 0; it.amount += amt;
    if (r.CAMPAIGN && !it.camp) it.camp = r.CAMPAIGN;
    b.amount += amt;
  });
  return [...bills.values()].map(({ byItem, ...b }) => ({ ...b, items: [...byItem.values()] }))
    .filter(b => !isNaN(b.date)).sort((a, b) => b.date - a.date || (a.no < b.no ? 1 : -1));
}
function salesOf(m) {                       // คืนสถานะปัจจุบัน และสั่งโหลดถ้ายังไม่มี/หมดอายุ
  const c = salesCache.get(m.code);
  if (c && (c.loading || c.error || Date.now() - c.ts < TTL)) return c;
  const st = { loading: true, bills: c?.bills || null, ts: c?.ts || 0 };   // เก็บข้อมูลเก่าไว้โชว์ระหว่างโหลดใหม่
  salesCache.set(m.code, st);
  fetchSales(m.code)
    .then(bills => salesCache.set(m.code, { bills, ts: Date.now() }))
    .catch(() => salesCache.set(m.code, { error: true, bills: st.bills, ts: st.ts }))
    .finally(() => { if (currentMember && currentMember.code === m.code && $('s-detail').classList.contains('active')) showDetail(currentMember, true); });
  return st;
}
function retrySales() { if (!currentMember) return; salesCache.delete(currentMember.code); showDetail(currentMember, true); }

async function refreshData() {
  const b = $('btnRefresh'); b.disabled = true; b.style.transition = 'transform .6s'; b.style.transform = 'rotate(360deg)';

  b.disabled = false; setTimeout(() => { b.style.transform = ''; b.style.transition = ''; }, 600);
  if (currentMember && $('s-detail').classList.contains('active')) {
    const m = allMembers.find(x => x.code === currentMember.code); if (m) showDetail(m, true);
  }
  showToast('อัปเดตข้อมูลเรียบร้อย ✨');
}

function renderAll() { renderChips(); doSearch($('search-input').value); }

function renderChips() {
  const c = { all: allMembers.length };
  allMembers.forEach(m => { const k = m.tier || 'ไม่ระบุ'; c[k] = (c[k] || 0) + 1; });
  // ระดับที่รู้จักเรียงตามลำดับ + ระดับใหม่ที่เจอในชีต (ถ้ามี) ต่อท้าย
  const tiers = [...Object.keys(TIER), ...Object.keys(c).filter(k => k !== 'all' && !TIER[k])];
  const chip = (key, cls, emo, lbl, val) =>
    `<button class="chip ${cls} ${tierFilter === key ? 'sel' : ''}" onclick="setTier('${esc(key)}')"><div class="c-emo">${emo}</div><div class="c-val num">${fmtNum(val)}</div><div class="c-lbl">${esc(lbl)}</div></button>`;
  $('chips').innerHTML =
    `<button class="chip big all ${tierFilter === 'all' ? 'sel' : ''}" onclick="setTier('all')"><div class="c-emo">${ICON().total}</div><div class="c-txt"><div class="c-lbl">สมาชิกทั้งหมด</div><div class="c-val num">${fmtNum(c.all)} <small style="font-size:14px">คน</small></div></div></button>`
    + `<div class="chip-row">${tiers.map(k => { const t = tierOf(k); return chip(k, t.cls, t.emo, t.label, c[k] || 0); }).join('')}</div>`;
}
function setTier(t) { tierFilter = tierFilter === t && t !== 'all' ? 'all' : t; renderChips(); doSearch($('search-input').value); }

function searchMembers(q) {
  q = String(q || '').trim().toLowerCase();
  let pool = tierFilter === 'all' ? allMembers : allMembers.filter(m => (m.tier || 'ไม่ระบุ') === tierFilter);
  if (!q) return { list: [...pool].sort((a, b) => b.points - a.points), q };
  const d = digits(q);
  if (d && d.length === q.replace(/[\s-]/g, '').length) {           // numeric query → code / phone
    const hits = pool.filter(m => m.code.includes(d) || digits(m.phone).includes(d));
    hits.sort((a, b) => ((b.code === d || digits(b.phone) === d) - (a.code === d || digits(a.phone) === d)) || b.points - a.points);
    return { list: hits, q };
  }
  const toks = q.split(/\s+/).filter(Boolean);
  const hits = pool.filter(m => toks.every(t => m._key.includes(t)));
  hits.sort((a, b) => (b.name.toLowerCase().startsWith(toks[0]) - a.name.toLowerCase().startsWith(toks[0])) || b.points - a.points);
  return { list: hits, q };
}

function memberRow(m) {
  const t = tierOf(m.tier); const ex = expiryState(m.expire);
  const col = PASTELS[hashStr(m.code) % PASTELS.length];
  return `<button class="card m-row" onclick="openMember('${esc(m.code)}')">
    <div class="ava" style="background:${col}">${esc((m.name || '?').charAt(0))}</div>
    <div class="m-main">
      <div class="m-name">${esc(dispName(m))}</div>
      <div class="m-sub"><span>📞 ${esc(fmtPhone(m.phone))}</span><span class="badge ${t.badge}">${t.emo} ${esc(t.label)}</span>${ex && ex.cls ? `<span class="badge ${ex.cls}">${ex.text}</span>` : ''}</div>
    </div>
    <div class="m-right"><div class="m-pts num">${fmtNum(m.points)}<small>แต้ม</small></div></div>
  </button>`;
}

function doSearch(val) {
  if (!allMembers.length) return;
  const { list, q } = searchMembers(val);
  const area = $('results-area');
  const tierTxt = tierFilter === 'all' ? '' : ` (${tierFilter})`;
  if (!q) {
    $('list-title').innerHTML = `<div class="sec-title"><span class="em" style="background:var(--lemon-soft)">🏆</span>สมาชิกแต้มสูงสุด${esc(tierTxt)}<small>พิมพ์หรือสแกนเพื่อค้นหา</small></div>`;
    setStat(`พร้อมค้นหา · สมาชิก ${fmtNum(allMembers.length)} คน`, 'ok');
  } else {
    $('list-title').innerHTML = `<div class="sec-title"><span class="em" style="background:var(--pink-soft)">🔎</span>ผลการค้นหา${esc(tierTxt)}<small>${fmtNum(list.length)} คน</small></div>`;
    setStat(list.length ? `พบ ${fmtNum(list.length)} คน สำหรับ “${val.trim()}”` : `ไม่พบ “${val.trim()}”`, list.length ? 'ok' : 'err');
  }
  if (!list.length) {
    area.innerHTML = `<div class="empty"><div class="e-emo">🍡</div><b>ไม่พบสมาชิก</b>ลองค้นด้วยชื่อ นามสกุล หรือเบอร์โทร 10 หลัก</div>`;
    return;
  }
  const shown = q ? list.slice(0, LIST_LIMIT) : list.slice(0, 10);
  area.innerHTML = shown.map(memberRow).join('') + (q && list.length > LIST_LIMIT ? `<div class="more-note">แสดง ${LIST_LIMIT} จาก ${fmtNum(list.length)} คน — พิมพ์ให้เจาะจงขึ้นอีกนิดนะ</div>` : '');
}

/* ══════════════════════════ RENDER — detail ══════════════════════════ */
function openMember(code) { const m = allMembers.find(x => x.code === code); if (m) showDetail(m); }

function showDetail(m, silent) {
  currentMember = m;
  const t = tierOf(m.tier); const ex = expiryState(m.expire); const age = ageOf(m.birth);
  const sales = salesOf(m);
  const bills = sales.bills || [];
  const salesLoading = !sales.bills && sales.loading;
  const salesFailed  = !sales.bills && sales.error;
  const total = bills.reduce((s, b) => s + b.amount, 0);
  const lastBill = bills[0];
  const daysSince = lastBill ? Math.max(0, Math.floor((Date.now() - lastBill.date) / 86400000)) : null;

  // top items + categories (top 6 หมวดได้สีของตัวเอง ที่เหลือรวมเป็น "อื่นๆ")
  const itemAgg = new Map(), catAgg = new Map();
  bills.forEach(b => b.items.forEach(it => {
    const a = itemAgg.get(it.name) || { name: it.name, emo: it.emo, cat: it.cat, unit: it.unit, qty: 0, amount: 0, times: 0 };
    a.qty += it.qty; a.amount += it.amount; a.times++; itemAgg.set(it.name, a);
    catAgg.set(it.cat, (catAgg.get(it.cat) || 0) + Math.max(0, it.amount));
  }));
  const topItems = [...itemAgg.values()].filter(x => x.qty > 0).sort((a, b) => b.times - a.times || b.qty - a.qty).slice(0, 5);
  const maxTimes = topItems[0]?.times || 1;
  const catSorted = [...catAgg.entries()].filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1]);
  const catColor = new Map(catSorted.slice(0, 6).map(([c], i) => [c, CAT_PAL[i]]));
  const cats = catSorted.slice(0, 6);
  const otherAmt = catSorted.slice(6).reduce((s, [, v]) => s + v, 0);
  if (otherAmt > 0) cats.push(['อื่นๆ', otherAmt]);
  const catTotal = cats.reduce((s, [, v]) => s + v, 0) || 1;
  const colorOf = c => catColor.get(c) || CAT_OTHER;

  // ช่วงเวลาที่มาบ่อย
  const slotCnt = {}; bills.forEach(b => { if (SLOT[b.slot]) slotCnt[b.slot] = (slotCnt[b.slot] || 0) + 1; });
  const favSlot = Object.entries(slotCnt).sort((a, b) => b[1] - a[1])[0];

  // monthly spend, last 12 months
  const now = new Date(); const months = [];
  for (let i = 11; i >= 0; i--) { const d = new Date(now.getFullYear(), now.getMonth() - i, 1); months.push({ y: d.getFullYear(), m: d.getMonth(), amt: 0 }); }
  bills.forEach(b => { const x = months.find(mm => mm.y === b.date.getFullYear() && mm.m === b.date.getMonth()); if (x) x.amt += b.amount; });
  const maxAmt = Math.max(1, ...months.map(x => x.amt));

  // history grouped by month
  const groups = []; bills.forEach(b => {
    const key = `${b.date.getFullYear()}-${b.date.getMonth()}`;
    let g = groups.find(x => x.key === key);
    if (!g) { g = { key, label: `${TH_MONTH_L[b.date.getMonth()]} ${b.date.getFullYear() + 543}`, bills: [], amt: 0 }; groups.push(g); }
    g.bills.push(b); g.amt += b.amount;
  });

  const html = `
  <div class="mcard ${t.card}">
    <div class="mc-top"><div class="mc-brand">RATTANA MART · MEMBER</div><div class="mc-tier">${t.emo} ${esc(t.label)}</div></div>
    <div class="mc-name">${esc(dispName(m))}</div>
    <div class="mc-code num">รหัสสมาชิก ${esc(m.code)}</div>
    <div class="mc-pts">
      <div class="big num">${fmtNum(m.points)}<small>แต้ม ${ICON().pts}</small></div>
      <div class="exp">หมดอายุ<br><b>${formatThaiDate(m.expire)}</b>${ex && ex.cls ? `<br><span class="badge ${ex.cls}" style="margin-top:3px">${ex.text}</span>` : ''}</div>
    </div>
    <div class="mc-bc"><svg id="mc-barcode"></svg></div>
  </div>

  <div class="info-grid">
    <div class="info"><div class="i-lbl">📞 เบอร์โทร</div><div class="i-val num">${m.phone ? `<a href="tel:${esc(digits(m.phone))}">${esc(fmtPhone(m.phone))}</a>` : '-'}</div></div>
    <div class="info"><div class="i-lbl">🎂 วันเกิด</div><div class="i-val">${formatThaiDate(m.birth)}${age !== null ? ` <span style="color:var(--muted);font-weight:500">(${age} ปี)</span>` : ''}</div></div>
    <div class="info"><div class="i-lbl">🧸 เพศ</div><div class="i-val">${esc(m.sex) || '-'}</div></div>
    <div class="info"><div class="i-lbl">🏷️ ระดับ</div><div class="i-val"><span class="badge ${t.badge}">${t.emo} ${esc(t.label)}</span></div></div>
    <div class="info wide"><div class="i-lbl">🏠 ที่อยู่</div><div class="i-val" style="font-weight:500">${esc(m.addr) || '-'}</div></div>
    ${m.note ? `<div class="info wide"><div class="i-lbl">📝 หมายเหตุ</div><div class="i-val" style="font-weight:500">${esc(m.note)}</div></div>` : ''}
  </div>

  <div class="sec-title"><span class="em" style="background:var(--pink-soft)">🛍️</span>สรุปการซื้อ<small>${sales.loading && sales.bills ? 'กำลังอัปเดต…' : 'ทุกบิลในระบบ'}</small></div>
  ${salesLoading ? `
  <div class="empty card" style="margin-top:10px"><div class="e-emo"><span class="bob">${ICON().load}</span></div><b>กำลังโหลดประวัติการซื้อ…</b>รอแป๊บนะ ดึงเฉพาะบิลของสมาชิกคนนี้</div>
  <div class="skel" style="margin-top:10px"></div><div class="skel" style="margin-top:10px"></div>
  ` : salesFailed ? `
  <div class="empty card" style="margin-top:10px"><div class="e-emo">🥺</div><b>โหลดประวัติการซื้อไม่สำเร็จ</b>ตรวจสอบอินเทอร์เน็ตแล้วลองใหม่<br><button class="retry-btn" onclick="retrySales()">🔄 ลองอีกครั้ง</button></div>
  ` : `
  <div class="tiles">
    <div class="tile t1"><div class="t-lbl">ยอดซื้อรวม</div><div class="t-val num">฿${fmtNum(total)}</div><div class="t-sub">${fmtNum(bills.length)} บิล</div></div>
    <div class="tile t2"><div class="t-lbl">เฉลี่ยต่อบิล</div><div class="t-val num">฿${fmtNum(bills.length ? total / bills.length : 0)}</div><div class="t-sub">ต่อการซื้อ 1 ครั้ง</div></div>
    <div class="tile t3"><div class="t-lbl">มาช่วงไหนบ่อย</div><div class="t-val">${favSlot ? SLOT[favSlot[0]].emo + ' ' + SLOT[favSlot[0]].lbl : '-'}</div><div class="t-sub">${favSlot ? `${SLOT[favSlot[0]].time} · ${fmtNum(favSlot[1])} บิล` : 'ยังไม่มีข้อมูล'}</div></div>
    <div class="tile t4"><div class="t-lbl">มาล่าสุด</div><div class="t-val num">${lastBill ? (daysSince === 0 ? 'วันนี้' : daysSince + ' วัน') : '-'}</div><div class="t-sub">${lastBill ? formatThaiDate(lastBill.date) : 'ยังไม่มีการซื้อ'}</div></div>
  </div>

  ${bills.length ? `
  <div class="card chart-card" style="margin-top:10px">
    <div style="font-weight:700;font-size:13.5px">ยอดซื้อรายเดือน</div>
    <div class="mbars">${months.map((x, i) => `<div class="mbar"><div class="bar" style="height:${Math.max(3, x.amt / maxAmt * 100)}%;background:${x.amt ? `var(--bar, ${PASTELS[i % PASTELS.length]})` : 'var(--border)'}">${x.amt ? `<span>${x.amt >= 1000 ? (x.amt / 1000).toFixed(1) + 'k' : fmtNum(x.amt)}</span>` : ''}</div><div class="lbl">${TH_MONTH_S[x.m]}</div></div>`).join('')}</div>
  </div>

  <div class="sec-title"><span class="em" style="background:var(--mint-soft)">💖</span>ซื้ออะไรบ่อย</div>
  <div class="card chart-card">
    ${topItems.map((it, i) => `<div class="top-item"><div class="ti-emo" style="background:${PASTELS[i % PASTELS.length]}">${it.emo}</div>
      <div class="ti-main"><div class="ti-name">${esc(it.name)}</div><div class="ti-track"><div class="ti-fill" style="width:${it.times / maxTimes * 100}%;background:${colorOf(it.cat)}"></div></div></div>
      <div class="ti-qty">${it.times} ครั้ง<br>${fmtQty(it.qty)} ${esc(it.unit.replace(/x\d+$/, '') || 'ชิ้น')}</div></div>`).join('')}
    <div style="font-weight:700;font-size:13px;margin-top:12px">หมวดที่ชอบ</div>
    <div class="cat-stack">${cats.map(([c, v]) => `<div style="width:${v / catTotal * 100}%;background:${colorOf(c)}"></div>`).join('')}</div>
    <div class="cat-legend">${cats.map(([c, v]) => `<span><i style="background:${colorOf(c)}"></i>${esc(c)} ${Math.round(v / catTotal * 100)}%</span>`).join('')}</div>
  </div>

  <div class="sec-title"><span class="em" style="background:var(--lav-soft)">🧾</span>ประวัติการซื้อ<small>แตะบิลเพื่อดูรายการ</small></div>
  ${groups.map(g => `<div class="month-h"><span>${g.label}</span><span class="num">฿${fmtNum(g.amt)}</span></div>
    ${g.bills.map((b, i) => `<div class="card bill">
      <button class="bill-head" onclick="this.parentElement.classList.toggle('open')">
        <div class="bill-date" style="background:${PASTELS[(b.date.getDate() + i) % PASTELS.length]}"><b>${b.date.getDate()}</b><small>${TH_MONTH_S[b.date.getMonth()]}</small></div>
        <div class="bill-main"><div class="bm-1">${b.items.length} รายการ${SLOT[b.slot] ? ` · ${SLOT[b.slot].emo} ${SLOT[b.slot].time}` : ''}</div><div class="bm-2">${b.items.map(x => x.emo + ' ' + esc(x.name)).join(', ')}</div></div>
        <div class="bill-amt"><b class="num">฿${fmtNum(b.amount)}</b></div>
        <span class="bill-arrow">▼</span>
      </button>
      <div class="bill-items">
        <div class="bi-row q"><span>บิล ${esc(b.no)}</span><span>${formatThaiDate(b.date)}${SLOT[b.slot] ? ' · ' + SLOT[b.slot].lbl : ''}</span></div>
        ${b.items.map(x => `<div class="bi-row"><span>${x.emo} ${esc(x.name)} <span class="q">${x.qty ? `× ${fmtQty(x.qty)} ${esc(x.unit)}` : ''}${x.free ? `${x.qty ? ' + ' : ''}แถม ${fmtQty(x.free)} ${esc(x.unit)}` : ''}</span>${x.camp ? `<span class="camp">🎁 ${esc(x.camp)}</span>` : ''}</span><span class="num">฿${fmtNum(x.amount, x.amount % 1 ? 2 : 0)}</span></div>`).join('')}
        <div class="bi-total"><span>รวม</span><span class="num">฿${fmtNum(b.amount, b.amount % 1 ? 2 : 0)}</span></div>
      </div>
    </div>`).join('')}`).join('')}
  ` : `<div class="empty card" style="margin-top:10px"><div class="e-emo">🛒</div><b>ยังไม่มีประวัติการซื้อ</b>ไม่พบบิลของสมาชิกคนนี้ในข้อมูลการขาย</div>`}
  `}
  `;
  $('detail-body').innerHTML = html;
  try { JsBarcode('#mc-barcode', m.code, { format: 'CODE128', displayValue: false, height: 50, margin: 2, lineColor: getComputedStyle(document.body).getPropertyValue('--bc-line').trim() || '#4f3c60', background: 'transparent' }); }
  catch { $('mc-barcode').closest('.mc-bc').style.display = 'none'; }
  if (!silent) { show('s-detail'); history.pushState({ s: 'detail' }, ''); }
}

/* ══════════════════════════ SCANNER (Rattana pattern) ══════════════════════════ */
let html5QrScanner = null, scannerActive = false, lastScanned = '', torchOn = false, torchTrack = null;
function beep() { try { const ctx = new (window.AudioContext || window.webkitAudioContext)(); const o = ctx.createOscillator(), g = ctx.createGain(); o.connect(g); g.connect(ctx.destination); o.frequency.value = 1180; g.gain.value = .1; o.start(); setTimeout(() => { o.stop(); ctx.close(); }, 90); } catch {} }
function vibrate(p) { try { navigator.vibrate && navigator.vibrate(p); } catch {} }

async function startScan() {
  setScanStatus('กำลังเปิดกล้อง...', 'loading');
  lastScanned = ''; scannerActive = true; torchOn = false; torchTrack = null;
  $('torch-btn').classList.remove('on'); $('torch-btn').style.display = 'none';
  if (typeof Html5Qrcode === 'undefined') { setScanStatus('โหลดตัวสแกนไม่ได้ — ใช้ช่องพิมพ์ด้านล่าง', 'err'); return; }
  try {
    await navigator.mediaDevices.getUserMedia({ video: true }).then(s => s.getTracks().forEach(t => t.stop())).catch(() => {});
    const devices = await Html5Qrcode.getCameras().catch(() => []);
    let camId = null;
    if (devices && devices.length) { const back = devices.find(d => /(back|rear|environment|0)/i.test(d.label)); camId = (back || devices[devices.length - 1]).id; }
    if (html5QrScanner) { try { await html5QrScanner.stop(); } catch {} html5QrScanner = null; }
    if (!scannerActive) return;
    html5QrScanner = new Html5Qrcode('html5-qr-reader', { verbose: false, experimentalFeatures: { useBarCodeDetectorIfSupported: true } });
    const F = Html5QrcodeSupportedFormats;
    const config = {
      fps: 25, qrbox: { width: 320, height: 180 }, aspectRatio: 1.7777,
      videoConstraints: { facingMode: { ideal: 'environment' }, width: { ideal: 1920, min: 1280 }, height: { ideal: 1080, min: 720 },
        focusMode: 'continuous', advanced: [{ focusMode: 'continuous' }, { zoom: 1.5 }] },
      formatsToSupport: [F.EAN_13, F.EAN_8, F.UPC_A, F.UPC_E, F.CODE_128, F.CODE_39, F.CODE_93, F.ITF, F.QR_CODE],
    };
    const camCfg = camId ? { deviceId: { exact: camId } } : { facingMode: { exact: 'environment' } };
    await html5QrScanner.start(camCfg, config, text => {
      if (!scannerActive || text === lastScanned) return;
      lastScanned = text; beep(); vibrate([60, 40, 60]); onScanFound(text);
    }, () => {});
    setTimeout(() => {
      try {
        const v = document.querySelector('#html5-qr-reader video');
        const track = v && v.srcObject && v.srcObject.getVideoTracks()[0];
        if (!track) return;
        const caps = track.getCapabilities ? track.getCapabilities() : {};
        if (caps.torch) { torchTrack = track; $('torch-btn').style.display = 'flex'; }
        const adv = [];
        if (caps.focusMode && caps.focusMode.includes('continuous')) adv.push({ focusMode: 'continuous' });
        if (caps.zoom && caps.zoom.max >= 1.5) adv.push({ zoom: Math.min(1.5, caps.zoom.max) });
        if (adv.length) track.applyConstraints({ advanced: adv }).catch(() => {});
      } catch {}
    }, 800);
    setScanStatus('กล้องพร้อม — วางบาร์โค้ดบัตรสมาชิกให้อยู่ในกรอบ', 'ok');
    $('scan-hint').textContent = 'ถือห่าง 15–25 ซม. · แสงน้อยให้เปิดไฟฉาย';
  } catch (e) {
    let msg = 'เปิดกล้องไม่ได้ — ลองพิมพ์รหัสด้านล่าง';
    if (e.name === 'NotAllowedError' || String(e).includes('Permission')) msg = 'กรุณาอนุญาตกล้อง: Settings → Browser → Camera → Allow';
    else if (e.name === 'NotFoundError') msg = 'ไม่พบกล้อง — ใช้ช่องพิมพ์ด้านล่างแทน';
    setScanStatus(msg, 'err');
  }
}
async function stopScan() {
  scannerActive = false;
  if (torchOn && torchTrack) { try { await torchTrack.applyConstraints({ advanced: [{ torch: false }] }); } catch {} }
  torchOn = false; torchTrack = null;
  if (html5QrScanner) { try { await html5QrScanner.stop(); } catch {} try { html5QrScanner.clear(); } catch {} html5QrScanner = null; }
  $('manual-bc').value = '';
}
function onScanFound(code) {
  stopScan();
  show('s-main');
  const raw = String(code).trim(); const d = digits(raw);
  $('search-input').value = raw; $('clear-btn').classList.add('visible');
  tierFilter = 'all'; renderChips();
  const exact = allMembers.filter(m => m.code === raw || (d && (m.code === d || digits(m.phone) === d)));
  if (exact.length === 1) { setStat('พบ: ' + exact[0].full, 'ok'); doSearch(raw); showDetail(exact[0]); }
  else if (exact.length > 1) { doSearch(raw); setStat(`พบ ${exact.length} คน — กรุณาเลือก`, 'ok'); $('results-area').innerHTML = exact.map(memberRow).join(''); }
  else { doSearch(raw); setStat(`ไม่พบรหัส ${raw} ในระบบ`, 'err'); }
}

/* ══════════════════════════ EVENTS ══════════════════════════ */
function clearSearch() { $('search-input').value = ''; $('clear-btn').classList.remove('visible'); doSearch(''); }
$('clear-btn').onclick = () => { clearSearch(); $('search-input').focus(); };
let searchTimer;
$('search-input').addEventListener('input', function () {
  $('clear-btn').classList.toggle('visible', this.value.length > 0);
  clearTimeout(searchTimer); searchTimer = setTimeout(() => doSearch(this.value), 250);
});
$('search-input').addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const { list } = searchMembers(e.target.value);
  if (list.length === 1) showDetail(list[0]);
  e.target.blur();
});
$('open-scanner').onclick = () => { show('s-scanner'); history.pushState({ s: 'scanner' }, ''); startScan(); };
const manualGo = () => { const v = $('manual-bc').value.trim(); if (v) onScanFound(v); };
$('manual-search-btn').onclick = manualGo;
$('manual-bc').addEventListener('keydown', e => { if (e.key === 'Enter') manualGo(); });
$('torch-btn').onclick = async function () {
  if (!torchTrack) return;
  try { torchOn = !torchOn; await torchTrack.applyConstraints({ advanced: [{ torch: torchOn }] }); this.classList.toggle('on', torchOn); }
  catch { this.style.display = 'none'; }
};
async function leaveScanner() { await stopScan(); clearSearch(); show('s-main'); }
$('scanner-back').onclick = () => history.state ? history.back() : leaveScanner();
$('stop-scan').onclick = () => history.state ? history.back() : leaveScanner();
$('detail-back').onclick = () => history.state ? history.back() : show('s-main');
window.addEventListener('popstate', () => {
  if ($('s-scanner').classList.contains('active')) leaveScanner();
  else if ($('s-detail').classList.contains('active')) show('s-main');
});
window.addEventListener('scroll', () => $('backToTop').classList.toggle('show', window.scrollY > 400));

/* skeleton while loading */
$('results-area').innerHTML = Array(5).fill('<div class="skel"></div>').join('');
loadData();
setInterval(() => { if (!document.hidden && $('s-main').classList.contains('active')) loadData(true); }, 5 * 60 * 1000);
</script>
</body>
</html>
