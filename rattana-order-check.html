<!doctype html>
<html lang="th" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F4F7FB">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Rattana ตรวจออเดอร์ v1.1</title>
  <link rel="stylesheet" href="https://rattanaphaiboon.github.io/app/rattana-ui/rattana-ui.css">
  <script src="https://rattanaphaiboon.github.io/app/rattana-ui/rattana-ui.js" defer></script>
  <style>
    /* layout only — components come from Rattana CI */
    @media(max-width:759px){#kpi{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}#kpi .rt-kpi{padding:12px}#kpi .rt-kpi-value{font-size:22px}#kpi .rt-tile{width:34px;height:34px}}
    .oc-filters{display:grid;grid-template-columns:1fr;gap:10px;padding:14px;margin:12px 0}
    .oc-filter-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .oc-segwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
    .oc-segwrap::-webkit-scrollbar{display:none}
    .oc-segwrap .rt-seg{white-space:nowrap}
    @media(min-width:760px){.oc-filters{grid-template-columns:minmax(260px,1.3fr) 1fr;align-items:center}.oc-segwrap{grid-column:1/-1}}
    .oc-list{display:grid;grid-template-columns:1fr;gap:12px;margin-top:12px}
    @media(min-width:760px){.oc-list{grid-template-columns:repeat(2,1fr)}}
    @media(min-width:1180px){.oc-list{grid-template-columns:repeat(3,1fr)}}
    .oc-card{padding:14px 16px;cursor:pointer;display:flex;flex-direction:column;gap:10px;text-align:left;border-left:4px solid transparent}
    .oc-card.is-ok{border-left-color:#15803D}
    .oc-card.is-issue{border-left-color:#DC2626}
    .oc-card.is-flag{border-left-color:#D97706}
    .oc-card-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
    .oc-card-total{text-align:right;white-space:nowrap}
    .oc-badges{display:flex;flex-wrap:wrap;gap:6px}
    .oc-meta{display:flex;flex-wrap:wrap;gap:4px 14px}
    .oc-progress{height:6px;border-radius:99px;background:rgba(127,140,170,.2);overflow:hidden}
    .oc-progress>i{display:block;height:100%;background:#15803D;border-radius:99px;transition:width .2s}
    .oc-info{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 16px;margin-bottom:14px}
    @media(min-width:640px){.oc-info{grid-template-columns:repeat(3,1fr)}}
    .oc-flags{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
    .oc-flag{display:flex;gap:8px;align-items:flex-start;font-size:14px}
    .oc-line-check{width:22px;height:22px;accent-color:#15803D;cursor:pointer}
    tr.oc-cancel .rt-cell-main{text-decoration:line-through;opacity:.6}
    tr.oc-ticked{background:rgba(21,128,61,.07)}
    .oc-toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin:10px 0}
    .oc-note{margin:0 0 12px;padding:10px 12px;border-radius:10px;background:rgba(220,38,38,.08);font-size:14px}
    .oc-updated{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .oc-connect{padding:20px}
    .oc-steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:12px;font-size:15px;line-height:1.6}
    .oc-steps .oc-bm{margin-top:8px;cursor:grab}
  </style>
</head>
<body class="rt-app" data-rt-login="Rattana ตรวจออเดอร์">
  <script>
    // ทดสอบในเครื่อง (file:// / localhost) ปุ่ม Google ใช้ไม่ได้ → ข้ามการเข้าสู่ระบบ
    if (location.protocol === 'file:' || /^(localhost|127\.0\.0\.1)$/.test(location.hostname)) document.body.removeAttribute('data-rt-login');
  </script>
  <div class="rt-bg"><div class="rt-bg-arc"></div><div class="rt-bg-arc"></div></div>
  <main class="rt-container rt-page">
    <header class="rt-glass rt-topbar rt-sticky-top">
      <a class="rt-app-brand" href="./" data-rt-app-initials="ตร"><span><b>Rattana ตรวจออเดอร์</b><small>v1.1</small></span></a>
      <div class="rt-topbar-end">
        <button id="btnRefresh" class="rt-btn rt-btn-glass rt-btn-icon" type="button" aria-label="โหลดข้อมูลใหม่">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36L21 8M21 3v5h-5"/></svg>
        </button>
        <button class="rt-btn rt-btn-glass rt-btn-icon rt-bell" data-rt-bell type="button" aria-label="ออเดอร์ที่ต้องเช็ค"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><span class="rt-count"></span></button>
        <button class="rt-btn rt-btn-glass rt-btn-icon" type="button" data-rt-theme-toggle aria-label="สลับธีม"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path data-rt-theme-icon d=""/></svg></button>
        <button data-rt-user></button>
      </div>
    </header>

    <div class="rt-page-head">
      <div class="rt-date oc-updated"><span class="rt-date-main"><span data-rt-date="long"></span></span><span class="rt-date-dot"></span><span class="rt-caption" id="updatedAt">กำลังโหลด…</span></div>
      <h1 class="rt-h1">ตรวจออเดอร์</h1>
    </div>

    <div class="rt-grid-kpi" id="kpi">
      <div class="rt-glass rt-kpi"><div class="rt-kpi-head"><span class="rt-tile rt-tile-navy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2M9 2h6v4H9zM9 12h6M9 16h6"/></svg></span>ออเดอร์</div><span class="rt-kpi-value" id="kOrders">–</span><span class="rt-kpi-trend" id="kOrdersSub">&nbsp;</span></div>
      <div class="rt-glass rt-kpi"><div class="rt-kpi-head"><span class="rt-tile rt-tile-blue"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2a10 10 0 1 0 0 20a10 10 0 1 0 0-20M12 6v6l4 2"/></svg></span>รอตรวจ</div><span class="rt-kpi-value" id="kWait">–</span><span class="rt-kpi-trend" id="kWaitSub">&nbsp;</span></div>
      <div class="rt-glass rt-kpi"><div class="rt-kpi-head"><span class="rt-tile rt-tile-amber"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3M12 9v4M12 17h.01"/></svg></span>ต้องเช็ค</div><span class="rt-kpi-value" id="kFlag">–</span><span class="rt-kpi-trend" style="color:var(--warning-text)">ระบบพบจุดผิดปกติ</span></div>
      <div class="rt-glass rt-kpi"><div class="rt-kpi-head"><span class="rt-tile rt-tile-gold"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2a10 10 0 1 0 0 20a10 10 0 1 0 0-20M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8M12 18V6"/></svg></span>ยอดรวม</div><span class="rt-kpi-value" id="kTotal">–</span><span class="rt-kpi-trend" id="kTotalSub">&nbsp;</span></div>
    </div>

    <section class="rt-glass oc-filters">
      <label class="rt-search" data-rt-scan><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M11 3a8 8 0 1 0 0 16a8 8 0 1 0 0-16M21 21l-4.3-4.3"/></svg><input id="q" type="search" placeholder="ค้นหาร้าน เลขออเดอร์ เซลล์ สินค้า หรือสแกนบาร์โค้ด" aria-label="ค้นหาออเดอร์"></label>
      <div class="oc-filter-row">
        <select id="fDate" class="rt-select" aria-label="วันที่"></select>
        <select id="fWh" class="rt-select" aria-label="คลังส่ง"></select>
      </div>
      <div class="oc-segwrap">
        <div class="rt-seg" id="fStatus" role="group" aria-label="สถานะการตรวจ">
          <button type="button" aria-pressed="true" data-k="all">ทั้งหมด</button>
          <button type="button" aria-pressed="false" data-k="wait">รอตรวจ</button>
          <button type="button" aria-pressed="false" data-k="flag">ต้องเช็ค</button>
          <button type="button" aria-pressed="false" data-k="ok">ตรวจผ่าน</button>
          <button type="button" aria-pressed="false" data-k="issue">มีปัญหา</button>
        </div>
      </div>
    </section>

    <p class="rt-caption" id="resultInfo"></p>
    <div id="list" class="oc-list" data-rt-skeleton="cards"></div>
  </main>

<script>
(() => {
  'use strict';
  const SHEET_ID = '1xn_5doTDNckcYPWrgaDSG44QAWAZhMJk4kk60c1G9YE';   // Rattana Sales Order 2 (ไม่ต้องแชร์)
  const SHEET_TAB = 'Order';
  const CHECK_KEY = 'rtOrderCheck:v1';
  const AUTO_REFRESH_SEC = 60;

  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const num = v => { const n = parseFloat(String(v ?? '').replace(/,/g, '')); return isNaN(n) ? 0 : n; };
  const hasNum = v => v !== '' && v != null && !isNaN(parseFloat(String(v).replace(/,/g, '')));
  const truthy = v => { const s = String(v ?? '').trim(); return !!s && !/^(false|0|no|ไม่|-)$/i.test(s); };
  const money = n => (window.RattanaUI ? RattanaUI.formatMoney(n) : '฿' + Number(n).toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 }));
  const fmtNum = (n, d = 0) => Number(n).toLocaleString('th-TH', { maximumFractionDigits: d });
  const fmtDate = iso => { if (!iso) return '-'; try { return RattanaUI.formatDate(iso, 'long') || iso; } catch { return iso; } };

  let ORDERS = [];
  let me = { name: '', nickname: '', email: '' };
  let filters = { q: '', date: '', wh: '', status: 'all' };
  let lastLoaded = null;

  /* ───────── check results (saved on this device) ───────── */
  const loadChecks = () => { try { return JSON.parse(localStorage.getItem(CHECK_KEY)) || {}; } catch { return {}; } };
  let CHECKS = loadChecks();
  const saveChecks = () => { try { localStorage.setItem(CHECK_KEY, JSON.stringify(CHECKS)); } catch {} };
  const chk = id => (CHECKS[id] ||= { lines: {} });

  /* ───────── data comes from the sheet tab (bookmark button) — the sheet stays private ─────────
     1) user opens the sheet (they already have access) and clicks the bookmark "ตรวจออเดอร์"
     2) the bookmark reads tab "Order" inside the sheet page, opens this app and posts the CSV here
     3) for refresh the app asks that sheet tab again (works while the sheet tab stays open)      */
  const SHEET_ORIGIN = 'https://docs.google.com';
  let sheetWin = null;              // the sheet tab that sent us data
  let waitReq = null;               // { resolve, reject, timer } for a pending refresh
  let onData = null;                // set by start()

  function bookmarkletCode() {
    const app = location.origin + location.pathname;
    // runs inside the Google Sheet page: only fetch + window.open + postMessage (no innerHTML/eval → passes Trusted Types)
    return `(()=>{const ID='${SHEET_ID}',TAB='${SHEET_TAB}',APP='${app}',O=new URL(APP).origin;` +
      `if(location.host!=='docs.google.com'||location.pathname.indexOf('/spreadsheets/d/'+ID)<0){alert('เปิดชีท Rattana Sales Order 2 ก่อน แล้วค่อยกดปุ่มนี้');return}` +
      `const get=()=>fetch('/spreadsheets/d/'+ID+'/gviz/tq?tqx=out:csv&sheet='+encodeURIComponent(TAB),{credentials:'include',cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.text()});` +
      `const send=(w,extra)=>get().then(csv=>w.postMessage(Object.assign({type:'oc:data',sheetId:ID,csv:csv,at:Date.now()},extra||{}),O)).catch(e=>w.postMessage({type:'oc:error',message:String(e&&e.message||e)},O));` +
      `if(!window.__ocBridge){window.__ocBridge=1;window.addEventListener('message',e=>{if(e.origin!==O||!e.data)return;if(e.data.type==='oc:req')send(e.source,{reqId:e.data.reqId});if(e.data.type==='oc:ack')window.__ocAck=1})}` +
      `window.__ocAck=0;const w=window.open(APP,'rattana-order-check');if(!w){alert('เบราว์เซอร์บล็อกหน้าต่างใหม่ — อนุญาตป๊อปอัปให้ docs.google.com แล้วกดใหม่');return}` +
      `let n=0;const t=setInterval(()=>{if(window.__ocAck||++n>40){clearInterval(t);return}send(w)},750)})()`;
  }
  const bookmarkletHref = () => 'javascript:' + encodeURIComponent(bookmarkletCode());

  window.addEventListener('message', e => {
    if (e.origin !== SHEET_ORIGIN || !e.data || typeof e.data !== 'object') return;
    const d = e.data;
    if (d.type === 'oc:data') {
      if (d.sheetId !== SHEET_ID || typeof d.csv !== 'string') return;
      sheetWin = e.source;
      try { e.source.postMessage({ type: 'oc:ack' }, SHEET_ORIGIN); } catch {}
      if (waitReq) { clearTimeout(waitReq.timer); waitReq.resolve(d.csv); waitReq = null; }
      else if (onData) onData(d.csv);
      else earlyCsv = d.csv;
    } else if (d.type === 'oc:error') {
      sheetWin = e.source;
      const err = Object.assign(new Error('ชีทตอบกลับว่าอ่านไม่ได้: ' + d.message), { code: 'sheet' });
      if (waitReq) { clearTimeout(waitReq.timer); waitReq.reject(err); waitReq = null; }
      else onData?.(null, err);
    }
  });

  // ask the sheet tab for fresh data
  function requestFromSheet() {
    const w = (sheetWin && !sheetWin.closed) ? sheetWin : (window.opener && !window.opener.closed ? window.opener : null);
    if (!w) return Promise.reject(Object.assign(new Error('ยังไม่ได้เชื่อมกับชีท'), { code: 'nosheet' }));
    if (waitReq) return waitReq.promise;
    let res, rej;
    const p = new Promise((a, b) => { res = a; rej = b; });
    waitReq = { promise: p, resolve: res, reject: rej, timer: setTimeout(() => { waitReq = null; rej(Object.assign(new Error('แท็บชีทไม่ตอบ — ปิดไปแล้ว หรือต้องกดปุ่มลัดในชีทใหม่'), { code: 'nosheet' })); }, 15000) };
    try { w.postMessage({ type: 'oc:req', reqId: Date.now() }, SHEET_ORIGIN); }
    catch (e) { clearTimeout(waitReq.timer); waitReq = null; return Promise.reject(Object.assign(new Error('ติดต่อแท็บชีทไม่ได้'), { code: 'nosheet' })); }
    return p;
  }

  // RFC-4180 CSV → array of row objects
  function parseCsv(text) {
    if (!text) return [];
    if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
    const rows = []; let row = [], cell = '', q = false;
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      if (q) { if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch; }
      else if (ch === '"') q = true;
      else if (ch === ',') { row.push(cell); cell = ''; }
      else if (ch === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; }
      else if (ch !== '\r') cell += ch;
    }
    if (cell.length || row.length) { row.push(cell); rows.push(row); }
    if (!rows.length) return [];
    const clean = s => String(s || '').replace(/[​-‍﻿]/g, '').replace(/ /g, ' ').trim();
    const heads = rows[0].map(clean);
    return rows.slice(1).filter(r => r.some(c => clean(c)))
      .map(r => Object.fromEntries(heads.map((h, i) => [h, clean(r[i])]).filter(([h]) => h)))
      .filter(o => o.orderId || o.billId);
  }
  const pad = n => String(n).padStart(2, '0');

  /* ───────── rows → orders ───────── */
  const isoDate = s => { const m = String(s || '').match(/(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})/); return m ? `${m[1]}-${pad(m[2])}-${pad(m[3])}` : String(s || ''); };
  const packSize = unit => { const m = String(unit || '').match(/[x×]\s*(\d+)/i); return m ? +m[1] : 1; };
  const LINE_KEYS = ['รูปแบบ', 'Barcode', 'ชื่อสินค้า', 'ยกเลิก', 'จำนวน', 'หน่วย', 'ราคา', 'ยอดเงินรวม', 'ส่วนต่างราคา', 'ราคาแนะนำ', 'ราคาขอขาย', 'เหตุผลที่ขอ', 'โปรที่ใช้', 'lineId', 'น้ำหนัก(กก.)', 'สต็อกคลังส่ง(EA)', 'คาดไม่ได้ของ', 'อยู่ในคำแนะนำ', 'ผู้อนุมัติ', 'เวลาอนุมัติ', 'เกินสถิติ', 'ได้แถม', 'แถมเพราะซื้อ', 'โฟกัส', 'เวลายกเลิก'];

  function buildOrders(rows) {
    const map = new Map();
    rows.forEach((r, ri) => {
      const id = r.orderId || r.billId;
      let o = map.get(id);
      if (!o) {
        o = {
          id, date: isoDate(r['วัน']), time: r['เวลา'] || '', email: r.email || '', sale: r['ชื่อ-สกุล'] || '', saleCode: r['รหัสเซลล์'] || '',
          wh: r['คลัง'] || '', shipWh: r['คลังส่ง'] || '', shop: r['ชื่อร้าน'] || '', shopCode: r['รหัสร้าน'] || '',
          due: r['วันกำหนดส่ง'] || '', notes: new Set(), approval: new Set(), pick: new Set(), pickBy: new Set(), pickAt: '',
          lineMap: new Map(), parts: new Set(), partsTotal: 0, incomplete: false, overStat: false, source: r['ที่มา'] || '', creditReq: r['ขายเชื่อ-reqId'] || '', rowTotal: 0, rowItemsTotal: 0
        };
        map.set(id, o);
      }
      if (r['หมายเหตุ']) o.notes.add(r['หมายเหตุ']);
      if (r['สถานะอนุมัติ']) o.approval.add(r['สถานะอนุมัติ']);
      o.pick.add(r['สถานะจัด'] || '');
      if (r['แอดมินจัด']) o.pickBy.add(r['แอดมินจัด']);
      if (r['วันสั่งจัด']) o.pickAt = `${isoDate(r['วันสั่งจัด'])} ${r['เวลาสั่งจัด'] || ''}`.trim();
      if (truthy(r['ข้อมูลไม่ครบ'])) o.incomplete = true;
      const pm = String(r['ส่วน'] || '').match(/(\d+)\s*\/\s*(\d+)/);
      if (pm) { o.parts.add(+pm[1]); o.partsTotal = Math.max(o.partsTotal, +pm[2]); }

      let items = [];
      if (r['รายการ']) { try { const j = JSON.parse(r['รายการ']); if (Array.isArray(j)) items = j; } catch {} }
      if (!items.length && (r['ชื่อสินค้า'] || r['Barcode'])) items = [Object.fromEntries(LINE_KEYS.map(k => [k, r[k]]))];
      // row-level total vs items (only rows that carry an item list)
      if (items.length && hasNum(r['ยอดเงินรวม'])) { o.rowTotal += num(r['ยอดเงินรวม']); o.rowItemsTotal += items.reduce((s, x) => s + num(x['ยอดเงินรวม']), 0); }

      items.forEach((it, ii) => {
        const key = it.lineId || `${id}#${ri}-${ii}-${it.Barcode || ''}`;
        const prev = o.lineMap.get(key) || {};
        // merge: keep any non-empty value already seen (row + JSON can describe the same line)
        const line = { ...prev };
        Object.entries(it).forEach(([k, v]) => { if (v !== '' && v != null) line[k] = v; });
        if (!line['ยกเลิก'] && truthy(r['ยกเลิก']) && r.lineId === it.lineId) line['ยกเลิก'] = r['ยกเลิก'];
        line.key = key;
        o.lineMap.set(key, line);
      });
    });

    return [...map.values()].map(o => {
      const lines = [...o.lineMap.values()].sort((a, b) => String(a.lineId || a.key).localeCompare(String(b.lineId || b.key)));
      lines.forEach(l => {
        l.qty = num(l['จำนวน']); l.price = num(l['ราคา']); l.total = num(l['ยอดเงินรวม']);
        l.cancel = truthy(l['ยกเลิก']);
        l.diff = num(l['ส่วนต่างราคา']);
        l.pack = packSize(l['หน่วย']);
        l.needEA = l.qty * l.pack;
        l.stock = hasNum(l['สต็อกคลังส่ง(EA)']) ? num(l['สต็อกคลังส่ง(EA)']) : null;
        l.flags = [];
        if (l.cancel) l.flags.push({ lv: 'neutral', t: 'ยกเลิก' });
        else {
          if (truthy(l['คาดไม่ได้ของ'])) l.flags.push({ lv: 'danger', t: 'คาดว่าไม่ได้ของ' });
          if (l.stock != null && l.needEA > l.stock) l.flags.push({ lv: 'danger', t: `สต็อกไม่พอ (มี ${fmtNum(l.stock)} ต้องใช้ ${fmtNum(l.needEA)} EA)` });
          if (l.diff < 0) l.flags.push({ lv: 'warning', t: `ต่ำกว่าราคาแนะนำ ${money(Math.abs(l.diff))}` });
          if (l.qty && l.price && Math.abs(l.qty * l.price - l.total) > 0.5) l.flags.push({ lv: 'danger', t: `ยอดไม่ตรง (${fmtNum(l.qty)}×${fmtNum(l.price, 2)} ≠ ${fmtNum(l.total, 2)})` });
          if (truthy(l['เกินสถิติ'])) l.flags.push({ lv: 'warning', t: 'เกินสถิติ' });
          if (truthy(l['ได้แถม']) || /แถม/.test(l['รูปแบบ'] || '')) l.flags.push({ lv: 'info', t: 'ของแถม' });
        }
      });
      const active = lines.filter(l => !l.cancel);
      const total = active.reduce((s, l) => s + l.total, 0);
      const weight = active.reduce((s, l) => s + num(l['น้ำหนัก(กก.)']), 0);
      const approval = [...o.approval];
      const pickVals = [...o.pick];
      const pick = pickVals.every(v => v === 'จัดแล้ว') ? 'จัดแล้ว' : pickVals.some(v => v === 'จัดแล้ว') ? 'จัดบางส่วน' : (pickVals.find(Boolean) || 'ยังไม่จัด');

      const flags = [];
      if (approval.some(a => /รอ/.test(a))) flags.push({ lv: 'warning', t: 'รออนุมัติราคา' });
      if (o.partsTotal && o.parts.size < o.partsTotal) flags.push({ lv: 'danger', t: `ข้อมูลมาไม่ครบ (ได้ ${o.parts.size}/${o.partsTotal} ส่วน)` });
      if (o.incomplete) flags.push({ lv: 'danger', t: 'ข้อมูลไม่ครบ' });
      if (o.rowTotal && Math.abs(o.rowTotal - o.rowItemsTotal) > 0.5) flags.push({ lv: 'danger', t: `ยอดหัวบิลไม่ตรงกับรายการ (${money(o.rowTotal)} / ${money(o.rowItemsTotal)})` });
      if (!active.length) flags.push({ lv: 'danger', t: 'ไม่มีรายการสินค้า' });
      const lineFlagCount = {};
      lines.forEach(l => l.flags.forEach(f => { if (f.lv !== 'info' && f.lv !== 'neutral') { const k = f.t.replace(/\s*\(.*$/, '').replace(/\s[฿\d].*$/, ''); lineFlagCount[k] = (lineFlagCount[k] || 0) + 1; } }));
      Object.entries(lineFlagCount).forEach(([k, n]) => flags.push({ lv: /ไม่พอ|ไม่ได้ของ|ไม่ตรง/.test(k) ? 'danger' : 'warning', t: `${k} ${n} รายการ` }));
      const cancelled = lines.length - active.length;

      return {
        ...o, lines, active, total, weight, approval, pick, flags, cancelled,
        notes: [...o.notes], pickBy: [...o.pickBy],
        sortKey: `${o.date} ${o.time.padStart(5, '0')}`,
        search: [o.id, o.shop, o.shopCode, o.sale, o.saleCode, o.email, ...lines.map(l => `${l['ชื่อสินค้า'] || ''} ${l.Barcode || ''}`)].join(' ').toLowerCase()
      };
    }).sort((a, b) => b.sortKey.localeCompare(a.sortKey));
  }

  /* ───────── status ───────── */
  function checkState(o) {
    const c = CHECKS[o.id];
    const ticked = o.active.filter(l => c?.lines?.[l.key]).length;
    return { status: c?.status || '', note: c?.note || '', by: c?.by || '', at: c?.at || '', ticked, of: o.active.length };
  }
  const isFlag = o => o.flags.some(f => f.lv === 'danger' || f.lv === 'warning');
  function bucket(o) {
    const s = checkState(o).status;
    if (s === 'ok') return 'ok';
    if (s === 'issue') return 'issue';
    return isFlag(o) ? 'flag' : 'wait';
  }
  const badge = (lv, t) => `<span class="rt-badge rt-badge-${lv}">${esc(t)}</span>`;

  /* ───────── filters ───────── */
  function fillSelect(sel, opts, value) {
    sel.innerHTML = opts.map(([v, t]) => `<option value="${esc(v)}"${v === value ? ' selected' : ''}>${esc(t)}</option>`).join('');
    sel.value = value;
    sel.dispatchEvent(new Event('rt:refresh'));
  }
  function refreshFilterOptions() {
    const dates = [...new Set(ORDERS.map(o => o.date).filter(Boolean))].sort().reverse();
    if (!filters.date || (filters.date !== '*' && !dates.includes(filters.date))) filters.date = dates[0] || '*';
    fillSelect($('#fDate'), [...dates.map(d => [d, RattanaUI.formatDate(d, 'short') || d]), ['*', 'ทุกวัน']], filters.date);
    const whs = [...new Set(ORDERS.map(o => o.shipWh).filter(Boolean))].sort();
    if (filters.wh && filters.wh !== '*' && !whs.includes(filters.wh)) filters.wh = '*';
    if (!filters.wh) filters.wh = '*';
    fillSelect($('#fWh'), [['*', 'ทุกคลังส่ง'], ...whs.map(w => [w, 'คลังส่ง ' + w])], filters.wh);
  }
  function filtered(ignoreStatus) {
    const q = filters.q.trim().toLowerCase();
    return ORDERS.filter(o =>
      (filters.date === '*' || o.date === filters.date) &&
      (filters.wh === '*' || o.shipWh === filters.wh) &&
      (!q || q.split(/\s+/).every(w => o.search.includes(w))) &&
      (ignoreStatus || filters.status === 'all' || bucket(o) === filters.status));
  }

  /* ───────── render ───────── */
  function renderKpi() {
    const base = filtered(true);
    const b = { wait: 0, flag: 0, ok: 0, issue: 0 };
    base.forEach(o => b[bucket(o)]++);
    $('#kOrders').textContent = fmtNum(base.length);
    $('#kOrdersSub').innerHTML = `ตรวจผ่าน ${b.ok} · มีปัญหา ${b.issue}`;
    $('#kWait').textContent = fmtNum(b.wait + b.flag);
    $('#kWaitSub').textContent = base.length ? `ตรวจแล้ว ${Math.round((b.ok + b.issue) / base.length * 100)}%` : '';
    $('#kFlag').textContent = fmtNum(b.flag);
    const total = base.reduce((s, o) => s + o.total, 0);
    $('#kTotal').textContent = money(total);
    $('#kTotalSub').textContent = `${fmtNum(base.reduce((s, o) => s + o.active.length, 0))} รายการ · ${fmtNum(base.reduce((s, o) => s + o.weight, 0), 1)} กก.`;
    try { RattanaUI.setBadge(b.flag); } catch {}
  }

  function cardHtml(o) {
    const st = checkState(o);
    const bk = bucket(o);
    const pct = st.of ? Math.round(st.ticked / st.of * 100) : 0;
    const appr = o.approval.length ? o.approval.map(a => badge(/รอ/.test(a) ? 'pending' : 'success', a)).join('') : '';
    const pick = badge(o.pick === 'จัดแล้ว' ? 'success' : o.pick === 'จัดบางส่วน' ? 'warning' : 'neutral', o.pick);
    const chkB = bk === 'ok' ? badge('success', 'ตรวจผ่าน') : bk === 'issue' ? badge('danger', 'มีปัญหา') : '';
    const cardFlags = o.flags.filter(f => f.lv !== 'info' && f.t !== 'รออนุมัติราคา');   // approval already has its own badge
    const flagB = cardFlags.slice(0, 3).map(f => badge(f.lv === 'danger' ? 'danger' : 'warning', f.t)).join('');
    const more = cardFlags.length > 3 ? badge('neutral', `+${cardFlags.length - 3}`) : '';
    return `<button type="button" class="rt-glass rt-lift oc-card is-${bk}" data-id="${esc(o.id)}">
      <div class="oc-card-top">
        <div><div class="rt-cell-main">${esc(o.shop || '(ไม่ระบุร้าน)')}</div><div class="rt-cell-sub">${esc(o.id)}${o.shopCode ? ' · ' + esc(o.shopCode) : ''}</div></div>
        <div class="oc-card-total"><div class="rt-cell-main">${money(o.total)}</div><div class="rt-cell-sub">${o.active.length} รายการ${o.weight ? ' · ' + fmtNum(o.weight, 1) + ' กก.' : ''}</div></div>
      </div>
      <div class="oc-meta rt-cell-sub">
        <span>${esc(o.sale || '-')}${o.saleCode ? ' (' + esc(o.saleCode) + ')' : ''}</span>
        <span>${esc(o.time || '')} น.</span>
        <span>${esc(o.wh || '-')} → ส่ง ${esc(o.shipWh || '-')}</span>
      </div>
      <div class="oc-badges">${chkB}${appr}${pick}${flagB}${more}</div>
      <div class="oc-progress" title="ติ๊กตรวจแล้ว ${st.ticked}/${st.of}"><i style="width:${pct}%"></i></div>
      ${st.note ? `<div class="rt-cell-sub">📝 ${esc(st.note)}</div>` : ''}
    </button>`;
  }

  function render() {
    renderKpi();
    const list = filtered(false);
    const box = $('#list');
    box.removeAttribute('data-rt-skeleton');
    $('#resultInfo').textContent = ORDERS.length ? `แสดง ${list.length} ออเดอร์ · ล่าสุดอยู่บนสุด` : '';
    if (!list.length) {
      try { RattanaUI.state(box, ORDERS.length ? 'search' : 'empty', ORDERS.length ? { title: 'ไม่พบออเดอร์ตามเงื่อนไข', message: 'ลองเปลี่ยนวัน คลัง หรือคำค้นหา' } : { title: 'ยังไม่มีออเดอร์ในชีท' }); }
      catch { box.innerHTML = '<p class="rt-muted">ไม่พบออเดอร์</p>'; }
      return;
    }
    box.innerHTML = list.map(cardHtml).join('');
  }

  /* ───────── detail ───────── */
  function lineRow(o, l) {
    const c = CHECKS[o.id];
    const ticked = !!c?.lines?.[l.key];
    const sub = [l.Barcode, l['รูปแบบ'], l['โปรที่ใช้'] ? 'โปร: ' + l['โปรที่ใช้'] : '', l['เหตุผลที่ขอ'] ? 'เหตุผล: ' + l['เหตุผลที่ขอ'] : ''].filter(Boolean).map(esc).join(' · ');
    const fl = l.flags.map(f => badge(f.lv === 'danger' ? 'danger' : f.lv === 'warning' ? 'warning' : f.lv === 'info' ? 'info' : 'neutral', f.t)).join(' ');
    const priceSub = hasNum(l['ราคาแนะนำ']) ? `แนะนำ ${fmtNum(num(l['ราคาแนะนำ']), 2)}${l.diff ? ` (${l.diff > 0 ? '+' : ''}${fmtNum(l.diff, 2)})` : ''}` : '';
    return `<tr class="${l.cancel ? 'oc-cancel' : ''}${ticked ? ' oc-ticked' : ''}" data-key="${esc(l.key)}">
      <td><input type="checkbox" class="oc-line-check" ${ticked ? 'checked' : ''} ${l.cancel ? 'disabled' : ''} aria-label="ตรวจแล้ว ${esc(l['ชื่อสินค้า'])}"></td>
      <td><div class="rt-cell-main">${esc(l['ชื่อสินค้า'] || '-')}</div><div class="rt-cell-sub">${sub}</div>${fl ? `<div class="oc-badges" style="margin-top:4px">${fl}</div>` : ''}</td>
      <td class="rt-right"><div class="rt-cell-main">${fmtNum(l.qty, 2)}</div><div class="rt-cell-sub">${esc(l['หน่วย'] || '')}</div></td>
      <td class="rt-right"><div class="rt-cell-main">${fmtNum(l.price, 2)}</div><div class="rt-cell-sub">${priceSub}</div></td>
      <td class="rt-right"><div class="rt-cell-main">${fmtNum(l.total, 2)}</div><div class="rt-cell-sub">${l['น้ำหนัก(กก.)'] ? fmtNum(num(l['น้ำหนัก(กก.)']), 1) + ' กก.' : ''}</div></td>
      <td class="rt-right"><div class="rt-cell-main">${l.stock == null ? '-' : fmtNum(l.stock)}</div><div class="rt-cell-sub">ใช้ ${fmtNum(l.needEA)} EA</div></td>
    </tr>`;
  }

  function detailEl(o) {
    const st = checkState(o);
    const info = (label, val) => `<div><div class="rt-cell-sub">${label}</div><div class="rt-cell-main">${val || '-'}</div></div>`;
    const el = document.createElement('div');
    el.innerHTML = `
      <div class="oc-info">
        ${info('ร้าน', esc(o.shop) + (o.shopCode ? `<div class="rt-cell-sub">${esc(o.shopCode)}</div>` : ''))}
        ${info('เซลล์', esc(o.sale) + (o.saleCode ? `<div class="rt-cell-sub">${esc(o.saleCode)}</div>` : ''))}
        ${info('วันเวลาสั่ง', esc(fmtDate(o.date)) + `<div class="rt-cell-sub">${esc(o.time)} น.</div>`)}
        ${info('คลัง → คลังส่ง', esc(o.wh) + ' → ' + esc(o.shipWh))}
        ${info('วันกำหนดส่ง', esc(o.due ? fmtDate(isoDate(o.due)) : '-'))}
        ${info('สถานะจัด', esc(o.pick) + (o.pickBy.length ? `<div class="rt-cell-sub">${esc(o.pickBy.join(', '))}${o.pickAt ? ' · ' + esc(o.pickAt) : ''}</div>` : ''))}
        ${info('ยอดรวม', money(o.total) + `<div class="rt-cell-sub">${o.active.length} รายการ${o.cancelled ? ` · ยกเลิก ${o.cancelled}` : ''} · ${fmtNum(o.weight, 1)} กก.</div>`)}
        ${info('อนุมัติราคา', esc(o.approval.join(', ') || '-'))}
        ${o.notes.length ? info('หมายเหตุ', esc(o.notes.join(' / '))) : ''}
      </div>
      ${o.flags.length ? `<div class="oc-flags">${o.flags.map(f => `<div class="oc-flag">${badge(f.lv === 'danger' ? 'danger' : f.lv === 'warning' ? 'warning' : 'info', f.lv === 'danger' ? 'ต้องแก้' : f.lv === 'warning' ? 'ตรวจสอบ' : 'ข้อมูล')}<span>${esc(f.t)}</span></div>`).join('')}</div>` : `<div class="oc-flags"><div class="oc-flag">${badge('success', 'ปกติ')}<span>ระบบไม่พบจุดผิดปกติ</span></div></div>`}
      ${st.status ? `<p class="oc-note" style="${st.status === 'ok' ? 'background:rgba(21,128,61,.08)' : ''}">${st.status === 'ok' ? '✅ ตรวจผ่าน' : '⚠️ มีปัญหา'} โดย ${esc(st.by || '-')} · ${esc(st.at)}${st.note ? '<br>📝 ' + esc(st.note) : ''}</p>` : ''}
      <label class="rt-search" data-rt-scan><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M11 3a8 8 0 1 0 0 16a8 8 0 1 0 0-16M21 21l-4.3-4.3"/></svg><input type="search" class="oc-scan" placeholder="สแกน/พิมพ์บาร์โค้ด เพื่อติ๊กสินค้า แล้วกด Enter" aria-label="สแกนเพื่อติ๊กสินค้า"></label>
      <div class="oc-toolbar">
        <span class="rt-caption oc-tick-info"></span>
        <div class="rt-btn-group">
          <button type="button" class="rt-btn rt-btn-glass rt-btn-sm oc-all">ติ๊กทั้งหมด</button>
          <button type="button" class="rt-btn rt-btn-glass rt-btn-sm oc-none">ล้างติ๊ก</button>
        </div>
      </div>
      <div class="rt-table-wrap"><table class="rt-table" style="min-width:720px">
        <thead><tr><th scope="col">ตรวจ</th><th scope="col">สินค้า</th><th scope="col" class="rt-right">จำนวน</th><th scope="col" class="rt-right">ราคา</th><th scope="col" class="rt-right">รวม</th><th scope="col" class="rt-right">สต็อกคลังส่ง</th></tr></thead>
        <tbody>${o.lines.map(l => lineRow(o, l)).join('')}</tbody>
      </table></div>`;

    const updTick = () => { const s = checkState(o); el.querySelector('.oc-tick-info').textContent = `ติ๊กตรวจแล้ว ${s.ticked}/${s.of} รายการ`; };
    const setTick = (key, on) => {
      const c = chk(o.id); c.lines ||= {};
      if (!!c.lines[key] === on) return;
      if (on) c.lines[key] = 1; else delete c.lines[key];
      saveChecks();
      const tr = el.querySelector(`tr[data-key="${CSS.escape(key)}"]`);
      if (tr) { tr.classList.toggle('oc-ticked', on); tr.querySelector('input').checked = on; }
      updTick(); render();
    };
    el.addEventListener('change', e => { if (e.target.classList.contains('oc-line-check')) setTick(e.target.closest('tr').dataset.key, e.target.checked); });
    el.querySelector('.oc-all').addEventListener('click', () => o.active.forEach(l => setTick(l.key, true)));
    el.querySelector('.oc-none').addEventListener('click', () => o.lines.forEach(l => setTick(l.key, false)));
    const scan = el.querySelector('.oc-scan');
    const doScan = code => {
      code = String(code || '').trim(); if (!code) return;
      const l = o.active.find(x => String(x.Barcode || '') === code) || o.active.find(x => String(x.Barcode || '').endsWith(code) || String(x['ชื่อสินค้า'] || '').includes(code));
      if (l) { setTick(l.key, true); RattanaUI.toast(`✓ ${l['ชื่อสินค้า']}`, { type: 'success' }); el.querySelector(`tr[data-key="${CSS.escape(l.key)}"]`)?.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
      else RattanaUI.toast(`ไม่พบ ${code} ในออเดอร์นี้`, { type: 'error' });
      scan.value = '';
    };
    scan.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); doScan(scan.value); } });
    scan.addEventListener('rt:scan', e => doScan(e.detail?.code ?? e.detail ?? scan.value));
    updTick();
    return el;
  }

  const nowText = () => { const d = new Date(); return `${RattanaUI.formatDate(d, 'short')} ${RattanaUI.formatTime(d)}`; };
  const who = () => me.nickname || me.name || me.email || 'ไม่ระบุ';

  async function askNote(title, def) {
    const box = document.createElement('div');
    box.innerHTML = `<div class="rt-field"><label for="ocNote">หมายเหตุ</label><textarea id="ocNote" class="rt-textarea" rows="3" placeholder="เช่น ราคาผิด สินค้าไม่พอ ต้องโทรถามเซลล์" autofocus>${esc(def || '')}</textarea></div>`;
    const ok = await RattanaUI.popup({ icon: 'reject', title, content: box, actions: [{ label: 'ยกเลิก', variant: 'glass', value: false }, { label: 'บันทึกว่ามีปัญหา', variant: 'reject', value: true }] });
    return ok ? box.querySelector('textarea').value.trim() : null;
  }

  // save the order's result on this device
  function saveStatus(o, status, note) {
    const c = chk(o.id);
    if (status) Object.assign(c, { status, note, by: who(), at: nowText() });
    else { delete c.status; delete c.note; delete c.by; delete c.at; }
    saveChecks(); render();
    return true;
  }

  function openDetail(id) {
    const o = ORDERS.find(x => x.id === id); if (!o) return;
    const st = checkState(o);
    const actions = [];
    if (st.status) actions.push({ label: 'ล้างผลตรวจ', variant: 'glass', onClick: async () => {
      saveStatus(o, '', '');
      RattanaUI.toast('ล้างผลตรวจแล้ว', { type: 'info' });
    } });
    actions.push({ label: 'มีปัญหา', variant: 'reject', onClick: async () => {
      const note = await askNote(`${o.id} มีปัญหา`, st.note);
      if (note == null) return false;
      saveStatus(o, 'issue', note);
      RattanaUI.toast(`บันทึก ${o.id} มีปัญหา`, { type: 'error' });
    } });
    actions.push({ label: 'ตรวจผ่าน', variant: 'approve', onClick: async () => {
      const s = checkState(o);
      if (s.ticked < s.of) {
        const go = await RattanaUI.confirm({ title: 'ยังติ๊กไม่ครบ', message: `ติ๊กแล้ว ${s.ticked}/${s.of} รายการ — ให้ผ่านเลยหรือไม่?`, variant: 'approve', confirmText: 'ผ่านเลย' });
        if (!go) return false;
      }
      saveStatus(o, 'ok', '');
      RattanaUI.toast(`✓ ${o.id} ตรวจผ่าน`, { type: 'success' });
    } });
    RattanaUI.drawer({ title: `${o.id} · ${o.shop}`, content: detailEl(o), size: 'xl', actions });
  }

  /* ───────── load ───────── */
  function applyCsv(csv) {
    const rows = parseCsv(csv);
    ORDERS = buildOrders(rows);
    lastLoaded = new Date();
    $('#updatedAt').textContent = `อัปเดตล่าสุด ${RattanaUI.formatTime(lastLoaded)} · ${rows.length} แถวในชีท`;
    refreshFilterOptions();
    render();
  }

  function showConnect(err) {
    const box = $('#list'); box.removeAttribute('data-rt-skeleton'); box.innerHTML = '';
    $('#resultInfo').textContent = '';
    $('#updatedAt').textContent = 'ยังไม่ได้เชื่อมกับชีท';
    const el = document.createElement('section');
    el.className = 'rt-glass oc-connect';
    el.style.gridColumn = '1 / -1';
    el.innerHTML = `
      <h2 class="rt-h3" style="margin:0 0 6px">เปิดแอปจากชีทออเดอร์</h2>
      <p class="rt-body-sm rt-muted" style="margin:0 0 14px">ชีทออเดอร์ไม่ได้แชร์สาธารณะ แอปจึงรับข้อมูลจากแท็บชีทที่คุณเปิดอยู่ (ต้องเป็นบัญชีที่เข้าชีทได้) ข้อมูลส่งตรงในเครื่องนี้ ไม่ผ่านที่อื่น${err && err.code !== 'nosheet' ? `<br><b>${esc(err.message)}</b>` : ''}</p>
      <ol class="oc-steps">
        <li><b>ติดตั้งครั้งแรก:</b> ลากปุ่มนี้ไปวางบนแถบบุ๊กมาร์กของ Chrome (กด Ctrl+Shift+B ถ้าแถบไม่ขึ้น)<br>
          <a class="rt-btn rt-btn-gold oc-bm" draggable="true" title="ลากไปวางบนแถบบุ๊กมาร์ก">📋 ตรวจออเดอร์</a></li>
        <li>เปิดชีท <a href="https://docs.google.com/spreadsheets/d/${SHEET_ID}/edit" target="_blank" rel="noopener">Rattana Sales Order 2</a></li>
        <li>กดบุ๊กมาร์ก <b>📋 ตรวจออเดอร์</b> ขณะอยู่ในหน้าชีท — แอปจะเปิดพร้อมข้อมูล</li>
        <li>เปิดแท็บชีทค้างไว้ แอปจะดึงข้อมูลใหม่ให้ทุก ${AUTO_REFRESH_SEC} วินาที</li>
      </ol>`;
    const bm = el.querySelector('.oc-bm');
    bm.setAttribute('href', bookmarkletHref());
    bm.addEventListener('click', e => { e.preventDefault(); RattanaUI.toast('ลากปุ่มนี้ไปวางบนแถบบุ๊กมาร์ก แล้วไปกดในหน้าชีท', { type: 'info' }); });
    box.appendChild(el);
  }

  let loading = false;
  async function load(manual) {
    if (loading) return; loading = true;
    const btn = $('#btnRefresh');
    if (manual) RattanaUI.setLoading(btn, true);
    try {
      applyCsv(await requestFromSheet());
      if (manual) RattanaUI.toast('อัปเดตเรียบร้อย', { type: 'success' });
    } catch (e) {
      if (!ORDERS.length) showConnect(e);
      else if (manual) RattanaUI.toast(e.message || 'โหลดข้อมูลใหม่ไม่สำเร็จ — แสดงข้อมูลเดิม', { type: 'error', duration: 6000 });
      else $('#updatedAt').textContent = `อัปเดตล่าสุด ${RattanaUI.formatTime(lastLoaded)} · ⚠ แท็บชีทไม่ตอบ (กดปุ่มลัดในชีทใหม่)`;
    } finally {
      loading = false;
      if (manual) RattanaUI.setLoading(btn, false);
    }
  }

  function bind() {
    $('#q').addEventListener('input', e => { filters.q = e.target.value; render(); });
    $('#q').addEventListener('rt:scan', e => { filters.q = $('#q').value; render(); });
    $('#fDate').addEventListener('change', e => { filters.date = e.target.value; render(); });
    $('#fWh').addEventListener('change', e => { filters.wh = e.target.value; render(); });
    $('#fStatus').addEventListener('click', e => {
      const b = e.target.closest('button[data-k]'); if (!b) return;
      $('#fStatus').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b ? 'true' : 'false'));
      filters.status = b.dataset.k; render();
    });
    document.querySelector('[data-rt-bell]').addEventListener('click', () => $('#fStatus [data-k="flag"]').click());
    $('#list').addEventListener('click', e => { const c = e.target.closest('.oc-card'); if (c) openDetail(c.dataset.id); });
    $('#btnRefresh').addEventListener('click', () => load(true));
    const linked = () => (sheetWin && !sheetWin.closed) || (window.opener && !window.opener.closed);
    setInterval(() => { if (!document.hidden && linked()) load(false); }, AUTO_REFRESH_SEC * 1000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden && linked() && lastLoaded && Date.now() - lastLoaded > 30000) load(false); });
    window.addEventListener('storage', e => { if (e.key === CHECK_KEY) { CHECKS = loadChecks(); render(); } });
  }
  let earlyCsv = null;   // data that arrived before sign-in finished

  function start(u) {
    if (u) {
      me = u;
      const myWh = u.shipW || u.w;
      if (myWh) filters.wh = myWh;   // เริ่มที่คลังของผู้ใช้ (ถ้ามีออเดอร์ของคลังนั้น)
    }
    bind();
    onData = (csv, err) => {
      if (err) { if (!ORDERS.length) showConnect(err); else RattanaUI.toast(err.message, { type: 'error' }); return; }
      applyCsv(csv);
    };
    if (earlyCsv) { applyCsv(earlyCsv); earlyCsv = null; }
    else if (sheetWin || window.opener) load(false);
    else showConnect(null);
  }

  window.addEventListener('DOMContentLoaded', () => {
    const go = () => {
      if (document.body.hasAttribute('data-rt-login') && RattanaUI.user?.ready) RattanaUI.user.ready.then(start);
      else start(null);
    };
    if (window.RattanaUI) go(); else window.addEventListener('load', go, { once: true });
  });
})();
</script>
</body>
</html>
