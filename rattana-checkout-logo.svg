<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Rattana Checkout</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#243b73"/>
      <stop offset="0.55" stop-color="#132651"/>
      <stop offset="1" stop-color="#0d1b3e"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1dca0"/>
      <stop offset="1" stop-color="#e2c574"/>
    </linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d6b660"/>
      <stop offset="1" stop-color="#c3a147"/>
    </linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b8963e"/>
      <stop offset="1" stop-color="#9c7c2e"/>
    </linearGradient>
  </defs>

  <!-- พื้นแอป -->
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect x="10" y="10" width="492" height="492" rx="108" fill="none" stroke="#c9a84c" stroke-opacity=".32" stroke-width="4"/>

  <!-- ลังสินค้า มุมมองสามมิติ -->
  <g transform="translate(-16 2) translate(256 256) scale(1.07) translate(-256 -256)">
    <path d="M256 98 L404 168 L256 238 L108 168 Z" fill="url(#top)"/>
    <path d="M108 168 L256 238 L256 414 L108 344 Z" fill="url(#left)"/>
    <path d="M404 168 L256 238 L256 414 L404 344 Z" fill="url(#right)"/>

    <!-- เทปปิดฝาลัง -->
    <path d="M182 133 L330 203 L330 222 L182 152 Z" fill="#0d1b3e" fill-opacity=".16"/>

    <!-- บาร์โค้ดบนข้างลัง -->
    <g fill="#0d1b3e" fill-opacity=".78" transform="matrix(1 .473 0 1 0 0)">
      <rect x="136" y="186" width="9"  height="74"/>
      <rect x="152" y="186" width="5"  height="74"/>
      <rect x="164" y="186" width="12" height="74"/>
      <rect x="183" y="186" width="5"  height="74"/>
      <rect x="195" y="186" width="9"  height="74"/>
      <rect x="211" y="186" width="5"  height="74"/>
      <rect x="223" y="186" width="9"  height="74"/>
    </g>

    <!-- สันลัง -->
    <path d="M108 168 L256 238 L404 168" fill="none" stroke="#fff3cc" stroke-opacity=".55" stroke-width="3" stroke-linejoin="round"/>
    <path d="M256 238 L256 414" fill="none" stroke="#0d1b3e" stroke-opacity=".18" stroke-width="3"/>
  </g>

  <!-- ป้ายเช็คแล้ว -->
  <circle cx="378" cy="374" r="92" fill="#0d1b3e"/>
  <circle cx="378" cy="374" r="79" fill="#ffffff"/>
  <path d="M337 376 L365 404 L421 344" fill="none" stroke="#0d1b3e" stroke-width="24"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
