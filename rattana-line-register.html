<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>ลงทะเบียนพนักงาน LINE v1.1 — Rattana</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0d1b3e;--navy-mid:#1a2f5e;--gold:#c9a84c;--gold-light:#e8c86a;
  --success:#1f9d55;--danger:#d63a2a;--bg:#f4f6fb;--text:#0d1b3e;--card:#fff;--border:#dde3f0;--muted:#6b7896;
  --radius:16px;--shadow:0 8px 24px rgba(13,27,62,.10);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:'Sarabun',sans-serif;font-size:17px;line-height:1.55}
.top{background:linear-gradient(135deg,var(--navy),var(--navy-mid));color:#fff;padding:22px 20px 56px;text-align:center}
.top .logo{display:inline-flex;align-items:center;justify-content:center;width:52px;height:52px;border-radius:50%;
  background:rgba(201,168,76,.18);border:2px solid var(--gold);font-size:26px;margin-bottom:8px}
.top h1{font-size:22px;font-weight:700}
.top p{color:var(--gold-light);font-size:15px;margin-top:2px}
main{max-width:520px;margin:-38px auto 0;padding:0 14px 40px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px 18px;margin-bottom:14px}
.step{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.num{flex:none;width:30px;height:30px;border-radius:50%;background:var(--navy);color:var(--gold-light);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px}
.num.ok{background:var(--success);color:#fff}
.step h2{font-size:18px;font-weight:700}
input[type=text]{width:100%;font:inherit;font-size:24px;font-weight:600;letter-spacing:2px;text-align:center;
  padding:12px;border:2px solid var(--border);border-radius:12px;background:#fafbfd;color:var(--text);outline:none}
input[type=text]:focus{border-color:var(--gold)}
.who{margin-top:10px;padding:12px 14px;border-radius:12px;font-size:16px;display:none}
.who.ok{display:block;background:rgba(31,157,85,.08);border:1px solid rgba(31,157,85,.35)}
.who.err{display:block;background:rgba(214,58,42,.07);border:1px solid rgba(214,58,42,.35);color:var(--danger)}
.who b{font-size:18px}
.photo{display:flex;flex-direction:column;align-items:center;gap:12px;cursor:pointer}
.ph{width:170px;height:170px;border-radius:50%;border:3px dashed var(--border);background:#fafbfd center/cover no-repeat;
  display:flex;align-items:center;justify-content:center;font-size:48px;color:var(--muted)}
.ph.has{border:3px solid var(--gold);font-size:0}
.btn2{font:inherit;font-size:17px;font-weight:600;padding:11px 22px;border-radius:999px;border:2px solid var(--navy);
  background:#fff;color:var(--navy);cursor:pointer}
.hint{color:var(--muted);font-size:14px;text-align:center}
.pdpa{white-space:pre-line;font-size:14.5px;line-height:1.6;background:#fafbfd;border:1px solid var(--border);
  border-radius:12px;padding:12px 14px;max-height:220px;overflow:auto;color:#2a3654}
.agree{display:flex;align-items:flex-start;gap:12px;margin-top:14px;padding:14px;border-radius:12px;
  border:2px solid var(--border);cursor:pointer;font-weight:600}
.agree.on{border-color:var(--success);background:rgba(31,157,85,.06)}
.agree input{width:26px;height:26px;flex:none;accent-color:var(--success);margin-top:1px}
.err-line{color:var(--danger);font-size:15px;margin-top:8px;display:none}
.err-line.show{display:block}
.submit{width:100%;font:inherit;font-size:20px;font-weight:700;padding:16px;border:none;border-radius:14px;
  background:linear-gradient(135deg,var(--gold),var(--gold-light));color:var(--navy);box-shadow:0 4px 12px rgba(201,168,76,.4);cursor:pointer}
.submit[disabled]{opacity:.6}
.center{text-align:center}
.big{font-size:64px;line-height:1;margin:6px 0 10px}
.done h2{font-size:22px;margin-bottom:6px}
.done .info{margin:14px 0;padding:14px;border-radius:12px;background:#fafbfd;border:1px solid var(--border);font-size:17px}
.linkbtn{display:block;text-align:center;text-decoration:none;font-weight:700;font-size:18px;padding:14px;border-radius:14px;
  background:#06c755;color:#fff;margin-top:12px}
.spin{display:inline-block;width:20px;height:20px;border:3px solid rgba(13,27,62,.25);border-top-color:var(--navy);
  border-radius:50%;animation:sp .8s linear infinite;vertical-align:-4px;margin-right:8px}
@keyframes sp{to{transform:rotate(360deg)}}
.hide{display:none!important}
.foot{color:var(--muted);font-size:12px;text-align:center;margin-top:8px}
</style>
</head>
<body>
<div class="top">
  <div class="logo">📝</div>
  <h1>ลงทะเบียนพนักงาน LINE</h1>
  <p>บริษัท รัตนไพบูลย์</p>
</div>
<main>
  <!-- กำลังโหลด -->
  <div class="card center" id="vLoad"><span class="spin"></span>กำลังเปิดฟอร์ม…</div>

  <!-- ฟอร์ม -->
  <form id="vForm" class="hide" novalidate>
    <div class="card">
      <div class="step"><div class="num" id="n1">1</div><h2>รหัสพนักงาน</h2></div>
      <input type="text" id="code" inputmode="numeric" autocomplete="off" maxlength="12" placeholder="เช่น 65142">
      <div class="who" id="who"></div>
    </div>

    <div class="card">
      <div class="step"><div class="num" id="n2">2</div><h2>รูปถ่ายหน้าตรง</h2></div>
      <label class="photo" for="file">
        <div class="ph" id="ph">📷</div>
        <span class="btn2" id="phBtn">ถ่ายรูป / เลือกรูป</span>
        <span class="hint">เห็นหน้าชัด ไม่ใส่แว่นดำ ไม่สวมหมวก</span>
      </label>
      <input type="file" id="file" accept="image/*" class="hide">
      <div class="err-line" id="phErr"></div>
    </div>

    <div class="card">
      <div class="step"><div class="num" id="n3">3</div><h2>ความยินยอม (PDPA)</h2></div>
      <div class="pdpa" id="pdpa"></div>
      <label class="agree" id="agreeBox"><input type="checkbox" id="agree"><span>ข้าพเจ้าอ่านแล้ว และยินยอมให้บริษัทเก็บข้อมูลตามที่แจ้งข้างต้น</span></label>
    </div>

    <div class="err-line center" id="formErr" style="margin-bottom:10px"></div>
    <button type="submit" class="submit" id="send">ส่งลงทะเบียน</button>
    <div class="foot">v1.1 · ข้อมูลส่งตรงถึงฝ่ายบุคคล (HR)</div>
  </form>

  <!-- สำเร็จ / แจ้งเตือน -->
  <div class="card center done hide" id="vDone">
    <div class="big" id="dIcon">✅</div>
    <h2 id="dTitle">ลงทะเบียนเรียบร้อย</h2>
    <div id="dText"></div>
    <a class="linkbtn" id="backChat" href="https://line.me/R/oaMessage/@712dqxgv/">กลับไปที่แชต LINE บริษัท</a>
  </div>
</main>

<script>
// หลังบ้าน = deployment ที่ต่อ Webhook ของ LINE OA (rattana-line-oa.gs v3.4+)
const GAS = 'https://script.google.com/macros/s/AKfycby8-Qrh24PXTAbTq9kexnfXASn-kE2VAdAfCZ2lGaE5JFRf6zZnMKCt3BMr6MylPw6B/exec';
const qs = new URLSearchParams(location.search);
const TOKEN = (qs.get('t') || '').toLowerCase();
const DEMO = qs.get('demo') === '1' && /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
const $ = id => document.getElementById(id);
let emp = null, photo = '', lookT = 0, lookSeq = 0;

const ERR = {
  expired: ['⏰', 'ลิงก์หมดอายุ หรือใช้ไปแล้ว', 'กลับไปที่แชต LINE บริษัท แล้วพิมพ์คำว่า <b>พนักงาน</b> เพื่อรับลิงก์ใหม่ค่ะ'],
  registered: ['✅', 'บัญชี LINE นี้ลงทะเบียนแล้ว', 'ไม่ต้องทำซ้ำค่ะ หากต้องการเปลี่ยนรูป พิมพ์ <b>เปลี่ยนรูป</b> ในแชต'],
  server: ['⚠️', 'ระบบขัดข้องชั่วคราว', 'กรุณาลองใหม่อีกครั้งในอีกสักครู่ค่ะ'],
};
const EMP_ERR = {
  format: 'กรุณาพิมพ์รหัสพนักงานเป็นตัวเลข ไม่เกิน 8 หลัก',
  notfound: 'ไม่พบรหัสนี้ในทะเบียนพนักงาน กรุณาตรวจสอบ หรือติดต่อ HR',
  inactive: 'รหัสนี้มีสถานะพ้นสภาพพนักงานแล้ว กรุณาติดต่อ HR',
  dup: 'รหัสนี้ถูกลงทะเบียนกับบัญชี LINE อื่นแล้ว หากเป็นของคุณ กรุณาแจ้ง HR',
};

function normNum(s) { return String(s || '').replace(/[๐-๙]/g, d => '๐๑๒๓๔๕๖๗๘๙'.indexOf(d)).replace(/[\s\-.]/g, ''); }
function esc(s) { return String(s || '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

async function api(params, body) {
  if (DEMO) return demoApi(params, body);
  const url = GAS + '?' + new URLSearchParams(params || {}).toString();
  const r = body ? await fetch(GAS, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) })
                 : await fetch(url);
  return r.json();
}

function show(view) { ['vLoad', 'vForm', 'vDone'].forEach(v => $(v).classList.toggle('hide', v !== view)); }
function showMsg(key, extraHtml) {
  const e = ERR[key] || ERR.server;
  $('dIcon').textContent = e[0]; $('dTitle').textContent = e[1]; $('dText').innerHTML = extraHtml || e[2];
  show('vDone');
}

function setWho(res) {
  const w = $('who');
  emp = res && res.emp || null;
  if (emp) {
    w.className = 'who ok';
    w.innerHTML = '✅ <b>คุณ' + esc(emp.name) + (emp.nick ? ' (' + esc(emp.nick) + ')' : '') + '</b><br>สาขา ' + esc(emp.w || '-') + (emp.dept ? ' · ' + esc(emp.dept) : '');
  } else if (res && res.empErr) {
    w.className = 'who err'; w.textContent = '❌ ' + (EMP_ERR[res.empErr] || EMP_ERR.notfound);
  } else { w.className = 'who'; w.textContent = ''; }
  $('n1').classList.toggle('ok', !!emp);
}

function lookup() {
  clearTimeout(lookT);
  const c = normNum($('code').value);
  emp = null; $('n1').classList.remove('ok');
  if (c.length < 1) { setWho(null); return; }
  $('who').className = 'who ok'; $('who').innerHTML = '<span class="spin"></span>กำลังตรวจรหัส…';
  lookT = setTimeout(async () => {
    const seq = ++lookSeq;
    try {
      const res = await api({ action: 'regInfo', t: TOKEN, code: c });
      if (seq !== lookSeq) return;
      if (!res.ok) return showMsg(res.error);
      setWho(res);
    } catch (e) { if (seq === lookSeq) { $('who').className = 'who err'; $('who').textContent = 'ตรวจรหัสไม่ได้ ลองใหม่อีกครั้ง'; } }
  }, 450);
}

// ย่อรูปเหลือด้านยาว 1080px JPEG — ส่งเร็ว ไม่เปลืองเน็ต
async function shrink(file) {
  let src;
  try { src = await createImageBitmap(file, { imageOrientation: 'from-image' }); }
  catch (e) {
    src = await new Promise((ok, no) => { const im = new Image(); im.onload = () => ok(im); im.onerror = no; im.src = URL.createObjectURL(file); });
  }
  const W = src.width, H = src.height, k = Math.min(1, 1080 / Math.max(W, H));
  const cv = document.createElement('canvas'); cv.width = Math.round(W * k); cv.height = Math.round(H * k);
  cv.getContext('2d').drawImage(src, 0, 0, cv.width, cv.height);
  return cv.toDataURL('image/jpeg', 0.85);
}

$('file').addEventListener('change', async e => {
  const f = e.target.files && e.target.files[0];
  $('phErr').classList.remove('show');
  if (!f) return;
  if (!/^image\//.test(f.type) && !/\.(jpe?g|png|heic|heif|webp)$/i.test(f.name)) { $('phErr').textContent = 'กรุณาเลือกไฟล์รูปภาพ'; $('phErr').classList.add('show'); return; }
  $('phBtn').innerHTML = '<span class="spin"></span>กำลังเตรียมรูป…';
  try {
    photo = await shrink(f);
    const ph = $('ph'); ph.style.backgroundImage = 'url(' + photo + ')'; ph.classList.add('has');
    $('phBtn').textContent = 'เปลี่ยนรูป'; $('n2').classList.add('ok');
  } catch (err) {
    photo = ''; $('phBtn').textContent = 'ถ่ายรูป / เลือกรูป';
    $('phErr').textContent = 'เปิดรูปนี้ไม่ได้ ลองถ่ายใหม่หรือเลือกรูปอื่น'; $('phErr').classList.add('show');
  }
});

$('code').addEventListener('input', () => { $('formErr').classList.remove('show'); lookup(); });
$('agree').addEventListener('change', () => {
  $('agreeBox').classList.toggle('on', $('agree').checked); $('n3').classList.toggle('ok', $('agree').checked);
  $('formErr').classList.remove('show');
});

$('vForm').addEventListener('submit', async e => {
  e.preventDefault();
  const fe = $('formErr'), miss = [];
  if (!emp) miss.push(normNum($('code').value) ? 'รหัสพนักงานยังไม่ถูกต้อง' : 'รหัสพนักงาน');
  if (!photo) miss.push('รูปถ่าย');
  if (!$('agree').checked) miss.push('ติ๊กยินยอม');
  if (miss.length) {
    fe.textContent = 'ยังขาด: ' + miss.join(' · '); fe.classList.add('show');
    (!emp ? $('code') : !photo ? $('ph') : $('agreeBox')).scrollIntoView({ behavior: 'smooth', block: 'center' });   // พาไปช่องแรกที่ยังขาด
    return;
  }
  const btn = $('send'); btn.disabled = true; btn.innerHTML = '<span class="spin"></span>กำลังส่ง…';
  try {
    const res = await api(null, { action: 'regSubmit', t: TOKEN, code: emp.code, consent: true, photo });
    if (res.ok) {
      $('dIcon').textContent = '✅'; $('dTitle').textContent = 'ลงทะเบียนเรียบร้อย';
      $('dText').innerHTML = '<div class="info"><b>คุณ' + esc(res.name) + (res.nick ? ' (' + esc(res.nick) + ')' : '') + '</b><br>รหัส ' + esc(res.code) +
        ' · สาขา ' + esc(res.w || '-') + '</div>ต่อไปจะได้รับการแจ้งเตือนจากบริษัททาง LINE ค่ะ<br>ปิดหน้านี้ได้เลย';
      show('vDone'); return;
    }
    if (EMP_ERR[res.error]) { setWho({ empErr: res.error }); fe.textContent = EMP_ERR[res.error]; fe.classList.add('show'); }
    else if (res.error === 'photo') { fe.textContent = 'รูปไม่ถูกต้อง กรุณาถ่ายหรือเลือกรูปใหม่'; fe.classList.add('show'); }
    else if (res.error === 'consent') { fe.textContent = 'กรุณาติ๊กยินยอมก่อนส่ง'; fe.classList.add('show'); }
    else return showMsg(res.error);
  } catch (err) { fe.textContent = 'ส่งไม่สำเร็จ ตรวจสัญญาณเน็ตแล้วกดส่งอีกครั้ง'; fe.classList.add('show'); }
  btn.disabled = false; btn.textContent = 'ส่งลงทะเบียน';
});

async function start() {
  if (!TOKEN && !DEMO) return showMsg('expired', 'เปิดฟอร์มนี้จากปุ่มในแชต LINE บริษัทนะคะ<br>พิมพ์คำว่า <b>พนักงาน</b> ในแชต เพื่อรับลิงก์');
  try {
    const res = await api({ action: 'regInfo', t: TOKEN });
    if (!res.ok) return showMsg(res.error);
    $('pdpa').textContent = res.pdpa || '';
    if (res.code) { $('code').value = res.code; setWho(res); }
    show('vForm');
  } catch (e) { showMsg('server'); }
}

// โหมดตัวอย่าง (เฉพาะ localhost ?demo=1)
const DEMO_EMP = { '65142': { code: '65142', name: 'เจนจิรา ทองนาค', nick: 'จา', w: 'HQ', dept: 'ทรัพยากรบุคคล' },
                   '11304': { code: '11304', name: 'ชาย เล็ก', nick: 'เล็ก', w: 'ลาดใหญ่', dept: 'หน้าลาน' } };
async function demoApi(p, b) {
  await new Promise(r => setTimeout(r, 400));
  const pdpa = '📄 การเก็บข้อมูลส่วนบุคคล (PDPA)\n\nบริษัท รัตนไพบูลย์ จะเก็บข้อมูลของคุณดังนี้\n• รหัสพนักงาน และชื่อ-สาขา-แผนกจากทะเบียนพนักงาน\n• LINE User ID ชื่อและรูปโปรไฟล์ LINE\n• รูปถ่ายที่คุณส่งมา\n\nวัตถุประสงค์: ยืนยันตัวตน และส่งข่าวสาร/แจ้งเตือนเกี่ยวกับงานทาง LINE\nผู้เข้าถึง: ฝ่ายบุคคล (HR) และระบบของบริษัทเท่านั้น\nระยะเวลา: ระหว่างที่เป็นพนักงาน และลบเมื่อพ้นสภาพพนักงาน หรือเมื่อคุณขอยกเลิก\n\nคุณถอนความยินยอมได้ทุกเมื่อ โดยพิมพ์ "ยกเลิก" ในแชตนี้ หรือติดต่อ HR';
  const c = normNum((b && b.code) || (p && p.code) || qs.get('code') || '');
  const chk = !c ? {} : !/^\d{1,8}$/.test(c) ? { empErr: 'format' } : DEMO_EMP[c] ? { emp: DEMO_EMP[c] } : c === '60001' ? { empErr: 'inactive' } : c === '68030' ? { empErr: 'dup' } : { empErr: 'notfound' };
  if (b) return chk.emp ? Object.assign({ ok: true }, chk.emp) : { ok: false, error: chk.empErr || 'notfound' };
  return Object.assign({ ok: true, pdpa, code: c }, chk);
}

start();
</script>
</body>
</html>
