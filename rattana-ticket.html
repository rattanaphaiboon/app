<title>Rattana Ticket v1.0</title>
<!-- Rattana Ticket · แจ้งปัญหาแอป → คนรับผิดชอบ (หรือ Claude) ปิดงานพร้อมคำอธิบาย · หน้าตา Rattana CI
     ต้นฉบับ D:\Calude\Ticket_App\rattana-ticket.src.html → python -I Ticket_App\build.py → rattanaphaiboon-app\rattana-ticket.html -->
<link rel="stylesheet" href="https://rattanaphaiboon.github.io/app/rattana-ui/rattana-ui.css">
<script src="https://rattanaphaiboon.github.io/app/rattana-ui/rattana-ui.js" defer></script>
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<style>
/* เฉพาะแอปนี้ · ใช้ตัวแปรของ Rattana CI */
.tk-main { display: flex; flex-direction: column; gap: 16px; padding-top: 16px; }
.rt-topbar.tk-bar { flex-wrap: nowrap; gap: 10px; padding-left: 12px; }
.tk-bar .rt-logo { height: 40px; }
.tk-top { min-width: 0; }
.tk-top h1 { margin: 0; font-size: 18px; line-height: 1.2; font-weight: 700; color: var(--ink); white-space: nowrap; }
.tk-top .rt-caption { display: block; }
.tk-hub img { width: 18px; height: 18px; border-radius: 5px; }
.tk-who { display: flex; align-items: center; gap: 8px; font-size: 14px; }
.tk-who svg { width: 16px; height: 16px; flex: none; }
.tk-who span { flex: 1 1 auto; min-width: 0; }
.tk-daterow { flex-wrap: nowrap; }
.tk-sp { flex: 1 1 auto; }
.tk-chips .rt-chip { padding: 0 12px; }
.tk-who button { flex: none; border: 0; background: none; color: #d5e2f3; font: inherit; font-size: 13px; text-decoration: underline; cursor: pointer; padding: 6px 0 6px 8px; }
.tk-kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.tk-chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px; scrollbar-width: none; }
.tk-chips::-webkit-scrollbar { display: none; }
.tk-chips .rt-chip { flex: none; }
.tk-list { display: flex; flex-direction: column; gap: 8px; padding: 10px; }
.tk-row { width: 100%; text-align: left; font: inherit; color: inherit; cursor: pointer; align-items: center; background: var(--surface); border: 1px solid color-mix(in srgb, var(--info) 20%, transparent); }
.tk-row > .tk-grow { flex: 1 1 auto; min-width: 0; }
.tk-row .rt-cell-main, .tk-row .rt-cell-sub { overflow-wrap: anywhere; }
.tk-end { flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.tk-due { font-size: 12px; font-weight: 600; color: var(--text-muted); white-space: nowrap; }
.tk-due.is-late { color: var(--reject-text); }
.tk-block { display: flex; flex-direction: column; gap: 6px; }
.tk-text { margin: 0; line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--text); }
.tk-note { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 14px; background: var(--hover); font-size: 13px; color: var(--text-muted); }
.tk-note svg { width: 16px; height: 16px; flex: none; }
.tk-result { display: flex; flex-direction: column; gap: 6px; padding: 14px; border-radius: 18px; background: var(--approve-soft); border: 1px solid color-mix(in srgb, var(--approve) 35%, transparent); }
.tk-result b { display: flex; align-items: center; gap: 6px; color: var(--approve-text); }
.tk-result b svg { width: 16px; height: 16px; }
.tk-result .rt-btn { align-self: flex-start; margin-top: 4px; }
.tk-result.tk-stuck { background: var(--warning-soft); border-color: color-mix(in srgb, var(--warning) 45%, transparent); }
.tk-result.tk-stuck b { color: var(--warning-text); }
.tk-how { padding: 10px 12px; border-radius: 12px; background: color-mix(in srgb, var(--surface) 70%, transparent); }
.tk-how small { display: block; font-size: 12px; font-weight: 600; color: var(--approve-text); }
.rt-timeline-dot.tk-wait { background: var(--border); color: transparent; box-shadow: none; }
.tk-badges { display: flex; flex-wrap: wrap; gap: 6px; }
.tk-quote { padding: 10px 12px; border-radius: 14px; background: var(--hover); }
.tk-login { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 32px 20px; text-align: center; margin-top: 8vh; }
.tk-login h1 { margin: 0; font-size: 24px; color: var(--ink); }
.tk-login p { margin: 0; color: var(--text-muted); font-size: 14px; }
.tk-login .err { min-height: 20px; color: var(--reject-text); font-size: 14px; font-weight: 500; }
.tk-skel { height: 72px; border-radius: 18px; }
[hidden] { display: none !important; }
/* พื้น popup สว่าง ไม่เทา + น้ำเงินกรมท่า */
[data-theme="light"] .rt-scrim { background: rgba(1,30,62,.16); }
[data-theme="light"] .rt-popup { background: linear-gradient(180deg, #ffffff 0%, #f1f6ff 100%); }
[data-theme="light"] .rt-popup .rt-input, [data-theme="light"] .rt-popup .rt-textarea, [data-theme="light"] .rt-popup .rt-select { background: #fff; border-color: color-mix(in srgb, var(--info) 28%, transparent); }
.rt-popup-head { padding: 14px 16px; border-radius: 18px; background: linear-gradient(125deg, #17477f 0%, var(--navy) 100%); box-shadow: inset 0 1px 0 rgba(255,255,255,.2); }
.rt-popup-head .rt-h3 { color: #fff; font-size: 20px; overflow-wrap: anywhere; }
.rt-popup-head .rt-popup-msg { color: #d5e2f3; font-size: 14px; }
.rt-popup .rt-field > label, .rt-popup .rt-field-label, .rt-popup .tk-block > .rt-caption { color: var(--info-text); font-weight: 600; }
.tk-hero { display: flex; flex-direction: column; gap: 12px; padding: 16px; }
.tk-hero > * { position: relative; z-index: 1; }
.tk-hero .rt-date, .tk-hero .tk-who { color: #d5e2f3; }
.tk-hero h2 { margin: 0; color: #fff; font-size: 22px; line-height: 1.3; font-weight: 600; }
.tk-hero .rt-seg { background: rgba(255,255,255,.1); border-color: rgba(255,255,255,.2); }
.tk-hero .rt-seg > button { color: #fff; min-width: 0; }
.tk-hero .rt-seg > button[aria-pressed="true"] { color: var(--on-gold); }
.tk-kpi { display: flex; flex-direction: column; gap: 4px; padding: 10px 12px; border-radius: 16px; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.2); }
.tk-kpi span { font-size: 12px; color: #d5e2f3; white-space: nowrap; }
.tk-kpi b { font-size: 30px; line-height: 1.1; color: #fff; font-variant-numeric: tabular-nums; }
.tk-kpi b small { font-size: 13px; font-weight: 500; color: #d5e2f3; margin-left: 4px; }
.tk-kpi .is-late { color: #ffc2c2; font-weight: 600; }
</style>
</head>

      : await fetch(GAS_URL + '?' + q + '&email=' + encodeURIComponent(email) + '&sig=' + encodeURIComponent(sig) + '&t=' + Date.now(), { cache: 'no-store' });
  } catch (e) { throw new Error('ต่อหลังบ้านไม่ได้ ตรวจสัญญาณเน็ตแล้วลองใหม่'); }
  let j; try { j = await r.json(); } catch (e) { throw new Error('หลังบ้านตอบไม่ถูกต้อง (' + r.status + ')'); }
  if (!j.ok && j.needLogin) { setSig(''); showLogin('เข้าสู่ระบบใหม่อีกครั้ง'); throw new Error('ต้องเข้าสู่ระบบ'); }
  if (!j.ok) throw new Error(j.error || 'เกิดข้อผิดพลาด');
  return j;
}

const S = { me: null, tickets: [], tab: 'rep', filter: 'all', view: 'home', q: '', now: '', loadedAt: 0, seenAtOpen: '' };

/* กดแล้วจอต้องอยู่ที่เดิม: จำตำแหน่งเลื่อนไว้ แล้วคืนหลังวาดใหม่/ปิด popup */
function keepY(fn) { const y = scrollY; fn(); scrollTo(0, y); requestAnimationFrame(() => { if (Math.abs(scrollY - y) > 1) scrollTo(0, y); }); }
function popup(o) { const y = scrollY; return UI().popup(o).then(v => { scrollTo(0, y); return v; }); }

const byId = id => S.tickets.find(t => t.id === id);

function listOf() { const e = S.me.email; return S.tickets.filter(t => S.tab === 'rep' ? t.repEmail === e : S.tab === 'own' ? t.ownEmail === e : true); }
/* เรียง: ยังไม่ปิด (เลยกำหนด → วันนี้ → ใกล้ → ไกล → ไม่มีกำหนด) → ปิดแล้ว (ล่าสุดบน) */
function sortT(a) { return a.slice().sort((x, y) => {

/* ───── แจ้งเตือน: คิดจาก Ticket (เรื่องใหม่ถึงฉัน · เรื่องที่ฉันแจ้งติดปัญหา/ถูกปิด) ───── */
function events() {

    if (t.repEmail === e && t.blockAt && t.status === 'blocked') out.push({ kind: 'block', at: t.blockAt, id: t.id, title: t.id + ' ติดปัญหา', sub: t.ownName + ': ' + t.blockNote });

}

  popup({ icon: 'approve', title: 'ปิดงาน ' + t.id + '?', message: 'คนแจ้งจะเห็นข้อความนี้ในแอป และก๊อปไปส่งไลน์ได้', size: 'md',
    content: quote(t) +
      '<div class="rt-field"><label for="cNote">แก้อะไรไป <span class="rt-req">*</span></label><textarea class="rt-textarea" id="cNote" maxlength="1000" placeholder="เช่น เพิ่มสิทธิ์ให้แล้ว"></textarea>' + errLine('cErr', 'อธิบายอย่างน้อย 10 ตัวอักษร') + '</div>' +
      '<div class="rt-field"><label for="cHow">วิธีใช้งานหลังแก้ (สั้นๆ)</label><textarea class="rt-textarea" id="cHow" maxlength="300" style="min-height:64px" placeholder="เช่น ออกจากแอปแล้วเข้าใหม่ 1 ครั้ง ปุ่มใหม่อยู่มุมขวาบน"></textarea><span class="rt-help">ไม่มีอะไรต้องทำเพิ่ม เว้นว่างได้</span></div>',
    onOpen: api => liveClear(api, '#cNote', '#cErr', 10),
    actions: [{ label: 'ยกเลิก', variant: 'glass', value: false }, { label: 'ปิดงาน', variant: 'approve', value: true, onClick: api => {
      if (!need(api, '#cNote', '#cErr', 10)) return false;
      return gas('', { action: 'close', id: t.id, note: $('#cNote', api.el).value.trim(), howTo: $('#cHow', api.el).value.trim() }).then(r => { replace(r.ticket); }, e => failed(api, e));
    } }]
  }).then(ok => { if (ok) UI().toast('ปิดงาน ' + t.id + ' แล้ว'); openTicket(t.id, true); });
}

/* ───── รายชื่อแอปจาก Rattana Hub (แท็บ list) ───── */
function parseCsv(text) {
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) { const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch; }
    else if (ch === '"') q = true; else if (ch === ',') { row.push(cell); cell = ''; } else if (ch === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; } else if (ch !== '\r') cell += ch; }
  if (cell.length || row.length) { row.push(cell); rows.push(row); }
  return rows;
}
async function hubApps() {
  try { const c = JSON.parse(lsGet(APPS_KEY) || 'null'); if (c && Date.now() - c.t < 6 * 36e5 && c.apps.length) return c.apps; } catch (e) {}
  let r; try { r = await fetch('https://docs.google.com/spreadsheets/d/' + HUB_SHEET + '/gviz/tq?tqx=out:csv&sheet=list'); } catch (e) { throw new Error('อ่านรายชื่อแอปจาก Hub ไม่ได้'); }
  if (!r.ok) throw new Error('อ่านรายชื่อแอปจาก Hub ไม่ได้');
  const rows = parseCsv(await r.text()), H = rows[0].map(x => x.trim()), iN = H.indexOf('name_th'), iC = H.indexOf('category'), iA = H.indexOf('active');
  if (iN < 0) throw new Error('ชีต Hub ไม่มีคอลัมน์ name_th');
  const seen = {}, apps = [];
  rows.slice(1).forEach(x => { const n = (x[iN] || '').trim(); if (!n || seen[n.toLowerCase()] || (iA >= 0 && (x[iA] || '').trim().toUpperCase() === 'FALSE')) return; seen[n.toLowerCase()] = 1; apps.push({ n, c: (iC >= 0 && (x[iC] || '').trim()) || 'อื่นๆ' }); });
  lsSet(APPS_KEY, JSON.stringify({ t: Date.now(), apps }));
  return apps;
}

/* ───── เปิด Ticket ใหม่ ───── */
async function openNew(preApp) {
  let apps = [], appErr = '';
  try { apps = await hubApps(); } catch (e) { appErr = e.message; }
  const groups = [], by = {};
  apps.forEach(a => { if (!by[a.c]) { by[a.c] = []; groups.push(a.c); } by[a.c].push(a.n); });
  const opts = '<option value="">เลือกแอป</option>' + groups.map(g => '<optgroup label="' + esc(g) + '">' + by[g].map(n => '<option' + (n === preApp ? ' selected' : '') + '>' + esc(n) + '</option>').join('') + '</optgroup>').join('') + '<option>' + OTHER_APP + '</option>';
  let due = addDays(3); const nonce = Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
  popup({ title: 'เปิด Ticket ใหม่', message: 'แจ้งโดย ' + S.me.display, size: 'md',
    content: '<div class="rt-field"><label for="fApp">แอปที่จะแจ้ง <span class="rt-req">*</span></label><select class="rt-select" id="fApp">' + opts + '</select><span class="rt-help">' + (appErr ? esc(appErr) + ' เลือก อื่นๆ แล้วพิมพ์ชื่อแอปในหัวข้อได้' : 'รายชื่อแอปมาจาก Rattana Hub (' + apps.length + ' แอป)') + '</span>' + errLine('fAppErr', 'เลือกแอปก่อนส่ง') + '</div>' +
      '<div class="rt-field"><label for="fTitle">หัวข้อ <span class="rt-req">*</span></label><input class="rt-input" id="fTitle" maxlength="60" placeholder="เช่น กดบันทึกแล้วหมุนค้าง">' + errLine('fTitleErr', 'ใส่หัวข้อสั้นๆ ก่อนส่ง') + '</div>' +
      '<div class="rt-field"><label for="fDetail">รายละเอียด <span class="rt-req">*</span></label><textarea class="rt-textarea" id="fDetail" maxlength="2000" placeholder="เกิดอะไร ที่หน้าไหน ลองอะไรไปแล้วบ้าง"></textarea>' + errLine('fDetailErr', 'เล่ารายละเอียดให้คนรับผิดชอบเข้าใจ') + '</div>' +
      '<div class="rt-field"><span class="rt-field-label">อยากให้เสร็จภายใน</span><div class="tk-chips" id="fDue">' + [['0', 'วันนี้'], ['1', 'พรุ่งนี้'], ['3', '3 วัน'], ['7', '7 วัน']].map(d => '<button type="button" class="rt-chip" value="' + d[0] + '" aria-pressed="' + (d[0] === '3') + '">' + d[1] + '</button>').join('') + '</div><span class="rt-help" id="fDueHint">กำหนด ' + due + '</span></div>',
    onOpen: api => {
      $('#fDue', api.el).addEventListener('click', e => { const b = e.target.closest('.rt-chip'); if (!b) return; $('#fDue', api.el).querySelectorAll('.rt-chip').forEach(x => x.setAttribute('aria-pressed', x === b ? 'true' : 'false')); due = addDays(+b.value); $('#fDueHint', api.el).textContent = 'กำหนด ' + due; });
      $('#fApp', api.el).addEventListener('change', () => { if ($('#fApp', api.el).value) { $('#fApp', api.el).closest('.rt-field').classList.remove('is-invalid'); $('#fAppErr', api.el).hidden = true; } });
      liveClear(api, '#fTitle', '#fTitleErr', 1); liveClear(api, '#fDetail', '#fDetailErr', 1);
    },
    actions: [{ label: 'ยกเลิก', variant: 'glass', value: false }, { label: 'ส่ง Ticket', variant: 'gold', value: true, onClick: api => {
      const a = need(api, '#fDetail', '#fDetailErr', 1), b = need(api, '#fTitle', '#fTitleErr', 1), c = need(api, '#fApp', '#fAppErr', 1);
      if (!(a && b && c)) return false;
      return gas('', { action: 'create', app: $('#fApp', api.el).value, title: $('#fTitle', api.el).value.trim(), detail: $('#fDetail', api.el).value.trim(), due, nonce })
        .then(r => { S.tab = 'rep'; replace(r.ticket); UI().toast('ส่ง ' + r.ticket.id + ' ถึง ' + r.ticket.ownName + ' แล้ว'); }, e => failed(api, e));
    } }]
  }).then(ok => { if (ok) { if (S.view !== 'home') show('home'); const seg = $('#tabSeg'); if (seg) { seg.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x.value === 'rep' ? 'true' : 'false')); seg._rtPick && seg._rtPick(); } } });
}

/* ═════════ ล็อกอิน + เริ่มแอป ═════════ */
function showLogin(msg) {
  $('#top').hidden = true; $('#nav').hidden = true;
  $('#app').innerHTML = '<div class="rt-glass tk-login"><img src="https://rattanaphaiboon.github.io/app/rattana-ui/rattana-logo-navy.png" alt="RATTANA" style="height:46px;border-radius:12px"><h1>Rattana Ticket</h1><p>แจ้งปัญหาแอป ติดตามจนปิดงาน · ' + APP_VER + '</p><div id="gbtn"></div><div class="err" id="lgErr">' + esc(msg || '') + '</div></div>';
  if (!document.getElementById('gsi')) { const g = document.createElement('script'); g.id = 'gsi'; g.src = 'https://accounts.google.com/gsi/client'; g.async = true; document.head.appendChild(g); }
  const paint = () => {
    if (!(window.google && google.accounts && google.accounts.id)) return setTimeout(paint, 150);
    google.accounts.id.initialize({ client_id: CLIENT_ID, callback: onGoogle, auto_select: false });
    google.accounts.id.renderButton($('#gbtn'), { type: 'standard', size: 'large', theme: 'filled_blue', text: 'signin_with', shape: 'pill' });
  };
  paint();
}
async function onGoogle(resp) {
  $('#lgErr').textContent = 'กำลังตรวจสอบ...';
  try {
    const r = await fetch(GAS_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 'login', credential: resp.credential }) }).then(x => x.json());
    if (!r.ok) throw new Error(r.error || 'เข้าสู่ระบบไม่สำเร็จ');
    setSig(r.sig);
    const u = r.me; saveSharedSession({ email: u.email, name: u.name, nickname: u.nickname, role: u.role, dept: u.dept, company: 'รัตนไพบูลย์', warehouse: u.warehouse, empId: u.empId, picture: '' });
    boot();
  } catch (e) { $('#lgErr').textContent = e.message; }
}
function apply(r, first) {
  S.me = r.me; S.tickets = r.tickets; S.now = r.now; S.loadedAt = Date.now();
  if (first) { S.tab = S.tickets.some(t => t.ownEmail === S.me.email && t.status !== 'done') ? 'own' : 'rep'; if (!lsGet(SEEN_KEY)) lsSet(SEEN_KEY, '0'); shell(); }
  render();
}
async function load(manual) {
  const btn = $('#reload'); if (manual && btn) UI().setLoading(btn, true);
  try { const r = await gas('action=init'); lsSet(INIT_KEY, JSON.stringify({ sig: getSig(), r })); apply(r, !S.me); if (manual) UI().toast('โหลดข้อมูลใหม่แล้ว', { duration: 1500 }); return true; }
  catch (e) {
    if (!getSig()) return false;
    if (S.me) UI().toast(e.message, { type: 'error' });
    else { $('#app').innerHTML = '<div class="rt-glass rt-empty"><span class="rt-tile rt-tile-red">' + ic('alert') + '</span><b class="rt-h4">โหลดข้อมูลไม่สำเร็จ</b><p>' + esc(e.message) + '</p><button class="rt-btn rt-btn-gold" type="button" id="retry">' + ic('refresh') + '<span>ลองใหม่</span></button></div>'; $('#retry').onclick = () => boot(); }
    return false;
  } finally { if (btn) UI().setLoading(btn, false); }
}
async function boot() {
  if (!window.RattanaUI) { $('#app').innerHTML = '<div class="tk-login"><h1>Rattana Ticket</h1><p>โหลดหน้าตาแอปไม่สำเร็จ ตรวจสัญญาณเน็ตแล้วเปิดใหม่อีกครั้ง</p><button type="button" onclick="location.reload()">เปิดใหม่</button></div>'; return; }
  if (!getSig()) { showLogin(); return; }
  if (!S.me) {
    let shown = false;
    try { const c = JSON.parse(lsGet(INIT_KEY) || 'null'); if (c && c.sig === getSig() && c.r && c.r.me) { apply(c.r, true); shown = true; } } catch (e) {}
    if (!shown) $('#app').innerHTML = '<div class="rt-skeleton tk-skel" style="height:220px"></div><div class="rt-skeleton tk-skel"></div><div class="rt-skeleton tk-skel"></div>';
  }
  const ok = await load(false);
  if (!ok || !S.me) return;
  const qs = new URLSearchParams(location.search), tid = qs.get('t'), app = qs.get('app');
  if (tid && !boot.linked) { boot.linked = 1; openTicket(tid.toUpperCase()); }
  else if (app && !boot.linked) { boot.linked = 1; openNew(app); }
}
$('#nav').addEventListener('click', e => { const a = e.target.closest('a'); if (!a) return; e.preventDefault(); if (!S.me) return; if (a.dataset.p === 'new') openNew(''); else show(a.dataset.p); });
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.me && Date.now() - S.loadedAt > 60000 && !document.querySelector('.rt-overlay')) load(false); });
window.addEventListener('DOMContentLoaded', () => boot());
</script>
