.cc-top-title b{font-size:17px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc-top-title small{font-size:12px;color:var(--text-subtle);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt-topbar{flex-wrap:nowrap}
.cc-sync{display:none}
.cc-sync.show{display:inline-flex}
.cc-sync svg{animation:cc-spin 1.1s linear infinite}
@keyframes cc-spin{to{transform:rotate(360deg)}}
@media(max-width:479px){.cc-sync .t{display:none}}
.cc-side-foot{margin-top:auto;font-size:12px;color:#c7d2e0;padding:0 12px;line-height:1.5}

.cc-toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.cc-toolbar .rt-select{height:40px;width:auto;min-width:0;font-size:14px}
.cc-chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 6px;margin:0 -2px}
.cc-chips::-webkit-scrollbar{display:none}
.cc-chips .rt-chip{flex:none}
.cc-chips .rt-chip small{font-weight:500;opacity:.75}
.cc-note{display:flex;align-items:center;gap:12px;padding:12px 14px}
.cc-note .cc-row-body{flex:1}

/* การ์ดร้าน */
.cc-shops{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}

.cc-shop-top{display:flex;gap:12px;align-items:center}

.cc-photo svg{width:34px;height:34px}
.cc-shop-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.cc-shop-name{font-size:17px;font-weight:700;color:var(--ink);line-height:1.3}
.cc-chev{color:var(--text-subtle);flex:none;display:inline-flex}
.cc-mini{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.cc-mini > div{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:10px;border-radius:16px;background:var(--hover);min-width:0}
.cc-mini b{font-size:18px;line-height:1.1;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.cc-mini small{font-size:12px;color:var(--text-subtle);line-height:1.25}
.cc-facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px 18px}

.cc-facts > div{min-width:0;display:flex;flex-direction:column}

.cc-sec{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.cc-sec h2{flex:1;min-width:180px}
.cc-sec h2 small{font-size:14px;font-weight:500;color:var(--text-subtle)}

/* การ์ดสินค้า */

.cc-prod .rt-product-media img{object-fit:contain;padding:12%}
.cc-ph{color:var(--text-subtle);opacity:.45;display:inline-flex}
.cc-prod .rt-product-name{min-height:43px}
.cc-prod-foot{display:flex;align-items:center;justify-content:space-between;gap:6px}
.cc-list{display:flex;flex-direction:column;gap:8px}
.cc-row{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit}

.cc-row-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.cc-row .cc-row-body .rt-cell-main{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc-row-end{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}

.cc-dimg{width:170px;flex:none}

.cc-chart{width:100%;height:auto;display:block}

.cc-chart .ptl{fill:var(--gold);stroke:var(--surface);stroke-width:2}

.cc-card-head .rt-seg > button{min-width:56px;padding:0 10px}

.cc-float{position:fixed;z-index:38;left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right));bottom:calc(96px + env(safe-area-inset-bottom))}

.cc-tick{width:36px;height:36px;border-radius:12px;border:1.5px solid var(--border);background:var(--field);display:flex;align-items:center;justify-content:center;color:transparent;flex:none;cursor:pointer}

.rt-list-row.is-on{box-shadow:inset 0 0 0 1.5px var(--gold)}
.cc-stepper input{width:44px;height:36px;border:0;background:transparent;text-align:center;font-weight:700;color:var(--ink);font-size:16px;outline:none;font-family:inherit;-moz-appearance:textfield}

.cc-skel-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.cc-rank{display:flex;align-items:center;gap:12px;padding:10px 22px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.cc-rank:last-child{border-bottom:none}
a.cc-rank:hover{background:var(--hover)}

.cc-rank .cc-thumb{width:44px;height:44px;border-radius:12px}
.cc-rank .cc-row-body .rt-cell-main{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc-set{display:flex;align-items:center;gap:14px;padding:14px 22px;border-bottom:1px solid var(--line)}
.cc-set:last-child{border-bottom:none}
#lightbox{display:none;position:fixed;inset:0;z-index:95;background:var(--scrim);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);align-items:center;justify-content:center;padding:16px}
#lightbox.open{display:flex}
#lightbox img{max-width:100%;max-height:88dvh;border-radius:22px;background:#fff;box-shadow:var(--shadow-3)}
</style>

/* ════════ Helpers ════════ */
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const encA = s => encodeURIComponent(s).replace(/'/g, '%27');
const ZW = new RegExp('[' + String.fromCharCode(0x200B,0x200C,0x200D,0xFEFF) + ']', 'g');
const NBSP = new RegExp(String.fromCharCode(160), 'g');
const clean = s => String(s==null?'':s).replace(ZW,'').replace(NBSP,' ').replace(/\s+/g,' ').trim();
const normSku = s => clean(s).replace(/^\d+@/, '');
const num = v => { const n = parseFloat(String(v==null?'':v).replace(/,/g,'')); return isFinite(n) ? n : 0; };
const fmtQ = n => (Math.round(n*100)/100).toLocaleString('th-TH', {maximumFractionDigits:2});
const fmtB = n => '฿' + (Math.abs(n - Math.round(n)) < 0.005 ? Math.round(n).toLocaleString('th-TH') : n.toLocaleString('th-TH', {minimumFractionDigits:2, maximumFractionDigits:2}));
const fmtBi = n => '฿' + Math.round(n).toLocaleString('th-TH');
function isoToDate(iso){ const [y,m,d] = iso.split('-').map(Number); return new Date(y, m-1, d); }
function dateToISO(t){ return t.getFullYear() + '-' + String(t.getMonth()+1).padStart(2,'0') + '-' + String(t.getDate()).padStart(2,'0'); }
const addDays = (iso, n) => { const d = isoToDate(iso); d.setDate(d.getDate() + n); return dateToISO(d); };
function formatThaiDate(iso){ if(!iso) return '-'; const d = isoToDate(iso); return String(d.getDate()).padStart(2,'0') + '/' + String(d.getMonth()+1).padStart(2,'0') + '/' + (d.getFullYear()+543); }
function midThaiDate(iso){ if(!iso) return '-'; const d = isoToDate(iso); return d.getDate() + ' ' + MONTHS_S[d.getMonth()] + ' ' + (d.getFullYear()+543); }
function shortThaiDate(iso){ if(!iso) return '-'; const d = isoToDate(iso); return d.getDate() + '/' + (d.getMonth()+1); }
function daysAgo(iso){ const t = new Date(); t.setHours(0,0,0,0); return Math.round((t - isoToDate(iso)) / 86400000); }
const todayISO = () => dateToISO(new Date());
const timeTH = t => { const d = new Date(t); return String(d.getHours()).padStart(2,'0') + '.' + String(d.getMinutes()).padStart(2,'0') + ' น.'; };
function toISO(v){
  v = clean(v); if (!v) return '';
  let m = /^Date\((\d+),(\d+),(\d+)/.exec(v);
  if (m) return m[1] + '-' + String(+m[2]+1).padStart(2,'0') + '-' + String(m[3]).padStart(2,'0');
  m = /^(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})/.exec(v);
  if (m) return m[1] + '-' + m[2].padStart(2,'0') + '-' + m[3].padStart(2,'0');
  m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})/.exec(v);
  if (m) { let y = +m[3]; if (y > 2400) y -= 543; return y + '-' + m[2].padStart(2,'0') + '-' + m[1].padStart(2,'0'); }
  return '';
}

/* ════════ Google Sheet (gviz JSONP — ใช้ได้ทั้งไฟล์ในเครื่องและ GitHub Pages) ════════ */
function gviz(sheetId, tab, tq, timeoutMs){
  return new Promise((resolve, reject) => {
    const cb = '__rcc_cb' + Date.now() + Math.floor(Math.random()*1e6);
    const s = document.createElement('script');
    const timer = setTimeout(() => { cleanup(); reject(new Error('หมดเวลารอข้อมูลจากชีต')); }, timeoutMs || 60000);
    function cleanup(){ clearTimeout(timer); window[cb] = function(){}; s.remove(); }
    window[cb] = res => { cleanup(); (res && res.status !== 'error') ? resolve(res) : reject(new Error((res && res.errors && res.errors[0] && (res.errors[0].detailed_message || res.errors[0].message)) || 'ชีตตอบกลับผิดพลาด')); };
    let url = 'https://docs.google.com/spreadsheets/d/' + sheetId + '/gviz/tq?tqx=responseHandler:' + cb + '&sheet=' + encodeURIComponent(tab) + '&headers=1';
    if (tq) url += '&tq=' + encodeURIComponent(tq);
    s.src = url;
    s.onerror = () => { cleanup(); reject(new Error('เชื่อมต่อ Google Sheet ไม่ได้')); };
    document.head.appendChild(s);
  });
}
function cellVal(c){ if (c == null || c.v == null) return ''; return String(c.v); }
function tableToObjects(res){
  const cols = res.table.cols.map(c => clean(c.label || c.id));
  return res.table.rows.map(r => { const o = {}; cols.forEach((k, i) => { o[k] = clean(cellVal(r.c[i])); }); return o; });
}

/* ════════ ดึงข้อมูล ════════
   ชีต DS_DC ใหญ่ (~130,000 แถว) และตัวซิงค์ ERP ล้างแท็บแล้วเขียนใหม่ทุก ~15 นาที
   1) รายชื่อร้าน (ชีต Customer ~1 วิ) ขึ้นก่อน ไม่ต้องรอบิล
   2) ถามช่วงวันที่ก่อน (min/max เร็ว ~10 วิ) แล้วแบ่งดึงทีละ 7 วันพร้อมกัน — วัด 21/11: คำสั่งเดียว > 280 วิ, แบ่ง 6 ช่วง = 123 วิ
   3) มีของในเครื่องแล้ว = ดึงต่อเฉพาะตั้งแต่ 7 วันก่อนวันล่าสุดที่มี · เก็บประวัติสะสม 180 วัน
   4) ได้ข้อมูลน้อยผิดปกติ (ERP กำลังเขียนชีต) = ใช้ของเดิม + บอกเวลาข้อมูล */
let DB = null;          // {ts, custs, skus, units, names, lines}
let PROD = null;        // {ts, map:{sku:{bc, units, type, img}}}
let SHOPS = [], SHOP_BY = new Map(), LINES_BY = new Map(), CAT = {}, PERIOD = {from:'', to:''};

let STALE = null;       // {at, why} = ใช้ข้อมูลเดิมในเครื่อง

async function fetchCustomers(){
  let rows;
  try {
    rows = tableToObjects(await gviz(CFG.custSheet, CFG.custTab, "select * where N contains '" + CFG.salesKey + "'", 60000));
    if (!rows.length || !('เซลล์ผู้ดูแล' in rows[0])) throw new Error('layout');
  } catch (e) {
    rows = tableToObjects(await gviz(CFG.custSheet, CFG.custTab, '', 90000)).filter(r => String(r['เซลล์ผู้ดูแล']||'').indexOf(CFG.salesKey) >= 0);
  }
  return rows.map(r => ({
    code: r['รหัส บีพลัส'], name: r['ชื่อร้านค้า'], addr: [r['ที่อยู่'], r['หมู่'] ? 'ม.' + r['หมู่'] : ''].filter(Boolean).join(' '),
    area: r['ต.,อ.,จ. ขอพร'], phone: r['เบอร์โทร'], loc: r['Location'], type: r['ประเภทร้านค้าขอพร'], route: r['ชื่อรูท'],
    routeArea: r['ชื่อรูท-ตำบล'], seq: r['ลำดับร้าน'], deliv: r['วันส่ง'], F: r['F'], avg3m: r['ยอดขายเฉลี่ย3เดือน'], photo: r['รูป'],
    contact: r['ชื่อผู้ติดต่อ'], roo: r['ROO'], creditDays: r['วันเครดิต'], credit: r['ยอดเงินเครดิต']
  })).filter(c => c.code || c.name);
}
async function salesRange(){
  const res = await gviz(CFG.salesSheet, CFG.salesTab, "select min(A), max(A) where F contains '" + CFG.salesKey + "'", 150000);
  const c = (res.table.rows[0] || {}).c || [];
  const pick = x => toISO(x && (x.f && /\d{4}/.test(x.f) ? x.f : cellVal(x)));
  return {type: res.table.cols[0].type, min: pick(c[0]), max: pick(c[1])};
}
const dateLit = (type, iso) => type === 'date' || type === 'datetime' ? "date '" + iso + "'" : "'" + iso.replace(/-/g, '/') + "'";
async function fetchSalesWindow(type, from, to){
  const q = "select A,B,C,D,F,I,J,K,L,M,N where F contains '" + CFG.salesKey + "' and A >= " + dateLit(type, from) + " and A < " + dateLit(type, to);
  let res, err;
  for (let attempt = 0; attempt < 2 && !res; attempt++) { try { res = await gviz(CFG.salesSheet, CFG.salesTab, q, CHUNK_TIMEOUT); } catch (e) { err = e; } }
  if (!res) throw err;
  const cols = res.table.cols.map(c => clean(c.label || c.id)), ix = k => cols.indexOf(k);
  const I = {d:ix('DI_DATE'), ref:ix('DI_REF'), code:ix('AR_CODE'), name:ix('AR_NAME'), sl:ix('SLMN_NAME'), sku:ix('SKU_NAME'), unit:ix('TRD_UTQNAME'), q:ix('TRD_QTY'), fr:ix('TRD_Q_FREE'), p:ix('TRD_U_PRC'), amt:ix('TRD_G_AMT')};
  if (I.d < 0 || I.code < 0 || I.sku < 0) throw new Error('โครงสร้างชีต DS_DC เปลี่ยน');
  return res.table.rows.map(r => {
    const g = i => i < 0 ? '' : clean(cellVal(r.c[i]));
    const d = toISO(r.c[I.d] && (r.c[I.d].f && /^\d{4}\//.test(r.c[I.d].f) ? r.c[I.d].f : cellVal(r.c[I.d])));
    return {d, ref:g(I.ref), code:g(I.code), name:g(I.name), sku:normSku(g(I.sku)), unit:g(I.unit), q:num(g(I.q)), fr:num(g(I.fr)), p:num(g(I.p)), amt:num(g(I.amt)), roo:/ROO/i.test(g(I.sl)) ? 1 : 0};
  }).filter(o => o.d && o.code);
}
/* from = ISO (ดึงตั้งแต่วันนั้น) · ว่าง = ทั้งหมดที่ชีตมี */
async function fetchSales(from){
  LOAD.msg = 'กำลังหาช่วงวันที่ของบิล'; updateLoadUI();
  const range = await salesRange();
  if (!range.max) return {rows:[], minD:'', maxD:'', failed:0, total:0};
  const start = from && from > range.min ? from : range.min;
  const wins = []; for (let a = start; a <= range.max; a = addDays(a, CHUNK_DAYS)) wins.push([a, addDays(a, CHUNK_DAYS)]);
  Object.assign(LOAD, {total: wins.length, done: 0, msg: 'กำลังดึงประวัติการซื้อ'}); updateLoadUI();
  const parts = await Promise.allSettled(wins.map(w => fetchSalesWindow(range.type, w[0], w[1]).then(r => { LOAD.done++; updateLoadUI(); return r; })));
  const failed = parts.filter(p => p.status === 'rejected');
  if (failed.length === parts.length) throw failed[0].reason;
  const rows = []; parts.forEach(p => { if (p.status === 'fulfilled') rows.push(...p.value); });
  return {rows, minD: range.min, maxD: range.max, start, failed: failed.length, total: parts.length};
}
function unpackLines(db){ return db && db.lines ? db.lines.map(l => ({d:l[0], ref:l[1], code:l[2], sku:db.skus[l[3]], unit:db.units[l[4]], q:l[5], fr:l[6], p:l[7], amt:l[8], roo:l[9], name:(db.names || {})[l[2]] || ''})) : []; }
function packLines(objs, oldNames){
  const skus = [], units = [], skuIx = {}, unitIx = {}, names = Object.assign({}, oldNames), lines = [];
  objs.forEach(o => {
    if (!(o.sku in skuIx)) { skuIx[o.sku] = skus.length; skus.push(o.sku); }
    if (!(o.unit in unitIx)) { unitIx[o.unit] = units.length; units.push(o.unit); }
    if (o.name) names[o.code] = o.name;
    lines.push([o.d, o.ref, o.code, skuIx[o.sku], unitIx[o.unit], o.q, o.fr, o.p, o.amt, o.roo]);
  });
  return {skus, units, names, lines};
}
/* รวมของใหม่เข้ากับของเดิม: ตั้งแต่ cut ใช้ของใหม่ · ก่อน cut ใช้ของเดิม (ชีตลบไปแล้วก็ยังอยู่)
   คืน null = ของใหม่ดูเป็นข้อมูลครึ่งเดียว (ERP กำลังเขียนชีต / บางสัปดาห์โหลดไม่ได้) → ให้ใช้ของเดิม */
function mergeSales(old, inc, cut){
  const oldRows = unpackLines(old);
  if (oldRows.length) {
    if (inc.failed) return null;
    const oldMax = oldRows.reduce((m, l) => l.d > m ? l.d : m, '');
    const oldWin = oldRows.filter(l => l.d >= cut && l.d <= oldMax).length;
    const newWin = inc.rows.filter(l => l.d >= cut && l.d <= oldMax).length;
    if ((!inc.rows.length && oldWin) || (oldWin >= 20 && newWin < oldWin * 0.7) || (inc.maxD && inc.maxD < oldMax)) return null;
  }
  const keepFrom = addDays(todayISO(), -SALES_KEEP_DAYS);
  return packLines(oldRows.filter(l => l.d < cut && l.d >= keepFrom).concat(inc.rows), old && old.names);
}
let loadingNow = false;
async function loadData(force, full){
  if (loadingNow) return; loadingNow = true;
  const cached = lsGet(LS_DATA);
  if (!PROD) { const p = lsGet(LS_PROD); if (p && p.map) PROD = p; }
  if (cached && cached.lines && !DB) { DB = cached; buildModel(); render(); }
  const fresh = cached && cached.lines && cached.lines.length && (Date.now() - cached.ts < DATA_TTL);
  if (fresh && !force) { loadingNow = false; loadProductsBg(false); return; }
  Object.assign(LOAD, {on:true, done:0, total:0, t0:Date.now(), msg:'กำลังเตรียมข้อมูล', error:null});
  setSync(true);
  const tick = setInterval(updateLoadUI, 1000);
  const pCust = fetchCustomers().then(custs => {
    if (!DB) { DB = {ts: 0, custs, skus: [], units: [], names: {}, lines: []}; LOAD.pending = true; }
    else { DB.custs = custs; if (!DB.lines.length) LOAD.pending = true; }
    buildModel(); render(true);
  });
  const old = cached && cached.lines && cached.lines.length ? cached : null;
  const oldMax = old ? old.lines.reduce((m, l) => l[0] > m ? l[0] : m, '') : '';
  const from = (old && !full && oldMax) ? addDays(oldMax, -SALES_OVERLAP_DAYS) : '';
  const pSales = fetchSales(from); pSales.catch(() => {});
  try {
    await pCust;
    const inc = await pSales;
    const merged = mergeSales(old, inc, from || inc.minD || '0000');
    if (merged) {
      DB = Object.assign({ts: inc.failed ? 0 : Date.now(), custs: DB.custs}, merged);
      STALE = inc.failed ? {at:'', why:'บางสัปดาห์โหลดไม่สำเร็จ (' + inc.failed + '/' + inc.total + ')'} : null;
      if (!lsSet(LS_DATA, DB)) console.warn('localStorage เต็ม — ไม่ได้เก็บแคช');
      if (force && !inc.failed) toast('อัปเดตข้อมูลเรียบร้อย · ' + Math.round((Date.now() - LOAD.t0) / 1000) + ' วินาที');
    } else {
      STALE = {at: timeTH(old.ts), why: inc.failed ? 'บางสัปดาห์โหลดไม่สำเร็จ' : 'ชีต DS_DC กำลังอัปเดตจาก ERP'};
      DB = Object.assign({}, old, {custs: DB.custs});
      if (force) toast('ชีต DS_DC กำลังอัปเดต ใช้ข้อมูล ณ ' + STALE.at + ' ไปก่อน', 'info');
    }
  } catch (e) {
    console.error(e);
    if (DB && DB.lines.length) { STALE = {at: timeTH((cached && cached.ts) || Date.now()), why: e.message}; if (force) toast('โหลดบิลใหม่ไม่สำเร็จ ใช้ข้อมูลเดิมไปก่อน', 'error'); }
    else if (DB) { STALE = {at:'', why: e.message}; toast('โหลดประวัติการซื้อไม่สำเร็จ: ' + e.message, 'error'); }
    else { LOAD.error = e.message; toast('โหลดข้อมูลไม่สำเร็จ: ' + e.message, 'error'); }
  } finally {
    clearInterval(tick); LOAD.on = false; LOAD.pending = false; setSync(false); loadingNow = false;
    if (DB) buildModel();
    render(true);
    loadProductsBg(force);
  }
}
async function fetchProducts(skuSet){
  const res = await gviz(CFG.prodSheet, CFG.prodTab, 'select A,B,J,K,L,M,BB,CV where A is not null', 90000);
  const map = {};
  res.table.rows.forEach(r => {
    const name = normSku(cellVal(r.c[0])); if (!name || !skuSet.has(name) || map[name]) return;
    const img = cellVal(r.c[7]); const m = /\/d\/([A-Za-z0-9_-]{10,})/.exec(img) || /[?&]id=([A-Za-z0-9_-]{10,})/.exec(img);
    map[name] = {bc: clean(r.c[1] && (r.c[1].f || cellVal(r.c[1]))), units: [2,3,4,5].map(i => clean(cellVal(r.c[i]))).filter(Boolean), type: clean(cellVal(r.c[6])), img: m ? m[1] : ''};
  });
  return {ts: Date.now(), map};
}
let prodLoading = false;
async function loadProductsBg(force){
  if (prodLoading || !DB || !DB.skus.length) return;
  const missing = PROD ? DB.skus.filter(s => !(s in PROD.map)).length : DB.skus.length;
  if (PROD && !force && Date.now() - PROD.ts < PROD_TTL && missing < 30) return;

}
function setSync(on){ document.querySelectorAll('.cc-sync').forEach(el => el.classList.toggle('show', on)); }
function updateLoadUI(){

/* ════════ หน่วยสินค้า ════════ */
const UNIT_MEMO = {};
function parseUnit(u){
  if (UNIT_MEMO[u]) return UNIT_MEMO[u];
  const m = /^(.*?)x(\d+(?:\.\d+)?)\(([A-Za-z]+)\)$/.exec(clean(u));
  const r = m ? {name: m[1].trim() || 'หน่วย', f: parseFloat(m[2]) || 1, t: m[3].toUpperCase()} : {name: clean(u) || 'หน่วย', f: 1, t: 'EA'};
  r.label = r.f > 1 ? r.name + ' x' + fmtQ(r.f) : r.name;
  return (UNIT_MEMO[u] = r);
}
function addCat(sku, unit){
  const u = parseUnit(unit); const c = CAT[sku] || (CAT[sku] = {pack:null, big:null, hasEA:false, one:''});
  if (u.t === 'PA' || u.t === 'BPA' || u.t === 'BP') { if (!c.pack || u.f > c.pack.f) c.pack = {f:u.f, name:u.name}; }
  else if (u.t === 'CS' && u.f > 1) { if (!c.big || u.f > c.big.f) c.big = {f:u.f, name:u.name}; }
  else if (u.t === 'EA') c.hasEA = true;
  else if (u.f === 1 && !c.one) c.one = u.name;      // เช่น กส.x1(CS) → หน่วยเล็กสุดชื่อ "กส."
}
function baseOf(sku){ const c = CAT[sku]; return c && !c.hasEA && c.one ? c.one : 'ชิ้น'; }
function buildCatalog(){
  CAT = {};
  if (DB) DB.lines.forEach(l => addCat(DB.skus[l[3]], DB.units[l[4]]));
  if (PROD) Object.keys(PROD.map).forEach(k => PROD.map[k].units.forEach(u => addCat(k, u)));
}
function catOf(sku){ const c = CAT[sku] || {pack:null, big:null}; let pack = c.pack, big = c.big; if (pack && big && pack.f >= big.f) pack = null; return {pack, big}; }
function unitOpts(k){
  const c = catOf(k.sku), o = [];
  if (c.big) o.push({key:'big', f:c.big.f, name:c.big.name});
  if (c.pack) o.push({key:'pack', f:c.pack.f, name:c.pack.name});
  o.push({key:'ea', f:1, name:baseOf(k.sku)});
  if (!o.some(x => x.f === k.mu.f)) o.unshift({key:'main', f:k.mu.f, name:k.mu.name});
  return o;
}
function prodOf(sku){ return (PROD && PROD.map[sku]) || null; }
const imgUrl = (id, sz) => 'https://lh3.googleusercontent.com/d/' + encodeURIComponent(id) + '=w' + sz;
function imgHTML(sku, size, phSize){
  const p = prodOf(sku);
  if (p && p.img) return '<img loading="lazy" alt="" src="' + imgUrl(p.img, size || 300) + '" data-id="' + esc(p.img) + '" data-sz="' + (size || 300) + '" data-ph="' + (phSize || 40) + '" onerror="imgErr(this)">';
  return '<span class="cc-ph">' + ic('box', phSize || 40) + '</span>';
}
/* Google จำกัดการโหลดรูปพร้อมกันจำนวนมาก → สลับไป Drive thumbnail แล้วหน่วงเวลาลองใหม่ สูงสุด 3 ครั้ง */
function imgErr(el){
  const n = +(el.dataset.alt || 0) + 1; el.dataset.alt = n;
  const drive = 'https://drive.google.com/thumbnail?id=' + encodeURIComponent(el.dataset.id) + '&sz=w' + el.dataset.sz;
  if (n === 1) { el.src = drive; return; }
  if (n <= 3) { setTimeout(() => { if (el.isConnected) el.src = (n === 2 ? imgUrl(el.dataset.id, el.dataset.sz) : drive + '&r=' + n); }, 800 * n + Math.random() * 1200); return; }
  const sp = document.createElement('span'); sp.className = 'cc-ph'; sp.innerHTML = ic('box', +el.dataset.ph || 40); el.replaceWith(sp);
}

/* ════════ Model ════════ */
function buildModel(){
  buildCatalog(); MODEL_MEMO.clear();
  LINES_BY = new Map(); let from = '', to = '';
  DB.lines.forEach(l => {
    const o = {d:l[0], ref:l[1], code:l[2], sku:DB.skus[l[3]], unit:DB.units[l[4]], q:l[5], free:l[6], p:l[7], amt:l[8], roo:l[9]};
    if (!LINES_BY.has(o.code)) LINES_BY.set(o.code, []);
    LINES_BY.get(o.code).push(o);
    if (!from || o.d < from) from = o.d; if (!to || o.d > to) to = o.d;
  });
  PERIOD = {from, to};
  const monthKey = todayISO().slice(0, 7);
  SHOPS = []; SHOP_BY = new Map();
  const seen = new Set();
  (DB.custs || []).forEach(c => { if (!c.code || seen.has(c.code)) return; seen.add(c.code); SHOPS.push(Object.assign({}, c)); });
  LINES_BY.forEach((ls, code) => { if (!seen.has(code)) { seen.add(code); SHOPS.push({code, name: (DB.names || {})[code] || code, extra:true, route:'', routeArea:''}); } });
  SHOPS.forEach(s => {
    const ls = LINES_BY.get(s.code) || [];
    const dates = new Set(), skus = new Set(); let tot = 0, month = 0;
    ls.forEach(l => { dates.add(l.d); skus.add(l.sku); tot += l.amt; if (l.d.slice(0, 7) === monthKey) month += l.amt; });
    s.rounds = dates.size; s.total = tot; s.month = month; s.skuCount = skus.size; s.avg = dates.size ? tot / dates.size : 0;
    s.last = ls.reduce((m, l) => l.d > m ? l.d : m, '');
    SHOP_BY.set(s.code, s);
  });
}
const noSales = () => !DB || !DB.lines.length;
function shopStatus(s){
  if (noSales()) return {cls:'rt-badge-neutral', icon:'clock', label:'รอข้อมูลบิล'};
  if (!s.last) return {cls:'rt-badge-danger', icon:'info', label:'ยังไม่ซื้อ'};
  const a = daysAgo(s.last);
  return a <= ACTIVE_DAYS ? {cls:'rt-badge-success', icon:'checkc', label:'Active'} : {cls:'rt-badge-warning', icon:'warn', label:'ห่างหาย ' + a + ' วัน'};

const STATUS = {

  stop: {label:'หยุดซื้อ', cls:'rt-badge-warning', icon:'pause'},
  nw:   {label:'ซื้อใหม่', cls:'rt-badge-gold', icon:'star'}

const MODEL_MEMO = new Map();
function shopModel(code){
  if (MODEL_MEMO.has(code)) return MODEL_MEMO.get(code);
  const ls = LINES_BY.get(code) || [];
  const dates = [...new Set(ls.map(l => l.d))].sort().reverse();       // ล่าสุดก่อน
  const rounds = dates.map((d, i) => ({d, no: dates.length - i, refs: new Set(), items: new Map(), total: 0}));
  const rByD = new Map(rounds.map(r => [r.d, r]));
  const skuMap = new Map();
  ls.forEach(l => {
    const u = parseUnit(l.unit), r = rByD.get(l.d);
    r.refs.add(l.ref); r.total += l.amt;
    let it = r.items.get(l.sku);
    if (!it) { it = {sku:l.sku, pieces:0, free:0, amt:0, paidPieces:0, ord:{}, lines:[]}; r.items.set(l.sku, it); }
    it.pieces += l.q * u.f; it.free += l.free * u.f; it.amt += l.amt; it.lines.push(l);
    if (l.q > 0) { it.ord[l.unit] = (it.ord[l.unit] || 0) + l.q; if (l.amt > 0) it.paidPieces += l.q * u.f; }
    let s = skuMap.get(l.sku);
    if (!s) { s = {sku:l.sku, byD:new Map(), pieces:0, free:0, amt:0, unitCnt:{}, lines:[]}; skuMap.set(l.sku, s); }
    s.pieces += l.q * u.f; s.free += l.free * u.f; s.amt += l.amt; s.lines.push(l);
    if (l.q > 0) s.unitCnt[l.unit] = (s.unitCnt[l.unit] || 0) + 1;
  });
  rounds.forEach(r => r.items.forEach(it => { it.ppp = it.paidPieces ? it.amt / it.paidPieces : 0; skuMap.get(it.sku).byD.set(r.d, it); }));
  const latest = dates[0];
  skuMap.forEach(s => {
    const bought = dates.filter(d => s.byD.has(d) && s.byD.get(d).pieces > 0);
    s.bought = bought; s.roundsBought = bought.length;
    s.last = bought[0] || ''; s.lastAny = dates.find(d => s.byD.has(d)) || '';
    const priced = dates.filter(d => s.byD.has(d) && s.byD.get(d).ppp > 0);
    s.lastPpp = priced.length ? s.byD.get(priced[0]).ppp : 0;
    s.prevPpp = priced.length > 1 ? s.byD.get(priced[1]).ppp : 0;
    s.priceChg = (s.lastPpp && s.prevPpp && Math.abs(s.lastPpp - s.prevPpp) > 0.004) ? s.lastPpp - s.prevPpp : 0;
    const mu = Object.entries(s.unitCnt).sort((a, b) => b[1] - a[1] || parseUnit(b[0]).f - parseUnit(a[0]).f)[0];
    s.mainUnit = mu ? mu[0] : s.lines[0].unit;
    s.mu = parseUnit(s.mainUnit);
    s.avgBought = s.roundsBought ? s.pieces / s.roundsBought : 0;
    s.freq = dates.length ? s.roundsBought / dates.length : 0;
    s.gap = s.last ? dates.indexOf(s.last) : dates.length;          // ไม่ได้ซื้อมากี่รอบ
    s.missLatest = s.roundsBought >= 2 && s.gap >= 1;
    s.suggest = s.roundsBought ? Math.max(1, Math.round(s.avgBought / s.mu.f)) : 0;
    const asc = [...bought].reverse(); let gs = 0;
    for (let i = 1; i < asc.length; i++) gs += (isoToDate(asc[i]) - isoToDate(asc[i-1])) / 86400000;
    s.everyDays = asc.length > 1 ? gs / (asc.length - 1) : 0;
    const dAgo = s.last ? daysAgo(s.last) : 999;
    if (!s.roundsBought) s.status = 'stop';
    else if (s.roundsBought === 1 && s.gap === 0 && dates.length > 1) s.status = 'nw';
    else if (s.gap >= 3 || (s.gap >= 2 && dAgo > 21)) s.status = 'stop';
    else if (s.freq >= .5 && s.gap <= 1) s.status = 'reg';
    else s.status = 'irr';
    const lastIt = s.last ? s.byD.get(s.last) : null;
    s.lastPieces = lastIt ? lastIt.pieces : 0;
  });
  const M = {code, dates, rounds, skus:[...skuMap.values()], latest};
  MODEL_MEMO.set(code, M);
  return M;
}

function niceStep(v){ if (v <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))); for (const m of [1, 2, 2.5, 5, 10]) if (m * p >= v) return m * p; return 10 * p; }

  M.rounds.forEach(r => r.items.forEach(it => it.lines.forEach(l => {
    const u = parseUnit(l.unit), cc = catOf(l.sku), pcs = l.q * u.f, ppp = l.q && l.amt ? l.p / u.f : 0;
    rows.push({'รอบ': r.no, 'วันที่': formatThaiDate(r.d), 'เลขที่เอกสาร': l.ref, 'สินค้า': l.sku, 'บาร์โค้ด': (prodOf(l.sku) || {}).bc || '', 'หน่วยที่สั่ง': u.label, 'จำนวน': l.q, 'แถม': l.free,
      'ชิ้น': r2(pcs), 'แพ็ค': cc.pack ? r2(pcs / cc.pack.f) : '', 'ลัง': cc.big ? r2(pcs / cc.big.f) : '',
      'ราคา/หน่วยที่สั่ง': l.p, 'ราคา/ชิ้น': ppp ? r2(ppp) : '', 'ราคา/แพ็ค': ppp && cc.pack ? r2(ppp * cc.pack.f) : '', 'ราคา/ลัง': ppp && cc.big ? r2(ppp * cc.big.f) : '', 'จำนวนเงิน': l.amt});
  })));
  const ws = XLSX.utils.json_to_sheet(rows), wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'ประวัติการซื้อ');
  XLSX.writeFile(wb, 'Rattana Call Card - ' + code + ' ' + todayISO() + '.xlsx');
}

/* ════════ สรุปภาพรวม ════════ */
function pageSummary(){
  topbar({title:'สรุปภาพรวม', sub:CFG.salesFull, back:'#/'});
  if (noSales()) { $('view').innerHTML = pageHead('สรุปภาพรวม') + statusHTML(); return; }
  const monthKey = todayISO().slice(0, 7), mName = MONTHS[+monthKey.slice(5, 7) - 1];
  const buyers = SHOPS.filter(s => s.month > 0).length, monthTot = SHOPS.reduce((a, s) => a + s.month, 0);
  const idle = SHOPS.filter(s => s.last && daysAgo(s.last) > ACTIVE_DAYS).length;
  const skuAgg = new Map(), routeAgg = new Map();
  DB.lines.forEach(l => { const sku = DB.skus[l[3]]; let a = skuAgg.get(sku); if (!a) { a = {sku, amt:0, shops:new Set()}; skuAgg.set(sku, a); } a.amt += l[8]; a.shops.add(l[2]); });
  SHOPS.forEach(s => { const r = s.route || 'อื่นๆ'; let a = routeAgg.get(r); if (!a) { a = {r, n:0, buy:0, month:0}; routeAgg.set(r, a); } a.n++; if (s.month > 0) a.buy++; a.month += s.month; });
  const topSku = [...skuAgg.values()].sort((a, b) => b.amt - a.amt).slice(0, 10);
  const topShop = [...SHOPS].sort((a, b) => b.total - a.total).slice(0, 10);
  const routes = [...routeAgg.values()].sort((a, b) => { const ia = DAY_ORDER.indexOf(a.r), ib = DAY_ORDER.indexOf(b.r); return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib); });
  const maxR = Math.max.apply(null, routes.map(r => r.month).concat([1]));
  const kpi = (tile, icon, label, val, trend) => '<div class="rt-glass rt-lift rt-kpi"><div class="rt-kpi-head"><span class="rt-tile ' + tile + '">' + ic(icon) + '</span>' + label + '</div><span class="rt-kpi-value">' + val + '</span>' + (trend ? '<span class="rt-kpi-trend">' + trend + '</span>' : '') + '</div>';
  $('view').innerHTML = pageHead('สรุปภาพรวม', esc(CFG.salesFull) + ' · ' + SHOPS.length + ' ร้านในความดูแล') + statusHTML() +
    '<div class="rt-grid-kpi">' +
      kpi('rt-tile-gold', 'cart', 'ยอดซื้อเดือน' + mName, fmtBi(monthTot), '<small>รวมทุกร้าน</small>') +
      kpi('rt-tile-green', 'checkc', 'ร้านที่ซื้อเดือนนี้', buyers + ' / ' + SHOPS.length, '<small>ร้าน</small>') +
      kpi('rt-tile-amber', 'warn', 'ห่างหายเกิน ' + ACTIVE_DAYS + ' วัน', idle + ' ร้าน', '<span style="color:var(--warning-text)">ควรติดตาม</span>') +
      kpi('rt-tile-navy', 'box', 'สินค้าที่ขายได้', skuAgg.size + ' SKU', '<small>ช่วงข้อมูลทั้งหมด</small>') +
    '</div>' +
    '<section class="rt-card rt-table-card"><header><div><div class="rt-caption">เดือน' + mName + '</div><h2 class="rt-h4">ยอดซื้อตามรูท</h2></div></header><div>' + routes.map(r =>
      '<a class="cc-rank" href="#/" onclick="UI.route=\'' + esc(r.r) + '\';saveUI()"><div class="cc-row-body"><span class="rt-cell-main">' + esc(routeLabel(r.r)) + '</span><span class="rt-cell-sub">ซื้อแล้ว ' + r.buy + '/' + r.n + ' ร้าน</span><div class="rt-progress"><span style="width:' + (r.month / maxR * 100).toFixed(1) + '%"></span></div></div><span class="rt-cell-main rt-num">' + fmtBi(r.month) + '</span></a>').join('') + '</div></section>' +
    '<section class="rt-card rt-table-card"><header><div><div class="rt-caption">ทั้งช่วงข้อมูล</div><h2 class="rt-h4">สินค้าขายดี 10 อันดับ</h2></div></header><div>' + topSku.map((a, i) =>
      '<div class="cc-rank"><span class="no">' + (i + 1) + '</span><span class="cc-thumb">' + imgHTML(a.sku, 100, 22) + '</span><div class="cc-row-body"><span class="rt-cell-main">' + esc(a.sku) + '</span><span class="rt-cell-sub">' + a.shops.size + ' ร้านซื้อ</span></div><span class="rt-cell-main rt-num">' + fmtBi(a.amt) + '</span></div>').join('') + '</div></section>' +
    '<section class="rt-card rt-table-card"><header><div><div class="rt-caption">ทั้งช่วงข้อมูล</div><h2 class="rt-h4">ร้านยอดซื้อสูงสุด 10 อันดับ</h2></div></header><div>' + topShop.map((s, i) =>
      '<a class="cc-rank" href="#/shop/' + encA(s.code) + '"><span class="no">' + (i + 1) + '</span><div class="cc-row-body"><span class="rt-cell-main">' + esc(s.name) + '</span><span class="rt-cell-sub">' + s.rounds + ' รอบ · เฉลี่ย ' + fmtBi(s.avg) + '/รอบ' + (s.route ? ' · รูท' + esc(s.route) : '') + '</span></div><span class="rt-cell-main rt-num">' + fmtBi(s.total) + '</span></a>').join('') + '</div></section>';
}

/* ════════ แจ้งเตือน ════════ */
function alertsData(){
  return {idle: SHOPS.filter(s => s.last && daysAgo(s.last) > ACTIVE_DAYS).sort((a, b) => a.last.localeCompare(b.last)), never: SHOPS.filter(s => !s.last)};
}
function pageAlerts(){
  topbar({title:'แจ้งเตือน', sub:CFG.salesFull, back:'#/'});
  if (noSales()) { $('view').innerHTML = pageHead('แจ้งเตือน') + statusHTML(); return; }
  const {idle, never} = alertsData(), td = DAYS[new Date().getDay()];
  const today = SHOPS.filter(s => s.route === td).map(s => { const M = shopModel(s.code); return {s, miss: M.skus.filter(k => k.missLatest && k.status !== 'stop').length, stop: M.skus.filter(k => k.status === 'stop').length}; }).sort((a, b) => b.miss - a.miss);
  const row = (s, right, sub) => '<a class="cc-rank" href="#/shop/' + encA(s.code) + '"><div class="cc-row-body"><span class="rt-cell-main">' + esc(s.name) + '</span><span class="rt-cell-sub">' + sub + '</span></div>' + right + '<span class="cc-chev">' + ic('right') + '</span></a>';
  let h = pageHead('แจ้งเตือน', 'ร้านที่ควรติดตามและสินค้าที่ควรเสนอวันนี้') + statusHTML();
  if (today.length) h += '<section class="rt-card rt-table-card"><header><div><div class="rt-caption">รูทวันนี้ (' + td + ')</div><h2 class="rt-h4">สินค้าที่ควรเสนอ</h2></div></header><div>' +
    today.map(x => row(x.s, badge(x.miss ? 'rt-badge-warning' : 'rt-badge-success', x.miss ? 'warn' : 'checkc', 'ควรเสนอ ' + x.miss), 'รหัส ' + esc(x.s.code) + (x.s.last ? ' · ซื้อล่าสุด ' + formatThaiDate(x.s.last) : ' · ยังไม่ซื้อ') + (x.stop ? ' · หยุดซื้อ ' + x.stop + ' SKU' : ''))).join('') + '</div></section>';
  h += '<section class="rt-card rt-table-card"><header><div><div class="rt-caption">ไม่ซื้อเกิน ' + ACTIVE_DAYS + ' วัน · ' + idle.length + ' ร้าน</div><h2 class="rt-h4">ร้านห่างหาย</h2></div></header>' +
    (idle.length ? '<div>' + idle.map(s => row(s, badge('rt-badge-warning', 'clock', daysAgo(s.last) + ' วัน'), 'ซื้อล่าสุด ' + formatThaiDate(s.last) + (s.route ? ' · รูท' + esc(s.route) : ''))).join('') + '</div>' : '<div class="rt-empty">' + ic('checkc', 32) + '<p>ไม่มีร้านห่างหาย</p></div>') + '</section>';
  if (never.length) h += '<section class="rt-card rt-table-card"><header><div><div class="rt-caption">' + never.length + ' ร้าน</div><h2 class="rt-h4">ยังไม่มีการซื้อในช่วงข้อมูล</h2></div></header><div>' +
    never.map(s => row(s, badge('rt-badge-danger', 'info', 'ยังไม่ซื้อ'), 'รหัส ' + esc(s.code) + (s.route ? ' · รูท' + esc(s.route) : ''))).join('') + '</div></section>';
  $('view').innerHTML = h;
}

/* ════════ ตั้งค่า ════════ */
function pageSettings(){
  topbar({title:'ตั้งค่า', sub:CFG.salesFull, back:'#/'});
  const dark = window.RattanaUI ? RattanaUI.getTheme() === 'dark' : false;
  const nProd = PROD ? Object.keys(PROD.map).length : 0, nImg = PROD ? Object.values(PROD.map).filter(p => p.img).length : 0;
  const t = DB && DB.ts ? DB.ts : 0;
  const row = (tile, icon, title, sub, end) => '<div class="cc-set"><span class="rt-tile rt-tile-sm ' + tile + '">' + ic(icon) + '</span><div class="cc-row-body"><span class="rt-cell-main">' + title + '</span><span class="rt-cell-sub">' + sub + '</span></div>' + (end || '') + '</div>';
  $('view').innerHTML = pageHead('ตั้งค่า') + '<section class="rt-card rt-table-card" style="padding:8px 0">' +
    row('rt-tile-navy', 'user', esc(CFG.salesFull), 'เซลล์ผู้ดูแล · ' + SHOPS.length + ' ร้าน') +
    row('rt-tile-navy', 'moon', 'โหมดมืด', 'ถนอมสายตาตอนกลางคืน', '<label class="rt-switch"><input type="checkbox"' + (dark ? ' checked' : '') + ' onchange="RattanaUI.setTheme(this.checked?\'dark\':\'light\')"><span class="rt-switch-track"></span></label>') +
    row('rt-tile-blue', 'sync', 'อัปเดตข้อมูล', 'ดึงเฉพาะบิลใหม่ต่อจากที่มี (เร็ว) · ล่าสุด ' + (t ? formatThaiDate(dateToISO(new Date(t))) + ' ' + timeTH(t) : '-'), '<button class="rt-btn rt-btn-gold rt-btn-sm" type="button" onclick="loadData(true)">อัปเดต</button>') +
    row('rt-tile-blue', 'download', 'ดึงประวัติใหม่ทั้งหมด', 'ทุกสัปดาห์ที่ชีต DS_DC เก็บไว้ (1–3 นาที)', '<button class="rt-btn rt-btn-glass rt-btn-sm" type="button" onclick="loadData(true,true)">ดึงทั้งหมด</button>') +
    row('rt-tile-gold', 'file', 'ประวัติการขายในเครื่อง', formatThaiDate(PERIOD.from) + ' – ' + formatThaiDate(PERIOD.to) + ' · ' + (DB ? DB.lines.length.toLocaleString('th-TH') : 0) + ' บรรทัด · เก็บสะสมสูงสุด ' + SALES_KEEP_DAYS + ' วัน') +
    row('rt-tile-gold', 'box', 'ข้อมูลสินค้า (PDDT)', nProd + ' สินค้า · มีรูป ' + nImg + ' รายการ' + (prodLoading ? ' · กำลังโหลด...' : '')) +
    row('rt-tile-red', 'trash', 'ล้างข้อมูลที่เก็บในเครื่อง', 'แอปจะดึงข้อมูลใหม่ทั้งหมด', '<button class="rt-btn rt-btn-glass rt-btn-sm" type="button" onclick="clearCache()">ล้าง</button>') +
    row('rt-tile-navy', 'info', 'Rattana Call Card', APP_VER + ' · Rattana CI · 1 รอบ = 1 วันที่ออกบิล · Active = ซื้อภายใน ' + ACTIVE_DAYS + ' วัน') +
    '</section>';
}
function clearCache(){
  const run = () => { [LS_DATA, LS_PROD].forEach(k => { try { localStorage.removeItem(k); } catch(e) {} }); DB = null; PROD = null; STALE = null; render(); loadData(true, true); };
  if (window.RattanaUI) RattanaUI.confirm({title:'ล้างข้อมูลในเครื่อง?', message:'แอปจะดึงข้อมูลใหม่ทั้งหมดจากชีต ใช้เวลา 1–3 นาที', confirmText:'ล้างและดึงใหม่'}).then(ok => { if (ok) run(); });
  else if (confirm('ล้างข้อมูลในเครื่องและดึงใหม่ทั้งหมด?')) run();
}

/* ════════ Boot ════════ */
function boot(){
  render();
  loadData(false);
  setInterval(() => { if (!document.hidden) loadData(false); }, 5 * 60 * 1000);   // เช็คทุก 5 นาที (อัปเดตเมื่อแคชเกิน 30 นาที)
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
</script>
