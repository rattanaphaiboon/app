<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1565e0">
<title>Rattana Call Card v2.0</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,500,1,0&icon_names=account_circle,arrow_back_ios_new,bar_chart,calendar_month,call,check_circle,chevron_right,content_copy,dark_mode,delete,deployed_code,description,download,expand_more,grid_view,history,home,info,insights,local_offer,map,new_releases,notifications,pause_circle,person,refresh,route,schedule,search,settings,shopping_cart,storefront,sync,trending_down,trending_up,view_list,warning&display=block" rel="stylesheet">
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js" defer></script>
<style>
:root{
  --blue:#1565e0;--blue-d:#0b4fc4;--blue-2:#2f7cf6;--blue-l:#e9f1fe;--blue-ll:#f2f7ff;
  --green:#1d9d5c;--green-l:#e8f7ee;--purple:#7a4fd8;--purple-l:#f2edfd;--orange:#f57c1f;--orange-l:#fff1e5;--red:#e5484d;--red-l:#fdecec;
  --bg:#f3f6fb;--card:#ffffff;--text:#13233f;--muted:#6b7896;--border:#e1e7f1;--search:#eef2f8;--row:#f7f9fc;
  --r-sm:10px;--r-md:14px;--r-lg:18px;--r-xl:24px;
  --sh-sm:0 1px 4px rgba(19,35,63,.06);--sh-md:0 4px 14px rgba(19,35,63,.08);--sh-blue:0 8px 20px rgba(21,101,224,.30);
  --nav-h:64px;
}
body.dark{--bg:#0b1220;--card:#121c30;--text:#e7ecf5;--muted:#8d9bb8;--border:#23314d;--search:#1a2640;--row:#101a2c;--blue-l:#17294a;--blue-ll:#132240;--green-l:#143524;--purple-l:#261d45;--orange-l:#3a2614;--red-l:#3b1a1c}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Sarabun',sans-serif;font-size:14px;line-height:1.5;background:var(--bg);color:var(--text);min-height:100dvh;overflow-x:hidden;transition:background .25s,color .25s}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
input,select{font-family:inherit;font-size:16px;color:inherit}
a{color:inherit;text-decoration:none}
.ms{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;font-size:22px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;-webkit-font-smoothing:antialiased;font-variation-settings:'FILL' 1,'wght' 500;vertical-align:middle;user-select:none}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

/* ── App shell ── */
#view{max-width:1100px;margin:0 auto;padding-bottom:calc(var(--nav-h) + 24px + env(safe-area-inset-bottom))}
#view.has-cta{padding-bottom:calc(var(--nav-h) + 96px + env(safe-area-inset-bottom))}

/* ── Hero header (home) ── */
.hero{background:linear-gradient(135deg,var(--blue-2) 0%,var(--blue) 45%,var(--blue-d) 100%);color:#fff;padding:max(18px,env(safe-area-inset-top)) 20px 46px;position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.07)}
.hero .row{display:flex;align-items:center;gap:14px;position:relative;z-index:1}
.hero .logo{font-size:64px;flex-shrink:0}
.hero h1{font-size:27px;line-height:1.08;font-weight:800;letter-spacing:.2px}
.hero p{font-size:13px;opacity:.92;margin-top:6px}
.hero .ver{display:inline-block;font-size:10.5px;font-weight:700;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);border-radius:10px;padding:0 8px;margin-top:6px;letter-spacing:.2px}
.hero .me{margin-left:auto;align-self:flex-start;color:#fff;width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:50%}
.hero .me .ms{font-size:40px}
.sheet{background:var(--bg);border-radius:var(--r-xl) var(--r-xl) 0 0;margin-top:-28px;position:relative;z-index:2;padding:16px 16px 0}
@media(min-width:700px){.hero{padding-left:32px;padding-right:32px}.hero h1{font-size:32px}.sheet{padding:18px 24px 0}}

/* ── Compact top bar (inner pages) ── */
.bar{position:sticky;top:0;z-index:50;background:var(--blue);color:#fff;display:flex;align-items:center;gap:4px;min-height:58px;padding:max(6px,env(safe-area-inset-top)) 6px 6px;box-shadow:0 2px 10px rgba(11,79,196,.25)}
.bar h2{flex:1;text-align:center;font-size:18px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
.bar .ib{width:46px;height:46px;display:flex;align-items:center;justify-content:center;border-radius:50%;flex-shrink:0}
.bar .ib:hover{background:rgba(255,255,255,.12)}
.bar .ib .ms{font-size:26px}
.page{padding:16px}
@media(min-width:700px){.page{padding:20px 24px}}
.sync{display:none;font-size:11px;background:rgba(255,255,255,.2);border-radius:10px;padding:1px 8px;margin-top:8px;position:relative;z-index:1}
.sync.show{display:inline-flex;align-items:center;gap:4px}
.sync .ms{font-size:14px;animation:spin 1.2s linear infinite}

/* ── Search + filters ── */
.search{display:flex;align-items:center;gap:10px;background:var(--search);border-radius:26px;padding:0 18px;height:52px;border:1.5px solid transparent;transition:border-color .15s}
.search:focus-within{border-color:var(--blue-2);background:var(--card)}
.search .ms{color:var(--muted);font-size:26px}
.search input{flex:1;border:none;background:transparent;outline:none;min-width:0}
.filters{display:flex;gap:8px;margin:12px 0 14px}
.filters>*{min-width:0}
.filters .pill{padding:0 10px 0 14px}
.filters .pill span:first-child{overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 14px 0 18px;border-radius:22px;background:var(--search);font-weight:600;font-size:14px;white-space:nowrap;max-width:100%}
.pill .ms{font-size:22px;color:var(--muted)}
.pill select{appearance:none;-webkit-appearance:none;border:none;background:transparent;font-weight:600;font-size:14px;outline:none;cursor:pointer;padding-right:2px}
.dd{position:relative}
.dd-panel{display:none;position:absolute;top:calc(100% + 6px);left:0;min-width:240px;background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);box-shadow:var(--sh-md);z-index:70;overflow:hidden}
.dd-panel.open{display:block}
.dd-panel input{width:100%;border:none;border-bottom:1px solid var(--border);padding:12px 14px;background:transparent;outline:none}
.dd-panel ul{list-style:none;max-height:280px;overflow-y:auto;padding:4px 0}
.dd-panel li{padding:10px 14px;cursor:pointer;display:flex;justify-content:space-between;gap:10px}
.dd-panel li:hover,.dd-panel li.on{background:var(--blue-l);color:var(--blue)}
.dd-panel li small{color:var(--muted)}
.count-line{font-size:12.5px;color:var(--muted);margin:-4px 2px 10px;display:flex;justify-content:space-between;gap:8px}

/* ── Shop card ── */
.shop-list{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:760px){.shop-list{grid-template-columns:repeat(2,1fr)}}
.shop-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--sh-md);padding:12px;display:block;width:100%;text-align:left}
button.shop-card:hover{border-color:var(--blue-2)}
.shop-top{display:flex;gap:12px;align-items:center}
.shop-photo{width:104px;height:80px;border-radius:12px;object-fit:cover;flex-shrink:0;background:var(--blue-l);display:flex;align-items:center;justify-content:center;color:var(--blue)}
.shop-photo .ms{font-size:40px}
.shop-top .info{flex:1;min-width:0}
.shop-top .nm{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.shop-top .nm b{font-size:18px;font-weight:800;line-height:1.25}
.shop-top .sub{font-size:13px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shop-top .chev{color:var(--muted);font-size:28px;flex-shrink:0}
.st{display:inline-block;font-size:12.5px;font-weight:700;padding:1px 10px;border-radius:10px;white-space:nowrap}
.st.ok{background:var(--green-l);color:var(--green)}.st.warn{background:var(--orange-l);color:var(--orange)}.st.off{background:var(--red-l);color:var(--red)}.st.info{background:var(--blue-l);color:var(--blue)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.tile{border-radius:var(--r-sm);padding:10px 6px 8px;text-align:center;min-width:0}
.tile .ms{font-size:26px}
.tile b{display:block;font-size:20px;font-weight:800;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile small{display:block;font-size:12px;color:var(--muted);line-height:1.3}
.tile.g{background:var(--green-l)}.tile.g .ms{color:var(--green)}
.tile.b{background:var(--blue-l)}.tile.b .ms{color:var(--blue)}
.tile.p{background:var(--purple-l)}.tile.p .ms{color:var(--purple)}
@media(max-width:380px){.tile b{font-size:17px}.shop-photo{width:84px;height:68px}}
.shop-more{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;padding-top:12px;border-top:1px dashed var(--border)}
.act{display:inline-flex;align-items:center;gap:5px;height:38px;padding:0 14px;border-radius:19px;background:var(--blue-l);color:var(--blue);font-weight:700;font-size:13px}
.act .ms{font-size:19px}
.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:4px 14px;margin-top:10px;font-size:13px}
@media(min-width:700px){.facts{grid-template-columns:repeat(4,1fr)}}
.facts span{color:var(--muted);font-size:11.5px;display:block}
.facts b{font-weight:700}
.addr{font-size:13px;color:var(--muted);margin-top:8px;display:flex;gap:4px}
.addr .ms{font-size:18px}

/* ── Section head ── */
.sec{display:flex;align-items:center;gap:8px;margin:20px 2px 12px}
.sec .ms{color:var(--blue);font-size:28px}
.sec h3{flex:1;font-size:17px;font-weight:800;line-height:1.3}
.sec h3 small{font-weight:600;font-size:14px;color:var(--muted)}
.viewtog{display:flex;gap:2px}
.viewtog button{width:40px;height:40px;border-radius:10px;color:var(--border);display:flex;align-items:center;justify-content:center}
.viewtog button .ms{font-size:28px}
.viewtog button.on{color:var(--blue)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 0 12px;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;height:36px;padding:0 14px;border-radius:18px;background:var(--card);border:1.5px solid var(--border);font-weight:700;font-size:13px;color:var(--muted)}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.chip i{font-style:normal;font-weight:500;opacity:.75;margin-left:4px}

/* ── Product cards ── */
.pgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:700px){.pgrid{grid-template-columns:repeat(3,1fr);gap:12px}}
@media(min-width:1000px){.pgrid{grid-template-columns:repeat(4,1fr)}}
.pcard{position:relative;background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);padding:10px;box-shadow:var(--sh-sm);cursor:pointer;display:flex;flex-direction:column;gap:3px;text-align:left;width:100%;min-width:0;transition:box-shadow .15s,border-color .15s}
.pcard:hover{border-color:var(--blue-2);box-shadow:var(--sh-md)}
.pimg{height:120px;display:flex;align-items:center;justify-content:center;border-radius:10px;background:linear-gradient(180deg,var(--blue-ll),transparent);margin-bottom:4px;overflow:hidden}
.pimg img{max-width:100%;max-height:100%;object-fit:contain}
.pimg .ms{font-size:52px;color:#b8cdf3}
body.dark .pimg .ms{color:#35507f}
.pbadge{position:absolute;top:8px;right:8px;font-size:12.5px;font-weight:800;color:#fff;padding:3px 11px;border-radius:12px;box-shadow:0 2px 6px rgba(0,0,0,.12);z-index:1}
.b-reg{background:var(--blue)}.b-irr{background:#3d8cf5}.b-stop{background:var(--orange)}.b-new{background:var(--green)}
.pname{font-weight:700;font-size:14.5px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:38px}
.plast{font-size:12.5px;color:var(--muted)}
.pfoot{display:flex;align-items:center;justify-content:space-between;margin-top:4px}
.pqty{display:inline-flex;align-items:center;gap:4px;background:var(--blue-l);color:var(--blue);border-radius:12px;padding:3px 12px 3px 8px;font-weight:800;font-size:15px}
.pqty .ms{font-size:20px}
.pfoot .chev{color:var(--blue);font-size:26px}
.plist{display:flex;flex-direction:column;gap:8px}
.plist .pcard{flex-direction:row;align-items:center;gap:12px;padding:8px 10px}
.plist .pimg{width:64px;height:64px;flex-shrink:0;margin:0}
.plist .pimg .ms{font-size:32px}
.plist .pbody{flex:1;min-width:0}
.plist .pname{min-height:0;-webkit-line-clamp:1}
.plist .pbadge{position:static;display:inline-block;margin-top:2px;padding:1px 9px;font-size:11.5px;box-shadow:none}
.plist .pfoot{margin:0;flex-direction:column;align-items:flex-end;gap:2px}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
.empty .ms{font-size:48px;color:var(--border);display:block;margin:0 auto 8px}

/* ── Product detail ── */
.dtop{display:flex;gap:16px;align-items:flex-start}
.dimg{width:150px;height:160px;border-radius:var(--r-md);background:var(--blue-ll);flex-shrink:0;display:flex;align-items:center;justify-content:center;overflow:hidden;border:1px solid var(--border)}
.dimg img{max-width:92%;max-height:92%;object-fit:contain}
.dimg .ms{font-size:64px;color:#b8cdf3}
.dtop h1{font-size:23px;font-weight:800;line-height:1.25}
.dtop .bc{font-size:14px;color:var(--muted);margin-top:4px;word-break:break-all}
.dstat{display:inline-flex;align-items:center;gap:6px;margin-top:10px;padding:5px 14px 5px 8px;border-radius:20px;font-weight:800;font-size:15px}
.dstat .ms{font-size:26px}
.dstat.reg{background:var(--green-l);color:var(--green)}.dstat.irr{background:var(--blue-l);color:var(--blue)}.dstat.stop{background:var(--orange-l);color:var(--orange)}.dstat.new{background:var(--green-l);color:var(--green)}
.dnote{font-size:14px;margin-top:8px;line-height:1.4}
@media(max-width:420px){.dimg{width:118px;height:130px}.dtop h1{font-size:20px}}
.stat4{display:grid;grid-template-columns:repeat(4,1fr);background:var(--blue-l);border-radius:var(--r-lg);margin-top:16px;padding:12px 0}
.stat4 div{text-align:center;padding:0 4px;border-right:1px solid rgba(21,101,224,.15);min-width:0}
.stat4 div:last-child{border-right:none}
.stat4 .ms{color:var(--blue);font-size:28px}
.stat4 small{display:block;font-size:12.5px;color:var(--muted);line-height:1.3;margin-top:2px}
.stat4 b{display:block;font-size:18px;font-weight:800;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:380px){.stat4 b{font-size:15px}.stat4 small{font-size:11.5px}}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--sh-sm);padding:14px}
.chart-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.chart-head .ms{color:var(--blue);font-size:28px}
.chart-head h3{flex:1;font-size:17px;font-weight:800}
.unit-pill{height:34px;padding:0 14px;border-radius:17px;background:var(--search);font-size:13px;font-weight:700;color:var(--muted);display:inline-flex;align-items:center;gap:2px}
.unit-pill .ms{font-size:18px}
.chart svg{width:100%;height:auto;display:block}
.chart .ax{font-size:11px;fill:var(--muted);font-family:'Sarabun',sans-serif}
.chart .vl{font-size:12px;fill:var(--text);font-weight:700;font-family:'Sarabun',sans-serif}
.chart .gl{stroke:var(--border);stroke-width:1}
.inforow{display:grid;grid-template-columns:1fr 1fr;background:var(--blue-ll);border-radius:var(--r-md);margin-top:10px}
.inforow div{display:flex;gap:10px;align-items:center;padding:12px 14px}
.inforow div+div{border-left:1px solid var(--border)}
.inforow .ms{color:var(--blue);font-size:30px}
.inforow small{display:block;color:var(--muted);font-size:12.5px}
.inforow b{font-size:15px;font-weight:800}
.prices{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.price{flex:1;min-width:96px;background:var(--row);border:1px solid var(--border);border-radius:var(--r-sm);padding:8px 10px;text-align:center}
.price b{display:block;font-size:17px;font-weight:800;color:var(--blue)}
.price small{color:var(--muted);font-size:12px}
.chg{font-size:12.5px;font-weight:700;margin-top:8px}
.chg.up{color:var(--red)}.chg.down{color:var(--green)}
.hist{width:100%;border-collapse:collapse;font-size:14px}
.hist td{padding:8px 4px;border-bottom:1px solid var(--border);vertical-align:top}
.hist tr:last-child td{border-bottom:none}
.hist td.d{white-space:nowrap;width:1%;padding-right:12px}
.hist td.q{text-align:right;white-space:nowrap;font-weight:800}
.hist td small{display:block;color:var(--muted);font-size:12px;font-weight:500}
.hist .fr{color:var(--green);font-weight:700;font-size:12px}
.linkbtn{color:var(--blue);font-weight:700;font-size:14px;display:inline-flex;align-items:center}
.linkbtn .ms{font-size:22px}

/* ── CTA + bottom nav ── */
.cta{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 12px + env(safe-area-inset-bottom));width:min(1068px,calc(100% - 32px));height:56px;border-radius:28px;background:var(--blue);color:#fff;font-size:17px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:var(--sh-blue);z-index:55}
.cta .ms{font-size:28px}
.cta:active{transform:translateX(-50%) scale(.98)}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--card);border-top:1px solid var(--border);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -4px 16px rgba(19,35,63,.06)}
.bnav .in{display:flex;width:100%;max-width:700px}
.bnav button{flex:1;height:var(--nav-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:12.5px;font-weight:600;color:var(--muted);position:relative}
.bnav button .ms{font-size:28px}
.bnav button.on{color:var(--blue)}
.bnav button.on::after{content:'';position:absolute;bottom:3px;left:22%;right:22%;height:3px;border-radius:2px;background:var(--blue)}
.bnav .nb{position:absolute;top:6px;left:calc(50% + 6px);background:var(--red);color:#fff;font-size:11px;font-weight:800;min-width:19px;height:19px;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:0 5px;border:2px solid var(--card)}

/* ── Recommend / proposal ── */
.rrow{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);padding:10px;margin-bottom:8px}
.rrow.on{border-color:var(--blue-2);box-shadow:0 0 0 1.5px var(--blue-2)}
.rrow .pimg{width:58px;height:58px;flex-shrink:0;margin:0}
.rrow .pimg .ms{font-size:30px}
.rrow .rb{flex:1;min-width:0}
.rrow .rb b{display:block;font-size:14px;line-height:1.3}
.rrow .rb small{display:block;color:var(--muted);font-size:12px}
.rctl{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
@media(max-width:560px){.rrow{flex-wrap:wrap;gap:8px 10px}.rrow .rb{flex:1 1 calc(100% - 110px)}.rctl{width:100%;flex-direction:row-reverse;justify-content:space-between;align-items:center;padding-left:40px}}
.stepper{display:inline-flex;align-items:center;border:1.5px solid var(--border);border-radius:12px;overflow:hidden;background:var(--card)}
.stepper button{width:36px;height:36px;font-size:20px;font-weight:800;color:var(--blue)}
.stepper input{width:44px;height:36px;border:none;text-align:center;font-weight:800;background:transparent;outline:none;font-size:16px}
.tick{width:30px;height:30px;border-radius:9px;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;color:transparent}

/* ── Summary / alerts / settings ── */

.setrow .t{flex:1}
.setrow .t small{display:block;color:var(--muted);font-size:12.5px}
.sw{width:50px;height:30px;border-radius:15px;background:var(--border);position:relative;transition:background .2s;flex-shrink:0}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}

.btn{height:40px;padding:0 16px;border-radius:20px;font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:6px;background:var(--blue-l);color:var(--blue)}

/* ── Overlays ── */
.spinner-overlay{display:none;position:fixed;inset:0;background:rgba(11,30,70,.55);align-items:center;justify-content:center;z-index:99999;backdrop-filter:blur(3px);padding:16px}

#lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:9500;align-items:center;justify-content:center;padding:16px}

</style>

<script>
/* ════════ Config ════════ */
const APP_VER = 'v2.0 · 2026-11-21';
const CFG = {
  custSheet:'1dAxF4Mz-zhJIVbuJ_Ql126gt08qvVS1wndJD50pqCZI', custTab:'Customer',
  salesSheet:'1NO8sHyDxwHTRqgcLFCxq_g_Rr09lfe4gt_odwkIgiB0', salesTab:'DS_DC',
  prodSheet:'16mYDqAqqJma-_0vCIAajy6bcjdOZ7F6VagxkdkqAB2I', prodTab:'PDDT',
  salesKey:'จิรายุ', salesFull:'คุณ จิรายุ วันจันทร์'
};
const LS_DATA='rcc_data_v1', LS_PROD='rcc_prod_v1', LS_PROP='rcc_prop_v1', LS_DARK='rcc_dark', LS_UI='rcc_ui_v2';
const DATA_TTL = 30*60*1000, PROD_TTL = 12*60*60*1000;
const DAYS = ['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];
const MONTHS = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const ACTIVE_DAYS = 14;

/* ════════ Helpers ════════ */
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const encA = s => encodeURIComponent(s).replace(/'/g, '%27');
const ZW = new RegExp('[' + String.fromCharCode(0x200B,0x200C,0x200D,0xFEFF) + ']', 'g');
const NBSP = new RegExp(String.fromCharCode(160), 'g');
const clean = s => String(s==null?'':s).replace(ZW,'').replace(NBSP,' ').replace(/\s+/g,' ').trim();
const normSku = s => clean(s).replace(/^\d+@/, '');
const num = v => { const n = parseFloat(String(v==null?'':v).replace(/,/g,'')); return isFinite(n) ? n : 0; };
const fmtQ = n => (Math.round(n*100)/100).toLocaleString('th-TH', {maximumFractionDigits:2});
const fmtB = n => '฿' + (Math.abs(n - Math.round(n)) < 0.005 ? Math.round(n).toLocaleString('th-TH') : n.toLocaleString('th-TH', {minimumFractionDigits:2, maximumFractionDigits:2}));
const fmtBi = n => '฿' + Math.round(n).toLocaleString('th-TH');
const fmtK = n => n >= 1e6 ? (n/1e6).toFixed(2).replace(/\.?0+$/,'') + 'M' : Math.round(n).toLocaleString('th-TH');
const ms = n => '<span class="ms">' + n + '</span>';
function isoToDate(iso){ const [y,m,d] = iso.split('-').map(Number); return new Date(y, m-1, d); }
function dateToISO(t){ return t.getFullYear() + '-' + String(t.getMonth()+1).padStart(2,'0') + '-' + String(t.getDate()).padStart(2,'0'); }
function formatThaiDate(iso){ if(!iso) return '-'; const d = isoToDate(iso); return String(d.getDate()).padStart(2,'0') + '/' + String(d.getMonth()+1).padStart(2,'0') + '/' + (d.getFullYear()+543); }
function longThaiDate(iso){ if(!iso) return '-'; const d = isoToDate(iso); return d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + (d.getFullYear()+543); }
const MONTHS_S = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
function midThaiDate(iso){ if(!iso) return '-'; const d = isoToDate(iso); return d.getDate() + ' ' + MONTHS_S[d.getMonth()] + ' ' + (d.getFullYear()+543); }
function shortThaiDate(iso){ if(!iso) return '-'; const d = isoToDate(iso); return d.getDate() + '/' + (d.getMonth()+1); }
function daysAgo(iso){ const t = new Date(); t.setHours(0,0,0,0); return Math.round((t - isoToDate(iso)) / 86400000); }
const todayISO = () => dateToISO(new Date());
function toISO(v){
  v = clean(v); if (!v) return '';
  let m = /^Date\((\d+),(\d+),(\d+)/.exec(v);
  if (m) return m[1] + '-' + String(+m[2]+1).padStart(2,'0') + '-' + String(m[3]).padStart(2,'0');
  m = /^(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})/.exec(v);
  if (m) return m[1] + '-' + m[2].padStart(2,'0') + '-' + m[3].padStart(2,'0');
  m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})/.exec(v);
  if (m) { let y = +m[3]; if (y > 2400) y -= 543; return y + '-' + m[2].padStart(2,'0') + '-' + m[1].padStart(2,'0'); }
  return '';
}
const showSpinner = (m, sub) => { $('spinnerMsg').textContent = m || 'กำลังโหลด...'; $('spinnerSub').textContent = sub || ''; $('spinner').classList.add('show'); };
const hideSpinner = () => $('spinner').classList.remove('show');
const setLoading = on => $('loadingBar').style.width = on ? '85%' : '0';
function showToast(msg, type){ document.querySelectorAll('.toast').forEach(t => t.remove()); const t = document.createElement('div'); t.className = 'toast toast-' + (type||'info'); t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 3200); }
const lsGet = k => { try { return JSON.parse(localStorage.getItem(k)); } catch(e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch(e) { return false; } };
function openPhoto(src){ $('lbImg').src = src; $('lightbox').classList.add('open'); }

/* ════════ Google Sheet (gviz JSONP — ใช้ได้ทั้งไฟล์ในเครื่องและ GitHub Pages) ════════ */
function gviz(sheetId, tab, tq, timeoutMs){
  return new Promise((resolve, reject) => {
    const cb = '__rcc_cb' + Date.now() + Math.floor(Math.random()*100000);
    const s = document.createElement('script');
    const timer = setTimeout(() => { cleanup(); reject(new Error('หมดเวลารอข้อมูลจากชีต')); }, timeoutMs || 60000);
    function cleanup(){ clearTimeout(timer); window[cb] = function(){}; s.remove(); }
    window[cb] = res => { cleanup(); (res && res.status !== 'error') ? resolve(res) : reject(new Error((res && res.errors && res.errors[0] && (res.errors[0].detailed_message || res.errors[0].message)) || 'ชีตตอบกลับผิดพลาด')); };
    let url = 'https://docs.google.com/spreadsheets/d/' + sheetId + '/gviz/tq?tqx=responseHandler:' + cb + '&sheet=' + encodeURIComponent(tab) + '&headers=1';
    if (tq) url += '&tq=' + encodeURIComponent(tq);
    s.src = url;
    s.onerror = () => { cleanup(); reject(new Error('เชื่อมต่อ Google Sheet ไม่ได้')); };
    document.head.appendChild(s);
  });
}
function cellVal(c){ if (c == null || c.v == null) return ''; return String(c.v); }
function tableToObjects(res){
  const cols = res.table.cols.map(c => clean(c.label || c.id));
  return res.table.rows.map(r => { const o = {}; cols.forEach((k, i) => { o[k] = clean(cellVal(r.c[i])); }); return o; });
}

/* ════════ Data load ════════ */
let DB = null;          // {ts, custs, skus, units, names, lines}
let PROD = null;        // {ts, map:{sku:{bc, units:[...], type, img}}}
let SHOPS = [], SHOP_BY = new Map(), LINES_BY = new Map(), CAT = {}, PERIOD = {from:'', to:''};

async function fetchCustomers(){
  let rows;
  try {
    rows = tableToObjects(await gviz(CFG.custSheet, CFG.custTab, "select * where N contains '" + CFG.salesKey + "'", 60000));
    if (!rows.length || !('เซลล์ผู้ดูแล' in rows[0])) throw new Error('layout');
  } catch (e) {
    rows = tableToObjects(await gviz(CFG.custSheet, CFG.custTab, '', 90000)).filter(r => String(r['เซลล์ผู้ดูแล']||'').indexOf(CFG.salesKey) >= 0);
  }
  return rows.map(r => ({
    code: r['รหัส บีพลัส'], name: r['ชื่อร้านค้า'], addr: [r['ที่อยู่'], r['หมู่'] ? 'ม.' + r['หมู่'] : ''].filter(Boolean).join(' '),
    area: r['ต.,อ.,จ. ขอพร'], phone: r['เบอร์โทร'], loc: r['Location'], type: r['ประเภทร้านค้าขอพร'], route: r['ชื่อรูท'],
    routeArea: r['ชื่อรูท-ตำบล'], seq: r['ลำดับร้าน'], deliv: r['วันส่ง'], F: r['F'], avg3m: r['ยอดขายเฉลี่ย3เดือน'], photo: r['รูป'],
    contact: r['ชื่อผู้ติดต่อ'], roo: r['ROO'], creditDays: r['วันเครดิต'], credit: r['ยอดเงินเครดิต']
  })).filter(c => c.code || c.name);
}
async function fetchSales(){
  const res = await gviz(CFG.salesSheet, CFG.salesTab, "select A,B,C,D,E,F,I,J,K,L,M,N where F contains '" + CFG.salesKey + "'", 240000);
  const cols = res.table.cols.map(c => clean(c.label || c.id));
  const ix = k => cols.indexOf(k);
  const I = {d:ix('DI_DATE'), ref:ix('DI_REF'), code:ix('AR_CODE'), name:ix('AR_NAME'), sl:ix('SLMN_NAME'), sku:ix('SKU_NAME'), unit:ix('TRD_UTQNAME'), q:ix('TRD_QTY'), fr:ix('TRD_Q_FREE'), p:ix('TRD_U_PRC'), amt:ix('TRD_G_AMT')};
  if (I.d < 0 || I.code < 0 || I.sku < 0) throw new Error('โครงสร้างชีต DS_DC เปลี่ยน');
  const skus = [], units = [], skuIx = {}, unitIx = {}, names = {}, lines = [];
  res.table.rows.forEach(r => {
    const g = i => i < 0 ? '' : clean(cellVal(r.c[i]));
    const d = toISO(r.c[I.d] && (r.c[I.d].f && /^\d{4}\//.test(r.c[I.d].f) ? r.c[I.d].f : cellVal(r.c[I.d])));
    const code = g(I.code); if (!d || !code) return;
    const sku = normSku(g(I.sku)); const unit = g(I.unit);
    if (!(sku in skuIx)) { skuIx[sku] = skus.length; skus.push(sku); }
    if (!(unit in unitIx)) { unitIx[unit] = units.length; units.push(unit); }
    if (!names[code]) names[code] = g(I.name);
    lines.push([d, g(I.ref), code, skuIx[sku], unitIx[unit], num(g(I.q)), num(g(I.fr)), num(g(I.p)), num(g(I.amt)), /ROO/i.test(g(I.sl)) ? 1 : 0]);
  });
  return {skus, units, names, lines};
}
/* PDDT: ชื่อสินค้า · บาร์โค้ด · หน่วยบรรจุ · ประเภท · รูป (Google Drive) — เก็บเฉพาะสินค้าที่ร้านของเซลล์เคยซื้อ */
async function fetchProducts(skuSet){
  const res = await gviz(CFG.prodSheet, CFG.prodTab, 'select A,B,J,K,L,M,BB,CV where A is not null', 90000);
  const map = {};
  res.table.rows.forEach(r => {
    const name = normSku(cellVal(r.c[0])); if (!name || !skuSet.has(name) || map[name]) return;
    const img = cellVal(r.c[7]); const m = /\/d\/([A-Za-z0-9_-]{10,})/.exec(img) || /[?&]id=([A-Za-z0-9_-]{10,})/.exec(img);
    map[name] = {bc: clean(r.c[1] && (r.c[1].f || cellVal(r.c[1]))), units: [2,3,4,5].map(i => clean(cellVal(r.c[i]))).filter(Boolean), type: clean(cellVal(r.c[6])), img: m ? m[1] : ''};
  });
  return {ts: Date.now(), map};
}
let loadingNow = false;
async function loadData(force){
  if (loadingNow) return; loadingNow = true;
  const cached = lsGet(LS_DATA);
  const fresh = cached && cached.lines && (Date.now() - cached.ts < DATA_TTL);
  if (!PROD) { const p = lsGet(LS_PROD); if (p && p.map) PROD = p; }
  if (cached && cached.lines && !DB) { DB = cached; buildModel(); render(); }
  if (fresh && !force) { loadingNow = false; loadProductsBg(false); return; }
  const silent = !!DB; const t0 = Date.now(); let tick = null;
  if (silent) setSync(true);
  else {
    showSpinner('กำลังดึงข้อมูลร้านค้า + ประวัติการซื้อ', 'ชีต DS_DC มีข้อมูลมาก อาจใช้เวลา 30 วินาที – 3 นาที (ครั้งแรกเท่านั้น)');
    tick = setInterval(() => { $('spinnerSub').textContent = 'ชีต DS_DC มีข้อมูลมาก อาจใช้เวลา 30 วินาที – 3 นาที (ครั้งแรกเท่านั้น) · ผ่านไป ' + Math.round((Date.now()-t0)/1000) + ' วินาที'; }, 1000);
  }
  setLoading(true);
  try {
    const [custs, sales] = await Promise.all([fetchCustomers(), fetchSales()]);
    DB = Object.assign({ts: Date.now(), custs}, sales);
    if (!lsSet(LS_DATA, DB)) console.warn('localStorage เต็ม — ไม่ได้เก็บแคช');
    buildModel(); render();
    if (silent || force) showToast('อัพเดทข้อมูลเรียบร้อย', 'success');
  } catch (e) {
    console.error(e);
    showToast('โหลดข้อมูลไม่สำเร็จ: ' + e.message, 'error');
    if (!DB) $('view').innerHTML = heroHTML() + '<div class="sheet"><div class="empty">' + ms('warning') + 'โหลดข้อมูลไม่สำเร็จ<br><small>' + esc(e.message) + '</small><br><br><button class="btn solid" onclick="loadData(true)">' + ms('refresh') + 'ลองใหม่</button></div></div>';
  } finally {
    if (tick) clearInterval(tick);
    hideSpinner(); setLoading(false); setSync(false); loadingNow = false;
    loadProductsBg(force);
  }
}
let prodLoading = false;
async function loadProductsBg(force){
  if (prodLoading || !DB) return;
  if (PROD && !force && Date.now() - PROD.ts < PROD_TTL && Object.keys(PROD.map).length) return;
  prodLoading = true;
  try { PROD = await fetchProducts(new Set(DB.skus)); lsSet(LS_PROD, PROD); buildCatalog(); MODEL_MEMO.clear(); render(true); }
  catch (e) { console.warn('โหลดข้อมูลสินค้า (PDDT) ไม่สำเร็จ', e); }
  finally { prodLoading = false; }
}
function setSync(on){ const el = document.querySelector('.sync'); if (el) el.classList.toggle('show', on); SYNCING = on; }
let SYNCING = false;

/* ════════ Units ════════ */
const UNIT_MEMO = {};
function parseUnit(u){
  if (UNIT_MEMO[u]) return UNIT_MEMO[u];
  const m = /^(.*?)x(\d+(?:\.\d+)?)\(([A-Za-z]+)\)$/.exec(clean(u));
  const r = m ? {name: m[1].trim() || 'หน่วย', f: parseFloat(m[2]) || 1, t: m[3].toUpperCase()} : {name: clean(u) || 'หน่วย', f: 1, t: 'EA'};
  r.label = r.f > 1 ? r.name + ' x' + fmtQ(r.f) : r.name;
  return (UNIT_MEMO[u] = r);
}
function addCat(sku, unit){
  const u = parseUnit(unit); const c = CAT[sku] || (CAT[sku] = {pack:null, big:null, hasEA:false, one:''});
  if (u.t === 'PA' || u.t === 'BPA' || u.t === 'BP') { if (!c.pack || u.f > c.pack.f) c.pack = {f:u.f, name:u.name}; }
  else if (u.t === 'CS' && u.f > 1) { if (!c.big || u.f > c.big.f) c.big = {f:u.f, name:u.name}; }
  else if (u.t === 'EA') c.hasEA = true;
  else if (u.f === 1 && !c.one) c.one = u.name;      // เช่น กส.x1(CS) → หน่วยเล็กสุดชื่อ "กส."
}
function baseOf(sku){ const c = CAT[sku]; return c && !c.hasEA && c.one ? c.one : 'ชิ้น'; }
function buildCatalog(){
  CAT = {};
  if (DB) DB.lines.forEach(l => addCat(DB.skus[l[3]], DB.units[l[4]]));
  if (PROD) Object.keys(PROD.map).forEach(k => PROD.map[k].units.forEach(u => addCat(k, u)));
}
function catOf(sku){ const c = CAT[sku] || {pack:null, big:null}; let pack = c.pack, big = c.big; if (pack && big && pack.f >= big.f) pack = null; return {pack, big}; }
/* หน่วยที่เลือกได้ของสินค้า: ลัง → แพ็ค → ชิ้น */
function unitOpts(k){
  const c = catOf(k.sku), o = [];
  if (c.big) o.push({key:'big', f:c.big.f, name:c.big.name});
  if (c.pack) o.push({key:'pack', f:c.pack.f, name:c.pack.name});
  o.push({key:'ea', f:1, name:baseOf(k.sku)});
  if (!o.some(x => x.f === k.mu.f)) o.unshift({key:'main', f:k.mu.f, name:k.mu.name});
  return o;
}
function prodOf(sku){ return (PROD && PROD.map[sku]) || null; }
function imgHTML(sku, size){
  const p = prodOf(sku);
  if (p && p.img) return '<img loading="lazy" alt="" src="' + imgUrl(p.img, size || 240) + '" data-id="' + esc(p.img) + '" data-sz="' + (size || 240) + '" onerror="imgErr(this)">';
  return ms('deployed_code');
}
const imgUrl = (id, sz) => 'https://lh3.googleusercontent.com/d/' + encodeURIComponent(id) + '=w' + sz;
/* รูปจาก lh3 โหลดไม่ได้ → ลอง Drive thumbnail อีกครั้ง → ไม่ได้ก็แสดงไอคอนกล่อง */
/* Google จำกัดการโหลดรูปพร้อมกันจำนวนมาก → หน่วงเวลาแล้วลองใหม่สูงสุด 3 ครั้ง */
function imgErr(el){
  const n = +(el.dataset.alt || 0) + 1; el.dataset.alt = n;
  const drive = 'https://drive.google.com/thumbnail?id=' + encodeURIComponent(el.dataset.id) + '&sz=w' + el.dataset.sz;
  if (n === 1) { el.src = drive; return; }
  if (n <= 3) { setTimeout(() => { if (el.isConnected) el.src = (n === 2 ? imgUrl(el.dataset.id, el.dataset.sz) : drive + '&r=' + n); }, 800 * n + Math.random() * 1200); return; }
  const sp = document.createElement('span'); sp.className = 'ms'; sp.textContent = 'deployed_code'; el.replaceWith(sp);
}

/* ════════ Model ════════ */
function buildModel(){
  buildCatalog(); MODEL_MEMO.clear();
  LINES_BY = new Map(); let from = '', to = '';
  DB.lines.forEach(l => {
    const o = {d:l[0], ref:l[1], code:l[2], sku:DB.skus[l[3]], unit:DB.units[l[4]], q:l[5], free:l[6], p:l[7], amt:l[8], roo:l[9]};
    if (!LINES_BY.has(o.code)) LINES_BY.set(o.code, []);
    LINES_BY.get(o.code).push(o);
    if (!from || o.d < from) from = o.d; if (!to || o.d > to) to = o.d;
  });
  PERIOD = {from, to};
  const monthKey = todayISO().slice(0, 7);
  SHOPS = []; SHOP_BY = new Map();
  const seen = new Set();
  DB.custs.forEach(c => { if (!c.code || seen.has(c.code)) return; seen.add(c.code); SHOPS.push(Object.assign({}, c)); });
  LINES_BY.forEach((ls, code) => { if (!seen.has(code)) { seen.add(code); SHOPS.push({code, name: DB.names[code] || code, extra:true, route:'', routeArea:''}); } });
  SHOPS.forEach(s => {
    const ls = LINES_BY.get(s.code) || [];
    const dates = new Set(), skus = new Set(); let tot = 0, month = 0;
    ls.forEach(l => { dates.add(l.d); skus.add(l.sku); tot += l.amt; if (l.d.slice(0, 7) === monthKey) month += l.amt; });
    s.rounds = dates.size; s.total = tot; s.month = month; s.skuCount = skus.size; s.avg = dates.size ? tot / dates.size : 0;
    s.last = ls.reduce((m, l) => l.d > m ? l.d : m, '');
    SHOP_BY.set(s.code, s);
  });
}
function shopStatus(s){
  if (!s.last) return {cls:'off', label:'ยังไม่ซื้อ'};
  const a = daysAgo(s.last);
  return a <= ACTIVE_DAYS ? {cls:'ok', label:'Active'} : {cls:'warn', label:'ห่างหาย ' + a + ' วัน'};
}
const STATUS = {
  reg:  {label:'ซื้อประจำ', cls:'b-reg', icon:'check_circle'},
  irr:  {label:'ซื้อไม่ต่อเนื่อง', cls:'b-irr', icon:'sync'},
  stop: {label:'หยุดซื้อ', cls:'b-stop', icon:'pause_circle'},
  nw:   {label:'ซื้อใหม่', cls:'b-new', icon:'new_releases'}
};
const MODEL_MEMO = new Map();
function shopModel(code){
  if (MODEL_MEMO.has(code)) return MODEL_MEMO.get(code);
  const ls = LINES_BY.get(code) || [];
  const dates = [...new Set(ls.map(l => l.d))].sort().reverse();       // ล่าสุดก่อน
  const rounds = dates.map((d, i) => ({d, no: dates.length - i, refs: new Set(), items: new Map(), total: 0}));
  const rByD = new Map(rounds.map(r => [r.d, r]));
  const skuMap = new Map();
  ls.forEach(l => {
    const u = parseUnit(l.unit), r = rByD.get(l.d);
    r.refs.add(l.ref); r.total += l.amt;
    let it = r.items.get(l.sku);
    if (!it) { it = {sku:l.sku, pieces:0, free:0, amt:0, paidPieces:0, ord:{}, freeOrd:{}, lines:[]}; r.items.set(l.sku, it); }
    it.pieces += l.q * u.f; it.free += l.free * u.f; it.amt += l.amt; it.lines.push(l);
    if (l.q > 0) { it.ord[l.unit] = (it.ord[l.unit] || 0) + l.q; if (l.amt > 0) it.paidPieces += l.q * u.f; }
    if (l.free > 0) it.freeOrd[l.unit] = (it.freeOrd[l.unit] || 0) + l.free;
    let s = skuMap.get(l.sku);
    if (!s) { s = {sku:l.sku, byD:new Map(), pieces:0, free:0, amt:0, unitCnt:{}, lines:[]}; skuMap.set(l.sku, s); }
    s.pieces += l.q * u.f; s.free += l.free * u.f; s.amt += l.amt; s.lines.push(l);
    if (l.q > 0) s.unitCnt[l.unit] = (s.unitCnt[l.unit] || 0) + 1;
  });
  rounds.forEach(r => r.items.forEach(it => { it.ppp = it.paidPieces ? it.amt / it.paidPieces : 0; skuMap.get(it.sku).byD.set(r.d, it); }));
  const latest = dates[0];
  skuMap.forEach(s => {
    const bought = dates.filter(d => s.byD.has(d) && s.byD.get(d).pieces > 0);
    s.bought = bought; s.roundsBought = bought.length;
    s.last = bought[0] || ''; s.lastAny = dates.find(d => s.byD.has(d)) || '';
    const priced = dates.filter(d => s.byD.has(d) && s.byD.get(d).ppp > 0);
    s.lastPpp = priced.length ? s.byD.get(priced[0]).ppp : 0;
    s.prevPpp = priced.length > 1 ? s.byD.get(priced[1]).ppp : 0;
    s.priceChg = (s.lastPpp && s.prevPpp && Math.abs(s.lastPpp - s.prevPpp) > 0.004) ? s.lastPpp - s.prevPpp : 0;
    const mu = Object.entries(s.unitCnt).sort((a, b) => b[1] - a[1] || parseUnit(b[0]).f - parseUnit(a[0]).f)[0];
    s.mainUnit = mu ? mu[0] : s.lines[0].unit;
    s.mu = parseUnit(s.mainUnit);
    s.avgBought = s.roundsBought ? s.pieces / s.roundsBought : 0;
    s.freq = dates.length ? s.roundsBought / dates.length : 0;
    s.gap = s.last ? dates.indexOf(s.last) : dates.length;          // ไม่ได้ซื้อมากี่รอบ
    s.missLatest = s.roundsBought >= 2 && s.gap >= 1;
    s.suggest = s.roundsBought ? Math.max(1, Math.round(s.avgBought / s.mu.f)) : 0;
    const asc = [...bought].reverse(); let gs = 0;
    for (let i = 1; i < asc.length; i++) gs += (isoToDate(asc[i]) - isoToDate(asc[i-1])) / 86400000;
    s.everyDays = asc.length > 1 ? gs / (asc.length - 1) : 0;
    const dAgo = s.last ? daysAgo(s.last) : 999;
    if (!s.roundsBought) s.status = 'stop';
    else if (s.roundsBought === 1 && s.gap === 0 && dates.length > 1) s.status = 'nw';
    else if (s.gap >= 3 || (s.gap >= 2 && dAgo > 21)) s.status = 'stop';
    else if (s.freq >= .5 && s.gap <= 1) s.status = 'reg';
    else s.status = 'irr';
    const lastIt = s.last ? s.byD.get(s.last) : null;
    s.lastPieces = lastIt ? lastIt.pieces : 0;
  });
  const M = {code, dates, rounds, skus:[...skuMap.values()], latest};
  MODEL_MEMO.set(code, M);
  return M;
}

const DAY_ORDER = ['จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์','อาทิตย์'];
function routeKeys(){
  const counts = {}; SHOPS.forEach(s => { const r = s.route || 'อื่นๆ'; counts[r] = (counts[r] || 0) + 1; });
  const keys = Object.keys(counts).sort((a, b) => { const ia = DAY_ORDER.indexOf(a), ib = DAY_ORDER.indexOf(b); return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib) || a.localeCompare(b, 'th'); });
  return {counts, keys};
}
const routeLabel = r => r === 'all' ? 'ทั้งหมด' : (DAY_ORDER.indexOf(r) >= 0 ? 'รูท' + r : r) + (r === DAYS[new Date().getDay()] ? ' (วันนี้)' : '');

function niceStep(v){ if (v <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))); for (const m of [1, 2, 2.5, 5, 10]) if (m * p >= v) return m * p; return 10 * p; }

  for (let i = 0; i <= ticks; i++) { const v = step * i, y = Y(v); s += '<line class="gl" x1="' + pl + '" x2="' + (W - pr) + '" y1="' + y + '" y2="' + y + '"/><text class="ax" x="' + (pl - 6) + '" y="' + (y + 4) + '" text-anchor="end">' + fmtQ(v) + '</text>'; }
  const path = pts.map((p, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(p.v).toFixed(1)).join(' ');

    const u = parseUnit(l.unit), cc = catOf(l.sku), pcs = l.q * u.f, ppp = l.q && l.amt ? l.p / u.f : 0;
    rows.push({'รอบ': r.no, 'วันที่': formatThaiDate(r.d), 'เลขที่เอกสาร': l.ref, 'สินค้า': l.sku, 'บาร์โค้ด': (prodOf(l.sku) || {}).bc || '', 'หน่วยที่สั่ง': u.label, 'จำนวน': l.q, 'แถม': l.free,
      'ชิ้น': r2(pcs), 'แพ็ค': cc.pack ? r2(pcs / cc.pack.f) : '', 'ลัง': cc.big ? r2(pcs / cc.big.f) : '',
      'ราคา/หน่วยที่สั่ง': l.p, 'ราคา/ชิ้น': ppp ? r2(ppp) : '', 'ราคา/แพ็ค': ppp && cc.pack ? r2(ppp * cc.pack.f) : '', 'ราคา/ลัง': ppp && cc.big ? r2(ppp * cc.big.f) : '', 'จำนวนเงิน': l.amt});
  })));
  const ws = XLSX.utils.json_to_sheet(rows), wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'ประวัติการซื้อ');
  XLSX.writeFile(wb, 'Rattana Call Card - ' + code + ' ' + todayISO() + '.xlsx');
}

/* ════════ สรุปภาพรวม ════════ */
function pageSummary(){
  const monthKey = todayISO().slice(0, 7);
  const buyers = SHOPS.filter(s => s.month > 0).length, monthTot = SHOPS.reduce((a, s) => a + s.month, 0);
  const idle = SHOPS.filter(s => s.last && daysAgo(s.last) > ACTIVE_DAYS).length;
  const skuAgg = new Map(), routeAgg = new Map();
  DB.lines.forEach(l => {
    const sku = DB.skus[l[3]];
    let a = skuAgg.get(sku); if (!a) { a = {sku, amt:0, shops:new Set()}; skuAgg.set(sku, a); }
    a.amt += l[8]; a.shops.add(l[2]);
  });
  SHOPS.forEach(s => { const r = s.route || 'อื่นๆ'; let a = routeAgg.get(r); if (!a) { a = {r, n:0, buy:0, month:0, total:0}; routeAgg.set(r, a); } a.n++; if (s.month > 0) a.buy++; a.month += s.month; a.total += s.total; });
  const topSku = [...skuAgg.values()].sort((a, b) => b.amt - a.amt).slice(0, 10);
  const topShop = [...SHOPS].sort((a, b) => b.total - a.total).slice(0, 10);
  const routes = [...routeAgg.values()].sort((a, b) => { const ia = DAY_ORDER.indexOf(a.r), ib = DAY_ORDER.indexOf(b.r); return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib); });
  const maxR = Math.max.apply(null, routes.map(r => r.month).concat([1]));
  const mName = MONTHS[+monthKey.slice(5, 7) - 1];
  let h = barHTML('สรุปภาพรวม', '#/') + '<div class="page">' +
    '<div class="count-line"><span>' + esc(CFG.salesFull) + '</span><span>ข้อมูล ' + shortThaiDate(PERIOD.from) + ' – ' + formatThaiDate(PERIOD.to) + '</span></div>' +
    '<div class="kpis">' +
      '<div class="kpi">' + ms('storefront') + '<small>ร้านในความดูแล</small><b>' + SHOPS.length + '</b></div>' +
      '<div class="kpi">' + ms('shopping_cart') + '<small>ยอดซื้อเดือน' + mName + '</small><b>' + fmtBi(monthTot) + '</b></div>' +
      '<div class="kpi">' + ms('check_circle') + '<small>ร้านที่ซื้อเดือนนี้</small><b>' + buyers + ' <small style="display:inline">/ ' + SHOPS.length + '</small></b></div>' +
      '<div class="kpi">' + ms('warning') + '<small>ห่างหาย > ' + ACTIVE_DAYS + ' วัน</small><b style="color:var(--orange)">' + idle + '</b></div>' +
    '</div>' +
    '<div class="sec">' + ms('route') + '<h3>ยอดเดือนนี้ตามรูท</h3></div><div class="card">' + routes.map(r =>
      '<div class="rank" onclick="UI.route=\'' + esc(r.r) + '\';saveUI();go(\'#/\')"><div class="rb"><b>' + esc(routeLabel(r.r)) + '</b><small>ซื้อแล้ว ' + r.buy + '/' + r.n + ' ร้าน</small><div class="bar-h"><i style="width:' + (r.month / maxR * 100).toFixed(1) + '%"></i></div></div><div class="val">' + fmtBi(r.month) + '</div></div>').join('') + '</div>' +
    '<div class="sec">' + ms('deployed_code') + '<h3>สินค้าขายดี 10 อันดับ <small>(ทั้งช่วงข้อมูล)</small></h3></div><div class="card">' + topSku.map((a, i) =>
      '<div class="rank" style="cursor:default"><span class="no">' + (i + 1) + '</span><div class="pimg">' + imgHTML(a.sku, 100) + '</div><div class="rb"><b>' + esc(a.sku) + '</b><small>' + a.shops.size + ' ร้านซื้อ</small></div><div class="val">' + fmtBi(a.amt) + '</div></div>').join('') + '</div>' +
    '<div class="sec">' + ms('storefront') + '<h3>ร้านยอดซื้อสูงสุด 10 อันดับ</h3></div><div class="card">' + topShop.map((s, i) =>
      '<div class="rank" onclick="go(\'#/shop/' + encA(s.code) + '\')"><span class="no">' + (i + 1) + '</span><div class="rb"><b>' + esc(s.name) + '</b><small>' + s.rounds + ' รอบ · เฉลี่ย ' + fmtBi(s.avg) + '/รอบ</small></div><div class="val">' + fmtBi(s.total) + '<small>' + (s.route ? 'รูท' + esc(s.route) : '') + '</small></div></div>').join('') + '</div>' +
    '</div>';
  $('view').innerHTML = h;
}

/* ════════ แจ้งเตือน ════════ */
function alertsData(){
  const idle = SHOPS.filter(s => s.last && daysAgo(s.last) > ACTIVE_DAYS).sort((a, b) => a.last.localeCompare(b.last));
  const never = SHOPS.filter(s => !s.last);
  return {idle, never};
}
function updateBadge(){
  const b = $('navBadge'); if (!DB) { b.style.display = 'none'; return; }
  const n = alertsData().idle.length; b.textContent = n > 99 ? '99+' : n; b.style.display = n ? 'flex' : 'none';
}
function pageAlerts(){
  const {idle, never} = alertsData();
  const td = DAYS[new Date().getDay()];
  const today = SHOPS.filter(s => s.route === td).map(s => { const M = shopModel(s.code); return {s, miss: M.skus.filter(k => k.missLatest && k.status !== 'stop').length, stop: M.skus.filter(k => k.status === 'stop').length}; }).sort((a, b) => b.miss - a.miss);
  const row = (s, right, sub) => '<div class="rank" onclick="go(\'#/shop/' + encA(s.code) + '\')"><div class="rb"><b>' + esc(s.name) + '</b><small>' + sub + '</small></div><div class="val">' + right + '</div><span class="ms muted">chevron_right</span></div>';
  let h = barHTML('แจ้งเตือน', '#/') + '<div class="page">';
  if (today.length) h += '<div class="sec">' + ms('route') + '<h3>รูทวันนี้ (' + td + ') <small>· สินค้าที่ควรเสนอ</small></h3></div><div class="card">' +
    today.map(x => row(x.s, '<span class="st ' + (x.miss ? 'warn' : 'ok') + '">ควรเสนอ ' + x.miss + '</span>', 'รหัส ' + esc(x.s.code) + (x.s.last ? ' · ซื้อล่าสุด ' + formatThaiDate(x.s.last) : ' · ยังไม่ซื้อ') + (x.stop ? ' · หยุดซื้อ ' + x.stop + ' SKU' : ''))).join('') + '</div>';
  h += '<div class="sec">' + ms('warning') + '<h3>ร้านห่างหาย <small>(ไม่ซื้อเกิน ' + ACTIVE_DAYS + ' วัน · ' + idle.length + ' ร้าน)</small></h3></div>' +
    (idle.length ? '<div class="card">' + idle.map(s => row(s, '<span class="st warn">' + daysAgo(s.last) + ' วัน</span>', 'ซื้อล่าสุด ' + formatThaiDate(s.last) + (s.route ? ' · รูท' + esc(s.route) : ''))).join('') + '</div>' : '<div class="card empty">' + ms('check_circle') + 'ไม่มีร้านห่างหาย</div>');
  if (never.length) h += '<div class="sec">' + ms('info') + '<h3>ยังไม่มีการซื้อในช่วงข้อมูล <small>(' + never.length + ' ร้าน)</small></h3></div><div class="card">' +
    never.map(s => row(s, '<span class="st off">ยังไม่ซื้อ</span>', 'รหัส ' + esc(s.code) + (s.route ? ' · รูท' + esc(s.route) : ''))).join('') + '</div>';
  $('view').innerHTML = h + '</div>';
}

/* ════════ ตั้งค่า ════════ */
function pageSettings(){
  const dark = document.body.classList.contains('dark');
  const nProd = PROD ? Object.keys(PROD.map).length : 0, nImg = PROD ? Object.values(PROD.map).filter(p => p.img).length : 0;
  const t = DB && DB.ts ? new Date(DB.ts) : null;
  $('view').innerHTML = barHTML('ตั้งค่า', '#/') + '<div class="page"><div class="card">' +
    '<div class="setrow">' + ms('person') + '<div class="t"><b>' + esc(CFG.salesFull) + '</b><small>เซลล์ผู้ดูแล · ' + SHOPS.length + ' ร้าน</small></div></div>' +
    '<div class="setrow" onclick="toggleDark()" style="cursor:pointer">' + ms('dark_mode') + '<div class="t"><b>โหมดมืด</b><small>ถนอมสายตาตอนกลางคืน</small></div><span class="sw' + (dark ? ' on' : '') + '"></span></div>' +
    '<div class="setrow">' + ms('refresh') + '<div class="t"><b>ดึงข้อมูลใหม่</b><small>อัพเดทล่าสุด ' + (t ? formatThaiDate(dateToISO(t)) + ' ' + String(t.getHours()).padStart(2,'0') + '.' + String(t.getMinutes()).padStart(2,'0') : '-') + '</small></div><button class="btn solid" onclick="loadData(true)">' + ms('sync') + 'ดึงใหม่</button></div>' +
    '<div class="setrow">' + ms('history') + '<div class="t"><b>ช่วงข้อมูลการขาย (DS_DC)</b><small>' + formatThaiDate(PERIOD.from) + ' – ' + formatThaiDate(PERIOD.to) + ' · ' + (DB ? DB.lines.length.toLocaleString('th-TH') : 0) + ' บรรทัด</small></div></div>' +
    '<div class="setrow">' + ms('deployed_code') + '<div class="t"><b>ข้อมูลสินค้า (PDDT)</b><small>' + nProd + ' สินค้า · มีรูป ' + nImg + ' รายการ' + (prodLoading ? ' · กำลังโหลด...' : '') + '</small></div></div>' +
    '<div class="setrow">' + ms('delete') + '<div class="t"><b>ล้างแคชในเครื่อง</b><small>ข้อมูลจะถูกดึงใหม่ทั้งหมด (ใช้เวลานาน)</small></div><button class="btn" onclick="clearCache()">ล้าง</button></div>' +
    '<div class="setrow">' + ms('info') + '<div class="t"><b>Rattana Call Card</b><small>' + APP_VER + ' · 1 รอบ = 1 วันที่ออกบิล · ร้าน Active = ซื้อภายใน ' + ACTIVE_DAYS + ' วัน</small></div></div>' +
    '</div></div>';
}
function toggleDark(){ document.body.classList.toggle('dark'); lsSet(LS_DARK, document.body.classList.contains('dark')); if (routeParts()[0] === 'settings') render(true); }
function clearCache(){ if (!confirm('ล้างข้อมูลที่เก็บไว้ในเครื่อง แล้วดึงใหม่ทั้งหมด?')) return; [LS_DATA, LS_PROD].forEach(k => { try { localStorage.removeItem(k); } catch(e) {} }); DB = null; PROD = null; render(); loadData(true); }

/* ════════ Boot ════════ */
(function boot(){
  if (lsGet(LS_DARK)) document.body.classList.add('dark');
  render();
  loadData(false);
  setInterval(() => { if (!document.hidden) loadData(false); }, 5 * 60 * 1000);   // เช็คทุก 5 นาที (ดึงใหม่เมื่อแคชเกิน 30 นาที)
})();
</script>
