<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Rattana Call Card v1.1</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js" defer></script>
<style>
:root{
  --navy:#0d1b3e;--navy-mid:#1a2f5e;--navy-light:#243b73;--gold:#c9a84c;--gold-light:#e8c86a;
  --success:#2ecc71;--danger:#e74c3c;--warning:#f39c12;--info:#3498db;
  --bg:#f4f6fb;--text:#0d1b3e;--card-bg:#ffffff;--border:#dde3f0;--muted:#6b7896;--row-alt:#fafbfd;
  --space-xs:4px;--space-sm:8px;--space-md:16px;--space-lg:24px;--space-xl:32px;
  --radius-sm:6px;--radius-md:12px;--radius-lg:16px;--radius-xl:20px;
  --shadow-sm:0 1px 4px rgba(0,0,0,.06);--shadow-md:0 2px 8px rgba(0,0,0,.08);--shadow-lg:0 8px 24px rgba(13,27,62,.12);--shadow-gold:0 4px 12px rgba(201,168,76,.35);
  --top:66px;
}
body.dark{--bg:#0a1020;--text:#e8eaf0;--card-bg:#111c35;--border:#243b73;--muted:#8a98b8;--row-alt:#0f1830}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Sarabun',sans-serif;font-size:14px;line-height:1.5;min-height:100dvh;overflow-x:hidden;background:var(--bg);color:var(--text);transition:background .25s,color .25s}
button{font-family:inherit;cursor:pointer;border:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;color:inherit}
input,select,textarea{font-family:inherit;font-size:16px}
a{color:inherit}

/* ── Top bar ── */
.topbar{position:sticky;top:0;z-index:100}
header{background:var(--navy);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;border-bottom:3px solid var(--gold);padding-top:max(10px,env(safe-area-inset-top))}
.logo-text{font-weight:700;letter-spacing:1px;font-size:18px;color:#fff;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo-text span{color:var(--gold);white-space:nowrap}
.logo-text .ver-badge{display:inline-block;font-size:10px;font-weight:600;letter-spacing:0;color:var(--navy);background:var(--gold);border-radius:8px;padding:1px 7px;margin-left:6px;vertical-align:middle}
.logo-text .sub{display:block;font-size:11px;font-weight:400;color:rgba(255,255,255,.65);letter-spacing:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.2);width:40px;height:40px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;transition:background .15s,transform .6s}
.icon-btn:hover{background:rgba(255,255,255,.12)}
.sync-pill{font-size:11px;background:rgba(201,168,76,.18);color:var(--gold-light);border:1px solid rgba(201,168,76,.45);border-radius:10px;padding:2px 8px;white-space:nowrap;display:none}
.sync-pill.show{display:inline-block}
@media(max-width:480px){.logo-text{font-size:16px;letter-spacing:.5px}.logo-text .ver-badge{margin-left:4px}header{gap:6px;padding-left:12px;padding-right:10px}.icon-btn{width:36px;height:36px;font-size:16px}}

/* ── Layout ── */
.layout{display:grid;grid-template-columns:1fr;max-width:1500px;margin:0 auto}
@media(min-width:1024px){.layout{grid-template-columns:360px minmax(0,1fr)}}
#shopPane{padding:12px;min-width:0}
#cardPane{padding:12px;min-width:0;padding-bottom:110px}
@media(min-width:1024px){
  #shopPane{position:sticky;top:var(--top);height:calc(100dvh - var(--top));overflow-y:auto;border-right:1px solid var(--border)}
  .back-btn{display:none!important}
}
@media(max-width:1023px){body.has-shop #shopPane{display:none} body:not(.has-shop) #cardPane{display:none}}

/* ── Cards / common ── */
.card{background:var(--card-bg);border-radius:var(--radius-md);border:1px solid var(--border);box-shadow:var(--shadow-md)}
.card-gold{border-top:3px solid var(--gold)}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px;border-bottom:1px solid var(--border);background:linear-gradient(to right,rgba(201,168,76,.08),transparent)}
.card-head h3{font-size:15px;font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 14px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;border:1px solid transparent;min-height:44px;transition:opacity .15s,transform .1s;white-space:nowrap}
.btn:hover{opacity:.88}.btn:active{transform:scale(.97)}
.btn-primary{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn-gold{background:var(--gold);color:var(--navy);border-color:var(--gold)}
.btn-outline{background:transparent;color:var(--text);border-color:var(--border)}
.btn-sm{padding:5px 10px;font-size:12px;min-height:34px}
.badge{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;font-weight:600;white-space:nowrap;line-height:1.6}
.badge-ok{background:#e8f7ee;color:#1e8449}.badge-warn{background:#fef3d7;color:#a87800}.badge-danger{background:#ffd5d0;color:#c0392b}.badge-info{background:#e3f0fd;color:#1a6fb8}
.badge-gold{background:rgba(201,168,76,.18);color:var(--navy);border:1px solid rgba(201,168,76,.4)}
.badge-mute{background:rgba(107,120,150,.12);color:var(--muted)}
body.dark .badge-ok{background:#1a3a25;color:#7be0a3}body.dark .badge-warn{background:#3a2e15;color:#e8c86a}body.dark .badge-danger{background:#3a1a17;color:#ff8a7e}body.dark .badge-info{background:#16304d;color:#8cc4f5}body.dark .badge-gold{color:var(--gold-light)}
.txt-muted{color:var(--muted)}.txt-sm{font-size:12px}.num{font-variant-numeric:tabular-nums}
.up{color:var(--danger);font-weight:700}.down{color:#1e8449;font-weight:700}
body.dark .down{color:#7be0a3}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}

/* ── Shop list ── */
.search{width:100%;min-height:44px;padding:0 16px;border-radius:22px;border:1.5px solid var(--border);background:var(--card-bg);color:var(--text);outline:none}
.search:focus{border-color:var(--gold)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;min-height:34px;padding:4px 12px;border-radius:17px;border:1.5px solid var(--border);background:var(--card-bg);font-size:13px;font-weight:600;color:var(--text)}
.chip.active{background:var(--gold);border-color:var(--gold);color:var(--navy)}
.chip .n{font-weight:400;opacity:.7;margin-left:3px}
.list-meta{font-size:12px;color:var(--muted);margin:6px 2px 8px;display:flex;justify-content:space-between;gap:8px}
.shop-item{width:100%;text-align:left;background:var(--card-bg);border:1px solid var(--border);border-left:4px solid var(--border);border-radius:var(--radius-md);padding:10px 12px;margin-bottom:8px;display:block;box-shadow:var(--shadow-sm);transition:border-color .15s,background .15s}
.shop-item:hover{border-color:var(--gold)}
.shop-item.sel{border-left-color:var(--gold);background:linear-gradient(to right,rgba(201,168,76,.12),var(--card-bg))}
.shop-item.nobuy{border-left-color:var(--danger)}
.shop-item .t{font-weight:700;font-size:14px;display:flex;gap:6px;align-items:baseline}
.shop-item .t .seq{font-size:11px;color:var(--muted);font-weight:600;min-width:26px}
.shop-item .m{font-size:12px;color:var(--muted);margin-top:2px}
.shop-item .s{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}

/* ── Shop header card ── */
.back-btn{margin-bottom:10px}
.shop-head{display:flex;gap:14px;padding:14px}
.shop-photo{width:84px;height:84px;border-radius:var(--radius-md);object-fit:cover;flex-shrink:0;background:var(--row-alt);border:1px solid var(--border);cursor:zoom-in}
.shop-photo.ph{display:flex;align-items:center;justify-content:center;font-size:32px;cursor:default}
.shop-head h2{font-size:19px;line-height:1.3}
.shop-head .code{font-family:'Courier New',monospace;font-size:12px;font-weight:700;color:var(--muted)}
.shop-head .row{font-size:13px;margin-top:4px;display:flex;flex-wrap:wrap;gap:4px 12px}
.shop-head .row a{color:var(--info);text-decoration:none;font-weight:600}
.shop-facts{display:grid;grid-template-columns:repeat(2,1fr);gap:0;border-top:1px solid var(--border)}
@media(min-width:640px){.shop-facts{grid-template-columns:repeat(4,1fr)}}
.shop-facts div{padding:8px 14px;border-right:1px solid var(--border);border-bottom:1px solid var(--border)}
.shop-facts b{display:block;font-size:15px}
.shop-facts span{font-size:11px;color:var(--muted);font-weight:600}
.period{font-size:12px;color:var(--muted);margin:10px 2px}
.toolrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0 10px}
.toolrow .grow{flex:1}

.qchips{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px;grid-column:1 / -1}
.qchip{font-size:11.5px;padding:1px 8px;border-radius:8px;background:rgba(13,27,62,.06);border:1px solid var(--border);white-space:nowrap}
body.dark .qchip{background:rgba(255,255,255,.05)}
.qchip.q{background:rgba(201,168,76,.16);border-color:rgba(201,168,76,.45);font-weight:600}
.qchip.p{background:rgba(52,152,219,.08);border-color:rgba(52,152,219,.3)}
.qchip.f{background:#e8f7ee;border-color:#b6e5c8;color:#1e8449;font-weight:600}
body.dark .qchip.f{background:#1a3a25;color:#7be0a3;border-color:#2c5a3c}
.qchip small{opacity:.65;margin-left:2px}

/* ── การ์ดเสนอขาย ── */
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
@media(min-width:640px){.stat-grid{grid-template-columns:repeat(4,1fr)}}
.stat-card{background:var(--card-bg);border-radius:var(--radius-md);padding:12px 14px;border:1px solid var(--border);border-top:3px solid var(--gold)}
.stat-card .s-label{font-size:11px;color:var(--muted);font-weight:600;margin-bottom:4px}
.stat-card .s-value{font-size:21px;font-weight:700;line-height:1.2}
.stat-card .s-sub{font-size:11px;color:var(--muted);margin-top:2px}
.sku-grid{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:700px){.sku-grid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1350px){.sku-grid{grid-template-columns:repeat(3,1fr)}}
.sku-card{background:var(--card-bg);border:1px solid var(--border);border-left:4px solid var(--border);border-radius:var(--radius-md);padding:12px;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;gap:6px;transition:box-shadow .15s}
.sku-card.opp{border-left-color:var(--warning)}
.sku-card.reg{border-left-color:var(--success)}
.sku-card.on{box-shadow:0 0 0 2px var(--gold),var(--shadow-md)}
.sku-card .top{display:flex;gap:8px;align-items:flex-start}
.sku-card .top .nm{flex:1;font-weight:700;line-height:1.3}
.dots{display:flex;gap:4px;align-items:center;font-size:10px;color:var(--muted)}
.dot{width:13px;height:13px;border-radius:50%;background:var(--border);flex-shrink:0}
.dot.on{background:var(--gold)}
.dot.last{outline:2px solid var(--navy);outline-offset:1px}
body.dark .dot.last{outline-color:var(--gold-light)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:12.5px}
.kv span{color:var(--muted)}
.prop-row{display:flex;align-items:center;gap:8px;border-top:1px dashed var(--border);padding-top:8px;margin-top:2px}
.prop-row .lbl{flex:1;font-size:12px;color:var(--muted)}
.prop-row .lbl b{color:var(--text);font-size:14px}
.stepper{display:inline-flex;align-items:center;border:1.5px solid var(--border);border-radius:10px;overflow:hidden}
.stepper button{width:38px;height:38px;font-size:18px;font-weight:700;background:var(--row-alt)}
.stepper input{width:48px;height:38px;border:none;text-align:center;font-weight:700;background:var(--card-bg);color:var(--text);outline:none;font-size:16px}
.tick{width:38px;height:38px;border-radius:10px;border:1.5px solid var(--border);background:var(--card-bg);font-size:18px;font-weight:700;color:var(--muted);flex-shrink:0}
.tick.on{background:var(--gold);border-color:var(--gold);color:var(--navy)}
.propbar{position:fixed;left:0;right:0;bottom:0;z-index:95;background:var(--navy);color:#fff;border-top:3px solid var(--gold);padding:10px 14px;padding-bottom:max(10px,env(safe-area-inset-bottom));display:none;align-items:center;gap:10px;box-shadow:0 -6px 20px rgba(13,27,62,.25)}
.propbar.show{display:flex}
.propbar .sum{flex:1;min-width:0}
.propbar .sum b{color:var(--gold-light);font-size:18px}
.propbar .sum small{display:block;font-size:11px;color:rgba(255,255,255,.65)}
@media(min-width:1024px){.propbar{left:360px}}

/* ── Modal / spinner / toast ── */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(13,27,62,.65);z-index:9000;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(4px)}
.modal-overlay.open{display:flex}
.modal{background:var(--card-bg);border-radius:var(--radius-lg);max-width:640px;width:100%;max-height:92dvh;overflow-y:auto;border-top:4px solid var(--gold);animation:slideUp .22s ease}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 18px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--card-bg);z-index:2}
.modal-head h3{font-size:16px;font-weight:700}
.modal-close{background:transparent;font-size:26px;color:var(--muted);padding:2px 10px;border-radius:var(--radius-sm);line-height:1}
.modal-body{padding:14px 18px}
.tbl-wrap{overflow:auto;-webkit-overflow-scrolling:touch}
.mtbl{width:100%;border-collapse:collapse;font-size:12.5px}
.mtbl th{background:var(--navy);color:#fff;padding:6px 8px;text-align:left;font-weight:600;white-space:nowrap}
.mtbl td{padding:6px 8px;border-bottom:1px solid var(--border);white-space:nowrap}
.mtbl td.r,.mtbl th.r{text-align:right}
#lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:9500;align-items:center;justify-content:center;padding:16px}
#lightbox.open{display:flex}
#lightbox img{max-width:100%;max-height:90dvh;border-radius:12px}
.spinner-overlay{display:none;position:fixed;inset:0;background:rgba(13,27,62,.55);align-items:center;justify-content:center;z-index:99999;backdrop-filter:blur(3px);padding:16px}
.spinner-overlay.show{display:flex}
.spinner-box{background:#fff;color:var(--navy);border-radius:var(--radius-lg);padding:28px 32px;text-align:center;border-top:4px solid var(--gold);min-width:260px;max-width:360px}
.spinner-ring{width:48px;height:48px;border:5px solid #dde3f0;border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px}
.spinner-box p{font-weight:600}
.spinner-box small{display:block;color:#6b7896;margin-top:6px;font-size:12px}
body.dark .spinner-box{background:var(--card-bg);color:var(--text)}
#loadingBar{position:fixed;top:0;left:0;height:3px;background:var(--gold);width:0;transition:width .4s;z-index:10000}
.toast{position:fixed;bottom:max(84px,env(safe-area-inset-bottom));right:16px;padding:12px 20px;border-radius:var(--radius-md);color:#fff;z-index:9999;animation:slideIn .3s ease;font-weight:500;box-shadow:var(--shadow-lg);max-width:90vw;font-size:13px}
.toast-success{background:#1e9e57}.toast-error{background:var(--danger)}.toast-warning{background:var(--warning);color:var(--navy)}.toast-info{background:var(--navy-mid);border-left:3px solid var(--gold)}
#backToTop{position:fixed;bottom:max(84px,calc(76px + env(safe-area-inset-bottom)));right:max(16px,calc(12px + env(safe-area-inset-right)));background:var(--gold);color:var(--navy);border-radius:50%;width:46px;height:46px;display:none;align-items:center;justify-content:center;box-shadow:var(--shadow-gold);z-index:90;font-size:18px;font-weight:700}
#backToTop.show{display:flex}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes slideIn{from{transform:translateX(120%);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
</style>
</head>
<body>
<div id="loadingBar"></div>
<div class="spinner-overlay" id="spinner"><div class="spinner-box"><div class="spinner-ring"></div><p id="spinnerMsg">กำลังโหลด...</p><small id="spinnerSub"></small></div></div>

<div class="topbar" id="topbar">
  <header>
    <div class="logo-text">Rattana <span>Call Card</span> <span class="ver-badge">v1.1 · 2026-11-21</span>
      <span class="sub" id="hdrSub">คอลการ์ดเสนอขายรายร้าน · คุณ จิรายุ วันจันทร์</span></div>
    <span class="sync-pill" id="syncPill">🔄 กำลังอัพเดท</span>
    <button class="icon-btn" id="btnRefresh" title="ดึงข้อมูลใหม่" onclick="refreshData()">⟳</button>
    <button class="icon-btn" title="โหมดมืด/สว่าง" onclick="toggleDark()">◐</button>
  </header>
</div>

<div class="layout">
  <aside id="shopPane">
    <input class="search" id="shopSearch" type="search" placeholder="🔍 ค้นหาร้าน / รหัส / ตำบล" oninput="STATE.q=this.value;renderShopList()" autocomplete="off">
    <div class="chips" id="routeChips"></div>
    <div class="list-meta"><span id="listCount"></span><span id="dataStamp"></span></div>
    <div id="shopList"><div class="empty">กำลังโหลดรายชื่อร้าน...</div></div>
  </aside>
  <main id="cardPane"><div class="empty">เลือกร้านจากรายการด้านซ้าย</div></main>
</div>

<div class="propbar" id="propbar">
  <div class="sum"><span id="propSum"></span><small id="propSub"></small></div>
  <button class="btn btn-gold btn-sm" onclick="copyProposal()">📋 คัดลอกส่ง LINE</button>
  <button class="btn btn-outline btn-sm" style="color:#fff;border-color:rgba(255,255,255,.35)" onclick="exportProposal()">Excel</button>
</div>

<div class="modal-overlay" id="skuModal" onclick="if(event.target===this)closeModal()">
  <div class="modal"><div class="modal-head"><h3 id="mTitle"></h3><button class="modal-close" onclick="closeModal()">×</button></div><div class="modal-body" id="mBody"></div></div>
</div>
<div id="lightbox" onclick="this.classList.remove('open')"><img id="lbImg" alt=""></div>
<button id="backToTop" onclick="window.scrollTo({top:0,behavior:'smooth'})">▲</button>

<script>
/* ════════ Config ════════ */
const CFG = {
  custSheet:'1dAxF4Mz-zhJIVbuJ_Ql126gt08qvVS1wndJD50pqCZI', custTab:'Customer',
  salesSheet:'1NO8sHyDxwHTRqgcLFCxq_g_Rr09lfe4gt_odwkIgiB0', salesTab:'DS_DC',
  salesKey:'จิรายุ', salesFull:'คุณ จิรายุ วันจันทร์'
};
const LS_DATA='rcc_data_v1', LS_UNITS='rcc_units_v1', LS_PROP='rcc_prop_v1', LS_DARK='rcc_dark';
const DATA_TTL = 30*60*1000, UNIT_TTL = 24*60*60*1000;
const DAYS = ['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];
const DAYS_S = ['อา.','จ.','อ.','พ.','พฤ.','ศ.','ส.'];

/* ════════ Helpers ════════ */
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ZW = new RegExp('[' + String.fromCharCode(0x200B,0x200C,0x200D,0xFEFF) + ']', 'g');
const NBSP = new RegExp(String.fromCharCode(160), 'g');
const clean = s => String(s==null?'':s).replace(ZW,'').replace(NBSP,' ').replace(/\s+/g,' ').trim();
const normSku = s => clean(s).replace(/^\d+@/, '');
const num = v => { const n = parseFloat(String(v==null?'':v).replace(/,/g,'')); return isFinite(n) ? n : 0; };
const fmtQ = n => (Math.round(n*100)/100).toLocaleString('th-TH', {maximumFractionDigits:2});
const fmtB = n => '฿' + (Math.abs(n - Math.round(n)) < 0.005 ? Math.round(n).toLocaleString('th-TH') : n.toLocaleString('th-TH', {minimumFractionDigits:2, maximumFractionDigits:2}));
const fmtBi = n => '฿' + Math.round(n).toLocaleString('th-TH');
function isoToDate(iso){ const [y,m,d] = iso.split('-').map(Number); return new Date(y, m-1, d); }
function formatThaiDate(iso){ if(!iso) return '-'; const d = isoToDate(iso); return String(d.getDate()).padStart(2,'0') + '/' + String(d.getMonth()+1).padStart(2,'0') + '/' + (d.getFullYear()+543); }
function shortThaiDate(iso){ if(!iso) return '-'; const d = isoToDate(iso); return d.getDate() + '/' + (d.getMonth()+1); }
function weekdayOf(iso){ return DAYS[isoToDate(iso).getDay()]; }
function daysAgo(iso){ const t = new Date(); t.setHours(0,0,0,0); return Math.round((t - isoToDate(iso)) / 86400000); }
function todayISO(){ const t = new Date(); return t.getFullYear() + '-' + String(t.getMonth()+1).padStart(2,'0') + '-' + String(t.getDate()).padStart(2,'0'); }
function toISO(v){
  v = clean(v); if (!v) return '';
  let m = /^Date\((\d+),(\d+),(\d+)/.exec(v);
  if (m) return m[1] + '-' + String(+m[2]+1).padStart(2,'0') + '-' + String(m[3]).padStart(2,'0');
  m = /^(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})/.exec(v);
  if (m) return m[1] + '-' + m[2].padStart(2,'0') + '-' + m[3].padStart(2,'0');
  m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})/.exec(v);
  if (m) { let y = +m[3]; if (y > 2400) y -= 543; return y + '-' + m[2].padStart(2,'0') + '-' + m[1].padStart(2,'0'); }
  return '';
}
const showSpinner = (m, sub) => { $('spinnerMsg').textContent = m || 'กำลังโหลด...'; $('spinnerSub').textContent = sub || ''; $('spinner').classList.add('show'); };
const hideSpinner = () => $('spinner').classList.remove('show');

function showToast(msg, type){ const t = document.createElement('div'); t.className = 'toast toast-' + (type||'info'); t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 3500); }
const lsGet = k => { try { return JSON.parse(localStorage.getItem(k)); } catch(e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch(e) { return false; } };

/* ════════ Google Sheet (gviz JSONP — ใช้ได้ทั้งไฟล์ในเครื่องและ GitHub Pages) ════════ */
function gviz(sheetId, tab, tq, timeoutMs){
  return new Promise((resolve, reject) => {
    const cb = '__rcc_cb' + Date.now() + Math.floor(Math.random()*100000);
    const s = document.createElement('script');
    const timer = setTimeout(() => { cleanup(); reject(new Error('หมดเวลารอข้อมูลจากชีต')); }, timeoutMs || 60000);
    function cleanup(){ clearTimeout(timer); window[cb] = function(){}; s.remove(); }
    window[cb] = res => { cleanup(); (res && res.status !== 'error') ? resolve(res) : reject(new Error((res && res.errors && res.errors[0] && (res.errors[0].detailed_message || res.errors[0].message)) || 'ชีตตอบกลับผิดพลาด')); };
    let url = 'https://docs.google.com/spreadsheets/d/' + sheetId + '/gviz/tq?tqx=responseHandler:' + cb + '&sheet=' + encodeURIComponent(tab) + '&headers=1';
    if (tq) url += '&tq=' + encodeURIComponent(tq);
    s.src = url;
    s.onerror = () => { cleanup(); reject(new Error('เชื่อมต่อ Google Sheet ไม่ได้')); };
    document.head.appendChild(s);
  });
}
function cellVal(c){ if (c == null || c.v == null) return ''; const v = c.v; if (typeof v === 'number') return String(v); return String(v); }
function tableToObjects(res){
  const cols = res.table.cols.map(c => clean(c.label || c.id));
  return res.table.rows.map(r => { const o = {}; cols.forEach((k, i) => { o[k] = clean(cellVal(r.c[i])); }); return o; });
}

let UNITS_GLOBAL = null;       // {ts, pairs:[[sku, unit], ...]}

  } catch (e) {
    rows = tableToObjects(await gviz(CFG.custSheet, CFG.custTab, '', 90000)).filter(r => String(r['เซลล์ผู้ดูแล']||'').indexOf(CFG.salesKey) >= 0);
  }
  return rows.map(r => ({
    code: r['รหัส บีพลัส'], name: r['ชื่อร้านค้า'], addr: [r['ที่อยู่'], r['หมู่'] ? 'ม.' + r['หมู่'] : ''].filter(Boolean).join(' '),
    area: r['ต.,อ.,จ. ขอพร'], phone: r['เบอร์โทร'], loc: r['Location'], type: r['ประเภทร้านค้าขอพร'], route: r['ชื่อรูท'],
    routeArea: r['ชื่อรูท-ตำบล'], seq: r['ลำดับร้าน'], deliv: r['วันส่ง'], F: r['F'], avg3m: r['ยอดขายเฉลี่ย3เดือน'], photo: r['รูป'],
    contact: r['ชื่อผู้ติดต่อ'], roo: r['ROO'], creditDays: r['วันเครดิต'], credit: r['ยอดเงินเครดิต'], note: r['หมายเหตุร้านค้า'], truck: r['ประเภทรถ']
  })).filter(c => c.code || c.name);
}
async function fetchSales(){
  const res = await gviz(CFG.salesSheet, CFG.salesTab, "select A,B,C,D,E,F,I,J,K,L,M,N where F contains '" + CFG.salesKey + "'", 240000);
  const cols = res.table.cols.map(c => clean(c.label || c.id));
  const ix = k => cols.indexOf(k);
  const I = {d:ix('DI_DATE'), ref:ix('DI_REF'), code:ix('AR_CODE'), name:ix('AR_NAME'), sl:ix('SLMN_NAME'), sku:ix('SKU_NAME'), unit:ix('TRD_UTQNAME'), q:ix('TRD_QTY'), fr:ix('TRD_Q_FREE'), p:ix('TRD_U_PRC'), amt:ix('TRD_G_AMT')};
  if (I.d < 0 || I.code < 0 || I.sku < 0) throw new Error('โครงสร้างชีต DS_DC เปลี่ยน');
  const skus = [], units = [], skuIx = {}, unitIx = {}, names = {}, lines = [];
  res.table.rows.forEach(r => {
    const g = i => i < 0 ? '' : clean(cellVal(r.c[i]));
    const d = toISO(r.c[I.d] && (r.c[I.d].f && /^\d{4}\//.test(r.c[I.d].f) ? r.c[I.d].f : cellVal(r.c[I.d])));
    const code = g(I.code); if (!d || !code) return;
    const sku = normSku(g(I.sku)); const unit = g(I.unit);
    if (!(sku in skuIx)) { skuIx[sku] = skus.length; skus.push(sku); }
    if (!(unit in unitIx)) { unitIx[unit] = units.length; units.push(unit); }
    if (!names[code]) names[code] = g(I.name);
    lines.push([d, g(I.ref), code, skuIx[sku], unitIx[unit], num(g(I.q)), num(g(I.fr)), num(g(I.p)), num(g(I.amt)), /ROO/i.test(g(I.sl)) ? 1 : 0]);
  });
  return {skus, units, names, lines};
}
async function fetchUnitsGlobal(){
  const res = await gviz(CFG.salesSheet, CFG.salesTab, 'select I, J, count(A) group by I, J', 240000);
  const pairs = res.table.rows.map(r => [normSku(cellVal(r.c[0])), clean(cellVal(r.c[1]))]).filter(p => p[0] && p[1]);
  return {ts: Date.now(), pairs};
}

let loadingNow = false;
async function loadData(force){
  if (loadingNow) return; loadingNow = true;
  const cached = lsGet(LS_DATA);
  const fresh = cached && cached.lines && (Date.now() - cached.ts < DATA_TTL);
  if (cached && cached.lines && !DB) { DB = cached; buildModel(); renderAll(); }
  if (fresh && !force) { loadingNow = false; loadUnitsBg(); return; }
  const silent = !!DB;
  const t0 = Date.now(); let tick = null;
  if (silent) $('syncPill').classList.add('show');
  else {
    showSpinner('กำลังดึงข้อมูลร้านค้า + ประวัติการซื้อ', 'ชีต DS_DC มีข้อมูลมาก อาจใช้เวลา 30–60 วินาที');
    tick = setInterval(() => { $('spinnerSub').textContent = 'ชีต DS_DC มีข้อมูลมาก อาจใช้เวลา 30–60 วินาที · ผ่านไป ' + Math.round((Date.now()-t0)/1000) + ' วินาที'; }, 1000);
  }
  setLoading(true);
  try {
    const [custs, sales] = await Promise.all([fetchCustomers(), fetchSales()]);

    buildModel(); renderAll();
    if (silent || force) showToast('อัพเดทข้อมูลเรียบร้อย ✓', 'success');
  } catch (e) {
    console.error(e);
    showToast('โหลดข้อมูลไม่สำเร็จ: ' + e.message, 'error');
    if (!DB) $('shopList').innerHTML = '<div class="empty">โหลดข้อมูลไม่สำเร็จ<br><small>' + esc(e.message) + '</small><br><br><button class="btn btn-primary" onclick="refreshData()">ลองใหม่</button></div>';
  } finally {

    hideSpinner(); setLoading(false); $('syncPill').classList.remove('show'); loadingNow = false;

  }
}

/* ════════ Units ════════ */
const UNIT_MEMO = {};
function parseUnit(u){
  if (UNIT_MEMO[u]) return UNIT_MEMO[u];
  const m = /^(.*?)x(\d+(?:\.\d+)?)\(([A-Za-z]+)\)$/.exec(clean(u));
  const r = m ? {name: m[1].trim() || 'หน่วย', f: parseFloat(m[2]) || 1, t: m[3].toUpperCase()} : {name: clean(u) || 'หน่วย', f: 1, t: 'EA'};
  r.label = r.f > 1 ? r.name + ' x' + fmtQ(r.f) : r.name;
  return (UNIT_MEMO[u] = r);
}
function addCat(sku, unit){
  const u = parseUnit(unit); const c = CAT[sku] || (CAT[sku] = {pack:null, big:null, hasEA:false, one:''});
  if (u.t === 'PA' || u.t === 'BPA') { if (!c.pack || u.f > c.pack.f) c.pack = {f:u.f, name:u.name}; }
  else if (u.t === 'CS' && u.f > 1) { if (!c.big || u.f > c.big.f) c.big = {f:u.f, name:u.name}; }
  else if (u.t === 'EA') c.hasEA = true;
  else if (u.f === 1 && !c.one) c.one = u.name;      // เช่น กส.x1(CS) → หน่วยเล็กสุดชื่อ "กส."
}
/* ชื่อหน่วยเล็กสุด: ปกติ = ชิ้น, ถ้าสินค้าขายเป็นหน่วยเดียว (กส.x1 / ชิ้นx1(CS)) ใช้ชื่อนั้น */
function baseOf(sku){ const c = CAT[sku]; return c && !c.hasEA && c.one ? c.one : 'ชิ้น'; }
function buildCatalog(){
  CAT = {};
  if (DB) DB.lines.forEach(l => addCat(DB.skus[l[3]], DB.units[l[4]]));
  if (UNITS_GLOBAL) UNITS_GLOBAL.pairs.forEach(p => addCat(p[0], p[1]));
}
function catOf(sku){ const c = CAT[sku] || {pack:null, big:null}; let pack = c.pack, big = c.big; if (pack && big && pack.f >= big.f) pack = null; return {pack, big}; }
/* แตกจำนวนชิ้น → ลัง / แพ็ค / ชิ้น */
function qtyChips(sku, pieces, cls){
  const c = catOf(sku), out = [];
  if (c.big) out.push('<span class="qchip ' + (cls||'') + '">' + fmtQ(pieces / c.big.f) + ' ' + esc(c.big.name) + '<small>x' + fmtQ(c.big.f) + '</small></span>');
  if (c.pack) out.push('<span class="qchip ' + (cls||'') + '">' + fmtQ(pieces / c.pack.f) + ' ' + esc(c.pack.name) + '<small>x' + fmtQ(c.pack.f) + '</small></span>');
  out.push('<span class="qchip ' + (cls||'') + '">' + fmtQ(pieces) + ' ' + esc(baseOf(sku)) + '</span>');
  return out.join('');
}
function priceChips(sku, ppp){
  if (!ppp) return '';
  const c = catOf(sku), out = [];
  if (c.big) out.push('<span class="qchip p">' + fmtB(ppp * c.big.f) + '/' + esc(c.big.name) + '</span>');
  if (c.pack) out.push('<span class="qchip p">' + fmtB(ppp * c.pack.f) + '/' + esc(c.pack.name) + '</span>');
  out.push('<span class="qchip p">' + fmtB(ppp) + '/' + esc(baseOf(sku)) + '</span>');
  return out.join('');
}

/* ════════ Model ════════ */
function buildModel(){
  buildCatalog();
  LINES_BY = new Map(); let from = '', to = '';
  DB.lines.forEach(l => {
    const o = {d:l[0], ref:l[1], code:l[2], sku:DB.skus[l[3]], unit:DB.units[l[4]], q:l[5], free:l[6], p:l[7], amt:l[8], roo:l[9]};
    if (!LINES_BY.has(o.code)) LINES_BY.set(o.code, []);
    LINES_BY.get(o.code).push(o);
    if (!from || o.d < from) from = o.d; if (!to || o.d > to) to = o.d;
  });
  PERIOD = {from, to};
  SHOPS = []; SHOP_BY = new Map();
  const seen = new Set();
  DB.custs.forEach(c => { if (seen.has(c.code)) return; seen.add(c.code); SHOPS.push(Object.assign({}, c)); });
  LINES_BY.forEach((ls, code) => { if (!seen.has(code)) { seen.add(code); SHOPS.push({code, name: DB.names[code] || code, extra:true, route:'', area:''}); } });
  SHOPS.forEach(s => {
    const ls = LINES_BY.get(s.code) || [];
    const dates = new Set(ls.map(l => l.d)); let tot = 0; ls.forEach(l => tot += l.amt);
    s.rounds = dates.size; s.total = tot; s.avg = dates.size ? tot / dates.size : 0;
    s.last = ls.reduce((m, l) => l.d > m ? l.d : m, '');
    SHOP_BY.set(s.code, s);
  });
  $('dataStamp').textContent = 'ข้อมูล ' + shortThaiDate(PERIOD.from) + '–' + formatThaiDate(PERIOD.to);
}
const MODEL_MEMO = new Map();
function shopModel(code){
  const ls = LINES_BY.get(code) || [];
  const dates = [...new Set(ls.map(l => l.d))].sort().reverse();       // ล่าสุดก่อน
  const rounds = dates.map((d, i) => ({d, no: dates.length - i, refs: new Set(), items: new Map(), total: 0, lines: 0}));
  const rByD = new Map(rounds.map(r => [r.d, r]));
  const skuMap = new Map();
  ls.forEach(l => {
    const u = parseUnit(l.unit), r = rByD.get(l.d);
    r.refs.add(l.ref); r.total += l.amt; r.lines++;
    let it = r.items.get(l.sku);
    if (!it) { it = {sku:l.sku, pieces:0, free:0, amt:0, paidPieces:0, ord:{}, freeOrd:{}, lines:[]}; r.items.set(l.sku, it); }
    it.pieces += l.q * u.f; it.free += l.free * u.f; it.amt += l.amt; it.lines.push(l);
    if (l.q > 0) { it.ord[l.unit] = (it.ord[l.unit] || 0) + l.q; if (l.amt > 0) it.paidPieces += l.q * u.f; }
    if (l.free > 0) it.freeOrd[l.unit] = (it.freeOrd[l.unit] || 0) + l.free;
    let s = skuMap.get(l.sku);
    if (!s) { s = {sku:l.sku, byD:new Map(), pieces:0, free:0, amt:0, unitCnt:{}}; skuMap.set(l.sku, s); }
    s.pieces += l.q * u.f; s.free += l.free * u.f; s.amt += l.amt;
    if (l.q > 0) s.unitCnt[l.unit] = (s.unitCnt[l.unit] || 0) + 1;
  });
  rounds.forEach(r => r.items.forEach(it => { it.ppp = it.paidPieces ? it.amt / it.paidPieces : 0; const s = skuMap.get(it.sku); s.byD.set(r.d, it); }));
  const latest = dates[0];
  skuMap.forEach(s => {
    const bought = dates.filter(d => s.byD.has(d) && s.byD.get(d).pieces > 0);
    s.roundsBought = bought.length;
    s.last = bought[0] || ''; s.lastAny = dates.find(d => s.byD.has(d)) || '';
    const priced = dates.filter(d => s.byD.has(d) && s.byD.get(d).ppp > 0);
    s.lastPpp = priced.length ? s.byD.get(priced[0]).ppp : 0;
    s.prevPpp = priced.length > 1 ? s.byD.get(priced[1]).ppp : 0;
    s.priceChg = (s.lastPpp && s.prevPpp && Math.abs(s.lastPpp - s.prevPpp) > 0.004) ? s.lastPpp - s.prevPpp : 0;
    const mu = Object.entries(s.unitCnt).sort((a, b) => b[1] - a[1] || parseUnit(b[0]).f - parseUnit(a[0]).f)[0];
    s.mainUnit = mu ? mu[0] : (s.byD.size ? s.byD.values().next().value.lines[0].unit : '');
    s.mu = parseUnit(s.mainUnit);
    s.avgBought = s.roundsBought ? s.pieces / s.roundsBought : 0;     // ชิ้น/รอบที่ซื้อ
    s.avgAll = dates.length ? s.pieces / dates.length : 0;            // ชิ้น/รอบทั้งหมด
    s.freq = dates.length ? s.roundsBought / dates.length : 0;
    s.missLatest = s.roundsBought >= 2 && !(s.byD.has(latest) && s.byD.get(latest).pieces > 0);
    s.gap = s.last ? dates.indexOf(s.last) : dates.length;            // ไม่ได้ซื้อมากี่รอบ
    s.suggest = s.roundsBought ? Math.max(1, Math.round(s.avgBought / s.mu.f)) : 0;
  });
  return {code, dates, rounds, skus:[...skuMap.values()], latest};
}

const STATE = {shop:null, route:null, q:'', filterC:'all'};
function toggleDark(){ document.body.classList.toggle('dark'); lsSet(LS_DARK, document.body.classList.contains('dark')); }

/* ════════ Shop list ════════ */
function renderAll(){ renderRouteChips(); renderShopList(); renderCard(); }
function renderRouteChips(){
  const counts = {}; SHOPS.forEach(s => { const r = s.route || 'อื่นๆ'; counts[r] = (counts[r] || 0) + 1; });
  const order = ['จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์','อาทิตย์'];
  const keys = Object.keys(counts).sort((a, b) => { const ia = order.indexOf(a), ib = order.indexOf(b); return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib) || a.localeCompare(b, 'th'); });
  if (STATE.route === null) { const td = DAYS[new Date().getDay()]; STATE.route = counts[td] ? td : 'all'; }
  $('routeChips').innerHTML = '<button class="chip' + (STATE.route === 'all' ? ' active' : '') + '" onclick="setRoute(\'all\')">ทั้งหมด<span class="n">' + SHOPS.length + '</span></button>' +
    keys.map(k => '<button class="chip' + (STATE.route === k ? ' active' : '') + '" onclick="setRoute(\'' + esc(k) + '\')">' + (order.indexOf(k) >= 0 ? 'รูท' : '') + esc(k) + (k === DAYS[new Date().getDay()] ? ' • วันนี้' : '') + '<span class="n">' + counts[k] + '</span></button>').join('');
}
function setRoute(r){ STATE.route = r; renderRouteChips(); renderShopList(); }
function renderShopList(){
  const q = clean(STATE.q).toLowerCase();
  let list = SHOPS.filter(s => STATE.route === 'all' || (s.route || 'อื่นๆ') === STATE.route);
  if (q) list = list.filter(s => [s.name, s.code, s.area, s.routeArea, s.contact].join(' ').toLowerCase().indexOf(q) >= 0);
  list.sort((a, b) => (num(a.seq) || 9999) - (num(b.seq) || 9999) || (b.last || '').localeCompare(a.last || '') || String(a.name).localeCompare(String(b.name), 'th'));
  $('listCount').textContent = list.length + ' ร้าน';
  if (!list.length) { $('shopList').innerHTML = '<div class="empty">ไม่พบร้านที่ค้นหา</div>'; return; }
  $('shopList').innerHTML = list.map(s => {
    const ago = s.last ? daysAgo(s.last) : null;
    const lastBadge = s.last ? '<span class="badge ' + (ago > 14 ? 'badge-danger' : ago > 7 ? 'badge-warn' : 'badge-ok') + '">ซื้อล่าสุด ' + shortThaiDate(s.last) + ' (' + ago + ' วัน)</span>' : '<span class="badge badge-danger">ไม่มีการซื้อในช่วงข้อมูล</span>';
    return '<button class="shop-item' + (STATE.shop === s.code ? ' sel' : '') + (s.rounds ? '' : ' nobuy') + '" onclick="openShop(\'' + esc(s.code) + '\')">' +
      '<div class="t">' + (s.seq ? '<span class="seq">#' + esc(s.seq) + '</span>' : '') + '<span>' + esc(s.name) + '</span></div>' +
      '<div class="m">' + esc(s.code) + (s.routeArea ? ' · ' + esc(s.routeArea) : '') + (s.extra ? ' · ไม่อยู่ในชีต Customer' : '') + '</div>' +
      '<div class="s">' + lastBadge + (s.rounds ? '<span class="badge badge-gold">' + s.rounds + ' รอบ · เฉลี่ย ' + fmtBi(s.avg) + '/รอบ</span>' : '') + (s.roo ? '<span class="badge badge-info">ROO</span>' : '') + '</div>' +
      '</button>';
  }).join('');
}
function openShop(code){
  STATE.shop = code; STATE.filterC = 'all';
  document.body.classList.add('has-shop');
  renderShopList(); renderCard();
  window.scrollTo({top:0});
}
function backToList(){ document.body.classList.remove('has-shop'); $('propbar').classList.remove('show'); window.scrollTo({top:0}); }

/* ════════ Shop card (common head) ════════ */
function shopHeadHTML(s, M){
  const ll = /(-?\d+\.\d+)\s*,\s*(-?\d+\.\d+)/.exec(s.loc || '');
  const photo = /^https?:\/\//i.test(s.photo || '') ? s.photo : '';
  const tot = M.rounds.reduce((a, r) => a + r.total, 0);
  const last = M.latest;
  return '<button class="btn btn-outline btn-sm back-btn" onclick="backToList()">← รายชื่อร้าน</button>' +
  '<div class="card card-gold">' +
    '<div class="shop-head">' +
      (photo ? '<img class="shop-photo" loading="lazy" src="' + esc(photo) + '" alt="" onclick="openPhoto(this.src)" onerror="this.outerHTML=\'<div class=&quot;shop-photo ph&quot;>🏪</div>\'">' : '<div class="shop-photo ph">🏪</div>') +
      '<div style="min-width:0;flex:1">' +
        '<div class="code">' + esc(s.code) + (s.seq ? ' · ลำดับ ' + esc(s.seq) : '') + '</div>' +
        '<h2>' + esc(s.name) + '</h2>' +
        '<div class="row">' + (s.F ? '<span class="badge badge-gold">' + esc(s.F) + '</span>' : '') + (s.type ? '<span class="badge badge-mute">' + esc(s.type) + '</span>' : '') + (s.roo ? '<span class="badge badge-info">ROO</span>' : '') + (s.extra ? '<span class="badge badge-warn">ไม่อยู่ในชีต Customer</span>' : '') + '</div>' +
        (s.addr || s.area ? '<div class="row txt-muted">📍 ' + esc([s.addr, s.area].filter(Boolean).join(' ')) + '</div>' : '') +
        '<div class="row">' + (s.contact ? '<span>👤 ' + esc(s.contact) + '</span>' : '') + (s.phone ? '<a href="tel:' + esc(s.phone) + '">📞 ' + esc(s.phone) + '</a>' : '') + (ll ? '<a target="_blank" rel="noopener" href="https://www.google.com/maps?q=' + ll[1] + ',' + ll[2] + '">🗺️ แผนที่</a>' : '') + '</div>' +
      '</div>' +
    '</div>' +
    '<div class="shop-facts">' +
      '<div><span>รูท / วันส่ง</span><b>' + esc(s.route || '-') + ' / ' + esc(s.deliv || '-') + '</b></div>' +
      '<div><span>ซื้อในช่วงข้อมูล</span><b>' + M.rounds.length + ' รอบ</b></div>' +
      '<div><span>ยอดเฉลี่ย/รอบ</span><b>' + (M.rounds.length ? fmtBi(tot / M.rounds.length) : '-') + '</b></div>' +
      '<div><span>ซื้อล่าสุด</span><b>' + (last ? formatThaiDate(last) + ' <small class="txt-muted">(' + daysAgo(last) + ' วัน)</small>' : '-') + '</b></div>' +
      '<div><span>ยอดขายเฉลี่ย 3 เดือน</span><b>' + (num(s.avg3m) ? fmtBi(num(s.avg3m)) : '-') + '</b></div>' +
      '<div><span>วงเงิน / เครดิต</span><b>' + (num(s.credit) ? fmtBi(num(s.credit)) : '-') + ' / ' + esc(s.creditDays || '0') + ' วัน</b></div>' +
      '<div><span>ยอดรวมช่วงข้อมูล</span><b>' + fmtBi(tot) + '</b></div>' +
      '<div><span>สินค้าที่เคยซื้อ</span><b>' + M.skus.length + ' รายการ</b></div>' +
    '</div>' +
  '</div>' +
  '<div class="period">ข้อมูลจากชีต DS_DC ช่วง ' + formatThaiDate(PERIOD.from) + ' – ' + formatThaiDate(PERIOD.to) + ' · 1 รอบ = 1 วันที่ออกบิล</div>';
}
function openPhoto(src){ $('lbImg').src = src; $('lightbox').classList.add('open'); }

function renderCard(){
  const pane = $('cardPane');
  $('propbar').classList.remove('show');
  if (!DB) return;
  if (!STATE.shop || !SHOP_BY.has(STATE.shop)) { pane.innerHTML = '<div class="empty">เลือกร้านจากรายการ เพื่อดูคอลการ์ด</div>'; return; }
  const s = SHOP_BY.get(STATE.shop), M = shopModel(s.code);
  let body;
  if (!M.rounds.length) body = '<div class="card empty">ร้านนี้ยังไม่มีประวัติการซื้อในชีต DS_DC ช่วงนี้<br><small>ลองเสนอสินค้าขายดีของรูทนี้</small></div>';
  else body = proposalView(s, M);
  pane.innerHTML = shopHeadHTML(s, M) + body;
  if (M.rounds.length) updatePropBar();
}

/* ════════ การ์ดเสนอขาย ════════ */
let PROP = lsGet(LS_PROP) || {};
function propOf(code, k){
  const p = PROP[code] || (PROP[code] = {});
  if (!p[k.sku]) p[k.sku] = {on: k.missLatest || k.freq >= .5, qty: k.suggest};
  return p[k.sku];
}
function saveProp(){ lsSet(LS_PROP, PROP); }
function setFilterC(f){ STATE.filterC = f; renderCard(); }
function proposalView(s, M){
  const tot = M.rounds.reduce((a, r) => a + r.total, 0);
  const opp = M.skus.filter(k => k.missLatest), reg = M.skus.filter(k => k.freq >= .5), chg = M.skus.filter(k => k.priceChg);
  const gaps = M.rounds.slice(0, -1).map((r, i) => (isoToDate(r.d) - isoToDate(M.rounds[i + 1].d)) / 86400000);
  const avgGap = gaps.length ? gaps.reduce((a, b) => a + b, 0) / gaps.length : 0;
  const next = avgGap ? new Date(isoToDate(M.latest).getTime() + avgGap * 86400000) : null;
  let h = '<div class="stat-grid">' +
    '<div class="stat-card"><div class="s-label">ยอดเฉลี่ยต่อรอบ</div><div class="s-value">' + fmtBi(tot / M.rounds.length) + '</div><div class="s-sub">' + M.rounds.length + ' รอบ · รวม ' + fmtBi(tot) + '</div></div>' +
    '<div class="stat-card"><div class="s-label">ซื้อล่าสุด</div><div class="s-value">' + daysAgo(M.latest) + ' วัน</div><div class="s-sub">' + formatThaiDate(M.latest) + (avgGap ? ' · ซื้อทุก ~' + fmtQ(avgGap) + ' วัน' : '') + '</div></div>' +
    '<div class="stat-card" style="border-top-color:var(--warning)"><div class="s-label">ควรเสนอ (ขาดรอบล่าสุด)</div><div class="s-value" style="color:#c27c00">' + opp.length + '</div><div class="s-sub">จาก ' + M.skus.length + ' สินค้าที่เคยซื้อ</div></div>' +
    '<div class="stat-card" style="border-top-color:var(--success)"><div class="s-label">สินค้าประจำ (≥50% ของรอบ)</div><div class="s-value" style="color:#1e9e57">' + reg.length + '</div><div class="s-sub">' + (next ? 'คาดว่าจะสั่งรอบหน้า ~' + formatThaiDate(next.getFullYear() + '-' + String(next.getMonth()+1).padStart(2,'0') + '-' + String(next.getDate()).padStart(2,'0')) : '&nbsp;') + '</div></div>' +
    '</div>';
  const F = [['all','ทั้งหมด', M.skus.length], ['opp','ควรเสนอ', opp.length], ['reg','ประจำ', reg.length], ['chg','ราคาเปลี่ยน', chg.length], ['sel','ในใบเสนอ', M.skus.filter(k => propOf(M.code, k).on).length]];
  h += '<div class="toolrow"><div class="chips" style="padding:0">' + F.map(f => '<button class="chip' + (STATE.filterC === f[0] ? ' active' : '') + '" onclick="setFilterC(\'' + f[0] + '\')">' + f[1] + '<span class="n">' + f[2] + '</span></button>').join('') + '</div><span class="grow"></span>' +
    '<button class="btn btn-outline btn-sm" onclick="resetProp()">↺ คำนวณใหม่</button><button class="btn btn-outline btn-sm" onclick="exportShop()">⬇ Excel ประวัติ</button></div>';
  let list = M.skus;
  if (STATE.filterC === 'opp') list = opp; else if (STATE.filterC === 'reg') list = reg; else if (STATE.filterC === 'chg') list = chg; else if (STATE.filterC === 'sel') list = M.skus.filter(k => propOf(M.code, k).on);
  list = [...list].sort((a, b) => (b.missLatest - a.missLatest) || (b.freq - a.freq) || (b.amt - a.amt));
  const chron = [...M.rounds].reverse();
  h += '<div class="sku-grid">' + list.map(k => {
    const idx = M.skus.indexOf(k), p = propOf(M.code, k);
    const c = catOf(k.sku);
    const lastIt = k.last ? k.byD.get(k.last) : null;
    const lastTxt = lastIt ? Object.entries(lastIt.ord).map(([u, q]) => fmtQ(q) + ' ' + esc(parseUnit(u).name)).join(' + ') + ' · ' + shortThaiDate(k.last) : '-';
    const avgU = fmtQ(k.avgBought / k.mu.f) + ' ' + esc(k.mu.name);
    const sub = []; if (c.big && c.big.f !== k.mu.f) sub.push(fmtQ(k.avgBought / c.big.f) + ' ' + esc(c.big.name)); if (c.pack && c.pack.f !== k.mu.f) sub.push(fmtQ(k.avgBought / c.pack.f) + ' ' + esc(c.pack.name)); if (k.mu.f !== 1) sub.push(fmtQ(k.avgBought) + ' ' + esc(baseOf(k.sku)));
    const unitPrice = k.lastPpp * k.mu.f;
    return '<div class="sku-card ' + (k.missLatest ? 'opp' : k.freq >= .5 ? 'reg' : '') + (p.on ? ' on' : '') + '">' +
      '<div class="top"><div class="nm" style="cursor:pointer" onclick="openSku(\'' + esc(M.code) + '\',' + idx + ')">' + esc(k.sku) + '</div>' +
        (k.missLatest ? '<span class="badge badge-warn">ขาด ' + k.gap + ' รอบ</span>' : k.freq >= .5 ? '<span class="badge badge-ok">ประจำ</span>' : '') + '</div>' +
      '<div class="dots" title="เก่า → ล่าสุด">' + chron.map((r, i) => '<span class="dot' + (k.byD.has(r.d) && k.byD.get(r.d).pieces > 0 ? ' on' : '') + (i === chron.length - 1 ? ' last' : '') + '" title="' + formatThaiDate(r.d) + '"></span>').join('') + '<span style="margin-left:4px">ซื้อ ' + k.roundsBought + '/' + M.rounds.length + ' รอบ</span></div>' +
      '<div class="kv"><span>เฉลี่ย/รอบ</span><b>' + avgU + (sub.length ? ' <small class="txt-muted" style="font-weight:400">= ' + sub.join(' = ') + '</small>' : '') + '</b>' +
        '<span>ล่าสุด</span><b>' + lastTxt + '</b>' +
        '<span>ราคา</span><b>' + (unitPrice ? fmtB(unitPrice) + '/' + esc(k.mu.name) + ' <small class="txt-muted" style="font-weight:400">(' + fmtB(k.lastPpp) + '/' + esc(baseOf(k.sku)) + (c.pack && c.pack.f !== k.mu.f ? ' · ' + fmtB(k.lastPpp * c.pack.f) + '/' + esc(c.pack.name) : '') + ')</small>' : '-') +
          (k.priceChg ? ' <span class="' + (k.priceChg > 0 ? 'up' : 'down') + '">' + (k.priceChg > 0 ? '▲' : '▼') + fmtB(Math.abs(k.priceChg * k.mu.f)) + '</span>' : '') + '</b></div>' +
      '<div class="prop-row"><button class="tick' + (p.on ? ' on' : '') + '" onclick="togProp(' + idx + ')" title="ใส่ในใบเสนอ">' + (p.on ? '✓' : '+') + '</button>' +
        '<div class="lbl">เสนอ <b>' + esc(k.mu.name) + '</b><br>' + (unitPrice ? '≈ ' + fmtBi(unitPrice * p.qty) : '') + '</div>' +
        '<div class="stepper"><button onclick="stepProp(' + idx + ',-1)">−</button><input type="number" inputmode="numeric" min="0" value="' + p.qty + '" onchange="setPropQty(' + idx + ',this.value)"><button onclick="stepProp(' + idx + ',1)">+</button></div></div>' +
    '</div>';
  }).join('') + '</div>';
  if (!list.length) h += '<div class="card empty">ไม่มีสินค้าในกลุ่มนี้</div>';
  return h;
}
function curModel(){ return shopModel(STATE.shop); }
function togProp(i){ const M = curModel(), k = M.skus[i], p = propOf(M.code, k); p.on = !p.on; if (p.on && !p.qty) p.qty = Math.max(1, k.suggest); saveProp(); renderCard(); }
function stepProp(i, d){ const M = curModel(), k = M.skus[i], p = propOf(M.code, k); p.qty = Math.max(0, (p.qty || 0) + d); p.on = p.qty > 0; saveProp(); renderCard(); }
function setPropQty(i, v){ const M = curModel(), k = M.skus[i], p = propOf(M.code, k); p.qty = Math.max(0, Math.round(num(v))); p.on = p.qty > 0; saveProp(); renderCard(); }
function resetProp(){ delete PROP[STATE.shop]; saveProp(); renderCard(); showToast('คำนวณจำนวนแนะนำใหม่จากค่าเฉลี่ย', 'info'); }
function proposalItems(){
  const M = curModel();
  return M.skus.filter(k => { const p = propOf(M.code, k); return p.on && p.qty > 0; }).map(k => { const p = propOf(M.code, k); const price = k.lastPpp * k.mu.f; return {k, qty: p.qty, price, amt: price * p.qty}; });
}
function updatePropBar(){
  const items = proposalItems(); const tot = items.reduce((a, x) => a + x.amt, 0);
  $('propSum').innerHTML = 'ใบเสนอ ' + items.length + ' รายการ · <b>' + fmtB(tot) + '</b>';
  $('propSub').textContent = 'ราคาตามบิลล่าสุดของร้าน · จำนวนแนะนำ = เฉลี่ยต่อรอบที่ซื้อ';
  $('propbar').classList.add('show');
}
function copyProposal(){
  const s = SHOP_BY.get(STATE.shop), items = proposalItems();
  if (!items.length) { showToast('ยังไม่ได้เลือกสินค้า', 'warning'); return; }
  const tot = items.reduce((a, x) => a + x.amt, 0);
  const txt = ['📋 ใบเสนอสินค้า', s.name + ' (' + s.code + ')', 'วันที่ ' + formatThaiDate(todayISO()), '']
    .concat(items.map((x, i) => (i + 1) + ') ' + x.k.sku + ' — ' + x.qty + ' ' + x.k.mu.name + (x.price ? ' × ' + fmtB(x.price) + ' = ' + fmtB(x.amt) : '')))
    .concat(['', 'รวมประมาณ ' + fmtB(tot), 'เซลล์: ' + CFG.salesFull]).join('\n');
  (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => showToast('คัดลอกแล้ว วางใน LINE ได้เลย ✓', 'success')).catch(() => { prompt('คัดลอกข้อความนี้', txt); });
}
function exportProposal(){
  if (!window.XLSX) { showToast('ตัวสร้าง Excel ยังโหลดไม่เสร็จ', 'warning'); return; }
  const s = SHOP_BY.get(STATE.shop), items = proposalItems();
  if (!items.length) { showToast('ยังไม่ได้เลือกสินค้า', 'warning'); return; }
  const rows = items.map((x, i) => ({'ลำดับ': i + 1, 'สินค้า': x.k.sku, 'หน่วย': x.k.mu.label, 'จำนวนเสนอ': x.qty, 'ราคา/หน่วย': Math.round(x.price * 100) / 100, 'จำนวนเงิน': Math.round(x.amt * 100) / 100, 'เฉลี่ย/รอบ (ชิ้น)': Math.round(x.k.avgBought * 100) / 100, 'ซื้อกี่รอบ': x.k.roundsBought}));
  const ws = XLSX.utils.json_to_sheet(rows), wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'ใบเสนอ');
  XLSX.writeFile(wb, 'Rattana Call Card - เสนอขาย ' + s.code + ' ' + todayISO() + '.xlsx');
}

/* ════════ SKU detail modal ════════ */
function openSku(code, i){
  const M = shopModel(code), k = M.skus[i]; if (!k) return;
  $('mTitle').textContent = k.sku;
  let h = '<div class="qchips" style="margin-bottom:10px">' + '<span class="qchip q">ซื้อ ' + k.roundsBought + '/' + M.rounds.length + ' รอบ</span><span class="qchip q">เฉลี่ย ' + fmtQ(k.avgBought / k.mu.f) + ' ' + esc(k.mu.name) + '/รอบ</span><span class="qchip q">รวม ' + fmtBi(k.amt) + '</span></div>' +
    '<div class="txt-sm txt-muted" style="margin-bottom:4px">หน่วยบรรจุ</div><div class="qchips" style="margin-bottom:12px">' + qtyChips(k.sku, (catOf(k.sku).big || catOf(k.sku).pack || {f:1}).f) + '</div>' +
    '<div class="tbl-wrap" style="max-height:none"><table class="mtbl"><thead><tr><th>รอบ / วันที่</th><th>เอกสาร</th><th>สั่ง</th><th class="r">แถม</th><th class="r">ชิ้น</th><th class="r">ราคา/หน่วย</th><th class="r">฿/ชิ้น</th><th class="r">เงิน</th></tr></thead><tbody>';
  M.rounds.forEach(r => {
    const it = k.byD.get(r.d);
    if (!it) { h += '<tr><td>' + r.no + ' · ' + formatThaiDate(r.d) + '</td><td colspan="7" class="txt-muted">— ไม่ได้ซื้อ —</td></tr>'; return; }
    it.lines.forEach(l => { const u = parseUnit(l.unit);
      h += '<tr><td>' + r.no + ' · ' + formatThaiDate(r.d) + '</td><td class="txt-sm">' + esc(l.ref) + (l.roo ? ' <span class="badge badge-info">ROO</span>' : '') + '</td><td>' + (l.q ? fmtQ(l.q) + ' ' + esc(u.label) : '-') + '</td><td class="r">' + (l.free ? fmtQ(l.free) : '') + '</td><td class="r">' + fmtQ((l.q) * u.f) + '</td><td class="r">' + (l.amt ? fmtB(l.p) : '-') + '</td><td class="r">' + (l.amt && l.q ? fmtB(l.p / u.f) : '-') + '</td><td class="r">' + fmtB(l.amt) + '</td></tr>'; });
  });
  h += '</tbody></table></div>';
  $('mBody').innerHTML = h; $('skuModal').classList.add('open');
}
function closeModal(){ $('skuModal').classList.remove('open'); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeModal(); $('lightbox').classList.remove('open'); } });

/* ════════ Excel: ประวัติร้าน ════════ */
function exportShop(){
  if (!window.XLSX) { showToast('ตัวสร้าง Excel ยังโหลดไม่เสร็จ', 'warning'); return; }
  const s = SHOP_BY.get(STATE.shop), M = shopModel(s.code);
  const r2 = n => Math.round(n * 100) / 100;
  const rows = [];
  M.rounds.forEach(r => r.items.forEach(it => it.lines.forEach(l => {
    const u = parseUnit(l.unit), c = catOf(l.sku), pcs = l.q * u.f, ppp = l.q && l.amt ? l.p / u.f : 0;
    rows.push({'รอบ': r.no, 'วันที่': formatThaiDate(r.d), 'เลขที่เอกสาร': l.ref, 'สินค้า': l.sku, 'หน่วยที่สั่ง': u.label, 'จำนวน': l.q, 'แถม': l.free,
      'ชิ้น': r2(pcs), 'แพ็ค': c.pack ? r2(pcs / c.pack.f) : '', 'ลัง': c.big ? r2(pcs / c.big.f) : '',
      'ราคา/หน่วยที่สั่ง': l.p, 'ราคา/ชิ้น': ppp ? r2(ppp) : '', 'ราคา/แพ็ค': ppp && c.pack ? r2(ppp * c.pack.f) : '', 'ราคา/ลัง': ppp && c.big ? r2(ppp * c.big.f) : '', 'จำนวนเงิน': l.amt});
  })));
  const ws = XLSX.utils.json_to_sheet(rows), wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'ประวัติการซื้อ');
  XLSX.writeFile(wb, 'Rattana Call Card - ' + s.code + ' ' + todayISO() + '.xlsx');
}

/* ════════ Boot ════════ */
function measureTop(){ document.documentElement.style.setProperty('--top', $('topbar').offsetHeight + 'px'); }
window.addEventListener('resize', measureTop);
window.addEventListener('scroll', () => $('backToTop').classList.toggle('show', window.scrollY > 300));
(function boot(){
  if (lsGet(LS_DARK)) document.body.classList.add('dark');
  measureTop();
  loadData(false);
  setInterval(() => { if (!document.hidden) loadData(false); }, 5 * 60 * 1000);   // เช็คทุก 5 นาที (ดึงใหม่เมื่อแคชเกิน 30 นาที)
})();
</script>
