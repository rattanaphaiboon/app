/* JSONP ทั่วไป (Apps Script Web app) */
function jsonp(url, timeoutMs){
  return new Promise((resolve, reject) => {
    const cb = '__rcc_j' + Date.now() + Math.floor(Math.random()*1e6), s = document.createElement('script');
    const timer = setTimeout(() => { cleanup(); reject(new Error('หมดเวลารอตัวเตรียมข้อมูล')); }, timeoutMs || 30000);
    function cleanup(){ clearTimeout(timer); window[cb] = function(){}; s.remove(); }
    window[cb] = res => { cleanup(); resolve(res); };
    s.src = url + (url.indexOf('?') < 0 ? '?' : '&') + 'callback=' + cb + '&t=' + Date.now();
    s.onerror = () => { cleanup(); reject(new Error('เชื่อมต่อตัวเตรียมข้อมูลไม่ได้')); };

function gviz(sheetId, tab, tq, timeoutMs){
  return new Promise((resolve, reject) => {
    const cb = '__rcc_cb' + Date.now() + Math.floor(Math.random()*1e6);
    const s = document.createElement('script');
    const timer = setTimeout(() => { cleanup(); reject(new Error('หมดเวลารอข้อมูลจากชีต')); }, timeoutMs || 60000);
    function cleanup(){ clearTimeout(timer); window[cb] = function(){}; s.remove(); }
    window[cb] = res => { cleanup(); (res && res.status !== 'error') ? resolve(res) : reject(new Error((res && res.errors && res.errors[0] && (res.errors[0].detailed_message || res.errors[0].message)) || 'ชีตตอบกลับผิดพลาด')); };
    let url = 'https://docs.google.com/spreadsheets/d/' + sheetId + '/gviz/tq?tqx=responseHandler:' + cb + '&sheet=' + encodeURIComponent(tab) + '&headers=1';
    if (tq) url += '&tq=' + encodeURIComponent(tq);
    s.src = url;
    s.onerror = () => { cleanup(); reject(new Error('เชื่อมต่อ Google Sheet ไม่ได้')); };
    document.head.appendChild(s);
  });
}

const FULL_DAYS = 77;
async function fetchSales(from){
  const start = from || addDays(todayISO(), -FULL_DAYS);
  const wins = []; for (let a = start; a <= todayISO(); a = addDays(a, CHUNK_DAYS)) wins.push([a, addDays(a, CHUNK_DAYS)]);
  wins[wins.length - 1][1] = '';

  const parts = await settleLimited(wins.map(w => () => fetchSalesWindow(w[0], w[1]).then(r => { LOAD.done++; updateLoadUI(); return r; })), CHUNK_CONC);
  const failed = parts.filter(p => p.status === 'rejected');
  if (failed.length === parts.length) throw failed[0].reason;
  const weeks = wins.map((w, i) => ({a: w[0], b: w[1], ok: parts[i].status === 'fulfilled', rows: parts[i].status === 'fulfilled' ? parts[i].value : []}));

  inc.weeks.forEach(w => {

    const bad = !w.ok || (oldIn.length && !w.rows.length) || (oldIn.length >= 20 && w.rows.length < oldIn.length * 0.7);

/* ════════ v3.3: ประวัติ 3 เดือนก่อน จาก BigQuery (ผ่านตัวกลาง Apps Script ตัวเดียวกับแอพ Rattana Sales) ════════

async function bqFetch(codes){
  const u = CFG.bqProxy + '?action=custHistoryBatch&ccs=' + encodeURIComponent(codes.join(',')) + '&months=' + BQ_MONTHS;
  const ctrl = new AbortController(), timer = setTimeout(() => ctrl.abort(), 70000);
  try {

}

async function loadBqBg(force){
  if (BQ_STATE.loading || !DB || !CFG.bqProxy) return;
  const B = bqLocal();
  if (force) { B.shops = {}; B.t = 0; BQ_CLOSED = null; }
  const codes = [...new Set((DB.custs || []).map(c => clean(c.code)).concat(SHOPS.map(s => clean(s.code))))].filter(c => c && !/^NEW-/i.test(c) && !(c in B.shops));
  if (!codes.length) return;
  const chunks = []; for (let i = 0; i < codes.length; i += BQ_CHUNK) chunks.push(codes.slice(i, i + BQ_CHUNK));
  Object.assign(BQ_STATE, {loading:true, done:0, total:chunks.length, err:''});
  bqRepaint();
  let idx = 0;
  const worker = async () => {
    while (idx < chunks.length) {
      const part = chunks[idx++];
      try {
        const rows = await bqFetch(part), g = {};
        rows.forEach(r => {
          const cc = clean(r.customer_code), ym = String(r.month_year || '').replace('/', '-').slice(0, 7);
          if (cc && /^\d{4}-\d{2}$/.test(ym)) (g[cc] = g[cc] || []).push([ym, clean(r.product_code).replace(/^BC-/i, ''), clean(r.product_name), num(r.sales_cs), num(r.exvat)]);
        });
        part.forEach(cc => { B.shops[cc] = g[cc] || []; });
        if (!B.t) B.t = Date.now();
        BQ_CLOSED = null;
        if (!lsSet(B.key, B)) console.warn('localStorage เต็ม — ไม่ได้เก็บประวัติ BigQuery');
      } catch (e) { BQ_STATE.err = e.message; console.warn('[BQ]', e); }

}
function bqRepaint(){ if (['shop', 'sku', 'settings'].indexOf(routeParts()[0]) >= 0) render(true); }   // หน้าหลักไม่ใช้ข้อมูล BQ — ไม่วาดใหม่ (กันช่องค้นหาหลุดโฟกัส)
const bqNames = () => { const s = new Set(); Object.values(bqLocal().shops).forEach(rows => rows.forEach(r => s.add(normSku(r[2])))); return [...s]; };
/* ประวัติ BQ ของร้าน → สินค้า (รวมตามชื่อ) × เดือน · ยอดเป็นบาทรวม VAT */
function bqShop(code){
  const rows = bqLocal().shops[code]; if (!rows) return null;
  const items = new Map(), byMonth = {};
  rows.forEach(([ym, bc, name, cs, ex]) => {
    const key = nk(name) || bc; let it = items.get(key);
    if (!it) items.set(key, it = {name: normSku(name), bc, m: {}, cs: 0, baht: 0});
    const mm = it.m[ym] || (it.m[ym] = {cs: 0, baht: 0});
    mm.cs += cs; mm.baht += ex * VAT; it.cs += cs; it.baht += ex * VAT;

/* ยอดรายเดือนของสินค้า 1 ตัว: 3 เดือนก่อน + เดือนนี้ → [{ym, src:'bq'|'ds'|'', pieces|cs, baht}] */
function skuMonths(k){
  const closed = bqClosed(), cur = todayISO().slice(0, 7), csF = (catOf(k.sku).big || {}).f || 0;

    if (ym !== cur && closed.has(ym)) {
      const mm = k.bq && k.bq.m[ym];
      return {ym, src:'bq', cs: mm ? mm.cs : 0, pieces: csF ? (mm ? mm.cs * csF : 0) : null, baht: mm ? mm.baht : 0};
    }
    if (PERIOD.from && PERIOD.from <= ym + '-01') {      // บิลในเครื่องครอบทั้งเดือน
      let pieces = 0, baht = 0;

const UNIT_MEMO = {};
function parseUnit(u){
  if (UNIT_MEMO[u]) return UNIT_MEMO[u];
  const m = /^(.*?)x(\d+(?:\.\d+)?)\(([A-Za-z]+)\)$/.exec(clean(u));
  const r = m ? {name: m[1].trim() || 'หน่วย', f: parseFloat(m[2]) || 1, t: m[3].toUpperCase()} : {name: clean(u) || 'หน่วย', f: 1, t: 'EA'};
  r.label = r.f > 1 ? r.name + ' x' + fmtQ(r.f) : r.name;
  return (UNIT_MEMO[u] = r);
}
function addCat(sku, unit){
  const u = parseUnit(unit); const c = CAT[sku] || (CAT[sku] = {pack:null, big:null, hasEA:false, one:''});
  if (u.t === 'PA' || u.t === 'BPA' || u.t === 'BP') { if (!c.pack || u.f > c.pack.f) c.pack = {f:u.f, name:u.name}; }
  else if (u.t === 'CS' && u.f > 1) { if (!c.big || u.f > c.big.f) c.big = {f:u.f, name:u.name}; }
  else if (u.t === 'EA') c.hasEA = true;
  else if (u.f === 1 && !c.one) c.one = u.name;      // เช่น กส.x1(CS) → หน่วยเล็กสุดชื่อ "กส."
}
function baseOf(sku){ const c = CAT[sku]; return c && !c.hasEA && c.one ? c.one : 'ชิ้น'; }
function buildCatalog(){
  CAT = {};
  if (DB) DB.lines.forEach(l => addCat(DB.skus[l[3]], DB.units[l[4]]));
  if (PROD) Object.keys(PROD.map).forEach(k => PROD.map[k].units.forEach(u => addCat(k, u)));
}
function catOf(sku){ const c = CAT[sku] || {pack:null, big:null}; let pack = c.pack, big = c.big; if (pack && big && pack.f >= big.f) pack = null; return {pack, big}; }
function unitOpts(k){
  const c = catOf(k.sku), o = [];
  if (c.big) o.push({key:'big', f:c.big.f, name:c.big.name});
  if (c.pack) o.push({key:'pack', f:c.pack.f, name:c.pack.name});
  o.push({key:'ea', f:1, name:baseOf(k.sku)});
  if (!o.some(x => x.f === k.mu.f)) o.unshift({key:'main', f:k.mu.f, name:k.mu.name});
  return o;
}
let PROD_NK = null, PROD_NK_TS = 0;   // v3.3: หา PDDT ด้วยชื่อแบบไม่สนช่องว่าง (ชื่อจาก BigQuery)
function prodOf(sku){
  if (!PROD) return null;
  if (PROD.map[sku]) return PROD.map[sku];
  if (!PROD_NK || PROD_NK_TS !== PROD.ts) { PROD_NK = new Map(Object.keys(PROD.map).map(k => [nk(k), PROD.map[k]])); PROD_NK_TS = PROD.ts; }
  return PROD_NK.get(nk(sku)) || null;
}
const imgUrl = (id, sz) => 'https://lh3.googleusercontent.com/d/' + encodeURIComponent(id) + '=w' + sz;

/* Google จำกัดการโหลดรูปพร้อมกันจำนวนมาก → สลับไป Drive thumbnail แล้วหน่วงเวลาลองใหม่ สูงสุด 3 ครั้ง */
function imgErr(el){

function buildModel(){
  buildCatalog(); MODEL_MEMO.clear();
  LINES_BY = new Map(); let from = '', to = '';
  DB.lines.forEach(l => {
    const o = {d:l[0], ref:l[1], code:l[2], sku:DB.skus[l[3]], unit:DB.units[l[4]], q:l[5], free:l[6], p:l[7], amt:l[8], roo:l[9]};
    if (!LINES_BY.has(o.code)) LINES_BY.set(o.code, []);
    LINES_BY.get(o.code).push(o);
    if (!from || o.d < from) from = o.d; if (!to || o.d > to) to = o.d;
  });
  PERIOD = {from, to};
  const monthKey = todayISO().slice(0, 7);
  SHOPS = []; SHOP_BY = new Map();
  const seen = new Set();
  (DB.custs || []).forEach(c => { if (!c.code || seen.has(c.code)) return; seen.add(c.code); SHOPS.push(Object.assign({}, c)); });
  LINES_BY.forEach((ls, code) => { if (!seen.has(code)) { seen.add(code); SHOPS.push({code, name: (DB.names || {})[code] || code, extra:true, route:'', routeArea:''}); } });
  SHOPS.forEach(s => {
    const ls = LINES_BY.get(s.code) || [];
    const dates = new Set(), skus = new Set(); let tot = 0, month = 0;
    let cs = 0; const mDates = new Set();   // ลังรวมเดือนนี้ (หน่วยใหญ่สุดของสินค้า · ไม่มีลัง = นับหน่วยที่สั่ง)
    ls.forEach(l => { dates.add(l.d); skus.add(l.sku); tot += l.amt; if (l.d.slice(0, 7) === monthKey) month += l.amt;
      const u = parseUnit(l.unit), big = catOf(l.sku).big; if (l.d.slice(0, 7) === monthKey) { mDates.add(l.d); cs += big ? l.q * u.f / big.f : l.q; } });
    s.rounds = dates.size; s.total = tot; s.month = month; s.skuCount = skus.size; s.avg = dates.size ? tot / dates.size : 0;
    /* v5.0: เฉพาะเดือนนี้ — จำนวนรอบ + เฉลี่ยต่อรอบ (บาท/ลัง) */
    s.mRounds = mDates.size; s.avgM = mDates.size ? month / mDates.size : 0; s.avgCs = mDates.size ? cs / mDates.size : 0;
    s.last = ls.reduce((m, l) => l.d > m ? l.d : m, '');
    SHOP_BY.set(s.code, s);
  });
}
const noSales = () => !DB || !DB.lines.length;
function shopStatus(s){
  if (noSales()) return {cls:'rt-badge-neutral', icon:'clock', label:'รอข้อมูลบิล'};
  if (!s.last) return {cls:'rt-badge-danger', icon:'info', label:'ยังไม่ซื้อ'};
  const a = daysAgo(s.last);
  return a <= ACTIVE_DAYS ? {cls:'rt-badge-success', icon:'checkc', label:'Active'} : {cls:'rt-badge-warning', icon:'warn', label:'ห่างหาย ' + a + ' วัน'};
}

  irr:  {label:'ซื้อไม่ต่อเนื่อง', cls:'rt-badge-info', icon:'sync'},
  stop: {label:'หยุดซื้อ', cls:'rt-badge-warning', icon:'pause'},

};
const MODEL_MEMO = new Map();
function shopModel(code){
  if (MODEL_MEMO.has(code)) return MODEL_MEMO.get(code);
  const ls = LINES_BY.get(code) || [];
  const dates = [...new Set(ls.map(l => l.d))].sort().reverse();       // ล่าสุดก่อน
  const rounds = dates.map((d, i) => ({d, no: dates.length - i, refs: new Set(), items: new Map(), total: 0}));
  const rByD = new Map(rounds.map(r => [r.d, r]));
  const skuMap = new Map();
  ls.forEach(l => {
    const u = parseUnit(l.unit), r = rByD.get(l.d);
    r.refs.add(l.ref); r.total += l.amt;
    let it = r.items.get(l.sku);
    if (!it) { it = {sku:l.sku, pieces:0, free:0, amt:0, paidPieces:0, ord:{}, lines:[]}; r.items.set(l.sku, it); }
    it.pieces += l.q * u.f; it.free += l.free * u.f; it.amt += l.amt; it.lines.push(l);
    if (l.q > 0) { it.ord[l.unit] = (it.ord[l.unit] || 0) + l.q; if (l.amt > 0) it.paidPieces += l.q * u.f; }
    let s = skuMap.get(l.sku);
    if (!s) { s = {sku:l.sku, byD:new Map(), pieces:0, free:0, amt:0, unitCnt:{}, lines:[]}; skuMap.set(l.sku, s); }
    s.pieces += l.q * u.f; s.free += l.free * u.f; s.amt += l.amt; s.lines.push(l);
    if (l.q > 0) s.unitCnt[l.unit] = (s.unitCnt[l.unit] || 0) + 1;
  });
  rounds.forEach(r => r.items.forEach(it => { it.ppp = it.paidPieces ? it.amt / it.paidPieces : 0; skuMap.get(it.sku).byD.set(r.d, it); }));
  const latest = dates[0];
  skuMap.forEach(s => {
    const bought = dates.filter(d => s.byD.has(d) && s.byD.get(d).pieces > 0);
    s.bought = bought; s.roundsBought = bought.length;
    s.last = bought[0] || ''; s.lastAny = dates.find(d => s.byD.has(d)) || '';
    const priced = dates.filter(d => s.byD.has(d) && s.byD.get(d).ppp > 0);
    s.lastPpp = priced.length ? s.byD.get(priced[0]).ppp : 0;
    s.prevPpp = priced.length > 1 ? s.byD.get(priced[1]).ppp : 0;
    s.priceChg = (s.lastPpp && s.prevPpp && Math.abs(s.lastPpp - s.prevPpp) > 0.004) ? s.lastPpp - s.prevPpp : 0;
    const mu = Object.entries(s.unitCnt).sort((a, b) => b[1] - a[1] || parseUnit(b[0]).f - parseUnit(a[0]).f)[0];
    s.mainUnit = mu ? mu[0] : s.lines[0].unit;
    s.mu = parseUnit(s.mainUnit);
    s.avgBought = s.roundsBought ? s.pieces / s.roundsBought : 0;
    s.freq = dates.length ? s.roundsBought / dates.length : 0;
    s.gap = s.last ? dates.indexOf(s.last) : dates.length;          // ไม่ได้ซื้อมากี่รอบ
    s.missLatest = s.roundsBought >= 2 && s.gap >= 1;
    s.suggest = s.roundsBought ? Math.max(1, Math.round(s.avgBought / s.mu.f)) : 0;
    const asc = [...bought].reverse(); let gs = 0;
    for (let i = 1; i < asc.length; i++) gs += (isoToDate(asc[i]) - isoToDate(asc[i-1])) / 86400000;
    s.everyDays = asc.length > 1 ? gs / (asc.length - 1) : 0;
    const dAgo = s.last ? daysAgo(s.last) : 999;
    if (!s.roundsBought) s.status = 'stop';
    else if (s.roundsBought === 1 && s.gap === 0 && dates.length > 1) s.status = 'nw';
    else if (s.gap >= 3 || (s.gap >= 2 && dAgo > 21)) s.status = 'stop';
    else if (s.freq >= .5 && s.gap <= 1) s.status = 'reg';
    else s.status = 'irr';
    const lastIt = s.last ? s.byD.get(s.last) : null;
    s.lastPieces = lastIt ? lastIt.pieces : 0;
  });
  const M = {code, dates, rounds, skus:[...skuMap.values()], latest, bq:null, bqOnly:[]};
  /* v3.3: ผูกประวัติ BigQuery 3 เดือนก่อน — จับคู่ด้วยชื่อ (ไม่สนช่องว่าง) แล้วค่อยบาร์โค้ด PDDT
     ที่จับคู่ไม่ได้ = เคยซื้อเมื่อ 3 เดือนก่อน แต่ไม่มีในบิลช่วงนี้ (โอกาสเสนอขาย) */
  const B = bqShop(code);
  if (B) {
    M.bq = B;
    const used = new Set(), byBc = new Map();
    B.items.forEach(it => { if (it.bc) byBc.set(it.bc.replace(/^0+/, ''), it); });
    M.skus.forEach(s => {
      const p = prodOf(s.sku);
      const it = B.items.get(nk(s.sku)) || (p && p.bc ? byBc.get(String(p.bc).replace(/^0+/, '')) : null);
      if (it && !used.has(it)) { s.bq = it; used.add(it); }
    });
    M.bqOnly = [...B.items.values()].filter(it => !used.has(it) && (it.cs > 0 || it.baht > 0)).sort((a, b) => b.baht - a.baht);
  }
  MODEL_MEMO.set(code, M);
  return M;
}

/* v4.8: รายบิล 12 เดือนจาก BigQuery (ตัวกลาง action=custBills · ~3 วิ/ร้าน)

const BILLS = {};
async function loadBills(code){
  const B = BILLS[code] || (BILLS[code] = {rows: null, loading: false, err: ''});
  if (!CFG.bqProxy || B.rows || B.loading) return B;
  B.loading = true;
  const ctrl = new AbortController(), timer = setTimeout(() => ctrl.abort(), 45000);
  try {
    const res = await fetch(CFG.bqProxy + '?action=custBills&cc=' + encodeURIComponent(code), {signal: ctrl.signal});
    if (!res.ok) throw new Error('ตัวกลาง BigQuery ตอบ HTTP ' + res.status);
    const j = await res.json(); if (!j.ok) throw new Error(j.error || 'BigQuery ตอบกลับผิดพลาด');
    B.rows = (j.data || []).map(r => ({doc: clean(r.doc_no), ym: clean(r.month_year).replace('/', '-'), name: normSku(r.product_name), nk: nk(r.product_name),
      bc: clean(r.product_code).replace(/^BC-/i, '').replace(/^0+/, ''), unit: clean(r.unit), up: num(r.unit_price), eaPer: num(r.ea_per_unit) || 1,
      ea: num(r.sell_ea), free: num(r.free_ea), cs: num(r.sales_cs), baht: num(r.total_baht)}));
  } catch (e) { B.err = e.name === 'AbortError' ? 'BigQuery ตอบช้าเกิน 45 วินาที' : e.message; }
  finally { clearTimeout(timer); B.loading = false; }

}
function billsOf(code, name, bc){
  const B = BILLS[code]; if (!B || !B.rows) return null;
  const k = nk(name), b = String(bc || '').replace(/^0+/, '');
  return B.rows.filter(r => r.nk === k || (b && r.bc === b)).sort((x, y) => y.ym.localeCompare(x.ym) || y.doc.localeCompare(x.doc));
}

/* ════════ v3.5: สินค้าอื่นที่ร้านยังไม่เคยซื้อ + ราคา — อ่าน PDDT แบบแอพ Rattana Sales ════════
   แท็บ PDDT แท็บเดียวมีทุกคลัง → เลือกคอลัมน์ตามคลังของร้าน (`STOCK W1`, `SELL 30D W1`, `RANK W1` …)
   คลังของร้าน = ชีต Customer ช่อง WH (ว่าง = คลังที่ร้านของเซลล์มีมากสุด · ไม่มีเลย = W1)
   สต็อกเป็น "ลัง.ชิ้น" (5.04 = 5 ลัง 4 ชิ้น) · ราคา PRICE S03 <หน่วย> (ว่าง = CC03) ตัวเดียวกับที่แอพ Sales ใช้
   "ไม่เคยซื้อ" = ไม่มีในบิล DS_DC ที่อยู่ในเครื่อง และไม่มีในประวัติ BigQuery 3 เดือน (เทียบชื่อแบบไม่สนช่องว่าง + บาร์โค้ด)
   PDDT ตอบ ~2 วิ → โหลดตอนเปิดหน้าร้านครั้งแรก จำในหน่วยความจำ 30 นาที (ไม่เก็บ localStorage — ที่ใกล้เต็มแล้ว) */
const CATALOG = {}, CAT_TTL = 30 * 60 * 1000;
let PDDT_COLS = null;
const NP_LABELS_BASE = ['PRODUCT NAME','CODE EA','UNIT EA','UNIT PA','UNIT BP','UNIT CS','PRICE S03 EA','PRICE S03 PA','PRICE S03 BP','PRICE S03 CS','PRICE CC03 EA','PRICE CC03 PA','PRICE CC03 BP','PRICE CC03 CS','CAT TYPE','CAT BRAND','SKU_USAGE'];
/* v4.0: ราคาขั้นบันไดแบบแอพขาย (S00–S03 ทุกหน่วย, ว่าง = CC) */
const NP_LABELS = NP_LABELS_BASE.concat([].concat(...['EA','PA','BP','CS'].map(t => [].concat(...['00','01','02'].map(n => ['PRICE S' + n + ' ' + t, 'PRICE CC' + n + ' ' + t])))));
function shopWh(s){
  if (s && s.wh) return s.wh;
  const cnt = {}; SHOPS.forEach(x => { if (x.wh) cnt[x.wh] = (cnt[x.wh] || 0) + 1; });
  return Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a])[0] || 'W1';
}
function stockEa(raw, csF){   // "5.04" + ลังละ 24 → 124 ชิ้น
  const t = clean(raw); if (!t || t === '-') return 0;
  const [c, e] = t.split('.'); return (parseInt(c, 10) || 0) * Math.max(1, csF || 1) + (parseInt(String(e || '').replace(/\D/g, ''), 10) || 0);
}
async function loadCatalog(wh){
  const C = CATALOG[wh] || (CATALOG[wh] = {t:0, items:null, loading:false, err:''});
  if (C.loading || (C.items && Date.now() - C.t < CAT_TTL)) return C;
  C.loading = true; C.err = '';

    if (!PDDT_COLS) { const h = await gviz(CFG.prodSheet, CFG.prodTab, 'select * limit 0', 60000); PDDT_COLS = {}; h.table.cols.forEach(c => { if (c.label) PDDT_COLS[clean(c.label)] = c.id; }); }
    const L = NP_LABELS.concat(['STOCK ' + wh, 'SELL 30D ' + wh, 'RANK ' + wh]), ids = L.map(l => PDDT_COLS[l]);
    const st = PDDT_COLS['STOCK ' + wh];
    if (!st || ids[0] == null) throw new Error('ไม่พบคอลัมน์ STOCK ' + wh + ' ในชีต PDDT');
    const sel = 'select ' + ids.filter(Boolean).join(',');
    let res;
    try { res = await gviz(CFG.prodSheet, CFG.prodTab, sel + " where " + st + " is not null and " + st + " <> '' and " + st + " <> '0' and " + st + " <> '-'", 90000); }
    catch (e) { res = await gviz(CFG.prodSheet, CFG.prodTab, sel + ' where ' + st + ' is not null', 90000); }   // คอลัมน์เป็นตัวเลข = เทียบข้อความไม่ได้
    const at = {}; res.table.cols.forEach((c, i) => { at[clean(c.label)] = i; });

    const items = [];
    res.table.rows.forEach(r => {
      const name = normSku(g(r, 'PRODUCT NAME')); if (!name) return;
      const type = g(r, 'CAT TYPE'); if (/premium/i.test(type)) return;
      const units = ['EA','PA','BP','CS'].map(t => { const u = g(r, 'UNIT ' + t); if (!u) return null; const pu = parseUnit(u); const pz = n => num(g(r, 'PRICE S' + n + ' ' + t)) || num(g(r, 'PRICE CC' + n + ' ' + t)); return {t, name: pu.name, f: pu.f, price: pz('03'), pr: {S00: pz('00'), S01: pz('01'), S02: pz('02'), S03: pz('03')}}; }).filter(Boolean);
      const cs = units.find(u => u.t === 'CS'), ea = stockEa(g(r, 'STOCK ' + wh), cs ? cs.f : 1);

    });

    (pr.S00 > 0 ? '<div class="cc-floor">' + ic('warn', 13) + ' ขั้นต่ำ S00 ' + fmtB(pr.S00) + '/' + nm + ' <span class="rt-badge rt-badge-danger">ราคาควบคุม</span></div>' : '') + '</div>';

/* หาสินค้าใน PDDT (คลังของร้าน) จากชื่อ/บาร์โค้ด — ใช้ในหน้ารายละเอียดสินค้า */

/* v4.5: การ์ดแบบเดียวกับ "สินค้าที่เคยซื้อ" — ราคา S03 หน่วยใหญ่สุด (ลัง) · กดการ์ด = หน้าต่างราคาขั้นบันได + ปุ่มหน่วย EA/PA/BP/CS */

}

function niceStep(v){ if (v <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))); for (const m of [1, 2, 2.5, 5, 10]) if (m * p >= v) return m * p; return 10 * p; }

  for (let i = 0; i <= ticks; i++) { const v = step * i, y = Y(v); s += '<line class="gl" x1="' + pl + '" x2="' + (W - pr) + '" y1="' + y + '" y2="' + y + '"/><text class="ax" x="' + (pl - 6) + '" y="' + (y + 4) + '" text-anchor="end">' + fmtQ(v) + '</text>'; }
  const path = pts.map((p, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(p.v).toFixed(1)).join(' ');
  if (n > 1) s += '<path class="ar" d="' + path + ' L' + X(n - 1).toFixed(1) + ' ' + Y(0) + ' L' + X(0).toFixed(1) + ' ' + Y(0) + ' Z"/><path class="ln" d="' + path + '"/>';
  pts.forEach((p, i) => {

  if (noSales()) { $('view').innerHTML = pageHead('แจ้งเตือน') + statusHTML(); return; }
  const {idle, never} = alertsData(), td = DAYS[new Date().getDay()];
  const today = SHOPS.filter(s => s.route === td).map(s => { const M = shopModel(s.code); return {s, miss: M.skus.filter(k => k.missLatest && k.status !== 'stop').length, stop: M.skus.filter(k => k.status === 'stop').length}; }).sort((a, b) => b.miss - a.miss);
  const row = (s, right, sub) => '<a class="cc-rank" href="#/shop/' + encA(s.code) + '"><div class="cc-row-body"><span class="rt-cell-main">' + esc(s.name) + '</span><span class="rt-cell-sub">' + sub + '</span></div>' + right + '<span class="cc-chev">' + ic('right') + '</span></a>';
  let h = pageHead('แจ้งเตือน', 'ร้านที่ควรติดตามและสินค้าที่ควรเสนอวันนี้') + statusHTML();
  if (today.length) h += '<section class="rt-card rt-table-card"><header><div><div class="rt-caption">รูทวันนี้ (' + td + ')</div><h2 class="rt-h4">สินค้าที่ควรเสนอ</h2></div></header><div>' +
    today.map(x => row(x.s, badge(x.miss ? 'rt-badge-warning' : 'rt-badge-success', x.miss ? 'warn' : 'checkc', 'ควรเสนอ ' + x.miss), 'รหัส ' + esc(x.s.code) + (x.s.last ? ' · ซื้อล่าสุด ' + formatThaiDate(x.s.last) : ' · ยังไม่ซื้อ') + (x.stop ? ' · หยุดซื้อ ' + x.stop + ' SKU' : ''))).join('') + '</div></section>';
  h += '<section class="rt-card rt-table-card"><header><div><div class="rt-caption">ไม่ซื้อเกิน ' + ACTIVE_DAYS + ' วัน · ' + idle.length + ' ร้าน</div><h2 class="rt-h4">ร้านห่างหาย</h2></div></header>' +
    (idle.length ? '<div>' + idle.map(s => row(s, badge('rt-badge-warning', 'clock', daysAgo(s.last) + ' วัน'), 'ซื้อล่าสุด ' + formatThaiDate(s.last) + (s.route ? ' · รูท' + esc(s.route) : ''))).join('') + '</div>' : '<div class="rt-empty">' + ic('checkc', 32) + '<p>ไม่มีร้านห่างหาย</p></div>') + '</section>';
  if (never.length) h += '<section class="rt-card rt-table-card"><header><div><div class="rt-caption">' + never.length + ' ร้าน</div><h2 class="rt-h4">ยังไม่มีการซื้อในช่วงข้อมูล</h2></div></header><div>' +
    never.map(s => row(s, badge('rt-badge-danger', 'info', 'ยังไม่ซื้อ'), 'รหัส ' + esc(s.code) + (s.route ? ' · รูท' + esc(s.route) : ''))).join('') + '</div></section>';
  $('view').innerHTML = h;
}

/* ════════ ตั้งค่า ════════ */
function pageSettings(){
  topbar({title:'ตั้งค่า', sub:CFG.salesFull, back:'#/'});
  const dark = window.RattanaUI ? RattanaUI.getTheme() === 'dark' : false;
  const nProd = PROD ? Object.keys(PROD.map).length : 0, nImg = PROD ? Object.values(PROD.map).filter(p => p.img).length : 0;
  const t = DB && DB.ts ? DB.ts : 0;
  const row = (tile, icon, title, sub, end) => '<div class="cc-set"><span class="rt-tile rt-tile-sm ' + tile + '">' + ic(icon) + '</span><div class="cc-row-body"><span class="rt-cell-main">' + title + '</span><span class="rt-cell-sub">' + sub + '</span></div>' + (end || '') + '</div>';
  $('view').innerHTML = pageHead('ตั้งค่า') + '<section class="rt-card rt-table-card" style="padding:8px 0">' +
    row('rt-tile-navy', 'user', esc(CFG.salesFull), 'เซลล์ผู้ดูแล · ' + SHOPS.length + ' ร้าน') +
    row('rt-tile-navy', 'moon', 'โหมดมืด', 'ถนอมสายตาตอนกลางคืน', '<label class="rt-switch"><input type="checkbox"' + (dark ? ' checked' : '') + ' onchange="RattanaUI.setTheme(this.checked?\'dark\':\'light\')"><span class="rt-switch-track"></span></label>') +
    row('rt-tile-blue', 'sync', 'อัปเดตข้อมูล', 'อัตโนมัติ: เปิดแอพครั้งแรกของวัน · 13.00 · 17.00 น. (รอบถัดไป ' + nextRefreshLabel() + ') · ล่าสุด ' + (t ? formatThaiDate(dateToISO(new Date(t))) + ' ' + timeTH(t) : '-') + ' · กดปุ่มเพื่อดึงบิลใหม่ทันที', '<button class="rt-btn rt-btn-gold rt-btn-sm" type="button" onclick="loadData(true)">อัปเดต</button>') +
    row('rt-tile-blue', 'download', 'ดึงประวัติใหม่ทั้งหมด', 'ทุกสัปดาห์ที่ชีต DS_DC เก็บไว้ (1–3 นาที)', '<button class="rt-btn rt-btn-glass rt-btn-sm" type="button" onclick="loadData(true,true)">ดึงทั้งหมด</button>') +
    row('rt-tile-gold', 'file', 'ประวัติการขายในเครื่อง', formatThaiDate(PERIOD.from) + ' – ' + formatThaiDate(PERIOD.to) + ' · ' + (DB ? DB.lines.length.toLocaleString('th-TH') : 0) + ' บรรทัด · เก็บสะสมสูงสุด ' + SALES_KEEP_DAYS + ' วัน') +
    (CFG.bqProxy ? (() => { const B = bqLocal(), n = Object.keys(B.shops).length, cl = bqWindow().filter(ym => bqClosed().has(ym));
      return row('rt-tile-gold', 'calendar', 'ประวัติ 3 เดือนก่อน (BigQuery)', (cl.length ? cl.map(ymLabel).join(', ') : 'ยังไม่มีเดือนที่ปิดแล้ว') + ' · ' + n + ' ร้าน' + (B.t ? ' · โหลดเมื่อ ' + formatThaiDate(dateToISO(new Date(B.t))) + ' ' + timeTH(B.t) : '') + (BQ_STATE.loading ? ' · กำลังโหลด ' + BQ_STATE.done + '/' + BQ_STATE.total : BQ_STATE.err ? ' · ล่าสุดล้ม: ' + esc(BQ_STATE.err) : '') + ' · จำในเครื่อง 7 วัน',
        '<button class="rt-btn rt-btn-glass rt-btn-sm" type="button" onclick="loadBqBg(true)"' + (BQ_STATE.loading ? ' disabled' : '') + '>โหลดใหม่</button>'); })() : '') +
    row('rt-tile-gold', 'box', 'ข้อมูลสินค้า (PDDT)', nProd + ' สินค้า · มีรูป ' + nImg + ' รายการ' + (prodLoading ? ' · กำลังโหลด...' : '')) +
    row('rt-tile-red', 'trash', 'ล้างข้อมูลที่เก็บในเครื่อง', 'แอปจะดึงข้อมูลใหม่ทั้งหมด', '<button class="rt-btn rt-btn-glass rt-btn-sm" type="button" onclick="clearCache()">ล้าง</button>') +
    row('rt-tile-navy', 'info', 'Rattana Call Card', APP_VER + ' · Rattana CI · 1 รอบ = 1 วันที่ออกบิล · Active = ซื้อภายใน ' + ACTIVE_DAYS + ' วัน') +
    '</section>';
}
function clearCache(){
  const run = () => { BQ = null; BQ_CLOSED = null; [LS_DATA, LS_PROD, bqKey()].forEach(k => { try { localStorage.removeItem(k); } catch(e) {} }); DB = null; PROD = null; STALE = null; render(); loadData(true, true); };
  if (window.RattanaUI) RattanaUI.confirm({title:'ล้างข้อมูลในเครื่อง?', message:'แอปจะดึงข้อมูลใหม่ทั้งหมดจากชีต ใช้เวลา 1–3 นาที', confirmText:'ล้างและดึงใหม่'}).then(ok => { if (ok) run(); });
  else if (confirm('ล้างข้อมูลในเครื่องและดึงใหม่ทั้งหมด?')) run();
}

/* ════════ Boot ════════ */
function boot(){
  render();
  loadData(false);
  setInterval(() => { if (!document.hidden) loadData(false); }, 5 * 60 * 1000);   // เช็คทุก 5 นาที — v3.8: ดึงจริงเฉพาะเมื่อผ่าน 13:00 / 17:00 / ขึ้นวันใหม่
  document.addEventListener('visibilitychange', () => { if (!document.hidden) loadData(false); });   // กลับมาเปิดแอพหลังเลยรอบ = อัปเดตทันที
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
</script>
