<!DOCTYPE html>
<html lang="th" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F7FB">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Rattana E-Book v3.0</title>
<!-- ไอคอนแอปของ E-Book เอง (ไม่ใช่โลโก้บริษัท) -->
<link rel="apple-touch-icon" href="ebook/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="ebook/icon-192.png">
<script>
/* ธีมก่อนวาดหน้า (กันกระพริบ): ใช้ที่เลือกไว้ใน Rattana CI (rattana-ui-theme ใช้ร่วมทุกแอปบริษัท)
   ถ้ายังไม่เคยเลือก → ใช้สวิตช์โหมดมืดเดิมของ E-Book / ?dark=1 ที่ส่งมาจากที่อยู่เก่า (rattana2555.github.io) */
(function(){ try{
  var u=new URL(location.href), t=localStorage.getItem('rattana-ui-theme');
  if(u.searchParams.get('dark')==='1'){ localStorage.setItem('rattanaEbookDark','1'); u.searchParams.delete('dark'); history.replaceState(null,'',u.pathname+u.search+u.hash); }
  if(t!=='dark' && t!=='light') t = localStorage.getItem('rattanaEbookDark')==='1' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', t);
}catch(e){} })();
</script>
<!-- Rattana CI (UI กลางของบริษัท) — ลิงก์ไฟล์กลาง ห้ามก๊อปมาเก็บเอง -->
<link rel="stylesheet" href="https://rattanaphaiboon.github.io/app/rattana-ui/rattana-ui.css">
<script src="https://rattanaphaiboon.github.io/app/rattana-ui/rattana-ui.js" defer></script>
<!-- PDF.js ไม่โหลดตอนเปิดแอป — โหลดเฉพาะตอนกด เปิด PDF ของตัวเอง (เล่มที่แชร์ไม่ต้องใช้)
     ไม่มีการเข้าสู่ระบบ: แคตตาล็อกนี้แชร์ให้ลูกค้าเปิดได้ทุกคน (ถ้าวันหน้าต้องรู้ว่าใครใช้ → body data-rt-login + RattanaUI.user.ready ตามคู่มือ CI) -->
<style>
/* ── สีของ "กระดาษ" ในเล่ม (CI ไม่มีส่วนนี้) ── */
:root{ --paper:#fbf8f1; --paper-edge:#efe9db; --book-shadow:0 10px 28px rgba(1,30,62,.18); }
[data-theme="dark"]{ --paper:#132a46; --paper-edge:#0c1f37; --book-shadow:0 14px 34px rgba(0,0,0,.5); }

/* ── โครงหน้า: เต็มจอ ไม่เลื่อน (หนังสือพลิกในกรอบ) ── */
html,body{height:100%}
body.rt-app{min-height:100dvh;overflow:hidden;-webkit-user-select:none;user-select:none}
#appScreen{display:none;flex-direction:column;height:100dvh;gap:8px;
  padding:max(8px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) 0 max(8px,env(safe-area-inset-left));position:relative;z-index:1}
.reader{flex:1;display:flex;flex-direction:column;min-height:0;gap:8px}
.hidden{display:none!important}

/* ── แถบบน (rt-topbar) ── */
.eb-top{flex-wrap:nowrap;padding:8px 10px 8px 12px;gap:10px}
.eb-brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 auto;overflow:hidden}
.eb-appicon{width:38px;height:38px;border-radius:11px;flex-shrink:0;box-shadow:var(--shadow-1)}
.eb-brand-text{min-width:0;line-height:1.2}
.eb-name{margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eb-sub{display:block;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:42vw}
.eb-top .rt-topbar-end{gap:6px;flex-shrink:0}
.rt-btn svg{width:20px;height:20px;flex-shrink:0}
@media(max-width:600px){ .eb-lbl{display:none} .eb-top .rt-btn.eb-collapse{width:44px;padding:0} .eb-sub{max-width:none} .eb-top{gap:8px;padding-left:8px} .eb-brand{gap:8px} }
@media(max-width:400px){ .eb-name{font-size:15px} .eb-appicon{width:34px;height:34px} }

/* ── เวทีหนังสือ ── */
.book-stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;perspective:2600px;padding:6px 4px;min-height:0;overflow:hidden}
.book{position:relative;width:min(94vw,440px);aspect-ratio:3/4;max-height:100%;transform-style:preserve-3d}
.book.spread{width:min(96vw,900px);aspect-ratio:3/2}
.book-skel{position:absolute;inset:0;border-radius:3px 10px 10px 3px}
/* single-mode spine shadow (left) */
.book:not(.spread)::before{content:"";position:absolute;left:-6px;top:2%;height:96%;width:12px;background:linear-gradient(to right,rgba(0,0,0,.28),rgba(0,0,0,0));border-radius:6px;filter:blur(1px);z-index:0}
/* spread: static left backing (so cover sits on right) + center spine */
.book.spread::after{content:"";position:absolute;left:0;top:0;bottom:0;width:50%;background:var(--paper);border-radius:8px 2px 2px 8px;box-shadow:inset -14px 0 22px -12px rgba(0,0,0,.32);z-index:0}
.book.spread::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;transform:translateX(-1px);background:rgba(0,0,0,.14);z-index:1}

/* single-page leaves */
.page{position:absolute;inset:0;transform-origin:left center;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.35,.08,.2,1)}
.page.flipping,.book.spread .leaf.flipping{will-change:transform}
.page.flipped{transform:rotateY(-180deg)}
.page .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;border-radius:3px 10px 10px 3px;background:var(--paper);color:var(--text);box-shadow:var(--book-shadow)}
.page .face.back{transform:rotateY(180deg);background:var(--paper);background-image:linear-gradient(to left,var(--paper-edge),transparent 22%)}
.page .face.front::before{content:"";position:absolute;left:0;top:0;bottom:0;width:26px;background:linear-gradient(to right,rgba(0,0,0,.16),transparent);pointer-events:none;z-index:3}

/* spread leaves (right half, turn on spine) */
.book.spread .leaf{position:absolute;top:0;bottom:0;left:50%;width:50%;transform-origin:left center;transform-style:preserve-3d;transition:transform .85s cubic-bezier(.35,.08,.2,1)}
.book.spread .leaf.flipped{transform:rotateY(-180deg)}
.book.spread .leaf .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;background:var(--paper);color:var(--text);box-shadow:var(--book-shadow)}
.book.spread .leaf .face.front{border-radius:2px 9px 9px 2px}
.book.spread .leaf .face.back{transform:rotateY(180deg);border-radius:9px 2px 2px 9px}
.book.spread .leaf .face.front::before{content:"";position:absolute;left:0;top:0;bottom:0;width:22px;background:linear-gradient(to right,rgba(0,0,0,.15),transparent);z-index:3;pointer-events:none}
.book.spread .leaf .face.back::before{content:"";position:absolute;right:0;top:0;bottom:0;width:22px;background:linear-gradient(to left,rgba(0,0,0,.15),transparent);z-index:3;pointer-events:none}
/* turning shadow */
.face.front::after{content:"";position:absolute;inset:0;background:linear-gradient(to right,rgba(0,0,0,.18),transparent 12%);opacity:0;transition:opacity .4s;pointer-events:none}
.flipping .face.front::after{opacity:1}

/* page content */
.pg{position:absolute;inset:0;display:flex;flex-direction:column;padding:28px 24px 42px}
.pg-blank{background:var(--paper)}
.pg-img{padding:0}
.pg-img img{width:100%;height:100%;object-fit:contain;background:var(--paper)}
.pg-num{position:absolute;bottom:11px;left:0;right:0;text-align:center;font-size:12px;color:var(--text-muted);letter-spacing:1px}
.pg-cover{align-items:center;justify-content:center;text-align:center;
  background:radial-gradient(700px 500px at 50% 18%,rgba(252,183,15,.18),transparent),linear-gradient(160deg,var(--navy),#020d1c);color:#fff}
.pg-cover .brand{font-size:11px;letter-spacing:4px;color:var(--gold);margin-bottom:auto;padding-top:12px;text-transform:uppercase}
.pg-cover .h{font-size:28px;font-weight:700;line-height:1.25;margin-bottom:10px}
.pg-cover .s{font-size:14px;color:rgba(255,255,255,.8)}
.pg-cover .rule{width:60px;height:3px;background:var(--gold);border-radius:2px;margin:16px auto}
.pg-cover .foot{margin-top:auto;font-size:11px;color:rgba(255,255,255,.55);letter-spacing:1px}
.pg-back{align-items:center;justify-content:center;text-align:center;background:linear-gradient(160deg,var(--navy-700),var(--navy));color:#fff}
.pg-back .h{font-size:22px;font-weight:700}
.pg-back .s{font-size:13px;color:rgba(255,255,255,.7);margin-top:8px}
.pg h2{font-size:18px;font-weight:700;color:var(--text);margin-bottom:4px;line-height:1.3}
.pg .kicker{font-size:11px;letter-spacing:2px;color:var(--gold-ink);font-weight:700;text-transform:uppercase;margin-bottom:12px}
.pg p{font-size:13px;line-height:1.7;color:var(--text);margin-bottom:10px;text-indent:1.4em;opacity:.92}
.pg .hr{height:1px;background:var(--border);margin:10px 0}
.pg-toc{padding:26px 20px 42px}
.pg-toc .kicker{text-align:center}
.pg-toc h2{text-align:center;margin-bottom:14px}
.pg .eb-sample{align-self:flex-start;margin-bottom:10px}
.pg-cover .eb-sample{align-self:center;margin:0 0 8px}

/* tap zones (mobile easy flip) */
.tap-zone{position:absolute;top:0;bottom:0;width:32%;z-index:40;background:transparent}
.tap-zone.left{left:0}.tap-zone.right{right:0}

/* ── แถบควบคุมล่าง ── */
.eb-controls{padding:8px 12px calc(8px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:4px;border-radius:22px 22px 0 0}
.ctrl-row{display:flex;align-items:center;gap:12px}
.page-ind{flex:1;text-align:center;font-weight:600;color:var(--text)}
.page-ind b{color:var(--gold-ink);font-variant-numeric:tabular-nums}
input[type=range].eb-slider{width:100%;accent-color:var(--gold);height:28px;margin:0}

/* ── สารบัญ (อยู่ใน RattanaUI.drawer) ── */
.toc-sec-title{padding:12px 4px 6px;border-bottom:1px solid var(--line);margin:0 0 4px}
.toc-list{list-style:none;margin:0;padding:0}
.toc-row{width:100%;display:flex;align-items:baseline;gap:8px;background:transparent;border:none;padding:11px 8px;text-align:left;color:var(--text);font:inherit;border-radius:12px;cursor:pointer;min-height:44px}
.toc-row:hover,.toc-row:active{background:var(--hover)}
.toc-row .t{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toc-row .dots{flex:1;border-bottom:1.5px dotted var(--border);transform:translateY(-4px)}
.toc-row .n{font-size:13px;font-weight:700;color:var(--gold-ink);font-variant-numeric:tabular-nums}
.toc-row.active{background:var(--gold-soft)}
.toc-empty{text-align:center;margin:14px 0}
.pg-toc .toc-list{flex:1;overflow-y:auto}
.page-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;padding:6px 2px 4px}
.page-grid .rt-btn{width:100%;padding:0;font-variant-numeric:tabular-nums}

/* ── จัดการหนังสือ (อยู่ใน RattanaUI.popup) ── */
.eb-status{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.eb-stack{display:flex;flex-direction:column;gap:8px}
.eb-manual{display:flex;flex-direction:column;gap:12px}
.eb-divider{text-align:center;margin:16px 0 0}
.mng-list{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.mng-item .thumb{width:34px;height:44px;border-radius:6px;object-fit:cover;background:var(--navy-700);flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff}
.mng-item .thumb svg{width:18px;height:18px}
.mng-item .meta{flex:1;min-width:0;display:flex;flex-direction:column}
.mng-item .acts{display:flex;gap:4px}

/* ── กล่องแปลง PDF (อยู่ใน RattanaUI.popup) ── */
.eb-busy{display:flex;flex-direction:column;align-items:center;gap:12px;padding:6px 4px 2px;text-align:center}
.eb-busy svg{width:34px;height:34px;color:var(--gold)}
.eb-busy .rt-progress{width:100%}
</style>
</head>
<body class="rt-app">
<div class="rt-bg"><div class="rt-bg-arc"></div><div class="rt-bg-arc"></div></div>

<!-- ══ APP ══ -->
<div id="appScreen">
  <header class="rt-glass rt-topbar eb-top">
    <div class="eb-brand">
      <img class="eb-appicon" src="ebook/icon-180.png" alt="">
      <div class="eb-brand-text">
        <div class="rt-h4 eb-name">Rattana E-Book</div>
        <span class="rt-caption eb-sub" id="bookTitle">v3.0</span>
      </div>
    </div>
    <div class="rt-topbar-end">
      <input type="file" id="pdfInput" accept="application/pdf,.pdf" hidden onchange="openPdf(this.files[0]);this.value='';">
      <button type="button" class="rt-btn rt-btn-gold eb-collapse" id="btnPdf" onclick="document.getElementById('pdfInput').click()" aria-label="เปิด PDF ของคุณ" title="เปิด PDF ของคุณ">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M12 18v-6"/><path d="m9 15 3 3 3-3"/></svg><span class="eb-lbl">เปิด PDF</span></button>
      <button type="button" class="rt-btn rt-btn-glass eb-collapse" id="btnToc" onclick="openToc()" aria-label="สารบัญ / ไปหน้า" title="สารบัญ / ไปหน้า">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg><span class="eb-lbl">สารบัญ</span></button>
      <button type="button" class="rt-btn rt-btn-glass rt-btn-icon hidden" id="btnManage" onclick="openManage()" aria-label="จัดการหนังสือ" title="จัดการหนังสือ">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>
      <button type="button" class="rt-btn rt-btn-glass rt-btn-icon" data-rt-theme-toggle aria-label="สลับโหมดสว่าง/มืด" title="สลับโหมดสว่าง/มืด">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path data-rt-theme-icon d=""/></svg></button>
    </div>
  </header>

  <div class="reader">
    <div class="book-stage" id="bookStage">
      <div class="tap-zone left" id="tapL"></div>
      <div class="tap-zone right" id="tapR"></div>
      <div class="book" id="book"><div class="rt-skeleton book-skel" aria-label="กำลังโหลดหนังสือ"></div></div>
    </div>

    <div class="rt-glass eb-controls">
      <div class="ctrl-row">
        <button type="button" class="rt-btn rt-btn-glass rt-btn-icon" id="btnPrev" onclick="step(-1)" aria-label="หน้าก่อน">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
        <div class="page-ind">หน้า <b id="pgCur">1</b> / <span id="pgTot">1</span></div>
        <button type="button" class="rt-btn rt-btn-gold rt-btn-icon" id="btnNext" onclick="step(1)" aria-label="หน้าถัดไป">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button>
      </div>
      <input type="range" class="eb-slider" id="pgSlider" min="1" max="1" value="1" oninput="jumpTo(this.value-1)" aria-label="เลื่อนไปหน้า">
    </div>
  </div>
</div>

<script>
/* ════════ CONFIG ════════ */
const EDIT_MIN_ROLE = 5;
const STORE_KEY = 'rattanaEbookPages_v1';
const BOOK_MANIFEST = 'ebook/book.json';   // หนังสือกลางที่แชร์ = รูปทีละหน้า + manifest (แก้หนังสือ: แทนที่รูปใน ebook/pages/ + book.json)
const MANIFEST_CACHE_KEY = 'rattanaEbookManifest_v1';   // สำรองไว้เปิดได้แม้เน็ตช้า/หลุด
const PDF_LIB     = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
const PDF_WORKER  = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const PDF_CMAP    = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/cmaps/';
const PDF_STDFONT = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/standard_fonts/';
const PDF_TARGET_W = 1100;
const SPREAD_MQ = '(min-width:820px) and (min-height:480px)';

/* ════════ DEFAULT (DEMO) BOOK — ข้อมูลตัวอย่าง (ขึ้นเฉพาะตอนโหลดหนังสือที่แชร์ไม่ได้) ════════ */
const DEFAULT_PAGES = [
  {type:'cover', heading:'Rattana E-Book', sub:'เปิดไฟล์ PDF เป็นหนังสือ', sample:true},
  {type:'toc', sample:true},
  {type:'demo', sample:true, chapter:'เริ่มต้นใช้งาน', kicker:'ยินดีต้อนรับ',
   body:['กดปุ่ม “เปิด PDF” ด้านบน เลือกไฟล์ PDF จากเครื่อง ระบบจะแปลงเป็นหนังสือพลิกอ่านได้ทันที (เฉพาะเครื่องคุณ)',
          'พลิกหน้า: แตะครึ่งซ้าย/ขวาของจอ · ปัดหน้าจอ · กดลูกศร ‹ › · ลากแถบเลื่อน']},
  {type:'demo', sample:true, chapter:'สารบัญ & ไปหน้า', kicker:'การนำทาง',
   body:['กดปุ่ม “สารบัญ” ด้านบน จะเห็นรายการบท (ดึงจาก bookmark ใน PDF) — แตะชื่อบทหรือเลขหน้าเพื่อกระโดดไปหน้านั้นทันที',
          'ด้านล่างมีตาราง “ไปหน้า” แตะเลขหน้าใดก็ได้เพื่อข้ามไปหน้านั้นตรง ๆ']},
  {type:'demo', sample:true, chapter:'จอเล็ก-จอใหญ่', kicker:'สมจริง',
   body:['บนมือถือแสดงทีละหน้า อ่านง่าย · บนคอม/แท็บเล็ตกางเป็น 2 หน้าเหมือนหนังสือจริง สลับให้อัตโนมัติตามขนาดจอ',
          'หนังสือกลางที่บริษัทแชร์จะขึ้นให้ทุกคนที่เปิดลิงก์เห็นเล่มเดียวกัน']},
  {type:'back', heading:'พร้อมแล้ว', sub:'กด “เปิด PDF” เพื่อเปิดไฟล์ของคุณ · รัตนไพบูลย์', sample:true},
];

/* ════════ STATE ════════ */
let currentUser=null;
let PAGES=[], CHAPTERS=[], BOOK_MODE='manual', PDF_NAME='', IS_HOSTED=false;
let pageEls=[], leafEls=[], SPREAD=false, currentIndex=0, N=0, addMode='url', HOSTED_LAZY=false, HIDE_PGNUM=false, PAGE_OFFSET=0, PAGE_OFFSETS=[];

/* v2.6: เลิกจำ PDF ส่วนตัวในเครื่องแล้ว (เคยทำให้เปิดลิงก์แล้วเจอเล่มเก่า + ต้องแปลง PDF ใหม่ทุกครั้ง)
   ลบฐานข้อมูลเก่าที่ค้างในเครื่องทิ้ง เพื่อคืนพื้นที่ (บางเครื่องมี PDF 110MB ค้างอยู่) */
function purgeOldPdfCache(){ try{ indexedDB.deleteDatabase('rattanaEbook'); }catch(e){} }

/* ไม่มีหน้าเข้าสู่ระบบของแอปเอง — แคตตาล็อกเปิดได้ทุกคน (ต้องรู้ว่าใครใช้เมื่อไหร่ → ใช้ RattanaUI.user ของ CI) */

function enterApp(){
  document.getElementById('appScreen').style.display='flex';
  document.getElementById('btnManage').classList.toggle('hidden',!(currentUser && currentUser.role>=EDIT_MIN_ROLE));
  startReader();

/* ════════ BOOT READER: หนังสือที่แชร์ (ล่าสุดเสมอ) → demo ════════ */
async function startReader(){
  const m=await fetchManifest();   // ระหว่างรอ #book แสดง rt-skeleton
  if(m && loadHostedBook(m)) return;
  BOOK_MODE='manual'; PDF_NAME=''; IS_HOSTED=false; HOSTED_LAZY=false; HIDE_PGNUM=false; PAGE_OFFSET=0; PAGE_OFFSETS=[]; loadBook(); buildBook(); jumpTo(0,false);
}
/* manifest เล็ก (~2KB) ดึงสดเสมอเพื่อให้เห็นเล่มล่าสุด — ถ้าเน็ตหลุด/ช้าเกิน ใช้ตัวที่สำรองไว้ */
async function fetchManifest(){
  try{
    const c=new AbortController(); const t=setTimeout(()=>c.abort(),6000);
    const r=await fetch(BOOK_MANIFEST,{cache:'no-cache',signal:c.signal}); clearTimeout(t);
    if(!r.ok) throw new Error('manifest '+r.status);
    const m=await r.json(); if(!m || !m.count) throw new Error('bad manifest');
    try{ localStorage.setItem(MANIFEST_CACHE_KEY, JSON.stringify(m)); }catch(e){}
    return m;
  }catch(e){
    console.warn('manifest fetch fail, using cached',e);
    try{ return JSON.parse(localStorage.getItem(MANIFEST_CACHE_KEY)); }catch(_){ return null; }
  }
}
/* หนังสือที่แชร์ = รูปทีละหน้า · ภาพย่อ (~13KB) ขึ้นทันที แล้วค่อยเปลี่ยนเป็นภาพคมชัดรอบ ๆ หน้าที่เปิด */
function loadHostedBook(m){
  const dir=m.dir||'', tdir=m.thumbDir||'', ext=m.ext||'jpg', pad=m.pad||4, v=m.ver?('?v='+encodeURIComponent(m.ver)):'', pages=[];
  for(let i=1;i<=m.count;i++){ const f=String(i).padStart(pad,'0')+'.'+ext+v;
    pages.push({type:'image', img:dir+f, thumb:tdir?tdir+f:'', lazy:true}); }
  PAGES=pages; CHAPTERS=(m.chapters||[]).map(c=>({title:c.title, index:(c.page||1)-1}));
  HIDE_PGNUM=!!m.hideNum; PAGE_OFFSET=parseInt(m.offset)||0;
  PAGE_OFFSETS=Array.isArray(m.offsets)?m.offsets.slice().sort((a,b)=>a.from-b.from):[];
  BOOK_MODE='pdf'; IS_HOSTED=true; HOSTED_LAZY=true; PDF_NAME=m.title||'หนังสือ';
  buildBook(); jumpTo(0,false);
  return true;
}
function hydrateImages(){
  if(!HOSTED_LAZY) return;
  const tlo=Math.max(0,currentIndex-4), thi=Math.min(N-1,currentIndex+10);   // ภาพย่อ: โหลดกว้าง (เล็กมาก) พลิกแล้วเห็นทันที
  const flo=Math.max(0,currentIndex-2), fhi=Math.min(N-1,currentIndex+4);    // ภาพคมชัด: เฉพาะรอบหน้าที่เปิด
  for(let i=tlo;i<=thi;i++){
    const im=document.querySelector('#book img[data-page="'+i+'"]'); if(!im) continue;
    if(im.dataset.thumb && !im.getAttribute('src')){ im.src=im.dataset.thumb; im.removeAttribute('data-thumb'); }
    if(i>=flo && i<=fhi && im.dataset.full){
      const full=im.dataset.full; im.removeAttribute('data-full');
      if(!im.getAttribute('src')){ im.src=full; continue; }            // ไม่มีภาพย่อ → โหลดภาพจริงตรง ๆ
      const pre=new Image(); pre.decoding='async'; if(i===currentIndex) pre.fetchPriority='high';
      pre.onload=()=>{ im.src=full; im.style.display=''; }; pre.src=full;   // โหลดเสร็จค่อยสลับ ไม่กระพริบ
    }
  }
}

/* ════════ MANUAL BOOK ════════ */
function loadBook(){ try{ const s=JSON.parse(localStorage.getItem(STORE_KEY)); PAGES=(Array.isArray(s)&&s.length)?s:JSON.parse(JSON.stringify(DEFAULT_PAGES)); }
  catch{ PAGES=JSON.parse(JSON.stringify(DEFAULT_PAGES)); } }
function saveBook(){ if(BOOK_MODE!=='manual') return; try{ localStorage.setItem(STORE_KEY,JSON.stringify(PAGES)); }catch(e){ showToast('บันทึกไม่สำเร็จ (พื้นที่เต็ม)','error'); } }

/* ════════ PDF PIPELINE ════════ */
function ensurePdfWorker(){ if(window.pdfjsLib && !pdfjsLib.GlobalWorkerOptions.workerSrc) pdfjsLib.GlobalWorkerOptions.workerSrc=PDF_WORKER; }
let _pdfJsP=null;
function loadPdfJs(){
  if(window.pdfjsLib){ ensurePdfWorker(); return Promise.resolve(); }
  if(_pdfJsP) return _pdfJsP;
  _pdfJsP=new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=PDF_LIB;
    s.onload=()=>{ ensurePdfWorker(); res(); }; s.onerror=()=>{ _pdfJsP=null; s.remove(); rej(new Error('โหลดตัวอ่าน PDF ไม่สำเร็จ ลองใหม่อีกครั้ง')); };
    document.head.appendChild(s); });
  return _pdfJsP;
}
async function cdnReachable(url){ try{ const c=new AbortController(); const t=setTimeout(()=>c.abort(),5000); const r=await fetch(url,{signal:c.signal,cache:'force-cache'}); clearTimeout(t); return r.ok; }catch(e){ return false; } }

async function openPdf(file){
  if(!file) return;
  if(!/pdf$/i.test(file.type||'') && !/\.pdf$/i.test(file.name||'')){ showToast('กรุณาเลือกไฟล์ PDF','warning'); return; }
  try{ const buf=await file.arrayBuffer(); await renderPdf(buf, file.name); }
  catch(e){ console.error(e); showToast('อ่านไฟล์ไม่สำเร็จ','error'); }
}
/* เปิด PDF ของผู้ใช้เอง = ดูชั่วคราว ไม่บันทึกในเครื่อง (เปิดลิงก์ครั้งหน้าจะกลับมาเล่มที่แชร์เสมอ) */
async function renderPdf(buf, name){
  showSpinner('กำลังเตรียมตัวอ่าน PDF...');
  try{ await loadPdfJs(); }catch(e){ hideSpinner(); showToast(e.message,'error'); return; }
  showSpinner('กำลังเปิด PDF...');
  try{
    let fontOpts={};
    if(await cdnReachable(PDF_STDFONT+'LiberationSans-Regular.ttf')) fontOpts={cMapUrl:PDF_CMAP, cMapPacked:true, standardFontDataUrl:PDF_STDFONT};
    else console.warn('font CDN ไม่พร้อม — render เฉพาะฟอนต์ที่ฝังใน PDF');
    const pdf=await pdfjsLib.getDocument(Object.assign({data: buf.slice(0)}, fontOpts)).promise;
    const num=pdf.numPages; const pages=[];
    for(let i=1;i<=num;i++){
      showSpinner(`กำลังแปลงหน้า ${i} / ${num} ...`, i/num);
      const page=await pdf.getPage(i);
      const v1=page.getViewport({scale:1});
      const scale=Math.min(2.2, Math.max(1, PDF_TARGET_W/v1.width));
      const vp=page.getViewport({scale});
      const canvas=document.createElement('canvas'); canvas.width=Math.floor(vp.width); canvas.height=Math.floor(vp.height);
      const ctx=canvas.getContext('2d',{alpha:false}); ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,canvas.width,canvas.height);
      const rt=page.render({canvasContext:ctx, viewport:vp});
      await Promise.race([ rt.promise.catch(()=>{}), new Promise(r=>setTimeout(r,20000)) ]);   // freeze-guard
      pages.push({type:'image', img:canvas.toDataURL('image/jpeg',0.82)});
      canvas.width=canvas.height=0;
    }
    let chapters=[];
    try{ const outline=await pdf.getOutline(); if(outline&&outline.length) chapters=await outlineToChapters(pdf,outline); }catch(e){ console.warn('outline fail',e); }
    PDF_NAME=name||'PDF'; BOOK_MODE='pdf'; IS_HOSTED=false; HOSTED_LAZY=false; HIDE_PGNUM=false; PAGE_OFFSET=0; PAGE_OFFSETS=[]; CHAPTERS=chapters; PAGES=pages;
    buildBook(); jumpTo(0,false);
    showToast(`เปิดดู “${PDF_NAME}” ชั่วคราว · ${num} หน้า — กดปุ่มดินสอเพื่อกลับเล่มที่แชร์`,'success');
  }catch(e){ console.error(e); showToast('เปิด PDF ไม่สำเร็จ: '+(e&&e.message||e),'error'); }
  finally{ hideSpinner(); }
}
async function outlineToChapters(pdf, outline){
  const out=[];
  async function walk(items, depth){
    for(const it of (items||[])){
      let idx=null;
      try{ let dest=it.dest; if(typeof dest==='string') dest=await pdf.getDestination(dest);
        if(Array.isArray(dest) && dest[0]) idx=await pdf.getPageIndex(dest[0]); }catch(e){}
      if(idx!=null) out.push({title:(depth?'· ':'')+String(it.title||'(ไม่มีชื่อ)').trim(), index:idx});
      if(it.items && it.items.length) await walk(it.items, depth+1);
    }
  }
  await walk(outline,0); return out;
}
async function clearPdf(){ closeManage(); await startReader(); }

/* ════════ RENDER PAGE FACE ════════ */
function esc(s){ return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function faceHTML(p,i){
  if(!p) return '<div class="pg pg-blank"></div>';
  const num=`<div class="pg-num">${i+1}</div>`;
  const sb=p.sample?'<span class="rt-badge rt-badge-sample eb-sample">ข้อมูลตัวอย่าง</span>':'';
  if(p.type==='cover') return `<div class="pg pg-cover"><div class="brand">RATTANA</div>${sb}<div class="h">${esc(p.heading)}</div><div class="rule"></div><div class="s">${esc(p.sub)}</div><div class="foot">แตะเพื่อเปิดอ่าน · v3.0</div></div>`;
  if(p.type==='back') return `<div class="pg pg-back">${sb}<div class="h">${esc(p.heading)}</div><div class="s">${esc(p.sub)}</div></div>${num}`;
  if(p.type==='toc') return `<div class="pg pg-toc">${sb}<div class="kicker">Table of Contents</div><h2>สารบัญ</h2><ul class="toc-list" id="tocInBook"></ul></div>${num}`;
  if(p.type==='image'){ const s=p.lazy?`data-full="${esc(p.img)}"${p.thumb?` data-thumb="${esc(p.thumb)}"`:''}`:`src="${esc(p.img)}"`;
    return `<div class="pg pg-img"><img data-page="${i}" ${s} decoding="async" alt="page ${i+1}" onerror="this.style.display='none'"></div>${HIDE_PGNUM?'':num}`; }
  const body=(p.body||[]).map(t=>`<p>${esc(t)}</p>`).join('');
  return `<div class="pg">${sb}${p.kicker?`<div class="kicker">${esc(p.kicker)}</div>`:''}${p.chapter?`<h2>${esc(p.chapter)}</h2><div class="hr"></div>`:''}${body}</div>${num}`;
}
function deriveChapters(){ const out=[]; PAGES.forEach((p,i)=>{ if(p.chapter && p.type!=='cover' && p.type!=='toc') out.push({title:p.chapter,index:i}); }); return out; }

function buildBook(){
  SPREAD = matchSpread();
  const book=document.getElementById('book');
  N=PAGES.length; book.className='book'+(SPREAD?' spread':''); book.innerHTML=''; pageEls=[]; leafEls=[];
  if(SPREAD){
    const lv=Math.ceil(N/2);
    for(let i=0;i<lv;i++){ const fp=2*i, bp=2*i+1;
      const leaf=document.createElement('div'); leaf.className='leaf';
      leaf.innerHTML='<div class="face front">'+faceHTML(PAGES[fp],fp)+'</div><div class="face back">'+(bp<N?faceHTML(PAGES[bp],bp):'<div class="pg pg-blank"></div>')+'</div>';
      book.appendChild(leaf); leafEls.push(leaf);
    }
  }else{
    PAGES.forEach((p,i)=>{ const el=document.createElement('div'); el.className='page';
      el.innerHTML='<div class="face front">'+faceHTML(p,i)+'</div><div class="face back"></div>';
      book.appendChild(el); pageEls.push(el); });
  }
  if(BOOK_MODE==='manual') CHAPTERS=deriveChapters();
  document.getElementById('pgTot').textContent=Math.max(1,N-offsetAt(N-1));
  const sl=document.getElementById('pgSlider'); sl.min=1; sl.max=Math.max(1,N);
  cullPages();
  buildTocLists();
  setBookTitle();
}
function setBookTitle(){ const el=document.getElementById('bookTitle'); if(!el) return;
  if(BOOK_MODE==='manual'){ if(PAGES.some(p=>p.sample)) el.innerHTML='<span class="rt-badge rt-badge-sample">ข้อมูลตัวอย่าง</span>'; else el.textContent='หนังสือรูป'; return; }
  el.textContent = PDF_NAME + (IS_HOSTED?'':' · ดูชั่วคราว'); }
function matchSpread(){ try{ return window.matchMedia(SPREAD_MQ).matches; }catch(e){ return false; } }

/* ════════ TOC + PAGE GRID ════════ */
function tocEntries(){ return CHAPTERS; }
/* เลขหน้าที่แสดง = ตรงกับที่พิมพ์ในเล่ม (offset) — หน้าเปิด/โปรโมชั่นไม่มีเลขพิมพ์ */
function offsetAt(i){ const img=i+1; let off=PAGE_OFFSET; for(const o of PAGE_OFFSETS){ if(img>=o.from) off=o.value; else break; } return off; }
function pageLabel(i){ const pr=i+1-offsetAt(i); return pr>=1 ? String(pr) : (i===0?'ปก':'โปร'); }
function tocRowsHTML(){
  const e=tocEntries();
  if(!e.length) return `<li class="toc-empty rt-caption">PDF นี้ไม่มีสารบัญ (bookmark) — ใช้ “ไปหน้า” ด้านล่างแทน</li>`;
  return e.map(x=>`<li><button class="toc-row" data-idx="${x.index}" onclick="jumpTo(${x.index});closeToc()"><span class="t">${esc(x.title)}</span><span class="dots"></span><span class="n">${pageLabel(x.index)}</span></button></li>`).join('');
}
function pageGridHTML(){ let h=''; for(let i=0;i<N;i++) h+=`<button type="button" class="rt-btn rt-btn-glass rt-btn-sm" data-pg="${i}" onclick="jumpTo(${i});closeToc()">${pageLabel(i)}</button>`; return h; }
function buildPageGrid(){ const g=document.getElementById('pageGrid'); if(g) g.innerHTML=pageGridHTML(); }
function buildTocLists(){ const html=tocRowsHTML();
  const inBook=document.getElementById('tocInBook'); if(inBook) inBook.innerHTML=html;
  const ov=document.getElementById('tocOverlayList'); if(ov) ov.innerHTML=html; buildPageGrid(); }
function highlightToc(){ const vis=visiblePages();
  document.querySelectorAll('.toc-row').forEach(r=>r.classList.toggle('active', vis.includes(+r.dataset.idx)));
  document.querySelectorAll('#pageGrid .rt-btn').forEach(b=>{ const on=vis.includes(+b.dataset.pg); b.classList.toggle('rt-btn-gold',on); b.classList.toggle('rt-btn-glass',!on); }); }

/* ════════ FLIP ENGINE (single + spread) ════════ */
function leafOf(idx){ return Math.ceil(idx/2); }          // จำนวนใบที่พลิกแล้วเพื่อโชว์หน้า idx
function visiblePages(){
  if(!SPREAD) return [currentIndex];
  const L=Math.min(leafEls.length, leafOf(currentIndex)); const out=[];
  if(2*L-1>=0 && 2*L-1<N) out.push(2*L-1);
  if(2*L<N) out.push(2*L);
  return out.length?out:[0];
}
function applyState(animate){
  if(SPREAD){ const lv=leafEls.length, L=Math.min(lv, leafOf(currentIndex));
    leafEls.forEach((el,i)=>{ if(!animate) el.style.transition='none'; el.classList.toggle('flipped', i<L); el.style.zIndex = i<L ? i : (2*lv - i); });
    if(!animate) requestAnimationFrame(()=>leafEls.forEach(el=>el.style.transition=''));
  }else{ pageEls.forEach((el,i)=>{ if(!animate) el.style.transition='none'; el.classList.toggle('flipped', i<currentIndex); el.style.zIndex = i<currentIndex ? i : (2*N - i); });
    if(!animate) requestAnimationFrame(()=>pageEls.forEach(el=>el.style.transition='')); }
}
/* virtualize: แสดงเฉพาะหน้ารอบ ๆ ปัจจุบัน (±2) ที่เหลือ display:none = ไม่กิน GPU layer/แรม (กันมือถือแครช) */
function cullPages(){
  if(SPREAD){ const L=Math.min(leafEls.length, leafOf(currentIndex));
    leafEls.forEach((el,i)=>{ el.style.display=(i>=L-2 && i<=L+2)?'':'none'; }); }
  else { pageEls.forEach((el,i)=>{ el.style.display=(i>=currentIndex-2 && i<=currentIndex+2)?'':'none'; }); }
}
function flipAnim(el, rest){ if(!el){ rest(); return; } el.classList.add('flipping'); el.style.zIndex=999999;
  clearTimeout(el._t); el._t=setTimeout(()=>{ el.classList.remove('flipping'); rest(); },840); }
function step(dir){
  if(SPREAD){
    const lv=leafEls.length; let L=Math.min(lv, leafOf(currentIndex));
    const nl=Math.max(0, Math.min(lv, L+dir)); if(nl===L) return;
    const movingIdx = dir>0 ? nl-1 : nl;
    currentIndex = Math.max(0, Math.min(N-1, 2*nl));
    leafEls.forEach((el,i)=>{ el.classList.toggle('flipped', i<nl); el.style.zIndex = i<nl ? i : (2*lv - i); });
    flipAnim(leafEls[movingIdx], ()=>applyState(true));
  }else{
    const target=currentIndex+dir; if(target<0||target>=N) return;
    const movingIdx = dir>0 ? currentIndex : currentIndex-1;
    currentIndex=target;
    pageEls.forEach((el,i)=>{ el.classList.toggle('flipped', i<currentIndex); el.style.zIndex = i<currentIndex ? i : (2*N - i); });
    flipAnim(pageEls[movingIdx], ()=>applyState(true));
  }
  updateUI();
}
function jumpTo(idx,animate=true){ currentIndex=Math.max(0,Math.min(N-1,+idx)); applyState(animate); updateUI(); }
function updateUI(){
  cullPages();
  const vis=visiblePages();
  document.getElementById('pgCur').textContent = vis.length>1 ? pageLabel(vis[0])+'–'+pageLabel(vis[vis.length-1]) : pageLabel(vis[0]||0);
  document.getElementById('pgSlider').value=(vis[vis.length-1]||0)+1;
  if(SPREAD){ const L=Math.min(leafEls.length, leafOf(currentIndex));
    document.getElementById('btnPrev').disabled=L<=0; document.getElementById('btnNext').disabled=L>=leafEls.length; }
  else{ document.getElementById('btnPrev').disabled=currentIndex<=0; document.getElementById('btnNext').disabled=currentIndex>=N-1; }
  highlightToc();
  hydrateImages();
}

/* สารบัญ + ไปหน้า: คอม/แท็บเล็ต = แผงด้านขวา · มือถือ = แผ่นเลื่อนจากล่าง (ปัดลงปิด) */
let tocApi=null;
function openToc(){
  if(tocApi||!ciReady()) return;
  RattanaUI.drawer({ title:'สารบัญ · ไปหน้า', side:'right',
    content:`<div class="rt-label toc-sec-title">สารบัญ (หมวด)</div><ul class="toc-list" id="tocOverlayList">${tocRowsHTML()}</ul>
      <div class="rt-label toc-sec-title">ไปหน้า — แตะเลขหน้า</div><div class="page-grid" id="pageGrid">${pageGridHTML()}</div>`,
    onOpen(api){ tocApi=api; highlightToc(); const a=api.el.querySelector('.toc-row.active'); if(a) a.scrollIntoView({block:'center'}); },
    onClose(){ tocApi=null; } });
}
function closeToc(){ if(tocApi) tocApi.close(); }
function anyOverlayOpen(){ return !!document.querySelector('.rt-overlay'); }

/* จัดการแหล่งที่มาหนังสือ */
let manageApi=null;
function manageHTML(){
  const isPdf=BOOK_MODE==='pdf';
  const status = !isPdf ? `<span class="rt-badge rt-badge-sample">ข้อมูลตัวอย่าง</span><span class="rt-body-sm">หนังสือตัวอย่าง (demo) · ${N} หน้า</span>`
    : IS_HOSTED ? `<span class="rt-badge rt-badge-success">หนังสือที่แชร์</span><span class="rt-body-sm">${esc(PDF_NAME)} · ${N} หน้า</span>`
    : `<span class="rt-badge rt-badge-warning">ดูชั่วคราว</span><span class="rt-body-sm">${esc(PDF_NAME)} · ${N} หน้า</span>`;
  return `<div class="eb-status">${status}</div>
  <div class="eb-stack">
    <input type="file" id="pdfInput2" accept="application/pdf,.pdf" hidden onchange="const f=this.files[0];this.value='';closeManage();openPdf(f);">
    <button type="button" class="rt-btn rt-btn-gold rt-btn-block" onclick="document.getElementById('pdfInput2').click()">${ICO.file}<span>เปิด PDF ของคุณ (ดูชั่วคราว ไม่บันทึก)</span></button>
    ${isPdf&&!IS_HOSTED?`<button type="button" class="rt-btn rt-btn-glass rt-btn-block" onclick="clearPdf()">${ICO.back}<span>กลับไปหนังสือที่แชร์ไว้</span></button>`:''}
  </div>
  ${isPdf?'':`<div class="eb-manual">
    <p class="rt-caption eb-divider">— หรือสร้างหนังสือจากรูปทีละหน้า —</p>
    <div class="rt-seg rt-seg-block" id="addSeg" role="group" aria-label="วิธีเพิ่มรูป"><button type="button" aria-pressed="${addMode==='url'}">ลิงก์รูป</button><button type="button" aria-pressed="${addMode==='file'}">อัปโหลดรูป</button></div>
    <div class="rt-field${addMode==='url'?'':' hidden'}" id="fieldUrl"><label for="inpUrl">URL รูปภาพหน้า</label><input class="rt-input" id="inpUrl" inputmode="url" placeholder="https://...jpg / .png"></div>
    <div class="rt-field${addMode==='file'?'':' hidden'}" id="fieldFile"><label for="inpFile">เลือกไฟล์รูป</label><input class="rt-input" id="inpFile" type="file" accept="image/*"></div>
    <div class="rt-field"><label for="inpChap">ชื่อบท (แสดงในสารบัญ — เว้นว่างได้)</label><input class="rt-input" id="inpChap" placeholder="เช่น บทที่ 5 — ..."></div>
    <button type="button" class="rt-btn rt-btn-gold rt-btn-block" onclick="addPage()">${ICO.plus}<span>เพิ่มหน้า</span></button>
    <ul class="mng-list" id="mngList"></ul>
  </div>`}`;
}
function openManage(){
  if(!(currentUser&&currentUser.role>=EDIT_MIN_ROLE)){ showToast('ไม่มีสิทธิ์แก้ไข','warning'); return; }
  if(manageApi||!ciReady()) return;
  const isPdf=BOOK_MODE==='pdf', actions=[];
  if(!isPdf) actions.push({ label:'รีเซ็ตหนังสือรูป', variant:'glass', onClick:()=>{ resetBook(); return false; } });
  actions.push({ label:'เสร็จสิ้น', variant:'gold', value:true });
  RattanaUI.popup({ title:'แหล่งที่มาหนังสือ', size:'md', content:manageHTML(), actions,
    onOpen(api){ manageApi=api;
      const seg=api.el.querySelector('#addSeg'); if(seg) seg.addEventListener('rt:change',e=>setAddMode(e.detail.index===1?'file':'url'));
      if(!isPdf) renderMngList(); },
    onClose(){ manageApi=null; } });
}
function closeManage(){ if(manageApi) manageApi.close(); }
function setAddMode(m){ addMode=m;
  document.getElementById('fieldUrl').classList.toggle('hidden',m!=='url'); document.getElementById('fieldFile').classList.toggle('hidden',m!=='file'); }
function commitAdd(img,chap){ PAGES.push({type:'image',img,chapter:chap||''}); saveBook(); buildBook(); jumpTo(N-1); renderMngList(); showToast('เพิ่มหน้าแล้ว ✓','success'); }
function addPage(){
  if(BOOK_MODE==='pdf'){ showToast('อยู่ในโหมด PDF — กลับหนังสือที่แชร์ก่อนจึงจะเพิ่มรูปเองได้','warning'); return; }
  const chap=document.getElementById('inpChap').value.trim();
  if(addMode==='url'){ const url=document.getElementById('inpUrl').value.trim(); if(!url){ showToast('ใส่ลิงก์รูปก่อน','warning'); return; }
    commitAdd(url,chap); document.getElementById('inpUrl').value=''; document.getElementById('inpChap').value=''; }
  else{ const f=document.getElementById('inpFile').files[0]; if(!f){ showToast('เลือกไฟล์ก่อน','warning'); return; }
    const rd=new FileReader(); rd.onload=()=>{ commitAdd(rd.result,chap); document.getElementById('inpFile').value=''; document.getElementById('inpChap').value=''; }; rd.readAsDataURL(f); }
}
function renderMngList(){ const box=document.getElementById('mngList'); if(!box) return;
  box.innerHTML=PAGES.map((p,i)=>{
    const label = p.type==='image' ? (p.chapter||`รูปหน้า ${i+1}`) : p.type==='cover' ? 'ปกหน้า' : p.type==='back' ? 'ปกหลัง' : p.type==='toc' ? 'สารบัญ (อัตโนมัติ)' : (p.chapter||p.kicker||`หน้า ${i+1}`);
    const thumb = p.type==='image' ? `<img class="thumb" src="${esc(p.img)}" alt="">` : `<div class="thumb">${p.type==='toc'?ICO.list:ICO.book}</div>`;
    const locked = p.type==='cover'||p.type==='back'||p.type==='toc';
    return `<li class="rt-list-row mng-item">${thumb}<div class="meta"><span class="rt-cell-main">${esc(label)}</span><span class="rt-cell-sub">หน้า ${i+1} · ${p.type}${p.sample?' · ข้อมูลตัวอย่าง':''}</span></div>
      <div class="acts"><button type="button" class="rt-btn rt-btn-glass rt-btn-icon rt-btn-sm" aria-label="เลื่อนขึ้น" onclick="movePage(${i},-1)">${ICO.up}</button><button type="button" class="rt-btn rt-btn-glass rt-btn-icon rt-btn-sm" aria-label="เลื่อนลง" onclick="movePage(${i},1)">${ICO.down}</button><button type="button" class="rt-btn rt-btn-reject rt-btn-icon rt-btn-sm" aria-label="ลบหน้า" onclick="delPage(${i})" ${locked?'disabled':''}>${ICO.trash}</button></div></li>`;
  }).join(''); }
function movePage(i,dir){ if(BOOK_MODE==='pdf')return; const j=i+dir; if(j<0||j>=PAGES.length) return;
  [PAGES[i],PAGES[j]]=[PAGES[j],PAGES[i]]; saveBook(); buildBook(); renderMngList(); jumpTo(Math.min(currentIndex,N-1),false); }
function delPage(i){ if(BOOK_MODE==='pdf')return; const p=PAGES[i];
  if(p.type==='cover'||p.type==='back'||p.type==='toc'){ showToast('หน้านี้ลบไม่ได้','warning'); return; }
  PAGES.splice(i,1); saveBook(); buildBook(); renderMngList(); jumpTo(Math.min(currentIndex,N-1),false); showToast('ลบหน้าแล้ว','info'); }
async function resetBook(){ if(BOOK_MODE==='pdf'){ showToast('กลับหนังสือที่แชร์ก่อน','warning'); return; }
  const ok = CI() ? await RattanaUI.confirm({ title:'รีเซ็ตหนังสือรูป?', message:'กลับไปเป็นหนังสือตัวอย่างเริ่มต้น หน้าที่เพิ่มไว้จะหายไป', variant:'reject', confirmText:'รีเซ็ต' })
                 : confirm('รีเซ็ตหนังสือรูปกลับค่าเริ่มต้น?');
  if(!ok) return;
  PAGES=JSON.parse(JSON.stringify(DEFAULT_PAGES)); saveBook(); buildBook(); renderMngList(); jumpTo(0,false); showToast('รีเซ็ตแล้ว','success'); }

/* ════════ INPUT: keyboard, swipe, tap-half ════════ */
document.addEventListener('keydown',e=>{ if(document.getElementById('appScreen').style.display==='none'||anyOverlayOpen()) return;
  if(e.key==='ArrowRight') step(1); else if(e.key==='ArrowLeft') step(-1); });
const stage=document.getElementById('bookStage');
let tsx=0,tsy=0,_suppressClick=false;
stage.addEventListener('touchstart',e=>{ tsx=e.changedTouches[0].clientX; tsy=e.changedTouches[0].clientY; },{passive:true});
stage.addEventListener('touchend',e=>{ const dx=e.changedTouches[0].clientX-tsx, dy=e.changedTouches[0].clientY-tsy;
  if(Math.abs(dx)>45 && Math.abs(dx)>Math.abs(dy)){ _suppressClick=true; setTimeout(()=>_suppressClick=false,450); step(dx<0?1:-1); } },{passive:true});
function tapFlip(e){ if(anyOverlayOpen()){ return; } if(_suppressClick){ _suppressClick=false; return; }
  const r=stage.getBoundingClientRect(); if(e.clientX < r.left + r.width*0.5) step(-1); else step(1); }
document.getElementById('tapL').addEventListener('click',()=>{ if(!anyOverlayOpen()&&!_suppressClick) step(-1); });
document.getElementById('tapR').addEventListener('click',()=>{ if(!anyOverlayOpen()&&!_suppressClick) step(1); });

/* rebuild on breakpoint change (mobile 1 page ↔ desktop 2 pages) */
let _rzT; window.addEventListener('resize',()=>{ clearTimeout(_rzT); _rzT=setTimeout(()=>{ if(matchSpread()!==SPREAD){ const keep=currentIndex; buildBook(); jumpTo(keep,false); } },250); });

/* ════════ MISC UI ════════ */
/* กล่องรอ (แปลง PDF) = RattanaUI.popup ที่ปิดเองไม่ได้ + แถบความคืบหน้า */
let busyApi=null, busyWant=false;
function showSpinner(m, frac){
  const msg=m||'กำลังโหลด...', pct = frac==null ? null : Math.round(frac*100);
  busyWant=true;
  if(busyApi){ const t=busyApi.el.querySelector('.eb-busy-msg'); if(t) t.textContent=msg;
    const bar=busyApi.el.querySelector('.rt-progress'); if(bar){ bar.classList.toggle('hidden',pct==null); bar.firstElementChild.style.width=(pct||0)+'%'; } return; }
  if(!CI() || busyApi===false) return;
  busyApi=false;   // กำลังเปิด
  RattanaUI.popup({ size:'sm', dismissible:false, center:true,
    content:`<div class="eb-busy">${ICO.spin}<p class="eb-busy-msg rt-body-sm">${esc(msg)}</p><div class="rt-progress${pct==null?' hidden':''}"><span style="width:${pct||0}%"></span></div></div>`,
    onOpen(api){ busyApi=api; if(!busyWant) api.close(); },
    onClose(){ busyApi=null; } });
}
function hideSpinner(){ busyWant=false; if(busyApi) busyApi.close(); }
function showToast(msg,type='info'){ if(CI()) RattanaUI.toast(msg,{ type, duration:3500 }); else console.log('[E-Book]',msg); }

/* ════════ BOOT ════════ */
/* ธีม (สว่าง/มืด) ตั้งใน <head> ก่อนวาดหน้า · ปุ่มสลับ = data-rt-theme-toggle ของ CI
   ไม่มี login — ทุกคนอ่านได้ (guest role 8 = เห็นปุ่มจัดการเหมือนเดิม) */
/* เริ่มทันทีที่ HTML พร้อม (สคริปต์อยู่ท้าย body) — ไม่รอ window.onload ที่ต้องรอฟอนต์/ทรัพยากรอื่นโหลดครบ */
purgeOldPdfCache();
currentUser={ name:'ผู้อ่าน', nickname:'ผู้อ่าน', role:8 };
enterApp();
</script>
