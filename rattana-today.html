<!doctype html>
<html lang="th" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F4F7FB">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Rattana งานวันนี้ v1.25</title>
  <link rel="stylesheet" href="https://rattanaphaiboon.github.io/app/rattana-ui/rattana-ui.css">
  <script src="https://rattanaphaiboon.github.io/app/rattana-ui/rattana-ui.js" defer></script>
  <style>
    .filters{display:grid;grid-template-columns:1fr;gap:12px;margin-top:14px}
    @media(min-width:760px){.filters{grid-template-columns:minmax(0,520px)}}
    .bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px}
    .bar .grow{flex:1}
    .section{margin-top:16px;padding:16px}
        .shop{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:12px;border-radius:18px;background:var(--hover);align-items:start}
    .shop.done{opacity:.55}
    .seq{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:700;background:var(--field);border:1px solid var(--border)}
    .shop-top{display:flex;gap:8px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}
    .shop-nums{display:flex;gap:16px;flex-wrap:wrap;margin:8px 0 6px}
    .shop-nums div{min-width:96px}
    .shop-act{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
    .badges{display:flex;gap:6px;flex-wrap:wrap}
    .src{margin-top:18px;text-align:center}
    [hidden]{display:none!important}

    /* route summary */
    .route-sum{margin-top:14px}
    .route-sum .rt-table td,.route-sum .rt-table th{vertical-align:middle}
    .route-sum tr[data-route]{cursor:pointer}
    .route-sum tr[data-route]:hover td{background:var(--hover)}
    .route-sum tr.is-on td{background:color-mix(in srgb,var(--gold,#fcb70f) 16%,transparent)}
    .route-sum .tops{max-width:420px}
    .route-bar{height:6px;border-radius:9px;background:var(--line,#e3e8f0);overflow:hidden;margin-top:4px;min-width:60px}
    .route-bar span{display:block;height:100%;background:var(--reject,#dc2626);border-radius:9px}
    .route-total td{font-weight:700}
    @media(max-width:640px){.route-sum .col-hide{display:none}}
    /* falling-sales rows */
    .drop-detail{grid-column:1 / -1;border-top:1px dashed var(--border);padding-top:12px}
    .dd-grid{display:grid;grid-template-columns:1fr;gap:10px}
    @media(min-width:900px){.dd-grid{grid-template-columns:repeat(3,1fr)}.dd-grid4{grid-template-columns:repeat(4,1fr)}}
    @media(min-width:600px) and (max-width:899px){.dd-grid4{grid-template-columns:1fr 1fr}}
    .dd-block{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:10px 12px}
    .dd-h{font-weight:700;font-size:14px}
    .dd-hint{margin:1px 0 6px}
    .dd-list{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
    .dd-list li{display:grid;grid-template-columns:1fr auto;column-gap:8px}
    .dd-list li .rt-cell-sub{grid-column:1}
    .dd-list li b{grid-column:2;grid-row:1 / span 2;align-self:center;white-space:nowrap}
    .dd-empty{padding:6px 0}
    .dd-reco{margin-top:12px}
    .drop-list{display:flex;flex-direction:column;gap:10px;margin-top:14px}
    .drop-row{display:grid;grid-template-columns:64px 1fr;gap:12px 14px;padding:14px;border-radius:18px;background:var(--hover);border:1px solid var(--border)}
    .drop-pct{grid-row:span 2;align-self:start;text-align:center;padding:10px 4px;border-radius:14px;background:color-mix(in srgb,var(--reject,#dc2626) 12%,transparent);color:var(--reject,#dc2626);font-weight:800;font-size:18px;line-height:1.1}
    .drop-pct small{display:block;font-size:10px;font-weight:600;opacity:.85}
    .drop-nums{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:8px}
    .drop-nums > div{min-width:92px}
    .drop-lost{color:var(--reject,#dc2626)}
    .drop-side{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
    .drop-act{display:flex;gap:6px;flex-wrap:wrap}
    .spark{display:block;width:100%;max-width:240px;height:52px}
    .spark .b{fill:#1f3a78}
    .spark .b-cur{fill:#9fb3d9}
    .spark .avg{stroke:#8a94a8;stroke-width:1.5;stroke-dasharray:4 3}
    .spark text{font-size:9px;fill:var(--muted,#6b7896)}
    [data-theme="dark"] .spark .b{fill:#8fb0ec}
    [data-theme="dark"] .spark .b-cur{fill:#3b5a91}
    @media(min-width:900px){
      .drop-row{grid-template-columns:72px 1fr 260px}
      .drop-pct{grid-row:auto}
      .drop-side{grid-column:3;grid-row:1;align-items:stretch}
    }
    /* picker screen (design D): navy band on top, card overlapping it; the app's own top bar is hidden meanwhile */
    body.picking .rt-topbar{display:none}
    /* the warehouse picker is a full screen of its own: no sidebar there */
    body.picking .rt-shell{grid-template-columns:minmax(0,1fr)}
    body.picking .rt-sidebar,body.picking .rt-shell-scrim{display:none!important}
    .rt-shell-main{max-width:1500px}
    .side-brand{color:#fff;position:relative}
    .side-brand small{color:#c7d2e0}
    .side-user{position:relative;align-self:flex-start}
    .rt-sidebar .rt-nav{display:flex;flex-direction:column;gap:4px;position:relative}
    .rt-sidebar .rt-nav-item{width:100%;background:none;font:inherit;cursor:pointer;text-align:left}
    .rt-sidebar .rt-nav-item[aria-current="page"]{background:rgba(252,183,15,.16);color:#fff;border-color:rgba(252,183,15,.35)}
    .rt-sidebar .rt-nav-ico{position:relative;background:rgba(255,255,255,.08)}
    .rt-sidebar .rt-bell .rt-count{position:absolute;top:-6px;right:-8px}
    .side-txt{flex:1;min-width:0}
    .side-date{margin:auto 0 0;color:#9fb0c8;font-size:12px;position:relative}
    @media(min-width:1024px){.rt-shell > .rt-sidebar{min-height:calc(100dvh - 40px)}}
    .wh-screen{max-width:520px;margin:0 auto;position:relative;padding-top:max(16px,env(safe-area-inset-top))}
    .wh-band{position:absolute;top:-400px;left:50%;width:100vw;transform:translateX(-50%);height:calc(400px + 250px);background:linear-gradient(160deg,#0d1b3e,#1f3a78);border-bottom:3px solid #fcb70f;border-radius:0 0 32px 32px;z-index:0}
    .wh-hero{position:relative;z-index:1;color:#fff;padding:6px 4px 0}
    .wh-top{display:flex;align-items:center;gap:10px}
    .wh-icon{color:#fcb70f;border:1px solid rgba(252,183,15,.45)}
    .wh-appname{flex:1;font-size:16px}
    .wh-appname small{font-weight:500;opacity:.65;font-size:12px}
    .wh-theme{color:var(--ink)}
    .wh-date{margin:22px 0 2px;opacity:.75;font-size:13px}
    .wh-greet{color:#fff;margin:0}
    .wh-ask{margin:2px 0 0;opacity:.75}
    .wh-card{position:relative;z-index:1;background:var(--surface)!important;margin-top:22px;padding:20px;border-radius:26px}
    .wh-card .wh-list{margin-top:14px}
    .wh-list{display:flex;flex-direction:column;gap:10px}
    .wh-row{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border-radius:20px;border:1px solid var(--border);background:var(--hover);color:inherit;font:inherit;text-align:left;cursor:pointer;transition:transform .14s,box-shadow .2s}
    .wh-row:hover{box-shadow:var(--shadow-gold,0 4px 12px rgba(252,183,15,.3))}
    .wh-row:active{transform:scale(.98)}
    .wh-row .rt-tile{flex:none;font-weight:800}
    .wh-text{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
    .wh-amt{color:var(--success-text,#15803d)}
    [data-theme="dark"] .wh-amt{color:#4ade80}
    /* W3 light red (the CI has only a strong red tile) */
    .rt-tile-lightred{color:#fff;background:linear-gradient(180deg,#fca5a5,#f26b6b);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 10px 22px -8px rgba(242,107,107,.5)}
    .wh-chev{opacity:.45;flex:none}
    .wh-row.is-soon{opacity:.6}
    .bar .rt-seg{max-width:100%;overflow-x:auto;scrollbar-width:none}
    @media(max-width:640px){
      #kpis{grid-template-columns:1fr 1fr;gap:10px}
      #kpis .rt-kpi{padding:12px}
      #kpis .rt-kpi-value{font-size:20px}
      #kpis .rt-kpi-head .rt-tile{display:none}
    }
    /* ===== Fit the device: phone → tablet → laptop → big screen ===== */
    .list{display:grid;grid-template-columns:1fr;gap:10px;align-items:start}
    .list > #btnMore, .list > .rt-state{grid-column:1 / -1}
    .wh-greet{font-size:clamp(24px,4vw,38px)}
    @media(max-width:360px){
      .wh-row{padding:10px}
      .wh-row .rt-tile-lg{width:44px;height:44px;font-size:14px}
      .shop{grid-template-columns:1fr}
      .shop .seq{width:32px;height:32px}
    }
    /* tablet: picker wider, 2 warehouses per row; stores 2 per row */
    @media(min-width:768px){
      .wh-screen{max-width:680px}
      .wh-row{padding:16px 18px;gap:16px}
      .wh-row .rt-tile-lg{width:60px;height:60px;font-size:19px}
      .wh-row .wh-amt{font-size:18px}
      .list{grid-template-columns:1fr 1fr}
    }
    /* laptop: warehouses stay one per row, just roomier */
    @media(min-width:1100px){
      .wh-screen{max-width:760px}
      .wh-date{margin-top:30px}
      .wh-card{padding:28px}
      .wh-card .wh-list{gap:12px}
    }
    /* big screens: use more width, 3 stores per row */
    @media(min-width:1400px){
      .list{grid-template-columns:repeat(3,1fr)}
    }
    @media(min-width:1700px){
      .rt-container{max-width:1600px}
    }
  </style>
</head>
<body class="rt-app picking" data-rt-login="Rattana งานวันนี้" data-rt-app-glyph="check" data-rt-app-tone="navy">
  <div class="rt-bg"><div class="rt-bg-arc"></div><div class="rt-bg-arc"></div></div>
  <div class="rt-shell">
    <!-- sidebar: laptop = always visible · phone/tablet = slides in from the ☰ button -->
    <nav class="rt-sidebar" aria-label="เมนูหลัก">
      <a class="rt-app-brand side-brand" href="./"><span><b>Rattana งานวันนี้</b><small>v1.25</small></span></a>
      <button data-rt-user class="side-user"></button>
      <div class="rt-nav">
        <button type="button" class="rt-nav-item" id="navWh"><span class="rt-nav-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21V8l9-5 9 5v13M7 21v-8h10v8M7 17h10"/></svg></span><span class="side-txt" id="navWhTxt">เลือกคลัง</span></button>
        <button type="button" class="rt-nav-item" id="btnRefresh"><span class="rt-nav-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5"/></svg></span><span class="side-txt">โหลดข้อมูลใหม่</span></button>
        <button type="button" class="rt-nav-item" data-rt-theme-toggle><span class="rt-nav-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path data-rt-theme-icon d=""/></svg></span><span class="side-txt">สลับธีม · <span data-rt-theme-label>สว่าง</span></span></button>
      </div>
      <p class="side-date" data-rt-date="long"></p>
    </nav>

  <main class="rt-shell-main rt-page">
    <!-- phone / tablet only: menu button + app name -->
    <header class="rt-glass rt-topbar rt-sticky-top rt-hide-desktop">
      <button class="rt-btn rt-btn-glass rt-btn-icon rt-menu-btn" data-rt-menu-toggle aria-label="เมนู"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
      <a class="rt-app-brand" href="./"><span><b>Rattana งานวันนี้</b><small>v1.25</small></span></a>
    </header>

    <section id="whScreen" class="wh-screen">
      <div class="wh-band" aria-hidden="true"></div>
      <div class="wh-hero">
        <div class="wh-top">
          <span class="rt-tile rt-tile-sm rt-tile-navy wh-icon"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2M9 14l2 2 4-4"/></svg></span>
          <b class="wh-appname">Rattana งานวันนี้ <small>v1.25</small></b>
          <button class="rt-btn rt-btn-glass rt-btn-icon wh-theme" data-rt-theme-toggle aria-label="สลับธีม"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path data-rt-theme-icon d=""/></svg></button>
          <button data-rt-user></button>
        </div>
        <p class="wh-date" data-rt-date="long"></p>
        <h1 class="rt-h2 wh-greet" id="whGreet">สวัสดี</h1>
        <p class="wh-ask">วันนี้จะดูคลังไหน</p>
      </div>
      <div class="rt-glass wh-card">
        <h2 class="rt-h3" style="margin:0">เลือกคลัง</h2>
        <p class="rt-cell-sub" id="whSub" style="margin:2px 0 0">จะดูร้านค้าของคลังไหน</p>
        <div class="wh-list" id="whList"></div>
      </div>
    </section>

    <div id="appView" hidden>
    <p class="rt-caption" data-rt-date="long"></p>

    <div class="filters">
      <div class="rt-field">
        <label for="fSales">เซลล์ผู้ดูแล</label>
        <select id="fSales" class="rt-select"><option value="">ทั้งหมด</option></select>
      </div>
      <!-- on hold (hidden for now, still wired up): warehouse select, search, day tabs, KPIs, store list -->
      <div class="rt-field" hidden>
        <label for="fWh">คลัง</label>
        <select id="fWh" class="rt-select"><option value="">ทุกคลัง</option></select>
      </div>
      <div class="rt-field" hidden>
        <label for="fQ">ค้นหาร้าน</label>
        <label class="rt-search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 3a8 8 0 1 0 0 16a8 8 0 1 0 0-16M21 21l-4.3-4.3"/></svg><input id="fQ" type="search" placeholder="ชื่อร้าน / รหัส / ตำบล / เบอร์"></label>
      </div>
    </div>

    <div class="bar">
      <button type="button" class="rt-btn rt-btn-glass rt-btn-sm" id="btnWh">เลือกคลัง</button>
      <div class="rt-seg" role="group" aria-label="ประเภทงาน" id="segMode" hidden>
        <button type="button" aria-pressed="true" data-v="visit">รูทเยี่ยมร้าน</button>
        <button type="button" aria-pressed="false" data-v="deliver">ส่งของ</button>
      </div>
      <div class="rt-seg" role="group" aria-label="วัน" id="segDay" hidden></div>
    </div>


    <div class="rt-grid-kpi" id="kpis" style="margin-top:16px" hidden></div>

    <section class="rt-glass section" hidden>
      <div class="bar" style="margin-top:0">
        <h2 class="rt-h3 grow" id="listTitle">สิ่งที่ต้องทำวันนี้</h2>
        <select id="fSort" class="rt-select rt-w-sm" aria-label="เรียงตาม">
          <option value="seq">เรียงตามลำดับร้าน</option>
          <option value="gap">ขาดเป้ามากสุดก่อน</option>
          <option value="avg">ยอดเฉลี่ยสูงสุดก่อน</option>
        </select>
      </div>
      <div class="bar" id="chips">
        <button class="rt-chip" type="button" aria-pressed="true" data-v="">ทั้งหมด</button>
        <button class="rt-chip" type="button" aria-pressed="false" data-v="none">ยังไม่สั่งเดือนนี้</button>
        <button class="rt-chip" type="button" aria-pressed="false" data-v="low">ต่ำกว่าเป้า</button>
        <button class="rt-chip" type="button" aria-pressed="false" data-v="ok">ถึงเป้าแล้ว</button>
        <button class="rt-chip" type="button" aria-pressed="false" data-v="todo">ยังไม่เยี่ยม</button>
      </div>
      <div class="list" id="list" style="margin-top:14px" data-rt-skeleton="list"></div>
    </section>

    <p class="rt-caption src" id="srcInfo" hidden></p>

    <section class="rt-glass section" id="dropSec" hidden>
      <div class="bar" style="margin-top:0">
        <h2 class="rt-h3 grow" id="dropTitle">ร้านยอดขายตก</h2>
        <select id="dropSort" class="rt-select rt-w-sm" aria-label="เรียงตาม">
          <option value="lost">ยอดหายมากสุดก่อน</option>
          <option value="pct">ตกมากสุด (%) ก่อน</option>
          <option value="avg">ยอดเฉลี่ยสูงสุดก่อน</option>
        </select>
      </div>
      <p class="rt-cell-sub" id="dropSub" style="margin:4px 0 0">กำลังโหลดยอดขายย้อนหลัง…</p>
      <div id="dropRoutes" class="route-sum"></div>
      <div class="drop-list" id="dropList" data-rt-skeleton="list"></div>
      <p class="rt-caption" id="dropNote" style="margin-top:12px"></p>
    </section>
    </div>
  </main>
  </div>

<script>
/* ===== Config ===== */
const BP_ID   = '1NxFkxiQev0xxGir93-qt0flNfzHz848-KuE7jDRSxQE';
const CUST_ID = '1ijTvqCH_VEaTSfKfxd1yOAC_oo6BVFiEaav_KaaLTLE';
// Monthly sales history: one tab per salesperson (Month_Year · Customer_Code · Exvat …)
const HIST_ID = '1R_08VOaWqChx9AbcvqMeXnJUbR0ir9PaVNCvc544icc';
const HIST_TABS = ['นพ อ่อนละมุน','อภิชญา พัวนิรันดร์','รุ่งฟ้า ธรรมรักษ์ษา','สมคิด คุ้มวงค์','วิภา ยิ่งคุ้ม','วิรชัย หัตถกรรม',
  'นพดล พุทธรักษา','สิรธีร์ ยั่งยืน','ชลรดาณัชช์ เอมอิ่ม','ปวริศ ทองก้อน','วรพันธ์ เพ็งจันทร์','สุกรี สรสิทธิ์',
  'จิรายุ วันจันทร์','จารุพัฒน์ หอมวิเชียร','ชัยสิทธิ์ มีศิริ','สุรัตน์ รุ่งฤทธิเดช'];
const DROP_PCT = 0.20;      // "sales dropped" = this month is at least 20% below the 3-month average (pro-rated)
const DROP_PAGE = 50;
const TH_MON = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const DAYS = ['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];
const LS = { sales:'rtToday.sales', wh:'rtToday.wh', visited:'rtToday.visited.' };

/* ===== State ===== */
const S = { dropRoute:'', hist:null, histFailed:[], dropSort:'lost', dropLimit:50, dropKey:'', user:null, wh:null, shops:[], sales:new Map(), dataDate:null, mode:'visit', day:'all', status:'', sort:'seq', limit:200 };
const PAGE = 200;   // cards drawn at a time (all stores ≈ 4,500)

/* ===== Helpers ===== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = s => { const n = parseFloat(String(s ?? '').replace(/,/g,'')); return isFinite(n) ? n : 0; };
const money = n => (window.RattanaUI && RattanaUI.formatMoney) ? RattanaUI.formatMoney(Math.round(n)) : '฿' + Math.round(n).toLocaleString('th-TH');
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const fmtDate = d => d ? ((window.RattanaUI && RattanaUI.formatDate) ? RattanaUI.formatDate(d,'short') : d.toLocaleDateString('th-TH')) : '-';
// "ศุุกร์" -> "ศุกร์" (repeated Thai vowel marks typed twice)
const normDay = s => String(s||'').replace(/([ั-๎])\1+/g,'$1').trim();
const colLetter = i => { let s=''; i++; while(i>0){ const m=(i-1)%26; s=String.fromCharCode(65+m)+s; i=Math.floor((i-1)/26);} return s; };
function parseYmd(s){ const m = String(s||'').match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); return m ? new Date(+m[1], +m[2]-1, +m[3]) : null; }

function parseCsv(text) {
  if (!text) return [];
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i+1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch; }
    else if (ch === '"') q = true;
    else if (ch === ',') { row.push(cell); cell = ''; }
    else if (ch === '\r') {}
    else if (ch === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += ch;
  }
  if (cell.length || row.length) { row.push(cell); rows.push(row); }
  const clean = s => String(s||'').replace(/[​‌‍﻿]/g,'').replace(/ /g,' ').trim();
  return rows.map(r => r.map(clean));
}
async function gviz(id, tq, sheet) {
  let url = `https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:csv`;
  if (sheet) url += `&sheet=${encodeURIComponent(sheet)}`;
  if (tq) url += `&tq=${encodeURIComponent(tq)}`;
  const res = await fetch(url, { cache: 'no-store' });
  if (!res.ok) throw new Error('โหลดชีทไม่สำเร็จ (' + res.status + ')');
  const t = await res.text();
  if (t.startsWith('<')) throw new Error('ชีทไม่ได้แชร์แบบ "ทุกคนที่มีลิงก์"');
  return parseCsv(t);
}

    phone: ix('เบอร์โทร'), loc: ix('Location'), type: ix('ประเภทร้านค้าขอพร'), wh: ix('WH'), route: ix('ชื่อรูท'),
    zone: ix('ชื่อรูท-ตำบล'), sales: ix('เซลล์ผู้ดูแล'), seq: ix('ลำดับร้าน'), deliver: ix('วันส่ง'), f: ix('F'),
    avg: ix('ยอดขายเฉลี่ย3เดือน'), contact: ix('ชื่อผู้ติดต่อ'), line: ix('สายส่ง'), credit: ix('ยอดเงินเครดิต'), oneId: ix('One-Customer-ID')
  };
  if (c.name < 0 || c.code < 0) throw new Error('ไม่พบคอลัมน์ "ชื่อร้านค้า" / "รหัส บีพลัส" ในชีท Customer');
  const g = (r, k) => c[k] >= 0 ? (r[c[k]] || '') : '';
  return rows.slice(1).filter(r => g(r,'code') || g(r,'name')).map(r => ({
    adm: g(r,'area'), name: g(r,'name'), code: String(g(r,'code')), area: [g(r,'addr'), g(r,'moo') && 'ม.' + g(r,'moo'), g(r,'area')].filter(Boolean).join(' '),
    phone: String(g(r,'phone')), loc: g(r,'loc'), type: g(r,'type'), wh: g(r,'wh'),
    routes: normDay(g(r,'route')).split(/[,\/\s]+/).filter(Boolean),
    delivers: normDay(g(r,'deliver')).split(/[,\/\s]+/).filter(Boolean),
    zone: g(r,'zone'), sales: g(r,'sales'), seq: num(g(r,'seq')) || 9999, f: g(r,'f'),
    avg: num(g(r,'avg')), contact: g(r,'contact'), line: g(r,'line'), oneId: String(g(r,'oneId'))
  }));
}

async function loadSales() {
  // Read the header row only, then let Google sum the 80k+ rows per customer (≈100 KB instead of 60 MB)
  const head = (await gviz(BP_ID, 'select * limit 0'))[0] || [];
  const L = k => { const i = head.indexOf(k); if (i < 0) throw new Error('ไม่พบคอลัมน์ "' + k + '" ในชีท BP'); return colLetter(i); };
  // EXVat, not TotalBaht: the 3-month averages (salesperson tabs, Customer sheet) are without VAT
  const cCode = L('Customer_Code'), cName = L('Customer_Name'), cAmt = L('EXVat'), cDate = L('Doc_Date');
  S.bpCols = { code: cCode, prod: L('Product_Name'), amt: cAmt, date: cDate };
  const rows = await gviz(BP_ID, `select ${cCode}, ${cName}, sum(${cAmt}), max(${cDate}) where ${cCode} is not null group by ${cCode}, ${cName} label sum(${cAmt}) 'amt', max(${cDate}) 'last'`);
  const map = new Map(); let maxD = null;
  rows.slice(1).forEach(r => {
    const code = String(r[0]); if (!code) return;
    const d = parseYmd(r[3]);
    if (d && (!maxD || d > maxD)) maxD = d;
    const cur = map.get(code) || { amt: 0, last: null, name: r[1] };
    cur.amt += num(r[2]);
    if (d && (!cur.last || d > cur.last)) cur.last = d;
    map.set(code, cur);
  });
  return { map, maxD };
}

async function loadHistory() {
  const head = (await gviz(HIST_ID, 'select * limit 0', HIST_TABS[0]))[0] || [];
  const L = k => { const i = head.indexOf(k); if (i < 0) throw new Error('ไม่พบคอลัมน์ "' + k + '" ในไฟล์ยอดขายย้อนหลัง'); return colLetter(i); };
  const cCode = L('Customer_Code'), cMon = L('Month_Year'), cAmt = L('Exvat');
  S.histCols = { code: cCode, mon: cMon, amt: cAmt, prod: L('Product_Name') };
  const tq = `select ${cCode}, ${cMon}, sum(${cAmt}) where ${cCode} is not null group by ${cCode}, ${cMon}`;
  const res = await Promise.allSettled(HIST_TABS.map(t => gviz(HIST_ID, tq, t)));
  const map = new Map(), failed = [];
  res.forEach((r, i) => {
    if (r.status !== 'fulfilled') { failed.push(HIST_TABS[i]); return; }
    r.value.slice(1).forEach(row => {
      const code = String(row[0] || ''), d = parseYmd(row[1]); if (!code || !d) return;
      const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
      const cur = map.get(code) || { months: new Map(), tabs: new Set() };
      cur.months.set(key, (cur.months.get(key) || 0) + num(row[2]));
      cur.tabs.add(HIST_TABS[i]);
      map.set(code, cur);
    });
  });
  if (failed.length === HIST_TABS.length) throw new Error('โหลดไฟล์ยอดขายย้อนหลังไม่สำเร็จ');
  return { map, failed };
}
function loadHist() {
  return loadHistory().then(h => { S.hist = h.map; S.histFailed = h.failed; renderDrop(); })
    .catch(e => { console.error(e); if (window.RattanaUI) RattanaUI.state('#dropList', 'error', { title: 'โหลดยอดขายย้อนหลังไม่สำเร็จ', message: e.message, retry: loadHist, compact: true }); });
}

async function loadAll(manual) {
  const btn = $('#btnRefresh');
  if (manual && window.RattanaUI) RattanaUI.setLoading(btn, true);
  try {
    // sales (BP sheet) removed from the app: only the customer list is loaded
    const shops = await loadCustomers(), sales = { map: new Map(), maxD: null };
    // stores that bought this month but are not in the Customer sheet yet
    const known = new Set(shops.map(s => s.code));
    sales.map.forEach((v, code) => {
      if (!known.has(code)) shops.push({ name: v.name || code, code, area: '', phone: '', loc: '', type: '', wh: '', routes: [], delivers: [],
        zone: '', sales: '', seq: 9999, f: '', avg: 0, contact: '', line: '', bpOnly: true });
    });
    S.shops = shops; S.sales = sales.map; S.dataDate = sales.maxD;
    fillFilters();
    applyUser();
    if (!$('#whScreen').hidden) refreshWhScreen();
    render();
    if (manual && window.RattanaUI) RattanaUI.toast('อัปเดตข้อมูลแล้ว', { type: 'success' });
  } catch (e) {
    console.error(e);
    if (window.RattanaUI && RattanaUI.state) {
      RattanaUI.state('#list', 'error', { title: 'โหลดข้อมูลไม่สำเร็จ', message: e.message, retry: () => loadAll(true) });
      $('#kpis').innerHTML = '';
    } else $('#list').textContent = 'โหลดข้อมูลไม่สำเร็จ: ' + e.message;
  } finally {
    if (manual && window.RattanaUI) RattanaUI.setLoading(btn, false);
  }
}

/* ===== Visited (per day, on this device) ===== */
const visitKey = () => LS.visited + iso(new Date());
const getVisited = () => { try { return new Set(JSON.parse(localStorage.getItem(visitKey()) || '[]')); } catch { return new Set(); } };
function toggleVisited(code) {
  const v = getVisited(); v.has(code) ? v.delete(code) : v.add(code);
  localStorage.setItem(visitKey(), JSON.stringify([...v]));
  // keep only today's list
  Object.keys(localStorage).filter(k => k.startsWith(LS.visited) && k !== visitKey()).forEach(k => localStorage.removeItem(k));
  render();
}

/* ===== Compute ===== */
function monthProgress() {
  // count up to the last day that has sales in the BP sheet (today's orders are not in it yet)
  const d = S.dataDate || new Date();
  const dim = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
  return Math.min(1, d.getDate() / dim);
}
function enrich(s, prog, visited, todayIso) {
  const sale = S.sales.get(s.code) || { amt: 0, last: null };
  const target = s.avg * prog;
  let st;
  if (sale.amt <= 0) st = 'none';
  else if (s.avg > 0 && sale.amt < target) st = 'low';
  else st = 'ok';
  return { ...s, amt: sale.amt, last: sale.last, target, gap: Math.max(0, target - sale.amt), st,
           pct: s.avg > 0 ? sale.amt / s.avg : null, orderedToday: sale.last && iso(sale.last) === todayIso, visited: visited.has(s.code) };
}

/* ===== Render ===== */
function render() {
  renderDrop();
  const all = S.day === 'all', dayName = all ? '' : DAYS[S.day];
  const salesF = $('#fSales').value, whF = $('#fWh').value, q = $('#fQ').value.trim().toLowerCase();
  const prog = monthProgress(), visited = getVisited(), todayIso = iso(new Date());

  let base = all ? S.shops.slice() : S.shops.filter(s => (S.mode === 'visit' ? s.routes : s.delivers).includes(dayName));
  if (salesF) base = base.filter(s => s.sales === salesF);
  if (whF) base = base.filter(s => s.wh === whF);
  base = base.map(s => enrich(s, prog, visited, todayIso));

  // KPIs (before status/search filter)
  const n = base.length, nVisited = base.filter(s => s.visited).length;
  // a store code can sit on several Customer rows (one per salesperson/route) — count its sales once
  const sumAmt = [...new Map(base.map(s => [s.code, s.amt])).values()].reduce((a,v) => a + v, 0), sumAvg = base.reduce((a,s) => a + s.avg, 0);
  const nNone = base.filter(s => s.st === 'none').length, nLow = base.filter(s => s.st === 'low').length;
  const sumGap = base.reduce((a,s) => a + s.gap, 0);
  const pctMonth = sumAvg ? sumAmt / sumAvg : 0;
  $('#kpis').innerHTML = `
    ${kpi('gold', icoCheck, S.mode === 'visit' ? 'เยี่ยมแล้ว' : 'ส่งแล้ว (ติ๊ก)', `${nVisited}/${n} ร้าน`, n ? `เหลืออีก ${n - nVisited} ร้าน` : 'ไม่มีร้าน')}
    ${kpi('red', icoAlert, 'ยังไม่สั่งเดือนนี้', `${nNone} ร้าน`, `ต่ำกว่าเป้าอีก ${nLow} ร้าน`)}
    ${kpi('navy', icoChart, 'ยอดเดือนนี้ (ร้านในรายการ)', money(sumAmt), `${Math.round(pctMonth*100)}% ของยอดเฉลี่ย 3 เดือน ${money(sumAvg)}`)}
    ${kpi('amber', icoTarget, 'ยอดที่ควรตามเพิ่ม', money(sumGap), `เทียบเป้าถึงวันนี้ (${Math.round(prog*100)}% ของเดือน)`)}`;

  // list
  let rows = base;
  if (S.status === 'todo') rows = rows.filter(s => !s.visited);
  else if (S.status) rows = rows.filter(s => s.st === S.status);
  if (q) rows = rows.filter(s => [s.name, s.code, s.area, s.zone, s.phone, s.contact].join(' ').toLowerCase().includes(q));
  const sorters = {
    seq: (a,b) => a.visited - b.visited || (all ? dayRank(a) - dayRank(b) : 0) || a.seq - b.seq || a.name.localeCompare(b.name,'th'),
    gap: (a,b) => a.visited - b.visited || b.gap - a.gap || a.seq - b.seq,
    avg: (a,b) => a.visited - b.visited || b.avg - a.avg
  };
  rows.sort(sorters[S.sort]);

  const isToday = S.day === new Date().getDay();
  $('#listTitle').textContent = all ? `ร้านค้าทั้งหมด · ${rows.length.toLocaleString('th-TH')} ร้าน`
    : `${S.mode === 'visit' ? 'ร้านในรูท' : 'ร้านที่ส่งของ'}วัน${dayName}${isToday ? ' (วันนี้)' : ''} · ${rows.length} ร้าน`;

  const list = $('#list');
  if (!rows.length) {
    const msg = n ? 'ลองเปลี่ยนตัวกรองหรือคำค้นหา' : (S.day === 0 ? 'วันอาทิตย์ไม่มีรูท — เลือกวันอื่นด้านบน' : 'ไม่มีร้านในรูทของวันนี้สำหรับตัวกรองที่เลือก');
    if (window.RattanaUI && RattanaUI.state) RattanaUI.state(list, n ? 'search' : 'empty', { title: 'ไม่มีรายการ', message: msg, compact: true });
    else list.textContent = msg;
    return;
  }
  const shown = rows.slice(0, S.limit);
  list.innerHTML = shown.map(shopHtml).join('') + (rows.length > shown.length
    ? `<button type="button" class="rt-btn rt-btn-glass rt-btn-block" id="btnMore">แสดงเพิ่ม (เหลืออีก ${(rows.length - shown.length).toLocaleString('th-TH')} ร้าน)</button>` : '');
  $('#srcInfo').textContent = `ยอดขายจากชีท BP ถึงวันที่ ${fmtDate(S.dataDate)} · ร้านค้าจากชีท Customer · เป้า = ยอดเฉลี่ย 3 เดือน × ${Math.round(prog*100)}% ของเดือน`;
}

function kpi(tone, ico, label, value, sub) {
  return `<div class="rt-glass rt-lift rt-kpi"><div class="rt-kpi-head"><span class="rt-tile rt-tile-${tone}">${ico}</span>${label}</div><span class="rt-kpi-value">${value}</span><span class="rt-kpi-trend"><small>${sub}</small></span></div>`;
}

function shopHtml(s) {
  const badge = {
    none: '<span class="rt-badge rt-badge-danger">ยังไม่สั่งเดือนนี้</span>',
    low:  `<span class="rt-badge rt-badge-warning">ขาดเป้า ${money(s.gap)}</span>`,
    ok:   '<span class="rt-badge rt-badge-success">ถึงเป้าแล้ว</span>'

const monKey = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
function monthsBack(ref, n) { const a = []; for (let i = n; i >= 1; i--) a.push(monKey(new Date(ref.getFullYear(), ref.getMonth() - i, 1))); return a; }
const monLabel = k => TH_MON[+k.slice(5) - 1];
// one bar per month (last 11 months), this month's partial bar lighter, dashed line = 3-month average
function sparkSvg(months, cur, curAmt, avg) {
  const keys = [...months.keys(), cur].filter((k, i, a) => a.indexOf(k) === i && k <= cur).sort().slice(-11);
  const vals = keys.map(k => Math.max(0, k === cur ? curAmt : (months.get(k) || 0)));
  const max = Math.max(avg, ...vals, 1), W = 12, H = 40, bw = 8;
  const y = v => H - (v / max) * (H - 4);
  const bars = keys.map((k, i) => {
    const v = vals[i], h = Math.max(v > 0 ? 2 : 0, H - y(v));
    const tip = `${monLabel(k)} ${+k.slice(0,4) + 543}: ${money(v)}${k === cur ? ' (เดือนนี้ ยังไม่ครบเดือน)' : ''}`;
    return `<rect class="${k === cur ? 'b-cur' : 'b'}" x="${i*W+2}" y="${(H-h).toFixed(1)}" width="${bw}" height="${h.toFixed(1)}" rx="2"><title>${tip}</title></rect>`;
  }).join('');
  const ay = y(avg).toFixed(1), w = keys.length * W + 2;
  return `<svg class="spark" viewBox="0 0 ${w} ${H+12}" preserveAspectRatio="none" role="img" aria-label="ยอดรายเดือน ${monLabel(keys[0])}–${monLabel(cur)}">`
    + `${bars}<line class="avg" x1="0" x2="${w}" y1="${ay}" y2="${ay}"><title>เฉลี่ย 3 เดือน ${money(avg)}</title></line>`
    + `<text x="2" y="${H+10}">${monLabel(keys[0])}</text><text x="${w-2}" y="${H+10}" text-anchor="end">${monLabel(cur)}</text></svg>`;
}
function renderDrop(keepLimit) {
  const list = $('#dropList');

  const wh = $('#fWh').value, salesF = $('#fSales').value;

  if (!keepLimit && key !== S.dropKey) { S.dropLimit = DROP_PAGE; S.dropKey = key; }
  const cur = monKey(S.dataDate), prev = monthsBack(S.dataDate, 3), prog = monthProgress();
  const meF = normName(salesF);

  // One-Customer-ID: Bplus codes of the same customer (e.g. "(FN)", "(เครดิต)" accounts) count as one store
  const groupOf = new Map();
  S.shops.forEach(sh => { if (sh.oneId) groupOf.set(sh.code, sh.oneId); });
  const gid = code => groupOf.get(code) || code;
  const groups = new Map();
  const grp = g => { if (!groups.has(g)) groups.set(g, { codes: new Set(), rows: [], months: new Map(), tabs: new Set(), mtd: 0 }); return groups.get(g); };
  S.shops.forEach(sh => { const G = grp(gid(sh.code)); G.codes.add(sh.code); G.rows.push(sh); });
  S.hist.forEach((h, code) => {
    const G = grp(gid(code)); G.codes.add(code);
    h.months.forEach((v, k) => G.months.set(k, (G.months.get(k) || 0) + v));
    h.tabs.forEach(t => G.tabs.add(t));
  });
  S.sales.forEach((v, code) => { const G = grp(gid(code)); G.codes.add(code); G.mtd += v.amt || 0; });

  let items = [];
  groups.forEach((G, g) => {
    if (!G.tabs.size) return;                                   // no history for this customer
    const avg = prev.reduce((a, k) => a + (G.months.get(k) || 0), 0) / 3;
    if (avg <= 0) return;
    const rows = G.rows;
    if (wh && !rows.some(r => r.wh === wh)) return;
    const fit = rows.filter(r => (!wh || r.wh === wh) && (!salesF || r.sales === salesF));
    if (salesF && !fit.length && ![...G.tabs].some(t => normName(t) === meF)) return;
    const main = r => r.code === g;
    const shop = fit.find(main) || fit[0] || rows.find(r => main(r) && (!wh || r.wh === wh)) || rows.find(r => !wh || r.wh === wh) || rows[0]
      || { name: (S.sales.get(g) || {}).name || g, code: g, area: '', phone: '', loc: '', sales: '', routes: [] };
    const mtd = G.mtd, expected = avg * prog;
    // returns can push this month below zero: cap the drop at 100% and count the gap from zero
    const drop = expected > 0 ? Math.min(1, 1 - mtd / expected) : 0;
    if (drop < DROP_PCT) return;
    items.push({ shop, code: g, codes: [...G.codes].sort(), tabs: [...G.tabs], avg, mtd, expected, drop, lost: expected - Math.max(0, mtd),
      months: G.months, seller: shop.sales || ('คุณ ' + [...G.tabs][0]) });
  });
  const sorters = { lost: (a,b) => b.lost - a.lost, pct: (a,b) => b.drop - a.drop || b.lost - a.lost, avg: (a,b) => b.avg - a.avg };
  items.sort(sorters[S.dropSort]);
  // ---- summary per route (visit day + route area); click a route to list only its stores ----
  const routeOf = x => {
    const r = x.shop.routes || [], d = r.map(v => DAYS.indexOf(v)).filter(i => i >= 0).sort((a, b) => (a || 7) - (b || 7))[0];
    const day = d != null ? DAYS[d] : (r[0] || ''), zone = x.shop.zone || '';
    return { key: day + '|' + zone, day, zone, rank: d != null ? (d || 7) : 8 };
  };
  const R = new Map();
  items.forEach(x => {
    const r = routeOf(x); x.route = r.key;
    if (!R.has(r.key)) R.set(r.key, { ...r, n: 0, lost: 0, none: 0, items: [], sellers: new Set() });
    const g = R.get(r.key); g.n++; g.lost += x.lost; if (x.mtd <= 0) g.none++; g.items.push(x); if (x.seller) g.sellers.add(x.seller);
  });
  const routes = [...R.values()].sort((a, b) => a.rank - b.rank || b.lost - a.lost);
  if (S.dropRoute && !R.has(S.dropRoute)) S.dropRoute = '';
  renderRouteSummary(routes, !salesF);
  const allItems = items;
  if (S.dropRoute) items = items.filter(x => x.route === S.dropRoute);
  S.dropItems = new Map(allItems.map(x => [x.code, x]));
  const lostSum = items.reduce((a, x) => a + x.lost, 0);
  if (window.RattanaUI && RattanaUI.setBadge) RattanaUI.setBadge(allItems.length);
  const rSel = R.get(S.dropRoute);
  $('#dropTitle').textContent = `ร้านยอดขายตก · ${items.length.toLocaleString('th-TH')} ร้าน` + (rSel ? ` · รูท ${routeName(rSel)}` : '');
  $('#dropSub').textContent = `ยอดเดือนนี้ต่ำกว่าค่าเฉลี่ย ${monLabel(prev[0])}–${monLabel(prev[2])} ตั้งแต่ ${DROP_PCT*100}% · ยอดที่หายไปรวม ${money(lostSum)} · ข้อมูลถึง ${fmtDate(S.dataDate)} (${Math.round(prog*100)}% ของเดือน) · ไม่รวม VAT · รวมรหัสที่ One ID เดียวกัน`;
  $('#dropNote').textContent = `ใช้ยอดย้อนหลังจากแท็บเซลล์ ${HIST_TABS.length - S.histFailed.length} คน ร้านของเซลล์ที่ไม่มีแท็บยังไม่แสดง`
    + (S.histFailed.length ? ` · โหลดแท็บไม่สำเร็จ: ${S.histFailed.join(', ')}` : '');
  if (!items.length) {
    if (window.RattanaUI) RattanaUI.state(list, 'empty', { title: 'ไม่มีร้านที่ยอดตก', message: 'ทุกร้านในตัวกรองนี้ยอดไม่ต่ำกว่าค่าเฉลี่ยเกิน ' + DROP_PCT*100 + '%', compact: true });
    return;
  }
  const shown = items.slice(0, S.dropLimit);
  list.innerHTML = shown.map(x => {
    const s = x.shop, tel = (String(s.phone || '').match(/0\d{8,9}/) || [])[0];
    const ll = String(s.loc || '').match(/-?\d+\.\d+\s*,\s*-?\d+\.\d+/);
    const mapUrl = ll ? `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(ll[0].replace(/\s/g,''))}` : '';
    const route = (s.routes || []).join(', ');
    const codes = x.codes.length > 1 ? `One ID ${esc(x.code)} · รวม ${x.codes.length} รหัส (${x.codes.map(esc).join(', ')})` : esc(x.codes[0]);
    return `<div class="drop-row" data-g="${esc(x.code)}">
      <div class="drop-pct">-${Math.round(x.drop*100)}%<small>${x.mtd < 0 ? 'มีคืนสินค้า' : x.mtd === 0 ? 'ยังไม่สั่ง' : 'จากเป้า'}</small></div>
      <div>
        <div class="rt-cell-main">${esc(s.name)}</div>
        <div class="rt-cell-sub">${codes} · ${esc(x.seller)}${route ? ' · รูท ' + esc(route) : ''}</div>
        <div class="drop-nums">
          <div><div class="rt-cell-sub">เดือนนี้</div><div class="rt-cell-main rt-num">${money(x.mtd)}</div></div>
          <div><div class="rt-cell-sub">ควรได้ถึงวันนี้</div><div class="rt-cell-main rt-num">${money(x.expected)}</div></div>
          <div><div class="rt-cell-sub">เฉลี่ย 3 เดือน</div><div class="rt-cell-main rt-num">${money(x.avg)}</div></div>
          <div><div class="rt-cell-sub">ยอดหาย</div><div class="rt-cell-main rt-num drop-lost">${money(x.lost)}</div></div>
        </div>
      </div>
      <div class="drop-side">
        ${sparkSvg(x.months, cur, x.mtd, x.avg)}
        <div class="drop-act">
          <button type="button" class="rt-btn rt-btn-sm rt-btn-gold" data-detail>ดูว่าตกอะไร</button>
          ${tel ? `<a class="rt-btn rt-btn-sm rt-btn-glass" href="tel:${tel}">โทร ${tel}</a>` : ''}
          ${mapUrl ? `<a class="rt-btn rt-btn-sm rt-btn-glass" href="${mapUrl}" target="_blank" rel="noopener">แผนที่</a>` : ''}
        </div>
      </div>
      <div class="drop-detail" hidden></div>
    </div>`;
  }).join('') + (items.length > shown.length
    ? `<button type="button" class="rt-btn rt-btn-glass rt-btn-block" id="btnDropMore">แสดงเพิ่ม (เหลืออีก ${(items.length - shown.length).toLocaleString('th-TH')} ร้าน)</button>` : '');
}

/* ===== Per-store detail: what dropped · what disappeared · not bought for 2 months ===== */
// product names in both files sometimes start with a code ("1151260@คาร์เนชั่น…"): match on the name without it
const normProd = s => String(s || '').replace(/^\s*\d+\s*@\s*/, '').replace(/ /g, ' ').replace(/\s+/g, ' ').trim();
const DETAIL = new Map();   // group id → Promise<detail>
async function loadDetail(x) {
  if (!S.histCols || !S.bpCols) throw new Error('ยังโหลดข้อมูลไม่ครบ');
  const codes = x.codes.filter(c => /^\d+$/.test(c));
  if (!codes.length) throw new Error('ไม่มีรหัสร้าน');
  const H = S.histCols, B = S.bpCols;
  const hw = codes.map(c => `${H.code} = ${c}`).join(' or ');
  const bw = codes.map(c => `${B.code} = ${c}`).join(' or ');
  const [hist, now] = await Promise.all([
    Promise.all(x.tabs.map(t => gviz(HIST_ID, `select ${H.prod}, ${H.mon}, sum(${H.amt}) where ${hw} group by ${H.prod}, ${H.mon}`, t))),
    gviz(BP_ID, `select ${B.prod}, sum(${B.amt}), max(${B.date}) where ${bw} group by ${B.prod}`)
  ]);
  const P = new Map();
  const get = n => { if (!P.has(n)) P.set(n, { name: n, months: new Map(), mtd: 0, lastNow: null }); return P.get(n); };
  hist.forEach(rows => rows.slice(1).forEach(r => {
    const d = parseYmd(r[1]); if (!d) return;
    const p = get(normProd(r[0])), k = monKey(d);
    p.months.set(k, (p.months.get(k) || 0) + num(r[2]));
  }));
  now.slice(1).forEach(r => { const p = get(normProd(r[0])); p.mtd += num(r[1]); p.lastNow = parseYmd(r[2]) || p.lastNow; });
  return [...P.values()];
}
function analyseDetail(prods) {
  const prev = monthsBack(S.dataDate, 3), last = prev[2], prog = monthProgress();
  const cur = monKey(S.dataDate);
  const out = { drop: [], gone: [], idle: [] };
  prods.forEach(p => {
    const avg = prev.reduce((a, k) => a + (p.months.get(k) || 0), 0) / 3;
    const lastAmt = p.months.get(last) || 0;
    const earlier = [...p.months].filter(([k, v]) => k < last && v > 0);
    const lastBought = [...p.months].filter(([k, v]) => k < cur && v > 0).map(([k]) => k).sort().pop();
    if (p.mtd > 0 && avg > 0 && avg * prog - p.mtd > 0)                       // still buying, but less
      out.drop.push({ ...p, avg, lost: avg * prog - p.mtd });
    else if (p.mtd <= 0 && lastAmt > 0)                                       // bought last month, nothing this month
      out.gone.push({ ...p, avg, lastAmt, lastBought });
    else if (p.mtd <= 0 && lastAmt <= 0 && earlier.length)                    // nothing last month and this month
      out.idle.push({ ...p, lastBought, before: earlier.reduce((a, [, v]) => a + v, 0) / earlier.length });
  });
  out.drop.sort((a, b) => b.lost - a.lost);
  out.gone.sort((a, b) => b.avg - a.avg || b.lastAmt - a.lastAmt);
  out.idle.sort((a, b) => b.before - a.before);
  // everything this store has bought (history + this month): not offered again as a suggestion
  const bought = new Set(prods.filter(p => p.mtd > 0 || [...p.months.values()].some(v => v > 0)).map(p => keyProd(p.name)));
  return { bought, drop: out.drop.slice(0, 3), gone: out.gone.slice(0, 3), idle: out.idle.slice(0, 3), counts: { drop: out.drop.length, gone: out.gone.length, idle: out.idle.length } };
}
function detailHtml(a) {
  const mon = k => k ? `${monLabel(k)} ${(+k.slice(0, 4) + 543) % 100}` : '-';
  const li = (name, main, sub) => `<li><span class="rt-cell-main">${esc(name)}</span><span class="rt-cell-sub">${sub}</span><b class="rt-num">${main}</b></li>`;
  const block = (title, hint, rows, empty) => `<div class="dd-block"><div class="dd-h">${title}</div><div class="rt-cell-sub dd-hint">${hint}</div>`
    + (rows.length ? `<ol class="dd-list">${rows.join('')}</ol>` : `<div class="rt-cell-sub dd-empty">${empty}</div>`) + `</div>`;
  return `<div class="dd-grid">`
    + block('📉 ตกอะไร', `ยังซื้ออยู่ แต่น้อยกว่าเดิม · ${a.counts.drop} รายการ`,
        a.drop.map(p => li(p.name, `<span class="drop-lost">-${money(p.lost)}</span>`, `เดือนนี้ ${money(p.mtd)} · เฉลี่ย ${money(p.avg)}`)), 'ไม่มีสินค้าที่ซื้อน้อยลง')
    + block('🚫 เคยขาย หายไป', `ซื้อเดือนที่แล้ว แต่เดือนนี้ยังไม่ซื้อ · ${a.counts.gone} รายการ`,
        a.gone.map(p => li(p.name, money(p.avg), `เดือนที่แล้ว ${money(p.lastAmt)} · เฉลี่ย/เดือน`)), 'ไม่มี')
    + block('⏳ 2 เดือนไม่ซื้อ', `ไม่ซื้อทั้งเดือนที่แล้วและเดือนนี้ · ${a.counts.idle} รายการ`,
        a.idle.map(p => li(p.name, money(p.before), `ซื้อล่าสุด ${mon(p.lastBought)} · เคยซื้อเฉลี่ย/เดือน`)), 'ไม่มี')
    + `</div><div class="dd-reco" data-reco></div>`;
}
async function toggleDetail(btn) {
  const row = btn.closest('.drop-row'), box = row.querySelector('.drop-detail');
  if (!box.hidden) { box.hidden = true; btn.textContent = 'ดูว่าตกอะไร'; return; }

}
function parseIB(raw) {                          // "YYYY/MM/DD VOLUME x FREE y VALUE z" (VALUE = cost per case)
  const s = String(raw || ''), m = s.match(/(\d{4})\/(\d{1,2})\/(\d{1,2})/);
  const v = s.match(/VALUE\s*([\d.,]+)/i);
  return m ? { date: new Date(+m[1], +m[2] - 1, +m[3]), value: v ? numv(v[1]) : 0 } : null;
}
function parseDay(raw) {                         // "YYYY/MM/DD" or "D/M/YYYY"
  const s = String(raw || '').trim();
  let m = s.match(/^(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})/); if (m) return new Date(+m[1], +m[2] - 1, +m[3]);
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/); if (m) return new Date(+m[3] > 2400 ? +m[3] - 543 : +m[3], +m[2] - 1, +m[1]);
  return null;
}
const daysAgo = d => Math.floor((new Date().setHours(0, 0, 0, 0) - d.getTime()) / 86400000);
let PDDT = null;
function loadPddt() {
  if (PDDT) return PDDT;
  PDDT = (async () => {
    const head = (await gviz(PRODUCT_ID, 'select * limit 0', 'PDDT'))[0] || [];
    const want = ['PRODUCT NAME', 'QTY CS', 'FIRST STOCK DATE', 'PRICE S00 CS', 'CAT BRAND', 'CAT SIZE'];
    ['W1', 'W2', 'W3', 'W4'].forEach(w => want.push('STOCK ' + w, 'IB ' + w, 'AVERAGE 60D_' + w, 'SELL 7D ' + w));
    const cols = want.filter(k => head.includes(k));
    const rows = await gviz(PRODUCT_ID, 'select ' + cols.map(k => colLetter(head.indexOf(k))).join(', '), 'PDDT');
    return rows.slice(1).map(r => Object.fromEntries(cols.map((k, i) => [k, r[i] || ''])))
      .filter(p => p['PRODUCT NAME'] && !STD.exBrand.test(p['CAT BRAND'] + ' ' + p['CAT SIZE']) && !STD.exName.test(p['PRODUCT NAME']));
  })();
  PDDT.catch(() => { PDDT = null; });
  return PDDT;
}
function deadSeg(p, wh) {                        // Rattana Sales _stdSeg
  const q = numv(p['QTY CS']) || 1, ea = stockEa(p['STOCK ' + wh], q);
  if (!(ea > 0)) return null;
  const ib = parseIB(p['IB ' + wh]);
  if (ib && daysAgo(ib.date) < STD.slowDays) return null;
  const avg = numv(p['AVERAGE 60D_' + wh]), s7 = numv(p['SELL 7D ' + wh]);
  let per = ib ? ib.value : 0; const s00 = numv(p['PRICE S00 CS']);
  if (per > 0 && s00 > 0 && per > s00 * STD.costX) per = 0;
  const cs = ea / q, val = cs * per;
  if (avg <= 0 && s7 <= 0) return { seg: 'dead', cs, val };
  if (avg > 0 && ea / avg > STD.slowDays && val >= STD.slowMin) return { seg: 'slow', cs, val, days: ea / avg };
  return null;
}
function newSku(p, wh) {                         // Rattana Sales _sugIsNewStd + stock & ≥14 days of cover
  const d = parseDay(p['FIRST STOCK DATE']); if (!d) return null;
  const age = daysAgo(d); if (age < 0 || age > STD.newDays) return null;
  const q = numv(p['QTY CS']) || 1, ea = stockEa(p['STOCK ' + wh], q); if (!(ea > 0)) return null;
  const avg = numv(p['AVERAGE 60D_' + wh]);
  if (avg > 0 && ea / avg < STD.coverDays) return null;
  return { date: d, age, cs: ea / q };
}
const DRECO = new Map();
function loadDreco(amphoe) {
  if (!DRECO.has(amphoe)) {
    const p = gviz(BACKEND_ID, `select * where A = '${amphoe.replace(/'/g, '')}'`, 'DistrictReco').then(rows => {
      const h = rows[0] || [], ix = k => h.indexOf(k);
      return rows.slice(1).map(r => ({ name: r[ix('ชื่อสินค้า')], buyers: numv(r[ix('ร้านที่ซื้อ')]), all: numv(r[ix('ร้านทั้งหมด')]),
        pct: numv(r[ix('%เข้าถึง')]), baht: numv(r[ix('ยอดขายบาท')]), type: String(r[ix('ประเภทร้าน')] || '').trim() })).filter(r => r.name);
    });
    p.catch(() => DRECO.delete(amphoe));
    DRECO.set(amphoe, p);
  }
  return DRECO.get(amphoe);
}
function amphoeOf(raw) {                         // "ตำบล,อำเภอ,จังหวัด" (or "อ.xxx จ.yyy")
  const s = String(raw || '');
  const m = s.match(/(?:อ\.|อำเภอ|เขต)\s*([^\s,]+(?:\s+[^\s,]+)*?)(?:\s+(?:จ\.|จังหวัด)|\s*$|,)/);
  if (m) return m[1].trim();
  const parts = s.split(',').map(x => x.trim()).filter(Boolean);
  return parts.length >= 2 ? parts[parts.length - 2].replace(/^(อ\.|อำเภอ|เขต)\s*/, '') : '';
}
function seeded(seedStr) {                       // same store → same picks all day; other stores get other picks
  let h = 2166136261; for (const c of seedStr) h = Math.imul(h ^ c.charCodeAt(0), 16777619);
  return () => { h += 0x6D2B79F5; let t = h; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
const pickRandom = (arr, n, rnd) => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a.slice(0, n); };
async function renderReco(x, box, bought) {
  if (!box) return;
  box.innerHTML = '<div class="dd-h" style="margin-top:4px">💡 สินค้าแนะนำ</div><div class="rt-skeleton" style="height:90px;border-radius:14px"></div>';
  const s = x.shop, amphoe = amphoeOf(s.adm), type = String(s.type || '').trim();
  const wh = ({ HQ: 'W1', '': 'W1' })[s.wh || ''] || s.wh;
  const has = n => bought.has(keyProd(n));
  const rnd = seeded(x.code + '|' + iso(new Date()));
  const [dr, pd] = await Promise.allSettled([amphoe ? loadDreco(amphoe) : Promise.resolve([]), loadPddt()]);
  const groups = [];
  if (dr.status === 'fulfilled') {
    const rows = dr.value.filter(r => !has(r.name));
    const byType = type ? rows.filter(r => r.type === type) : [];
    const all = rows.filter(r => !r.type);
    const top21 = (byType.length ? byType : all).filter(r => r.baht > 0).sort((a, b) => b.baht - a.baht).slice(0, 2);
    const used = new Set(top21.map(r => keyProd(r.name)));
    const top22 = all.filter(r => !used.has(keyProd(r.name))).sort((a, b) => b.buyers - a.buyers || b.pct - a.pct).slice(0, 2);
    groups.push({ t: `🏆 ขายดีในอำเภอ${amphoe ? ' ' + amphoe : ''}`, h: byType.length ? `ประเภท ${type.replace(/^ร้าน/, '')} · ร้านนี้ยังไม่เคยซื้อ` : 'ร้านนี้ยังไม่เคยซื้อ',
      items: top21.map(r => [r.name, `ขาย ${money(r.baht)}`]) });
    groups.push({ t: '🌐 กระจายทั่วอำเภอ', h: 'ร้านส่วนใหญ่ในอำเภอซื้อ',
      items: top22.map(r => [r.name, `${r.buyers}${r.all ? '/' + r.all : ''} ร้าน · ${Math.round(r.pct)}%`]) });
  } else groups.push({ t: '🏆 แนะนำจากอำเภอ', h: 'โหลดไม่สำเร็จ', items: [] });
  if (pd.status === 'fulfilled') {
    const dead = [], fresh = [];
    pd.value.forEach(p => {
      if (has(p['PRODUCT NAME'])) return;
      const d = deadSeg(p, wh); if (d) dead.push([p['PRODUCT NAME'], d.seg === 'dead' ? `ค้าง ${Math.round(d.cs)} ลัง · ไม่ขยับ 60 วัน` : `ค้าง ${Math.round(d.cs)} ลัง · ขายได้อีก ${Math.round(d.days)} วัน`]);
      const n = newSku(p, wh); if (n) fresh.push([p['PRODUCT NAME'], `เข้าคลัง ${fmtDate(n.date)} · มี ${Math.round(n.cs)} ลัง`]);
    });
    groups.push({ t: `🐢 Deadstock ${wh}`, h: `สุ่มจาก ${dead.length} รายการ`, items: pickRandom(dead, 2, rnd) });
    groups.push({ t: `🆕 สินค้าใหม่ ${wh}`, h: `สุ่มจาก ${fresh.length} รายการ`, items: pickRandom(fresh, 2, rnd) });
  } else groups.push({ t: '🐢 Deadstock / 🆕 สินค้าใหม่', h: 'โหลดข้อมูลสินค้าไม่สำเร็จ', items: [] });
  box.innerHTML = '<div class="dd-h" style="margin-top:4px">💡 สินค้าแนะนำ</div><div class="dd-grid dd-grid4">' + groups.map(g =>
    `<div class="dd-block"><div class="dd-h">${g.t}</div><div class="rt-cell-sub dd-hint">${esc(g.h)}</div>`
    + (g.items.length ? `<ol class="dd-list">${g.items.map(([n, sub]) => `<li><span class="rt-cell-main">${esc(normProd(n))}</span><span class="rt-cell-sub">${esc(sub)}</span></li>`).join('')}</ol>`
      : '<div class="rt-cell-sub dd-empty">ไม่มีรายการ</div>') + '</div>').join('') + '</div>';
}

/* ===== Route summary for the falling-sales list ===== */
const routeName = r => (r.day ? r.day : 'ไม่มีวันรูท') + (r.zone ? ' · ' + r.zone : '');
function renderRouteSummary(routes, showSeller) {
  const box = $('#dropRoutes');
  if (!routes.length) { box.innerHTML = ''; return; }
  const max = Math.max(...routes.map(r => r.lost), 1);
  const tot = routes.reduce((a, r) => ({ n: a.n + r.n, lost: a.lost + r.lost, none: a.none + r.none }), { n: 0, lost: 0, none: 0 });
  box.innerHTML = `<div class="rt-cell-sub" style="margin-bottom:6px">สรุปแยกตามรูท · กดรูทเพื่อดูเฉพาะร้านในรูทนั้น${S.dropRoute ? ' (กดซ้ำเพื่อดูทั้งหมด)' : ''}</div>
  <div class="rt-table-wrap"><table class="rt-table">
    <thead><tr><th scope="col">รูท</th><th scope="col" class="rt-right">ร้านยอดตก</th><th scope="col" class="rt-right">ยอดหาย</th><th scope="col" class="col-hide">ร้านที่หายมากสุด</th></tr></thead>
    <tbody>${routes.map(r => {
      const tops = r.items.slice().sort((a, b) => b.lost - a.lost).slice(0, 3).map(x => esc(x.shop.name)).join(' · ');
      const sellers = showSeller && r.sellers.size ? [...r.sellers].slice(0, 2).map(esc).join(', ') + (r.sellers.size > 2 ? ` +${r.sellers.size - 2}` : '') : '';
      return `<tr data-route="${esc(r.key)}" class="${S.dropRoute === r.key ? 'is-on' : ''}">
        <td><div class="rt-cell-main">${esc(routeName(r))}</div>${sellers ? `<div class="rt-cell-sub">${sellers}</div>` : ''}</td>
        <td class="rt-right"><div class="rt-cell-main">${r.n}</div><div class="rt-cell-sub">ไม่สั่งเลย ${r.none}</div></td>
        <td class="rt-right"><div class="rt-cell-main rt-num">${money(r.lost)}</div><div class="route-bar" aria-hidden="true"><span style="width:${Math.max(2, Math.round(r.lost / max * 100))}%"></span></div></td>
        <td class="col-hide"><div class="rt-cell-sub tops">${tops}</div></td></tr>`;
    }).join('')}
      <tr class="route-total"><td>รวม ${routes.length} รูท</td><td class="rt-right">${tot.n}</td><td class="rt-right rt-num">${money(tot.lost)}</td><td class="col-hide"></td></tr>
    </tbody></table></div>`;
}

/* ===== Events ===== */
function segPick(el, e) {
  const b = e.target.closest('button'); if (!b) return null;
  el.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b));
  return b.dataset.v;
}
document.addEventListener('DOMContentLoaded', () => {
  buildDaySeg();
  $('#segMode').addEventListener('click', e => { const v = segPick($('#segMode'), e); if (v) { S.mode = v; render(); } });
  $('#segDay').addEventListener('click', e => { const v = segPick($('#segDay'), e); if (v != null) { S.day = v === 'all' ? 'all' : +v; S.limit = PAGE; render(); } });
  $('#chips').addEventListener('click', e => { const v = segPick($('#chips'), e); if (v != null) { S.status = v; render(); } });
  $('#fSales').addEventListener('change', e => { localStorage.setItem(LS.sales, e.target.value); render(); });
  $('#fWh').addEventListener('change', e => { S.wh = e.target.value; localStorage.setItem(LS.wh, S.wh); fillFilters(); render(); });
  $('#btnWh').addEventListener('click', pickWh);
  // sidebar menu (on phones it slides in: close it after a choice)
  const closeMenu = () => { if (innerWidth < 1024) { const sc = document.querySelector('.rt-shell-scrim'); if (sc) sc.click(); } };
  $('#navWh').addEventListener('click', () => { closeMenu(); pickWh(); });
  $('#whList').addEventListener('click', onWhClick);
  refreshWhScreen();
  $('#fSort').addEventListener('change', e => { S.sort = e.target.value; render(); });
  $('#fQ').addEventListener('input', () => { S.limit = PAGE; render(); });
  ['#fSales','#fWh','#fSort'].forEach(id => $(id).addEventListener('change', () => { S.limit = PAGE; }, true));
  $('#chips').addEventListener('click', () => { S.limit = PAGE; }, true);
  $('#list').addEventListener('click', e => { if (e.target.closest('#btnMore')) { S.limit += PAGE; render(); } });
  $('#list').addEventListener('click', e => { const b = e.target.closest('[data-visit]'); if (b) toggleVisited(b.dataset.visit); });
  $('#btnRefresh').addEventListener('click', () => loadAll(true));
  $('#dropSort').addEventListener('change', e => { S.dropSort = e.target.value; renderDrop(); });
  $('#dropList').addEventListener('click', e => { const b = e.target.closest('[data-detail]'); if (b) toggleDetail(b); });
  $('#dropRoutes').addEventListener('click', e => {
    const b = e.target.closest('[data-route]'); if (!b) return;
    S.dropRoute = S.dropRoute === b.dataset.route ? '' : b.dataset.route;
    renderDrop(); $('#dropList').scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
  $('#dropList').addEventListener('click', e => { if (e.target.closest('#btnDropMore')) { S.dropLimit += DROP_PAGE; renderDrop(true); } });
  S.loading = loadAll(false);
  // falling-sales section removed from the screen for now: don't download the sales history
  if (window.RattanaUI && RattanaUI.user) RattanaUI.user.ready.then(u => { S.user = u; refreshWhScreen(); });
  // background refresh every 10 minutes, no spinner
  setInterval(() => loadAll(false), 10 * 60 * 1000);
});
</script>
