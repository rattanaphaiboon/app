<!doctype html>
<html lang="th" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F4F7FB">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Rattana งานวันนี้ v1.9</title>
  <link rel="stylesheet" href="https://rattanaphaiboon.github.io/app/rattana-ui/rattana-ui.css">
  <script src="https://rattanaphaiboon.github.io/app/rattana-ui/rattana-ui.js" defer></script>
  <style>
    .filters{display:grid;grid-template-columns:1fr;gap:12px;margin-top:14px}
    @media(min-width:760px){.filters{grid-template-columns:2fr 1fr 2fr}}
    .bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px}
    .bar .grow{flex:1}
    .section{margin-top:16px;padding:16px}
        .shop{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:12px;border-radius:18px;background:var(--hover);align-items:start}
    .shop.done{opacity:.55}
    .seq{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:700;background:var(--field);border:1px solid var(--border)}
    .shop-top{display:flex;gap:8px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}
    .shop-nums{display:flex;gap:16px;flex-wrap:wrap;margin:8px 0 6px}
    .shop-nums div{min-width:96px}
    .shop-act{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
    .badges{display:flex;gap:6px;flex-wrap:wrap}
    .src{margin-top:18px;text-align:center}
    [hidden]{display:none!important}
    /* picker screen (design D): navy band on top, card overlapping it; the app's own top bar is hidden meanwhile */
    body.picking .rt-topbar{display:none}
    .wh-screen{max-width:520px;margin:0 auto;position:relative;padding-top:max(16px,env(safe-area-inset-top))}
    .wh-band{position:absolute;top:-400px;left:50%;width:100vw;transform:translateX(-50%);height:calc(400px + 250px);background:linear-gradient(160deg,#0d1b3e,#1f3a78);border-bottom:3px solid #fcb70f;border-radius:0 0 32px 32px;z-index:0}
    .wh-hero{position:relative;z-index:1;color:#fff;padding:6px 4px 0}
    .wh-top{display:flex;align-items:center;gap:10px}
    .wh-icon{color:#fcb70f;border:1px solid rgba(252,183,15,.45)}
    .wh-appname{flex:1;font-size:16px}
    .wh-appname small{font-weight:500;opacity:.65;font-size:12px}
    .wh-theme{color:var(--ink)}
    .wh-date{margin:22px 0 2px;opacity:.75;font-size:13px}
    .wh-greet{color:#fff;margin:0}
    .wh-ask{margin:2px 0 0;opacity:.75}
    .wh-card{position:relative;z-index:1;background:var(--surface)!important;margin-top:22px;padding:20px;border-radius:26px}
    .wh-card .wh-list{margin-top:14px}
    .wh-list{display:flex;flex-direction:column;gap:10px}
    .wh-row{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border-radius:20px;border:1px solid var(--border);background:var(--hover);color:inherit;font:inherit;text-align:left;cursor:pointer;transition:transform .14s,box-shadow .2s}
    .wh-row:hover{box-shadow:var(--shadow-gold,0 4px 12px rgba(252,183,15,.3))}
    .wh-row:active{transform:scale(.98)}
    .wh-row .rt-tile{flex:none;font-weight:800}
    .wh-text{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
    .wh-amt{color:var(--success-text,#15803d)}
    [data-theme="dark"] .wh-amt{color:#4ade80}
    /* W3 light red (the CI has only a strong red tile) */
    .rt-tile-lightred{color:#fff;background:linear-gradient(180deg,#fca5a5,#f26b6b);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 10px 22px -8px rgba(242,107,107,.5)}
    .wh-chev{opacity:.45;flex:none}
    .wh-row.is-soon{opacity:.6}
    .bar .rt-seg{max-width:100%;overflow-x:auto;scrollbar-width:none}
    @media(max-width:640px){
      #kpis{grid-template-columns:1fr 1fr;gap:10px}
      #kpis .rt-kpi{padding:12px}
      #kpis .rt-kpi-value{font-size:20px}
      #kpis .rt-kpi-head .rt-tile{display:none}
    }
    /* ===== Fit the device: phone → tablet → laptop → big screen ===== */
    .list{display:grid;grid-template-columns:1fr;gap:10px;align-items:start}
    .list > #btnMore, .list > .rt-state{grid-column:1 / -1}
    .wh-greet{font-size:clamp(24px,4vw,38px)}
    @media(max-width:360px){
      .wh-row{padding:10px}
      .wh-row .rt-tile-lg{width:44px;height:44px;font-size:14px}
      .shop{grid-template-columns:1fr}
      .shop .seq{width:32px;height:32px}
    }
    /* tablet: picker wider, 2 warehouses per row; stores 2 per row */
    @media(min-width:768px){
      .wh-screen{max-width:680px}
      .wh-row{padding:16px 18px;gap:16px}
      .wh-row .rt-tile-lg{width:60px;height:60px;font-size:19px}
      .wh-row .wh-amt{font-size:18px}
      .list{grid-template-columns:1fr 1fr}
    }
    /* laptop: warehouses stay one per row, just roomier */
    @media(min-width:1100px){
      .wh-screen{max-width:760px}
      .wh-date{margin-top:30px}
      .wh-card{padding:28px}
      .wh-card .wh-list{gap:12px}
    }
    /* big screens: use more width, 3 stores per row */
    @media(min-width:1400px){
      .list{grid-template-columns:repeat(3,1fr)}
    }
    @media(min-width:1700px){
      .rt-container{max-width:1600px}
    }
  </style>
</head>
<body class="rt-app picking" data-rt-login="Rattana งานวันนี้" data-rt-app-glyph="check" data-rt-app-tone="navy">

    <section id="whScreen" class="wh-screen">

        <div class="wh-top">
          <span class="rt-tile rt-tile-sm rt-tile-navy wh-icon"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2M9 14l2 2 4-4"/></svg></span>

<script>
/* ===== Config ===== */
const BP_ID   = '1NxFkxiQev0xxGir93-qt0flNfzHz848-KuE7jDRSxQE';
const CUST_ID = '1ijTvqCH_VEaTSfKfxd1yOAC_oo6BVFiEaav_KaaLTLE';
const DAYS = ['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];
const LS = { sales:'rtToday.sales', wh:'rtToday.wh', visited:'rtToday.visited.' };

/* ===== State ===== */
const S = { user:null, wh:null, shops:[], sales:new Map(), dataDate:null, mode:'visit', day:'all', status:'', sort:'seq', limit:200 };
const PAGE = 200;   // cards drawn at a time (all stores ≈ 4,500)

/* ===== Helpers ===== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = s => { const n = parseFloat(String(s ?? '').replace(/,/g,'')); return isFinite(n) ? n : 0; };
const money = n => (window.RattanaUI && RattanaUI.formatMoney) ? RattanaUI.formatMoney(Math.round(n)) : '฿' + Math.round(n).toLocaleString('th-TH');
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const fmtDate = d => d ? ((window.RattanaUI && RattanaUI.formatDate) ? RattanaUI.formatDate(d,'short') : d.toLocaleDateString('th-TH')) : '-';
// "ศุุกร์" -> "ศุกร์" (repeated Thai vowel marks typed twice)
const normDay = s => String(s||'').replace(/([ั-๎])\1+/g,'$1').trim();
const colLetter = i => { let s=''; i++; while(i>0){ const m=(i-1)%26; s=String.fromCharCode(65+m)+s; i=Math.floor((i-1)/26);} return s; };
function parseYmd(s){ const m = String(s||'').match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); return m ? new Date(+m[1], +m[2]-1, +m[3]) : null; }

function parseCsv(text) {
  if (!text) return [];
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i+1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch; }
    else if (ch === '"') q = true;
    else if (ch === ',') { row.push(cell); cell = ''; }
    else if (ch === '\r') {}
    else if (ch === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += ch;
  }
  if (cell.length || row.length) { row.push(cell); rows.push(row); }
  const clean = s => String(s||'').replace(/[​‌‍﻿]/g,'').replace(/ /g,' ').trim();
  return rows.map(r => r.map(clean));
}
async function gviz(id, tq, sheet) {
  let url = `https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:csv`;
  if (sheet) url += `&sheet=${encodeURIComponent(sheet)}`;
  if (tq) url += `&tq=${encodeURIComponent(tq)}`;
  const res = await fetch(url, { cache: 'no-store' });
  if (!res.ok) throw new Error('โหลดชีทไม่สำเร็จ (' + res.status + ')');
  const t = await res.text();
  if (t.startsWith('<')) throw new Error('ชีทไม่ได้แชร์แบบ "ทุกคนที่มีลิงก์"');
  return parseCsv(t);
}

/* ===== Load data ===== */
async function loadCustomers() {
  const rows = await gviz(CUST_ID);
  const h = rows[0]; const ix = k => h.indexOf(k);
  const c = {
    name: ix('ชื่อร้านค้า'), code: ix('รหัส บีพลัส'), addr: ix('ที่อยู่'), moo: ix('หมู่'), area: ix('ต.,อ.,จ. ขอพร'),
    phone: ix('เบอร์โทร'), loc: ix('Location'), type: ix('ประเภทร้านค้าขอพร'), wh: ix('WH'), route: ix('ชื่อรูท'),
    zone: ix('ชื่อรูท-ตำบล'), sales: ix('เซลล์ผู้ดูแล'), seq: ix('ลำดับร้าน'), deliver: ix('วันส่ง'), f: ix('F'),
    avg: ix('ยอดขายเฉลี่ย3เดือน'), contact: ix('ชื่อผู้ติดต่อ'), line: ix('สายส่ง'), credit: ix('ยอดเงินเครดิต')
  };
  if (c.name < 0 || c.code < 0) throw new Error('ไม่พบคอลัมน์ "ชื่อร้านค้า" / "รหัส บีพลัส" ในชีท Customer');
  const g = (r, k) => c[k] >= 0 ? (r[c[k]] || '') : '';
  return rows.slice(1).filter(r => g(r,'code') || g(r,'name')).map(r => ({
    name: g(r,'name'), code: String(g(r,'code')), area: [g(r,'addr'), g(r,'moo') && 'ม.' + g(r,'moo'), g(r,'area')].filter(Boolean).join(' '),
    phone: String(g(r,'phone')), loc: g(r,'loc'), type: g(r,'type'), wh: g(r,'wh'),
    routes: normDay(g(r,'route')).split(/[,\/\s]+/).filter(Boolean),
    delivers: normDay(g(r,'deliver')).split(/[,\/\s]+/).filter(Boolean),
    zone: g(r,'zone'), sales: g(r,'sales'), seq: num(g(r,'seq')) || 9999, f: g(r,'f'),
    avg: num(g(r,'avg')), contact: g(r,'contact'), line: g(r,'line')
  }));
}

async function loadSales() {
  // Read the header row only, then let Google sum the 80k+ rows per customer (≈100 KB instead of 60 MB)
  const head = (await gviz(BP_ID, 'select * limit 0'))[0] || [];
  const L = k => { const i = head.indexOf(k); if (i < 0) throw new Error('ไม่พบคอลัมน์ "' + k + '" ในชีท BP'); return colLetter(i); };
  const cCode = L('Customer_Code'), cName = L('Customer_Name'), cAmt = L('TotalBaht'), cDate = L('Doc_Date');
  const rows = await gviz(BP_ID, `select ${cCode}, ${cName}, sum(${cAmt}), max(${cDate}) where ${cCode} is not null group by ${cCode}, ${cName} label sum(${cAmt}) 'amt', max(${cDate}) 'last'`);
  const map = new Map(); let maxD = null;
  rows.slice(1).forEach(r => {
    const code = String(r[0]); if (!code) return;
    const d = parseYmd(r[3]);
    if (d && (!maxD || d > maxD)) maxD = d;
    const cur = map.get(code) || { amt: 0, last: null, name: r[1] };
    cur.amt += num(r[2]);
    if (d && (!cur.last || d > cur.last)) cur.last = d;
    map.set(code, cur);
  });
  return { map, maxD };
}

async function loadAll(manual) {
  const btn = $('#btnRefresh');
  if (manual && window.RattanaUI) RattanaUI.setLoading(btn, true);
  try {
    const [shops, sales] = await Promise.all([loadCustomers(), loadSales()]);
    // stores that bought this month but are not in the Customer sheet yet
    const known = new Set(shops.map(s => s.code));
    sales.map.forEach((v, code) => {
      if (!known.has(code)) shops.push({ name: v.name || code, code, area: '', phone: '', loc: '', type: '', wh: '', routes: [], delivers: [],
        zone: '', sales: '', seq: 9999, f: '', avg: 0, contact: '', line: '', bpOnly: true });
    });
    S.shops = shops; S.sales = sales.map; S.dataDate = sales.maxD;
    fillFilters();
    applyUser();
    if (!$('#whScreen').hidden) refreshWhScreen();
    render();
    if (manual && window.RattanaUI) RattanaUI.toast('อัปเดตข้อมูลแล้ว', { type: 'success' });
  } catch (e) {
    console.error(e);
    if (window.RattanaUI && RattanaUI.state) {
      RattanaUI.state('#list', 'error', { title: 'โหลดข้อมูลไม่สำเร็จ', message: e.message, retry: () => loadAll(true) });
      $('#kpis').innerHTML = '';
    } else $('#list').textContent = 'โหลดข้อมูลไม่สำเร็จ: ' + e.message;
  } finally {
    if (manual && window.RattanaUI) RattanaUI.setLoading(btn, false);
  }
}

/* ===== Signed-in user → their own route ===== */
// "คุณ จารุพัฒน์ หอมวิเชียร (ROO)" and "นาย จารุพัฒน์  หอมวิเชียร" both become "จารุพัฒน์หอมวิเชียร"
const normName = s => String(s||'').replace(/\(.*?\)/g,'').replace(/^\s*(คุณ|นางสาว|นาย|นาง|น\.ส\.)\s*/,'').replace(/\s+/g,'');
function applyUser() {
  if (!S.user || !S.shops.length) return;
  const sel = $('#fSales');
  const me = normName(S.user.name);
  // only salespeople offered for the chosen warehouse
  const mine = me && [...sel.options].map(o => o.value).find(x => x && normName(x) === me);
  if (!mine) return;                      // managers / staff not in the sheet keep "ทั้งหมด" or their last choice
  sel.value = mine; sel.dispatchEvent(new Event('rt:refresh'));
  localStorage.setItem(LS.sales, mine);
  render();
}

/* ===== Filters ===== */
function fillFilters() {
  const uniq = a => [...new Set(a.filter(Boolean))].sort((x,y) => x.localeCompare(y,'th'));
  const setOpts = (sel, vals, first, saved) => {
    const cur = sel.value || saved || '';
    sel.innerHTML = `<option value="">${first}</option>` + vals.map(v => `<option${v===cur?' selected':''}>${esc(v)}</option>`).join('');
    sel.value = vals.includes(cur) ? cur : '';
    sel.dispatchEvent(new Event('rt:refresh'));
  };
  setOpts($('#fWh'), uniq(S.shops.map(s => s.wh)), 'ทุกคลัง', S.wh != null ? S.wh : localStorage.getItem(LS.wh));
  const wh = $('#fWh').value;
  setOpts($('#fSales'), uniq(S.shops.filter(s => !wh || s.wh === wh).map(s => s.sales)), 'ทั้งหมด', localStorage.getItem(LS.sales));
  updateWhButton();
}

/* ===== Warehouse picker (shown after sign-in) — design B: list with live totals ===== */
const WH_CHOICES = [
  { value: 'W1', name: 'สมุทรสงคราม', tone: 'gold' },
  { value: 'W3', name: 'ราชบุรี', tone: 'lightred' },
  { value: 'W4', name: 'นครปฐม', tone: 'green' },
  { value: 'nestle', name: 'Nestle', tone: 'blue', soon: true }
];
const whLabel = c => c.soon ? c.name : `${c.value} ${c.name}`;
const shortMoney = n => n >= 1e6 ? `฿${(n/1e6).toLocaleString('th-TH',{maximumFractionDigits:1})} ล้าน` : money(n);
function updateWhButton() {
  const c = WH_CHOICES.find(x => x.value === $('#fWh').value);
  $('#btnWh').textContent = 'คลัง: ' + (c ? whLabel(c) : ($('#fWh').value || 'ทุกคลัง'));
}
function whStats(wh) {
  const today = DAYS[new Date().getDay()];
  const shops = S.shops.filter(s => s.wh === wh);
  const amt = [...new Map(shops.map(s => [s.code, (S.sales.get(s.code) || {}).amt || 0])).values()].reduce((a,v) => a + v, 0);
  return `${shops.length.toLocaleString('th-TH')} ร้าน · รูทวันนี้ ${shops.filter(s => s.routes.includes(today)).length.toLocaleString('th-TH')} ร้าน|${shortMoney(amt)}`;
}
function fillWhStats(box) {
  if (!S.shops.length) return;
  box.querySelectorAll('[data-wh-stat]').forEach(el => {
    const [line, amt] = whStats(el.dataset.whStat).split('|');
    el.querySelector('.wh-line').textContent = line;
    el.querySelector('.wh-amt').textContent = amt;
    el.querySelector('.wh-amt').classList.remove('rt-skeleton');
  });
}
// First screen after sign-in: the warehouse list (the app below stays hidden until a warehouse is chosen)
function whListHtml() {
  const myW = S.user && String(S.user.w || '').toUpperCase();
  const chev = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>';
  return WH_CHOICES.map(c => c.soon
    ? `<button type="button" class="wh-row is-soon" data-wh="${c.value}">
         <span class="rt-tile rt-tile-${c.tone} rt-tile-lg">N</span>
         <span class="wh-text"><span class="rt-cell-main">${c.name}</span><span class="rt-cell-sub">ใช้ข้อมูลอีกชุด</span></span>
         <span class="rt-badge rt-badge-neutral">เร็วๆ นี้</span></button>`
    : `<button type="button" class="wh-row" data-wh="${c.value}" data-wh-stat="${c.value}">
         <span class="rt-tile rt-tile-${c.tone} rt-tile-lg">${c.value}</span>
         <span class="wh-text"><span class="rt-cell-main">${c.name}${c.value === myW ? ' <span class="rt-badge rt-badge-gold">คลังของคุณ</span>' : ''}</span>
           <span class="rt-cell-sub wh-line">กำลังโหลดข้อมูล…</span>
           <b class="wh-amt rt-skeleton">฿000.0 ล้าน</b></span>
         <span class="wh-chev">${chev}</span></button>`).join('');
}
function refreshWhScreen() {
  const box = $('#whList');
  box.innerHTML = whListHtml();
  fillWhStats(box);
  const nick = S.user && (S.user.nickname || S.user.name);
  $('#whGreet').textContent = nick ? `สวัสดี ${nick}` : 'สวัสดี';
  $('#whSub').textContent = S.dataDate ? `ยอดเดือนนี้ถึง ${fmtDate(S.dataDate)}` : 'จะดูร้านค้าของคลังไหน';
}
function pickWh() {
  refreshWhScreen();
  $('#appView').hidden = true; $('#whScreen').hidden = false; document.body.classList.add('picking');
  window.scrollTo(0, 0);
}
function onWhClick(e) {
  const b = e.target.closest('[data-wh]'); if (!b) return;
  if (b.dataset.wh === 'nestle') { if (window.RattanaUI) RattanaUI.toast('Nestle ใช้ข้อมูลอีกชุด — เร็วๆ นี้', { type: 'info' }); return; }
  $('#whScreen').hidden = true; $('#appView').hidden = false; document.body.classList.remove('picking');
  window.scrollTo(0, 0);
  setWh(b.dataset.wh);
}
function setWh(v) {
  S.wh = v; localStorage.setItem(LS.wh, v);
  const sel = $('#fWh'); sel.value = v; sel.dispatchEvent(new Event('rt:refresh'));
  S.limit = PAGE;
  if (S.shops.length) { fillFilters(); applyUser(); render(); }
  updateWhButton();
}

function buildDaySeg() {
  const today = new Date().getDay();
  // Monday..Saturday, then Sunday
  $('#segDay').innerHTML = `<button type="button" aria-pressed="${S.day==='all'}" data-v="all">ทุกร้าน</button>` + [1,2,3,4,5,6,0].map(d =>
    `<button type="button" aria-pressed="${d===S.day}" data-v="${d}">${d===today ? 'วันนี้ · ' : ''}${DAYS[d].replace('พฤหัสบดี','พฤหัสฯ')}</button>`).join('');
}

/* ===== Visited (per day, on this device) ===== */
const visitKey = () => LS.visited + iso(new Date());
const getVisited = () => { try { return new Set(JSON.parse(localStorage.getItem(visitKey()) || '[]')); } catch { return new Set(); } };
function toggleVisited(code) {
  const v = getVisited(); v.has(code) ? v.delete(code) : v.add(code);
  localStorage.setItem(visitKey(), JSON.stringify([...v]));
  // keep only today's list
  Object.keys(localStorage).filter(k => k.startsWith(LS.visited) && k !== visitKey()).forEach(k => localStorage.removeItem(k));
  render();
}

/* ===== Compute ===== */
function monthProgress() {
  const ref = new Date();
  const d = S.dataDate && (S.dataDate.getMonth() !== ref.getMonth() || S.dataDate.getFullYear() !== ref.getFullYear()) ? S.dataDate : ref;
  const dim = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
  return Math.min(1, d.getDate() / dim);
}
function enrich(s, prog, visited, todayIso) {
  const sale = S.sales.get(s.code) || { amt: 0, last: null };
  const target = s.avg * prog;
  let st;
  if (sale.amt <= 0) st = 'none';
  else if (s.avg > 0 && sale.amt < target) st = 'low';
  else st = 'ok';
  return { ...s, amt: sale.amt, last: sale.last, target, gap: Math.max(0, target - sale.amt), st,
           pct: s.avg > 0 ? sale.amt / s.avg : null, orderedToday: sale.last && iso(sale.last) === todayIso, visited: visited.has(s.code) };
}

/* ===== Render ===== */
function render() {
  const all = S.day === 'all', dayName = all ? '' : DAYS[S.day];
  const salesF = $('#fSales').value, whF = $('#fWh').value, q = $('#fQ').value.trim().toLowerCase();
  const prog = monthProgress(), visited = getVisited(), todayIso = iso(new Date());

  let base = all ? S.shops.slice() : S.shops.filter(s => (S.mode === 'visit' ? s.routes : s.delivers).includes(dayName));
  if (salesF) base = base.filter(s => s.sales === salesF);
  if (whF) base = base.filter(s => s.wh === whF);
  base = base.map(s => enrich(s, prog, visited, todayIso));

  // KPIs (before status/search filter)
  const n = base.length, nVisited = base.filter(s => s.visited).length;
  // a store code can sit on several Customer rows (one per salesperson/route) — count its sales once
  const sumAmt = [...new Map(base.map(s => [s.code, s.amt])).values()].reduce((a,v) => a + v, 0), sumAvg = base.reduce((a,s) => a + s.avg, 0);
  const nNone = base.filter(s => s.st === 'none').length, nLow = base.filter(s => s.st === 'low').length;
  const sumGap = base.reduce((a,s) => a + s.gap, 0);
  const pctMonth = sumAvg ? sumAmt / sumAvg : 0;
  $('#kpis').innerHTML = `
    ${kpi('gold', icoCheck, S.mode === 'visit' ? 'เยี่ยมแล้ว' : 'ส่งแล้ว (ติ๊ก)', `${nVisited}/${n} ร้าน`, n ? `เหลืออีก ${n - nVisited} ร้าน` : 'ไม่มีร้าน')}
    ${kpi('red', icoAlert, 'ยังไม่สั่งเดือนนี้', `${nNone} ร้าน`, `ต่ำกว่าเป้าอีก ${nLow} ร้าน`)}
    ${kpi('navy', icoChart, 'ยอดเดือนนี้ (ร้านในรายการ)', money(sumAmt), `${Math.round(pctMonth*100)}% ของยอดเฉลี่ย 3 เดือน ${money(sumAvg)}`)}
    ${kpi('amber', icoTarget, 'ยอดที่ควรตามเพิ่ม', money(sumGap), `เทียบเป้าถึงวันนี้ (${Math.round(prog*100)}% ของเดือน)`)}`;
  if (window.RattanaUI && RattanaUI.setBadge) RattanaUI.setBadge(nNone);

  // list
  let rows = base;
  if (S.status === 'todo') rows = rows.filter(s => !s.visited);
  else if (S.status) rows = rows.filter(s => s.st === S.status);
  if (q) rows = rows.filter(s => [s.name, s.code, s.area, s.zone, s.phone, s.contact].join(' ').toLowerCase().includes(q));
  const sorters = {
    seq: (a,b) => a.visited - b.visited || (all ? dayRank(a) - dayRank(b) : 0) || a.seq - b.seq || a.name.localeCompare(b.name,'th'),
    gap: (a,b) => a.visited - b.visited || b.gap - a.gap || a.seq - b.seq,
    avg: (a,b) => a.visited - b.visited || b.avg - a.avg
  };
  rows.sort(sorters[S.sort]);

  const isToday = S.day === new Date().getDay();
  $('#listTitle').textContent = all ? `ร้านค้าทั้งหมด · ${rows.length.toLocaleString('th-TH')} ร้าน`
    : `${S.mode === 'visit' ? 'ร้านในรูท' : 'ร้านที่ส่งของ'}วัน${dayName}${isToday ? ' (วันนี้)' : ''} · ${rows.length} ร้าน`;

  const list = $('#list');
  if (!rows.length) {
    const msg = n ? 'ลองเปลี่ยนตัวกรองหรือคำค้นหา' : (S.day === 0 ? 'วันอาทิตย์ไม่มีรูท — เลือกวันอื่นด้านบน' : 'ไม่มีร้านในรูทของวันนี้สำหรับตัวกรองที่เลือก');
    if (window.RattanaUI && RattanaUI.state) RattanaUI.state(list, n ? 'search' : 'empty', { title: 'ไม่มีรายการ', message: msg, compact: true });
    else list.textContent = msg;
    return;
  }
  const shown = rows.slice(0, S.limit);
  list.innerHTML = shown.map(shopHtml).join('') + (rows.length > shown.length
    ? `<button type="button" class="rt-btn rt-btn-glass rt-btn-block" id="btnMore">แสดงเพิ่ม (เหลืออีก ${(rows.length - shown.length).toLocaleString('th-TH')} ร้าน)</button>` : '');
  $('#srcInfo').textContent = `ยอดขายจากชีท BP ถึงวันที่ ${fmtDate(S.dataDate)} · ร้านค้าจากชีท Customer · เป้า = ยอดเฉลี่ย 3 เดือน × ${Math.round(prog*100)}% ของเดือน`;
}

function kpi(tone, ico, label, value, sub) {
  return `<div class="rt-glass rt-lift rt-kpi"><div class="rt-kpi-head"><span class="rt-tile rt-tile-${tone}">${ico}</span>${label}</div><span class="rt-kpi-value">${value}</span><span class="rt-kpi-trend"><small>${sub}</small></span></div>`;
}

function shopHtml(s) {
  const badge = {
    none: '<span class="rt-badge rt-badge-danger">ยังไม่สั่งเดือนนี้</span>',
    low:  `<span class="rt-badge rt-badge-warning">ขาดเป้า ${money(s.gap)}</span>`,
    ok:   '<span class="rt-badge rt-badge-success">ถึงเป้าแล้ว</span>'
  }[s.st];
  const pctW = s.pct == null ? 0 : Math.min(100, Math.round(s.pct * 100));
  const barCls = s.st === 'none' ? 'is-danger' : s.st === 'low' ? 'is-warning' : '';
  const tel = (s.phone.match(/0\d{8,9}/) || [])[0];
  const ll = s.loc.match(/-?\d+\.\d+\s*,\s*-?\d+\.\d+/);
  const mapUrl = ll ? `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(ll[0].replace(/\s/g,''))}` : '';
  return `<div class="shop${s.visited ? ' done' : ''}">
    <div class="seq" title="ลำดับร้าน">${s.seq === 9999 ? '–' : s.seq}</div>
    <div>
      <div class="shop-top">
        <div><div class="rt-cell-main">${esc(s.name)}</div>
          <div class="rt-cell-sub">${esc(s.code)}${s.zone ? ' · ' + esc(s.zone) : ''}${s.type ? ' · ' + esc(s.type) : ''}</div></div>
        <div class="badges">${s.orderedToday ? '<span class="rt-badge rt-badge-info">สั่งวันนี้แล้ว</span>' : ''}${badge}${s.f ? `<span class="rt-badge rt-badge-neutral">${esc(s.f)}</span>` : ''}</div>
      </div>
      <div class="shop-nums">
        <div><div class="rt-cell-sub">ยอดเดือนนี้</div><div class="rt-cell-main rt-num">${money(s.amt)}</div></div>
        <div><div class="rt-cell-sub">เฉลี่ย 3 เดือน</div><div class="rt-cell-main rt-num">${s.avg ? money(s.avg) : '-'}</div></div>
        <div><div class="rt-cell-sub">สั่งล่าสุด</div><div class="rt-cell-main">${s.last ? fmtDate(s.last) : '-'}</div></div>
      </div>
      ${s.avg ? `<div class="rt-progress ${barCls}" title="${pctW}% ของยอดเฉลี่ย"><span style="width:${pctW}%"></span></div>` : ''}
      <div class="rt-cell-sub" style="margin-top:6px">${S.day === 'all' ? (s.bpOnly ? 'ไม่มีในชีท Customer · ' : `รูท ${esc((S.mode === 'visit' ? s.routes : s.delivers).join(', ') || 'ไม่ระบุวัน')} · `) : ''}${esc(s.area)}${s.contact ? ' · ติดต่อ ' + esc(s.contact) : ''}${!$('#fSales').value && s.sales ? ' · ' + esc(s.sales) : ''}</div>
      <div class="shop-act">
        <button type="button" class="rt-btn rt-btn-sm ${s.visited ? 'rt-btn-glass' : 'rt-btn-gold'}" data-visit="${esc(s.code)}">${s.visited ? 'ยกเลิกติ๊ก' : (S.mode === 'visit' ? 'เยี่ยมแล้ว' : 'ส่งแล้ว')}</button>
        ${tel ? `<a class="rt-btn rt-btn-sm rt-btn-glass" href="tel:${tel}">โทร ${tel}</a>` : ''}
        ${mapUrl ? `<a class="rt-btn rt-btn-sm rt-btn-glass" href="${mapUrl}" target="_blank" rel="noopener">แผนที่</a>` : ''}
      </div>
    </div>
  </div>`;
}

// order stores by their first route day (Mon..Sat, Sun, then no day)
const dayRank = s => { const d = (S.mode === 'visit' ? s.routes : s.delivers).map(x => DAYS.indexOf(x)).filter(i => i >= 0).map(i => i || 7); return d.length ? Math.min(...d) : 8; };
const svg = d => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${d}"/></svg>`;
const icoCheck = svg('M22 11.1V12a10 10 0 1 1-5.9-9.1M22 4 12 14l-3-3');
const icoAlert = svg('m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3M12 9v4M12 17h.01');
const icoChart = svg('M3 3v18h18M18 17V9M13 17V5M8 17v-3');
const icoTarget = svg('M12 2a10 10 0 1 0 0 20a10 10 0 1 0 0-20M12 6a6 6 0 1 0 0 12a6 6 0 1 0 0-12M12 10a2 2 0 1 0 0 4a2 2 0 1 0 0-4');

/* ===== Events ===== */
function segPick(el, e) {
  const b = e.target.closest('button'); if (!b) return null;
  el.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b));
  return b.dataset.v;
}
document.addEventListener('DOMContentLoaded', () => {
  buildDaySeg();
  $('#segMode').addEventListener('click', e => { const v = segPick($('#segMode'), e); if (v) { S.mode = v; render(); } });
  $('#segDay').addEventListener('click', e => { const v = segPick($('#segDay'), e); if (v != null) { S.day = v === 'all' ? 'all' : +v; S.limit = PAGE; render(); } });
  $('#chips').addEventListener('click', e => { const v = segPick($('#chips'), e); if (v != null) { S.status = v; render(); } });
  $('#fSales').addEventListener('change', e => { localStorage.setItem(LS.sales, e.target.value); render(); });
  $('#fWh').addEventListener('change', e => { S.wh = e.target.value; localStorage.setItem(LS.wh, S.wh); fillFilters(); render(); });
  $('#btnWh').addEventListener('click', pickWh);
  $('#whList').addEventListener('click', onWhClick);
  refreshWhScreen();
  $('#fSort').addEventListener('change', e => { S.sort = e.target.value; render(); });
  $('#fQ').addEventListener('input', () => { S.limit = PAGE; render(); });
  ['#fSales','#fWh','#fSort'].forEach(id => $(id).addEventListener('change', () => { S.limit = PAGE; }, true));
  $('#chips').addEventListener('click', () => { S.limit = PAGE; }, true);
  $('#list').addEventListener('click', e => { if (e.target.closest('#btnMore')) { S.limit += PAGE; render(); } });
  $('#list').addEventListener('click', e => { const b = e.target.closest('[data-visit]'); if (b) toggleVisited(b.dataset.visit); });
  $('#btnRefresh').addEventListener('click', () => loadAll(true));
  S.loading = loadAll(false);
  if (window.RattanaUI && RattanaUI.user) RattanaUI.user.ready.then(u => { S.user = u; refreshWhScreen(); });
  // background refresh every 10 minutes, no spinner
  setInterval(() => loadAll(false), 10 * 60 * 1000);
});
</script>
</body>
</html>
