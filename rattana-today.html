<!doctype html>
<html lang="th" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F4F7FB">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Rattana งานวันนี้ v1.41</title>
  <link rel="stylesheet" href="https://rattanaphaiboon.github.io/app/rattana-ui/rattana-ui.css">
  <script src="https://rattanaphaiboon.github.io/app/rattana-ui/rattana-ui.js" defer></script>
  <style>
    [hidden]{display:none!important}
    .bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px}

    /* ===== stores by salesperson (design B: salespeople on the left, their stores on the right by route day) ===== */
    .sp-wrap{margin-top:16px}
    /* ===== side menu: light card with numbered sections ===== */
    .rt-shell > .rt-sidebar{background:var(--surface,#fff)!important;color:var(--text,#0d1b3e);border:1px solid var(--border);box-shadow:0 4px 18px rgba(13,27,62,.06);border-radius:18px;padding:14px 10px;gap:14px;backdrop-filter:none}
    .rt-shell > .rt-sidebar::before,.rt-shell > .rt-sidebar::after{display:none!important}
    .sn-sec{display:flex;flex-direction:column;gap:2px}
    .sn-h{display:flex;align-items:center;gap:10px;padding:6px 8px 4px;font-weight:800;font-size:15px;color:var(--text,#0d1b3e)}
    .sn-no{width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:#0d1b3e;color:#fff;font-size:12px;font-weight:700;flex:none}
    .sn-sec:not(:first-child) .sn-no{background:var(--hover,#eef1f6);color:var(--muted,#6b7896)}
    #spChips{display:flex;flex-direction:column;gap:2px}
    .sp-item,.sn-item{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:10px;border:0;background:none;color:var(--text,#0d1b3e);font:inherit;font-size:14px;text-align:left;cursor:pointer}
    .sp-item:hover,.sn-item:hover{background:var(--hover,#eef1f6)}
    .sp-item.on{background:var(--hover,#eef1f6);font-weight:700}
    .sn-sub{width:26px;flex:none;font-size:11px;font-weight:700;color:#b07d00;font-variant-numeric:tabular-nums}
    .sp-item > span:nth-child(2),.sn-txt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .sp-item b{font-size:12px;font-weight:600;color:var(--muted,#6b7896);font-variant-numeric:tabular-nums}
    .sn-wh{display:flex;align-items:center;gap:10px;width:100%;margin-top:auto;padding:12px 14px;border:0;border-radius:12px;background:#0d1b3e;color:#fff;font:inherit;cursor:pointer;text-align:left}
    .sn-wh b{flex:1;min-width:0;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .sn-wh small{font-size:11px;color:#fcb70f;white-space:nowrap}
    .sn-wh:hover{background:#1f3a78}
    .sn-foot{margin:0;padding:8px 8px 0;border-top:1px solid var(--border);font-size:11px;color:var(--muted,#6b7896)}
    .sp-main{padding:18px;border-radius:22px;min-width:0}
    .sp-head{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
    .sp-head .grow{flex:1;min-width:180px}
    .sp-ini{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;background:#0d1b3e;color:#fcb70f;flex:none}
    .sp-search{flex:0 1 320px;min-width:220px}
    .sp-day{position:sticky;top:0;z-index:1;background:var(--surface);padding:12px 4px 6px;margin-top:6px;font-weight:800;color:#1f3a78;border-bottom:2px solid #fcb70f;display:flex;justify-content:space-between}
    [data-theme="dark"] .sp-day{color:#8fb0ec}
    .sp-row{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--border)}
    .sp-row > div:first-child{flex:1;min-width:0}
    .sp-amt{text-align:right;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
    .sp-amt small{display:block;font-size:11px;font-weight:500;color:var(--muted,#6b7896)}
    .sp-amt.zero{color:var(--muted,#6b7896);font-weight:600}
    /* district recommendations (tap a store) */
    .sp-row[data-code]{cursor:pointer}
    .sp-row[data-code]:hover{background:var(--hover)}
    .sp-row.open{background:var(--hover);border-bottom-color:transparent}
    .sp-row .chev{flex:none;opacity:.45;transition:transform .2s}
    .sp-row.open .chev{transform:rotate(90deg)}
    .dreco{margin:0 0 8px;padding:12px 14px;border-radius:14px;border:1px solid #fcb70f;background:color-mix(in srgb,#fcb70f 7%,var(--surface))}
    .dreco-h{font-weight:800}
    .dreco-note{font-size:12px;color:var(--muted,#6b7896);margin-top:2px}
    .dreco-sect{margin:10px 0 4px;font-weight:700;font-size:13px}
    .dreco-sect .n{display:inline-block;padding:0 6px;border-radius:6px;background:#fcb70f;color:#0d1b3e;font-size:11px;margin-right:4px}
    .dreco-sect small{font-weight:400;color:var(--muted,#6b7896)}
    .dreco-it{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px dashed var(--border)}
    .dreco-it .grow{flex:1;min-width:0}
    .dreco-bar{height:4px;border-radius:4px;background:var(--border);margin-top:3px;max-width:180px}
    .dreco-bar i{display:block;height:100%;border-radius:4px;background:#1f9d55}
    /* ===== app shell: sidebar on laptops, slide-in menu on phones ===== */
    body.picking .rt-topbar{display:none}
    body.picking .rt-shell{grid-template-columns:minmax(0,1fr)}
    body.picking .rt-sidebar,body.picking .rt-shell-scrim{display:none!important}
    .rt-shell-main{max-width:1500px}
    @media(min-width:1024px){.rt-shell > .rt-sidebar{min-height:calc(100dvh - 40px)}}
    /* tablets & laptops (≥768px): the sidebar always stays open beside the stores, no ☰ · phones: the CI's slide-in menu on ☰ */
    @media(min-width:768px) and (max-width:1023.98px){
      .rt-shell{grid-template-columns:230px minmax(0,1fr);gap:14px}
      .rt-shell > .rt-sidebar{position:sticky;top:12px;bottom:auto;left:auto;width:100%;max-width:none;max-height:calc(100dvh - 24px);transform:none;visibility:visible;transition:none;overflow:auto}
      .rt-shell-scrim{display:none!important}
      .rt-menu-btn{display:none!important}
    }

    /* ===== warehouse picker: first screen after sign-in (navy band, card on top) ===== */
    .wh-screen{max-width:520px;margin:0 auto;position:relative;padding-top:max(16px,env(safe-area-inset-top))}
    .wh-band{position:absolute;top:-400px;left:50%;width:100vw;transform:translateX(-50%);height:calc(400px + 250px);background:linear-gradient(160deg,#0d1b3e,#1f3a78);border-bottom:3px solid #fcb70f;border-radius:0 0 32px 32px;z-index:0}
    .wh-hero{position:relative;z-index:1;color:#fff;padding:6px 4px 0}
    .wh-top{display:flex;align-items:center;gap:10px}
    .wh-icon{color:#fcb70f;border:1px solid rgba(252,183,15,.45)}
    .wh-appname{flex:1;font-size:16px}
    .wh-appname small{font-weight:500;opacity:.65;font-size:12px}
    .wh-theme{color:var(--ink)}
    .wh-date{margin:22px 0 2px;opacity:.75;font-size:13px}
    .wh-greet{color:#fff;margin:0;font-size:clamp(24px,4vw,38px)}
    .wh-ask{margin:2px 0 0;opacity:.75}
    .wh-card{position:relative;z-index:1;background:var(--surface)!important;margin-top:22px;padding:20px;border-radius:26px}
    .wh-list{display:flex;flex-direction:column;gap:10px;margin-top:14px}
    .wh-row{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border-radius:20px;border:1px solid var(--border);background:var(--hover);color:inherit;font:inherit;text-align:left;cursor:pointer;transition:transform .14s,box-shadow .2s}
    .wh-row:hover{box-shadow:var(--shadow-gold,0 4px 12px rgba(252,183,15,.3))}
    .wh-row:active{transform:scale(.98)}
    .wh-row .rt-tile{flex:none;font-weight:800}
    .wh-text{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
    .wh-chev{opacity:.45;flex:none}
    .wh-row.is-soon{opacity:.6}
    .rt-tile-lightred{color:#fff;background:linear-gradient(180deg,#fca5a5,#f26b6b);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 10px 22px -8px rgba(242,107,107,.5)}
    @media(max-width:360px){.wh-row{padding:10px}.wh-row .rt-tile-lg{width:44px;height:44px;font-size:14px}}
    @media(min-width:768px){.wh-screen{max-width:680px}.wh-row{padding:16px 18px;gap:16px}.wh-row .rt-tile-lg{width:60px;height:60px;font-size:19px}}
    @media(min-width:1100px){.wh-screen{max-width:760px}.wh-date{margin-top:30px}.wh-card{padding:28px}.wh-list{gap:12px}}
  </style>
</head>
<body class="rt-app picking" data-rt-login="Rattana งานวันนี้" data-rt-app-glyph="check" data-rt-app-tone="navy">
  <div class="rt-bg"><div class="rt-bg-arc"></div><div class="rt-bg-arc"></div></div>
  <div class="rt-shell">
    <nav class="rt-sidebar" aria-label="เมนูหลัก">
      <!-- light numbered side menu: 1 salespeople of the chosen warehouse · 2 menu · warehouse button at the bottom -->
      <div class="sn-sec">
        <div class="sn-h"><span class="sn-no">1</span><span id="spSideH">เซลล์</span></div>
        <div id="spChips"></div>
      </div>
      <div class="sn-sec">
        <div class="sn-h"><span class="sn-no">2</span>เมนู</div>
        <button type="button" class="sn-item" id="btnRefresh"><span class="sn-sub">2.1</span><span class="sn-txt">โหลดข้อมูลใหม่</span></button>
        <button type="button" class="sn-item" data-rt-theme-toggle><span class="sn-sub">2.2</span><span class="sn-txt">สลับธีม · <span data-rt-theme-label>สว่าง</span></span></button>
      </div>
      <button type="button" class="sn-wh" id="navWh"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21V8l9-5 9 5v13M7 21v-8h10v8M7 17h10"/></svg><b id="navWhTxt">เลือกคลัง</b><small>เปลี่ยนคลัง ↗</small></button>
      <p class="sn-foot"><span id="snFoot">Rattana งานวันนี้ v1.41</span> · <span data-rt-date="short"></span></p>
    </nav>

    <main class="rt-shell-main rt-page">
      <header class="rt-glass rt-topbar rt-sticky-top">
        <button class="rt-btn rt-btn-glass rt-btn-icon rt-menu-btn" id="btnMenu" data-rt-menu-toggle aria-label="เมนู"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
        <a class="rt-app-brand" href="./"><span><b>Rattana งานวันนี้</b><small>v1.41</small></span></a>
      </header>

      <section id="whScreen" class="wh-screen">
        <div class="wh-band" aria-hidden="true"></div>
        <div class="wh-hero">
          <div class="wh-top">
            <span class="rt-tile rt-tile-sm rt-tile-navy wh-icon"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2M9 14l2 2 4-4"/></svg></span>
            <b class="wh-appname">Rattana งานวันนี้ <small>v1.41</small></b>
            <button class="rt-btn rt-btn-glass rt-btn-icon wh-theme" data-rt-theme-toggle aria-label="สลับธีม"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path data-rt-theme-icon d=""/></svg></button>
            <button data-rt-user></button>
          </div>
          <p class="wh-date" data-rt-date="long"></p>
          <h1 class="rt-h2 wh-greet" id="whGreet">สวัสดี</h1>
          <p class="wh-ask">วันนี้จะดูคลังไหน</p>
        </div>
        <div class="rt-glass wh-card">
          <h2 class="rt-h3" style="margin:0">เลือกคลัง</h2>
          <p class="rt-cell-sub" style="margin:2px 0 0">จะดูร้านค้าของคลังไหน</p>
          <div class="wh-list" id="whList"></div>
        </div>
      </section>

      <div id="appView" hidden>
        <p class="rt-caption" data-rt-date="long"></p>
        <div class="bar">
          <button type="button" class="rt-btn rt-btn-glass rt-btn-sm" id="btnWh">เลือกคลัง</button>
        </div>

        <div class="sp-wrap" id="spSec">
          <section class="rt-glass sp-main">
            <div class="sp-head">
              <span class="sp-ini" id="spIni">–</span>
              <div class="grow"><h2 class="rt-h3" id="spName" style="margin:0">กำลังโหลด…</h2>
                <p class="rt-cell-sub" id="spSub" style="margin:2px 0 0"></p></div>
              <label class="rt-search sp-search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 3a8 8 0 1 0 0 16a8 8 0 1 0 0-16M21 21l-4.3-4.3"/></svg><input id="spQ" type="search" placeholder="ค้นหาร้าน / รหัส"></label>
            </div>
            <div id="spList" style="margin-top:8px" data-rt-skeleton="list"></div>
          </section>
        </div>
      </div>
    </main>
  </div>

<script>
/* ===== Config ===== */
const CUST_ID = '1ijTvqCH_VEaTSfKfxd1yOAC_oo6BVFiEaav_KaaLTLE';   // Customer sheet
const SLMN_ID = '1aIJPHRGG07xEusXZ6qCUDmaQOg5ScmZwDjyr6VWz8Kg';   // tab SLMN: salesperson → warehouse
const BP_ID   = '1NxFkxiQev0xxGir93-qt0flNfzHz848-KuE7jDRSxQE';   // BP sheet: this month's bill lines
const LS = { sales: 'rtToday.sales', wh: 'rtToday.wh' };
const S = { user: null, wh: localStorage.getItem('rtToday.wh') || '', shops: [] };

// clean up settings older versions kept on this device
Object.keys(localStorage).filter(k => k.startsWith('rtToday.') && !Object.values(LS).includes(k)).forEach(k => localStorage.removeItem(k));

/* ===== Helpers ===== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = s => { const n = parseFloat(String(s ?? '').replace(/,/g, '')); return isFinite(n) ? n : 0; };
const money = n => (window.RattanaUI && RattanaUI.formatMoney) ? RattanaUI.formatMoney(Math.round(n)) : '฿' + Math.round(n).toLocaleString('th-TH');
const thDate = d => (window.RattanaUI && RattanaUI.formatDate) ? RattanaUI.formatDate(d, 'short') : d.toLocaleDateString('th-TH');
const colLetter = i => { let s = ''; i++; while (i > 0) { const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26); } return s; };
const normName = s => String(s || '').replace(/\(.*?\)/g, '').replace(/^\s*(คุณ|นางสาว|นาย|นาง|น\.ส\.)\s*/, '').replace(/\s+/g, '');
function parseCsv(text) {
  if (!text) return [];
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch; }
    else if (ch === '"') q = true;
    else if (ch === ',') { row.push(cell); cell = ''; }
    else if (ch === '\r') {}
    else if (ch === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += ch;
  }
  if (cell.length || row.length) { row.push(cell); rows.push(row); }
  const clean = s => String(s || '').replace(/[​‌‍﻿]/g, '').replace(/ /g, ' ').trim();
  return rows.map(r => r.map(clean));
}
async function gviz(id, tq, sheet) {
  let url = `https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:csv`;
  if (sheet) url += `&sheet=${encodeURIComponent(sheet)}`;
  if (tq) url += `&tq=${encodeURIComponent(tq)}`;
  const res = await fetch(url, { cache: 'no-store' });
  if (!res.ok) throw new Error('โหลดชีทไม่สำเร็จ (' + res.status + ')');
  const t = await res.text();
  if (t.startsWith('<')) throw new Error('ชีทไม่ได้แชร์แบบ "ทุกคนที่มีลิงก์"');
  return parseCsv(t);
}

/* ===== Data: who looks after which store ===== */
async function loadCustomers() {
  const rows = await gviz(CUST_ID);
  const h = rows[0], ix = k => h.indexOf(k);
  const c = { name: ix('ชื่อร้านค้า'), code: ix('รหัส บีพลัส'), wh: ix('WH'), sales: ix('เซลล์ผู้ดูแล'), type: ix('ประเภทร้านค้าขอพร'),
    area: ix('ต.,อ.,จ. ขอพร'), phone: ix('เบอร์โทร'), route: ix('ชื่อรูท'), zone: ix('ชื่อรูท-ตำบล'), seq: ix('ลำดับร้าน'), deliver: ix('วันส่ง') };
  if (c.code < 0 || c.sales < 0) throw new Error('ไม่พบคอลัมน์ "รหัส บีพลัส" / "เซลล์ผู้ดูแล" ในชีท Customer');
  const g = (r, k) => c[k] >= 0 ? (r[c[k]] || '') : '';
  return rows.slice(1).filter(r => g(r, 'code') || g(r, 'name')).map(r => ({
    code: String(g(r, 'code')), name: g(r, 'name'), wh: g(r, 'wh'), sales: g(r, 'sales'), type: g(r, 'type'), area: g(r, 'area'),
    phone: String(g(r, 'phone')), route: g(r, 'route'), zone: g(r, 'zone'), seq: parseFloat(g(r, 'seq')) || 9999, deliver: g(r, 'deliver') }));
}
// SLMN sheet: the salesperson's own warehouse (WL_SALES) and their name as used everywhere (Sale No ROO)
async function loadSalesmen() {
  const rows = await gviz(SLMN_ID, null, 'SLMN');
  const h = rows[0], ix = k => h.indexOf(k);
  const iName = ix('Sale No ROO'), iRaw = ix('SLMN_NAME'), iWh = ix('WL_SALES');
  if (iWh < 0 || (iName < 0 && iRaw < 0)) throw new Error('ไม่พบคอลัมน์ "WL_SALES" / "Sale No ROO" ในชีท SLMN');
  const map = new Map();
  rows.slice(1).forEach(r => {
    const name = (r[iName] || r[iRaw] || '').replace(/\s+/g, ' ').trim(), wh = (r[iWh] || '').trim();
    if (!name || !wh) return;
    [name, r[iRaw]].forEach(n => { const k = normName(n); if (k && !map.has(k)) map.set(k, { name, wh }); });
  });
  return map;
}
// BP sheet: this month's sales per store code (EXVat+CN*2: without VAT, credit notes counted twice). Google sums the ~80k bill lines for us.
async function loadMonthSales() {
  const head = (await gviz(BP_ID, 'select * limit 0'))[0] || [];
  const L = k => { const i = head.indexOf(k); if (i < 0) throw new Error('ไม่พบคอลัมน์ "' + k + '" ในชีท BP'); return colLetter(i); };
  const C = L('Customer_Code'), A = L('EXVat+CN*2'), D = L('Doc_Date');
  const rows = await gviz(BP_ID, `select ${C}, sum(${A}), max(${D}) where ${C} is not null group by ${C}`);
  const map = new Map(); let last = null;
  rows.slice(1).forEach(r => {
    map.set(String(r[0]), num(r[1]));
    const m = String(r[2] || '').match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
    if (m) { const d = new Date(+m[1], +m[2] - 1, +m[3]); if (!last || d > last) last = d; }
  });
  return { map, last };
}
async function loadAll(manual) {
  const btn = $('#btnRefresh');
  if (manual && window.RattanaUI) RattanaUI.setLoading(btn, true);
  try {
    const [shops, people, sales] = await Promise.all([loadCustomers(), loadSalesmen(),
      loadMonthSales().catch(e => { console.error(e); return null; })]);
    S.sales = sales ? sales.map : null; S.salesDate = sales ? sales.last : null;
    // a store belongs to the warehouse of its salesperson (SLMN), not the WH column of the Customer sheet;
    // spelling variants of one name ("คุณ X" / "X" / double spaces / "(ROO)") become the same person
    S.unmatched = new Map();
    shops.forEach(s => {
      const p = people.get(normName(s.sales));
      s.custWh = s.wh;
      if (p) { s.sales = p.name; s.wh = p.wh; }
      else { s.wh = ''; const k = s.sales.trim() || 'ไม่มีเซลล์ผู้ดูแล'; S.unmatched.set(k, (S.unmatched.get(k) || 0) + 1); }
    });
    S.shops = shops;
    applyUser(); renderStores();
    if (manual && window.RattanaUI) RattanaUI.toast('อัปเดตข้อมูลแล้ว', { type: 'success' });
  } catch (e) {
    console.error(e);
    if (window.RattanaUI) RattanaUI.toast('โหลดข้อมูลไม่สำเร็จ: ' + e.message, { type: 'error' });
  } finally {
    if (manual && window.RattanaUI) RattanaUI.setLoading(btn, false);
  }
}

/* ===== Stores by salesperson (design C) ===== */
const DAY_ORDER = ['จันทร์', 'อังคาร', 'พุธ', 'พฤหัสบดี', 'ศุกร์', 'เสาร์', 'อาทิตย์'];
const dayRank = d => (DAY_ORDER.indexOf(d) + 1) || 9;
const shortName = n => String(n || '').replace(/^คุณ\s*/, '');
// salespeople of the chosen warehouse with their store counts
function peopleOfWh() {
  const m = new Map();
  S.shops.forEach(s => { if (s.sales && s.wh === S.wh) m.set(s.sales, (m.get(s.sales) || 0) + 1); });
  return [...m].sort((a, b) => a[0].localeCompare(b[0], 'th'));
}
// the person to show: the last choice if they belong to this warehouse, else the signed-in salesperson, else the first one
function pickPerson() {
  const people = peopleOfWh().map(p => p[0]);
  const me = S.user && normName(S.user.name);
  const mine = me && people.find(x => normName(x) === me);
  if (!people.includes(S.sel)) S.sel = mine || (people.includes(localStorage.getItem(LS.sales)) ? localStorage.getItem(LS.sales) : people[0] || '');
}
function applyUser() {                // the signed-in salesperson sees themself first
  if (!S.user || !S.shops.length) return;
  const me = normName(S.user.name), mine = peopleOfWh().map(p => p[0]).find(x => normName(x) === me);
  if (mine && !S.userApplied) { S.sel = mine; S.userApplied = true; localStorage.setItem(LS.sales, mine); }
}
function renderStores() {
  const box = $('#spList'); if (!box || !S.shops.length) return;
  pickPerson();
  const people = peopleOfWh(), q = $('#spQ').value.trim().toLowerCase();
  const wc = WH_CHOICES.find(x => x.value === S.wh);
  // left: everyone of this warehouse
  $('#spSideH').textContent = `เซลล์ · ${people.length} คน`;
  $('#spChips').innerHTML = people.map(([n, c], i) => `<button type="button" class="sp-item${n === S.sel ? ' on' : ''}" data-person="${esc(n)}" aria-current="${n === S.sel}">`
    + `<span class="sn-sub">1.${i + 1}</span><span>${esc(shortName(n))}</span><b>${c}</b></button>`).join('');
  // right: the chosen person's stores, one heading per route day
  let rows = S.shops.filter(s => s.wh === S.wh && s.sales === S.sel);
  const total = rows.length;
  if (q) rows = rows.filter(s => [s.name, s.code, s.area, s.zone].join(' ').toLowerCase().includes(q));
  rows.sort((a, b) => dayRank(a.route) - dayRank(b.route) || a.seq - b.seq || a.name.localeCompare(b.name, 'th'));
  $('#spIni').textContent = S.sel ? shortName(S.sel).slice(0, 1) : '–';
  $('#spName').textContent = S.sel || 'ไม่มีเซลล์ในคลังนี้';
  $('#spSub').textContent = `${total.toLocaleString('th-TH')} ร้าน` + (q ? ` · ค้นพบ ${rows.length.toLocaleString('th-TH')} ร้าน` : '')
    + (S.sales ? ` · ยอดขายเดือนนี้${S.salesDate ? ' ถึง ' + thDate(S.salesDate) : ''} (EXVat+CN*2)` : ' · โหลดยอดขายจากชีท BP ไม่สำเร็จ');
  if (!rows.length) { box.innerHTML = `<div class="rt-cell-sub" style="padding:12px">${q ? 'ไม่พบร้านที่ค้นหา' : 'ไม่มีร้าน'}</div>`; return; }
  let day = null, html = '';
  rows.forEach(s => {
    const d = s.route || 'ไม่ระบุวัน';
    if (d !== day) { day = d; html += `<div class="sp-day">${esc(d)}</div>`; }
    const amt = S.sales ? (S.sales.get(s.code) || 0) : null;
    const open = s.code && s.code === RECO.open;
    html += `<div class="sp-row${open ? ' open' : ''}" data-code="${esc(s.code)}" role="button" tabindex="0" aria-expanded="${!!open}"><div><div class="rt-cell-main">${esc(s.name)}</div><div class="rt-cell-sub">${esc(s.code)}</div></div>`
      + `<div class="sp-amt${amt ? '' : ' zero'}">${amt == null ? '-' : money(amt)}<small>ยอดขายเดือนนี้</small></div>${CHEV}</div>`
      + (open ? `<div class="sp-reco" data-for="${esc(s.code)}">${recoHtml(s)}</div>` : '');
  });
  box.innerHTML = html;
}

/* ===== แนะนำจากอำเภอ — same rules as the sales app (tab DistrictReco, built monthly by the backend) =====
   2.1 ขายดีเป็นเงิน: rows of the same store type (falls back to all types) · sorted by baht
   2.2 กระจายทั่วอำเภอ: rows for all types · sorted by stores that bought · items already in 2.1 are not repeated
   leaves out what the store already bought this month (BP sheet, matched by product name) */
const DRECO_ID = '1dAxF4Mz-zhJIVbuJ_Ql126gt08qvVS1wndJD50pqCZI', RECO_N = 5;
const RECO = { open: '', amp: new Map(), bought: new Map(), cache: null };
const CHEV = '<svg class="chev" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>';
const prodKey = s => String(s || '').replace(/^[0-9]+@/, '').replace(/\s+/g, '').toLowerCase();
function amphoeOf(addr) {        // same as _extractDistrict in the sales app: "ต.,อ.,จ." → อำเภอ
  const s = String(addr || '').trim(); if (!s) return '';
  const m = s.match(/(?:อ\.|อำเภอ|เขต)\s*([^\s,]+(?:\s+[^\s,]+)*?)(?:\s+(?:จ\.|จังหวัด)|\s*$|,)/);
  if (m) return m[1].trim();
  const parts = s.split(/[,;]/).map(x => x.trim()).filter(Boolean);
  return parts.length >= 3 ? parts[parts.length - 2].replace(/^(?:อ\.|อำเภอ|เขต)\s*/, '').trim() : '';
}
function loadAmphoe(a) {
  if (!RECO.amp.has(a)) RECO.amp.set(a, gviz(DRECO_ID, `select * where A = '${a.replace(/'/g, '')}'`, 'DistrictReco').then(rows => {
    const h = rows[0] || [], ix = k => h.indexOf(k);
    const I = { code: ix('รหัสสินค้า'), name: ix('ชื่อสินค้า'), buyers: ix('ร้านที่ซื้อ'), pct: ix('%เข้าถึง'), baht: ix('ยอดขายบาท'), type: ix('ประเภทร้าน'), lvl: ix('อิงจาก'), n: ix('จำนวนร้านกลุ่ม') };
    const m = { pen: [], byType: {} };
    rows.slice(1).forEach(r => {
      const it = { code: r[I.code], name: r[I.name], buyers: num(r[I.buyers]), pct: num(r[I.pct]), baht: num(r[I.baht]) }, t = r[I.type] || '';
      if (!t) m.pen.push(it);
      else (m.byType[t] = m.byType[t] || { lvl: r[I.lvl] || '', n: num(r[I.n]), items: [] }).items.push(it);
    });
    return m;
  }).catch(e => { RECO.amp.delete(a); throw e; }));
  return RECO.amp.get(a);
}
function loadBought(code) {
  if (!RECO.bought.has(code)) RECO.bought.set(code, (async () => {
    const head = (await gviz(BP_ID, 'select * limit 0'))[0] || [];
    const L = k => { const i = head.indexOf(k); if (i < 0) throw new Error('ไม่พบคอลัมน์ "' + k + '" ในชีท BP'); return colLetter(i); };
    const C = L('Customer_Code'), P = L('Product_Name'), A = L('EXVat');
    const v = /^\d+$/.test(code) ? code : `'${code.replace(/'/g, '')}'`;
    const rows = await gviz(BP_ID, `select ${P}, sum(${A}) where ${C} = ${v} group by ${P}`);
    return new Set(rows.slice(1).filter(r => num(r[1]) > 0).map(r => prodKey(r[0])));
  })().catch(e => { RECO.bought.delete(code); throw e; }));
  return RECO.bought.get(code);
}
const pName = r => String(r.name || r.code || '').replace(/^[0-9]+@/, '');
function recoHtml(s) {
  const a = amphoeOf(s.area), head = `<div class="dreco"><div class="dreco-h">📍 แนะนำจากอำเภอ${a ? ' <b>' + esc(a) + '</b>' : ''}</div>`;
  if (!a) return head + '<div class="dreco-note">ร้านนี้ไม่มีข้อมูลอำเภอในชีท Customer เลยแนะนำตามพื้นที่ไม่ได้</div></div>';
  const st = RECO.cache && RECO.cache.code === s.code ? RECO.cache : null;
  if (!st) {
    Promise.all([loadAmphoe(a), loadBought(s.code).catch(() => null)])
      .then(([m, b]) => { RECO.cache = { code: s.code, m, b }; drawReco(s); })
      .catch(e => { RECO.cache = { code: s.code, err: e.message }; drawReco(s); });
    return head + '<div class="dreco-note">⏳ กำลังโหลดคำแนะนำ...</div></div>';
  }
  if (st.err) return head + `<div class="dreco-note">โหลดคำแนะนำไม่สำเร็จ: ${esc(st.err)}</div></div>`;
  const m = st.m, b = st.b || new Set(), ok = r => !b.has(prodKey(r.name));
  const tb = s.type && m.byType[s.type] && m.byType[s.type].items.length ? m.byType[s.type] : null;
  const byBaht = (tb ? tb.items : m.pen).filter(ok).filter(r => r.baht > 0).sort((x, y) => y.baht - x.baht).slice(0, RECO_N);
  const used = new Set(byBaht.map(r => r.code || r.name));
  const byPen = m.pen.filter(ok).filter(r => !used.has(r.code || r.name)).sort((x, y) => y.buyers - x.buyers || y.pct - x.pct).slice(0, RECO_N);
  let html = head + `<div class="dreco-note">ของที่ร้านนี้ยังไม่ได้ซื้อเดือนนี้ · จากยอดขายจริงในพื้นที่${st.b ? '' : ' · (โหลดบิลของร้านไม่สำเร็จ ยังไม่ได้ตัดของที่ซื้อแล้ว)'}</div>`;
  if (!byBaht.length && !byPen.length) return html + '<div class="dreco-note">ไม่มีของแนะนำในอำเภอนี้</div></div>';
  if (byBaht.length) {
    const lv = tb ? ({ 'อำเภอ': 'ในอำเภอ', 'จังหวัด': 'ในจังหวัด', 'ประเทศ': 'ทั้งประเทศ' }[tb.lvl] || '') : '';
    html += `<div class="dreco-sect"><span class="n">2.1</span>ขายดีเป็นเงิน${tb ? ` <small>· ${esc(s.type)}${lv ? ' ' + lv : ''}${tb.n ? ' ' + Math.round(tb.n) + ' ร้าน' : ''}</small>` : ''}</div>`
      + byBaht.map(r => `<div class="dreco-it"><div class="grow rt-cell-main">${esc(pName(r))}</div></div>`).join('');
  }
  if (byPen.length) html += '<div class="dreco-sect"><span class="n">2.2</span>กระจายทั่วอำเภอ</div>'
    + byPen.map(r => `<div class="dreco-it"><div class="grow"><div class="rt-cell-main">${esc(pName(r))}</div>`
      + `<div class="rt-cell-sub">${Math.round(r.buyers)} ร้านในอำเภอซื้อ · ${Math.round(r.pct)}%</div><div class="dreco-bar"><i style="width:${Math.max(4, Math.min(100, Math.round(r.pct)))}%"></i></div></div></div>`).join('');
  return html + '</div>';
}
function drawReco(s) {
  const el = document.querySelector(`.sp-reco[data-for="${CSS.escape(s.code)}"]`);
  if (el) el.innerHTML = recoHtml(s);
}
function toggleReco(row) {
  const code = row.dataset.code;
  RECO.open = RECO.open === code ? '' : code;
  renderStores();
}

/* ===== Warehouse picker ===== */
const WH_CHOICES = [
  { value: 'W1', name: 'สมุทรสงคราม', tone: 'gold' },
  { value: 'W3', name: 'ราชบุรี', tone: 'lightred' },
  { value: 'W4', name: 'นครปฐม', tone: 'green' },
  { value: 'nestle', name: 'Nestle', tone: 'blue', soon: true }
];
const whLabel = c => c.soon ? c.name : `${c.value} ${c.name}`;
function updateWhButton() {
  const c = WH_CHOICES.find(x => x.value === S.wh), t = 'คลัง: ' + (c ? whLabel(c) : (S.wh || 'ทุกคลัง'));
  $('#btnWh').textContent = t; $('#navWhTxt').textContent = t;
}
function refreshWhScreen() {
  const myW = S.user && String(S.user.w || '').toUpperCase();
  const chev = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>';
  $('#whList').innerHTML = WH_CHOICES.map(c => c.soon
    ? `<button type="button" class="wh-row is-soon" data-wh="${c.value}"><span class="rt-tile rt-tile-${c.tone} rt-tile-lg">N</span>
         <span class="wh-text"><span class="rt-cell-main">${c.name}</span><span class="rt-cell-sub">ใช้ข้อมูลอีกชุด</span></span>
         <span class="rt-badge rt-badge-neutral">เร็วๆ นี้</span></button>`
    : `<button type="button" class="wh-row" data-wh="${c.value}"><span class="rt-tile rt-tile-${c.tone} rt-tile-lg">${c.value}</span>
         <span class="wh-text"><span class="rt-cell-main">${c.name}${c.value === myW ? ' <span class="rt-badge rt-badge-gold">คลังของคุณ</span>' : ''}</span></span>
         <span class="wh-chev">${chev}</span></button>`).join('');
  const nick = S.user && (S.user.nickname || S.user.name);
  $('#whGreet').textContent = nick ? `สวัสดี ${nick}` : 'สวัสดี';
}
function pickWh() {
  refreshWhScreen();
  $('#appView').hidden = true; $('#whScreen').hidden = false; document.body.classList.add('picking');
  window.scrollTo(0, 0);
}
function onWhClick(e) {
  const b = e.target.closest('[data-wh]'); if (!b) return;
  if (b.dataset.wh === 'nestle') { if (window.RattanaUI) RattanaUI.toast('Nestle ใช้ข้อมูลอีกชุด — เร็วๆ นี้', { type: 'info' }); return; }
  $('#whScreen').hidden = true; $('#appView').hidden = false; document.body.classList.remove('picking');
  window.scrollTo(0, 0);
  S.wh = b.dataset.wh; localStorage.setItem(LS.wh, S.wh);
  updateWhButton();
  if (S.shops.length) { applyUser(); renderStores(); }
}

/* ===== Events ===== */
document.addEventListener('DOMContentLoaded', () => {
  const closeMenu = () => {      // phones only: close the slide-in menu (laptops keep the sidebar open)
    if (innerWidth < 768 && window.RattanaUI && RattanaUI.menuOpen) RattanaUI.menuOpen(false);
  };
  $('#whList').addEventListener('click', onWhClick);
  $('#btnWh').addEventListener('click', pickWh);
  $('#navWh').addEventListener('click', () => { closeMenu(); pickWh(); });
  $('#btnRefresh').addEventListener('click', () => loadAll(true));
  $('#spChips').addEventListener('click', e => {
    const b = e.target.closest('[data-person]'); if (!b) return;
    S.sel = b.dataset.person; localStorage.setItem(LS.sales, S.sel); $('#spQ').value = ''; renderStores();
    closeMenu(); window.scrollTo({ top: 0, behavior: 'smooth' });
  });
  $('#spQ').addEventListener('input', () => renderStores());
  $('#spList').addEventListener('click', e => { const r = e.target.closest('.sp-row[data-code]'); if (r) toggleReco(r); });
  $('#spList').addEventListener('keydown', e => { const r = e.target.closest('.sp-row[data-code]'); if (r && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); toggleReco(r); } });
  refreshWhScreen(); updateWhButton();
  loadAll(false);
  if (window.RattanaUI && RattanaUI.user) RattanaUI.user.ready.then(u => { S.user = u; refreshWhScreen(); applyUser(); renderStores(); });
});
</script>
