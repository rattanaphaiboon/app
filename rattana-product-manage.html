<style id="rk-base">
:root{
  /* ── บันได z-index กลาง — ใช้ตัวแปรเท่านั้น ห้ามใส่เลขมั่วรายจุด ── */
  --rk-z-sticky-sub: 90;    /* แถบ tab / ฟิลเตอร์รอง (ชั้นที่ 2 ลงมา) */
  --rk-z-sticky:     100;   /* header หลัก */
  --rk-z-dropdown:   1000;  /* dropdown / popover / เมนู */
  --rk-z-modal:      2000;  /* modal / bottom sheet / scanner */
  --rk-z-toast:      3000;  /* toast / snackbar */

  --rk-navy:#0d1b3e; --rk-gold:#c9a84c;
  --rk-surface:   var(--card-bg, #ffffff);
  --rk-surface-2: var(--bg, #f1f5f9);
  --rk-text:      var(--text, #0f172a);
  --rk-muted:     var(--muted, #64748b);
  --rk-line:      var(--border, #e2e8f0);
  --rk-radius: 12px;

  --rk-hdr-h: 56px;   /* ⚠️ ตั้งให้ตรงความสูง header จริงของแอป — sticky ชั้น 2 ใช้ค่านี้เป็น top */
}

/* ── ข้อ 1️⃣ บรรทัดเดียว (ใช้ได้ทุกที่: label · การ์ด · ตัวเลือก) ── */
.rk-1line{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rk-row{display:flex;align-items:center;gap:8px;min-width:0}
.rk-row>*{min-width:0}                    /* ❗ ขาดบรรทัดนี้ ellipsis ใน flex จะไม่ทำงาน */
.rk-grow{flex:1 1 auto;min-width:0}
.rk-nogrow{flex:0 0 auto}
.rk-scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:thin}

/* ── ข้อ 6️⃣ sticky ที่ "พื้นทึบ + ไม่ทับ dropdown" ── */
.rk-sticky{
  position:sticky; top:0; z-index:var(--rk-z-sticky);
  background:var(--rk-surface);                       /* ทึบ 100% ห้าม transparent/rgba */
  padding-top:env(safe-area-inset-top);
  box-shadow:0 1px 0 var(--rk-line);
}
.rk-sticky-sub{
  position:sticky; top:var(--rk-hdr-h); z-index:var(--rk-z-sticky-sub);
  background:var(--rk-surface-2);
  box-shadow:0 1px 0 var(--rk-line);
}
.rk-sticky-bottom{
  position:sticky; bottom:0; z-index:var(--rk-z-sticky-sub);
  background:var(--rk-surface);
  padding-bottom:env(safe-area-inset-bottom);
  box-shadow:0 -1px 0 var(--rk-line);
}
/* ❗ ห้าม overflow:hidden / auto บน parent ของ sticky หรือของ dropdown — จะตัด popup ขาด */
</style>
<script id="rk-base-js">
window.RK = window.RK || {};

/* ── helper ── */
RK.esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
RK.num = v => { const n = parseFloat(String(v==null?'':v).replace(/,/g,'')); return isFinite(n) ? n : 0; };
RK.debounce = (fn, ms=120) => { let t; return function(){ clearTimeout(t); const a=arguments, s=this; t=setTimeout(()=>fn.apply(s,a), ms); }; };

/* ── ย่อตัวเลขให้อยู่ในบรรทัดเดียว (ข้อ 1️⃣) ── */
RK.shortNum = n => {
  n = RK.num(n); const a = Math.abs(n);
  if (a >= 1e9) return (n/1e9).toFixed(a>=1e10?0:1).replace(/\.0$/,'') + 'B';
  if (a >= 1e6) return (n/1e6).toFixed(a>=1e7?0:1).replace(/\.0$/,'') + 'M';
  if (a >= 1e4) return (n/1e3).toFixed(0) + 'K';
  return n.toLocaleString('th-TH', {maximumFractionDigits:0});
};

/* ══════════════════════════════════════════════════════════════════════════
   RK.audit() — เรียกใน console ก่อน push (ผูกกับ Pre-Deploy Bug Check ข้อ 5-7)
   ตรวจ 3 อย่างบนหน้าที่เปิดอยู่จริง:
     1. sticky/fixed ที่พื้นหลังใส  → เนื้อหาวิ่งทะลุ
     2. parent ที่ overflow ตัด dropdown / z-index ต่ำกว่า sticky ตัวอื่น
     3. ข้อความที่ตกมากกว่า 1 บรรทัดที่ความกว้างจอปัจจุบัน (ย่อจอเป็น 375px ก่อนเรียก)
   ══════════════════════════════════════════════════════════════════════════ */
RK.audit = function(opts){
  opts = opts || {};
  const oneLineSel = opts.oneLineSel || 'button,label,option,.chip,.tab,.badge,.pill,th,.rk-1line,[data-1line]';
  const out = {transparentSticky:[], clipRisk:[], wrapped:[], zTop:[]};
  const own = el => el.closest('#rkScan,.rk-dd,.rk-dd-backdrop');     /* ตัว kit เอง — ไม่ต้องเตือน */
  const alpha0 = c => {
    if (!c || c === 'transparent') return true;
    const m = /rgba?\(([^)]+)\)/.exec(c); if (!m) return false;
    const p = m[1].split(','); return p.length > 3 && parseFloat(p[3]) < 0.9;
  };
  /* นับบรรทัดจริงของ "ข้อความในตัวมันเอง" (ไม่นับลูกที่เป็น element) — padding ไม่หลอก */
  const lineCount = el => {
    const rng = document.createRange(); let n = 0;
    el.childNodes.forEach(nd => {
      if (nd.nodeType === 3 && nd.textContent.trim()){
        rng.selectNodeContents(nd);
        n = Math.max(n, rng.getClientRects().length);
      }
    });
    return n;
  };

  document.querySelectorAll('*').forEach(el=>{
    if (own(el)) return;
    const cs = getComputedStyle(el);
    if (cs.position==='sticky' || cs.position==='fixed'){
      if (alpha0(cs.backgroundColor) && !(cs.backdropFilter||'').includes('blur'))
        out.transparentSticky.push({el, bg:cs.backgroundColor, z:cs.zIndex});
      if (cs.position==='sticky' && cs.zIndex!=='auto' && +cs.zIndex >= 1000)
        out.zTop.push({el, z:cs.zIndex});   /* sticky ที่สูงถึงชั้น dropdown → จะไปทับเมนู */
    }
  });

  document.querySelectorAll('[data-rk-menu-anchor],.rk-dd-btn,select').forEach(el=>{
    if (own(el)) return;
    let p = el.parentElement;
    while (p && p!==document.body){
      const cs = getComputedStyle(p);
      if (/hidden|auto|scroll/.test(cs.overflow + cs.overflowX + cs.overflowY) && cs.position!=='static')
        { out.clipRisk.push({trigger:el, clippedBy:p}); break; }
      p = p.parentElement;
    }
  });

  document.querySelectorAll(oneLineSel).forEach(el=>{
    if (own(el) || !el.offsetParent || !el.textContent.trim()) return;
    const n = lineCount(el);
    if (n > 1) out.wrapped.push({el, lines:n, text:el.textContent.trim().slice(0,40)});
  });

  console.group('%cRK.audit @ ' + window.innerWidth + 'px', 'font-weight:700');
  console.log('❌ sticky พื้นใส:', out.transparentSticky.length, out.transparentSticky);
  console.log('⚠️ dropdown เสี่ยงโดนตัด/ทับ:', out.clipRisk.length, out.clipRisk);
  console.log('⚠️ sticky z-index ≥1000 (ทับ dropdown):', out.zTop.length, out.zTop);
  console.log('❌ ตกบรรทัด (>1 บรรทัด):', out.wrapped.length, out.wrapped);
  console.groupEnd();
  return out;
};
</script>
<style>
:root{
  --bg:#f4f3ff; --surface:#ffffff; --surface-2:#f0eefc; --bar:#fbfaff; --line:#e6e3f5;
  --ink:#16132b; --ink-2:#5d5878; --ink-3:#9590ad;
  --card-bg:var(--surface); --text:var(--ink); --muted:var(--ink-2); --border:var(--line);
  --new-a:#7c3aed; --new-b:#ec4899; --back-a:#06b6d4; --back-b:#3b82f6; --idle-a:#f59e0b; --idle-b:#f43f5e;
  --new-soft:#f3e8ff; --back-soft:#e0f2fe; --idle-soft:#fff1e6;
  --new-ink:#7c3aed; --back-ink:#0284c7; --idle-ink:#e11d48;
  --w1:#FBBF24; --w2:#0EA5E9; --w3:#EF4444; --w4:#15803D; --w1-ink:#3b2a00;
  --hub-a:#f6d77a; --hub-b:#c9a84c; --hub-ink:#3a2a00;
  --blob-1:#c4b5fd; --blob-2:#f9a8d4; --blob-3:#67e8f9;
  --fs-xs:11.5px; --fs-sm:13px; --fs-md:15px; --fs-lg:17px; --fs-xl:22px; --fs-hero:44px; --fs-price:19px;
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px; --sp-6:28px; --gap-list:10px; --pad-card:12px; --pad-page:16px;
  --r-sm:8px; --r-md:14px; --r-lg:22px; --r-xl:28px; --r-pill:999px;
  --photo:76px;
  --hdr-h:56px; --tabs-h:64px; --rk-hdr-h:56px;
  --z-sticky-sub:90; --z-sticky:100; --z-dropdown:1000; --z-modal:2000; --z-toast:3000;
  --shadow-card:0 1px 2px rgba(22,19,43,.05),0 6px 20px rgba(76,52,170,.07);
  --shadow-pop:0 20px 50px rgba(22,19,43,.25);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#0c0a18; --surface:#17142a; --surface-2:#211d39; --bar:#120f22; --line:#2c2747;
  --ink:#f1efff; --ink-2:#b4aed2; --ink-3:#7d779c;
  --new-soft:#2a1747; --back-soft:#0d2a3d; --idle-soft:#3a1d18;
  --new-ink:#c4a1ff; --back-ink:#67d4f5; --idle-ink:#ff8aa3;
  --blob-1:#4c1d95; --blob-2:#831843; --blob-3:#155e75;
  --shadow-card:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  --bg:#0c0a18; --surface:#17142a; --surface-2:#211d39; --bar:#120f22; --line:#2c2747;
  --ink:#f1efff; --ink-2:#b4aed2; --ink-3:#7d779c;
  --new-soft:#2a1747; --back-soft:#0d2a3d; --idle-soft:#3a1d18;
  --new-ink:#c4a1ff; --back-ink:#67d4f5; --idle-ink:#ff8aa3;
  --blob-1:#4c1d95; --blob-2:#831843; --blob-3:#155e75;
  --shadow-card:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 var(--fs-md)/1.45 "Anuphan","Noto Sans Thai",system-ui,sans-serif;min-height:100dvh}
.aurora{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.aurora i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55}
.aurora i:nth-child(1){width:60vw;height:60vw;max-width:520px;max-height:520px;background:var(--blob-1);top:-12%;left:-15%}
.aurora i:nth-child(2){width:50vw;height:50vw;max-width:460px;max-height:460px;background:var(--blob-2);top:30%;right:-18%}
.aurora i:nth-child(3){width:45vw;height:45vw;max-width:420px;max-height:420px;background:var(--blob-3);bottom:-10%;left:10%}
.one{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
button{font:inherit;color:inherit}
.wrap{max-width:1200px;margin:0 auto;padding:0 var(--pad-page)}

/* header */
.hdr{position:sticky;top:0;z-index:var(--z-sticky);background:var(--bar);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.hdr .wrap{height:var(--hdr-h);display:flex;align-items:center;gap:var(--sp-3)}
.logo{width:34px;height:34px;border-radius:11px;flex:none;background:conic-gradient(from 200deg,var(--new-a),var(--new-b),var(--idle-a),var(--back-a),var(--new-a));display:grid;place-items:center}
.logo span{width:14px;height:14px;border-radius:5px;background:var(--bar)}
.ttl{min-width:0;flex:1;display:flex;flex-direction:column;line-height:1.15}
.ttl b{font-size:var(--fs-lg);font-weight:700}
.ttl small{font-size:var(--fs-xs);color:var(--ink-3)}
.hub{flex:none;display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:var(--r-pill);border:0;cursor:pointer;
  background:linear-gradient(135deg,var(--hub-a),var(--hub-b));color:var(--hub-ink);font-weight:700;font-size:var(--fs-sm);text-decoration:none}
.hub svg{width:16px;height:16px}

/* tabs */
.tabs{position:sticky;top:calc(var(--hdr-h) + env(safe-area-inset-top));z-index:var(--z-sticky-sub);background:var(--bar)}
.tabs .wrap{height:var(--tabs-h);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--sp-2);align-items:center}
.tab{height:48px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--surface);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0;padding:0 6px;transition:transform .15s}
.tab:active{transform:scale(.97)}
.tab b{font-size:var(--fs-lg);line-height:1.1;font-variant-numeric:tabular-nums}
.tab span{font-size:var(--fs-xs);color:var(--ink-2);max-width:100%}
.tab.on{border-color:transparent;color:#fff;box-shadow:0 8px 20px -8px var(--glow)}
.tab.on span{color:rgba(255,255,255,.9)}
.tab[data-t="new"]{--glow:var(--new-a)} .tab[data-t="back"]{--glow:var(--back-b)} .tab[data-t="idle"]{--glow:var(--idle-b)}
.tab.on[data-t="new"],.g-new{background:linear-gradient(135deg,var(--new-a),var(--new-b))}
.tab.on[data-t="back"],.g-back{background:linear-gradient(135deg,var(--back-a),var(--back-b))}
.tab.on[data-t="idle"],.g-idle{background:linear-gradient(135deg,var(--idle-a),var(--idle-b))}

/* search + filters */
.tools{position:sticky;top:calc(var(--hdr-h) + var(--tabs-h) + env(safe-area-inset-top));z-index:var(--z-sticky-sub);background:var(--bar);border-bottom:1px solid var(--line)}
.tools .wrap{padding-top:2px;padding-bottom:10px;display:flex;flex-direction:column;gap:var(--sp-2)}
.rk-search{height:44px;border-radius:var(--r-md)!important;background:var(--surface)!important}
.rk-search input{font-size:16px!important}
.frow{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;min-width:0}
.frow::-webkit-scrollbar{display:none}
.fc{flex:none;height:32px;padding:0 12px;border-radius:var(--r-pill);border:1px solid var(--line);background:var(--surface);font-size:var(--fs-sm);cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;max-width:220px}
.fc .dot{width:9px;height:9px;border-radius:50%}
.fc.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.fc .cv{font-size:10px;opacity:.7}
.fc.dd span{min-width:0;overflow:hidden;text-overflow:ellipsis}

/* hero */
main{position:relative;z-index:1}
main.wrap{padding-bottom:calc(40px + env(safe-area-inset-bottom))}
.hero{margin:var(--sp-4) 0 var(--sp-3);border-radius:var(--r-xl);padding:var(--sp-5);color:#fff;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.14)}
.hero .k{font-size:var(--fs-sm);opacity:.9}
.hero .big{display:flex;align-items:baseline;gap:10px;margin:2px 0 var(--sp-3)}
.hero .big b{font-size:var(--fs-hero);font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.hero .big span{font-size:var(--fs-md);opacity:.9}
.hero .stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--sp-2)}
.hero .st{background:rgba(255,255,255,.16);border-radius:var(--r-md);padding:8px 10px;min-width:0}
.hero .st b{display:block;font-size:var(--fs-lg);font-variant-numeric:tabular-nums}
.hero .st span{font-size:var(--fs-xs);opacity:.9}
.hero .def{margin-top:var(--sp-3);font-size:var(--fs-xs);opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;position:relative;z-index:1}

.bar2{display:flex;align-items:center;gap:var(--sp-2);margin:0 0 var(--sp-2);font-size:var(--fs-sm);color:var(--ink-2)}
.bar2 .one{flex:1}

/* list */
.vh{display:flex;align-items:baseline;gap:8px;margin:var(--sp-5) 2px var(--sp-2);min-width:0}
.vh b{font-size:var(--fs-md);font-weight:700}
.vh span{font-size:var(--fs-xs);color:var(--ink-3);flex:none}
.grid{display:grid;grid-template-columns:minmax(0,1fr);gap:var(--gap-list)}
.card{display:flex;gap:var(--sp-3);align-items:flex-start;background:var(--surface);border-radius:var(--r-lg);padding:var(--pad-card);box-shadow:var(--shadow-card);cursor:pointer;border:1px solid transparent;text-align:left;width:100%;transition:transform .15s,border-color .15s;min-width:0}
.card:active{transform:scale(.985)}
.card:hover{border-color:var(--line)}
.ph{width:var(--photo);height:var(--photo);flex:none;border-radius:var(--r-md);background:#fff center/contain no-repeat;border:1px solid var(--line);position:relative;overflow:hidden}
.ph.none{display:grid;place-items:center;text-align:center;padding:6px;font-size:10.5px;font-weight:700;color:#fff;border:0;line-height:1.2;word-break:break-word}
.bd{min-width:0;flex:1;display:flex;flex-direction:column;gap:3px}
.nm{font-size:var(--fs-md);font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sub{font-size:var(--fs-xs);color:var(--ink-3)}
.stk{display:flex;align-items:center;gap:4px;flex-wrap:nowrap;min-width:0;overflow:hidden;margin-top:2px}
.wq{display:inline-flex;align-items:center;gap:3px;white-space:nowrap}
.wc{font-size:10.5px;font-weight:700;padding:1px 5px;border-radius:5px;color:#fff}
.wc.W1{background:var(--w1);color:var(--w1-ink)} .wc.W2{background:var(--w2)} .wc.W3{background:var(--w3)} .wc.W4{background:var(--w4)}
.wq b{font-size:var(--fs-sm);font-variant-numeric:tabular-nums}
.sl{color:var(--ink-3);font-size:var(--fs-xs)}
.rt{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:4px;text-align:right}
.pr{font-size:var(--fs-price);font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.pr small,.pk small{font-size:var(--fs-xs);color:var(--ink-3);font-weight:500;margin-left:1px}
.pk{font-size:var(--fs-sm);font-weight:600;color:var(--ink-2)}
.sub .who,.sh-top .who{border:0;background:none;padding:0;font:inherit;font-weight:700;color:var(--back-ink);text-decoration:underline;cursor:pointer}
.qsec{background:var(--idle-soft)}
.qt{font-size:var(--fs-xs);font-weight:700;color:var(--idle-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl{font-size:var(--fs-xs);color:var(--ink-3);white-space:nowrap}
.tl b{color:var(--ink);font-variant-numeric:tabular-nums}
.sub b{color:var(--ink-2);font-weight:600}
.np{font-size:var(--fs-xs);font-weight:700;color:var(--idle-ink)}
.tag{font-size:var(--fs-xs);font-weight:700;padding:2px 8px;border-radius:var(--r-pill);white-space:nowrap}
.tag.new{background:var(--new-soft);color:var(--new-ink)} .tag.back{background:var(--back-soft);color:var(--back-ink)} .tag.idle{background:var(--idle-soft);color:var(--idle-ink)}
.empty{text-align:center;padding:48px 16px;color:var(--ink-2)}
.empty b{display:block;font-size:var(--fs-lg);color:var(--ink);margin-bottom:4px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(12,10,24,.45);z-index:var(--z-modal);opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;top:50%;z-index:calc(var(--z-modal) + 1);background:var(--surface);border-radius:var(--r-xl);width:min(440px,calc(100vw - 32px));max-height:86dvh;overflow-y:auto;overflow-x:hidden;transform:translate(-50%,-50%) scale(.94);opacity:0;visibility:hidden;transition:transform .22s cubic-bezier(.2,.8,.2,1),opacity .18s,visibility 0s linear .22s;box-shadow:var(--shadow-pop);padding-bottom:20px}
.sheet.on{transform:translate(-50%,-50%) scale(1);opacity:1;visibility:visible;transition-delay:0s}

/* ── บริหารสินค้า v2.0 ── */
/* v2.3 (Surat: "ย้ายฟอร์มแจ้ง + ตอบ/ปิดงาน เข้าแอป" · "กดรูปให้วิ่งไปแอปถ่ายรูปสินค้า"): ฟอร์มแจ้ง/หน้าเรื่อง/เครื่องมือจัดซื้อ เปิดในแอปนี้ (แผงเต็มจอ ฝังแอปติดตามสินค้า ?embed=) ไม่เปิดแท็บใหม่ · ส่ง/ตอบแล้วรายการรีเฟรชเอง · แตะรูปสินค้า = แอปถ่ายรูปสินค้า ?code= */
.ph[data-photo]{cursor:pointer}
/* v2.4 (Surat 29/10): แตะการ์ดสรุปจัดซื้อ = ป๊อปอัพ + รูปสินค้า · ตัดกล่องสรุปบนหน้าสรุปจัดซื้อ (แท็บบนมีตัวเลขแล้ว) · ปุ่มแจ้งปัญหาลงมาไม่บังการ์ด · เรื่องที่แจ้งเด้งป๊อปอัพทันที (แอปติดตามสินค้าโหลดรอไว้ พื้นใส) */
.hero[hidden]{display:none}
/* v2.6 (Surat 29/10: "ขาดส่งอยากให้แยกเป็นคลัง จะได้รู้คลังไหนขาด"): แท็บขาดส่งมีชิปคลัง (จำนวน + บาท · เรียงบาทมาก→น้อย) กดกรองได้ · การ์ดขาดส่งมีชิปคลังหน้าข้อความ */
/* v2.7 (Surat 29/10: "เลื่อนลงไม่ได้"): .wrap ใส่ padding ทับ main → การ์ดแถวล่างจมใต้เมนูล่าง · แก้เป็น main.wrap · เรื่องที่แจ้งมีปุ่ม แสดงเพิ่ม (เดิมตัดที่ 60) */
/* v2.8 (Surat 29/10: "ตรงสต็อกมันบัค"): แถวสต็อกในการ์ดสรุปจัดซื้อ ชิปคลังโดนตัดครึ่ง → ตัดทั้งชิปแล้วใส่ … แทน · ตัวเลขลังหลักพันย่อเป็น K (ป๊อปอัพยังโชว์เต็ม) */
/* v2.10 (Surat 29/10: "กลายเป็น … จริงๆที่มี"): แถวสต็อกการ์ดสรุปจัดซื้อกินความกว้างใต้ราคาด้วย (grid 3 คอลัมน์ แถวสต็อกคร่อมชื่อ+ราคา) */

<script id="rk-dropdown-js">
(function(){
  window.RK = window.RK || {};
  let el, backdrop, inp, list, cntEl, headEl, st = null, act = -1;

  function build(){
    if (el) return;
    backdrop = document.createElement('div'); backdrop.className = 'rk-dd-backdrop';
    el = document.createElement('div'); el.className = 'rk-dd'; el.setAttribute('role','listbox');
    el.innerHTML =
      '<div class="rk-dd-grip"></div>'+
      '<div class="rk-dd-head"><span class="rk-1line rk-grow"></span></div>'+
      '<div class="rk-dd-srch"><input type="search" inputmode="search" autocomplete="off" placeholder="พิมพ์ค้นหา…"><button class="rk-dd-x" type="button" aria-label="ล้าง">✕</button></div>'+
      '<div class="rk-dd-list"></div><div class="rk-dd-cnt"></div>';
    document.body.appendChild(backdrop); document.body.appendChild(el);   /* ← portal ที่ body: sticky ตัวไหนก็ทับไม่ได้ */
    inp = el.querySelector('input'); list = el.querySelector('.rk-dd-list');
    cntEl = el.querySelector('.rk-dd-cnt'); headEl = el.querySelector('.rk-dd-head span');

    inp.addEventListener('input', paint);
    el.querySelector('.rk-dd-x').addEventListener('click', ()=>{ inp.value=''; paint(); inp.focus(); });
    backdrop.addEventListener('click', close);
    el.addEventListener('keydown', key);
    inp.addEventListener('keydown', key);
    list.addEventListener('click', e=>{
      const it = e.target.closest('.rk-dd-it'); if (!it) return;
      pick(st.view[+it.dataset.i]);
    });
    window.addEventListener('resize', close);
    window.addEventListener('scroll', e=>{ if (st && !el.contains(e.target)) close(); }, true);
  }

  const norm = s => String(s==null?'':s).toLowerCase().trim();
  /* ค้นแบบ "ทุกคำต้องเจอ" และเจอที่ไหนก็ได้ในตัวเลือก (ไม่ใช่แค่ขึ้นต้น) */
  function match(hay, q){
    const w = norm(q).split(/\s+/).filter(Boolean);
    return w.every(x => hay.indexOf(x) >= 0);
  }

  function paint(){
    const q = inp.value;
    st.view = st.items.filter(it => !q || match(it._s, q));
    act = st.view.findIndex(it => String(it.v) === String(st.value));
    el.querySelector('.rk-dd-srch').classList.toggle('has', !!q);
    list.innerHTML = st.view.length
      ? st.view.map((it,i)=>
          '<div class="rk-dd-it'+(String(it.v)===String(st.value)?' sel':'')+'" data-i="'+i+'" role="option">'+
          (it.color?'<span class="dot" style="background:'+RK.esc(it.color)+'"></span>':'')+
          '<span class="lb" title="'+RK.esc(it.label)+'">'+RK.esc(it.label)+'</span>'+
          (String(it.v)===String(st.value)?'<span class="tick">✓</span>':'')+'</div>').join('')
      : '<div class="rk-dd-none">ไม่พบ "'+RK.esc(q)+'"</div>';
    cntEl.textContent = st.view.length + ' / ' + st.items.length + ' รายการ';
    cntEl.style.display = st.items.length > 8 ? '' : 'none';
    const sel = list.querySelector('.sel'); if (sel) sel.scrollIntoView({block:'nearest'});
  }

  function key(e){
    if (!st) return;
    if (e.key === 'Escape'){ e.preventDefault(); close(); return; }
    if (e.key === 'Enter'){ e.preventDefault(); if (st.view[act]) pick(st.view[act]); else if (st.view.length===1) pick(st.view[0]); return; }
    if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
    e.preventDefault();
    act = Math.max(0, Math.min(st.view.length-1, act + (e.key==='ArrowDown'?1:-1)));
    [...list.children].forEach((c,i)=> c.classList.toggle('act', i===act));
    if (list.children[act]) list.children[act].scrollIntoView({block:'nearest'});
  }

  function place(anchor){
    if (window.innerWidth <= 480) return;                 /* มือถือ = bottom sheet (CSS จัดให้) */
    const r = anchor.getBoundingClientRect(), M = 8;
    const w = Math.min(Math.max(r.width, 220), window.innerWidth - M*2);
    el.style.width = w + 'px';
    el.style.left  = Math.round(Math.min(Math.max(M, r.left), window.innerWidth - w - M)) + 'px';
    const below = window.innerHeight - r.bottom - M, above = r.top - M;
    const h = Math.min(el.scrollHeight || 320, 420);
    if (below >= Math.min(h, 220) || below >= above){ el.style.top = Math.round(r.bottom + 4) + 'px'; el.style.maxHeight = (below - 4) + 'px'; }
    else { el.style.top = Math.round(Math.max(M, r.top - 4 - Math.min(h, above))) + 'px'; el.style.maxHeight = (above - 4) + 'px'; }
  }

  function pick(it){ if (!it) return; const cb = st.onPick; close(); if (cb) cb(it); }

  function close(){
    if (!st) return;
    const a = st.anchor; st = null;
    el.classList.remove('on'); backdrop.classList.remove('on');
    backdrop.style.display = 'none';
    if (a && a.focus) try{ a.focus({preventScroll:true}); }catch(e){}
  }

  /* ── API หลัก ── */
  RK.dropdown = function(anchor, o){
    build(); if (st) close();
    const items = (o.items||[]).map(it => {
      const x = (typeof it === 'string') ? {v:it, label:it} : Object.assign({}, it);
      x.label = x.label==null ? String(x.v) : String(x.label);
      x._s = norm(x.label + ' ' + x.v + ' ' + (x.search||''));
      return x;
    });
    st = {anchor, items, view:items, value:o.value, onPick:o.onPick};
    headEl.textContent = o.title || 'เลือก';
    const searchable = o.search !== false && (o.search === true || items.length > 10);
    el.querySelector('.rk-dd-srch').style.display = searchable ? '' : 'none';
    inp.value = ''; inp.placeholder = o.placeholder || 'พิมพ์ค้นหา…';
    backdrop.style.display = ''; backdrop.classList.add('on');
    el.classList.add('on');
    paint(); place(anchor);
    if (searchable && window.innerWidth > 480) setTimeout(()=>inp.focus(), 30);
    return {close};
  };
  RK.closeDropdown = close;

  /* ── retrofit: <select> เดิม → ปุ่มที่ค้นหาได้ (ค่ายังอยู่ใน select เดิม แอปเดิมไม่ต้องแก้) ── */
  RK.selectify = function(sel, o){
    o = o || {};
    if (!sel || sel.dataset.rkDone || sel.hasAttribute('data-rk-skip') || sel.multiple) return;
    sel.dataset.rkDone = '1';
    const btn = document.createElement('button');
    btn.type = 'button'; btn.className = 'rk-dd-btn ' + (o.cls||'');
    btn.innerHTML = '<span class="lb"></span><span class="cv">▾</span>';
    btn.setAttribute('data-rk-menu-anchor','1');
    sel.style.display = 'none';
    sel.insertAdjacentElement('afterend', btn);

    const opts = () => [...sel.options].filter(op=>!op.disabled || op.value!=='')
                    .map(op => ({v:op.value, label:(op.textContent||'').trim(), color:op.dataset.color}));
    const sync = () => {
      const cur = sel.options[sel.selectedIndex];
      const t = cur ? (cur.textContent||'').trim() : (o.placeholder || 'เลือก…');
      btn.querySelector('.lb').textContent = t; btn.title = t;
      btn.disabled = sel.disabled;
    };
    btn.addEventListener('click', ()=> RK.dropdown(btn, {
      title: o.title || sel.getAttribute('aria-label') || sel.dataset.title || 'เลือก',
      items: opts(), value: sel.value,
      onPick: it => { sel.value = it.v; sync(); sel.dispatchEvent(new Event('change', {bubbles:true})); }
    }));
    sel.addEventListener('change', sync);
    new MutationObserver(sync).observe(sel, {childList:true, subtree:true, attributes:true, attributeFilter:['disabled','value']});
    sync();
    return btn;
  };

  RK.selectifyAll = function(root, o){
    (typeof root === 'string' ? document.querySelector(root) : (root || document))
      .querySelectorAll('select:not([data-rk-done]):not([data-rk-skip])')
      .forEach(s => RK.selectify(s, o));
  };
})();
</script>

<script id="rk-searchbar-js">
(function(){
  window.RK = window.RK || {};
  const norm = s => String(s==null?'':s).toLowerCase().trim();

  /* ── รวมทุกค่าใน record เป็นสตริงเดียว (ทำครั้งเดียวตอน load แล้ว cache) ── */
  RK.blob = function(obj, fields){
    if (obj == null) return '';
    if (typeof obj !== 'object') return norm(obj);
    if (obj.__rkBlob && !fields) return obj.__rkBlob;
    const keys = fields || Object.keys(obj);
    let s = '';
    for (const k of keys){
      if (k === '__rkBlob') continue;
      const v = obj[k];
      if (v == null || v === '') continue;
      if (typeof v === 'object') { s += ' ' + Object.values(v).filter(x=>x!=null&&typeof x!=='object').join(' '); }
      else s += ' ' + v;
    }
    s = norm(s.replace(/\s+/g,' '));
    if (!fields) { try { Object.defineProperty(obj,'__rkBlob',{value:s,enumerable:false,configurable:true}); } catch(e){} }
    return s;
  };

  /* ── ทุกคำต้องเจอ (AND) · ไม่สนตัวพิมพ์ · เจอกลางคำก็นับ ── */
  RK.match = function(rec, q, fields){
    const w = norm(q).split(/\s+/).filter(Boolean);
    if (!w.length) return true;
    const hay = typeof rec === 'string' ? norm(rec) : RK.blob(rec, fields);
    return w.every(x => hay.indexOf(x) >= 0);
  };

  RK.filter = function(list, q, fields){
    if (!q || !norm(q)) return list || [];
    return (list||[]).filter(r => RK.match(r, q, fields));
  };

  RK.q = sel => { const el = typeof sel==='string' ? document.querySelector(sel) : sel; return el ? el.value : ''; };

  /* ── ผูกช่องค้นหา: X ล้างทุกอย่าง · ไม่เด้ง scroll · debounce ── */
  RK.bindSearch = function(input, o){
    o = o || {};
    const el = typeof input === 'string' ? document.querySelector(input) : input;
    if (!el || el.dataset.rkBound) return;
    el.dataset.rkBound = '1';
    const wrap = el.closest('.rk-search') || el.parentElement;
    let x = wrap && wrap.querySelector('.rk-search-x');
    if (wrap && !x){ x = document.createElement('button'); x.type='button'; x.className='rk-search-x'; x.textContent='✕'; x.setAttribute('aria-label','ล้างทั้งหมด'); wrap.appendChild(x); }

    const paintX = () => { if (wrap) wrap.classList.toggle('has', !!el.value); };
    const fire = RK.debounce(()=>{ if (o.onQuery) o.onQuery(el.value); }, o.delay==null?120:o.delay);

    el.addEventListener('input', ()=>{ paintX(); fire(); });
    el.addEventListener('keydown', e=>{ if (e.key === 'Escape'){ e.preventDefault(); clear(); } });

    function clear(){
      const y = window.scrollY;                    /* ห้ามเด้งขึ้นบนสุด */
      el.value = ''; paintX();
      if (o.onReset) o.onReset();                  /* ❗ ล้างฟิลเตอร์/ชิป/หมวด กลับค่าเริ่มต้นด้วย */
      if (o.onQuery) o.onQuery('');
      el.focus({preventScroll:true});
      window.scrollTo({top:y});
    }
    if (x) x.addEventListener('click', clear);
    paintX();
    return {clear, value:()=>el.value};
  };
})();
</script>

<script>

  idle:{label:'ยังไม่มียอด',k:'รับเข้าล่าสุดเกิน 7 วัน ยังขายไม่ได้',def:'นับจากรับเข้าล่าสุด · หลังเข้ายังไม่มียอดขาย · ราคา S03',tag:function(o){var d=o.lr||o.li; return 'เข้า '+dm(d)+' · '+ago(d)+' วัน';}}

var WH = ['W1','W2','W3','W4'];

function esc(s){ return RK.esc(s); }

function dth(d){ if(!d) return '—'; var m=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.']; return (+d.slice(8,10))+' '+m[+d.slice(5,7)-1]+' '+String(+d.slice(0,4)+543).slice(2); }

function tot(o){ return WH.reduce(function(t,w){ return t+(o.st[w]||0); },0); }
function val(o){ return tot(o)*(o.p||0); }
function KB(v){ return v>=1e6?(v/1e6).toFixed(1)+'M':v>=1e3?Math.round(v/1e3)+'K':String(Math.round(v)); }
function qtyU(c,per){ per=per||1; if(c>=1||per<=1) return (c>=10?Math.round(c):Math.round(c*10)/10).toLocaleString('en-US')+' ลัง'; return Math.max(1,Math.round(c*per))+' ชิ้น'; }
function cs(c){ return c>=10?String(Math.round(c)):c>=1?String(Math.round(c*10)/10):'<1'; }
function money(v){ return Math.round(v).toLocaleString('en-US'); }
var HUE = ['#7c3aed','#ec4899','#06b6d4','#3b82f6','#f59e0b','#f43f5e','#10b981','#8b5cf6'];
function hue(s){ var h=0; for(var i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))>>>0; return HUE[h%HUE.length]; }
function index(){ DATA.forEach(function(o){ o._b=[o.n,o.v,o.b,o.z,o.bc.join(' '),Object.keys(o.st).join(' '),o.fi,o.li,o.p,o.pa,'x'+o.q,o.on||'',o.o||''].join(' ').toLowerCase(); }); }

function readURL(){
  var u=new URLSearchParams(location.search);
  if(TOP[u.get('t')]) S.t=u.get('t');
  if(u.get('v')) S.v=u.get('v');
  if(u.get('who')) S.who=u.get('who');
  if(u.get('q')){ S.q=u.get('q'); document.getElementById('q').value=S.q; }
}
function writeURL(){
  var u=new URLSearchParams(); u.set('t',S.t); if(S.v) u.set('v',S.v); if(S.who) u.set('who',S.who); if(S.q) u.set('q',S.q);
  try{ history.replaceState(null,'','?'+u.toString()+(location.search.indexOf('tweak=1')>=0?'&tweak=1':'')); }catch(_){}
}
function base(t){
  var words=S.q.toLowerCase().split(/\s+/).filter(Boolean), whs=Object.keys(S.wh).filter(function(w){return S.wh[w];});
  return DATA.filter(function(o){
    if(o.t.indexOf(t)<0) return false;
    if(S.v && o.v!==S.v) return false;
    if(S.who && owner(o)!==S.who) return false;
    if(whs.length && !whs.some(function(w){ return (o.st[w]||0)>0; })) return false;
    return words.every(function(w){ return o._b.indexOf(w)>=0; });
  });
}
function sortRows(rows){
  if(S.sort==='stock') return rows.sort(function(a,b){ return (tot(b)-tot(a))||((b.p||0)-(a.p||0)); });

  if(S.sort==='age') return rows.sort(function(a,b){ return a.fi<b.fi?-1:a.fi>b.fi?1:val(b)-val(a); });
  var V={},B={},Z={};
  rows.forEach(function(o){ var x=val(o); V[o.v]=(V[o.v]||0)+x; B[o.v+'|'+o.b]=(B[o.v+'|'+o.b]||0)+x; Z[o.v+'|'+o.b+'|'+o.z]=(Z[o.v+'|'+o.b+'|'+o.z]||0)+x; });
  return rows.sort(function(a,b){
    return (V[b.v]-V[a.v])||(a.v<b.v?-1:a.v>b.v?1:0)||(B[b.v+'|'+b.b]-B[a.v+'|'+a.b])||(Z[b.v+'|'+b.b+'|'+b.z]-Z[a.v+'|'+a.b+'|'+a.z])||(val(b)-val(a));
  });
}

    '<button class="fc dd" id="fs"><span>'+sorts[S.sort]+'</span><b class="cv">▾</b></button>';

function renderHero(rows){

function stockLine(o){
  return WH.filter(function(w){return (o.st[w]||0)>0;}).map(function(w){ return '<span class="wq"><span class="wc '+w+'">'+w+'</span><b>'+cs(o.st[w])+'</b></span>'; }).join('<span class="sl">/</span>');

function photoCode(o){ return String(o.code || (o.bc && o.bc[0]) || o.c || o.barcode || ''); }

  var price=(o.p?'<span class="pr">฿'+money(o.p)+'<small>/ลัง</small></span>'+(o.pa?'<span class="pk">฿'+money(o.pa)+'<small>/แพ็ค</small></span>':''):'<span class="np">ยังไม่มีราคา</span>')+'<span class="tl">รวม <b>'+qtyU(tot(o),o.q)+'</b></span>';

    '<div class="rt">'+price+'<span class="tag '+S.t+'">'+TOP[S.t].tag(o)+'</span></div></button>';

function render(){
  writeURL(); renderTabs(); renderFilters();
  var rows=sortRows(base(S.t)); renderHero(rows);
  var onWh=WH.filter(function(w){return S.wh[w];}); document.getElementById('cnt').textContent=rows.length?('แสดง '+rows.length+' รายการ'+(onWh.length?' · คลัง '+onWh.join(' '):'')+(S.v?' · '+S.v:'')):'';

/** รับเข้ารอบล่าสุด (ลังรายคลัง + รวม) · ขายไปแล้วกี่ลังหลังเข้า */
function quotaSec(o){
  if(!o.qt||!o.qt.length) return '';
  return '<div class="sh-sec qsec"><h4>โควต้าขาย (ล็อกในแอปเซลส์)</h4><div class="kv">'+o.qt.map(function(q){

  }).join('')+'</div></div>';

  var sold=o.sold||0, pct=o.lq>0?Math.round(sold/o.lq*100):0;

    '<span>ขายไปแล้ว</span><b>'+(sold>0?qtyU(sold,o.q)+(o.lq>0?' ('+(pct<1?'<1':pct)+'%)':''):'ยังไม่มียอดขาย')+'</b>'+
    (o.sf&&o.sf!==o.lr?'<span>นับยอดขายตั้งแต่</span><b>'+dth(o.sf)+'</b>':'')+
    '</div></div>';
}
function openSheet(o){
  var mx=Math.max.apply(null,WH.map(function(w){return o.st[w]||0;}))||1;

  document.getElementById('shb').innerHTML=
    '<div class="sh-top">'+photo(o,1)+'<div class="bd"><span class="tag '+S.t+'" style="align-self:flex-start">'+TOP[S.t].label+' · '+TOP[S.t].tag(o)+'</span><span class="nm">'+esc(o.n)+'</span><span class="sub">ผู้ดูแล <button class="who" type="button" data-who="'+esc(owner(o))+'">'+esc(owner(o))+'</button></span></div></div>'+

    '<div class="sh-sec"><h4>บาร์โค้ด (แตะเพื่อคัดลอก)</h4><div class="bc">'+o.bc.map(function(b){return '<button data-copy="'+esc(b)+'">'+esc(b)+'</button>';}).join('')+'</div></div>'+
    '<div class="sh-act"><button class="sec" data-copy="'+esc(o.n)+'">คัดลอกชื่อ</button><button class="pri g-'+S.t+'" data-copy="'+esc(o.bc[0]||o.n)+'">คัดลอกบาร์โค้ด</button></div>';
  document.getElementById('scrim').classList.add('on'); document.getElementById('sheet').classList.add('on');
}
function closeSheet(){ document.getElementById('scrim').classList.remove('on'); document.getElementById('sheet').classList.remove('on'); }
function toast(t){ var e=document.getElementById('toast'); e.textContent=t; e.classList.add('on'); clearTimeout(toast._t); toast._t=setTimeout(function(){e.classList.remove('on');},1600); }

document.addEventListener('click',function(e){
  var t=e.target.closest('.tab'); if(t){ S.t=t.dataset.t; if(S.sort==='age'&&S.t!=='idle') S.sort='stock'; render(); return; }
  var w=e.target.closest('[data-wh]'); if(w){ S.wh[w.dataset.wh]=!S.wh[w.dataset.wh]; render(); return; }
  if(e.target.closest('#fo')){
    var allo=DATA.filter(function(o){return o.t.indexOf(S.t)>=0;}), P={}; allo.forEach(function(o){ var k=owner(o); P[k]=(P[k]||0)+1; });
    var its=[{v:'',label:'ทุกผู้ดูแล'}].concat(Object.keys(P).sort(function(a,b){return P[b]-P[a];}).map(function(k){ return {v:k,label:k+' · '+P[k],search:k}; }));
    RK.dropdown(e.target.closest('#fo'),{title:'เลือกผู้ดูแลสินค้า',items:its,value:S.who,placeholder:'พิมพ์ชื่อหรือชื่อเล่น',onPick:function(it){ S.who=it.v; render(); }}); return;
  }
  if(e.target.closest('[data-who]')){ S.who=e.target.closest('[data-who]').dataset.who; closeSheet(); render(); return; }
  if(e.target.closest('#fv')){
    var all=DATA.filter(function(o){return o.t.indexOf(S.t)>=0;}), V={}; all.forEach(function(o){ V[o.v]=V[o.v]||{n:0,x:0}; V[o.v].n++; V[o.v].x+=val(o); });
    var items=[{v:'',label:'ทุกบริษัท'}].concat(Object.keys(V).sort(function(a,b){return V[b].x-V[a].x;}).map(function(k){ return {v:k,label:k+' · '+V[k].n,search:k}; }));
    RK.dropdown(e.target.closest('#fv'),{title:'เลือกบริษัท',items:items,value:S.v,placeholder:'พิมพ์ชื่อบริษัท',onPick:function(it){ S.v=it.v; render(); }}); return;

  if(e.target.closest('#meBtn')){
    var dark=document.documentElement.getAttribute('data-theme')==='dark'||(!document.documentElement.getAttribute('data-theme')&&matchMedia('(prefers-color-scheme: dark)').matches);
    RK.dropdown(e.target.closest('#meBtn'),{title:(ME&&ME.name)||(user&&user.email)||'',search:false,items:[{v:'reload',label:'โหลดข้อมูลล่าสุดใหม่'},{v:'theme',label:dark?'โหมดสว่าง':'โหมดมืด'},{v:'out',label:'ออกจากระบบ'}],
      onPick:function(it){ if(it.v==='reload') load(); else if(it.v==='theme') applyTheme(dark?'light':'dark'); else logout(); }}); return;
  }
  if(e.target.closest('[data-retry]')){ load(); return; }
  if(e.target.id==='scrim'||e.target.closest('#shx')) closeSheet();
});
document.addEventListener('keydown',function(e){ if(e.key==='Escape') closeSheet(); });
function applyTheme(t){ if(t) document.documentElement.setAttribute('data-theme',t); else document.documentElement.removeAttribute('data-theme'); try{ localStorage.setItem(THEME_KEY,t||''); }catch(_){} }
(function(){ var t=''; try{ t=localStorage.getItem(THEME_KEY)||''; }catch(_){} if(t) document.documentElement.setAttribute('data-theme',t); })();

function session(){
  try{ var p=JSON.parse(localStorage.getItem('rattana_session')||localStorage.getItem('rattanaUser')||'null');
    return p&&p.data&&p.data.email&&p.exp&&Date.now()<p.exp?p.data:null; }catch(_){ return null; }
}
function jwt(tok){
  var b=String(tok||'').split('.')[1]||''; b=b.replace(/-/g,'+').replace(/_/g,'/'); b+='='.repeat((4-b.length%4)%4);
  var bin=atob(b), u8=new Uint8Array(bin.length); for(var i=0;i<bin.length;i++) u8[i]=bin.charCodeAt(i);
  return JSON.parse(new TextDecoder().decode(u8));
}
window.onGoogle=function(res){
  try{
    var p=jwt(res.credential), email=String(p.email||'').trim().toLowerCase();
    if(!email) throw new Error('ไม่พบอีเมล');
    user={email:email,name:p.name||email,picture:p.picture||''};
    try{ var pl=JSON.stringify({data:user,exp:Date.now()+SESSION_TTL}); localStorage.setItem('rattana_session',pl); localStorage.setItem('rattanaUser',pl); }catch(_){}
    enter();
  }catch(err){ document.getElementById('lgErr').textContent='เข้าสู่ระบบไม่สำเร็จ: '+err.message; }
};
function logout(){
  if(!confirm('ออกจากระบบใช่ไหม')) return;
  try{ localStorage.removeItem('rattana_session'); localStorage.removeItem('rattanaUser'); }catch(_){}
  location.reload();
}
function enter(){
  document.getElementById('login').hidden=true;
  document.getElementById('meBtn').textContent=(user.name||user.email||'?').trim().charAt(0).toUpperCase();
  load();
  if(typeof SEC!=='undefined'&&SEC!=='news') renderAll();   // v2.5: เปิดตรงหน้าเรื่องที่แจ้ง/สรุปจัดซื้อ ไม่ต้องรอข่าวสินค้า
}
async function load(){
  var L=document.getElementById('list');
  if(typeof SEC==='undefined'||SEC==='news') L.innerHTML='<div class="load"><span class="spin"></span>กำลังโหลดข้อมูลล่าสุด…</div>';
  try{
    var r=await fetch(EXEC+'?action=newsData&email='+encodeURIComponent(user.email),{cache:'no-store'});
    var j=await r.json();
    if(!j.ok) throw new Error(j.error||'โหลดไม่ได้');
    SNAP=j.snap; ME=j.me||null; DATA=SNAP.items||[];
    if(!MY_WH_DONE){ MY_WH_DONE=true; var mw=String(ME&&ME.wh||'').toUpperCase(); if(WH.indexOf(mw)>=0&&!S.q&&!Object.keys(S.wh).some(function(k){return S.wh[k];})){ S.wh={}; S.wh[mw]=true; } }
    TODAY=new Date(SNAP.today.replace(/\//g,'-')+'T00:00:00+07:00');
    index();
    document.getElementById('ver').textContent=APP_VER+' · ข้อมูล '+SNAP.at.slice(8,10)+'/'+SNAP.at.slice(5,7)+' '+SNAP.at.slice(11);
    if(ME&&ME.name) document.getElementById('meBtn').title=ME.name;
    if(window.__afterLoad) window.__afterLoad(); else render();
    if(!load._pre){ load._pre=true; setTimeout(function(){ Promise.resolve(PTD || SEC === 'pt' ? 0 : loadPt(true)).then(function(){ if (isBuyer() && !DGD) loadDg(true); }); }, 400); }
    if(OPEN_Q){ OPEN_Q=false; var rows=base(S.t); if(rows.length===1) openSheet(rows[0]); }
  }catch(err){
    L.innerHTML='<div class="empty"><b>โหลดข้อมูลไม่ได้</b>'+esc(err.message)+'<br><button class="btn" type="button" data-retry="1">ลองใหม่</button></div>';
  }
}
readURL();
OPEN_Q=!!S.q;
RK.bindSearch('#q',{onQuery:function(q){ S.q=q.trim(); render(); },onReset:function(){ S.wh={}; S.v=''; S.who=''; S.sort='stock'; }});
document.getElementById('ver').textContent=APP_VER;
document.getElementById('lgVer').textContent=APP_VER+' · '+APP_DATE;
user=session();
if(user) enter(); else document.getElementById('login').hidden=false;
</script>

<script>
/* ── บริหารสินค้า v2.0 · 3 หน้า ข่าวสินค้า / เรื่องที่แจ้ง / สรุปจัดซื้อ · ดีไซน์เดียวกัน ── */
var SEC = 'news', PTD = null, PTSRC = null, PT_BUYER = false, DGD = null, PT_URL = /^(localhost|127\.)/.test(location.hostname) ? '/Product_track/rattana-product-track.html' : 'https://rattanaphaiboon.github.io/app/rattana-product-track.html', DEEP_ID = '';
var PHOTO_URL = 'https://rattanaphaiboon.github.io/app/rattana-product-photo.html', PTF_DIRTY = false;
var P2 = { t: 'open', who: '', ty: '', q: '', sort: 'old' }, D2 = { t: 'bo', who: '', q: '', sort: 'val' };
var NEWS_RENDER = render;
var IC = {
  news: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7l8-4 8 4v10l-8 4-8-4z"/><path d="M4 7l8 4 8-4M12 11v10"/></svg>',
  pt: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 16H3z"/><path d="M12 10v4M12 17v.5"/></svg>',
  dg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>'
};
var PTS = { open: ['รอดำเนินการ', 'ยังไม่ปิดงาน'], done: ['เรียบร้อย', 'ปิดงานแล้ว'], fail: ['ไม่สำเร็จ', 'ปิดแบบไม่สำเร็จ'] };
var DGT = { bo: ['ขาดส่ง', 'ร้านสั่งแล้วไม่ได้ของ'], loss: ['ขายขาดทุน', 'ราคาขายต่ำกว่าทุน'], smp: ['SMP2 ยังไม่สั่ง', 'ระบบให้สั่งแต่ยังไม่มี PO'], dead: ['ไม่มียอดขาย', 'มีสต็อกแต่ 90 วันไม่มียอด'] };
var DGKEY = { bo: 'ขาดส่ง', loss: 'ขายขาดทุน', smp: 'SMP2 ยังไม่สั่ง', dead: 'ไม่มียอดขาย' };
function isBuyer(){ return PT_BUYER || (!PTD && !!DGD); }   // ยังไม่รู้สิทธิ์แต่มีสรุปจัดซื้อในเครื่อง (หลังบ้านให้เฉพาะจัดซื้อ) = จัดซื้อ
function nick(n){ var m = /\(([^()]+)\)\s*$/.exec(String(n || '')); return m ? m[1] : (n || 'ฝน'); }
function daysFrom(d){ if (!d) return null; var t = Date.parse(String(d).slice(0, 10).replace(/\//g, '-') + 'T00:00:00+07:00'); return isFinite(t) ? Math.max(0, Math.round((TODAY - t) / 864e5)) : null; }
function words(q){ return String(q || '').toLowerCase().split(/\s+/).filter(Boolean); }

/* ลัง ถ้าไม่ถึงลังค่อยชิ้น — ใช้ทั้งแอป */
function qty(cases, per){ per = per || 1; if (cases >= 1 || per <= 1) return (cases >= 10 ? Math.round(cases) : Math.round(cases * 10) / 10).toLocaleString('en-US') + ' ลัง'; return Math.max(1, Math.round(cases * per)) + ' ชิ้น'; }
cs = function(c){ return c >= 10 ? Math.round(c).toLocaleString('en-US') : c >= 1 ? String(Math.round(c * 10) / 10) : String(Math.round(c * 100) / 100); };
stockLine = function(o){ return WH.filter(function(w){ return (o.st[w] || 0) > 0; }).map(function(w){ var c = o.st[w]; return '<span class="wq"><span class="wc ' + w + '">' + w + '</span><b>' + (c >= 1 ? cs(c) : Math.max(1, Math.round(c * o.q)) + ' ชิ้น') + '</b></span>'; }).join('<span class="sl">/</span>'); };
function stkQty(s){ var q = dsQty(s), m = /^([\d,.]+) ลัง$/.exec(q); if (!m) return q; var n = parseFloat(m[1].replace(/,/g, '')); return (n >= 1e3 ? (n / 1e3).toFixed(n >= 1e4 ? 0 : 1).replace(/\.0$/, '') + 'K' : m[1]) + ' ลัง'; }
function dsQty(s){ return String(s || '').replace(/^([\d,.]+ ลัง)\s+[\d,]+ ชิ้น$/, '$1'); }

/* ── เมนูล่าง + แท็บด้านบน (ใช้ .tabs เดิมของหน้าข่าวสินค้า) ── */
function renderNav(){
  if (PTD && !isBuyer() && SEC === 'dg') SEC = 'news';   // ลิงก์ ?sec=dg รอสิทธิ์จากหลังบ้านก่อน
  var tabs = [['news', 'ข่าวสินค้า'], ['pt', 'เรื่องที่แจ้ง']].concat(isBuyer() ? [['dg', 'สรุปจัดซื้อ']] : []);
  var open = ptBase('open').length;
  document.getElementById('bnav').style.setProperty('--n', tabs.length);
  document.getElementById('bnavIn').innerHTML = tabs.map(function(t){
    return '<button type="button" class="' + (SEC === t[0] ? 'on' : '') + '" data-sec="' + t[0] + '">' + IC[t[0]] + '<span class="one">' + t[1] + '</span>' + (t[0] === 'pt' && open ? '<i class="bd2">' + open + '</i>' : '') + '</button>';
  }).join('');
  document.body.setAttribute('data-sec', SEC);
}
function setTabs(map, cur, counts){
  document.getElementById('tabs').innerHTML = Object.keys(map).map(function(k){
    return '<button class="tab' + (cur === k ? ' on' : '') + '" data-t="' + k + '" data-sx="' + SEC + '"><b>' + counts[k] + '</b><span class="one">' + map[k][0] + '</span></button>';
  }).join('');
}
function setHero(cls, k, big, stats, def){
  var h = document.getElementById('hero'); h.className = 'hero g-' + cls; h.hidden = false;
  h.innerHTML = '<div><div class="k">' + k + '</div><div class="big"><b>' + big + '</b><span>รายการ</span></div></div>' +
    '<div class="stats">' + stats.map(function(s){ return '<div class="st"><b>' + s[0] + '</b><span class="one">' + s[1] + '</span></div>'; }).join('') + '</div>' +
    '<div class="def">' + def + '</div>';
}
function whoChips(list, cur, key){
  var C = {}; list.forEach(function(x){ var n = key(x); C[n] = (C[n] || 0) + 1; });
  return '<button class="fc who' + (!cur ? ' on' : '') + '" data-who="">ทุกคน ' + list.length + '</button>' +
    Object.keys(C).sort(function(a, b){ return C[b] - C[a]; }).map(function(n){ return '<button class="fc who' + (cur === n ? ' on' : '') + '" data-who="' + esc(n) + '">' + esc(nick(n)) + ' ' + C[n] + '</button>'; }).join('');
}
function sortBar(n, cur, opts){
  document.getElementById('cnt').parentNode.innerHTML = '<span class="one" id="cnt">แสดง ' + n + ' รายการ</span><span class="sw">' + opts.map(function(o){ return '<button type="button" data-srt="' + o[0] + '" class="' + (cur === o[0] ? 'on' : '') + '">' + o[1] + '</button>'; }).join('') + '</span>';
}

/* ── เรื่องที่แจ้ง (ติดตามสินค้าเดิม) ── */
function ptBase(st){
  return (PTD || []).filter(function(x){ return !st || x.status === PTS[st][0]; });
}
function ptDetail(x){
  if (x.type === 'ราคาผิด') return 'ราคาที่เห็น ' + (x.priceSeen || '—') + (x.priceNew ? ' · ควรเป็น ' + x.priceNew : '');
  if (x.type === 'ใกล้หมดอายุ') return 'หมดอายุ ' + (x.expDate ? dm(x.expDate.replace(/-/g, '/')) + '/' + x.expDate.slice(2, 4) : '—') + (x.qty ? ' · ' + x.qty.replace(/กับ\d+ชิ้น$/, '') : '');
  if (x.type === 'โอนย้ายผิด') return (x.fromWh || '?') + ' → ' + (x.toWh || '?') + (x.qty ? ' · ' + x.qty : '');
  return x.note || '';
}
function renderPt(){
  var counts = {}; Object.keys(PTS).forEach(function(k){ counts[k] = ptBase(k).length; });
  setTabs(PTS, P2.t, counts);
  var base = ptBase(P2.t), w = words(P2.q);
  var rows = base.filter(function(x){
    if (P2.who && (x.buyer || 'ฝน') !== P2.who) return false;
    if (P2.ty && x.type !== P2.ty) return false;
    var b = [x.id, x.name, x.type, x.buyer, x.sender, x.wh, x.barcode, x.note, x.lastNote].join(' ').toLowerCase();
    return w.every(function(t){ return b.indexOf(t) >= 0; });
  }).sort(function(a, b){ var ka = P2.t === 'open' ? a.ts : (a.updatedAt || a.ts), kb = P2.t === 'open' ? b.ts : (b.updatedAt || b.ts); return P2.sort === 'old' ? (ka < kb ? -1 : ka > kb ? 1 : 0) : (ka < kb ? 1 : ka > kb ? -1 : 0); });
  var stale = base.filter(function(x){ return (daysFrom(x.date) || 0) > 3; }).length, types = {}, owners = {};
  base.forEach(function(x){ types[x.type] = (types[x.type] || 0) + 1; owners[x.buyer] = 1; });
  setHero(P2.t, (isBuyer() ? 'ทุกเรื่องที่แจ้งเข้ามา · ' : 'เรื่องที่คุณแจ้ง · ') + PTS[P2.t][1], base.length,
    [[stale, 'ค้างเกิน 3 วัน'], [Object.keys(owners).length, 'ผู้ดูแล']], isBuyer() ? 'แตะการ์ดเพื่อตอบ/ปิดงาน · ปุ่มชีตเปิดแถวในหลังบ้าน' : 'เห็นเฉพาะเรื่องที่คุณแจ้ง · แตะการ์ดดูรายละเอียด');
  document.getElementById('hero').classList.add('mini');
  var tyChips = (isBuyer() && P2.t === 'open' ? '<button class="fc' + (PSEL.on ? ' on' : '') + '" data-ptsel>' + (PSEL.on ? 'เลือกอยู่ · แตะการ์ด' : 'เลือกหลายเรื่อง') + '</button>' : '') + (isBuyer() ? '<button class="fc" data-ptfull>เครื่องมือจัดซื้อ</button>' : '') + '<button class="fc' + (!P2.ty ? ' on' : '') + '" data-pty="">ทุกเรื่อง</button>' + Object.keys(types).sort(function(a, b){ return types[b] - types[a]; }).map(function(t){ return '<button class="fc' + (P2.ty === t ? ' on' : '') + '" data-pty="' + esc(t) + '">' + esc(t) + ' ' + types[t] + '</button>'; }).join('');
  document.getElementById('frow').innerHTML = whoChips(base, P2.who, function(x){ return x.buyer || 'ฝน'; });
  document.getElementById('frow2').innerHTML = tyChips; document.getElementById('frow2').hidden = false;
  sortBar(rows.length, P2.sort, [['old', 'ค้างนานสุดก่อน'], ['new', 'ล่าสุดก่อน']]);
  var plim = P2.lim || 60;
  PSEL.rows = rows;
  document.getElementById('list').innerHTML = rows.length ? '<div class="grid">' + rows.slice(0, plim).map(function(x){
    var d = daysFrom(x.date), img = x.img ? photo({ img: x.img, barcode: x.barcode }) : photo({ barcode: x.barcode, b: x.type, v: x.type });
    return '<div class="card" role="button" tabindex="0" data-ptid="' + esc(x.id) + '" data-tweak-card="การ์ดเรื่องแจ้ง">' + img + '<div class="bd"><span class="nm">' + esc(x.name) + '</span>' +
      '<span class="sub one"><span class="ty">' + esc(x.type) + '</span>' + esc(ptDetail(x)) + '</span>' +
      '<span class="sub one">ผู้ดูแล <b>' + esc(nick(x.buyer)) + '</b> · ' + esc(x.wh) + (isBuyer() ? ' · แจ้งโดย ' + esc(x.sender) : '') + '</span>' +
      (x.lastNote ? '<span class="rep">จัดซื้อตอบ: ' + esc(x.lastNote) + '</span>' : '') + '</div>' +
      '<span class="ck"></span><div class="rt"><span class="tag ' + P2.t + '">' + (P2.t === 'open' ? 'ค้าง ' + d + ' วัน' : PTS[P2.t][0]) + '</span><span class="tl">แจ้ง ' + esc(dm(x.date.replace(/-/g, '/'))) + '</span>' + (isBuyer() && x.row && PTSRC && PTSRC.pt ? '<a class="shl" target="_blank" rel="noopener" href="' + PTSRC.pt + '&range=A' + x.row + '">ชีต</a>' : '') + '</div></div>';
  }).join('') + '</div>' + (rows.length > plim ? '<button class="more2" type="button" data-ptmore="1">แสดงเพิ่ม (' + (rows.length - plim).toLocaleString('en-US') + ' รายการ)</button>' : '') : '<div class="empty"><b>ไม่มีเรื่องในหมวดนี้</b>ลองกดแท็บด้านบน หรือกดปุ่ม ✕ ล้างตัวกรอง</div>';
}

/* ── สรุปจัดซื้อ ── */
function dgAge(r){
  var m = /เข้าล่าสุด (\d{4}-\d{2}-\d{2})/.exec(r.d || ''); if (m) return m[1];
  m = /B[KVO]\d{2}(\d{2})(\d{2})(\d{2})\//.exec(r.d || ''); if (m) return (2000 + (+m[1]) - 43) + '-' + m[2] + '-' + m[3];
  return '';
}
function dgTopic(k){ return ((DGD && DGD.topics) || []).filter(function(t){ return t.key === DGKEY[k]; })[0] || { rows: [], count: 0 }; }
function renderDg(){
  var counts = {}; Object.keys(DGT).forEach(function(k){ counts[k] = dgTopic(k).rows.length; });
  setTabs(DGT, D2.t, counts);
  var t = dgTopic(D2.t), w = words(D2.q);
  t.rows.forEach(function(r){ if (r._a === undefined) r._a = dgAge(r); });
  var rows = t.rows.filter(function(r){
    if (D2.who && (r.b || 'ฝน') !== D2.who) return false;
    var b = [r.n, r.b, r.v, r.c, r.d].join(' ').toLowerCase();
    return w.every(function(x){ return b.indexOf(x) >= 0; });
  }).sort(function(a, b){
    if (D2.sort === 'val') return (b.val || 0) - (a.val || 0);
    if (a._a && b._a && a._a !== b._a) return a._a < b._a ? -1 : 1;
    if (a._a && !b._a) return -1; if (b._a && !a._a) return 1;
    return (b.val || 0) - (a.val || 0);
  });
  var sum = rows.reduce(function(s, r){ return s + (r.val || 0); }, 0), owners = {}; rows.forEach(function(r){ owners[r.b] = 1; });
  setHero(D2.t, DGT[D2.t][1] + ' · รอบ ' + DGD.at.slice(8, 10) + '/' + DGD.at.slice(5, 7), rows.length,
    [['฿' + KB(sum), D2.t === 'loss' || D2.t === 'smp' ? 'ต่อวัน' : 'มูลค่า'], [Object.keys(owners).length, 'ผู้ดูแล']], 'เห็นเฉพาะจัดซื้อและ Role 5 ขึ้นไป' + (PTSRC ? ' · <a class="shl2" target="_blank" rel="noopener" href="' + dgSrc(D2.t) + '">เปิดชีตต้นทาง</a>' : ''));
  document.getElementById('frow').innerHTML = whoChips(t.rows, D2.who, function(r){ return r.b || 'ฝน'; });
  document.getElementById('frow2').hidden = true;
  sortBar(rows.length, D2.sort, [['old', 'ค้างนานสุดก่อน'], ['val', 'มูลค่ามากสุดก่อน']]);
  document.getElementById('list').innerHTML = rows.length ? '<div class="grid">' + rows.slice(0, 60).map(function(r){
    var d = daysFrom(r._a), st = (r.s || []).filter(function(x){ return /^W[1-4]$/.test(x[0]); });
    return '<div class="card" data-tweak-card="การ์ดสรุปจัดซื้อ">' + photo({ b: r.v, v: r.v, c: r.c }) + '<div class="bd"><span class="nm">' + esc(r.n) + '</span>' +
      '<span class="sub one">ผู้ดูแล <b>' + esc(nick(r.b)) + '</b></span><span class="sub one">' + esc((r.d || '').replace(/(\d[\d,]*) ชิ้น/g, function(m0, n){ return m0; })) + '</span>' +
      (st.length ? '<div class="stk">' + st.map(function(x){ return '<span class="wq"><span class="wc ' + x[0] + '">' + x[0] + '</span><b>' + esc(dsQty(x[1])) + '</b></span>'; }).join('<span class="sl">/</span>') + '</div>' : '') + '</div>' +
      '<div class="rt">' + (r.val ? '<span class="pr">฿' + money(r.val) + '</span>' : '') + (d !== null ? '<span class="tag ' + D2.t + '">ค้าง ' + d + ' วัน</span>' : '') + '</div></div>';
  }).join('') + '</div>' : '<div class="empty"><b>ไม่มีรายการ</b>ลองเลือกคนอื่น หรือกดปุ่ม ✕</div>';
}

function renderAll(){
  renderNav();
  if (PSEL.on && (SEC !== 'pt' || P2.t !== 'open')) { PSEL.on = false; PSEL.ids = {}; }
  selPaint();
  if (SEC === 'news') { document.getElementById('frow2').hidden = true; NEWS_RENDER(); return; }
  if (SEC === 'pt') { if (!PTD) return loadPt(); renderPt(); selPaint(); }
  else { if (!DGD) return loadDg(); renderDg(); }
}
function dgSrc(k){ return !PTSRC ? '' : k === 'bo' ? PTSRC.bo : k === 'smp' ? PTSRC.smp : k === 'loss' ? PTSRC.ib : k === 'dead' ? PTSRC.pddt : PTSRC.digest; }
function secLoading(msg){ document.getElementById('tabs').innerHTML = ''; document.getElementById('frow').innerHTML = ''; document.getElementById('frow2').hidden = true; document.getElementById('hero').className = 'hero g-open'; document.getElementById('hero').innerHTML = '<div class="k">' + msg + '</div>'; document.getElementById('list').innerHTML = '<div class="load"><span class="spin"></span>' + msg + '</div>'; }
async function loadPt(quiet){
  if (!quiet) secLoading('กำลังโหลดเรื่องที่แจ้ง…');
  try {
    var r = await fetch(EXEC + '?action=newsPt&email=' + encodeURIComponent(user.email), { cache: 'no-store' }), j = await r.json();
    if (!j.ok) throw new Error(j.error || 'โหลดไม่ได้');

  var FONTS = [['ตามแอป',''], ['Sarabun',"'Sarabun',sans-serif"], ['Noto Sans Thai',"'Noto Sans Thai',sans-serif"],
    ['IBM Plex Sans Thai',"'IBM Plex Sans Thai',sans-serif"], ['Prompt',"'Prompt',sans-serif"],
    ['Kanit',"'Kanit',sans-serif"], ['ระบบ',"-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"]];

  /* ─────────── แถวควบคุม ─────────── */
  function tokenRow(name, val) {
    var g = group(name, val), d = el('div', 'rkt-r');
    var n = el('span', 'rkt-n', name); n.title = name; d.appendChild(n);

    if (g === 'สี') {
      var isInk = !/bg|back|surface|border|line|shadow|glow|soft|tint|fill/i.test(name);
      var cr = el('span', 'rkt-cr'), c = el('input'), t = el('input');
      c.type = 'color'; c.className = 'rkt-c'; t.type = 'text'; t.className = 'rkt-t';
      var cur = live[name] || val;
      try { c.value = hex(cur); } catch (e) {}
      t.value = cur;
      var paint = function (v) {
        if (!isInk) { cr.textContent = 'พื้น'; cr.className = 'rkt-cr'; cr.title = 'สีพื้น/ขอบ ไม่ต้องวัด contrast'; return; }
        var r = ratio(v, solidBg(document.body));
        if (r == null) { cr.textContent = '?'; cr.className = 'rkt-cr'; return; }
        cr.textContent = r.toFixed(2);
        cr.className = 'rkt-cr ' + (r >= 4.5 ? 'ok' : 'no');
        cr.title = 'ถ้าใช้เป็นตัวหนังสือบนพื้นหน้านี้ ' + r.toFixed(2) + ':1 ' + (r >= 4.5 ? 'ผ่าน' : 'ไม่ผ่าน 4.5:1');
      };
      paint(cur);
      c.oninput = function () { t.value = c.value; setToken(name, c.value); paint(c.value); };
      t.onchange = function () { setToken(name, t.value); try { c.value = hex(t.value); } catch (e) {} paint(t.value); };
      d.appendChild(cr); d.appendChild(c); d.appendChild(t);
    } else {
      var num = parseFloat(live[name] || val);
      var max = g === 'ตัวอักษร' ? 44 : (g === 'มุมโค้ง' ? 44 : 90);
      var s = el('input'); s.type = 'range'; s.className = 'rkt-s'; s.min = 0; s.max = max; s.step = 0.5; s.value = num;
      var v = el('span', 'rkt-v', num + 'px');
      s.oninput = function () { v.textContent = s.value + 'px'; setToken(name, s.value + 'px'); };
      d.appendChild(s); d.appendChild(v);
    }
    return d;
  }

  function cardRow(label, prop, kind) {
    var d = el('div', 'rkt-r'), first = cardTargets(picked)[0];
    if (!first) return d;
    var cs = getComputedStyle(first);
    var cur = (cards[picked] && cards[picked][prop]) || cs.getPropertyValue(prop);
    d.appendChild(el('span', 'rkt-n', label));

    function set(v) { (cards[picked] = cards[picked] || {})[prop] = v; applyCards(); }

    if (kind === 'color') {
      var cr = el('span', 'rkt-cr'), c = el('input'), t = el('input');
      c.type = 'color'; c.className = 'rkt-c'; t.type = 'text'; t.className = 'rkt-t';
      /* โปร่งใสต้องอ่านออกว่าโปร่งใส ไม่ใช่โชว์ #000000 ให้เข้าใจผิดว่าพื้นดำ */
      try { c.value = hex(isClear(cur) ? solidBg(first) : cur); } catch (e) {}
      t.value = isClear(cur) ? 'โปร่งใส' : hex(cur);
      t.title = 'พิมพ์ #rrggbb หรือคำว่า โปร่งใส';
      var paint = function (v) {
        if (prop !== 'color') { cr.textContent = isClear(v) ? 'ใส' : 'พื้น'; cr.className = 'rkt-cr'; return; }
        var r = ratio(v, (cards[picked] && cards[picked]['background-color']) || solidBg(first));
        if (r == null) { cr.textContent = '?'; return; }
        cr.textContent = r.toFixed(2); cr.className = 'rkt-cr ' + (r >= 4.5 ? 'ok' : 'no');
      };
      paint(isClear(cur) ? 'transparent' : t.value);
      c.oninput = function () { t.value = c.value; set(c.value); paint(c.value); };
      t.onchange = function () {
        var v = /โปร่งใส|ใส|transparent|none/i.test(t.value) ? 'transparent' : t.value;
        set(v); try { c.value = hex(v === 'transparent' ? solidBg(first) : v); } catch (e) {}
        t.value = v === 'transparent' ? 'โปร่งใส' : v; paint(v);
      };
      d.appendChild(cr); d.appendChild(c); d.appendChild(t);
    } else if (kind === 'weight') {
      var num = parseInt(cur) || 400;
      var s = el('input'); s.type = 'range'; s.className = 'rkt-s'; s.min = 300; s.max = 900; s.step = 100; s.value = num;
      var v = el('span', 'rkt-v', String(num));
      s.oninput = function () { v.textContent = s.value; set(s.value); };
      d.appendChild(s); d.appendChild(v);
    } else {
      var num = parseFloat(cur) || 0;
      var s = el('input'); s.type = 'range'; s.className = 'rkt-s'; s.min = 0; s.max = kind === 'radius' ? 44 : 60; s.step = 0.5; s.value = num;
      var v = el('span', 'rkt-v', num + 'px');
      s.oninput = function () { v.textContent = s.value + 'px'; set(s.value + 'px'); };
      d.appendChild(s); d.appendChild(v);
    }
    return d;
  }

  /* ─────────── build แต่ละแท็บ ─────────── */
  function buildTone(bd) {
    bd.appendChild(el('div', 'rkt-gt', 'ฟอนต์ทั้งหน้า'));
    var fb = el('div', 'rkt-fb');
    FONTS.forEach(function (f) {
      var b = el('button', null, f[0]);
      b.onclick = function () { fontPick = f[1]; document.body.style.fontFamily = f[1]; };
      fb.appendChild(b);
    });
    bd.appendChild(fb);

    bd.appendChild(el('div', 'rkt-gt', 'ความแน่นโดยรวม'));
    var db = el('div', 'rkt-fb');
    [['แน่น',0.8], ['ปกติ',1], ['โปร่ง',1.25]].forEach(function (p) {
      var b = el('button', null, p[0]);
      b.onclick = function () {
        Object.keys(orig).forEach(function (n) {
          if (group(n, orig[n]) === 'ระยะห่าง') setToken(n, (parseFloat(orig[n]) * p[1]).toFixed(1) + 'px');
        });
        rebuild();
      };
      db.appendChild(b);
    });
    bd.appendChild(db);

    var gs = {};
    Object.keys(orig).forEach(function (n) { var g = group(n, orig[n]); if (g) (gs[g] = gs[g] || []).push(n); });
    ['สี','ตัวอักษร','ระยะห่าง','มุมโค้ง','ขนาดอื่น'].forEach(function (g) {
      if (!gs[g]) return;
      bd.appendChild(el('div', 'rkt-gt', g + ' (' + gs[g].length + ')'));
      gs[g].sort().forEach(function (n) { bd.appendChild(tokenRow(n, orig[n])); });
    });
  }

  function buildCard(bd) {
    var pick = el('button', 'rkt-b go', mode === 'pick' ? 'กำลังชี้… (กด Esc เพื่อออก)' : '🎯 ชี้แล้วปรับ');
    pick.onclick = function () {
      if (mode === 'pick') { stopMode(); rebuild(); return; }
      stopMode(); mode = 'pick'; document.body.classList.add('rkt-pickmode');
      rebuild();
      toast('เอาเมาส์ชี้ตรงไหนก็ได้ในหน้า แล้วคลิก');
    };
    bd.appendChild(pick);

    /* ทางลัดของที่ปรับบ่อยสุด ไม่ต้องชี้ก็กดได้เลย */
    bd.appendChild(el('div', 'rkt-gt', 'ทางลัด'));
    var quick = el('div', 'rkt-fb');
    [['พื้นหลังหน้า', document.body], ['ทั้งหน้า (html)', root]].forEach(function (q) {
      var b = el('button', null, q[0]);
      b.onclick = function () { picked = cardKey(q[1]); selEl = q[1]; stopMode(); rebuild(); };
      quick.appendChild(b);
    });
    bd.appendChild(quick);

    if (!picked || !selEl) {
      var h0 = el('div', 'rkt-hint');
      h0.innerHTML = 'กดปุ่มเขียวแล้วเอาเมาส์ชี้อะไรก็ได้ในหน้า ตัวที่ชี้จะขึ้นกรอบฟ้า คลิกแล้วปรับได้เลย ' +
        'ไม่ต้องไล่หาในรายการยาวๆ<br><b>พื้นหลัง</b> ชี้ที่ว่างๆ ในหน้าก็เลือกได้ หรือกดปุ่มทางลัดข้างบน<br><b>ปรับแล้วไม่เปลี่ยน?</b> กด ↓ ตัวข้างใน หรือ รวมตัวข้างในด้วย';
      bd.appendChild(h0);
      return;
    }

    var n = cardTargets(picked).length;
    var info = el('div', 'rkt-note');
    info.innerHTML = 'เลือกอยู่ <span class="rkt-tag">' + picked + '</span> · ' +
      'ปรับแล้วมีผลกับของชนิดเดียวกัน <b>' + n + ' ชิ้น</b> ในหน้านี้';
    bd.appendChild(info);

    /* ไล่ชั้น DOM — ชี้โดนตัวที่ห่ออยู่บ่อยมาก ปรับแล้วเลยดูเหมือนไม่มีอะไรเกิดขึ้น */
    var nav = el('div', 'rkt-fb');
    var up = el('button', null, '↑ ตัวแม่');
    up.title = 'ขึ้นไปตัวที่ห่ออยู่';
    up.onclick = function () {
      var p = selEl && selEl.parentElement;
      if (!p || p === root) return toast('บนสุดแล้ว');
      reselect(p);
    };
    var dn = el('button', null, '↓ ตัวข้างใน');
    dn.title = 'ลงไปตัวข้างในตัวแรก (ตัวที่มีตัวหนังสือจริง)';
    dn.onclick = function () {
      var k = selEl && selEl.firstElementChild;
      while (k && /^(script|style|link)$/i.test(k.tagName)) k = k.nextElementSibling;
      if (!k) return toast('ข้างในไม่มีอะไรแล้ว');
      reselect(k);
    };
    nav.appendChild(up); nav.appendChild(dn);
    bd.appendChild(nav);

    /* ข้างในมีตัวหนังสือที่ตั้งขนาด/สีเองอยู่กี่จุด — ตัวการที่ทำให้ "ปรับแล้วไม่เปลี่ยน" */
    var fixedKids = 0, myFs = '';
    try {
      myFs = getComputedStyle(selEl).fontSize;
      [].slice.call(selEl.querySelectorAll('*')).forEach(function (k) {
        var hasText = [].slice.call(k.childNodes).some(function (x) { return x.nodeType === 3 && x.textContent.trim(); });
        if (hasText && getComputedStyle(k).fontSize !== myFs) fixedKids++;
      });
    } catch (e) {}

    var deepOn = !!deepSel[picked];
    var dp = el('button', 'rkt-b' + (deepOn ? ' pri' : ''), (deepOn ? '✓ ' : '') + 'รวมตัวข้างในด้วย');
    dp.title = 'บังคับสี · ขนาด · ความหนาตัวอักษร ให้ของข้างในทุกชิ้นตามไปด้วย';
    dp.onclick = function () {
      if (deepSel[picked]) delete deepSel[picked]; else deepSel[picked] = 1;
      applyCards(); rebuild();
    };
    bd.appendChild(dp);
    if (fixedKids && !deepOn) {
      var wn = el('div', 'rkt-hint');
      wn.innerHTML = 'ข้างในมีตัวหนังสือที่ตั้งขนาดเองอยู่ <b>' + fixedKids + ' จุด</b> — ปรับตรงนี้มันจะไม่ขยับ ' +
        'กด <b>รวมตัวข้างในด้วย</b> ข้างบน หรือกด <b>↓ ตัวข้างใน</b> ลงไปปรับตัวจริง';
      bd.appendChild(wn);

    bd.appendChild(el('div', 'rkt-gt', 'ปรับเฉพาะชนิดนี้'));
    bd.appendChild(cardRow('สีพื้นหลัง', 'background-color', 'color'));
    bd.appendChild(cardRow('สีตัวหนังสือ', 'color', 'color'));
    bd.appendChild(cardRow('ขนาดตัวอักษร', 'font-size', 'px'));
    bd.appendChild(cardRow('ความหนาตัวอักษร', 'font-weight', 'weight'));
    bd.appendChild(cardRow('สีขอบ', 'border-color', 'color'));
    bd.appendChild(cardRow('ความหนาขอบ', 'border-width', 'px'));
    bd.appendChild(cardRow('มุมโค้ง', 'border-radius', 'radius'));
    bd.appendChild(cardRow('ระยะขอบใน', 'padding', 'px'));

    var bt = el('div', 'rkt-btns');
    var sh = el('button', 'rkt-b', 'เงา เปิด/ปิด');
    sh.onclick = function () {
      var c = cards[picked] = cards[picked] || {};
      c['box-shadow'] = c['box-shadow'] === 'none' ? '0 2px 6px rgba(15,23,42,.14)' : 'none';
      applyCards();
    };
    var cl = el('button', 'rkt-b warn', 'ล้างตรงนี้');
    cl.onclick = function () { delete cards[picked]; applyCards(); rebuild(); };
    bt.appendChild(sh); bt.appendChild(cl);
    bd.appendChild(bt);

    /* โทเคนที่จุดนี้กินอยู่ — แก้ตรงนี้เปลี่ยนทั้งแอป ไม่ใช่แค่ตรงที่ชี้ */
    var toks = tokensOf(selEl);
    bd.appendChild(el('div', 'rkt-gt', 'โทเคนที่ตรงนี้ใช้อยู่ (' + toks.length + ')'));
    if (!toks.length) {
      bd.appendChild(el('div', 'rkt-hint', 'ตรงนี้ไม่ได้ใช้ค่าจาก :root ตรงๆ (อาจ hardcode ไว้) ปรับด้วยช่องข้างบนแทนได้'));
    } else {
      bd.appendChild(el('div', 'rkt-hint', 'แก้ตรงนี้ = เปลี่ยนทั้งแอปทุกที่ที่ใช้โทเคนตัวนั้น ไม่ใช่แค่จุดที่ชี้'));
      toks.forEach(function (t) {
        var r = tokenRow(t.name, orig[t.name]);
        var lbl = r.querySelector('.rkt-n');
        if (lbl) { lbl.textContent = t.name + '  (' + t.role + ')'; lbl.title = t.name + ' — ' + t.role; }
        bd.appendChild(r);
      });
    }
  }

  function buildPos(bd) {
    var sw = el('button', 'rkt-b pri', 'สลับที่ 2 ใบ (แตะทีละใบ)');
    sw.onclick = function () {
      stopMode(); mode = 'swap'; document.body.classList.add('rkt-swapmode');
      toast('แตะใบแรก แล้วแตะใบที่จะสลับด้วย');
    };
    bd.appendChild(sw);
    bd.appendChild(el('div', 'rkt-note', 'สลับได้เฉพาะของที่อยู่ในกล่องเดียวกัน · ใช้กับการ์ดในลิสต์เดียวกันได้เลย'));

    if (!blocks.length) blocks = scanBlocks();
    bd.appendChild(el('div', 'rkt-gt', 'บล็อกใหญ่ (' + blocks.length + ')'));
    if (!blocks.length) {
      bd.appendChild(el('div', 'rkt-note', 'หน้านี้ยังไม่มี element ที่ติด data-tweak="ชื่อบล็อก" บอก Claude ให้ติดให้ก่อน'));
      return;
    }
    blocks.forEach(function (b, i) {
      var d = el('div', 'rkt-sec');
      d.appendChild(el('span', 'nm', (i+1) + '. ' + b.name));
      var up = el('button', 'rkt-mini', '↑'), dn = el('button', 'rkt-mini', '↓');
      var ey = el('button', 'rkt-mini' + (b.hidden ? ' off' : ''), '👁');
      up.onclick = function () { if (i > 0) { blocks.splice(i-1, 0, blocks.splice(i,1)[0]); applyBlocks(); rebuild(); } };
      dn.onclick = function () { if (i < blocks.length-1) { blocks.splice(i+1, 0, blocks.splice(i,1)[0]); applyBlocks(); rebuild(); } };
      ey.onclick = function () { b.hidden = !b.hidden; applyBlocks(); rebuild(); };
      d.appendChild(up); d.appendChild(dn); d.appendChild(ey);
      bd.appendChild(d);
    });
  }

  /* ─────────── แผง ─────────── */
  function rebuild() {
    if (!panel) return;
    var bd = panel.querySelector('.rkt-bd');
    bd.innerHTML = '';
    panel.querySelectorAll('.rkt-tb').forEach(function (b) {
      b.className = 'rkt-tb' + (b.dataset.t === tab ? ' on' : '');
    });
    if (tab === 'pick') buildCard(bd);
    else if (tab === 'tone') buildTone(bd);
    else buildPos(bd);
  }

  function open() {
    if (panel) { panel.style.display = 'flex'; return; }
    orig = readTokens();
    if (!Object.keys(orig).length) { toast('แอปนี้ยังไม่ได้ใช้ CSS variable ปรับไม่ได้'); return; }
    if (!document.getElementById('rk-tweak-style')) {
      var st = el('style'); st.id = 'rk-tweak-style'; st.textContent = CSS; document.head.appendChild(st);
    }

    panel = el('div', 'rkt d-' + dock);
    var hd = el('div', 'rkt-hd'); hd.appendChild(el('b', null, 'ปรับหน้าตา'));

    /* ย้ายกล่องไปมุมที่ไม่บังของที่กำลังดู */
    var dk = el('div', 'rkt-dk');
    [['left','◧','ชิดซ้าย'], ['right','◨','ชิดขวา'], ['bottom','▤','ด้านล่าง'],
     ['float','❐','ลอย'], ['min','—','ย่อ']].forEach(function (d) {
      var b = el('button', dock === d[0] ? 'on' : '', d[1]); b.title = d[2];
      b.onclick = function () {
        dock = d[0];
        panel.className = 'rkt d-' + dock;
        try { localStorage.setItem(DOCKKEY, dock); } catch (e) {}
        dk.querySelectorAll('button').forEach(function (q, i) {
          q.className = (['left','right','bottom','float','min'][i] === dock) ? 'on' : '';
        });
      };
      dk.appendChild(b);
    });
    hd.appendChild(dk);
    var x = el('button', 'rkt-x', '✕'); x.onclick = close; hd.appendChild(x);
    panel.appendChild(hd);

    var tabs = el('div', 'rkt-tabs');
    [['pick','ชี้แล้วปรับ'], ['tone','โทนรวม'], ['pos','ตำแหน่ง']].forEach(function (t) {
      var b = el('button', 'rkt-tb', t[1]); b.dataset.t = t[0];
      b.onclick = function () { stopMode(); tab = t[0]; rebuild(); };
      tabs.appendChild(b);
    });
    panel.appendChild(tabs);
    panel.appendChild(el('div', 'rkt-bd'));

    var ft = el('div', 'rkt-ft');
    var out = el('textarea'); out.className = 'rkt-out'; out.readOnly = true;
    out.placeholder = 'ปรับเสร็จแล้วกดปุ่มเขียวข้างบน ข้อความจะมาอยู่ตรงนี้';

    /* ปุ่มเดียวจบ: เขียนข้อตกลงลงตัวไฟล์ mockup เอง ไม่สร้างไฟล์ชื่อใหม่ */
    var b1 = el('button', 'rkt-b go', 'เสร็จแล้ว · เซฟลง mockup');
    b1.title = 'เขียนหน้าตาที่ปรับไว้ลงในไฟล์ mockup ตัวนี้เลย';
    b1.onclick = function () { saveLocal(true); saveSelf(out); };

    var help = el('div', 'rkt-note');
    help.innerHTML = 'กดปุ่มเขียว → เลือกทับไฟล์เดิม <b>' + selfName() + '</b> → กด Save<br>' +
      'แล้ว<b>พิมพ์บอก Claude ว่า "ปรับไว้แล้ว"</b> พอเลย ไม่ต้องก๊อปอะไร';
    var b2 = el('button', 'rkt-b', 'ดู CSS');
    b2.onclick = function () { out.value = cssText(); out.focus(); out.select(); };
    var b3 = el('button', 'rkt-b', 'คัดลอกแทน');
    b3.onclick = function () { copy(agreedBlockText(), out, 'คัดลอกแล้ว วางในแชท กด Ctrl+V'); };
    var b4 = el('button', 'rkt-b warn', 'ล้างทั้งหมด'); b4.onclick = resetAll;
    var bs = el('div', 'rkt-btns');
    [b2, b3, b4].forEach(function (b) { bs.appendChild(b); });
    ft.appendChild(b1); ft.appendChild(help); ft.appendChild(out); ft.appendChild(bs);
    panel.appendChild(ft);

    document.body.appendChild(panel);
    document.addEventListener('click', onPageClick, true);
    document.addEventListener('mouseover', onPageOver, true);
    rebuild();
  }
  function close() {
    stopMode();
    document.removeEventListener('click', onPageClick, true);
    document.removeEventListener('mouseover', onPageOver, true);
    if (panel) { panel.remove(); panel = null; }
  }

  W.RK.tweak = { open: open, close: close, css: cssText, agreed: agreedBlockText,
                 html: buildSelfHtml, save: function () { saveSelf(null); }, reset: resetAll };

  document.addEventListener('keydown', function (e) {
    if (e.ctrlKey && e.shiftKey && (e.key === 'T' || e.key === 't')) { e.preventDefault(); panel ? close() : open(); }
    if (e.key === 'Escape' && mode) { stopMode(); rebuild(); }
  });

  function boot() {
    orig = readTokens();
    blocks = scanBlocks();
    /* 1) ข้อตกลงที่ฝังไว้ในไฟล์ (ของจริงต้องสร้างตามนี้) */
    var tag = document.getElementById('rk-tweak-agreed');
    if (tag) { try { applyAgreement(JSON.parse(tag.textContent)); } catch (e) {} }
    /* 2) ของที่ยังลองอยู่ในเครื่องนี้ ทับข้อตกลงได้ */
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) applyAgreement(JSON.parse(raw));
    } catch (e) {}
    if (/[?&]tweak=1/.test(location.search)) open();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
