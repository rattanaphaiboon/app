<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Rattana Member</title>
  <desc>บัตรสมาชิกสีทองบนพื้นกรมท่า มีรูปสมาชิก ชื่อ และบาร์โค้ด พร้อมประกายดาว — ค้นหา/สแกนดูข้อมูลสมาชิก</desc>
  <defs>
    <linearGradient id="mb-bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#243b73"/>
      <stop offset="0.55" stop-color="#132651"/>
      <stop offset="1" stop-color="#0d1b3e"/>
    </linearGradient>
    <linearGradient id="mb-gold" gradientUnits="userSpaceOnUse" x1="96" y1="130" x2="330" y2="400">
      <stop offset="0" stop-color="#f0d27a"/>
      <stop offset="0.5" stop-color="#c9a84c"/>
      <stop offset="1" stop-color="#a07830"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#mb-bg)"/>

  <!-- บัตรสมาชิก เอียงเล็กน้อยให้ดูมีชีวิต -->
  <g transform="translate(256 262) rotate(-8) scale(1.06) translate(-256 -262)">
    <rect x="70" y="142" width="372" height="240" rx="34" fill="url(#mb-gold)"/>
    <!-- แสงสะท้อนมุมบนของบัตร -->
    <path d="M104 142h304a34 34 0 0 1 34 34v8H70v-8a34 34 0 0 1 34-34z" fill="#ffffff" opacity=".18"/>

    <!-- รูปสมาชิก -->
    <circle cx="152" cy="236" r="50" fill="#0d1b3e"/>
    <circle cx="152" cy="221" r="17" fill="#ffffff"/>
    <path d="M118 266c4-20 18-30 34-30s30 10 34 30z" fill="#ffffff"/>

    <!-- ชื่อ / ระดับสมาชิก -->
    <rect x="224" y="206" width="170" height="22" rx="11" fill="#0d1b3e"/>
    <rect x="224" y="244" width="112" height="18" rx="9" fill="#0d1b3e" opacity=".55"/>

    <!-- บาร์โค้ดบนบัตร -->
    <g fill="#0d1b3e">
      <rect x="110" y="310" width="12" height="44" rx="4"/>
      <rect x="132" y="310" width="6"  height="44" rx="3"/>
      <rect x="148" y="310" width="16" height="44" rx="4"/>
      <rect x="174" y="310" width="6"  height="44" rx="3"/>
      <rect x="190" y="310" width="10" height="44" rx="4"/>
      <rect x="210" y="310" width="16" height="44" rx="4"/>
      <rect x="236" y="310" width="6"  height="44" rx="3"/>
      <rect x="252" y="310" width="12" height="44" rx="4"/>
      <rect x="274" y="310" width="6"  height="44" rx="3"/>
      <rect x="290" y="310" width="16" height="44" rx="4"/>
      <rect x="316" y="310" width="8"  height="44" rx="3"/>
    </g>
    <!-- ตราดาวระดับสมาชิก -->
    <circle cx="384" cy="332" r="26" fill="#0d1b3e"/>
    <path d="M384 316l4.7 9.6 10.6 1.5-7.7 7.5 1.8 10.5-9.4-5-9.4 5 1.8-10.5-7.7-7.5 10.6-1.5z" fill="#e8c86a"/>
  </g>

  <!-- ประกายวิ้ง ๆ — คำใบ้ว่าข้างในเป็นอีกโลก -->
  <path d="M418 78c4 26 14 36 40 40-26 4-36 14-40 40-4-26-14-36-40-40 26-4 36-14 40-40z" fill="#ffffff"/>
  <path d="M96 392c3 17 9 23 26 26-17 3-23 9-26 26-3-17-9-23-26-26 17-3 23-9 26-26z" fill="#e8c86a"/>
  <circle cx="466" cy="190" r="7" fill="#e8c86a"/>
</svg>
