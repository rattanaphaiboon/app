<svg viewBox="0 0 1024 1024" width="1024" height="1024" xmlns="http://www.w3.org/2000/svg">
  <title>Rattana Receive</title>
  <defs>
    <clipPath id="clip"><rect x="0" y="0" width="1024" height="1024" rx="230" ry="230"/></clipPath>

    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#243b73"/>
      <stop offset="55%"  stop-color="#0d1b3e"/>
      <stop offset="100%" stop-color="#050a18"/>
    </linearGradient>
    <radialGradient id="spot" cx="0.5" cy="0.30" r="0.62">
      <stop offset="0%"   stop-color="#c9a84c" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#c9a84c" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="boxFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#eccf80"/>
      <stop offset="100%" stop-color="#b8942f"/>
    </linearGradient>
    <linearGradient id="flapL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#f6e2a4"/>
      <stop offset="100%" stop-color="#c8a449"/>
    </linearGradient>
    <linearGradient id="flapR" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#f6e2a4"/>
      <stop offset="100%" stop-color="#c8a449"/>
    </linearGradient>

    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#ff3b24" stop-opacity="0"/>
      <stop offset="15%"  stop-color="#ff3b24" stop-opacity="1"/>
      <stop offset="85%"  stop-color="#ff3b24" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ff3b24" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-500%" width="220%" height="1100%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <rect width="1024" height="1024" fill="url(#spot)"/>
    <rect x="60" y="60" width="904" height="904" rx="190" ry="190"
          fill="none" stroke="#fff" stroke-width="2" opacity="0.07"/>

    <ellipse cx="512" cy="872" rx="300" ry="44" fill="#000" opacity="0.34"/>

    <g transform="translate(512 516) rotate(-5)">

      <g transform="translate(16 20)" opacity="0.36">
        <path d="M -232 -22 L 232 -22 L 232 296 Q 232 316 212 316 L -212 316 Q -232 316 -232 296 Z" fill="#000"/>
        <path d="M -232 -22 L 0 -22 L -50 -186 L -272 -146 Z" fill="#000"/>
        <path d="M  232 -22 L 0 -22 L  50 -186 L  272 -146 Z" fill="#000"/>
      </g>

      <!-- ด้านในลังที่เห็นผ่านปากกล่อง -->
      <path d="M -206 -22 L 206 -22 L 158 -96 L -158 -96 Z" fill="#241a06"/>

      <!-- ฝากล่องเปิดออก -->
      <path d="M -232 -22 L 0 -22 L -50 -186 L -272 -146 Z" fill="url(#flapL)"/>
      <path d="M  232 -22 L 0 -22 L  50 -186 L  272 -146 Z" fill="url(#flapR)"/>
      <path d="M -232 -22 L 0 -22 L -50 -186 L -272 -146 Z" fill="#000" opacity="0.13"/>

      <!-- ตัวลัง -->
      <path d="M -232 -22 L 232 -22 L 232 296 Q 232 316 212 316 L -212 316 Q -232 316 -232 296 Z"
            fill="url(#boxFront)"/>
      <path d="M -232 -22 L 232 -22 L 232 296 Q 232 316 212 316 L -212 316 Q -232 316 -232 296 Z"
            fill="none" stroke="#6f5717" stroke-width="7" opacity="0.55"/>

      <!-- ป้ายบาร์โค้ด เส้นหนา อ่านออกตอนย่อเล็ก -->
      <rect x="-160" y="46" width="320" height="188" rx="16" fill="#fffaec"/>
      <rect x="-160" y="46" width="320" height="188" rx="16" fill="none" stroke="#6f5717" stroke-width="5" opacity="0.5"/>
      <g fill="#0d1b3e">
        <rect x="-128" y="76" width="26" height="128" rx="3"/>
        <rect x="-88"  y="76" width="14" height="128" rx="3"/>
        <rect x="-58"  y="76" width="30" height="128" rx="3"/>
        <rect x="-12"  y="76" width="15" height="128" rx="3"/>
        <rect x="19"   y="76" width="28" height="128" rx="3"/>
        <rect x="63"   y="76" width="14" height="128" rx="3"/>
        <rect x="93"   y="76" width="26" height="128" rx="3"/>
      </g>

      <!-- ลำแสงสแกน -->
      <g filter="url(#glow)">
        <rect x="-268" y="130" width="536" height="20" rx="10" fill="url(#beam)"/>
      </g>
      <rect x="-268" y="134" width="536" height="12" rx="6" fill="url(#beam)"/>

      <!-- ติ๊กถูก = ตรวจรับแล้ว -->
      <g transform="translate(196 274)">
        <circle r="104" fill="#0d1b3e"/>
        <circle r="104" fill="none" stroke="#f0d894" stroke-width="14"/>
        <path d="M -46 4 L -14 38 L 48 -34" fill="none" stroke="#f0d894"
              stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>
  </g>
</svg>
