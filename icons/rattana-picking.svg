<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Rattana Picking</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#243b73"/>
      <stop offset="0.55" stop-color="#132651"/>
      <stop offset="1" stop-color="#0d1b3e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1dca0"/>
      <stop offset="1" stop-color="#c9a84c"/>
    </linearGradient>
    <linearGradient id="flap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7e8bd"/>
      <stop offset="1" stop-color="#e2c77a"/>
    </linearGradient>
    <linearGradient id="inside" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a6d24"/>
      <stop offset="1" stop-color="#a8862f"/>
    </linearGradient>
  </defs>

  <!-- พื้น -->
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect x="10" y="10" width="492" height="492" rx="108" fill="none" stroke="#c9a84c" stroke-opacity=".32" stroke-width="4"/>

  <!-- กล่อง (เปิดฝา) -->
  <path d="M128 236 H384 L364 214 H148 Z" fill="url(#inside)"/>
  <path d="M128 236 L96 184 L220 172 L256 214 Z" fill="url(#flap)"/>
  <path d="M384 236 L416 184 L292 172 L256 214 Z" fill="url(#flap)"/>
  <rect x="128" y="236" width="256" height="182" rx="20" fill="url(#gold)"/>
  <rect x="128" y="236" width="256" height="14" fill="#0d1b3e" fill-opacity=".14"/>

  <!-- บาร์โค้ดข้างกล่อง -->
  <g fill="#0d1b3e" fill-opacity=".78">
    <rect x="164" y="314" width="10" height="70" rx="2"/>
    <rect x="182" y="314" width="5"  height="70" rx="1.5"/>
    <rect x="195" y="314" width="10" height="70" rx="2"/>
    <rect x="213" y="314" width="5"  height="70" rx="1.5"/>
    <rect x="226" y="314" width="14" height="70" rx="2"/>
    <rect x="248" y="314" width="5"  height="70" rx="1.5"/>
    <rect x="261" y="314" width="10" height="70" rx="2"/>
  </g>

  <!-- ป้ายถูก = หยิบครบ -->
  <circle cx="350" cy="148" r="72" fill="#0d1b3e"/>
  <circle cx="350" cy="148" r="60" fill="#ffffff"/>
  <path d="M320 150 L342 172 L382 128" fill="none" stroke="#1f9d55" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
