<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Rattana Picking</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#243b73"/>
      <stop offset="0.55" stop-color="#132651"/>
      <stop offset="1" stop-color="#0d1b3e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1dca0"/>
      <stop offset="1" stop-color="#c9a84c"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dde3f0"/>
    </linearGradient>
    <clipPath id="tile"><rect width="512" height="512" rx="116"/></clipPath>
  </defs>

  <!-- พื้น -->
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>

  <g clip-path="url(#tile)">
    <!-- เงาใต้กล่อง -->
    <ellipse cx="312" cy="300" rx="104" ry="10" fill="#000" fill-opacity=".22"/>

    <!-- กล่อง วางบนฝ่ามือ -->
    <g transform="rotate(-4 304 206)">
      <rect x="206" y="116" width="196" height="176" rx="18" fill="url(#gold)"/>
      <rect x="284" y="116" width="40" height="66" fill="#0d1b3e" fill-opacity=".22"/>
      <g fill="#0d1b3e" fill-opacity=".75">
        <rect x="334" y="222" width="8" height="44" rx="1.5"/>
        <rect x="347" y="222" width="4" height="44" rx="1"/>
        <rect x="356" y="222" width="8" height="44" rx="1.5"/>
        <rect x="369" y="222" width="4" height="44" rx="1"/>
        <rect x="378" y="222" width="8" height="44" rx="1.5"/>
      </g>
    </g>

    <!-- แขนเสื้อ + ข้อมือ -->
    <path d="M-40 440 L44 356 L120 432 L36 516 Z" fill="#2a4380"/>
    <path d="M44 356 L64 336 L140 412 L120 432 Z" fill="#c9a84c"/>

    <!-- ฝ่ามือ -->
    <path d="M60 340 C96 312 140 296 196 294 L310 292 L310 374 C284 392 252 404 212 410 L146 420 C120 422 100 410 84 392 Z" fill="url(#skin)"/>
    <!-- นิ้ว 4 นิ้ว (หงาย ชี้ขวา) -->
    <rect x="250" y="288" width="196" height="24" rx="12" fill="url(#skin)"/>
    <rect x="250" y="314" width="184" height="24" rx="12" fill="url(#skin)"/>
    <rect x="250" y="340" width="166" height="24" rx="12" fill="url(#skin)"/>
    <rect x="250" y="366" width="138" height="22" rx="11" fill="url(#skin)"/>
    <g fill="none" stroke="#b3bdd6" stroke-width="3" stroke-linecap="round">
      <path d="M318 313 H428"/>
      <path d="M318 339 H414"/>
      <path d="M318 365 H392"/>
    </g>
    <!-- นิ้วโป้งจับข้างกล่อง -->
    <path d="M186 300 C176 274 180 246 200 236 C218 228 236 238 238 258 L242 294 Z" fill="url(#skin)"/>
    <path d="M186 300 C176 274 180 246 200 236" fill="none" stroke="#b3bdd6" stroke-width="3" stroke-linecap="round"/>
  </g>

  <rect x="10" y="10" width="492" height="492" rx="108" fill="none" stroke="#c9a84c" stroke-opacity=".32" stroke-width="4"/>
</svg>
