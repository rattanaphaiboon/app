<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Rattana Location</title>
  <desc>หมุดพิกัดที่ข้างในเป็นบาร์โค้ด — ยิงบาร์โค้ด แล้วปักพิกัด</desc>
  <defs>
    <linearGradient id="loc-bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#243b73"/>
      <stop offset="0.55" stop-color="#132651"/>
      <stop offset="1" stop-color="#0d1b3e"/>
    </linearGradient>
    <!-- userSpaceOnUse เพื่อให้หัวหมุดกับหางใช้เฉดเดียวกันทั้งชิ้น ไม่เห็นรอยต่อ -->
    <linearGradient id="loc-gold" gradientUnits="userSpaceOnUse" x1="104" y1="48" x2="210" y2="480">
      <stop offset="0" stop-color="#e8c86a"/>
      <stop offset="0.55" stop-color="#c9a84c"/>
      <stop offset="1" stop-color="#a07830"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#loc-bg)"/>

  <!-- หมุด : หัวกลม + หางแหลม (เรขาคณิตเดียวกับในแอพ ขยายจากกรอบ 64 เป็น 512) -->
  <g fill="url(#loc-gold)">
    <circle cx="256" cy="200" r="152"/>
    <path d="M256 480 155 293h202z"/>
  </g>

  <!-- แท่งบาร์โค้ดเจาะในหัวหมุด ใช้สีพื้นเพื่อให้อ่านออกทุกขนาด -->
  <g fill="#0d1b3e">
    <rect x="187" y="128" width="19" height="144" rx="6"/>
    <rect x="216" y="128" width="10" height="144" rx="5"/>
    <rect x="235" y="128" width="24" height="144" rx="6"/>
    <rect x="269" y="128" width="10" height="144" rx="5"/>
    <rect x="288" y="128" width="16" height="144" rx="6"/>
    <rect x="314" y="128" width="11" height="144" rx="5"/>
  </g>
</svg>
