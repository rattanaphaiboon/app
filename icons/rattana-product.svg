<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Rattana Product">
  <title>Rattana Product</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#243b73"/>
      <stop offset="0.55" stop-color="#132651"/>
      <stop offset="1" stop-color="#0d1b3e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1dca0"/>
      <stop offset="1" stop-color="#c9a84c"/>
    </linearGradient>
    <linearGradient id="goldHandle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e2c474"/>
      <stop offset="1" stop-color="#9c7a33"/>
    </linearGradient>
    <radialGradient id="glass" cx="0.38" cy="0.32" r="0.78">
      <stop offset="0" stop-color="#fffdf6"/>
      <stop offset="1" stop-color="#f0e4c6"/>
    </radialGradient>
    <!-- บาร์โค้ดถูกตัดให้อยู่ในวงเลนส์ จึงสั้นยาวไม่เท่ากันเหมือนมองผ่านแว่นจริง -->
    <clipPath id="lens">
      <circle cx="222" cy="222" r="120"/>
    </clipPath>
  </defs>

  <!-- พื้นหลัง + ขอบทองบาง ๆ ตามมาตรฐานไอคอน Rattana -->
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect x="10" y="10" width="492" height="492" rx="108" fill="none"
        stroke="#c9a84c" stroke-opacity=".32" stroke-width="4"/>

  <!-- ด้ามจับ วาดก่อนเลนส์เพื่อให้โคนด้ามถูกเลนส์ทับ -->
  <line x1="316" y1="316" x2="424" y2="424" stroke="url(#goldHandle)"
        stroke-width="54" stroke-linecap="round"/>

  <!-- ขอบเลนส์ -->
  <circle cx="222" cy="222" r="150" fill="url(#gold)"/>
  <!-- กระจกเลนส์ -->
  <circle cx="222" cy="222" r="120" fill="url(#glass)"/>

  <!-- บาร์โค้ดในเลนส์ — แท่งน้อยและหนา เพราะที่ 48px (ขนาดการ์ดใน Hub)
       แท่งบางจะเบลอรวมกันเป็นสีเทาจนอ่านไม่ออกว่าเป็นบาร์โค้ด -->
  <g clip-path="url(#lens)" fill="#0d1b3e">
    <rect x="146" y="96" width="34" height="252" rx="6"/>
    <rect x="194" y="96" width="18" height="252" rx="5"/>
    <rect x="226" y="96" width="38" height="252" rx="6"/>
    <rect x="278" y="96" width="22" height="252" rx="5"/>
  </g>

  <!-- ประกายบนกระจก เบาไว้ไม่ให้กวนตอนย่อเล็ก -->
  <path d="M154 188 A120 120 0 0 1 226 114" fill="none" stroke="#ffffff"
        stroke-opacity=".42" stroke-width="13" stroke-linecap="round"/>
</svg>
