<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Rattana ClearStock</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#243b73"/>
      <stop offset="0.55" stop-color="#132651"/>
      <stop offset="1" stop-color="#0d1b3e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1dca0"/>
      <stop offset="1" stop-color="#c9a84c"/>
    </linearGradient>
  </defs>

  <!-- พื้น -->
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect x="10" y="10" width="492" height="492" rx="108" fill="none" stroke="#c9a84c" stroke-opacity=".32" stroke-width="4"/>

  <!-- บาร์โค้ด (ยิงบาร์) -->
  <g fill="url(#gold)">
    <rect x="118"   y="96" width="29"   height="168" rx="4"/>
    <rect x="161.5" y="96" width="14.5" height="168" rx="3"/>
    <rect x="190.5" y="96" width="29"   height="168" rx="4"/>
    <rect x="234"   y="96" width="14.5" height="168" rx="3"/>
    <rect x="277.5" y="96" width="29"   height="168" rx="4"/>
    <rect x="321"   y="96" width="14.5" height="168" rx="3"/>
    <rect x="350"   y="96" width="43.5" height="168" rx="4"/>
  </g>

  <!-- ลูกศรสองทาง W4 ⇄ C4 -->
  <g fill="none" stroke-width="24" stroke-linecap="round" stroke-linejoin="round">
    <path d="M140 334 H366 M330 298 L366 334 L330 370" stroke="#ffffff"/>
    <path d="M372 414 H146 M182 378 L146 414 L182 450" stroke="url(#gold)"/>
  </g>
</svg>
