<svg viewBox="0 0 1024 1024" width="1024" height="1024" xmlns="http://www.w3.org/2000/svg">
  <title>Rattana ร้านใกล้ฉัน</title>
  <defs>
    <clipPath id="clip"><rect width="1024" height="1024" rx="230" ry="230"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#243b73"/>
      <stop offset="55%" stop-color="#0d1b3e"/>
      <stop offset="100%" stop-color="#050a18"/>
    </linearGradient>
    <radialGradient id="spot" cx="0.5" cy="0.62" r="0.55">
      <stop offset="0%" stop-color="#c9a84c" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#c9a84c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f3dc92"/>
      <stop offset="55%" stop-color="#d9b85c"/>
      <stop offset="100%" stop-color="#b08d34"/>
    </linearGradient>
    <linearGradient id="goldEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f3dc92"/>
      <stop offset="100%" stop-color="#9c7a2a"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <rect width="1024" height="1024" fill="url(#spot)"/>

    <!-- วงเรดาร์รอบตำแหน่งเรา -->
    <g fill="none" stroke="#c9a84c">
      <ellipse cx="512" cy="800" rx="150" ry="44" stroke-width="10" stroke-opacity="0.75"/>
      <ellipse cx="512" cy="800" rx="270" ry="80" stroke-width="7" stroke-opacity="0.40"/>
      <ellipse cx="512" cy="800" rx="390" ry="116" stroke-width="5" stroke-opacity="0.18"/>
    </g>

    <!-- ร้านรอบ ๆ (จุดเล็ก) -->
    <g fill="#c9a84c">
      <circle cx="232" cy="742" r="16" fill-opacity="0.9"/>
      <circle cx="806" cy="760" r="16" fill-opacity="0.9"/>
      <circle cx="170" cy="846" r="11" fill-opacity="0.55"/>
      <circle cx="870" cy="862" r="11" fill-opacity="0.55"/>
      <circle cx="356" cy="884" r="13" fill-opacity="0.7"/>
    </g>

    <!-- หมุดตำแหน่ง -->
    <g filter="url(#shadow)">
      <path d="M512 800 C 452 700, 262 552, 262 392 C 262 254, 374 142, 512 142 C 650 142, 762 254, 762 392 C 762 552, 572 700, 512 800 Z"
            fill="url(#gold)" stroke="url(#goldEdge)" stroke-width="6"/>
    </g>
    <circle cx="512" cy="392" r="178" fill="#0d1b3e"/>
    <circle cx="512" cy="392" r="178" fill="none" stroke="#f3dc92" stroke-opacity="0.35" stroke-width="4"/>

    <!-- ร้านค้าในหมุด -->
    <g transform="translate(512,400)">
      <!-- กันสาดลายทาง -->
      <path d="M-118 -78 L118 -78 L134 -22 L-134 -22 Z" fill="url(#gold)"/>
      <g fill="#0d1b3e" fill-opacity="0.9">
        <path d="M-72 -78 L-52 -78 L-56 -22 L-80 -22 Z"/>
        <path d="M-10 -78 L10 -78 L10 -22 L-10 -22 Z"/>
        <path d="M52 -78 L72 -78 L80 -22 L56 -22 Z"/>
      </g>
      <path d="M-134 -22 Q-111 6 -89 -22 Q-67 6 -45 -22 Q-22 6 0 -22 Q22 6 45 -22 Q67 6 89 -22 Q111 6 134 -22 Z" fill="url(#gold)"/>
      <!-- ตัวร้าน -->
      <rect x="-104" y="-4" width="208" height="108" rx="6" fill="none" stroke="url(#gold)" stroke-width="14"/>
      <rect x="-26" y="30" width="52" height="74" rx="4" fill="url(#gold)"/>
      <rect x="-82" y="22" width="40" height="36" rx="4" fill="url(#gold)" fill-opacity="0.85"/>
      <rect x="42" y="22" width="40" height="36" rx="4" fill="url(#gold)" fill-opacity="0.85"/>
      <path d="M-122 104 L122 104" stroke="url(#gold)" stroke-width="14" stroke-linecap="round"/>
    </g>

    <!-- จุดเรา (ฐานหมุด) -->
    <circle cx="512" cy="800" r="26" fill="#f3dc92"/>
    <circle cx="512" cy="800" r="12" fill="#0d1b3e"/>
  </g>

  <rect x="6" y="6" width="1012" height="1012" rx="226" ry="226" fill="none" stroke="#c9a84c" stroke-opacity="0.55" stroke-width="10"/>
</svg>
