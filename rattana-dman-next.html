<link rel="apple-touch-icon" href="d-man-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://rattanaphaiboon.github.io/app/rattana-ui/rattana-ui.css">
<script src="https://rattanaphaiboon.github.io/app/rattana-ui/rattana-ui.js" defer></script>
<style>
/* D-MAN ใหม่ — ตัวอย่าง (mockup) v0.2
   หน้าตา: Rattana CI (rt-*) · ส่วนนี้มีเฉพาะการจัดวางของแอป (dm-*)
   ข้อมูลทั้งหมดเป็นข้อมูลตัวอย่าง เก็บในเครื่องนี้เท่านั้น ไม่ส่งไปไหน */
:root{--font-sans:"Anuphan","IBM Plex Sans Thai","Noto Sans Thai",sans-serif}
.dm-wrap{max-width:560px;margin:0 auto;padding-top:calc(10px + env(safe-area-inset-top))}
.dm-stack{display:flex;flex-direction:column;gap:14px;margin-top:14px}
.dm-card{padding:16px}
.dm-row{display:flex;align-items:center;gap:10px}
.dm-between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.dm-grow{flex:1 1 0;min-width:0}
.dm-wrapline{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.dm-h{font-size:16px;font-weight:700;color:var(--ink);margin:0}
.dm-sub{font-size:13px;color:var(--text-muted)}
.dm-amt{font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.dm-big{font-size:34px;line-height:1.1;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.dm-emo{font-size:22px;line-height:1}
.dm-topname{min-width:0;line-height:1.15}
.dm-topname b{display:block;font-size:17px;letter-spacing:.05em;color:var(--ink);white-space:nowrap}
.dm-topname small{display:block;font-size:11px;font-weight:500;color:var(--text-subtle);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dm-logo{width:38px;height:38px;border-radius:12px;flex:none}
.rt-topbar.dm-top{flex-wrap:nowrap;padding:8px 10px 8px 12px;gap:10px}
.dm-sync{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 10px;flex:none;border-radius:999px;border:1px solid var(--border);background:var(--field);font:inherit;font-size:12px;font-weight:600;color:var(--ink);cursor:pointer;white-space:nowrap}
.dm-dot{width:9px;height:9px;border-radius:50%;background:var(--approve-mark);flex:none}
.dm-sync[data-s="busy"] .dm-dot{background:var(--warning);animation:dmPulse .9s ease-in-out infinite}
.dm-sync[data-s="off"] .dm-dot{background:var(--reject)}
@keyframes dmPulse{50%{transform:scale(1.6);opacity:.45}}
.dm-me{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 10px 0 4px;flex:none;border-radius:999px;border:1px solid var(--border);background:var(--field);font:inherit;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer;white-space:nowrap}
.dm-me i{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:700;color:var(--on-gold);background:linear-gradient(180deg,#ffd35a,var(--gold))}
/* แผงงานวันนี้ */
.dm-hero{padding:18px}
.dm-hero h2{margin:2px 0 0;font-size:21px;font-weight:700;color:#fff;letter-spacing:.01em}
.dm-hero .k{font-size:12px;opacity:.78}
.dm-hero-nums{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.dm-hero-nums b{display:block;font-size:25px;line-height:1.15;font-variant-numeric:tabular-nums}
.dm-hero .rt-progress{margin-top:14px;background:rgba(255,255,255,.18)}
.dm-pill{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:600;background:rgba(255,255,255,.14);color:#fff;white-space:nowrap}
/* ร้านถัดไป */
.dm-next .dm-shop{font-size:20px;font-weight:700;color:var(--ink);line-height:1.25}
.dm-btnrow{display:grid;grid-template-columns:1fr 1fr 1.6fr;gap:8px;margin-top:14px}
.dm-btnrow .rt-btn{min-width:0;padding:0 8px}
/* รายการบิล */
.dm-step{width:28px;height:28px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;background:var(--hover);color:var(--ink)}
.dm-step.done{background:var(--approve-soft);color:var(--approve-text)}
.dm-bill{display:flex;align-items:center;gap:10px;width:100%;margin-top:8px;padding:12px;border-radius:16px;border:1px solid var(--line);background:var(--field);font:inherit;color:inherit;text-align:left;cursor:pointer}
.dm-bill:active{transform:scale(.99)}
.dm-bill .doc{font-weight:600;color:var(--ink);font-size:14px}
.dm-bill[data-st="done"]{background:var(--approve-soft);border-color:transparent}
.dm-bill[data-st="fail"]{background:var(--reject-soft);border-color:transparent}
.dm-chev{color:var(--text-subtle);font-size:20px;flex:none}
/* ฟอร์มบิล */
.dm-pay{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.dm-pay button{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;height:84px;border-radius:18px;border:1.5px solid var(--border);background:var(--field);font:inherit;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer;transition:transform .12s,background .15s,border-color .15s}
.dm-pay button span{font-size:30px;line-height:1}
.dm-pay button:active{transform:scale(.96)}
.dm-pay button[aria-pressed="true"]{border-color:var(--gold);background:var(--gold-soft);box-shadow:var(--shadow-gold)}
.dm-pay button[aria-pressed="true"]::after{content:"✓";position:absolute;top:6px;right:8px;width:20px;height:20px;border-radius:50%;background:var(--gold);color:var(--on-gold);font-size:12px;line-height:20px;text-align:center;font-weight:700}
.dm-line{display:flex;align-items:center;gap:10px;margin-top:10px}
.dm-line label{width:92px;flex:none;font-size:14px;font-weight:600;color:var(--ink)}
.dm-line .rt-input{flex:1 1 0;min-width:0;text-align:right;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.dm-thumb{width:56px;height:56px;border-radius:12px;object-fit:cover;border:1px solid var(--border)}
.dm-savebar{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-radius:24px 24px 0 0;box-shadow:0 -10px 30px -12px rgba(1,30,62,.25)}
.dm-savebar-in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px}
.dm-savebar .rt-btn{min-width:0}
.dm-pad-save{padding-bottom:calc(110px + env(safe-area-inset-bottom))}
.dm-ok{color:var(--approve-text)} .dm-bad{color:var(--reject-text)} .dm-warn{color:var(--warning-text)}
.dm-note{padding:12px 14px;border-radius:16px;font-size:13px;line-height:1.5}
.dm-note.info{background:var(--info-soft);color:var(--info-text)}
.dm-note.warn{background:var(--warning-soft);color:var(--warning-text)}
.dm-note.ok{background:var(--approve-soft);color:var(--approve-text)}
.dm-note.bad{background:var(--reject-soft);color:var(--reject-text)}
.dm-kv{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.dm-kv:last-child{border-bottom:0}
.dm-kv b{font-variant-numeric:tabular-nums;color:var(--ink)}
.dm-menu{display:flex;align-items:center;gap:12px;width:100%;padding:12px;border:0;border-radius:16px;background:var(--hover);font:inherit;color:inherit;text-align:left;cursor:pointer;margin-top:8px}
.dm-quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.dm-quick button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:18px;border:1px solid var(--line);background:var(--surface);font:inherit;font-size:12px;font-weight:600;color:var(--ink);cursor:pointer;line-height:1.25;text-align:center}
.dm-quick button span{font-size:26px;line-height:1}
.dm-cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.dm-cmp > div{padding:10px 12px;border-radius:14px;font-size:13px;line-height:1.45}
.dm-cmp .old{background:var(--hover);color:var(--text-muted)}
.dm-cmp .new{background:var(--approve-soft);color:var(--approve-text);font-weight:600}
.rt-bottom-nav.dm-nav{max-width:536px;margin:0 auto}
.rt-bottom-nav.dm-nav a{width:74px;font-size:11px}
.dm-acts{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px;margin-top:12px}
.dm-acts .rt-btn{min-width:0;padding:0 6px}
.dm-pay button{height:78px;font-size:11.5px;border-radius:16px;padding:0 2px;line-height:1.2}
.dm-pay button span{font-size:26px}
.dm-blk{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.dm-blk > b{display:block;font-size:14px;color:var(--ink)}
.dm-g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.dm-g3 label{display:block;margin-bottom:4px;font-size:12px;font-weight:600;color:var(--text-muted)}
.dm-num{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.dm-check{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--hover);margin-top:8px;font-size:14px;cursor:pointer}
.dm-check input{width:20px;height:20px;flex:none}
.dm-f{margin-top:12px}
[hidden]{display:none!important}
</style>
</head>
<body class="rt-app">
<div class="rt-bg"><div class="rt-bg-arc"></div><div class="rt-bg-arc"></div></div>

<main class="rt-container dm-wrap" id="main">
  <header class="rt-glass rt-topbar rt-sticky-top dm-top">
    <img class="dm-logo" src="d-man-icon.png" alt="" onerror="this.hidden=true">
    <div class="dm-topname dm-grow"><b>D-MAN</b><small>ตัวอย่าง v0.2</small></div>
    <button class="dm-sync" id="syncChip" type="button" data-act="sync-info" data-s="ok"><span class="dm-dot"></span><span id="syncTxt">ข้อมูลครบ</span></button>
    <button class="dm-me" type="button" data-act="who"><i id="meIni">ช</i><span id="meTxt">ชาย</span></button>
  </header>
  <div id="view"></div>
</main>

<nav class="rt-glass rt-bottom-nav dm-nav" id="nav" aria-label="เมนูหลัก"></nav>

<script>
(function(){
'use strict';
var KEY='dman_next_mock_v1'+((/[?&]k=([a-z0-9]+)/.exec(location.search)||[])[1]||'');   /* ?k=xx = ชุดข้อมูลแยก ไว้ทดสอบ */
var $=function(s){return document.querySelector(s)};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function money(n){return '฿'+(Math.round((+n||0)*100)/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}
function num(v){var n=parseFloat(String(v==null?'':v).replace(/,/g,''));return isFinite(n)?n:0}
function plain(n){n=Math.round((+n||0)*100)/100;return n?String(n):''}
function RU(){return window.RattanaUI}
function toast(m,type){try{RU().toast(m,{type:type||'success',duration:type==='error'?4000:1800})}catch(e){}}
function buzz(k){try{RU().haptic(k||'light')}catch(e){}}
function hhmm(ts){var d=new Date(ts);return ('0'+d.getHours()).slice(-2)+'.'+('0'+d.getMinutes()).slice(-2)}
function today(){try{return RU().formatDate(new Date(),'long')}catch(e){var d=new Date();return d.getDate()+'/'+(d.getMonth()+1)+'/'+(d.getFullYear()+543)}}

/* ---------- ข้อมูลตัวอย่าง ---------- */
function bill(doc,amount){return{doc:doc,amount:amount,status:'pending'}}
function seed(){return{
  v:2, role:'driver', offline:false, view:'home', arg:null, filter:'all', queue:[], draft:null,
  user:{name:'สมชาย ใจดี',nick:'ชาย',wh:'W1'},
  lastTeam:{plate:'บล-1693',pattern:'ปกติ',helpers:['วิทยา (เอก)']},
  tickets:[
    {id:'TSW16911/00051',wh:'W1',route:'สายอัมพวา – บางคนที',status:'available',shops:[
      {name:'ร้านเจริญพาณิชย์',area:'ต.อัมพวา',km:2.4,lat:13.4257,lng:99.9553,bills:[bill('DSI16911/00301',12880),bill('DSI16911/00302',3215)]},
      {name:'ร้านไทยวิวัฒน์',area:'ต.สวนหลวง',km:5.1,lat:13.4102,lng:99.9471,cns:[{no:'ISK6911/195',amt:320,note:'รับคืนสินค้าชำรุด'}],bills:[bill('DSI16911/00303',5640)]},
      {name:'มินิมาร์ทบ้านสวน',area:'ต.บางคนที',km:9.8,lat:13.4638,lng:99.9442,bills:[{doc:'DSI16911/00304',amount:8450.5,status:'pending',promo:true},bill('DSI16911/00305',1290)]},
      {name:'ร้านป้าศรี',area:'ต.กระดังงา',km:12.3,lat:13.4801,lng:99.9567,bills:[bill('DSI16911/00306',23479)]}
    ]},
    {id:'TSW16911/00052',wh:'W1',route:'สายแม่กลอง – บางแก้ว',status:'available',shops:[
      {name:'ร้านสมใจการค้า',area:'ต.แม่กลอง',km:1.2,lat:13.4098,lng:100.0023,bills:[bill('DSI16911/00311',4320)]},
      {name:'ร้านโชคดีมินิมาร์ท',area:'ต.บางแก้ว',km:6.7,lat:13.3712,lng:100.0234,bills:[bill('DSI16911/00312',9150),bill('DSI16911/00313',2780)]}
    ]}
  ],
  /* งานของคนอื่นที่รออนุมัติ (ให้หัวหน้าลองกด) */
  others:[
    {id:'TSW16911/00047',driver:'อาทิตย์ (ซัน)',plate:'ผก-4410',bills:7,collected:38420,target:38420,short:0,fail:0,at:'11.42'},
    {id:'TSW16911/00049',driver:'ณัฐพล (ปาร์ค)',plate:'บห-2208',bills:5,collected:27907.83,target:32309.27,short:1,fail:0,at:'13.14'}
  ]
}}
var S;
try{S=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){S=null}
if(!S||S.v!==2)S=seed();
if(!S.mode)S.mode='sample';if(!S.bank)S.bank={};if(!S.real)S.real={jobs:[],at:0,viewAs:'',err:''};if(S.me===undefined)S.me=null;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

/* ---------- ข้อมูลจริง: อ่านอย่างเดียวจากสำเนาที่แอปเดิมใช้อยู่ · ไม่มีการเขียนกลับ ---------- */
var SB={url:'https://uytzsuwapwkqkougorvb.supabase.co/rest/v1',key:'sb_publishable_2iDqojkyM2pqJxQJfvnxyg_Y6WMQ6Q8'};
var LOCAL=/^(localhost|127\.0\.0\.1)$/.test(location.hostname);   /* ในเครื่องผู้พัฒนา: ข้ามล็อกอิน Google (ใช้ไม่ได้บน localhost) */
var REAL_DAYS=3,realLoading=false;
var JOB_SEL='job_id,driver,warehouse,received_at,plate:row_json->>ทะเบียน,shops:row_json->>ร้านค้า,pattern:row_json->>การส่ง,closed:row_json->>วันเวลาปิดงาน,approved:row_json->>วันเวลาอนุมัติ,rejwhy:row_json->>เหตุผลตีกลับ,h1:row_json->>ผู้ช่วย1,h2:row_json->>ผู้ช่วย2,h3:row_json->>ผู้ช่วย3,h4:row_json->>ผู้ช่วย4,h5:row_json->>ผู้ช่วย5,h6:row_json->>ผู้ช่วย6,email:row_json->>อีเมลผู้รับงาน';
function sb(path){return fetch(SB.url+path,{headers:{apikey:SB.key,Authorization:'Bearer '+SB.key}}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()})}
function isReal(){return S.mode==='real'}
function meNick(){return isReal()&&S.me?(S.me.nickname||S.me.name||'ฉัน'):S.user.nick}
function meFull(){return isReal()&&S.me?(S.me.name+(S.me.nickname?' ('+S.me.nickname+')':'')):(S.user.name+' ('+S.user.nick+')')}
function canViewAll(){return !!(S.me&&(+S.me.role||0)>=3)}
function whoAmI(){
  if(LOCAL)return Promise.resolve({name:'ผู้ทดสอบในเครื่อง',nickname:'ทดสอบ',w:'HQ',role:8,email:''});
  return RU().user.signIn({appName:'D-MAN ใหม่ (ตัวอย่าง)'})}
function setMe(u){S.me={name:u.name||'',nickname:u.nickname||'',w:u.w||'',role:u.role==null?0:u.role,email:u.email||''}}
function setMode(m){if(m===S.mode)return;
  S.bank[S.mode]={tickets:S.tickets,others:S.others};var b=S.bank[m];
  if(b){S.tickets=b.tickets;S.others=b.others}else if(m==='sample'){var sd=seed();S.tickets=sd.tickets;S.others=sd.others}else{S.tickets=[];S.others=[]}
  S.mode=m;S.draft=null;S.queue=[];S.role='driver';save()}
function enterReal(){whoAmI().then(function(u){setMe(u);setMode('real');go('home',null,true);toast('ข้อมูลจริง · กดลองได้ ไม่บันทึกลงระบบ','info');loadRealJobs()})}
function loadRealJobs(){realLoading=true;
  var since=new Date(Date.now()-REAL_DAYS*864e5).toISOString();
  return sb('/dman_jobs?select='+encodeURIComponent(JOB_SEL)+'&received_at=gte.'+encodeURIComponent(since)+'&order=received_at.desc')
    .then(function(a){S.real.jobs=a;S.real.at=Date.now();S.real.err=''},function(e){S.real.err=String(e&&e.message||e)})
    .then(function(){realLoading=false;save();if(S.view==='home')render()})}
function helpersOf(j){return [j.h1,j.h2,j.h3,j.h4,j.h5,j.h6].filter(Boolean)}
function isMineReal(j){var me=S.me||{},all=[j.driver].concat(helpersOf(j)).join(' | ');
  if(me.email&&j.email&&String(j.email).toLowerCase()===me.email.toLowerCase())return true;
  if(me.name&&all.indexOf(me.name)>=0)return true;
  return !!(me.nickname&&all.indexOf('('+me.nickname+')')>=0)}
function realList(){var v=S.real.viewAs||'';
  return (S.real.jobs||[]).filter(function(j){if(!canViewAll()||v==='')return isMineReal(j);if(v==='*')return true;return j.driver===v})}
function realStatus(j){return j.approved?['success','อนุมัติแล้ว']:j.closed?['pending','รออนุมัติ']:j.rejwhy?['danger','ตีกลับ']:['info','กำลังส่ง']}
function startTrial(id){var j=null;(S.real.jobs||[]).forEach(function(x){if(x.job_id===id)j=x});if(!j)return;
  toast('กำลังดึงบิลของ '+id,'info');
  sb('/dman_bills?select=doc_no,u_add,row_json&job_id=eq.'+encodeURIComponent(id)).then(function(rows){
    if(!rows.length){toast('ใบคุมนี้ยังไม่มีบิลในระบบ','error');return}
    rows.sort(function(a,b){return String(a.u_add||'').localeCompare(String(b.u_add||''))||String(a.doc_no).localeCompare(String(b.doc_no))});
    var shops=[],ix={};
    rows.forEach(function(r){var x=r.row_json||{},nm=x.Customer_Name||'(ไม่มีชื่อร้าน)',k=(x.Customer_Code||'')+'|'+nm;
      if(ix[k]==null){ix[k]=shops.length;shops.push({name:nm,area:x.Customer_Code?('รหัสร้าน '+x.Customer_Code):'',km:null,bills:[]})}
      shops[ix[k]].bills.push({doc:r.doc_no,amount:num(x.TotalBaht),status:'pending',
        real:{st:x['Status บิล']||'',pay:x['Status จ่าย']||'',total:num(x['รวมยอดชำระ']),notSent:x['ไม่ได้ส่ง']||'',why:x['สาเหตุไม่ส่ง']||''}})});
    var t={id:id,real:true,wh:j.warehouse,route:'คนขับจริง: '+j.driver,status:'available',driver:j.driver,plate:j.plate||'',helpers:helpersOf(j),pattern:j.pattern||'ปกติ',shops:shops};
    S.tickets=S.tickets.filter(function(x){return x.id!==id});S.tickets.unshift(t);save();go('accept',id)

/* ---------- ตัวช่วยคำนวณ ---------- */
function T(id){for(var i=0;i<S.tickets.length;i++)if(S.tickets[i].id===id)return S.tickets[i];return null}
function activeJob(){for(var i=0;i<S.tickets.length;i++){var s=S.tickets[i].status;if(s==='doing'||s==='rejected')return S.tickets[i]}return null}
function eachBill(t,fn){t.shops.forEach(function(sh,si){sh.bills.forEach(function(b){fn(b,sh,si)})})}
function findBill(doc){var r=null;S.tickets.forEach(function(t){eachBill(t,function(b,sh,si){if(b.doc===doc)r={b:b,sh:sh,si:si,t:t}})});return r}
function net(b){return Math.max(0,(b.amount||0)-(b.deduct||0))}
function paid(b){var p=b.pay||{};return (p.cash||0)+(p.transfer||0)+(p.cheque||0)}
function due(b){return net(b)+(b.combAmt||0)}
function isShort(b){return b.status==='done'&&!b.unpaid&&!b.combinedInto&&due(b)-paid(b)>0.005}
function stats(t){var o={n:0,done:0,fail:0,cn:0,short:0,unpaid:0,target:0,got:0,cash:0,transfer:0,cheque:0,deduct:0};
  eachBill(t,function(b){o.n++;o.target+=b.amount;if(b.status==='pending')return;o.done++;
    if(b.status==='fail'){o.fail++;if(b.action==='CN')o.cn++;return}
    var p=b.pay||{};o.cash+=p.cash||0;o.transfer+=p.transfer||0;o.cheque+=p.cheque||0;o.deduct+=b.deduct||0;o.got+=paid(b);
    if(b.unpaid)o.unpaid++;if(isShort(b))o.short++});
  return o}
function promoMissing(t){var a=[];eachBill(t,function(b){if(b.promo&&b.status==='done'&&!b.promoSaved)a.push(b.doc)});return a}
function nextShop(t){for(var i=0;i<t.shops.length;i++){var sh=t.shops[i];for(var j=0;j<sh.bills.length;j++)if(sh.bills[j].status==='pending')return{sh:sh,si:i}}return null}

var pumping=false;
function enqueue(label){S.queue.push({label:label,at:Date.now()});save();paintSync();pump()}
function pump(){if(pumping||S.offline||!S.queue.length)return;pumping=true;
  setTimeout(function(){pumping=false;if(S.offline)return;S.queue.shift();save();paintSync();if(S.view==='close'&&!S.queue.length)render();pump()},650)}
function paintSync(){var c=$('#syncChip'),t=$('#syncTxt'),n=S.queue.length;
  if(S.offline){c.dataset.s='off';t.textContent=n?('รอเน็ต '+n):'ไม่มีเน็ต'}

function payChips(b){var p=b.pay||{},h='',parts=[];

function unlinkComb(t,doc){eachBill(t,function(x){if(x.combinedInto===doc){x.status='pending';delete x.combinedInto;x.pay=null}})}
function commitBill(){var r=findBill(S.arg),b=r.b,d=S.draft,un=has(d,'unpaid');
  unlinkComb(r.t,b.doc);
  b.status='done';b.action='';b.reason='';b.unpaid=un;b.unpaidWhy=un?(d.unpaidWhy+(d.unpaidNote?': '+d.unpaidNote:'')):'';b.deduct=num(d.deduct);b.at=Date.now();
  b.pay={cash:dCash(d),transfer:dTrans(d),cheque:dChq(d)};b.comb=has(d,'combined')?d.comb.slice():[];b.combAmt=combAmt(r.t,d);
  eachBill(r.t,function(x){if(b.comb.indexOf(x.doc)>=0){x.status='done';x.combinedInto=b.doc;x.pay={cash:0,transfer:0,cheque:0};x.unpaid=false;x.deduct=0;x.detail=null;x.at=Date.now()}});
  var keep=JSON.parse(JSON.stringify(d));delete keep.typed;b.detail=keep;
  S.draft=null;enqueue('บิล '+b.doc);buzz('success');

function afterBill(r,msg){var nx=null;r.sh.bills.forEach(function(x){if(!nx&&x.status==='pending')nx=x});

function saveBill(){var r=findBill(S.arg),d=S.draft,err=billError(r,d);

  commitBill()}

    case 'real-reload':loadRealJobs();render();break;
    case 'mode':if(id==='real'){if(!isReal())enterReal()}else if(isReal()){setMode('sample');go('home',null,true);toast('กลับมาใช้ข้อมูลตัวอย่าง','info')}break;
    case 'signout':setMode('sample');S.me=null;S.bank.real=null;S.real={jobs:[],at:0,viewAs:'',err:''};save();go('home',null,true);try{RU().user.signOut({signIn:false})}catch(x){}toast('ออกจากระบบแล้ว','info');break;
    case 'open-bill':r=findBill(id);if(r&&r.b.combinedInto){toast('บิลนี้จ่ายรวมกับ '+r.b.combinedInto+' — เปิดบิลนั้นให้','info');id=r.b.combinedInto}S.draft=null;go('bill',id);break;
    case 'locked':break;
    case 'pay':togglePay(id);break;
    case 'comb':o=S.draft;r=o.comb.indexOf(id);if(r>=0)o.comb.splice(r,1);else o.comb.push(id);rebalance(findBill(S.arg),o);save();render();break;
    case 'chip':o=scopeObj(el.dataset.scope);if(!o)break;o[el.dataset.key]=(el.dataset.scope==='d'&&el.dataset.key==='dReason'&&o.dReason===id)?'':id;save();render();break;
    case 'more-fields':S.draft.more=true;save();render();o=$('#in-deduct');if(o)o.focus();break;
    case 'pal-fields':S.draft.pal=true;save();render();break;
    case 't2-add':S.draft.t2on=true;save();render();break;
    case 't2-del':o=S.draft;o.t2on=false;o.t2='';o.bank2='';o.slip2='';rebalance(findBill(S.arg),o);save();render();break;
    case 'promo-save':promoSave();break;
    case 'fake-photo':o=scopeObj(el.dataset.scope);if(o){o[el.dataset.key]=FAKE_PHOTO;save();render()}break;
    case 'save-bill':saveBill();break;
    case 'fail-bill':S.cannot=null;go('cannot',S.arg);break;
    case 'cannot-save':cannotSave();break;
    case 'close-job':go('close');break;
    case 'submit-job':submitJob();break;
    case 'filter':S.filter=id;save();render();break;
    case 'review':go('review',id);break;
    case 'approve':approve(id);break;
    case 'reject':reject(id);break;
    case 'role':S.role=id;save();toast(id==='office'?'ดูเป็นหัวหน้า / บัญชี':'ดูเป็นคนขับ','info');go('home',null,true);break;
    case 'theme':try{RU().toggleTheme()}catch(x){}break;
    case 'reset':RU().confirm({title:'เริ่มตัวอย่างใหม่?',message:'ล้างสิ่งที่ลองกดไว้ทั้งหมดในเครื่องนี้',variant:'reject',confirmText:'เริ่มใหม่'}).then(function(ok){if(!ok)return;
      if(isReal()){S.tickets=[];S.others=[];S.queue=[];S.draft=null;S.acc=null;S.cls=null;S.cannot=null}else{var keep={mode:S.mode,bank:S.bank,real:S.real,me:S.me};S=seed();S.mode=keep.mode;S.bank=keep.bank;S.real=keep.real;S.me=keep.me}
      save();go('home',null,true);toast('เริ่มใหม่แล้ว','info')});break;
    case 'sim-new':var n=53+S.tickets.filter(function(x){return /0005[3-9]$/.test(x.id)}).length,nid='TSW16911/000'+n;
      S.tickets.push({id:nid,wh:'W1',route:'สายบางคนที – ดำเนินสะดวก',status:'available',shops:[{name:'ร้านรุ่งเรืองพาณิชย์',area:'ต.ดอนมะโนรา',km:14.5,lat:13.4921,lng:99.9512,bills:[bill('DSI16911/00'+(320+n),6720)]}]});
      save();toast('มีใบคุมใหม่ '+nid+' เข้ามา (ไม่ต้องกดรีเฟรช)','info');buzz('success');if(S.view==='home')render();break;
    case 'map':var t=activeJob(),sh=t&&t.shops[+id];if(sh)window.open('https://www.google.com/maps/search/?api=1&query='+(sh.lat!=null?sh.lat+','+sh.lng:encodeURIComponent(sh.name)),'_blank','noopener');break;
    case 'call':toast('ตัวอย่าง: กดแล้วโทรหาร้านจากเบอร์ในข้อมูลร้านค้า','info');break;
    case 'todo':toast('“'+id+'” ยังไม่ได้ทำในตัวอย่างรอบนี้','info');break;
    case 'who':toast(S.role==='office'?'ดูเป็นหัวหน้า / บัญชี (เปลี่ยนได้ที่ เพิ่มเติม)':isReal()?meFull()+' · ข้อมูลจริง':S.user.name+' · คลัง '+S.user.wh+' (ข้อมูลตัวอย่าง)','info');break;
    case 'sync-info':var q=S.queue;RU().alert({type:S.offline?'warning':(q.length?'info':'success'),
      title:S.offline?'ไม่มีเน็ต':(q.length?'กำลังส่งข้อมูล':'ข้อมูลขึ้นระบบครบแล้ว'),
      message:q.length?('รอส่ง '+q.length+' รายการ: '+q.map(function(x){return x.label}).join(', ')+' — เก็บไว้ในเครื่องแล้ว ไม่หาย'):'ทุกรายการที่บันทึกขึ้นระบบแล้ว'});break;
  }});
/* ช่องกรอก: data-d (บิล) · data-acc (รับงาน/แก้ทีม) · data-cn (ส่งไม่ได้) · data-cls (ปิดงาน) */
function setField(sc,key,val,el){var o=scopeObj(sc);if(!o)return;var isSel=el.tagName==='SELECT';
  if(sc==='acc'&&key.indexOf('h:')===0){var i=+key.slice(2),dup=val?o.helpers.indexOf(val):-1;
    if(val&&dup>=0&&dup!==i){toast('เลือก '+val+' ไว้ที่ผู้ช่วย '+(dup+1)+' แล้ว','error');val=''}
    o.helpers[i]=val;if(!o.edit)o.helpers=o.helpers.filter(Boolean);save();render();return}
  o[key]=val;
  if(sc==='d'){var r=findBill(S.arg);
    if(key==='bank'||key==='coin'||key==='t1'||key==='t2'||key==='chq'){o.typed[key]=1;rebalance(r,o,key)}
    if(key==='deduct')rebalance(r,o);
    paintBillSum()}
  if(sc==='cls')paintCls();
  save();if(isSel&&sc!=='d')render()}
function fieldEvent(e){var t=e.target,ds=t.dataset;if(!ds)return;var isSel=t.tagName==='SELECT';
  if((e.type==='change')!==isSel)return;   /* select ใช้ change · ช่องพิมพ์ใช้ input */
  ['d','acc','cn','cls'].forEach(function(sc){if(ds[sc]!=null)setField(sc,ds[sc],t.value,t)})}
document.addEventListener('input',fieldEvent);
document.addEventListener('change',fieldEvent);
document.addEventListener('change',function(e){var t=e.target;
  if(t.id==='selViewAs'){S.real.viewAs=t.value;save();render();return}
  if(t.id==='swOff'){S.offline=t.checked;save();paintSync();
    if(S.offline)toast('จำลองเน็ตหลุดแล้ว ลองบันทึกบิลดู','info');else{toast('เน็ตกลับมา กำลังส่งที่ค้าง','info');pump()}return}
  if(t.dataset&&t.dataset.cnpick&&S.draft){var d=S.draft,r=findBill(S.arg),no=t.dataset.cnpick,amt=0,i=d.cnPick.indexOf(no);
    (r.sh.cns||[]).forEach(function(c){if(c.no===no)amt=c.amt});
    if(t.checked&&i<0){d.cnPick.push(no);d.deduct=plain(num(d.deduct)+amt)}
    if(!t.checked&&i>=0){d.cnPick.splice(i,1);d.deduct=plain(Math.max(0,num(d.deduct)-amt))}
    var di=$('#in-deduct');if(di)di.value=d.deduct;rebalance(r,d);save();paintBillSum();return}
  if(t.dataset&&t.dataset.photo&&t.files&&t.files[0]){var o=scopeObj(t.dataset.scope),k=t.dataset.photo;if(!o)return;
    readPhoto(t.files[0],function(url){o[k]=url;save();render();toast('แนบรูปแล้ว')})}});

function boot(){try{history.replaceState({view:S.view,arg:S.arg},'')}catch(e){}render();pump();
  if(isReal())whoAmI().then(function(u){setMe(u);save();render();loadRealJobs()})}
if(document.readyState==='complete')boot();else window.addEventListener('load',boot);
})();
</script>
