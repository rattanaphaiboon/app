<style>
/* D-MAN ใหม่ — ตัวอย่าง (mockup) v0.22
   หน้าตา: Rattana CI (rt-*) · ส่วนนี้มีเฉพาะการจัดวางของแอป (dm-*)
   ข้อมูลทั้งหมดเป็นข้อมูลตัวอย่าง เก็บในเครื่องนี้เท่านั้น ไม่ส่งไปไหน */
:root{--font-sans:"Anuphan","IBM Plex Sans Thai","Noto Sans Thai",sans-serif}
.dm-wrap{max-width:560px;margin:0 auto;padding-top:calc(10px + env(safe-area-inset-top))}
.dm-stack{display:flex;flex-direction:column;gap:14px;margin-top:14px}
.dm-card{padding:16px}
.dm-row{display:flex;align-items:center;gap:10px}
.dm-between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.dm-grow{flex:1 1 0;min-width:0}
.dm-wrapline{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.dm-h{font-size:16px;font-weight:700;color:var(--ink);margin:0}
.dm-sub{font-size:13px;color:var(--text-muted)}
.dm-amt{font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.dm-big{font-size:34px;line-height:1.1;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.dm-emo{font-size:22px;line-height:1}
.dm-topname{min-width:0;line-height:1.15}
.dm-topname b{display:block;font-size:17px;letter-spacing:.05em;color:var(--ink);white-space:nowrap}
.dm-topname small{display:block;font-size:11px;font-weight:500;color:var(--text-subtle);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dm-logo{width:38px;height:38px;border-radius:12px;flex:none}
.rt-topbar.dm-top{flex-wrap:nowrap;padding:8px 10px 8px 12px;gap:10px}
.dm-sync{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 10px;flex:none;border-radius:999px;border:1px solid var(--border);background:var(--field);font:inherit;font-size:12px;font-weight:600;color:var(--ink);cursor:pointer;white-space:nowrap}
.dm-dot{width:9px;height:9px;border-radius:50%;background:var(--approve-mark);flex:none}
.dm-sync[data-s="busy"] .dm-dot{background:var(--warning);animation:dmPulse .9s ease-in-out infinite}
.dm-sync[data-s="off"] .dm-dot{background:var(--reject)}
@keyframes dmPulse{50%{transform:scale(1.6);opacity:.45}}
.dm-me{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 10px 0 4px;flex:none;border-radius:999px;border:1px solid var(--border);background:var(--field);font:inherit;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer;white-space:nowrap}
.dm-me i{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:700;color:var(--on-gold);background:linear-gradient(180deg,#ffd35a,var(--gold))}
/* แผงงานวันนี้ */
.dm-hero{padding:18px}
.dm-hero h2{margin:2px 0 0;font-size:21px;font-weight:700;color:#fff;letter-spacing:.01em}
.dm-hero .k{font-size:12px;opacity:.78}
.dm-hero-nums{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.dm-hero-nums b{display:block;font-size:25px;line-height:1.15;font-variant-numeric:tabular-nums}
.dm-hero .rt-progress{margin-top:14px;background:rgba(255,255,255,.18)}
.dm-pill{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:600;background:rgba(255,255,255,.14);color:#fff;white-space:nowrap}
/* ร้านถัดไป */
.dm-next .dm-shop{font-size:20px;font-weight:700;color:var(--ink);line-height:1.25}
.dm-btnrow{display:grid;grid-template-columns:1fr 1fr 1.6fr;gap:8px;margin-top:14px}
.dm-btnrow .rt-btn{min-width:0;padding:0 8px}
/* รายการบิล */
.dm-step{width:28px;height:28px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;background:var(--hover);color:var(--ink)}
.dm-step.done{background:var(--approve-soft);color:var(--approve-text)}
.dm-bill{display:flex;align-items:center;gap:10px;width:100%;margin-top:8px;padding:12px;border-radius:16px;border:1px solid var(--line);background:var(--field);font:inherit;color:inherit;text-align:left;cursor:pointer}
.dm-bill:active{transform:scale(.99)}
.dm-bill .doc{font-weight:600;color:var(--ink);font-size:14px}
.dm-bill[data-st="done"],.dm-card .dm-bill[data-st="done"]{background:#EEF1F5!important;border-color:transparent;border-radius:14px}
/* แถวเทาไม่ชนกัน: เว้นช่องไฟระหว่างแถว + ตัวหนังสือไม่ชิดขอบพื้นเทา (user: สีเทามันชนกัน) */
.dm-card .dm-bill[data-st="done"]{border-top:0!important;margin:8px 0 0!important;padding:10px 12px!important}
.dm-card .dm-bill[data-st="done"]+.dm-bill:not([data-st="done"]){border-top-color:transparent;margin-top:4px}   /* บันทึกแล้ว = เทาๆ แบบแอปเดิม (bill-row.done ui2: ตัวหนังสือจาง) */
.dm-bill[data-st="done"] .doc,.dm-bill[data-st="done"] .dm-sub,.dm-bill[data-st="done"] .dm-chev,.dm-bill[data-st="done"] .rt-caption{color:#8a94a6!important}.dm-bill[data-st="done"] .dm-amt{color:#64748b!important}
.dm-bill[data-st="fail"]{background:var(--reject-soft);border-color:transparent}
.dm-chev{color:var(--text-subtle);font-size:20px;flex:none}
/* ฟอร์มบิล */
.dm-pay{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.dm-pay button{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;height:84px;border-radius:18px;border:1.5px solid var(--border);background:var(--field);font:inherit;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer;transition:transform .12s,background .15s,border-color .15s}
.dm-pay button span{font-size:30px;line-height:1}
.dm-pay button:active{transform:scale(.96)}
.dm-pay button[aria-pressed="true"]{border-color:var(--gold);background:var(--gold-soft);box-shadow:var(--shadow-gold)}
.dm-pay button[aria-pressed="true"]::after{content:"✓";position:absolute;top:6px;right:8px;width:20px;height:20px;border-radius:50%;background:var(--gold);color:var(--on-gold);font-size:12px;line-height:20px;text-align:center;font-weight:700}
.dm-line{display:flex;align-items:center;gap:10px;margin-top:10px}
.dm-line label{width:92px;flex:none;font-size:14px;font-weight:600;color:var(--ink)}
.dm-line .rt-input{flex:1 1 0;min-width:0;text-align:right;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.dm-thumb{width:56px;height:56px;border-radius:12px;object-fit:cover;border:1px solid var(--border)}
.dm-savebar{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-radius:24px 24px 0 0;box-shadow:0 -10px 30px -12px rgba(1,30,62,.25)}
.dm-savebar-in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px}
.dm-savebar .rt-btn{min-width:0}
.dm-pad-save{padding-bottom:calc(110px + env(safe-area-inset-bottom))}
.dm-ok{color:var(--approve-text)} .dm-bad{color:var(--reject-text)} .dm-warn{color:var(--warning-text)}
.dm-note{padding:12px 14px;border-radius:16px;font-size:13px;line-height:1.5}
.dm-note.info{background:var(--info-soft);color:var(--info-text)}
.dm-note.warn{background:var(--warning-soft);color:var(--warning-text)}
.dm-note.ok{background:var(--approve-soft);color:var(--approve-text)}
.dm-note.bad{background:var(--reject-soft);color:var(--reject-text)}
.dm-kv{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.dm-kv:last-child{border-bottom:0}
.dm-kv b{font-variant-numeric:tabular-nums;color:var(--ink)}
.dm-menu{display:flex;align-items:center;gap:12px;width:100%;padding:12px;border:0;border-radius:16px;background:var(--hover);font:inherit;color:inherit;text-align:left;cursor:pointer;margin-top:8px}
.dm-quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.dm-quick button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:18px;border:1px solid var(--line);background:var(--surface);font:inherit;font-size:12px;font-weight:600;color:var(--ink);cursor:pointer;line-height:1.25;text-align:center}
.dm-quick button span{font-size:26px;line-height:1}
.dm-cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.dm-cmp > div{padding:10px 12px;border-radius:14px;font-size:13px;line-height:1.45}
.dm-cmp .old{background:var(--hover);color:var(--text-muted)}
.dm-cmp .new{background:var(--approve-soft);color:var(--approve-text);font-weight:600}
.rt-bottom-nav.dm-nav{max-width:536px;margin:0 auto}
.rt-bottom-nav.dm-nav a{width:auto;flex:1 1 0;min-width:0;font-size:11px}
.dm-jobtabs{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 4px;scrollbar-width:none}
.dm-jobtabs::-webkit-scrollbar{display:none}
.dm-jobtabs .rt-chip{flex:none}
.dm-tk-lock{opacity:.6}
.dm-acts{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px;margin-top:12px}
.dm-acts .rt-btn{min-width:0;padding:0 6px}
.dm-pay button{height:78px;font-size:11.5px;border-radius:16px;padding:0 2px;line-height:1.2}
.dm-pay button span{font-size:26px}
.dm-blk{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.dm-blk > b{display:block;font-size:14px;color:var(--ink)}
.dm-g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.dm-g3 label{display:block;margin-bottom:4px;font-size:12px;font-weight:600;color:var(--text-muted)}
.dm-num{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.dm-check{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--hover);margin-top:8px;font-size:14px;cursor:pointer}
.dm-check input{width:20px;height:20px;flex:none}
.dm-f{margin-top:12px}
.dm-steps{display:flex;align-items:flex-start;gap:0;padding:12px 10px 10px;border-radius:20px}
.dm-steps > div{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;position:relative;font-size:12px;font-weight:600;color:var(--text-subtle);text-align:center}
.dm-steps > div::before{content:"";position:absolute;top:15px;left:-50%;width:100%;height:3px;background:var(--line);z-index:0}
.dm-steps > div:first-child::before{display:none}
.dm-steps > div.done::before,.dm-steps > div.on::before{background:var(--gold)}
.dm-steps i{position:relative;z-index:1;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:700;font-size:14px;background:var(--hover);color:var(--text-muted);border:2px solid var(--line)}
.dm-steps .done i{background:var(--approve-soft);color:var(--approve-text);border-color:transparent}
.dm-steps .on i{background:linear-gradient(180deg,#ffd35a,var(--gold));color:var(--on-gold);border-color:transparent;box-shadow:var(--shadow-gold)}
.dm-steps .on{color:var(--ink)}
.dm-steps small{display:block;font-size:11px;font-weight:500;color:var(--text-subtle);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
/* ===== ประหยัดพื้นที่ ===== */
.dm-stack{gap:8px}.dm-wrap{padding-top:calc(6px + env(safe-area-inset-top))}
.rt-topbar.dm-top{padding:6px 8px 6px 10px;min-height:0;border-radius:18px}.dm-logo{width:32px;height:32px;border-radius:10px}.dm-topname b{font-size:15px}
.dm-sync{height:32px;padding:0 9px}.dm-me{height:34px}.dm-me i{width:28px;height:28px}
.dm-card{padding:12px}.dm-f{margin-top:8px}.rt-field.dm-f{gap:4px}
.dm-h{font-size:15px}.dm-big{font-size:28px}
.dm-steps{padding:2px 0 0}.dm-steps i{width:26px;height:26px;font-size:12px}.dm-steps > div::before{top:12px}.dm-steps small{display:none}.dm-steps > div{font-size:11.5px;gap:2px}
.dm-hero{padding:12px 14px}.dm-hero h2{font-size:18px}.dm-hero-nums{margin-top:8px}.dm-hero-nums b{font-size:21px}.dm-hero .rt-progress{margin-top:10px}
.dm-mode{padding:12px 14px;border-radius:16px;gap:12px}.dm-mode .ic{width:42px;height:42px;border-radius:13px;font-size:23px}.dm-mode b{font-size:16px}
.dm-pay button{height:68px}.dm-pay button span{font-size:23px}
.dm-line{margin-top:8px}.dm-note{padding:8px 11px;font-size:12.5px}
.dm-card .rt-list-row,.dm-card .dm-bill,.dm-card .dm-check,.dm-card .dm-menu{padding:9px 2px}
.dm-btnrow{margin-top:10px}.dm-next .dm-shop{font-size:18px}
.dm-kv{padding:7px 0}
.dm-jobbar{position:fixed;left:12px;right:12px;bottom:calc(92px + env(safe-area-inset-bottom));z-index:39;max-width:536px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:8px 10px 8px 14px;border-radius:16px;box-shadow:0 8px 24px -12px rgba(10,27,62,.45)}
.dm-head-amt{display:flex;align-items:center;gap:10px;margin-top:8px}
.dm-dd{position:relative;display:block;cursor:pointer;min-width:0}.dm-dd select{pointer-events:none}
.dm-ddlist{max-height:52vh;overflow:auto;margin-top:8px;-webkit-overflow-scrolling:touch}
.dm-ddopt{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:12px 6px;border:0;border-bottom:1px solid var(--line);background:none;font:inherit;font-size:15px;color:var(--ink);cursor:pointer}
.dm-ddopt.on{font-weight:700;color:var(--dm-blue)}.dm-ddopt.on::after{content:"✓";margin-left:auto}
.dm-ddopt:disabled{opacity:.45}
.dm-card.dm-emph{background:var(--dm-sky-soft);border:2px solid var(--dm-sky)!important;box-shadow:0 6px 18px -10px rgba(29,111,214,.45)}
.dm-emph .rt-field > label{font-weight:700;color:var(--ink);font-size:14px}
.dm-emph .rt-input{background:var(--surface)}
.dm-emph .dm-odo{font-size:20px;height:50px}
.dm-emph label.rt-btn{background:var(--surface);border:1.5px dashed var(--dm-blue);color:var(--dm-blue);font-weight:700;min-height:50px}
.dm-mbar{flex:1;height:6px;border-radius:99px;background:var(--line);overflow:hidden;min-width:0}.dm-mbar i{display:block;height:100%;background:var(--dm-blue);border-radius:99px}
.dm-map{position:relative;z-index:0;isolation:isolate;height:220px;border-radius:14px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--line);background:var(--dm-sky-soft)}
.dm-map-wait{display:flex;align-items:center;justify-content:center;height:100%;padding:0 16px;text-align:center;font-size:13px;color:var(--ink-3,#64748b)}
.dm-pin{background:#A4D1FA;color:#0A1B3E;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;border:2px solid #0A1B3E;font-size:13px}
.dm-pin-wh{background:#C0392B;color:#fff;padding:2px 6px;border-radius:6px;font-weight:700;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);font-size:12px;text-align:center}
.dm-stops{margin-top:8px}.dm-stop{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}.dm-stop:last-child{border-bottom:0}
.dm-stopn{flex:none;width:24px;height:24px;border-radius:50%;background:var(--dm-sky-soft);color:var(--dm-navy);border:1.5px solid var(--dm-navy);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.dm-qr{display:inline-flex;align-items:center;justify-content:center;padding:14px;background:#fff;border-radius:14px;margin:8px auto 0;min-width:238px;min-height:238px;box-shadow:inset 0 0 0 1px var(--line)}
.dm-addtk{width:100%;min-height:42px;border:1.5px dashed var(--dm-blue)!important;color:var(--dm-blue);font-weight:700}
.dm-card.dm-box-old{border:2px solid #F2B8B5!important;background:#FFF5F4}
.dm-mbar.bad i{background:#DC2626}.dm-mbar.ok i{background:#15803D}
[data-theme=dark] .dm-card.dm-box-old{background:rgba(220,38,38,.08)}
.rt-cell-main,.rt-cell-sub,.dm-sub,.rt-caption,.dm-h,.rt-field>label,.dm-line label,.dm-mode small,.dm-mode b,.dm-steps small,.rt-badge,.dm-bill .doc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dm-grow{min-width:0}
.dm-sb2 .dm-savebar-in{flex-wrap:wrap;row-gap:6px}.dm-sb2 .dm-savebar-in>.dm-grow{flex:1 0 100%}.dm-sb2 .dm-savebar-in>.rt-btn{flex:1 1 0;min-width:0}
body:has(.dm-sb2) .dm-pad-save{padding-bottom:calc(170px + env(safe-area-inset-bottom))}
.dm-cmp{grid-template-columns:1fr!important}.dm-cmp>div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:7px 12px!important}
.dm-ddopt{flex-direction:column;align-items:flex-start!important;gap:1px!important}.dm-ddopt.on::after{position:absolute;right:8px;top:12px}.dm-ddopt{position:relative;padding-right:26px!important}
.dm-ddl{display:block;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dm-dds{font-size:13px;color:var(--text-muted,#64748b);font-weight:400}
[hidden]{display:none!important}
/* ===== โทนแบบ D-MAN เดิม: หัวกรมท่าไล่สี · พื้นเทาฟ้า · การ์ดขาวเรียบ · ฟ้าอ่อนเป็นตัวที่เลือก · ตัวเลขเงินสีน้ำเงิน ===== */
:root,[data-theme="light"]{--page:#edf1f8;--dm-blue:#1d6fd6;--dm-sky:#a4d1fa;--dm-sky-soft:#e3f0fd;--dm-navy:#0a1b3e}
[data-theme="dark"]{--page:#06172b;--dm-blue:#7cb8ff;--dm-sky:#a4d1fa;--dm-sky-soft:rgba(164,209,250,.16);--dm-navy:#0a1b3e}
body.rt-app{background:var(--page)}
.rt-bg{display:none}
.rt-glass{background:var(--surface);-webkit-backdrop-filter:none;backdrop-filter:none}
.rt-topbar.dm-top{background:linear-gradient(135deg,#0a1b3e 0%,#14336b 100%);border:0;box-shadow:0 10px 24px -14px rgba(10,27,62,.7)}
.dm-top .dm-topname b{color:#fff}.dm-top .dm-topname small{color:rgba(255,255,255,.7)}
.dm-top .dm-sync,.dm-top .dm-me{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.22);color:#fff}
.dm-top .dm-me i{background:var(--dm-sky);color:var(--dm-navy)}
.rt-chip[aria-pressed="true"]{background:var(--dm-sky);color:var(--dm-navy);border-color:transparent;box-shadow:none}
.dm-amt{color:var(--dm-blue)}.dm-big{color:var(--dm-blue)}
.dm-amt.dm-ok{color:var(--approve-text)}
.rt-progress>span{background:var(--dm-blue);box-shadow:none}
.dm-hero .rt-progress>span{background:var(--dm-sky)}
.dm-steps .on i{background:var(--dm-sky);color:var(--dm-navy);box-shadow:none}
.dm-steps > div.done::before,.dm-steps > div.on::before{background:var(--dm-sky)}
.dm-pay button[aria-pressed="true"]{border-color:var(--dm-blue);background:var(--dm-sky-soft);box-shadow:none}
.dm-pay button[aria-pressed="true"]::after{background:var(--dm-blue);color:#fff}
.rt-bottom-nav.dm-nav{background:rgba(255,255,255,.92);border:1px solid var(--line)}
[data-theme="dark"] .rt-bottom-nav.dm-nav{background:rgba(10,32,58,.92)}
.rt-bottom-nav.dm-nav a[aria-current="page"]{background:var(--dm-sky-soft);border-color:transparent;color:var(--dm-navy)}

  .dm-nav a{flex:none!important;width:auto!important;height:48px!important;flex-direction:row!important;justify-content:flex-start!important;gap:12px!important;padding:0 14px!important;font-size:15px!important;border-radius:14px!important;position:relative}

  header.dm-top{margin-left:0!important;margin-right:0!important;width:auto!important;max-width:100%!important;box-sizing:border-box!important;padding:6px 10px 6px 12px!important;border-radius:18px!important}   /* CI เติม padding กลางจอ ~560px บนจอกว้าง → หัวแอปซ้อนกัน */
  .rt-pad-bottom-nav{padding-bottom:40px!important}
  /* v0.57 user (ภาพกรอบแดง/เหลือง): จอคอม หัวแอปไม่ชนขอบบน — ลงมา 16px เท่าเมนูซ้าย · ช่องเหนือหัวปิดด้วยสีพื้น (เลื่อนแล้วเนื้อหาไม่โผล่) · แถบปุ่มกลับชิดหัวขึ้น */
  header.dm-top.rt-sticky-top{top:16px!important;margin-top:16px!important;margin-bottom:6px!important;overflow:visible!important}
  header.dm-top.rt-sticky-top::before{content:"";position:absolute;left:-4px;right:-4px;top:-17px;height:17px;background:var(--page);pointer-events:none}
  .dm-pghd{margin-top:0!important;padding-top:4px!important}

  .dm-savebar-in{max-width:none!important}
  .rt-totop{bottom:var(--dm-gap)!important}   /* CI ยกปุ่ม ↑ หลบแถบเมนูล่าง — บนจอคอมเมนูอยู่ซ้าย ไม่ต้องยก */
  .dm-jobbar{left:calc(var(--dm-side) + var(--dm-gap)*2)!important;right:var(--dm-gap)!important;bottom:var(--dm-gap)!important;max-width:none!important;margin:0!important}
  .dm-upd{left:calc((var(--dm-side) + var(--dm-gap) + 100%) / 2)!important}   /* กลางพื้นที่เนื้อหา (ข้างเมนูซ้าย) — แถบใช้ translate(-50%) จัดกลางเอง */

  .dm-team,.dm-billhead{max-width:none}
  .rt-popup{max-width:560px}
}

function routeSort(items,start){var withLL=[],noLL=[];items.forEach(function(b){var la=Number(b.lat),lo=Number(b.lng);((isFinite(la)&&isFinite(lo)&&Math.abs(la)>0.1&&Math.abs(lo)>0.1)?withLL:noLL).push(b)});

    if(nC<=8){var work=order.slice(),best=work.slice(),bc=cost(best);var heap=function(k){if(k===1){var c=cost(work);if(c<bc){bc=c;best=work.slice()}return}for(var i=0;i<k;i++){heap(k-1);var j=(k%2)?0:i,t=work[j];work[j]=work[k-1];work[k-1]=t}};heap(nC);order=best}

      message:q.length?('รอส่ง '+q.length+' รายการ: '+q.map(function(x){return x.label}).join(', ')+' — เก็บไว้ในเครื่องแล้ว ไม่หาย'):'ทุกรายการที่บันทึกขึ้นระบบแล้ว'});break;
  }});
/* ช่องกรอก: data-d (บิล) · data-acc (รับงาน/แก้ทีม) · data-cn (ส่งไม่ได้) · data-cls (ปิดงาน) */
function setField(sc,key,val,el){var o=scopeObj(sc);if(!o)return;var isSel=el.tagName==='SELECT';
  if(sc==='fm'&&key.indexOf('it:')===0){var p=key.split(':'),it=o.items[+p[1]];if(it){it[p[2]]=val;if(p[2]==='q'){it.code='';it.name='';it.units=[];it.unit='';var rr=$('#riRes_'+p[1]);if(rr)rr.innerHTML=riResults(+p[1])}}save();return}
  if(sc==='fm'&&o.kind==='ret'&&key==='shop'){var c0=custByLabel(val);o.shop=val;o.doc='';o.note='';o.items=[newItem()];o.seller=c0?c0.seller:'';save();render();return}
  if(sc==='fm'&&key==='cat'){o.cat=val;o.sub='';save();render();return}
  if(sc==='x'&&key==='pfQ'){var had=!!o.pfSel;o.pfQ=val;o.pfSel='';save();if(had){render();var qi=document.querySelector('[data-x="pfQ"]');if(qi){qi.focus();try{qi.setSelectionRange(val.length,val.length)}catch(e){}}return}var pb=$('#pfRes');if(pb)pb.innerHTML=pfResHTML();return}   /* v0.54 */
  if(sc==='x'&&key==='lrQ'){o.lrQ=val;o.lrPick=null;o.lrUnit='';save();var lb=$('#lrRes');if(lb)lb.innerHTML=lrResHTML();return}
  if(sc==='x'&&LIVE[key]){o[key]=val;if(key==='custQ')o.custN=40;if(key==='histQ')o.histPage=1;save();var bx=$('#'+LIVE[key][0]);if(bx){bx.innerHTML=LIVE[key][1]();ddWrap(bx);try{RU().init(bx)}catch(e){}}return}
  if(sc==='x'&&XRENDER[key]){o[key]=val;if(key==='chkJob'){o.lrOpen=false;o.lrDraft=[];o.chkQ=''}if(key==='pfJob'){o.pfSel='';o.pfQ='';o.pfOpen=''}save();render();return}
  if(sc==='acc'&&key==='id'){o.id=val;if(val&&isReal()){o.loading=true;save();render();startTrial(val,function(tk){var A=S.acc;if(!A||A.id!==val)return;A.loading=false;A.plate=tk.plate||A.plate;A.helpers=(tk.helpers||[]).slice();A.pattern=tk.pattern||A.pattern;if(tk.driver)A.driver=tk.driver;save();render()});return}save();render();return}
  if(sc==='acc'&&key==='odo'){o.odo=val;save();var eb=$('#emphBadge');if(eb)eb.innerHTML=emphBadge(o);return}
  if(sc==='acc'&&key.indexOf('h:')===0){var i=+key.slice(2),dup=val?o.helpers.indexOf(val):-1;
    if(val&&dup>=0&&dup!==i){toast('เลือก '+val+' ไว้ที่ผู้ช่วย '+(dup+1)+' แล้ว','error');val=''}
    o.helpers[i]=val;if(!o.edit)o.helpers=o.helpers.filter(Boolean);save();render();return}
  o[key]=val;
  if(sc==='d'){var r=findBill(S.arg);
    if(key==='bank'||key==='coin'||key==='t1'||key==='t2'||key==='chq'){o.typed[key]=1;rebalance(r,o,key)}
    if(key==='deduct'||key==='fee'){rebalance(r,o);if(key==='fee'&&(num(val)>0)!==!!o._feeOn){o._feeOn=num(val)>0;save();render();var fi=$('#in-fee');if(fi){fi.focus();try{fi.setSelectionRange(fi.value.length,fi.value.length)}catch(e){}}return}}
    paintBillSum()}
  if(sc==='cls')paintCls();
  if(sc==='cn'&&S.probs&&S.probs[o.doc])S.probs[o.doc].form=JSON.parse(JSON.stringify(o));
  save();if(isSel)render()}
function fieldEvent(e){var t=e.target,ds=t.dataset;if(!ds)return;var isSel=t.tagName==='SELECT';
  if((e.type==='change')!==isSel)return;   /* select ใช้ change · ช่องพิมพ์ใช้ input */
  ['d','acc','cn','cls','fm','x'].forEach(function(sc){if(ds[sc]!=null)setField(sc,ds[sc],t.value,t)})}
document.addEventListener('input',fieldEvent);
document.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target&&e.target.id==='botQ'&&!e.isComposing){e.preventDefault();var q=e.target.value;e.target.value='';botSend(q)}});
document.addEventListener('input',function(e){if(e.target.id!=='pickQ')return;S.pq=e.target.value;save();var l=$('#pickList');if(l){l.innerHTML=pickListHTML();try{RU().init(l)}catch(x){}}});
document.addEventListener('change',fieldEvent);
document.addEventListener('change',function(e){var t=e.target;
  if(t.id==='selViewAs'){S.real.viewAs=t.value;save();render();return}
  if(t.id==='swOff'){S.offline=t.checked;save();paintSync();
    if(S.offline)toast('จำลองเน็ตหลุดแล้ว ลองบันทึกบิลดู','info');else{toast('เน็ตกลับมา กำลังส่งที่ค้าง','info');pump()}return}
  if(t.dataset&&t.dataset.cnpick&&S.draft){var d=S.draft,r=findBill(S.arg),no=t.dataset.cnpick,amt=0,i=d.cnPick.indexOf(no);
    (r.sh.cns||[]).forEach(function(c){if(c.no===no)amt=c.amt});
    if(t.checked&&i<0){d.cnPick.push(no);d.deduct=plain(num(d.deduct)+amt)}
    if(!t.checked&&i>=0){d.cnPick.splice(i,1);d.deduct=plain(Math.max(0,num(d.deduct)-amt))}
    var di=$('#in-deduct');if(di)di.value=d.deduct;rebalance(r,d);save();paintBillSum();return}
  if(t.dataset&&t.dataset.photo&&t.files&&t.files[0]){var o=scopeObj(t.dataset.scope),k=t.dataset.photo;if(!o)return;
    readPhoto(t.files[0],function(url){o[k]=url;if(t.dataset.scope==='mp'){mpApply(k);return}save();render();toast('แนบรูปแล้ว');if(t.dataset.scope==='acc'&&k==='photo'&&o.pick)aiRun(o,'aiLoad','load',url)})}});
document.addEventListener('change',function(e){var t=e.target,ds=t.dataset||{},X=S.x;
  if(ds.cnck){X.cncSel[ds.cnck]=t.checked;save();render();return}
  if(ds.cnq){X.cncQty[ds.cnq]=t.value;save();render();return}
  if(t.id==='swAllWh'){X.allWh=t.checked;save();if(isLive()&&ENG.ready){try{engE('(typeof pushSetAllWh_==="function"?pushSetAllWh_('+(t.checked?'true':'false')+'):null)')}catch(x){}}toast(t.checked?'รับแจ้งเตือนทุกคลังแล้ว':'รับเฉพาะคลังตัวเอง','info')}});
document.addEventListener('input',function(e){var ds=e.target.dataset||{};if(ds.cnn!=null){S.x.cncNote[ds.cnn]=e.target.value;save()}});

function boot(){try{var _op=(/[?&]open=(bot|botcases)(?:&|$)/.exec(location.search)||[])[1],_co=(/[?&]co=(rtn|cg|cd)(?:&|$)/.exec(location.search)||[])[1];   /* v0.51 ลิงก์จากไลน์/แจ้งเตือน */
    if(_co&&PROD&&_co!==S.co){S.co=_co;S.tickets=[];S.cur=null;S.draft=null}if(_op){S.view=_op;S.arg=null}if(_op||_co){save();history.replaceState(null,'',location.pathname+location.search.replace(/[?&](open|co)=[^&]*/g,'').replace(/^&/,'?')+location.hash)}}catch(e){}
  if(!S.v23){S.v23=1;if(isOffice()&&S.view==='home')S.view='appr'}if(MOCKUP&&S.mode!=='sample'){S.mode='sample';save()}try{if(S.view&&S.view!=='home'){history.replaceState({view:'home',arg:null,d:0},'');history.pushState({view:S.view,arg:S.arg,d:1},'')}else history.replaceState({view:S.view||'home',arg:S.arg,d:0},'')}catch(e){}if(PROD){prodBoot();return}render();pump();
  if(isReal())whoAmI().then(function(u){setMe(u);save();render();loadRealJobs()});
  if(isLive()){if(engAllowed())engStart(S.co).then(function(){render()},function(){render()});else{setMode('sample');render()}}}
if(document.readyState==='complete')boot();else window.addEventListener('load',boot);
})();
</script>
