<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rattana เคลมรูปโปร v2.1</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{--navy:#0d1b3e;--navy2:#1b2d5c;--gold:#c9a84c;--bg:#f3f5f9;--card:#fff;--line:#dde2ec;--txt:#1d2433;--mut:#6b7488;
  --ok:#1f9d55;--okbg:#e6f6ec;--bad:#d64545;--badbg:#fdecec;--warn:#c27c0e;--warnbg:#fff4de}
*{box-sizing:border-box}
body{margin:0;font-family:Sarabun,sans-serif;background:var(--bg);color:var(--txt);font-size:15px}
header{background:var(--navy);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:18px}
header .v{color:var(--gold);font-size:13px}
.demo{background:var(--gold);color:var(--navy);font-weight:700;font-size:12px;padding:2px 8px;border-radius:99px}
header .who{margin-left:auto;display:flex;gap:6px;align-items:center;font-size:13px}
header .who select{padding:4px 8px;border-radius:8px;border:0;font-family:inherit}
.wrap{max-width:1250px;margin:0 auto;padding:14px 16px 60px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
select,input,button{font-family:inherit;font-size:14px}
select,input[type=number]{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}
button{border:0;border-radius:9px;padding:8px 14px;cursor:pointer;font-weight:600}
.b-pri{background:var(--navy);color:#fff}.b-gold{background:var(--gold);color:var(--navy)}
.b-ok{background:var(--ok);color:#fff}
.b-ghost{background:#fff;border:1px solid var(--line);color:var(--txt)}
button:disabled{opacity:.45;cursor:default}
.seg{display:inline-flex;background:#e4e8f0;border-radius:10px;padding:3px}
.seg button{background:transparent;padding:6px 14px;border-radius:8px;color:var(--mut)}
.seg button.on{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(0,0,0,.12)}
/* ขั้นตอน */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
@media(max-width:640px){.steps{grid-template-columns:1fr}}
.step{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start}
.step .n{flex:none;width:28px;height:28px;border-radius:50%;background:#e4e8f0;color:var(--mut);display:flex;align-items:center;justify-content:center;font-weight:700}
.step.now{border:2px solid var(--gold);background:#fffaf0}.step.now .n{background:var(--gold);color:var(--navy)}
.step.done .n{background:var(--ok);color:#fff}
.step b{display:block;font-size:14.5px}.step small{color:var(--mut);font-size:12.5px;line-height:1.4;display:block}
.prog{height:10px;background:#e4e8f0;border-radius:99px;overflow:hidden;margin:6px 0 2px}
.prog i{display:block;height:100%;background:var(--ok)}
.next{background:var(--navy);color:#fff;border-radius:12px;padding:12px 14px;margin-bottom:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.next b{color:var(--gold)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 12px;cursor:pointer}
.card.on{outline:2px solid var(--gold)}
.card b{display:block;font-size:24px}
.card span{font-size:13px;color:var(--mut)}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.tabs button{background:#fff;border:1px solid var(--line)}
.tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.note{background:#fff;border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:8px;padding:10px 12px;font-size:13.5px;color:#3a4256;margin-bottom:12px;line-height:1.55}
.bill{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden;scroll-margin-top:80px}
.bill.saved{opacity:.92}
.bill.focus{outline:3px solid var(--gold)}
.bh{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);background:#fafbfd}
.bh .shop{font-weight:700;font-size:16px}
.bh .meta{color:var(--mut);font-size:13px}
.pill{font-size:12.5px;font-weight:700;padding:2px 9px;border-radius:99px;white-space:nowrap}
.p-ok{background:var(--okbg);color:var(--ok)}.p-bad{background:var(--badbg);color:var(--bad)}.p-warn{background:var(--warnbg);color:var(--warn)}.p-mut{background:#eef0f4;color:var(--mut)}.p-navy{background:var(--navy);color:#fff}
.bb{display:grid;grid-template-columns:1fr 1fr 1.25fr;gap:12px;padding:12px 14px}
@media(max-width:900px){.bb{grid-template-columns:1fr 1fr}.bb .data{grid-column:1/-1}}
@media(max-width:560px){.bb{grid-template-columns:1fr}}
.ph{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#111}
.ph .cap{background:#fff;font-size:12.5px;font-weight:600;padding:5px 8px}
.more{grid-column:1/-1}.more .mh{font-size:13px;font-weight:700;margin:2px 0 6px}.more .mg{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.comp{margin-top:8px;padding:8px 10px;border:1px dashed var(--gold);border-radius:10px;background:#fffaf0}.comp .mh{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;font-weight:700;margin-bottom:6px}.comp .mh small{font-weight:400;color:var(--mut)}.comp .mh button{font-family:inherit;font-size:12.5px;padding:4px 10px;border-radius:8px;cursor:pointer}
.comp .mg{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.comp .cx{display:block;width:100%;margin-top:4px;font-family:inherit;font-size:12px;padding:4px 8px;border-radius:8px;cursor:pointer;color:var(--bad)}
.ph img:not([src]){visibility:hidden}
.ph img{width:100%;height:270px;object-fit:contain;display:block;cursor:zoom-in;background:#222}
.q{border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin-bottom:8px}
.q.need{border:2px solid var(--gold);background:#fffaf0}
.q.done{background:#f7faf8}
.q .t{font-weight:700;font-size:14px;margin-bottom:6px}
.q .t i{font-style:normal;display:inline-block;width:20px;height:20px;border-radius:50%;background:var(--navy);color:#fff;text-align:center;font-size:12px;line-height:20px;margin-right:4px}
.q.done .t i{background:var(--ok)}
.yn button{padding:6px 14px;border:1px solid var(--line);background:#fff;margin-right:4px}
.yn button.y.on{background:var(--ok);color:#fff;border-color:var(--ok)}
.yn button.n.on{background:var(--bad);color:#fff;border-color:var(--bad)}
.q input[type=number]{width:90px;font-size:22px;font-weight:700;text-align:center;padding:4px}
.cmp{display:flex;align-items:center;gap:16px;justify-content:center;padding:4px 0}
.cmp div{text-align:center}.cmp small{display:block;color:var(--mut);font-size:12px}.cmp b{font-size:28px}.cmp .vs{font-size:26px;font-weight:700}
.gl{font-size:13px;margin-top:4px;line-height:1.6}
.res{border-radius:10px;padding:9px 11px;font-size:14px;font-weight:700;margin-bottom:8px}
.res.ok{background:var(--okbg);color:var(--ok)}.res.bad{background:var(--badbg);color:var(--bad)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left;vertical-align:top}
th{background:#f2f4f8;font-size:12.5px;color:#4a536a}
td.n,th.n{text-align:right}
tr.free td{color:var(--ok);font-weight:600}
.sum table th,.sum table td{text-align:center;white-space:nowrap}
.sum table td.l,.sum table th.l{text-align:left}
.scroll{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:12px}
.boss .big{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:12px}
.boss .big div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}
.boss .big b{display:block;font-size:34px;line-height:1.1}
.boss .big span{color:var(--mut);font-size:13.5px}
.boss h3{margin:16px 0 8px;font-size:16px}
#addDlg{position:fixed;inset:0;background:rgba(13,27,62,.55);display:none;align-items:flex-start;justify-content:center;z-index:45;overflow:auto;padding:24px 12px}
#addDlg .box{background:#fff;border-radius:14px;max-width:560px;width:100%;padding:16px 16px 18px;box-shadow:0 12px 40px rgba(0,0,0,.25)}
#addDlg h3{margin:0 0 10px;color:var(--navy);font-size:17px}
#addDlg label.l{display:block;font-weight:700;font-size:13.5px;margin:12px 0 5px;color:var(--navy)}
#addDlg input[type=text],#addDlg select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:14px;box-sizing:border-box}
#addDlg .info{background:#faf6ea;border:1px solid #ecdcae;border-radius:10px;padding:10px 12px;margin-top:10px;font-size:13.5px;line-height:1.7}
#addDlg .info b.q{font-size:22px;color:var(--bad)}
#addDlg .thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
#addDlg .thumbs div{position:relative}
#addDlg .thumbs img{width:92px;height:92px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
#addDlg .thumbs button{position:absolute;top:2px;right:2px;border:0;border-radius:50%;width:22px;height:22px;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;line-height:22px;padding:0}
#addDlg .pick{border:2px dashed var(--gold);background:#fffbef;border-radius:10px;padding:10px;text-align:center;cursor:pointer;font-weight:700;color:#8a6d1c}
#addDlg .act{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
#zoom{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:50}
#zoom img{max-width:96vw;max-height:94vh}
.phx{height:270px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;background:#3a2a2a;padding:14px;font-size:14px;line-height:1.6}.phx a{color:var(--gold)}
.sg{background:#fff;border:1px solid var(--line);border-left:5px solid var(--gold);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.sgh{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-weight:700;font-size:15.5px}.sgh small{color:var(--mut);font-weight:400}
.sgg{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-top:8px}
.sgc{background:#f7f8fb;border-radius:10px;padding:8px 10px}.sgc.click{cursor:pointer;background:var(--badbg)}
.sgc b{display:block;font-size:24px;line-height:1.15}.sgc b small{font-size:13px;color:var(--mut)}.sgc span{font-size:12.5px;color:var(--mut)}
.dt{margin-top:10px;max-height:300px;overflow:auto}.dt th{position:sticky;top:0;z-index:1}.dt td small{color:var(--mut)}.dt .dz{color:#c3c9d6}
.dtot td{background:#faf6ea;font-weight:700}.dr{cursor:pointer}.dr:hover td{background:#f7f8fb}.dr.on td{background:var(--warnbg)}
.dth{font-size:12.5px;color:var(--mut);margin-top:6px}
.load{padding:40px;text-align:center;color:var(--mut)}
.savebar{position:fixed;left:0;right:0;bottom:0;background:var(--navy);color:#fff;padding:10px 16px;display:none;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;z-index:40;box-shadow:0 -4px 14px rgba(0,0,0,.2)}
.savebar b{color:var(--gold)}.savebar button{padding:10px 20px;font-size:15px}
.wrap{padding-bottom:90px}
.b-out{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:99px;padding:3px 12px;font-family:inherit;font-size:12.5px;cursor:pointer}
#hdrUser{font-weight:600}
#loginScreen{position:fixed;inset:0;z-index:100;background:linear-gradient(160deg,var(--navy),var(--navy2));display:flex;align-items:center;justify-content:center;padding:16px}
#loginScreen.hide{display:none}
.lcard{background:#fff;border-radius:18px;padding:28px 22px;max-width:360px;width:100%;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.lcard h2{margin:6px 0 2px;color:var(--navy)}.lsub{color:var(--mut);font-size:13px;margin-bottom:16px;line-height:1.5}
.lerr{display:none;margin-top:12px;background:var(--badbg);color:var(--bad);border-radius:10px;padding:10px;font-size:13.5px}
.upd{position:fixed;left:50%;top:72px;transform:translateX(-50%);z-index:150;display:none;align-items:center;gap:10px;background:var(--navy);color:#fff;padding:8px 8px 8px 16px;border-radius:99px;box-shadow:0 10px 26px rgba(13,27,62,.4);max-width:calc(100vw - 32px)}
.upd.on{display:flex}.upd .u-t{font-size:13.5px;font-weight:600;line-height:1.25;white-space:nowrap}.upd .u-t small{display:block;font-weight:400;opacity:.7;font-size:11.5px}
.upd .u-go{border:0;border-radius:99px;padding:8px 16px;font-family:inherit;font-weight:700;font-size:14px;background:var(--gold);color:var(--navy);cursor:pointer}
.upd .u-x{border:0;width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;font-size:15px;cursor:pointer}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:99px;font-weight:600;z-index:60;display:none}
</style>
</head>
<body>
<div id="loginScreen"><div class="lcard">
  <div style="font-size:42px">📸</div><h2>เคลมรูปโปร</h2><div class="lsub">ตรวจรูปของแถม · รถเร่เอเย่นต์ · v2.1</div>
  <div id="gsiBtn" style="display:flex;justify-content:center;min-height:44px"></div>
  <div class="lerr" id="loginErr"></div>
  <div class="lsub" style="margin-top:14px">เข้าได้เฉพาะอีเมลที่อยู่ในชีท Users (Active)<br>Role 5 ขึ้นไป = เห็นหน้าภาพรวม</div>
</div></div>
<header>
  <h1>📸 เคลมรูปโปร</h1><span class="v">v2.1</span>
  <div class="who"><span id="hdrUser"></span><button class="b-out" onclick="logout()">ออกจากระบบ</button></div>
</header>
<div class="wrap">
  <div class="bar">
    <button class="b-pri" id="btnLoad" onclick="loadAll()">⟳ โหลดข้อมูล</button>
    <select id="selMonth" onchange="render()"></select>
    <span class="seg" id="segWh"></span>
    <button class="b-gold" id="btnExp" onclick="exportForm()" disabled>⬇️ Export ฟอร์ม (Excel)</button>
    <span id="stat" style="color:var(--mut);font-size:13px"></span>
  </div>
  <div id="steps"></div>
  <div class="cards" id="cards"></div>
  <div class="tabs" id="tabs"></div>
  <div id="out"><div class="load">กด “โหลดข้อมูล” เพื่อเริ่ม</div></div>
</div>
<div id="zoom" onclick="this.style.display='none'"><img id="zimg"></div>
<div id="addDlg" onclick="if(event.target===this)addClose()"><div class="box" id="addBox"></div></div>
<input type="file" id="addFile" accept="image/*" multiple style="display:none" onchange="addFiles(this)">
<input type="file" id="compFile" accept="image/*" multiple style="display:none" onchange="compFiles(this)">
<div class="toast" id="toast"></div>
<div class="upd" id="updBar"><span class="u-t">มีเวอร์ชันใหม่ <span id="updVer"></span><small>กดอัปเดตเพื่อใช้เวอร์ชันล่าสุด</small></span><button class="u-go" onclick="doUpdate()">อัปเดต</button><button class="u-x" onclick="dismissUpdate()" aria-label="ปิด">✕</button></div>
<div id="savebar" class="savebar"></div>

<script>
const VERSION='2.1';
const CFG={
  dmanId:'1QIrFceoA-NdmSJjioubr0KQzmHTqy52ZnspnlRJyybM', dmanGid:0,
  dsdcId:'1NO8sHyDxwHTRqgcLFCxq_g_Rr09lfe4gt_odwkIgiB0', dsdcSheet:'DS_DC',
  promoId:'1CqHARklgveAeJ6rTkNeyUSku__puTiNE7-c6ebn93W8', promoGid:4345804,   // Purchase Actions › Promotion (คอลัมน์ ถ่ายรูป)
  custId:'18RSfuDdCadccWS_3v_Ggi70_X8FGEIVGrGUedkQLYUw', custGid:1169768881,   // ROO › Customer (ต.,อ.,จ. ขอพร)
  stockId:'16mYDqAqqJma-_0vCIAajy6bcjdOZ7F6VagxkdkqAB2I', stockGid:635140262,   // Stocksync › สินค้าที่เข้าโปร + QTY PA
  sumId:'1NxFkxiQev0xxGir93-qt0flNfzHz848-KuE7jDRSxQE', sumGid:429808572,
  kumId:'1_EXR_c5qYkjILICpYyOfB48vz_CQGuQ5hjlfze84Y0g', kumGid:1454839166,   // Import Pre-order picker › ใบคุมรายการ (เลขที่เอกสาร → ใบคุม/แผนคนส่ง) · ตอนนี้มีแค่ W1   // ชีทยอดขาย/แถมรายบรรทัด (Doc_No · Product_Name · Free_EA)
  GAS_URL:'https://script.google.com/macros/s/AKfycbxnNb0AY5aFIkC4GNJorlKPnC-VBGqS0ct5FCVnOVrLPwziaFtSGo16GH0CSD2RjSSA/exec'   // ใช้จริง = /exec ของ rattana-promo-claim.gs (เก็บผลตรวจลงชีท) · ว่าง = เดโม เก็บในเครื่องนี้
};
const SALE=['ChC 620','ChC 490','ChC 320','ChCB 490','ChCB 620','FDB 490','FDB 620'];
const GIFT=['ChC620','ChC320C','ChC490C'];
let LOADGEN=0,DSWAIT=0,DSFAIL=0,DAY='',KUM={},PENDING={},ROWS=[],BILLS={},GSUM={},SG=[],PROMOS=[],ADDR={},REC={},DRAFT={},AN={};
let FILTER='todo',TAB='bill',WH='all',ROLE=3,FOCUS='',CHECKER='';
/* คอลัมน์ผลตรวจที่ .gs เขียนต่อท้ายชีท D-MAN (ตั้งแต่ N) — แอปอ่านกลับจาก CSV เดียวกัน */
/* ---------- ล็อกอิน Google + ชีท Users (แบบเดียวกับแอปอื่น) ---------- */
const AUTH={clientId:'615875645128-gasjjvkt6lu8g449cbnhl40k1pu25r0b.apps.googleusercontent.com',usersId:'1M6HdISsLN684qRWyQ73CA4AmUzmYtZaOlffDJXZZIXQ',usersGid:0,days:7};
let USER=null,LOCK='';   // LOCK = คลังที่ล็อกไว้ (ว่าง = Role 5+ ดูได้ทุกคลัง)
const lockOf=u=>u.role>=5?'':(u.wh==='C4'?'W4':(u.wh||'-'));
const COL=(o,name)=>{const n=name.replace(/\s/g,'');const k=Object.keys(o).find(x=>x.replace(/\s/g,'')===n);return k?String(o[k]||'').trim():''};
function jwt(t){let b=String(t).split('.')[1].replace(/-/g,'+').replace(/_/g,'/');b+='='.repeat((4-b.length%4)%4);
  const bin=atob(b),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return JSON.parse(new TextDecoder().decode(u))}
async function checkUser(email){
  const us=objs(await fetchT('https://docs.google.com/spreadsheets/d/'+AUTH.usersId+'/export?format=csv&gid='+AUTH.usersGid,30000));
  const u=us.find(x=>COL(x,'E-mail').toLowerCase()===email);
  if(!u)return {ok:false,msg:'อีเมล '+email+' ไม่มีในรายชื่อพนักงาน (ชีท Users) — ติดต่อแอดมิน'};
  const st=COL(u,'Status');if(st&&st.toLowerCase()!=='active')return {ok:false,msg:'บัญชี '+email+' สถานะ "'+st+'" — ติดต่อแอดมิน'};
  return {ok:true,user:{email,name:COL(u,'ชื่อ - สกุล')||email,nick:COL(u,'ชื่อเล่น'),role:parseInt(COL(u,'User Role'))||1,wh:COL(u,'W').toUpperCase()}}}
function loginErr(m){const e=document.getElementById('loginErr');e.textContent=m;e.style.display='block'}
async function onGoogle(resp){
  try{const email=String(jwt(resp.credential).email||'').trim().toLowerCase();

/* ---------- คิดผลต่อบิล ---------- */
function promoOf(r){const k=nPromo(r.promo);return PROMOS.find(p=>p.key===k)||null}
function analyse(r){
  const B=BILLS[r.bill],P=promoOf(r);
  const bcs=P?P.bcs:new Set(PROMOS.flatMap(p=>[...p.bcs]));   // ไม่เจอชื่อโปรตรง = ใช้ของแถมทุกโปรที่ต้องถ่ายรูป
  const giftNames=new Set((P?[P]:PROMOS).map(p=>nName(p.gift||'')).filter(Boolean));
  const a={found:!!B,fromSale:!!(B&&B.src==='sale'),promo:P,sale:{},gift:{},giftLines:[],lines:B?B.lines:[]};
  SALE.forEach(k=>a.sale[k]=0);GIFT.forEach(k=>a.gift[k]=0);
  if(!B){a.status='nobill';return a}
  a.codeOk=String(B.code)===String(r.code);
  B.lines.forEach(l=>{const k=skuKey(l.sku);
    if(k&&l.qty>0&&/\(CS\)/.test(l.unit)) a.sale[k]+=l.qty;
    if(l.free>0){const cnt=l.bc?bcs.has(l.bc):giftNames.has(nName(l.sku));a.giftLines.push({...l,cnt});const g=cnt&&k&&giftKey(k);if(g)a.gift[g]+=l.free}});
  a.got=a.giftLines.reduce((s,l)=>s+(l.cnt?l.free:0),0);
  // ยอดรวมแถมจากชีทสรุป = นับเฉพาะชื่อของแถมโปรถ่ายรูป (ชื่อเดียวกับในบิล DS DC)
  const names=new Set(a.giftLines.filter(l=>l.cnt).map(l=>nName(l.sku)));if(P&&P.gift)names.add(nName(P.gift));
  const G=GSUM[r.bill];a.sum=G?Object.keys(G).reduce((s,k)=>s+(names.has(k)?G[k]:0),0):null;
  a.ref=a.sum!=null?a.sum:a.got;a.refSrc=a.sum!=null?'ยอดรวมแถม':'แถมตามบิล';
  const R=REC[r.bill],d=DRAFT[r.bill];
  a.rec=R||null;
  a.pc=d&&d.pc!==''&&d.pc!=null?+d.pc:null;      // ลงจำนวนแล้วแต่ยังไม่กดบันทึก
  a.flag=!!(d&&d.b==='n');
  a.live=a.pc==null?null:(!a.flag&&a.pc===a.ref);
  a.status=!a.codeOk?'shop':R?(R.ok?'ok':'bad'):a.pc!=null?'draft':'todo';
  return a;
}

async function pushPending(rows){
  rows=rows||Object.values(PENDING);if(!rows.length)return;
  toast('⏳ กำลังบันทึกลงชีท '+rows.length+' บิล…');
  try{await fetch(CFG.GAS_URL,{method:'POST',mode:'no-cors',body:JSON.stringify({action:'save',checker:CHECKER,email:USER.email,rows})})}catch(e){}
  let ok=0;
  for(const w of [2500,5000,8000]){await new Promise(r=>setTimeout(r,w));
    try{const D=objs(await fetchT('https://docs.google.com/spreadsheets/d/'+CFG.dmanId+'/export?format=csv&gid='+CFG.dmanGid+'&t='+Date.now()));
      const st={};D.forEach(r=>{if(r['เลขบิล']&&!st[r['เลขบิล']])st[r['เลขบิล']]=(r['ผลตรวจ']||'').trim()});

}

function compShrink(file){return new Promise((ok,no)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{URL.revokeObjectURL(u);const k=Math.min(1,1600/Math.max(im.naturalWidth,im.naturalHeight)),c=document.createElement('canvas');c.width=Math.round(im.naturalWidth*k);c.height=Math.round(im.naturalHeight*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.85).split(',')[1])};im.onerror=()=>{URL.revokeObjectURL(u);no(new Error('อ่านรูปไม่ได้'))};im.src=u})}
async function compSheet(bill){const D=objs(await fetchT('https://docs.google.com/spreadsheets/d/'+CFG.dmanId+'/export?format=csv&gid='+CFG.dmanGid+'&t='+Date.now(),30000));const r=D.find(x=>x['เลขบิล']===bill);return r?compOf(r):null}

async function compFiles(input){const P=COMP_PICK,files=[...input.files];if(!P||!files.length||COMP_BUSY)return;COMP_BUSY=P.bill;PIC_OPEN.add(P.bill);let okN=0,failN=0;
  try{for(const [i,f] of files.entries()){COMP_MSG='กำลังอัปโหลด '+(i+1)+'/'+files.length;render();
      try{const r=ROWS.find(x=>x.bill===P.bill),before=r.comp[P.kind].length,data=await compShrink(f);
        await fetch(CFG.GAS_URL,{method:'POST',mode:'no-cors',body:JSON.stringify({action:'compUpload',email:USER.email,checker:CHECKER,bill:P.bill,kind:P.kind,data})});
        if(await compWait(P.bill,c=>c[P.kind].length>before))okN++;else failN++}catch(e){failN++;console.warn(e)}}}
  finally{COMP_BUSY='';render();toast(failN?'⚠️ ขึ้นชีทแล้ว '+okN+' รูป · ยังไม่ขึ้น '+failN+' รูป กดโหลดข้อมูลแล้วดูอีกครั้ง':'✅ เพิ่มรูปชดเชยแล้ว '+okN+' รูป')}}
async function compRemove(bill,kind,id){if(!USER||COMP_BUSY||!confirm('เอารูปชดเชยนี้ออกจากบิล '+bill+' ?'))return;COMP_BUSY=bill;COMP_MSG='กำลังเอาออก';render();let ok=false;
  try{await fetch(CFG.GAS_URL,{method:'POST',mode:'no-cors',body:JSON.stringify({action:'compRemove',email:USER.email,bill,kind,id})});ok=await compWait(bill,c=>!c[kind].includes(id))}catch(e){console.warn(e)}
  COMP_BUSY='';render();toast(ok?'เอารูปออกแล้ว':'⚠️ ยังเอาออกไม่สำเร็จ ลองใหม่อีกครั้ง')}

function phHtml(cap,id){

/* โหลดรูปทีละไม่เกิน 3 รูป · Google ตอบ 429 (โหลดถี่เกิน) = รอแล้วลองใหม่ 10/30/60 วิ · ไม่ทับรูปที่โหลดแล้ว */
const IMG_OK={},IMGQ=[];let IMG_RUN=0;
function queueImgs(){document.querySelectorAll('img[data-id]:not([src])').forEach(el=>{const id=el.dataset.id;
  if(IMG_OK[id]){el.src=IMG_OK[id];return}if(!el._q){el._q=1;IMGQ.push(el)}});pumpImg()}
function pumpImg(){while(IMG_RUN<3&&IMGQ.length){const el=IMGQ.shift();if(!el.isConnected)continue;IMG_RUN++;loadImg(el,0)}}
function loadImg(el,n){const id=el.dataset.id,u=thumb(id),t=new Image();
  t.onload=()=>{IMG_RUN--;IMG_OK[id]=u;if(el.isConnected){el.src=u;el.style.display='';const x=el.nextElementSibling;if(x)x.style.display='none'}pumpImg()};
  t.onerror=()=>{const w=[10,30,60][n];const x=el.nextElementSibling;el.style.display='none';
    if(w!==undefined){if(x){x.style.display='flex';x.innerHTML='⏳ Google ให้รอสักครู่ (โหลดรูปถี่เกิน)<br><small>ลองใหม่อัตโนมัติใน '+w+' วิ</small>'}
      setTimeout(()=>loadImg(el,n+1),w*1000);return}
    IMG_RUN--;pumpImg();
    if(x){x.style.display='flex';x.innerHTML='⚠️ รูปนี้โหลดไม่ขึ้น<br><small>Google จำกัดการโหลดรูป หรือไฟล์ยังไม่เปิดแชร์</small><br><a href="https://drive.google.com/file/d/'+id+'/view" target="_blank">เปิดใน Drive</a> · <a href="#" onclick="retryImg(this);return false">ลองโหลดใหม่</a>'}};
  t.src=u}
function retryImg(a){const ph=a.closest('.ph'),el=ph.querySelector('img[data-id]'),x=ph.querySelector('.phx');x.innerHTML='⏳ กำลังโหลด…';el._q=1;IMG_RUN++;loadImg(el,3)}
function zoom(id){document.getElementById('zimg').src=thumb(id,1600);document.getElementById('zoom').style.display='flex'}
function visitNo(){const v={},o={};monthRowsAll().forEach(r=>{v[r.code]=(v[r.code]||0)+1;o[r.bill]=v[r.code]});return o}
function whyOf(a){if(a.flag)return 'รูปบิลไม่ใช่ใบนี้';const d=a.pc-a.ref;return d<0?'แถมในรูปขาด '+(-d)+' ชิ้น (รูป '+a.pc+' / '+a.refSrc+' '+a.ref+')':d>0?'แถมในรูปเกิน '+d+' ชิ้น (รูป '+a.pc+' / '+a.refSrc+' '+a.ref+')':''}
function giftHtml(a){return a.giftLines.length?a.giftLines.map(l=>l.cnt?'🎁 '+esc(l.sku)+' × <b>'+l.free+'</b>':'<span style="color:#9aa1b1">'+esc(l.sku)+' × '+l.free+' (โปรอื่น ไม่ต้องถ่ายรูป — ไม่นับ)</span>').join('<br>'):'ไม่มีของแถมในบิล'}
function renderBills(rs){

    if(a.rec){const R=a.rec;   // บันทึกแล้ว = บรรทัดเดียว
      return '<div class="bill saved" id="'+id+'">'+head+'<div style="padding:10px 14px;display:flex;gap:14px;flex-wrap:wrap;align-items:center">'+

        '<span style="color:var(--mut);font-size:13px">'+(R.ok?'อนุมัติ':'ตรวจสอบก่อน')+' โดย '+esc(R.by)+(R.at?' · '+(R.fromSheet?esc(R.at):fmtD(new Date(R.at))):'')+'</span>'+

    if(a.status==='draft'){const d=DRAFT[r.bill],live=a.live;   // ลงแล้ว รอบันทึก = บรรทัดเดียว แก้ตัวเลขได้

/* สรุปรายร้าน = หน้าตาเดียวกับฟอร์ม */
function shopSummary(){
  const shops={},order=[];
  monthRows().forEach(r=>{const a=anOf(r);if(!a.found)return;
    if(!shops[r.code]){shops[r.code]={code:r.code,shop:r.shop,wh:r.wh,visits:[]};order.push(r.code)}
    shops[r.code].visits.push({r,a})});
  return order.map(c=>shops[c]);
}

      const R=v.a.rec;ts+=v.a.got;tg+=R?R.pc:0;if(v.a.status==='todo')todo++;else if(v.a.status!=='ok')bad++;
      const col=v.a.status==='ok'?'var(--ok)':v.a.status==='todo'?'var(--warn)':'var(--bad)';

const IMG_MEM={};let IMG_POOL=8;
async function imgB64(id){if(IMG_MEM[id])return IMG_MEM[id];const c=await idbGet('img_'+id);if(c)return IMG_MEM[id]=c;
  for(const w of [0,4000,12000]){if(w)await new Promise(r=>setTimeout(r,w));const d=await imgB64Once(id);if(d){IMG_MEM[id]=d;idbSet('img_'+id,d);return d}}return null}
async function poolRun(items,n,fn){let i=0;await Promise.all(Array.from({length:Math.min(n,items.length)},async()=>{while(i<items.length){const k=i++;await fn(items[k],k)}}))}
async function imgB64Once(id){try{const r=await fetch(thumb(id,500));if(!r.ok)return null;const b=await r.blob();
  return await new Promise(ok=>{const f=new FileReader();f.onload=()=>ok(f.result);f.readAsDataURL(b)})}catch(e){return null}}
function colL(n){let s='';while(n>0){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=Math.floor((n-1)/26)}return s}

      if(v.a.status!=='ok')bad.push('ครั้งที่ '+(n+1)+': '+stTxt(v.a));
    });
    for(let j=0;j<10;j++){const L=[0,1,2,3,4,5,6].map(n=>colL(6+n*10+j)+row).join('+');R.getCell(76+j).value={formula:L}}
    R.getCell(C0).value=s.wh;R.getCell(C0+1).value=s.visits.length;R.getCell(C0+2).value=bad.join('\n')||'ผ่าน';
    R.getCell(C0+3).value=s.visits.map(v=>v.r.bill).join('\n');
    for(let c=1;c<=C0+3;c++){const cell=R.getCell(c);cell.border=B;cell.alignment={vertical:'middle',horizontal:c<=3||c>=C0?'left':'center',wrapText:true};cell.font={size:10}}
    if(bad.length)R.getCell(C0+2).font={size:10,bold:true,color:{argb:'FFD64545'}};
    for(const [n,v] of s.visits.slice(0,7).entries()){
      const put=(d,col,i)=>{const ext=/png/.test(d.slice(0,30))?'png':'jpeg';
        ws.addImage(wb.addImage({base64:d,extension:ext}),{tl:{nativeCol:col,nativeColOff:(IMG_GAP+i*(IMG_W+IMG_GAP))*EMU,nativeRow:row-1,nativeRowOff:4*EMU},ext:{width:IMG_W,height:IMG_H}})};
      v.imgP.forEach((d,i)=>put(d,P0-1+n*2,i));
      v.imgB.forEach((d,i)=>put(d,P0-1+n*2+1,i));
    }
    row++;
  }
  const T=ws.getRow(row);T.getCell(1).value='รวม';ws.mergeCells(row,1,row,2);T.getCell(3).value=S.length+' ร้าน';
  for(let c=6;c<86;c++){T.getCell(c).value={formula:'SUM('+colL(c)+'6:'+colL(c)+(row-1)+')'};}
  for(let c=1;c<86;c++){const cell=T.getCell(c);cell.font={bold:true,size:10};cell.border=B;cell.alignment={horizontal:'center'};cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFF3EBD3'}}}
  const w3=wb.addWorksheet('ยังไม่มีรูป');
  w3.columns=[{header:'วันที่บิล',width:11},{header:'เลขบิล',width:17},{header:'รหัสร้าน',width:12},{header:'ร้าน',width:30},{header:'คลัง',width:6},{header:'เซลล์',width:26},{header:'แถม (ชิ้น)',width:10},{header:'ขนส่ง',width:26}];
  w3.getRow(1).eachCell(c=>{c.font={bold:true,color:{argb:'FFFFFFFF'}};c.fill={type:'pattern',pattern:'solid',fgColor:{argb:navy}}});
  missRows().forEach(g=>w3.addRow([g.date?fmtDay(g.date)+'/'+(g.date.getFullYear()+543):'',g.bill,g.code,g.shop,g.wh,g.slmn,g.qty,driverOf(g)]));
  const w2=wb.addWorksheet('ตรวจรายบิล');
  w2.columns=[{header:'วันเวลา',width:16},{header:'เลขบิล',width:17},{header:'รหัสร้าน',width:12},{header:'ร้าน',width:26},{header:'ที่อยู่',width:26},{header:'คลัง',width:6},{header:'คนขับ',width:20},
    {header:'ของแถม (โปรถ่ายรูป)',width:36},{header:'แถมตามบิล',width:10},{header:'ยอดรวมแถม',width:10},{header:'แถมในรูป (ชิ้น)',width:10},{header:'ผล',width:30},{header:'ผู้ตรวจ',width:16},{header:'เวลาตรวจ',width:14},{header:'รูปสินค้า',width:10},{header:'รูปบิล',width:10}];
  w2.getRow(1).eachCell(c=>{c.font={bold:true,color:{argb:'FFFFFFFF'}};c.fill={type:'pattern',pattern:'solid',fgColor:{argb:navy}}});
  monthRows().forEach(r=>{const a=anOf(r),R=a.rec;
    const x=w2.addRow([fmtD(r.ts),r.bill,r.code,r.shop,ADDR[r.code]||'',r.wh,r.driver,(a.giftLines||[]).filter(l=>l.cnt).map(l=>l.sku+' ×'+l.free).join('\n'),a.found?a.got:'',a.sum==null?'':a.sum,R?R.pc:'',stTxt(a),R?R.by:'',R?fmtD(new Date(R.at)):'',
      {text:'ดูรูป',hyperlink:'https://drive.google.com/file/d/'+r.pPic+'/view'},{text:'ดูรูป',hyperlink:'https://drive.google.com/file/d/'+r.bPic+'/view'}]);
    x.getCell(8).alignment={wrapText:true,vertical:'top'};if(a.status!=='ok')x.getCell(12).font={bold:true,color:{argb:a.status==='todo'?'FFC27C0E':'FFD64545'}};
  });
  const buf=await wb.xlsx.writeBuffer();
  const el=document.createElement('a');el.href=URL.createObjectURL(new Blob([buf]));el.download='ฟอร์มกิจกรรมรถเร่เอเย่นต์ '+ymLabel(m)+(WH==='all'?' ทุกคลัง':' คลัง '+WH)+'.xlsx';el.click();
  st.textContent='✅ Export แล้ว · '+S.length+' ร้าน'+(whL?' · คลัง'+whL:'')+(imgFail?' · ⚠️ โหลดรูปไม่ได้ '+imgFail+' รูป กด Export ใหม่อีกครั้ง':'');
  }catch(e){st.textContent='❌ Export ไม่สำเร็จ: '+e.message;console.error(e)}
  btn.disabled=false;
}
/* ปุ่มอัปเดต: อ่านไฟล์ตัวเองจาก Pages (ไม่ใช้แคช) เทียบ VERSION · เช็คทุก 5 นาที + ตอนกลับมาที่แอป
   ⚠️ ต้อง bump const VERSION ทุกครั้งที่ deploy ไม่งั้นปุ่มไม่ขึ้น */
let NEW_VER='',updDismissed='';
async function checkUpdate(){try{const r=await fetch(location.pathname+'?_='+Date.now(),{cache:'no-store'});if(!r.ok)return;
  const m=(await r.text()).match(/const VERSION='([^']+)'/);if(!m||m[1]===VERSION)return;NEW_VER=m[1];if(updDismissed===NEW_VER)return;
  document.getElementById('updVer').textContent='v'+NEW_VER;document.getElementById('updBar').classList.add('on')}catch(e){}}
function doUpdate(){document.getElementById('updBar').classList.remove('on');location.replace(location.pathname+'?v='+encodeURIComponent(NEW_VER||Date.now()))}
function dismissUpdate(){updDismissed=NEW_VER;document.getElementById('updBar').classList.remove('on')}
setTimeout(checkUpdate,4000);setInterval(checkUpdate,5*60*1000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkUpdate()});
boot();
</script>
