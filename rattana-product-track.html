<!-- ══════════════════════════════════════════════════════════════════════════
     RK-BASE · Rattana UI Kit
     วางไว้ใน <head> "ก่อน" CSS อื่นของแอป (ให้ CSS แอปทับได้ถ้าต้องการ)
     ให้: บันได z-index กลาง · helper "บรรทัดเดียว" · sticky พื้นทึบ · RK.audit()
     กฎอ้างอิง: CLAUDE.md § UI Build Standards ข้อ 1️⃣ + 6️⃣
     ══════════════════════════════════════════════════════════════════════════ -->
<style id="rk-base">
:root{
  /* ── บันได z-index กลาง — ใช้ตัวแปรเท่านั้น ห้ามใส่เลขมั่วรายจุด ── */
  --rk-z-sticky-sub: 90;    /* แถบ tab / ฟิลเตอร์รอง (ชั้นที่ 2 ลงมา) */
  --rk-z-sticky:     100;   /* header หลัก */
  --rk-z-dropdown:   1000;  /* dropdown / popover / เมนู */
  --rk-z-modal:      2000;  /* modal / bottom sheet / scanner */
  --rk-z-toast:      3000;  /* toast / snackbar */

  --rk-navy:#0d1b3e; --rk-gold:#c9a84c;
  --rk-surface:   var(--card-bg, #ffffff);
  --rk-surface-2: var(--bg, #f1f5f9);
  --rk-text:      var(--text, #0f172a);
  --rk-muted:     var(--muted, #64748b);
  --rk-line:      var(--border, #e2e8f0);
  --rk-radius: 12px;

  --rk-hdr-h: 56px;   /* ⚠️ ตั้งให้ตรงความสูง header จริงของแอป — sticky ชั้น 2 ใช้ค่านี้เป็น top */
}

/* ── ข้อ 1️⃣ บรรทัดเดียว (ใช้ได้ทุกที่: label · การ์ด · ตัวเลือก) ── */
.rk-1line{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rk-row{display:flex;align-items:center;gap:8px;min-width:0}
.rk-row>*{min-width:0}                    /* ❗ ขาดบรรทัดนี้ ellipsis ใน flex จะไม่ทำงาน */
.rk-grow{flex:1 1 auto;min-width:0}
.rk-nogrow{flex:0 0 auto}
.rk-scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:thin}

/* ── ข้อ 6️⃣ sticky ที่ "พื้นทึบ + ไม่ทับ dropdown" ── */
.rk-sticky{
  position:sticky; top:0; z-index:var(--rk-z-sticky);
  background:var(--rk-surface);                       /* ทึบ 100% ห้าม transparent/rgba */
  padding-top:env(safe-area-inset-top);
  box-shadow:0 1px 0 var(--rk-line);
}
.rk-sticky-sub{
  position:sticky; top:var(--rk-hdr-h); z-index:var(--rk-z-sticky-sub);
  background:var(--rk-surface-2);
  box-shadow:0 1px 0 var(--rk-line);
}
.rk-sticky-bottom{
  position:sticky; bottom:0; z-index:var(--rk-z-sticky-sub);
  background:var(--rk-surface);
  padding-bottom:env(safe-area-inset-bottom);
  box-shadow:0 -1px 0 var(--rk-line);
}
/* ❗ ห้าม overflow:hidden / auto บน parent ของ sticky หรือของ dropdown — จะตัด popup ขาด */
</style>

<script id="rk-base-js">
window.RK = window.RK || {};

/* ── helper ── */
RK.esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
RK.num = v => { const n = parseFloat(String(v==null?'':v).replace(/,/g,'')); return isFinite(n) ? n : 0; };
RK.debounce = (fn, ms=120) => { let t; return function(){ clearTimeout(t); const a=arguments, s=this; t=setTimeout(()=>fn.apply(s,a), ms); }; };

/* ── ย่อตัวเลขให้อยู่ในบรรทัดเดียว (ข้อ 1️⃣) ── */
RK.shortNum = n => {
  n = RK.num(n); const a = Math.abs(n);
  if (a >= 1e9) return (n/1e9).toFixed(a>=1e10?0:1).replace(/\.0$/,'') + 'B';
  if (a >= 1e6) return (n/1e6).toFixed(a>=1e7?0:1).replace(/\.0$/,'') + 'M';
  if (a >= 1e4) return (n/1e3).toFixed(0) + 'K';
  return n.toLocaleString('th-TH', {maximumFractionDigits:0});
};

/* ══════════════════════════════════════════════════════════════════════════
   RK.audit() — เรียกใน console ก่อน push (ผูกกับ Pre-Deploy Bug Check ข้อ 5-7)
   ตรวจ 3 อย่างบนหน้าที่เปิดอยู่จริง:
     1. sticky/fixed ที่พื้นหลังใส  → เนื้อหาวิ่งทะลุ
     2. parent ที่ overflow ตัด dropdown / z-index ต่ำกว่า sticky ตัวอื่น
     3. ข้อความที่ตกมากกว่า 1 บรรทัดที่ความกว้างจอปัจจุบัน (ย่อจอเป็น 375px ก่อนเรียก)
   ══════════════════════════════════════════════════════════════════════════ */
RK.audit = function(opts){
  opts = opts || {};
  const oneLineSel = opts.oneLineSel || 'button,label,option,.chip,.tab,.badge,.pill,th,.rk-1line,[data-1line]';
  const out = {transparentSticky:[], clipRisk:[], wrapped:[], zTop:[]};
  const own = el => el.closest('#rkScan,.rk-dd,.rk-dd-backdrop');     /* ตัว kit เอง — ไม่ต้องเตือน */
  const alpha0 = c => {
    if (!c || c === 'transparent') return true;
    const m = /rgba?\(([^)]+)\)/.exec(c); if (!m) return false;
    const p = m[1].split(','); return p.length > 3 && parseFloat(p[3]) < 0.9;
  };
  /* นับบรรทัดจริงของ "ข้อความในตัวมันเอง" (ไม่นับลูกที่เป็น element) — padding ไม่หลอก */
  const lineCount = el => {
    const rng = document.createRange(); let n = 0;
    el.childNodes.forEach(nd => {
      if (nd.nodeType === 3 && nd.textContent.trim()){
        rng.selectNodeContents(nd);
        n = Math.max(n, rng.getClientRects().length);
      }
    });
    return n;
  };

  document.querySelectorAll('*').forEach(el=>{
    if (own(el)) return;
    const cs = getComputedStyle(el);
    if (cs.position==='sticky' || cs.position==='fixed'){
      if (alpha0(cs.backgroundColor) && !(cs.backdropFilter||'').includes('blur'))
        out.transparentSticky.push({el, bg:cs.backgroundColor, z:cs.zIndex});
      if (cs.position==='sticky' && cs.zIndex!=='auto' && +cs.zIndex >= 1000)
        out.zTop.push({el, z:cs.zIndex});   /* sticky ที่สูงถึงชั้น dropdown → จะไปทับเมนู */
    }
  });

  document.querySelectorAll('[data-rk-menu-anchor],.rk-dd-btn,select').forEach(el=>{
    if (own(el)) return;
    let p = el.parentElement;
    while (p && p!==document.body){
      const cs = getComputedStyle(p);
      if (/hidden|auto|scroll/.test(cs.overflow + cs.overflowX + cs.overflowY) && cs.position!=='static')
        { out.clipRisk.push({trigger:el, clippedBy:p}); break; }
      p = p.parentElement;
    }
  });

  document.querySelectorAll(oneLineSel).forEach(el=>{
    if (own(el) || !el.offsetParent || !el.textContent.trim()) return;
    const n = lineCount(el);
    if (n > 1) out.wrapped.push({el, lines:n, text:el.textContent.trim().slice(0,40)});
  });

  console.group('%cRK.audit @ ' + window.innerWidth + 'px', 'font-weight:700');
  console.log('❌ sticky พื้นใส:', out.transparentSticky.length, out.transparentSticky);
  console.log('⚠️ dropdown เสี่ยงโดนตัด/ทับ:', out.clipRisk.length, out.clipRisk);
  console.log('⚠️ sticky z-index ≥1000 (ทับ dropdown):', out.zTop.length, out.zTop);
  console.log('❌ ตกบรรทัด (>1 บรรทัด):', out.wrapped.length, out.wrapped);
  console.groupEnd();
  return out;
};
</script>
<style>
/* ═══ ติดตามสินค้า — tokens (ปรับผ่านแผง rk-tweak ได้: ?tweak=1 หรือ Ctrl+Shift+T) ═══ */
:root{
  --font:'IBM Plex Sans Thai',system-ui,-apple-system,'Segoe UI',sans-serif;
  --bg:#eef1f6; --surface:#ffffff; --surface-2:#f5f7fb; --line:#dde3ed; --line-strong:#c2ccdb;
  --text:#0f1b33; --muted:#55627a;
  --navy:#0d1b3e; --navy-2:#1b2e5c; --on-navy:#ffffff; --on-navy-muted:#c3cde2;
  --gold:#c9a84c; --gold-hi:#e8c86a; --gold-ink:#7a5f14; --gold-soft:#f6eed6;
  --pri-bg:#0d1b3e; --pri-fg:#ffffff;
  --tab-on-bg:#0d1b3e; --tab-on-fg:#ffffff;
  --st-wait:#b4400f; --st-wait-bg:#fcebe2;
  --st-work:#1d4ed8; --st-work-bg:#e6ecfd;
  --st-done:#0f766e; --st-done-bg:#ddf2ee;
  --st-fail:#596273; --st-fail-bg:#e8ebf0;
  --danger:#b42318; --danger-bg:#fdecea;
  --warn-ink:#7c5300; --warn-bg:#fff3d1;
  --fs-xs:12px; --fs-sm:13px; --fs-md:15px; --fs-lg:17px; --fs-xl:20px; --fs-num:28px;
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px;
  --pad-page:16px; --pad-card:14px; --gap-list:8px;
  --r-sm:8px; --r-md:12px; --r-lg:18px; --r-pill:999px;
  --by-card-min:148px; --pad-by:12px;
  --sheet-w:560px; --sheet-max-h:860px; --sheet-gap:12px;
  --shadow-1:0 1px 2px rgba(13,27,62,.06),0 4px 14px rgba(13,27,62,.05);
  --shadow-2:0 18px 48px rgba(4,8,20,.28);
  --hdr-h:56px; --tabs-h:48px;
  --z-lightbox:2100;
  --card-bg:var(--surface); --border:var(--line);
  --rk-hdr-h:calc(var(--hdr-h) + env(safe-area-inset-top));
}
:root[data-theme="dark"]{
  --bg:#0a1020; --surface:#111a2e; --surface-2:#172238; --line:#26324d; --line-strong:#3a4866;
  --text:#e7ecf6; --muted:#a3afc5;
  --gold-ink:#e8c86a; --gold-soft:#2b2511;
  --pri-bg:#e8c86a; --pri-fg:#0d1b3e;
  --tab-on-bg:#e8c86a; --tab-on-fg:#0d1b3e;
  --st-wait:#ff9f73; --st-wait-bg:#3a1d10;
  --st-work:#98b6ff; --st-work-bg:#17264a;
  --st-done:#62d6c4; --st-done-bg:#0f2f2b;
  --st-fail:#b6bfce; --st-fail-bg:#242c3b;
  --danger:#ff8f85; --danger-bg:#3b1613;
  --warn-ink:#ffd27a; --warn-bg:#33270b;
  --shadow-1:0 1px 2px rgba(0,0,0,.45);
  --shadow-2:0 18px 48px rgba(0,0,0,.6);
  color-scheme:dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:var(--fs-md);line-height:1.45;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
::selection{background:var(--gold-hi);color:#0d1b3e}
input,textarea,button{font:inherit;color:inherit}
input,textarea{caret-color:var(--gold)}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.one{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
[hidden]{display:none!important}
html{scrollbar-color:var(--line-strong) transparent;scrollbar-width:thin}
svg.i{width:18px;height:18px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* ── login ── */
#login{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px var(--pad-page);background:var(--navy)}
.lg-card{width:min(380px,100%);background:var(--surface);border-radius:var(--r-lg);padding:28px 22px 22px;box-shadow:var(--shadow-2);text-align:center}
.lg-card .mk{width:64px;height:64px;margin:0 auto 14px;display:block;border-radius:15px}
.lg-card h1{margin:0;font-size:24px;font-weight:700;letter-spacing:-.01em}
.lg-card .co{margin:2px 0 0;color:var(--gold-ink);font-weight:600;font-size:var(--fs-sm)}
.lg-card .tg{margin:14px 0 18px;color:var(--muted);font-size:var(--fs-sm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg-card .rule{height:1px;background:var(--line);margin:18px 0 14px}
.g-wrap{display:flex;justify-content:center;min-height:44px}
#loginStatus{margin-top:12px;color:var(--muted);font-size:var(--fs-sm);min-height:20px}
#loginError{display:none;margin-top:12px;padding:10px 12px;border-radius:var(--r-sm);background:var(--danger-bg);color:var(--danger);font-size:var(--fs-sm)}
.lg-ver{color:var(--muted);font-size:var(--fs-xs)}

/* ── header ── */
.hdr{position:sticky;top:0;z-index:var(--rk-z-sticky);background:var(--navy);color:var(--on-navy);
  padding-top:env(safe-area-inset-top);box-shadow:inset 0 -2px 0 var(--gold)}
.hdr-in{height:var(--hdr-h);max-width:1240px;margin:0 auto;padding:0 var(--pad-page);display:flex;align-items:center;gap:10px}
.brand{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:10px}
.brand svg{width:32px;height:32px;flex:0 0 auto;border-radius:8px}
.brand-t{min-width:0;font-weight:700;font-size:var(--fs-lg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ver{flex:0 0 auto;font-size:var(--fs-xs);font-weight:700;color:#0d1b3e;background:var(--gold);border-radius:var(--r-pill);padding:1px 8px}
.who{flex:0 1 auto;min-width:0;max-width:200px;display:flex;align-items:center;gap:8px;border:0;background:var(--navy-2);color:var(--on-navy);
  border-radius:var(--r-pill);padding:4px 10px 4px 4px;height:36px}
.who .av{flex:0 0 auto;width:28px;height:28px;border-radius:50%;background:var(--gold);color:#0d1b3e;font-weight:700;font-size:var(--fs-sm);display:flex;align-items:center;justify-content:center}
.who .nm{min-width:0;font-size:var(--fs-sm);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hub{flex:0 0 auto;display:flex;align-items:center;gap:4px;height:36px;padding:0 12px 0 9px;border-radius:var(--r-pill);
  background:var(--gold);color:#0d1b3e;font-weight:700;font-size:var(--fs-sm);text-decoration:none}
.hub svg.i{width:16px;height:16px;stroke-width:2.4}
@media (max-width:440px){ .who{padding-right:4px} .who .nm{display:none} }
.loadbar{position:absolute;left:0;right:0;bottom:0;height:2px;overflow:hidden;opacity:0;transition:opacity .2s}
.loadbar.on{opacity:1}
.loadbar::after{content:'';position:absolute;top:0;bottom:0;width:40%;background:var(--gold-hi);animation:lb 1.1s cubic-bezier(.16,1,.3,1) infinite}
@keyframes lb{from{left:-40%}to{left:100%}}

/* ── tabs (แท็บที่อยู่ = พื้นทึบ navy ตัวขาว) ── */
.tabs{position:sticky;top:calc(var(--hdr-h) + env(safe-area-inset-top));z-index:var(--rk-z-sticky-sub);background:var(--surface);border-bottom:1px solid var(--line)}
.tabs-in{max-width:1240px;margin:0 auto;height:var(--tabs-h);padding:6px var(--pad-page);display:flex;gap:6px}
.tab{flex:1 1 auto;min-width:0;border:0;border-radius:var(--r-sm);background:transparent;color:var(--muted);font-weight:600;font-size:var(--fs-md);
  display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;overflow:hidden;padding:0 8px}
.tab:hover{background:var(--surface-2);color:var(--text)}
.tab.on{background:var(--tab-on-bg);color:var(--tab-on-fg)}
.tab .t{min-width:0;overflow:hidden;text-overflow:ellipsis}
.tab .c{flex:0 0 auto;font-size:var(--fs-xs);font-weight:700;border-radius:var(--r-pill);padding:0 7px;line-height:18px;background:var(--st-wait-bg);color:var(--st-wait)}
.tab.on .c{background:var(--gold);color:#0d1b3e}
@media (min-width:900px){ .tab{flex:0 0 auto;padding:0 20px} }

main{max-width:1240px;margin:0 auto;padding:var(--sp-4) var(--pad-page) calc(40px + env(safe-area-inset-bottom))}
.pg[hidden]{display:none}

/* ── shared bits ── */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--shadow-1);padding:var(--pad-card);min-width:0}
.sec-h{display:flex;align-items:center;gap:8px;min-width:0;margin:0 0 12px}
.sec-h h2{flex:1 1 auto;min-width:0;margin:0;font-size:var(--fs-md);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:520px){ .sec-h.wrap{flex-wrap:wrap} .sec-h.wrap .chiprow{flex:1 0 100%} }
.sec-h .aux{flex:0 0 auto;font-size:var(--fs-sm);color:var(--muted);white-space:nowrap}
.lnk{flex:0 0 auto;border:0;background:transparent;color:var(--gold-ink);font-weight:600;font-size:var(--fs-sm);padding:4px 2px;white-space:nowrap}
.lnk:hover{text-decoration:underline;text-underline-offset:3px}
.chiprow{display:flex;gap:6px;min-width:0;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chiprow::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:var(--r-pill);border:1px solid var(--line);
  background:var(--surface);color:var(--text);font-size:var(--fs-sm);font-weight:500;white-space:nowrap}
.chip:hover{border-color:var(--line-strong)}
.chip.on{background:var(--tab-on-bg);border-color:var(--tab-on-bg);color:var(--tab-on-fg)}
.chip .n{font-weight:700;font-variant-numeric:tabular-nums}
.chip.hot:not(.on){border-color:var(--st-wait);color:var(--st-wait);background:var(--st-wait-bg)}
.mrow.hotrow .nm span{color:var(--st-wait)}
.dot{flex:0 0 auto;width:8px;height:8px;border-radius:50%;background:currentColor}
.pill{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:var(--r-pill);font-size:var(--fs-xs);font-weight:600;white-space:nowrap;flex:0 0 auto}
.pill.wait{color:var(--st-wait);background:var(--st-wait-bg)} .pill.work{color:var(--st-work);background:var(--st-work-bg)}
.pill.done{color:var(--st-done);background:var(--st-done-bg)} .pill.fail{color:var(--st-fail);background:var(--st-fail-bg)}
.whc{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;min-width:32px;height:20px;padding:0 6px;border-radius:5px;
  font-size:var(--fs-xs);font-weight:700;letter-spacing:.02em;background:var(--c);color:var(--fg)}
.empty{padding:28px 12px;text-align:center;color:var(--muted);font-size:var(--fs-sm)}
.empty b{display:block;color:var(--text);font-size:var(--fs-md);margin-bottom:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;padding:0 16px;border-radius:var(--r-md);border:1px solid var(--line-strong);
  background:var(--surface);color:var(--text);font-weight:600;font-size:var(--fs-sm);white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--pri-bg);color:var(--pri-fg);border-color:var(--pri-bg)}
.btn.pri:hover{filter:brightness(1.12)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.err-box{padding:12px 14px;border-radius:var(--r-md);background:var(--danger-bg);color:var(--danger);font-size:var(--fs-sm);margin-bottom:12px;display:flex;gap:10px;align-items:center;min-width:0}
.err-box .one{flex:1 1 auto}

/* ── status bars ── */
.bar{display:flex;height:10px;border-radius:var(--r-pill);overflow:hidden;background:var(--surface-2);min-width:0}
.bar i{display:block;height:100%}
.bar .wait{background:var(--st-wait)} .bar .work{background:var(--st-work)} .bar .done{background:var(--st-done)} .bar .fail{background:var(--st-fail)}

/* ── dashboard ── */
.dash{display:grid;grid-template-columns:minmax(0,1fr);gap:var(--sp-3)}
@media (min-width:960px){ .dash{grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr)} .dash .span2{grid-column:1 / -1} }
.dash-col{display:grid;gap:var(--sp-3);align-content:start;min-width:0}
.stbar{height:14px}
.stleg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}
@media (max-width:520px){ .stleg{grid-template-columns:repeat(2,minmax(0,1fr))} }
.stcell{min-width:0;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);padding:10px 12px;text-align:left;display:block}
.stcell:hover{border-color:var(--line-strong);background:var(--surface-2)}
.stcell .l{display:flex;align-items:center;gap:6px;min-width:0;font-size:var(--fs-sm);color:var(--muted);white-space:nowrap}
.stcell .l span{min-width:0;overflow:hidden;text-overflow:ellipsis}
.stcell .n{font-size:var(--fs-num);font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums;margin-top:2px}
.stcell.wait .dot{color:var(--st-wait)} .stcell.work .dot{color:var(--st-work)} .stcell.done .dot{color:var(--st-done)} .stcell.fail .dot{color:var(--st-fail)}
.dsum{margin-top:12px;font-size:var(--fs-sm);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dsum b{color:var(--text);font-variant-numeric:tabular-nums}
.rows{display:flex;flex-direction:column}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(60px,110px) auto;align-items:center;gap:10px;padding:9px 2px;border-top:1px solid var(--line);
  min-width:0;background:transparent;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%;color:inherit}
.mrow:first-child{border-top:0}
button.mrow:hover{background:var(--surface-2)}
.mrow.two{grid-template-columns:minmax(0,1fr) auto}
.mrow .nm{min-width:0;display:flex;align-items:center;gap:8px;font-size:var(--fs-sm);font-weight:600}
.mrow .nm span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .nx{font-size:var(--fs-sm);color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums;text-align:right}
.mrow .nx b{color:var(--st-wait)}
.mrow.on{background:var(--gold-soft)}

/* ── item row ── */
.items{display:flex;flex-direction:column;gap:var(--gap-list)}
.it{display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;align-items:center;padding:10px;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-md);text-align:left;width:100%;min-width:0;color:inherit}
.it:hover{border-color:var(--line-strong);box-shadow:var(--shadow-1)}
.it-th{width:52px;height:52px;border-radius:var(--r-sm);background:var(--surface-2);object-fit:cover;display:block}
.it-b{min-width:0;display:flex;flex-direction:column;gap:3px}
.it-l{display:flex;align-items:center;gap:6px;min-width:0}
.it-l>.one{flex:1 1 auto}
.it-n{font-weight:600;font-size:var(--fs-md)}
.it-m{font-size:var(--fs-sm);color:var(--muted)}
.it-a{flex:0 0 auto;font-size:var(--fs-xs);color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.it-a.late{color:var(--st-wait);font-weight:600}

/* ── report ── */
.rp-bar{position:sticky;top:calc(var(--hdr-h) + var(--tabs-h) + env(safe-area-inset-top));z-index:calc(var(--rk-z-sticky-sub) - 1);
  background:var(--bg);margin:calc(-1 * var(--sp-4)) calc(-1 * var(--pad-page)) var(--sp-3);padding:10px var(--pad-page) 8px;border-bottom:1px solid var(--line)}
.rp-bar-in{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.rp-bar .rk-search{background:var(--surface)}
.chipset{display:contents}
.vsep{flex:0 0 1px;align-self:stretch;margin:4px 2px;background:var(--line-strong)}
.ddb{max-width:170px;font-weight:600;gap:4px}
.ddb.set{border-color:var(--tab-on-bg);background:var(--tab-on-bg);color:var(--tab-on-fg)}
.ddb span{min-width:0;overflow:hidden;text-overflow:ellipsis}
.ddb .cv{flex:0 0 auto;opacity:.7}
/* สรุปผู้รับผิดชอบ = กล่อง grid · มือถือ 2 คอลัมน์ · จอกว้างเรียงได้ถึง 7 กล่องต่อแถว */
.bygrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--by-card-min),1fr));gap:var(--gap-list)}
.byc{min-width:0;display:flex;flex-direction:column;gap:8px;padding:var(--pad-by);border:1px solid var(--line);border-radius:var(--r-md);
  background:var(--surface);text-align:left;color:inherit}
.byc:hover{border-color:var(--line-strong);background:var(--surface-2)}
.byc.on{border-color:var(--gold);background:var(--gold-soft)}
.byc .nm{min-width:0;font-weight:700;font-size:var(--fs-sm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.byc .bar{height:8px}
.byc .st{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 8px;font-size:var(--fs-sm);line-height:1.35}
.byc .k{min-width:0;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.byc .v{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.byc .v.w{color:var(--st-wait)}
.byc .of{color:var(--muted);font-weight:400}
.lt{display:flex;align-items:center;gap:8px;min-width:0;margin:var(--sp-4) 2px var(--sp-2)}
.lt .cnt{flex:1 1 auto;min-width:0;font-size:var(--fs-sm);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lt .cnt b{color:var(--text)}
.grp{margin-top:var(--sp-2)}
.grp-h{display:flex;align-items:center;gap:8px;min-width:0;width:100%;border:0;background:transparent;padding:8px 2px;text-align:left;color:inherit}
.grp-h .cv{flex:0 0 auto;transition:transform .18s cubic-bezier(.16,1,.3,1);color:var(--muted)}
.grp.closed .grp-h .cv{transform:rotate(-90deg)}
.grp-h .one{flex:1 1 auto;font-weight:700;font-size:var(--fs-sm)}
.grp-h .k{flex:0 0 auto;font-size:var(--fs-xs);font-weight:700;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-pill);padding:0 8px;line-height:20px}
.grp.closed .items{display:none}

/* ── form ── */
.form{display:grid;gap:var(--sp-3);max-width:720px;margin:0 auto}
.fh{display:flex;align-items:baseline;gap:8px;min-width:0;margin:0 0 10px}
.fh h2{margin:0;font-size:var(--fs-md);font-weight:700;white-space:nowrap}
.fh .opt{font-size:var(--fs-xs);color:var(--muted);white-space:nowrap}
.fh .req{font-size:var(--fs-xs);color:var(--st-wait);font-weight:600;white-space:nowrap}
.bc-row{display:flex;gap:8px;min-width:0}
.bc-in{flex:1 1 auto;min-width:0;display:flex;align-items:center;border:1.5px solid var(--line-strong);border-radius:var(--r-md);background:var(--surface);padding:0 4px 0 12px}
.bc-in:focus-within{border-color:var(--gold)}
.bc-in input{flex:1 1 auto;min-width:0;border:0;background:transparent;outline:none;font-size:19px;font-weight:600;letter-spacing:.02em;padding:11px 0;font-variant-numeric:tabular-nums}
.bc-in input::placeholder{font-size:var(--fs-md);font-weight:400;letter-spacing:0;color:var(--muted)}
.bc-x{flex:0 0 auto;width:36px;height:36px;border:0;border-radius:var(--r-sm);background:transparent;color:var(--muted)}
.btn-scan{flex:0 0 auto;display:flex;align-items:center;gap:6px;height:52px;padding:0 16px;border:0;border-radius:var(--r-md);background:var(--pri-bg);color:var(--pri-fg);font-weight:700}
.btn-scan svg.i{width:22px;height:22px}
.pd{margin-top:12px}
.pd-card{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;align-items:start;padding:12px;border-radius:var(--r-md);background:var(--surface-2);border:1px solid var(--line)}
.pd-img{width:64px;height:64px;border-radius:var(--r-sm);object-fit:cover;background:var(--surface);display:block}
.pd-b{min-width:0;display:flex;flex-direction:column;gap:2px}
.pd-n{font-weight:700;font-size:var(--fs-md)}
.pd-u{font-size:var(--fs-sm);color:var(--gold-ink);font-weight:600}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;margin-top:8px;font-size:var(--fs-sm)}
.kv dt{color:var(--muted);white-space:nowrap}
.kv dd{margin:0;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.note-box{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:var(--r-md);font-size:var(--fs-sm);min-width:0}
.note-box.warn{background:var(--warn-bg);color:var(--warn-ink)}
.note-box.info{background:var(--surface-2);color:var(--muted)}
.note-box.dup{background:var(--st-wait-bg);color:var(--st-wait);margin-top:10px;align-items:center}
.note-box .tx{flex:1 1 auto;min-width:0}
.note-box .tx .one{display:block}
.ph-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ph{min-width:0;display:flex;flex-direction:column;gap:6px}
.ptile{position:relative;aspect-ratio:1/1;border:1.5px dashed var(--line-strong);border-radius:var(--r-md);background:var(--surface-2);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:6px;color:var(--muted);cursor:pointer;overflow:hidden;text-align:center;padding:8px}
.ptile:hover{border-color:var(--gold)}
.ptile svg.i{width:30px;height:30px;stroke-width:1.6}
.ptile .t{font-weight:700;color:var(--text);font-size:var(--fs-md);white-space:nowrap}
.ptile .s{font-size:var(--fs-xs);white-space:nowrap}
.ptile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ptile.has{border-style:solid;border-color:var(--line)}
.ptile .px{position:absolute;top:6px;right:6px;width:34px;height:34px;border-radius:50%;border:0;background:#0d1b3e;color:#fff;font-size:15px;display:flex;align-items:center;justify-content:center}
.ptile .ptag{position:absolute;left:6px;bottom:6px;max-width:calc(100% - 12px);background:#0d1b3e;color:#fff;font-size:var(--fs-xs);font-weight:600;border-radius:var(--r-pill);padding:1px 9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptile.busy::after{content:'กำลังย่อรูป…';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:var(--surface-2);color:var(--muted);font-size:var(--fs-sm)}
.gal{align-self:center;border:0;background:transparent;color:var(--gold-ink);font-size:var(--fs-sm);font-weight:600;padding:4px;white-space:nowrap}
.whpick{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.whb{min-width:0;height:46px;border-radius:var(--r-md);border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:var(--fs-md);
  display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.whb .sw{flex:0 0 auto;width:10px;height:10px;border-radius:3px;background:var(--c)}
.whb.on{background:var(--c);border-color:var(--c);color:var(--fg)}
.whb.on .sw{display:none}
.whname{margin-top:8px;font-size:var(--fs-sm);color:var(--muted);min-height:20px}
.txt{width:100%;border:1.5px solid var(--line-strong);border-radius:var(--r-md);background:var(--surface);padding:11px 12px;font-size:16px;outline:none}
.txt:focus{border-color:var(--gold)}
textarea.txt{resize:vertical;min-height:84px;line-height:1.45}
.subbar{position:sticky;bottom:0;z-index:var(--rk-z-sticky-sub);background:var(--surface);border-top:1px solid var(--line);
  margin:var(--sp-3) calc(-1 * var(--pad-page)) calc(-40px - env(safe-area-inset-bottom));padding:10px var(--pad-page) calc(10px + env(safe-area-inset-bottom))}
.subbar-in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:12px}
.subbar .msg{flex:1 1 auto;min-width:0;font-size:var(--fs-sm);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.subbar .msg.ok{color:var(--st-done);font-weight:600}
.subbar .btn{height:50px;padding:0 22px;font-size:var(--fs-md)}
.done-card{display:flex;gap:12px;align-items:center;padding:14px;border-radius:var(--r-md);background:var(--st-done-bg);color:var(--st-done);min-width:0}
.done-card .tx{flex:1 1 auto;min-width:0}
.done-card b{display:block}
.done-card .one{display:block;font-size:var(--fs-sm)}

/* ── v2.0: ประเภทเรื่อง · ค้นหาจากชื่อ · ช่องเฉพาะประเภท ── */
.typepick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
@media (max-width:440px){ .typepick{grid-template-columns:repeat(2,minmax(0,1fr))} }
.tyb{min-width:0;height:44px;border-radius:var(--r-md);border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:var(--fs-md);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 6px}
.tyb:hover{border-color:var(--line-strong)}
.tyb.on{background:var(--tab-on-bg);border-color:var(--tab-on-bg);color:var(--tab-on-fg)}
.tyt{flex:0 0 auto;display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:5px;font-size:var(--fs-xs);font-weight:600;white-space:nowrap;
  border:1px solid var(--line-strong);color:var(--text);background:var(--surface)}
.tyt.price{border-color:var(--gold);color:var(--gold-ink);background:var(--gold-soft)}
.tyt.expiry{border-color:var(--st-wait);color:var(--st-wait);background:var(--st-wait-bg)}
.tyt.barcode{border-color:var(--st-work);color:var(--st-work);background:var(--st-work-bg)}
.find-lnk{display:block;margin-top:8px}
.find{margin-top:10px;padding:10px;border-radius:var(--r-md);background:var(--surface-2);border:1px solid var(--line)}
.find-top{display:flex;align-items:center;gap:8px;min-width:0}
.find-top .rk-search{flex:1 1 auto;min-width:0;background:var(--surface)}
.find-cnt{margin:8px 2px 6px;font-size:var(--fs-sm);color:var(--muted)}
.find-list{display:flex;flex-direction:column;gap:4px;max-height:min(52dvh,420px);overflow-y:auto;overscroll-behavior:contain}
.fr{min-width:0;display:flex;flex-direction:column;gap:1px;padding:9px 10px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);text-align:left;color:inherit}
.fr:hover{border-color:var(--gold)}
.fr-n{font-weight:600;font-size:var(--fs-md)}
.fr-m{font-size:var(--fs-sm);color:var(--muted)}
.fl{display:block;margin:12px 0 6px;font-size:var(--fs-sm);font-weight:600;color:var(--muted)}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.pgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.pc{min-width:0;display:flex;flex-direction:column;align-items:flex-start;padding:7px 9px;border-radius:var(--r-sm);background:var(--surface-2);border:1px solid var(--line)}
.pc .k{font-size:var(--fs-xs);color:var(--muted);font-weight:600}
.pc .v{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.pgrid + .whname{margin-top:8px}
.unitpick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:8px}
@media (max-width:440px){ .unitpick{grid-template-columns:repeat(2,minmax(0,1fr))} }
.unb{min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:8px 10px;border-radius:var(--r-md);border:1.5px solid var(--line);background:var(--surface);text-align:left;color:inherit}
.unb b{font-size:var(--fs-sm);white-space:nowrap}
.unb .one{max-width:100%;font-size:var(--fs-xs);color:var(--muted);font-variant-numeric:tabular-nums}
.unb.on{background:var(--tab-on-bg);border-color:var(--tab-on-bg);color:var(--tab-on-fg)}
.unb.on .one{color:inherit;opacity:.85}
.unb:disabled{opacity:.45;cursor:not-allowed}
.kvline{font-size:var(--fs-sm);margin:4px 0 8px;min-width:0}
.kvline.muted,.muted{color:var(--muted)}
.late{color:var(--st-wait)}
.okc{color:var(--st-done);font-weight:600}
.kv dd.tel{white-space:normal;line-height:1.9}
.kv dd.tel a{display:inline-block;white-space:nowrap;color:var(--gold-ink);font-weight:600;text-underline-offset:3px}
.ptab{width:100%;border-collapse:collapse;font-size:var(--fs-sm);font-variant-numeric:tabular-nums}
.ptab th{font-weight:600;color:var(--muted);text-align:right;padding:4px 6px;font-size:var(--fs-xs);white-space:nowrap}
.ptab th:first-child,.ptab td:first-child{text-align:left}
.ptab td{padding:6px;border-top:1px solid var(--line);text-align:right;white-space:nowrap}
.ptab tr.ch td{background:var(--gold-soft);font-weight:700}
.btn.wide{width:100%;margin-top:8px;height:46px}

/* ── detail sheet ── */
.sh-bd{position:fixed;inset:0;z-index:calc(var(--rk-z-modal) - 1);background:rgba(8,13,28,.5);opacity:0;transition:opacity .2s}
.sh-bd.on{opacity:1}
/* ป๊อปอัพกลางจอ ทุกขนาดจอ (Surat สั่ง v1.3 แทนแถบขวา/แผ่นล่าง) */
.sheet{position:fixed;z-index:var(--rk-z-modal);left:50%;top:50%;width:min(var(--sheet-w),calc(100vw - 2 * var(--sheet-gap)));
  max-height:min(var(--sheet-max-h),calc(100dvh - 2 * var(--sheet-gap)));background:var(--surface);border-radius:var(--r-lg);
  display:flex;flex-direction:column;box-shadow:var(--shadow-2);transform:translate(-50%,calc(-50% + 16px)) scale(.98);opacity:0;
  transition:transform .32s cubic-bezier(.16,1,.3,1),opacity .2s}
.sheet.on{transform:translate(-50%,-50%);opacity:1}
.sh-head{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:12px 12px 10px 16px;border-bottom:1px solid var(--line);min-width:0}
.sh-head .tt{flex:1 1 auto;min-width:0}
.sh-head .tt b{display:block;font-size:var(--fs-lg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh-head .tt .one{display:block;font-size:var(--fs-sm);color:var(--muted)}
.xbtn{flex:0 0 auto;width:40px;height:40px;border:0;border-radius:var(--r-md);background:var(--surface-2);color:var(--text);font-size:17px}
.sh-body{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px 18px;overscroll-behavior:contain}
.sh-ph{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.sh-ph button{position:relative;padding:0;border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;aspect-ratio:4/3;background:var(--surface-2)}
.sh-ph img{width:100%;height:100%;object-fit:cover;display:block}
.sh-ph .ptag{position:absolute;left:6px;bottom:6px;background:#0d1b3e;color:#fff;font-size:var(--fs-xs);font-weight:600;border-radius:var(--r-pill);padding:1px 9px}
.sh-sec{margin-top:16px}
.sh-sec h3{margin:0 0 8px;font-size:var(--fs-sm);color:var(--muted);font-weight:600}
.sh-st{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.tl li{display:grid;grid-template-columns:10px minmax(0,1fr);gap:10px}
.tl .d{width:10px;height:10px;border-radius:50%;margin-top:5px;background:var(--st-work)}
.tl .d.done{background:var(--st-done)} .tl .d.fail{background:var(--st-fail)} .tl .d.new{background:var(--gold)}
.tl .h{display:flex;gap:8px;min-width:0;font-size:var(--fs-sm)}
.tl .h b{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl .h span{flex:0 0 auto;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.tl .m{font-size:var(--fs-sm);white-space:pre-wrap;word-break:break-word;margin-top:2px}

<!-- ══════════════════════════════════════════════════════════════════════════
     RK-DROPDOWN · dropdown ที่ "พิมพ์ค้นได้ + ไม่มีวันโดน sticky ทับ"
     ต้องวาง rk-base.html ก่อน · วางบล็อกนี้ก่อน </body>
     กฎอ้างอิง: CLAUDE.md § UI Build Standards ข้อ 1️⃣ + 5️⃣ + 6️⃣(ข)

     ── ใช้ยังไง ──────────────────────────────────────────────────────────
     A) แปลง <select> เดิมทั้งหน้าให้ค้นหาได้ (retrofit แอปเก่า — บรรทัดเดียวจบ):
          RK.selectifyAll();                       // ทุก select ในหน้า
          RK.selectifyAll('#myScreen');            // เฉพาะบางส่วน
          <select data-rk-skip>…</select>          // ตัวไหนไม่อยากแปลง

     B) เรียกเมนูเองจากปุ่ม:
          RK.dropdown(btnEl, {
            title:'เลือกคลัง',
            items:[{v:'W1', label:'W1 · สมุทรสงคราม', color:'#FBBF24'}, …],
            value: cur,
            onPick: it => { cur = it.v; render(); }
          });
     ══════════════════════════════════════════════════════════════════════════ -->
<style id="rk-dropdown-css">
.rk-dd-backdrop{position:fixed;inset:0;z-index:calc(var(--rk-z-dropdown) - 1);background:rgba(15,23,42,.35);opacity:0;transition:opacity .14s;-webkit-tap-highlight-color:transparent}
.rk-dd-backdrop.on{opacity:1}
@media (min-width:481px){.rk-dd-backdrop{background:transparent}}

.rk-dd{position:fixed;z-index:var(--rk-z-dropdown);background:var(--rk-surface);color:var(--rk-text);
  border:1px solid var(--rk-line);border-radius:var(--rk-radius);box-shadow:0 12px 32px rgba(15,23,42,.22);
  display:none;flex-direction:column;overflow:hidden;max-height:min(70dvh,420px)}
.rk-dd.on{display:flex}
.rk-dd-head{display:none;align-items:center;gap:8px;padding:10px 12px 4px;font-weight:700;font-size:15px}
.rk-dd-grip{display:none}
.rk-dd-srch{display:flex;align-items:center;gap:6px;padding:8px;border-bottom:1px solid var(--rk-line);background:var(--rk-surface)}
.rk-dd-srch input{flex:1 1 auto;min-width:0;border:1px solid var(--rk-line);border-radius:9px;padding:9px 10px;
  font:inherit;font-size:16px;background:var(--rk-surface-2);color:var(--rk-text);outline:none}   /* ต่ำกว่า 16px iPhone ซูมเองตอนแตะ */
.rk-dd-srch input:focus{border-color:var(--rk-gold)}
.rk-dd-srch .rk-dd-x{flex:0 0 auto;width:34px;height:34px;border:0;border-radius:9px;background:transparent;
  color:var(--rk-muted);font-size:17px;cursor:pointer;display:none}
.rk-dd-srch.has .rk-dd-x{display:block}
.rk-dd-list{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px;flex:1 1 auto}
.rk-dd-it{display:flex;align-items:center;gap:9px;min-width:0;padding:11px 10px;border-radius:9px;cursor:pointer;font-size:15px;line-height:1.25}
.rk-dd-it:hover,.rk-dd-it.act{background:var(--rk-surface-2)}
.rk-dd-it.sel{background:rgba(201,168,76,.16);font-weight:700}
.rk-dd-it .lb{flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rk-dd-it .dot{flex:0 0 auto;width:10px;height:10px;border-radius:50%}
.rk-dd-it .tick{flex:0 0 auto;color:var(--rk-gold);font-weight:700}
.rk-dd-none{padding:18px 12px;text-align:center;color:var(--rk-muted);font-size:14px}
.rk-dd-cnt{padding:6px 12px;font-size:12px;color:var(--rk-muted);border-top:1px solid var(--rk-line)}

/* มือถือ → bottom sheet (นิ้วโป้งถึง + ไม่มีทางโดน sticky ทับ) */
@media (max-width:480px){
  .rk-dd{left:0!important;right:0!important;top:auto!important;bottom:0!important;width:auto!important;
    max-height:min(78dvh,560px);border-radius:16px 16px 0 0;border-bottom:0;
    padding-bottom:env(safe-area-inset-bottom);transform:translateY(100%);transition:transform .18s ease-out}
  .rk-dd.on{transform:translateY(0)}
  .rk-dd-head{display:flex}
  .rk-dd-grip{display:block;width:38px;height:4px;border-radius:2px;background:var(--rk-line);margin:8px auto 0}
  .rk-dd-it{padding:13px 10px}
}

/* ปุ่มที่แทน <select> เดิม */
.rk-dd-btn{display:flex;align-items:center;gap:6px;min-width:0;max-width:100%;
  border:1px solid var(--rk-line);border-radius:10px;background:var(--rk-surface);color:var(--rk-text);
  padding:8px 10px;font:inherit;font-size:14px;cursor:pointer;text-align:left}
.rk-dd-btn .lb{flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rk-dd-btn .cv{flex:0 0 auto;color:var(--rk-muted);font-size:11px}
.rk-dd-btn:disabled{opacity:.5;cursor:not-allowed}
</style>

<script id="rk-dropdown-js">
(function(){
  window.RK = window.RK || {};
  let el, backdrop, inp, list, cntEl, headEl, st = null, act = -1;

  function build(){
    if (el) return;
    backdrop = document.createElement('div'); backdrop.className = 'rk-dd-backdrop';
    el = document.createElement('div'); el.className = 'rk-dd'; el.setAttribute('role','listbox');
    el.innerHTML =
      '<div class="rk-dd-grip"></div>'+
      '<div class="rk-dd-head"><span class="rk-1line rk-grow"></span></div>'+
      '<div class="rk-dd-srch"><input type="search" inputmode="search" autocomplete="off" placeholder="พิมพ์ค้นหา…"><button class="rk-dd-x" type="button" aria-label="ล้าง">✕</button></div>'+
      '<div class="rk-dd-list"></div><div class="rk-dd-cnt"></div>';
    document.body.appendChild(backdrop); document.body.appendChild(el);   /* ← portal ที่ body: sticky ตัวไหนก็ทับไม่ได้ */
    inp = el.querySelector('input'); list = el.querySelector('.rk-dd-list');
    cntEl = el.querySelector('.rk-dd-cnt'); headEl = el.querySelector('.rk-dd-head span');

    inp.addEventListener('input', paint);
    el.querySelector('.rk-dd-x').addEventListener('click', ()=>{ inp.value=''; paint(); inp.focus(); });
    backdrop.addEventListener('click', close);
    el.addEventListener('keydown', key);
    inp.addEventListener('keydown', key);
    list.addEventListener('click', e=>{
      const it = e.target.closest('.rk-dd-it'); if (!it) return;
      pick(st.view[+it.dataset.i]);
    });
    window.addEventListener('resize', close);
    window.addEventListener('scroll', e=>{ if (st && !el.contains(e.target)) close(); }, true);
  }

  const norm = s => String(s==null?'':s).toLowerCase().trim();
  /* ค้นแบบ "ทุกคำต้องเจอ" และเจอที่ไหนก็ได้ในตัวเลือก (ไม่ใช่แค่ขึ้นต้น) */
  function match(hay, q){
    const w = norm(q).split(/\s+/).filter(Boolean);
    return w.every(x => hay.indexOf(x) >= 0);
  }

  function paint(){
    const q = inp.value;
    st.view = st.items.filter(it => !q || match(it._s, q));
    act = st.view.findIndex(it => String(it.v) === String(st.value));
    el.querySelector('.rk-dd-srch').classList.toggle('has', !!q);
    list.innerHTML = st.view.length
      ? st.view.map((it,i)=>
          '<div class="rk-dd-it'+(String(it.v)===String(st.value)?' sel':'')+'" data-i="'+i+'" role="option">'+
          (it.color?'<span class="dot" style="background:'+RK.esc(it.color)+'"></span>':'')+
          '<span class="lb" title="'+RK.esc(it.label)+'">'+RK.esc(it.label)+'</span>'+
          (String(it.v)===String(st.value)?'<span class="tick">✓</span>':'')+'</div>').join('')
      : '<div class="rk-dd-none">ไม่พบ "'+RK.esc(q)+'"</div>';
    cntEl.textContent = st.view.length + ' / ' + st.items.length + ' รายการ';
    cntEl.style.display = st.items.length > 8 ? '' : 'none';
    const sel = list.querySelector('.sel'); if (sel) sel.scrollIntoView({block:'nearest'});
  }

  function key(e){
    if (!st) return;
    if (e.key === 'Escape'){ e.preventDefault(); close(); return; }
    if (e.key === 'Enter'){ e.preventDefault(); if (st.view[act]) pick(st.view[act]); else if (st.view.length===1) pick(st.view[0]); return; }
    if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
    e.preventDefault();
    act = Math.max(0, Math.min(st.view.length-1, act + (e.key==='ArrowDown'?1:-1)));
    [...list.children].forEach((c,i)=> c.classList.toggle('act', i===act));
    if (list.children[act]) list.children[act].scrollIntoView({block:'nearest'});
  }

  function place(anchor){
    if (window.innerWidth <= 480) return;                 /* มือถือ = bottom sheet (CSS จัดให้) */
    const r = anchor.getBoundingClientRect(), M = 8;
    const w = Math.min(Math.max(r.width, 220), window.innerWidth - M*2);
    el.style.width = w + 'px';
    el.style.left  = Math.round(Math.min(Math.max(M, r.left), window.innerWidth - w - M)) + 'px';
    const below = window.innerHeight - r.bottom - M, above = r.top - M;
    const h = Math.min(el.scrollHeight || 320, 420);
    if (below >= Math.min(h, 220) || below >= above){ el.style.top = Math.round(r.bottom + 4) + 'px'; el.style.maxHeight = (below - 4) + 'px'; }
    else { el.style.top = Math.round(Math.max(M, r.top - 4 - Math.min(h, above))) + 'px'; el.style.maxHeight = (above - 4) + 'px'; }
  }

  function pick(it){ if (!it) return; const cb = st.onPick; close(); if (cb) cb(it); }

  function close(){
    if (!st) return;
    const a = st.anchor; st = null;
    el.classList.remove('on'); backdrop.classList.remove('on');
    backdrop.style.display = 'none';
    if (a && a.focus) try{ a.focus({preventScroll:true}); }catch(e){}
  }

  /* ── API หลัก ── */
  RK.dropdown = function(anchor, o){
    build(); if (st) close();
    const items = (o.items||[]).map(it => {
      const x = (typeof it === 'string') ? {v:it, label:it} : Object.assign({}, it);
      x.label = x.label==null ? String(x.v) : String(x.label);
      x._s = norm(x.label + ' ' + x.v + ' ' + (x.search||''));
      return x;
    });
    st = {anchor, items, view:items, value:o.value, onPick:o.onPick};
    headEl.textContent = o.title || 'เลือก';
    const searchable = o.search !== false && (o.search === true || items.length > 10);
    el.querySelector('.rk-dd-srch').style.display = searchable ? '' : 'none';
    inp.value = ''; inp.placeholder = o.placeholder || 'พิมพ์ค้นหา…';
    backdrop.style.display = ''; backdrop.classList.add('on');
    el.classList.add('on');
    paint(); place(anchor);
    if (searchable && window.innerWidth > 480) setTimeout(()=>inp.focus(), 30);
    return {close};
  };
  RK.closeDropdown = close;

  /* ── retrofit: <select> เดิม → ปุ่มที่ค้นหาได้ (ค่ายังอยู่ใน select เดิม แอปเดิมไม่ต้องแก้) ── */
  RK.selectify = function(sel, o){
    o = o || {};
    if (!sel || sel.dataset.rkDone || sel.hasAttribute('data-rk-skip') || sel.multiple) return;
    sel.dataset.rkDone = '1';
    const btn = document.createElement('button');
    btn.type = 'button'; btn.className = 'rk-dd-btn ' + (o.cls||'');
    btn.innerHTML = '<span class="lb"></span><span class="cv">▾</span>';
    btn.setAttribute('data-rk-menu-anchor','1');
    sel.style.display = 'none';
    sel.insertAdjacentElement('afterend', btn);

    const opts = () => [...sel.options].filter(op=>!op.disabled || op.value!=='')
                    .map(op => ({v:op.value, label:(op.textContent||'').trim(), color:op.dataset.color}));
    const sync = () => {
      const cur = sel.options[sel.selectedIndex];
      const t = cur ? (cur.textContent||'').trim() : (o.placeholder || 'เลือก…');
      btn.querySelector('.lb').textContent = t; btn.title = t;
      btn.disabled = sel.disabled;
    };
    btn.addEventListener('click', ()=> RK.dropdown(btn, {
      title: o.title || sel.getAttribute('aria-label') || sel.dataset.title || 'เลือก',
      items: opts(), value: sel.value,
      onPick: it => { sel.value = it.v; sync(); sel.dispatchEvent(new Event('change', {bubbles:true})); }
    }));
    sel.addEventListener('change', sync);
    new MutationObserver(sync).observe(sel, {childList:true, subtree:true, attributes:true, attributeFilter:['disabled','value']});
    sync();
    return btn;
  };

  RK.selectifyAll = function(root, o){
    (typeof root === 'string' ? document.querySelector(root) : (root || document))
      .querySelectorAll('select:not([data-rk-done]):not([data-rk-skip])')
      .forEach(s => RK.selectify(s, o));
  };
})();
</script>
<!-- ══════════════════════════════════════════════════════════════════════════
     RK-SEARCHBAR · ช่องค้นหาที่ "ค้นได้ทุก field + X ล้างทั้งหมด + sticky"
     ต้องวาง rk-base.html ก่อน · วางบล็อกนี้ก่อน </body>
     กฎอ้างอิง: CLAUDE.md § UI Build Standards ข้อ 4️⃣ (+ App Standards: sticky + X)

     ── ใช้ยังไง ──────────────────────────────────────────────────────────
     1) HTML (วางบนสุดของหน้าจอนั้น):
        <div class="rk-sticky rk-searchwrap">
          <div class="rk-search">
            <input id="q" type="search" placeholder="ค้นหา ชื่อ · รหัส · บาร์โค้ด · แบรนด์ …">

          </div>
          <div class="rk-chips" id="qChips"></div>
        </div>

     2) JS:
        RK.bindSearch('#q', {
          onQuery: q => render(),                 // เรียกทุกครั้งที่พิมพ์ (debounce ให้แล้ว)
          onReset: () => { wh='ALL'; cat=''; },   // ❗ X ต้องล้างฟิลเตอร์/ชิปด้วย
        });

     3) กรองข้อมูล — ค้น "ทุก field" อัตโนมัติ ไม่ต้องไล่เขียนทีละคอลัมน์:
        const rows = RK.filter(products, RK.q('#q'));            // ทุก field
        const rows = RK.filter(products, q, ['PRODUCT NAME','CODE EA','CAT BRAND']);  // เจาะจง
     ══════════════════════════════════════════════════════════════════════════ -->

<script id="rk-searchbar-js">
(function(){
  window.RK = window.RK || {};
  const norm = s => String(s==null?'':s).toLowerCase().trim();

  /* ── รวมทุกค่าใน record เป็นสตริงเดียว (ทำครั้งเดียวตอน load แล้ว cache) ── */
  RK.blob = function(obj, fields){
    if (obj == null) return '';
    if (typeof obj !== 'object') return norm(obj);
    if (obj.__rkBlob && !fields) return obj.__rkBlob;
    const keys = fields || Object.keys(obj);
    let s = '';
    for (const k of keys){
      if (k === '__rkBlob') continue;
      const v = obj[k];
      if (v == null || v === '') continue;
      if (typeof v === 'object') { s += ' ' + Object.values(v).filter(x=>x!=null&&typeof x!=='object').join(' '); }
      else s += ' ' + v;
    }
    s = norm(s.replace(/\s+/g,' '));
    if (!fields) { try { Object.defineProperty(obj,'__rkBlob',{value:s,enumerable:false,configurable:true}); } catch(e){} }
    return s;
  };

  /* ── ทุกคำต้องเจอ (AND) · ไม่สนตัวพิมพ์ · เจอกลางคำก็นับ ── */
  RK.match = function(rec, q, fields){
    const w = norm(q).split(/\s+/).filter(Boolean);
    if (!w.length) return true;
    const hay = typeof rec === 'string' ? norm(rec) : RK.blob(rec, fields);
    return w.every(x => hay.indexOf(x) >= 0);
  };

  RK.filter = function(list, q, fields){
    if (!q || !norm(q)) return list || [];
    return (list||[]).filter(r => RK.match(r, q, fields));
  };

  RK.q = sel => { const el = typeof sel==='string' ? document.querySelector(sel) : sel; return el ? el.value : ''; };

  /* ── ผูกช่องค้นหา: X ล้างทุกอย่าง · ไม่เด้ง scroll · debounce ── */
  RK.bindSearch = function(input, o){
    o = o || {};
    const el = typeof input === 'string' ? document.querySelector(input) : input;
    if (!el || el.dataset.rkBound) return;
    el.dataset.rkBound = '1';
    const wrap = el.closest('.rk-search') || el.parentElement;
    let x = wrap && wrap.querySelector('.rk-search-x');
    if (wrap && !x){ x = document.createElement('button'); x.type='button'; x.className='rk-search-x'; x.textContent='✕'; x.setAttribute('aria-label','ล้างทั้งหมด'); wrap.appendChild(x); }

    const paintX = () => { if (wrap) wrap.classList.toggle('has', !!el.value); };
    const fire = RK.debounce(()=>{ if (o.onQuery) o.onQuery(el.value); }, o.delay==null?120:o.delay);

    el.addEventListener('input', ()=>{ paintX(); fire(); });
    el.addEventListener('keydown', e=>{ if (e.key === 'Escape'){ e.preventDefault(); clear(); } });

    function clear(){
      const y = window.scrollY;                    /* ห้ามเด้งขึ้นบนสุด */
      el.value = ''; paintX();
      if (o.onReset) o.onReset();                  /* ❗ ล้างฟิลเตอร์/ชิป/หมวด กลับค่าเริ่มต้นด้วย */
      if (o.onQuery) o.onQuery('');
      el.focus({preventScroll:true});
      window.scrollTo({top:y});
    }
    if (x) x.addEventListener('click', clear);
    paintX();
    return {clear, value:()=>el.value};
  };
})();
</script>

<script id="rk-scanner-js">
(function(){
  window.RK = window.RK || {};
  const CDN = 'https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js';
  const UNITS = [                                    /* ใหญ่ → เล็ก (ชนกันให้หน่วยใหญ่ชนะ) */
    {u:'CS', code:'CODE CS', qty:'QTY CS', th:'ลัง'},
    {u:'BP', code:'CODE BP', qty:'QTY BP', th:'Big Pack'},
    {u:'PA', code:'CODE PA', qty:'QTY PA', th:'แพ็ค'},
    {u:'EA', code:'CODE EA', qty:'QTY EA', th:'ชิ้น'}
  ];
  let sc = null, el = null, busy = false, opt = {}, IDX = {};

  const clean = v => String(v==null?'':v).replace(/[\s'"]/g,'').trim();

  /* ── index: บาร์โค้ดทุกหน่วยของทุก SKU → {product, unit, eaPerUnit} ── */
  RK.scan = RK.scan || {};
  RK.scan.index = function(products, o){
    o = o || {}; IDX = {};
    (products||[]).forEach(p=>{
      UNITS.forEach(U=>{
        const bc = clean(p[U.code] || p[o[U.u]] || '');
        if (!bc || bc === '0') return;
        if (!IDX[bc]) IDX[bc] = {product:p, unit:U.u, unitTh:U.th, eaPerUnit: Math.max(1, RK.num(p[U.qty]) || 1)};
      });
    });
    return Object.keys(IDX).length;
  };
  RK.scan.lookup = function(code){
    const bc = clean(code);
    const hit = IDX[bc] || IDX[bc.replace(/^0+/,'')] || null;
    if (!hit) return {code:bc, product:null, unit:null, eaPerUnit:1, label:''};
    return {code:bc, product:hit.product, unit:hit.unit, unitTh:hit.unitTh, eaPerUnit:hit.eaPerUnit,
            label: hit.unit === 'EA' ? '1 ชิ้น' : ('1 ' + hit.unitTh + ' = ' + hit.eaPerUnit.toLocaleString('th-TH') + ' ชิ้น')};
  };
  /* จำนวนที่ผู้ใช้กรอกในหน่วยที่สแกนได้ → EA */
  RK.scan.toEA = (r, qty) => Math.round((RK.num(qty)||0) * (r && r.eaPerUnit ? r.eaPerUnit : 1));

  function build(){
    if (el) return;
    el = document.createElement('div'); el.id = 'rkScan';
    el.innerHTML =
      '<div class="rk-sc-top"><span class="t"></span>'+
        '<button class="rk-sc-btn rk-sc-torch" type="button" style="display:none">ไฟฉาย</button>'+
        '<button class="rk-sc-btn rk-sc-close" type="button" aria-label="ปิด">✕</button></div>'+
      '<div class="rk-sc-stage"><div id="rkScanReader"></div><div class="rk-sc-frame"></div>'+
        '<div class="rk-sc-hint">เล็งบาร์โค้ดให้อยู่ในกรอบ · สแกนติดแล้วกล้องจะปิดเอง</div></div>'+
      '<div class="rk-sc-bottom"><div class="rk-sc-manual">'+
        '<input type="text" inputmode="numeric" autocomplete="off" placeholder="อ่านไม่ออก → พิมพ์เลขบาร์โค้ด">'+
        '<button type="button">ตกลง</button></div><div class="rk-sc-err"></div></div>';
    document.body.appendChild(el);
    el.querySelector('.rk-sc-close').addEventListener('click', ()=>RK.scan.close());
    el.querySelector('.rk-sc-manual button').addEventListener('click', manual);
    el.querySelector('.rk-sc-manual input').addEventListener('keydown', e=>{ if (e.key==='Enter') manual(); });
    el.querySelector('.rk-sc-torch').addEventListener('click', torch);
  }

  function err(msg){ const e = el.querySelector('.rk-sc-err'); e.textContent = msg||''; e.classList.toggle('on', !!msg); }

  function manual(){
    const i = el.querySelector('.rk-sc-manual input'), v = clean(i.value);
    if (!v) return; i.value = '';
    done(v, true);
  }

  function load(cb){
    if (typeof Html5Qrcode !== 'undefined') return cb();
    const s = document.createElement('script'); s.src = CDN;
    s.onload = cb; s.onerror = ()=>err('โหลดตัวสแกนไม่ได้ — เช็คเน็ต แล้วพิมพ์เลขบาร์โค้ดแทนได้');
    document.head.appendChild(s);
  }

  async function release(){
    if (sc){ try{ await sc.stop(); }catch(e){} try{ sc.clear(); }catch(e){} sc = null; }
    /* html5-qrcode บางเคสไม่ปล่อย track จริง — บังคับปิดซ้ำ ไม่งั้นไฟกล้องค้าง */

  }

  function done(code, isManual){
    if (busy) return; busy = true;
    try{ navigator.vibrate && navigator.vibrate(60); }catch(e){}
    const r = RK.scan.lookup(code); r.manual = !!isManual;
    RK.scan.close();                                   /* ← ติดแล้วปิดกล้องทันที แล้วค่อยโชว์ผล */
    setTimeout(()=>{ busy = false; if (opt.onResult) opt.onResult(r); }, 60);
  }

  async function torch(){
    try{
      const t = sc && sc.getRunningTrackSettings ? sc.getRunningTrackSettings() : null;
      const on = t && t.torch;
      await sc.applyVideoConstraints({advanced:[{torch:!on}]});
    }catch(e){ err('เครื่องนี้เปิดไฟฉายไม่ได้'); }
  }

  RK.scan.open = function(o){
    build(); opt = o || {}; busy = false; err('');
    el.querySelector('.rk-sc-manual input').value = '';   /* เปิดใหม่ = ไม่ค้างค่าเก่า */
    el.querySelector('.t').textContent = opt.title || 'สแกนบาร์โค้ด';
    el.classList.add('on');
    document.body.style.overflow = 'hidden';
    load(async ()=>{
      try{
        await release();
        sc = new Html5Qrcode('rkScanReader', {
          verbose:false,
          experimentalFeatures:{ useBarCodeDetectorIfSupported:true },      /* native BarcodeDetector = เร็วกว่ามาก */
          formatsToSupport:[
            Html5QrcodeSupportedFormats.EAN_13, Html5QrcodeSupportedFormats.EAN_8,
            Html5QrcodeSupportedFormats.UPC_A,  Html5QrcodeSupportedFormats.UPC_E,
            Html5QrcodeSupportedFormats.CODE_128, Html5QrcodeSupportedFormats.CODE_39,
            Html5QrcodeSupportedFormats.CODE_93, Html5QrcodeSupportedFormats.ITF,
            Html5QrcodeSupportedFormats.QR_CODE
          ]
        });
        await sc.start(
          {facingMode:'environment'},                                       /* กล้องหลังเสมอ */
          {fps:25, qrbox:{width:Math.min(320, Math.round(window.innerWidth*0.78)), height:180},
           aspectRatio:window.innerHeight/window.innerWidth,
           videoConstraints:{facingMode:'environment', width:{ideal:1920}, height:{ideal:1080}}},
          txt => done(txt, false),
          ()=>{}                                                            /* frame ที่อ่านไม่ออก = เงียบไว้ */
        );
        try{ await sc.applyVideoConstraints({advanced:[{zoom:1.5}]}); }catch(e){}   /* บาร์โค้ดเล็กอ่านง่ายขึ้น */
        const cap = sc.getRunningTrackCapabilities ? sc.getRunningTrackCapabilities() : {};
        if (cap && 'torch' in cap) el.querySelector('.rk-sc-torch').style.display = '';
      }catch(e){
        err('เปิดกล้องไม่ได้ (' + (e && e.name ? e.name : 'error') + ') — เช็คสิทธิ์กล้องในเบราว์เซอร์ หรือพิมพ์เลขบาร์โค้ดแทน');
        setTimeout(()=>{ const i = el.querySelector('.rk-sc-manual input'); i && i.focus(); }, 100);
      }
    });
  };

  RK.scan.close = function(){
    if (!el || !el.classList.contains('on')) return;
    const cancelled = !busy;                          /* ปิดเองทั้งที่ยังไม่ติด = "กดย้อนกลับ" */
    el.classList.remove('on');
    document.body.style.overflow = '';
    release();
    if (cancelled && opt.onCancel) opt.onCancel();    /* ให้แอปเคลียร์ผลสแกนรอบก่อนทิ้ง */
  };
})();

async function loadPddt() {
  if (S.pddtState === 'loading') return;
  S.pddtState = 'loading'; paintProduct();
  try {
    const base = `https://docs.google.com/spreadsheets/d/${PDDT.id}/gviz/tq?tqx=out:csv&headers=1&sheet=${encodeURIComponent(PDDT.tab)}`;
    const hText = await (await fetch(base + '&tq=' + encodeURIComponent('select * limit 1'), { cache: 'no-store' })).text();
    if (/^\s*</.test(hText)) throw new Error('ชีตสินค้าเปิดไม่ได้');
    const head = (parseCsvRows(hText)[0] || []).map(cleanCell);
    const cols = PDDT_COLS.map(c => head.indexOf(c)).filter(i => i >= 0).map(colLetter);
    if (head.indexOf('PRODUCT NAME') < 0 || head.indexOf('CODE EA') < 0) throw new Error('หัวคอลัมน์ PDDT เปลี่ยน');
    const text = await (await fetch(base + '&tq=' + encodeURIComponent('select ' + cols.join(',')), { cache: 'no-store' })).text();
    if (/^\s*</.test(text)) throw new Error('ชีตสินค้าเปิดไม่ได้');
    const rows = parseCsvRows(text);
    const H = (rows[0] || []).map(cleanCell);
    S.pddt = rows.slice(1).map(r => { const o = {}; H.forEach((h, i) => { o[h] = cleanCell(r[i]); }); return o; })
      .filter(p => p['PRODUCT NAME'] || p['CODE EA'] || p['CODE CS']);
    RK.scan.index(S.pddt);

function countBy(list) { const c = { wait: 0, work: 0, done: 0, fail: 0 }; list.forEach(it => { c[stKey(it)]++; }); return c; }
function barHtml(c, cls) {
  const tot = ST_ORDER.reduce((s, k) => s + c[k], 0);

  return `<div class="bar ${cls || ''}" role="img" aria-label="${ST_ORDER.map(k => ST_LABEL[k] + ' ' + c[k]).join(' · ')}">${ST_ORDER.map(k => c[k] ? `<i class="${k}" style="flex:${c[k]}"></i>` : '').join('')}</div>`;

function buyerStats(list) {
  const m = new Map();
  S.buyers.forEach(b => m.set(b.name, { name: b.name, c: { wait: 0, work: 0, done: 0, fail: 0 }, total: 0 }));
  list.forEach(it => {
    const k = it.buyer || NO_BUYER;
    if (!m.has(k)) m.set(k, { name: k, c: { wait: 0, work: 0, done: 0, fail: 0 }, total: 0 });
    const r = m.get(k); r.c[stKey(it)]++; r.total++;
  });
  return [...m.values()].sort((a, b) => (b.c.wait - a.c.wait) || ((b.c.wait + b.c.work) - (a.c.wait + a.c.work)) || (b.total - a.total) || a.name.localeCompare(b.name, 'th'));
}
function inPeriod(it) {
  if (S.period === 'all') return true;
  const d = parseTs(it.ts); if (!d) return false;
  const t0 = new Date(); t0.setHours(0, 0, 0, 0);
  const days = S.period === 'today' ? 0 : S.period === '7' ? 6 : 29;
  return d >= new Date(t0.getTime() - days * 864e5);
}
/* เรียงสินค้า 4 ชั้น: บริษัท → แบรนด์ → ขนาด → สินค้า · ทุกชั้นจัดอันดับด้วย "จำนวน" ของกลุ่ม มาก→น้อย (CLAUDE.md § UI 2️⃣)
   get(x) คืน [บริษัท, แบรนด์, ขนาด, สินค้า] · tie = ตามด้วย tie(a,b) */
function groupSort(list, get, tie) {
  const keys = new Map(list.map(x => { const g = get(x); const v = g[0] || 'ไม่พบในระบบ'; return [x, [v, v + '|' + g[1], v + '|' + g[1] + '|' + g[2], v + '|' + g[1] + '|' + g[2] + '|' + g[3]]]; }));
  const cnt = [0, 1, 2, 3].map(l => { const m = {}; list.forEach(x => { const k = keys.get(x)[l]; m[k] = (m[k] || 0) + 1; }); return m; });
  return list.slice().sort((a, b) => {
    const ka = keys.get(a), kb = keys.get(b);
    for (let l = 0; l < 4; l++) {
      const d = (cnt[l][kb[l]] - cnt[l][ka[l]]) || ka[l].localeCompare(kb[l], 'th');
      if (d) return d;
    }
    return tie ? tie(a, b) : 0;
  });
}
function productSort(list) { return groupSort(list, it => [it.vendor, it.catBrand, it.catSize, it.name || it.barcode], newFirst); }
/* ใกล้หมดอายุ = มี deadline → เรียงตามกฎ Sort Rule: หมดแล้ว → วันนี้ → ใกล้ → ไกล → ไม่มีวันที่ → เรียบร้อย → ไม่สำเร็จ
   วันหมดเท่ากัน = แจ้งล่าสุดอยู่บน · เรื่องที่ปิดแล้ว = ปิดล่าสุดอยู่บน (updatedAt) */
const EXP_BUCKETS = [['over', 'หมดอายุแล้ว'], ['today', 'หมดวันนี้'], ['d7', 'หมดภายใน 7 วัน'], ['d30', 'หมดภายใน 30 วัน'],
  ['far', 'เกิน 30 วัน'], ['nodate', 'ไม่มีวันหมดอายุ'], ['done', 'ปิดแล้ว · เรียบร้อย'], ['fail', 'ปิดแล้ว · ไม่สำเร็จ']];
const EXP_RANK = Object.fromEntries(EXP_BUCKETS.map((b, i) => [b[0], i]));
const EXP_LABEL = Object.fromEntries(EXP_BUCKETS);
function expBucket(it) {
  if (it.status === ST.DONE) return 'done';
  if (it.status === ST.FAIL) return 'fail';
  const d = daysLeft(it.expDate);
  if (d == null) return 'nodate';
  return d < 0 ? 'over' : d === 0 ? 'today' : d <= 7 ? 'd7' : d <= 30 ? 'd30' : 'far';
}
const isExp7 = it => typeOf(it) === 'expiry' && isOpen(it) && (daysLeft(it.expDate) ?? 99) <= 7;
function closedNewFirst(a, b) { const x = a.updatedAt || a.ts || '', y = b.updatedAt || b.ts || ''; return y < x ? -1 : y > x ? 1 : 0; }
function expirySort(list) {
  return list.slice().sort((a, b) => {
    const ka = expBucket(a), kb = expBucket(b);
    if (ka !== kb) return EXP_RANK[ka] - EXP_RANK[kb];
    if (ka === 'done' || ka === 'fail') return closedNewFirst(a, b);
    return String(a.expDate || '').localeCompare(String(b.expDate || '')) || newFirst(a, b);
  });
}

function compressImage(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const max = 1400, k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const w = Math.max(1, Math.round(img.naturalWidth * k)), h = Math.max(1, Math.round(img.naturalHeight * k));
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);

    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('เปิดรูปนี้ไม่ได้ ลองถ่ายใหม่')); };
    img.src = url;
  });
}

async function confirmCloseWithPddt(it, btn) {

    const bus = unitsOf(it.badUnit), old = parseCodes(it.codeOld, bus);
    const cands = [it.codeReal].concat(UNITS.filter(u => !bus.includes(u)).map(u => old[u]), [it.barcode], bus.map(u => old[u])).filter(Boolean);
    q = 'action=pddt&code=' + encodeURIComponent(cands[0] || it.barcode) + '&codes=' + encodeURIComponent(cands.slice(1).join(','));

  if (!j || !j.ok) return confirm('เช็ค PDDT ไม่ได้ตอนนี้\nปิดงานเลยไหม? (หลังบ้านจะลองอ่าน PDDT อีกครั้งตอนบันทึก)');
  if (!j.found) return confirm('ไม่พบสินค้านี้ใน PDDT\nปิดงานเลยไหม?');

  if (t === 'price') {
    const u = priceUnit(it.priceOld) || it.unit || p.unit, a = parsePrice(it.priceOld), b = (p.prices || {})[u] || {};
    const ch = PRICE_TIERS.filter(k => (a[k] || '') !== (b[k] || '')).map(k => `${k} ${a[k] || '-'} → ${b[k] || '-'}`);
    return confirm(ch.length ? `ราคาใน PDDT ตอนนี้ (${u}):\n${ch.join('\n')}\n\nปิดงาน "แก้แล้ว" ไหม?` : `PDDT ยังเป็นราคาเดิมทุกระดับ (${u})\nถ้าเพิ่งแก้ใน ERP ให้อัปไฟล์ PDDT แล้วรอ sync ~15 นาทีก่อน\n\nจะปิดงานเลยไหม?`);

  return confirm(`บาร์ใน PDDT ตอนนี้:\n${lines.join('\n')}${real}\n\n${changed ? 'ปิดงาน "แก้แล้ว" ไหม?' : 'PDDT ยังเป็นบาร์เดิม — ถ้าเพิ่งแก้ใน ERP ให้อัปไฟล์ PDDT แล้วรอ sync ก่อน\nจะปิดงานเลยไหม?'}`);
}
async function respond(status, btn, kind) {

      bd.appendChild(wn);
    }

    bd.appendChild(el('div', 'rkt-gt', 'ปรับเฉพาะชนิดนี้'));
    bd.appendChild(cardRow('สีพื้นหลัง', 'background-color', 'color'));
    bd.appendChild(cardRow('สีตัวหนังสือ', 'color', 'color'));
    bd.appendChild(cardRow('ขนาดตัวอักษร', 'font-size', 'px'));
    bd.appendChild(cardRow('ความหนาตัวอักษร', 'font-weight', 'weight'));
    bd.appendChild(cardRow('สีขอบ', 'border-color', 'color'));
    bd.appendChild(cardRow('ความหนาขอบ', 'border-width', 'px'));
    bd.appendChild(cardRow('มุมโค้ง', 'border-radius', 'radius'));
    bd.appendChild(cardRow('ระยะขอบใน', 'padding', 'px'));

    var bt = el('div', 'rkt-btns');
    var sh = el('button', 'rkt-b', 'เงา เปิด/ปิด');
    sh.onclick = function () {
      var c = cards[picked] = cards[picked] || {};
      c['box-shadow'] = c['box-shadow'] === 'none' ? '0 2px 6px rgba(15,23,42,.14)' : 'none';
      applyCards();
    };
    var cl = el('button', 'rkt-b warn', 'ล้างตรงนี้');
    cl.onclick = function () { delete cards[picked]; applyCards(); rebuild(); };
    bt.appendChild(sh); bt.appendChild(cl);
    bd.appendChild(bt);

    /* โทเคนที่จุดนี้กินอยู่ — แก้ตรงนี้เปลี่ยนทั้งแอป ไม่ใช่แค่ตรงที่ชี้ */
    var toks = tokensOf(selEl);
    bd.appendChild(el('div', 'rkt-gt', 'โทเคนที่ตรงนี้ใช้อยู่ (' + toks.length + ')'));
    if (!toks.length) {
      bd.appendChild(el('div', 'rkt-hint', 'ตรงนี้ไม่ได้ใช้ค่าจาก :root ตรงๆ (อาจ hardcode ไว้) ปรับด้วยช่องข้างบนแทนได้'));
    } else {
      bd.appendChild(el('div', 'rkt-hint', 'แก้ตรงนี้ = เปลี่ยนทั้งแอปทุกที่ที่ใช้โทเคนตัวนั้น ไม่ใช่แค่จุดที่ชี้'));
      toks.forEach(function (t) {
        var r = tokenRow(t.name, orig[t.name]);
        var lbl = r.querySelector('.rkt-n');
        if (lbl) { lbl.textContent = t.name + '  (' + t.role + ')'; lbl.title = t.name + ' — ' + t.role; }
        bd.appendChild(r);
      });
    }
  }

  function buildPos(bd) {
    var sw = el('button', 'rkt-b pri', 'สลับที่ 2 ใบ (แตะทีละใบ)');
    sw.onclick = function () {
      stopMode(); mode = 'swap'; document.body.classList.add('rkt-swapmode');
      toast('แตะใบแรก แล้วแตะใบที่จะสลับด้วย');
    };
    bd.appendChild(sw);
    bd.appendChild(el('div', 'rkt-note', 'สลับได้เฉพาะของที่อยู่ในกล่องเดียวกัน · ใช้กับการ์ดในลิสต์เดียวกันได้เลย'));

    if (!blocks.length) blocks = scanBlocks();
    bd.appendChild(el('div', 'rkt-gt', 'บล็อกใหญ่ (' + blocks.length + ')'));
    if (!blocks.length) {
      bd.appendChild(el('div', 'rkt-note', 'หน้านี้ยังไม่มี element ที่ติด data-tweak="ชื่อบล็อก" บอก Claude ให้ติดให้ก่อน'));
      return;
    }
    blocks.forEach(function (b, i) {
      var d = el('div', 'rkt-sec');
      d.appendChild(el('span', 'nm', (i+1) + '. ' + b.name));
      var up = el('button', 'rkt-mini', '↑'), dn = el('button', 'rkt-mini', '↓');
      var ey = el('button', 'rkt-mini' + (b.hidden ? ' off' : ''), '👁');
      up.onclick = function () { if (i > 0) { blocks.splice(i-1, 0, blocks.splice(i,1)[0]); applyBlocks(); rebuild(); } };
      dn.onclick = function () { if (i < blocks.length-1) { blocks.splice(i+1, 0, blocks.splice(i,1)[0]); applyBlocks(); rebuild(); } };
      ey.onclick = function () { b.hidden = !b.hidden; applyBlocks(); rebuild(); };
      d.appendChild(up); d.appendChild(dn); d.appendChild(ey);
      bd.appendChild(d);
    });
  }

  /* ─────────── แผง ─────────── */
  function rebuild() {
    if (!panel) return;
    var bd = panel.querySelector('.rkt-bd');
    bd.innerHTML = '';
    panel.querySelectorAll('.rkt-tb').forEach(function (b) {
      b.className = 'rkt-tb' + (b.dataset.t === tab ? ' on' : '');
    });
    if (tab === 'pick') buildCard(bd);
    else if (tab === 'tone') buildTone(bd);
    else buildPos(bd);
  }

  function open() {
    if (panel) { panel.style.display = 'flex'; return; }
    orig = readTokens();
    if (!Object.keys(orig).length) { toast('แอปนี้ยังไม่ได้ใช้ CSS variable ปรับไม่ได้'); return; }
    if (!document.getElementById('rk-tweak-style')) {
      var st = el('style'); st.id = 'rk-tweak-style'; st.textContent = CSS; document.head.appendChild(st);
    }

    panel = el('div', 'rkt d-' + dock);
    var hd = el('div', 'rkt-hd'); hd.appendChild(el('b', null, 'ปรับหน้าตา'));

    /* ย้ายกล่องไปมุมที่ไม่บังของที่กำลังดู */
    var dk = el('div', 'rkt-dk');
    [['left','◧','ชิดซ้าย'], ['right','◨','ชิดขวา'], ['bottom','▤','ด้านล่าง'],
     ['float','❐','ลอย'], ['min','—','ย่อ']].forEach(function (d) {
      var b = el('button', dock === d[0] ? 'on' : '', d[1]); b.title = d[2];
      b.onclick = function () {
        dock = d[0];
        panel.className = 'rkt d-' + dock;
        try { localStorage.setItem(DOCKKEY, dock); } catch (e) {}
        dk.querySelectorAll('button').forEach(function (q, i) {
          q.className = (['left','right','bottom','float','min'][i] === dock) ? 'on' : '';
        });
      };
      dk.appendChild(b);
    });
    hd.appendChild(dk);
    var x = el('button', 'rkt-x', '✕'); x.onclick = close; hd.appendChild(x);
    panel.appendChild(hd);

    var tabs = el('div', 'rkt-tabs');
    [['pick','ชี้แล้วปรับ'], ['tone','โทนรวม'], ['pos','ตำแหน่ง']].forEach(function (t) {
      var b = el('button', 'rkt-tb', t[1]); b.dataset.t = t[0];
      b.onclick = function () { stopMode(); tab = t[0]; rebuild(); };
      tabs.appendChild(b);
    });
    panel.appendChild(tabs);
    panel.appendChild(el('div', 'rkt-bd'));

    var ft = el('div', 'rkt-ft');
    var out = el('textarea'); out.className = 'rkt-out'; out.readOnly = true;
    out.placeholder = 'ปรับเสร็จแล้วกดปุ่มเขียวข้างบน ข้อความจะมาอยู่ตรงนี้';

    /* ปุ่มเดียวจบ: เขียนข้อตกลงลงตัวไฟล์ mockup เอง ไม่สร้างไฟล์ชื่อใหม่ */
    var b1 = el('button', 'rkt-b go', 'เสร็จแล้ว · เซฟลง mockup');
    b1.title = 'เขียนหน้าตาที่ปรับไว้ลงในไฟล์ mockup ตัวนี้เลย';
    b1.onclick = function () { saveLocal(true); saveSelf(out); };

    var help = el('div', 'rkt-note');
    help.innerHTML = 'กดปุ่มเขียว → เลือกทับไฟล์เดิม <b>' + selfName() + '</b> → กด Save<br>' +
      'แล้ว<b>พิมพ์บอก Claude ว่า "ปรับไว้แล้ว"</b> พอเลย ไม่ต้องก๊อปอะไร';
    var b2 = el('button', 'rkt-b', 'ดู CSS');
    b2.onclick = function () { out.value = cssText(); out.focus(); out.select(); };
    var b3 = el('button', 'rkt-b', 'คัดลอกแทน');
    b3.onclick = function () { copy(agreedBlockText(), out, 'คัดลอกแล้ว วางในแชท กด Ctrl+V'); };
    var b4 = el('button', 'rkt-b warn', 'ล้างทั้งหมด'); b4.onclick = resetAll;
    var bs = el('div', 'rkt-btns');
    [b2, b3, b4].forEach(function (b) { bs.appendChild(b); });
    ft.appendChild(b1); ft.appendChild(help); ft.appendChild(out); ft.appendChild(bs);
    panel.appendChild(ft);

    document.body.appendChild(panel);
    document.addEventListener('click', onPageClick, true);
    document.addEventListener('mouseover', onPageOver, true);
    rebuild();
  }
  function close() {
    stopMode();
    document.removeEventListener('click', onPageClick, true);
    document.removeEventListener('mouseover', onPageOver, true);
    if (panel) { panel.remove(); panel = null; }
  }

  W.RK.tweak = { open: open, close: close, css: cssText, agreed: agreedBlockText,
                 html: buildSelfHtml, save: function () { saveSelf(null); }, reset: resetAll };

  document.addEventListener('keydown', function (e) {
    if (e.ctrlKey && e.shiftKey && (e.key === 'T' || e.key === 't')) { e.preventDefault(); panel ? close() : open(); }
    if (e.key === 'Escape' && mode) { stopMode(); rebuild(); }
  });

  function boot() {
    orig = readTokens();
    blocks = scanBlocks();
    /* 1) ข้อตกลงที่ฝังไว้ในไฟล์ (ของจริงต้องสร้างตามนี้) */
    var tag = document.getElementById('rk-tweak-agreed');
    if (tag) { try { applyAgreement(JSON.parse(tag.textContent)); } catch (e) {} }
    /* 2) ของที่ยังลองอยู่ในเครื่องนี้ ทับข้อตกลงได้ */
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) applyAgreement(JSON.parse(raw));
    } catch (e) {}
    if (/[?&]tweak=1/.test(location.search)) open();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
</body>
</html>
