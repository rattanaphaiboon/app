<!doctype html>
<html lang="th" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Demo แจ้งเตือนไม่ซ้ำ</title>
<link rel="stylesheet" href="https://rattanaphaiboon.github.io/app/rattana-ui/rattana-ui.css">
<script src="https://rattanaphaiboon.github.io/app/rattana-ui/rattana-ui.js" defer></script>
<style>
body{margin:0;background:#eef1f6;font-family:'IBM Plex Sans Thai',Sarabun,sans-serif;color:#0d1b3e}
.wrap{max-width:560px;margin:90px auto 40px;padding:0 16px}
.card{background:#fff;border-radius:22px;padding:18px;box-shadow:0 6px 24px rgba(13,27,62,.08);margin-bottom:16px}
h2{margin:0 0 4px;font-size:18px}
p{margin:0 0 14px;color:#5a6478;font-size:14px;line-height:1.5}
.pill{display:flex;align-items:center;justify-content:space-between;background:#fff;border:1.5px solid #dfe4ee;border-radius:999px;padding:6px}
.pill b{font-size:18px}
.pm{width:48px;height:48px;border-radius:999px;border:0;font-size:24px;font-weight:700;cursor:pointer}
.pm.minus{background:#eef1f6;color:#0d1b3e}
.pm.plus{background:linear-gradient(180deg,#ffd35a,#c9a84c);color:#0d1b3e}
.row{display:flex;gap:10px;margin-top:12px}
.row button{flex:1}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px;margin-bottom:8px}
.tag.old{background:#fde8e8;color:#b42318}.tag.new{background:#e7f6ec;color:#127a3c}
/* เด้งเบา ๆ ตอนกดซ้ำ ให้รู้ว่ารับรู้แล้ว */
.rt-toast.rt-toast-bump{animation:rtBump .32s cubic-bezier(.3,1.6,.5,1) both}
@keyframes rtBump{0%{transform:scale(1)}40%{transform:scale(1.05)}100%{transform:scale(1)}}
</style>
</head>
<body class="rt-app">
<div class="wrap">
  <div class="card">
    <span class="tag new">แบบใหม่</span>
    <h2>กระทิงแดง 150มล. · ลังx50</h2>
    <p>กด + รัว ๆ แจ้งเตือนขึ้น<b>อันเดียว</b> กดซ้ำ = แถบสีเหลืองเต็มใหม่ + เด้งเบา ๆ (นับเวลาใหม่) · หยุดกด 3.5 วิ ค่อยหายไป</p>
    <div class="pill"><button class="pm minus" onclick="toastNew()">−</button><b>0 ลัง</b><button class="pm plus" onclick="toastNew()">+</button></div>
  </div>
  <div class="card">
    <span class="tag old">แบบเดิม (live ตอนนี้)</span>
    <p>กดเท่าไหร่ขึ้นเท่านั้น ซ้อนกันเต็มจอ</p>
    <button class="rt-btn rt-btn-glass rt-btn-block" onclick="toastOld()">+ แบบเดิม</button>
  </div>
</div>
<script>
const MSG='สินค้านี้ให้เฉพาะร้านที่เคยซื้อ - ร้านนี้ยังสั่งไม่ได้ค่ะ';
function toastOld(){ RattanaUI.toast(MSG,{type:'error',duration:3500}); }

/* ===== โค้ดชุดเดียวกับที่จะใส่ใน showToast ของ ROO ===== */
const _toastLive=new Map();
function showToastOnce(msg,type){
  const key=type+'|'+msg, DUR=3500;
  const cur=_toastLive.get(key);
  if(cur && cur.h.el.isConnected && !cur.h.el.classList.contains('is-leaving')){
    cur.arm();                                                     // นับเวลาใหม่
    const bar=cur.h.el.querySelector('.rt-toast-bar'); if(bar) bar.replaceWith(bar.cloneNode());   // แถบเหลืองเต็มใหม่
    const t=cur.h.el; t.classList.remove('rt-toast-bump'); void t.offsetWidth; t.classList.add('rt-toast-bump');
    try{ RattanaUI.haptic && RattanaUI.haptic('light'); }catch(e){}
    return;
  }
  const h=RattanaUI.toast(String(msg),{type:type,duration:3600000});   // ตัวปิดเอง = ของเรา
  h.el.style.setProperty('--rt-toast-dur',DUR+'ms');
  const rec={h:h,tm:0,arm(){ clearTimeout(rec.tm); rec.tm=setTimeout(()=>{ h.close(); _toastLive.delete(key); },DUR); }};
  h.el.addEventListener('mouseenter',()=>clearTimeout(rec.tm));   // เอาเมาส์ชี้ = ค้างไว้ (เหมือนเดิม)
  h.el.addEventListener('mouseleave',()=>rec.arm());
  rec.arm(); _toastLive.set(key,rec);
}
function toastNew(){ showToastOnce(MSG,'error'); }
</script>
</body>
</html>
