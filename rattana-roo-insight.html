<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ROO Insight v0.5 (demo)</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--navy:#0d1b3e;--navy2:#1a2b5c;--gold:#c9a84c;--gold2:#e8d39a;--bg:#f3f4f8;--card:#fff;--tx:#1b2333;--mut:#6b7385;--line:#e4e6ee;
 --ok:#1e9e5a;--warn:#d98b13;--bad:#d64545;--blue:#3d6fd8;--soft:#eef1f8;--pri:#0d1b3e}
@media (prefers-color-scheme:dark){:root{--bg:#0a1126;--card:#121c3a;--tx:#e7eaf3;--mut:#9aa3b8;--line:#25325a;--soft:#18234a;--pri:#e8d39a}}
*{box-sizing:border-box}
body{margin:0;font-family:Sarabun,system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:15px}
header{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;padding:14px 16px 12px}
header h1{margin:0;font-size:20px;font-weight:700}
header h1 small{color:var(--gold2);font-weight:500;font-size:13px;margin-left:4px}
.demo{background:var(--gold);color:var(--navy);font-size:11px;font-weight:700;padding:1px 7px;border-radius:6px;vertical-align:3px}
header .sub{font-size:12.5px;color:#c8cfe3;margin-top:2px}
.bar{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;align-items:center}
.bar .lb{font-size:12.5px;color:#c8cfe3;margin-right:2px}
.chip{border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;border-radius:99px;padding:5px 12px;font:inherit;font-size:13.5px;cursor:pointer}
.chip.on{background:var(--gold);border-color:var(--gold);color:var(--navy);font-weight:700}
select{font:inherit;font-size:13.5px;border-radius:99px;padding:5px 10px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;max-width:100%}
select option{color:#000}
main{max-width:1100px;margin:0 auto;padding:14px 16px 48px;display:grid;gap:14px}
.card{background:var(--card);border-radius:18px;padding:16px;border:1px solid var(--line);min-width:0}
.hero{background:linear-gradient(135deg,var(--navy),#22356e);color:#fff;border:0}
.hero .k{font-size:13px;color:var(--gold2);font-weight:600}
.hero .big{font-size:32px;font-weight:800;line-height:1.2;margin:4px 0}
.hero .big em{font-style:normal;color:var(--gold)}
.hero p{margin:6px 0 0;color:#d5dbec;font-size:14px;line-height:1.6}
.hero p b{color:#fff}
.hero .kp{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
@media (max-width:640px){.hero .kp{grid-template-columns:repeat(2,1fr)}.hero .big{font-size:25px}}
.hero .kp div{background:rgba(255,255,255,.07);border-radius:12px;padding:8px 10px}
.hero .kp b{display:block;font-size:19px}
.hero .kp span{font-size:12px;color:#c8cfe3}
.up{color:#3fd18a}.dn{color:#ff8a8a}
.sec{font-size:13px;font-weight:700;color:var(--mut);margin:8px 2px -4px}
.op{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;padding:16px;border-left:6px solid var(--gold)}
.op.r1{border-left-color:var(--bad)}.op.r2{border-left-color:var(--warn)}
.op .ic{font-size:30px;grid-row:span 3;line-height:1}
.op .amt{font-size:26px;font-weight:800;line-height:1.1}
.op .amt small{font-size:13px;font-weight:500;color:var(--mut);margin-left:6px}
.op .what{font-size:16px;font-weight:700;margin-top:2px}
.op .why{color:var(--mut);font-size:13.5px;line-height:1.5}
.op .do{grid-column:2;margin-top:8px;background:var(--soft);border-radius:12px;padding:9px 12px;font-size:14px;line-height:1.5}
.op .do b{color:var(--ok)}
@media (max-width:640px){.op{grid-template-columns:1fr}.op .ic{grid-row:auto}.op .do,details{grid-column:1!important}}
.who{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--navy);color:#fff;margin-right:6px;vertical-align:1px}
@media (prefers-color-scheme:dark){.who{background:var(--gold);color:var(--navy)}}
details{grid-column:2;margin-top:8px}
summary{cursor:pointer;color:var(--blue);font-weight:600;font-size:13.5px;list-style:none}
summary::before{content:"▸ "}details[open] summary::before{content:"▾ "}
.tw{overflow-x:auto;margin-top:8px;max-height:420px;overflow-y:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;color:var(--mut);font-weight:600;font-size:12px;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;background:var(--card)}
td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tag{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:99px;font-weight:600;white-space:nowrap}
.t-bad{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.t-warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.t-ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.t-mut{background:var(--soft);color:var(--mut)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:860px){.g2{grid-template-columns:1fr}}
.card h2{margin:0 0 2px;font-size:16px}
.hint{color:var(--mut);font-size:12.5px;margin-bottom:10px}
.ch{position:relative;height:240px}
.note{font-size:13px;line-height:1.5;margin-top:10px;padding:8px 11px;border-radius:10px;background:var(--soft)}
#load{text-align:center;padding:60px 0;color:var(--mut)}
.empty{color:var(--mut);font-size:13.5px;padding:6px 0}
.rmv{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.rmv div{border-radius:14px;padding:12px 14px;background:var(--soft)}
.rmv div.y{background:color-mix(in srgb,var(--ok) 13%,transparent)}
.rmv b{display:block;font-size:30px;font-weight:800;line-height:1.1}
.rmv span{font-size:12.5px;color:var(--mut)}
.verdict{font-size:15px;font-weight:700;line-height:1.5;margin:4px 0 8px}
.verdict.good{color:var(--ok)}.verdict.meh{color:var(--warn)}
.sub2{font-size:15px;font-weight:700;margin:20px 0 2px;padding-top:14px;border-top:1px solid var(--line)}
</style>
</head>
<body>
<header>
  <h1>📊 ROO Insight <small>v0.5</small> <span class="demo">DEMO</span></h1>
  <div class="sub" id="sub">เงินที่ยังเก็บได้จาก ROO + ใครต้องทำอะไร · ข้อมูลสดจากชีทออเดอร์ ROO, sale data, Stocksync</div>
  <div class="bar" id="fRole"></div>
  <div class="bar"><span class="lb">เซลล์</span><select id="fSale"><option value="">ทุกคน</option></select>
    <span class="lb">ช่องทาง</span><select id="fCh"><option value="all">ทั้งหมด</option><option>ทั่วไป</option><option>ร้านส่ง</option></select>
    <span class="lb">คลัง</span><select id="fWh"><option value="all">ทั้งหมด</option><option>W1</option><option value="W4">W4 (+C4)</option></select>
    <button class="chip" id="re" style="margin-left:auto">↻ โหลดใหม่</button></div>
</header>
<main id="main"><div id="load">⏳ กำลังโหลดออเดอร์ 15 วัน + บิลจริง + สต็อก…</div></main>

<script>
const VERSION='0.5';
const SHEET='18RSfuDdCadccWS_3v_Ggi70_X8FGEIVGrGUedkQLYUw';
const TABS=[{gid:'1594522176',ch:'ทั่วไป'},{gid:'288498548',ch:'ร้านส่ง'}];
const STOCK={id:'16mYDqAqqJma-_0vCIAajy6bcjdOZ7F6VagxkdkqAB2I',gid:'635140262'};
const SALE={id:'1NxFkxiQev0xxGir93-qt0flNfzHz848-KuE7jDRSxQE',gid:'429808572'};   /* sale data · Channal=Online = ROO */
const DOW=['อา','จ','อ','พ','พฤ','ศ','ส'];
const ROLES=[['all','👀 ทุกคน'],['sale','🧑‍💼 เซลล์'],['wh','🏭 คลัง/เปิดบิล'],['buy','🛒 จัดซื้อ'],['app','📱 ทีมแอป']];
const LBL={cart:'ตะกร้าค้าง',fill:'สั่งแล้วไม่ได้ของ',drop:'ติ๊กออกตอนยืนยัน',lost:'ร้านหายไป',stock:'ของขายดีใกล้หมด'};
const F={role:'all',sale:'',ch:'all',wh:'all'};
let ROWS=[],SALES=[],STK={},CODE={},TODAY,W={},CHARTS=[];

/* ---------- โหลด ---------- */
function csv(t){const out=[];let row=[],f='',q=false;for(let i=0;i<t.length;i++){const c=t[i];
  if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}
  else if(c=='"')q=true;else if(c==','){row.push(f);f=''}else if(c=='\n'){row.push(f);out.push(row);row=[];f=''}else if(c!='\r')f+=c}
  if(f||row.length){row.push(f);out.push(row)}return out}
async function gviz(id,gid,q){const u=`https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:csv&gid=${gid}&headers=1&tq=${encodeURIComponent(q)}`;
  const r=await fetch(u);if(!r.ok)throw new Error('โหลดชีทไม่ได้ '+r.status);return csv(await r.text()).slice(1)}
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const dmy=s=>{const [d,m,y]=s.split('/');return new Date(+y,m-1,+d)};
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const num=v=>{const n=parseFloat(String(v).replace(/,/g,''));return isNaN(n)?0:n};
const code=v=>String(v||'').trim().replace(/\.0+$/,'');
/* STOCK = ลัง.ชิ้น (49.10 = 49 ลัง 10 ชิ้น) ห้าม parseFloat */
function stockEA(s,perCS){s=String(s||'').trim();if(!s)return 0;const neg=s.startsWith('-');s=s.replace('-','').replace(/,/g,'');
  const [c,e]=s.split('.');const v=(parseInt(c)||0)*(perCS||1)+(parseInt(e)||0);return neg?-v:v}

async function load(){
  TODAY=new Date();TODAY.setHours(0,0,0,0);
  /* ⚠️ เทียบเฉพาะ "วันที่จบแล้ว" — v0.2 เอาวันนี้ (ครึ่งวัน) ไปเทียบกับวันเต็ม ยอดเลยดูเหมือนตก 28% ทั้งที่จริงขึ้น */
  W={cE:addD(TODAY,-1),cS:addD(TODAY,-7),pE:addD(TODAY,-8),pS:addD(TODAY,-14)};
  const q=`select A,B,D,E,G,H,I,K,L,M,N,P,Q,S,U,AM,J where A >= date '${ymd(W.pS)}'`;
  const [a,b,s,sd]=await Promise.all([...TABS.map(t=>gviz(SHEET,t.gid,q)),
    gviz(STOCK.id,STOCK.gid,'select A,N,O,P,Q,BN,BQ,BR,BC,B,D,F,H where A is not null'),
    gviz(SALE.id,SALE.gid,"select A,B,C,D,G,H,O,P where Z='Online'").catch(e=>{console.warn('sale data',e);return []})]);
  s.forEach(r=>{const per={EA:num(r[1])||1,PA:num(r[2])||0,BP:num(r[3])||0,CS:num(r[4])||0};
    const nm=r[0].trim();STK[nm]={per,W1:stockEA(r[5],per.CS),W4:stockEA(r[6],per.CS)+stockEA(r[7],per.CS),grp:r[8]||'ไม่ระบุหมวด'};
    [r[9],r[10],r[11],r[12]].forEach(c=>{c=String(c||'').trim();if(c)CODE[c]=nm})});
  [a,b].forEach((rows,i)=>rows.forEach(r=>{
    if(!r[0]||r[8])return;                       // ไม่มีวัน / ยกเลิก
    const d=dmy(r[0]),hr=parseInt(String(r[1]).split(/[.:]/)[0]);
    const unit=(r[10].match(/\((EA|PA|BP|CS)\)/)||[])[1]||'EA';
    let nm=r[7].trim();if(!STK[nm]&&CODE[String(r[16]).trim()])nm=CODE[String(r[16]).trim()];
    const st=STK[nm];let per=st?.per[unit]||0;if(!per){const m=r[10].match(/x(\d+)/);per=m?+m[1]:1}
    ROWS.push({ch:TABS[i].ch,d,day:ymd(d),hr:isNaN(hr)?null:hr,sale:String(r[2]).replace(/\s*\(ROO\)\s*/,'').trim()||'(ไม่ระบุ)',
      shop:(r[4]||r[5]||'').trim(),scode:code(r[5]),gift:r[6]=='แถม',name:nm,qty:num(r[9]),unit:r[10],amt:num(r[11]),bill:r[12],
      wh:(r[13]||'').trim().toUpperCase()=='W1'?'W1':'W4',grp:st?.grp||'ไม่ระบุหมวด',
      stat:r[14]=='อนุมัติ'?'ok':r[14]=='ไม่อนุมัติ'?'drop':'cart',src:(r[15]||'').split(',').map(x=>x.trim()).filter(Boolean),
      ea:num(r[9])*per,time:String(r[1])});
  }));
  sd.forEach(r=>{if(!r[0])return;const d=dmy(r[0]);
    SALES.push({d,day:ymd(d),scode:code(r[2]),name:r[4].trim(),ea:num(r[5]),amt:num(r[6]),wh:String(r[7]).toUpperCase()=='W1'?'W1':'W4'})});
}

/* ---------- ช่วย ---------- */
const fmt=n=>Math.round(n).toLocaleString('th-TH');
const baht=n=>(n<0?'-':'')+'฿'+(Math.abs(n)>=1e6?(Math.abs(n)/1e6).toFixed(2)+'M':Math.abs(n)>=1e4?(Math.abs(n)/1e3).toFixed(0)+'K':fmt(Math.abs(n)));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fd=d=>`${d.getDate()}/${d.getMonth()+1}`;
const fday=s=>{const d=new Date(s);return `${DOW[d.getDay()]} ${fd(d)}`};
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const inR=(d,a,b)=>d>=a&&d<=b;
const sumAmt=a=>a.reduce((s,r)=>s+r.amt,0);
const short=(s,n=24)=>s.length>n?s.slice(0,n-1)+'…':s;
function toUnit(ea,name){const p=STK[name]?.per;if(p?.CS>1&&ea>=p.CS)return (ea/p.CS).toFixed(ea/p.CS<10?1:0)+' ลัง';return fmt(ea)+' ชิ้น'}
const groupBy=(a,k)=>a.reduce((m,r)=>((m[typeof k=='function'?k(r):r[k]]??=[]).push(r),m),{});
const table=(head,rows,empty='ไม่มี')=>rows.length?`<div class="tw"><table><tr>${head.map(h=>`<th class="${h[1]||''}">${h[0]}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map((c,i)=>`<td class="${head[i][1]||''}">${c}</td>`).join('')}</tr>`).join('')}</table></div>`:`<div class="empty">${empty}</div>`;

/* ---------- คำนวณ ---------- */
function compute(){
  const all=ROWS.filter(r=>(F.ch=='all'||r.ch==F.ch)&&(F.wh=='all'||r.wh==F.wh)&&(!F.sale||r.sale==F.sale));
  const shopSet=new Set(all.map(r=>r.scode));
  const sales=SALES.filter(s=>(F.wh=='all'||s.wh==F.wh)&&(F.ch=='all'&&!F.sale||shopSet.has(s.scode)));
  const ok=all.filter(r=>r.stat=='ok'&&!r.gift);
  const cur=ok.filter(r=>inR(r.d,W.cS,W.cE)),prev=ok.filter(r=>inR(r.d,W.pS,W.pE));
  const D={all,sales,K:{amt:sumAmt(cur),amtP:sumAmt(prev),bill:new Set(cur.map(r=>r.bill)).size,billP:new Set(prev.map(r=>r.bill)).size,
    shop:new Set(cur.map(r=>r.shop)).size,shopP:new Set(prev.map(r=>r.shop)).size}};
  const O=[];

  /* ① ตะกร้าค้าง — ของอยู่ในตะกร้า (รออนุมัติ) ยังไม่กดยืนยัน · 7 วันล่าสุดรวมวันนี้ */
  const cart=all.filter(r=>r.stat=='cart'&&!r.gift&&r.d>=W.cS);
  const cartBy=Object.values(groupBy(cart,'shop')).map(a=>({shop:a[0].shop,sale:a[0].sale,amt:sumAmt(a),n:a.length,first:a.map(r=>r.day).sort()[0],last:a.map(r=>r.day+' '+r.time).sort().pop()}))
    .sort((a,b)=>b.amt-a.amt);
  O.push({key:'cart',owner:'sale',who:'เซลล์',ic:'🛒',amt:sumAmt(cart),amtNote:'อยู่ในตะกร้าตอนนี้',what:`ของค้างในตะกร้า ${cartBy.length} ร้าน ยังไม่กดยืนยัน`,
    why:`ลูกค้าเลือกของใส่ตะกร้าแล้ว แต่ไม่ได้กดส่งออเดอร์ = ยังไม่มีบิล ไม่มีของไปส่ง`,
    doHtml:`<b>ทักไลน์/โทรหาร้าน</b> “มีของค้างในตะกร้า กดยืนยันได้เลยครับ” เริ่มจากร้านยอดสูงสุด · ระยะยาว: ให้ระบบส่งไลน์เตือนอัตโนมัติก่อนตัดรอบ (ทีมแอป)`,
    list:table([['ร้าน'],['เซลล์'],['ในตะกร้า','n'],['รายการ','n'],['ค้างตั้งแต่'],['กดล่าสุด']],
      cartBy.map(x=>[esc(x.shop),esc(x.sale),baht(x.amt),x.n,fday(x.first),fday(x.last.slice(0,10))+' '+x.last.slice(11)]))});

  /* ② สั่งแล้วไม่ได้ของ — ออเดอร์ยืนยัน S..E-2 เทียบบิลจริง S..E (บิลออก 0-2 วันหลังยืนยัน ~85%) จับคู่ รหัสร้าน+สินค้า */
  if(sales.length){
    const sd=sales.map(s=>s.d.getTime()),S=new Date(Math.min(...sd)),E=new Date(Math.max(...sd)),oE=addD(E,-2);
    const ordRows=ok.filter(r=>r.scode&&inR(r.d,S,oE));
    const bil={};sales.forEach(s=>{const k=s.scode+'|'+s.name;const o=bil[k]??={amt:0,ea:0};o.amt+=s.amt;o.ea+=s.ea});
    const ordK=groupBy(ordRows,r=>r.scode+'|'+r.name);let tot=0,hit=0;const gapLines=[];
    Object.entries(ordK).forEach(([k,a])=>{const amt=sumAmt(a),ea=a.reduce((s,r)=>s+r.ea,0),b=bil[k]||{amt:0,ea:0};tot+=amt;hit+=Math.min(amt,b.amt);
      if(b.amt<amt*0.9)gapLines.push({name:a[0].name,bills:new Set(a.map(r=>r.bill)),amt,gap:amt-b.amt,ea,bea:b.ea,partial:b.amt>0})});
    const byBill={};ordRows.forEach(r=>{const o=byBill[r.bill]??={bill:r.bill,shop:r.shop,sale:r.sale,day:r.day,amt:0,lines:new Set(),got:new Set()};
      o.amt+=r.amt;o.lines.add(r.name);if(bil[r.scode+'|'+r.name])o.got.add(r.name)});
    const gapByBill={};gapLines.forEach(g=>g.bills.forEach(b=>{gapByBill[b]=(gapByBill[b]||0)+g.gap/g.bills.size}));
    const billRows=Object.entries(gapByBill).map(([b,gap])=>({...byBill[b],gap})).filter(x=>x.shop).sort((a,b)=>b.gap-a.gap);
    const whole=billRows.filter(x=>x.got.size==0),part=gapLines.filter(g=>g.partial);
    const prodGap=Object.values(groupBy(gapLines,'name')).map(a=>{const st=STK[a[0].name];return{name:a[0].name,gap:a.reduce((s,g)=>s+g.gap,0),shops:a.length,
      ord:a.reduce((s,g)=>s+g.ea,0),got:a.reduce((s,g)=>s+g.bea,0),stock:st?(F.wh=='all'?st.W1+st.W4:st[F.wh]):null}}).sort((a,b)=>b.gap-a.gap);
    const gap=tot-hit,nDay=Math.round((oE-S)/864e5)+1;
    D.fill={rate:tot?hit/tot*100:0,tot,hit,gap,S,E,oE};
    O.push({key:'fill',owner:'wh',who:'คลัง/เปิดบิล',ic:'📦',amt:gap*7/nDay,amtNote:'ต่อสัปดาห์ (เฉลี่ย)',

const tdays=s=>{s=String(s||'').replace(/พฤหัสบดี/g,'พฤหัส').replace(/พฤหัส/g,'พฤหัสบดี');return TDAY.filter(d=>s.includes(d))};
const nm0=s=>String(s||'').replace(/\s+/g,'');
async function gvizName(id,name,q){const u=`https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:csv&headers=1&sheet=${encodeURIComponent(name)}&tq=${encodeURIComponent(q)}`;
  const r=await fetch(u);if(!r.ok)throw new Error(name+' '+r.status);return csv(await r.text()).slice(1)}
async function supaAll(t,since){
  const cols=['วัน','เวลา','รหัสร้าน','ชื่อร้าน','สถานะอนุมัติ','orderId','รูปแบบ','ยอดเงินรวม'].map(c=>`"${c}"`).join(',')+',created_at';
  const base=`${SUPA.url}${t}?select=${encodeURIComponent(cols)}&${encodeURIComponent('"วัน"')}=gte.${since}&order=id`;
  const h={apikey:SUPA.key,Authorization:'Bearer '+SUPA.key};
  const r0=await fetch(base,{headers:{...h,Range:'0-0',Prefer:'count=exact'}});if(!r0.ok)throw new Error('Supabase '+r0.status);
  const total=+((r0.headers.get('content-range')||'').split('/')[1]||0),pages=[];for(let i=0;i<total;i+=1000)pages.push(i);
  const out=[];for(let j=0;j<pages.length;j+=6){(await Promise.all(pages.slice(j,j+6).map(i=>fetch(base,{headers:{...h,Range:`${i}-${i+999}`}}).then(r=>r.json())))).forEach(a=>out.push(...a))}
  return out}
async function loadRemind(){
  RM_BUSY=true;
  try{
    const since=ymd(addD(TODAY,-49));
    const [gen,spc,cus,reg,sp,fol]=await Promise.all([supaAll('roo_sales',since),supaAll('roo_special_sales',since),
      gviz(SHEET,'1169768881','select A,B,L,AD'),gviz(SHEET,'1357794184','select B,C,T,U,W'),gviz(SHEET,'1471115272','select B,C,D,O'),
      gvizName(SHEET,'ผู้ติดตาม','select A,E,J').catch(()=>[])]);
    const cusDay={},cusRoo={},cusName={};cus.forEach(r=>{const c=code(r[1]);if(!c||c in cusDay)return;cusDay[c]=tdays(r[2]);cusRoo[c]=r[3].trim()=='ROO';cusName[c]=r[0]});
    const regDay={},regUid=new Set();reg.forEach(r=>{const c=code(r[1]);if(!c)return;regDay[c]=tdays(r[4]);if(r[2].trim()||r[3].trim())regUid.add(c)});
    const spUid=new Set(sp.filter(r=>r[2].trim()||r[3].trim()).map(r=>code(r[0])));
    const folN=new Set(fol.filter(r=>r[1].trim()=='เป็นเพื่อน').map(r=>nm0(r[2])));
    /* ② เตือนถึงรอบสั่ง: ร้าน × วันจด → ยืนยันออเดอร์วันนั้นไหม */
    const tg={};Object.keys(cusDay).forEach(c=>{if(spUid.has(c))tg[c]={g:'ร้านส่ง',d:cusDay[c]};
      else if(cusRoo[c])tg[c]={g:(regUid.has(c)||folN.has(nm0(cusName[c])))?'ROO มีไลน์':'ROO ไม่มีไลน์ (เทียบ)',d:cusDay[c]}});
    const okDay={},okAmt={};[...gen,...spc].forEach(r=>{if(r['สถานะอนุมัติ']!='อนุมัติ'||r['รูปแบบ']=='แถม')return;const k=code(r['รหัสร้าน'])+'|'+r['วัน'];okDay[k]=1;okAmt[k]=(okAmt[k]||0)+(+r['ยอดเงินรวม']||0)});
    const route={},weeks={};
    for(let d=new Date(since+'T00:00');d<=W.cE;d=addD(d,1)){const s=ymd(d),s1=ymd(addD(d,1)),wd=TDAY[d.getDay()],aft=d>=ROUTE_START;
      const wk=ymd(addD(d,-((d.getDay()+6)%7)));
      Object.entries(tg).forEach(([c,t])=>{if(!t.d.includes(wd))return;const o=((route[t.g]??={})[aft?'after':'before']??={n:0,ok:0,ok2:0,amt:0});
        o.n++;if(okDay[c+'|'+s]){o.ok++;o.amt+=okAmt[c+'|'+s]}if(okDay[c+'|'+s]||okDay[c+'|'+s1])o.ok2++;
        const w=((weeks[t.g]??={})[wk]??={n:0,ok:0});w.n++;if(okDay[c+'|'+s])w.ok++})}
    /* ① เตือนลืมกดยืนยัน 18:00: ตะกร้าที่ยังค้างตอน 18:00 ครั้งแรก → ยืนยันภายใน 6/24/72 ชม.? */
    const cart={},left=[],sinceD=new Date(since+'T00:00'),confBill={},confCode={};
    const tsOf=(day,t)=>{const [h,m]=String(t||'0.0').replace(':','.').split('.');const d=new Date(day+'T00:00');d.setHours(+h||0,+m||0,0,0);return d};
    [[gen,'ทั่วไป'],[spc,'ร้านส่ง']].forEach(([rows,grp])=>{
      Object.values(groupBy(rows.filter(r=>r['รูปแบบ']!='แถม'),'orderId')).forEach(v=>{
        const first=new Date(Math.min(...v.map(x=>tsOf(x['วัน'],x['เวลา']))));
        const okr=v.filter(x=>x['สถานะอนุมัติ']=='อนุมัติ');const conf=okr.length?new Date(Math.max(...okr.map(x=>new Date(x.created_at)))):null;
        const c=code(v[0]['รหัสร้าน']);if(conf){confBill[v[0].orderId]=conf;(confCode[c]??=[]).push(conf)}const rd=grp=='ทั่วไป'?(regDay[c]||cusDay[c]||[]):(cusDay[c]||[]);const uid=grp=='ทั่วไป'?regUid.has(c):true;
        const amt=v.reduce((s,x)=>s+(+x['ยอดเงินรวม']||0),0);
        for(let k=0;k<4;k++){const D=addD(new Date(first.getFullYear(),first.getMonth(),first.getDate()),k);const e=new Date(D);e.setHours(18,0,0,0);
          if(conf&&conf<=e)break;
          if(first<e){if(D<sinceD||D>W.cE)break;
            const rem=uid&&rd.includes(TDAY[D.getDay()]);const o=((cart[grp]??={})[rem?'y':'n']??={n:0,h6:0,h24:0,h72:0,amt:0});
            const dh=conf?(conf-e)/36e5:1e9;o.n++;o.amt+=amt;if(dh<=6)o.h6++;if(dh<=24)o.h24++;if(dh<=72)o.h72++;
            if(rem&&dh>24&&D>=addD(TODAY,-8))left.push({shop:v[0]['ชื่อร้าน'],grp,day:ymd(D),amt,late:!!conf});
            break}}
      })});
    /* 📒 ประวัติเตือนจริง (.gs v2.73 เริ่มเก็บ 12/11) — แท็บ ประวัติเตือน
       ⚠️ gviz ขอแท็บที่ไม่มี = ได้แท็บอื่นกลับมาเงียบ ๆ → เช็คหัวคอลัมน์ก่อนเสมอ */
    let LOG=null;
    try{const u=`https://docs.google.com/spreadsheets/d/${SHEET}/gviz/tq?tqx=out:csv&headers=1&sheet=${encodeURIComponent('ประวัติเตือน')}&tq=${encodeURIComponent('select A,B,C,D,E,F,G,H')}`;
      const t=csv(await (await fetch(u)).text());
      if(t[0]&&t[0][2]=='ประเภท'&&t[0][7]=='ผลส่ง'){
        const res={};
        t.slice(1).filter(r=>r[0]).forEach(r=>{const at=new Date(r[0]+'T'+(r[1]||'00:00'));const c=code(r[3]);
          const k=r[2]+'|'+r[0]+'|'+c;if(res[k])return;           /* ร้านเดียวหลายเครื่อง = นับครั้งเดียว */
          const sent=r[7]=='200';const end=new Date(at.getTime()+24*36e5);
          const back=r[6]?(confBill[r[6]]&&confBill[r[6]]>at&&confBill[r[6]]<=end):(confCode[c]||[]).some(t=>t>at&&t<=end);
          const anyBack=back||(confCode[c]||[]).some(t=>t>at&&t<=end);
          res[k]={type:r[2],day:r[0],time:r[1],code:c,shop:r[4],grp:r[5],sent,back:anyBack}});
        LOG=Object.values(res);
      }else LOG=[];
    }catch(e){LOG=[]}
    RM={route,weeks,cart,left:left.sort((a,b)=>b.amt-a.amt),since,LOG};
  }catch(e){RM_ERR=e.message;console.error(e)}
  RM_BUSY=false;renderRemind();
}

  if(!RM){box.innerHTML='<div class="empty">⏳ กำลังดึงประวัติออเดอร์ 7 สัปดาห์จาก Supabase เพื่อวัดผลการเตือน…</div>';if(!RM_BUSY)loadRemind();return}

  const col={'ร้านส่ง':C.gold,'ROO มีไลน์':C.pri,'ROO ไม่มีไลน์ (เทียบ)':C.mut};
  CHARTS.push(new Chart(document.getElementById('cRmRoute'),{type:'line',data:{labels:wks.map(w=>{const d=new Date(w+'T00:00');return (d>addD(ROUTE_START,-7)&&d<=ROUTE_START?'▶ เริ่มเตือน ':'')+fd(d)}),
    datasets:Object.keys(RM.weeks).map(g=>({label:g,data:wks.map(w=>{const o=RM.weeks[g][w];return o&&o.n>=5?pc(o.ok,o.n):null}),borderColor:col[g],backgroundColor:col[g],tension:.3,pointRadius:3,borderDash:g.includes('เทียบ')?[4,4]:[]}))},
    options:{plugins:{tooltip:{callbacks:{label:c=>`${c.dataset.label} ${c.parsed.y?.toFixed(0)}%`}}},scales:{y:{min:0,ticks:{callback:v=>v+'%'}},x:{grid:{display:false}}}}}));
}
function ui(){
  const r=document.getElementById('fRole');r.innerHTML='<span class="lb">ดูในมุม</span>'+ROLES.map(([v,l])=>`<button class="chip ${F.role==v?'on':''}" data-v="${v}">${l}</button>`).join('');
  r.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{F.role=b.dataset.v;ui();ROWS.length&&render()});
}
['fSale','fCh','fWh'].forEach(id=>document.getElementById(id).onchange=e=>{F[{fSale:'sale',fCh:'ch',fWh:'wh'}[id]]=e.target.value;render()});
document.getElementById('re').onclick=()=>location.reload();
(async()=>{ui();try{const t=performance.now();await load();
  const sl=[...new Set(ROWS.filter(r=>r.d>=W.pS).map(r=>r.sale))].sort();document.getElementById('fSale').innerHTML='<option value="">ทุกคน</option>'+sl.map(s=>`<option>${esc(s)}</option>`).join('');
  document.getElementById('sub').textContent=`ออเดอร์แอป ${fmt(ROWS.length)} รายการ · บิลจริง ${fmt(SALES.length)} บรรทัด · โหลด ${((performance.now()-t)/1000).toFixed(1)} วิ`;
  render()}catch(e){document.getElementById('main').innerHTML=`<div id="load">❌ ${esc(e.message)}</div>`;console.error(e)}})();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>ROWS.length&&render());
</script>
</body>
