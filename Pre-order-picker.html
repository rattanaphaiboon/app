<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rattana Pre-order Picker v4.31</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  :root{
    --navy:#0d1b3e; --navy2:#13245a; --gold:#c9a84c; --gold-d:#a8862f; --green:#16a34a; --green-d:#15803d;
    --bg:#f4f6fb; --card:#ffffff; --border:#e2e7f0; --muted:#64748b;
    --text:#1e293b; --ok:#15803d; --warn:#b45309; --red:#dc2626;
    --w1:#FBBF24; --w2:#0EA5E9; --w3:#EF4444; --w4:#15803D; --c4:#4ADE80; --hq:#C9A84C;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Sarabun',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px}
  button{font-family:inherit;cursor:pointer}

  /* ---------- Login ---------- */
  #loginScreen{position:fixed;inset:0;background:linear-gradient(160deg,var(--navy),#1e3a8a);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
  .login-card{background:#fff;border-radius:18px;padding:34px 28px;max-width:380px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4)}
  .login-logo{width:64px;height:64px;border-radius:16px;background:var(--navy);color:var(--gold);display:flex;align-items:center;justify-content:center;font-size:30px;margin:0 auto 14px;font-weight:700}
  .login-card h1{font-size:19px;color:var(--navy);margin-bottom:4px}
  .login-card .sub{color:var(--muted);font-size:13px;margin-bottom:22px}
  #googleSignInBtn{display:flex;justify-content:center;margin-bottom:14px}
  .login-bypass{background:var(--navy);color:#fff;border:none;border-radius:10px;padding:11px 18px;width:100%;font-size:14px;font-weight:600}
  .login-bypass:hover{background:var(--navy2)}
  #loginError{display:none;background:#fef2f2;color:var(--red);border:1px solid #fecaca;border-radius:10px;padding:10px;font-size:13px;margin-top:12px;text-align:left}
  #loginSpinner{display:none;margin-top:14px;color:var(--muted)}
  .login-ver{margin-top:16px;color:var(--muted);font-size:12px}

  /* ---------- App shell ---------- */
  #app{display:none}
  .topbar{position:sticky;top:0;z-index:50}
  header.appbar{background:var(--navy);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px}
  header.appbar .title{font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px}
  header.appbar .ver{background:var(--gold);color:var(--navy);font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px}
  header.appbar .spacer{flex:1}
  header.appbar .who{font-size:12px;color:#cbd5e1;text-align:right;line-height:1.3}
  .hub-btn{background:var(--gold);color:var(--navy);border:none;border-radius:8px;padding:7px 12px;font-weight:700;font-size:13px;display:flex;align-items:center;gap:5px;text-decoration:none}
  .hub-btn:hover{background:#d9bd6a}

  /* ---------- Filter bar (sticky) ---------- */
  .filterbar{background:var(--card);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;box-shadow:0 2px 8px rgba(0,0,0,.04)}
  .fld{display:flex;flex-direction:column;gap:3px}
  .fld label{font-size:11px;color:var(--muted);font-weight:600}
  .fld input,.fld select{font-family:inherit;font-size:14px;padding:7px 10px;border:1.5px solid var(--border);border-radius:8px;background:#fff;outline:none;min-width:120px}
  .fld input:focus,.fld select:focus{border-color:var(--gold)}
  .chk{display:flex;align-items:center;gap:6px;font-size:13px;padding-bottom:8px}
  .btn-load{background:var(--navy);color:#fff;border:none;border-radius:8px;padding:8px 16px;font-weight:600;font-size:14px;height:38px}
  .btn-load:hover{background:var(--navy2)}
  /* v3.92 (Surat): ชิปสลับมุมมอง — ยังไม่ได้กด = สีอ่อน · กดแล้ว = สีเข้ม (เดิมอันที่ไม่ได้กดสีทึบ อ่านยากว่าอันไหนถูกเลือก) */
  .vchip{font-family:inherit;font-size:13.5px;font-weight:700;padding:7px 14px;border-radius:9px;cursor:pointer;white-space:nowrap;
         background:#eef2f7;color:#64748b;border:1.5px solid #e2e8f0;transition:background .12s,color .12s,border-color .12s}
  .vchip:hover{background:#e2e8f0;color:var(--navy)}
  .vchip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  .vchip.warn{background:#fff5f5;color:#cf4545;border-color:#fbdada}          /* แท็บบัญชี — โทนแดง */
  .vchip.warn:hover{background:#ffe9e9;color:#dc2626}
  .vchip.warn.on{background:#dc2626;color:#fff;border-color:#dc2626}
  .vchip.sm{font-size:12.5px;padding:5px 11px;border-radius:8px}              /* หน้าย่อยในแท็บบัญชี */
  .vchip.sm.on{background:#0f172a;color:#fff;border-color:#0f172a}
  .btn-export{background:linear-gradient(135deg,var(--green),var(--green-d));color:#fff;border:none;border-radius:8px;padding:8px 18px;font-weight:700;font-size:14px;height:38px;display:flex;align-items:center;gap:6px}
  .btn-export:hover{filter:brightness(1.05)}
  .btn-export:disabled{opacity:.5;cursor:not-allowed}
  .chipgrp{display:flex;gap:4px;align-items:center}
  .chipgrp .lbl{font-size:11px;color:var(--muted);font-weight:700;margin-right:2px}
  .chip{background:#eef1f7;border:none;border-radius:20px;padding:6px 13px;font-size:13px;font-weight:600;color:#475569;cursor:pointer;white-space:nowrap;font-family:inherit}
  .chip:hover{background:#e2e7f0}
  .chip.on{background:var(--navy);color:#fff}

  /* ---------- Content ---------- */
  .wrap{padding:16px 16px 84px;max-width:1400px;margin:0 auto}
  .bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:1200;background:var(--navy);display:flex;box-shadow:0 -2px 12px rgba(0,0,0,.22)}
  .bottomnav .bn{flex:1;background:none;border:none;color:#cbd5e1;padding:7px 4px 8px;font-family:inherit;font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px;border-top:3px solid transparent}
  .bottomnav .bn span{font-size:21px;line-height:1}
  .bottomnav .bn.active{color:#fff;border-top-color:var(--gold);background:rgba(255,255,255,.07)}
  /* ☰ เมนูเพิ่มเติม (จัดรถ ฯลฯ) — ย้ายออกจากแถบล่าง */
  .burger-wrap{position:relative;flex:none}
  .burger-btn{background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.35);color:#fff;border-radius:9px;padding:5px 11px;font-size:17px;line-height:1;cursor:pointer;font-family:inherit}
  .burger-btn:hover,.burger-btn.on{background:var(--gold);border-color:var(--gold);color:var(--navy)}
  .burger-menu{display:none;position:absolute;left:0;top:calc(100% + 6px);z-index:1300;background:#fff;border:1.5px solid var(--border);border-radius:10px;box-shadow:0 10px 30px rgba(13,27,62,.25);min-width:170px;overflow:hidden}
  .burger-menu.open{display:block}
  .burger-menu button{display:flex;align-items:center;gap:9px;width:100%;background:none;border:none;padding:11px 14px;font-family:inherit;font-size:14px;font-weight:700;color:var(--navy);cursor:pointer;text-align:left}
  .burger-menu button:hover{background:#eef2ff}
  .burger-menu button span{font-size:18px;line-height:1}
  .burger-menu button.on{background:#f5f3ff;color:#6d28d9}
  .burger-menu button.on::after{content:'✓';margin-left:auto;font-size:13px;font-weight:800}
  .burger-sep{padding:8px 14px 4px;font-size:10.5px;font-weight:800;color:var(--muted);border-top:1px solid var(--border);margin-top:2px;letter-spacing:.3px}
  /* แถบบอกแหล่งข้อมูล (v3.57) — โผล่เฉพาะตอนใช้ Supabase ให้แอดมินไม่มีทางสับสนว่ากำลังดูข้อมูลชุดไหน */
  .src-badge{background:#f5f3ff;border:2px solid #a78bfa;border-left:7px solid #7c3aed;border-radius:12px;padding:10px 16px;margin-bottom:12px;display:flex;align-items:center;gap:11px;flex-wrap:wrap;font-size:13.5px;color:#4c1d95}
  .src-badge.bad{background:#fef2f2;border-color:var(--red);border-left-color:var(--red);color:#7f1d1d}
  .src-badge b{font-size:15px;font-weight:800}
  .src-badge .sb-sub{color:#6d28d9;font-size:12.5px}
  .src-badge.bad .sb-sub{color:#991b1b}
  .src-badge .sb-warn{background:#fffbeb;border:1.5px solid var(--gold);color:#92400e;font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:20px}
  .src-badge .sb-warn.clickable{cursor:pointer;transition:background .12s,border-color .12s}
  .src-badge .sb-warn.clickable:hover{background:#fef3c7;border-color:#b45309}
  /* v3.82: popup รายชื่อบิลที่ยังไม่คอนเฟิร์ม (draft) — เป็นของเซลไหน/ร้านไหน */
  .uncb-mask{display:none;position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:95;align-items:center;justify-content:center;padding:16px}
  .uncb-box{background:#fff;border-radius:16px;max-width:640px;width:100%;max-height:88vh;overflow:auto;box-shadow:0 24px 60px rgba(0,0,0,.35)}
  .uncb-hd{background:var(--gold);color:#3a2c00;padding:13px 20px;font-size:16px;font-weight:800;border-radius:16px 16px 0 0;position:sticky;top:0;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .uncb-hd .x{background:rgba(0,0,0,.13);border:none;color:#3a2c00;width:30px;height:30px;border-radius:50%;font-size:15px;font-weight:800;cursor:pointer;flex-shrink:0;line-height:1}
  .uncb-bd{padding:14px 18px}
  .uncb-lead{font-size:13px;color:var(--text);line-height:1.55;margin-bottom:12px}
  .uncb-lead .uncb-sub{color:var(--muted);font-size:12px}
  .uncb-grp{margin-bottom:13px;border:1px solid var(--border);border-radius:10px;overflow:hidden}
  .uncb-grp-h{background:#f8fafc;padding:8px 12px;font-size:13.5px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:8px}
  .uncb-grp-h .uncb-cnt{background:#fef9c3;color:#854d0e;font-size:11.5px;font-weight:800;padding:2px 9px;border-radius:20px;white-space:nowrap;flex-shrink:0}
  .uncb-tbl{width:100%;border-collapse:collapse;font-size:12.5px}
  .uncb-tbl th{background:#fff;text-align:left;color:var(--muted);font-weight:700;padding:5px 12px;border-bottom:1px solid var(--border)}
  .uncb-tbl td{padding:6px 12px;border-bottom:1px solid #f1f5f9;vertical-align:top}
  .uncb-tbl tr:last-child td{border-bottom:none}
  .uncb-tbl td.nowrap{white-space:nowrap;color:var(--muted)}
  .uncb-empty{text-align:center;color:var(--muted);padding:26px 0;font-size:14px}
  .src-badge button{margin-left:auto;background:#7c3aed;color:#fff;border:none;border-radius:8px;padding:7px 14px;font-size:12.5px;font-weight:700;font-family:inherit}
  /* v3.83: แถบเตือน "export แล้วสถานะไม่ลง Supabase" */
  .markfail{background:#fef2f2;border:2px solid var(--red);border-left:7px solid var(--red);border-radius:12px;padding:11px 16px;margin-bottom:12px;color:#7f1d1d;font-size:14px;line-height:1.5}
  .markfail b{color:#991b1b}
  .markfail .mf-list{margin:7px 0;max-height:130px;overflow:auto;font-size:12.5px;background:#fff;border:1px solid #fecaca;border-radius:8px;padding:6px 10px}
  .markfail .mf-list .muted{color:#9ca3af}
  .markfail button{background:var(--red);color:#fff;border:none;border-radius:9px;padding:8px 16px;font-size:13.5px;font-weight:800;font-family:inherit;cursor:pointer;margin-top:4px}
  .markfail button:active{transform:scale(.97)}
  /* ===== 💰 แบ่ง + โอน NonCS (share tab — 3 ขั้น) ===== */
  .share-steps{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 6px}
  .sstep{flex:1;min-width:170px;display:flex;align-items:center;gap:9px;padding:9px 12px;border:1.5px solid var(--border);border-radius:10px;background:#fff;cursor:pointer;font-family:inherit;text-align:left}
  .sstep .n{width:26px;height:26px;border-radius:50%;background:#e2e8f0;color:#334155;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none;font-size:13px}
  .sstep b{font-size:13.5px;color:var(--navy);display:block;line-height:1.25}
  .sstep small{display:block;font-size:10.5px;color:var(--muted);font-weight:400;line-height:1.3}
  .sstep .done{margin-left:auto;font-size:11px;font-weight:700;color:#166534;background:#dcfce7;border-radius:12px;padding:2px 8px;white-space:nowrap}
  .sstep.active{border-color:var(--navy);background:var(--navy)}
  .sstep.active b{color:#fff} .sstep.active small{color:#cbd5e1} .sstep.active .n{background:var(--gold);color:#1f2937}
  .share-arrow{align-self:center;color:#94a3b8;font-weight:800;flex:none}
  /* ===== 🚚 จัดรถ (jadrot) ===== */
  .jr-head{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:12px}
  .jr-whlock{display:inline-flex;align-items:center;gap:6px;color:#fff;font-weight:700;border-radius:8px;padding:6px 12px;font-size:13px}
  .jr-day{font-size:12.5px;color:var(--muted);font-weight:600}
  .jr-banner{background:#fffbeb;border:1px solid #fde68a;color:#92400e;border-radius:10px;padding:9px 13px;font-size:13px;font-weight:600;margin-bottom:12px}
  .jr-grid{display:grid;grid-template-columns:minmax(0,64%) minmax(0,36%);gap:14px;align-items:start}
  @media(max-width:980px){ .jr-grid{grid-template-columns:1fr} }
  .jr-trucks2{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start}
  @media(max-width:760px){ .jr-trucks2{grid-template-columns:1fr} }
  .jr-trucks2 .jr-truck.open{grid-column:1/-1}
  .jr-trucks2 .jr-truck{margin-bottom:0}
  .jr-trucks2 .jr-thead{padding:8px 11px;gap:7px} .jr-trucks2 .jr-tname{font-size:13.5px} .jr-trucks2 .jr-bars{padding:0 11px 7px} .jr-trucks2 .jr-tact{padding:0 11px 9px}
  .jr-right{position:sticky;top:8px;max-height:calc(100vh - 96px);overflow:auto}
  @media(max-width:980px){ .jr-right{position:static;max-height:none;overflow:visible} }
  .jr-pane h3{font-size:14px;color:var(--navy);font-weight:700;margin:2px 0 8px;display:flex;align-items:center;gap:6px}
  .jr-truck{background:var(--card);border:1px solid var(--border);border-left:5px solid var(--navy);border-radius:12px;margin-bottom:11px;overflow:hidden}
  .jr-truck.sel{box-shadow:0 0 0 2px var(--navy)}
  .jr-truck.pool{border-left-color:var(--warn);border-style:dashed}
  .jr-thead{display:flex;align-items:center;gap:9px;padding:11px 13px;cursor:pointer}
  .jr-tname{font-weight:700;color:var(--navy);font-size:15px}
  .jr-rt{font-size:11.5px;background:#e0e7ff;color:#3730a3;border-radius:20px;padding:1px 9px;font-weight:700}
  .jr-truckkind{font-size:11.5px;color:var(--muted);background:#f1f5f9;border-radius:5px;padding:1px 7px;font-weight:700}
  .jr-plate-sel{font-family:inherit;font-size:11.5px;font-weight:700;padding:1px 6px;border:1.3px solid var(--border);border-radius:6px;background:#fff;color:var(--muted);max-width:140px;cursor:pointer}
  .jr-plate-sel.has{border-color:var(--gold);color:var(--navy);background:#fffbeb}
  .jr-span{font-size:11px;color:var(--muted);padding:0 13px 9px;line-height:1.45}
  .jr-trucks2 .jr-span{padding:0 11px 8px}
  .jr-span.suspect{color:#7c3aed}
  .jr-truck.suspect{box-shadow:inset 0 0 0 1.5px #7c3aed66}
  .jr-rtabs{display:flex;gap:6px;margin-bottom:8px}
  .jr-rtab{flex:1;font-family:inherit;font-size:12.5px;font-weight:700;padding:7px 8px;border:1.5px solid var(--border);border-radius:8px;background:#fff;color:var(--muted);cursor:pointer}
  .jr-rtab.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  .jr-addbtn{font-family:inherit;font-size:11px;font-weight:700;padding:3px 8px;border:1.3px solid var(--green,#16a34a);border-radius:6px;background:#f0fdf4;color:var(--green-d,#15803d);cursor:pointer;white-space:nowrap}
  .jr-pop{flex-shrink:0;font-family:inherit;font-size:11px;font-weight:700;padding:3px 7px;border:1.3px solid var(--border);border-radius:6px;background:#fff;color:var(--muted);cursor:pointer;white-space:nowrap}
  .jr-pop.far{border-color:var(--red);background:var(--red);color:#fff}
  .jr-nstore{margin-left:auto;font-size:14px;color:var(--muted);font-weight:600}
  .jr-foot{padding:9px 13px;border-top:0.5px solid var(--border);font-size:13px;color:var(--text);font-weight:600}
  .jr-trucks2 .jr-foot{padding:8px 11px}
  .jr-mini{display:flex;gap:6px;padding:0 13px 8px;flex-wrap:wrap}
  .jr-mini .m{flex:1;min-width:62px;background:#f8fafc;border-radius:8px;padding:6px 8px;text-align:center}
  .jr-mini .m .mv{font-weight:700;color:var(--navy);font-size:14px}
  .jr-mini .m .ml{font-size:10px;color:var(--muted)}
  .jr-mini .m.bad .mv{color:var(--red)}
  .jr-bars{padding:0 13px 10px}
  .jr-bar .bl{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:2px;font-weight:600}
  .jr-bar .bt{height:8px;background:#eef1f7;border-radius:6px;overflow:hidden}
  .jr-bf{height:100%;border-radius:6px}
  .jr-bf.g{background:var(--green)} .jr-bf.o{background:#f59e0b} .jr-bf.r{background:var(--red)}
  .jr-tact{display:flex;gap:6px;padding:0 13px 11px;flex-wrap:wrap}
  .jr-tbtn{background:#fff;border:1.5px solid var(--border);border-radius:8px;padding:6px 10px;font-size:12px;font-weight:600;color:var(--text);font-family:inherit}
  .jr-tbtn.map{border-color:var(--navy);color:var(--navy)}
  .jr-stops{border-top:1px dashed var(--border);padding:8px 13px 10px;display:none}
  .jr-truck.open .jr-stops{display:block}
  .jr-stop{display:flex;align-items:center;gap:9px;padding:6px 0;border-bottom:1px solid #f1f5f9;font-size:13px}
  .jr-stop:last-child{border:none}
  .jr-seqdot{width:22px;height:22px;border-radius:50%;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .jr-stop .sn{font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .jr-stop .km{font-size:11px;color:var(--muted);font-weight:600;white-space:nowrap}
  .jr-stop .km.far{color:var(--red);font-weight:700}
  .jr-pill{display:inline-block;padding:1px 8px;border-radius:20px;font-size:11px;font-weight:700;background:#eef1f7;color:#475569;white-space:nowrap}
  .jr-ff{font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:20px;white-space:nowrap}
  .jr-ff.ok{background:#dcfce7;color:#166534} .jr-ff.part{background:#fef3c7;color:#92400e} .jr-ff.out{background:#fee2e2;color:var(--red)}
  .jr-search{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;position:sticky;top:0;background:var(--bg);padding:4px 0;z-index:5}
  .jr-search select{font-family:inherit;font-size:13px;padding:7px 10px;border:1.5px solid var(--border);border-radius:8px;outline:none;flex:1;min-width:120px;max-width:220px}
  .jr-row{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border);border-radius:9px;padding:8px 11px;margin-bottom:6px;cursor:pointer}
  .jr-row:hover{border-color:var(--navy)}

/* ⭐ v4.12 (Surat 2026-08-08): "ROO เลขที่ใบจอง BV ดูจาก data center เหมือนกัน ว่าเลข BV อะไร"

/* ⭐ v4.27 (Surat 2026-08-15: "ไม่มีเลข DC อะ อันไหนชื่อเซลล์เดียวกัน ให้ใช้เลข DC เดียวกันเลย")

let _smNameCache=null, _smNameCacheN=0;
function _smNameKey(code){
  code=String(code||'').trim(); if(!code) return '';
  const n=(DATA.bkbv||[]).length;
  if(!_smNameCache || _smNameCacheN!==n){
    _smNameCache={}; _smNameCacheN=n;
    (DATA.bkbv||[]).forEach(x=>{ const c=String(x.salesman||'').trim(); if(c && !_smNameCache[c]) _smNameCache[c]=String(x.salesmanName||'').trim(); });
  }

  return normRooName(cleanName(nm));   // "จารุพัฒน์ (ROO)" กับ "จารุพัฒน์" = คนเดียวกัน
}
function docDCodeSmart(code){
  const d=docDCode(code); if(d) return d;
  const nm=_smNameKey(code); if(!nm) return '';
  for(const c of Object.keys(D_BOOK_MAP)){ if(D_BOOK_MAP[c] && _smNameKey(c)===nm) return D_BOOK_MAP[c]; }   // ยืมเล่มของคนชื่อเดียวกัน
  return '';
}
/* รหัสอื่นที่ชื่อเดียวกัน + มีเล่ม DC (ไว้บอกในหน้าจอว่ายืมเล่มมาจากใคร) */
function docDCodeLender(code){
  if(docDCode(code)) return '';
  const nm=_smNameKey(code); if(!nm) return '';
  for(const c of Object.keys(D_BOOK_MAP)){ if(D_BOOK_MAP[c] && _smNameKey(c)===nm) return c; }
  return '';
}
/* ⭐ v4.15 (Surat 2026-08-11: "แบ่งโอนเลขบิลไม่ขึ้น มันเลข DC59 ไม่ขึ้น")
 * ชีทมาสเตอร์ถูกแล้ว (ROW402 → B_CODE BV23 · D_CODE DC59) แต่ **แอปอ่านของเก่าจาก cache**
 * เดิม loadDocBooks ไม่มี `bust` เลย → gviz เสิร์ฟสำเนา cache (~5 นาที หรือนานกว่า)
 * พอเพิ่ม D_CODE ในชีท กด 🔄 โหลด กี่รอบก็ยังได้ของเก่า → ขึ้น "ไม่มีเล่ม DC" + เลขเอกสาร DC เว้นว่าง
 * แก้: รับ force แล้วส่ง bust ต่อ (ชีทเล็ก 83 แถว ไม่กระทบความเร็ว) + จำเวลาที่อ่านสำเร็จไว้โชว์
 * ℹ️ เลขรัน DC นับ "ต่อเล่ม" (D_CODE+YYMM) ไม่ใช่ต่อรหัสเซล → PMW402 กับ ROW402 ที่ใช้ DC59 เหมือนกัน
 *    นับต่อกันในคิวเดียว ไม่มีทางได้เลขซ้ำ (ตรวจโค้ดแล้ว) */
let docBooksAt='';
async function loadDocBooks(force){
  try{
    const {matrix} = await gvizFetch(CONFIG.docBookId,{gid:CONFIG.docBookGid, headers:0, bust:force});  // headers=0 → ไม่กินแถวแรก
    const isBook = s=>/^B[A-Z]\d{1,4}$/i.test(String(s||'').trim());                   // BV11, BK09, BO01 — รับทุก prefix B+ตัวอักษร
    const isCode = s=>/^[A-Za-z]{2,4}\d{2,4}$/.test(String(s||'').trim()) && !isBook(s); // PMW304, HSW403, TTW101
    const isDCode= s=>/^D[A-Za-z]{1,3}\d{0,4}$/.test(String(s||'').trim());            // DC59, DC61, DSW4, DSW1, DSO2 — เล่ม DC
    const m={}, dm={};
    // 1) ชีทมาสเตอร์: อ่านด้วยชื่อคอลัมน์ SLMN_CODE → B_CODE (เล่ม SO) + D_CODE (เล่ม DC)
    const hdr=(matrix[0]||[]).map(h=>String(h).trim());
    const cc=hdr.indexOf('SLMN_CODE'), bc=hdr.indexOf('B_CODE'), dcc=hdr.indexOf('D_CODE');
    if(cc>=0){
      for(let i=1;i<matrix.length;i++){
        const code=String(matrix[i][cc]||'').trim(); if(!isCode(code)) continue;
        if(bc>=0){ const book=String(matrix[i][bc]||'').trim(); if(isBook(book)) m[code]=book; }
        if(dcc>=0){ const d=String(matrix[i][dcc]||'').trim(); if(isDCode(d)) dm[code]=d; }
      }
    }
    // 2) fallback layout เก่า: หาคู่ (รหัส, เล่ม) ที่อยู่ติดกัน (เฉพาะ B_CODE)
    if(!Object.keys(m).length){
      for(const r of matrix){
        for(let c=1;c<r.length;c++){
          const book=String(r[c]||'').trim(), code=String(r[c-1]||'').trim();
          if(isBook(book) && isCode(code)) m[code]=book;
        }
      }
    }
    if(Object.keys(m).length) BOOK_MAP = {...DOC_BOOKS, ...m};
    if(Object.keys(dm).length) D_BOOK_MAP = dm;
    docBooksAt=nowStamp();
    console.log('[docBooks] live:', Object.keys(m).length, 'เล่ม SO ·', Object.keys(dm).length, 'เล่ม DC ·', docBooksAt);
  }catch(e){ console.warn('[docBooks] live load failed — ใช้ fallback', e); }
}
/* หา "เลขรันล่าสุด" ต่อเล่ม DC จากชีต DS_DC (ในไฟล์ DS DC เดียวกับ BK_BV · DI_REF เช่น DSW46907/00130)
 * DI_REF = {เล่ม DC}{YYMM พ.ศ.}/{เลขรัน} · เล่ม+YYMM = ส่วนก่อน "/" (เช่น DC596907) → เก็บ max เลขรันต่อคีย์ ไว้รันต่อ (+1) */
async function loadDcRunning(force){
  if(dcRunLoadedAt && !force) return DC_MAX;
  try{
    const {matrix}=await gvizFetch(CONFIG.bkbvId,{sheet:'DS_DC', tq:'select A,B', headers:0, bust:force});   // A=วันที่ B=DI_REF (เช็คชีตเก่า + max รันต่อเล่ม)
    const max={}; let lastDate='';
    for(const r of matrix){
      const date=String((r&&r[0])||'').trim().replace(/\//g,'-'), ref=String((r&&r[1])||'').trim(), s=ref.indexOf('/');
      if(/\d{4}-\d{2}-\d{2}/.test(date) && date>lastDate) lastDate=date;   // วันล่าสุดในชีต
      if(s<5) continue;
      const key=ref.slice(0,s), run=parseInt(ref.slice(s+1),10);   // key = เล่ม+YYMM (DC596907) · run = เลขหลัง /
      if(!isFinite(run) || key.length<5) continue;
      if(!(key in max) || run>max[key]) max[key]=run;
    }
    DC_MAX=max; dcRunLastDate=lastDate; dcRunLoadedAt=nowStamp();
    console.log('[dcRun] books:', Object.keys(max).length, 'lastDate', lastDate, 'loadedAt', dcRunLoadedAt);
  }catch(e){ console.warn('[dcRun] load failed', e); }
  return DC_MAX;
}

/* ================= 🎁 ตรวจโปร ก่อน Export DC — วิธีเดียวกับ Sales App (Promotion tab · match + tier) =================
 * โปร: ซื้อ {จำนวน} หน่วย {รูปแบบขาย} ของ {ชื่อ} (จับด้วย {วิธีวัด}) → แถม {จำนวนแถมEA} × {Barcode สินค้าแถมEA}
 * ตรวจ: คำนวณ tier ใหม่จากยอดขายที่ "แบ่ง/โอนจริง" (ในไฟล์ DC) → เทียบของแถมในไฟล์ · น้อยกว่า = โปรถูกตัด (เตือน · export ต่อได้) */
let PROMO_ROWS=[], promoLoadedAt='', PROMO_META={n:0, raw:0, skip:0, expired:0, src:'', err:''};
/* v4.21: parser CSV แบบ RFC-4180 ย่อ (มี quote/คอมมาในเซลล์/ขึ้นบรรทัดในเซลล์) */
function parseCsvText(t){
  const rows=[]; let row=[], f='', q=false;
  for(let i=0;i<t.length;i++){ const c=t[i];
    if(q){ if(c==='"'){ if(t[i+1]==='"'){ f+='"'; i++; } else q=false; } else f+=c; }
    else if(c==='"') q=true;
    else if(c===','){ row.push(f); f=''; }
    else if(c==='\n'){ row.push(f); f=''; rows.push(row); row=[]; }
    else if(c!=='\r') f+=c;
  }
  if(f!=='' || row.length){ row.push(f); rows.push(row); }
  return rows;
}
async function fetchCsvExport(sheetId, gid, bust){
  const url=`https://docs.google.com/spreadsheets/d/${sheetId}/export?format=csv&gid=${gid}`+(bust?('&_cb='+Date.now()):'');
  const res=await fetch(url); if(!res.ok) throw new Error('โหลดชีท (csv) ไม่สำเร็จ '+res.status);
  let t=await res.text(); if(t.charCodeAt(0)===0xFEFF) t=t.slice(1);
  return parseCsvText(t);
}
/* 🔴 v4.21 — ต้นตอ "ตรวจโปรไม่ทำงานเลย" (PROMO_ROWS=0 เงียบ ๆ มาตั้งแต่ชีทเปลี่ยนหัว 20/07)
 *   gviz **กินหัวคอลัมน์ที่เป็นตัวเลขล้วน** → 'จำนวน' (index 4) กับ 'จำนวนแถมEA' (index 9) กลายเป็นช่องว่าง
 *   → gi() = -1 → thr/gq = 0 → ทุกแถวตกเงื่อนไข → ไม่มีโปรเหลือสักตัว (ตัวตรวจโปรฝั่งใบ DC ก็ตายตามไปด้วย)
 *   เป็นกับดักตัวเดียวกับที่ CLAUDE.md เตือนไว้: "gviz CSV มั่วกับชีท Promotion → ใช้ export?format=csv&gid= แทน"
 *   ⭐ อ่านด้วย export?format=csv (แถวดิบ 1:1 หัวครบ) · gviz เหลือเป็น fallback เฉย ๆ
 *   ⭐ ชีทเปลี่ยนชื่อคอลัมน์วันหมดโปร: Period → 'จบโปร' (+เพิ่ม 'เริ่มโปร') → อ่านทั้ง 2 แบบ */
async function loadPromotions(force){
  if(promoLoadedAt && !force) return PROMO_ROWS;
  try{
    let matrix=null, src='csv';
    try{ matrix=await fetchCsvExport(CONFIG.promotionId, CONFIG.promotionGid, force); }
    catch(e){ console.warn('[promo] อ่าน csv ไม่ได้ → ถอยไป gviz', e); }
    if(!matrix || matrix.length<2){ const g=await gvizFetch(CONFIG.promotionId,{sheet:CONFIG.promotionTab, headers:0, bust:force}); matrix=g.matrix; src='gviz'; }
    const hdr=(matrix[0]||[]).map(h=>String(h).trim()); const gi=n=>hdr.indexOf(n);
    const iM=gi('วิธีวัด'), iN=gi('ชื่อ'), iMin=gi('ราคาขายกำหนด'), iU=gi('รูปแบบขาย'),
          iGN=gi('แถมสินค้า'), iGB=gi('Barcode สินค้าแถมEA'), iName=gi('ชื่อโปร'),
          iWh=gi('Warehouses'), iRole=gi('Role');

        measure:a.p.measure, match:a.p.match, start:a.p.start||'', end:a.p.period||'', role:a.p.role||'', whs:(a.p.whs||[]).join(',')});   // v4.22: เก็บเงื่อนไขที่ชีทแจ้งไว้ทั้งชุด → โชว์ให้ตรวจได้
    });
    let bad=0;
    new Set([...Object.keys(expect), ...Object.keys(b.freeEA)]).forEach(gk=>{
      const e=expect[gk]||0, h=b.freeEA[gk]||0;
      if(Math.abs(h-e)<1e-6) return;                                                          // ตรงเป๊ะ = ผ่าน
      const gp=DATA.prodIdx[gk]||null; bad++;
      out.issues.push({kind:(e===0?'noPromo':(h<e?'short':'over')), orderId:b.orderId, store:b.store, storeCode:b.storeCode,
        salesman:b.salesman, name:b.name, wh:b.wh, date:b.date, giftKey:gk,
        gift: b.freeName[gk] || (gp?cleanName(gp.name):'') || ((why[gk]||[])[0]||{}).gift || gk,
        giftUnit:b.freeUnit[gk]||'', expect:e, have:h, diff:h-e, why:(why[gk]||[])});
    });
    if(!bad) out.okBills++;
  });
  const rank={short:0, over:1, noPromo:2};
  out.issues.sort((a,b)=> (rank[a.kind]-rank[b.kind]) || Math.abs(b.diff)-Math.abs(a.diff));
  return out;
}

let _dateMode='y', dateSel=new Set();   // dateSel = เซ็ตวัน (ISO) ที่เลือก — chip วันนี้/-1/-2 เลือกหลายวันพร้อมกันได้ · ว่าง+ไม่มี range = ทุกวัน
function setDate(mode, fromInput){
  if(mode) _dateMode=mode; else mode=_dateMode;
  const from=document.getElementById('fDateFrom'), to=document.getElementById('fDateTo');
  const dayIso = mode==='t'?todayBKK() : mode==='y'?yesterdayBKK() : mode==='d2'?dateMinus(todayBKK(),2) : null;
  if(dayIso!=null){                                      // วันเดียว — toggle (เลือกหลายวันได้)
    from.value=to.value=''; from.style.display=to.style.display='none';
    if(dateSel.has(dayIso)) dateSel.delete(dayIso); else dateSel.add(dayIso);
  } else if(mode==='c'){ dateSel.clear(); from.style.display=to.style.display='inline-block'; if(!fromInput){ if(!from.value) from.value=todayBKK(); if(!to.value) to.value=from.value; } }
  else if(mode==='all'){ dateSel.clear(); from.value=to.value=''; from.style.display=to.style.display='none'; }   // ทุกวัน = ไม่กรองวัน
  refreshDateChips();
  if(DATA.orders.length){ process(); render(); }
}
function refreshDateChips(){   // ไฮไลต์ chip — วันเดียวหลายอันพร้อมกันได้ (on = อยู่ใน dateSel)

  document.querySelectorAll('#dateChips .chip').forEach(c=>{ const d=c.dataset.d; let on=false;
    if(d==='t') on=dateSel.has(T); else if(d==='y') on=dateSel.has(Y); else if(d==='d2') on=dateSel.has(D2);

function keyTSof(o){ const base=Date.parse(toISO(o.date)+'T00:00:00')||0; const m=String(o&&o.time||'').match(/(\d{1,2}):(\d{2})/); return base + (m? (+m[1])*3600000+(+m[2])*60000 : 0); }
function toBuddhistDMY(iso){ const [y,m,d]=toISO(iso).split('-'); return `${d}/${m}/${(+y)+543}`; }

/* parse unit string: "ลังx50(CS)" / "แพ็คx6(PA)" / "ชิ้นx1(EA)" / "แพ็คx10(CS)"  → ยึด code ในวงเล็บ */
function parseUnit(u){
  const m = String(u||'').match(/x\s*(\d+)\s*\(([A-Za-z]+)\)/i);   // จับเลข + โค้ดในวงเล็บ (รองรับ BPA/BP-A/โค้ดแปลก)
  if (m){ const c=m[2].toUpperCase(); const level=/CS/.test(c)?'CS':/BP/.test(c)?'BP':/PA/.test(c)?'PA':'EA'; return { eaPer:parseInt(m[1],10)||1, level }; }
  if (/ลัง/.test(u)) return { eaPer:1, level:'CS' };
  if (/แพ็ค/.test(u)) return { eaPer:1, level:'PA' };
  return { eaPer:1, level:'EA' };
}
function unitThai(level){ return level==='CS'?'ลัง':level==='PA'?'แพ็ค':level==='BP'?'Big Pack':'ชิ้น'; }

/* ===== ตรวจราคา (v3.56) — พื้นราคา S00 ต่อ "หน่วยของบรรทัด" =====
 * exact = มี PRICE S00 (หรือ CC00) ของหน่วยนั้นตรงๆ
 * calc  = หน่วยนั้นไม่มีราคา (PA/BP ส่วนใหญ่ว่างใน PDDT) → ใช้ "ต่อชิ้นที่ถูกที่สุด" ของหน่วยที่มีราคา × EA/หน่วย
 *         (S00 ต่อชิ้นของลังมักถูกกว่าของชิ้นเดี่ยว → พื้นที่ได้ต่ำกว่าจริง = เตือนเฉพาะที่ผิดชัดๆ ไม่หลอน)
 * none  = ไม่มีราคาเลย → ตรวจไม่ได้ (นับแยก ไม่เตือน) */
function priceFloorFor(prod, level, eaPer){
  if(!prod || !prod.s00) return {floor:0, basis:'none'};
  const s=prod.s00, direct=+s[level]||0;
  if(direct>0) return {floor:direct, basis:'exact'};
  const per={EA:1, PA:+prod.qtyPA||0, BP:+prod.qtyBP||0, CS:+prod.qtyCS||0};
  let minPerEA=0;
  ['EA','PA','BP','CS'].forEach(u=>{ const v=+s[u]||0, q=per[u]; if(v>0 && q>0){ const pe=v/q; if(!minPerEA || pe<minPerEA) minPerEA=pe; } });
  const ea=+eaPer||per[level]||0;
  if(minPerEA>0 && ea>0) return {floor:minPerEA*ea, basis:'calc'};
  return {floor:0, basis:'none'};
}
/* บรรทัดที่ "ขายต่ำกว่า S00" — ตรวจเฉพาะบรรทัดขาย (ไม่ใช่แถม) ที่มีราคา · 0.01 = กัน float */
function priceAlertsOf(lines){
  const bad=[], noPrice=[], noFloor=[];
  for(const l of lines||[]){
    if(/แถม/.test(l.type||'')) continue;
    const prod=DATA.prodIdx[String(l.barcode||'').trim()]||null;
    const f=priceFloorFor(prod, l.level, l.eaPer);
    if(!(l.price>0)){ noPrice.push(l); continue; }
    if(f.basis==='none' || !(f.floor>0)){ noFloor.push(l); continue; }
    if(l.price < f.floor-0.01){
      bad.push({orderId:l.orderId, date:l.date, salesman:l.salesman, name:l.name, role:l.role, roleLab:l.roleLab,
        store:l.store, storeKey:l.storeKey, wh:l.wh, barcode:l.barcode,
        product:l.productShort||l.productName||l.product, unit:l.unit, level:l.level, unitThai:unitThai(l.level),
        qty:l.qty, price:l.price, floor:f.floor, basis:f.basis, diff:f.floor-l.price, pct:(f.floor-l.price)/f.floor*100,
        ovr:!!(prod&&prod.priceOvr),   // v4.03: พื้นราคานี้มาจากชีท Price Override ไม่ใช่ Stocksync
        lossBaht:(f.floor-l.price)*(+l.qty||0)});
    }
  }
  bad.sort((a,b)=> b.lossBaht-a.lossBaht || b.pct-a.pct || String(b.date||'').localeCompare(String(a.date||'')));   // เสียหายมากสุดก่อน (ไล่แก้ตามผลกระทบ) · เท่ากัน → ล่าสุดอยู่บน
  return {bad, noPriceN:noPrice.length, noFloorN:noFloor.length};
}

async function loadRooTag(force){
  if(rooLoadedAt && !force) return ROO_SM;
  try{
    const H={'apikey':CONFIG.supaAnon,'Authorization':'Bearer '+CONFIG.supaAnon};
    const [rRoo,rSpec]=await Promise.all([
      fetch(`${CONFIG.supaUrl}/rest/v1/roo_sales?select=*&limit=5000`,{headers:H}),
      fetch(`${CONFIG.supaUrl}/rest/v1/roo_special_sales?select=*&limit=5000`,{headers:H})
    ]);
    const rowsA = rRoo.ok ? await rRoo.json() : [];
    const rowsB = rSpec.ok ? await rSpec.json() : [];
    const map={}, byName={};
    [...rowsA, ...rowsB].forEach(r=>{
      const name=String(r['ชื่อ-สกุล']||r['ชื่อ - สกุล']||'').trim();
      if(!/\(ROO\)/i.test(name)) return;
      const code=String(r['รหัสเซลล์']||'').trim().toUpperCase();
      const nk=normRooName(name);

async function loadDebtApproval(force){

    const cReq=col('reqId',0), cTs=col('วันเวลา',1), cCode=col('รหัสร้าน',2), cStore=col('ชื่อร้าน',3),

    const byBill={}, byReq={}, byShopDay={}; let n=0, wait=0, block=0, linked=0;
    matrix.forEach(r=>{
      const req=String(r[cReq]||'').trim();
      if(!/^DA-/i.test(req)) return;             // ข้ามแถวว่าง/แถวขยะ
      const ts=String(r[cTs]||'');
      const rec={ req, ts, date:ts.slice(0,10).replace(/\//g,'-'),
                  code:String(r[cCode]||'').trim(), store:String(r[cStore]||''), owed:num(r[cOwed]),
                  status:String(r[cSt]||'').trim(), by:String(r[cBy]||'').trim(), at:String(r[cAt]||''),

      rec.state=_debtState(rec.status);

/* บรรทัดนี้ติดคำขอขายเชื่อใบไหน (null = ไม่มีคำขอ = ไม่ต้องผ่านด่านนี้) */
function debtHitOf(o){
  if(!o || o._src==='roo') return null;          // ROO = ลูกค้าสั่งเอง ไม่ผ่านระบบขอขายเชื่อของเซล
  if(!DEBT_META.n) return null;                  // ยังโหลดไม่เสร็จ/อ่านไม่ได้ → ไม่บล็อกใคร
  const req=String(o.creditReqId||'').trim();
  if(req && DEBT_BY_REQ[req]) return DEBT_BY_REQ[req];                                   // ①
  const b1=String(o.orderId||'').trim().toUpperCase();    if(b1 && DEBT_BY_BILL[b1]) return DEBT_BY_BILL[b1];   // ② บิลรวม
  const b2=String(o.rawOrderId||'').trim().toUpperCase(); if(b2 && DEBT_BY_BILL[b2]) return DEBT_BY_BILL[b2];   // ② เลขออเดอร์ดิบ
  if(DEBT_SHOPDAY_FALLBACK){                                                             // ③
    const k=String(o.storeCode||'').trim()+'|'+String(o.date||'');
    if(DEBT_BY_SHOPDAY[k]) return DEBT_BY_SHOPDAY[k];
  }
  return null;
}

/* ================= gviz fetch ================= */
async function gvizFetch(sheetId, opt){
  opt=opt||{};
  const parts=[];
  if(opt.gid!=null&&opt.gid!=='') parts.push('gid='+opt.gid);
  else if(opt.sheet) parts.push('sheet='+encodeURIComponent(opt.sheet));   // ไม่ระบุทั้งคู่ → gviz ใช้ชีทแรก
  const hdr = (opt.headers!=null) ? opt.headers : 1;
  parts.push('headers='+hdr);
  if(opt.tq) parts.push('tq='+encodeURIComponent(opt.tq));                  // ดึงเฉพาะบางคอลัมน์ (ลด payload) เช่น select B,D,F,H,BQ
  if(opt.bust) parts.push('_cb='+Date.now());                               // cache-buster — บังคับ gviz ส่งของสด (เลี่ยง cache ~5 นาที) ตอนกดรีเฟรช
  const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json&${parts.join('&')}`;
  const res = await fetch(url);
  if(!res.ok) throw new Error('โหลดชีทไม่สำเร็จ ('+res.status+')');
  const text = await res.text();
  const json = JSON.parse(text.replace(/^[^(]+\(/,'').replace(/\);?\s*$/,''));
  const cols = (json.table.cols||[]).map(c=>c.label||c.id||'');
  const rows = json.table.rows||[];
  const cv = c => {
    if(!c) return '';
    if(c.f!=null && c.f!=='') return String(c.f).trim();
    let v=c.v; if(v==null) return '';
    if(typeof v==='string' && /^Date\(/.test(v)){
      const m=v.match(/Date\((-?\d+),(\d+),(\d+)/);
      if(m) return `${+m[1]}/${String(+m[2]+1).padStart(2,'0')}/${String(+m[3]).padStart(2,'0')}`;
    }
    return String(v).trim();
  };
  const matrix = rows.map(r => (r.c||[]).map(cv));
  return { cols, matrix };
}
function asObjects({cols,matrix}){
  return matrix.map(r=>{ const o={}; cols.forEach((h,i)=>{ if(h&&o[h]===undefined) o[h]=r[i]||''; }); return o; });
}

  const pS00={}, pCC00={}; PU.forEach(u=>{ pS00[u]=ci('PRICE S00 '+u); pCC00[u]=ci('PRICE CC00 '+u); });   // v3.56 ตรวจราคา: S00 = ราคาควบคุม (hard floor ห้ามขายต่ำกว่า) · ว่าง → CC00 หน่วยเดียวกัน (กฎ PDDT-REFERENCE §3)
  const idx = {};

    const rec = {

      stock:{W1:num(r[C.sW1]),W2:num(r[C.sW2]),W3:num(r[C.sW3]),W4:num(r[C.sW4]),C4:num(r[C.sC4])},
      stockRaw:{W1:String(r[C.sW1]||'').trim(),W2:String(r[C.sW2]||'').trim(),W3:String(r[C.sW3]||'').trim(),W4:String(r[C.sW4]||'').trim(),C4:String(r[C.sC4]||'').trim()},   // STOCK ดิบ (CS.EA) — แบ่งโควต้าใช้ parseStockCsEa (float เพี้ยน)
      stockW4:num(r[C.sW4]), stockC4:num(r[C.sC4]), catGroup:r[C.catG]||'', catBrand:r[C.catB]||'', catSize:r[C.catS]||'', catVendor:r[C.catV]||'', catType:r[C.catT]||'', catBU:r[C.catBU]||'', img:String((C.img>=0?r[C.img]:'')||'').trim(),
      weightCS:num(r[C.gWt])   // GOODS_WEIGHT = kg/ลัง (0/ว่าง → fallback 10 ตอนคำนวณ)
    };
    [C.cEA,C.cPA,C.cBP,C.cCS].forEach(ci2=>{ const code=String(r[ci2]||'').trim(); if(code) idx[code]=rec; });
  }
  await applyPriceOverride(idx);   // v4.03: ทับราคาพื้นด้วยชีท Price Override ก่อน (เหมือนแอป ROO)
  return idx;
}
/* ═══ v4.03 (Surat): "ตอนเช็คราคาให้มาเช็คในนี้ก่อน ถ้ามีสินค้าที่อยู่ในนี้ให้ดูราคาจากอันนี้ก่อนเหมือน ROO
 *                    แต่ถ้าไม่มีในนี้ให้ดูใน Stocksync ปกติ" ═══
 * ชีท "Purchase Actions" แท็บ Price Override (ไฟล์เดียวกับ Promotion · gid 792656094)
 *   โครงคอลัมน์เหมือน PDDT ทุกอย่าง (PRODUCT NAME · CODE EA/PA/BP/CS · PRICE S00/CC00 EA/PA/BP/CS)
 *   = สินค้าที่ฝ่ายจัดซื้อปรับราคาแล้ว ต้องใช้ราคานี้แทน Stocksync (แอป ROO ทำแบบนี้อยู่แล้ว)
 * ทับเฉพาะ "พื้นราคา s00" ที่ใช้ตรวจราคา — ราคาขายในบิลยังเป็นค่าที่เซลคีย์มาเหมือนเดิม
 * จับคู่ด้วย "บาร์โค้ด" ก่อน (แม่นสุด) → ไม่เจอค่อยจับด้วย "ชื่อสินค้า" (แบบ ROO)
 * โหลดไม่ได้ = ข้ามเงียบ ใช้ราคา Stocksync ตามเดิม (ไม่ทำให้แอปพัง) */
let PRICE_OVR_N = 0;   // จำนวนสินค้าที่ถูกทับราคา (โชว์ในแท็บตรวจราคา)
async function applyPriceOverride(idx){
  PRICE_OVR_N = 0;
  try{
    const {cols,matrix} = await gvizFetch(CONFIG.priceOverrideId, {gid:CONFIG.priceOverrideGid, tq:'select A, B, D, F, H, U, V, W, X, DA, DB, DC, DD'});
    const ci = n => cols.indexOf(n);
    const iName=ci('PRODUCT NAME');
    const codeCols=['CODE EA','CODE PA','CODE BP','CODE CS'].map(ci).filter(i=>i>=0);
    const PU=['EA','PA','BP','CS'];
    const pS00={}, pCC00={}; PU.forEach(u=>{ pS00[u]=ci('PRICE S00 '+u); pCC00[u]=ci('PRICE CC00 '+u); });
    if(iName<0 && !codeCols.length){ console.warn('[PriceOverride] หัวคอลัมน์ไม่ตรง — ข้าม'); return; }
    // ชื่อสินค้า → rec (สำหรับ fallback จับด้วยชื่อ) · rec เดียวกันถูกอ้างจากหลายบาร์โค้ด ทับครั้งเดียวได้ทุกโค้ด
    const byName={}; for(const k in idx){ const r=idx[k]; const n=String(r.name||'').trim(); if(n && !byName[n]) byName[n]=r; }
    const hit=new Set();
    for(const r of matrix){
      const s00={}; let any=false;
      PU.forEach(u=>{ const v=(pS00[u]>=0?num(r[pS00[u]]):0) || (pCC00[u]>=0?num(r[pCC00[u]]):0) || 0; s00[u]=v; if(v>0) any=true; });
      if(!any) continue;                                  // แถวไม่มีราคาเลย → ไม่ทับ
      let rec=null;
      for(const ic of codeCols){ const code=String(r[ic]||'').trim(); if(code && idx[code]){ rec=idx[code]; break; } }
      if(!rec){ const nm=String(r[iName]||'').trim(); if(nm) rec=byName[nm]||null; }
      if(!rec || hit.has(rec)) continue;
      rec.s00 = s00; rec.priceOvr = true;                  // ทับพื้นราคา + ติดธงไว้โชว์ในตาราง
      hit.add(rec);
    }
    PRICE_OVR_N = hit.size;
    console.log('[PriceOverride] ทับราคาพื้นจากชีท Price Override:', PRICE_OVR_N, 'สินค้า (จากชีท', matrix.length, 'แถว)');
  }catch(e){ console.warn('[PriceOverride] โหลดไม่ได้ — ใช้ราคา Stocksync ตามเดิม', e); }
}

/* 1 รหัสมีหลายแถว (ต่าง WH/เซล) → เลือก: WH+เซลตรง+มีพิกัด > WH+พิกัด > เซล+พิกัด > WH > มีพิกัด > แถวแรก */
function matchCustomer(code, wh, salesman){
  const rows = DATA.custByCode[String(code||'').trim()];
  if(!rows||!rows.length) return null;
  if(rows.length===1) return rows[0];
  const W=String(wh||'').trim().toUpperCase(), S=String(salesman||'').trim();
  return rows.find(r=>r.wh===W&&r.salesman===S&&r.lat!=null) || rows.find(r=>r.wh===W&&r.lat!=null)
      || rows.find(r=>r.salesman===S&&r.lat!=null) || rows.find(r=>r.wh===W) || rows.find(r=>r.lat!=null) || rows[0];
}

async function loadTruckPool(){
  const {matrix} = await gvizFetch(CONFIG.truckSheetId,{gid:CONFIG.truckPoolGid});

  for(const r of matrix){
    const plate=String(r[0]||'').trim(), w=String(r[1]||'').trim().toUpperCase(), t=jrNorm(r[3]);

 * แก้: กรองวันฝั่ง server (คอลัมน์ไทยต้องครอบ quote) + **แบ่งหน้าทีละ 1,000 จนหมด**
 *      เผื่อ filter วันพัง (ค่าวันผิดรูปแบบ) → ถ้าได้ 0 แถว ลองใหม่แบบไม่กรองวัน */
async function _rooPullAll(tbl, H2){
  const col=encodeURIComponent('"วัน"');
  let from=''; try{ from=daysAgoBKK(SB_DAYS+2); }catch(e){}
  /* v4.09: เปลี่ยนจาก offset → **keyset (id > ตัวสุดท้าย)**
   * เดิม `order=id.desc&offset=` — ถ้ามีออเดอร์ใหม่เข้ามาระหว่างที่ไล่หน้าอยู่ (ลูกค้าสั่งตลอดเวลา)
   * ตำแหน่ง offset จะเลื่อน → **ข้ามแถวหายไปเงียบ ๆ** (และได้แถวซ้ำในหน้าถัดไป)
   * keyset ยึด id เป็นหลัก แถวใหม่มี id มากกว่าเสมอ → ไล่ครบ ไม่ข้าม ไม่ซ้ำ */
  const pull=async(flt)=>{
    const out=[]; let last=-1;
    for(let page=0; page<200; page++){     // เพดาน 200 หน้า = 200,000 แถว (กันลูปค้าง)
      let p=[];
      try{
        const r=await fetch(`${CONFIG.supaUrl}/rest/v1/${tbl}?select=*${flt}&id=gt.${last}&order=id.asc&limit=1000`,{headers:H2});
        if(!r.ok) break;
        p=await r.json();
      }catch(e){ break; }
      if(!Array.isArray(p) || !p.length) break;
      out.push(...p);
      last = p[p.length-1].id;
      if(p.length<1000) break;   // หน้าสุดท้าย
    }
    return out;
  };
  let rows = from ? await pull(`&${col}=gte.${from}`) : await pull('');
  if(!rows.length && from) rows = await pull('');   // กันเคส filter วันพัง → ถอยไปดึงทั้งตาราง
  return rows;
}

  for(const o of [...soOrders, ...rooOrders]){
    const k=_sbRowKey(o);
    if(k){ if(seen.has(k)){ dropped++; continue; } seen.add(k); }   // ไม่มีคีย์จริง = ไม่ตัด
    merged.push(o);
  }
  if(dropped) console.log('[SB] ตัดแถวซ้ำ (คีย์จริงซ้ำ)', dropped, 'แถว');
  return stripStalePick(merged);   // v3.86: จุดรวมของทั้งเฟส1/เฟส2 → ล้างสแตมป์ backfill ที่ค้างที่เดียวจบ
}
/* v3.81: โหลด 2 เฟส — เฟส1 วันล่าสุด (SB_RECENT_DAYS · เร็ว) render ใช้งานได้ก่อน · เฟส2 21วันเต็ม (เบื้องหลัง) แทนที่+re-render */
/* ═══ v4.08 (Surat 2026-08-08: "ทำไมบางทีบิลที่ picking_status ยังว่าง ไม่ขึ้นให้จัด · พอกดโหลดก็หาย
 *      บางทีหาย บางทีมา บางคนมี บางคนไม่มี") — วัดของจริงแล้วเป็นแบบนี้ ═══
 *  เฟส 1 (โผล่ทันที ~6 วิ) = sales_orders แค่ **เมื่อวาน+วันนี้** · เฟส 2 (21 วัน) มาทีหลังแล้วทับ
 *  วัด 2026-08-08:  เฟส1 = 3,590 บรรทัด / 498 บิล / ยังไม่จัด 104
 *                   เฟส2 = 49,066 บรรทัด / 4,270 บิล / ยังไม่จัด 329
 *    → **228 บิล ฿16.3 ล้าน มองไม่เห็นอยู่ ~55 วินาทีทุกครั้งที่กดโหลด** (31/07-06/08 หายเกลี้ยง)
 *  อันตรายกว่านั้น: บิลรวมที่มีบรรทัดจัดแล้วอยู่ "นอกหน้าต่าง 2 วัน" → เฟส 1 เห็นแต่บรรทัดใหม่
 *    เลยขึ้นเป็น "ยังไม่จัด" ทั้งที่จัดไปแล้ว → กด Export ตอนนั้น = **บิลเบิ้ล**
 *    เจอจริง 3 ใบ (ORD3053022 ว.วัชรพล เฟส1 เห็น pend 1/done 0 · จริง pend 0/done 15)
 *  และ fetch 21 วันรวดเดียว **ใกล้ timeout** (55-68 วิ · fail จริงระหว่างเทสต์) → พังเมื่อไรก็เหลือ 2 วัน
 *    แบบเงียบ ๆ = ที่มาของ "บางคนมี บางคนไม่มี" (แล้วแต่เน็ต/เครื่อง/จังหวะ)
 *  ── แก้ 3 อย่าง ──
 *   ① เฟส 2 ยิง **แบ่งก้อนขนาน** (3 ก้อน) แทนก้อนเดียว → วัดแล้ว 20-23 วิ (เดิม 55-68) · ครบ 49,066 เท่ากัน ไม่ซ้ำ
 *   ② เฟส 2 **retry 2 ครั้ง** ก่อนยอมแพ้ (เดิมพลาดครั้งเดียวจบ)
 *   ③ ระหว่างยังโหลดไม่ครบ → **ปิดปุ่ม Export + ขึ้นแถบแดง** (กันเปิดบิลซ้ำจากข้อมูลไม่ครบ)
 *  ⚠️ ต้นตอจริงคือ sales_orders ต้องผ่าน GAS (client ไม่มี key ของโปรเจกต์ bdshn…)
 *     ส่วน roo_sales/roo_special อ่านตรงด้วย anon key จึงมาครบตั้งแต่เฟส 1 เสมอ ไม่เคยมีอาการนี้
 *     ทางแก้ถาวร = เปิด anon SELECT ให้ sales_orders แล้วอ่านตรงแบบเดียวกับ ROO (เหลือไม่กี่วินาที) */
const SB_CHUNKS = 3;                       // จำนวนก้อนที่ยิงขนานตอนโหลดย้อนหลัง (1 = กลับไปยิงรวดเดียวแบบเดิม)
function _mergeUnconfirmed(list){          // รวมผล unconfirmed จากหลายก้อนให้เป็นก้อนเดียว
  const out={count:0, byDate:{}, bills:[]};
  let hasBills=false;
  (list||[]).forEach(u=>{ if(!u) return;
    out.count+=(u.count||0);
    for(const d in (u.byDate||{})) out.byDate[d]=(out.byDate[d]||0)+u.byDate[d];
    if(Array.isArray(u.bills)){ hasBills=true; out.bills.push(...u.bills); }
  });
  if(!hasBills) delete out.bills;
  return out;
}
/* ดึง sales_orders ย้อนหลัง N วัน แบบแบ่งก้อนยิงขนาน → {soOrders, unconfirmed} */
async function _fetchSalesOrdersChunked(days){
  const today=todayBKK(), n=Math.max(1, SB_CHUNKS|0);
  if(n<=1) return _fetchSalesOrdersSb(daysAgoBKK(days), today);
  const per=Math.ceil((days+1)/n), ranges=[];
  for(let i=0;i<n;i++){
    const hi=days-i*per, lo=Math.max(0, hi-per+1);
    if(hi<0) break;
    ranges.push([daysAgoBKK(hi), daysAgoBKK(lo)]);
  }
  const parts=await Promise.all(ranges.map(([a,b])=>_fetchSalesOrdersSb(a,b)));
  const seen=new Set(), soOrders=[];
  parts.forEach(p=>(p.soOrders||[]).forEach(r=>{                 // กันซ้ำตรงรอยต่อก้อน (คีย์ = line_id)
    const k=r.lineId || (r.orderId+'|'+r.barcode+'|'+r.type+'|'+r.unit+'|'+r.seq);
    if(seen.has(k)) return; seen.add(k); soOrders.push(r);
  }));
  soOrders.forEach((r,i)=>{ r.seq=i; });                          // seq ต้องเรียงต่อกันทั้งชุด (ใช้จัดลำดับบิล)
  return { soOrders, unconfirmed:_mergeUnconfirmed(parts.map(p=>p.unconfirmed)) };
}
async function loadOrdersSb(){
  if(!CONFIG.gasUrl) throw new Error('ไม่มี gasUrl');
  // เฟส 1: อ่าน roo (ครบทั้งหน้าต่างอยู่แล้ว) + sales_orders วันล่าสุด "พร้อมกัน" (เร็ว)
  const [rooOrders, p1] = await Promise.all([ _readRooOrdersSb(), _fetchSalesOrdersSb(daysAgoBKK(SB_RECENT_DAYS), todayBKK()) ]);
  const merged = _mergeSbOrders(p1.soOrders, rooOrders);
  SB_META={count:merged.length, at:nowStamp().split(' ')[1]||'', err:'', unconfirmed:p1.unconfirmed, roo:rooOrders.length, loadingOlder:(SB_DAYS>SB_RECENT_DAYS), partialDays:SB_RECENT_DAYS};
  // เฟส 2: 21 วันเต็ม (เบื้องหลัง · แบ่งก้อนขนาน + retry) → แทนที่ DATA.orders + re-render
  if(SB_DAYS>SB_RECENT_DAYS){
    (async()=>{
      for(let t=1;t<=3;t++){
        try{
          const pf = await _fetchSalesOrdersChunked(SB_DAYS);
          DATA.orders = _mergeSbOrders(pf.soOrders, rooOrders);
          SB_META={count:DATA.orders.length, at:nowStamp().split(' ')[1]||'', err:'', unconfirmed:pf.unconfirmed, roo:rooOrders.length, loadingOlder:false, partialDays:0};
          if(ORDER_SRC==='sb' && document.getElementById('panel-bills')){ try{ rebuildFromOrders(); process(); render(); }catch(e){} }   // v4.10: ต้องสร้าง dropdown ชื่อเซล/รายชื่อร้าน/DONE ใหม่ด้วย ไม่งั้นเซลที่ไม่มีออเดอร์ใน 2 วันล่าสุดหายจากช่องเลือก
          return;
        }catch(e){
          console.warn('[SB] โหลดย้อนหลังไม่สำเร็จ (ครั้งที่ '+t+'/3)', e);
          if(t<3){ try{ toast('⏳ โหลดออเดอร์ย้อนหลังไม่ผ่าน — ลองใหม่ ('+t+'/3)'); }catch(_){}; await new Promise(r=>setTimeout(r,1500*t)); }
        }
      }
      SB_META.loadingOlder=false; SB_META.olderFailed=true;   // ยอมแพ้ → ยังกัน Export ไว้ (ข้อมูลไม่ครบ)
      try{ renderSrcBadge(); render(); }catch(_){}
      try{ toast('❌ โหลดออเดอร์ย้อนหลังไม่ครบ (มีแค่ '+SB_RECENT_DAYS+' วันล่าสุด) — Export ถูกกันไว้ กด 🔄 โหลด อีกครั้ง'); }catch(_){}
    })();
  }
  return merged;
}
/* ข้อมูลยังไม่ครบหน้าต่าง 21 วัน → ห้าม Export (บิลรวมที่มีบรรทัดจัดแล้วนอกหน้าต่าง จะโผล่เป็น "ยังไม่จัด" แล้วเปิดซ้ำ) */

/* ================= บิลที่จัดแล้ว (done) — เขียนคอลัมน์ "สถานะจัด" (AH) ใน Order tab เอง · ทุกเครื่องเห็นตรงกัน ================= */
/* mark/unmark — optimistic update local DONE ก่อน แล้ว POST ให้ GAS เขียน 'จัดแล้ว'/ล้าง ใน Order tab (match ที่ orderId) */
async function markDoneBackend(orderIds){
  if(!CONFIG.writeDoneStatus) return 0;   // ปิดเขียนสถานะลง Order tab (sales backend) — เก็บโค้ดไว้ แค่ปิดด้วย flag
  orderIds = (orderIds||[]).filter(id=> id && !DONE[id]);
  if(!CONFIG.gasUrl || !orderIds.length) return 0;
  const by=(currentUser&&currentUser.name)||'', ns=nowStamp(), date=(ns.split(' ')[0]||''), time=(ns.split(' ')[1]||'');
  orderIds.forEach(id=>{ DONE[id]={orderId:id, by, date, time}; });        // optimistic (วัน/เวลา server เป็นตัวจริง · อ่านกลับตอน reload)
  selectedBills.forEach(id=>{ if(DONE[id]) selectedBills.delete(id); });   // จัดแล้ว = เอาออกจากตะกร้า
  try{ await fetch(CONFIG.gasUrl,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'markDone',billIds:orderIds,by})}); }
  catch(e){ console.warn('markDone fail', e); }
  return orderIds.length;
}
async function unmarkDoneBackend(orderIds){
  if(!CONFIG.writeDoneStatus) return 0;   // ปิดเขียนสถานะลง Order tab
  orderIds = (orderIds||[]).filter(id=> id && DONE[id]);
  if(!CONFIG.gasUrl || !orderIds.length) return 0;
  orderIds.forEach(id=>{ delete DONE[id]; });                              // optimistic
  try{ await fetch(CONFIG.gasUrl,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'unmarkDone',billIds:orderIds})}); }
  catch(e){ console.warn('unmarkDone fail', e); }
  return orderIds.length;
}

/* ================= v3.60 [DEMO — ต้อง deploy .gs เพิ่มก่อนถึงจะทำงานจริง]
 * มาร์ค "ดึงไปจัดแล้ว" กลับเข้า Supabase table "sales_orders" (โปรเจกต์ bdshnnnlyptbmogmdgnn — คนละโปรเจกต์กับ roo_sales/roo_special_sales ที่ใช้ทำป้าย ROO)
 * นี่คือ table เดียวกับที่ปุ่ม ☰ "🟣 ใบจอง จาก Supabase" อ่านเข้ามาแสดง (loadOrdersSb → action:'sbOrders') — มีคอลัมน์ทำไว้รอแล้ว: picking_status/picking_admin/picking_date/picking_time (match ด้วย bill_id → fallback order_id)
 * ยิงผ่าน GAS เดิม (CONFIG.gasUrl) เพราะ client ไม่ได้ถือ key ของโปรเจกต์นี้ (ตรงกับที่ sbOrders อ่านผ่าน Script Properties SB_URL/SB_SERVICE_KEY อยู่แล้ว) — ต้องเพิ่ม action 'markDoneSb' ฝั่ง .gs เอง (โค้ดตัวอย่างอยู่ในแชท)
 * DONE_SB = orderId ที่มาร์คไปแล้ว "รอบนี้" (กันยิงซ้ำตอน export ซ้ำ — ไม่ persist ข้ามรีโหลด เพราะยังไม่มีทางอ่านสถานะกลับมา) */
let DONE_SB = {};
async function markDoneSupabase(orderIds){
  orderIds = (orderIds||[]).filter(id=> id && !DONE_SB[id]);
  if(!CONFIG.gasUrl || !orderIds.length) return {ok:false, n:0};
  const by=(currentUser&&currentUser.email)||(currentUser&&currentUser.name)||'';   // picking_admin = อีเมล (ให้ตรงกับที่ order-picker.html เขียน)
  try{
    const res=await fetch(CONFIG.gasUrl,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'markDoneSb',billIds:orderIds,by})});
    const txt=(await res.text()).trim(); let j={}; try{ j=JSON.parse(txt); }catch(e){}
    if(j.ok){ orderIds.forEach(id=>DONE_SB[id]=true); return {ok:true, n:(j.bills!=null?j.bills:(j.updated!=null?j.updated:orderIds.length))}; }   // j.bills = จำนวนบิลจริงที่แมตช์ใน SB (บางบิลอาจไม่มีใน SB ถ้าอยู่โหมด Sheet)
    if(j.needSetup) return {ok:false, n:0, needSetup:true};
    return {ok:false, n:0, error:j.error||txt};
  }catch(e){ console.warn('[markDoneSb] fail', e); return {ok:false, n:0, error:String(e.message||e)}; }

/* ═══ v3.83: กันพลาด "Export แล้วสถานะ 'จัดแล้ว' ไม่ลง Supabase" (mark ล้มเหลว หรือโดน sheet re-sync ทับ) ═══
 * เก็บ log บิลที่กด Export (localStorage 14 วัน) → ทุกครั้งที่ render เทียบกับข้อมูลจริง (o.done)
 * บิลที่ "export แล้วแต่ยังไม่จัด" → แถบแดง + ปุ่มมาร์คซ้ำ · ครอบทุกร้าน (ROO + ปกติ) */
const EXPLOG_KEY='pk_exportLog', EXPLOG_DAYS=14;
function _explogLoad(){ try{ return JSON.parse(localStorage.getItem(EXPLOG_KEY)||'{}')||{}; }catch(e){ return {}; } }
function _explogSave(m){ try{ localStorage.setItem(EXPLOG_KEY, JSON.stringify(m)); }catch(e){} }
function _explogAdd(orderIds, storeMap){
  const m=_explogLoad(), now=Date.now(), cut=now-EXPLOG_DAYS*86400000;
  (orderIds||[]).forEach(id=>{ if(id) m[id]={store:(storeMap&&storeMap[id])||(m[id]&&m[id].store)||'', ts:now}; });
  for(const k in m){ if(!m[k] || (m[k].ts||0)<cut) delete m[k]; }   // ตัด log เก่า >14วัน
  _explogSave(m);
}
function _explogForget(orderIds){ const m=_explogLoad(); (orderIds||[]).forEach(id=>delete m[id]); _explogSave(m); }
/* v3.91: จำ "บิลที่แอดมินติ๊กสินค้าออกรายตัวตอน Export" → ใช้ตัดสินว่าบิลไหนควรขึ้นแท็บ 🧩 จัดบางส่วน
 * (บิลที่มีแถวจัดปนเพราะ bill_id ซ้ำ/รวมบิล ไม่ได้เกิดจากการติ๊ก → ไม่ต้องขึ้น) · เก็บ 14 วันเท่า export log */
const PCUT_KEY='pk_partialCut';
function _pcutLoad(){ try{ const m=JSON.parse(localStorage.getItem(PCUT_KEY)||'{}')||{}; const cut=Date.now()-EXPLOG_DAYS*86400000; let ch=false;
  for(const k in m){ if(!m[k] || (m[k].ts||0)<cut){ delete m[k]; ch=true; } } if(ch) _pcutSave(m); return m; }catch(e){ return {}; } }
function _pcutSave(m){ try{ localStorage.setItem(PCUT_KEY, JSON.stringify(m)); }catch(e){} }
function _pcutAdd(orderIds){ const m=_pcutLoad(), now=Date.now(); (orderIds||[]).forEach(id=>{ if(id) m[id]={ts:now}; }); _pcutSave(m); }
function _pcutForget(orderIds){ const m=_pcutLoad(); (orderIds||[]).forEach(id=>delete m[id]); _pcutSave(m); }
/* ═══ v3.87 (Surat): เลขที่เอกสาร BV ห้ามซ้ำข้ามรอบ export — "ถ้าเลขซ้ำ bplus นำเข้าไม่ได้" ═══
 * เดิมเลขรันเริ่มจาก doneToday = นับบิลที่ "จัดแล้ววันนี้" จาก Supabase อย่างเดียว
 *   → ถ้าสถานะจัดหาย (โดน sync ทับ / มาร์คไม่ลง) doneToday ตกกลับเป็น 0 แล้วรอบถัดไปออกเลขเดิมซ้ำ = bplus ตีกลับ
 * → จำ "เลขสูงสุดที่ออกไปแล้วจริง" ต่อ (วันที่ + ห้อง) ไว้ในเครื่องด้วย แล้วเริ่มจากค่าที่มากกว่าเสมอ (เก็บ 7 วันพอ)
 * ⚠️ เป็นตัวจำต่อเครื่อง/เบราว์เซอร์ — ถ้าแอดมินคนละเครื่อง export วันเดียวกัน ยังต้องพึ่ง doneToday (สถานะใน Supabase) เป็นตัวรวม */
const BVSEQ_KEY='pk_bvSeq', BVSEQ_DAYS=7;
function _bvLoad(){ try{ return JSON.parse(localStorage.getItem(BVSEQ_KEY)||'{}')||{}; }catch(e){ return {}; } }
function _bvSave(m){ try{ localStorage.setItem(BVSEQ_KEY, JSON.stringify(m)); }catch(e){} }
function bvSeqUsed(runDate, book){ return +(_bvLoad()[runDate+'|'+book]||0); }
function bvSeqNote(runDate, seqByBook){
  const m=_bvLoad(); let cut=''; try{ cut=daysAgoBKK(BVSEQ_DAYS); }catch(e){}
  if(cut) for(const k in m){ if(String(k.split('|')[0]||'') < cut) delete m[k]; }   // ตัดของเก่า กัน localStorage บวม (origin แชร์กับแอปอื่น)
  for(const bk in (seqByBook||{})){ const k=runDate+'|'+bk; if((+m[k]||0) < seqByBook[bk]) m[k]=seqByBook[bk]; }
  _bvSave(m);
}
/* บิลที่ log ว่า export แล้ว แต่ตอนนี้ "ยังไม่ขึ้นจัดแล้ว" (อยู่ในข้อมูลที่โหลด + ไม่ยกเลิก + o.done=false) */
function exportLostBills(){
  const m=_explogLoad(); if(!Object.keys(m).length) return [];
  const done=new Set(), cancel=new Set(), exist=new Set();
  for(const o of DATA.orders){ if(!o.orderId) continue; exist.add(o.orderId); if(o.done) done.add(o.orderId); if(/ยกเลิก/.test(o.cancel)) cancel.add(o.orderId); }
  const lost=[];
  for(const id in m){ if(exist.has(id) && !done.has(id) && !cancel.has(id)) lost.push({orderId:id, store:(m[id]&&m[id].store)||''}); }
  return lost;
}
function renderMarkFailBanner(){
  const el=document.getElementById('markFailBanner'); if(!el) return;
  if(ORDER_SRC!=='sb'){ el.innerHTML=''; return; }   // มาร์คลง Supabase → เตือนเฉพาะโหมด Supabase
  const lost=exportLostBills();
  if(!lost.length){ el.innerHTML=''; return; }
  const rows=lost.slice(0,60).map(b=>`<div>• ${esc(b.store||'(ไม่มีชื่อร้าน)')} <span class="muted">${esc(b.orderId)}</span></div>`).join('');
  el.innerHTML=`<div class="markfail">
    ⚠️ <b>มี ${lost.length} บิลที่ Export ไปแล้ว แต่ยังไม่ขึ้น "นำเข้าแล้ว" ใน Supabase</b><br>
    <span style="font-size:12.5px">(มาร์คไม่สำเร็จ หรือโดน sync ทับ) — คนนำเข้าอาจเห็นซ้ำ · กดปุ่มด้านล่างเพื่อมาร์คให้ครบ</span>
    <div class="mf-list">${rows}${lost.length>60?`<div class="muted">… และอีก ${lost.length-60} บิล</div>`:''}</div>
    <button onclick="retryMarkLost()">🔁 มาร์ค "นำเข้าแล้ว" ซ้ำทั้งหมด (${lost.length} บิล)</button>
  </div>`;
}
async function retryMarkLost(){
  const lost=exportLostBills(); if(!lost.length){ toast('ไม่มีบิลค้าง'); renderMarkFailBanner(); return; }
  const ids=lost.map(b=>b.orderId);
  loading(true,`กำลังมาร์คซ้ำ ${ids.length} บิล…`);
  try{
    ids.forEach(id=>{ delete DONE_SB[id]; });   // บังคับยิงใหม่ (ข้าม cache รอบนี้)
    let sb={ok:false};
    for(let t=1;t<=3;t++){ sb=await markDoneSupabase(ids); if(sb.ok||sb.needSetup) break; await new Promise(r=>setTimeout(r,1000*t)); }
    if(sb.ok){
      const idset=new Set(ids);
      ids.forEach(id=>{ if(!DONE[id]) DONE[id]={orderId:id}; });
      for(const o of DATA.orders){ if(idset.has(o.orderId)) o.done=true; }
      toast(`✅ มาร์คซ้ำสำเร็จ ${ids.length} บิล`);
    } else toast('❌ มาร์คซ้ำไม่สำเร็จ — '+((sb&&(sb.error||(sb.needSetup&&'ยังไม่ตั้ง .gs')))||'ลองใหม่อีกครั้ง'));
  }finally{ loading(false); process(); render(); }
}
/* ================= v3.68: คืนค่าสถานะ (unmark) — เอาบิลออกจาก "นำเข้าแล้ว" กลับ "ยังไม่จัด" · ล้างทั้ง 2 Supabase ================= */
async function unmarkDoneSupabase(orderIds){   // sales_orders (project B) ผ่าน GAS action unmarkDoneSb
  orderIds=(orderIds||[]).filter(Boolean);
  if(!CONFIG.gasUrl||!orderIds.length) return {ok:false,n:0};
  try{
    const res=await fetch(CONFIG.gasUrl,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'unmarkDoneSb',billIds:orderIds})});
    const txt=(await res.text()).trim(); let j={}; try{ j=JSON.parse(txt); }catch(e){}
    if(j.ok){ orderIds.forEach(id=>{ delete DONE_SB[id]; }); return {ok:true,n:orderIds.length}; }
    if(j.needSetup) return {ok:false,n:0,needSetup:true};
    return {ok:false,n:0,error:j.error||txt};
  }catch(e){ return {ok:false,n:0,error:String(e.message||e)}; }
}
async function unmarkDoneRoo(orderIds){   // roo_sales/roo_special (project A) PATCH ตรง — ล้าง 4 คอลัมน์ (match orderId)
  orderIds=(orderIds||[]).filter(Boolean);
  if(!CONFIG.supaUrl||!CONFIG.supaAnon||!orderIds.length) return {ok:false,n:0,skipped:true};
  const payload={'สถานะจัด':'','แอดมินจัด':'','วันสั่งจัด':'','เวลาสั่งจัด':''};
  const H={'apikey':CONFIG.supaAnon,'Authorization':'Bearer '+CONFIG.supaAnon,'Content-Type':'application/json','Prefer':'return=representation'};
  const inList='('+orderIds.map(v=>encodeURIComponent(String(v))).join(',')+')';
  let n=0; const errs=[];
  for(const tbl of ['roo_sales','roo_special_sales']){
    try{
      const res=await fetch(`${CONFIG.supaUrl}/rest/v1/${tbl}?orderId=in.${inList}`,{method:'PATCH',headers:H,body:JSON.stringify(payload)});
      if(!res.ok){ errs.push(`${tbl} HTTP ${res.status}`); continue; }
      const rows=await res.json(); n+=(rows&&rows.length)||0;
    }catch(e){ errs.push(`${tbl}: ${e.message||e}`); }
  }
  return {ok:errs.length===0,n,errs};
}
/* v3.87: ล้างสถานะ "นำเข้าแล้ว" ฝั่งแอปให้ครบทุกที่ (ใช้ร่วมกันทั้งคืนทีละบิล/คืนทีเดียวหลายบิล)
 * ⚠️ ต้องล้างครบ 3 ที่ ไม่งั้นบิลไม่กลับไป "ยังไม่จัด": DONE map · o.done รายแถว (v3.85) · pk_exportLog (v3.87) */
function _restoreLocal(ids){
  const set=new Set(ids);
  ids.forEach(id=>{ delete DONE[id]; });
  for(const o of DATA.orders){ if(set.has(o.orderId)){ o.done=false; o.doneBy=''; o.doneDate=''; o.doneTime=''; } }
  _explogForget(ids);   // คืนเอง = ไม่ใช่ "หลุด" → เอาออกจาก log (กัน banner เตือนผิด + กันบิลค้างหน้านำเข้าแล้ว)
  _pcutForget(ids);     // v3.91: คืนทั้งบิลแล้ว = ไม่ใช่ "จัดบางส่วน" อีกต่อไป
}
async function restoreBill(id){
  id=String(id||''); if(!id) return;   // v3.87: เลิกเช็ค DONE[id] — บิลที่สถานะใน Supabase หายไม่มีใน DONE แต่ต้องกดคืนได้
  _restoreLocal([id]);                 // optimistic: กลับไป "ยังไม่จัด" ทันที
  process(); render();
  const sb=await unmarkDoneSupabase([id]);   // v3.69: .gs unmarkDoneSb ล้างครบ 3 ตาราง
  toast('↩︎ คืนสถานะ '+id+((sb.error||sb.needSetup)?' (พลาด: '+(sb.error||'ยังไม่ตั้ง .gs')+')':' → กลับไปยังไม่จัด'));
}
/* v3.87 (Surat: "ต้องมีปุ่มคืนค่าที่เลือกในหน้านำเข้าแล้ว ไม่งั้นต้องกดทีละตัว ช้า")
 * คืนเฉพาะบิลที่ติ๊กไว้ "และอยู่ในหน้านำเข้าแล้ว" เท่านั้น (ตะกร้า selectedBills ใช้ร่วมกันทุกมุมมอง — ห้ามเผลอไปคืนบิลฝั่งยังไม่จัด)
 * ยิง unmarkDoneSb เป็นก้อนละ 100 (payload/URL ยาวเกินไม่ได้) · บิลที่คืนแล้วยังติ๊กค้างไว้ → กด Export จัดใหม่ต่อได้เลย */
async function restoreSelected(){
  const ids=buildBills().filter(b=>b.doneAny && selectedBills.has(b.orderId)).map(b=>b.orderId);
  if(!ids.length){ toast('ยังไม่ได้ติ๊กบิลในหน้า "📥 นำเข้าแล้ว"'); return; }
  if(!confirm(`คืนค่า ${ids.length} บิล กลับไป "ยังไม่จัด"?\n\nล้างสถานะจัดใน Supabase (sales_orders + roo) → บิลกลับมาให้เลือกจัดใหม่ได้`)) return;
  loading(true, `กำลังคืนค่า ${ids.length} บิล…`);
  try{
    _restoreLocal(ids); process(); render();
    let ok=0, err='';
    for(let i=0;i<ids.length;i+=100){
      const chunk=ids.slice(i,i+100);
      const sb=await unmarkDoneSupabase(chunk);
      if(sb&&sb.ok) ok+=chunk.length; else err = (sb&&sb.error) || (sb&&sb.needSetup ? 'ยังไม่ตั้ง .gs' : 'ยิงไม่สำเร็จ');
    }
    toast(err ? `↩︎ คืนค่า ${ok}/${ids.length} บิล (พลาด: ${err} — กด 🔄 โหลด เช็คอีกที)` : `↩︎ คืนค่า ${ids.length} บิล → กลับไป "ยังไม่จัด" แล้ว`);
  }finally{ loading(false); process(); render(); }
}
/* v3.86 (Surat): "ร้านไหนที่นำเข้าไปแล้วไม่ควรขึ้นอีก — ไม่งั้นแอดมินงงเพราะบิลมาขึ้นซ้ำ"
 * บิลที่มีแถว "จัดแล้ว" แม้แถวเดียว = นำเข้าไปแล้ว → หลุดจากมุมมอง "ยังไม่จัด" ทั้งบิล (เดิม v3.84 ยอมให้โผล่ 2 มุมมองพร้อมกัน)
 * ⚠️ ผลข้างเคียงที่รู้ตัว: ออเดอร์ใหม่ที่ใช้ bill_id ซ้ำกับบิลที่นำเข้าไปแล้ว (รวมบิล) จะไม่ขึ้นในลิสต์เลือกบิล
 *    → ไม่ปล่อยหาย: นับไว้เตือนใต้แท็บ "ยังไม่จัด" + ติดป้าย 🆕 ให้เห็นในแท็บ "นำเข้าแล้ว" (Surat จะไปแก้ที่ต้นทางเรื่อง bill_id ซ้ำ) */
/* ═══ v3.89: 3 มุมมองแยกขาดจากกัน (บิลนึงอยู่ได้มุมมองเดียว → ไม่มี "บิลขึ้นซ้ำ" ให้แอดมินงง) ═══
 *  ☑️ ยังไม่จัด    = ยังไม่แตะเลย                         → เลือกไป export ได้
 *  🧩 จัดบางส่วน   = จัดไปแล้วบางบรรทัด ยังเหลือค้าง       → เลือกไป export เฉพาะที่เหลือได้ (เกิดจาก "ตัดออกรายตัว")
 *  📥 นำเข้าแล้ว   = จัดครบทั้งบิล (หรือ export ไปแล้วตาม log) → ไม่ขึ้นให้เลือกอีก จนกว่าจะกด "↩︎ คืน"
 * ⚠️ ลำดับความน่าเชื่อถือ: "สถานะรายบรรทัดจริง" (doneLines) ชนะ "export log" เสมอ
 *    บิลที่จัดไปบางบรรทัด = 🧩 จัดบางส่วน ไม่ใช่ 📥 นำเข้าแล้ว แม้จะอยู่ใน log (ไม่งั้นของที่เหลือจะจัดต่อไม่ได้)
 *    log ตัดสินเฉพาะตอน "ไม่มีสถานะรายบรรทัดเลย" (doneLines===0) = เคส v3.87 สถานะใน Supabase หายทั้งบิล */
function billFullyDone(b){ return (b.doneLines>0 && b.pendLines===0) || (b.logDone && b.doneLines===0); }
/* v4.05: + ด่านขายเชื่อ (DebtApproval) — "รอ/รอบัญชี/ไม่อนุมัติ" กันทั้งใบเหมือนกัน ไปอยู่แท็บ 🏦 บัญชี อย่างเดียว */
/* v4.16: + priceHoldLines — บิลที่มีบรรทัด "รออนุมัติราคา" กันทั้งใบ ไปโผล่แค่แท็บ 🏦 บัญชี */
/* v4.19: + เคส "ทั้งใบเป็นสถานะอื่น" (acctLines>0 · ไม่มีบรรทัดจัดได้/จัดแล้วเลย เช่น รอบัญชีอนุมัติทั้งใบ)
 * = บิลที่อยู่แท็บบัญชีอย่างเดียว → ถ้าติ๊กค้างไว้ต้องล็อกปุ่ม Export เหมือนกัน (เดิมหลุด เพราะ blockLines นับเฉพาะ ไม่อนุมัติ/ปฏิเสธ) */
function isAcctHoldBill(b){ return (b.blockLines>0 || b.priceHoldLines>0 || isDebtHeldBill(b) || (b.acctLines>0 && b.pendLines===0)) && !billFullyDone(b); }   // v3.90/97: รอบัญชี/ไม่อนุมัติ/ปฏิเสธ → ห้าม Export ทั้งใบ + ไม่โผล่มุมมองอื่น
/* v4.18: ชื่อเหตุผลที่บิล "ยังไม่ผ่านบัญชี" (ใช้ในแถบแดงใต้ปุ่ม Export + การ์ดตอนกด Export)
 * ใช้ชื่อเดียวกับชิปหัวข้อในแท็บ 🏦 บัญชี — แอดมินจะได้ตามหาต่อถูกที่ */
function holdWhyOf(b){
  if(b.debtState==='block') return DEBT_BLOCK_BUCKET+' (ขายเชื่อ)';
  if(b.debtState==='wait')  return DEBT_WAIT_BUCKET;
  if(b.priceHoldLines>0)    return 'รออนุมัติราคา';
  if(b.blockLines>0)        return 'ไม่อนุมัติ/ปฏิเสธ';
  const ks=Object.keys(b.acctBuckets||{});               // v4.19: ทั้งใบสถานะอื่น → ใช้ชื่อสถานะจริง (เช่น รอบัญชีอนุมัติ)
  return ks[0]||'ยังไม่ผ่านบัญชี';
}
/* v3.97: หน้าย่อยในแท็บ 🏦 บัญชี = "ชื่อสถานะจริง" ที่เจอในข้อมูล (รออนุมัติราคา · รอบัญชีอนุมัติ · อนุมัติ · ปฏิเสธราคา · ฯลฯ)
 * สร้างชิปอัตโนมัติจากข้อมูล → สถานะใหม่ที่บัญชีเพิ่มมาทีหลังก็ไม่หายไปเงียบ ๆ อีก */
let acctSub='';
function setAcctSub(v){ acctSub=v; renderBillSelect(); }
/* v4.06: แถบคำอธิบายใต้ปุ่ม — พับเก็บได้ (ค่าเริ่มต้น = ซ่อน) · จำไว้ในเครื่อง */
let noteOpen = (()=>{ try{ return localStorage.getItem('pk_noteOpen')==='1'; }catch(e){ return false; } })();
function toggleNote(){ noteOpen=!noteOpen; try{ localStorage.setItem('pk_noteOpen', noteOpen?'1':'0'); }catch(e){} renderBillSelect(); }
function acctSubMatch(b){
  if(billFullyDone(b)) return false;
  if(!acctSub) return b.acctLines>0;                  // ยังไม่เลือกหัวข้อย่อย = โชว์ทุกสถานะที่ค้าง
  return (b.acctBuckets[acctSub]||0)>0;
}
/* รวมรายชื่อสถานะที่ค้างอยู่ + จำนวนบิล (ใช้สร้างชิปหน้าย่อย) */
/* v4.06 (Surat: "แท็บไม่อนุมัติไม่ขึ้น — ถึงไม่มีก็ควรขึ้นไว้")
 * 2 หัวข้อของด่านขายเชื่อ (รอบัญชีอนุมัติ · ไม่อนุมัติ) ปักไว้เสมอแม้เป็น 0 → แอดมินรู้ว่า "ตรวจแล้วไม่มี"
 * ไม่ใช่ "แท็บหายไปไหน" · สถานะอื่น ๆ (รออนุมัติราคา ฯลฯ) ยังสร้างจากข้อมูลจริงเหมือนเดิม */
function acctBucketCounts(bills){
  const m={}; m[DEBT_WAIT_BUCKET]=0; m[DEBT_BLOCK_BUCKET]=0;
  (bills||[]).forEach(b=>{ if(billFullyDone(b)) return; for(const k in b.acctBuckets) m[k]=(m[k]||0)+1; });
  return Object.entries(m).sort((a,b)=>b[1]-a[1]);
}
/* v3.91 (Surat): "จัดบางส่วนควรขึ้นข้อมูลจริงๆ ที่มีการติ๊ก ถ้าไม่มีไม่ต้องขึ้น"
 * เดิม v3.89 จับแค่ doneLines>0 && pendLines>0 → บิลที่ bill_id ซ้ำ (รวมบิล · บางแถวจัดมาจากรอบเก่า) ก็ขึ้นด้วย ทั้งที่แอดมินไม่ได้ติ๊กออกเอง
 * ใหม่: ต้องเป็นบิลที่ "เราติ๊กสินค้าออกตอน Export จริงๆ" (จำไว้ใน pk_partialCut) เท่านั้น · บิลอื่นที่มีแถวจัดปนกลับไปอยู่ 📥 นำเข้าแล้ว เหมือน v3.86 */
/* ⚠️ v4.04 (2026-08-07) — ขยายจาก v3.91: เดิมต้อง `b.partialCut` (ติ๊กสินค้าออกเองตอน Export) ถึงจะขึ้นแท็บ 🧩
 * แต่เจอของจริง 10 บิลที่ "จัดไปแล้วบางบรรทัด ยังเหลือของที่จัดได้" โดยไม่ได้เกิดจากการติ๊กออก
 *   เช่น ORD8311622 หนิง(วัฒนาพานิช): อนุมัติราคา 15 บรรทัด=จัดแล้ว · รอบัญชีอนุมัติ 3 บรรทัด=ยังไม่จัด
 *   (ตอนจัดรอบแรกบัญชียังไม่ปล่อย → พอ v4.01 ปลดล็อกแล้ว 3 บรรทัดนั้นจัดได้ แต่บิลไปกองอยู่ "นำเข้าแล้ว")
 * → ของค้างมองไม่เห็น = ลูกค้าไม่ได้ของ · ให้ทุกบิลที่ยังมีบรรทัดค้างจัดขึ้นแท็บ 🧩 จัดบางส่วน
 * ยังไม่ขึ้นในลิสต์ "ยังไม่จัด" (กติกา Surat "บิลนำเข้าแล้วห้ามขึ้นซ้ำ" ยังอยู่ครบ) */
function isPartialBill(b){ return b.doneLines>0 && b.pendLines>0; }
/* ⭐ v4.16 (Surat): "สินค้าที่เปิดบิลไปบางส่วน ส่วนที่เหลือควรอยู่หน้า ยังไม่จัด และมีโน้ตแบบปกติว่าจัดบางส่วน"
 * → **ยุบแท็บ 🧩 จัดบางส่วน ทิ้ง** เอามารวมใน ☑️ ยังไม่จัด แล้วติดป้ายบอกแทน
 *   เงื่อนไขตรงตามที่สั่ง: bill_id เดียวกัน · บางบรรทัด picking_status ว่าง · approval_status = อนุมัติราคา
 * เหลือ 3 มุมมอง: ☑️ ยังไม่จัด (รวมจัดบางส่วน) · 📥 นำเข้าแล้ว (จัดครบใบ) · 🏦 บัญชี (กันไว้) */
function billInView(b){
  if(doneView==='all') return true;
  if(doneView==='acct')    return acctSubMatch(b);                         // v3.90/91: 🏦 แท็บบัญชี → ดูตามหน้าย่อย (รอบัญชี/รออนุมัติราคา/ไม่อนุมัติ)
  if(isAcctHoldBill(b)) return false;                                      // บิลที่ยังไม่ผ่านด่าน ไม่ไปโผล่มุมมองอื่นให้แอดมินเผลอเลือก
  if(doneView==='done')    return billFullyDone(b);                        // จัดครบทั้งใบ (หรือ export ไปแล้วแต่สถานะยังไม่ลง)
  return !billFullyDone(b) && b.pendLines>0;                               // pending — รวมบิลที่จัดไปบางส่วนแล้ว
}
function isLostStatusBill(b){ return b.logDone && b.doneLines===0; }               // v3.87: export ไปแล้ว (log) แต่สถานะจัดใน Supabase ไม่มี → ต้องมาร์คซ้ำ (แถบแดง v3.83)
function setDoneView(v){ doneView=v; renderBillSelect(); }

/* ================= core processing ================= */
function process(){
  let fFrom = document.getElementById('fDateFrom').value, fTo = document.getElementById('fDateTo').value;
  if(fFrom && fTo && fFrom>fTo){ const t=fFrom; fFrom=fTo; fTo=t; }   // กันใส่สลับ
  const fStore = document.getElementById('fStore').value.trim().toLowerCase();
  const fRole  = document.getElementById('fRole').value;
  const fWh    = document.getElementById('fWh').value;

  const runDate = todayBKK();
  const _rd=runDate.split('-'); const bvDate = String((+_rd[0])+543).slice(-2)+_rd[1]+_rd[2];   // YYMMDD พ.ศ.2หลัก เช่น 690609
  const bplusFields = (o,docNo)=>{
    const isFree = /แถม/.test(o.type);   // คอลัมน์ I: "ขาย"→ช่องจำนวน · "แถม"→ช่องแถม (อีกช่องเป็น 0)
    return {
