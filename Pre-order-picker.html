    stops+=`<div class="jr-stop"><div class="jr-seqdot" style="background:${col}">${b.stop}</div>
      <div class="sn">${esc(b.store)} ${ffMini(b.ff)} <span class="jr-pill" style="font-size:9.5px;padding:0 5px">${esc(b.salesman)}</span>${sd}${gs}
        <div style="font-size:10px;color:var(--muted)">📍${esc(b.tambonName||'-')} · ${Math.round(b.kg)}kg${d!=null?' · '+d.toFixed(1)+'กม.'+(d>jrThrVal()?' 🔴':''):''}</div></div>
      ${jrTruckDropdown(b.orderId)}<button class="jr-pop${far?' far':''}" title="ดีดร้านนี้ออก → รอจัดรถ (ไปจัดใหม่)" onclick="event.stopPropagation();jrAssignStore('${esc(b.orderId)}','')">✖ ออก</button><button class="jr-pop" style="border-color:#d97706;color:#d97706" title="เก็บไว้ก่อน (ค้างส่ง) — ดึงออกจากคัน ไม่ขึ้นรถวันนี้" onclick="event.stopPropagation();jrToggleHold('${esc(b.orderId)}')">📥 เก็บ</button></div>`;
    if(here) prev=here; });
  const chanPill=g.chan?`<span class="jr-pill" style="background:${g.chan==='ปลีก'?'#dbeafe':'#dcfce7'};color:${g.chan==='ปลีก'?'#1d4ed8':'#166534'}">${esc(g.chan)}</span>`:'';
  return `<div class="jr-truck ${g.gid===jrSel?'sel':''} ${isOpen?'open':''} ${_suspect?'suspect':''}" data-gid="${esc(g.gid)}" style="border-left-color:${col}">

    </div>
    <div class="jr-bars"><div class="jr-bar"><div class="bl"><span>${g.overKg?'⚠️ เกิน 20% · ตัดร้าน · ':''}฿${Math.round(g.totalBaht).toLocaleString()}${g.shortN?' · ❗'+g.shortN+' ขาด':''}</span><span>${Math.round(g.totalKg).toLocaleString()}/${capKg.toLocaleString()} kg · ${rawPct}%</span></div><div class="bt"><div class="jr-bf ${cls}" style="width:${pct}%"></div></div></div></div>
    <div class="jr-span ${_suspect?'suspect':''}">${jrSpanHtml(g,_thr)}</div>

async function jrInitMap(){
  const el=document.getElementById('jrMap');
  if(!el){ if(jrMap){ try{jrMap.remove();}catch(e){} jrMap=null; } return; }   // ไม่มีคันกาง = ไม่มีแผนที่
  if(!await ensureLeaflet()){ el.innerHTML='<div class="empty" style="padding:30px">โหลดแผนที่ไม่ได้ (ออฟไลน์?) — ดูลำดับจอด/ระยะในการ์ดแทน</div>'; return; }
  if(jrMap){ try{jrMap.remove();}catch(e){} jrMap=null; }
  const g=jrGroup(jrOpenSm)||jrGroup(jrSel), dep=depotOf(g?g.wh:TRUCK_MODEL.wh);
  jrMap=L.map('jrMap',{zoomControl:true}).setView([dep.lat,dep.lng],11);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(jrMap);
  jrLayer=L.layerGroup().addTo(jrMap);
  setTimeout(()=>{ if(jrMap){ jrMap.invalidateSize(); jrRenderRoute(); } },80);   // invalidateSize กัน map bug (tiles เพี้ยน/เทา ตอน layout ยังไม่นิ่ง)
}
function jrStorePins(stops, col){

    .bindPopup(`<b>${b.stop}. ${esc(b.store)}</b><br>รหัส ${esc(b.storeCode)}${b.type?' · '+esc(b.type):''}${[b.tambonName,b.amphoe,b.province].filter(Boolean).length?'<br>📍 '+esc([b.tambonName,b.amphoe,b.province].filter(Boolean).join(' · ')):''}<br>${b.ff==='ok'?'✅ ครบ':b.ff==='part'?'⚠️ ได้บางส่วน':'⛔ หมด'} · ${Math.round(b.kg)}kg · ฿${Math.round(b.allocBaht).toLocaleString()}${b.phone?'<br>📞 '+esc(b.phone):''}<br><a href="https://www.google.com/maps/dir/?api=1&destination=${b.lat},${b.lng}" target="_blank">🧭 นำทาง</a>`) );

function jrSaveOsrm(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function jrLoadOsrm(k){ try{ return JSON.parse(localStorage.getItem(k)||'null'); }catch(e){ return null; } }
function jrRenderRoute(){
  if(!jrMap||!jrLayer) return;
  jrLayer.clearLayers();
  const g=jrGroup(jrSel); if(!g) return;
  const thr=jrThrVal(), dep=depotOf(g.wh), col=g.color||'#2563eb';
  L.marker([dep.lat,dep.lng],{icon:L.divIcon({className:'',html:'<div class="jr-pinhome">🏠</div>',iconSize:[28,28],iconAnchor:[14,14]})}).addTo(jrLayer).bindPopup('<b>คลัง '+(g.wh||'')+'</b><br>จุดเริ่ม (พิกัดประมาณ)');
  const stops=g.bills.filter(b=>b.lat!=null);
  jrStorePins(stops, col);
  const ti=document.getElementById('jrMapTitle'); if(ti) ti.textContent=g.name||'';
  const tEl=document.getElementById('jrTotal'), fEl=document.getElementById('jrFar');
  if(!stops.length){ if(tEl)tEl.textContent='ระยะรวม — กม.'; if(fEl)fEl.style.display='none'; return; }
  jrMap.fitBounds([[dep.lat,dep.lng],...stops.map(b=>[b.lat,b.lng])],{padding:[40,40]});
  if(tEl) tEl.textContent='🛣️ กำลังหาเส้นทางถนน…';
  jrRoadRoute(g, dep, stops, thr, col).catch(()=>jrDrawStraight(g, dep, stops, thr, col, true));   // OSRM ถนนจริง · ล้มเหลว→เส้นตรง
}
async function jrRoadRoute(g, dep, stops, thr, col){
  const useTrip = jrTripOpt && stops.length>=2 && !g.bills.some(b=>b.stopSeq>0);   // มี "ลำดับร้าน" manual (stopSeq) → ใช้ route ตามลำดับ ไม่ให้ Trip จัดทับ · ไม่มี manual → Trip optimize ตามถนน
  const depK='D'+dep.lng.toFixed(5)+','+dep.lat.toFixed(5);
  const key='jr_osrm_'+(useTrip?'T_':'R_')+(useTrip
      ? depK+'|'+stops.map(p=>p.lng.toFixed(5)+','+p.lat.toFixed(5)).slice().sort().join(';')   // trip = ไม่ขึ้นกับลำดับ → cache คงที่
      : [dep,...stops].map(p=>p.lng.toFixed(5)+','+p.lat.toFixed(5)).join(';'));
  let res=jrOsrmCache[key]||jrLoadOsrm(key);
  if(!res){
    const coords=[dep,...stops].map(p=>p.lng+','+p.lat).join(';');
    const base=useTrip?'trip/v1/driving/':'route/v1/driving/';
    const q=useTrip?'?source=first&roundtrip=false&overview=full&geometries=geojson&steps=true':'?overview=full&geometries=geojson&steps=true';
    const ctrl=new AbortController(), to=setTimeout(()=>ctrl.abort(),9000);
    let json; try{ const r=await fetch('https://router.project-osrm.org/'+base+coords+q,{signal:ctrl.signal}); json=await r.json(); } finally{ clearTimeout(to); }
    if(!json || json.code!=='Ok') throw new Error('osrm');
    const route=(json.trips&&json.trips[0])||(json.routes&&json.routes[0]); if(!route) throw new Error('osrm');
    let orderIds=null;
    if(useTrip && Array.isArray(json.waypoints)){
      const ws=json.waypoints.map((w,i)=>({i,wi:w.waypoint_index})).filter(x=>x.i>0).sort((a,b)=>a.wi-b.wi);
      orderIds=ws.map(x=> stops[x.i-1] && stops[x.i-1].orderId).filter(Boolean);   // เก็บเป็น orderId (ไม่ใช่ index) → re-apply idempotent ไม่วนลูป
    }
    const legs=(route.legs||[]).map(leg=>{ const c=[]; (leg.steps||[]).forEach(s=>{ const gg=s.geometry&&s.geometry.coordinates; if(gg) gg.forEach(p=>c.push([p[1],p[0]])); }); return {distance:leg.distance,coords:c}; });
    res={total:route.distance,legs,orderIds}; jrOsrmCache[key]=res; jrSaveOsrm(key,res);
  }
  const _leg0=(res.legs&&res.legs[0])?res.legs[0].distance:0;
  g.spanKm=Math.max(0,(res.total-_leg0)/1000);   // OSRM: spanKm = total − ขาคลัง→จอดแรก (นับเฉพาะร้านแรก→ร้านสุดท้าย)
  if(res.orderIds && res.orderIds.length){   // จัดลำดับจอดตามถนน (เรียงด้วย orderId = idempotent · cache sorted ไม่ยิงซ้ำ)
    const byId={}; g.bills.forEach(b=>byId[b.orderId]=b);
    const seq=res.orderIds.map(id=>byId[id]).filter(Boolean);
    const rest=g.bills.filter(b=>seq.indexOf(b)<0);
    const ordered=[...seq,...rest]; ordered.forEach((b,i)=>b.stop=i+1);
    if(JSON.stringify(g.bills.map(b=>b.orderId))!==JSON.stringify(ordered.map(b=>b.orderId))){ g.bills=ordered; renderTruckTab(); return; }
  }
  jrDrawOsrm(res, thr, col);
  jrUpdateSpan();   // อัปเดต span/suspect ของคันนี้ด้วยค่า OSRM จริง (เบา ไม่ rebuild)
}
function jrDrawOsrm(res, thr, col){
  if(!jrMap||!jrLayer) return;
  let far=0;
  (res.legs||[]).forEach(leg=>{ const km=leg.distance/1000, isFar=km>thr; if(isFar)far++;
    if(leg.coords.length>1) L.polyline(leg.coords,{color:isFar?'#dc2626':col,weight:isFar?5:4,opacity:.85,dashArray:isFar?'8,6':null}).addTo(jrLayer);
    const mid=leg.coords[Math.floor(leg.coords.length/2)];
    if(mid) L.marker(mid,{icon:L.divIcon({className:'',html:`<div class="jr-leglbl ${isFar?'far':''}">${km.toFixed(1)} กม.</div>`,iconSize:[44,16],iconAnchor:[22,8]})}).addTo(jrLayer);
  });
  const tEl=document.getElementById('jrTotal'); if(tEl) tEl.textContent=`🛣️ ระยะถนน ~${(res.total/1000).toFixed(1)} กม.`;
  const fEl=document.getElementById('jrFar'); if(fEl){ fEl.textContent=`ไกลเกิน ${far} ช่วง (>${thr})`; fEl.style.display=far?'inline-block':'none'; }
}
function jrDrawStraight(g, dep, stops, thr, col){   // FALLBACK เส้นตรง (OSRM ล้มเหลว/ออฟไลน์)
  if(!jrMap||!jrLayer) return;
  let prev=dep,total=0,far=0;
  stops.forEach(b=>{ const d=haversine(prev,b); total+=d; const isFar=d>thr; if(isFar)far++;
    L.polyline([[prev.lat,prev.lng],[b.lat,b.lng]],{color:isFar?'#dc2626':col,weight:isFar?5:3,opacity:.75,dashArray:isFar?'8,6':'5,6'}).addTo(jrLayer);
    const mid=[(prev.lat+b.lat)/2,(prev.lng+b.lng)/2];
    L.marker(mid,{icon:L.divIcon({className:'',html:`<div class="jr-leglbl ${isFar?'far':''}">${d.toFixed(1)} กม.</div>`,iconSize:[44,16],iconAnchor:[22,8]})}).addTo(jrLayer);
    prev=b; });
  const tEl=document.getElementById('jrTotal'); if(tEl) tEl.textContent=`📏 ระยะโดยประมาณ (เส้นตรง) ~${total.toFixed(1)} กม.`;
  const fEl=document.getElementById('jrFar'); if(fEl){ fEl.textContent=`ไกลเกิน ${far} ช่วง (>${thr})`; fEl.style.display=far?'inline-block':'none'; }
}

async function mtfSaveSheet(){

  if(!CONFIG.gasUrl){ toast('ยังไม่ได้ตั้ง gasUrl'); return; }
  loading(true,'กำลังบันทึกลงชีท…');
  try{
    const by=(currentUser&&currentUser.name)||'';
    const header=['วันที่','ต้นทาง','ปลายทาง','บาร์โค้ด','สินค้า','หน่วย','จำนวน','ผู้สร้าง','เวลา'];

/* โหลด "ใบเตรียมบิล" (GAS readPrep · gas-v14) → บรรทัดโครงเดียวกับ dsdc — ref=เลข DC → ทุกอย่างหลังจากนี้ (เลือกบิล/สแกน/รายคน/export) reuse ได้หมด */
async function loadPrep(force){
  if(DATA.prep && !force) return DATA.prep;
  if(!CONFIG.gasUrl) throw new Error('ยังไม่ได้ตั้ง gasUrl');
  const res=await fetch(CONFIG.gasUrl,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'readPrep',tab:'ใบเตรียมบิล'})});
  const txt=(await res.text()).trim(); let j={}; try{ j=JSON.parse(txt); }catch(e){}
  if(!j.ok) throw new Error(j.error||txt||'โหลดใบเตรียมไม่ได้');
  DATA.prep=(j.rows||[]).map((r,i)=>{ const u=String(r.unit||'').trim(), pu=parseUnit(u);
    const lv=/CS/i.test(u)?'CS':/BP/i.test(u)?'BP':/PA/i.test(u)?'PA':(pu.level||'EA');   // prep ฝั่ง CS unit='CS' เพียวๆ (ไม่มี x..() ให้ parseUnit จับ)
    const dc=String(r.dc||'').trim(), so=String(r.ref||'').trim(), stc=String(r.storeCode||'').trim();
    const ref=dc || (so?'SO:'+so:(String(r.salesman||'').trim()+'·'+(stc||String(r.store||'').trim()||'-')));   // ไม่มีเลข DC → SO → เซล·ร้าน (แยกบิลต่อร้าน ไม่ยุบรวม)
    return { seq:i, date:String(r.date||'').trim(), ref, dc, so:String(r.ref||'').trim(),
      storeCode:String(r.storeCode||'').trim(), store:String(r.store||'').trim(),
      salesman:String(r.salesman||'').trim(), salesmanName:String(r.salesmanName||'').trim(),
      wh:String(r.wh||'').trim().toUpperCase(), barcode:String(r.barcode||'').trim(), product:String(r.product||'').trim(),
      unit:u, level:lv, eaPer:pu.eaPer||1, sold:num(r.sold)||0, free:num(r.free)||0, price:0 };
  }).filter(x=>x.barcode && x.ref && (x.sold>0||x.free>0));
  prepLoadedAt=nowStamp(); return DATA.prep;
}
function coDatesFor(wh){ return [...new Set(coSrcArr().filter(x=>!wh||wh==='all'||x.wh===wh).map(x=>x.date))].filter(Boolean).sort(); }
function coLines(){ return coSrcArr().filter(x=> (!coWh||coWh==='all'||x.wh===coWh) && (!coDate||x.date===coDate) ); }
function coBills(){   // บิลในวัน/คลัง → ร้าน · เซล · เลขบิล · ลัง · แถม
  const m={};
  coLines().forEach(x=>{ if(!m[x.ref]) m[x.ref]={ref:x.ref, store:x.store, storeCode:x.storeCode, salesman:x.salesman, salesmanName:x.salesmanName, wh:x.wh, cs:0, free:0, lines:0};
    const b=m[x.ref]; b.lines++; if(x.level==='CS') b.cs+=x.sold; b.free+=x.free; });
  return Object.values(m).sort((a,b)=> String(a.salesman).localeCompare(b.salesman) || String(a.ref).localeCompare(b.ref));
}

function coBillsF(){ return coBills().filter(coQ2Match); }   // บิลที่ผ่านช่องค้นหา (เลขบิล/ร้าน/รหัสร้าน/เซล)
function coSms(){   // รวมรายเซล (จากบิลที่ผ่านค้นหา) + เก็บ list บิล ไว้ให้ติ๊กออกรายบิล (collapse)
  const m={};
  coBillsF().forEach(b=>{ const k=b.salesman||'(ไม่ระบุ)';
    if(!m[k]) m[k]={salesman:k, salesmanName:b.salesmanName, bills:0, _st:new Set(), cs:0, free:0, refs:[], list:[]};
    const s=m[k]; s.bills++; s._st.add(b.storeCode||b.store); s.cs+=b.cs; s.free+=b.free; s.refs.push(b.ref); s.list.push(b); });
  return Object.values(m).map(s=>({...s, stores:s._st.size, selN:s.refs.filter(r=>coSel.has(r)).length})).sort((a,b)=>String(a.salesman).localeCompare(b.salesman));
}

/* ═══ v3.58 — ยอดที่ยิงนับเป็น EA (คู่กับ Scanner v2.7 "ยิงหน่วยไหนก็ได้ รวมยอดได้") ═══
 * เครื่องยิงเขียน col14 'ยิงแล้ว(EA)' ลงชีท (gas-v17 คืนเป็น .ea) · แถวเก่า/สแกนเนอร์เก่าไม่มี → แปลงจาก qty × EA-ต่อหน่วยของแถวนั้น */
const UNIT_TH={CS:'ลัง',BP:'Big Pack',PA:'แพ็ค',EA:'ชิ้น'};
function eaPerOf(prod, level, fallback){
  const f=Math.max(1,+fallback||1); if(!prod) return f;
  const q = level==='CS'?+prod.qtyCS : level==='BP'?+prod.qtyBP : level==='PA'?+prod.qtyPA : 1;
  return (q>0)?q:f;
}
/* EA → ข้อความหน่วยที่คนอ่านรู้เรื่อง "2 ลัง 3 แพ็ค" · ไม่ยกหน่วยใหญ่เกิน "หน่วยของเอกสาร" (topLevel)
 * เช่น ใบโอน Non-CS หน่วยเป็นแพ็ค → 72 ชิ้น ต้องอ่านว่า "12 แพ็ค" ไม่ใช่ "2 ลัง" (ของที่โอนคือแพ็คจริงๆ) */
function fmtEaUnits(ea, prod, topLevel, topEaPer){
  let r=Math.max(0, Math.round(+ea||0)); if(!r) return '0';
  const lv=['CS','BP','PA','EA'], from=Math.max(0, lv.indexOf(topLevel||'CS')), out=[];
  for(let k=from;k<lv.length;k++){
    const u=lv[k], per=(u===topLevel)?eaPerOf(prod,u,topEaPer):eaPerOf(prod,u,0);
    if(u!=='EA' && !(per>1)) continue;
    const n=(u==='EA')?r:Math.floor(r/per);
    if(n>0){ out.push(n+' '+UNIT_TH[u]); r-=(u==='EA')?r:n*per; }
    if(r<=0) break;
  }
  return out.length?out.join(' '):'0';
}
/* อธิบายอัตราแปลงในทิศที่คนอ่านเข้าใจ — "1 ลัง = 6 แพ็ค" (ไม่ใช่ 1 แพ็ค = 0.17 ลัง) */
function unitRatioText(aLv, aPer, bLv, bPer){
  const [big,bigPer,small,smallPer] = (aPer>=bPer) ? [aLv,aPer,bLv,bPer] : [bLv,bPer,aLv,aPer];
  const n=Math.round(bigPer/smallPer*100)/100;
  return `1 ${UNIT_TH[big]||big} = ${n} ${UNIT_TH[small]||small}`;
}
function coRowEa(r){
  const ea=Math.round(num(r.ea)||0); if(ea>0) return ea;
  const q=parseInt(r.qty)||0; if(q<=0) return 0;
  const pu=parseUnit(String(r.unit||'')), prod=DATA.prodIdx[String(r.barcode||'').trim()]||null;
  return Math.round(q*eaPerOf(prod, pu.level, pu.eaPer));
}
function coScannedQty(bc){ const p=coPicked.find(p=>p.barcode===bc); return p?(parseInt(p.qty)||0):null; }   // จอสแกน = "ของเรา" เท่านั้น (Surat v3.41) — ของทีมดูที่ 👥/Export
function coTeamQty(bc){ let s=0,hit=false; Object.keys(coTeam).forEach(nm=>{ if(coExcl.has(nm)) return; const q=(coTeam[nm].qty||{})[bc]; if(q){ s+=q; hit=true; } }); return hit?s:null; }   // v3.58: หน่วย = EA (ยอดรวม "คนที่ติ๊กเลือก") — ใช้ตอน Export
function coOthersQty(bc){ let s=0; Object.keys(coTeam).forEach(nm=>{ const g=coTeam[nm]; if(g.mine) return; s+=(g.qty||{})[bc]||0; }); return s; }   // คนอื่นยิงไปแล้วเท่าไร (ทุกคน ไม่สน coExcl) — ใช้คิดเพดานกันยิงเกิน
function coClampQ(v){ if(!coCur) return 0; const n=Math.max(0,parseInt(v)||0); if(n>coCur.maxQ){ coCur._capped=true; return coCur.maxQ; } coCur._capped=false; return n; }   // ยิงเกินไม่ได้ (Surat v3.46) — clamp [0, maxQ]
function coDemand(){   // ของที่ต้องออก ต่อบาร์โค้ด (จากบิลที่เลือก) · need = ขาย+แถม
  const refs=coSelRefs(), m={};
  coLines().forEach(x=>{ if(!refs.has(x.ref)) return;
    const prod=DATA.prodIdx[String(x.barcode||'').trim()]||null, ePer=eaPerOf(prod, x.level, x.eaPer);
    if(!m[x.barcode]) m[x.barcode]={barcode:x.barcode, product:x.product, unit:x.unit, level:x.level, eaPer:ePer, prod, need:0, needEa:0, sold:0, free:0, bills:[]};
    const d=m[x.barcode]; d.sold+=x.sold; d.free+=x.free; d.need+=x.sold+x.free; d.needEa+=(x.sold+x.free)*ePer;
    d.bills.push({ref:x.ref, store:x.store, storeCode:x.storeCode, salesman:x.salesman, salesmanName:x.salesmanName, sold:x.sold, free:x.free, eaPer:ePer}); });
  return Object.values(m).map(d=>({...d, needEa:Math.round(d.needEa), scanned:coScannedQty(d.barcode)})).sort((a,b)=> String(a.product).localeCompare(String(b.product),'th'));
}
function coLsKey(){ return 'mp_co_'+(coSource==='prep'?'p_':'')+(coDate||'x')+'_'+(coWh||'x'); }   // prep แยก key — เช็คใบขาย/ใบเตรียม วันเดียวกันไม่ทับกัน

function coRestoreLS(){ try{ const o=JSON.parse(localStorage.getItem(coLsKey())||'null'); if(o){ coPicked=Array.isArray(o.picked)?o.picked:[]; coSel=new Set(o.sel||[]); if(o.method)coMethod=o.method; coStep=o.step||'pick'; coExcl=new Set(o.excl||[]); } else { coPicked=[]; coSel=new Set(); coStep='pick'; coExcl=new Set(); } }catch(e){ coPicked=[]; coSel=new Set(); coStep='pick'; coExcl=new Set(); } }

async function enterCoTab(){

  if(missing){ p.innerHTML='<div class="empty">⏳ กำลังโหลด'+coSrcLabel()+'…</div>';
    try{ await (coSource==='prep'?loadPrep():loadDsdc()); }
    catch(e){ p.innerHTML='<div class="empty" style="color:var(--red)">❌ โหลด'+coSrcLabel()+'ไม่ได้ — '+esc(e.message||'')+(coSource==='prep'?'<br><span class="muted" style="font-size:12px">ถ้าขึ้น unknown action = หลังบ้านยังไม่ deploy gas-v14 · หรือยังไม่เคยกด 📄 ใบเตรียมสร้างบิล ที่หน้า แบ่ง·โอน</span>':'<br><span class="muted" style="font-size:12px">แชร์ไฟล์ '+CONFIG.bkbvId+' เป็น Viewer แล้วเข้าใหม่</span>')+'</div>'
      +'<div style="text-align:center;margin-top:8px"><button class="scan-btn gray" onclick="coSetSource(\''+(coSource==='prep'?'dsdc':'prep')+'\')">สลับไปเช็คจาก'+(coSource==='prep'?'ใบขาย':'ใบเตรียมบิล')+'</button></div>'; return; } }
  const whs=[...new Set(coSrcArr().map(x=>x.wh))].filter(Boolean).sort();
  if(!coWh || !whs.includes(coWh)) coWh=(WH_LOCK && whs.includes(WH_LOCK)) ? WH_LOCK : (whs.includes('W4')?'W4':(whs[0]||''));   // default = คลังตัวเอง

  const p=document.getElementById('panel-co'); if(!p) return;
  if(coStep==='scan') coTeam=coTeamCalc();   // 👥 สะท้อน local ทันที (ไม่ต้องรอ poll)

  if(coStep==='scan'){ coSyncStart(); }   // v3.47: Picker ไม่มีช่องยิงแล้ว (ยิงที่ Order Scanner) — เหลือ poll สรุปทีม
  else {
    p.querySelectorAll('input[data-ind]').forEach(el=>{ el.indeterminate = (el.dataset.ind==='1'); });   // เซลที่เลือกบางบิล → ติ๊กครึ่ง

  else if(coMethod==='sm'){   // รายเซล — collapse ต่อเซล · ข้างในติ๊กบิลออกรายตัวได้ (Surat)

/* สรุป "ยังไม่ได้สแกน — ร้านไหน" (เกลี่ยของที่ยิงแล้วให้บิลตามลำดับ · ที่เหลือ = ยังไม่ได้)

/* ⭐ v4.25 — แบ่ง "ของที่เช็คได้จริง" ให้แต่ละบิล ด้วยกติกาโควต้าเดียวกับขั้นแบ่ง CS (allocQuota)
   เดิม: ไล่ให้ทีละบิลตามลำดับในใบเตรียม → บิลบน ๆ ได้เต็ม บิลท้าย ๆ ได้ 0 (Surat: "แบ่งสต๊อกไปไม่ตรง")
   ใหม่: สั่งรวม 50 ลัง เช็คได้ 40 ลัง → 40 ลังนี้แบ่งตามประวัติซื้อ BQ · ปลีก/ROO ที่เคยซื้อได้ก่อน
   ⛔ ของที่ "ไม่มีใครยิงเช็คเลย" → ทุกบิลได้ 0 (ไม่เอามาจัด/เปิดบิลทุกกรณี) */
function coSkOf(d){
  const p=d.prod||DATA.prodIdx[String(d.barcode||'').trim()]||null;
  return { codes:(p?[p.codeCS,p.codeBP,p.codePA,p.codeEA]:[d.barcode]).filter(Boolean).map(String), name:(p&&p.name)||d.product||'' };
}
function coAllocGive(d, useTeam){
  const n=(d.bills||[]).length, give=new Array(n).fill(0);
  const per=Math.max(1, d.eaPer||1);
  const checkedEa = useTeam ? (coTeamQty(d.barcode)||0) : Math.round((d.scanned||0)*per);
  if(!(checkedEa>0)) return give;                                   // ⛔ ไม่มีการเช็ค = ไม่ได้เลย
  const units=Math.floor((Math.min(checkedEa, d.needEa)+0.001)/per);
  if(units<=0) return give;                                         // เช็คมาไม่ถึง 1 หน่วยบิล → ออกบิลไม่ได้
  const sk=coSkOf(d);
  const custs=(d.bills||[]).map((b,i)=>({ code:'#'+i, i, orderedCS:(b.sold||0)+(b.free||0),
    histCS:allocHistFor(String(b.storeCode||'').trim(), sk), chan:allocChanOf(b.salesman) }));
  const q=allocQuota(custs, units);
  custs.forEach(c=>{ give[c.i]=Math.max(0, Math.min(q[c.code]||0, c.orderedCS)); });
  return give;
}
function coShortRows(useTeam){
  const out=[];
  coDemand().forEach(d=>{ const give=coAllocGive(d,useTeam);
    (d.bills||[]).forEach((b,i)=>{ const per=b.eaPer||d.eaPer||1, need=b.sold+b.free, got=give[i]||0, miss=need-got;
      if(miss>0.001) out.push({store:b.store, storeCode:b.storeCode, salesman:b.salesman, salesmanName:b.salesmanName, ref:b.ref, barcode:d.barcode, product:d.product, unit:d.unit, sold:b.sold, free:b.free, need,
        got, miss, missTxt:fmtEaUnits(miss*per,d.prod,d.level,d.eaPer)}); }); });
  return out.sort((a,b)=> String(a.salesman).localeCompare(b.salesman) || String(a.store).localeCompare(b.store,'th') || String(a.product).localeCompare(b.product,'th'));
}

/* เฉลี่ยรายร้าน — ร้านคีย์ก่อนได้ก่อน (fallback เมื่อ BQ ล้มเท่านั้น — กติกาหลักคือโควต้า scanQuotaAlloc) */
function allocByKey(stores, received){
  const sorted=[...(stores||[])].sort((a,b)=> (a.keyTS||0)-(b.keyTS||0) || String(a.store).localeCompare(String(b.store)));
  let left=Math.max(0,Math.round(received||0));
  return sorted.map(s=>{ const give=Math.min(s.ea,left); left-=give; return {salesman:s.salesman,salesmanName:s.salesmanName,store:s.store,ea:s.ea,give}; });
}
/* ประวัติ BQ ของตัวที่ยิง — เช็ค cache ก่อน (แชร์กับแท็บแบ่งออเดอร์+แอปขาย) ขาดค่อยยิง custHistoryBatch เฉพาะร้านที่ขาด */
async function scanEnsureHist(c){
  const map=_custHistMapLoad();
  const ccs=[...new Set((c.stores||[]).map(s=>String(s.storeKey||'').trim()).filter(Boolean))];
  const miss=ccs.filter(cc=>map[cc]===undefined);
  if(!miss.length){ c.histReady=true; return; }
  if(!CONFIG.bqUrl){ c.histErr=true; return; }
  try{
    const rows=await bqCall('custHistoryBatch',{ccs:miss.join(','), months:6});
    const grp={}; (rows||[]).forEach(r=>{ const k=String(r.customer_code||'').trim(); if(!k) return; (grp[k]=grp[k]||[]).push(r); });
    miss.forEach(cc=>{ map[cc]=grp[cc]||[]; });   // ร้านไม่มีประวัติ → [] (กัน refetch)
    _custHistMapSave();
    c.histReady=true;
  }catch(e){ c.histErr=true; }
  if(scanCur===c){ const a=document.getElementById('scanAlloc'); if(a) a.innerHTML=allocTableHtml(c); }
}
/* แบ่งของที่จัดจริงตามโควต้า — กติกาเดียวกับแท็บแบ่งออเดอร์เป๊ะ: ปลีกเต็มก่อน → ที่เหลือส่งตาม contribution · ไม่เคยซื้อ=0 · cap ที่สั่ง + วน redistribute (allocByChannel/allocProp ตัวเดียวกัน หน่วย EA) */
function scanNonCsEA(ea, eaPerCS){ return (eaPerCS>1) ? (Math.max(0,Math.round(ea)) % eaPerCS) : 0; }   // เศษ non-CS ต่อร้าน (ea mod ลัง) · EA-only/ลังเต็มพอดี = 0 (เป็นของ CS track ที่ W4)
function scanQuotaAlloc(c){
  const per=c.eaPerCS||0;
  const qty=Math.max(0,Math.round(parseInt(c.qty)||0));   // เศษที่ C4 หยิบได้จริง
  const custs=(c.stores||[]).map(s=>{ const nc=scanNonCsEA(s.ea, per); return {code:String(s.storeKey||s.store), orderedCS:nc, histCS:allocHistFor(String(s.storeKey||'').trim(), c.histKey||{}), chan:(s.role===3?'ปลีก':'ส่ง'), _s:s, _nc:nc}; }).filter(x=>x._nc>0);   // เฉพาะร้านที่มีเศษ non-CS
  let res={};
  const totalOrd=custs.reduce((a,x)=>a+x._nc,0);
  if(qty>=totalOrd){ custs.forEach(x=>{res[x.code]=x._nc;}); }
  else res=allocByChannel(custs, qty);   // ไม่พอ → ปลีกเต็มก่อน → ส่งตาม contribution (โควต้าเดียวกับ CS)
  return custs.map(x=>({salesman:x._s.salesman,salesmanName:x._s.salesmanName,store:x._s.store,ea:x._nc,role:x._s.role,chan:x.chan,hist:x.histCS,give:Math.min(x._nc,Math.round(res[x.code]||0))}))
    .sort((a,b)=> ((a.chan==='ปลีก')?0:1)-((b.chan==='ปลีก')?0:1) || b.hist-a.hist || b.ea-a.ea);
}
function allocTableHtml(c){
  if(!c.stores || !c.stores.length) return '';
  const qty=parseInt(c.qty);
  const hd=sub=>`<div class="dist"><div class="dist-h">📍 แบ่งเศษ non-CS ให้ร้านไหน <span class="muted" style="font-weight:400">${sub}</span></div>`;
  if((c.nonCsTotal||0)<=0) return hd('')+`<div style="font-size:12px;color:#b45309;padding:2px 0 8px">ไม่มีเศษ non-CS — สินค้านี้เป็นลังเต็ม/EA-only (จัดจาก W4 ไม่ต้องยิงที่ C4)</div></div>`;
  if(!(qty>0)) return hd('')+`<div class="muted" style="font-size:12px;padding:2px 0 8px">ใส่ "จำนวนเศษที่หยิบได้" ก่อน → แบ่งตามโควต้า: ปลีกเต็มก่อน → ส่งตาม contribution ${allocMonths} ด. (BQ) · ไม่เคยซื้อ=0</div></div>`;
  if(c.histErr){   // BQ ล้ม → fallback คีย์ก่อนได้ก่อน (บอกชัดว่าไม่ใช่โควต้า)
    const alloc=allocByKey(c.stores, qty);
    const rows=alloc.map(s=>`<tr class="${s.give===0?'cut-row':''}"><td>${esc(s.salesman||'')} ${esc(s.store)}</td><td class="num">${esc(fmtFromEA(s.ea,c.eaPerCS,c.eaPerPA))}</td><td class="num">${s.give? '<b>'+esc(fmtFromEA(s.give,c.eaPerCS,c.eaPerPA))+'</b>' : '<span class="alloc-cut">✂ ตัด</span>'}</td></tr>`).join('');
    return hd('(⚠️ ดึงประวัติ BQ ไม่ได้ — ใช้ "คีย์ก่อนได้ก่อน" แทน)')+`<div class="tbl-wrap" style="max-height:240px"><table class="alloc-tbl"><thead><tr><th>เซล · ร้าน</th><th class="num">สั่ง</th><th class="num">จัดให้</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
  }
  if(!c.histReady) return hd('')+`<div class="muted" style="font-size:12px;padding:2px 0 8px">⏳ กำลังดึงประวัติซื้อ (BQ)…</div></div>`;
  const alloc=scanQuotaAlloc(c);
  const given=alloc.reduce((a,s)=>a+s.give,0), leftover=Math.max(0,qty-given);
  const rows=alloc.map(s=>`<tr class="${s.give===0?'cut-row':''}"><td>${esc(s.salesman||'')} ${esc(s.store)} <span class="muted" style="font-size:10.5px">· ${esc(s.chan)}</span></td><td class="num">${s.hist>0?allocFmtCS(s.hist):'<span class="muted" style="font-size:10.5px">ไม่เคยซื้อ</span>'}</td><td class="num">${esc(fmtFromEA(s.ea,c.eaPerCS,c.eaPerPA))}</td><td class="num">${s.give? '<b>'+esc(fmtFromEA(s.give,c.eaPerCS,c.eaPerPA))+'</b>' : '<span class="alloc-cut">✂ ตัด</span>'}</td></tr>`).join('');
  return hd(`(โควต้า: ปลีกเต็มก่อน → ส่งตาม contribution ${allocMonths} ด. · ไม่เคยซื้อ=0)`)+
    (leftover>0?`<div style="font-size:11.5px;color:#b45309;padding:2px 0">⚠️ เหลือ ${leftover} ชิ้น แบ่งไม่ออก (ร้านที่เหลือไม่มีประวัติ/รับเต็มแล้ว) — ลดจำนวน หรือไปเกลี่ยมือใน bplus</div>`:'')+
    `<div class="tbl-wrap" style="max-height:240px"><table class="alloc-tbl"><thead><tr><th>เซล · ร้าน</th><th class="num">ประวัติ(ลัง)</th><th class="num">เศษสั่ง</th><th class="num">จัดให้</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
}

function scanClamp(v){ let n=parseInt(v); if(!isFinite(n)||n<0) n=0; const max=(scanCur&&scanCur.nonCsTotal)||0; if(max&&n>max){ n=max; if(scanCur) scanCur._capped=true; } else if(scanCur) scanCur._capped=false; return n; }   // เพดาน = เศษ non-CS รวม
function scanQtyInput(el){ if(!scanCur) return; scanCur.qty=scanClamp(el.value); if(scanCur._capped) el.value=scanCur.qty; const w=document.getElementById('scanCapWarn'); if(w) w.style.display=scanCur._capped?'block':'none'; const a=document.getElementById('scanAlloc'); if(a) a.innerHTML=allocTableHtml(scanCur); }
function scanRecvStep(d){ if(!scanCur) return; scanCur.qty=scanClamp((parseInt(scanCur.qty)||0)+d); renderScanResult(); }
function scanRecvSet(v){ if(!scanCur) return; scanCur.qty=scanClamp(v); renderScanResult(); }

/* เช็คครบ — สั่ง (scanMeta) vs ยิง (scanPicked รวมต่อสินค้า) */
function scanReconcileHtml(){
  const meta=(MODEL&&MODEL.scanMeta)||{};
  const ncDem={}; Object.keys(meta).forEach(pk=>{ const per=meta[pk].eaPerCS; ncDem[pk]=Object.values(meta[pk].stores||{}).filter(s=>s.wh==='W4').reduce((a,s)=>a+scanNonCsEA(s.ea,per),0); });   // C4 ยิงเศษ "เฉพาะ W4" (คลังอื่นจัดเอง ไม่ยิงที่ C4)
  const keys=Object.keys(ncDem).filter(pk=>ncDem[pk]>0);   // เฉพาะสินค้าที่มีเศษ non-CS ของ W4 (ต้องยิงจาก C4) · ลังเต็ม/EA-only/คลังอื่น ไม่นับ
  if(!keys.length) return '';
  const scanned={};
  for(const p of scanPicked){ const prod=DATA.prodIdx[p.barcode]; const pk=prod?(prod.codeCS||prod.name):p.barcode; scanned[pk]=(scanned[pk]||0)+(parseInt(p.qty)||0); }
  const remain=keys.filter(pk=>(scanned[pk]||0) < ncDem[pk])
    .map(pk=>({name:meta[pk].name,ordered:ncDem[pk],scanned:scanned[pk]||0,eaPerCS:meta[pk].eaPerCS,eaPerPA:meta[pk].eaPerPA}))
    .sort((a,b)=>(b.ordered-b.scanned)-(a.ordered-a.scanned));
  const done=keys.length-remain.length;
  const head=`<div class="recon ${remain.length?'':'ok'}">
    <span><b>ยิงเศษครบ ${done}/${keys.length} สินค้า</b>${remain.length?` · เหลือ <b style="color:var(--red)">${remain.length}</b> ยังไม่ครบ`:' ✅ ยิงเศษครบทุกตัวแล้ว'}</span>
    ${remain.length?`<button class="ico-btn" onclick="toggleScanRemain()">${scanShowRemain?'ซ่อน':'ดูที่ยังไม่ครบ'}</button>`:''}</div>`;
  if(!(scanShowRemain && remain.length)) return head;
  const rows=remain.slice(0,300).map(r=>`<tr><td>${esc(r.name)}</td><td class="num">${esc(fmtFromEA(r.ordered,r.eaPerCS,r.eaPerPA))}</td><td class="num">${r.scanned?esc(fmtFromEA(r.scanned,r.eaPerCS,r.eaPerPA)):'<span class="muted">-</span>'}</td><td class="num"><b style="color:var(--red)">${esc(fmtFromEA(r.ordered-r.scanned,r.eaPerCS,r.eaPerPA))}</b></td></tr>`).join('');
  return head+`<div class="tbl-wrap" style="max-height:240px;margin-bottom:10px"><table class="alloc-tbl"><thead><tr><th>สินค้า</th><th class="num">เศษสั่ง</th><th class="num">ยิงแล้ว</th><th class="num">เหลือ</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
function toggleScanRemain(){ scanShowRemain=!scanShowRemain; renderScanList(); }
function toggleScanJob(){
  if(!scanClosed){ if(!confirm('ปิดงาน? เช็คเสร็จแล้ว — ยิงเพิ่มไม่ได้จนกว่าจะกดเปิดงานต่อ')) return; scanClosed=true; if(scanCamOn) stopScanCam(); toast('🔒 ปิดงานแล้ว — ยิงเพิ่มไม่ได้'); }

async function saveScan(silent){
  if(!CONFIG.gasUrl){ if(!silent) toast('ยังไม่ได้ตั้ง gasUrl'); return; }
  if(!scanPicked.length){ if(!silent) toast('ไม่มีรายการ'); return; }
  if(!silent) loading(true,'กำลังบันทึกลงชีท…');
  try{
    const rows=[];
    scanPicked.forEach(p=>{
      if(p.alloc && p.alloc.length) p.alloc.forEach(a=> rows.push([p.barcode,p.name,a.salesman||'',a.store||'',fmtFromEA(a.give,p.eaPerCS,p.eaPerPA),p.ts||'']));
      else rows.push([p.barcode,p.name,'','',fmtFromEA(p.qty,p.eaPerCS,p.eaPerPA),p.ts||'']);
    });
    const transferRows=scanPicked.filter(p=>p.transfer).map(p=>[p.barcode,p.name,fmtFromEA(p.qty,p.eaPerCS,p.eaPerPA),p.ts||'']);
    const payload={action:'saveCheck', tab:'เช็คสินค้าออก', header:['Barcode','ชื่อ','เซล','ร้าน','จำนวน','วันเวลาที่ยิง'], rows,
      transferTab:'โอนย้าย', transferHeader:['Barcode','ชื่อ','จำนวน','วันเวลาที่ยิง'], transferRows};
    const res=await fetch(CONFIG.gasUrl,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});
    const txt=(await res.text()).trim(); let j={}; try{ j=JSON.parse(txt); }catch(e){}
    if(j.ok){ scanDirty=false; saveScanLS(); renderScanList(); if(!silent) toast(`✅ บันทึก ${j.saved} แถว`+(j.transfer?` · โอนย้าย ${j.transfer}`:'')); }
    else throw new Error(j.error||txt||'บันทึกไม่สำเร็จ');
  }catch(e){ console.error(e); if(!silent) toast('❌ '+(e.message||'บันทึกไม่สำเร็จ')); else { scanDirty=true; renderScanList(); } }
  finally{ if(!silent) loading(false); }
}

/* ================= 🧾 ใบขาย — รวม CS (จากสต็อก W4) + non-CS (จากยิงจริง C4) ต่อร้าน → bplus ================= */
function _billHistKey(it){ return {codes:[it.codeCS,it.codeBP,it.codePA,it.codeEA].filter(Boolean), name:it.name}; }
function buildSalesBill(){
  const lines=(MODEL&&MODEL.calcLines)||[];
  if(!lines.length) return {items:[], pend:0};
  const agg={};
  for(const l of lines){
    const cc=String(l.storeKey||'').trim(); if(!cc||!l.eaTotal) continue;
    const k=l.wh+'|'+cc+'|'+l.productKey;
    if(!agg[k]) agg[k]={wh:l.wh, code:cc, store:l.store, salesman:l.salesman, salesmanName:l.name, role:l.role, chan:(l.role===3?'ปลีก':'ส่ง'),
      productKey:l.productKey, name:cleanName(l.productShort||l.productName), codeCS:l.codeCS||'', codeBP:l.codeBP||'', codePA:l.codePA||'', codeEA:l.codeEA||l.barcode,
      eaPerCS:l.eaPerCS||1, eaPerBP:l.eaPerBP||0, eaPerPA:l.eaPerPA||0, price:l.price||0, ea:0};
    agg[k].ea += l.eaTotal;
  }
  const items=Object.values(agg);
  const isW4=it=>it.wh==='W4';
  // ---------- CS (ลังเต็ม) ----------
  // W4 → quota จากสต็อก "ไฟล์ W4" (1VWu4rit เท่านั้น · ตัดถ้าไม่พอ) · คลังอื่น → ให้เต็ม (คลังนั้นจัดเอง ไม่ตัด ไม่ผ่าน C4)
  const csGrp={}; items.filter(isW4).forEach(it=>{ (csGrp[it.productKey]=csGrp[it.productKey]||[]).push(it); });
  for(const gk in csGrp){
    const grp=csGrp[gk], per=grp[0].eaPerCS, eaOnly=!(per>1);
    const stockRaw=W4_MASTER?allocStockRawFor(null,'W4',grp[0].codeCS||grp[0].codeEA):'';   // ต้องมาจากไฟล์ W4 เท่านั้น (renderSalesBill/exportSalesBill โหลดก่อนแล้ว)
    const parsed=parseStockCsEa(stockRaw, per>1?per:1);
    const availU=eaOnly?parsed.totalEa:Math.floor(parsed.totalEa/per);
    const custs=grp.map(it=>({code:it.code, orderedCS:eaOnly?it.ea:Math.floor(it.ea/per), histCS:allocHistFor(it.code,_billHistKey(it)), chan:it.chan, _it:it}));
    const demandU=custs.reduce((a,c)=>a+c.orderedCS,0);
    let res={}; if(availU>=demandU) custs.forEach(c=>res[c.code]=c.orderedCS); else res=allocByChannel(custs,availU);
    custs.forEach(c=>{ const g=Math.min(c.orderedCS,Math.round(res[c.code]||0)); c._it.csU=g; c._it.csDemU=c.orderedCS; c._it.csGiveEA=eaOnly?g:g*per; c._it.eaOnly=eaOnly; c._it.availU=availU; });
  }
  items.filter(it=>!isW4(it)).forEach(it=>{                    // คลังอื่น: CS เต็ม (โชว์ลังเต็ม ไม่ตัด)
    const per=it.eaPerCS, eaOnly=!(per>1);
    it.eaOnly=eaOnly; it.availU=null;
    it.csU=eaOnly?it.ea:Math.floor(it.ea/per); it.csDemU=it.csU;
    it.csGiveEA=eaOnly?it.csU:it.csU*per;
  });
  // ---------- non-CS (เศษ) ----------
  // W4 → quota pool "C4" จากยิงจริง (scanPicked) · คลังอื่น → เศษให้เต็ม (ไม่ต้องยิงที่ C4 · โชว์ BP/PA/EA)
  const scanned={}; for(const p of scanPicked){ const pr=DATA.prodIdx[p.barcode]; const pk=pr?(pr.codeCS||pr.name):p.barcode; scanned[pk]=(scanned[pk]||0)+(parseInt(p.qty)||0); }
  const ncGrp={}; items.filter(isW4).forEach(it=>{ (ncGrp[it.productKey]=ncGrp[it.productKey]||[]).push(it); });
  let pend=0;
  for(const pk in ncGrp){
    const grp=ncGrp[pk], per=grp[0].eaPerCS;
    grp.forEach(it=>{ it.ncGive=0; it.ncDem=0; it.ncPending=false; });
    const custs=grp.map(it=>({code:it.code, orderedCS:scanNonCsEA(it.ea,per), histCS:allocHistFor(it.code,_billHistKey(it)), chan:it.chan, _it:it})).filter(c=>c.orderedCS>0);

    let res={}; if(actual>=demand) custs.forEach(c=>res[c.code]=c.orderedCS); else res=allocByChannel(custs,actual);

}

/* หน่วยของบรรทัดสำหรับ "โอน Non CS": level CS = ลัง (รวม "1 ต่อ CS" น้ำตาล/ข้าว = ลังใหญ่) → 'CS' · เหลือ PA/BP/EA */

function tfLines(){
  return (DATA.bkbv||[]).filter(x=>{
    if(tfWh && tfWh!=='all' && x.wh!==tfWh) return false;
    if(tfDate && x.date!==tfDate) return false;
    if(!exportChanOK(x.salesman)) return false;   // v4.26: ช่องทางที่ติ๊ก (ชุดเดียวกันทั้งแอป)
    if(tfSalesman.has(x.salesman)) return false;   // tfSalesman = เซลที่ "เอาออก" (default = เลือกทุกเซล · ติ๊กออกเพื่อไม่เอา)
    if(!tfKeep(x)) return false;   // Non CS ทั้งหมด + CS ที่ "W4 ไม่มีสต็อก แต่ C4 มี" (เอามาโอนจาก C4) · CS ที่ W4 มี = ตัด (มาจาก W4)

function tfDemand(){   // รวมต่อบาร์โค้ด (คลัง/วัน ที่กรอง) → {barcode,product,unit,eaPer,wh,qty,stores[],scanned}

  tfEnsureHist(tfCur);   // ดึงประวัติซื้อ BQ ของร้านที่สั่งตัวนี้ (cache ร่วมแบ่งออเดอร์/เช็คสินค้า)

/* ดึงประวัติ BQ ของร้านที่สั่งตัวที่ยิง — เช็ค cache ก่อน (ร่วมแบ่งออเดอร์/เช็คสินค้า) ขาดค่อยยิง custHistoryBatch เฉพาะร้านที่ขาด */
async function tfEnsureHist(c){
  const map=_custHistMapLoad();
  const ccs=[...new Set((c.stores||[]).map(s=>String(s.storeCode||'').trim()).filter(Boolean))];
  const miss=ccs.filter(cc=>map[cc]===undefined);
  if(!miss.length){ c.histReady=true; }

  else { try{
      const rows=await bqCall('custHistoryBatch',{ccs:miss.join(','), months:6});
      const grp={}; (rows||[]).forEach(r=>{ const k=String(r.customer_code||'').trim(); if(!k) return; (grp[k]=grp[k]||[]).push(r); });
      miss.forEach(cc=>{ map[cc]=grp[cc]||[]; }); _custHistMapSave(); c.histReady=true;
    }catch(e){ c.histErr=true; } }
  if(tfCur===c){ const a=document.getElementById('tfAllocBox'); if(a) a.innerHTML=tfAllocHtml(c); }
}
function tfClamp(v){ let n=parseInt(v); const already=(tfCur&&tfCur.already)||0; if(!isFinite(n)||n<already) n=already; const max=(tfCur&&tfCur.demandQty)||0; if(max&&n>max){ n=max; if(tfCur) tfCur._capped=true; } else if(tfCur) tfCur._capped=false; return n; }   // total ต้อง ≥ ที่ยิงไปแล้ว (เพิ่มเท่านั้น) และ ≤ ต้องโอน
function tfAlloc(c){   // โควต้า BQ (เหมือนแบ่งออเดอร์): ปลีกเต็มก่อน → ส่งตามประวัติซื้อ · ไม่เคยซื้อ=0 · cap ที่สั่ง · BQ ไม่พร้อม/ล้ม → fallback บิลใหญ่ก่อน
  const qty=tfClamp(c.qty), stores=c.stores||[];
  if(!c.histReady || c.histErr){
    const sorted=[...stores].sort((a,b)=> b.qty-a.qty || (a.seq-b.seq)); let left=qty;
    return sorted.map(s=>{ const give=Math.min(s.qty,left); left-=give; return {store:s.store, storeCode:s.storeCode, salesman:s.salesman, salesmanName:s.salesmanName, need:s.qty, give, hist:null, chan:''}; });
  }
  const custs=stores.map(s=>{ const role=(DATA.usersByCode[s.salesman]||{}).role||0; return {code:String(s.storeCode||s.store), orderedCS:s.qty, histCS:allocHistFor(String(s.storeCode||'').trim(), c.histKey||{}), chan:(role===3?'ปลีก':'ส่ง'), _s:s}; });
  let res={}; const totalD=custs.reduce((a,x)=>a+x.orderedCS,0);
  if(qty>=totalD) custs.forEach(x=>res[x.code]=x.orderedCS); else res=allocByChannel(custs, qty);
  return custs.map(x=>({store:x._s.store, storeCode:x._s.storeCode, salesman:x._s.salesman, salesmanName:x._s.salesmanName, need:x.orderedCS, give:Math.min(x.orderedCS, Math.round(res[x.code]||0)), hist:x.histCS, chan:x.chan}))
    .sort((a,b)=> ((a.chan==='ปลีก')?0:1)-((b.chan==='ปลีก')?0:1) || b.hist-a.hist || b.need-a.need);
}
function smShort(code, nm){   // ชื่อเซลสั้น (ชื่อต้น) → รู้ว่าไปกับคันไหน · ยึด Users ก่อน ไม่มีค่อย fallback ชื่อจาก ERP

  n=n.replace(/^(คุณ|นางสาว|นาย|นาง|น\.ส\.)\s*/,'');           // ตัดคำนำหน้า

function tfScanPendingByDate(){
  const out=[];
  try{ for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(!k||k.indexOf('mp_tf_')!==0) continue;
    const date=k.slice(6); let o=null; try{ o=JSON.parse(localStorage.getItem(k)||'null'); }catch(e){}
    const arr=(o&&Array.isArray(o.picked))?o.picked:[]; const nItems=arr.filter(p=>(parseInt(p.qty)||0)>0).length;
    if(nItems>0) out.push({date, nItems}); } }catch(e){}
  return out.sort((a,b)=> a.date<b.date?1:-1);   // ใหม่→เก่า
}
function tfClearDate(d){   // ล้างของค้าง 1 วัน (localStorage) — คลิกเดียว ไม่มี confirm (กัน Chrome "ห้ามสร้าง dialog เพิ่ม" → กดล้างไม่ได้)

async function tfSave(silent){
  if(!CONFIG.gasUrl){ if(!silent) toast('ยังไม่ได้ตั้ง gasUrl'); return; }
  if(!silent) loading(true,'กำลังบันทึกลงชีท…');
  try{
    const by=(currentUser&&currentUser.name)||'', dev=tfDevId();
    const rows=tfPicked.map(p=>{ const short=Math.max(0,(p.demandQty||0)-(parseInt(p.qty)||0));
      const who=(p.alloc||[]).map(a=>`${a.store||a.storeCode}:${a.give}`).join(' · ');
      const ts=String(p.ts||nowStamp()), tsP=ts.split(' '), tDate=tsP[0]||'', tTime=tsP[1]||'';   // ชื่อผู้โอน + วันที่ + เวลา · +จัดให้(json) กู้ alloc ตอน merge · +เครื่อง (device-scoped)
      return [tfDate||'', p.wh||tfWh||'', p.barcode, p.product, p.unit, String(p.demandQty||''), String(p.qty||''), String(short), who, JSON.stringify(p.alloc||[]), by, tDate, tTime, dev]; });
    const res=await fetch(CONFIG.gasUrl,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'saveTransfer',tab:'ยิงโอนย้าย',header:TF_SYNC_HEADER,rows,date:tfDate||'',wh:tfWh||'',device:dev})});   // gas-v10: merge เฉพาะแถวของเครื่องเรา (date/wh/device) ทับ · เครื่องอื่นคงอยู่
    const txt=(await res.text()).trim(); let j={}; try{ j=JSON.parse(txt); }catch(e){}
    if(j.ok){ tfDirty=false; tfSaveLS(); tfRenderList(); tfSyncPull(); if(!silent) toast(`✅ บันทึก ${j.saved} รายการ ลงชีท "ยิงโอนย้าย"`); }
    else throw new Error(j.error||txt||'บันทึกไม่สำเร็จ');
  }catch(e){ if(!silent){ console.error(e); toast('❌ '+(e.message||'บันทึกไม่สำเร็จ')); } else { tfDirty=true; } }   // silent (auto-save) ก่อน deploy gas-v7 → เงียบ ไม่ spam console
  finally{ if(!silent) loading(false); }
}
/* ===== sync ข้ามเครื่อง — poll ชีท "ยิงโอนย้าย" (readTransfer) → ยิงจากเครื่องไหนก็เห็นทุกเครื่อง (แท็บโอน Non-CS) ===== */
async function tfSyncPull(force){
  if(!CONFIG.gasUrl || !tfDate || !tfWh) return;
  if(!force){ const w=document.getElementById('tfList'); if(w && !w.offsetParent) return; }   // ไม่ได้อยู่หน้าโอน Non-CS → ไม่ pull (force=true ใช้ตอน Export DC ดึงของทุกเครื่อง)
  try{
    const res=await fetch(CONFIG.gasUrl,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'readTransfer',tab:'ยิงโอนย้าย',date:tfDate,wh:tfWh})});
    const j=JSON.parse((await res.text()).trim()||'{}'); if(!j.ok || !Array.isArray(j.rows)) return;
    const me=tfDevId(), rem={};
    j.rows.forEach(r=>{ if(String(r.device||'')===me) return;   // ข้ามเครื่องเราเอง (local ล่าสุดกว่า)
      const bc=String(r.barcode||'').trim(); if(!bc) return; const q=parseInt(r.qty)||0; if(q<=0) return;
      if(!rem[bc]) rem[bc]={qty:0, rows:[]}; rem[bc].qty+=q; rem[bc].rows.push(r); });
    tfRemote=rem; tfSyncAt=nowStamp();
    tfRenderList(); _tfSoloBarSync();   // อัปเดตตาราง + progress ตามที่เครื่องอื่นยิง
  }catch(e){}
}
function tfSyncStart(){
  if(!_tfVisBound){ _tfVisBound=true; document.addEventListener('visibilitychange',()=>{ if(!document.hidden) tfSyncPull(); }); }
  if(tfSyncTimer) return; tfSyncTimer=setInterval(tfSyncPull, 15000); tfSyncPull();   // poll ทุก 15 วิ + ตอนกลับมาโฟกัส
}
/* รวมของยิง "ทุกเครื่อง" (local + remote) ต่อ barcode → ใช้ตอน Export ใบโอนย้าย (เครื่องไหน export ก็ได้ของครบ) · local ชนะถ้ามีทั้งคู่ */
function tfMergedPicked(){
  const out=tfPicked.filter(p=>(parseInt(p.qty)||0)>0 && (p.wh===tfWh)).map(p=>({...p}));
  const have=new Set(out.map(p=>p.barcode));
  Object.keys(tfRemote).forEach(bc=>{ if(have.has(bc)) return; const r=(tfRemote[bc].rows||[])[0]; if(!r) return;
    let alloc=[]; try{ alloc=JSON.parse(r.alloc||'[]'); }catch(e){}
    out.push({barcode:bc, product:r.product||'', unit:r.unit||'', wh:tfWh, qty:tfRemote[bc].qty, demandQty:parseInt(r.demandQty)||0, alloc, ts:r.ts||'', _remote:true}); have.add(bc); });
  return out;
}
/* 📦 Export จัดสินค้า — ใบจัดของทั้งหมด (ต้องเอาไปจัด) · แยกช่อง CS/BP/PA/EA + สต็อก 2 คลัง (C4 ต้นทาง · W4 ปลายทาง) + โอนได้/ขาด · เรียงตามยี่ห้อ/แพ็ค เหมือนหน้าจอ */
function tfExportPickList(){
  const dem=tfDemand();
  if(!dem.length){ toast('ไม่มีรายการจัดสินค้า (คลัง/วัน ที่เลือกไม่มีของโอน)'); return; }
  const iso=tfDate||todayBKK();
  const sorted=[...dem].sort((a,b)=> String(a.catBrand||'~').localeCompare(String(b.catBrand||'~'),'th') || String(a.catSize||'~').localeCompare(String(b.catSize||'~'),'th') || String(a.product||'').localeCompare(String(b.product||''),'th'));
  const HEAD=['บาร์โค้ด','สินค้า','หน่วย','CS','BP','PA','EA','สต็อก C4 (ลัง.ชิ้น)','สต็อก W4 (ลัง.ชิ้น)','โอนได้','ขาด'];
  const rows=sorted.map(d=>{
    const p=DATA.prodIdx[d.barcode]||{}, raw=p.stockRaw||{};
    const cell=u=> d.tfUnit===u ? String(d.qty) : '';
    const sc=(d.scanned==null?'':String(d.scanned)), short=String(Math.max(0,d.qty-(d.scanned||0)));
    return [d.barcode, d.product, d.tfUnit, cell('CS'),cell('BP'),cell('PA'),cell('EA'), raw.C4||'0', raw.W4||'0', sc, short];
  });
  const ws=XLSX.utils.aoa_to_sheet([HEAD,...rows]);
  ws['!cols']=[{wch:16},{wch:34},{wch:6},{wch:6},{wch:6},{wch:6},{wch:6},{wch:17},{wch:17},{wch:8},{wch:7}];
  forceText(ws, rows.length, [0,7,8]);   // บาร์โค้ด + สต็อก (CS.EA) → TEXT (กัน 5.20→5.2)
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'จัดสินค้า');
  XLSX.writeFile(wb,`จัดสินค้า-${tfWh}-${iso}.xlsx`);
  toast(`✅ Export จัดสินค้า ${rows.length} รายการ`);

/* Excel เดียว 2 ชีท (Surat v3.2) — ชีท1 "ใบโอน" (bplus DM 15 คอลัมน์ · C4→W4 · ยิงจริง tfPicked · จำนวน=ยอดยิงได้ หน่วยตามบาร์โค้ด · เลขเอกสารเว้นให้กรอกใน bplus) · ชีท2 "ของที่โอนไม่ได้" (ต้องโอน − ยิงได้ · ร้าน/เซลที่ขาด → ไปทำบิล CN/ปรับ) */
function tfExportAll(){
  const iso=tfDate||todayBKK();
  const items=tfMergedPicked().filter(p=>(parseInt(p.qty)||0)>0);   // รวมของยิงทุกเครื่อง (local + remote) → ใบโอนครบ
  const demAll=tfDemand();
  const short=demAll.map(d=>({...d, sc:(d.scanned==null?0:d.scanned), short:Math.max(0,d.qty-(d.scanned||0))})).filter(d=>d.short>0);
  if(!items.length && !short.length){ toast('ยังไม่มีรายการยิงโอน / ไม่มีของที่โอนไม่ได้'); return; }
  const wb=XLSX.utils.book_new();
  // ── ชีท 1: ใบโอน (bplus DM · C4→W4) ──
  const from='C4', to='W4', docDate=toBuddhistDMY(iso);
  const TF_HEADER=['วันที่เอกสาร','เลขที่เอกสาร','รหัสสาขา','รหัสแผนก','รหัสโครงการ','ราคาที่แสดง','หมายเหตุ','รหัสซื้อขาย','จำนวน','ราคาต่อหน่วย','น้ำหนักต่อหน่วย','เลขล็อต','เลขกำกับ','ตำแหน่งเก็บ','ย้ายไปตำแหน่งเก็บ'];
  const tfRows=items.map(p=>[docDate,'','0','SP01','0','0','โอน '+from+'→'+to,p.barcode,String(p.qty),'0','','','',from,to]);
  const ws1=XLSX.utils.aoa_to_sheet([TF_HEADER,...tfRows]);
  forceText(ws1, tfRows.length, [1,7,13,14]);   // เลขเอกสาร·บาร์โค้ด·ต้นทาง·ปลายทาง → TEXT
  ws1['!cols']=TF_HEADER.map((h,i)=>({wch:i===1?16:i===6?16:i===7?15:10}));
  XLSX.utils.book_append_sheet(wb,ws1,'ใบโอน');
  // ── ชีท 2: ของที่โอนไม่ได้ ──
  const shHead=['วันที่','คลัง','บาร์โค้ด','สินค้า','หน่วย','สต็อกต้นทาง C4 (ลัง.ชิ้น)','ต้องโอน','โอนได้','ขาด','ร้าน/เซลที่ขาด (จำนวน)'];
  const shRows=short.map(d=>{
    const picked=tfPicked.find(p=>p.barcode===d.barcode && p.wh===d.wh), gave={};
    if(picked&&picked.alloc) picked.alloc.forEach(a=>{ gave[a.storeCode||a.store]=a.give; });
    const shortStores=d.stores.map(s=>({s, miss:s.qty-(gave[s.storeCode||s.store]||0)})).filter(o=>o.miss>0).sort((a,b)=>b.miss-a.miss).map(o=>`${o.s.salesman||''} ${o.s.store}(${o.miss})`).join(' · ');
    const srcC4=((DATA.prodIdx[d.barcode]||{}).stockRaw||{}).C4||'0';   // สต็อกต้นทาง C4 (raw CS.EA "ลัง.ชิ้น")
    return [iso, d.wh, d.barcode, d.product, d.unit, srcC4, String(d.qty), String(d.sc), String(d.short), shortStores];   // วันที่ = iso (tfDate/วันนี้) แทน d.date ที่ว่าง
  });
  const ws2=XLSX.utils.aoa_to_sheet([shHead,...shRows]);
  ws2['!cols']=[{wch:11},{wch:6},{wch:16},{wch:32},{wch:14},{wch:18},{wch:8},{wch:8},{wch:7},{wch:46}];
  forceText(ws2, shRows.length, [2,5]);   // บาร์โค้ด + สต็อก C4 (CS.EA) → TEXT (กัน 5.20→5.2)
  XLSX.utils.book_append_sheet(wb,ws2,'ของที่โอนไม่ได้');
  XLSX.writeFile(wb,`ใบโอน+โอนไม่ได้-${tfWh}-${iso}.xlsx`);
  toast(`✅ Excel เดียว — ใบโอน ${tfRows.length} · โอนไม่ได้ ${shRows.length} รายการ`);
}

  const whs=[...new Set((DATA.bkbv||[]).map(x=>x.wh))].filter(Boolean).sort();

      const j=JSON.parse((await res.text()).trim()||'{}');
      if(!j.ok || !Array.isArray(j.rows)) throw new Error(j.error||('อ่านชีท "'+tab+'" ไม่ได้'));

/* รายการ "ตัดออก/ไม่ได้" = ที่สั่งแต่ไม่ได้ไป (CS แบ่งไม่ครบ/ของไม่มี จาก ALLOC_MODEL · non-CS โอนไม่ได้ จากขั้น 1) → ทำบิลใหม่ทีหลัง */
function buildCutList(rows){
  const cut=[], dcByBill={}, refByBill={}, storeByBill={};
  (rows||[]).forEach(r=>{ const bk=(r.salesman||'')+'|'+String(r.code||'').trim(); if(r.dc&&!dcByBill[bk])dcByBill[bk]=r.dc; if(r.ref&&!refByBill[bk])refByBill[bk]=r.ref; if(r.store&&!storeByBill[bk])storeByBill[bk]=r.store; });
  const M=ALLOC_MODEL;
  if(M&&M.skus) M.skus.forEach(sk=>{ (sk.custs||[]).forEach(c=>{ const short=(c.orderedCS||0)-(c.allocCS||0); if(short>1e-6){ const code=String(c.code||'').trim(), bk=(c.salesman||'')+'|'+code;
    cut.push({code, store:c.store||storeByBill[bk]||'', salesman:c.salesman||'', barcode:String(sk.codeCS||sk.codeEA||''), name:sk.name, unit:'CS', ordered:Math.round(c.orderedCS), got:Math.round(c.allocCS), short:Math.round(short), src:(c.allocCS<=0?'ของไม่พอ/แบ่งไม่ได้':'แบ่งไม่ครบ'), dc:dcByBill[bk]||'', ref:refByBill[bk]||''}); } }); });
  const demAll=(typeof tfDemand==='function' && DATA.bkbv)? tfDemand() : [];
  const mergedPk=tfMergedPicked();   // รวมทุกเครื่อง — ชีท "ตัดออก" นับของที่จัดให้จากทุกเครื่อง
  demAll.forEach(d=>{ const sc=(d.scanned==null?0:d.scanned); if((d.qty-sc)<=1e-6) return;
    const picked=mergedPk.find(p=>p.barcode===d.barcode && (p.wh===d.wh||p.wh===tfWh)), gave={};
    if(picked&&picked.alloc) picked.alloc.forEach(a=>{ gave[a.storeCode||a.store]=a.give; });
    (d.stores||[]).forEach(s=>{ const got=gave[s.storeCode||s.store]||0, miss=s.qty-got; if(miss>1e-6){ const code=String(s.storeCode||'').trim(), bk=(s.salesman||'')+'|'+code;
      cut.push({code, store:s.store||'', salesman:s.salesman||'', barcode:String(d.barcode), name:d.product, unit:d.tfUnit||d.unit||'', ordered:s.qty, got, short:miss, src:'โอนไม่ได้', dc:dcByBill[bk]||'', ref:refByBill[bk]||''}); } });
  });
  cut.sort((a,b)=> String(a.salesman).localeCompare(b.salesman) || String(a.code).localeCompare(b.code) || String(a.name).localeCompare(b.name,'th'));
  return exportAllChans() ? cut : cut.filter(c=>exportChanOK(c.salesman));   // ชีท "ตัดออก" ตามชุดที่ export (ช่องทางที่ติ๊ก)
}
/* 📄 ใบเตรียมเพื่อสร้างบิล (v3.42 Surat) — รวม แบ่งCS + โอน NonCS ต่อบิล DC เป็นไฟล์เดียว (ไว้จัดของ) + บันทึกชีท "ใบเตรียมบิล" (gas-v14)
 * → เช็คเกอร์เปิดแท็บ เช็คออก → 📄 ใบเตรียมบิล ยิงเช็คทั้งหมดก่อน แล้วค่อย import ฟอร์ม DC เข้า bplus */

function buildPrepRows(){
  /* v4.25: ใบเตรียม "ตามช่องทางที่ติ๊ก" แล้ว (Surat ขอเลือกได้) — เดิมบังคับรวมทุกประเภทเสมอ
     ⚠️ savePrep เป็น replace ต่อ (วัน+คลัง) → ติ๊กไม่ครบแล้วกด = ทับชุดเดิมของช่องทางอื่น · prepExportExcel เตือนก่อนเสมอ */
  const bse=buildShareExport(), cut=buildCutList(bse.rows);
  const {rows,warns}=bse;
  if(ALLOC_MODEL && ALLOC_MODEL.day && tfDate && ALLOC_MODEL.day!==tfDate) warns.push('แบ่ง CS เป็นของวัน '+ALLOC_MODEL.day+' แต่วันที่เลือก '+tfDate+' — เข้าขั้น "แบ่ง CS" ใหม่ก่อน (ข้อมูลคนละวัน)');
  const d=tfDate||todayBKK(), wh=(ALLOC_MODEL&&ALLOC_MODEL.wh)||tfWh||'', by=(currentUser&&currentUser.name)||'', ts=nowStamp();
  const out=rows.map(r=>[d, wh, r.dc||'', r.ref||'', String(r.code||''), r.store||'', r.salesman||'', smShort(r.salesman,(DATA.usersByCode[r.salesman]||{}).name||''), String(r.barcode||''), r.name||'', r.unit||'', String(r.qty||0), String(r.free||0), String((r.qty||0)+(r.free||0)), (r.src==='CS'?'แบ่งCS':'โอนNonCS'), by, ts]);
  return {out, rows, warns, cut, d, wh};
}

  const aggRows=Object.values(agg).sort((a,b)=>String(a.name).localeCompare(String(b.name),'th')).map(a=>[a.barcode,a.name,a.unit,String(a.q),String(a.f),String(a.q+a.f),String(a.bills.size)]);

  ws2['!cols']=[{wch:16},{wch:34},{wch:13},{wch:7},{wch:7},{wch:7},{wch:7}]; forceText(ws2,aggRows.length,[0]);

     ฝั่ง "โอน Non-CS" คือของที่ยิงสแกนจริงตอนขั้นโอน (tfPicked · มีแต่ของที่ยิงเข้าไปเอง)
     มันไม่ได้ถูกบันทึกในชีทยิงเช็ค → v4.28 เลยตัดทิ้งหมดทั้งที่เช็คมาครบ (C-Vitt 3 ตัว 2026-08-17) */
  const dropped=[], rows=built.rows.filter(r=>{

  const _nb=new Set(rows.map(r=>r.dc||(r.salesman+'|'+r.code))).size;
  if(!confirmSafe('🧾 ฟอร์ม DC — '+_nb+' บิล · '+rows.length+' บรรทัด ('+(tfWh||'-')+' · '+(tfDate||'-')+')\n\nทุกบรรทัดผ่าน 2 ด่านแล้ว:\n  ✓ แบ่ง CS: ยิงเช็คแล้ว '+chk.rows+' แถว (แท็บ ยิงเช็คใบเตรียม/ยิงเช็คออก) + ผ่านการแบ่งโควต้า\n  ✓ โอน Non-CS: ยิงโอนแล้ว '+(chk.tfRows||0)+' แถว (แท็บ ยิงโอนย้าย)'+dropMsg+'\n\nสร้างไฟล์เลยไหม?')) return;   // v3.49 Surat: ฟอร์ม DC เหลือทางหลักทางเดียว — ตามแผนเป็นทางสำรอง
  const runDate=todayBKK(), docDate=toBuddhistDMY(runDate);
  // ฟอร์ม import DC (bplus 20 คอลัมน์) — เลขที่เอกสาร/ใบกำกับ = เลข DC · หมายเหตุ = เลข SO (DI_REF) · แยกชีทรายเซล เรียงเลข DC (Surat)
  const HEAD=['วันที่เอกสาร','เลขที่เอกสาร','วันที่ใบกำกับภาษี','เลขที่ใบกำกับภาษี','รหัสลูกหนี้','ส่วนลดท้ายบิล','รหัสสาขา','รหัสแผนก','รหัสโครงการ','รหัสพนักงานขาย','หมายเหตุ','รหัสซื้อขาย','จำนวน','แถม','ราคาต่อหน่วย','ส่วนลดต่อหน่วย','น้ำหนักต่อหน่วย','เลขล็อต','เลขกำกับ','ตำแหน่งเก็บ'];
  const _row=r=>[docDate, r.dc||'', docDate, r.dc||'', r.code, '', '0','SP01','0', r.salesman, (r.ref||'')+(r.subOf?(' · ทดแทนของ '+r.subOf):''), r.barcode, String(r.qty), r.free?String(r.free):'0', r.price>0?String(r.price):'', '','','','', r.loc];   // รหัสซื้อขาย = บาร์ทดแทน (ถ้ามี) · หมายเหตุ = SO + "ทดแทนของ [เดิม]"
  const _cols=HEAD.map((h,i)=>({wch:[10,16,10,16,12,8,8,8,8,12,26,16,7,6,11,9,9,7,7,8][i]||10}));
  const _smName=sm=>{ const n=String((DATA.usersByCode[sm]||{}).name||'').replace(/^(คุณ|นางสาว|นาย|นาง|น\.ส\.)\s*/,'').trim(); return n.split(/\s+/)[0]||''; };
  const wb=XLSX.utils.book_new(), used=new Set();
  // แยกเซล — 1 ชีท/เซล · เรียงเลข DC ในเซล

  const cut=buildCutList(rows);
  dropped.forEach(r=>{ const n=(r.qty||0)+(r.free||0);   // v4.25: ของที่โดนตัดเพราะยังไม่ได้ยิงเช็ค → ต้องเห็นในชีท "ตัดออก" ไม่ใช่หายเงียบ
    cut.push({code:r.code, store:r.store||'', salesman:r.salesman||'', barcode:String(r.barcode||''), name:r.name||'', unit:r.unit||'', ordered:n, got:0, short:n, src:'⛔ ยังไม่ได้ยิงเช็ค (แบ่ง CS)', dc:r.dc||'', ref:r.ref||''}); });
  const cHead=['วันที่','เลข DC','SO','รหัสร้าน','ร้าน','เซล','บาร์โค้ด','สินค้า','หน่วย','สั่ง','ได้','ขาด','เหตุ'];
  const cData=cut.map(x=>[runDate, x.dc||'', x.ref||'', x.code, x.store, x.salesman, x.barcode, x.name, x.unit, String(x.ordered), String(x.got), String(x.short), x.src]);
  const wsC=XLSX.utils.aoa_to_sheet([cHead,...cData]);
  wsC['!cols']=[{wch:11},{wch:16},{wch:16},{wch:12},{wch:26},{wch:9},{wch:16},{wch:30},{wch:8},{wch:7},{wch:7},{wch:7},{wch:18}];
  forceText(wsC, cData.length, [1,3,6]);   // เลข DC · SO · บาร์โค้ด → TEXT
  XLSX.utils.book_append_sheet(wb,wsC,sheetName('ตัดออก-ไม่ได้',used));
  XLSX.writeFile(wb,`DC บิลขาย-${(ALLOC_MODEL&&ALLOC_MODEL.wh)||tfWh||''}-${runDate}.xlsx`);
  toast(`✅ DC ${order.length} เซล · ${nBills} บิล + ชีทตัดออก ${cData.length} รายการ — import เข้า bplus`);
}

/* กล้อง html5-qrcode (config เดียวกับ Stock C4 / SMR) */
function toggleScanCam(){ scanCamOn?stopScanCam():startScanCam(); }
async function startScanCam(){
  if(!window.Html5Qrcode){ toast('กล้องยังโหลดไม่เสร็จ ลองใหม่'); return; }
  try{
    scanCam=new Html5Qrcode('mp-qr-reader',{verbose:false,experimentalFeatures:{useBarCodeDetectorIfSupported:true}});
    const F=Html5QrcodeSupportedFormats;
    const config={fps:25,qrbox:{width:320,height:180},aspectRatio:1.7777,
      videoConstraints:{facingMode:{ideal:'environment'},width:{ideal:1920,min:1280},height:{ideal:1080,min:720},advanced:[{focusMode:'continuous'},{zoom:1.5}]},
      formatsToSupport:[F.EAN_13,F.EAN_8,F.UPC_A,F.UPC_E,F.CODE_128,F.CODE_39,F.CODE_93,F.ITF,F.QR_CODE]};
    await scanCam.start({facingMode:'environment'},config,onScanCode,()=>{});
    scanCamOn=true; const b=document.getElementById('scanCamBtn'); if(b){ b.textContent='⏹ ปิดกล้อง'; b.classList.add('gray'); }
  }catch(e){ console.error(e); toast('เปิดกล้องไม่ได้ — ใช้ช่องพิมพ์แทน'); stopScanCam(); }
}
async function stopScanCam(){
  try{ if(scanCam){ await scanCam.stop(); await scanCam.clear(); } }catch(e){}
  scanCam=null; scanCamOn=false; const b=document.getElementById('scanCamBtn'); if(b){ b.textContent='📷 เปิดกล้อง'; b.classList.remove('gray'); }
}
function onScanCode(code){
  const now=Date.now(); code=String(code||'').trim();
  if(code===scanLast.code && now-scanLast.t<1500) return;
  scanLast={code,t:now}; scanLookup(code);
}
function beep(){ try{ const a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain(); o.connect(g);g.connect(a.destination);o.frequency.value=880;g.gain.value=.07;o.start(); setTimeout(()=>{o.stop();a.close();},120);}catch(e){} }
function vibrate(){ try{ navigator.vibrate&&navigator.vibrate(60);}catch(e){} }

/* ================= export xlsx ================= */
function sheetName(raw, used){
  let n=String(raw).replace(/[\[\]\:\*\?\/\\]/g,' ').trim().slice(0,28);
  let base=n, i=1; while(used.has(n)){ n=base.slice(0,25)+'_'+(i++); } used.add(n); return n;
}
/* ===== ป๊อปอัปกันพลาด: มีราคาต่ำกว่า S00 → ต้องพิมพ์ "เช็คราคาแล้ว" ถึง export ได้ (ทุกครั้งที่กด Export) ===== */

      (${bills} บิล · ${sms} เซล · ต่ำกว่าพื้นรวม <b>฿${Math.round(loss).toLocaleString()}</b>)<br>
      กรุณาตรวจสอบกับเซล/หัวหน้าก่อน — ถ้าตรวจแล้วยืนยันว่าถูกต้อง ให้พิมพ์คำว่า <b>${PCHK_PHRASE}</b> ในช่องด้านล่าง</div>
    <div class="tbl-wrap" style="max-height:38vh;margin-bottom:12px"><table>
      <thead><tr><th>พนง.ขาย</th><th>ร้าน</th><th>สินค้า</th><th>หน่วย</th><th>ราคาขาย</th><th>พื้น S00</th><th>ต่ำกว่า</th></tr></thead>

    ${n>8?`<div class="note" style="margin-bottom:10px">แสดง 8/${n} รายการ — ดูครบในแท็บ 💵 ตรวจราคา</div>`:''}

function pchkTyped(){

   *    → เตือนก่อน + บอกทางที่ปลอดภัย (ตัดออกทั้งบิล = ไม่มาร์คอะไรเลย บิลค้างหน้าเลือกบิลครบใบ) จนกว่าจะทำมาร์ค "รายบรรทัด" ใน .gs */
  /* ⛔ v4.18 (Surat: "รอบัญชีเอาไปนำเข้าได้ไง ต้องกด Export ไม่ได้ · ให้แอดมินไปติ๊กออกก่อน ละถึงจะกดนำเข้าได้")

  // ⚠️ เตือนบิล "ราคายังไม่อนุมัติ" (Surat: ยังออกใบจองได้ · ราคา = ยึดช่อง O "ราคา" (o.price=idx14) เท่านั้น ที่ระบบให้มา — แอปไม่อ่านราคาแนะนำ/ราคาขอขาย) → แค่เตือนแอดมิน

  // v3.67: Export = "ดึงบิลไปจัด/นำเข้าแล้ว" → ย้ายไปแท็บ "นำเข้าแล้ว" + เขียนสถานะกลับ Supabase (sales_orders + roo_sales/roo_special)
  const _exp = Object.keys((MODEL&&MODEL.docNoByOrder)||{});
  _pcutAdd([...new Set((MODEL.perLineCut||[]).map(x=>x.orderId))]);   // v3.91: จำบิลที่ "ติ๊กสินค้าออกเอง" → ขึ้นแท็บ 🧩 จัดบางส่วน (บิลที่ไม่ได้ติ๊กจะไม่ขึ้น)
  if(_exp.length){ bvSeqNote(MODEL.date, MODEL.bvSeqByBook); exportMarkDone(_exp, MODEL.calcLines); }   // v3.87: จำเลข BV · v3.89: ส่ง "บรรทัดที่ export จริง" ไปด้วย → มาร์ค ROO รายบรรทัด
}
/* force selected column indices to TEXT (กันบาร์โค้ด/รหัสเป็น scientific notation) */
function forceText(ws, dataRows, colIdxs){
  const ref=XLSX.utils.decode_range(ws['!ref']);
  for(let r=1;r<=ref.e.r;r++){
    for(const c of colIdxs){
      const addr=XLSX.utils.encode_cell({r,c}); const cell=ws[addr];
      if(cell && cell.v!=null && cell.v!==''){ cell.t='s'; cell.v=String(cell.v); cell.z='@'; }
    }
  }
}
