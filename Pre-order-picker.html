      delivDate:toBuddhistDMY(runDate), barcode:o.barcode, qty:isFree?'0':o.qty, free:isFree?o.qty:'0',   // v3.54 Surat: "วันที่ส่งของ ให้ใส่วันที่กด export" (เดิมดึง o.dueDate = วันกำหนดส่งในออเดอร์ ซึ่งว่างเกือบทุกบิล → ช่องโล่ง) = วันเดียวกับ วันที่เอกสาร
      unitPrice:o.price, discUnit:'', weightUnit:'', lot:'', invNo:'', loc:shipWh(o), keyDate:String(o.date).replace(/-/g,'/'),
      store:o.store, product:o.product, total:o.total, orderId:o.orderId
    };
  };
  // "ตัดออก" = บิลในมุมมองนี้ (buildBills กรองวัน/คลัง/role/เซล/ค้นหา + ตัด "ยกเลิก") ที่แอดมิน "ไม่เลือก & ยังไม่จัด"
  // v3.75 (Surat): โชว์เฉพาะ "วันที่จัดจริง" = วันเดียวกับบิลที่ติ๊กเลือก → ตอนตั้งฟิลเตอร์ "ทุกวัน" จะไม่ลากบิลเก่าทั้ง 19 วันมากอง (เห็นเฉพาะบิลวันที่จัดที่ยังไม่เอา)
  const _viewBills = buildBills();
  const _pickDays = new Set();
  _viewBills.forEach(b=>{ if(selectedBills.has(b.orderId)) _pickDays.add(b.date); });   // วันของบิลที่ติ๊กเลือก = "วันที่จัดจริง"
  const acctBills = acctHoldBillIdSet();   // v3.90: บิลที่บัญชียังไม่อนุมัติวงเงิน → ห้าม export ทั้งใบ (แม้บางบรรทัดจะขึ้น "อนุมัติราคา" แล้วก็ตาม)
  const priceBills= priceHoldBillIdSet();  // v4.16: บิลที่มีบรรทัด "รออนุมัติราคา" → กันทั้งใบ (ราคายังไม่นิ่ง เปิดไปลูกค้าคืนของ)
  const debtBills = debtHoldBillIdSet();   // v4.05: ด่านขายเชื่อ (DebtApproval) — ยังไม่ขึ้น "อนุมัติ" = ดึงไม่ได้ทุกกรณี
  const cutBillIds = new Set();
  _viewBills.forEach(b=>{ if(!selectedBills.has(b.orderId) && b.pendLines>0 && !b.doneAny && !acctBills.has(b.orderId) && !debtBills.has(b.orderId) && !priceBills.has(b.orderId) && _pickDays.has(b.date)) cutBillIds.add(b.orderId); });   // v3.84: ตัดออก = บิลที่ยังมีแถวยังไม่จัด · v3.86: บิลที่นำเข้าไปแล้วไม่นับเป็น "ตัดออก" · v3.90: บิลรอบัญชีไม่ใช่ "แอดมินเลือกไม่เอา" → ไม่นับเป็นตัดออก
  const doneBills = blockedBillIdSet();   // v3.86: บิลที่นำเข้าไปแล้ว → ห้ามหลุดไป export ซ้ำ · v3.89: "จัดครบใบ/เคย export" เท่านั้น (บิลจัดบางส่วนยังเอาบรรทัดที่เหลือไปจัดต่อได้)

  // 1) filter → บิลที่เลือก = บิลหลัก (lines) · บิลที่ตัดออกทั้งบิล = excluded
  const lines = [], excluded = [], perLineCut = [];   // v3.88: perLineCut = รายการที่ตัดออก "รายตัว" จากบิลที่ยัง export (ใช้เตือนตอนกด Export)
  /* v3.95 (Surat: "กด export ยังไม่ได้เลย") — นับว่า "บรรทัดของบิลที่ติ๊กไว้" ตกด่านไหนไปบ้าง
   * ปุ่ม Export จะ disabled เมื่อ lines===0 ซึ่งเกิดได้หลายสาเหตุแต่เดิมไม่บอกเลย → เก็บเหตุผลไว้โชว์ใต้ปุ่ม */
  const skip={cancel:0,done:0,imported:0,price:0,debt:0,acct:0,appr:0,qty:0,date:0,lineCut:0,store:0,chan:0,salesman:0,wh:0};
  const apprHeld=[];   // v3.99: บรรทัดของบิลที่กำลังจะ export แต่สถานะยังไม่อนุมัติ → จะโดนมาร์ค "จัดแล้ว" ทิ้งฟรี ต้องเตือน
  const _sk=(k,o)=>{ if(selectedBills.has(o.orderId)) skip[k]++; };
  for(const o of DATA.orders){
    if(/ยกเลิก/.test(o.cancel)){ _sk('cancel',o); continue; }              // บรรทัดที่เซลยกเลิกเอง → ข้าม (ไม่จัด · ไม่ใช่ "ตัดออก")
    if(o.done){ _sk('done',o); continue; }   // v3.84 (Surat): แถวที่ "จัดแล้ว" (picking_status ไม่ว่าง) → ไม่เอามา export ซ้ำ แม้ bill_id เดียวกับบิลที่รวม (รวมบิล)
    if(doneBills.has(o.orderId)){ _sk('imported',o); continue; }   // v3.86 (Surat): ทั้งบิลที่นำเข้าไปแล้ว = ไม่เอามา export อีก (ให้ตรงกับลิสต์ที่ซ่อนบิลนั้นไปแล้ว) · ต้องจัดจริงให้กด "↩︎ คืน" ก่อน
    if(priceBills.has(o.orderId)){ _sk('price',o); continue; }   // v4.16 (Surat): บิลที่ซุปยังไม่อนุมัติราคา — ห้ามเปิดทั้งใบ
    if(debtBills.has(o.orderId)){ _sk('debt',o); continue; }   // v4.05 (Surat): "ก่อนดึงออเดอร์ทุกครั้ง ให้ดู DebtApproval ว่าบิลนั้นขึ้นอนุมัติรึยัง — ยังไม่อนุมัติ ดึงไม่ได้ทุกกรณี"
    if(acctBills.has(o.orderId)){ _sk('acct',o); continue; }   // v3.90 (Surat): "ห้าม Export เพราะยังไม่อนุมัติจากบัญชี" → บล็อกทั้งใบ ไม่ใช่แค่บรรทัดที่ค้าง (บิลเดียวมีทั้ง อนุมัติราคา + รอบัญชีอนุมัติ ปนกันได้)
    { const ap=String(o.apprStatus||'').trim();
      if(!isPickableLine(o)){   // v4.01: ใช้ตัวตัดสินเดียวกับ buildBills/แท็บบัญชี (รอบัญชีอนุมัติ = จัดได้แล้ว)
        _sk('appr',o);
        /* ⚠️ v3.99 (ของหายจริง): บรรทัดนี้ "ไม่เข้าไฟล์ Export" แต่ .gs markDoneSb มาร์ค "จัดแล้ว" ทั้งบิลด้วย bill_id
         * → บรรทัดพวกนี้จะถูกตีว่าจัดแล้วทั้งที่ไม่เคยมีใครหยิบของ แล้วไม่กลับมาขึ้นอีกเลย = ลูกค้าไม่ได้ของ
         * เจอจริง 107 บรรทัด / 10 บิล (01-06/08) → เก็บไว้เตือนก่อนกด Export */
        if(selectedBills.has(o.orderId) && !o.done) apprHeld.push({orderId:o.orderId, store:o.store, salesman:o.salesman, product:o.product, status:ap, qty:o.qty});
        continue;
      } }   // v3.79: export เฉพาะ "อนุมัติราคา" · v3.91: + "เปิดในวงเงิน" (บัญชีปล่อยแล้ว จัดได้ แต่เตือนตอน Export)
    if(o.qty<=0 || !o.barcode){ _sk('qty',o); continue; }
    if(!passDate(o.date)){ _sk('date',o); continue; }   // ตัวกรองวัน (เลือกหลายวัน dateSel / ช่วง 📅 / ทุกวัน) — ตะกร้าข้ามวันได้ แต่ออกเฉพาะวันที่กรอง

    if(cutBillIds.has(o.orderId)){                     // บิลถูกตัดออกทั้งบิล (แอดมินเลือกไม่เอา)
      const rl=(DATA.usersByCode[o.salesman]||{}).role||0;
      excluded.push({role:rl, roleLab:roleLabel(rl), ...bplusFields(o,'')});
      continue;
    }

    if(!selectedBills.has(o.orderId)) continue;        // เฉพาะบิลที่เลือก (ตะกร้า ข้ามวันได้)
    if(excludedLines.has(lineKey(o))){                 // v3.88: ตัดออก "รายตัว" (บิลยังจัดอยู่ แต่ไม่เอา SKU นี้) → ลงชีทออเดอร์ถูกตัดออกเหมือนกัน จะได้มีหลักฐาน
      const rl=(DATA.usersByCode[o.salesman]||{}).role||0;
      excluded.push({role:rl, roleLab:roleLabel(rl), ...bplusFields(o,'')});
      perLineCut.push({orderId:o.orderId, store:o.store, product:o.product, barcode:o.barcode, roo:(o._src==='roo' && o._rid!=null)});   // v3.89: roo=true → มาร์ครายบรรทัดได้ ไม่ต้องเตือน
      skip.lineCut++;
      continue;
    }
    if(fStore && !((o.store+' '+o.storeCode+' '+o.product+' '+o.barcode).toLowerCase().includes(fStore))){ skip.store++; continue; }
    const u = DATA.usersByCode[o.salesman] || {};
    const role = u.role || 0;
    if(!chanSetMatch('bills', chanOf(o,u))){ skip.chan++; continue; }   // v3.68: หมวด ROO (ชื่อมี (ROO)/รหัสตรง Supabase) ทับ ปลีก/ส่ง
    if(fSalesmen.size && !fSalesmen.has(o.salesman)){ skip.salesman++; continue; }
    if(fWh!=='all' && shipWh(o)!==fWh){ skip.wh++; continue; }

    const pu = parseUnit(o.unit);
    const prod = DATA.prodIdx[o.barcode] || null;
    const eaPerCS = prod ? prod.qtyCS : (pu.level==='CS'? pu.eaPer : 0);
    const eaPerPA = prod && prod.qtyPA ? prod.qtyPA : (pu.level==='PA'? pu.eaPer : 0);
    const eaPerBP = prod && prod.qtyBP ? prod.qtyBP : 0;
    const productKey = prod ? (prod.codeCS || prod.name) : o.barcode;

    lines.push({
      ...o, wh:shipWh(o), role, roleLab:roleLabel(role),
      level:pu.level, eaPer:pu.eaPer, eaTotal:o.qty*pu.eaPer,
      eaPerCS, eaPerPA, eaPerBP, productKey,
      productName: prod?cleanName(prod.name):o.product, productShort: prod?cleanName(prod.short):o.product,
      codeCS: prod?prod.codeCS:'', codeBP: prod?prod.codeBP:'', codePA: prod?prod.codePA:'', codeEA: prod?prod.codeEA:o.barcode,
      whOrig:String(o.wh||'').trim().toUpperCase(),   // v4.22: คลัง "ของเซล" ตัวจริง (ก่อนถูกทับด้วยคลังส่ง) — ตรวจโปรใช้ตัวนี้ ตามที่ Surat สั่ง
      stockOwn: prod?((prod.stock||{})[shipWh(o)]||0):0, stockW4: prod?prod.stockW4:0, stockC4: prod?prod.stockC4:0, catGroup: prod?prod.catGroup:'', catBrand: prod?prod.catBrand:'',
      keyTS: keyTSof(o),
      storeKey: o.storeCode||o.store
    });
  }

  // 2) ก. เต็มลังรายเซลล์ (cell) — ① CS  ② เต็มลังจากเศษตัวเอง  ③ EA-only(น้ำตาล/ข้าว) · เศษจริง → pool (ข.)
  const cellMap = {};   // salesman|store|productKey → ก. row
  const cellKey = (s,st,pk)=> s+'|'+st+'|'+pk;
  function cell(l){
    const k=cellKey(l.salesman,l.storeKey,l.productKey);
    if(!cellMap[k]) cellMap[k]={salesman:l.salesman,salesmanName:l.name,role:l.role,roleLab:l.roleLab,
      wh:l.wh,store:l.store,storeKey:l.storeKey,productKey:l.productKey,productName:l.productName,productShort:l.productShort,
      eaPerCS:l.eaPerCS,eaPerPA:l.eaPerPA,directCS:0,selfCases:0,eaOnlyEA:0};
    return cellMap[k];
  }
  // สะสมเศษ case-hierarchy ต่อ เซลล์|ร้าน|สินค้า ก่อน เพื่อหักเต็มลังของตัวเอง
  const looseSSP={};
  for(const l of lines){
    if(l.level==='CS'){ cell(l).directCS += l.qty; continue; }                  // ① CS = เต็มลัง → ก.
    if(!l.eaPerCS || l.eaPerCS<=1){ cell(l).eaOnlyEA += l.eaTotal; continue; }   // ③ EA-only → ก.
    const k=cellKey(l.salesman,l.storeKey,l.productKey);                         // ② เศษ case-hierarchy → สะสม
    if(!looseSSP[k]) looseSSP[k]={l, ea:0};
    looseSSP[k].ea += l.eaTotal;
  }

  // 2b) ต่อ เซลล์|ร้าน|สินค้า: เต็มลังจากเศษตัวเอง→ก. · ที่เหลือ→pool (รวมข้ามเซลต่อคลัง)
  const pool={}, pvCut={};   // pvCut = เศษที่ "ตัด" จริง (ไม่ครบลัง) ต่อเซล — ใช้ทำ pivot สรุปเศษตัด
  for(const k in looseSSP){
    const {l, ea}=looseSSP[k];
    const fullCases=Math.floor(ea/l.eaPerCS), rem=ea - fullCases*l.eaPerCS;
    if(fullCases>0) cell(l).selfCases += fullCases;
    if(rem>0){
      const gk=l.role+'|'+l.wh+'|'+l.productKey;
      if(!pool[gk]) pool[gk]={role:l.role,roleLab:l.roleLab,wh:l.wh,productKey:l.productKey,
        productName:l.productName,productShort:l.productShort,eaPerCS:l.eaPerCS,eaPerPA:l.eaPerPA,codeCS:l.codeCS,stores:{},poolEA:0};
      const g=pool[gk];
      if(!g.stores[l.storeKey]) g.stores[l.storeKey]={store:l.store,storeKey:l.storeKey,salesman:l.salesman,salesmanName:l.name,wh:l.wh,role:l.role,ea:0,keyTS:0};
      const s=g.stores[l.storeKey]; s.ea+=rem; s.keyTS=Math.max(s.keyTS,l.keyTS); g.poolEA+=rem;
    }
  }

  // 3) รวมเศษข้ามเซล (ต่อคลัง) → ลังเต็ม (→ "เต็มลังรวม") + เศษไม่ครบลัง → ตัด (ร้านคีย์ทีหลังก่อน)
  const scrap=[], cuts=[];
  for(const gk in pool){
    const g=pool[gk]; const stores=Object.values(g.stores);
    const shipCases=Math.floor(g.poolEA/g.eaPerCS);
    let cutEA=g.poolEA - shipCases*g.eaPerCS;
    stores.sort((a,b)=> b.keyTS-a.keyTS || (a.storeKey<b.storeKey?1:-1));
    for(const s of stores){
      const take=Math.min(s.ea,cutEA); s.cutEA=take; s.finalEA=s.ea-take; cutEA-=take;
      if(take>0){ cuts.push({wh:g.wh,role:g.role,roleLab:g.roleLab,salesman:s.salesman,salesmanName:s.salesmanName,
        store:s.store,product:g.productName,orig:fmtFromEA(s.ea,g.eaPerCS,g.eaPerPA),got:fmtFromEA(s.finalEA,g.eaPerCS,g.eaPerPA),cut:fmtFromEA(take,g.eaPerCS,g.eaPerPA)});
        (pvCut[s.salesman]=pvCut[s.salesman]||{})[g.productKey]=(pvCut[s.salesman][g.productKey]||0)+take; }   // เศษที่ตัด → pivot สรุปเศษตัด
    }
    if(shipCases>0){ const pPA=g.eaPerPA||1;
      scrap.push({wh:g.wh,role:g.role,roleLab:g.roleLab,productKey:g.productKey,productName:g.productName,productShort:g.productShort,
        codeCS:g.codeCS,shipCases,eaPerPA:g.eaPerPA,eaPerCS:g.eaPerCS,
        stores:stores.filter(s=>s.finalEA>0).map(s=>({store:s.store,salesman:s.salesman,salesmanName:s.salesmanName,pa:Math.floor(s.finalEA/pPA),ea:s.finalEA%pPA,finalEA:s.finalEA}))});
    }
  }

  // 4) bplus rows (ทุกบิลที่เลือก — รวมบิล "ราคายังไม่อนุมัติ" ด้วย · ราคา = ยึดช่อง O "ราคา" (o.price=idx14) ที่ระบบให้มาเท่านั้น · เตือนแอดมินตอน export) — เลขที่เอกสาร = เล่มราย "เซลล์" (lookup ด้วยรหัส) + วันที่ + รันต่อเซลล์
  // จับกลุ่มราย billId(orderId): lines บิลเดียวกัน "ต่อกัน" + เลขเอกสารเดียวกัน · เรียงกลุ่มตาม line แรกที่คีย์ (กันบิลที่เพิ่มรายการทีหลัง seq กระจาย)
  const billMinSeq={}; lines.forEach(l=>{ if(billMinSeq[l.orderId]===undefined || l.seq<billMinSeq[l.orderId]) billMinSeq[l.orderId]=l.seq; });
  const sortedLines = [...lines].sort((a,b)=> (billMinSeq[a.orderId]-billMinSeq[b.orderId]) || (a.seq-b.seq) || a.orderId.localeCompare(b.orderId));
  // v3.71: เลขรัน "ต่อห้อง" (ไม่ใช่ต่อเซลล์) + เริ่มต่อจากบิลที่ "จัดแล้ววันนี้" ต่อห้อง (แบบ order-picker)
  //   → export รอบ 2/3/4 ของวันเดียวกัน เลขรันต่อเนื่องไม่รีเซ็ต · RO ทุกเซลล์ใช้ห้อง BV28 ร่วมกัน (นับรวมกัน)
  const doneToday={}, _seenDoneBk=new Set();
  for(const o of (DATA.orders||[])){
    if(o.done && o.doneDate===runDate && o.orderId && !_seenDoneBk.has(o.orderId)){
      _seenDoneBk.add(o.orderId);
      const bk = docBookOf(o) || ('NA-'+o.salesman);   // v3.74: นับ done-today ต่อห้อง (ROO ชื่อมี(ROO)→BV28 · อื่นๆตามรหัส) ให้ตรงกับตอนรันเลข
      doneToday[bk] = (doneToday[bk]||0)+1;
    }
  }
  const bvByOrder={}, seqByBook={}, unmappedBooks=new Set();
  const bplus = sortedLines.map(l=>{
    if(bvByOrder[l.orderId]===undefined){
      let book = docBookOf(l);   // v3.74: ROO(ชื่อมี ROO)→BV28 ทุกรหัส · อื่นๆ = docBook(รหัส)
      if(!book){ book='NA-'+l.salesman; unmappedBooks.add(l.salesman); }   // ยังไม่มีเล่ม → flag
      if(seqByBook[book]===undefined) seqByBook[book] = Math.max(doneToday[book]||0, bvSeqUsed(runDate, book));   // v3.87: เริ่มต่อจาก "จัดแล้ววันนี้" หรือ "เลขที่เคยออกไปแล้วในเครื่อง" — อันไหนมากกว่า (กันเลขซ้ำตอนสถานะใน Supabase หาย)
      seqByBook[book] += 1;
      bvByOrder[l.orderId] = book + bvDate + '/' + String(seqByBook[book]).padStart(3,'0');
    }
    return bplusFields(l, bvByOrder[l.orderId]);
  });

  // 5) ก. per-salesman — เต็มลัง (CS + เต็มลังจากเศษตัวเอง) + EA-only
  const salesmen={};
  for(const k in cellMap){
    const c=cellMap[k];
    const cases=c.directCS + c.selfCases;
    if(cases===0 && c.eaOnlyEA===0) continue;
    const sk=c.salesman||'?';
    if(!salesmen[sk]) salesmen[sk]={salesman:sk,name:c.salesmanName,book:docBook(sk),role:c.role,roleLab:c.roleLab,wh:c.wh,rows:[]};
    const parts=[]; if(cases) parts.push(cases+' ลัง'); if(c.eaOnlyEA) parts.push(c.eaOnlyEA+' ชิ้น');
    salesmen[sk].rows.push({store:c.store,product:c.productName,pick:parts.join(' + ')||'0'});
  }
  Object.values(salesmen).forEach(s=> s.rows.sort((a,b)=> a.product.localeCompare(b.product) || a.store.localeCompare(b.store)));

  // 6) สรุปเศษตัด pivot — เฉพาะที่ "ตัด" (ไม่ครบลัง) × เซลล์
  const codeName={}, prodMeta={};
  lines.forEach(l=>{ if(!codeName[l.salesman]) codeName[l.salesman]=l.name||l.salesman;
    if(!prodMeta[l.productKey]) prodMeta[l.productKey]={name:l.productShort||l.productName, eaPerPA:l.eaPerPA}; });
  const pvMap={}, pvCodes=new Set();
  for(const sm in pvCut){ for(const pk in pvCut[sm]){ const rem=pvCut[sm][pk]; if(rem<=0) continue;
    if(!pvMap[pk]){ const m=prodMeta[pk]||{}; pvMap[pk]={name:m.name||pk, eaPerPA:m.eaPerPA||0, by:{}, totalEa:0}; }
    pvMap[pk].by[sm]=(pvMap[pk].by[sm]||0)+rem; pvMap[pk].totalEa+=rem; pvCodes.add(sm);
  }}
  const pivotCodes=[...pvCodes].sort();
  const pivotNames=pivotCodes.map(c=>codeName[c]||c);
  const pivot=Object.values(pvMap).sort((a,b)=>a.name.localeCompare(b.name)).map(p=>({
    name:p.name, total:fmtLoose(p.totalEa,p.eaPerPA),
    cells:pivotCodes.map(c=> p.by[c]? fmtLoose(p.by[c],p.eaPerPA):'')
  }));

  // ตรวจราคา (v3.56) — เทียบ "ราคาขาย" ของบรรทัดที่จะ export กับ S00 (PDDT) · ต่ำกว่า = เตือนแอดมิน + ล็อกปุ่ม Export
  const priceChk=priceAlertsOf(lines);
  const promoChk=buildBillPromoCheck(lines);   // v4.21: ตรวจโปร/ของแถม ต่อ billId (ชุดเดียวกับตรวจราคา) — เตือนอย่างเดียว ไม่บล็อก

  // stats
  const orderIds=new Set(lines.map(l=>l.orderId));
  const stats={
    orders:orderIds.size, lines:lines.length,
    salesmen:Object.keys(salesmen).length, stores:new Set(lines.map(l=>l.storeKey)).size,
    products:new Set(lines.map(l=>l.productKey)).size,
    baht:lines.reduce((s,l)=>s+l.total,0),
    fullCases:Object.values(cellMap).reduce((a,c)=>a+c.directCS+c.selfCases,0),
    casesScrap:scrap.reduce((s,x)=>s+x.shipCases,0), cuts:cuts.length, excluded:excluded.length, excludedBills:cutBillIds.size, bills:selectedBills.size,
    priceBad:priceChk.bad.length, priceBadBills:new Set(priceChk.bad.map(x=>x.orderId)).size,
    promoBad:promoChk.issues.length, promoShort:promoChk.issues.filter(x=>x.kind==='short').length   // v4.21
  };

  excluded.sort((a,b)=> String(a.salesman).localeCompare(String(b.salesman)) || String(a.note).localeCompare(String(b.note)));

  // scan reference — ยอดสั่งรวม (EA) + รายร้าน (พร้อม keyTS) ต่อสินค้า (ใช้แสดง "สั่งไว้" + allocate รายร้านในแท็บเช็คสินค้า)
  const scanMeta={};
  for(const l of lines){
    if(!scanMeta[l.productKey]) scanMeta[l.productKey]={name:l.productShort||l.productName, eaPerCS:l.eaPerCS, eaPerPA:l.eaPerPA, orderedEA:0, stores:{}};
    const m=scanMeta[l.productKey]; m.orderedEA += l.eaTotal;
    const sk=l.storeKey||l.store;
    if(!m.stores[sk]) m.stores[sk]={salesman:l.salesman,salesmanName:l.name,store:l.store,storeKey:sk,role:l.role,wh:l.wh,ea:0,keyTS:l.keyTS||0};
    m.stores[sk].ea += l.eaTotal;
    if(l.keyTS && (!m.stores[sk].keyTS || l.keyTS<m.stores[sk].keyTS)) m.stores[sk].keyTS=l.keyTS;   // คีย์เร็วสุด = ได้ก่อน
  }

  // scan distribution — "ยิงแล้วไปเซลไหน": เต็มลังรายเซล (cellMap) + เต็มลังรวมแบ่งกลับ (scrap)
  const scanDist={};
  const sdGet=(pk,f)=>{ if(!scanDist[pk]) scanDist[pk]={name:f.name,eaPerCS:f.eaPerCS,eaPerPA:f.eaPerPA,rows:[],shipCases:0}; return scanDist[pk]; };
  for(const k in cellMap){ const c=cellMap[k]; const cs=c.directCS+c.selfCases;
    if(cs===0 && c.eaOnlyEA===0) continue;
    sdGet(c.productKey,{name:c.productShort||c.productName,eaPerCS:c.eaPerCS,eaPerPA:c.eaPerPA})
      .rows.push({type:'sm',salesman:c.salesman,name:c.salesmanName,store:c.store,cases:cs,eaOnly:c.eaOnlyEA});
  }
  for(const x of scrap){ const d=sdGet(x.productKey,{name:x.productShort||x.productName,eaPerCS:x.eaPerCS,eaPerPA:x.eaPerPA});
    d.shipCases+=x.shipCases;
    x.stores.forEach(s=> d.rows.push({type:'pool',salesman:s.salesman,name:s.salesmanName,store:s.store,pa:s.pa,ea:s.ea}));
  }

  // ===== Export 2 แบบ =====
  const catSort=(a,b)=> String(a.catGroup||'~').localeCompare(String(b.catGroup||'~')) || String(a.catBrand||'~').localeCompare(String(b.catBrand||'~')) || String(a.product).localeCompare(String(b.product));
  // แบบ1 — ใบจัดเต็มลัง (รายเซล): CS สำหรับลังได้ + EA สำหรับ EA-only (ข้าว/น้ำตาล = ของเต็ม ไม่ใช่เศษ) · รวมทุกร้านต่อสินค้า · เรียง CAT
  const f1={};
  for(const l of lines){
    const sk=l.salesman||'?';
    if(!f1[sk]) f1[sk]={salesman:sk,name:l.name,book:docBook(sk),role:l.role,roleLab:l.roleLab,wh:l.wh,prod:{}};
    const P=f1[sk].prod;
    if(!P[l.productKey]) P[l.productKey]={product:l.productShort||l.productName,
      eaPerCS:l.eaPerCS, codeCS:l.codeCS,codeBP:l.codeBP,codePA:l.codePA,codeEA:l.codeEA,
      ea:0, stockOwn:l.stockOwn, catGroup:l.catGroup, catBrand:l.catBrand};
    P[l.productKey].ea += l.eaTotal;
  }
  const fmt1 = Object.values(f1).map(s=>({ salesman:s.salesman,name:s.name,book:s.book,role:s.role,roleLab:s.roleLab,wh:s.wh,
      rows:Object.values(s.prod).map(x=>{
        const caseable=x.eaPerCS>1, unit=caseable?'CS':'EA';
        const qty=caseable?Math.floor(x.ea/x.eaPerCS):x.ea;       // ลังได้=ลัง · EA-only=ชิ้น
        const code=caseable?x.codeCS:x.codeEA;
        return {product:x.product, unit, qty, barcode:code||x.codeCS||x.codeBP||x.codePA||x.codeEA, fb:!code, stockOwn:x.stockOwn, catGroup:x.catGroup, catBrand:x.catBrand};
      }).filter(x=>x.qty>0).sort(catSort)
    })).filter(s=>s.rows.length).sort((a,b)=> String(a.salesman).localeCompare(String(b.salesman)));

  // แบบ2 — เอาเศษมารวม: เฉพาะ "เศษของลังได้" (หลังหักลังรายเซล) · EA-only ไปแบบ1 แล้ว · รวมทุกเซลต่อสินค้า → แตก CS/BP/PA/EA · บาร์=ตัว EA
  const smProd={};
  for(const l of lines){ if(!l.eaPerCS || l.eaPerCS<=1) continue;   // EA-only → แบบ1 (ของเต็ม ไม่ใช่เศษ)
    const k=l.salesman+'|'+l.productKey; if(!smProd[k]) smProd[k]={l,ea:0}; smProd[k].ea+=l.eaTotal; }
  const rem={};
  for(const k in smProd){ const {l,ea}=smProd[k];
    const remEA = ea % l.eaPerCS;     // เศษหลังหักลังของเซลนั้น
    if(remEA<=0) continue;
    if(!rem[l.productKey]) rem[l.productKey]={product:l.productShort||l.productName,
      barcode:l.codeEA||l.codePA||l.codeBP||l.codeCS, barUnit:l.codeEA?'EA':(l.codePA?'PA':(l.codeBP?'BP':'CS')),
      codeEA:l.codeEA||'', codePA:l.codePA||'',   // เก็บบาร์ EA/PA แยก → ชีท "เอาเศษมารวม" โชว์ 2 คอลัมน์ (5 ตัวท้าย)
      eaPerCS:l.eaPerCS,eaPerBP:l.eaPerBP,eaPerPA:l.eaPerPA, stockC4:l.stockC4, stockW4:l.stockW4, catGroup:l.catGroup, catBrand:l.catBrand, remEA:0};
    rem[l.productKey].remEA += remEA;
  }
  const fmt2 = Object.values(rem).map(x=>{ let r=x.remEA, cs=0,bp=0,pa=0,ea=0;
    if(x.eaPerCS>1){ cs=Math.floor(r/x.eaPerCS); r%=x.eaPerCS; }
    if(x.eaPerBP>1){ bp=Math.floor(r/x.eaPerBP); r%=x.eaPerBP; }
    if(x.eaPerPA>1){ pa=Math.floor(r/x.eaPerPA); r%=x.eaPerPA; }
    ea=r;
    return {barcode:x.barcode,barUnit:x.barUnit,codeEA:x.codeEA,codePA:x.codePA,product:x.product,ea,pa,bp,cs,stockC4:x.stockC4,stockW4:x.stockW4,catGroup:x.catGroup,catBrand:x.catBrand};
  }).filter(x=> x.ea||x.pa||x.bp||x.cs ).sort(catSort);

  MODEL = { bplus, salesmen:Object.values(salesmen), scrap, cuts, excluded, pivot, pivotNames, stats, date:runDate, unmapped:[...unmappedBooks], scanMeta, scanDist, docNoByOrder:bvByOrder, fmt1, fmt2, calcLines:lines, priceChk, promoChk, bvSeqByBook:seqByBook, perLineCut,
    // v3.90: บิลที่ "บัญชียังไม่อนุมัติ" — acctBlocked = ที่แอดมินติ๊กไว้แต่โดนกันไม่ให้ออกไฟล์ (เตือนตอนกด Export จะได้ไม่งงว่าทำไมบิลหาย)
    acctBlocked: _viewBills.filter(b=>acctBills.has(b.orderId) && selectedBills.has(b.orderId)).map(b=>({orderId:b.orderId, store:b.store, salesman:b.salesman, lines:b.acctLines})),
    /* ⭐ v4.18 (Surat): บิลที่ติ๊กไว้แต่ "ยังไม่ผ่านบัญชี" (= บิลที่อยู่แท็บ 🏦 บัญชีแบบถูกกัน: DebtApproval รอ/ไม่อนุมัติ ·
     * รออนุมัติราคา · ปฏิเสธ) → **ล็อกปุ่ม Export ทั้งปุ่ม** จนกว่าแอดมินจะติ๊กออกเอง — ไม่ตัดออกจากไฟล์เงียบ ๆ แล้ว
     * (บิลจัดครบใบแล้ว (นำเข้าแล้ว) ไม่นับ — ติ๊กในหน้านั้นคือจะกด ↩︎ คืน ไม่ใช่จะ Export) */
    holdSelected: _viewBills.filter(b=>selectedBills.has(b.orderId) && isAcctHoldBill(b))
                            .map(b=>({orderId:b.orderId, store:b.store, salesman:b.salesman, why:holdWhyOf(b)})),
    skip, apprHeld,   // v3.95: เหตุผลที่บรรทัดถูกตัด · v3.99: บรรทัดที่จะโดนมาร์คจัดแล้วทั้งที่ไม่ได้ export
    acctAll: _viewBills.filter(b=>acctBills.has(b.orderId)).length,
    // v3.91 (Surat): "ร้านที่เปิดในวงเงินให้เด้งเตือนแอดมินตอน Export" — บิลที่ export จริงรอบนี้ + มีบรรทัดเปิดในวงเงิน
    creditBills: _viewBills.filter(b=>b.creditLines>0 && selectedBills.has(b.orderId) && !acctBills.has(b.orderId))
                           .map(b=>({orderId:b.orderId, store:b.store, storeCode:b.storeCode, salesman:b.salesman, lines:b.creditLines})) };   // v3.94: +storeCode → popup โชว์วงเงินได้   // v3.87: เลขรันสูงสุดต่อห้อง (กันเลข BV ซ้ำรอบถัดไป) · v3.88: รายการที่ตัดออกรายตัว (เตือนตอน Export)
}
/* รวมเศษ → แพ็ค+ชิ้น (ไม่ roll เป็นลัง) */
function fmtLoose(ea, eaPerPA){
  if(!ea) return '';
  if(eaPerPA>0){ const pa=Math.floor(ea/eaPerPA), e=ea%eaPerPA; return [pa?pa+' แพ็ค':'', e?e+' ชิ้น':''].filter(Boolean).join(' ')||'0'; }
  return ea+' ชิ้น';
}
/* express EA back into CS/PA/EA text */
function fmtFromEA(ea, eaPerCS, eaPerPA){
  let r=ea, cs=0,pa=0;
  if(eaPerCS>0){ cs=Math.floor(r/eaPerCS); r%=eaPerCS; }
  if(eaPerPA>0){ pa=Math.floor(r/eaPerPA); r%=eaPerPA; }
  return fmtTriple(cs,pa,r);
}
/* express EA → CS/BP/PA/EA (รวม BP — ใช้ในใบขายโชว์ "อย่างละเท่าไร") */
function fmtUnits(ea, eaPerCS, eaPerBP, eaPerPA){
  let r=Math.max(0,Math.round(ea||0)), cs=0,bp=0,pa=0;
  if(eaPerCS>1){ cs=Math.floor(r/eaPerCS); r%=eaPerCS; }
  if(eaPerBP>1){ bp=Math.floor(r/eaPerBP); r%=eaPerBP; }
  if(eaPerPA>1){ pa=Math.floor(r/eaPerPA); r%=eaPerPA; }
  return [cs?cs+'CS':'',bp?bp+'BP':'',pa?pa+'PA':'',r?r+'EA':''].filter(Boolean).join(' ')||'0';
}

/* ================= render ================= */
function render(){
  if(!MODEL) return;
  const s=MODEL.stats;

/* v3.86: bill_id ที่มีแถว "จัดแล้ว" อยู่ที่ไหนก็ได้ในข้อมูลทั้งชุด (ไม่สนตัวกรอง วัน/คลัง/เซล/อนุมัติ)

/* v3.89: บิลที่ "ห้ามเอาไป export อีก" = จัดครบทุกบรรทัดแล้ว หรือเคยกด export ไปแล้ว (log)
 * ⚠️ ต่างจาก doneBillIdSet: บิลที่จัด "บางส่วน" (ตัดออกรายตัวไว้) ไม่อยู่ในนี้ → บรรทัดที่เหลือยังเอาไปจัดต่อได้
 * (บรรทัดที่จัดแล้วถูกกันด้วย `if(o.done) continue` อยู่แล้ว จึงไม่มีทางออกซ้ำ) */
function blockedBillIdSet(){
  const st={};
  for(const o of DATA.orders){ if(!o.orderId) continue; const s=st[o.orderId]||(st[o.orderId]={d:0,p:0}); if(o.done) s.d++; else s.p++; }
  const out=new Set();
  for(const id in st){ if(st[id].d>0 && st[id].p===0) out.add(id); }   // จัดครบทั้งบิล
  const pc=_pcutLoad();
  /* ⛔ v3.96 (Surat: "กด Export ไม่ได้") — ลบกฎ v3.91 ที่บล็อกบิล "มีแถวจัดปน" ออก
   * เหตุผล: `blockedBillIdSet` ดูข้อมูล "ทั้งชุด" (ไม่กรองวัน) แต่หน้าเลือกบิลกรองวัน → บิลที่จัดไปแล้วเมื่อวาน
   * แต่วันนี้เซลคีย์เพิ่ม จะโชว์ในลิสต์ "ยังไม่จัด" (วันนี้ doneLines=0) แต่โดนบล็อกเงียบ ๆ ตอน Export
   * เคสจริง ORD8509571 คุณ สุทธดา บุญยัง: 08-03 จัดแล้ว 8 · 08-04 จัดแล้ว 94 · 08-05 ยังไม่จัด 9 → ติ๊กได้แต่ export ไม่ออก
   * กันซ้ำมี `if(o.done) continue` รายบรรทัดอยู่แล้ว (v3.84) → แถวที่จัดไปแล้วไม่มีทางออกซ้ำ ไม่ต้องบล็อกทั้งใบ */
  const lg=_explogLoad();
  for(const id in pc){ if(st[id] && st[id].p>0) out.delete(id); }   // v3.91: บิลที่ติ๊กสินค้าออกเองไว้ = ต้องจัดของที่เหลือต่อได้เสมอ
  for(const id in lg){ if(!st[id] || st[id].d===0) out.add(id); }    // v3.87: export ไปแล้วแต่ไม่มีสถานะรายบรรทัดเลย (หาย) → กันไว้ก่อน · v3.89: ถ้ามีสถานะรายบรรทัดแล้ว เชื่อของจริง (บิลจัดบางส่วนต้องจัดต่อได้)
  return out;
}

/* ===== ลาก checkbox เลือกหลายแถวรวด (drag-to-select · เมาส์/desktop เท่านั้น — ไม่ทำ touch กันชนกับ scroll แนวตั้ง) =====
 * ⚠️ ระหว่างลาก อัปเดตแค่ checkbox + Set + สีแถว — ห้าม re-render ทั้งตาราง (DOM หายกลางลาก = mouseenter ตาย) → ปล่อยเมาส์ค่อย commit ทีเดียว
 * ⚠️ preventDefault ต้องอยู่ที่ click (ไม่ใช่ mousedown) เพราะ native toggle เกิดตอน click — ถ้าไม่กัน จะ toggle ซ้ำค่ากลับเดิม
 * ⚠️ e.detail>0 = คลิกจากเมาส์จริง · keyboard (Space) ให้ detail=0 → ปล่อยผ่านให้ onchange ทำงานปกติ (กัน flag ค้างจากลากที่ปล่อยนอกตาราง) */
let _dsOn=false, _dsTarget=false, _dsDirty=false, _dsCommit=null;
document.addEventListener('mouseup', ()=>{
  if(!_dsOn) return;
  _dsOn=false; document.body.classList.remove('no-select');
  const c=_dsCommit; _dsCommit=null;
  if(_dsDirty){ _dsDirty=false; if(c) c(); }   // commit ครั้งเดียวจบ (process+render ยาว → ห้ามทำทุกแถวตอนลาก)
});
function wireDragSelect(root, cfg){
  if(!root) return;
  root.querySelectorAll(cfg.rowSel).forEach(tr=>{
    const cb=tr.querySelector('input[type="checkbox"]'); if(!cb) return;
    const key=cfg.keyOf(tr);
    let fromDrag=false;
    const apply=on=>{
      if(cb.checked===on) return;   // ลากผ่านเร็วๆ — ตรงเป้าอยู่แล้วไม่ต้องเขียนซ้ำ
      cb.checked=on; cfg.set(key,on);
      if(cfg.paint) cfg.paint(tr,on);
      _dsDirty=true; if(cfg.live) cfg.live();
    };
    cb.addEventListener('mousedown', e=>{
      if(e.button!==0) return;
      fromDrag=true; _dsOn=true; _dsTarget=!cb.checked; _dsCommit=cfg.commit;
      document.body.classList.add('no-select');
      apply(_dsTarget);
    });
    cb.addEventListener('click', e=>{ if(fromDrag && e.detail>0) e.preventDefault(); fromDrag=false; });
    cb.addEventListener('change', ev=>{ if(fromDrag) return; cfg.set(key, ev.target.checked); if(cfg.paint) cfg.paint(tr, ev.target.checked); if(cfg.commit) cfg.commit(); });   // path คีย์บอร์ด
    tr.addEventListener('mouseenter', e=>{ if(_dsOn && e.buttons===1) apply(_dsTarget); });   // buttons===1 กันเคส mouseup หลุดนอกหน้าต่าง
  });
}

  return `<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px"><span class="muted" style="font-size:12px">แยกตาม</span>${chip('sm','👤 เซล')}${chip('picker','🧑‍🔧 คนจัด (ตาม CAT GROUP)')}</div>`;
}
async function setSalesView(m){
  salesViewMode=m;
  if(m==='picker' && !pickerLoadedAt){ document.getElementById('panel-sales').innerHTML=salesModeChips()+'<div class="empty">⏳ กำลังโหลดตารางคนจัด (คนจัดสินค้า W4)…</div>'; await loadPickerMap(); }
  renderSales();
}
function renderSales(){
  const sm=MODEL.fmt1||[];
  if(!sm.length){ document.getElementById('panel-sales').innerHTML=salesModeChips()+'<div class="empty">ไม่มีลังเต็มรายเซล</div>'; return; }
  if(salesViewMode==='picker'){ renderSalesPicker(); return; }
  const opts=sm.map((s,i)=>`<option value="${i}">${esc(s.salesman)} · ${esc(s.name||'')} · ${esc(s.roleLab)} (${s.rows.length})</option>`).join('');
  document.getElementById('panel-sales').innerHTML = salesModeChips() +
    `<div class="row-sel"><label>เลือกเซลล์:</label>
       <select id="smSel" onchange="renderOneSalesman()" style="padding:7px 10px;border:1.5px solid var(--border);border-radius:8px;font-family:inherit">${opts}</select>
     </div><div id="smTable"></div>`;
  renderOneSalesman();
}
function renderOneSalesman(){
  const i=+document.getElementById('smSel').value; const s=(MODEL.fmt1||[])[i]; if(!s)return;
  const body=s.rows.map(r=>`<tr><td class="bccell${r.fb?' fbb':''}">${esc(String(r.barcode).slice(-6))}</td><td class="ucell">${esc(r.unit)}</td><td>${esc(r.product)}</td><td class="num"><b>${r.qty}</b></td><td class="num">${Math.round(r.stockOwn||0).toLocaleString()}</td></tr>`).join('');
  document.getElementById('smTable').innerHTML =
    `<div class="sec-head"><span class="whc" style="background:${WH_COLOR[s.wh]||'#999'}"></span><b>${esc(s.salesman)}</b> ${esc(s.name||'')}
      <span class="pill ${s.roleLab}">${esc(s.roleLab)}</span> <span class="muted">· คลัง ${esc(s.wh)} · เล่ม ${esc(s.book||'(ยังไม่มี)')} · ${s.rows.length} รายการ</span></div>
     <div class="note">เต็มลัง: CS (ลังได้) + EA (ข้าว/น้ำตาลหน่วยเดียว) · รวมทุกร้านต่อสินค้า · เรียงตามหมวด · บาร์ 6 ตัวท้าย (ส้ม=ไม่มีบาร์หน่วยนั้น) · เศษไป "เอาเศษมารวม"</div>
     <div class="tbl-wrap"><table><thead><tr><th>บาร์โค้ด</th><th>หน่วย</th><th>สินค้า</th><th>จำนวน</th><th>สต็อก ${esc(s.wh)}</th></tr></thead><tbody>${body}</tbody></table></div>`;
}
/* v3.62: แยกใบจัด "รายคน" (คนจัด) — เอา fmt1 (ลังเต็มรายเซล) มาแตกตาม CAT GROUP → คนจัด
 * โครงสร้าง: คนจัด → (เซล → แถวสินค้า) · CAT GROUP ที่ไม่อยู่ในตารางคนจัด = "⚠️ ไม่ระบุคนจัด" */
const NOPICKER='⚠️ ไม่ระบุคนจัด';
/* เรียงในใบจัด: CAT VENDOR → CAT BRAND → CAT SIZE (จาก Stocksync/PDDT ผ่าน prodIdx) → ลังมากไปน้อย (Surat) */
function _pickerRowSort(a,b){
  const pa=DATA.prodIdx[a.barcode]||{}, pb=DATA.prodIdx[b.barcode]||{};
  return String(pa.catVendor||'~').localeCompare(String(pb.catVendor||'~'),'th')
      || String(pa.catBrand||'~').localeCompare(String(pb.catBrand||'~'),'th')
      || String(pa.catSize||'~').localeCompare(String(pb.catSize||'~'),'th')
      || ((+b.qty||0)-(+a.qty||0))
      || String(a.product||'').localeCompare(String(b.product||''),'th');
}
/* v3.77: ใบจัด "รวมต่อคนจัด" (คิง/เพชร/แทค/นุ้ย) — เฉพาะ W4 · รวมทุกเซล รวมยอดต่อสินค้า (barcode+unit) · 1 กลุ่ม/คนจัด (ยกมาจาก live v3.68 ให้ deploy แล้วไม่หาย) */
function buildPickerCombined(){
  const pk={};
  (MODEL.fmt1||[]).filter(s=>String(s.wh||'').toUpperCase()==='W4').forEach(s=>{ s.rows.forEach(r=>{
    const p=pickerOf(r.catGroup)||NOPICKER;
    const g=pk[p]||(pk[p]={picker:p, grp:(p===NOPICKER?1000:pickerGrpOf(pickerOf(r.catGroup))), items:{}, sms:new Set()});
    const key=String(r.barcode)+'|'+String(r.unit||'');
    const it=g.items[key]||(g.items[key]={barcode:r.barcode, unit:r.unit, product:r.product, qty:0, stockOwn:r.stockOwn||0, catGroup:r.catGroup, fb:r.fb});
    it.qty += (+r.qty||0);
    if((+r.stockOwn||0) > it.stockOwn) it.stockOwn = +r.stockOwn||0;   // สต็อกคลังเท่ากันทุกเซล — เก็บค่าเดียว
    g.sms.add(s.salesman);
  }); });
  return Object.values(pk).map(g=>({
    picker:g.picker, grp:g.grp, nSm:g.sms.size,
    rows:Object.values(g.items).sort(_pickerRowSort),
    total:Object.keys(g.items).length,
    totalQty:Object.values(g.items).reduce((a,x)=>a+(+x.qty||0),0)
  })).sort((a,b)=> a.grp-b.grp || String(a.picker).localeCompare(String(b.picker),'th'));
}
/* ทำเฉพาะคลัง W4 ก่อน (Surat) — คลังอื่นไม่เข้าโหมดแยกคนจัด (ยังเป็นรายเซลเดิม) */
function buildPickerSplit(){
  const pk={};
  (MODEL.fmt1||[]).filter(s=>String(s.wh||'').toUpperCase()==='W4').forEach(s=>{ s.rows.forEach(r=>{
    const p=pickerOf(r.catGroup)||NOPICKER;
    const g=pk[p]||(pk[p]={picker:p, grp:(p===NOPICKER?1000:pickerGrpOf(pickerOf(r.catGroup))), sms:{}, total:0});
    const sm=g.sms[s.salesman]||(g.sms[s.salesman]={salesman:s.salesman, name:s.name, wh:s.wh, roleLab:s.roleLab, book:s.book, rows:[]});
    sm.rows.push({...r, salesman:s.salesman, salesmanName:s.name});
    g.total++;
  }); });
  return Object.values(pk).map(g=>({ ...g, smList:Object.values(g.sms).map(x=>({...x, rows:x.rows.sort(_pickerRowSort)})).sort((a,b)=>String(a.salesman).localeCompare(String(b.salesman))) }))
    .sort((a,b)=> a.grp-b.grp || String(a.picker).localeCompare(String(b.picker),'th'));
}
function renderSalesPicker(){
  const el=document.getElementById('panel-sales');
  const groups=buildPickerSplit();
  const mapN=Object.keys(PICKER_MAP).length, people=[...new Set(groups.filter(g=>g.picker!==NOPICKER).map(g=>g.picker))];
  const head=salesModeChips()+
    `<div class="row-sel" style="justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
      <div><b style="color:var(--navy)">🧑‍🔧 ใบจัดรายคน</b> <span class="muted" style="font-size:12px">· ${people.length} คน (${esc(people.join(' · ')||'-')})${people.length&&groups.some(g=>g.picker===NOPICKER)?' · +ไม่ระบุ':''}</span></div>
      <button class="btn-export" onclick="exportPicker()">⬇️ Export ใบจัดรายคน</button></div>
    <div class="note"><b>เฉพาะคลัง W4</b> · แตกจาก "ใบจัดเต็มลัง (รายเซล)" ตามตารางคนจัด (แท็บ W4 · ${mapN} หมวด) · CAT GROUP ไหน → ไปอยู่ใบคนนั้น · เรียง CAT VENDOR→BRAND→SIZE→ลังมากไปน้อย · Export ชีท "เซล + คนจัด" (เช่น <b>PMW402 แทค</b>)${mapN?'':' · <span style="color:var(--red)">⚠️ ยังโหลดตารางคนจัดไม่ได้ — แชร์ชีท log คนจัด "ทุกคนที่มีลิงก์=ผู้อ่าน" ก่อน</span>'}</div>`;
  if(!groups.length){ el.innerHTML=head+'<div class="empty">ไม่มีข้อมูล</div>'; return; }
  const body=groups.map(g=>{
    const bad=g.picker===NOPICKER;
    const inner=g.smList.map(s=>{
      const rows=s.rows.map(r=>`<tr><td>${esc(s.salesman)} <span class="muted" style="font-size:10px">${esc((s.name||'').split(' ')[0])}</span></td><td class="bccell${r.fb?' fbb':''}">${esc(String(r.barcode).slice(-6))}</td><td class="ucell">${esc(r.unit)}</td><td>${esc(r.product)}</td><td class="num"><b>${r.qty}</b></td><td class="num">${Math.round(r.stockOwn||0).toLocaleString()}</td></tr>`).join('');
      return rows;
    }).join('');
    const nSm=g.smList.length;
    return `<details ${bad?'':'open'} style="border:1.5px solid ${bad?'#fca5a5':'var(--gold)'};border-radius:10px;margin:10px 0;overflow:hidden">
      <summary style="cursor:pointer;padding:10px 13px;background:${bad?'#fef2f2':'#fffbeb'};font-weight:800;color:${bad?'#b91c1c':'var(--navy)'};font-size:15px">${esc(g.picker)} <span class="muted" style="font-weight:600;font-size:12px">· ${g.total} รายการ · ${nSm} เซล</span></summary>
      <div class="tbl-wrap" style="max-height:60vh"><table><thead><tr><th>เซล</th><th>บาร์โค้ด</th><th>หน่วย</th><th>สินค้า</th><th>จำนวน</th><th>สต็อก</th></tr></thead><tbody>${inner}</tbody></table></div>
    </details>`;
  }).join('');
  el.innerHTML=head+body;
}
/* Export ใบจัดรายคน — 1 ชีท/(เซล × คนจัด) ชื่อ "<รหัสเซล> <คนจัด>" เช่น "PMW402 แทค" (Surat) · เรียงตาม คนจัด → เซล */
function exportPicker(){
  const groups=buildPickerSplit();
  if(!groups.length){ toast('ไม่มีข้อมูล'); return; }
  const wb=XLSX.utils.book_new(), used=new Set();
  const head=['บาร์โค้ด','หน่วย','สินค้า','จำนวน','สต็อก'];
  groups.forEach(g=>{ g.smList.forEach(s=>{
    const title=`จัดเต็มลัง (CS) · คนจัด ${g.picker} · เซล ${s.salesman} ${s.name||''} · คลัง ${s.wh} · ${s.rows.length} รายการ`;
    const rows=s.rows.map(r=>[String(r.barcode).slice(-6), r.unit, r.product, r.qty, Math.round(r.stockOwn||0)]);
    const ws=XLSX.utils.aoa_to_sheet([[title],head,...rows]);
    ws['!cols']=[{wch:10},{wch:7},{wch:34},{wch:7},{wch:11}];
    forceText(ws, rows.length, [0]);
    XLSX.utils.book_append_sheet(wb, ws, sheetName(s.salesman+' '+g.picker, used));   // "PMW402 แทค"
  }); });
  XLSX.writeFile(wb, `ใบจัดรายคน-${(MODEL&&MODEL.date)||todayBKK()}.xlsx`);
  toast('✅ ดาวน์โหลดใบจัดรายคนแล้ว');
}

let lastPlanTab='bills';
function switchTab(t){
  if(t==='alloc'){ t='share'; shareStep='alloc'; }        // back-compat: แท็บเดิม แบ่งออเดอร์/โอน Non CS ถูกรวมเข้า "แบ่ง+โอน" (v3.0)
  if(t==='transfer'){ t='share'; shareStep='tf'; }
  if(t!=='scan' && t!=='truck' && t!=='share' && t!=='co') lastPlanTab=t;
  const indep=(t==='scan'||t==='truck'||t==='share'||t==='co');   // จัดรถ/โอนย้าย/แบ่ง+โอน/เช็คสินค้าออก = หน้าอิสระ → ซ่อน chrome ของจัดของ (filterbar/tiles/แท็บบน)
  const fb=document.querySelector('.filterbar'), tl=document.getElementById('tiles'), tb=document.querySelector('.tabs');
  if(fb) fb.style.display=indep?'none':''; if(tl) tl.style.display=indep?'none':''; if(tb) tb.style.display=indep?'none':'';
  const pbn=document.getElementById('priceBanner'); if(pbn) pbn.style.display=(indep||t==='price')?'none':'';   // v3.56: แบนเนอร์ตรวจราคาอยู่หน้าจัดของ (ในแท็บตรวจราคาเองมีหัวเรื่องอยู่แล้ว)
  const gbn=document.getElementById('promoBanner'); if(gbn) gbn.style.display=(indep||t==='promo')?'none':'';   // v4.22: แบนเนอร์ตรวจโปร (ซ่อนตอนอยู่ในแท็บตรวจโปรเอง)
  const sbn=document.getElementById('srcBadge'); if(sbn) sbn.style.display=indep?'none':'';                    // v3.57: แถบแหล่งข้อมูลตามหน้าจัดของ (จัดรถ/โอนย้าย/เช็คออก ใช้ข้อมูลคนละท่อ)
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===t));
  document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('active',x.id==='panel-'+t));
  const bn = t==='scan'?'scan' : t==='co'?'co' : t==='truck'?'truck' : t==='share'?(tfSolo?'tf2':'share') : 'main';
  document.querySelectorAll('.bottomnav .bn').forEach(b=>b.classList.toggle('active', b.dataset.bn===bn));
  const _bb=document.getElementById('burgerBtn'); if(_bb) _bb.classList.toggle('on', t==='truck');   // จัดรถ อยู่ในเมนู ☰ → ไฮไลต์ ☰ แทน (แถบล่างไม่มีปุ่มนี้)
  if(t==='scan'){ renderScan(); const i=document.getElementById('mtfInput'); if(i) setTimeout(()=>i.focus(),60); }   // แท็บโอนย้าย = ยิงโอนย้าย
  if(t==='truck'){ enterTruckTab(); }
  if(t==='co'){ enterCoTab(); }
  if(t==='share'){ enterShareTab(); }
  if(t==='calc'){ renderCalc(); }
}
function bnGo(w){
  if(w==='tf2'){ tfSolo=true; switchTab('share'); return; }   // แท็บโอนย้าย = ขั้นยิงโอน (share step1) แบบหน้าเดี่ยว clean
  if(w==='share') tfSolo=false;
  switchTab(w==='scan'?'scan':w==='co'?'co':w==='truck'?'truck':w==='share'?'share':lastPlanTab);
}
/* ☰ เมนูเพิ่มเติม — จัดรถ (ย้ายออกจากแถบล่าง) */
function toggleBurger(e){ if(e) e.stopPropagation(); const m=document.getElementById('burgerMenu'), b=document.getElementById('burgerBtn'); if(!m) return; const on=m.classList.toggle('open'); if(b) b.classList.toggle('on',on);
  const a=document.getElementById('srcMenuSheet'), c=document.getElementById('srcMenuSb');   // ติ๊กแหล่งที่ใช้อยู่

/* ================= 🧮 คำนวณ — รวมออเดอร์จากใบจอง (บิลที่เลือก) → ตีเป็น CS/PA/BP/EA (ฐานให้: แยก non-CS ไปจัดอีกคลัง → ใบโอนย้าย → แสกนบอกเซล) ================= */
let calcWh='all', calcRole='all', calcMode='sum', calcSel=new Set(), calcQ='';
let calcTf={from:'C4', to:'W4', doc:'', date:''};   // ฟอร์มใบโอนย้าย non-CS (state อยู่รอด re-render)
function calcTfSet(k,v){ calcTf[k]=v; }
function calcFilterLines(){
  const L=(MODEL&&MODEL.calcLines)||[];
  return L.filter(l=> (calcWh==='all'||l.wh===calcWh) && (calcRole==='all'||String(l.role)===calcRole));
}
/* แตกยอด EA → CS/BP/PA/EA (greedy ใหญ่→เล็ก · ตรรกะเดียวกับ fmt2) เช่น 12PA (ลังละ 5PA) → 2CS+2PA */
function calcBreak(ea,perCS,perBP,perPA){
  let r=Math.round(+ea||0),cs=0,bp=0,pa=0;
  if(perCS>1){ cs=Math.floor(r/perCS); r%=perCS; }
  if(perBP>1){ bp=Math.floor(r/perBP); r%=perBP; }
  if(perPA>1){ pa=Math.floor(r/perPA); r%=perPA; }
  return {cs,bp,pa,ea:r};
}
function calcBreakTxt(b){ const p=[]; if(b.cs)p.push(b.cs+'CS'); if(b.bp)p.push(b.bp+'BP'); if(b.pa)p.push(b.pa+'PA'); if(b.ea)p.push(b.ea+'EA'); return p.join('+')||''; }
function calcAgg(lines){
  const prods={}, sms={};
  for(const l of lines){
    const pk=l.productKey;
    if(!prods[pk]) prods[pk]={key:pk, name:l.productShort||l.productName, codeCS:l.codeCS||'', codeEA:l.codeEA||'', codePA:l.codePA||'', codeBP:l.codeBP||'',
      eaPerCS:l.eaPerCS||0, eaPerBP:l.eaPerBP||0, eaPerPA:l.eaPerPA||0, catGroup:l.catGroup, catBrand:l.catBrand, ea:0, by:{}};
    const p=prods[pk]; p.ea+=l.eaTotal; p.by[l.salesman]=(p.by[l.salesman]||0)+l.eaTotal;

let ALLOC_MODEL=null, allocWh=null, allocDate=null, allocStockOv={}, allocHist=null, allocHistReady=false, allocMonths=3, allocBusy=false, allocQ='', allocShortOnly=true, allocRole='all', allocProg='', allocChkBusy=false;

async function bqCall(action,params){   // เหมือน Sales App (proxy = CONFIG.bqUrl = BQ_Proxy) — คืน j.data, throw ถ้า !ok

/* ===== cache ประวัติซื้อ — คีย์/โค้ดเดียวกับ Sales App (rsa_custHist_<วัน>) → origin เดียวกัน = แชร์ cache ข้ามแอป (แอปขาย prefetch ไว้ → แบ่งโควต้าใช้ได้เลย) ===== */
function _custHistDayKey(){ const d=new Date(); return 'rsa_custHist_'+d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function _custHistMapLoad(){
  if(window._custHistMap) return window._custHistMap;
  try{ const raw=localStorage.getItem(_custHistDayKey()); window._custHistMap=raw?(JSON.parse(raw)||{}):{}; }catch(e){ window._custHistMap={}; }
  try{ Object.keys(localStorage).forEach(k=>{ if(k.indexOf('rsa_custHist_')===0 && k!==_custHistDayKey()) localStorage.removeItem(k); }); }catch(e){}
  return window._custHistMap;
}
/* ⭐ v4.25 — ประวัติ BQ 106 ร้าน = JSON ~2.3MB · localStorage ของ origin นี้เต็มจริง (แชร์กับแอปอื่น 60+ ตัว)
   → setItem โยน QuotaExceededError เงียบ ๆ ทุกครั้ง = "กดดึง BQ แล้วรีเฟรชทีก็หายทุกที ต้องดึงใหม่ทุกวัน"
   แก้: เก็บสำเนาย่อ (เฉพาะ 5 ฟิลด์ที่ allocHistFor ใช้) ลง IndexedDB ด้วย · localStorage ยังเขียนคู่ไว้ให้ Sales App ใช้ร่วม (เขียนไม่ติดก็ไม่เป็นไร) */
function _pkIdb(){ return new Promise((res,rej)=>{ try{ const rq=indexedDB.open('pkr',1);
  rq.onupgradeneeded=()=>{ try{ rq.result.createObjectStore('kv'); }catch(e){} };
  rq.onsuccess=()=>res(rq.result); rq.onerror=()=>rej(rq.error); }catch(e){ rej(e); } }); }
function _pkIdbGet(k){ return _pkIdb().then(db=>new Promise((res,rej)=>{ const t=db.transaction('kv','readonly').objectStore('kv').get(k); t.onsuccess=()=>res(t.result); t.onerror=()=>rej(t.error); })).catch(()=>null); }
function _pkIdbSet(k,v){ return _pkIdb().then(db=>new Promise((res,rej)=>{ const t=db.transaction('kv','readwrite').objectStore('kv').put(v,k); t.onsuccess=()=>res(true); t.onerror=()=>rej(t.error); })).catch(()=>false); }
const _histSlim=r=>({customer_code:r.customer_code, month_year:r.month_year, product_code:r.product_code, product_name:r.product_name, sales_cs:r.sales_cs});
async function _custHistIdbLoad(){   // เติมของที่ IndexedDB มี เข้า map ในหน่วยความจำ (ไม่ทับของที่มีอยู่แล้ว)
  const map=_custHistMapLoad();
  try{

let driveTimeLastErr='';   // เหตุผลที่ fetchDriveTime ล่าสุดคืนเวลาไม่ได้ (เช่น ยังไม่อนุญาตสิทธิ์ Drive ใน Apps Script) → banner โชว์ให้รู้

async function loadW4Master(force){

        stockRaw:{W4:g(9)}, _w4:true };
      [cEA,cPA,cBP,cCS].forEach(c=>{ if(c && idx[c]===undefined) idx[c]=rec; });   // ทุกหน่วย → rec เดียวกัน (เหมือน DATA.prodIdx)
    }

  }catch(e){ w4Err=true; W4_MASTER=null; }

/* จับ product ของ W4 จากไฟล์ W4 (code/qty/ชื่อ) ถ้ามี — ไม่ใช่ W4 หรือไม่มีในไฟล์ → prod เดิม (PDDT) */

/* สต็อกดิบ (CS.EA): W4 = ไฟล์ W4 เท่านั้น (โหลดแล้วไม่เจอ = ยังไม่วาง = ว่าง) · คลังอื่น หรือ ไฟล์ยังไม่พร้อม/ล้ม → PDDT */
function allocStockRawFor(prod, wh, barcode){

    if(!W4_MASTER) return prod?((prod.stockRaw||{}).W4||''):'';   // ยังไม่โหลด → PDDT ชั่วคราว

  }
  return prod?((prod.stockRaw||{})[wh]||''):'';
}

// STOCK เป็น CS.EA notation (ลอกแอปขาย parseStockCsEa) — "1211.10"=1211 ลัง 10 ชิ้น · parse จาก string ดิบ (float "1211.10"→1211.1 ทำ .10→.1 เพี้ยน)
function parseStockCsEa(raw, csSize){
  csSize=Math.max(1, csSize||1);
  const s=String(raw==null?'':raw).trim(); if(!s||s==='-') return {cs:0,ea:0,totalEa:0};
  const d=s.indexOf('.'); let cs,ea;
  if(d===-1){ cs=parseInt(s,10)||0; ea=0; }
  else { cs=parseInt(s.substring(0,d),10)||0; ea=parseInt(s.substring(d+1).replace(/[^0-9]/g,''),10)||0; }
  return {cs,ea,totalEa:cs*csSize+ea};
}
// แบ่งตาม weight (contribution) · ไม่เกินที่สั่ง · largest-remainder + วน redistribute (จำนวนเต็มลัง)
function allocProp(custs, totalCS, weightFn){
  const res={}; custs.forEach(c=>res[c.code]=0);
  let total=Math.floor((+totalCS||0)+1e-9); if(total<=0) return res;
  const cap={}, w={}; custs.forEach(c=>{ cap[c.code]=Math.floor(c.orderedCS+1e-9); w[c.code]=Math.max(0,weightFn(c)||0); });
  let active=custs.filter(c=>w[c.code]>0 && cap[c.code]>0).map(c=>c.code), guard=0;
  while(total>0 && active.length && guard++<2000){
    const wsum=active.reduce((a,c)=>a+w[c],0); if(wsum<=0) break;
    const raw=active.map(c=>({code:c, q:total*w[c]/wsum}));
    let asg=0; raw.forEach(r=>{ const g=Math.min(Math.floor(r.q), cap[r.code]-res[r.code]); if(g>0){ res[r.code]+=g; asg+=g; } });
    let left=total-asg; raw.sort((a,b)=>(b.q-Math.floor(b.q))-(a.q-Math.floor(a.q)));
    for(const r of raw){ if(left<=0) break; if(res[r.code]<cap[r.code]){ res[r.code]++; left--; } }
    total=left; active=active.filter(c=>res[c]<cap[c]);
  }
  return res;
}
/* ===== ⭐ v4.25 กติกาแบ่งของ — ใช้ร่วมกัน 2 ที่: ขั้น "แบ่ง CS" (ตามสต็อก) + "🧾 ฟอร์ม DC" (ตามที่เช็คได้จริง) =====
   Surat 2026-08-15 (แก้ที่นี่ที่เดียว แล้วต้องอัปเดต allocMethodHtml() ให้ตรงเสมอ):
   1) ของพอ → ไม่มีการแบ่ง ทุกร้านได้เต็มที่สั่ง
   2) ของไม่พอ → ร้าน "ปลีก + ROO" ได้ก่อนเสมอ — แต่เฉพาะร้านที่ "เคยซื้อ SKU นี้ย้อนหลัง N เดือน" (BQ)
   3) ปลีก/ROO ที่ไม่เคยซื้อ = ไม่ได้สิทธิ์ก่อน ตกไปอยู่กลุ่มปกติ (แบ่งให้ร้านอื่นตามปกติ)
   4) ที่เหลือ → แบ่งตามประวัติซื้อ (contribution) · ⚠️ ถ้าทั้งกลุ่มไม่มีใครมีประวัติเลย → แบ่งตาม "สัดส่วนที่สั่ง"
      (เดิมให้ 0 ทุกร้าน → ของค้างคลังทั้งที่มีอยู่ เช่น มี 129 ลัง สั่ง 153 ลัง แต่แบ่งออกไปแค่ 2 ลัง) */
/* ช่องทางของร้าน = ดู "พรีฟิกซ์รหัสเซล" ไม่ใช่ User Role (PMW303/PMW401 เป็น Role 5 แต่สายปลีก · RO*=ROO) */
function allocChanOf(sm){
  const code=String(sm||'').trim().toUpperCase();
  if(/^RO/.test(code)) return 'ROO';
  if(/^HSW/.test(code)) return 'ส่ง';
  if(/^PMW/.test(code)) return 'ปลีก';
  const r=(DATA.usersByCode[code]||{}).role||0;
  return r>=4?'ส่ง':(r===3?'ปลีก':'อื่นๆ');
}
function allocIsPriority(c){ return (c.chan==='ปลีก'||c.chan==='ROO') && (c.histCS||0)>0; }   // ปลีก/ROO + เคยซื้อ = ได้ก่อน
/* ตัวกรอง "ประเภท" ของแถบร่วม (คุมทั้ง 3 ขั้น) — รับได้ทั้งค่าเก่า '3'/'4' และค่าใหม่ 'ปลีก'/'ส่ง'/'ROO'
   v4.25: เทียบด้วย allocChanOf (พรีฟิกซ์รหัสเซล) ไม่ใช่ User Role → PMW303/PMW401 (Role 5) ไม่หลุดจากปลีกอีก + มี ROO ให้เลือก */
function chanFilterOK(sel, sm){
  if(!sel || sel==='all') return true;
  const c=allocChanOf(sm);
  if(sel==='3') return c==='ปลีก';
  if(sel==='4') return c==='ส่ง';
  return c===sel;
}
/* แบ่ง avail (จำนวนเต็ม หน่วยเดียวกับ orderedCS) ให้ custs [{code,orderedCS,histCS,chan}] → {code: ได้เท่าไร} */
function allocQuota(custs, avail){
  const res={}; (custs||[]).forEach(c=>res[c.code]=0);
  let total=Math.floor((+avail||0)+1e-9); if(total<=0 || !custs || !custs.length) return res;
  const pri=custs.filter(allocIsPriority), rest=custs.filter(c=>!allocIsPriority(c));
  [pri,rest].forEach(g=>{
    if(total<=0 || !g.length) return;
    const demand=g.reduce((a,c)=>a+Math.floor((c.orderedCS||0)+1e-9),0);
    if(demand<=0) return;
    if(total>=demand){ g.forEach(c=>{ res[c.code]=Math.floor((c.orderedCS||0)+1e-9); }); total-=demand; return; }   // กลุ่มนี้ได้เต็ม
    const hasHist=g.some(c=>(c.histCS||0)>0);
    const part=allocProp(g, total, c=> hasHist ? ((c.histCS||0)>0?c.histCS:0) : Math.max(0,c.orderedCS||0));        // ไม่มีใครมีประวัติ → สัดส่วนที่สั่ง
    let used=0; g.forEach(c=>{ const q=part[c.code]||0; res[c.code]=q; used+=q; });
    total-=used;
  });
  /* 🧹 รอบเก็บของเหลือ — คนเคยซื้อได้เต็มหมดแล้วแต่ของยังเหลือ → ให้ร้านที่ยังไม่เต็ม (ตามสัดส่วนที่สั่ง)
     ไม่งั้นของค้างคลังทั้งที่เช็คออกมาแล้ว เช่น เช็คได้ 40 ลัง แต่ลงบิลแค่ 20 (Surat: "แบ่งสต๊อกไปไม่ตรง")
     ⚠️ ทำเป็นรอบสุดท้ายเสมอ → สิทธิ์ของปลีก/ROO + คนเคยซื้อ ไม่ถูกแย่ง */
  if(total>0){
    const left=custs.map(c=>({code:c.code, orderedCS:Math.floor((c.orderedCS||0)+1e-9)-(res[c.code]||0)})).filter(c=>c.orderedCS>0);
    if(left.length){ const part=allocProp(left, total, c=>Math.max(0,c.orderedCS)); left.forEach(c=>{ res[c.code]=(res[c.code]||0)+(part[c.code]||0); }); }
  }
  return res;
}
function allocByChannel(custs, availCS){ return allocQuota(custs, availCS); }   // ชื่อเดิม — คงไว้กันโค้ดอื่นเรียก
function buildAllocation(){   // ⚠️ v3.0: ยึด BK_BV (SO) เป็นตัวตั้ง — แบ่ง "ลังเต็ม (CS)" เท่านั้น · เศษ (non-CS BP/PA/EA) → ขั้นโอน · แก้ logic แบ่ง → ต้องอัปเดต allocMethodHtml() ให้ตรง
  const day=allocDate, wh=allocWh, skuMap={};
  for(const x of (DATA.bkbv||[])){                         // BK_BV = แหล่งเดียวกับขั้นโอน (แถบเลือกร่วม คลัง/ประเภท/วัน)
    if(x.date!==day) continue;
    if(x.wh!==wh) continue;
    if(x.level!=='CS') continue;                           // เฉพาะลังเต็ม (เศษ = ขั้นโอน tfLines)
    if(!(x.qty>0) || !x.barcode) continue;
    if(!exportChanOK(x.salesman)) continue;   // v4.26: ช่องทางที่ติ๊ก (ชุดเดียวกันทั้งแอป) — ติ๊กไม่ครบ = แบ่งเฉพาะช่องทางนั้น ไม่ปนกัน
    const prod=allocProdFor(DATA.prodIdx[x.barcode]||null, wh, x.barcode), pu=parseUnit(x.unit);   // W4 → จับ product จากไฟล์ W4
    const eaPerCS = prod?(prod.qtyCS||0):(pu.level==='CS'?pu.eaPer:0);
    if(!eaPerCS) continue;                                  // คำนวณ CS ไม่ได้ → ข้าม
    const key=prod?(prod.codeCS||prod.name):x.barcode, cc=String(x.storeCode||'').trim();
    if(!cc) continue;
    if(!skuMap[key]) skuMap[key]={key, name:prod?cleanName(prod.name):cleanName(x.product), shortName:prod?cleanName(prod.short):cleanName(x.product),
      eaPerCS, eaPerPA:prod?(prod.qtyPA||0):0, codes:[prod&&prod.codeCS,prod&&prod.codeBP,prod&&prod.codePA,prod?prod.codeEA:x.barcode].filter(Boolean).map(String),
      codeCS:prod?prod.codeCS:x.barcode, codeEA:prod?prod.codeEA:x.barcode, barcode:x.barcode, stockRaw:allocStockRawFor(prod, wh, x.barcode), custs:{}};   // W4 = ไฟล์แยกเท่านั้น · คลังอื่น = PDDT
    const sk=skuMap[key];
    if(!sk.custs[cc]) sk.custs[cc]={code:cc, store:x.store||'', salesman:x.salesman||'', chan:allocChanOf(x.salesman), orderedEA:0, priceCS:0};   // v4.25: ช่องทางจากพรีฟิกซ์รหัสเซล (เดิม roleChan ใช้ Role → PMW303/PMW401 Role5 หลุดจากปลีก · ROO ไม่มีเลย)
    sk.custs[cc].orderedEA += x.qty*pu.eaPer;              // CS line: qty=ลัง · pu.eaPer=eaPerCS → EA (floor กลับได้ลังเดิม)
    if(x.price>0) sk.custs[cc].priceCS=x.price;            // ราคา/ลัง = ราคาต่อหน่วยบรรทัด CS ตรงจาก BK_BV (TRD_U_PRC)
  }
  const skus=Object.values(skuMap).map(sk=>{
    /* ⭐ v4.25 (Surat: "แบ่ง CS เอาจากยอดที่เช็คเลย ไม่ต้องสน stock — stock มันไม่ real time แต่ของที่มีจัดมาคือมีแน่ๆ")
       มีของ = ยอดที่ "ยิงเช็คมาจริง" (ชีทยิงเช็คใบเตรียม + ยิงเช็คออก ของวัน/คลังนั้น · รวมทุกหน่วยแล้วแปลง EA → ลัง)
       สต็อกในไฟล์เหลือไว้โชว์เทียบเฉย ๆ ไม่ได้เอาไปคำนวณแล้ว */
    const stockCS = sk.eaPerCS? (parseStockCsEa(sk.stockRaw, sk.eaPerCS).totalEa / sk.eaPerCS) : 0;   // STOCK เป็น CS.EA → totalEa÷csSize = ลัง (อ้างอิงเฉย ๆ)
    const availCS_auto = sk.eaPerCS? (allocChkEaFor(sk) / sk.eaPerCS) : 0;
    const availCS = (allocStockOv[sk.key]!=null)? allocStockOv[sk.key] : Math.floor(availCS_auto*100)/100;
    const custs=Object.values(sk.custs);
    custs.forEach(c=>{ c.orderedCS=Math.floor((c.orderedEA||0)/sk.eaPerCS); c.nonCsEA=(c.orderedEA||0)-c.orderedCS*sk.eaPerCS; c.priceCS=c.priceCS||0; });   // CS = ลังเต็มต่อร้าน (BK_BV CS line) · priceCS = ราคา/ลัง จาก BK_BV สำหรับ Export DC
    const totalOrderedCS=custs.reduce((a,c)=>a+c.orderedCS,0);
    const isShort = totalOrderedCS > availCS+1e-6;
    custs.forEach(c=>{ c.histCS=allocHistFor(c.code,sk); });
    const histSum=custs.reduce((a,c)=>a+(c.histCS>0?c.histCS:0),0);
    custs.forEach(c=>{ c.pri=allocIsPriority(c); });                                     // v4.25: ปลีก/ROO + เคยซื้อ = ได้ก่อน
    const gHistSum=g=>custs.filter(c=>!!c.pri===g).reduce((a,c)=>a+(c.histCS>0?c.histCS:0),0);
    const priSum=gHistSum(true), restSum=gHistSum(false);
    custs.forEach(c=>{ const s=c.pri?priSum:restSum; c.share=(s>0 && c.histCS>0)? c.histCS/s : 0; });   // สัดส่วนคิดในกลุ่มตัวเอง
    let alloc={};
    if(!isShort){ custs.forEach(c=>alloc[c.code]=Math.round(c.orderedCS*100)/100); }   // ของพอ → ได้เต็มที่สั่ง (ไม่มีการแบ่ง)
    else alloc=allocQuota(custs, availCS);                                              // ของไม่พอ → ปลีก+ROO ที่เคยซื้อได้ก่อน → ที่เหลือตามประวัติ (ไม่มีประวัติเลย = ตามสัดส่วนที่สั่ง)
    custs.forEach(c=>c.allocCS=alloc[c.code]||0);
    custs.sort((a,b)=> b.histCS-a.histCS || b.orderedCS-a.orderedCS);
    return {key:sk.key, name:sk.name, shortName:sk.shortName, eaPerCS:sk.eaPerCS, eaPerPA:sk.eaPerPA, codes:sk.codes, codeCS:sk.codeCS, codeEA:sk.codeEA, barcode:sk.barcode, availCS, availCS_auto, stockCS, totalOrderedCS, totalNonCsEA:custs.reduce((a,c)=>a+(c.nonCsEA||0),0), histSum, short:isShort, custs};
  }).filter(sk=>sk.totalOrderedCS>0);   // CS-only: สินค้าที่ทุกร้านสั่งไม่ถึงลัง = non-CS ล้วน → ไปยิงจริง (ไม่โชว์ที่แบ่งออเดอร์)
  skus.sort((a,b)=> (b.short-a.short) || (b.totalOrderedCS-a.totalOrderedCS));   // ของไม่พอก่อน → ยอดสั่งมาก
  const whs=[...new Set((DATA.bkbv||[]).map(x=>x.wh))].filter(Boolean).sort();
  ALLOC_MODEL={day, wh, skus, histReady:allocHistReady, whs};
}

/* ยอดที่ยิงเช็คมาจริงของสินค้านี้ (EA) — รวมทุกบาร์โค้ดของสินค้าตัวเดียวกัน (เช็คเกอร์ยิงหน่วยไหนก็ได้ · coRowEa แปลงเป็น EA ให้แล้ว) */
function allocChkEaFor(sk){
  const q=(PLANCHK&&PLANCHK.qty)||{}, seen=new Set(); let ea=0;
  [...(sk.codes||[]), sk.barcode].forEach(c=>{ const k=String(c||'').trim(); if(!k||seen.has(k)) return; seen.add(k); ea+=q[k]||0; });
  return ea;
}
// ประวัติซื้อ CS ของร้าน cc สำหรับสินค้า sk — join ด้วยรหัสสินค้า (ถ้าตรง) หรือชื่อ (normalize)
function allocHistFor(cc, sk){   // อ่าน cache เดียวกับ Sales App (raw rows รายเดือน) · เฉพาะ allocMonths เดือนล่าสุด · match บาร์โค้ด (product_code = "BC-"+บาร์โค้ด) หรือชื่อ
  const map=window._custHistMap; if(!map) return 0;
  const rows=map[String(cc)]; if(!rows||!rows.length) return 0;
  const months=new Set(_allocMonthLabels());
  const codes=new Set((sk.codes||[]).map(c=>String(c).replace(/^0+/,'')));   // บาร์โค้ดออเดอร์ (ตัด 0 นำหน้า)
  const nm=_histNorm(_histClean(sk.name));
  let sum=0;
  for(const r of rows){
    if(r.month_year && !months.has(String(r.month_year))) continue;          // นับเฉพาะ N เดือนล่าสุด (cache เก็บ 6 เดือนร่วมกับแอปขาย)
    const bc=String(r.product_code||'').replace(/^BC-/i,'').replace(/^0+/,'');
    if((bc && codes.has(bc)) || (nm && _histNorm(_histClean(r.product_name))===nm)) sum+=(+r.sales_cs||0);
  }
  return sum;
}

// water-fill: แบ่ง availCS (เต็มลัง) ตาม share=ประวัติ · ไม่เกินที่สั่ง · เศษโยนให้คนยังไม่เต็มตาม largest-remainder · วน redistribute
function allocWaterfill(custs, availCS){
  const res={}; custs.forEach(c=>res[c.code]=0);
  const cap={}, w={}; custs.forEach(c=>{ cap[c.code]=Math.floor(c.orderedCS+1e-9); w[c.code]=c.histCS>0?c.histCS:0; });
  let total=Math.floor(availCS+1e-9);
  let active=custs.filter(c=>w[c.code]>0 && cap[c.code]>0).map(c=>c.code), guard=0;
  while(total>0 && active.length && guard++<2000){
    const wsum=active.reduce((a,c)=>a+w[c],0); if(wsum<=0) break;
    const raw=active.map(c=>({code:c, q: total*w[c]/wsum}));
    let assigned=0;
    raw.forEach(r=>{ const give=Math.min(Math.floor(r.q), cap[r.code]-res[r.code]); if(give>0){ res[r.code]+=give; assigned+=give; } });
    let left=total-assigned;
    raw.sort((a,b)=>(b.q-Math.floor(b.q))-(a.q-Math.floor(a.q)));   // largest remainder
    for(const r of raw){ if(left<=0) break; if(res[r.code]<cap[r.code]){ res[r.code]++; left--; } }
    total=left; active=active.filter(c=>res[c]<cap[c]);
  }
  return res;
}

/* ดึงประวัติซื้อจาก BQ ให้ "รายชื่อรหัสร้าน" ที่ส่งมา — ใช้ร่วม ขั้นแบ่ง CS + ฟอร์ม DC (แท็บเช็คออก)
   v4.25: ก้อนละ 40 ร้าน (เดิม 80 = ก้อนละ ~1.7MB/22 วิ · ดูเหมือนแอปค้าง) · โชว์ความคืบหน้า · ก้อนไหนพลาดบอกเหตุผลจริง (ไม่เคลมว่าสำเร็จ) */
async function allocFetchCodes(codesAll, onProg){
  const map=await _custHistIdbLoad();
  const codes=(codesAll||[]).filter(cc=>map[cc]===undefined);   // ข้ามร้านที่ cache แล้ว (อาจมาจากแอปขาย/รอบก่อน)
  const st={total:codesAll.length, cached:codesAll.length-codes.length, done:0, errN:0, lastErr:''};
  const CHUNK=40;
  for(let i=0;i<codes.length;i+=CHUNK){
    const part=codes.slice(i,i+CHUNK);
    if(onProg) onProg(st.cached+st.done, st.total);
    let rows;
    try{ rows=await bqCall('custHistoryBatch',{ccs:part.join(','), months:6}); }   // months:6 = ก้อนเดียวกับ Sales App (กรองเหลือ allocMonths ตอนคำนวณ)
    catch(e){ st.errN++; st.lastErr=String(e&&e.message||e); continue; }
    const grp={}; (rows||[]).forEach(r=>{ const k=String(r.customer_code||'').trim(); if(!k) return; (grp[k]=grp[k]||[]).push(r); });
    part.forEach(cc=>{ map[cc]=grp[cc]||[]; });   // ร้านที่ไม่มีประวัติ → [] (กัน refetch)
    st.done+=part.length;
    _custHistMapSave();
  }
  if(onProg) onProg(st.total, st.total);
  return st;
}

function haversine(a,b){const R=6371,toR=x=>x*Math.PI/180;const dLat=toR(b.lat-a.lat),dLng=toR(b.lng-a.lng);const s=Math.sin(dLat/2)**2+Math.cos(toR(a.lat))*Math.cos(toR(b.lat))*Math.sin(dLng/2)**2;return R*2*Math.atan2(Math.sqrt(s),Math.sqrt(1-s));}

const JR_SPAN_THR={W1:35,W2:55,W3:40,W4:40,C4:30};   // เกณฑ์ "คันน่าจะผิด" (กม./คัน) ต่อคลัง — โซนไกล (W2 สุพรรณ) วิ่งไกลปกติ ตั้งสูงกว่า
function jrSpanDefault(){ return JR_SPAN_THR[String(jrWh||'').toUpperCase()]||35; }
function jrSpanVal(){const e=document.getElementById('jrSpan');const d=jrSpanDefault();return e?(+e.value||d):d;}   // ระยะวิ่งร้านแรก→สุดท้าย เกินเกณฑ์/คัน = น่าจะผิด (default ตามคลัง · input override ได้)
function jrSuspect(g,thr){ return (g.chan!=='ปลีก' && (g.spanKm||0)>thr) || ((g.geoSuspectN||0)>0); }   // "คันน่าจะผิด" = ส่งที่วิ่งเกินเกณฑ์ (retail เซลครอบกว้างปกติ ไม่นับ) · หรือ มีร้านพิกัดเพี้ยน (ทุกช่อง)
function jrSpanHtml(g, thr){   // เนื้อหา "🛣️ วิ่ง ~XX.X กม." + badge น่าจะผิด + หมายเหตุร้านไม่มีพิกัด (ใช้ทั้ง render การ์ด + jrUpdateSpan)
  const sp=g.spanKm||0, suspect=(g.chan!=='ปลีก' && sp>thr), ng=g.noGeoCount||0;   // span badge เฉพาะ "ส่ง" · ปลีกโชว์ระยะแต่ไม่ flag (เซลครอบพื้นที่กว้างเป็นปกติ)
  return `🛣️ วิ่ง ~${sp.toFixed(1)} กม.`
    + (suspect?` · <b style="color:#7c3aed">⚠️ น่าจะผิด — วิ่ง ${sp.toFixed(0)} กม. (>${thr})</b>`:'')
    + (g.geoSuspectN?` · <b style="color:#dc2626">📍 ${g.geoSuspectN} ร้านพิกัดเพี้ยน</b>`:'')
    + (ng?` <span style="color:var(--muted)">(ไม่นับ ${ng} ร้านไม่มีพิกัด)</span>`:'');
}
function jrUpdateSpan(){   // อัปเดต badge "น่าจะผิด" + tile แบบเบา (toggle คลาส+นับใหม่ · ไม่ rebuild · ไม่ทำแผนที่กระพริบ — pattern เดียวกับ jrHighlight)
  const thr=jrSpanVal();
  document.querySelectorAll('#jrTruckList .jr-truck').forEach(el=>{
    const g=jrGroup(el.dataset.gid); if(!g) return;
    const suspect=jrSuspect(g,thr);
    el.classList.toggle('suspect', suspect);
    const sp=el.querySelector('.jr-span'); if(sp){ sp.classList.toggle('suspect', suspect); sp.innerHTML=jrSpanHtml(g, thr); }
  });
  const n=((TRUCK_MODEL&&TRUCK_MODEL.groups)||[]).filter(g=>jrSuspect(g,thr)).length;
  const t=document.getElementById('jrSuspectTile'); if(t){ const v=t.querySelector('.v'); if(v) v.textContent=n; t.classList.toggle('warn', n>0); }
}
function csFmt(cs){return (Math.round(cs*10)/10).toLocaleString();}
function fmtCsEa(ea, qtyCS){ const per=parseInt(qtyCS)||1; const t=Math.round(Math.abs(+ea||0)); if(!t) return '0'; if(per<=1) return t.toLocaleString(); const cs=Math.floor(t/per), e=t%per; return cs.toLocaleString()+'.'+(e<10?'0'+e:e); }   // CS.EA notation: integer=ลัง · ทศนิยม 2 หลัก=ชิ้น (0.04 = 0 ลัง 4 ชิ้น · ไม่ใช่เศษลัง) — ดู PDDT-REFERENCE
function ffMini(ff){return ff==='ok'?'<span class="jr-ff ok">ครบ</span>':ff==='part'?'<span class="jr-ff part">ขาด</span>':'<span class="jr-ff out">หมด</span>';}
function nnOrder(bills,depot){const pts=bills.filter(b=>b.lat!=null),rest=bills.filter(b=>b.lat==null);const out=[];let cur=depot;const pool=[...pts];while(pool.length){let bi=0,bd=Infinity;pool.forEach((b,i)=>{const d=haversine(cur,b);if(d<bd){bd=d;bi=i;}});const nx=pool.splice(bi,1)[0];out.push(nx);cur=nx;}return [...out,...rest];}
async function ensureLeaflet(){if(window.L)return true;try{await new Promise((res,rej)=>{const c=document.createElement('link');c.rel='stylesheet';c.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';document.head.appendChild(c);const j=document.createElement('script');j.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';j.onload=res;j.onerror=rej;document.head.appendChild(j);});}catch(e){}return !!window.L;}

/* ===== คิว "ค้างส่ง" — sync ชีต "คิวจัดรถ" ผ่าน Apps Script (เก็บเฉพาะร้านที่กดเก็บไว้ · ไม่อยู่ในคิว = จัดส่งตามแผน) ===== */
async function jrLoadHold(){
  const date=jrDate||todayBKK();
  if(!CONFIG.gasUrl){ jrHold={}; jrHoldDate=date; return; }
  try{
    const res=await fetch(CONFIG.gasUrl,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'jrQueue',date})});
    const j=await res.json(); const m={};
    jrQueueReady=!!(j&&j.ok);   // gas-v6+ ตอบ ok:true · gas-v5 ตอบ ok:false (unknown action) → ซ่อนปุ่มคิว
    ((j&&j.rows)||[]).forEach(r=>{ if(r.ref) m[r.ref]={by:r.by||'',time:r.time||'',store:r.store||'',wh:r.wh||''}; });
    jrHold=m; jrHoldDate=date;
  }catch(e){ jrHoldDate=date; }   // degrade: เน็ต/คิวล่ม → ใช้ของเดิมในหน่วยความจำ ไม่ค้างหน้า
}
function jrFindBill(oid){ const M=TRUCK_MODEL; if(!M) return null; return [...(M.bills||[]),...(M.held||[])].find(b=>b.orderId===oid)||null; }
async function jrToggleHold(oid){

  const date=jrDate||todayBKK(), wasHeld=!!jrHold[oid], b=jrFindBill(oid);
  if(wasHeld){ delete jrHold[oid]; }                                              // ปล่อยส่ง → ออกจากคิว → กลับเข้า "รอจัดรถ"
  else { jrHold[oid]={by:(currentUser&&currentUser.name)||'',time:nowStamp(),store:b?b.store:'',wh:b?b.wh:''}; if(jrAssign[oid]){ delete jrAssign[oid]; jrSaveState(); } }   // เก็บไว้ → ค้างส่ง + ดึงออกจากคัน

      const j=await res.json(); if(j&&j.ok) toast(wasHeld?'▶️ ปล่อยส่งแล้ว':'📥 เก็บไว้ (ค้างส่ง) แล้ว'); else throw new Error((j&&j.error)||'fail');
    }catch(e){ toast('❌ บันทึกคิวไม่สำเร็จ — '+(e.message||e)); }   // ไม่ rollback UI (ผู้ใช้กดซ้ำ/รีโหลดได้) — แจ้งเตือนพอ
  } else { toast(wasHeld?'▶️ ปล่อยส่ง (เครื่องนี้)':'📥 เก็บไว้ (เครื่องนี้ · ยังไม่ตั้ง gasUrl)'); }
}
function jrSetChan(v){ jrFilterChan=v; jrSel=null; jrOpenSm=null; jrRightTab='unassigned'; renderTruckTab(); }   // เปลี่ยนชิป ปลีก/ส่ง → เคลียร์คันที่เลือก + รีเซ็ตขวาเป็นรอจัดรถ (กัน map ค้างการ์ดช่องเดิม)
function buildTrucks(){

  const day=jrDate||todayBKK();   // จัดรถ v2.10 กรองด้วย "วันคีย์" (o.date) = sales order ทั้งหมดของวันนั้น (เลิกใช้ doneDate ที่ปิดไปแล้ว · Surat: ใช้ sales order ทั้งหมด เลือกวันเอา)
  const selAll=[];
  const ORD=(jrSource==='sheet')?(DATA.jadrotRows||[]):DATA.orders;   // จัดรถอ่านจาก: ชีตจัดรถ(DI export) หรือ sales backend (วันคีย์)
  for(const o of ORD){ if((o.date||'').slice(0,10)!==day) continue; if(/ยกเลิก/.test(o.cancel)) continue; if(/รออนุมัติ|ปฏิเสธ|ไม่อนุมัติ/.test(o.apprStatus)) continue; if(o.qty<=0||!o.barcode) continue; selAll.push(o); }   // ตัดยกเลิก + รออนุมัติ/ปฏิเสธราคา (apprStatus จริง: อนุมัติราคา/รออนุมัติราคา/ปฏิเสธราคา) กัน allocate กินสต็อกของบิลที่ยังไม่ยืนยัน
  const swhSet=[...new Set(selAll.map(swhOf))].filter(Boolean).sort();   // คลังส่งที่มีในบิลที่เลือก
  if(WH_LOCK && swhSet.includes(WH_LOCK)) jrWh=WH_LOCK;                  // role<6 + มีคลัง → ล็อกคลังตัวเอง
  else if(!jrWh || !swhSet.includes(jrWh)){ const cnt={}; selAll.forEach(o=>{const w=swhOf(o);cnt[w]=(cnt[w]||0)+1;}); jrWh=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a])[0]||WH_LOCK||''; }   // ไม่ล็อก → default คลังส่งหลัก (role≥6 เปลี่ยนเองได้)
  const sel = jrWh ? selAll.filter(o=>swhOf(o)===jrWh) : selAll;        // จัดรถทีละคลังส่ง (รถออกจากคลังเดียว)
  const prodOf=o=>DATA.prodIdx[o.barcode]||null;
  const pkOf=o=>{const p=prodOf(o);return p?(p.codeCS||p.name):o.barcode;};
  const eaOf=o=>{const pu=parseUnit(o.unit);return o.qty*(pu.eaPer||1);};

  const ag={}; for(const o of sel){const k=swhOf(o)+'|'+pkOf(o);(ag[k]=ag[k]||[]).push(o);}
  const give={}, shortAgg={};

    const lines=ag[k], prod=prodOf(lines[0]), wh=swhOf(lines[0]);

    let left=stockEA, demand=0;
    for(const o of lines){const need=eaOf(o);demand+=need;const g=Math.max(0,Math.min(need,left));left-=g;give[o.seq]=g;}

    shortAgg[k]={wh,name:prod?cleanName(prod.short||prod.name):(lines[0].product||k),eaPerCS,demandEA:demand,stockEA,shortEA:Math.max(0,demand-stockEA),demandCS:demand/eaPerCS,stockCS:stockEA/eaPerCS,shortCS:Math.max(0,demand-stockEA)/eaPerCS,
      stores:[...new Set(lines.filter(o=>eaOf(o)>(give[o.seq]||0)+0.001).map(o=>o.store))],
      shortBaht:lines.reduce((a,o)=>{const need=eaOf(o);const sh=need-(give[o.seq]||0);return a+(need>0?o.total*sh/need:0);},0)};
  }

  const bm={};

    if(!bm[o.orderId]){ const c=matchCustomer(o.storeCode,o.wh,o.salesman);   // o.wh(โซน)=customer.WH ใช้ match ร้าน · wh ที่เก็บ=คลังส่งจริง
      bm[o.orderId]={orderId:o.orderId,store:o.store,storeCode:o.storeCode,wh:swhOf(o),zone:o.wh,salesman:o.salesman,salesmanName:(DATA.usersByCode[o.salesman]||{}).name||'',chan:roleChan(o.salesman)||(jrSource==='sheet'?'ปลีก':''),
        route:c?c.route:'',province:(o.province||(c?c.province:'')),tambonName:(o.tambonName||(c?c.tambonName:'')),amphoe:(o.amphoe||(c?c.amphoe:'')),stopSeq:c?c.stopSeq:0,lat:c?c.lat:null,lng:c?c.lng:null,phone:c?c.phone:'',addr:c?c.addr:'',type:c?c.type:'',
        keyTS:keyTSof(o),baht:0,allocBaht:0,shortBaht:0,kg:0,lm:{}}; }
    const b=bm[o.orderId],prod=prodOf(o),need=eaOf(o),g=give[o.seq]||0,pk=pkOf(o),eaPerCS=prod&&prod.qtyCS>0?prod.qtyCS:1;
    b.baht+=o.total; b.allocBaht+=need>0?o.total*g/need:0; b.shortBaht+=need>0?o.total*(need-g)/need:0; b.kg+=g*kgPerEA(prod);

    b.lm[pk].orderEA+=need; b.lm[pk].giveEA+=g;
  }
  const allBills=Object.values(bm).map(b=>{ const ls=Object.values(b.lm);
    const anyShort=ls.some(l=>l.giveEA<l.orderEA-0.001), allOut=ls.every(l=>l.giveEA<=0.001);
    b.ff=allOut?'out':anyShort?'part':'ok';
    b.shortLines=ls.map(l=>({name:l.name,eaPerCS:l.eaPerCS,shortEA:Math.max(0,l.orderEA-l.giveEA),orderCS:l.orderEA/l.eaPerCS,gotCS:l.giveEA/l.eaPerCS,shortCS:Math.max(0,l.orderEA-l.giveEA)/l.eaPerCS})).filter(l=>l.shortCS>0.001);
    return b; });
  const shortage=Object.values(shortAgg).filter(s=>s.shortCS>0.001).sort((a,b)=>b.shortBaht-a.shortBaht);
  /* ค้างส่ง (กดเก็บไว้) → ไม่ขึ้นรถ + ดึงออกจากคันถ้าเคยจัด · active (เหลือ) = จะถูกจัดส่งตามแผน (default) */
  const heldMap=jrHold||{};
  const held=allBills.filter(b=>heldMap[b.orderId]); held.forEach(b=>{ b.held=true; b.holdBy=(heldMap[b.orderId]||{}).by||''; b.holdTime=(heldMap[b.orderId]||{}).time||''; if(jrAssign[b.orderId]) delete jrAssign[b.orderId]; });
  const bills=allBills.filter(b=>!heldMap[b.orderId]);
  /* ===== จัดร้านเข้าคัน — auto-pack ตามพื้นที่ + แมนนวล (localStorage) แทน group ตามเซล (Surat: รวมพื้นที่เดียวข้ามเซลได้ ประหยัดรถ) ===== */
  jrEnsureState(bills, 'jr_v4_'+(jrWh||'')+'_'+day);   // v4 = autoPack 2-เฟส (cluster โซน→จัดรถตามยอด FFD) → ทิ้ง pack เก่า v3 ที่ค้าง localStorage
  const grps=jrTrucks.map((t,i)=>{
    const tb=bills.filter(b=>jrAssign[b.orderId]===t.id);
    const ws=tb.filter(b=>b.stopSeq>0).sort((a,b)=>a.stopSeq-b.stopSeq||a.keyTS-b.keyTS);
    const ns=nnOrder(tb.filter(b=>!(b.stopSeq>0)),depotOf(jrWh));
    const ordered=[...ws,...ns]; ordered.forEach((b,j)=>b.stop=j+1);
    const _geoStops=ordered.filter(b=>b.lat!=null);
    const _nn=_geoStops.length>=2?nnOrder(_geoStops, depotOf(jrWh)):_geoStops;   // ประเมิน span ด้วยลำดับ nearest-neighbor (สั้นสุดโดยประมาณ) ไม่ใช่ลำดับโชว์ — กัน zigzag ทำ span เกินจริง (false positive "น่าจะผิด")
    const _legs=[]; for(let _i=1;_i<_nn.length;_i++) _legs.push(haversine(_nn[_i-1],_nn[_i]));
    ordered.forEach(b=>b.geoSuspect=0); let _span=0;
    if(_legs.length){ const _sm=[..._legs].sort((a,b)=>a-b), _med=_sm[Math.floor(_sm.length/2)]||0;   // ร้านพิกัดเพี้ยน: ช่วงวิ่ง > 200กม. หรือ > median×5 (>30กม.) → ตัดออกจาก span + ติดธง (ไม่ให้ 1 ร้านเพี้ยนทำทั้งคันน่าจะผิด)
      for(let _i=0;_i<_legs.length;_i++){ const _d=_legs[_i]; if(_d>200 || (_med>0 && _d>_med*5 && _d>30)) _nn[_i+1].geoSuspect=Math.round(_d); else _span+=_d; } }
    const spanKm=_geoStops.length>=2?_span:0, noGeoCount=ordered.filter(b=>b.lat==null).length, geoSuspectN=ordered.filter(b=>b.geoSuspect>0).length;   // ระยะวิ่ง fallback (NN ร้านแรก→สุดท้าย ไม่รวม depot · ตัด leg เพี้ยน) · OSRM จะ override ตอนวาดเส้นถนน
    const totalKg=tb.reduce((a,b)=>a+b.kg,0),totalBaht=tb.reduce((a,b)=>a+b.allocBaht,0),shortBaht=tb.reduce((a,b)=>a+b.shortBaht,0),shortN=tb.filter(b=>b.ff!=='ok').length;
    return {gid:t.id,name:t.name,plate:t.plate||'',chan:t.chan,type:t.type,capKg:t.capKg||0,color:jrColor(i),wh:jrWh,
      bills:ordered,totalKg,totalBaht,shortBaht,shortN,spanKm,noGeoCount,geoSuspectN,overKg:totalKg>(t.capKg||1e9)*JR_OVER+0.001,hasGeo:tb.some(b=>b.lat!=null)};

  if((!jrSel||!grps.find(g=>g.gid===jrSel))&&grps.length){ const f=grps.find(g=>g.bills.length&&g.hasGeo)||grps.find(g=>g.bills.length); jrSel=f?f.gid:grps[0].gid; }   // default คันที่มีพิกัด (แผนที่ไม่ว่าง)
  if(jrOpenSm && !grps.find(g=>g.gid===jrOpenSm)) jrOpenSm=null;   // เปิดมา = พับทุกการ์ด (ไม่ auto-กาง · Surat กดดูเอง) · ล้างถ้าคันที่กางหายไป
  TRUCK_MODEL={wh:jrWh,whOptions:swhSet,groups:grps,unassigned,bills,held,shortage,stamp:nowStamp(),date:day,
    poolTotal, poolRemain,
    stats:{trucks:grps.filter(g=>g.bills.length).length,bills:bills.length,assigned:bills.length-unassigned.length,unassigned:unassigned.length,held:held.length,kg:grps.reduce((a,g)=>a+g.totalKg,0),baht:grps.reduce((a,g)=>a+g.totalBaht,0),shortBaht:shortage.reduce((a,s)=>a+s.shortBaht,0),noGeo:bills.filter(b=>b.lat==null).length,overCap:grps.filter(g=>g.overKg).length}};
}

function jrGroup(gid){ return (TRUCK_MODEL.groups||[]).find(g=>g.gid===gid)||null; }
function jrTruckByType(){ const m={...JR_DEFAULT_CAP}; (DATA.trucks||[]).forEach(t=>{ if(t.type) m[jrNorm(t.type)]=t.kg; }); return m; }   // default + gid0 (normalize ชื่อ) → ครอบคลุม กระบะ ที่ gid0 ไม่มี
/* จัดสรรรถให้ทุกกลุ่มจาก "จำนวนรถที่มีต่อคลัง" (global · หนักก่อน) — ใช้เกินจำนวนที่มีไม่ได้ · หมดชนิดนี้ตกไปชนิดถัดไป/รถไม่พอ
 * ส่ง→6ล้อก่อน เศษ→4ล้อจัมโบ้ · ปลีก→4ล้อจัมโบ้ · pool=null (คลังไม่มีข้อมูลจำนวนรถ) → ไม่จำกัด */
function allocFleetPool(grps, wh){
  const caps=jrTruckByType();
  const poolSrc=(DATA.truckPool||{})[String(wh||'').toUpperCase()];
  const pool = poolSrc ? {...poolSrc} : null;
  const J=caps['4ล้อจัมโบ้']||4000;
  const avail=t=> pool? (pool[t]>0) : (caps[t]>0);
  [...grps].sort((a,b)=>b.totalKg-a.totalKg).forEach(g=>{
    const fleet=[]; let rem=g.totalKg||0, guard=0; g.noTruck=false;
    const pref = g.chan==='ปลีก' ? ['4ล้อจัมโบ้','6ล้อ','10ล้อ','4ล้อ'] : ['6ล้อ','10ล้อ','4ล้อจัมโบ้','4ล้อ'];
    while(rem>0.001 && guard++<60){
      const pick = (g.chan!=='ปลีก' && fleet.length>0 && rem<=J && avail('4ล้อจัมโบ้')) ? '4ล้อจัมโบ้' : pref.find(avail);
      if(!pick){ g.noTruck=true; break; }
      if(pool) pool[pick]--;
      fleet.push(pick); rem-=(caps[pick]||0);
    }
    const capKg=fleet.reduce((a,t)=>a+(caps[t]||0),0);
    const cnt={}; fleet.forEach(t=>cnt[t]=(cnt[t]||0)+1);
    let label=Object.keys(cnt).map(t=>cnt[t]>1?`${t}×${cnt[t]}`:t).join(' + ')||'-';
    if(g.noTruck) label+=' ⚠️รถไม่พอ';
    g.fleet={fleet,capKg,label,n:fleet.length,noTruck:g.noTruck};
  });
  return pool;
}

/* ===== จัดร้านเข้าคัน — auto-pack (Surat v2.8) =====
 * พรีปลีก: 1 เซล = 1 คัน (4ล้อจัมโบ้ของตัวเอง) · ของล้นไม่แตกคัน (โชว์เกิน cap · คนปรับมือทีหลัง)
 * พรีส่ง: รวมคันพื้นที่ใกล้กัน (ตำบล>อำเภอ>≤5กม.>จังหวัดเดียว) เติมจนเต็มก่อนเปิดใหม่ · pool หมด→เปิดคัน 6ล้อ ไม่มีทะเบียน (เขียนชนิดไว้ก่อน · แผนครบ)
 * ทะเบียน: แยกจากชื่อคัน (t.plate) → สลับได้ภายหลังโดยไม่ต้องสร้างชื่อใหม่ */
function autoPack(bills){
  const caps=jrTruckByType();
  const poolSrc=(DATA.truckPool||{})[jrWh]; const pool=poolSrc?{...poolSrc}:null;
  const platesSrc=(DATA.truckPlates||{})[jrWh]; const platePool=platesSrc?Object.fromEntries(Object.entries(platesSrc).map(([k,v])=>[k,[...v]])):null;
  const trucks=[], assign={}; let tn=0, rn=0, dn=0;
  const takePlate=t=> (platePool&&platePool[t]&&platePool[t].length)?platePool[t].shift():'';
  const byChan={'ปลีก':[],'ส่ง':[]}; bills.forEach(b=>{ (b.chan==='ปลีก'?byChan['ปลีก']:byChan['ส่ง']).push(b); });

  /* --- พรีปลีก: 1 เซล = 1 คัน (4ล้อจัมโบ้) · ของล้นโชว์เกิน ไม่แตกคัน --- */
  const T_RETAIL='4ล้อจัมโบ้';
  const retailBySm={}; byChan['ปลีก'].forEach(b=>{ (retailBySm[b.salesman]=retailBySm[b.salesman]||[]).push(b); });
  Object.keys(retailBySm).sort().forEach(sm=>{
    const list=retailBySm[sm];
    if(pool && pool[T_RETAIL]>0) pool[T_RETAIL]--;
    const plate=takePlate(T_RETAIL);
    tn++; rn++; const id='T'+tn;
    const nm='ปลีก '+rn+' · '+(list[0].salesmanName||sm)+(list[0].province?' · '+list[0].province:'');
    trucks.push({id,name:nm,chan:'ปลีก',type:T_RETAIL,plate,capKg:caps[T_RETAIL]||0});
    list.forEach(b=>assign[b.orderId]=id);
  });

  /* --- พรีส่ง (v2.10): 2 เฟส — (1) รวมร้านเป็น "โซน" พื้นที่ใกล้กันแบบไม่จำกัด cap (รู้ยอด kg ก่อน) → (2) จัดรถต่อโซน: โซนหนักก่อน · เลือกรถตามยอดโซน (เล็กสุดที่ใส่คันเดียวได้ / ใส่ไม่ได้→ใหญ่สุด) · FFD ของหนักก่อน · best-fit เติมคันที่ใกล้เต็ม --- */
  const bigToSmall=['12ล้อ','10ล้อ','6ล้อ','4ล้อจัมโบ้','4ล้อ','กระบะ'];   // เรียง cap มาก→น้อย
  const dlist=byChan['ส่ง'].slice().sort((a,b)=> String(a.province).localeCompare(String(b.province))||String(a.amphoe).localeCompare(String(b.amphoe))||String(a.tambonName).localeCompare(String(b.tambonName))||(a.keyTS-b.keyTS));
  // เฟส 1: cluster เป็นโซน (ไม่จำกัด cap — แค่จับพื้นที่ใกล้กัน ตำบล>อำเภอ>≤5กม.>จังหวัด)
  const zones=[];
  for(const b of dlist){
    let bestZ=null,bestS=-1;
    for(const z of zones){
      let s=-1;
      if(b.province && z.provinces.has(b.province)){          // ★ ต้องจังหวัดเดียวกันก่อน (กันชื่ออำเภอ "เมือง"/ตำบลซ้ำข้ามจังหวัด → รถวิ่งข้ามจังหวัด)
        if(b.tambonName && z.tambons.has(b.tambonName)) s=3;
        else if(b.amphoe && z.amphoes.has(b.amphoe)) s=2;
        else s=0;
      } else if(b.lat!=null && z.stores.some(x=>x.lat!=null && haversine(x,b)<=5)) s=1;   // ข้ามจังหวัดได้เฉพาะร้านใกล้จริง ≤5กม.
      if(s>bestS){ bestS=s; bestZ=z; }
    }
    if(!bestZ && !b.province && !b.tambonName && !b.amphoe && b.lat==null) bestZ=zones[0]||null;   // ไม่มีพื้นที่/พิกัดเลย → โซนแรก
    if(bestZ){ bestZ.kg+=b.kg; bestZ.bills.push(b); bestZ.stores.push(b); bestZ.tambons.add(b.tambonName); bestZ.amphoes.add(b.amphoe); bestZ.provinces.add(b.province); }
    else zones.push({ kg:b.kg, bills:[b], stores:[b], province:b.province, amphoe:b.amphoe, tambons:new Set([b.tambonName]), amphoes:new Set([b.amphoe]), provinces:new Set([b.province]) });
  }
  // เฟส 2: โซนหนักก่อน → จัดรถ (โซนหนักจองรถใหญ่ก่อน · pool แชร์กัน)
  zones.sort((a,b)=> b.kg-a.kg);
  const availTypes=()=> bigToSmall.filter(t=> pool? pool[t]>0 : caps[t]>0);
  const takeTypeFor=remain=>{   // เปิดคันใหม่ให้ "เต็มที่สุด": single=คันเล็กสุดที่ใส่ remain หมด · bulk=คันใหญ่สุดที่ cap ≤ remain (เติมเต็ม 100-120%) · เลือก single ถ้าเติมได้ ≥40% (1คัน) ไม่งั้น bulk แล้วเศษลงคันถัดไป (กันรถใหญ่ใส่ของนิดเดียว) · pool หมด→6ล้อ placeholder
    const avail=availTypes(); if(!avail.length) return {type:'6ล้อ',plate:''};
    const single=[...avail].reverse().find(t=> caps[t]*JR_OVER >= remain-0.001);
    const bulk=avail.find(t=> caps[t] <= remain+0.001);
    let pick;
    if(!single) pick=bulk||avail[0];                                 // remain ใหญ่กว่าทุกคัน → คันใหญ่สุด เฉือน
    else if(!bulk) pick=single;                                      // remain เล็กกว่าทุก cap → คันเล็กสุดที่ใส่ได้
    else pick=(remain >= caps[single]*0.4) ? single : bulk;          // single เติม ≥40% → 1คัน · ต่ำกว่า → bulk เติมเต็มกว่า
    if(pool) pool[pick]--;
    return {type:pick, plate:takePlate(pick)};
  };
  for(const z of zones){
    const items=z.bills.slice().sort((a,b)=> b.kg-a.kg);   // FFD: หนัก→เบา
    let zoneRemain=items.reduce((s,x)=>s+x.kg,0);
    const ztrucks=[];   // คันของโซนนี้
    for(const b of items){
      let bestT=null,bestRoom=Infinity;   // best-fit: คันที่เหลือที่ว่างน้อยสุดแต่ยังใส่ได้ (อัดให้เต็ม)
      for(const t of ztrucks){ const room=t.capKg*JR_OVER - t.kg; if(b.kg<=room+0.001 && room<bestRoom){ bestRoom=room; bestT=t; } }
      if(bestT){ bestT.kg+=b.kg; bestT.stores.push(b); assign[b.orderId]=bestT.id; zoneRemain-=b.kg; continue; }
      const tk=takeTypeFor(zoneRemain);   // คันใหม่ ขนาดตามยอดที่เหลือของโซน
      tn++; dn++; const id='T'+tn;
      const nm='คัน '+dn+' · ส่ง'+(z.province?' · '+z.province:'')+(z.amphoe?' '+z.amphoe:'');
      const t={id,name:nm,chan:'ส่ง',type:tk.type,plate:tk.plate,capKg:caps[tk.type]||0,kg:b.kg,stores:[b]};
      ztrucks.push(t); trucks.push(t); assign[b.orderId]=id; zoneRemain-=b.kg;
    }
  }
  return { trucks:trucks.map(t=>({id:t.id,name:t.name,chan:t.chan,type:t.type,plate:t.plate,capKg:t.capKg})), assign };
}
function jrSaveState(){ try{ localStorage.setItem(jrKey, JSON.stringify({trucks:jrTrucks,assign:jrAssign,seq:jrManualSeq})); }catch(e){} }   // localStorage = อยู่เครื่อง ไม่พึ่งเน็ต · เน็ตหลุดข้อมูลจัดไม่หาย (รีโหลดได้ถ้าบิลโหลดกลับมา)
function jrLoadState(key){ try{ return JSON.parse(localStorage.getItem(key)||'null'); }catch(e){ return null; } }
function jrEnsureState(bills, key){
  if(jrKey===key) return;   // คลัง/วันเดิม → ใช้ state ที่อยู่ในหน่วยความจำ
  jrKey=key;
  const saved=jrLoadState(key);
  if(saved && Array.isArray(saved.trucks) && saved.trucks.length){
    jrTrucks=saved.trucks; jrAssign=saved.assign||{};
    jrManualSeq=Math.max(saved.seq||0, jrTrucks.reduce((mx,t)=>{ const m=/^M(\d+)$/.exec(t.id||''); return m?Math.max(mx,+m[1]):mx; },0));   // กัน M-id ชนหลัง reload (seq reset เป็น 0)
  }
  else { const r=autoPack(bills); jrTrucks=r.trucks; jrAssign=r.assign; jrSaveState(); }
}
function jrNewTruckObj(label){ jrManualSeq++; const cap=jrTruckByType(); return {id:'M'+jrManualSeq, name:(label||'คันใหม่')+' '+jrManualSeq, plate:'', chan:'', type:'6ล้อ', capKg:cap['6ล้อ']||5000}; }
function jrAssignStore(oid,val){

function jrPackAuto(){ if(!confirm('จัดรถอัตโนมัติใหม่ตามพื้นที่? (ทับการจัดด้วยมือทั้งหมดของวัน/คลังนี้)')) return; const r=autoPack((TRUCK_MODEL&&TRUCK_MODEL.bills)||[]); jrTrucks=r.trucks; jrAssign=r.assign; jrSaveState(); buildTrucks(); renderTruckTab(); }

/* ทะเบียนรถต่อคัน (Surat v2.8): auto จาก vehi_detail · เลือกทะเบียนที่ "คันอื่นถืออยู่" = สลับทะเบียนกัน · รถไม่พอ→ว่าง (โชว์ชนิดไว้ก่อน) */
function jrPlateDropdown(g){
  const wh=g.wh||(TRUCK_MODEL&&TRUCK_MODEL.wh)||'', type=g.type||'';

  </div>`;
  if(M.poolTotal) h+=jrPoolBar(M);
  if(!M.bills.length){ p.innerHTML=h+`<div class="empty">ไม่มีบิล (sales order) วันคีย์ ${esc(M.date||_today)} (คลังส่ง ${esc(M.wh||'-')}) — เปลี่ยนวัน/คลัง · (ตัดบิลยกเลิก/รออนุมัติ/ปฏิเสธราคาออกแล้ว)</div>`; return; }
  if(jrShortOpen) h+=jrShortageHtml();

  const showTruck=g=> jrFilterChan==='all' || g.chan===jrFilterChan || (jrFilterChan==='ส่ง'&&!g.chan);

    <div class="jr-pane jr-right">${jrRightPane(M, unF)}</div>
