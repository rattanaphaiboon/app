<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Picker v1.19</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{
  --navy:#0d1b3e; --navy2:#13245a; --gold:#c9a84c; --green:#16a34a;
  --bg:#f4f6fb; --card:#fff; --border:#e2e7f0; --muted:#64748b;
  --text:#1e293b; --ok:#15803d; --red:#dc2626;
  --w1:#FBBF24; --w2:#0EA5E9; --w3:#EF4444; --w4:#15803D; --c4:#4ADE80;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Sarabun',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px}
button{font-family:inherit;cursor:pointer}

header.appbar{background:var(--navy);color:#fff;padding:12px 18px;display:flex;align-items:center;gap:12px}
header.appbar .title{font-weight:700;font-size:17px;display:flex;align-items:center;gap:8px}
header.appbar .ver{background:var(--gold);color:var(--navy);font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px}
header.appbar .hub-btn{background:var(--gold);color:var(--navy);border:none;border-radius:8px;padding:7px 12px;font-weight:700;font-size:13px;display:flex;align-items:center;gap:5px;text-decoration:none}
header.appbar .hub-btn:hover{background:#d9bd6a}

.demo-banner{background:#fffbeb;border-bottom:2px solid var(--gold);padding:10px 18px;font-size:13px}
.demo-banner b{color:var(--navy)}
.demo-banner code{background:#fff;border:1px solid var(--border);border-radius:5px;padding:1px 6px;font-size:12px;font-family:ui-monospace,monospace}

.filterbar{background:var(--card);border-bottom:1px solid var(--border);padding:10px 18px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;box-shadow:0 2px 8px rgba(0,0,0,.04);position:sticky;top:0;z-index:20}
.chipgrp{display:flex;gap:4px;align-items:center}
.chipgrp .lbl{font-size:11px;color:var(--muted);font-weight:700;margin-right:2px}
.chip{background:#eef1f7;border:none;border-radius:20px;padding:6px 13px;font-size:13px;font-weight:600;color:#475569;cursor:pointer;white-space:nowrap;font-family:inherit}
.chip:hover{background:#e2e7f0}
.chip.on{background:var(--navy);color:#fff}
input[type=text],input[type=date],select{font-family:inherit;font-size:14px;padding:7px 12px;border:1.5px solid var(--border);border-radius:8px;background:#fff;outline:none;min-width:120px}
input:focus,select:focus{border-color:var(--gold)}
.btn-load{background:var(--navy);color:#fff;border:none;border-radius:8px;padding:8px 16px;font-weight:600;font-size:14px;height:38px}
.btn-load:hover{background:var(--navy2)}
.btn-export{background:linear-gradient(135deg,var(--green),#15803d);color:#fff;border:none;border-radius:8px;padding:8px 18px;font-weight:700;font-size:14px;height:38px;display:flex;align-items:center;gap:6px}
.btn-export:hover{filter:brightness(1.05)}
.btn-export:disabled{opacity:.5;cursor:not-allowed}

.wrap{padding:16px 18px;max-width:1500px;margin:0 auto}
.tiles{display:flex;gap:8px;margin-bottom:16px;overflow-x:auto;padding-bottom:2px}
.tile{flex:1 1 0;min-width:100px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:9px 12px;white-space:nowrap}
.tile .v{font-size:18px;font-weight:700;color:var(--navy)}
.tile .l{font-size:11px;color:var(--muted);margin-top:1px}
.tile.ok .v{color:var(--ok)}

.tabs{display:flex;gap:4px;border-bottom:2px solid var(--border);margin-bottom:14px;flex-wrap:wrap}
.tab{background:none;border:none;padding:9px 16px;font-size:14px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px;cursor:pointer;font-family:inherit}
.tab.active{color:var(--navy);border-bottom-color:var(--gold)}
.tab-badge{display:inline-block;background:#e2e8f0;color:#475569;font-size:11px;font-weight:700;padding:1px 8px;border-radius:20px;margin-left:4px;min-width:20px;text-align:center}
.tab.active .tab-badge{background:var(--navy);color:#fff}
.panel{display:none}
.panel.active{display:block}

.row-sel{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.tbl-wrap{overflow:auto;max-height:calc(100vh - 340px);background:var(--card);border:1px solid var(--border);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--border)}
th{background:#f8fafc;color:var(--navy);font-weight:600;position:sticky;top:0;z-index:5;font-size:12px}
tr:hover td{background:#fbfcff}
td.num,#panel-orders td.num{text-align:center;font-variant-numeric:tabular-nums}
.cut-row td{background:#fff7ed;opacity:.75}
.note{font-size:12px;color:var(--muted);margin:6px 2px}
.empty{text-align:center;padding:40px;color:var(--muted)}

.schema-box{background:var(--card);border:1.5px solid var(--gold);border-radius:12px;padding:14px 18px;margin:14px 0}
.schema-box h3{color:var(--navy);font-size:15px;margin-bottom:8px}
.schema-box pre{background:#0f172a;color:#e2e8f0;padding:12px 14px;border-radius:8px;overflow:auto;font-size:12px;line-height:1.6;font-family:ui-monospace,monospace}
.schema-box code{background:#f1f5f9;padding:1px 6px;border-radius:4px;font-size:12px;font-family:ui-monospace,monospace}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 20px;border-radius:10px;z-index:80;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.3);display:none}

/* v1.6 Login screen — Google Sign-In · เฉพาะ @rattanaphaiboon.com */
#loginScreen{position:fixed;inset:0;background:linear-gradient(160deg,var(--navy),#1e3a8a);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.login-card{background:#fff;border-radius:18px;padding:34px 28px;max-width:400px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.login-logo{width:64px;height:64px;border-radius:16px;background:var(--navy);color:var(--gold);display:flex;align-items:center;justify-content:center;font-size:30px;margin:0 auto 14px;font-weight:700}
.login-card h1{font-size:20px;color:var(--navy);margin-bottom:4px}
.login-card .sub{color:var(--muted);font-size:13px;margin-bottom:22px}
.login-card .dom-hint{background:#eff6ff;color:#1e40af;border:1px solid #bfdbfe;border-radius:8px;padding:8px 12px;font-size:12px;margin-bottom:16px}
#googleSignInBtn{display:flex;justify-content:center;margin-bottom:14px}
#loginError{display:none;background:#fef2f2;color:var(--red);border:1px solid #fecaca;border-radius:10px;padding:10px;font-size:13px;margin-top:12px;text-align:left}
#loginSpinner{display:none;margin-top:14px;color:var(--muted)}
.login-ver{margin-top:16px;color:var(--muted);font-size:12px}
.who-box{display:flex;align-items:center;gap:8px;font-size:12px;color:#cbd5e1}
.logout-link{color:var(--gold);cursor:pointer;text-decoration:underline;font-weight:600}
</style>
</head>
<body>

<!-- v1.6: LOGIN SCREEN (Google Sign-In · เฉพาะเมล @rattanaphaiboon.com) -->
<div id="loginScreen">
  <div class="login-card">
    <div class="login-logo">📦</div>
    <h1>Order Picker</h1>
    <div class="sub">รัตนไพบูลย์ · ดึงออเดอร์จาก Supabase</div>
    <div class="dom-hint">🔒 เข้าใช้ได้เฉพาะบัญชีที่ลงทะเบียนใน Users Sheet</div>
    <div id="googleSignInBtn"></div>
    <div id="loginSpinner">⏳ กำลังเข้าสู่ระบบ…</div>
    <div id="loginError"></div>
    <div class="login-ver">เวอร์ชัน v1.19</div>
  </div>
</div>

<div id="app" style="display:none">

<header class="appbar">
  <div class="title">📦 Order Picker <span class="ver">v1.19</span></div>
  <div style="flex:1"></div>
  <span class="who-box">👤 <b id="whoEmail" style="color:#fff">-</b> <span class="logout-link" onclick="logout()">ออกจากระบบ</span></span>
  <button class="hub-btn" onclick="reload()" title="โหลดใหม่จาก Supabase" style="background:#1e3a8a;color:#fff;padding:7px 10px">🔄</button>
  <a class="hub-btn" href="index.html">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg> Hub
  </a>
</header>
<!-- v1.7: srcStatus ซ่อนไว้ (ไม่มี banner แล้ว) — error/warn เด้ง toast แทน · #srcStatus/#srcBanner ให้ setSrcStatus อ้างได้โดยไม่พัง -->
<span id="srcStatus" style="display:none"></span><span id="srcBanner" style="display:none"></span>

<div class="filterbar">
  <div class="chipgrp" id="dateChips">
    <span class="lbl">วัน</span>
    <button class="chip" data-d="t" onclick="setDate('t')">วันนี้</button>
    <button class="chip" data-d="y" onclick="setDate('y')">-1วัน</button>
    <button class="chip" data-d="d2" onclick="setDate('d2')">-2วัน</button>
    <button class="chip" data-d="all" onclick="setDate('all')">ทุกวัน</button>
  </div>
  <div class="chipgrp" id="roleChips">
    <span class="lbl">ประเภท</span>
    <button class="chip" data-r="all" onclick="setRole('all')">ทั้งหมด</button>
    <button class="chip" data-r="ROO" onclick="setRole('ROO')" style="background:#f3e8ff;color:#6b21a8">ROO</button>
    <button class="chip" data-r="ปลีก" onclick="setRole('ปลีก')">ปลีก</button>
    <button class="chip" data-r="ส่ง" onclick="setRole('ส่ง')">ส่ง</button>
  </div>
  <div class="chipgrp" id="whChips">
    <span class="lbl">คลัง</span>
    <button class="chip" data-w="all" onclick="setWh('all')">ทั้งหมด</button>
    <button class="chip" data-w="W1" onclick="setWh('W1')">W1</button>
    <button class="chip" data-w="W2" onclick="setWh('W2')">W2</button>
    <button class="chip" data-w="W3" onclick="setWh('W3')">W3</button>
    <button class="chip" data-w="W4" onclick="setWh('W4')">W4</button>
  </div>
  <div class="chipgrp" id="deliverChips">
    <span class="lbl">รูปแบบส่ง</span>
    <button class="chip on" data-dl="all" onclick="setDeliver('all')">ทั้งหมด</button>
    <button class="chip" data-dl="pickup" onclick="setDeliver('pickup')">🏠 รับเอง</button>
    <button class="chip" data-dl="deliver" onclick="setDeliver('deliver')">🚚 ส่งถึงร้าน</button>
  </div>
  <input type="text" id="fStore" placeholder="🔍 ร้าน/สินค้า" style="min-width:160px">
  <div style="flex:1"></div>
  <button class="btn-export" id="exportBtn" onclick="exportXlsx()">⬇️ Export Excel (bplus)</button>
</div>

<div class="wrap">
  <div class="tiles" id="tiles"></div>

  <div class="tabs">
    <button class="tab active" data-tab="bills" onclick="switchTab('bills')">☑️ เลือกบิล <span id="tabPendingCount" class="tab-badge">0</span></button>
    <button class="tab" data-tab="done" onclick="switchTab('done')">📥 นำเข้าแล้ว <span id="tabDoneCount" class="tab-badge">0</span></button>
    <button class="tab" data-tab="orders" onclick="switchTab('orders')">📋 ใบจองสินค้า (รายบรรทัด)</button>
    <button class="tab" data-tab="schema" onclick="switchTab('schema')">📐 Schema Supabase</button>
  </div>

  <div class="panel active" id="panel-bills"></div>
  <div class="panel" id="panel-done"></div>
  <div class="panel" id="panel-orders"></div>
  <div class="panel" id="panel-schema"></div>
</div>

</div><!-- /#app -->

<div class="toast" id="toast"></div>

 * สร้าง 2 map: DOC_BOOKS(รหัส→เล่ม) + NAME_INFO(ชื่อ→{รหัส,เล่ม}) สำหรับจับ ROH→HS จริงด้วยชื่อ */
const DATACENTER_GID = '467187215';
async function loadDocBooks(){
  try{
    const url = `https://docs.google.com/spreadsheets/d/${CUSTOMER_SHEET_ID}/gviz/tq?gid=${DATACENTER_GID}&headers=1&tq=${encodeURIComponent('select AM, AN, AP')}`;
    const txt = await (await fetch(url)).text();
    const json = JSON.parse(txt.replace(/^[\s\S]*?setResponse\(/,'').replace(/\);?\s*$/,''));
    const map = {}, byName = {};
    for(const r of ((json.table&&json.table.rows)||[])){
      const c=r.c||[], code=c[0]&&c[0].v, name=c[1]&&c[1].v, book=c[2]&&c[2].v;
      const k = String(code||'').trim().toUpperCase();
      if(k && book) map[k] = String(book).trim();
      const nk = normName(name);
      if(nk && k && !byName[nk]) byName[nk] = { code:k, book: book?String(book).trim():'' };   // first-win ต่อชื่อ
    }
    DOC_BOOKS = map; NAME_INFO = byName;
    console.log('[docBooks] Data Center:', Object.keys(map).length, 'เล่ม ·', Object.keys(byName).length, 'ชื่อ');
  }catch(e){ console.warn('[docBooks] โหลดเล่มไม่ได้ (ข้าม · จะขึ้น NA-<รหัส>)', e); }
}
/* v1.18: รหัสเซลตัวจริง — ส่ง(ROH) แปลงเป็นรหัส HS จริงด้วยชื่อ · อื่นใช้รหัสเดิม */
function realSalesman(o){
  const orig = String(o.salesman||'').trim().toUpperCase();
  if(chanOf(o)!=='ส่ง') return orig;
  const info = NAME_INFO[normName(o.name)];
  return (info && info.code) ? info.code : orig;
}
/* badge วันส่ง (สีม่วงอ่อน · '—' ถ้าไม่เจอ/ชีทไม่กรอก) */
function dayBadge(store){
  const d = dayOfStore(store);
  if(!d) return '<span style="color:var(--muted);font-size:11px">—</span>';
  return `<span title="วันส่งจากชีท Customer" style="background:#eef2ff;color:#3730a3;font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;white-space:nowrap">🚚 ${esc(d)}</span>`;
}

/* ค่าคอลัมน์ที่ทน key เพี้ยน (ชื่อไทย/eng/case ต่าง) */
function pick(r, keys){ for(const k of keys){ const v=r[k]; if(v!==undefined && v!==null && v!=='') return v; } return ''; }

/* v1.7: เอาเฉพาะบิลที่ "อนุมัติ" แล้วเท่านั้น — ตัด รออนุมัติ / ไม่อนุมัติ / ปฏิเสธ / ว่าง ออก
 * (ยังไม่ยืนยัน = ห้ามดึงมา Export) · ระวังคำไทยซ้อน: "รออนุมัติ"/"ไม่อนุมัติ" ก็มีคำว่า "อนุมัติ" */
function isApproved(s){
  s = String(s||'').trim();
  if(!s) return false;                                       // ว่าง = ยังไม่ยืนยัน → ไม่เอา
  if(/รอ|ไม่|ปฏิเสธ|reject|pending/i.test(s)) return false;  // กัน "รออนุมัติ"/"ไม่อนุมัติ"/"ปฏิเสธ"
  return /อนุมัติ|approve/i.test(s);                          // ต้องมีคำ "อนุมัติ"
}

/* Normalize 1 row → shape ที่แอปใช้ */
function normalizeRow(r, i, srcTable){
  const src = (typeof srcTable==='string' && srcTable) ? srcTable : 'roo';   // 'roo' = roo_sales · 'special' = roo_special_sales
  return {
    seq: i,
    srcTable: src,
    id: pick(r,['id']),   // v1.11: PK ต่อบรรทัด (ASCII) → ใช้ PATCH เจาะจงบรรทัดที่อนุมัติเท่านั้น
    date: String(pick(r,['วัน','date','order_date'])||'').slice(0,10),
    time: String(pick(r,['เวลา','time'])||''),
    name: String(pick(r,['ชื่อ-สกุล','ชื่อ - สกุล','salesman_name','name'])||''),
    salesman: String(pick(r,['รหัสเซลล์','salesman_code','SLMN_CODE'])||'').trim(),
    wh: String(pick(r,['คลัง','wh','warehouse'])||'').trim(),

/* ============================================================
   loadOrders — Supabase REST · fallback mock
   ============================================================ */
async function loadOrders(){
  if(USE_MOCK){
    setSrcStatus('🧪 ใช้ mock data (USE_MOCK=true)', 'warn');
    return MOCK_ROWS.filter(r=> !/ยกเลิก/.test(r['ยกเลิก']||''))
                    .filter(r=> isApproved(r['สถานะอนุมัติ']))
                    .map(normalizeRow);
  }
  try{
    // v1.7: ยิง 2 ตารางพร้อมกัน — roo_sales (=ROO) + roo_special_sales (=ปลีก/ส่ง)
    // v1.2 note: PostgREST parse ชื่อคอลัมน์ไทยใน URL ไม่ได้ → ยิงแค่ select=* + limit · filter/sort ฝั่ง client
    const H = {'apikey':SUPABASE_ANON,'Authorization':'Bearer '+SUPABASE_ANON,'Prefer':'count=exact'};
    const [rRoo, rSpec] = await Promise.all([
      fetch(`${SUPABASE_URL}/rest/v1/roo_sales?select=*&limit=5000`, {headers:H}),
      fetch(`${SUPABASE_URL}/rest/v1/roo_special_sales?select=*&limit=5000`, {headers:H}).catch(()=>null)
    ]);
    if(!rRoo.ok){ throw new Error('roo_sales HTTP '+rRoo.status+' '+rRoo.statusText); }
    const rowsRoo = await rRoo.json();
    if(!Array.isArray(rowsRoo)){ throw new Error('roo_sales response ไม่ใช่ array — '+JSON.stringify(rowsRoo).slice(0,120)); }
    let rowsSpec = [];
    if(rSpec && rSpec.ok){ try{ const j = await rSpec.json(); if(Array.isArray(j)) rowsSpec = j; }catch(_){ /* special อ่านไม่ได้ = ข้าม */ } }

    if(rowsRoo.length===0 && rowsSpec.length===0){
      // Supabase ตอบ 200 แต่ 0 rows → RLS ปิด anon
      setSrcStatus('ต่อ Supabase ได้ แต่ได้ 0 แถว — RLS block anon · ไปแท็บ 📐 Schema เพื่อเปิด policy', 'warn');
      return MOCK_ROWS.filter(r=> !/ยกเลิก/.test(r['ยกเลิก']||''))
                      .filter(r=> isApproved(r['สถานะอนุมัติ']))
                      .map((r,i)=>normalizeRow(r,i,'roo'));
    }

    // ล้าง (ยกเลิก/รออนุมัติ/ปฏิเสธ) + normalize + ติด srcTable
    const clean = (rows, src) => rows
      .filter(r=> !/ยกเลิก/.test(String(r['ยกเลิก']||'')))
      .filter(r=> isApproved(r['สถานะอนุมัติ']))
      .map((r,i)=> normalizeRow(r, i, src));

    // Filter/sort ฝั่ง client — เอา 30 วันล่าสุด, sort desc (ทำเองเพราะ URL param ไทยพัง)
    const from = dateMinus(todayBKK(), 30);
    const all = [...clean(rowsRoo,'roo'), ...clean(rowsSpec,'special')]
      .filter(r=> r.date >= from)
      .sort((a,b)=> b.date.localeCompare(a.date) || String(b.time||'').localeCompare(String(a.time||'')));
    all.forEach((r,i)=> r.seq=i);   // re-seq ทั่วทั้ง 2 ตาราง (กัน seq ซ้ำข้ามตาราง)
    setSrcStatus(`✅ Supabase · ${all.length.toLocaleString()} แถว (ROO ${rowsRoo.length} + พิเศษ ${rowsSpec.length} · 30 วันล่าสุด)`, 'ok');
    return all;
  }catch(e){
    console.error('[Supabase] loadOrders failed', e);
    setSrcStatus(`❌ Supabase error: ${esc(e.message||e)} — ใช้ mock ชั่วคราว`, 'err');
    return MOCK_ROWS.filter(r=> !/ยกเลิก/.test(r['ยกเลิก']||''))
                    .filter(r=> isApproved(r['สถานะอนุมัติ']))
                    .map(normalizeRow);
  }
}

function setSrcStatus(html, level){

  // v1.7: ไม่มี banner แล้ว — ok=log เฉย ๆ · err/warn เด้ง toast (ตัด HTML ออกก่อน)
  const txt = String(html||'').replace(/<[^>]+>/g,'');

/* v1.6: getAdmin คืนอีเมลของ user ที่ login ผ่าน Google → ไม่ต้อง prompt · ไม่ต้อง localStorage แยก */
function getAdmin(){ return (currentUser && currentUser.email) || ''; }
function nowBKK(){
  const parts = new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Bangkok',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date());
  // "09/07/2026, 15:23" → {date:"2026-07-09", time:"15:23"}
  const [d,t] = parts.split(', ');
  const [dd,mm,yy] = d.split('/');
  return {date:`${yy}-${mm}-${dd}`, time:t};
}

/* Supabase PATCH — orderId=in.(a,b,c) filter · ต้องมี GRANT UPDATE ให้ anon ก่อน (SQL อยู่ในแท็บ Schema)
 * v1.6: เพิ่ม console.log ทุกขั้น + retry แบบ eq. ต่อ orderId ถ้า in.() ได้ 0 rows (edge case) */
async function markDoneSupabase(ids, admin, table, col){
  table = table || 'roo_sales';   // v1.9: roo_sales หรือ roo_special_sales ตามที่มาของบิล
  col = col || 'id';              // v1.11: มาร์คด้วย id (เจาะบรรทัดอนุมัติ) แทน orderId (ที่โดนทุกบรรทัดรวม 'ไม่อนุมัติ')
  console.log('[markDone] เรียกด้วย', {table, col, ids, admin, WRITE_STATUS});
  if(!WRITE_STATUS || !ids || !ids.length) return {ok:false, n:0, skipped:true};
  const {date, time} = nowBKK();
  const payload = { 'สถานะจัด':'จัดแล้ว', 'แอดมินจัด':admin||'', 'วันสั่งจัด':date, 'เวลาสั่งจัด':time };
  const filter = col+'=in.('+ids.map(v=>encodeURIComponent(v)).join(',')+')';
  const url = `${SUPABASE_URL}/rest/v1/${table}?${filter}`;
  console.log('[markDone] PATCH →', url); console.log('[markDone] payload →', payload);
  try{
    const res = await fetch(url, {
      method:'PATCH',
      headers:{'apikey':SUPABASE_ANON,'Authorization':'Bearer '+SUPABASE_ANON,'Content-Type':'application/json','Prefer':'return=representation'},
      body: JSON.stringify(payload)
    });
    console.log('[markDone] response status', res.status);
    if(!res.ok){ const t=await res.text(); console.error('[markDone] ❌ error body:', t); return {ok:false, n:0, err:`HTTP ${res.status}: ${t.slice(0,140)}`}; }
    const rows = await res.json();
    console.log('[markDone] ✅ updated', rows.length, 'rows');
    if(!rows.length){ return {ok:false, n:0, err:'ไม่มี row ตรงกับ orderIds (filter/data mismatch)'}; }
    return {ok:true, n: rows.length};
  }catch(e){ console.error('[markDone] fetch failed:', e); return {ok:false, n:0, err:e.message||String(e)}; }
}

/* Google Sheets — POST ไป Apps Script webhook (no-cors → เชื่อว่าเขียนสำเร็จ) */
async function markDoneGAS(orderIds, admin){
  if(!GAS_URL || !orderIds || !orderIds.length) return {ok:false, n:0, skipped:true};
  try{
    await fetch(GAS_URL, {
      method:'POST',
      mode:'no-cors',   // Apps Script ไม่ส่ง CORS header
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({action:'markDone', orderIds, by:admin||''})
    });
    return {ok:true, n:orderIds.length};   // no-cors อ่าน response ไม่ได้ · ถือว่าสำเร็จ
  }catch(e){ return {ok:false, n:0, err:e.message||String(e)}; }
}

/* v1.11: รับ lines (บรรทัดที่อนุมัติแล้วเท่านั้น = อยู่ใน DATA_ORDERS) → PATCH ด้วย id แยกตาราง
 * (เดิม PATCH ด้วย orderId ทำให้บรรทัด 'ไม่อนุมัติ' ที่ orderId เดียวกันโดนมาร์ค 'จัดแล้ว' ไปด้วย) */
async function markDoneAfterExport(lines){
  if(!WRITE_STATUS || !lines || !lines.length) return;
  const admin = getAdmin();
  if(!admin){ alert('⚠️ ยังไม่ได้เข้าสู่ระบบ (ไม่มีอีเมล)\n\nExcel ดาวน์โหลดเรียบร้อยแล้ว\nแต่ระบบข้ามการมาร์ค "จัดแล้ว" ใน Supabase'); return; }
  const okId = v => v!=null && v!=='';
  const rooIds     = [...new Set(lines.filter(l=>l.srcTable!=='special').map(l=>l.id).filter(okId))];
  const specIds    = [...new Set(lines.filter(l=>l.srcTable==='special').map(l=>l.id).filter(okId))];
  const allOrderIds= [...new Set(lines.map(l=>l.orderId))];   // GAS (Google Sheets) ยังมาร์คด้วย orderId
  const [srRoo, srSpec, gr] = await Promise.all([
    rooIds.length  ? markDoneSupabase(rooIds,  admin, 'roo_sales',         'id') : Promise.resolve({ok:false,n:0,skipped:true}),
    specIds.length ? markDoneSupabase(specIds, admin, 'roo_special_sales', 'id') : Promise.resolve({ok:false,n:0,skipped:true}),
    markDoneGAS(allOrderIds, admin)
  ]);
  const okN  = (srRoo.ok?srRoo.n:0) + (srSpec.ok?srSpec.n:0);
  const errs = [srRoo.err && ('roo_sales: '+srRoo.err), srSpec.err && ('roo_special_sales: '+srSpec.err)].filter(Boolean);
  const parts = [];
  if(okN) parts.push(`✅ Supabase ${okN} บรรทัด`);
  if(errs.length) parts.push('❌ '+errs.join(' · '));
  if(gr.ok) parts.push(`✅ GS ${gr.n}`);
  else if(gr.err) parts.push(`⚠️ GS: ${gr.err}`);
  else if(gr.skipped) parts.push(`⏸ GS: ยังไม่ตั้ง GAS_URL`);
  if(parts.length) toast(parts.join(' · '));
  if(srRoo.ok || srSpec.ok){ DATA_ORDERS = await loadOrders(); render(); }   // reload → บิลย้ายไป tab นำเข้าแล้ว + รันเลขต่อเนื่อง
  if(errs.length){ alert('❌ มาร์ค "จัดแล้ว" ไม่สำเร็จบางส่วน\n\n'+errs.join('\n')+'\n\nExcel ดาวน์โหลดเรียบร้อยแล้ว\n\n⚠️ ถ้าขึ้น "0 rows" ของ roo_special_sales = RLS เปิดอยู่แต่ไม่มี policy UPDATE\n→ Supabase SQL Editor รัน: ALTER TABLE public.roo_special_sales DISABLE ROW LEVEL SECURITY;\n(SQL เต็มอยู่ในแท็บ 📐 Schema)'); }
}

/* ============================================================
   STATE + HELPERS
   ============================================================ */
let DATA_ORDERS = [];
let selectedBills = new Set();
let dateSel = new Set();
let _dateMode = 't';
let fRole='all', fWh='all', fDeliver='all';   // v1.16: fDeliver = all/pickup(รับเอง)/deliver(ส่งถึงร้าน)

function todayBKK(){ return today; }
function dateMinus(iso,n){ const d=new Date(iso+'T12:00:00Z'); d.setUTCDate(d.getUTCDate()-n); return d.toISOString().slice(0,10); }
function toBuddhistDMY(iso){ const [y,m,d]=String(iso).split('-'); return `${d}/${m}/${(+y)+543}`; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.style.display='block'; setTimeout(()=>t.style.display='none',2500); }
function shipWh(o){ return String(o.whSend1||o.wh||'').trim().toUpperCase(); }
function keyTSof(o){ const base=Date.parse(o.date+'T00:00:00')||0; const m=String(o.time||'').match(/(\d{1,2})[:.](\d{2})/); return base+(m?(+m[1])*3600000+(+m[2])*60000:0); }   /* v1.16: รับเวลาแบบ 11.03 (จุด) ด้วย ไม่ใช่แค่ 11:03 → เรียงเวลาได้ */
function roleLabel(r){ return r==='ROO'?'ROO':r===4?'ส่ง':r===3?'ปลีก':'R'+r; }
/* ROO order = บิลจากแอป ROO (ลูกค้าสั่งเองผ่าน LINE)
 * ตรวจจับด้วย 3 signal (any hit): (1) รหัสเซลล์ ว่าง (2) ชื่อ-สกุล ลงท้าย "(ROO)" (3) orderId ขึ้นต้น "OR" (เช่น ORD...) */
function isROO(o){
  if(!o) return false;
  if(!String(o.salesman||'').trim()) return true;
  if(/\(ROO\)/i.test(String(o.name||''))) return true;
  if(/^OR/i.test(String(o.orderId||''))) return true;
  return false;
}
/* v1.7: ประเภทตาม prefix รหัสเซล — PM→ปลีก · HS→ส่ง · RO→ROO (แก้ mapping ที่นี่ที่เดียว) */
const CHAN_PREFIX = { 'PM':'ปลีก', 'HS':'ส่ง', 'RO':'ROO' };
/* หา "ประเภท" (chan) ของบิล: ROO / ปลีก / ส่ง / '' */
function chanOf(o){
  const code = String(o.salesman||'').trim().toUpperCase();
  // v1.17: เซล HS (ร้านส่ง) = ขึ้นต้น "HS" หรือมี "H" เป็นตัวที่ 3 (เช่น ROH = HS ที่แปลงมาเป็น ROO) → ส่ง
  if(code.slice(0,2)==='HS' || code[2]==='H') return 'ส่ง';
  // ที่เหลือยึดรหัสเซล — PM→ปลีก · RO→ROO
  const c = CHAN_PREFIX[code.slice(0,2)];
  if(c) return c;
  // ไม่เข้า prefix ชัด → สัญญาณ ROO (ตาราง roo_sales / ชื่อ (ROO) / orderId OR / รหัสเซลว่าง)
  if(o.srcTable==='roo' || isROO(o)) return 'ROO';
  return '';
}

/* ============================================================
   FILTER CHIPS
   ============================================================ */
function setDate(mode){
  _dateMode = mode;
  const dayIso = mode==='t'?today : mode==='y'?yesterday : mode==='d2'?dateMinus(today,2) : null;
  if(dayIso){ if(dateSel.has(dayIso)) dateSel.delete(dayIso); else dateSel.add(dayIso); }
  else if(mode==='all'){ dateSel.clear(); }
  refreshDateChips(); render();
}
function refreshDateChips(){
  document.querySelectorAll('#dateChips .chip').forEach(c=>{
    const d=c.dataset.d; let on=false;
    if(d==='t') on=dateSel.has(today);
    else if(d==='y') on=dateSel.has(yesterday);
    else if(d==='d2') on=dateSel.has(dateMinus(today,2));
    else if(d==='all') on=!dateSel.size;
    c.classList.toggle('on', on);
  });
}
function passDate(d){ if(dateSel.size) return dateSel.has(d); return true; }
function setRole(v){ fRole=v; document.querySelectorAll('#roleChips .chip').forEach(c=>c.classList.toggle('on',c.dataset.r===v)); render(); }
function setWh(v){ fWh=v; document.querySelectorAll('#whChips .chip').forEach(c=>c.classList.toggle('on',c.dataset.w===v)); render(); }
function setDeliver(v){ fDeliver=v; document.querySelectorAll('#deliverChips .chip').forEach(c=>c.classList.toggle('on',c.dataset.dl===v)); render(); }   // v1.16
/* v1.16: จำแนกรูปแบบส่งของบิล → 'pickup'(รับเอง) / 'deliver'(ส่งถึงร้าน) / '' (ไม่ระบุ) */
function deliverKind(d){ d=String(d||'').trim(); if(!d) return ''; return /รับ|เอง/.test(d) ? 'pickup' : 'deliver'; }
function passDeliver(d){ return fDeliver==='all' || deliverKind(d)===fDeliver; }
document.getElementById('fStore').addEventListener('input',()=>{ clearTimeout(window._st); window._st=setTimeout(render,250); });

/* ============================================================
   BUILD BILLS — group by orderId
   ============================================================ */
function buildBills(){
  const fStore = document.getElementById('fStore').value.trim().toLowerCase();
  const bills = {};
  for(const o of DATA_ORDERS){
    if(!passDate(o.date)) continue;
    const u = USERS[o.salesman]||{};
    const chan = chanOf(o);   // 'ROO' / 'ปลีก' / 'ส่ง' / ''
    if(fRole!=='all' && chan!==fRole) continue;
    if(fWh!=='all' && shipWh(o)!==fWh) continue;
    if(fStore && !((o.store+' '+o.storeCode+' '+o.product+' '+o.barcode).toLowerCase().includes(fStore))) continue;
    if(!o.orderId) continue;
    if(!bills[o.orderId]){
      // v1.17: เซลประเภทส่ง (HS) → ตัด "(ROO)" ท้ายชื่อออก โชว์ชื่อปกติ · v1.18: โชว์รหัส HS จริง (ROH→HSW)
      const smName = (u.name||o.name||''), smShow = chan==='ส่ง' ? smName.replace(/\s*\(ROO\)\s*$/i,'').trim() : smName;
      bills[o.orderId]={orderId:o.orderId, date:o.date, time:o.time||'', salesman:realSalesman(o),
        salesmanName: smShow, chan, roleLab: chan || 'R0', srcTable:o.srcTable||'roo',
        store:o.store, wh:shipWh(o), lines:0, total:0, keyTS:0, seq:Infinity, isROO:isROO(o),
        done:false, doneBy:'', doneDate:'', doneTime:'', deliver:''};
    }
    const b = bills[o.orderId];
    const ts = keyTSof(o);
    if(ts>=b.keyTS){ b.keyTS=ts; if(o.time) b.time=o.time; }
    if(o.seq<b.seq) b.seq=o.seq;
    b.lines++; b.total += o.total;
    if(o.done){ b.done=true; b.doneBy=o.doneBy||b.doneBy; b.doneDate=o.doneDate||b.doneDate; b.doneTime=o.doneTime||b.doneTime; }
    if(o.deliver && !b.deliver) b.deliver=o.deliver;   // v1.6: เก็บรูปแบบการจัดส่ง (line แรกที่มีค่า)
  }
  return Object.values(bills)
    .filter(b=> passDeliver(b.deliver))            // v1.16: กรองตามรูปแบบส่ง (บิลระดับ)
    .sort((a,b)=>          // v1.10: ใหม่สุดขึ้นบน (date/เวลา desc)
    String(b.date).localeCompare(String(a.date)) ||
    (b.keyTS||0)-(a.keyTS||0) ||
    (a.seq-b.seq) ||
    a.orderId.localeCompare(b.orderId)
  );
}

/* ============================================================
   RENDER
   ============================================================ */
function render(){
  // v1.10: จำตำแหน่ง scroll ของตารางในแท็บที่เปิดอยู่ ก่อน rebuild (กันเด้งขึ้นบนตอนติ๊ก checkbox)
  const _activePanel = document.querySelector('.panel.active');
  const _tw0 = _activePanel && _activePanel.querySelector('.tbl-wrap');
  const _prevScroll = _tw0 ? _tw0.scrollTop : 0;

  const bills = buildBills();
  const pending = bills.filter(b=>!b.done);   // v1.6: บิลที่ยังไม่จัด → tab "เลือกบิล"
  const done    = bills.filter(b=> b.done);   // v1.6: บิลที่จัดแล้ว → tab "นำเข้าแล้ว"

  // selectedBills มีเฉพาะ pending (จัดแล้ว = ไม่นับ · re-export ต้องเลือกใน tab นำเข้าแล้ว)
  const selBills = pending.filter(b=>selectedBills.has(b.orderId));
  const selOrderIds = new Set(selBills.map(b=>b.orderId));
  const selLines = DATA_ORDERS.filter(o=> selOrderIds.has(o.orderId) && passDate(o.date));
  const totalBaht = selLines.reduce((s,l)=>s+l.total,0);
  const uniqueStores = new Set(selLines.map(l=>l.storeCode||l.store)).size;
  const uniqueProducts = new Set(selLines.map(l=>l.barcode)).size;
  const uniqueSm = new Set(selLines.map(l=>l.salesman)).size;

  document.getElementById('tiles').innerHTML = [
    ['เลือกบิล', selBills.length, 'ok'],
    ['ออเดอร์', selBills.length],
    ['รายการ', selLines.length],
    ['เซลล์', uniqueSm],
    ['ร้านค้า', uniqueStores],
    ['สินค้า', uniqueProducts],
    ['ยอดรวม', '฿'+totalBaht.toLocaleString('th-TH')],
    ['นำเข้าแล้ว', done.length, done.length?'':'']
  ].map(([l,v,c])=>`<div class="tile ${c||''}"><div class="v">${v}</div><div class="l">${l}</div></div>`).join('');

  // v1.6: badge นับบิลบน tab
  const pc=document.getElementById('tabPendingCount'), dc=document.getElementById('tabDoneCount');
  if(pc) pc.textContent = pending.length;
  if(dc) dc.textContent = done.length;

  renderBills(pending);
  renderDone(done);
  renderOrders();
  renderSchema();

  document.getElementById('exportBtn').disabled = selLines.length===0;

  // v1.10: คืนตำแหน่ง scroll เดิม (tbl-wrap ถูกสร้างใหม่หลัง innerHTML)
  if(_activePanel && _prevScroll){
    const tw = _activePanel.querySelector('.tbl-wrap');
    if(tw) tw.scrollTop = _prevScroll;
  }
}

function deliverBadge(d){
  d = String(d||'').trim();
  if(!d) return '<span style="color:var(--muted);font-size:11px">—</span>';
  const isPick = /รับ|เอง/.test(d), short = isPick?'🏠 รับเอง':'🚚 ส่งถึงร้าน';
  const bg = isPick?'#fef3c7':'#dbeafe', tc = isPick?'#92400e':'#1d4ed8';
  return `<span title="${esc(d)}" style="background:${bg};color:${tc};font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;white-space:nowrap">${short}</span>`;
}

/* คืนสถานะ (unmark) — PATCH สถานะจัด='' เพื่อเอาบิลกลับไป tab แรก */
async function unmarkBill(orderId, srcTable){
  if(!confirm('คืนสถานะบิล '+orderId+' → กลับไปแท็บ "เลือกบิล"?')) return;
  const table = srcTable==='special' ? 'roo_special_sales' : 'roo_sales';   // v1.11: ยิงให้ถูกตาราง (เดิม fix roo_sales เสมอ → บิล special คืนไม่ได้)
  const payload = { 'สถานะจัด':'', 'แอดมินจัด':'', 'วันสั่งจัด':null, 'เวลาสั่งจัด':null };
  const url = `${SUPABASE_URL}/rest/v1/${table}?orderId=eq.${encodeURIComponent(orderId)}`;
  try{
    const res = await fetch(url, {
      method:'PATCH',
      headers:{'apikey':SUPABASE_ANON,'Authorization':'Bearer '+SUPABASE_ANON,'Content-Type':'application/json','Prefer':'return=representation'},
      body: JSON.stringify(payload)
    });
    if(!res.ok){ const t=await res.text(); toast('❌ '+t.slice(0,120)); return; }
    toast('✅ คืนสถานะแล้ว — โหลดใหม่');
    DATA_ORDERS = await loadOrders(); render();
  }catch(e){ toast('❌ '+(e.message||e)); }
}

function toggleBill(id,on){ if(on) selectedBills.add(id); else selectedBills.delete(id); render(); }
function selectAllBills(on){ buildBills().filter(b=>!b.done).forEach(b=>{ if(on) selectedBills.add(b.orderId); else selectedBills.delete(b.orderId); }); render(); }   // v1.6: เลือกได้เฉพาะ pending (จัดแล้ว = ไม่รวม)
function clearAll(){ if(confirm('ล้างตะกร้าทั้งหมด?')){ selectedBills.clear(); render(); } }

function renderOrders(){
  const fStore = document.getElementById('fStore').value.trim().toLowerCase();
  const list = DATA_ORDERS.filter(o=>{
    if(!passDate(o.date)) return false;
    if(o.done) return false;   // v1.6: ซ่อนบรรทัดของบิลที่จัดแล้ว (ดูใน tab นำเข้าแล้ว)
    if(fRole!=='all' && chanOf(o)!==fRole) return false;
    if(fWh!=='all' && shipWh(o)!==fWh) return false;
    if(fStore && !((o.store+' '+o.storeCode+' '+o.product+' '+o.barcode).toLowerCase().includes(fStore))) return false;
    return true;
  }).sort((a,b)=> a.orderId.localeCompare(b.orderId) || a.seq-b.seq);
  if(!list.length){ document.getElementById('panel-orders').innerHTML='<div class="empty">ไม่มีรายการ</div>'; return; }
  const rows = list.map(o=>{
    const sel = selectedBills.has(o.orderId);
    return `<tr class="${sel?'':'cut-row'}"${sel?'':' style="opacity:.6"'}>
      <td style="text-align:center"><input type="checkbox" ${sel?'checked':''} onchange="toggleBill('${esc(o.orderId)}',this.checked)" style="width:16px;height:16px;cursor:pointer"></td>

      <td class="num">${o.price.toLocaleString()}</td><td class="num">${o.total.toLocaleString()}</td>
      <td>${esc(shipWh(o))}</td>
    </tr>`;
  }).join('');
  document.getElementById('panel-orders').innerHTML =
    `<div class="note">รายการทั้งหมดของ chip ที่กรอง — บิลที่ไม่ติ๊ก = สีจาง ไม่เข้า Export</div>

     </tr></thead><tbody>${rows}</tbody></table></div>`;
}

/* ============================================================
   EXPORT XLSX — bplus 24 columns
   ============================================================ */
/* หาเล่ม (book prefix) สำหรับเลขที่เอกสาร:
 * - ROO order → BV28 (เล่มกลาง เพราะไม่มีรหัสเซล)
 * - Order อื่น → lookup จาก DOC_BOOKS ตามรหัสเซล
 * - ไม่รู้จัก → NA-<code> (flag ว่าต้องเพิ่มเล่ม) */
/* v1.18: เล่มเอกสาร — ROO ทุกรหัส → BV28 · ส่ง(ROH): จับชื่อ→เล่ม HS จริง (นพดล→HSW104→BK04)
 * override วิรชัย(HSW105)→BK03 · ไม่เจอ → NA-<รหัส> */
function docBookFor(o){
  if(chanOf(o)==='ROO') return 'BV28';
  const rc = realSalesman(o);                       // HSW104 สำหรับ ROH102
  const info = NAME_INFO[normName(o.name)];
  return BOOK_OVERRIDE[rc] || (info && info.book) || DOC_BOOKS[rc] || ('NA-'+rc);
}

async function exportXlsx(){
  const bills = buildBills();
  // v1.12: เฉพาะบิลที่ "ยังไม่จัด" ที่ติ๊กไว้ — ไม่ re-export บิลที่นำเข้าแล้ว (ที่ orderId ค้างใน selectedBills รอบก่อน)
  const selBills = bills.filter(b=>!b.done && selectedBills.has(b.orderId));
  if(!selBills.length){ toast('ยังไม่ได้เลือกบิล (ที่ยังไม่จัด)'); return; }

  const runDate = todayBKK();
  const _rd = runDate.split('-');
  const bvDate = String((+_rd[0])+543).slice(-2)+_rd[1]+_rd[2];   // YYMMDD พ.ศ.
  const delivIso = dateMinus(runDate, -1);                        // วันที่ส่งของ = วันที่เอกสาร + 1 วัน
  const delivDMY = toBuddhistDMY(delivIso);

  const bplusFields = (o, docNo)=>{
    const isFree = /แถม/.test(o.type);
    return {
      docDate: toBuddhistDMY(runDate),
      docNo,
      debtor: o.storeCode,
      endDisc: '',
      branch: '0', dept: 'SP01', project: '0',
      salesman: realSalesman(o),   // v1.18: bplus ใช้รหัส HS จริง (ROH→HSW)
      note: ('billId'+String(o.orderId||'')+' '+o.note).trim(),
      delivDate: delivDMY,                                        // ตายตัว = พรุ่งนี้
      barcode: o.barcode,
      qty: isFree ? '0' : o.qty,
      free: isFree ? o.qty : '0',
      unitPrice: o.price,
      discUnit: '', weightUnit: '', lot: '', invNo: '',
      loc: shipWh(o),
      keyDate: String(o.date).replace(/-/g,'/'),
      store: o.store,
      product: o.product,
      total: o.total,
      orderId: o.orderId
    };
  };

  const selOrderIds = new Set(selBills.map(b=>b.orderId));
  // v1.10: เรียงแถว Excel ใหม่สุดขึ้นบน (seq เรียงตาม date desc อยู่แล้ว · บรรทัดของบิลเดียวกันติดกัน)
  const selLines = DATA_ORDERS.filter(o=> selOrderIds.has(o.orderId) && passDate(o.date))
    .sort((a,b)=> a.seq-b.seq);

  /* running number ต่อ "เล่ม" (book) — ไล่ตามลำดับร้าน (bill แรกที่คีย์ = 001)
   * ROO orders → เล่ม BV28 ร่วมกัน (มี 3 ร้าน → BV28690709/001, /002, /003)
   * เซลปกติ → เล่มตาม DOC_BOOKS ของเซลนั้น */
  const bvByOrder = {}, seqByBook = {};
  const firstLineByOrder = {};   // orderId → first line ใน selLines (ใช้ตัดสิน book)
  selLines.forEach(o=>{ if(firstLineByOrder[o.orderId]===undefined) firstLineByOrder[o.orderId]=o; });
  /* v1.9: รันเลขต่อเนื่องต่อวัน — เริ่มต่อจากจำนวนบิลที่ "จัดแล้ววันนี้" ต่อเล่ม (ไม่รีเซ็ต 001 ทุก export)
   * นับจาก DATA_ORDERS ทั้งหมด (ไม่สน filter หน้าจอ) กันเลขซ้ำข้ามการกรองวัน · doneDate=วันสั่งจัด=วันนี้ */
  const doneToday = {}, _seenDone = new Set();
  for(const o of DATA_ORDERS){
    if(o.done && o.doneDate===runDate && o.orderId && !_seenDone.has(o.orderId)){
      _seenDone.add(o.orderId);
      const bk = docBookFor(o);
      doneToday[bk] = (doneToday[bk]||0)+1;
    }
  }
  /* จัดลำดับ orderId ตาม seq/orderId (deterministic) ก่อนแจกเลข → รันเลขเสถียร */
  const orderIdsSorted = Object.keys(firstLineByOrder).sort((a,b)=>{
    const oa=firstLineByOrder[a], ob=firstLineByOrder[b];
    return (oa.seq-ob.seq) || a.localeCompare(b);
  });
  orderIdsSorted.forEach(oid=>{
    const o = firstLineByOrder[oid];
    const book = docBookFor(o);
    if(seqByBook[book]===undefined) seqByBook[book] = (doneToday[book]||0);   // เริ่มต่อจากที่จัดแล้ววันนี้
    seqByBook[book] += 1;
    bvByOrder[oid] = book+bvDate+'/'+String(seqByBook[book]).padStart(3,'0');
  });
  const bplus = selLines.map(o=> bplusFields(o, bvByOrder[o.orderId]));

  const bHead = ['วันที่เอกสาร','เลขที่เอกสาร','รหัสลูกหนี้','ส่วนลดท้ายบิล','รหัสสาขา','รหัสแผนก','รหัสโครงการ',
    'รหัสพนักงานขาย','หมายเหตุ','วันที่ส่งของ','รหัสซื้อขาย','จำนวน','แถม','ราคาต่อหน่วย','ส่วนลดต่อหน่วย',
    'น้ำหนักต่อหน่วย','เลขล็อต','เลขกำกับ','ตำแหน่งเก็บ','วันที่คีย์','ชื่อร้าน','ชื่อสินค้า','ยอดรวม','เลขบิล (billId)'];
  const bRows = bplus.map(r=>[r.docDate,r.docNo,r.debtor,r.endDisc,r.branch,r.dept,r.project,r.salesman,
    r.note,r.delivDate,r.barcode,r.qty,r.free,r.unitPrice,r.discUnit,r.weightUnit,r.lot,r.invNo,r.loc,
    r.keyDate,r.store,r.product,r.total,r.orderId]);

  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.aoa_to_sheet([bHead, ...bRows]);
  ws['!cols'] = bHead.map((h,i)=>({wch:[10,16,12,8,8,8,8,12,18,11,15,7,5,11,9,9,7,7,8,11,22,28,11,11][i]||10}));

  // Force TEXT: docNo, debtor, salesman, barcode, loc, billId (กัน scientific notation)
  const ref = XLSX.utils.decode_range(ws['!ref']);
  for(let r=1;r<=ref.e.r;r++){
    for(const c of [1,2,7,10,18,23]){
      const addr = XLSX.utils.encode_cell({r,c}); const cell = ws[addr];
      if(cell && cell.v!=null && cell.v!==''){ cell.t='s'; cell.v=String(cell.v); cell.z='@'; }
    }
  }
  XLSX.utils.book_append_sheet(wb, ws, 'ใบจองสินค้า');
  XLSX.writeFile(wb, `ใบจอง-${runDate}.xlsx`);
  toast(`✅ ดาวน์โหลดแล้ว · ${selBills.length} บิล · ${bRows.length} บรรทัด`);

  /* v1.12: เอาบิลที่ export แล้วออกจากตะกร้า → รอบถัดไปเลือกใหม่เฉพาะร้านที่จะจัด (ไม่ค้างจากรอบเก่า) */
  selBills.forEach(b=> selectedBills.delete(b.orderId));

  /* v1.11: mark สถานะจัด → ด้วย id ของบรรทัดที่อนุมัติ (selLines) แยกตาราง (await ให้ PATCH เสร็จก่อน) */
  await markDoneAfterExport(selLines);
}

/* ============================================================
   v1.19: Google Sign-In · เช็คสิทธิ์จาก Users Sheet (ไม่ใช่โดเมนอีเมล)

   Gmail ส่วนตัวไว้ในชีทจริง เช่นแอดมินคลังบางคน)

const CLIENT_ID = '615875645128-gasjjvkt6lu8g449cbnhl40k1pu25r0b.apps.googleusercontent.com';
const USERS_SHEET_ID = '1M6HdISsLN684qRWyQ73CA4AmUzmYtZaOlffDJXZZIXQ';   // Rattana Users Sheet (ใช้ร่วมทุกแอป)
const USERS_SHEET_TAB = 'Rattana Users for apps';
const AUTH_KEY = 'op_auth_v1', AUTH_TTL = 30*864e5;   // cache 30 วัน
let currentUser = null;

function saveAuth(u){ try{ localStorage.setItem(AUTH_KEY, JSON.stringify({u, ts:Date.now()})); }catch(e){} }
function loadAuthCache(){ try{ const o=JSON.parse(localStorage.getItem(AUTH_KEY)||'null'); if(o&&o.u&&(Date.now()-o.ts<AUTH_TTL)) return o.u; }catch(e){} return null; }
function logout(){ try{ localStorage.removeItem(AUTH_KEY); }catch(e){} try{ if(window.google&&google.accounts) google.accounts.id.disableAutoSelect(); }catch(e){} location.reload(); }

/* หาแถวใน Users Sheet ที่ E-mail ตรงกับที่ล็อกอินมา (ไม่สนโดเมน — เทียบตรงๆ) */
async function findAppUser(email){
  const url = `https://docs.google.com/spreadsheets/d/${USERS_SHEET_ID}/gviz/tq?sheet=${encodeURIComponent(USERS_SHEET_TAB)}&headers=1`;
  const txt = await (await fetch(url)).text();
  const json = JSON.parse(txt.replace(/^[\s\S]*?setResponse\(/,'').replace(/\);?\s*$/,''));
  const cols = (json.table.cols||[]).map(c=>c.label||c.id||'');
  const rows = json.table.rows||[];
  for(const r of rows){
    const c = r.c||[], obj = {};
    cols.forEach((h,i)=>{ if(h && obj[h]===undefined) obj[h] = (c[i]&&c[i].v!=null) ? c[i].v : ''; });
    const rowEmail = String(obj['E-mail']||obj['Email']||'').trim().toLowerCase();
    if(rowEmail === email) return obj;
  }
  return null;
}
function showLoginError(msg){ const el=document.getElementById('loginError'); el.textContent=msg; el.style.display='block'; }
function initGoogleSignIn(){
  if(!(window.google && google.accounts && google.accounts.id)){ setTimeout(initGoogleSignIn, 300); return; }
  google.accounts.id.initialize({ client_id: CLIENT_ID, callback: handleGoogleCredential, auto_select: false });
  const btn=document.getElementById('googleSignInBtn');
  if(btn) google.accounts.id.renderButton(btn, {type:'standard', theme:'outline', size:'large', text:'signin_with', shape:'rectangular', width:300});
}
async function handleGoogleCredential(resp){
  document.getElementById('loginSpinner').style.display='block';
  document.getElementById('loginError').style.display='none';
  try{
    const p = JSON.parse(atob(resp.credential.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));
    const email = String(p.email||'').trim().toLowerCase();
    if(!email){ throw new Error('ไม่พบ email จาก Google'); }
    const u = await findAppUser(email);
    if(!u){ throw new Error(`ไม่พบบัญชี ${email} ในระบบ\nติดต่อผู้ดูแลเพื่อเพิ่มอีเมลใน Users Sheet`); }
    currentUser = { email, name: u['ชื่อ - สกุล']||p.name||email };
    saveAuth(currentUser);
    enterApp();
  }catch(e){
    showLoginError(e.message||'เข้าสู่ระบบไม่สำเร็จ');
    document.getElementById('loginSpinner').style.display='none';
  }
}
function enterApp(){
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('app').style.display='block';
  init();
}

window.addEventListener('DOMContentLoaded', ()=>{
  const cached = loadAuthCache();
  if(cached && cached.email){
    currentUser = cached; enterApp();
  } else {
    try{ localStorage.removeItem(AUTH_KEY); }catch(e){}
    initGoogleSignIn();
  }
});
