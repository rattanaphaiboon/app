<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Picker v1.2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{
  --navy:#0d1b3e; --navy2:#13245a; --gold:#c9a84c; --green:#16a34a;
  --bg:#f4f6fb; --card:#fff; --border:#e2e7f0; --muted:#64748b;
  --text:#1e293b; --ok:#15803d; --red:#dc2626;
  --w1:#FBBF24; --w2:#0EA5E9; --w3:#EF4444; --w4:#15803D; --c4:#4ADE80;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Sarabun',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px}
button{font-family:inherit;cursor:pointer}

header.appbar{background:var(--navy);color:#fff;padding:12px 18px;display:flex;align-items:center;gap:12px}
header.appbar .title{font-weight:700;font-size:17px;display:flex;align-items:center;gap:8px}
header.appbar .ver{background:var(--gold);color:var(--navy);font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px}
header.appbar .hub-btn{background:var(--gold);color:var(--navy);border:none;border-radius:8px;padding:7px 12px;font-weight:700;font-size:13px;display:flex;align-items:center;gap:5px;text-decoration:none}
header.appbar .hub-btn:hover{background:#d9bd6a}

.demo-banner{background:#fffbeb;border-bottom:2px solid var(--gold);padding:10px 18px;font-size:13px}
.demo-banner b{color:var(--navy)}
.demo-banner code{background:#fff;border:1px solid var(--border);border-radius:5px;padding:1px 6px;font-size:12px;font-family:ui-monospace,monospace}

.filterbar{background:var(--card);border-bottom:1px solid var(--border);padding:10px 18px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;box-shadow:0 2px 8px rgba(0,0,0,.04);position:sticky;top:0;z-index:20}
.chipgrp{display:flex;gap:4px;align-items:center}
.chipgrp .lbl{font-size:11px;color:var(--muted);font-weight:700;margin-right:2px}
.chip{background:#eef1f7;border:none;border-radius:20px;padding:6px 13px;font-size:13px;font-weight:600;color:#475569;cursor:pointer;white-space:nowrap;font-family:inherit}
.chip:hover{background:#e2e7f0}
.chip.on{background:var(--navy);color:#fff}
input[type=text],input[type=date],select{font-family:inherit;font-size:14px;padding:7px 12px;border:1.5px solid var(--border);border-radius:8px;background:#fff;outline:none;min-width:120px}
input:focus,select:focus{border-color:var(--gold)}
.btn-load{background:var(--navy);color:#fff;border:none;border-radius:8px;padding:8px 16px;font-weight:600;font-size:14px;height:38px}
.btn-load:hover{background:var(--navy2)}
.btn-export{background:linear-gradient(135deg,var(--green),#15803d);color:#fff;border:none;border-radius:8px;padding:8px 18px;font-weight:700;font-size:14px;height:38px;display:flex;align-items:center;gap:6px}
.btn-export:hover{filter:brightness(1.05)}
.btn-export:disabled{opacity:.5;cursor:not-allowed}

.wrap{padding:16px 18px;max-width:1500px;margin:0 auto}
.tiles{display:flex;gap:8px;margin-bottom:16px;overflow-x:auto;padding-bottom:2px}
.tile{flex:1 1 0;min-width:100px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:9px 12px;white-space:nowrap}
.tile .v{font-size:18px;font-weight:700;color:var(--navy)}
.tile .l{font-size:11px;color:var(--muted);margin-top:1px}
.tile.ok .v{color:var(--ok)}

.tabs{display:flex;gap:4px;border-bottom:2px solid var(--border);margin-bottom:14px;flex-wrap:wrap}
.tab{background:none;border:none;padding:9px 16px;font-size:14px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px;cursor:pointer;font-family:inherit}
.tab.active{color:var(--navy);border-bottom-color:var(--gold)}
.panel{display:none}
.panel.active{display:block}

.row-sel{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.tbl-wrap{overflow:auto;max-height:calc(100vh - 340px);background:var(--card);border:1px solid var(--border);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--border)}
th{background:#f8fafc;color:var(--navy);font-weight:600;position:sticky;top:0;z-index:5;font-size:12px}
tr:hover td{background:#fbfcff}
td.num,#panel-orders td.num{text-align:center;font-variant-numeric:tabular-nums}
.cut-row td{background:#fff7ed;opacity:.75}
.note{font-size:12px;color:var(--muted);margin:6px 2px}
.empty{text-align:center;padding:40px;color:var(--muted)}

.schema-box{background:var(--card);border:1.5px solid var(--gold);border-radius:12px;padding:14px 18px;margin:14px 0}
.schema-box h3{color:var(--navy);font-size:15px;margin-bottom:8px}
.schema-box pre{background:#0f172a;color:#e2e8f0;padding:12px 14px;border-radius:8px;overflow:auto;font-size:12px;line-height:1.6;font-family:ui-monospace,monospace}
.schema-box code{background:#f1f5f9;padding:1px 6px;border-radius:4px;font-size:12px;font-family:ui-monospace,monospace}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 20px;border-radius:10px;z-index:80;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.3);display:none}
</style>
</head>
<body>

<header class="appbar">
  <div class="title">📦 Order Picker <span class="ver">v1.2</span></div>
  <div style="flex:1"></div>
  <a class="hub-btn" href="index.html">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg> Hub
  </a>
</header>

<div class="demo-banner" id="srcBanner">

  &nbsp;·&nbsp; <span id="srcStatus" style="font-weight:700">⏳ กำลังโหลด…</span>
  &nbsp;·&nbsp; <button onclick="reload()" style="border:1px solid var(--gold);background:#fff;color:var(--navy);border-radius:6px;padding:2px 10px;font-weight:700;cursor:pointer;font-size:12px">🔄 โหลดใหม่</button>
</div>

<div class="filterbar">
  <div class="chipgrp" id="dateChips">
    <span class="lbl">วัน</span>
    <button class="chip" data-d="t" onclick="setDate('t')">วันนี้</button>
    <button class="chip" data-d="y" onclick="setDate('y')">-1วัน</button>
    <button class="chip" data-d="d2" onclick="setDate('d2')">-2วัน</button>
    <button class="chip" data-d="all" onclick="setDate('all')">ทุกวัน</button>
  </div>
  <div class="chipgrp" id="roleChips">
    <span class="lbl">ประเภท</span>
    <button class="chip" data-r="all" onclick="setRole('all')">ทั้งหมด</button>
    <button class="chip" data-r="3" onclick="setRole('3')">ปลีก</button>
    <button class="chip" data-r="4" onclick="setRole('4')">ส่ง</button>
  </div>
  <div class="chipgrp" id="whChips">
    <span class="lbl">คลัง</span>
    <button class="chip" data-w="all" onclick="setWh('all')">ทั้งหมด</button>
    <button class="chip" data-w="W1" onclick="setWh('W1')">W1</button>
    <button class="chip" data-w="W2" onclick="setWh('W2')">W2</button>
    <button class="chip" data-w="W3" onclick="setWh('W3')">W3</button>
    <button class="chip" data-w="W4" onclick="setWh('W4')">W4</button>
  </div>
  <input type="text" id="fStore" placeholder="🔍 ร้าน/สินค้า" style="min-width:160px">
  <div style="flex:1"></div>
  <button class="btn-export" id="exportBtn" onclick="exportXlsx()">⬇️ Export Excel (bplus)</button>
</div>

<div class="wrap">
  <div class="tiles" id="tiles"></div>

  <div class="tabs">
    <button class="tab active" data-tab="bills" onclick="switchTab('bills')">☑️ เลือกบิล</button>
    <button class="tab" data-tab="orders" onclick="switchTab('orders')">📋 ใบจองสินค้า (รายบรรทัด)</button>
    <button class="tab" data-tab="schema" onclick="switchTab('schema')">📐 Schema Supabase</button>
  </div>

  <div class="panel active" id="panel-bills"></div>
  <div class="panel" id="panel-orders"></div>
  <div class="panel" id="panel-schema"></div>
</div>

<div class="toast" id="toast"></div>

/* ค่าคอลัมน์ที่ทน key เพี้ยน (ชื่อไทย/eng/case ต่าง) */
function pick(r, keys){ for(const k of keys){ const v=r[k]; if(v!==undefined && v!==null && v!=='') return v; } return ''; }

/* Normalize 1 row → shape ที่แอปใช้ */
function normalizeRow(r, i){
  return {
    seq: i,
    date: String(pick(r,['วัน','date','order_date'])||'').slice(0,10),
    time: String(pick(r,['เวลา','time'])||''),

    wh: String(pick(r,['คลัง','wh','warehouse'])||'').trim(),
    whSend1: String(pick(r,['คลังส่ง','ship_wh','whSend1'])||pick(r,['คลัง','wh'])||'').trim(),
    store: String(pick(r,['ชื่อร้าน','store_name','store'])||''),
    storeCode: String(pick(r,['รหัสร้าน','store_code','AR_CODE'])||''),
    barcode: String(pick(r,['Barcode','barcode','บาร์โค้ด'])||''),
    product: String(pick(r,['ชื่อสินค้า','product_name','SKU_NAME'])||''),
    type: String(pick(r,['รูปแบบ','type','sale_type'])||'').trim(),
    cancel: String(pick(r,['ยกเลิก','cancel','cancelled'])||'').trim(),
    qty: +pick(r,['จำนวน','qty','quantity'])||0,
    unit: String(pick(r,['หน่วย','unit'])||''),
    price: +pick(r,['ราคา','price','unit_price'])||0,
    total: +pick(r,['ยอดเงินรวม','total','line_total'])||0,
    orderId: String(pick(r,['orderId','order_id','billId','bill_id'])||'').trim(),
    note: String(pick(r,['หมายเหตุ','note','remark'])||'').trim(),
    dueDate: String(pick(r,['วันกำหนดส่ง','due_date','deliv_date'])||'').slice(0,10),
    apprStatus: String(pick(r,['สถานะอนุมัติ','approval_status','apprStatus'])||'').trim()
  };
}

/* ============================================================
   loadOrders — Supabase REST · fallback mock
   ============================================================ */
async function loadOrders(){
  if(USE_MOCK){
    setSrcStatus('🧪 ใช้ mock data (USE_MOCK=true)', 'warn');
    return MOCK_ROWS.filter(r=> !/ยกเลิก/.test(r['ยกเลิก']||''))
                    .filter(r=> !/รออนุมัติ|ปฏิเสธ/.test(r['สถานะอนุมัติ']||''))
                    .map(normalizeRow);
  }
  try{
    // v1.2 fix: PostgREST parse ชื่อคอลัมน์ไทย (`วัน`/`เวลา`) ใน URL ไม่ได้ (Content-Type 400 "column ว does not exist")
    // → ยิงแค่ select=* + limit · filter/sort ฝั่ง client (ข้อมูล < 5000 rows ทำเร็วอยู่แล้ว)
    const url = `${SUPABASE_URL}/rest/v1/roo_sales?select=*&limit=5000`;
    const res = await fetch(url, {
      headers:{'apikey':SUPABASE_ANON,'Authorization':'Bearer '+SUPABASE_ANON,'Prefer':'count=exact'}
    });
    if(!res.ok){ throw new Error('HTTP '+res.status+' '+res.statusText); }
    const total = res.headers.get('content-range');   // "0-1/2" or "*/0"
    const rows = await res.json();
    if(!Array.isArray(rows)){ throw new Error('response ไม่ใช่ array — '+JSON.stringify(rows).slice(0,120)); }

    if(rows.length===0){
      // Supabase ตอบ 200 แต่ 0 rows → RLS ปิด anon
      setSrcStatus(`⚠️ ต่อ Supabase ได้ (${total||'?'}) แต่ได้ 0 แถว — <b>RLS block anon</b> · ไปแท็บ 📐 Schema เพื่อ copy SQL เปิด policy`, 'warn');
      // Fallback: ใช้ mock ให้เห็นหน้า UI ทำงาน
      return MOCK_ROWS.filter(r=> !/ยกเลิก/.test(r['ยกเลิก']||''))
                      .filter(r=> !/รออนุมัติ|ปฏิเสธ/.test(r['สถานะอนุมัติ']||''))
                      .map(normalizeRow);
    }

    // Filter/sort ฝั่ง client — เอา 30 วันล่าสุด, sort desc (ทำเองเพราะ URL param ไทยพัง)
    const from = dateMinus(todayBKK(), 30);
    const filtered = rows.filter(r=> !/ยกเลิก/.test(String(r['ยกเลิก']||'')))
                         .filter(r=> !/รออนุมัติ|ปฏิเสธ/.test(String(r['สถานะอนุมัติ']||'')))
                         .map(normalizeRow)
                         .filter(r=> r.date >= from)
                         .sort((a,b)=> b.date.localeCompare(a.date) || String(b.time||'').localeCompare(String(a.time||'')));
    setSrcStatus(`✅ Supabase · ${filtered.length.toLocaleString()} แถว (30 วันล่าสุด · จากทั้งหมด ${rows.length.toLocaleString()})`, 'ok');
    return filtered;
  }catch(e){
    console.error('[Supabase] loadOrders failed', e);
    setSrcStatus(`❌ Supabase error: ${esc(e.message||e)} — ใช้ mock ชั่วคราว`, 'err');
    return MOCK_ROWS.filter(r=> !/ยกเลิก/.test(r['ยกเลิก']||''))
                    .filter(r=> !/รออนุมัติ|ปฏิเสธ/.test(r['สถานะอนุมัติ']||''))
                    .map(normalizeRow);
  }
}

/* ============================================================
   STATE + HELPERS
   ============================================================ */
let DATA_ORDERS = [];
let selectedBills = new Set();
let dateSel = new Set();
let _dateMode = 't';
let fRole='all', fWh='all';

function todayBKK(){ return today; }
function dateMinus(iso,n){ const d=new Date(iso+'T12:00:00Z'); d.setUTCDate(d.getUTCDate()-n); return d.toISOString().slice(0,10); }
function toBuddhistDMY(iso){ const [y,m,d]=String(iso).split('-'); return `${d}/${m}/${(+y)+543}`; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.style.display='block'; setTimeout(()=>t.style.display='none',2500); }
function shipWh(o){ return String(o.whSend1||o.wh||'').trim().toUpperCase(); }
function keyTSof(o){ const base=Date.parse(o.date+'T00:00:00')||0; const m=String(o.time||'').match(/(\d{1,2}):(\d{2})/); return base+(m?(+m[1])*3600000+(+m[2])*60000:0); }
function roleLabel(r){ return r===4?'ส่ง':r===3?'ปลีก':'R'+r; }

/* ============================================================
   FILTER CHIPS
   ============================================================ */
function setDate(mode){
  _dateMode = mode;
  const dayIso = mode==='t'?today : mode==='y'?yesterday : mode==='d2'?dateMinus(today,2) : null;
  if(dayIso){ if(dateSel.has(dayIso)) dateSel.delete(dayIso); else dateSel.add(dayIso); }
  else if(mode==='all'){ dateSel.clear(); }
  refreshDateChips(); render();
}
function refreshDateChips(){
  document.querySelectorAll('#dateChips .chip').forEach(c=>{
    const d=c.dataset.d; let on=false;
    if(d==='t') on=dateSel.has(today);
    else if(d==='y') on=dateSel.has(yesterday);
    else if(d==='d2') on=dateSel.has(dateMinus(today,2));
    else if(d==='all') on=!dateSel.size;
    c.classList.toggle('on', on);
  });
}
function passDate(d){ if(dateSel.size) return dateSel.has(d); return true; }
function setRole(v){ fRole=v; document.querySelectorAll('#roleChips .chip').forEach(c=>c.classList.toggle('on',c.dataset.r===v)); render(); }
function setWh(v){ fWh=v; document.querySelectorAll('#whChips .chip').forEach(c=>c.classList.toggle('on',c.dataset.w===v)); render(); }
document.getElementById('fStore').addEventListener('input',()=>{ clearTimeout(window._st); window._st=setTimeout(render,250); });

/* ============================================================
   BUILD BILLS — group by orderId
   ============================================================ */
function buildBills(){
  const fStore = document.getElementById('fStore').value.trim().toLowerCase();
  const bills = {};
  for(const o of DATA_ORDERS){
    if(!passDate(o.date)) continue;
    const u = USERS[o.salesman]||{}; const role = u.role||0;
    if(fRole!=='all' && String(role)!==fRole) continue;
    if(fWh!=='all' && shipWh(o)!==fWh) continue;
    if(fStore && !((o.store+' '+o.storeCode+' '+o.product+' '+o.barcode).toLowerCase().includes(fStore))) continue;
    if(!o.orderId) continue;
    if(!bills[o.orderId]){
      bills[o.orderId]={orderId:o.orderId, date:o.date, time:o.time||'', salesman:o.salesman,
        salesmanName: u.name||o.name||'', role, roleLab:roleLabel(role),
        store:o.store, wh:shipWh(o), lines:0, total:0, keyTS:0, seq:Infinity};
    }
    const b = bills[o.orderId];
    const ts = keyTSof(o);
    if(ts>=b.keyTS){ b.keyTS=ts; if(o.time) b.time=o.time; }
    if(o.seq<b.seq) b.seq=o.seq;
    b.lines++; b.total += o.total;
  }
  return Object.values(bills).sort((a,b)=>
    String(a.date).localeCompare(String(b.date)) ||
    (a.keyTS||0)-(b.keyTS||0) ||
    (a.seq-b.seq) ||
    a.orderId.localeCompare(b.orderId)
  );
}

/* ============================================================
   RENDER
   ============================================================ */
function render(){
  const bills = buildBills();
  const selBills = bills.filter(b=>selectedBills.has(b.orderId));
  const selOrderIds = new Set(selBills.map(b=>b.orderId));
  const selLines = DATA_ORDERS.filter(o=> selOrderIds.has(o.orderId) && passDate(o.date));
  const totalBaht = selLines.reduce((s,l)=>s+l.total,0);
  const uniqueStores = new Set(selLines.map(l=>l.storeCode||l.store)).size;
  const uniqueProducts = new Set(selLines.map(l=>l.barcode)).size;
  const uniqueSm = new Set(selLines.map(l=>l.salesman)).size;

  document.getElementById('tiles').innerHTML = [
    ['เลือกบิล', selBills.length, 'ok'],
    ['ออเดอร์', selBills.length],
    ['รายการ', selLines.length],
    ['เซลล์', uniqueSm],
    ['ร้านค้า', uniqueStores],
    ['สินค้า', uniqueProducts],
    ['ยอดรวม', '฿'+totalBaht.toLocaleString('th-TH')]
  ].map(([l,v,c])=>`<div class="tile ${c||''}"><div class="v">${v}</div><div class="l">${l}</div></div>`).join('');

  renderBills(bills);
  renderOrders();
  renderSchema();

  document.getElementById('exportBtn').disabled = selLines.length===0;
}

  const rows = bills.map(b=>`<tr class="${selectedBills.has(b.orderId)?'':'cut-row'}">
    <td style="text-align:center"><input type="checkbox" ${selectedBills.has(b.orderId)?'checked':''} onchange="toggleBill('${esc(b.orderId)}',this.checked)" style="width:17px;height:17px;cursor:pointer"></td>
    <td>${esc(b.date)}</td><td>${esc(b.time)}</td>
    <td>${esc(b.salesman)} <span style="color:var(--muted);font-size:11px">${esc(b.salesmanName||'')}</span></td>
    <td><span class="chip" style="background:${b.role===3?'#dbeafe':'#dcfce7'};color:${b.role===3?'#1d4ed8':'#166534'};padding:1px 8px;font-size:11px">${esc(b.roleLab)}</span></td>
    <td>${esc(b.store)}</td><td>${esc(b.wh)}</td><td>${esc(b.orderId)}</td>
    <td class="num">${b.lines}</td><td class="num">${b.total.toLocaleString()}</td>
  </tr>`).join('');
  p.innerHTML = head +
    `<div class="note">ติ๊กบิลที่จะจัด → กด <b>⬇️ Export Excel (bplus)</b> (มุมขวาบน) · ตะกร้าข้ามวันได้ · Export ซ้ำได้ทุกเมื่อ</div>
     <div class="tbl-wrap"><table><thead><tr>
       <th>✓</th><th>วันคีย์</th><th>เวลา</th><th>เซล</th><th>ประเภท</th><th>ร้าน</th><th>คลังส่ง</th><th>billId</th><th>รายการ</th><th>ยอด</th>
     </tr></thead><tbody>${rows}</tbody></table></div>`;
}

function toggleBill(id,on){ if(on) selectedBills.add(id); else selectedBills.delete(id); render(); }
function selectAllBills(on){ buildBills().forEach(b=>{ if(on) selectedBills.add(b.orderId); else selectedBills.delete(b.orderId); }); render(); }
function clearAll(){ if(confirm('ล้างตะกร้าทั้งหมด?')){ selectedBills.clear(); render(); } }

function renderOrders(){
  const fStore = document.getElementById('fStore').value.trim().toLowerCase();
  const list = DATA_ORDERS.filter(o=>{
    if(!passDate(o.date)) return false;
    const role = (USERS[o.salesman]||{}).role||0;
    if(fRole!=='all' && String(role)!==fRole) return false;
    if(fWh!=='all' && shipWh(o)!==fWh) return false;
    if(fStore && !((o.store+' '+o.storeCode+' '+o.product+' '+o.barcode).toLowerCase().includes(fStore))) return false;
    return true;
  }).sort((a,b)=> a.orderId.localeCompare(b.orderId) || a.seq-b.seq);
  if(!list.length){ document.getElementById('panel-orders').innerHTML='<div class="empty">ไม่มีรายการ</div>'; return; }
  const rows = list.map(o=>{
    const sel = selectedBills.has(o.orderId);
    return `<tr class="${sel?'':'cut-row'}"${sel?'':' style="opacity:.6"'}>
      <td style="text-align:center"><input type="checkbox" ${sel?'checked':''} onchange="toggleBill('${esc(o.orderId)}',this.checked)" style="width:16px;height:16px;cursor:pointer"></td>
      <td>${esc(o.storeCode)}</td><td>${esc(o.salesman)}</td>
      <td>${esc(String(o.date).replace(/-/g,'/'))}</td><td>${esc(o.orderId)}</td>
      <td>${esc(o.barcode)}</td><td>${esc(o.product)}</td><td>${esc(o.store)}</td>
      <td class="num">${o.qty} <span style="color:var(--muted);font-size:11px">${esc(o.unit.replace(/x\d+\(|\)/g,''))}</span></td>
      <td>${o.type==='แถม'?'<span style="color:var(--ok);font-weight:700">แถม</span>':'<span>ขาย</span>'}</td>
      <td class="num">${o.price.toLocaleString()}</td><td class="num">${o.total.toLocaleString()}</td>
      <td>${esc(shipWh(o))}</td>
    </tr>`;
  }).join('');
  document.getElementById('panel-orders').innerHTML =
    `<div class="note">รายการทั้งหมดของ chip ที่กรอง — บิลที่ไม่ติ๊ก = สีจาง ไม่เข้า Export</div>
     <div class="tbl-wrap"><table><thead><tr>
       <th>✓</th><th>รหัสลูกหนี้</th><th>เซล</th><th>วันคีย์</th><th>billId</th>
       <th>Barcode</th><th>สินค้า</th><th>ร้าน</th><th>จำนวน</th><th>รูปแบบ</th><th>ราคา</th><th>ยอดรวม</th><th>คลัง</th>
     </tr></thead><tbody>${rows}</tbody></table></div>`;
}

/* ============================================================
   EXPORT XLSX — bplus 24 columns
   ============================================================ */
function docBook(code){ return DOC_BOOKS[code]||'NA-'+code; }

function exportXlsx(){
  const bills = buildBills();
  const selBills = bills.filter(b=>selectedBills.has(b.orderId));
  if(!selBills.length){ toast('ยังไม่ได้เลือกบิล'); return; }

  const runDate = todayBKK();
  const _rd = runDate.split('-');
  const bvDate = String((+_rd[0])+543).slice(-2)+_rd[1]+_rd[2];   // YYMMDD พ.ศ.
  const delivIso = dateMinus(runDate, -1);                        // วันที่ส่งของ = วันที่เอกสาร + 1 วัน
  const delivDMY = toBuddhistDMY(delivIso);

  const bplusFields = (o, docNo)=>{
    const isFree = /แถม/.test(o.type);
    return {
      docDate: toBuddhistDMY(runDate),
      docNo,
      debtor: o.storeCode,
      endDisc: '',
      branch: '0', dept: 'SP01', project: '0',
      salesman: o.salesman,
      note: ('billId'+String(o.orderId||'')+' '+o.note).trim(),
      delivDate: delivDMY,                                        // ตายตัว = พรุ่งนี้
      barcode: o.barcode,
      qty: isFree ? '0' : o.qty,
      free: isFree ? o.qty : '0',
      unitPrice: o.price,
      discUnit: '', weightUnit: '', lot: '', invNo: '',
      loc: shipWh(o),
      keyDate: String(o.date).replace(/-/g,'/'),
      store: o.store,
      product: o.product,
      total: o.total,
      orderId: o.orderId
    };
  };

  const selOrderIds = new Set(selBills.map(b=>b.orderId));
  const selLines = DATA_ORDERS.filter(o=> selOrderIds.has(o.orderId) && passDate(o.date))
    .sort((a,b)=> a.orderId.localeCompare(b.orderId) || a.seq-b.seq);

  const bvByOrder = {}, seqBySm = {};
  const bplus = selLines.map(o=>{
    if(bvByOrder[o.orderId]===undefined){
      const book = docBook(o.salesman);
      seqBySm[o.salesman] = (seqBySm[o.salesman]||0)+1;
      bvByOrder[o.orderId] = book+bvDate+'/'+String(seqBySm[o.salesman]).padStart(3,'0');
    }
    return bplusFields(o, bvByOrder[o.orderId]);
  });

  const bHead = ['วันที่เอกสาร','เลขที่เอกสาร','รหัสลูกหนี้','ส่วนลดท้ายบิล','รหัสสาขา','รหัสแผนก','รหัสโครงการ',
    'รหัสพนักงานขาย','หมายเหตุ','วันที่ส่งของ','รหัสซื้อขาย','จำนวน','แถม','ราคาต่อหน่วย','ส่วนลดต่อหน่วย',
    'น้ำหนักต่อหน่วย','เลขล็อต','เลขกำกับ','ตำแหน่งเก็บ','วันที่คีย์','ชื่อร้าน','ชื่อสินค้า','ยอดรวม','เลขบิล (billId)'];
  const bRows = bplus.map(r=>[r.docDate,r.docNo,r.debtor,r.endDisc,r.branch,r.dept,r.project,r.salesman,
    r.note,r.delivDate,r.barcode,r.qty,r.free,r.unitPrice,r.discUnit,r.weightUnit,r.lot,r.invNo,r.loc,
    r.keyDate,r.store,r.product,r.total,r.orderId]);

  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.aoa_to_sheet([bHead, ...bRows]);
  ws['!cols'] = bHead.map((h,i)=>({wch:[10,16,12,8,8,8,8,12,18,11,15,7,5,11,9,9,7,7,8,11,22,28,11,11][i]||10}));

  // Force TEXT: docNo, debtor, salesman, barcode, loc, billId (กัน scientific notation)
  const ref = XLSX.utils.decode_range(ws['!ref']);
  for(let r=1;r<=ref.e.r;r++){
    for(const c of [1,2,7,10,18,23]){
      const addr = XLSX.utils.encode_cell({r,c}); const cell = ws[addr];
      if(cell && cell.v!=null && cell.v!==''){ cell.t='s'; cell.v=String(cell.v); cell.z='@'; }
    }
  }
  XLSX.utils.book_append_sheet(wb, ws, 'ใบจองสินค้า');
  XLSX.writeFile(wb, `ใบจอง-${runDate}.xlsx`);
  toast(`✅ ดาวน์โหลดแล้ว · ${selBills.length} บิล · ${bRows.length} บรรทัด`);
}
