<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Rattana รายงานสรุปยอดขายตามหมวดหมู่ v3.46</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
<style>
:root{--navy:#0d1b3e;--navy-mid:#1a2f5e;--navy-light:#243b73;--gold:#c9a84c;--gold-light:#e8c86a;--success:#2ecc71;--danger:#e74c3c;--warning:#f39c12;--info:#3498db;--bg:#f4f6fb;--text:#0d1b3e;--card-bg:#fff;--border:#dde3f0;--muted:#6b7896;--row-alt:#fafbfd;--radius-sm:6px;--radius-md:12px;--radius-lg:16px;--shadow-md:0 2px 8px rgba(0,0,0,.08);--shadow-lg:0 8px 24px rgba(13,27,62,.12);--shadow-gold:0 4px 12px rgba(201,168,76,.35)}
body.dark{--bg:#0a1020;--text:#e8eaf0;--card-bg:#111c35;--border:#243b73;--muted:#8a98b8;--row-alt:#0f1830}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Sarabun',sans-serif;font-size:14px;line-height:1.5;min-height:100dvh;overflow-x:hidden;background:var(--bg);color:var(--text);transition:background .25s,color .25s}
button{font-family:inherit;cursor:pointer;border:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
input,select{font-family:inherit;font-size:16px}
header{background:var(--navy);color:#fff;padding:10px 14px;position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:10px;border-bottom:3px solid var(--gold);padding-top:max(10px,env(safe-area-inset-top))}
.logo-text{font-weight:700;letter-spacing:1.5px;font-size:16px;color:#fff;white-space:nowrap}
.logo-text span{color:var(--gold)}
.h-sub{font-size:11px;color:rgba(255,255,255,.65);letter-spacing:.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.2);width:38px;height:38px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-size:17px;transition:background .15s;flex-shrink:0}
.icon-btn:hover{background:rgba(255,255,255,.12)}
.tab-nav{display:flex;background:var(--navy);border-bottom:3px solid var(--gold);padding:0 8px;gap:4px;overflow-x:auto;scrollbar-width:none}
.tab-nav::-webkit-scrollbar{display:none}
.tab-btn{background:transparent;color:rgba(255,255,255,.6);padding:11px 16px;font-size:13px;font-weight:600;border-bottom:3px solid transparent;white-space:nowrap;flex-shrink:0;transition:all .18s;margin-bottom:-3px;border-radius:var(--radius-sm) var(--radius-sm) 0 0}
.tab-btn.active{color:var(--navy);background:var(--gold);font-weight:700}
.tab-nav{position:sticky;top:var(--h1,54px);z-index:99}
.mstick{position:sticky;top:var(--h2,104px);z-index:60;background:var(--bg);padding:10px 12px 2px;margin:-10px -12px 0}
.mstick.on{box-shadow:0 8px 12px -8px rgba(13,27,62,.35);border-bottom:1px solid var(--border)}
@media(min-width:1024px){.mstick{padding:12px 20px 2px;margin:-12px -20px 0}}
.content{flex:1;padding:12px;max-width:1200px;margin:0 auto;width:100%}
@media(min-width:1024px){.content{padding:20px}}
.card{background:var(--card-bg);border-radius:var(--radius-md);border:1px solid var(--border);box-shadow:var(--shadow-md);margin-bottom:12px}
.card-gold{border-top:3px solid var(--gold)}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px;border-bottom:1px solid var(--border);background:linear-gradient(to right,rgba(201,168,76,.07),transparent);font-weight:700;font-size:14px}
.card-body{padding:14px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;border:1px solid transparent;min-height:40px;transition:opacity .15s,transform .1s}
.btn:hover{opacity:.88}.btn:active{transform:scale(.97)}
.btn-gold{background:var(--gold);color:var(--navy)}
.btn-outline{background:transparent;color:var(--text);border-color:var(--border)}
.btn-sm{padding:5px 10px;font-size:12px;min-height:32px}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;white-space:nowrap}
.badge-gold{background:rgba(201,168,76,.18);color:var(--navy);border:1px solid rgba(201,168,76,.4)}
body.dark .badge-gold{color:var(--gold-light)}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;max-height:72vh;overflow-y:auto}
.tbl{width:100%;border-collapse:collapse;min-width:560px}
.tbl thead{background:var(--navy);color:#fff;position:sticky;top:0;z-index:5}
.tbl thead th{padding:9px 10px;text-align:left;font-size:12px;font-weight:600;white-space:nowrap;border-bottom:2px solid var(--gold);cursor:pointer;user-select:none}
.tbl thead th:hover{background:var(--navy-mid)}
.tbl thead th .sort-ind{font-size:10px;color:var(--gold);margin-left:4px;font-weight:700}
.tbl tbody tr{border-bottom:1px solid var(--border)}
.tbl tbody tr:nth-child(even){background:var(--row-alt)}
.tbl tbody tr:hover{background:rgba(201,168,76,.08)}
.tbl td{padding:8px 10px;font-size:13px;vertical-align:middle}
.tbl td.num,.tbl th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl td.num{font-weight:500}
.tbl .empty-row td{text-align:center;padding:40px 20px;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.3px;text-transform:uppercase}
.input{height:42px;padding:0 12px;border-radius:var(--radius-sm);border:1.5px solid var(--border);background:var(--card-bg);color:var(--text);font-size:16px;outline:none;width:100%}
.input:focus{border-color:var(--gold)}
.filter-bar{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius-md);padding:12px;margin-bottom:12px;display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:640px){.filter-bar{grid-template-columns:repeat(4,1fr)}}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:6px 12px;border-radius:16px;border:1.5px solid var(--border);background:var(--card-bg);color:var(--text);font-size:12px;font-weight:600}
.chip.on{background:var(--gold);border-color:var(--gold);color:var(--navy)}
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
@media(min-width:640px){.stat-grid{grid-template-columns:repeat(4,1fr);gap:14px}}
.stat-card{background:var(--card-bg);border-radius:var(--radius-md);padding:14px;border:1px solid var(--border);border-top:3px solid var(--gold)}
.stat-card .s-label{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.4px;text-transform:uppercase;margin-bottom:6px}
.stat-card .s-value{font-size:21px;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums}
.stat-card .s-sub{font-size:11px;color:var(--muted);margin-top:4px}
@media(min-width:640px){.stat-card .s-value{font-size:25px}}
.dd-wrap{position:relative;width:100%}
.dd-trigger{width:100%;min-height:42px;padding:8px 12px;background:var(--card-bg);border:1.5px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-size:15px;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:6px}
.dd-trigger span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dd-panel{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--card-bg);border:1.5px solid var(--border);border-radius:var(--radius-sm);z-index:500;box-shadow:var(--shadow-lg);max-height:280px;display:none;flex-direction:column}
.dd-search{padding:10px 12px;font-size:16px;border:none;border-bottom:1px solid var(--border);background:transparent;color:var(--text);outline:none;font-family:inherit}
.dd-list{overflow-y:auto;flex:1;list-style:none;padding:4px 0;margin:0}
.dd-list li{padding:9px 12px;cursor:pointer;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dd-list li:hover{background:var(--navy-light);color:#fff}
.bar-row{display:grid;grid-template-columns:24px 1fr 96px;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--border);cursor:pointer}
.bar-row:hover{background:rgba(201,168,76,.08)}
.bar-rank{font-size:11px;color:var(--muted);font-weight:700;text-align:center}
.bar-name{font-size:13px;font-weight:600;margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{height:8px;background:var(--border);border-radius:4px;overflow:hidden}
.bar-fill{height:100%;background:linear-gradient(90deg,var(--navy-light),var(--gold));border-radius:4px}
.bar-val{text-align:right;font-variant-numeric:tabular-nums;font-weight:700;font-size:13px}
.bar-pct{font-size:10px;color:var(--muted);font-weight:500;text-align:right}
#spinner{display:none;position:fixed;inset:0;background:rgba(13,27,62,.6);align-items:center;justify-content:center;z-index:99999;backdrop-filter:blur(3px)}
#spinner.show{display:flex}
.spin-box{background:#fff;border-radius:var(--radius-lg);padding:32px 40px;text-align:center;border-top:4px solid var(--gold);color:#0d1b3e}
.spin-ring{width:48px;height:48px;border:5px solid #dde3f0;border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px}
#loadingBar{position:fixed;top:0;left:0;height:3px;background:var(--gold);width:0;transition:width .4s;z-index:10000}
.toast{position:fixed;bottom:max(24px,env(safe-area-inset-bottom));right:16px;padding:12px 18px;border-radius:var(--radius-md);color:#fff;z-index:9999;animation:slideIn .3s ease;font-weight:500;box-shadow:var(--shadow-lg);font-size:13px;max-width:90vw}
.toast-success{background:var(--success)}.toast-error{background:var(--danger)}.toast-info{background:var(--navy-mid);border-left:3px solid var(--gold)}
#backToTop{position:fixed;bottom:max(24px,calc(16px + env(safe-area-inset-bottom)));right:max(16px,calc(12px + env(safe-area-inset-right)));background:var(--gold);color:var(--navy);border-radius:50%;width:46px;height:46px;display:none;align-items:center;justify-content:center;box-shadow:var(--shadow-gold);z-index:90;font-size:18px;font-weight:700}
#backToTop.show{display:flex}
.errbox{background:rgba(231,76,60,.10);border:1px solid var(--danger);border-left:4px solid var(--danger);border-radius:var(--radius-md);padding:14px 16px;margin:12px auto;max-width:1200px;font-size:13px;line-height:1.7;color:var(--text)}
.errbox code{background:rgba(0,0,0,.08);padding:1px 6px;border-radius:4px;font-size:12px}
body.dark .errbox code{background:rgba(255,255,255,.1)}
.note{font-size:12px;color:var(--muted);padding:10px 12px;background:rgba(201,168,76,.10);border-left:3px solid var(--gold);border-radius:var(--radius-sm);margin-bottom:12px;line-height:1.6}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes slideIn{from{transform:translateX(120%);opacity:0}to{transform:translateX(0);opacity:1}}
.hidden{display:none!important}
.txt-muted{color:var(--muted)}.txt-sm{font-size:12px}.mt-12{margin-top:12px}
</style>
</head>
<body>
<div id="loadingBar"></div>
<div id="spinner"><div class="spin-box"><div class="spin-ring"></div><p id="spinnerMsg">กำลังโหลด...</p></div></div>
<header>
  <div style="flex:1;min-width:0">
    <div class="logo-text">RATTANA <span>MART</span></div>
    <div class="h-sub">Rattana รายงานสรุปยอดขายตามหมวดหมู่ · v3.46</div>
  </div>
  <button class="icon-btn" id="btnRefresh" onclick="refreshData()" title="รีเฟรช">&#10227;</button>
  <button class="icon-btn" onclick="document.body.classList.toggle('dark')" title="สลับธีม">&#9686;</button>
</header>
<div id="errBox" class="errbox hidden" style="margin-left:12px;margin-right:12px"></div>
<style>
.cat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:720px){.cat-grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1100px){.cat-grid{grid-template-columns:repeat(4,1fr)}}
.cc{background:var(--card-bg);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-md);position:relative;transition:transform .12s,box-shadow .18s;overflow:hidden}
.cc:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.cc-body{padding:12px}
.cc-row{display:flex;align-items:center;gap:9px;min-width:0}
.cc-ico{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;flex:0 0 auto}
.cc-name{font-size:13px;font-weight:700;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cc-sub{font-size:10.5px;color:var(--muted)}
.cc-rank{position:absolute;top:8px;right:10px;font-size:10px;font-weight:700;color:var(--muted)}
.cc-total{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:10px}
.cc-total small{font-size:11px;color:var(--muted);margin-left:2px}
.cc-track{height:4px;border-radius:2px;background:var(--border);overflow:hidden;margin:7px 0 8px}
.cc-fill{display:block;height:100%}
.cc-foot{font-size:10.5px;color:var(--muted);display:flex;justify-content:space-between;margin-top:2px}
.cc-btn{width:100%;margin-top:9px;min-height:30px;border-radius:var(--radius-sm);border:1.5px solid var(--border);background:transparent;color:var(--muted);font-size:11px;font-weight:600;font-family:inherit}
.cc-btn:hover{border-color:var(--gold);color:var(--gold)}
.cc-list{border-top:1px solid var(--border);background:var(--row-alt);padding:8px 12px 10px}
.cc-item .i-img{width:26px;height:26px;border-radius:6px;object-fit:contain;background:#fff;border:1px solid var(--border)}
.cc-item .i-img.ph{display:flex;align-items:center;justify-content:center;font-size:13px;background:var(--row-alt)}
.cc-item{display:grid;grid-template-columns:16px 26px 1fr auto;gap:7px;align-items:center;padding:5px 0;border-bottom:1px dashed var(--border);font-size:11.5px}
.cc-item:last-child{border-bottom:none}
.cc-item .i-n{font-size:10px;color:var(--muted);font-weight:700;text-align:center}
.cc-item .i-p{min-width:0;overflow:hidden}
.cc-item .i-p b{font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cc-item .i-q{font-size:9.5px;color:var(--muted)}
.cc-item .i-v{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.u-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.u-chip{display:inline-flex;align-items:baseline;gap:5px;padding:4px 11px;border-radius:14px;font-size:13px;font-weight:700;border:1.5px solid;font-variant-numeric:tabular-nums}
.u-chip small{font-size:10px;font-weight:600;opacity:.85}
.u-chip.cs{color:#b45309;border-color:rgba(230,126,34,.5);background:rgba(230,126,34,.10)}
.u-chip.bp{color:#7d3c98;border-color:rgba(155,89,182,.5);background:rgba(155,89,182,.10)}
.u-chip.pa{color:#1a6fb8;border-color:rgba(52,152,219,.5);background:rgba(52,152,219,.10)}
.u-chip.ea{color:#1e8449;border-color:rgba(46,204,113,.5);background:rgba(46,204,113,.10)}
.u-chip.oth{color:var(--muted);border-color:var(--border);background:var(--row-alt)}
body.dark .u-chip.cs{color:#f0b27a}body.dark .u-chip.bp{color:#c89bdd}body.dark .u-chip.pa{color:#7fc3f0}body.dark .u-chip.ea{color:#7be0a3}
.cc-more{width:100%;margin-top:8px;min-height:34px;border-radius:var(--radius-sm);border:1.5px dashed var(--border);background:transparent;color:var(--muted);font-size:12px;font-weight:600;font-family:inherit}
.cc-more:hover{border-color:var(--gold);color:var(--gold);border-style:solid}
.cc .u-chips{gap:4px;margin:2px 0 6px}
.cc .u-chip{padding:2px 7px;font-size:11px;border-width:1.2px}
.cc .u-chip small{font-size:9px}
.cc-rate{display:flex;gap:12px;font-size:11px;color:var(--muted);margin-bottom:10px}
.cc-rate b{color:var(--text);font-variant-numeric:tabular-nums;font-weight:700}
/* ---- ตารางยอดขายรายวัน x ช่วงเวลา ---- */
.dwrap{overflow:auto}
table.dt{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%;font-size:12px}
table.dt th,table.dt td{border-right:1px solid var(--border);border-bottom:1px solid var(--border);padding:5px 9px;white-space:nowrap}
table.dt thead th{position:sticky;background:var(--navy);color:#fff;font-weight:600;text-align:center;z-index:3}
table.dt thead tr:nth-child(1) th{top:0;height:28px}
table.dt thead tr:nth-child(2) th{top:28px}
table.dt thead tr:nth-child(3) th{top:56px}
table.dt thead tr:nth-child(4) th{top:84px;border-bottom:2px solid var(--gold)}
table.dt .ttl-row th{background:var(--navy-mid);color:#fff;font-weight:700}
table.dt td.d,table.dt th.d{text-align:right;font-variant-numeric:tabular-nums}
table.dt .day{position:sticky;left:44px;z-index:2;background:var(--card-bg);text-align:left;font-weight:600;border-right:2px solid var(--gold)}
table.dt .wd{position:sticky;left:0;z-index:2;width:44px;min-width:44px;text-align:center;font-size:11px;color:var(--muted);background:var(--card-bg)}
table.dt thead .day,table.dt thead .wd{z-index:5;background:var(--navy);color:#fff}
table.dt tbody tr:hover td{filter:brightness(.97)}
body.dark table.dt tbody tr:hover td{filter:brightness(1.15)}
.dt .sun{color:#e74c3c;font-weight:700}.dt .sat{color:#8e44ad;font-weight:700}
.dt .t1{background:rgba(243,156,18,.13)}.dt .t2{background:rgba(46,204,113,.13)}.dt .t3{background:rgba(52,199,219,.15)}
.dt .t4{background:rgba(142,68,173,.13)}.dt .t5{background:rgba(201,168,76,.18)}.dt .t6{background:rgba(231,76,60,.13)}
.dt .tot{background:rgba(52,152,219,.10)}
.dt thead th.t1{background:#f0c674;color:#3d2c00}.dt thead th.t2{background:#7ed6a5;color:#08331d}
.dt thead th.t3{background:#7fd8e0;color:#04333a}.dt thead th.t4{background:#b39ddb;color:#241239}
.dt thead th.t5{background:#d9bd76;color:#33260a}.dt thead th.t6{background:#f19c94;color:#3b0f0a}
.dt thead th.tot{background:#a8c8ec;color:#0d1b3e}
.dlegend{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--muted);padding:10px 14px 0;align-items:center}
.dlegend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:4px;vertical-align:-1px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar .sel{height:38px;padding:0 10px;border-radius:var(--radius-sm);border:1.5px solid var(--border);background:var(--card-bg);color:var(--text);font-size:14px}
.tab-nav{display:flex;background:var(--navy);border-bottom:3px solid var(--gold);padding:0 8px;gap:4px;overflow-x:auto;scrollbar-width:none}
.tab-nav::-webkit-scrollbar{display:none}
.tab-btn{background:transparent;color:rgba(255,255,255,.6);padding:11px 18px;font-size:13px;font-weight:600;border-bottom:3px solid transparent;white-space:nowrap;flex-shrink:0;transition:all .18s;margin-bottom:-3px;border-radius:var(--radius-sm) var(--radius-sm) 0 0;font-family:inherit}
.tab-btn.active{color:var(--navy);background:var(--gold);font-weight:700}
.ptools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
#viewShelf .av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:12.5px;font-weight:700;color:#fff;flex:0 0 28px}
#viewShelf .av.lg{width:42px;height:42px;font-size:17px;flex-basis:42px}
#viewShelf .who{display:inline-flex;align-items:center;gap:8px;font-weight:700;white-space:nowrap}
#viewShelf .obar{height:9px;border-radius:5px;background:var(--border);overflow:hidden;min-width:110px;margin-top:5px}
#viewShelf .obar i{display:block;height:100%}
#viewShelf .cname{font-size:15px;font-weight:700}
#viewShelf .csub{font-size:11.5px;color:var(--muted)}
#viewShelf .cbig{font-size:21px;font-weight:700;white-space:nowrap}
#viewShelf .mets{display:flex;gap:14px;flex-wrap:wrap}

<script>
/* ============ Rattana Sales by Category — core v1.0 ============ */
const CFG = {
  salesSheetId : '1D0zsHDPVNFtrKBsOBWeCceDmXRSmLSi6rjNM6bkJ4iY',
  salesGid     : '0',            // ชีต Data
  catSheetId   : '1D0zsHDPVNFtrKBsOBWeCceDmXRSmLSi6rjNM6bkJ4iY',
  catGid       : '532589069',    // ชีต Sheet12: PRODUCT NAME -> CAT GROUP (ใช้แทน PDDT ชั่วคราว)
  catKeyCol    : 'PRODUCT NAME',
  catCols      : { group:'CAT GROUP', brand:'CAT BRAND', size:'CAT SIZE' },
  NO_CAT       : '(ไม่ระบุหมวด)',
  TTL          : 5*60*1000
};

/* ---------- utils ---------- */
// ใช้ /export เพราะคืนค่าตามที่แสดงในชีตจริง (gviz จะทำให้คอลัมน์ DATE บางแถวหาย)
const csvUrl  = (id,gid) => `https://docs.google.com/spreadsheets/d/${id}/export?format=csv&gid=${gid}`;
// สำรอง: gviz (ใช้เมื่อ /export ล้มเหลว)
const csvUrl2 = (id,gid) => `https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:csv&gid=${gid}&headers=1`;
function parseCsv(text){
  if(!text) return [];
  if(text.charCodeAt(0)===0xFEFF) text=text.slice(1);
  const rows=[]; let row=[],cell='',q=false;
  for(let i=0;i<text.length;i++){ const ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=ch; }
    else { if(ch==='"') q=true;
      else if(ch===','){ row.push(cell); cell=''; }
      else if(ch==='\r'){}
      else if(ch==='\n'){ row.push(cell); rows.push(row); row=[]; cell=''; }
      else cell+=ch; } }
  if(cell.length||row.length){ row.push(cell); rows.push(row); }
  if(!rows.length) return [];
  const clean=s=>String(s||'').replace(/[​‌‍﻿]/g,'').replace(/ /g,' ').trim();
  const H=rows[0].map(clean);
  return rows.slice(1).filter(r=>r.some(c=>clean(c))).map(r=>Object.fromEntries(H.map((k,i)=>[k,clean(r[i])])));
}
const num  = v => { const n=parseFloat(String(v||'').replace(/,/g,'')); return isNaN(n)?0:n; };
const fmtB = n => n.toLocaleString('th-TH',{minimumFractionDigits:0,maximumFractionDigits:0});
const fmtB2= n => n.toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtK = n => n>=1e6 ? (n/1e6).toFixed(2)+' ล.' : n>=1e3 ? (n/1e3).toFixed(0)+' พ.' : fmtB(n);
/* DATE ในชีตเป็น dd/mm/yyyy (ค.ศ.) */
function toDate(s){ const m=/^(\d{2})\/(\d{2})\/(\d{4})$/.exec(s||''); return m? new Date(+m[3],+m[2]-1,+m[1]) : null; }
const iso   = d => d? `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}` : '';
const thDate= d => d? `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()+543}` : '-';
const thShort=d => d? `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}` : '-';
const RU_LABEL={EA:'ชิ้น',PA:'แพ็ค',CS:'ลัง',BPA:'แพ็คใหญ่',OTH:'ไม่ระบุ'};
const RU_ORDER=['CS','BPA','PA','EA','OTH'];
const SLOT_LABEL={T1:'T1 06-09',T2:'T2 09-12',T3:'T3 12-15',T4:'T4 15-18',T5:'T5 18-21',T6:'T6 21-24'};

const showSpinner=(m='กำลังโหลด...')=>{document.getElementById('spinnerMsg').textContent=m;document.getElementById('spinner').classList.add('show');};
const hideSpinner=()=>document.getElementById('spinner').classList.remove('show');
const setLoading =on=>document.getElementById('loadingBar').style.width=on?'85%':'0';
function showToast(msg,type='info'){const t=document.createElement('div');t.className=`toast toast-${type}`;t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),3500);}
window.addEventListener('scroll',()=>document.getElementById('backToTop').classList.toggle('show',window.scrollY>300));
const getCached=k=>{try{const i=JSON.parse(localStorage.getItem(k));return i&&Date.now()-i.ts<CFG.TTL?i.data:null;}catch{return null;}};
const setCache =(k,d)=>{try{localStorage.setItem(k,JSON.stringify({ts:Date.now(),data:d}));}catch{}};

/* ---------- state ---------- */
let ROWS=[], CATS=[], PRODCAT={}, HAS_BRAND=false, HAS_SIZE=false;
const F={from:'',to:'',cat:'',slots:new Set(),q:''};

/* ---------- load ---------- */
async function fetchCsv(id,gid,label){
  let last;
  for(const u of [csvUrl(id,gid),csvUrl2(id,gid)]){
    try{ const r=await fetch(u,{cache:'no-store'});
      if(!r.ok) throw new Error('HTTP '+r.status);
      const t=await r.text();
      const rows=parseCsv(t);
      if(rows.length) return rows;
      throw new Error('ไม่มีข้อมูลในชีต');
    }catch(e){ last=e; }
  }
  throw new Error(`โหลดชีต ${label} ไม่สำเร็จ (${last&&last.message||'unknown'})`);
}
/* กล่องแจ้งปัญหาแบบค้างบนหน้าจอ */
function showError(msg,detail){
  const box=document.getElementById('errBox'); if(!box) return;
  box.innerHTML=`<div style="font-weight:700;margin-bottom:6px">&#9888; โหลดข้อมูลไม่สำเร็จ</div>
    <div style="margin-bottom:8px">${msg}</div>
    ${detail?`<div class="txt-sm" style="opacity:.85;margin-bottom:10px">${detail}</div>`:''}
    <button class="btn btn-gold btn-sm" onclick="refreshData()">ลองใหม่อีกครั้ง</button>`;
  box.classList.remove('hidden');
}
const hideError=()=>document.getElementById('errBox')?.classList.add('hidden');
async function loadData(useCache=true){
  const ck='rsc_rows_v5';
  if(useCache){ const c=getCached(ck); if(c){ hydrate(c); return; } }
  const [sales,cats]=await Promise.all([
    fetchCsv(CFG.salesSheetId,CFG.salesGid,'Data'),
    fetchCsv(CFG.catSheetId,CFG.catGid,'Sheet12').catch(e=>{ console.warn(e); return []; })  // ถ้าตารางหมวดล่ม ยังดูยอดขายได้
  ]);
  const map={};
  const c0=CFG.catCols;
  HAS_BRAND = cats.length>0 && c0.brand in cats[0];
  HAS_SIZE  = cats.length>0 && c0.size  in cats[0];
  for(const r of cats){ const k=r[CFG.catKeyCol]; if(!k||map[k]) continue;
    map[k]={g:r[c0.group]||'',b:HAS_BRAND?(r[c0.brand]||''):'',s:HAS_SIZE?(r[c0.size]||''):''}; }
  const out=sales.map(r=>{ const p=r['PRODUCT_NAME']||''; const c=map[p]||{};
    return { bill:String(r['BILL_NO']||''), d:r['DATE']||'', prod:p,
             qty:num(r['QTY']),                       // จำนวน "หน่วยขาย" (ลัง/แพ็ค/ชิ้น ตาม UNIT)
             pcs:num(r['ขายชิ้น'])||num(r['QTY']),     // จำนวนชิ้นจริง (แตกแพ็คแล้ว)
             total:num(r['TOTAL']), slot:r['TIME_SLOTS']||'',
             shelf:r['Shelf']||'', unit:r['UNIT']||'', member:String(r['MEMBER']||''),
             ru:(r['R unit']||'').trim().toUpperCase()||'OTH',   // หน่วยนับ: EA / PA / CS / BPA
             cat:(c.g||CFG.NO_CAT), brand:c.b||'', size:c.s||'' }; })
    .filter(r=>r.prod);
  const payload={rows:out,hasBrand:HAS_BRAND,hasSize:HAS_SIZE};
  setCache(ck,payload); hydrate(payload);
}
function hydrate(p){
  ROWS=p.rows; HAS_BRAND=p.hasBrand; HAS_SIZE=p.hasSize;
  ROWS.forEach(r=>r.dt=toDate(r.d));
  CATS=[...new Set(ROWS.map(r=>r.cat))].sort((a,b)=>a.localeCompare(b,'th'));
  const ds=ROWS.map(r=>r.dt).filter(Boolean).sort((a,b)=>a-b);
  if(ds.length && !F.from){ F.from=iso(ds[0]); F.to=iso(ds[ds.length-1]); }
}

/* ---------- filter + aggregate ---------- */
function filtered(){
  const q=F.q.trim().toLowerCase();
  return ROWS.filter(r=>{
    if(F.from && r.d && iso(r.dt)<F.from) return false;
    if(F.to   && r.d && iso(r.dt)>F.to  ) return false;
    if(F.cat  && r.cat!==F.cat) return false;
    if(F.slots.size && !F.slots.has(r.slot)) return false;
    if(q && !(r.prod.toLowerCase().includes(q)||r.cat.toLowerCase().includes(q))) return false;
    return true;
  });
}
function groupBy(rows,keyFn){
  const m=new Map();
  for(const r of rows){ const k=keyFn(r); if(k===null||k===undefined||k==='') continue;
    let o=m.get(k); if(!o){o={k,total:0,qty:0,pcs:0,n:0,bills:new Set()};m.set(k,o);}
    o.total+=r.total; o.qty+=r.qty; o.pcs+=r.pcs; o.n++; o.bills.add(r.bill); }
  return [...m.values()].map(o=>({...o,bills:o.bills.size}));
}
const sumT=rows=>rows.reduce((s,r)=>s+r.total,0);
function kpis(rows){
  const total=sumT(rows), bills=new Set(rows.map(r=>r.bill)).size;
  const days =new Set(rows.map(r=>r.d)).size;
  return {total,bills,days,skus:new Set(rows.map(r=>r.prod)).size,
          pcs:rows.reduce((s,r)=>s+r.pcs,0),   // ชิ้นจริง (จากคอลัมน์ "ขายชิ้น")
          qty:rows.reduce((s,r)=>s+r.qty,0),   // หน่วยขาย (จากคอลัมน์ QTY)
          perBill: bills? total/bills:0, perDay: days? total/days:0,
          cats:new Set(rows.map(r=>r.cat)).size};
}

/* ---------- sort helper ---------- */
function makeSorter(state){
  return (rows,key,type)=>{ const m=state.dir==='asc'?1:-1;
    return [...rows].sort((a,b)=>{ const va=a[key],vb=b[key];
      if(type==='num')  return ((+va||0)-(+vb||0))*m;
      if(type==='date') return ((toDate(va)||0)-(toDate(vb)||0))*m;
      return String(va||'').localeCompare(String(vb||''),'th')*m; }); };
}
function bindSort(tableId,state,rerender){

    if(!th.dataset.key) return;
    th.addEventListener('click',()=>{ const k=th.dataset.key,t=th.dataset.type||'str';
      if(state.key===k) state.dir=state.dir==='asc'?'desc':'asc';
      else { state.key=k; state.dir=(t==='num'||t==='date')?'desc':'asc'; }
      rerender(); indicators(tableId,state); });
  });
}

/* ================= เลือกดูข้อมูลย้อนหลังรายเดือน (BigQuery ผ่าน Apps Script) ================= */
const BQ_URL='https://script.google.com/macros/s/AKfycbzopWIO-Kf7QOjFwY8Jfh7mCBMOai1ZMm33qgEnH1SML-XfbCeaes4dcEm3HaJXtY9X/exec';
const BQ_TABLE='`project-test-471907.Testimport.POS`';
const TH_MON=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
let MONTHS=[], SEL=null, PAST={}, MBOOT=false;

/* ส่งแบบ text/plain เพื่อไม่ให้เบราว์เซอร์ทำ preflight (Apps Script ไม่รับ OPTIONS) */
async function bq(sql){
  const r=await fetch(BQ_URL,{method:'POST',body:JSON.stringify({query:sql})});
  const j=await r.json();
  if(j.error) throw new Error(j.error);
  return j.data||[];
}
/* อ่านแคชรายเดือนที่ Apps Script เตรียมไว้ (เร็วกว่ายิง BigQuery สด) */
async function bqGet(q){
  const r=await fetch(BQ_URL+'?'+q,{cache:'no-store'});
  const j=await r.json();
  if(j.error) throw new Error(j.error);
  return j;
}
const monLabel=ym=>{ const [y,m]=ym.split('-').map(Number); return `${TH_MON[m-1]} ${y+543}`; };
const curMonth=()=>{ const ds=ROWS.map(r=>r.dt).filter(Boolean).sort((a,b)=>a-b);
  const d=ds[ds.length-1]||new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; };

async function buildMonths(){
  const now=curMonth();
  MONTHS=[{ym:now,live:true}];            /* แสดงเดือนปัจจุบันทันที ไม่ต้องรอ BigQuery */
  if(!SEL) SEL=now;
  renderMonthChips(true);
  let list=[];
  try{                                      /* 1) รายชื่อเดือนจากแคช Drive */
    list=(await bqGet('list=1')).months||[];
  }catch(e){ console.warn('cache list',e); }
  if(!list.length){                         /* 2) ไม่มีแคช -> ถาม BigQuery สด */
    try{
      list=(await bq(`SELECT MONTH FROM ${BQ_TABLE} GROUP BY 1 ORDER BY 1 DESC`))
        .map(o=>String(o.MONTH).replace('/','-'));
    }catch(e){ console.warn('BQ months',e); }
  }
  list.sort((a,b)=>b.localeCompare(a));
  MONTHS=[{ym:now,live:true}, ...list.filter(x=>x!==now).map(ym=>({ym,live:false}))];
  renderMonthChips();
}
function renderMonthChips(loading){
  const box=document.getElementById('mchips'); if(!box) return;
  box.innerHTML=`<span class="txt-sm txt-muted">เลือกเดือน</span>`+

    try{ await loadMonth(ym); }

/* ดึงยอดรายเดือนด้วย query เดียว (Apps Script ยิงทีละคำสั่ง ถ้าส่งพร้อมกันจะช้า/หลุด) */
async function loadMonth(ym){
  if(PAST[ym]) return PAST[ym];
  const ck='bqm_'+ym;
  try{ const c=JSON.parse(localStorage.getItem(ck)||'null');
       if(c && Date.now()-c.ts < 12*3600*1000){ PAST[ym]=fromBQ(c.rows); return PAST[ym]; } }catch(e){}
  try{                                      /* 1) แคชที่ตัวตั้งเวลาเตรียมไว้ (วันที่ 3 ของเดือน 08:00) */
    const j=await bqGet('agg='+ym);
    if(j.data&&j.data.length){
      try{ localStorage.setItem(ck,JSON.stringify({ts:Date.now(),rows:j.data})); }catch(e){}
      PAST[ym]=fromBQ(j.data); return PAST[ym];
    }
  }catch(e){ console.warn('cache agg',ym,e.message); }
  const m=ym.replace('-','/');              /* 2) ไม่มีแคช -> ยิง BigQuery สด */
  const rows=await bq(`SELECT a.CAT_GROUP, a.PRODUCT_NAME, a.UNIT, a.TOTAL, a.SALES_QTY, b.BILLS
    FROM (SELECT CAT_GROUP, PRODUCT_NAME, UNIT, SUM(TOTAL) AS TOTAL, SUM(SALES_QTY) AS SALES_QTY
          FROM ${BQ_TABLE} WHERE MONTH='${m}' GROUP BY 1,2,3) a
    LEFT JOIN (SELECT CAT_GROUP, COUNT(DISTINCT BILL_NO) AS BILLS
               FROM ${BQ_TABLE} WHERE MONTH='${m}' GROUP BY 1) b USING (CAT_GROUP)`);
  try{ localStorage.setItem(ck,JSON.stringify({ts:Date.now(),rows})); }catch(e){}
  PAST[ym]=fromBQ(rows); return PAST[ym];
}
/* แปลง CAT_GROUP/PRODUCT_NAME/UNIT/TOTAL/SALES_QTY -> โครงสร้างเดียวกับการ์ดหมวดหมู่ */
function fromBQ(rows){
  const M=new Map(); let tot=0;
  for(const r of rows){
    const cat=(r.CAT_GROUP||'(ไม่ระบุหมวด)').trim(), prod=(r.PRODUCT_NAME||'').trim();
    if(!prod) continue;
    const baht=num(r.TOTAL), qty=num(r.SALES_QTY);
    const mm=/\b(CS|BPA|BP|PA|EA)\b/i.exec(String(r.UNIT||''));
    const u=mm?(mm[1].toUpperCase()==='BPA'?'BP':mm[1].toUpperCase()):'OTH';
    tot+=baht;
    let c=M.get(cat);
    if(!c){ c={k:cat,total:0,u:{},skus:new Set(),prod:new Map(),bills:num(r.BILLS)}; M.set(cat,c); }
    if(!c.bills) c.bills=num(r.BILLS);
    c.total+=baht; c.u[u]=(c.u[u]||0)+qty; c.skus.add(prod);
    const p=c.prod.get(prod)||{t:0,u:{}}; p.t+=baht; p.u[u]=(p.u[u]||0)+qty; c.prod.set(prod,p);
  }
  const cats=[...M.values()].map(c=>({...c,skus:c.skus.size,
    CS:c.u.CS||0,BP:c.u.BP||0,PA:c.u.PA||0,EA:c.u.EA||0,
    top:[...c.prod.entries()].map(([n,v])=>({n,...v})).sort((a,b)=>b.t-a.t)}))
    .sort((a,b)=>b.total-a.total);
  const U={}; SHOW.forEach(x=>U[x]=cats.reduce((a,c)=>a+(c.u[x]||0),0));
  return {cats,tot,U,skus:cats.reduce((a,c)=>a+c.skus,0),bills:cats.reduce((a,c)=>a+c.bills,0)};
}

const OPAL=['#c9a84c','#3498db','#2ecc71','#e67e22','#8e44ad','#16a085','#e74c3c','#2c3e50'];

/* ดึงเฉพาะ 3 คอลัมน์ที่ใช้ (G=PRODUCT NAME, J=Shelf, T=ผู้รับผิดชอบ) ให้ไฟล์เล็กลง ~4 เท่า */
async function loadLoc(){
  if(LOCMAP) return LOCMAP;
  const u='https://docs.google.com/spreadsheets/d/'+LOC_ID+'/gviz/tq?tqx=out:csv&sheet='+
          encodeURIComponent(LOC_SHEET)+'&tq='+encodeURIComponent('select G,J,T');
  const r=await fetch(u,{cache:'no-store'});
  if(!r.ok) throw new Error('HTTP '+r.status);
  const rows=parseCsv(await r.text());
  const M=new Map();
  for(const x of rows){ const p=(x['PRODUCT NAME']||'').trim(); if(!p||M.has(p)) continue;
    M.set(p,{sh:(x['Shelf']||'').trim()||'(ไม่ระบุ shelf)', ow:(x['ผู้รับผิดชอบ']||'').trim()||NOOWN}); }
  LOCMAP=M; return M;
}

function buildShelf(rows){
  const M=LOCMAP||new Map(), S=new Map(), O=new Map(); SH_TOT=0;
  for(const r of rows){
    const p=r.prod; if(!p) continue;
    const hit=M.get(p)||{sh:NOSH,ow:NOOWN}; SH_TOT+=r.total;
    let o=O.get(hit.ow);
    if(!o){ o={ow:hit.ow,total:0,u:{},sh:new Map(),prod:new Map(),bills:new Set()}; O.set(hit.ow,o); }
    o.total+=r.total; o.u[r.ru]=(o.u[r.ru]||0)+r.qty; o.bills.add(r.bill);
    o.sh.set(hit.sh,(o.sh.get(hit.sh)||0)+r.total);
    o.prod.set(p,(o.prod.get(p)||0)+r.total);
    const k=hit.sh+'|'+hit.ow;
    let c=S.get(k);
    if(!c){ c={sh:hit.sh,ow:hit.ow,total:0,u:{},prod:new Map(),bills:new Set()}; S.set(k,c); }
    c.total+=r.total; c.u[r.ru]=(c.u[r.ru]||0)+r.qty; c.bills.add(r.bill);
    const pr=c.prod.get(p)||{n:p,total:0,u:{}}; pr.total+=r.total; pr.u[r.ru]=(pr.u[r.ru]||0)+r.qty; c.prod.set(p,pr);
  }
  SH_OW=[...O.values()].map(o=>({ow:o.ow,total:o.total,u:o.u,bills:o.bills.size,
    shelves:[...o.sh.entries()].map(([n,v])=>({n,v})).sort((a,b)=>b.v-a.v),
    prods:[...o.prod.entries()].map(([n,v])=>({n,v})).sort((a,b)=>b.v-a.v)}))
    .map(o=>({...o,nsh:o.shelves.length,sku:o.prods.length})).sort((a,b)=>b.total-a.total);
  SH_LIST=[...S.values()].map(c=>({...c,sku:c.prod.size,nbill:c.bills.size,
    prods:[...c.prod.values()].sort((a,b)=>b.total-a.total)})).sort((a,b)=>b.total-a.total);
}

];
const TMAP=Object.fromEntries(TREND.map(t=>[t.k,t]));
let TRENDS=[], TFILTER='', IMG={};
/* รูปสินค้าจาก Google Drive (คอลัมน์ SKU_USAGE ในชีต PDDT) */
const imgUrl=(id,w=120)=>`https://drive.google.com/thumbnail?id=${id}&sz=w${w}`;
const imgTag=(id,cls,ico,w)=> id
  ? `<img class="${cls}" src="${imgUrl(id,w)}" loading="lazy" referrerpolicy="no-referrer" alt=""
        onerror="this.onerror=null;this.src='https://lh3.googleusercontent.com/d/${id}=w${w}'">`
  : `<div class="${cls} ph">${ico}</div>`;
function classify(avg,sell){
  if(!avg && !sell) return {k:'zero',d:0};
  if(!avg)          return {k:'new',d:100};
  const d=(sell-avg)/avg*100;
  return {k: d>50?'up2' : d>15?'up1' : d>=-15?'flat' : d>=-50?'down1':'down2', d};
}
async function loadTrend(){
  const ck='rsc_trend_v1', c=getCached(ck);
  const rows = c || await fetchCsv(PDDT_ID,PDDT_GID,'PDDT');
  if(!c) setCache(ck,rows);
  TRENDS = rows.filter(r=>(r['IB C4']||'').trim()).map(r=>{
    const avg=num(r['AVERAGE 60D_C4']), sell=num(r['SELL 7D C4']);
    const m=/[-\w]{25,}/.exec(r['SKU_USAGE']||''); const img=m?m[0]:'';
    const day7=sell/7;                       /* เฉลี่ยต่อวันของ 7 วันล่าสุด */
    const t=classify(avg,day7);
    return {n:r['PRODUCT NAME']||'', cat:(r['CAT GROUP']||'').trim(), avg, sell, day7, img,
            k:t.k, d:t.d, diff:day7-avg};
  }).filter(o=>o.n);
  IMG={}; TRENDS.forEach(o=>{ if(o.img) IMG[o.n]=o.img; });   /* แผนที่ ชื่อสินค้า -> รูป */
}
function renderTrend(){

  let list=TRENDS.filter(o=>(!TFILTER||o.k===TFILTER) && (!q||o.n.toLowerCase().includes(q)||o.cat.toLowerCase().includes(q)));

           : sortBy==='rise' ? (a,b)=>b.diff-a.diff
           : sortBy==='name' ? (a,b)=>a.n.localeCompare(b.n,'th')
           : sortBy==='sell' ? (a,b)=>b.day7-a.day7
           : sortBy==='avg'  ? (a,b)=>b.avg-a.avg
           : (a,b)=>Math.abs(b.diff)-Math.abs(a.diff) );
  window._trend=list;
  /* โหมด "ตกมากสุด -> เพิ่มมากสุด": ตัดหัว (ตกหนัก) + ท้าย (เพิ่มมาก) มาแสดงคู่กัน */

          <div class="tc-cat">${esc(o.cat||'-')} · รวม 7 วัน ${fmtU(o.sell)}</div>
        </div></div>
      <div class="tc-split">
        <div><div class="tc-lbl">เฉลี่ย/วัน · 60 วัน</div><div class="tc-val" style="color:var(--muted)">${o.avg.toFixed(1)}</div></div>
        <div class="sep"></div>
        <div><div class="tc-lbl">เฉลี่ย/วัน · 7 วันล่าสุด</div><div class="tc-val" style="color:${t.c}">${o.day7.toFixed(1)}</div></div>
      </div>
      <div class="tc-res" style="color:${t.c}">${t.ico} ${t.l} ${pct}
        <span class="sm">(${o.diff>0?'+':''}${o.diff.toFixed(1)}/วัน)</span></div>
    </article>`;
  }).join('') : '<div class="card" style="grid-column:1/-1"><div class="card-body txt-muted" style="text-align:center;padding:40px">ไม่พบสินค้าตามเงื่อนไข</div></div>';
}

function exportTrend(){
  exportExcel((window._trend||[]).map(o=>({'สินค้า':o.n,'หมวดหมู่':o.cat,
    'AVERAGE 60D (เฉลี่ย/วัน)':+o.avg.toFixed(2),'7 วันล่าสุด (เฉลี่ย/วัน)':+o.day7.toFixed(2),
    'SELL 7D รวม':o.sell,'ส่วนต่าง/วัน':+o.diff.toFixed(2),
    '% เทียบ AVERAGE':o.k==='new'?'ใหม่':(o.k==='zero'?'-':+o.d.toFixed(1)),
    'แนวโน้ม':TMAP[o.k].l})),'แนวโน้มขาย7วัน');
}

/* ================= ตารางยอดขายรายวัน x ช่วงเวลา ================= */
const SLOTS=['T1','T2','T3','T4','T5','T6'];
const SLOT_TIME={T1:'06:00:00-07:59:59',T2:'08:00:00-10:59:59',T3:'11:00:00-13:59:59',
                 T4:'14:00:00-16:59:59',T5:'17:00:00-19:59:59',T6:'20:00:00-21:59:59'};
const SLOT_COLOR={T1:'#f0c674',T2:'#7ed6a5',T3:'#7fd8e0',T4:'#b39ddb',T5:'#d9bd76',T6:'#f19c94'};
const WD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const RECENT=14;                 /* ค่าเริ่มต้น: 14 วันล่าสุด */
let SHOW_ALL_DAYS=false;
const n0=n=>n?Math.round(n).toLocaleString('th-TH'):'';
const n2=n=>n?n.toFixed(2):'';
function toggleDays(){ SHOW_ALL_DAYS=!SHOW_ALL_DAYS; render(); }

function buildDaily(rows){
  const byDay=new Map();
  for(const r of rows){
    if(!r.dt) continue;
    const k=iso(r.dt);
    let d=byDay.get(k);
    if(!d){ d={k,dt:r.dt,slot:{},bills:new Set(),skus:new Set(),lines:0,total:0};
      SLOTS.forEach(x=>d.slot[x]={b:new Set(),t:0}); byDay.set(k,d); }
    const sl=d.slot[r.slot]; if(sl){ sl.b.add(r.bill); sl.t+=r.total; }
    d.bills.add(r.bill); d.skus.add(r.prod); d.lines++; d.total+=r.total;
  }
  return [...byDay.values()].sort((a,b)=>a.k.localeCompare(b.k)).map(d=>({
    ...d, bills:d.bills.size, skus:d.skus.size,
    slot:Object.fromEntries(SLOTS.map(x=>[x,{b:d.slot[x].b.size,t:d.slot[x].t}]))
  }));
}

function renderDaily(rows){
  const allDays=buildDaily(rows);
  const days = SHOW_ALL_DAYS? allDays : allDays.slice(-RECENT);
  window._days=days; window._allDays=allDays;

  /* ย่อ = สูงพอดีทุกแถว ไม่ต้องเลื่อน / กาง = จำกัดความสูงแล้วเลื่อนในตาราง */
  const wrap=document.querySelector('.dwrap');
  if(wrap) wrap.style.maxHeight = SHOW_ALL_DAYS ? '70vh' : 'none';
  document.getElementById('dBadge').textContent=`แสดง ${days.length} / ${allDays.length} วัน`;
  const bA=document.getElementById('btnAllDays');
  if(bA) bA.innerHTML = SHOW_ALL_DAYS ? `&#9652; ย่อเหลือ ${RECENT} วันล่าสุด`
                                      : `&#9662; ขยายดูทุกวัน (${allDays.length})`;
  document.getElementById('dlegend').innerHTML=SLOTS.map(x=>
    `<span><i style="background:${SLOT_COLOR[x]}"></i>${x} ${SLOT_TIME[x].slice(0,5)}–${SLOT_TIME[x].slice(9,14)}</span>`).join('');

  /* แถวรวม = ทุกวันเสมอ แม้ตารางจะย่อ */
  const T={slot:Object.fromEntries(SLOTS.map(x=>[x,{b:0,t:0}]))};
  SLOTS.forEach(x=>{ T.slot[x].b=new Set(rows.filter(r=>r.slot===x).map(r=>r.bill)).size;
                     T.slot[x].t=rows.filter(r=>r.slot===x).reduce((a,r)=>a+r.total,0); });
  T.bills=new Set(rows.map(r=>r.bill)).size; T.total=rows.reduce((a,r)=>a+r.total,0);
  T.skus=new Set(rows.map(r=>r.prod)).size; T.lines=rows.length;

  document.getElementById('dhead').innerHTML=`
    <tr><th class="wd"></th><th class="day">ช่วงเวลา</th>
      ${SLOTS.map(x=>`<th class="t${x[1]}" colspan="2">${x}</th>`).join('')}
      <th class="tot" colspan="2">Total</th><th class="tot" rowspan="3">BS</th>
      <th class="tot" rowspan="3">SKU/วัน</th><th class="tot" rowspan="3">SKU/บิล</th></tr>
    <tr><th class="wd"></th><th class="day">เวลา</th>
      ${SLOTS.map(x=>`<th class="t${x[1]}" colspan="2">${SLOT_TIME[x]}</th>`).join('')}
      <th class="tot" colspan="2"></th></tr>
    <tr><th class="wd"></th><th class="day">วันที่</th>
      ${SLOTS.map(x=>`<th class="t${x[1]}">Bill</th><th class="t${x[1]}">Baht</th>`).join('')}
      <th class="tot">Bill</th><th class="tot">Baht</th></tr>
    <tr class="ttl-row"><th class="wd"></th><th class="day">รวมทั้งช่วง (${allDays.length} วัน)</th>
      ${SLOTS.map(x=>`<th class="d">${n0(T.slot[x].b)}</th><th class="d">${n0(T.slot[x].t)}</th>`).join('')}
      <th class="d">${n0(T.bills)}</th><th class="d">${n0(T.total)}</th>
      <th class="d">${n0(T.total/(T.bills||1))}</th><th class="d">${n0(T.skus)}</th>
      <th class="d">${n2(T.lines/(T.bills||1))}</th></tr>`;

  document.getElementById('dbody').innerHTML= days.length? days.map(d=>{
    const w=d.dt.getDay(), wc=w===0?'sun':w===6?'sat':'';
    return `<tr>
      <td class="wd ${wc}">${WD[w]}</td>
      <td class="day">${thDate(d.dt)}</td>
      ${SLOTS.map(x=>`<td class="d t${x[1]}">${n0(d.slot[x].b)}</td><td class="d t${x[1]}">${n0(d.slot[x].t)}</td>`).join('')}
      <td class="d tot">${n0(d.bills)}</td><td class="d tot">${n0(d.total)}</td>
      <td class="d tot">${n0(d.total/(d.bills||1))}</td><td class="d tot">${n0(d.skus)}</td>
      <td class="d tot">${n2(d.lines/(d.bills||1))}</td></tr>`;
  }).join('') : `<tr><td colspan="21" style="text-align:center;padding:40px;color:var(--muted)">ไม่พบข้อมูล</td></tr>`;
}

function exportDaily(){
  exportExcel((window._days||[]).map(d=>{
    const o={'วันที่':thDate(d.dt),'วัน':WD[d.dt.getDay()]};
    SLOTS.forEach(x=>{ o[`${x} บิล`]=d.slot[x].b; o[`${x} บาท`]=+d.slot[x].t.toFixed(2); });
    o['รวมบิล']=d.bills; o['รวมบาท']=+d.total.toFixed(2);
    o['BS (บาท/บิล)']=+(d.total/(d.bills||1)).toFixed(2);
    o['SKU/วัน']=d.skus; o['SKU/บิล']=+(d.lines/(d.bills||1)).toFixed(2);
    return o; }),'ยอดขายรายวัน_ช่วงเวลา');
}

function sparkSvg(pts){
  if(pts.length<2) return '';
  const W=260,H=38,max=Math.max(...pts)||1;
  const x=i=>W*(i/(pts.length-1)), y=v=>H-2-(H-6)*(v/max);
  const line=pts.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:38px;display:block">
    <defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#c9a84c" stop-opacity=".4"/><stop offset="100%" stop-color="#c9a84c" stop-opacity="0"/></linearGradient></defs>
    <path d="${line} L${W} ${H} L0 ${H} Z" fill="url(#sg)"/>
    <path d="${line}" fill="none" stroke="#c9a84c" stroke-width="1.8" vector-effect="non-scaling-stroke"/></svg>`;
}

function buildCats(rows){
  const days=[...new Set(rows.map(r=>iso(r.dt)).filter(Boolean))].sort();
  const byCat=new Map();
  for(const r of rows){
    let o=byCat.get(r.cat);
    if(!o){ o={k:r.cat,total:0,u:{},bills:new Set(),skus:new Set(),prod:new Map(),day:{}}; byCat.set(r.cat,o); }
    o.total+=r.total; o.bills.add(r.bill); o.skus.add(r.prod);
    const ru = r.ru==='BPA' ? 'BP' : (SHOW.includes(r.ru)? r.ru : 'OTH');
    o.u[ru]=(o.u[ru]||0)+r.qty;                       /* QTY ตรง ๆ ตามหน่วยของบรรทัดนั้น */
    const d=iso(r.dt); if(d) o.day[d]=(o.day[d]||0)+r.total;
    const p=o.prod.get(r.prod)||{t:0,u:{}}; p.t+=r.total; p.u[ru]=(p.u[ru]||0)+r.qty; o.prod.set(r.prod,p);
  }
  const cats=[...byCat.values()].map(o=>({...o,bills:o.bills.size,skus:o.skus.size,
    CS:o.u.CS||0, BP:o.u.BP||0, PA:o.u.PA||0, EA:o.u.EA||0, OTH:o.u.OTH||0,
    top:[...o.prod.entries()].map(([n,v])=>({n,...v})).sort((a,b)=>b.t-a.t)}));
  return {cats,days};
}

function render(){
  const rows=filtered(), k=kpis(rows), tot=k.total||1;
  if(VIEW==='trend'){ renderTrend(); return; }
  if(VIEW==='shelf'){ renderShelf(rows); return; }

  if(!MONTHS.length && !MBOOT){ MBOOT=true; buildMonths().then(()=>render()); }
  const live = !MONTHS.length || MONTHS.find(x=>x.ym===SEL)?.live !== false;
  document.getElementById('dailyCard').classList.toggle('hidden',!live);
  document.getElementById('pastDash').classList.toggle('hidden',live);

  if(!live){                                   /* เดือนย้อนหลังจาก BigQuery */
    const D=PAST[SEL]; if(!D) return;
    renderPastDash(D);
    window._cats=D.cats;
    renderCards(D.cats,[],D.tot||1);
    return;
  }

  renderDaily(rows);
  const {cats,days}=buildCats(rows);
  const s=document.getElementById('cSort')?.value || 'total';
  cats.sort( s==='name' ? (a,b)=>a.k.localeCompare(b.k,'th') : (a,b)=>b[s]-a[s] );
  window._cats=cats;

  renderCards(cats,days,tot);
}

function toggleAllItems(i){ const c=(window._cats||[])[i]; if(!c) return;
  ALL.has(c.k)?ALL.delete(c.k):ALL.add(c.k); render(); }
function renderCards(cats,days,tot){
  const limit=+(document.getElementById('cTop')?.value || 9999);
  const shown=cats.slice(0,limit);
  const cnt=document.getElementById('ccCount'); if(cnt) cnt.textContent=`แสดง ${shown.length} / ${cats.length} หมวด`;
  const max=cats.length? Math.max(...cats.map(c=>c.total)) : 1;
  document.getElementById('cards').innerHTML= shown.length? shown.map((c,i)=>{
    const ic=iconOf(c.k), open=OPEN.has(c.k);
    const showAll=ALL.has(c.k), lim=showAll?c.top.length:12;
    const items=c.top.slice(0,open?lim:0).map((p,j)=>`
      <div class="cc-item"><span class="i-n">${j+1}</span>
        ${imgTag(IMG[p.n]||'','i-img',iconOf(c.k).ico,60)}
        <span class="i-p"><b title="${esc(p.n)}">${esc(p.n)}</b><span class="i-q">${unitText(p.u)}</span></span>
        <span class="i-v">${fmtB(p.t)} ฿</span></div>`).join('');
    return `<article class="cc">
      <div class="cc-body">
        <span class="cc-rank">#${i+1}</span>
        <div class="cc-row">
          <div class="cc-ico" style="background:${ic.bg};color:${ic.c}">${ic.ico}</div>
          <div style="min-width:0">
            <div class="cc-name" title="${esc(c.k)}">${esc(c.k)}</div>
            <div class="cc-sub">${fmtB(c.bills)} บิล · ฿/บิล ${fmtB(c.total/(c.bills||1))}</div>
          </div>
        </div>
        <div class="cc-total">${fmtB(c.total)}<small>฿</small></div>
        <div class="cc-track"><i class="cc-fill" style="width:${(c.total/max*100).toFixed(1)}%;background:${ic.c}"></i></div>
        ${unitChips(c.u)}
        <div class="cc-foot"><span>${(c.total/tot*100).toFixed(1)}%</span><span>${fmtB(c.skus)} SKU</span></div>
        <button class="cc-btn" onclick="toggleCard(${i})">${open?'&#9652; ยุบรายการ':'&#9662; ดูสินค้าในหมวด ('+fmtB(c.skus)+')'}</button>
      </div>
      ${open?`<div class="cc-list">${items}${
        c.top.length>12
          ? `<button class="cc-btn" onclick="toggleAllItems(${i})">${showAll?'&#9652; แสดงน้อยลง':`&#9662; ดูอีก ${fmtB(c.top.length-12)} รายการ`}</button>`
          : ''}</div>`:''}
    </article>`;
  }).join('') : '<div class="card" style="grid-column:1/-1"><div class="card-body txt-muted" style="text-align:center;padding:40px">ไม่พบข้อมูลตามตัวกรอง</div></div>';
}
function toggleCard(i){ const c=(window._cats||[])[i]; if(!c) return;
  if(OPEN.has(c.k)){ OPEN.delete(c.k); ALL.delete(c.k); } else OPEN.add(c.k);
  render(); }
function toggleAll(on){ OPEN.clear();
  if(on) (window._cats||[]).forEach(c=>OPEN.add(c.k));
  render(); }
function exportCurrent(){
  const cats=window._cats||[];
  exportExcel(cats.map((c,i)=>({'อันดับ':i+1,'หมวดหมู่':c.k,'SKU':c.skus,'ลัง (CS)':+c.CS.toFixed(2),'แพ็คใหญ่ (BP)':+c.BP.toFixed(2),'แพ็ค (PA)':+c.PA.toFixed(2),'ชิ้น (EA)':+c.EA.toFixed(2),'บิล':c.bills,
    'บาท/บิล':+(c.total/(c.bills||1)).toFixed(2),'ยอดขาย':+c.total.toFixed(2)})),'ยอดขายตามหมวดหมู่');
}
</script>
