<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Rattana Zone — โซนรับผิดชอบ ความสะอาด & ความเรียบร้อย v2.7</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{
  --navy:#0d1b3e;--navy-mid:#1a2f5e;--navy-light:#243b73;--gold:#c9a84c;--gold-light:#e8c86a;
  --success:#2ecc71;--danger:#e74c3c;--warning:#f39c12;
  --bg:#f4f6fb;--text:#0d1b3e;--card-bg:#fff;--border:#dde3f0;--muted:#6b7896;--row-alt:#fafbfd;
  --radius-sm:6px;--radius-md:12px;--radius-lg:16px;
  --shadow-md:0 2px 8px rgba(0,0,0,.08);--shadow-lg:0 8px 24px rgba(13,27,62,.12);--shadow-gold:0 4px 12px rgba(201,168,76,.35);
  --st-done:#1e9e55;--st-done-bg:#e6f7ed;--st-issue:#e67e22;--st-issue-bg:#fff1e3;--st-pend:#8a94ad;--st-pend-bg:#eef1f7;--st-late:#d63c2f;--st-late-bg:#fde8e6;
}
body.dark{--bg:#05080f;--text:#fff;--card-bg:#0d1b3e;--border:#1f3563;--muted:#b8c2dc;--row-alt:#0a1226;
  --st-done-bg:transparent;--st-issue-bg:transparent;--st-pend-bg:transparent;--st-late-bg:transparent}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Sarabun',sans-serif;font-size:15px;line-height:1.5;min-height:100dvh;overflow-x:hidden;background:var(--bg);color:var(--text);transition:background .25s,color .25s}
button{font-family:inherit;cursor:pointer;border:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
input,select,textarea{font-family:inherit;font-size:16px}

header{background:var(--navy);color:#fff;padding:10px 14px;position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:10px;padding-top:max(10px,env(safe-area-inset-top))}
.logo-text{font-weight:800;letter-spacing:1.5px;font-size:18px;color:#fff;line-height:1.1}
.logo-text span{color:var(--gold)}
.logo-sub{font-size:12px;color:rgba(255,255,255,.7);font-weight:500}
.hdr-right{margin-left:auto;display:flex;gap:8px;align-items:center}
.icon-btn{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.2);width:38px;height:38px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-size:17px}
.hub-btn{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:var(--radius-sm);padding:5px 10px;font-size:13px;font-weight:600;text-decoration:none;min-height:38px}
.hub-btn-icon{width:22px;height:22px;border-radius:5px;background:var(--gold);display:inline-flex;align-items:center;justify-content:center;color:var(--navy);font-weight:800;font-size:13px}
.center-btn{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:20px;padding:4px 12px 4px 6px;font-weight:700;font-size:14px;min-height:38px}
.center-btn .cdot{width:24px;height:24px;border-radius:50%;border:2px solid #fff}
@media(max-width:520px){.center-btn .ctext small{display:none}.hub-btn span:last-child{display:none}}

.tab-nav{display:flex;background:var(--navy);border-bottom:3px solid var(--gold);padding:0 8px;gap:4px;overflow-x:auto;scrollbar-width:none;position:sticky;top:58px;z-index:99}
.tab-nav::-webkit-scrollbar{display:none}
.tab-btn{background:transparent;color:rgba(255,255,255,.65);padding:12px 16px;font-size:14px;font-weight:600;white-space:nowrap;flex-shrink:0;border-radius:var(--radius-sm) var(--radius-sm) 0 0}
.tab-btn.active{color:var(--navy);background:var(--gold);font-weight:700}

.demo-bar{background:#fff7e0;border-bottom:1px solid #f0d98a;padding:8px 14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:#7a5b00}
body.dark .demo-bar{background:transparent;color:var(--gold-light);border-color:rgba(201,168,76,.4)}
.role-pill{border:1.5px solid #e0c060;background:#fff;color:#5c4600;border-radius:20px;padding:5px 12px;font-size:13px;font-weight:600;min-height:34px}
body.dark .role-pill{background:transparent;color:var(--gold-light)}
.role-pill.on{background:var(--navy);color:#fff;border-color:var(--navy)}

.content{padding:14px;max-width:1100px;margin:0 auto;width:100%;padding-bottom:90px}
.page{display:none;animation:fadeIn .2s}
.page.on{display:block}
h2.pg-title{font-size:21px;font-weight:800;margin:4px 0 2px}
.pg-sub{color:var(--muted);font-size:14px;margin-bottom:14px}
.card{background:var(--card-bg);border-radius:var(--radius-md);border:1px solid var(--border);box-shadow:var(--shadow-md)}
.card-body{padding:16px}
.sec-h{font-size:17px;font-weight:700;margin:18px 0 10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.zc-meta{font-size:13px;color:var(--muted)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:var(--radius-sm);font-size:15px;font-weight:700;border:1.5px solid transparent;min-height:46px;transition:opacity .15s,transform .1s;text-decoration:none}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--navy);color:#fff}
body.dark .btn-primary{background:var(--gold);color:var(--navy)}
.btn-gold{background:var(--gold);color:var(--navy)}
.btn-outline{background:transparent;color:var(--text);border-color:var(--border)}
.btn-ok{background:var(--st-done);color:#fff}
.btn-sm{padding:6px 12px;font-size:13px;min-height:36px}
.btn-block{width:100%}

.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:12px;font-size:12.5px;font-weight:700;white-space:nowrap}
.b-done{background:var(--st-done-bg);color:var(--st-done);border:1px solid var(--st-done)}
.b-issue{background:var(--st-issue-bg);color:var(--st-issue);border:1px solid var(--st-issue)}
.b-pend{background:var(--st-pend-bg);color:var(--st-pend);border:1px solid var(--st-pend)}
.b-late{background:var(--st-late-bg);color:var(--st-late);border:1px solid var(--st-late)}
.b-scan{background:rgba(52,152,219,.12);color:#1a6fb8;border:1px solid #6aaee6}
body.dark .b-scan{background:transparent;color:#8cc4f2}

.scan-hero{background:linear-gradient(135deg,var(--navy),var(--navy-light));color:#fff;border-radius:var(--radius-lg);padding:18px;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;gap:14px}
.scan-hero .who{display:flex;align-items:center;gap:12px}
.avatar{position:relative;overflow:hidden}
.avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:var(--card-bg)}
.avatar.mini{display:inline-flex;width:22px;height:22px;font-size:11px;vertical-align:middle}
.avatar{width:46px;height:46px;border-radius:50%;background:var(--gold);color:var(--navy);font-weight:800;font-size:20px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.scan-big{background:var(--gold);color:var(--navy);border-radius:16px;min-height:84px;font-size:21px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:12px;box-shadow:var(--shadow-gold)}
.scan-big .ic{font-size:36px}
.prog{display:flex;align-items:center;gap:10px;font-size:14px}
.prog .pbar{flex:1;height:12px;background:rgba(255,255,255,.18);border-radius:6px;overflow:hidden}
.prog .pbar i{display:block;height:100%;background:var(--success);border-radius:6px}
.link-w{background:transparent;color:rgba(255,255,255,.8);text-decoration:underline;font-size:13px;padding:0}

.zgrid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:640px){.zgrid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1000px){.zgrid{grid-template-columns:repeat(3,1fr)}}
.zcard{background:var(--card-bg);border:1px solid var(--border);border-left:6px solid var(--st-pend);border-radius:var(--radius-md);padding:14px;box-shadow:var(--shadow-md);display:flex;flex-direction:column;gap:8px}
.zcard.s-done{border-left-color:var(--st-done)}.zcard.s-issue{border-left-color:var(--st-issue)}.zcard.s-late{border-left-color:var(--st-late)}
.zc-top{display:flex;gap:12px;align-items:flex-start}
.zc-ico{font-size:28px;width:50px;height:50px;border-radius:12px;background:rgba(201,168,76,.15);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.zc-name{font-size:17px;font-weight:800;line-height:1.25}
.zc-row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.zc-photo{width:100%;height:120px;object-fit:cover;border-radius:10px;border:1px solid var(--border)}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.chip{flex-shrink:0;border:2px solid var(--border);background:var(--card-bg);color:var(--text);border-radius:22px;padding:7px 14px;font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px;min-height:40px}
.chip .dot{width:12px;height:12px;border-radius:50%}
.chip.on{border-color:var(--navy);background:var(--navy);color:#fff}
body.dark .chip.on{border-color:var(--gold);background:var(--gold);color:var(--navy)}
.legend{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.floor{margin-bottom:16px}
.floor-h{font-weight:700;font-size:14px;color:var(--muted);margin-bottom:8px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:640px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{border-radius:14px;padding:12px;min-height:110px;display:flex;flex-direction:column;gap:4px;text-align:left;border:2px solid;cursor:pointer;color:var(--text)}
.tile.s-done{background:var(--st-done-bg);border-color:var(--st-done)}
.tile.s-issue{background:var(--st-issue-bg);border-color:var(--st-issue)}
.tile.s-pend{background:var(--st-pend-bg);border-color:var(--st-pend);border-style:dashed}
.tile.s-late{background:var(--st-late-bg);border-color:var(--st-late)}
.tile .t-ico{font-size:24px}
.tile .t-photo{width:100%;height:84px;object-fit:cover;border-radius:9px;margin-bottom:4px}
.tile .t-name{font-weight:800;font-size:15px;line-height:1.2}
.tile .t-own{font-size:12.5px;color:var(--muted)}
.tile .t-st{margin-top:auto;font-size:12.5px;font-weight:700}

.cgrid{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:560px){.cgrid{grid-template-columns:repeat(2,1fr)}}
.ccard{display:flex;align-items:center;gap:14px;padding:14px;border-radius:14px;border:2px solid var(--border);background:var(--card-bg);color:var(--text);text-align:left;min-height:76px}
.ccard .big{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:16px;flex-shrink:0;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.ccard b{font-size:17px}
.ccard.on{border-color:var(--gold);box-shadow:var(--shadow-gold)}

.people{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px;scrollbar-width:thin}
.pcard{flex-shrink:0;min-width:130px;background:var(--card-bg);border:1.5px solid var(--border);border-radius:12px;padding:10px;text-align:center}
.pcard .avatar{margin:0 auto 6px;width:64px;height:64px;font-size:24px}
.pcard b{display:block;font-size:14px;line-height:1.2}
.pcard.zero{border-color:var(--st-issue);border-style:dashed}
.arow{display:grid;grid-template-columns:1fr;gap:8px;padding:12px;border-bottom:1px solid var(--border)}
@media(min-width:760px){.arow{grid-template-columns:1.3fr 1fr 1fr auto;align-items:center}}
.arow.none{background:var(--st-late-bg)}
.arow select{min-height:42px}
.rota-tag{font-size:12px;font-weight:700;color:#8e44ad}
.pp{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:6px 12px;border-radius:var(--radius-sm);border:1.5px solid var(--border);background:var(--card-bg);color:var(--text);text-align:left}
.pp .avatar,.pp-list .avatar{width:40px;height:40px;font-size:17px}
.pp-t{display:flex;flex-direction:column;line-height:1.25;flex:1;min-width:0}
.pp-t b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pp-t small{font-size:13px;color:var(--muted)}
.pp-blank{color:var(--muted);font-weight:600}
.pp-c{color:var(--muted)}
.pp-list{max-height:60dvh}
.pp-list button{min-height:58px}
.pp-list button.on{background:rgba(201,168,76,.18)}
.geo-map{height:62dvh;min-height:360px;border-radius:var(--radius-md);border:1px solid var(--border);overflow:hidden;z-index:0}
.mini-map{height:210px;border-radius:var(--radius-sm);border:1px solid var(--border);overflow:hidden;margin-top:8px;z-index:0}
.geo-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.zpin-w{position:relative;width:40px;height:48px}
.zpin{width:38px;height:38px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:#fff;border:3px solid var(--st-pend);box-shadow:0 2px 6px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center}
.zpin span{transform:rotate(45deg);font-size:18px;line-height:1}
.zpin.s-done{border-color:var(--st-done);background:#e6f7ed}.zpin.s-issue{border-color:var(--st-issue);background:#fff1e3}.zpin.s-late{border-color:var(--st-late);background:#fde8e6}
.zpin-l{position:absolute;top:44px;left:50%;transform:translateX(-50%);white-space:nowrap;background:rgba(13,27,62,.88);color:#fff;font:700 12px Sarabun,sans-serif;padding:1px 7px;border-radius:6px}
.leaflet-popup-content{font-family:Sarabun,sans-serif;font-size:14px;line-height:1.5}
.pop b{font-size:15px}.pop-b{display:flex;gap:6px;margin-top:8px}.pop-b .btn-primary{color:#fff}
.q-btn{background:var(--warning);color:var(--navy);border-radius:20px;padding:6px 12px;font-weight:800;font-size:13px;white-space:nowrap;animation:qpulse 2s infinite}
@keyframes qpulse{50%{box-shadow:0 0 0 5px rgba(243,156,18,.3)}}
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:10px;align-items:end}
.podium:has(.pod:only-child){grid-template-columns:minmax(0,260px);justify-content:center}
.pod{background:var(--card-bg);border:1px solid var(--border);border-top:6px solid #cd7f32;border-radius:var(--radius-md);padding:12px 8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:var(--shadow-md)}
.pod.r1{border-top-color:#f1c40f;padding-top:18px;background:linear-gradient(to bottom,rgba(241,196,15,.12),var(--card-bg) 60%)}
.pod.r2{border-top-color:#aab4be}
.pod .medal{font-size:34px;line-height:1}
.pod .avatar{width:62px;height:62px;font-size:24px}.pod.r1 .avatar{width:84px;height:84px;font-size:32px;box-shadow:0 0 0 4px #f1c40f}
.pod b{font-size:15px;line-height:1.25}.pod small{font-size:13px;color:var(--muted)}
.pod-sc{font-size:30px;font-weight:800;color:var(--gold);line-height:1.1}
.my-rank{display:flex;gap:14px;align-items:center;border-left:6px solid var(--gold);margin-bottom:6px}
.my-rank .avatar{width:64px;height:64px;font-size:26px;flex-shrink:0}
.my-tip{margin-top:6px;font-weight:700;color:var(--navy-mid)}body.dark .my-tip{color:var(--gold-light)}
.zone-top{display:grid;gap:8px}
.zt{display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius-md);text-align:left;color:var(--text)}
.zt img{width:64px;height:52px;object-fit:cover;border-radius:8px}.zt-i{font-size:34px;width:64px;text-align:center}.zt-m{font-size:28px}
.zt-t{flex:1;display:flex;flex-direction:column;min-width:0}.zt-t small{color:var(--muted);font-size:13px}.zt-s{font-size:26px;font-weight:800;color:var(--gold)}
.lb-few{opacity:.55}.lb-me{background:rgba(201,168,76,.16)!important}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.tab-n{display:inline-block;min-width:20px;height:20px;line-height:20px;border-radius:10px;background:var(--danger);color:#fff;font-size:12px;font-weight:800;margin-left:5px;padding:0 6px;text-align:center}
.job{padding:14px;margin-bottom:10px;border-left:5px solid var(--gold)}.job.vol{border-left-color:var(--info)}
.job-h{display:flex;gap:12px;align-items:flex-start}
.job-pts{flex-shrink:0;width:60px;height:60px;border-radius:14px;background:var(--gold);color:var(--navy);font-size:22px;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05}
.job-pts small{font-size:12px;font-weight:700}.job.vol .job-pts{background:#d6eafc;color:#1a6fb8}
@media(max-width:520px){.job-h{flex-wrap:wrap}.job-h>.job-t{flex:1 1 calc(100% - 80px)}.job-h>.badge{order:3;margin-left:72px;margin-top:-4px}}
.job-t{flex:1;min-width:0}.job-t b{font-size:16px;line-height:1.35}
.job-d{margin-top:8px;font-size:15px}
.job-ph{width:100%;max-height:200px;object-fit:cover;border-radius:10px;margin-top:8px;display:block}
.ba{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.ba figure{margin:0;position:relative}
.ba img{width:100%;height:150px;object-fit:cover;border-radius:10px;display:block}
.ba figcaption{position:absolute;left:6px;top:6px;background:rgba(13,27,62,.85);color:#fff;font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px}
.job-m{margin-top:8px;line-height:1.7}
.job-a{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.job-a .btn{flex:1 1 auto;justify-content:center;min-height:48px;font-size:15px}.job-a .btn-sm{flex:0 0 auto;font-size:13px}
.job-bar{display:flex;gap:10px;flex-wrap:wrap;margin:4px 0 6px}.job-bar .btn{flex:1 1 220px;justify-content:center;min-height:60px;font-size:16px;flex-direction:column;gap:0;line-height:1.3}
.pts-card{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:16px 18px;background:linear-gradient(135deg,#0d1b3e,#1a2f5e);color:#fff;border-radius:var(--radius-md);margin:8px 0 12px;border-bottom:3px solid var(--gold)}
.pts-big{font-size:46px;font-weight:800;color:var(--gold-light);line-height:1}
.pts-card>div:last-child{flex:1 1 240px}
.pts-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.pts-chips span{white-space:nowrap;background:rgba(255,255,255,.13);border-radius:20px;padding:3px 10px;font-size:13px}
.vol-hero{background:#e3f0fd;border:1px solid #b9d7f5;border-radius:12px;padding:12px;font-weight:600;color:#1a5f9e}
body.dark .vol-hero{background:transparent;color:#9fd0ff}
.vol-btn{background:#1a6fb8;color:#fff;min-height:56px;font-size:16px;justify-content:center}
.job-banner{display:flex;align-items:center;gap:12px;width:100%;margin-top:12px;padding:14px 16px;border-radius:var(--radius-md);background:var(--card-bg);border:2px solid var(--gold);color:var(--text);font-size:15px;box-shadow:var(--shadow-md)}
.job-banner small{color:var(--muted)}.job-banner>span:last-child{font-size:28px;color:var(--gold)}
.gift-hero{display:flex;flex-wrap:wrap;gap:12px 22px;align-items:center;padding:18px;border-radius:var(--radius-md);background:linear-gradient(135deg,#0d1b3e,#243b73);color:#fff;border-bottom:4px solid var(--gold);margin:8px 0 6px}
.gift-hero .gh-r{flex:1 1 240px;min-width:0}
.gbar{height:12px;border-radius:8px;background:rgba(255,255,255,.18);overflow:hidden;margin-top:6px}.gbar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-light));border-radius:8px}
.gbar.sm{background:var(--border);height:9px;margin-top:10px}
.gift-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}

#printArea{display:none}
@media print{
  body>*:not(#printArea){display:none!important}
  #printArea{display:block}
  @page{size:A4;margin:0}
  /* ป้าย A4 — กล่องสูงคงที่ ตัดส่วนเกิน ไม่ล้นไปหน้า 2 (ฟอนต์ทุกตัว ≥26px กันเบราว์เซอร์ขยายเอง) */
  .poster,.sheet,.cert{-webkit-print-color-adjust:exact;print-color-adjust:exact;break-after:page;page-break-after:always;break-inside:avoid;overflow:hidden}
  .poster{width:210mm;height:296mm;padding:9mm;display:flex;flex-direction:column;gap:4.5mm;font-family:'Sarabun',sans-serif;color:#0d1b3e;background:#fff}

  .p-t2.long{font-size:40px}
  .p-t3{font-size:28px;color:#dde3f0;margin-top:1mm}
  .p-mid{flex:1;min-height:0;display:flex;gap:6mm;align-items:stretch;justify-content:center}
  .p-qrbox{flex-shrink:0;border:1.6mm solid var(--cc);border-radius:7mm;padding:5mm 5mm 3mm;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2mm}
  .p-qr img,.p-qr canvas{width:82mm!important;height:82mm!important;display:block}
  .p-scan{font-size:30px;font-weight:800;text-align:center;line-height:1.25}

  .p-av{position:relative;width:24mm;height:24mm;flex-shrink:0;border-radius:50%;overflow:hidden;background:#1a2f5e;color:#fff;display:flex;align-items:center;justify-content:center;font-size:52px;font-weight:800;border:1.2mm solid var(--cc)}
  .p-av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .p-lb{font-size:26px;color:#6b7896;font-weight:600;line-height:1.3}

  .p-foot{flex-shrink:0;border-radius:4mm;background:#fef3d7;color:#7a5600;font-size:26px;font-weight:700;text-align:center;padding:2.5mm 4mm}

  .stk .s1{width:100%;background:linear-gradient(135deg,#0d1b3e,#1a2f5e);color:#fff;border-radius:3mm;padding:2.5mm 3mm;font-size:30px;font-weight:800;line-height:1.2;border-bottom:2.5mm solid var(--cc);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

<script>
/* ================= CONFIG ================= */
const VERSION='2.7';
const CONFIG={
  gasUrl:'https://script.google.com/macros/s/AKfycbxZtcTiTQEk91zTtBUeh6BDs1z61x_Huyip1RaeQvVbzzIKrrZ3Hc-1UOnefSGG7-H1/exec',   // rattana-zone.gs · ?demo=1 = โหมดตัวอย่าง
  clientId:'615875645128-gasjjvkt6lu8g449cbnhl40k1pu25r0b.apps.googleusercontent.com',
};
const QS=new URLSearchParams(location.search);
const LIVE=!!CONFIG.gasUrl&&!QS.has('demo');
const TOK_KEY='rzone_tok';
let session=null; // {token,user:{c,n,s,w,r,exp}}

/* ================= API (โหมดใช้งานจริง) ================= */
function spin(on,msg){$('spin').classList.toggle('show',!!on);if(msg)$('spinMsg').textContent=msg}
async function api(action,body={}){
  const r=await fetchT(CONFIG.gasUrl,{method:'POST',body:JSON.stringify({action,t:session&&session.token,...body})},60000);
  const j=await r.json();
  if(!j.ok){if(j.auth)logout(true);throw new Error(j.error||'ผิดพลาด')}
  return j;
}
async function bootLive(){
  const r=await fetch(CONFIG.gasUrl+'?action=boot&t='+encodeURIComponent(session.token)+'&x='+Date.now());
  const j=await r.json();
  if(!j.ok){if(j.auth)logout(true);throw new Error(j.error||'โหลดข้อมูลไม่สำเร็จ')}
  DB={sites:j.sites,people:j.people,zones:j.zones,checks:j.checks,audits:j.audits,issues:j.issues,grants:j.grants||[],jobs:j.jobs||[],rewards:j.rewards||[],redeems:j.redeems||[],earned:j.earned||{}};
  // สิทธิ์คิดใหม่ที่หลังบ้านทุกครั้ง — ถ้าเพิ่งได้รับ/ถูกถอนสิทธิ์ เมนูเปลี่ยนตามทันที
  if(j.user&&session&&j.user.r&&j.user.r!==session.user.r){session.user.r=j.user.r;session.user.w=j.user.w;localStorage.setItem(TOK_KEY,JSON.stringify(session));role=j.user.r;fixTab()}
  mergeQueue();qBadge();
}
// เพิ่มพื้นที่/โซนใหม่: ทุกคนทำได้ในศูนย์ตัวเอง (หัวหน้างาน/HR ทำได้ทุกที่ที่มีสิทธิ์)
/* รูปพนักงานในวงกลม: Drive thumbnail → lh3 → ตัวอักษรแรก */
function avIn(name){const p=(DB.people||[]).find(x=>x.name===name),ph=(p&&p.photo)||'';let img='';
  if(ph.startsWith('d:'))img=`<img src="https://drive.google.com/thumbnail?id=${esc(ph.slice(2))}&sz=w200" data-alt="https://lh3.googleusercontent.com/d/${esc(ph.slice(2))}=w200" loading="lazy" alt="" onerror="avErr(this)">`;
  else if(ph.startsWith('u:'))img=`<img src="${esc(ph.slice(2))}" loading="lazy" alt="" onerror="avErr(this)">`;
  return esc(initial(name))+img}
/* ===== ตัวเลือกพนักงาน (รูป + ชื่อ + ชื่อเล่น) แทน dropdown ธรรมดา ===== */
function nickOf(name){const p=(DB.people||[]).find(x=>x.name===name);return p&&p.nick?p.nick:''}
function ppLabel(v,blank){return v?`<span class="avatar">${avIn(v)}</span><span class="pp-t"><b>${esc(v)}</b>${nickOf(v)?`<small>${esc(nickOf(v))}</small>`:''}</span><span class="pp-c">▾</span>`
  :`<span class="pp-t pp-blank">${esc(blank)}</span><span class="pp-c">▾</span>`}
function ppBtn(id,v,site,blank,cb){return `<button type="button" class="pp" id="${id}" data-v="${esc(v||'')}" data-site="${esc(site)}" data-blank="${esc(blank)}" data-cb="${esc(cb||'')}" onclick="openPP('${id}')">${ppLabel(v,blank)}</button>`}
function ppVal(id){const b=$(id);return b?b.dataset.v:''}
function ppSet(id,v){const b=$(id);if(!b)return;b.dataset.v=v;b.innerHTML=ppLabel(v,b.dataset.blank)}
function openPP(id){
  const b=$(id),ppl=DB.people.filter(p=>p.site===b.dataset.site).sort((x,y)=>x.name.localeCompare(y.name,'th'));
  let ov=$('ppOv');if(!ov){ov=document.createElement('div');ov.id='ppOv';ov.className='modal-overlay';ov.style.zIndex=9500;ov.onclick=e=>{if(e.target===ov)ov.classList.remove('open')};document.body.appendChild(ov)}
  ov.innerHTML=`<div class="modal"><div class="modal-head"><h3>👤 เลือกพนักงาน · ${esc(siteOf(b.dataset.site).name)}</h3><button class="modal-close" onclick="$('ppOv').classList.remove('open')">×</button></div>
  <div class="modal-body"><input class="input" id="ppQ" placeholder="🔍 พิมพ์ชื่อ หรือชื่อเล่น..." oninput="ppFilter(this.value)">
  <div class="name-list pp-list" id="ppList">
    <button data-k="" onclick="ppPick('${id}','')"><span class="pp-t pp-blank">${esc(b.dataset.blank)}</span></button>
    ${ppl.map(p=>`<button data-k="${esc((p.name+' '+(p.nick||'')+' '+(p.code||'')).toLowerCase())}" class="${p.name===b.dataset.v?'on':''}" onclick="ppPick('${id}','${esc(p.name).replace(/'/g,'&#39;')}')"><span class="avatar">${avIn(p.name)}</span><span class="pp-t"><b>${esc(p.name)}</b>${p.nick?`<small>ชื่อเล่น ${esc(p.nick)}</small>`:''}</span></button>`).join('')}
  </div></div></div>`;
  ov.classList.add('open');setTimeout(()=>$('ppQ').focus(),50);
}
function ppFilter(q){q=q.trim().toLowerCase();[...$('ppList').children].forEach(x=>x.style.display=!q||x.dataset.k.includes(q)?'':'none')}
function ppPick(id,v){$('ppOv').classList.remove('open');ppSet(id,v);const cb=$(id).dataset.cb;if(cb)new Function('v',cb)(v)}
function avErr(i){if(i.dataset.alt&&!i.dataset.fb){i.dataset.fb=1;i.src=i.dataset.alt}else i.remove()}
function canAdd(){return role!=='emp'||!me||!me.site||siteOf(me.site).w===curW}
const ROLE_LABEL={emp:'พนักงาน',mgr:'หัวหน้างาน / ผู้จัดการ (ศูนย์ตัวเอง)',hr:'HR / ดูทุกศูนย์'};
// เรียกทุกครั้งที่แก้ข้อมูล: โหมดตัวอย่าง = แก้ในเครื่อง · ใช้งานจริง = ส่งหลังบ้านแล้วโหลดใหม่
async function commit(action,payload,local,msg){
  if(!LIVE){local();save();return true}
  const qa=QUEUE_ACTS.includes(action);
  if(qa){payload={...payload,cid:'q'+Date.now()+Math.random().toString(36).slice(2,7),at:Date.now()};if(!navigator.onLine)return queueIt(action,payload)}
  spin(true,msg||'กำลังบันทึก...');
  try{const r=await api(action,payload);await bootLive().catch(()=>{});return r}
  catch(e){if(qa&&isNetErr(e))return queueIt(action,payload);showToast(e.message,'error');return false}
  finally{spin(false)}
}
/* ===== 📶 คิวส่งผลตรวจ: สัญญาณหาย → เก็บไว้ในเครื่อง แล้วส่งให้เองเมื่อสัญญาณกลับมา ===== */
const Q_KEY='rzone_queue',QUEUE_ACTS=['check','issue'];let qBusy=false;
function qGet(){try{return JSON.parse(localStorage.getItem(Q_KEY))||[]}catch{return []}}
function qPut(l){try{localStorage.setItem(Q_KEY,JSON.stringify(l));return true}catch{return false}}
function qMine(){const c=me&&me.code;return qGet().filter(q=>!c||q.c===c)}
function isNetErr(e){return !navigator.onLine||e instanceof TypeError||/Failed to fetch|NetworkError|Load failed|timeout|network/i.test((e&&e.message)||'')}
function fetchT(url,opt,ms){const c=new AbortController(),t=setTimeout(()=>c.abort(),ms||30000);
  return fetch(url,{...opt,signal:c.signal}).catch(e=>{throw new TypeError(e.name==='AbortError'?'timeout':e.message)}).finally(()=>clearTimeout(t))}
function queueIt(action,payload){const l=qGet();l.push({action,payload,at:payload.at,by:me.name,c:me.code||''});
  if(!qPut(l)){showToast('หน่วยความจำเครื่องเต็ม เก็บผลรอส่งไม่ได้ — ลองส่งใหม่เมื่อมีสัญญาณ','error');return false}
  mergeQueue();qBadge();setTimeout(()=>showToast('📶 ไม่มีสัญญาณ — เก็บผลไว้ในเครื่องแล้ว จะส่งให้เองเมื่อมีสัญญาณ','warning'),80);return {queued:true}}
// ใส่รายการที่รอส่งลงข้อมูลในจอ ให้โซนขึ้นว่าตรวจแล้ว (ป้าย ⏳ รอส่ง)
function mergeQueue(){if(!DB)return;qMine().forEach(q=>{const p=q.payload,dk=dkey(new Date(q.at));
  if(q.action==='check'&&!DB.checks.some(c=>c.cid===p.cid))DB.checks.push({id:p.cid,cid:p.cid,zoneId:p.zoneId,date:dk,time:q.at,by:q.by,res:p.res,photo:p.photo,before:p.before,note:p.note,scan:p.scan,proxy:p.proxy,dist:p.dist===''?null:p.dist,pending:true});
  if(q.action==='issue'&&!DB.issues.some(i=>i.cid===p.cid))DB.issues.push({id:p.cid,cid:p.cid,zoneId:p.zoneId,date:dk,time:q.at,by:q.by,text:p.text,photo:p.photo,status:'open',fixNote:'',pending:true})})}
function qBadge(){const b=$('qBtn');if(!b)return;const n=qMine().length;b.style.display=n?'':'none';b.textContent=qBusy?`📤 กำลังส่ง ${n}`:`📤 รอส่ง ${n}`}
async function flushQueue(manual){
  if(!LIVE||qBusy||!session)return;const mine=qMine();if(!mine.length)return;
  if(!navigator.onLine){if(manual)showToast('ยังไม่มีสัญญาณ — ลองใหม่เมื่อมีสัญญาณ','warning');return}
  qBusy=true;qBadge();let sent=0,fail='';
  try{for(const q of mine){
    try{await api(q.action,q.payload);sent++;qPut(qGet().filter(x=>x.payload.cid!==q.payload.cid))}
    catch(e){if(isNetErr(e)){fail='net';break}
      const l=qGet();l.forEach(x=>{if(x.payload.cid===q.payload.cid)x.err=e.message});qPut(l);fail=e.message;if(!session)break}}
  }finally{qBusy=false}
  if(sent){try{await bootLive()}catch{}render();showToast(`📤 ส่งผลที่ค้างไว้แล้ว ${sent} รายการ ✓`,'success')}
  else if(manual&&fail)showToast(fail==='net'?'ยังส่งไม่ได้ — สัญญาณยังไม่ดี':'ส่งไม่ได้: '+fail,'error');
  qBadge()}
function openQueue(){const l=qMine();
  $('modalBox').innerHTML=`<div class="modal-head"><h3>📤 รอส่ง ${l.length} รายการ</h3><button class="modal-close" onclick="closeModal()">×</button></div>
  <div class="modal-body"><div class="zc-meta" style="margin-bottom:10px">ตรวจตอนไม่มีสัญญาณ ผลเก็บอยู่ในเครื่องนี้ ระบบจะส่งให้เองเมื่อมีสัญญาณ · <b>อย่าล้างข้อมูลเบราว์เซอร์</b>จนกว่าจะส่งครบ</div>
  ${l.map(q=>{const z=DB.zones.find(x=>x.id===q.payload.zoneId);return `<div class="mz"><span style="font-size:22px">${q.action==='check'?'✅':'⚠️'}</span><div class="nm"><b>${q.action==='check'?'ผลตรวจ':'แจ้งปัญหา'} · ${esc(z?z.name:q.payload.zoneId)}</b>
    <div class="zc-meta">${fDate(dkey(new Date(q.at)))} ${fTime(q.at)} น.${q.payload.photo?' · มีรูป':''}</div>${q.err?`<div class="zc-meta" style="color:var(--danger)">ส่งไม่ผ่าน: ${esc(q.err)}</div>`:''}</div>
    ${q.err?`<button class="btn btn-outline btn-sm" onclick="qDel('${q.payload.cid}')">ลบ</button>`:''}</div>`}).join('')||'<div class="empty">ไม่มีรายการรอส่ง</div>'}</div>
  <div class="modal-foot"><button class="btn btn-outline" onclick="closeModal()">ปิด</button><button class="btn btn-primary" onclick="closeModal();flushQueue(true)">📤 ส่งตอนนี้</button></div>`;openModal()}
function qDel(cid){if(!confirm('ลบรายการนี้ทิ้ง? (ผลตรวจนี้จะไม่ถูกส่ง)'))return;qPut(qGet().filter(x=>x.payload.cid!==cid));
  if(DB){DB.checks=DB.checks.filter(c=>c.cid!==cid);DB.issues=DB.issues.filter(i=>i.cid!==cid)}qBadge();openQueue();render()}
async function refreshData(){if(!LIVE)return;spin(true,'กำลังโหลด...');try{await bootLive();render();showToast('อัปเดตแล้ว ✓','success')}catch(e){showToast(e.message,'error')}finally{spin(false)}}
function showLogin(){
  document.body.classList.add('locked');$('loginScreen').classList.add('show');
  const pz=QS.get('zone');$('lgPending').textContent=pz?`📍 เข้าสู่ระบบแล้วจะเปิดหน้าตรวจโซน ${pz.toUpperCase()} ให้ทันที`:'';
  const tryG=()=>{if(window.google&&google.accounts){google.accounts.id.initialize({client_id:CONFIG.clientId,callback:gLogin});
    google.accounts.id.renderButton($('gBtn'),{theme:'outline',size:'large',text:'signin_with',width:300})}else setTimeout(tryG,300)};tryG();
}
async function empLogin(){
  const code=$('lgCode').value.trim(),birth=$('lgBirth').value.replace(/\D/g,'');
  if(!code||birth.length!==8){$('lgErr').textContent='กรอกรหัสพนักงาน และวันเกิด 8 หลัก';return}
  $('lgErr').textContent='';spin(true,'กำลังตรวจสอบ...');
  try{const j=await api('empLogin',{code,birth});afterLogin(j)}catch(e){$('lgErr').textContent='❌ '+e.message}finally{spin(false)}
}
async function gLogin(r){
  spin(true,'กำลังตรวจสอบ...');
  try{const j=await api('googleLogin',{credential:r.credential});afterLogin(j)}catch(e){$('lgErr').textContent='❌ '+e.message}finally{spin(false)}
}
function afterLogin(j){session={token:j.token,user:j.user};localStorage.setItem(TOK_KEY,JSON.stringify(session));startLive()}
function logout(expired){localStorage.removeItem(TOK_KEY);session=null;if(expired)showToast('กรุณาเข้าสู่ระบบใหม่','error');setTimeout(()=>location.href=location.pathname+(QS.get('zone')?'?zone='+QS.get('zone'):''),expired?1200:0)}
function userMenu(){

function ownerToday(z){if(z.rota){const v=z.rota[new Date().getDay()];if(v!==undefined)return v}return z.owner}
function todayCheck(z){return DB.checks.filter(c=>c.zoneId===z.id&&c.date===today()).sort((a,b)=>b.time-a.time)[0]}
function openIssues(z){return DB.issues.filter(i=>i.zoneId===z.id&&i.status==='open')}
function zStatus(z){
  const c=todayCheck(z);
  if(c){const bad=c.res.filter(x=>!x).length;if(bad||openIssues(z).length)return {k:'issue',t:bad?`ต้องแก้ ${bad} ข้อ`:'มีปัญหาค้าง',c};return {k:'done',t:'เรียบร้อย ✓',c}}
  if(!ownerToday(z))return {k:'late',t:'ยังไม่มีคนรับผิดชอบ'};
  if(nowMin()>toMin(z.due))return {k:'late',t:`เลยเวลา (${z.due} น.)`};
  return {k:'pend',t:`ยังไม่ตรวจ · ก่อน ${z.due} น.`};
}
const ST_LABEL={done:'🟢 เรียบร้อย',issue:'🟠 ต้องแก้/มีปัญหา',pend:'⚪ ยังไม่ตรวจ',late:'🔴 เลยเวลา/ไม่มีคนดูแล'};

function zoneScore(z,days=30){
  const from=daysAgo(days);
  const ch=new Set(DB.checks.filter(c=>c.zoneId===z.id&&c.date>=from&&c.date<today()).map(c=>c.date)).size;
  const comp=Math.min(1,ch/days);
  const au=DB.audits.filter(a=>a.zoneId===z.id&&a.date>=from);
  const aavg=au.length?au.reduce((s,a)=>s+Object.values(a.sc).reduce((x,y)=>x+y,0)/5,0)/au.length:0;
  return {comp:Math.round(comp*100),audit:aavg?+aavg.toFixed(1):null,score:Math.round(comp*50+(aavg/5)*50)};
}
function calcStreak(z){let n=0;const set=new Set(DB.checks.filter(c=>c.zoneId===z.id).map(c=>c.date));let d=set.has(today())?0:1;while(set.has(daysAgo(d))){n++;d++}return n}
function heat(z,n=14){let h='';for(let d=n-1;d>=0;d--){const k=daysAgo(d);const c=DB.checks.filter(x=>x.zoneId===z.id&&x.date===k).sort((a,b)=>b.time-a.time)[0];
  const col=!c?(d===0?'var(--border)':'#f3b7b1'):c.res.every(Boolean)?'#2ecc71':'#f0a04b';h+=`<i title="${fDate(k)}" style="background:${col}"></i>`}return `<div class="heat">${h}</div>`}
function areasOf(siteId,zs){const s=siteOf(siteId);return s.areas.concat([...new Set(zs.map(z=>z.area))].filter(a=>!s.areas.includes(a)))}

async function startCam(){
  try{
    scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    const v=$('scanVid');v.srcObject=scanStream;await v.play();$('scanMsg').textContent='ส่องไปที่ QR';
    const cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});
    const tick=()=>{if(!scanStream)return;if(v.readyState===v.HAVE_ENOUGH_DATA){cv.width=v.videoWidth;cv.height=v.videoHeight;cx.drawImage(v,0,0);
      const r=window.jsQR&&jsQR(cx.getImageData(0,0,cv.width,cv.height).data,cv.width,cv.height);
      if(r&&r.data){const m=r.data.match(/[?&]zone=([A-Z0-9-]+)/i);if(m){gotZone(m[1].toUpperCase(),true);return}$('scanMsg').textContent='QR นี้ไม่ใช่ป้ายโซน'}}
      scanRaf=requestAnimationFrame(tick)};tick();
  }catch(e){const m=$('scanMsg');if(m)m.textContent='เปิดกล้องไม่ได้ — ใช้กล้องมือถือสแกน หรือพิมพ์รหัสโซนด้านล่าง'}
}
function stopCam(){if(scanStream){scanStream.getTracks().forEach(t=>t.stop());scanStream=null}cancelAnimationFrame(scanRaf)}

    <button class="btn btn-outline btn-sm" style="margin-top:10px" onclick="ck.res.forEach((_,i)=>setYN(i,true))">✓ เรียบร้อยทุกข้อ</button>

    <label style="display:flex;gap:8px;align-items:center;margin-top:12px;font-weight:600"><input type="checkbox" id="ckIssue" style="width:22px;height:22px"> ส่งเป็นปัญหาให้ผู้จัดการตามแก้ด้วย</label>

function setYN(i,v){ck.res[i]=v;$('y'+i).classList.toggle('on',v===true);$('n'+i).classList.toggle('on',v===false)}
async function submitCheck(){
  if(ck.res.some(v=>v===null))return showToast('กรุณาเลือกให้ครบทุกข้อ','error');
  if(ck.z.before&&!ck.before)return showToast('โซนนี้ต้องมีรูปก่อนทำด้วย','error');
  if(!ck.photo)return showToast('กรุณาถ่ายรูปหลังทำก่อนส่ง','error');
  const note=$('ckNote').value.trim(),by=me.name,isIssue=$('ckIssue').checked;
  const bad=ck.z.items.filter((_,i)=>!ck.res[i]),issueText=note||('ต้องแก้: '+bad.join(', '));
  const ok=await commit('check',{zoneId:ck.z.id,res:ck.res,photo:ck.photo,before:ck.before,note,scan:scanned,proxy:!!ck.proxy,for:ck.proxy?ownerToday(ck.z):'',issue:isIssue,issueText,dist:ck.dist??''},()=>{
    DB.checks.push({id:'C'+Date.now(),zoneId:ck.z.id,date:today(),time:Date.now(),by,res:ck.res,photo:ck.photo,before:ck.before,note,scan:scanned,proxy:!!ck.proxy,for:ck.proxy?ownerToday(ck.z):'',dist:ck.dist});
    if(isIssue)DB.issues.push({id:'I'+Date.now(),zoneId:ck.z.id,date:today(),time:Date.now(),by,text:issueText,photo:ck.photo,status:'open',fixNote:''});
  },'กำลังส่งผลตรวจและรูป...');
  if(!ok)return;
  closeModal();render();if(ok.queued)return;showToast(ck.res.every(Boolean)?'ส่งผลตรวจแล้ว — เรียบร้อยทุกข้อ ✓':'ส่งผลแล้ว — ผู้จัดการจะเห็นข้อที่ต้องแก้','success');
}
function pickPhoto(inp,boxId,cb){
  const f=inp.files[0];if(!f)return;const img=new Image(),url=URL.createObjectURL(f);
  img.onload=()=>{const s=Math.min(1,640/Math.max(img.width,img.height)),cv=document.createElement('canvas');cv.width=img.width*s;cv.height=img.height*s;
    const g=cv.getContext('2d');g.drawImage(img,0,0,cv.width,cv.height);
    const st=`${fDate(today())} ${fTime(Date.now())} น.`;g.font='bold 20px Sarabun,sans-serif';g.fillStyle='rgba(0,0,0,.55)';g.fillRect(0,cv.height-34,g.measureText(st).width+20,34);g.fillStyle='#fff';g.fillText(st,10,cv.height-11);
    const d=cv.toDataURL('image/jpeg',.7);cb(d);const box=$(boxId);box.querySelector('img')?.remove();box.insertAdjacentHTML('afterbegin',`<img src="${d}">`);URL.revokeObjectURL(url)};
  img.src=url;
}

/* ================= หน้า: ผังโซน ================= */

    return `<button class="tile s-${s.k}" onclick="openZone('${z.id}')">${z.photo?`<img class="t-photo" src="${esc(z.photo)}" alt="" loading="lazy">`:`<span class="t-ico">${z.icon}</span>`}<span class="t-name">${esc(z.name)}</span><span class="zcode">${z.id}</span><span class="t-own">${ownerToday(z)?`<span class="avatar mini">${avIn(ownerToday(z))}</span>`:'👤'} ${esc(ownerToday(z)||'ยังไม่มีคนดูแล')}${z.rota?' 🔄':''}</span><span class="t-st" style="color:var(--st-${s.k})">${s.t}</span></button>`}).join('')}</div></div>`}).join('')||'<div class="empty">ยังไม่มีโซน</div>')}`;
  if(mapView==='geo')geoInit(zs);
}
/* ================= แผนที่จริง / พิกัดโซน ================= */
let mapView=localStorage.getItem('rzone_mapview')||'plan',geoMap=null,meDot=null;
const hasLoc=z=>!!(z&&z.loc&&isFinite(z.loc.lat)&&isFinite(z.loc.lng));
function distM(a,b){const R=6371000,r=x=>x*Math.PI/180,dl=r(b.lat-a.lat),dn=r(b.lng-a.lng),h=Math.sin(dl/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dn/2)**2;return Math.round(2*R*Math.asin(Math.sqrt(h)))}
const fDist=m=>m>=1000?(m/1000).toFixed(1)+' กม.':m+' ม.';
const navUrl=z=>`https://www.google.com/maps/dir/?api=1&destination=${z.loc.lat},${z.loc.lng}`;
function setMapView(v){mapView=v;localStorage.setItem('rzone_mapview',v);rMap()}
// ขอพิกัดที่แม่นที่สุดภายในเวลาที่กำหนด (GPS จะค่อยๆ แม่นขึ้น)
function getPos(ms,onUpd){return new Promise(res=>{if(!navigator.geolocation)return res(null);let best=null,id,t;
  const done=()=>{navigator.geolocation.clearWatch(id);clearTimeout(t);res(best)};
  id=navigator.geolocation.watchPosition(p=>{const c={lat:+p.coords.latitude.toFixed(6),lng:+p.coords.longitude.toFixed(6),acc:Math.round(p.coords.accuracy)};
    if(!best||c.acc<best.acc){best=c;onUpd&&onUpd(c)}if(c.acc<=8)done()},()=>done(),{enableHighAccuracy:true,maximumAge:0,timeout:ms});
  t=setTimeout(done,ms||8000)})}
function baseLayers(map,ctrl){
  const sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:21,maxNativeZoom:18,attribution:'Esri'}),
    street=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:21,maxNativeZoom:19,attribution:'© OpenStreetMap'});
  sat.addTo(map);if(ctrl!==false)L.control.layers({'🛰️ ดาวเทียม':sat,'🗺️ แผนที่ถนน':street},null,{position:'topright'}).addTo(map)}
function pinIcon(z,k,label){return L.divIcon({className:'',html:`<div class="zpin-w"><div class="zpin s-${k||'pend'}"><span>${esc(z.icon||'📍')}</span></div>${label?`<div class="zpin-l">${esc(label)}</div>`:''}</div>`,iconSize:[40,48],iconAnchor:[20,46],popupAnchor:[0,-42]})}
function geoHtml(zs){const pinned=zs.filter(hasLoc),un=zs.filter(z=>!hasLoc(z));
  return `<div class="geo-bar"><button class="btn btn-gold btn-sm" onclick="geoMe()">📍 ฉันอยู่ตรงไหน</button><span class="zc-meta">แตะหมุดเพื่อดูว่าใครดูแล / นำทางไปจุดนั้น</span></div>
  ${pinned.length?'<div id="geoMap" class="geo-map"></div>':`<div class="empty card" style="padding:24px">ยังไม่มีโซนที่ปักหมุดใน${esc(siteOf(curSite).name)}<br><span class="zc-meta">ไปยืนตรงโซน แล้วกด 📍 ปักหมุดตรงนี้ ด้านล่าง</span></div>`}
  ${un.length?`<div class="sec-h">⚠️ ยังไม่ได้ปักหมุด (${un.length} โซน)</div>${role!=='emp'?'<div class="zc-meta" style="margin-bottom:6px">เดินไปยืนตรงโซนนั้น แล้วกด 📍 ปักหมุดตรงนี้</div>':''}
    ${un.map(z=>`<div class="mz"><span style="font-size:22px">${esc(z.icon)}</span><div class="nm"><b>${esc(z.name)}</b> <span class="zcode">${z.id}</span><div class="zc-meta">${esc(z.area)}</div></div>${role!=='emp'?`<button class="btn btn-gold btn-sm" onclick="pinHere('${z.id}')">📍 ปักหมุดตรงนี้</button>`:''}</div>`).join('')}`:''}`}
function geoInit(zs){const el=$('geoMap');if(!el||!window.L)return;if(geoMap){try{geoMap.remove()}catch{}}geoMap=L.map(el);baseLayers(geoMap);meDot=null;
  const pts=zs.filter(hasLoc).map(z=>{const s=zStatus(z),own=ownerToday(z);
    L.marker([z.loc.lat,z.loc.lng],{icon:pinIcon(z,s.k,z.name)}).addTo(geoMap).bindPopup(`<div class="pop"><b>${esc(z.icon)} ${esc(z.name)}</b><div class="zc-meta">${z.id} · ${esc(z.area)}</div>
      <div>👤 ${esc(own||'ยังไม่มีคนดูแล')}</div><div style="color:var(--st-${s.k});font-weight:700">${s.t}</div>
      <div class="pop-b"><button class="btn btn-primary btn-sm" onclick="openZone('${z.id}')">เปิดโซน</button><a class="btn btn-outline btn-sm" href="${navUrl(z)}" target="_blank" rel="noopener">🧭 นำทาง</a></div></div>`);
    return [z.loc.lat,z.loc.lng]});
  if(pts.length===1)geoMap.setView(pts[0],19);else geoMap.fitBounds(pts,{padding:[50,50],maxZoom:19});
  setTimeout(()=>geoMap&&geoMap.invalidateSize(),200)}
async function geoMe(){showToast('⏳ กำลังหาตำแหน่งของคุณ...','info');const p=await getPos(8000);
  if(!p)return showToast('หาตำแหน่งไม่ได้ — เปิด GPS และอนุญาตให้เว็บใช้ตำแหน่ง','error');
  if(!geoMap)return;if(meDot)meDot.forEach(x=>x.remove());
  meDot=[L.circle([p.lat,p.lng],{radius:p.acc,color:'#3498db',weight:1,fillOpacity:.15}).addTo(geoMap),L.circleMarker([p.lat,p.lng],{radius:8,color:'#fff',weight:3,fillColor:'#3498db',fillOpacity:1}).addTo(geoMap)];
  geoMap.setView([p.lat,p.lng],19);
  const n=DB.zones.filter(z=>z.site===curSite&&hasLoc(z)).map(z=>({z,d:distM(p,z.loc)})).sort((a,b)=>a.d-b.d)[0];
  if(n)showToast(`โซนที่ใกล้คุณที่สุด: ${n.z.name} (~${fDist(n.d)})`,'success')}
async function pinHere(zid){const z=DB.zones.find(x=>x.id===zid);showToast('⏳ กำลังหาตำแหน่ง... ยืนนิ่งๆ ตรงโซนนี้สักครู่','info');
  const p=await getPos(10000);if(!p)return showToast('หาตำแหน่งไม่ได้ — เปิด GPS และอนุญาตให้เว็บใช้ตำแหน่ง','error');
  if(!confirm(`ปักหมุด "${z.name}" ตรงที่คุณยืนอยู่ตอนนี้?\n(คลาดเคลื่อนประมาณ ±${p.acc} ม.)`))return;
  const r=await commit('saveZone',{zone:{...z,photoNew:'',loc:p}},()=>{z.loc=p});if(!r)return;render();showToast('ปักหมุดแล้ว ✓','success')}
function miniMap(id,z){const el=$(id);if(!el||!window.L||!hasLoc(z))return;
  const m=L.map(el,{attributionControl:false}).setView([z.loc.lat,z.loc.lng],19);baseLayers(m,false);L.marker([z.loc.lat,z.loc.lng],{icon:pinIcon(z,zStatus(z).k)}).addTo(m);setTimeout(()=>m.invalidateSize(),250)}
/* ฟอร์มโซน: ปักหมุดตรงที่ยืนอยู่ + ลากหมุดปรับได้ */
let ezLoc=null,ezMap=null;
function ezLocRender(){const b=$('ezLocBox');if(!b)return;if(ezMap){try{ezMap.remove()}catch{}ezMap=null}
  b.innerHTML=`<button type="button" class="btn btn-gold btn-block" id="ezLocBtn" style="min-height:52px;font-size:16px" onclick="ezGetLoc()">📍 ${ezLoc?'ปักหมุดใหม่ ตรงที่ฉันยืนอยู่':'ใช้ตำแหน่งที่ฉันยืนอยู่ตอนนี้'}</button>
  ${ezLoc?`<div id="ezMap" class="mini-map"></div><div class="zc-row" style="margin-top:6px"><span class="zc-meta">${ezLoc.acc?`คลาดเคลื่อน ±${ezLoc.acc} ม. · `:''}ลากหมุดเพื่อขยับให้ตรงจุดได้</span><button type="button" class="btn btn-outline btn-sm" onclick="ezLoc=null;ezLocRender()">ลบหมุด</button></div>`
   :'<div class="zc-meta" style="margin-top:6px">ยังไม่ได้ปักหมุด — ไปยืนตรงโซนนี้แล้วกดปุ่ม · พนักงานจะเห็นโซนบนแผนที่ และระบบเช็กได้ว่าสแกนตรงจุดจริง</div>'}`;
  if(ezLoc&&window.L){ezMap=L.map('ezMap',{attributionControl:false}).setView([ezLoc.lat,ezLoc.lng],19);baseLayers(ezMap,false);
    const mk=L.marker([ezLoc.lat,ezLoc.lng],{draggable:true,icon:pinIcon({icon:$('ezIcon').value||'📍'},'pend')}).addTo(ezMap);
    mk.on('dragend',()=>{const p=mk.getLatLng();ezLoc={lat:+p.lat.toFixed(6),lng:+p.lng.toFixed(6),acc:0}});
    setTimeout(()=>ezMap&&ezMap.invalidateSize(),250)}}
async function ezGetLoc(){const b=$('ezLocBtn');b.disabled=true;b.textContent='⏳ กำลังหาตำแหน่ง... ยืนนิ่งๆ สักครู่';
  const p=await getPos(10000,c=>{if($('ezLocBtn'))$('ezLocBtn').textContent=`⏳ กำลังหาตำแหน่ง... ±${c.acc} ม.`});
  if(!p){ezLocRender();return showToast('หาตำแหน่งไม่ได้ — เปิด GPS และอนุญาตให้เว็บใช้ตำแหน่ง','error')}
  ezLoc=p;ezLocRender();showToast(p.acc>30?`ได้ตำแหน่งแล้ว แต่คลาดเคลื่อน ±${p.acc} ม. — ลากหมุดให้ตรงจุดได้`:'ปักหมุดแล้ว ✓',p.acc>30?'warning':'success')}
async function ckLocate(){const c0=ck,z=c0&&c0.z;if(!hasLoc(z))return;const p=await getPos(8000);if(ck!==c0)return;const b=$('ckDist');if(!b)return;
  if(!p){b.className='badge b-pend';b.textContent='📍 เช็กตำแหน่งไม่ได้ (ไม่ได้เปิด GPS)';return}
  const d=distM(p,z.loc);ck.dist=d;const ok=d<=Math.max(30,p.acc+15);b.className='badge '+(ok?'b-done':'b-late');b.textContent=ok?`📍 อยู่ตรงจุดโซน (~${fDist(d)})`:`⚠️ อยู่ห่างจุดโซน ~${fDist(d)}`}

    <table class="tbl" style="min-width:0"><tr><td>ที่ตั้ง</td><td><b>${esc(siteOf(z.site).name)}</b> · ${esc(z.area)} · ${z.id}</td></tr>

function zMarker(map,z,extra){const s=zStatus(z),own=ownerToday(z);

    <div>👤 ${esc(own||'ยังไม่มีคนดูแล')}</div><div style="color:var(--st-${s.k});font-weight:700">${s.t}</div>

function ovInit(){const el=$('ovMap');if(ovMap){try{ovMap.remove()}catch{}ovMap=null}if(!el||!window.L)return;

  if(pts.length===1)ovMap.setView(pts[0],19);else ovMap.fitBounds(pts,{padding:[50,50],maxZoom:19});
  setTimeout(()=>ovMap&&ovMap.invalidateSize(),200)}
async function addSite(){const n=prompt(`ชื่อสถานที่ใหม่ใน${cOf(curW).name} (เช่น รัตนมาร์ท สาขา 2)`);if(!n||!n.trim())return;const areas=/มาร์ท|ร้าน/.test(n)?['หน้าร้าน','หลังร้าน','ภายนอก']:['คลังสินค้า','สำนักงาน','ส่วนกลาง'];

async function saveArea(siteId){
  const s=siteOf(siteId),n=$('naName').value.trim(),c=$('naCode').value.trim().toUpperCase();
  if(!n)return showToast('กรุณาใส่ชื่อพื้นที่','error');if(s.areas.includes(n))return showToast('มีพื้นที่นี้แล้ว','error');
  if(!/^[A-Z0-9]{1,4}$/.test(c))return showToast('รหัสพื้นที่ใช้ A-Z/0-9 ไม่เกิน 4 ตัว','error');
  if(s.areas.some(a=>areaCode(siteId,a)===c))return showToast('รหัสพื้นที่ '+c+' ซ้ำกับพื้นที่อื่น','error');
  const codes={...(s.codes||{}),[n]:c};
  if(!await commit('setAreas',{site:s.id,areas:s.areas.concat(n),codes},()=>{s.areas.push(n);s.codes=codes}))return;
  closeModal();render();showToast('เพิ่มพื้นที่ '+n+' แล้ว — กด ➕ โซน เพื่อเพิ่มโซนในพื้นที่นี้','success');
}
/* รหัสโซน = สถานที่-รหัสพื้นที่+เลข 2 หลัก เช่น W1-WH01 (ตรงกับหลังบ้าน) */
const AREA_CODE={'คลังสินค้า':'WH','ลาน/ท่ารถ':'YD','สำนักงาน':'OF','ส่วนกลาง':'CM','หน้าร้าน':'FR','หลังร้าน':'BK','ภายนอก':'OT','ห้องน้ำ':'WC','ห้องเย็น':'CL'};
function areaCode(siteId,area){const s=siteOf(siteId),i=s.areas.indexOf(area);return ((s.codes||{})[area]||AREA_CODE[area]||('Z'+String.fromCharCode(65+(Math.max(i,0)%26)))).toUpperCase()}
function suggestAreaCode(siteId,name){const s=siteOf(siteId);if(AREA_CODE[name.trim()])return AREA_CODE[name.trim()];let k=0,c;do{c='Z'+String.fromCharCode(65+(k++%26))}while(k<27&&s.areas.some(a=>areaCode(siteId,a)===c));return c}
function nextZoneCode(siteId,area){const pre=siteId.toUpperCase()+'-'+areaCode(siteId,area);let max=0;DB.zones.forEach(z=>{if(z.id.toUpperCase().indexOf(pre)===0){const n=parseInt(z.id.slice(pre.length),10);if(n>max)max=n}});return pre+String(max+1).padStart(2,'0')}

  if(role==='emp')return '';
  const g=(DB.grants||[]).filter(x=>role==='hr'||cOf(siteOf(x.site).w).w===curW||siteOf(x.site).w===curW);

      ${z.photo?`<div class="p-ref"><img src="${esc(z.photo)}" onerror="this.parentNode.remove()"><div>✅ เรียบร้อยต้องเป็นแบบนี้</div></div>`:''}</div>

      <div class="p-card"><div class="p-col"><div class="p-lb">📱 สแกนแล้วทำอะไรได้</div><div class="p-sm">✅ พนักงานตรวจโซน</div><div class="p-sm">🙋 อาสา / รับงาน เก็บแต้ม</div><div class="p-sm">👤 ดูผู้รับผิดชอบ & ประวัติ</div></div></div>

/* ================= 🏆 ดีเด่นประจำเดือน ================= */
let lbMonth=0,lbW='ALL';
const TH_MONTH=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
function lbRange(off){const n=new Date(),s=new Date(n.getFullYear(),n.getMonth()-off,1),e=new Date(n.getFullYear(),n.getMonth()-off+1,0);
  return {from:dkey(s),to:off?dkey(e):today(),label:TH_MONTH[s.getMonth()]+' '+(s.getFullYear()+543),cur:!off}}
function dateList(a,b){const out=[],d=new Date(a+'T00:00:00'),e=new Date(b+'T00:00:00');while(d<=e){out.push(dkey(d));d.setDate(d.getDate()+1)}return out}
const dowOf=k=>new Date(k+'T00:00:00').getDay();
const minOf=t=>{const d=new Date(t);return d.getHours()*60+d.getMinutes()};
const addDays=(k,n)=>{const d=new Date(k+'T00:00:00');d.setDate(d.getDate()+n);return dkey(d)};
function ownerOn(z,k){if(z.rota){const v=z.rota[dowOf(k)];if(v!==undefined)return v}return z.owner}
// วันที่โซนต้องตรวจ: ทุกวัน / จันทร์–เสาร์ / สัปดาห์ละครั้ง (นับเป็นรายสัปดาห์ เริ่มวันจันทร์)
function needOn(z,k){const w=dowOf(k);if(z.freq==='จันทร์–เสาร์')return w!==0;if(z.freq==='สัปดาห์ละครั้ง')return w===1;return true}
function lbCalc(R,W){
  const zs=DB.zones.filter(z=>W==='ALL'||zCenter(z)===W),zid=new Set(zs.map(z=>z.id)),days=dateList(R.from,R.to),td=today();
  const byZD={},first={};
  DB.checks.forEach(c=>{if(!first[c.zoneId]||c.date<first[c.zoneId])first[c.zoneId]=c.date;(byZD[c.zoneId+'|'+c.date]=byZD[c.zoneId+'|'+c.date]||[]).push(c)});
  const P={},pp=(n,s)=>P[n]=P[n]||{n,site:s,duty:0,done:0,ontime:0,chk:0,ok:0,help:0};
  const Z=zs.map(z=>{let req=0,done=0,ontime=0,okd=0;const wk=z.freq==='สัปดาห์ละครั้ง';
    const st=first[z.id]&&first[z.id]>R.from?first[z.id]:R.from;   // โซนเพิ่งเริ่มกลางเดือน → นับจากวันแรกที่มีการตรวจ
    days.forEach(k=>{if(k<(wk?addDays(st,-6):st)||!needOn(z,k))return;
      const cs=wk?[0,1,2,3,4,5,6].flatMap(i=>byZD[z.id+'|'+addDays(k,i)]||[]):(byZD[z.id+'|'+k]||[]);
      if((wk?addDays(k,6):k)>=td&&!cs.length)return;               // ยังไม่หมดวัน/สัปดาห์ ยังไม่นับว่าขาด
      req++;const o=ownerOn(z,k);if(o)pp(o,z.site).duty++;
      if(!cs.length)return;done++;
      const f=cs.reduce((a,b)=>a.time<b.time?a:b),l=cs.reduce((a,b)=>a.time>b.time?a:b);
      if(wk||minOf(f.time)<=toMin(z.due))ontime++;if(l.res.every(Boolean))okd++;
      const mine=o?cs.filter(c=>c.by===o):[];if(mine.length){P[o].done++;const mf=mine.reduce((a,b)=>a.time<b.time?a:b);if(wk||minOf(mf.time)<=toMin(z.due))P[o].ontime++}});
    const au=DB.audits.filter(a=>a.zoneId===z.id&&a.date>=R.from&&a.date<=R.to);
    const aavg=au.length?au.reduce((s,a)=>{const v=Object.values(a.sc);return s+v.reduce((x,y)=>x+y,0)/v.length},0)/au.length:null;
    const comp=req?done/req:0,otp=req?ontime/req:0,okp=done?okd/done:0,base=comp*40+otp*20+okp*20;
    return {z,req,done,comp,otp,okp,audit:aavg,score:Math.round(aavg==null?base/.8:base+aavg/5*20)}}).filter(x=>x.req>0).sort((a,b)=>b.score-a.score||b.comp-a.comp);
  DB.checks.forEach(c=>{if(c.date<R.from||c.date>R.to||!zid.has(c.zoneId)||!c.by)return;const z=zs.find(x=>x.id===c.zoneId),p=pp(c.by,z.site);p.chk++;if(c.res.every(Boolean))p.ok++;if(c.proxy)p.help++});
  const ppl=Object.values(P).filter(p=>p.duty>0).map(p=>{const comp=Math.min(1,p.done/p.duty),otp=Math.min(1,p.ontime/p.duty),okp=p.chk?p.ok/p.chk:0;
    return {...p,comp,otp,okp,score:Math.min(100,Math.round(comp*50+otp*25+okp*25+Math.min(5,p.help))),enough:p.duty>=5}})
    .sort((a,b)=>(b.enough-a.enough)||(b.score-a.score)||(b.duty-a.duty));
  return {Z,ppl}}
const pct=x=>Math.round(x*100)+'%';
function lbPerson(p,i){return `<div class="pod r${i+1}"><div class="medal">${['🥇','🥈','🥉'][i]}</div><div class="avatar">${avIn(p.n)}</div><b>${esc(p.n)}</b>
  ${nickOf(p.n)?`<small>${esc(nickOf(p.n))}</small>`:''}<div class="zc-meta">${esc(siteOf(p.site).name)}</div><div class="pod-sc">${p.score}</div><div class="zc-meta">ตรวจครบ ${pct(p.comp)} · ตรงเวลา ${pct(p.otp)}</div></div>`}

  $('printArea').innerHTML=names.map(n=>{const p=rk.find(x=>x.n===n);if(!p)return '';const r=rk.indexOf(p)+1,src=ph(n);

      <div class="c-logo">RATTANA ZONE · โซนรับผิดชอบ</div><div class="c-h">ใบประกาศเกียรติคุณ</div>

      <div class="c-txt">ดูแลความสะอาดและความเรียบร้อยของพื้นที่รับผิดชอบได้อย่างดีเยี่ยม<br>ประจำเดือน ${R.label}</div>
      <div class="c-stats"><div><b>${pct(p.comp)}</b>ตรวจครบ</div><div><b>${pct(p.otp)}</b>ทันเวลา</div><div><b>${pct(p.okp)}</b>เรียบร้อย</div><div><b>${p.score}</b>คะแนน</div></div>
      <div class="c-sign"><div>.................................<br>ผู้จัดการศูนย์</div><div>.................................<br>ฝ่ายบุคคล</div></div>

  setTimeout(()=>window.print(),150);

/* ================= 📋 กระดานงาน · 🙋 อาสา · ⭐ แต้ม =================
   แต้ม: ตรวจโซนตัวเองทันเวลา +1 · อาสาช่วยโซนอื่น +3 · รับงานจากกระดาน = ตามที่ตั้ง · แจ้งปัญหาแล้วแก้จริง +1
   อาสา/งาน ได้แต้มเมื่อหัวหน้าตรวจรูปก่อน-หลังแล้วเท่านั้น */
const VOL_PTS=3,MIN_GAP=3*60e3;
const JOB_TITLES=['มีขยะ ต้องเก็บ','น้ำหก / พื้นเปียก','ของวางเกะกะ','ถังขยะล้น','มีกลิ่น / แมลง','ทำความสะอาดใหญ่'];
const JST={open:['🟢 รอคนรับ','b-done'],taken:['🙋 มีคนรับแล้ว','b-scan'],submitted:['⏳ รอหัวหน้าตรวจ','b-pend'],done:['✅ ผ่าน ได้แต้มแล้ว','b-done'],rejected:['✗ ไม่ผ่าน','b-late'],cancel:['ยกเลิก','b-pend']};
const isMe=n=>!!(me&&n&&n===me.name);
const fDue=t=>{const k=dkey(new Date(t));return (k===today()?'วันนี้':fDate(k))+' '+fTime(t)+' น.'};
function jobsOf(W){return (DB.jobs||[]).filter(j=>{const z=DB.zones.find(x=>x.id===j.zoneId);return z&&(W==='ALL'||zCenter(z)===W)})}
function jobBadge(){if(!DB||!DB.jobs)return '';const js=jobsOf(curW),n=js.filter(j=>j.status==='open').length+(role!=='emp'?js.filter(j=>j.status==='submitted').length:0);return n?`<span class="tab-n">${n}</span>`:''}
function ptsCalc(R,W){const P={},pp=n=>P[n]=P[n]||{n,on:0,vol:0,job:0,iss:0};
  const zs=new Map(DB.zones.filter(z=>W==='ALL'||zCenter(z)===W).map(z=>[z.id,z])),seen=new Set();
  DB.checks.filter(c=>c.date>=R.from&&c.date<=R.to&&zs.has(c.zoneId)&&!c.proxy&&!c.pending).sort((a,b)=>a.time-b.time).forEach(c=>{
    const z=zs.get(c.zoneId),k=c.zoneId+'|'+c.date;if(seen.has(k))return;seen.add(k);if(c.by&&c.by===ownerOn(z,c.date)&&minOf(c.time)<=toMin(z.due))pp(c.by).on++});
  (DB.jobs||[]).forEach(j=>{if(j.status!=='done'||!zs.has(j.zoneId)||!j.taker)return;const d=dkey(new Date(j.revAt||j.subAt||j.at));if(d<R.from||d>R.to)return;
    const p=pp(j.taker);if(j.kind==='vol')p.vol+=j.pts;else p.job+=j.pts});
  DB.issues.forEach(i=>{if(i.status!=='done'||!zs.has(i.zoneId)||!i.by||i.date<R.from||i.date>R.to)return;pp(i.by).iss++});
  return Object.values(P).map(p=>({...p,total:p.on+p.vol+p.job+p.iss})).filter(p=>p.total>0).sort((a,b)=>b.total-a.total)}
function ptsHtml(R,W){const l=ptsCalc(R,W);
  return `<div class="sec-h">⭐ แต้มสะสม${R.cur?'เดือนนี้':'เดือน'+R.label.split(' ')[0]} — ช่วยกันทำความสะอาด</div>
  <div class="zc-meta" style="margin:-4px 0 8px">ตรวจโซนตัวเองทันเวลา +1 · 🙋 อาสาช่วยโซนอื่น +${VOL_PTS} · 📋 รับงานจากกระดาน ตามที่ตั้ง · ⚠️ แจ้งปัญหาแล้วแก้จริง +1</div>
  <div class="card tbl-wrap"><table class="tbl"><tr><th>#</th><th>ชื่อ</th><th>ตรวจทันเวลา</th><th>อาสา</th><th>รับงาน</th><th>แจ้งปัญหา</th><th>รวมแต้ม</th></tr>
  ${l.slice(0,20).map((p,i)=>`<tr class="${isMe(p.n)?'lb-me':''}"><td>${i<3?['🥇','🥈','🥉'][i]:i+1}</td><td><span class="avatar mini">${avIn(p.n)}</span> <b>${esc(p.n)}</b>${nickOf(p.n)?` <span class="zc-meta">(${esc(nickOf(p.n))})</span>`:''}</td>
    <td class="num">${p.on||'-'}</td><td class="num">${p.vol||'-'}</td><td class="num">${p.job||'-'}</td><td class="num">${p.iss||'-'}</td><td class="num"><b style="color:var(--gold);font-size:16px">⭐ ${p.total}</b></td></tr>`).join('')||'<tr class="empty-row"><td colspan="7">ยังไม่มีแต้มเดือนนี้</td></tr>'}</table></div>`}
function myPtsCard(W){const R=lbRange(0),l=ptsCalc(R,W),i=l.findIndex(p=>isMe(p.n)),p=i>=0?l[i]:{on:0,vol:0,job:0,iss:0,total:0};
  return `<div class="pts-card"><div><div style="font-size:14px;opacity:.85">⭐ แต้มของคุณ เดือน${R.label.split(' ')[0]}</div><div class="pts-big">${p.total}</div></div>
  <div style="min-width:0"><div style="font-weight:700">${i>=0?`อันดับ #${i+1} จาก ${l.length} คนในศูนย์`:'ยังไม่มีแต้ม — รับงานหรืออาสาช่วยได้เลย'}</div>
  <div class="pts-chips"><span>✅ ตรวจทันเวลา ${p.on}</span><span>🙋 อาสา ${p.vol}</span><span>📋 รับงาน ${p.job}</span><span>⚠️ แจ้งปัญหา ${p.iss}</span></div></div></div>`}
function homeJobBanner(){const n=jobsOf(curW).filter(j=>j.status==='open').length,m=jobsOf(curW).filter(j=>j.status==='taken'&&isMe(j.taker)).length;if(!n&&!m)return '';

function jobPhotos(j){const l=j.photos&&j.photos.length?j.photos:(j.photo?[j.photo]:[]);if(!l.length)return '';

function jobCard(j,act){const z=DB.zones.find(x=>x.id===j.zoneId)||{id:j.zoneId,name:j.zoneId,icon:'🧹',site:''},st=JST[j.status]||['',''],late=j.due&&j.due<Date.now()&&/open|taken/.test(j.status);

    <div class="zc-meta job-m">${j.kind==='job'?`📣 ${esc(j.by)} · ${fDate(dkey(new Date(j.at)))} ${fTime(j.at)} น.`:`🙋 อาสาโดย ${esc(j.taker)} · ${fTime(j.subAt||j.at)} น.`}${j.due&&/open|taken/.test(j.status)?` · <span style="${late?'color:var(--danger);font-weight:700':''}">⏰ ภายใน ${fDue(j.due)}${late?' (เลยกำหนด)':''}</span>`:''}${j.kind==='job'&&j.taker?` · 🙋 ${esc(j.taker)}`:''}${j.before&&j.dist!=null?(j.dist>60?` · <b style="color:var(--danger)">⚠️ ห่างจุด ${fDist(j.dist)}</b>`:' · 📍 ถ่ายตรงจุด'):''}${j.status==='done'&&j.rev?` · ✓ ตรวจโดย ${esc(j.rev)}`:''}
    ${j.note&&/taken|rejected/.test(j.status)?`<div style="color:var(--danger);font-weight:700">💬 หัวหน้าบอก: ${esc(j.note)}</div>`:''}</div>
    ${act?`<div class="job-a">${act}</div>`:''}</div>`}

  <button class="btn btn-primary btn-block" style="margin-top:12px;min-height:54px;font-size:17px" onclick="guestSend()">📤 ส่งเรื่อง</button>
  <button class="btn btn-outline btn-block" style="margin-top:8px" onclick="guestMenu()">‹ ย้อนกลับ</button>`}
async function guestSend(){const text=$('gText').value.trim(),name=$('gName').value.trim(),tel=$('gTel').value.trim(),hp=$('gHp').value;
  if(text.length<3){$('gErr').textContent='❌ พิมพ์หรือเลือกปัญหาที่พบก่อนนะ';return}
  $('gErr').textContent='';spin(true,'กำลังส่งเรื่อง...');
  try{let id;
    if(LIVE){const r=await fetchT(CONFIG.gasUrl,{method:'POST',body:JSON.stringify({action:'guestIssue',zoneId:gz.id,text,who:gWho,name,tel,photo:gPhoto,hp})},60000);const j=await r.json();if(!j.ok)throw new Error(j.error||'ส่งไม่สำเร็จ');id=j.id}
    else{id='I'+Date.now();DB.issues.push({id,zoneId:gz.id,date:today(),time:Date.now(),by:'ภายนอก · '+(gWho||'ไม่ระบุ')+(name?' · '+name:''),text,photo:gPhoto,status:'open',fixNote:'',guest:true,contact:tel});save()}
    $('guestBox').innerHTML=`<div class="g-done"><div style="font-size:64px">✅</div><h2>ขอบคุณที่ช่วยแจ้ง 🙏</h2>
      <div>ส่งเรื่องถึงหัวหน้าผู้ดูแล <b>${esc(gz.name)}</b> แล้ว</div><div class="zc-meta" style="margin-top:6px">เลขเรื่อง ${esc(id)}</div></div>
      <button class="btn btn-outline btn-block" style="margin-top:14px" onclick="guestForm()">➕ แจ้งเรื่องอื่นเพิ่ม</button>${guestStaffBtn()}`;
  }catch(e){$('gErr').textContent='❌ '+(isNetErr(e)?'ไม่มีสัญญาณ ลองใหม่อีกครั้ง':e.message)}finally{spin(false)}}
/* ===== หน้าหลังสแกน: ผู้รับผิดชอบ · งานที่ยังไม่มีคนรับ · ใครเข้ามาทำอะไรบ้าง ===== */
const daysSince=t=>Math.max(0,Math.floor((Date.now()-t)/864e5));
function whenTxt(t){const k=dkey(new Date(t)),y=daysAgo(1);return (k===today()?'วันนี้':k===y?'เมื่อวาน':fDate(k))+' '+fTime(t)+' น.'}
function ownerCard(z){const own=ownerToday(z),since=z.ownerSince;
  return `<div class="own-card"><div class="avatar">${avIn(own||'?')}</div><div style="flex:1;min-width:0">
    <div class="zc-meta">👤 ผู้รับผิดชอบวันนี้</div><b>${esc(own||'— ยังไม่มีคนรับผิดชอบ —')}</b>${own&&nickOf(own)?` <span class="zc-meta">(${esc(nickOf(own))})</span>`:''}
    <div class="zc-meta">${z.rota?'🔄 เวรหมุนเวียนรายวัน':own&&since?`📅 รับผิดชอบตั้งแต่ ${fDate(dkey(new Date(since)))} (${daysSince(since)} วัน)`:''}${z.backup?` · 🔁 สำรอง ${esc(z.backup)}`:''}</div></div></div>`}
function zoneOpenJobs(z){const js=(DB.jobs||[]).filter(j=>j.zoneId===z.id&&j.status==='open');if(!js.length)return '';
  return `<div class="sec-h">📋 งานในโซนนี้ที่ยังไม่มีคนรับ (${js.length})</div>${js.map(j=>`<div class="zjob"><span class="job-pts">+${j.pts}<small>แต้ม</small></span>
    <div style="flex:1;min-width:0"><b>${esc(j.title)}</b>${j.detail?`<div class="zc-meta">${esc(j.detail)}</div>`:''}<div class="zc-meta">📣 ${esc(j.by)}${j.due?` · ⏰ ภายใน ${fDue(j.due)}`:''}</div>
    <button class="btn btn-gold btn-sm" style="margin-top:6px" onclick="closeModal();jobTake('${j.id}')">✋ รับงานนี้</button></div>${j.photo?`<img src="${esc(j.photo)}" alt="">`:''}</div>`).join('')}`}
function zoneTimeline(z,n=8){
  const ev=[];
  DB.checks.filter(c=>c.zoneId===z.id).forEach(c=>{const bad=c.res.filter(x=>!x).length;ev.push({t:c.time,ic:'✅',who:c.by,what:(c.proxy?'ตรวจแทน':'ตรวจโซน')+(bad?` · ต้องแก้ ${bad} ข้อ`:' · เรียบร้อยทุกข้อ'),img:c.photo,pend:c.pending})});
  (DB.jobs||[]).filter(j=>j.zoneId===z.id&&j.subAt&&/submitted|done/.test(j.status)).forEach(j=>ev.push({t:j.subAt,ic:j.kind==='vol'?'🙋':'📋',who:j.taker,what:(j.kind==='vol'?'อาสาช่วยทำความสะอาด':'ทำงาน: '+j.title)+(j.status==='done'?` · ได้ +${j.pts} แต้ม`:' · รอหัวหน้าตรวจ'),img:j.after}));
  DB.issues.filter(i=>i.zoneId===z.id).forEach(i=>{ev.push({t:i.time,ic:'⚠️',who:i.by,what:'แจ้งปัญหา: '+i.text,img:i.photo});if(i.status==='done'&&i.fixDate)ev.push({t:new Date(i.fixDate+'T12:00:00').getTime(),ic:'🔧',who:'',what:'แก้ปัญหาแล้ว'+(i.fixNote?': '+i.fixNote:''),day:true})});
  ev.sort((a,b)=>b.t-a.t);const l=ev.slice(0,n);
  return `<div class="sec-h">📜 ใครเข้ามาทำโซนนี้บ้าง</div>${l.length?`<div class="tl">${l.map(e=>`<div class="tl-i"><span class="tl-ic">${e.ic}</span><div style="flex:1;min-width:0">
    <div>${e.who?`<b>${esc(e.who)}</b>${nickOf(e.who)?` <span class="zc-meta">(${esc(nickOf(e.who))})</span>`:''} · `:''}${esc(e.what)}${e.pend?' <span class="badge b-pend">⏳ รอส่ง</span>':''}</div>
    <div class="zc-meta">${e.day?fDate(dkey(new Date(e.t))):whenTxt(e.t)}</div></div>${e.img?`<img src="${esc(e.img)}" alt="" loading="lazy">`:''}</div>`).join('')}</div>`:'<div class="empty card">ยังไม่มีใครเข้ามาทำในโซนนี้</div>'}`}
function copyChase(W){
  const zs=DB.zones.filter(z=>(W==='ALL'||zCenter(z)===W)&&['late','pend'].includes(zStatus(z).k));
  const t=`🧹 Rattana Zone · ${W==='ALL'?'ทุกศูนย์':'ศูนย์'+cOf(W).name} ${fDate(today())} ${fTime(Date.now())} น.\nโซนที่ยังไม่ตรวจ ${zs.length} โซน\n`+zs.map(z=>`• ${z.name} (${siteOf(z.site).name}) — ${ownerToday(z)||'ไม่มีคนดูแล'}${zStatus(z).k==='late'?' ⏰ เลยเวลา':''}`).join('\n')+`\nฝากไปสแกน QR ที่หน้าโซนด้วยนะคะ 🙏`;
  navigator.clipboard.writeText(t).then(()=>showToast('คัดลอกแล้ว — ไปวางในกลุ่ม LINE ได้เลย','success'),()=>prompt('คัดลอกข้อความนี้',t));
}

/* ================= MODAL / THEME / INIT ================= */
function openModal(){$('modal').classList.add('open');document.body.style.overflow='hidden'}
function closeModal(){stopCam();scanCb=null;$('modal').classList.remove('open');document.body.style.overflow=''}
$('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
function applyTheme(t){document.body.classList.toggle('dark',t==='dark');$('themeBtn').textContent=t==='dark'?'☀️':'🌙'}
function toggleTheme(){const n=document.body.classList.contains('dark')?'light':'dark';localStorage.setItem('rattana_theme',n);applyTheme(n)}
applyTheme(localStorage.getItem('rattana_theme')||'light');
addEventListener('scroll',()=>$('backToTop').classList.toggle('show',scrollY>300));

if(LIVE){
  $('demoBar').style.display='none';
  DB={sites:[],people:[],zones:[],checks:[],audits:[],issues:[]};
  try{const s=JSON.parse(localStorage.getItem(TOK_KEY));if(s&&s.token&&s.user&&s.user.exp>Date.now())session=s}catch{}
  if(session)startLive();else if(QS.get('zone'))showGuest(QS.get('zone'));else showLogin();
}else{
  load();me=defaultMe();
  if(role==='emp')curW=siteOf(me.site).w;
  curSite=sitesOf(curW)[0]?.id;fixTab();render();
  const qz=(QS.get('zone')||'').toUpperCase();
  if(qz&&DB.zones.find(z=>z.id===qz)){if(role!=='emp'){role='emp';localStorage.setItem('rzone_role','emp');fixTab();render()}setTimeout(()=>openZoneScan(qz,true),300)}
  else if(!localStorage.getItem('rzone_w')&&role!=='emp')openCenterPicker(true);
}
</script>
