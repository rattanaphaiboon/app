<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Rattana Zone — โซนรับผิดชอบ ความสะอาด & ความเรียบร้อย v1.2</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{
  --navy:#0d1b3e;--navy-mid:#1a2f5e;--navy-light:#243b73;--gold:#c9a84c;--gold-light:#e8c86a;
  --success:#2ecc71;--danger:#e74c3c;--warning:#f39c12;
  --bg:#f4f6fb;--text:#0d1b3e;--card-bg:#fff;--border:#dde3f0;--muted:#6b7896;--row-alt:#fafbfd;
  --radius-sm:6px;--radius-md:12px;--radius-lg:16px;
  --shadow-md:0 2px 8px rgba(0,0,0,.08);--shadow-lg:0 8px 24px rgba(13,27,62,.12);--shadow-gold:0 4px 12px rgba(201,168,76,.35);
  --st-done:#1e9e55;--st-done-bg:#e6f7ed;--st-issue:#e67e22;--st-issue-bg:#fff1e3;--st-pend:#8a94ad;--st-pend-bg:#eef1f7;--st-late:#d63c2f;--st-late-bg:#fde8e6;
}
body.dark{--bg:#05080f;--text:#fff;--card-bg:#0d1b3e;--border:#1f3563;--muted:#b8c2dc;--row-alt:#0a1226;
  --st-done-bg:transparent;--st-issue-bg:transparent;--st-pend-bg:transparent;--st-late-bg:transparent}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Sarabun',sans-serif;font-size:15px;line-height:1.5;min-height:100dvh;overflow-x:hidden;background:var(--bg);color:var(--text);transition:background .25s,color .25s}
button{font-family:inherit;cursor:pointer;border:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
input,select,textarea{font-family:inherit;font-size:16px}

header{background:var(--navy);color:#fff;padding:10px 14px;position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:10px;padding-top:max(10px,env(safe-area-inset-top))}
.logo-text{font-weight:800;letter-spacing:1.5px;font-size:18px;color:#fff;line-height:1.1}
.logo-text span{color:var(--gold)}
.logo-sub{font-size:12px;color:rgba(255,255,255,.7);font-weight:500}
.hdr-right{margin-left:auto;display:flex;gap:8px;align-items:center}
.icon-btn{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.2);width:38px;height:38px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-size:17px}
.hub-btn{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:var(--radius-sm);padding:5px 10px;font-size:13px;font-weight:600;text-decoration:none;min-height:38px}
.hub-btn-icon{width:22px;height:22px;border-radius:5px;background:var(--gold);display:inline-flex;align-items:center;justify-content:center;color:var(--navy);font-weight:800;font-size:13px}
.center-btn{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:20px;padding:4px 12px 4px 6px;font-weight:700;font-size:14px;min-height:38px}
.center-btn .cdot{width:24px;height:24px;border-radius:50%;border:2px solid #fff}
@media(max-width:520px){.center-btn .ctext small{display:none}.hub-btn span:last-child{display:none}}

.tab-nav{display:flex;background:var(--navy);border-bottom:3px solid var(--gold);padding:0 8px;gap:4px;overflow-x:auto;scrollbar-width:none;position:sticky;top:58px;z-index:99}
.tab-nav::-webkit-scrollbar{display:none}
.tab-btn{background:transparent;color:rgba(255,255,255,.65);padding:12px 16px;font-size:14px;font-weight:600;white-space:nowrap;flex-shrink:0;border-radius:var(--radius-sm) var(--radius-sm) 0 0}
.tab-btn.active{color:var(--navy);background:var(--gold);font-weight:700}

.demo-bar{background:#fff7e0;border-bottom:1px solid #f0d98a;padding:8px 14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:#7a5b00}
body.dark .demo-bar{background:transparent;color:var(--gold-light);border-color:rgba(201,168,76,.4)}
.role-pill{border:1.5px solid #e0c060;background:#fff;color:#5c4600;border-radius:20px;padding:5px 12px;font-size:13px;font-weight:600;min-height:34px}
body.dark .role-pill{background:transparent;color:var(--gold-light)}
.role-pill.on{background:var(--navy);color:#fff;border-color:var(--navy)}

.content{padding:14px;max-width:1100px;margin:0 auto;width:100%;padding-bottom:90px}
.page{display:none;animation:fadeIn .2s}
.page.on{display:block}
h2.pg-title{font-size:21px;font-weight:800;margin:4px 0 2px}
.pg-sub{color:var(--muted);font-size:14px;margin-bottom:14px}
.card{background:var(--card-bg);border-radius:var(--radius-md);border:1px solid var(--border);box-shadow:var(--shadow-md)}
.card-body{padding:16px}
.sec-h{font-size:17px;font-weight:700;margin:18px 0 10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.zc-meta{font-size:13px;color:var(--muted)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:var(--radius-sm);font-size:15px;font-weight:700;border:1.5px solid transparent;min-height:46px;transition:opacity .15s,transform .1s;text-decoration:none}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--navy);color:#fff}
body.dark .btn-primary{background:var(--gold);color:var(--navy)}
.btn-gold{background:var(--gold);color:var(--navy)}
.btn-outline{background:transparent;color:var(--text);border-color:var(--border)}
.btn-ok{background:var(--st-done);color:#fff}
.btn-sm{padding:6px 12px;font-size:13px;min-height:36px}
.btn-block{width:100%}

.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:12px;font-size:12.5px;font-weight:700;white-space:nowrap}
.b-done{background:var(--st-done-bg);color:var(--st-done);border:1px solid var(--st-done)}
.b-issue{background:var(--st-issue-bg);color:var(--st-issue);border:1px solid var(--st-issue)}
.b-pend{background:var(--st-pend-bg);color:var(--st-pend);border:1px solid var(--st-pend)}
.b-late{background:var(--st-late-bg);color:var(--st-late);border:1px solid var(--st-late)}
.b-scan{background:rgba(52,152,219,.12);color:#1a6fb8;border:1px solid #6aaee6}
body.dark .b-scan{background:transparent;color:#8cc4f2}

.scan-hero{background:linear-gradient(135deg,var(--navy),var(--navy-light));color:#fff;border-radius:var(--radius-lg);padding:18px;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;gap:14px}
.scan-hero .who{display:flex;align-items:center;gap:12px}
.avatar{width:46px;height:46px;border-radius:50%;background:var(--gold);color:var(--navy);font-weight:800;font-size:20px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.scan-big{background:var(--gold);color:var(--navy);border-radius:16px;min-height:84px;font-size:21px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:12px;box-shadow:var(--shadow-gold)}
.scan-big .ic{font-size:36px}
.prog{display:flex;align-items:center;gap:10px;font-size:14px}
.prog .pbar{flex:1;height:12px;background:rgba(255,255,255,.18);border-radius:6px;overflow:hidden}
.prog .pbar i{display:block;height:100%;background:var(--success);border-radius:6px}
.link-w{background:transparent;color:rgba(255,255,255,.8);text-decoration:underline;font-size:13px;padding:0}

.zgrid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:640px){.zgrid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1000px){.zgrid{grid-template-columns:repeat(3,1fr)}}
.zcard{background:var(--card-bg);border:1px solid var(--border);border-left:6px solid var(--st-pend);border-radius:var(--radius-md);padding:14px;box-shadow:var(--shadow-md);display:flex;flex-direction:column;gap:8px}
.zcard.s-done{border-left-color:var(--st-done)}.zcard.s-issue{border-left-color:var(--st-issue)}.zcard.s-late{border-left-color:var(--st-late)}
.zc-top{display:flex;gap:12px;align-items:flex-start}
.zc-ico{font-size:28px;width:50px;height:50px;border-radius:12px;background:rgba(201,168,76,.15);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.zc-name{font-size:17px;font-weight:800;line-height:1.25}
.zc-row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.zc-photo{width:100%;height:120px;object-fit:cover;border-radius:10px;border:1px solid var(--border)}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.chip{flex-shrink:0;border:2px solid var(--border);background:var(--card-bg);color:var(--text);border-radius:22px;padding:7px 14px;font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px;min-height:40px}
.chip .dot{width:12px;height:12px;border-radius:50%}
.chip.on{border-color:var(--navy);background:var(--navy);color:#fff}
body.dark .chip.on{border-color:var(--gold);background:var(--gold);color:var(--navy)}
.legend{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.floor{margin-bottom:16px}
.floor-h{font-weight:700;font-size:14px;color:var(--muted);margin-bottom:8px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:640px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{border-radius:14px;padding:12px;min-height:110px;display:flex;flex-direction:column;gap:4px;text-align:left;border:2px solid;cursor:pointer;color:var(--text)}
.tile.s-done{background:var(--st-done-bg);border-color:var(--st-done)}
.tile.s-issue{background:var(--st-issue-bg);border-color:var(--st-issue)}
.tile.s-pend{background:var(--st-pend-bg);border-color:var(--st-pend);border-style:dashed}
.tile.s-late{background:var(--st-late-bg);border-color:var(--st-late)}
.tile .t-ico{font-size:24px}
.tile .t-name{font-weight:800;font-size:15px;line-height:1.2}
.tile .t-own{font-size:12.5px;color:var(--muted)}
.tile .t-st{margin-top:auto;font-size:12.5px;font-weight:700}

.cgrid{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:560px){.cgrid{grid-template-columns:repeat(2,1fr)}}
.ccard{display:flex;align-items:center;gap:14px;padding:14px;border-radius:14px;border:2px solid var(--border);background:var(--card-bg);color:var(--text);text-align:left;min-height:76px}
.ccard .big{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:16px;flex-shrink:0;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.ccard b{font-size:17px}
.ccard.on{border-color:var(--gold);box-shadow:var(--shadow-gold)}

.people{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px;scrollbar-width:thin}
.pcard{flex-shrink:0;min-width:130px;background:var(--card-bg);border:1.5px solid var(--border);border-radius:12px;padding:10px;text-align:center}
.pcard .avatar{margin:0 auto 6px;width:40px;height:40px;font-size:17px}
.pcard b{display:block;font-size:14px;line-height:1.2}
.pcard.zero{border-color:var(--st-issue);border-style:dashed}
.arow{display:grid;grid-template-columns:1fr;gap:8px;padding:12px;border-bottom:1px solid var(--border)}
@media(min-width:760px){.arow{grid-template-columns:1.3fr 1fr 1fr auto;align-items:center}}
.arow.none{background:var(--st-late-bg)}
.arow select{min-height:42px}
.rota-tag{font-size:12px;font-weight:700;color:#8e44ad}
.zcode{display:inline-block;font-family:'Courier New',monospace;font-weight:800;font-size:12.5px;letter-spacing:.5px;background:var(--navy);color:var(--gold-light);border-radius:6px;padding:1px 7px;align-self:flex-start}
.zcode.big{font-size:15px;padding:3px 10px}
body.dark .rota-tag{color:#d2a6ea}

.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:640px){.stat-grid{grid-template-columns:repeat(4,1fr)}}
.stat-card{background:var(--card-bg);border-radius:var(--radius-md);padding:14px;border:1px solid var(--border);border-top:3px solid var(--gold)}
.s-label{font-size:13px;color:var(--muted);font-weight:600}
.s-value{font-size:26px;font-weight:800;line-height:1.2}
.s-sub{font-size:12.5px;color:var(--muted)}
.bar-row{display:grid;grid-template-columns:150px 1fr 44px;gap:10px;align-items:center;padding:7px 0}
.bar{height:16px;background:var(--border);border-radius:8px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:8px}
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;min-width:560px}
.tbl th{background:var(--navy);color:#fff;padding:10px;text-align:left;font-size:13px;white-space:nowrap}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--border);font-size:14px;vertical-align:middle}
.tbl tr:nth-child(even) td{background:var(--row-alt)}
.heat{display:flex;gap:3px}
.heat i{width:16px;height:16px;border-radius:4px;display:block}

.area-box{margin-bottom:14px}
.area-h{display:flex;align-items:center;gap:8px;padding:10px 14px;background:linear-gradient(to right,rgba(201,168,76,.12),transparent);border-bottom:1px solid var(--border);border-radius:var(--radius-md) var(--radius-md) 0 0}
.area-h b{font-size:16px;flex:1}
.mz{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.mz .nm{flex:1;min-width:160px}

.modal-overlay{display:none;position:fixed;inset:0;background:rgba(13,27,62,.65);z-index:9000;align-items:flex-start;justify-content:center;padding:14px;backdrop-filter:blur(4px);overflow-y:auto}
.modal-overlay.open{display:flex}
.modal{background:var(--card-bg);border-radius:var(--radius-lg);max-width:540px;width:100%;border-top:4px solid var(--gold);animation:slideUp .22s;margin:auto 0}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border);gap:8px}
.modal-head h3{font-size:18px;font-weight:800}
.modal-close{background:transparent;font-size:26px;color:var(--muted);padding:2px 8px}
.modal-body{padding:16px 18px}
.modal-foot{padding:12px 18px;border-top:1px solid var(--border);display:flex;gap:8px;flex-wrap:wrap}
.modal-foot .btn{flex:1}
.zone-hdr{border-radius:14px;padding:16px;color:#fff;background:linear-gradient(135deg,var(--navy),var(--navy-light));margin-bottom:12px}
.zone-hdr .zi{font-size:40px;line-height:1}
.zone-hdr .zn{font-size:22px;font-weight:800;margin-top:4px}
.zone-hdr .zs{opacity:.85;font-size:14px}

.chk{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);flex-wrap:wrap}
.chk .q{flex:1;font-size:15.5px;font-weight:600;min-width:170px}
.yn{display:flex;gap:6px}
.yn button{min-width:84px;min-height:44px;border-radius:10px;border:2px solid var(--border);background:transparent;color:var(--text);font-weight:700;font-size:14px}
.yn .y.on{background:var(--st-done);border-color:var(--st-done);color:#fff}
.yn .n.on{background:var(--st-late);border-color:var(--st-late);color:#fff}
.field{display:flex;flex-direction:column;gap:5px;margin-top:12px}
.field label{font-size:14px;font-weight:700}
.input{min-height:46px;padding:8px 12px;border-radius:var(--radius-sm);border:1.5px solid var(--border);background:var(--card-bg);color:var(--text);outline:none;width:100%}
.input:focus{border-color:var(--gold)}
textarea.input{resize:vertical}
.ph2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.photo-box{border:2px dashed var(--border);border-radius:12px;padding:12px;text-align:center;cursor:pointer;color:var(--muted);font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:110px}
.photo-box img{max-width:100%;max-height:160px;border-radius:8px;display:block;margin:0 auto 6px}
.stars{display:flex;gap:4px}
.stars button{font-size:26px;background:transparent;color:#ccd3e3;padding:0 2px;min-height:40px}
.stars button.on{color:var(--gold)}
.aud-row{padding:10px 0;border-bottom:1px solid var(--border)}
.aud-row .q{font-weight:700}
.issue{display:flex;gap:12px;padding:12px;border-bottom:1px solid var(--border);align-items:flex-start}
.issue img{width:72px;height:72px;object-fit:cover;border-radius:8px;flex-shrink:0}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.name-list{max-height:320px;overflow-y:auto;border:1px solid var(--border);border-radius:10px;margin-top:8px}
.name-list button{display:flex;width:100%;align-items:center;gap:10px;padding:10px 12px;background:transparent;color:var(--text);border-bottom:1px solid var(--border);text-align:left;font-size:15px;min-height:48px}
.name-list button:hover{background:rgba(201,168,76,.1)}
.rota-grid{display:grid;grid-template-columns:60px 1fr;gap:8px;align-items:center}

#scanWrap{position:relative;border-radius:14px;overflow:hidden;background:#000;aspect-ratio:1/1}
#scanWrap video{width:100%;height:100%;object-fit:cover}
#scanWrap .frame{position:absolute;inset:16%;border:4px solid var(--gold);border-radius:18px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
#scanWrap .msg{position:absolute;left:0;right:0;bottom:10px;text-align:center;color:#fff;font-weight:700;text-shadow:0 1px 3px #000;padding:0 10px}

.toast{position:fixed;bottom:max(20px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);padding:12px 20px;border-radius:var(--radius-md);color:#fff;z-index:9999;font-weight:600;box-shadow:var(--shadow-lg);max-width:92vw;font-size:14px;animation:slideUp .3s}
.toast-success{background:var(--st-done)}.toast-error{background:var(--danger)}.toast-info{background:var(--navy-mid);border-left:3px solid var(--gold)}
#backToTop{position:fixed;bottom:max(24px,calc(16px + env(safe-area-inset-bottom)));right:16px;background:var(--gold);color:var(--navy);border-radius:50%;width:46px;height:46px;display:none;align-items:center;justify-content:center;box-shadow:var(--shadow-gold);z-index:90;font-size:18px;font-weight:800}
#backToTop.show{display:flex}
footer{text-align:center;color:var(--muted);font-size:12.5px;padding:10px}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}}

/* login */
#loginScreen{display:none;min-height:100dvh;align-items:center;justify-content:center;padding:20px;background:linear-gradient(160deg,var(--navy),var(--navy-light))}
#loginScreen.show{display:flex}
.login-card{background:var(--card-bg);border-radius:20px;max-width:420px;width:100%;padding:24px;border-top:5px solid var(--gold);box-shadow:var(--shadow-lg)}
.login-card h1{font-size:24px;font-weight:800;letter-spacing:1px}.login-card h1 span{color:var(--gold)}
.login-sec{border:1.5px solid var(--border);border-radius:14px;padding:14px;margin-top:14px}
.login-sec h3{font-size:16px;font-weight:800;margin-bottom:4px}
.login-err{color:var(--danger);font-weight:700;font-size:14px;margin-top:8px;min-height:20px}
body.locked header,body.locked .tab-nav,body.locked .demo-bar,body.locked main{display:none}
#spin{display:none;position:fixed;inset:0;background:rgba(13,27,62,.55);z-index:99999;align-items:center;justify-content:center;backdrop-filter:blur(3px)}
#spin.show{display:flex}
#spin .box{background:var(--card-bg);border-radius:16px;padding:26px 34px;text-align:center;border-top:4px solid var(--gold);color:var(--text);font-weight:700}
#spin .ring{width:46px;height:46px;border:5px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.user-btn{display:flex;align-items:center;gap:6px;background:transparent;color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:20px;padding:3px 10px 3px 3px;min-height:38px;font-weight:700;font-size:13px}
.user-btn .avatar{width:30px;height:30px;font-size:14px}
@media(max-width:620px){.user-btn span:last-child{display:none}}

#printArea{display:none}
@media print{
  body>*:not(#printArea){display:none!important}
  #printArea{display:block}
  @page{size:A4;margin:0}

<script>
/* ================= CONFIG ================= */
const VERSION='1.2';
const CONFIG={
  gasUrl:'https://script.google.com/macros/s/AKfycbxZtcTiTQEk91zTtBUeh6BDs1z61x_Huyip1RaeQvVbzzIKrrZ3Hc-1UOnefSGG7-H1/exec',   // rattana-zone.gs · ?demo=1 = โหมดตัวอย่าง
  clientId:'615875645128-gasjjvkt6lu8g449cbnhl40k1pu25r0b.apps.googleusercontent.com',
};
const QS=new URLSearchParams(location.search);
const LIVE=!!CONFIG.gasUrl&&!QS.has('demo');
const TOK_KEY='rzone_tok';
let session=null; // {token,user:{c,n,s,w,r,exp}}

/* ================= API (โหมดใช้งานจริง) ================= */
function spin(on,msg){$('spin').classList.toggle('show',!!on);if(msg)$('spinMsg').textContent=msg}
async function api(action,body={}){
  const r=await fetch(CONFIG.gasUrl,{method:'POST',body:JSON.stringify({action,t:session&&session.token,...body})});
  const j=await r.json();
  if(!j.ok){if(j.auth)logout(true);throw new Error(j.error||'ผิดพลาด')}
  return j;
}
async function bootLive(){
  const r=await fetch(CONFIG.gasUrl+'?action=boot&t='+encodeURIComponent(session.token)+'&x='+Date.now());
  const j=await r.json();
  if(!j.ok){if(j.auth)logout(true);throw new Error(j.error||'โหลดข้อมูลไม่สำเร็จ')}
  DB={sites:j.sites,people:j.people,zones:j.zones,checks:j.checks,audits:j.audits,issues:j.issues,grants:j.grants||[]};
  // สิทธิ์คิดใหม่ที่หลังบ้านทุกครั้ง — ถ้าเพิ่งได้รับ/ถูกถอนสิทธิ์ เมนูเปลี่ยนตามทันที
  if(j.user&&session&&j.user.r&&j.user.r!==session.user.r){session.user.r=j.user.r;session.user.w=j.user.w;localStorage.setItem(TOK_KEY,JSON.stringify(session));role=j.user.r;fixTab()}
}
// เพิ่มพื้นที่/โซนใหม่: ทุกคนทำได้ในศูนย์ตัวเอง (หัวหน้างาน/HR ทำได้ทุกที่ที่มีสิทธิ์)
function canAdd(){return role!=='emp'||!me||!me.site||siteOf(me.site).w===curW}
const ROLE_LABEL={emp:'พนักงาน',mgr:'หัวหน้างาน / ผู้จัดการ (ศูนย์ตัวเอง)',hr:'HR / ดูทุกศูนย์'};
// เรียกทุกครั้งที่แก้ข้อมูล: โหมดตัวอย่าง = แก้ในเครื่อง · ใช้งานจริง = ส่งหลังบ้านแล้วโหลดใหม่
async function commit(action,payload,local,msg){
  if(!LIVE){local();save();return true}
  spin(true,msg||'กำลังบันทึก...');
  try{const r=await api(action,payload);await bootLive();return r}
  catch(e){showToast(e.message,'error');return false}
  finally{spin(false)}
}
async function refreshData(){if(!LIVE)return;spin(true,'กำลังโหลด...');try{await bootLive();render();showToast('อัปเดตแล้ว ✓','success')}catch(e){showToast(e.message,'error')}finally{spin(false)}}
function showLogin(){
  document.body.classList.add('locked');$('loginScreen').classList.add('show');
  const pz=QS.get('zone');$('lgPending').textContent=pz?`📍 เข้าสู่ระบบแล้วจะเปิดหน้าตรวจโซน ${pz.toUpperCase()} ให้ทันที`:'';
  const tryG=()=>{if(window.google&&google.accounts){google.accounts.id.initialize({client_id:CONFIG.clientId,callback:gLogin});
    google.accounts.id.renderButton($('gBtn'),{theme:'outline',size:'large',text:'signin_with',width:300})}else setTimeout(tryG,300)};tryG();
}
async function empLogin(){
  const code=$('lgCode').value.trim(),birth=$('lgBirth').value.replace(/\D/g,'');
  if(!code||birth.length!==8){$('lgErr').textContent='กรอกรหัสพนักงาน และวันเกิด 8 หลัก';return}
  $('lgErr').textContent='';spin(true,'กำลังตรวจสอบ...');
  try{const j=await api('empLogin',{code,birth});afterLogin(j)}catch(e){$('lgErr').textContent='❌ '+e.message}finally{spin(false)}
}
async function gLogin(r){
  spin(true,'กำลังตรวจสอบ...');
  try{const j=await api('googleLogin',{credential:r.credential});afterLogin(j)}catch(e){$('lgErr').textContent='❌ '+e.message}finally{spin(false)}
}
function afterLogin(j){session={token:j.token,user:j.user};localStorage.setItem(TOK_KEY,JSON.stringify(session));startLive()}
function logout(expired){localStorage.removeItem(TOK_KEY);session=null;if(expired)showToast('กรุณาเข้าสู่ระบบใหม่','error');setTimeout(()=>location.href=location.pathname+(QS.get('zone')?'?zone='+QS.get('zone'):''),expired?1200:0)}
function userMenu(){
  const u=session.user;
  $('modalBox').innerHTML=`<div class="modal-head"><h3>👤 ${esc(u.n)}</h3><button class="modal-close" onclick="closeModal()">×</button></div>
  <div class="modal-body"><div class="zc-meta">รหัส ${esc(u.c)} · ${esc(u.s?siteOf(u.s).name:'สำนักงานใหญ่')} · สิทธิ์: ${ROLE_LABEL[u.r]}</div>${u.r==='emp'?'<div class="zc-meta" style="margin-top:8px">ถ้าคุณเป็นหัวหน้างานและอยากเพิ่มพื้นที่/โซนเอง ให้ HR หรือผู้จัดการกดให้สิทธิ์ในแอป</div>':''}</div>
  <div class="modal-foot"><button class="btn btn-outline" onclick="closeModal()">ปิด</button><button class="btn btn-primary" onclick="logout()">ออกจากระบบ</button></div>`;openModal();
}
async function startLive(){
  $('loginScreen').classList.remove('show');document.body.classList.remove('locked');
  const u=session.user;role=u.r;me={name:u.n,site:u.s,code:u.c};
  curW=u.w&&u.w!=='ALL'?u.w:(localStorage.getItem('rzone_w')||'W1');
  $('userBtn').style.display='';$('userBtn').innerHTML=`<span class="avatar">${initial(u.n)}</span><span>${esc(u.n.split(' ')[0])}</span>`;
  $('refreshBtn').style.display='';
  spin(true,'กำลังโหลดข้อมูล...');
  try{await bootLive()}catch(e){spin(false);showToast(e.message,'error');return}
  spin(false);
  curSite=(role==='emp'&&me.site&&siteOf(me.site).w===curW)?me.site:sitesOf(curW)[0]?.id;fixTab();render();
  const qz=(QS.get('zone')||'').toUpperCase();
  if(qz&&DB.zones.find(z=>z.id===qz)){history.replaceState(null,'',location.pathname);setTimeout(()=>openZoneScan(qz,true),200)}
  setInterval(()=>{if(!document.hidden&&!$('modal').classList.contains('open'))bootLive().then(render).catch(()=>{})},120000);
}
const CENTERS=[
  {w:'W1',name:'สมุทรสงคราม',color:'#f1c40f'},
  {w:'W2',name:'สุพรรณบุรี',color:'#2e86de'},

  {k:'s4',q:'สุขลักษณะ',d:'ไม่มีกลิ่น ไม่มีแมลง ถังขยะไม่ล้น'},
  {k:'s5',q:'สร้างนิสัย',d:'ทำต่อเนื่อง ตรวจครบทุกวันตามรอบ'},

const TPL={
  wh:['ทางเดินรถยก/ทางหนีไฟโล่ง','พาเลทวางในเส้น ไม่ล้ำเส้นเหลือง','สินค้าเสีย/รอคืนแยกไว้ที่จุดกำหนด','พื้นไม่มีเศษฟิล์ม เศษกระดาษ'],

  office:['โต๊ะทำงานเรียบร้อย เอกสารเข้าแฟ้ม','ปิดไฟ/แอร์/คอมพ์ เมื่อไม่ใช้','พื้นและถังขยะสะอาด'],
  wc:['พื้นแห้ง ไม่มีกลิ่น','กระดาษ/สบู่ ไม่ขาด','สุขภัณฑ์และอ่างล้างมือสะอาด'],
  store:['พื้นกวาด-ถูแล้ว ไม่มีคราบ','ชั้นวางเรียบร้อย ของหน้าชั้นเต็ม','ป้ายราคาตรง ไม่หลุด','ไม่มีกล่อง/ขยะวางเกะกะทางเดิน'],
  cold:['ตู้แช่สะอาด ไม่มีน้ำแข็งเกาะ','อุณหภูมิตู้อยู่ในเกณฑ์','สินค้าหน้าตู้เรียงเต็ม ไม่หมดอายุ'],

/* ================= UTIL ================= */

const daysAgo=n=>{const d=new Date();d.setDate(d.getDate()-n);return dkey(d)};
const fDate=k=>{const [y,m,d]=k.split('-');return `${d}/${m}/${+y+543}`};
const fTime=t=>{const d=new Date(t);return `${pad(d.getHours())}.${pad(d.getMinutes())}`};
const nowMin=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()};
const toMin=s=>{const [h,m]=String(s).split('.').map(Number);return h*60+(m||0)};

/* ================= DATA (demo) ================= */

function seed(){
  const sites=[
    {id:'W1',w:'W1',name:'ศูนย์สมุทรสงคราม',areas:['คลังสินค้า','ลาน/ท่ารถ','สำนักงาน','ส่วนกลาง']},

    C4:['พรทิพย์ แก้วกาญจน์','ณัฐพล เรืองศรี','สายสุนีย์ ชมภู','อภิชาติ นาคสุข']};

  const Z=[];let n=1;
  const add=(site,area,icon,name,tpl,owner,backup,due)=>Z.push({id:'Z'+pad(n++),site,area,icon,name,items:TPL[tpl].slice(),owner,backup,due,freq:'ทุกวัน',rota:null,before:false});

function ownerToday(z){if(z.rota){const v=z.rota[new Date().getDay()];if(v!==undefined)return v}return z.owner}
function todayCheck(z){return DB.checks.filter(c=>c.zoneId===z.id&&c.date===today()).sort((a,b)=>b.time-a.time)[0]}
function openIssues(z){return DB.issues.filter(i=>i.zoneId===z.id&&i.status==='open')}
function zStatus(z){
  const c=todayCheck(z);
  if(c){const bad=c.res.filter(x=>!x).length;if(bad||openIssues(z).length)return {k:'issue',t:bad?`ต้องแก้ ${bad} ข้อ`:'มีปัญหาค้าง',c};return {k:'done',t:'เรียบร้อย ✓',c}}
  if(!ownerToday(z))return {k:'late',t:'ยังไม่มีคนรับผิดชอบ'};
  if(nowMin()>toMin(z.due))return {k:'late',t:`เลยเวลา (${z.due} น.)`};
  return {k:'pend',t:`ยังไม่ตรวจ · ก่อน ${z.due} น.`};
}

function zoneScore(z,days=30){
  const from=daysAgo(days);
  const ch=new Set(DB.checks.filter(c=>c.zoneId===z.id&&c.date>=from&&c.date<today()).map(c=>c.date)).size;
  const comp=Math.min(1,ch/days);
  const au=DB.audits.filter(a=>a.zoneId===z.id&&a.date>=from);
  const aavg=au.length?au.reduce((s,a)=>s+Object.values(a.sc).reduce((x,y)=>x+y,0)/5,0)/au.length:0;
  return {comp:Math.round(comp*100),audit:aavg?+aavg.toFixed(1):null,score:Math.round(comp*50+(aavg/5)*50)};
}
function calcStreak(z){let n=0;const set=new Set(DB.checks.filter(c=>c.zoneId===z.id).map(c=>c.date));let d=set.has(today())?0:1;while(set.has(daysAgo(d))){n++;d++}return n}
function heat(z,n=14){let h='';for(let d=n-1;d>=0;d--){const k=daysAgo(d);const c=DB.checks.filter(x=>x.zoneId===z.id&&x.date===k).sort((a,b)=>b.time-a.time)[0];
  const col=!c?(d===0?'var(--border)':'#f3b7b1'):c.res.every(Boolean)?'#2ecc71':'#f0a04b';h+=`<i title="${fDate(k)}" style="background:${col}"></i>`}return `<div class="heat">${h}</div>`}

async function startCam(){
  try{
    scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    const v=$('scanVid');v.srcObject=scanStream;await v.play();$('scanMsg').textContent='ส่องไปที่ QR';
    const cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});
    const tick=()=>{if(!scanStream)return;if(v.readyState===v.HAVE_ENOUGH_DATA){cv.width=v.videoWidth;cv.height=v.videoHeight;cx.drawImage(v,0,0);
      const r=window.jsQR&&jsQR(cx.getImageData(0,0,cv.width,cv.height).data,cv.width,cv.height);
      if(r&&r.data){const m=r.data.match(/[?&]zone=([A-Z0-9-]+)/i);if(m){gotZone(m[1].toUpperCase(),true);return}$('scanMsg').textContent='QR นี้ไม่ใช่ป้ายโซน'}}
      scanRaf=requestAnimationFrame(tick)};tick();
  }catch(e){const m=$('scanMsg');if(m)m.textContent='เปิดกล้องไม่ได้ — ใช้กล้องมือถือสแกน หรือพิมพ์รหัสโซนด้านล่าง'}
}
function stopCam(){if(scanStream){scanStream.getTracks().forEach(t=>t.stop());scanStream=null}cancelAnimationFrame(scanRaf)}

function openCheck(zid,proxy){

    <button class="btn btn-outline btn-sm" style="margin-top:10px" onclick="ck.res.forEach((_,i)=>setYN(i,true))">✓ เรียบร้อยทุกข้อ</button>
    <div class="sec-h">2. ถ่ายรูป</div>
    <div class="${z.before?'ph2':''}">
      ${z.before?`<label class="photo-box" id="phB"><input type="file" accept="image/*" capture="environment" hidden onchange="pickPhoto(this,'phB',p=>ck.before=p)">📷 รูปก่อนทำ</label>`:''}
      <label class="photo-box" id="phA"><input type="file" accept="image/*" capture="environment" hidden onchange="pickPhoto(this,'phA',p=>ck.photo=p)">📷 รูปหลังทำ (บังคับ)</label>
    </div>
    <div class="zc-meta" style="margin-top:6px">รูปจะประทับวันที่-เวลาอัตโนมัติ</div>
    <div class="field"><label>3. หมายเหตุ (ถ้ามี)</label><textarea class="input" rows="2" id="ckNote" placeholder="เช่น พาเลทล้ำเส้น รอรถยกย้าย"></textarea></div>
    <label style="display:flex;gap:8px;align-items:center;margin-top:12px;font-weight:600"><input type="checkbox" id="ckIssue" style="width:22px;height:22px"> ส่งเป็นปัญหาให้ผู้จัดการตามแก้ด้วย</label>
  </div>
  <div class="modal-foot"><button class="btn btn-outline" onclick="closeModal()">ยกเลิก</button><button class="btn btn-primary" onclick="submitCheck()">ส่งผลตรวจ</button></div>`;
  openModal();
}
function setYN(i,v){ck.res[i]=v;$('y'+i).classList.toggle('on',v===true);$('n'+i).classList.toggle('on',v===false)}
async function submitCheck(){
  if(ck.res.some(v=>v===null))return showToast('กรุณาเลือกให้ครบทุกข้อ','error');
  if(ck.z.before&&!ck.before)return showToast('โซนนี้ต้องมีรูปก่อนทำด้วย','error');
  if(!ck.photo)return showToast('กรุณาถ่ายรูปหลังทำก่อนส่ง','error');
  const note=$('ckNote').value.trim(),by=me.name,isIssue=$('ckIssue').checked;
  const bad=ck.z.items.filter((_,i)=>!ck.res[i]),issueText=note||('ต้องแก้: '+bad.join(', '));
  const ok=await commit('check',{zoneId:ck.z.id,res:ck.res,photo:ck.photo,before:ck.before,note,scan:scanned,proxy:!!ck.proxy,for:ck.proxy?ownerToday(ck.z):'',issue:isIssue,issueText},()=>{
    DB.checks.push({id:'C'+Date.now(),zoneId:ck.z.id,date:today(),time:Date.now(),by,res:ck.res,photo:ck.photo,before:ck.before,note,scan:scanned,proxy:!!ck.proxy,for:ck.proxy?ownerToday(ck.z):''});
    if(isIssue)DB.issues.push({id:'I'+Date.now(),zoneId:ck.z.id,date:today(),time:Date.now(),by,text:issueText,photo:ck.photo,status:'open',fixNote:''});
  },'กำลังส่งผลตรวจและรูป...');
  if(!ok)return;
  closeModal();render();showToast(ck.res.every(Boolean)?'ส่งผลตรวจแล้ว — เรียบร้อยทุกข้อ ✓':'ส่งผลแล้ว — ผู้จัดการจะเห็นข้อที่ต้องแก้','success');
}
function pickPhoto(inp,boxId,cb){
  const f=inp.files[0];if(!f)return;const img=new Image(),url=URL.createObjectURL(f);
  img.onload=()=>{const s=Math.min(1,640/Math.max(img.width,img.height)),cv=document.createElement('canvas');cv.width=img.width*s;cv.height=img.height*s;
    const g=cv.getContext('2d');g.drawImage(img,0,0,cv.width,cv.height);
    const st=`${fDate(today())} ${fTime(Date.now())} น.`;g.font='bold 20px Sarabun,sans-serif';g.fillStyle='rgba(0,0,0,.55)';g.fillRect(0,cv.height-34,g.measureText(st).width+20,34);g.fillStyle='#fff';g.fillText(st,10,cv.height-11);
    const d=cv.toDataURL('image/jpeg',.7);cb(d);const box=$(boxId);box.querySelector('img')?.remove();box.insertAdjacentHTML('afterbegin',`<img src="${d}">`);URL.revokeObjectURL(url)};
  img.src=url;
}

function autoRota(site){const ppl=DB.people.filter(p=>p.site===site);[1,2,3,4,5,6].forEach((d,i)=>$('rt'+d).value=ppl[i%ppl.length].name);$('rt0').value=''}
async function saveRota(zid,clear){const z=DB.zones.find(x=>x.id===zid);let rota=null;if(!clear){rota={};DOW.forEach(([d])=>rota[d]=$('rt'+d).value)}

async function saveArea(siteId){
  const s=siteOf(siteId),n=$('naName').value.trim(),c=$('naCode').value.trim().toUpperCase();
  if(!n)return showToast('กรุณาใส่ชื่อพื้นที่','error');if(s.areas.includes(n))return showToast('มีพื้นที่นี้แล้ว','error');
  if(!/^[A-Z0-9]{1,4}$/.test(c))return showToast('รหัสพื้นที่ใช้ A-Z/0-9 ไม่เกิน 4 ตัว','error');
  if(s.areas.some(a=>areaCode(siteId,a)===c))return showToast('รหัสพื้นที่ '+c+' ซ้ำกับพื้นที่อื่น','error');
  const codes={...(s.codes||{}),[n]:c};
  if(!await commit('setAreas',{site:s.id,areas:s.areas.concat(n),codes},()=>{s.areas.push(n);s.codes=codes}))return;
  closeModal();render();showToast('เพิ่มพื้นที่ '+n+' แล้ว — กด ➕ โซน เพื่อเพิ่มโซนในพื้นที่นี้','success');
}
/* รหัสโซน = สถานที่-รหัสพื้นที่+เลข 2 หลัก เช่น W1-WH01 (ตรงกับหลังบ้าน) */
const AREA_CODE={'คลังสินค้า':'WH','ลาน/ท่ารถ':'YD','สำนักงาน':'OF','ส่วนกลาง':'CM','หน้าร้าน':'FR','หลังร้าน':'BK','ภายนอก':'OT','ห้องน้ำ':'WC','ห้องเย็น':'CL'};
function areaCode(siteId,area){const s=siteOf(siteId),i=s.areas.indexOf(area);return ((s.codes||{})[area]||AREA_CODE[area]||('Z'+String.fromCharCode(65+(Math.max(i,0)%26)))).toUpperCase()}
function suggestAreaCode(siteId,name){const s=siteOf(siteId);if(AREA_CODE[name.trim()])return AREA_CODE[name.trim()];let k=0,c;do{c='Z'+String.fromCharCode(65+(k++%26))}while(k<27&&s.areas.some(a=>areaCode(siteId,a)===c));return c}
function nextZoneCode(siteId,area){const pre=siteId.toUpperCase()+'-'+areaCode(siteId,area);let max=0;DB.zones.forEach(z=>{if(z.id.toUpperCase().indexOf(pre)===0){const n=parseInt(z.id.slice(pre.length),10);if(n>max)max=n}});return pre+String(max+1).padStart(2,'0')}

}

  const zs=DB.zones.filter(z=>z.site===curSite);
  $('pg-audit').innerHTML=`
  <h2 class="pg-title">⭐ เดินตรวจให้คะแนน 5ส — ${esc(cOf(curW).name)}</h2><div class="pg-sub">ผู้จัดการเดินตรวจสัปดาห์ละครั้ง สแกน QR หน้าโซนแล้วกด ⭐ หรือกดจากหน้านี้ · โซนที่ไม่ได้ตรวจเกิน 7 วันขึ้นสีแดง</div>
  ${siteChips('rAudit')}
  <div class="zgrid">${zs.map(z=>{const a=DB.audits.filter(x=>x.zoneId===z.id).sort((p,q)=>q.date.localeCompare(p.date))[0];
    const age=a?Math.round((new Date(today())-new Date(a.date))/864e5):99,avg=a?(Object.values(a.sc).reduce((x,y)=>x+y,0)/5).toFixed(1):'-';
    return `<div class="zcard ${age>7?'s-late':'s-done'}"><div class="zc-top"><div class="zc-ico">${z.icon}</div><div style="flex:1"><div class="zc-name">${esc(z.name)}</div><div class="zc-meta">👤 ${esc(ownerToday(z)||'-')} · ${esc(z.area)}</div></div>
      <div style="text-align:right"><div style="font-size:24px;font-weight:800">${avg}</div><div class="zc-meta">/ 5 ⭐</div></div></div>
      <div class="zc-meta">${a?`ตรวจล่าสุด ${fDate(a.date)} (${age} วันก่อน)`:'ยังไม่เคยตรวจ'}</div>
      <button class="btn ${age>7?'btn-gold':'btn-outline'} btn-block" onclick="openAudit('${z.id}')">⭐ ให้คะแนนโซนนี้</button></div>`}).join('')}</div>`;
}
let au=null;
function openAudit(zid){
  const z=DB.zones.find(x=>x.id===zid);au={z,sc:{},photo:''};
  $('modalBox').innerHTML=`
  <div class="modal-head"><h3>⭐ ${z.icon} ${esc(z.name)}</h3><button class="modal-close" onclick="closeModal()">×</button></div>
  <div class="modal-body"><div class="zc-meta">เจ้าของโซน ${esc(ownerToday(z)||'-')} · ${fDate(today())}</div>
  ${AUDIT_TOPICS.map(t=>`<div class="aud-row"><div class="zc-row"><div><div class="q">${t.q}</div><div class="zc-meta">${t.d}</div></div>
    <div class="stars" id="st-${t.k}">${[1,2,3,4,5].map(n=>`<button onclick="setStar('${t.k}',${n})">★</button>`).join('')}</div></div></div>`).join('')}
  <div class="field"><label>คำแนะนำถึงเจ้าของโซน</label><textarea class="input" rows="2" id="auNote" placeholder="เช่น ชั้นล่างสุดยังมีฝุ่น ฝากเช็ดเพิ่ม"></textarea></div>
  <div class="field"><label>รูปประกอบ (ถ้ามี)</label><label class="photo-box" id="auPh"><input type="file" accept="image/*" capture="environment" hidden onchange="pickPhoto(this,'auPh',p=>au.photo=p)">📷 แตะเพื่อถ่ายรูป</label></div></div>
  <div class="modal-foot"><button class="btn btn-outline" onclick="closeModal()">ยกเลิก</button><button class="btn btn-primary" onclick="submitAudit()">บันทึกคะแนน</button></div>`;
  openModal();
}
function setStar(k,n){au.sc[k]=n;[...$('st-'+k).children].forEach((b,i)=>b.classList.toggle('on',i<n))}
async function submitAudit(){if(AUDIT_TOPICS.some(t=>!au.sc[t.k]))return showToast('ให้คะแนนให้ครบ 5 หัวข้อ','error');
  const note=$('auNote').value.trim();
  if(!await commit('audit',{zoneId:au.z.id,sc:au.sc,note,photo:au.photo},()=>DB.audits.push({id:'A'+Date.now(),zoneId:au.z.id,date:today(),by:me.name||'ผู้จัดการศูนย์',sc:au.sc,note,photo:au.photo})))return;
  closeModal();render();showToast('บันทึกคะแนนแล้ว','success')}

/* ================= หน้า: ปัญหา ================= */
let issF='open';
function rIssue(){
  const ids=new Set(DB.zones.filter(z=>zCenter(z)===curW).map(z=>z.id));
  const list=DB.issues.filter(i=>ids.has(i.zoneId)&&(issF==='all'||i.status===issF)).sort((a,b)=>b.time-a.time);
  const nOpen=DB.issues.filter(i=>ids.has(i.zoneId)&&i.status==='open').length;
  $('pg-issue').innerHTML=`
  <h2 class="pg-title">⚠️ แจ้งปัญหา — ${esc(cOf(curW).name)}</h2><div class="pg-sub">ของชำรุด ไฟดับ น้ำรั่ว ขยะตกค้าง — สแกน QR ที่โซนแล้วกด “แจ้งปัญหา” หรือแจ้งจากหน้านี้ · ผู้จัดการกด “แก้แล้ว” เพื่อปิดงาน</div>
  <button class="btn btn-gold btn-block" onclick="openNewIssue()">➕ แจ้งปัญหาใหม่</button>
  <div class="chips" style="margin-top:14px">
    <button class="chip ${issF==='open'?'on':''}" onclick="issF='open';rIssue()">🔴 รอแก้ (${nOpen})</button>
    <button class="chip ${issF==='done'?'on':''}" onclick="issF='done';rIssue()">✅ แก้แล้ว</button>
    <button class="chip ${issF==='all'?'on':''}" onclick="issF='all';rIssue()">ทั้งหมด</button></div>
  <div class="card">${list.map(i=>{const z=DB.zones.find(x=>x.id===i.zoneId)||{icon:'❔',name:'(โซนถูกลบ)',site:''};const age=Math.round((new Date(today())-new Date(i.date))/864e5);
    return `<div class="issue">${i.photo?`<img src="${i.photo}">`:`<div class="zc-ico">${z.icon}</div>`}<div style="flex:1">
    <div style="font-weight:700">${esc(i.text)}</div><div class="zc-meta">${z.icon} ${esc(z.name)} · ${esc(siteOf(z.site).name)} · แจ้งโดย ${esc(i.by)} ${fDate(i.date)}</div>
    ${i.status==='open'?`<span class="badge ${age>=2?'b-late':'b-issue'}">รอแก้ ${age} วัน</span>`:`<span class="badge b-done">แก้แล้ว ${i.fixDate?fDate(i.fixDate):''}</span> <span class="zc-meta">${esc(i.fixNote)}</span>`}
    </div>${i.status==='open'&&role!=='emp'?`<button class="btn btn-ok btn-sm" onclick="fixIssue('${i.id}')">✓ แก้แล้ว</button>`:''}</div>`}).join('')||'<div class="empty">ไม่มีรายการ 🎉</div>'}</div>`;
}
let ni=null;
function openNewIssue(zid){
  const w=zid?zCenter(DB.zones.find(x=>x.id===zid)):curW,scope=DB.zones.filter(z=>zCenter(z)===w);ni={photo:''};
  $('modalBox').innerHTML=`
  <div class="modal-head"><h3>⚠️ แจ้งปัญหา</h3><button class="modal-close" onclick="closeModal()">×</button></div>
  <div class="modal-body">
  <div class="field"><label>โซน</label><select class="input" id="niZone">${scope.map(z=>`<option value="${z.id}" ${z.id===zid?'selected':''}>${z.icon} ${esc(z.name)} · ${esc(siteOf(z.site).name)}</option>`).join('')}</select></div>
  <div class="field"><label>ปัญหาที่พบ</label><textarea class="input" rows="3" id="niText" placeholder="เช่น ไฟส่องสว่างดับ 1 ดวง"></textarea></div>
  <div class="field"><label>รูปถ่าย</label><label class="photo-box" id="niPh"><input type="file" accept="image/*" capture="environment" hidden onchange="pickPhoto(this,'niPh',p=>ni.photo=p)">📷 แตะเพื่อถ่ายรูป</label></div></div>
  <div class="modal-foot"><button class="btn btn-outline" onclick="closeModal()">ยกเลิก</button><button class="btn btn-primary" onclick="submitIssue()">ส่งแจ้งปัญหา</button></div>`;
  openModal();
}
async function submitIssue(){const t=$('niText').value.trim();if(!t)return showToast('กรุณาพิมพ์ปัญหาที่พบ','error');
  const zoneId=$('niZone').value;
  if(!await commit('issue',{zoneId,text:t,photo:ni.photo},()=>DB.issues.push({id:'I'+Date.now(),zoneId,date:today(),time:Date.now(),by:me.name||'ผู้จัดการศูนย์',text:t,photo:ni.photo,status:'open',fixNote:''})))return;
  closeModal();issF='open';render();showToast('แจ้งปัญหาแล้ว — ผู้จัดการศูนย์จะเห็นทันที','success')}
async function fixIssue(id){const n=prompt('แก้ไขอย่างไร? (เช่น เปลี่ยนหลอดไฟแล้ว)','');if(n===null)return;
  if(!await commit('fixIssue',{id,note:n},()=>{const i=DB.issues.find(x=>x.id===id);i.status='done';i.fixNote=n;i.fixDate=today()}))return;render();showToast('ปิดงานแล้ว ✓','success')}

/* ================= หน้า: สรุปผล ================= */
function rDash(){
  const W=role==='hr'?dashW:curW;
  const zs=DB.zones.filter(z=>W==='ALL'||zCenter(z)===W);
  const st=zs.map(zStatus),done=st.filter(s=>s.c).length;
  const ids=new Set(zs.map(z=>z.id)),openI=DB.issues.filter(i=>ids.has(i.zoneId)&&i.status==='open').length;
  const scs=zs.map(z=>({z,...zoneScore(z)})),avg=scs.length?Math.round(scs.reduce((s,x)=>s+x.score,0)/scs.length):0;
  const c30=DB.checks.filter(c=>ids.has(c.zoneId)&&c.date>=daysAgo(30)),scanPct=c30.length?Math.round(c30.filter(x=>x.scan).length/c30.length*100):0;
  const siteRows=DB.sites.filter(s=>W==='ALL'||s.w===W).map(s=>{const bz=DB.zones.filter(z=>z.site===s.id);if(!bz.length)return '';const sc=Math.round(bz.reduce((a,z)=>a+zoneScore(z).score,0)/bz.length);
    const td=bz.filter(z=>todayCheck(z)).length;return `<div class="bar-row"><b>${siteIcon(s)} ${esc(s.name)}<div class="zc-meta">วันนี้ ${td}/${bz.length}</div></b><div class="bar"><i style="width:${sc}%;background:${cOf(s.w).color}"></i></div><b style="text-align:right">${sc}</b></div>`}).join('');
  const people={};scs.forEach(x=>{const o=x.z.owner;if(!o||x.z.rota)return;(people[o]=people[o]||{n:o,s:x.z.site,zones:0,sum:0});people[o].zones++;people[o].sum+=x.score});
  const pl=Object.values(people).map(p=>({...p,avg:Math.round(p.sum/p.zones)})).sort((a,b)=>b.avg-a.avg);
  const chase=zs.filter(z=>['late','pend'].includes(zStatus(z).k)).sort((a,b)=>toMin(a.due)-toMin(b.due));
  $('pg-dash').innerHTML=`
  <h2 class="pg-title">📊 สรุปผลความสะอาด & ความเรียบร้อย</h2><div class="pg-sub">คะแนนโซน = ตรวจครบตามรอบ 50% + คะแนน 5ส 50% (ย้อนหลัง 30 วัน)</div>
  ${role==='hr'?`<div class="chips"><button class="chip ${dashW==='ALL'?'on':''}" onclick="dashW='ALL';rDash()">ทุกศูนย์</button>${CENTERS.map(c=>`<button class="chip ${dashW===c.w?'on':''}" onclick="dashW='${c.w}';rDash()"><span class="dot" style="background:${c.color}"></span>${c.name}</button>`).join('')}</div>`:''}
  <div class="stat-grid">
    <div class="stat-card"><div class="s-label">โซนทั้งหมด</div><div class="s-value">${zs.length}</div><div class="s-sub">ไม่มีคนดูแล ${zs.filter(z=>!ownerToday(z)).length} โซน</div></div>
    <div class="stat-card" style="border-top-color:var(--st-done)"><div class="s-label">ตรวจแล้ววันนี้</div><div class="s-value" style="color:var(--st-done)">${done}/${zs.length}</div><div class="s-sub">เลยเวลา ${st.filter(s=>s.k==='late').length} โซน</div></div>
    <div class="stat-card" style="border-top-color:var(--st-late)"><div class="s-label">ปัญหารอแก้</div><div class="s-value" style="color:var(--st-late)">${openI}</div><div class="s-sub">ดูที่แท็บ แจ้งปัญหา</div></div>
    <div class="stat-card"><div class="s-label">คะแนนเฉลี่ย</div><div class="s-value">${avg}<span style="font-size:15px">/100</span></div><div class="s-sub">📍 สแกนหน้างาน ${scanPct}%</div></div>
  </div>
  <div class="sec-h">⏰ ตามงานวันนี้ (${chase.length}) <button class="btn btn-outline btn-sm" onclick="copyChase('${W}')">📋 คัดลอกไปวางในกลุ่ม LINE</button></div>
  <div class="card">${chase.map(z=>{const s=zStatus(z);return `<div class="mz"><span style="font-size:22px">${z.icon}</span><div class="nm"><b>${esc(z.name)}</b><div class="zc-meta">${esc(siteOf(z.site).name)} · 👤 ${esc(ownerToday(z)||'ไม่มีคนดูแล')}</div></div><span class="badge b-${s.k}">${s.t}</span></div>`}).join('')||'<div class="empty">ตรวจครบทุกโซนแล้ว 🎉</div>'}</div>
  <div class="sec-h">🏢 เทียบรายศูนย์ / สถานที่</div><div class="card card-body">${siteRows}</div>
  <div class="sec-h">🏆 คนดูแลโซนดีเด่น</div>
  <div class="card tbl-wrap"><table class="tbl"><tr><th>#</th><th>ชื่อ</th><th>สถานที่</th><th>จำนวนโซน</th><th>คะแนนเฉลี่ย</th></tr>
  ${pl.slice(0,15).map((p,i)=>`<tr><td>${i<3?['🥇','🥈','🥉'][i]:i+1}</td><td><b>${esc(p.n)}</b></td><td>${esc(siteOf(p.s).name)}</td><td>${p.zones}</td><td><b>${p.avg}</b></td></tr>`).join('')}</table></div>
  <div class="sec-h">📋 รายโซน (เรียงจากต้องดูแลมากสุด)</div>
  <div class="card tbl-wrap"><table class="tbl"><tr><th>โซน</th><th>คนดูแลวันนี้</th><th>วันนี้</th><th>14 วันล่าสุด</th><th>ตรวจครบ</th><th>5ส</th><th>คะแนน</th></tr>
  ${scs.sort((a,b)=>a.score-b.score).map(x=>{const s=zStatus(x.z);return `<tr style="cursor:pointer" onclick="openZone('${x.z.id}')"><td>${x.z.icon} <b>${esc(x.z.name)}</b><div class="zc-meta">${esc(siteOf(x.z.site).name)} · ${esc(x.z.area)}</div></td><td>${esc(ownerToday(x.z)||'-')}</td><td><span class="badge b-${s.k}">${ST_SHORT[s.k]}</span></td><td>${heat(x.z)}</td><td>${x.comp}%</td><td>${x.audit??'-'}</td><td><b style="color:${x.score>=80?'var(--st-done)':x.score>=60?'var(--st-issue)':'var(--st-late)'}">${x.score}</b></td></tr>`}).join('')}</table></div>`;
}
function copyChase(W){
  const zs=DB.zones.filter(z=>(W==='ALL'||zCenter(z)===W)&&['late','pend'].includes(zStatus(z).k));
  const t=`🧹 Rattana Zone · ${W==='ALL'?'ทุกศูนย์':'ศูนย์'+cOf(W).name} ${fDate(today())} ${fTime(Date.now())} น.\nโซนที่ยังไม่ตรวจ ${zs.length} โซน\n`+zs.map(z=>`• ${z.name} (${siteOf(z.site).name}) — ${ownerToday(z)||'ไม่มีคนดูแล'}${zStatus(z).k==='late'?' ⏰ เลยเวลา':''}`).join('\n')+`\nฝากไปสแกน QR ที่หน้าโซนด้วยนะคะ 🙏`;
  navigator.clipboard.writeText(t).then(()=>showToast('คัดลอกแล้ว — ไปวางในกลุ่ม LINE ได้เลย','success'),()=>prompt('คัดลอกข้อความนี้',t));
}

/* ================= MODAL / THEME / INIT ================= */
function openModal(){$('modal').classList.add('open');document.body.style.overflow='hidden'}
function closeModal(){stopCam();$('modal').classList.remove('open');document.body.style.overflow=''}
$('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
function applyTheme(t){document.body.classList.toggle('dark',t==='dark');$('themeBtn').textContent=t==='dark'?'☀️':'🌙'}
function toggleTheme(){const n=document.body.classList.contains('dark')?'light':'dark';localStorage.setItem('rattana_theme',n);applyTheme(n)}
applyTheme(localStorage.getItem('rattana_theme')||'light');
addEventListener('scroll',()=>$('backToTop').classList.toggle('show',scrollY>300));

if(LIVE){
  $('demoBar').style.display='none';
  DB={sites:[],people:[],zones:[],checks:[],audits:[],issues:[]};
  try{const s=JSON.parse(localStorage.getItem(TOK_KEY));if(s&&s.token&&s.user&&s.user.exp>Date.now())session=s}catch{}
  if(session)startLive();else showLogin();
}else{
  load();me=defaultMe();
  if(role==='emp')curW=siteOf(me.site).w;
  curSite=sitesOf(curW)[0]?.id;fixTab();render();
  const qz=(QS.get('zone')||'').toUpperCase();
  if(qz&&DB.zones.find(z=>z.id===qz)){if(role!=='emp'){role='emp';localStorage.setItem('rzone_role','emp');fixTab();render()}setTimeout(()=>openZoneScan(qz,true),300)}
  else if(!localStorage.getItem('rzone_w')&&role!=='emp')openCenterPicker(true);
}
</script>
</body>
</html>
