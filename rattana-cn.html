<style>
:root{
  --navy:#0d1b3e;--navy-mid:#1a2f5e;--navy-light:#243b73;--gold:#c9a84c;--gold-light:#e8c86a;
  --success:#2ecc71;--danger:#e74c3c;--warning:#f39c12;--info:#3498db;
  --bg:#f4f6fb;--text:#0d1b3e;--card-bg:#fff;--border:#dde3f0;--muted:#6b7896;--row-alt:#fafbfd;
  --radius-sm:6px;--radius-md:12px;--radius-lg:16px;
  --shadow-sm:0 1px 4px rgba(0,0,0,.06);--shadow-md:0 2px 8px rgba(0,0,0,.08);--shadow-lg:0 8px 24px rgba(13,27,62,.12);--shadow-gold:0 4px 12px rgba(201,168,76,.35);
  --sel-bg:rgba(201,168,76,.10);--late-bg:linear-gradient(90deg,rgba(231,76,60,.06),transparent 40%);
  --chip-bg:#eef1f8;
}
body.dark{
  --bg:#05080f;--text:#fff;--card-bg:#0d1b3e;--border:#1f3563;--muted:#b8c2dc;--row-alt:#0a1226;
  --sel-bg:transparent;--late-bg:transparent;--chip-bg:#132650;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Sarabun',sans-serif;font-size:14px;line-height:1.5;min-height:100dvh;overflow-x:hidden;background:var(--bg);color:var(--text);transition:background .25s,color .25s}
button{font-family:inherit;cursor:pointer;border:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
input,select,textarea{font-family:inherit;font-size:16px}

/* Header */
header{background:var(--navy);color:#fff;padding:10px 12px;position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:8px;padding-top:max(10px,env(safe-area-inset-top))}
.logo-text{font-weight:700;letter-spacing:1.5px;font-size:18px;color:#fff;white-space:nowrap}
.logo-text span{color:var(--gold)}
.hdr-sp{flex:1}
.icon-btn{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.2);width:38px;height:38px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.icon-btn:hover{background:rgba(255,255,255,.12)}
.user-chip{font-size:12px;color:rgba(255,255,255,.85);max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:560px){.user-chip{display:none}}
@media(max-width:480px){header{gap:6px}.logo-text{font-size:16px;letter-spacing:1px}.icon-btn{width:34px;height:34px;font-size:15px}.hub-btn{padding:5px 7px}.hub-btn-text{display:none}.demo-flag{display:none}}
.hub-btn{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:var(--radius-sm);padding:5px 10px;font-size:13px;font-weight:600;text-decoration:none;white-space:nowrap;min-height:38px}
.hub-btn:hover{background:rgba(255,255,255,.18)}

cy27/Hy03yFaBj+KGAAAAAElFTkSuQmCC");background-size:cover;background-position:center;display:inline-block}

/* Tabs */
.tab-nav{display:flex;background:var(--navy);border-bottom:3px solid var(--gold);padding:0 8px;gap:4px;overflow-x:auto;scrollbar-width:none;position:sticky;top:58px;z-index:99}
.tab-nav::-webkit-scrollbar{display:none}
.tab-btn{background:transparent;color:rgba(255,255,255,.65);padding:11px 16px;font-size:14px;font-weight:600;border-bottom:3px solid transparent;white-space:nowrap;flex-shrink:0;margin-bottom:-3px;border-radius:var(--radius-sm) var(--radius-sm) 0 0}
.tab-btn:hover{color:#fff;background:rgba(255,255,255,.06)}
.tab-btn.active{color:var(--navy);background:var(--gold);font-weight:700}
.tab-count{display:inline-block;min-width:22px;padding:0 6px;margin-left:4px;border-radius:10px;font-size:12px;background:rgba(255,255,255,.18);color:#fff}
.tab-btn.active .tab-count{background:var(--navy);color:var(--gold)}

/* Filter bar */
.filter-bar{background:var(--card-bg);border-bottom:1px solid var(--border);padding:10px 12px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow-sm)}
.search-row{display:flex;gap:8px;max-width:1200px;margin:0 auto;width:100%}
.search{flex:1;height:44px;padding:0 16px;border-radius:22px;border:1.5px solid var(--border);background:var(--bg);color:var(--text);outline:none}
.search:focus{border-color:var(--gold)}
.chip-row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;max-width:1200px;margin:0 auto;width:100%;align-items:center}
.chip-row::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:6px 12px;border-radius:16px;font-size:13px;font-weight:600;background:var(--chip-bg);color:var(--text);border:1.5px solid transparent;min-height:34px}
.chip.on{background:var(--navy);color:#fff;border-color:var(--gold)}
body.dark .chip.on{background:var(--gold);color:var(--navy)}
.chip-sep{width:1px;height:22px;background:var(--border);flex-shrink:0;margin:0 2px}
.sort-sel{flex-shrink:0;height:34px;border-radius:16px;border:1.5px solid var(--border);background:var(--card-bg);color:var(--text);font-size:13px;padding:0 10px;font-weight:600}

/* Layout */
.content{padding:12px;max-width:1200px;margin:0 auto;width:100%;padding-bottom:110px}
@media(min-width:640px){.content{padding:16px;padding-bottom:110px}}

/* Stats */
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
@media(min-width:640px){.stat-grid{grid-template-columns:repeat(4,1fr);gap:14px}}
.stat-card{background:var(--card-bg);border-radius:var(--radius-md);padding:14px;border:1px solid var(--border);border-top:3px solid var(--gold);box-shadow:var(--shadow-sm)}
.stat-card .s-label{font-size:12px;color:var(--muted);font-weight:600;margin-bottom:4px}
.stat-card .s-value{font-size:24px;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums}
.stat-card .s-sub{font-size:12px;color:var(--muted);margin-top:2px}
.stat-card.danger{border-top-color:var(--danger)}.stat-card.danger .s-value{color:var(--danger)}
.stat-card.success{border-top-color:var(--success)}.stat-card.success .s-value{color:var(--success)}
.notice{display:flex;gap:8px;align-items:center;padding:10px 14px;border-radius:var(--radius-md);border:1px dashed var(--border);color:var(--muted);font-size:13px;margin-bottom:12px}

/* List header */
.list-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 2px 8px}
.list-head .ttl{font-size:15px;font-weight:700}
.sel-all{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer;user-select:none}

/* Doc cards */
.doc-list{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:900px){.doc-list{grid-template-columns:repeat(2,1fr)}}
.doc{background:var(--card-bg);border:1px solid var(--border);border-left:4px solid var(--gold);border-radius:var(--radius-md);box-shadow:var(--shadow-sm);display:flex;gap:10px;padding:12px;align-items:flex-start;animation:fadeIn .2s ease;cursor:pointer}
.doc.late{border-left-color:var(--danger);background:var(--late-bg),var(--card-bg)}
.doc.sel{outline:2px solid var(--gold);background:var(--sel-bg),var(--card-bg)}
.doc.done{border-left-color:var(--success)}
.doc.pend{border-left-color:var(--border);opacity:.8}
.cbx{width:24px;height:24px;flex-shrink:0;accent-color:var(--gold);margin-top:2px;cursor:pointer}
.doc-main{flex:1;min-width:0}
.doc-tags{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:4px}
.doc-store{font-size:15px;font-weight:700;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.doc-meta{font-size:12px;color:var(--muted);margin-top:2px;display:flex;flex-wrap:wrap;gap:2px 10px}
.doc-meta b{color:var(--text);font-weight:600}
.code{font-family:'Courier New',monospace;font-weight:600;font-size:12px}
.doc-side{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex-shrink:0}
.doc-amt{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.done-info{font-size:12px;color:var(--success);font-weight:600;margin-top:4px}
body.dark .done-info{color:#7be0a3}

/* Badges */
.badge{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;font-weight:700;white-space:nowrap}
.b-sale{background:#e3f0fd;color:#1a6fb8}
.b-dman{background:#f1e6fb;color:#7a3db8}
.b-wh{background:rgba(201,168,76,.18);color:var(--navy);border:1px solid rgba(201,168,76,.45)}
.b-ok{background:#e8f7ee;color:#1e8449}
.b-warn{background:#fef3d7;color:#a87800}
.b-danger{background:#ffd5d0;color:#c0392b}
.b-mute{background:var(--chip-bg);color:var(--muted)}
body.dark .b-sale{background:#14325a;color:#8cc4ff}
body.dark .b-dman{background:#2e1a4a;color:#d4b0ff}
body.dark .b-wh{color:var(--gold-light)}
body.dark .b-ok{background:#1a3a25;color:#7be0a3}
body.dark .b-warn{background:#3a2e15;color:#e8c86a}
body.dark .b-danger{background:#3a1a17;color:#ff8a7e}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border-radius:var(--radius-sm);font-size:14px;font-weight:700;border:1.5px solid transparent;min-height:44px;transition:opacity .15s,transform .1s;white-space:nowrap}
.btn:hover{opacity:.9}.btn:active{transform:scale(.97)}
.btn-gold{background:var(--gold);color:var(--navy)}
.btn-primary{background:var(--navy);color:#fff}
body.dark .btn-primary{background:var(--navy-light)}
.btn-ok{background:var(--success);color:#fff}
.btn-outline{background:transparent;color:var(--text);border-color:var(--border)}
.btn-sm{padding:6px 12px;font-size:13px;min-height:36px}
.btn-block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}

/* Bulk bar */
.bulk-bar{position:fixed;left:0;right:0;bottom:0;z-index:150;background:var(--navy);color:#fff;border-top:3px solid var(--gold);padding:10px 16px;padding-bottom:max(10px,env(safe-area-inset-bottom));display:none;align-items:center;gap:12px;box-shadow:0 -6px 20px rgba(0,0,0,.2)}
.bulk-bar.show{display:flex;animation:slideUp .2s ease}
.bulk-bar .info{flex:1;font-size:14px}
.bulk-bar .info b{color:var(--gold);font-size:18px}

/* Table */
.card{background:var(--card-bg);border-radius:var(--radius-md);border:1px solid var(--border);box-shadow:var(--shadow-md);border-top:3px solid var(--gold);margin-bottom:14px;overflow:hidden}
.card-head{padding:12px 16px;border-bottom:1px solid var(--border);font-weight:700;font-size:15px;display:flex;justify-content:space-between;align-items:center}
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;min-width:520px}
.tbl thead{background:var(--navy);color:#fff}
.tbl th{padding:9px 10px;text-align:left;font-size:12px;font-weight:600;white-space:nowrap;border-bottom:2px solid var(--gold)}
.tbl td{padding:8px 10px;font-size:13px;border-bottom:1px solid var(--border)}
.tbl tbody tr:nth-child(even){background:var(--row-alt)}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl tfoot td{font-weight:700;border-top:2px solid var(--gold)}
.bar{height:10px;border-radius:5px;background:var(--gold);min-width:2px}
.bar.red{background:var(--danger)}

/* Modal */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(13,27,62,.65);z-index:9000;align-items:center;justify-content:center;padding:12px;backdrop-filter:blur(4px)}
.modal-overlay.open{display:flex}
.modal{background:var(--card-bg);border-radius:var(--radius-lg);max-width:560px;width:100%;max-height:92dvh;overflow-y:auto;border-top:4px solid var(--gold);animation:slideUp .22s ease}
.modal.sm{max-width:440px}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--card-bg);z-index:2}
.modal-head h3{font-size:16px;font-weight:700}
.modal-close{background:transparent;font-size:24px;color:var(--muted);padding:2px 8px;border-radius:var(--radius-sm);line-height:1}
.modal-body{padding:16px 18px}
.modal-foot{padding:12px 18px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;position:sticky;bottom:0;background:var(--card-bg)}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 10px;font-size:13px;margin-bottom:12px}
.kv dt{color:var(--muted)}
.kv dd{font-weight:600;word-break:break-word}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field label{font-size:12px;font-weight:600;color:var(--muted)}
.input{height:44px;padding:0 14px;border-radius:var(--radius-sm);border:1.5px solid var(--border);background:var(--card-bg);color:var(--text);outline:none;width:100%}
.input:focus{border-color:var(--gold)}
textarea.input{height:auto;padding:10px 14px;resize:vertical}
.sum-box{background:var(--bg);border-radius:var(--radius-md);padding:12px 14px;margin-bottom:14px;font-size:13px}
.sum-box .big{font-size:20px;font-weight:700}
.link{color:var(--info);font-weight:600;text-decoration:none}

/* Scan document (OCR) */
.doc-row{display:flex;gap:8px}
.doc-row .input{flex:1;min-width:0;font-family:'Courier New',monospace;font-weight:700;letter-spacing:.5px}
.doc-row .input.flash{animation:flash 1.2s ease}
.scan-btn{flex-shrink:0}
.act-row{display:flex;gap:6px}
.act-row .btn{padding:6px 10px}
.ocr-box{display:flex;gap:10px;margin-top:8px;align-items:flex-start}
.ocr-box:empty{display:none}
.ocr-thumb{width:64px;height:84px;object-fit:cover;border-radius:var(--radius-sm);border:1px solid var(--border);flex-shrink:0;background:var(--bg)}
.ocr-info{flex:1;min-width:0;font-size:13px}
.ocr-status{display:flex;align-items:center;gap:8px;color:var(--muted)}
.mini-ring{width:16px;height:16px;border:3px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;flex-shrink:0}
.cand-row{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.cand{padding:4px 10px;border-radius:14px;font-family:'Courier New',monospace;font-weight:700;font-size:13px;background:var(--chip-bg);color:var(--text);border:1.5px solid transparent;min-height:30px}
.cand.on{border-color:var(--gold);background:rgba(201,168,76,.18)}
.chk-ok{color:#1e8449;font-weight:600}
.chk-warn{color:#a87800;font-weight:600}
body.dark .chk-ok{color:#7be0a3}
body.dark .chk-warn{color:#e8c86a}
.ocr-raw summary{cursor:pointer;color:var(--muted);font-size:12px;margin-top:4px}
.ocr-raw pre{white-space:pre-wrap;font-size:11px;max-height:120px;overflow:auto;background:var(--bg);padding:8px;border-radius:var(--radius-sm);margin-top:4px}
@keyframes flash{0%,100%{background:var(--card-bg)}30%{background:rgba(46,204,113,.25)}}

/* Login */
#loginScreen{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(160deg,var(--navy),#05080f)}
.login-card{background:#fff;border-radius:var(--radius-lg);padding:32px 28px;max-width:380px;width:100%;text-align:center;border-top:4px solid var(--gold);color:var(--navy)}
.login-card h1{font-size:24px;letter-spacing:1.5px;margin-bottom:4px}
.login-card h1 span{color:var(--gold)}
.login-card p{color:#6b7896;margin-bottom:20px;font-size:14px}
.login-err{color:var(--danger);font-size:13px;margin-top:14px;min-height:18px}

/* Misc */
.empty{text-align:center;padding:48px 16px;color:var(--muted)}
.empty .ic{font-size:42px;margin-bottom:8px}
.more-wrap{text-align:center;margin:14px 0}
.toast{position:fixed;bottom:max(90px,calc(80px + env(safe-area-inset-bottom)));right:16px;padding:12px 18px;border-radius:var(--radius-md);color:#fff;z-index:9999;animation:slideIn .3s ease;font-weight:600;box-shadow:var(--shadow-lg);max-width:90vw;font-size:14px}
.toast-success{background:#27ae60}.toast-error{background:var(--danger)}.toast-warning{background:var(--warning);color:var(--navy)}.toast-info{background:var(--navy-mid);border-left:3px solid var(--gold)}
#spinner{display:none;position:fixed;inset:0;background:rgba(13,27,62,.55);align-items:center;justify-content:center;z-index:99999;backdrop-filter:blur(3px)}
.spinner-box{background:var(--card-bg);color:var(--text);border-radius:var(--radius-lg);padding:30px 40px;text-align:center;border-top:4px solid var(--gold);min-width:220px}
.spinner-ring{width:48px;height:48px;border:5px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px}
#loadingBar{position:fixed;top:0;left:0;height:3px;background:var(--gold);width:0;transition:width .4s;z-index:10000}
#backToTop{position:fixed;bottom:max(24px,calc(16px + env(safe-area-inset-bottom)));right:16px;background:var(--gold);color:var(--navy);border-radius:50%;width:46px;height:46px;display:none;align-items:center;justify-content:center;box-shadow:var(--shadow-gold);z-index:90;font-size:18px;font-weight:700}
#backToTop.show{display:flex}
body.has-bulk #backToTop{bottom:90px}
.demo-flag{background:var(--warning);color:var(--navy);font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px}
.hidden{display:none!important}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes slideIn{from{transform:translateX(120%);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div id="loadingBar"></div>
<div id="spinner"><div class="spinner-box"><div class="spinner-ring"></div><p id="spinnerMsg">กำลังโหลด...</p></div></div>

<!-- ───────── Login ───────── -->
<div id="loginScreen" style="display:none">
  <div class="login-card">
    <h1>RATTANA <span>CN</span></h1>

    <div id="g_id_onload" data-client_id="615875645128-gasjjvkt6lu8g449cbnhl40k1pu25r0b.apps.googleusercontent.com" data-callback="handleGoogleLogin" data-auto_prompt="false"></div>

<script>
/* ═══════════════ CONFIG ═══════════════ */
// วาง URL ของ Apps Script Web App ที่ deploy แล้ว (ว่างไว้ = โหมด DEMO ใช้ข้อมูลตัวอย่าง)
const GAS_URL = '';
const LATE_DAYS = 3;         // ค้างเกินกี่วันถือว่า "ช้า"
const PAGE_SIZE = 60;
const AUTO_REFRESH_SEC = 60;
const AUTH_CONFIG = {
  clientId: '615875645128-gasjjvkt6lu8g449cbnhl40k1pu25r0b.apps.googleusercontent.com',
  usersSheetId: '1M6HdISsLN684qRWyQ73CA4AmUzmYtZaOlffDJXZZIXQ',
  usersSheetName: 'Rattana Users for apps',
};
const DEMO = !GAS_URL;

/* ═══════════════ STATE ═══════════════ */
let currentUser = null;
let DOCS = [];          // [{key,src,status,date,wh,store,...,lines:[]}]
let DONE = {};          // key -> {at,docNo,by,email,note}
let TAB = 'todo';
const F = { q: '', wh: 'ALL', src: 'ALL', sort: 'old' };
const SEL = new Set();
let shown = PAGE_SIZE;
let markKeys = [];
let searchTimer = null;

/* ═══════════════ FORMAT ═══════════════ */
function parseDate(s) {
  s = String(s || '').trim(); if (!s) return null;
  let m = s.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})(?:[ T,]+(\d{1,2})[:.](\d{2})(?::(\d{2}))?)?/);
  if (m) return new Date(+m[1], m[2]-1, +m[3], +(m[4]||0), +(m[5]||0), +(m[6]||0));
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})(?:[ ,]+(\d{1,2})[:.](\d{2})(?::(\d{2}))?)?/);
  if (m) { let y = +m[3]; if (y > 2400) y -= 543; return new Date(y, m[2]-1, +m[1], +(m[4]||0), +(m[5]||0), +(m[6]||0)); }
  const d = new Date(s); return isNaN(d) ? null : d;
}
const pad = n => String(n).padStart(2, '0');
function formatThaiDate(x) { const d = x instanceof Date ? x : parseDate(x); return d ? `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()+543}` : '-'; }
function formatThaiTime(x) { const d = x instanceof Date ? x : parseDate(x); return d ? `${pad(d.getHours())}.${pad(d.getMinutes())}` : '-'; }
function formatThaiDateTime(x) { const d = x instanceof Date ? x : parseDate(x); return d ? `${formatThaiDate(d)} ${formatThaiTime(d)}` : '-'; }
const money = n => (Number(n)||0).toLocaleString('th-TH', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ageDays = d => { const t = parseDate(d.approvedAt) || parseDate(d.date); return t ? Math.floor((Date.now() - t) / 864e5) : 0; };
const srcLabel = s => s === 'SALE' ? 'เซลล์' : 'D-Man';
const srcBadge = s => s === 'SALE' ? '<span class="badge b-sale">🧑‍💼 เซลล์</span>' : '<span class="badge b-dman">🚚 D-Man</span>';
const canMark = () => (currentUser?.role || 0) >= 2;
const canUndo = info => info && !info.auto && ((currentUser?.email && info.email === currentUser.email) || (currentUser?.role || 0) >= 5);

/* ═══════════════ UI HELPERS ═══════════════ */
const showSpinner = (m='กำลังโหลด...') => { document.getElementById('spinnerMsg').textContent = m; document.getElementById('spinner').style.display = 'flex'; };
const hideSpinner = () => document.getElementById('spinner').style.display = 'none';
const setLoading = on => document.getElementById('loadingBar').style.width = on ? '85%' : '0';
function showToast(msg, type='info') { const t = document.createElement('div'); t.className = `toast toast-${type}`; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 3500); }
function openModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }

const THEME_KEY = 'rattana_theme';
function applyTheme(t) { document.body.classList.toggle('dark', t === 'dark'); const b = document.getElementById('themeBtn'); if (b) b.textContent = t === 'dark' ? '☀️' : '🌙'; }
function toggleTheme() { const n = document.body.classList.contains('dark') ? 'light' : 'dark'; try { localStorage.setItem(THEME_KEY, n); } catch {} applyTheme(n); }
try { applyTheme(localStorage.getItem(THEME_KEY) || 'light'); } catch { applyTheme('light'); }

window.addEventListener('scroll', () => document.getElementById('backToTop').classList.toggle('show', window.scrollY > 300));

/* ═══════════════ AUTH (SSO with Hub) ═══════════════ */
function decodeJwtPayload(token) {
  const parts = String(token||'').split('.'); if (parts.length < 2) throw new Error('JWT format invalid');
  let b64 = parts[1].replace(/-/g,'+').replace(/_/g,'/'); const p = (4 - b64.length % 4) % 4; if (p) b64 += '='.repeat(p);
  const bin = atob(b64), bytes = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return JSON.parse(new TextDecoder('utf-8').decode(bytes));
}
const normalizeEmail = s => String(s||'').replace(/[​‌‍﻿]/g,'').replace(/\s+/g,'').toLowerCase();
function parseCsv(text) {
  if (!text) return []; if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) { const ch = text[i];
    if (q) { if (ch === '"') { if (text[i+1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch; }
    else if (ch === '"') q = true; else if (ch === ',') { row.push(cell); cell = ''; } else if (ch === '\r') {} else if (ch === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; } else cell += ch; }
  if (cell.length || row.length) { row.push(cell); rows.push(row); }
  if (!rows.length) return [];
  const clean = s => String(s||'').replace(/[​‌‍﻿]/g,'').replace(/ /g,' ').trim();
  const h = rows[0].map(clean);
  return rows.slice(1).filter(r => r.some(c => clean(c))).map(r => Object.fromEntries(h.map((k,i) => [k, clean(r[i])])));
}
async function loadFromSheets(id, name) {
  const res = await fetch(`https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(name)}`);
  if (!res.ok) throw new Error('fetch failed'); return parseCsv(await res.text());
}
function checkRattanaSession() {
  try { const p = JSON.parse(localStorage.getItem('rattana_session') || 'null');
    if (!p?.data?.email || !p.exp || Date.now() > p.exp) return null; return p.data; } catch { return null; }
}
function saveSharedSession(u) {
  const payload = JSON.stringify({ data: u, exp: Date.now() + 30*24*60*60*1000 });
  try { localStorage.setItem('rattana_session', payload); localStorage.setItem('rattanaUser', payload); } catch {}
}
function showLoginError(m) { document.getElementById('loginErr').textContent = m; }
async function handleGoogleLogin(r) {
  showSpinner('กำลังตรวจสอบสิทธิ์...');
  try {
    const p = decodeJwtPayload(r.credential), email = normalizeEmail(p.email);
    const users = await loadFromSheets(AUTH_CONFIG.usersSheetId, AUTH_CONFIG.usersSheetName);
    const u = users.find(x => normalizeEmail(x['E-mail']) === email);
    if (!u) { showLoginError('ไม่พบอีเมลนี้ในระบบ ติดต่อ Admin'); return; }
    if (String(u['Status']||'').trim().toLowerCase() !== 'active') { showLoginError('บัญชีถูกระงับ ติดต่อ Admin'); return; }
    currentUser = { email, name: u['ชื่อ - สกุล'], nickname: u['ชื่อเล่น'], role: parseInt(u['User Role'])||1, dept: u['แผนก'], company: u['บริษัท'], warehouse: u['W'], empId: String(u['รหัสพนักงาน']||''), picture: p.picture || '' };
    saveSharedSession(currentUser);
    enterApp();
  } catch (e) { showLoginError('เกิดข้อผิดพลาด ลองใหม่อีกครั้ง'); }
  finally { hideSpinner(); }
}
function logout() {
  try { localStorage.removeItem('rattana_session'); localStorage.removeItem('rattanaUser'); } catch {}
  location.reload();
}

/* ═══════════════ DATA ═══════════════ */
async function fetchData() {
  if (DEMO) return demoData();
  const res = await fetch(GAS_URL + '?action=list');
  const j = await res.json();
  if (!j.ok) throw new Error(j.error || 'load failed');
  return j;
}
// มีเลข IS ในชีตต้นทาง = ออกเอกสารแล้ว (นับให้อัตโนมัติ ไม่ต้องกด)
const IS_RE = /^IS/i;
function setDone(map) {
  DONE = { ...(map || {}) };
  DOCS.forEach(d => {
    if (!DONE[d.key] && IS_RE.test(String(d.docNo || '').trim()))
      DONE[d.key] = { at: d.approvedAt || d.date, docNo: d.docNo, by: d.approver || '-', email: '', note: '', auto: true };
  });
}
async function loadData(silent) {
  if (!silent) setLoading(true);
  try {
    const j = await fetchData();
    DOCS = j.docs || []; setDone(j.done);
    DOCS.forEach(d => { d._age = ageDays(d); d._search = [d.store, d.storeCode, d.bill, d.key, d.docNo, d.person, d.driver, ...d.lines.map(l => l.name + ' ' + l.bc)].join(' ').toLowerCase(); });
    // ล้าง selection ที่มีคนอื่นทำไปแล้ว
    [...SEL].forEach(k => { if (DONE[k]) SEL.delete(k); });
    buildWhChips(); render();
  } catch (e) {
    if (!silent) showToast('โหลดข้อมูลไม่สำเร็จ: ' + e.message, 'error');
  } finally { setLoading(false); }
}
async function refreshData() {
  const b = document.getElementById('btnRefresh'); b.disabled = true; b.style.transition = 'transform .6s'; b.style.transform = 'rotate(360deg)';
  await loadData();
  b.disabled = false; setTimeout(() => { b.style.transform = ''; b.style.transition = ''; }, 600);
  showToast('อัพเดทเรียบร้อย ✓', 'success');
}
async function postAction(action, items) {
  const user = { name: currentUser?.name || '', email: currentUser?.email || '' };
  if (DEMO) {
    const now = new Date(); const at = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}:00`;
    const conflicts = [];
    items.forEach(it => {
      if (action === 'mark') { if (DEMO_DONE[it.key]) conflicts.push({ key: it.key, by: DEMO_DONE[it.key].by }); else DEMO_DONE[it.key] = { at, docNo: it.docNo, by: user.name, email: user.email, note: it.note, photo: it.photo }; }
      else delete DEMO_DONE[it.key];
    });
    await new Promise(r => setTimeout(r, 400));
    return { ok: true, conflicts, done: { ...DEMO_DONE } };
  }
  const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action, items, user }) });
  return res.json();
}

/* ═══════════════ FILTER ═══════════════ */
function onSearch() { clearTimeout(searchTimer); searchTimer = setTimeout(() => { F.q = document.getElementById('q').value.trim().toLowerCase(); shown = PAGE_SIZE; render(); }, 180); }
function setSrc(s) { F.src = s; shown = PAGE_SIZE; document.querySelectorAll('[data-src]').forEach(b => b.classList.toggle('on', b.dataset.src === s)); render(); }
function setWh(w) { F.wh = w; shown = PAGE_SIZE; document.querySelectorAll('[data-wh]').forEach(b => b.classList.toggle('on', b.dataset.wh === w)); render(); }
function buildWhChips() {
  const whs = [...new Set(DOCS.map(d => d.wh).filter(Boolean))].sort();
  if (F.wh !== 'ALL' && !whs.includes(F.wh)) F.wh = 'ALL';
  const pendingBy = w => DOCS.filter(d => d.status === 'approved' && !DONE[d.key] && (w === 'ALL' || d.wh === w)).length;
  document.getElementById('whChips').innerHTML =
    ['ALL', ...whs].map(w => `<button class="chip ${F.wh===w?'on':''}" data-wh="${esc(w)}" onclick="setWh('${esc(w)}')">${w==='ALL'?'ทุกคลัง':'คลัง '+esc(w)} <small style="opacity:.7">(${pendingBy(w)})</small></button>`).join('');
}
function baseFilter(d) {
  if (F.wh !== 'ALL' && d.wh !== F.wh) return false;
  if (F.src !== 'ALL' && d.src !== F.src) return false;
  if (F.q && !d._search.includes(F.q)) return false;
  return true;
}
function sortDocs(arr, byDone) {
  const t = d => (parseDate(byDone ? DONE[d.key]?.at : (d.approvedAt || d.date)) || 0) - 0;
  const cmp = { old: (a,b) => t(a)-t(b), new: (a,b) => t(b)-t(a), amt: (a,b) => b.amount-a.amount, store: (a,b) => String(a.store).localeCompare(String(b.store), 'th') }[F.sort];
  return arr.sort(byDone && F.sort === 'old' ? (a,b) => t(b)-t(a) : cmp);
}
const todoDocs = () => DOCS.filter(d => d.status === 'approved' && !DONE[d.key]);
const doneDocs = () => DOCS.filter(d => DONE[d.key]);
const waitDocs = () => DOCS.filter(d => d.status === 'pending' && !DONE[d.key]);

/* ═══════════════ RENDER ═══════════════ */
function setTab(t) {
  TAB = t; shown = PAGE_SIZE;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === t));
  if (t !== 'todo') clearSel(true);
  render(); window.scrollTo({ top: 0 });
}
function render() {
  const todo = todoDocs(), done = doneDocs(), wait = waitDocs();
  document.getElementById('cntTodo').textContent = todo.length.toLocaleString();
  document.getElementById('cntDone').textContent = done.length.toLocaleString();
  document.getElementById('cntWait').textContent = wait.length.toLocaleString();
  const c = document.getElementById('content');
  if (TAB === 'sum') { c.innerHTML = renderSummary(); updateBulk(); return; }

  const list = sortDocs((TAB === 'todo' ? todo : TAB === 'done' ? done : wait).filter(baseFilter), TAB === 'done');
  let html = '';
  if (TAB === 'todo') html += renderTodoStats(list, todo);
  if (TAB === 'done') html += renderDoneStats(list);
  if (TAB === 'wait') html += `<div class="notice">⏳ CN ที่ยังไม่ได้อนุมัติ — ยังออกเอกสารไม่ได้ จะย้ายไป "ค้างออก" อัตโนมัติเมื่ออนุมัติแล้ว</div>`;

  const sum = list.reduce((s,d) => s + d.amount, 0);
  html += `<div class="list-head"><span class="ttl">${list.length.toLocaleString()} ใบ · ${money(sum)} บาท</span>`;
  if (TAB === 'todo' && canMark() && list.length) {
    const vis = list.slice(0, shown); const all = vis.length && vis.every(d => SEL.has(d.key));
    html += `<label class="sel-all"><input type="checkbox" class="cbx" ${all?'checked':''} onchange="selAll(this.checked)"> เลือกทั้งหมดที่แสดง</label>`;
  }
  html += `</div>`;

  if (!list.length) {
    html += TAB === 'todo' && !F.q ? `<div class="empty"><div class="ic">🎉</div>ไม่มี CN ค้างออก${F.wh!=='ALL'?' ที่คลัง '+esc(F.wh):''}</div>` : `<div class="empty"><div class="ic">🔍</div>ไม่พบรายการ</div>`;
  } else {
    html += `<div class="doc-list">${list.slice(0, shown).map(d => docCard(d)).join('')}</div>`;
    if (list.length > shown) html += `<div class="more-wrap"><button class="btn btn-outline" onclick="shown+=${PAGE_SIZE};render()">แสดงเพิ่ม (เหลือ ${(list.length-shown).toLocaleString()} ใบ)</button></div>`;
  }
  c.innerHTML = html;
  updateBulk();
}
function renderTodoStats(list, allTodo) {
  const late = list.filter(d => d._age > LATE_DAYS).length;
  const today = new Date().toDateString();
  const doneToday = Object.values(DONE).filter(x => parseDate(x.at)?.toDateString() === today).length;
  const oldest = list.reduce((m,d) => Math.max(m, d._age), 0);
  return `<div class="stat-grid">
    <div class="stat-card"><div class="s-label">📋 ค้างออกเอกสาร</div><div class="s-value">${list.length.toLocaleString()}</div><div class="s-sub">ใบ (ทั้งหมด ${allTodo.length.toLocaleString()})</div></div>
    <div class="stat-card"><div class="s-label">💰 ยอดเงินค้าง</div><div class="s-value">${money(list.reduce((s,d)=>s+d.amount,0))}</div><div class="s-sub">บาท</div></div>
    <div class="stat-card danger"><div class="s-label">⚠️ ค้างเกิน ${LATE_DAYS} วัน</div><div class="s-value">${late.toLocaleString()}</div><div class="s-sub">เก่าสุด ${oldest} วัน</div></div>
    <div class="stat-card success"><div class="s-label">✅ ออกแล้ววันนี้</div><div class="s-value">${doneToday.toLocaleString()}</div><div class="s-sub">ใบ (ทุกคน)</div></div>
  </div>`;
}
function renderDoneStats(list) {
  const mine = list.filter(d => DONE[d.key].email === currentUser?.email).length;
  const today = new Date().toDateString();
  const t = list.filter(d => parseDate(DONE[d.key].at)?.toDateString() === today).length;
  return `<div class="stat-grid">
    <div class="stat-card success"><div class="s-label">✅ ออกแล้ว</div><div class="s-value">${list.length.toLocaleString()}</div><div class="s-sub">ใบ</div></div>
    <div class="stat-card"><div class="s-label">📅 วันนี้</div><div class="s-value">${t}</div><div class="s-sub">ใบ</div></div>
    <div class="stat-card"><div class="s-label">🙋 ฉันทำ</div><div class="s-value">${mine}</div><div class="s-sub">ใบ</div></div>
    <div class="stat-card"><div class="s-label">💰 ยอดเงิน</div><div class="s-value">${money(list.reduce((s,d)=>s+d.amount,0))}</div><div class="s-sub">บาท</div></div>
  </div>`;
}
function docCard(d) {
  const info = DONE[d.key];
  const late = !info && d.status === 'approved' && d._age > LATE_DAYS;
  const ageBadge = info ? '' : d.status === 'pending' ? '<span class="badge b-mute">รออนุมัติ</span>'
    : `<span class="badge ${late ? 'b-danger' : d._age >= 2 ? 'b-warn' : 'b-ok'}">${d._age <= 0 ? 'วันนี้' : 'ค้าง ' + d._age + ' วัน'}</span>`;
  const cls = ['doc', info ? 'done' : '', late ? 'late' : '', d.status === 'pending' && !info ? 'pend' : '', SEL.has(d.key) ? 'sel' : ''].join(' ');
  const who = d.src === 'SALE' ? `เซลล์ <b>${esc(d.person)}</b>` : `คนขับ <b>${esc(d.driver)}</b>`;
  const cb = TAB === 'todo' && canMark() ? `<input type="checkbox" class="cbx" ${SEL.has(d.key)?'checked':''} onclick="event.stopPropagation();toggleSel('${esc(d.key)}',this.checked)">` : '';
  let side = `<div class="doc-amt">${money(d.amount)} ฿</div>`;
  if (TAB === 'todo' && canMark()) side += `<div class="act-row"><button class="btn btn-primary btn-sm" title="ถ่ายรูปเลข IS" onclick="event.stopPropagation();quickScan('${esc(d.key)}')">📷</button><button class="btn btn-gold btn-sm" onclick="event.stopPropagation();openMark(['${esc(d.key)}'])">✓ ออกแล้ว</button></div>`;
  if (TAB === 'done' && canUndo(info)) side += `<button class="btn btn-outline btn-sm" onclick="event.stopPropagation();undoMark('${esc(d.key)}')">↶ ยกเลิก</button>`;
  return `<div class="${cls}" onclick="openDetail('${esc(d.key)}')">
    ${cb}
    <div class="doc-main">
      <div class="doc-tags">${srcBadge(d.src)}<span class="badge b-wh">${esc(d.wh||'-')}</span>${ageBadge}</div>
      <div class="doc-store" title="${esc(d.store)}">${esc(d.store)}</div>
      <div class="doc-meta">
        <span class="code">${esc(d.storeCode)}</span>
        ${d.bill ? `<span>บิล <span class="code">${esc(d.bill)}</span></span>` : ''}
        <span>${d.lines.length} รายการ</span>
      </div>
      <div class="doc-meta"><span>${who}</span>${d.approver ? `<span>อนุมัติ <b>${esc(d.approver)}</b> ${formatThaiDate(d.approvedAt)}</span>` : `<span>สร้าง ${formatThaiDate(d.date)}</span>`}</div>
      ${info?.auto ? `<div class="done-info">✓ มีเลข IS แล้ว · ${esc(info.docNo)}</div>` : info ? `<div class="done-info">✓ ${esc(info.by)} · ${formatThaiDateTime(info.at)}${info.docNo ? ' · ' + esc(info.docNo) : ''}${info.photo ? ' · 📷' : ''}</div>` : ''}
    </div>
    <div class="doc-side">${side}</div>
  </div>`;
}

/* ═══════════════ SUMMARY ═══════════════ */
function renderSummary() {
  const docs = DOCS.filter(d => (F.src === 'ALL' || d.src === F.src) && (F.wh === 'ALL' || d.wh === F.wh));
  const whs = [...new Set(docs.map(d => d.wh || '-'))].sort();
  const rows = whs.map(w => {
    const ds = docs.filter(d => (d.wh || '-') === w);
    const todo = ds.filter(d => d.status === 'approved' && !DONE[d.key]);
    return { w, todo: todo.length, amt: todo.reduce((s,d)=>s+d.amount,0), late: todo.filter(d => d._age > LATE_DAYS).length, done: ds.filter(d => DONE[d.key]).length, wait: ds.filter(d => d.status === 'pending' && !DONE[d.key]).length };
  });
  const tot = rows.reduce((t,r) => ({ todo: t.todo+r.todo, amt: t.amt+r.amt, late: t.late+r.late, done: t.done+r.done, wait: t.wait+r.wait }), { todo:0, amt:0, late:0, done:0, wait:0 });

  const todo = docs.filter(d => d.status === 'approved' && !DONE[d.key]);
  const buckets = [['วันนี้–1 วัน', d => d._age <= 1], ['2–3 วัน', d => d._age >= 2 && d._age <= 3], ['4–7 วัน', d => d._age >= 4 && d._age <= 7], ['8–14 วัน', d => d._age >= 8 && d._age <= 14], ['เกิน 14 วัน', d => d._age > 14]]
    .map(([l, f]) => { const x = todo.filter(f); return { l, n: x.length, amt: x.reduce((s,d)=>s+d.amount,0) }; });
  const maxB = Math.max(1, ...buckets.map(b => b.n));

  const now = Date.now(), wk = now - 7*864e5, today = new Date().toDateString();
  const who = {};
  docs.forEach(d => { const i = DONE[d.key]; if (!i) return; const k = i.auto ? '🔄 มีเลข IS ในชีตอยู่แล้ว' : (i.by || i.email || '-'); const t = parseDate(i.at);
    who[k] = who[k] || { n: 0, wk: 0, today: 0 }; who[k].n++; if (t && t >= wk) who[k].wk++; if (t && t.toDateString() === today) who[k].today++; });
  const whoRows = Object.entries(who).sort((a,b) => b[1].wk - a[1].wk || b[1].n - a[1].n);

  return `
  <div class="card"><div class="card-head">🏭 สรุปตามคลัง <span class="badge b-mute">${F.src==='ALL'?'ทุกแหล่ง':srcLabel(F.src)}</span></div>
    <div class="tbl-wrap"><table class="tbl"><thead><tr><th>คลัง</th><th class="num">ค้างออก</th><th class="num">ยอดค้าง (บาท)</th><th class="num">เกิน ${LATE_DAYS} วัน</th><th class="num">ออกแล้ว</th><th class="num">รออนุมัติ</th></tr></thead>
    <tbody>${rows.map(r => `<tr><td><b>${esc(r.w)}</b></td><td class="num"><b>${r.todo}</b></td><td class="num">${money(r.amt)}</td><td class="num" style="color:${r.late?'var(--danger)':''}">${r.late}</td><td class="num">${r.done}</td><td class="num">${r.wait}</td></tr>`).join('')}</tbody>
    <tfoot><tr><td>รวม</td><td class="num">${tot.todo}</td><td class="num">${money(tot.amt)}</td><td class="num">${tot.late}</td><td class="num">${tot.done}</td><td class="num">${tot.wait}</td></tr></tfoot></table></div></div>

  <div class="card"><div class="card-head">⏱️ อายุ CN ที่ค้างออก</div>
    <div class="tbl-wrap"><table class="tbl" style="min-width:420px"><thead><tr><th>ค้างมาแล้ว</th><th class="num">ใบ</th><th style="width:40%"></th><th class="num">ยอด (บาท)</th></tr></thead>
    <tbody>${buckets.map((b,i) => `<tr><td>${b.l}</td><td class="num"><b>${b.n}</b></td><td><div class="bar ${i>=2?'red':''}" style="width:${b.n/maxB*100}%"></div></td><td class="num">${money(b.amt)}</td></tr>`).join('')}</tbody></table></div></div>

  <div class="card"><div class="card-head">🙋 ผู้ออกเอกสาร</div>
    <div class="tbl-wrap"><table class="tbl" style="min-width:380px"><thead><tr><th>ชื่อ</th><th class="num">วันนี้</th><th class="num">7 วัน</th><th class="num">ทั้งหมด</th></tr></thead>
    <tbody>${whoRows.length ? whoRows.map(([k,v]) => `<tr><td>${esc(k)}</td><td class="num">${v.today}</td><td class="num">${v.wk}</td><td class="num"><b>${v.n}</b></td></tr>`).join('') : '<tr><td colspan="4" class="empty" style="padding:24px">ยังไม่มีการบันทึก</td></tr>'}</tbody></table></div></div>`;
}

/* ═══════════════ SELECTION ═══════════════ */
function toggleSel(k, on) { on ? SEL.add(k) : SEL.delete(k); render(); }
function selAll(on) { const vis = sortDocs(todoDocs().filter(baseFilter)).slice(0, shown); vis.forEach(d => on ? SEL.add(d.key) : SEL.delete(d.key)); render(); }
function clearSel(silent) { SEL.clear(); if (!silent) render(); else updateBulk(); }
function updateBulk() {
  const on = TAB === 'todo' && SEL.size > 0;
  document.getElementById('bulkBar').classList.toggle('show', on);
  document.body.classList.toggle('has-bulk', on);
  if (!on) return;
  const amt = DOCS.filter(d => SEL.has(d.key)).reduce((s,d)=>s+d.amount,0);
  document.getElementById('bulkN').textContent = SEL.size;
  document.getElementById('bulkAmt').textContent = money(amt);
}

/* ═══════════════ MARK / UNDO ═══════════════ */
function openMark(keys) {
  if (!canMark()) { showToast('สิทธิ์ของคุณดูได้อย่างเดียว', 'warning'); return; }
  markKeys = keys.filter(k => !DONE[k]);
  if (!markKeys.length) return;
  OCR = { busy: false, photo: '', seq: OCR.seq + 1 };
  document.getElementById('markConfirm').disabled = false;
  const ds = DOCS.filter(d => markKeys.includes(d.key));
  const amt = ds.reduce((s,d)=>s+d.amount,0);
  const single = ds.length === 1 ? ds[0] : null;
  let h = `<div class="sum-box">`;
  if (single) h += `<div>${srcBadge(single.src)} <span class="badge b-wh">${esc(single.wh)}</span></div><div class="big" style="font-size:16px;margin-top:4px">${esc(single.store)}</div><div class="txt-muted" style="color:var(--muted)">CN <span class="code">${esc(single.key)}</span>${single.bill ? ' · บิล <span class="code">'+esc(single.bill)+'</span>' : ''}</div><div style="margin-top:6px">${single.lines.length} รายการ · <b>${money(amt)} บาท</b></div>`;
  else h += `<div class="big">${ds.length} ใบ</div><div>ยอดรวม <b>${money(amt)} บาท</b></div><div style="color:var(--muted);margin-top:4px;max-height:120px;overflow:auto">${ds.map(d => '• ' + esc(d.store) + ' — ' + money(d.amount)).join('<br>')}</div>`;
  h += `</div>`;
  if (!single) h += `<div class="notice" style="margin-bottom:12px">📷 ถ้าต้องการถ่ายรูปเลข IS ให้กดปุ่ม 📷 บนการ์ดทีละใบ</div>`;
  if (single) h += `<div class="field"><label>เลขที่ IS (ใน BPlus)</label>
    <div class="doc-row">
      <input class="input" id="mkDoc" value="${esc(single.docNo||'')}" placeholder="พิมพ์ หรือกด 📷" autocomplete="off" autocapitalize="characters">
      <button type="button" class="btn btn-primary scan-btn" onclick="document.getElementById('mkFile').click()">📷 ถ่ายรูป</button>
    </div>
    <input type="file" id="mkFile" accept="image/*" hidden onchange="onDocPhoto(this)">
    <div class="ocr-box" id="ocrBox"></div></div>`;
  h += `<div class="field"><label>หมายเหตุ (ถ้ามี)</label><textarea class="input" id="mkNote" rows="2" placeholder="เช่น ออกรวมกับใบอื่น / ปรับจำนวน"></textarea></div>`;
  h += `<div style="font-size:12px;color:var(--muted)">บันทึกโดย <b>${esc(currentUser?.name || '-')}</b> · ${formatThaiDateTime(new Date())}</div>`;
  document.getElementById('markBody').innerHTML = h;
  closeModal('detailModal'); openModal('markModal');
  setTimeout(() => document.getElementById('mkDoc')?.focus(), 150);
}
/* ── ถ่ายรูปเอกสาร → OCR → เติมเลขที่ ── */
let OCR = { busy: false, photo: '', seq: 0 };
// รูปแบบเลขเอกสาร เช่น ISS6910/012, ISK6908/017  (บิลต้นทาง DS/DC/TS/CV ใช้ไว้ตรวจว่าถ่ายถูกใบ)
const DOC_RE = /\b([A-Z]{2,5}[A-Z0-9]{0,3}\d{3,})\s*[\/|]\s*(\d{2,6})\b/g;
const REF_PREFIX = /^(DS|DC|TS|CV)/;
const squash = s => String(s || '').toUpperCase().replace(/\s+/g, '');
function extractDocNos(text) {
  const t = String(text || '').toUpperCase().replace(/(\d)O(?=\d)/g, '$10').replace(/(\d)O(?=\d)/g, '$10');
  const found = [];
  for (const m of t.matchAll(DOC_RE)) { const v = m[1] + '/' + m[2]; if (!found.includes(v)) found.push(v); }
  const docs = found.filter(v => !REF_PREFIX.test(v));
  docs.sort((a, b) => (/^(IS|CN|SR)/.test(b) ? 1 : 0) - (/^(IS|CN|SR)/.test(a) ? 1 : 0));
  return docs;
}
async function resizeImage(file, max = 2000, q = .85) {
  const url = URL.createObjectURL(file);
  try {
    const img = new Image();
    await new Promise((res, rej) => { img.onload = res; img.onerror = () => rej(new Error('อ่านไฟล์รูปไม่ได้')); img.src = url; });
    const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', q);
  } finally { URL.revokeObjectURL(url); }
}
async function postOcr(dataUrl, d) {
  if (DEMO) {
    await new Promise(r => setTimeout(r, 1500));
    const no = 'ISS6910/' + String(100 + Math.floor(Math.random() * 899));
    return { ok: true, photo: '', text: `บริษัท รัตนไพบูลย์\nใบลดหนี้ / ใบรับคืนสินค้า\nเลขที่ ${no}\nอ้างอิงบิล ${d.bill}\n${d.store} ${d.storeCode}` };
  }
  const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'ocr', key: d.key, image: dataUrl.split(',')[1], user: { name: currentUser?.name || '', email: currentUser?.email || '' } }) });
  return res.json();
}
// ปุ่ม 📷 บนการ์ด: เปิดกล้องทันที → เปิดหน้ายืนยันพร้อมอ่านเลข IS
let quickKey = null;
function quickScan(key) { quickKey = key; document.getElementById('quickFile').click(); }
function onQuickPhoto(inp) {
  const file = inp.files?.[0]; inp.value = '';
  if (!file || !quickKey) return;
  openMark([quickKey]); quickKey = null;
  handleDocFile(file);
}
function onDocPhoto(inp) {
  const file = inp.files?.[0]; inp.value = '';
  if (file) handleDocFile(file);
}
async function handleDocFile(file) {
  const d = DOCS.find(x => x.key === markKeys[0]); if (!d) return;
  const box = document.getElementById('ocrBox'), btn = document.getElementById('markConfirm');
  const seq = ++OCR.seq; OCR.busy = true; OCR.photo = ''; btn.disabled = true;
  try {
    const dataUrl = await resizeImage(file);
    box.innerHTML = `<img class="ocr-thumb" src="${dataUrl}" alt=""><div class="ocr-info"><div class="ocr-status"><span class="mini-ring"></span>กำลังอ่านเลขที่เอกสาร...</div></div>`;
    const j = await postOcr(dataUrl, d);
    if (seq !== OCR.seq) return;                       // ถ่ายใหม่ / ปิดหน้าต่างไปแล้ว
    if (!j.ok) throw new Error(j.error || 'OCR ไม่สำเร็จ');
    OCR.photo = j.photo || '';
    const cands = extractDocNos(j.text);
    const docInp = document.getElementById('mkDoc');
    if (cands.length) { docInp.value = cands[0]; docInp.classList.remove('flash'); void docInp.offsetWidth; docInp.classList.add('flash'); }
    const txt = squash(j.text);
    const chk = d.bill ? (txt.includes(squash(d.bill)) ? `<div class="chk-ok">✓ ตรงกับบิล ${esc(d.bill)}</div>` : txt.includes(squash(d.storeCode)) ? `<div class="chk-ok">✓ ตรงกับรหัสร้าน ${esc(d.storeCode)}</div>` : `<div class="chk-warn">⚠️ ไม่เห็นเลขบิล ${esc(d.bill)} ในรูป — ตรวจว่าถ่ายถูกใบ</div>`) : '';
    box.querySelector('.ocr-info').innerHTML =
      (cands.length ? `<div>อ่านได้ ${cands.length > 1 ? '— แตะเพื่อเลือก' : ''}</div><div class="cand-row">${cands.map((c, i) => `<button type="button" class="cand ${i === 0 ? 'on' : ''}" onclick="pickCand(this)">${esc(c)}</button>`).join('')}</div>`
        : `<div class="chk-warn">อ่านเลขที่เอกสารไม่เจอ — พิมพ์เองได้ หรือถ่ายใหม่ให้ชัดขึ้น</div>`) +
      chk +
      (OCR.photo ? `<div style="margin-top:4px"><a class="link" href="${esc(OCR.photo)}" target="_blank" rel="noopener">📷 เก็บรูปแล้ว</a></div>` : '') +
      `<details class="ocr-raw"><summary>ข้อความที่อ่านได้</summary><pre>${esc(j.text || '(ว่าง)')}</pre></details>`;
  } catch (e) {
    if (seq !== OCR.seq) return;
    const info = box.querySelector('.ocr-info');
    if (info) info.innerHTML = `<div class="chk-warn">อ่านรูปไม่สำเร็จ: ${esc(e.message)}<br>พิมพ์เลขที่เองได้เลย</div>`;
    else showToast('อ่านรูปไม่สำเร็จ: ' + e.message, 'error');
  } finally {
    if (seq === OCR.seq) { OCR.busy = false; btn.disabled = false; }
  }
}
function pickCand(b) {
  document.getElementById('mkDoc').value = b.textContent;
  b.parentElement.querySelectorAll('.cand').forEach(x => x.classList.toggle('on', x === b));
}

async function confirmMark() {
  if (OCR.busy) return;
  const docInp = document.getElementById('mkDoc');
  const docNo = docInp ? docInp.value.trim().toUpperCase() : '';
  if (docInp && !IS_RE.test(docNo) && !confirm(docNo
      ? `เลข "${docNo}" ไม่ได้ขึ้นต้นด้วย IS\nบันทึกต่อไหม?`
      : 'ยังไม่ได้ใส่เลข IS\nบันทึกว่าออกแล้วโดยไม่มีเลขที่เอกสารไหม?')) { docInp.focus(); return; }
  const btn = document.getElementById('markConfirm'); btn.disabled = true;
  const note = document.getElementById('mkNote').value.trim();
  const items = DOCS.filter(d => markKeys.includes(d.key)).map(d => ({ key: d.key, src: d.src, docNo: markKeys.length === 1 ? docNo : (d.docNo || ''), note, wh: d.wh, store: d.store, amount: d.amount, photo: markKeys.length === 1 ? OCR.photo : '' }));
  // optimistic
  const prev = { ...DONE }; const at = new Date();
  items.forEach(it => DONE[it.key] = { at: `${at.getFullYear()}-${pad(at.getMonth()+1)}-${pad(at.getDate())} ${pad(at.getHours())}:${pad(at.getMinutes())}:00`, docNo: it.docNo, by: currentUser?.name, email: currentUser?.email, note, photo: it.photo });
  items.forEach(it => SEL.delete(it.key));
  closeModal('markModal'); buildWhChips(); render();
  try {
    const j = await postAction('mark', items);
    if (!j.ok) throw new Error(j.error);
    if (j.done) setDone(j.done);
    if (j.conflicts?.length) showToast(`${j.conflicts.length} ใบ มีคนบันทึกไปก่อนแล้ว (${j.conflicts.map(c => c.by).join(', ')})`, 'warning');
    else showToast(`บันทึกแล้ว ${items.length} ใบ ✓`, 'success');
  } catch (e) {
    DONE = prev; showToast('บันทึกไม่สำเร็จ: ' + e.message, 'error');
  } finally { btn.disabled = false; buildWhChips(); render(); }
}
async function undoMark(key) {
  const d = DOCS.find(x => x.key === key);
  if (!confirm(`ยกเลิกสถานะ "ออกแล้ว" ของ\n${d?.store || key}\n\nใบนี้จะกลับไปอยู่ใน "ค้างออก"`)) return;
  const prev = { ...DONE }; delete DONE[key]; closeModal('detailModal'); buildWhChips(); render();
  try {
    const j = await postAction('unmark', [{ key, src: d?.src, wh: d?.wh, store: d?.store, amount: d?.amount }]);
    if (!j.ok) throw new Error(j.error);
    if (j.done) setDone(j.done); showToast('ย้ายกลับไป "ค้างออก" แล้ว', 'info');
  } catch (e) { DONE = prev; showToast('ไม่สำเร็จ: ' + e.message, 'error'); }
  finally { buildWhChips(); render(); }
}

/* ═══════════════ DETAIL ═══════════════ */
function openDetail(key) {
  const d = DOCS.find(x => x.key === key); if (!d) return;
  const info = DONE[key];
  document.getElementById('detailTitle').innerHTML = `${srcBadge(d.src)} CN <span class="code">${esc(d.key)}</span>`;
  let h = `<dl class="kv">
    <dt>ร้าน</dt><dd>${esc(d.store)} <span class="code" style="color:var(--muted)">${esc(d.storeCode)}</span></dd>
    <dt>คลัง</dt><dd>${esc(d.wh)}${d.whSale && d.whSale !== d.wh ? ` <span style="color:var(--muted);font-weight:400">(เซลล์สังกัด ${esc(d.whSale)})</span>` : ''}</dd>
    ${d.bill ? `<dt>เลขที่บิล</dt><dd class="code">${esc(d.bill)} ${d.billType ? '<span style="color:var(--muted);font-weight:400">'+esc(d.billType)+'</span>' : ''}</dd>` : ''}
    ${d.returnType ? `<dt>ประเภทคืน</dt><dd>${esc(d.returnType)}</dd>` : ''}
    ${d.src === 'SALE' ? `<dt>เซลล์</dt><dd>${esc(d.person)} <span style="color:var(--muted);font-weight:400">${esc(d.personCode||'')}</span></dd>` : `<dt>คนขับ</dt><dd>${esc(d.driver)}</dd><dt>เซลล์</dt><dd>${esc(d.person||'-')}</dd>`}
    ${d.collector ? `<dt>ผู้เก็บของคืน</dt><dd>${esc(d.collector)}</dd>` : ''}
    ${d.errorFrom ? `<dt>ผิดพลาดจาก</dt><dd>${esc(d.errorFrom)}</dd>` : ''}
    <dt>วันที่สร้าง</dt><dd>${formatThaiDateTime(d.date)}</dd>
    <dt>อนุมัติ</dt><dd>${d.approver ? esc(d.approver) + ' · ' + formatThaiDateTime(d.approvedAt) : '<span class="badge b-mute">รออนุมัติ</span>'}</dd>
    ${d.docNo ? `<dt>เลขเอกสาร (D-Man)</dt><dd class="code">${esc(d.docNo)}</dd>` : ''}
    ${d.note ? `<dt>หมายเหตุ</dt><dd>${esc(d.note)}</dd>` : ''}
    ${d.photo || d.photoCN ? `<dt>รูป</dt><dd>${d.photo ? `<a class="link" href="${esc(d.photo)}" target="_blank" rel="noopener">📷 ภาพคืน</a>` : ''} ${d.photoCN ? `&nbsp;<a class="link" href="${esc(d.photoCN)}" target="_blank" rel="noopener">📄 ภาพอนุมัติ CN</a>` : ''}</dd>` : ''}
  </dl>`;
  if (info?.auto) h += `<div class="sum-box" style="border-left:4px solid var(--success)"><b style="color:var(--success)">✓ ออกเอกสารแล้ว</b><br>พบเลข IS ในชีตต้นทาง: <span class="code">${esc(info.docNo)}</span></div>`;
  else if (info) h += `<div class="sum-box" style="border-left:4px solid var(--success)"><b style="color:var(--success)">✓ ออกเอกสารแล้ว</b><br>โดย ${esc(info.by)} · ${formatThaiDateTime(info.at)}${info.docNo ? '<br>เลขที่ <span class="code">' + esc(info.docNo) + '</span>' : ''}${info.note ? '<br>หมายเหตุ: ' + esc(info.note) : ''}${info.photo ? `<br><a class="link" href="${esc(info.photo)}" target="_blank" rel="noopener">📷 ภาพเอกสาร</a>` : ''}</div>`;
  h += `<div class="tbl-wrap" style="border:1px solid var(--border);border-radius:var(--radius-md)"><table class="tbl" style="min-width:480px"><thead><tr><th>#</th><th>สินค้า</th><th class="num">จำนวน</th><th class="num">ราคา</th><th class="num">รวม</th></tr></thead><tbody>
    ${d.lines.map((l,i) => `<tr><td>${i+1}</td><td>${esc(l.name)}<div class="code" style="color:var(--muted);font-weight:400">${esc(l.bc)}</div>${l.reason ? `<div style="font-size:12px;color:var(--muted)">${esc(l.reason)}${l.exp ? ' · หมดอายุ ' + formatThaiDate(l.exp) : ''}</div>` : ''}</td><td class="num">${money(l.qty)} <span style="color:var(--muted);font-size:12px">${esc(l.unit)}</span></td><td class="num">${money(l.price)}</td><td class="num"><b>${money(l.amt)}</b></td></tr>`).join('')}
    </tbody><tfoot><tr><td colspan="4">รวม</td><td class="num">${money(d.amount)}</td></tr></tfoot></table></div>`;
  document.getElementById('detailBody').innerHTML = h;
  let f = `<button class="btn btn-outline" onclick="closeModal('detailModal')">ปิด</button>`;
  if (!info && d.status === 'approved' && canMark()) f += `<button class="btn btn-gold" onclick="openMark(['${esc(d.key)}'])">✓ ออกเอกสารแล้ว</button>`;
  if (info && canUndo(info)) f += `<button class="btn btn-outline" onclick="undoMark('${esc(d.key)}')">↶ ยกเลิกสถานะ</button>`;
  document.getElementById('detailFoot').innerHTML = f;
  openModal('detailModal');
}

/* ═══════════════ EXPORT ═══════════════ */
function exportExcel() {
  const list = TAB === 'sum' ? todoDocs().filter(baseFilter) : sortDocs((TAB === 'todo' ? todoDocs() : TAB === 'done' ? doneDocs() : waitDocs()).filter(baseFilter), TAB === 'done');
  const rows = [];
  list.forEach(d => { const i = DONE[d.key] || {}; d.lines.forEach((l, n) => rows.push({
    'ที่มา': srcLabel(d.src), 'คลัง': d.wh, 'CN': d.key, 'ค้าง(วัน)': i.at ? '' : d._age, 'วันที่สร้าง': formatThaiDateTime(d.date), 'ผู้อนุมัติ': d.approver, 'วันอนุมัติ': formatThaiDateTime(d.approvedAt),
    'รหัสร้าน': String(d.storeCode||''), 'ชื่อร้าน': d.store, 'เลขที่บิล': d.bill, 'เซลล์': d.person, 'คนขับ': d.driver || '',
    'ลำดับ': n+1, 'บาร์โค้ด': String(l.bc||''), 'สินค้า': l.name, 'จำนวน': l.qty, 'หน่วย': l.unit, 'ราคา': l.price, 'รวม': l.amt, 'สาเหตุ': l.reason,
    'ยอดทั้งใบ': n === 0 ? d.amount : '', 'สถานะ': i.at ? 'ออกแล้ว' : d.status === 'pending' ? 'รออนุมัติ' : 'ค้างออก', 'ผู้ออกเอกสาร': i.by || '', 'เวลาออก': i.at ? formatThaiDateTime(i.at) : '', 'เลขที่เอกสาร': i.docNo || d.docNo || '',
  })); });
  if (!rows.length) { showToast('ไม่มีข้อมูลให้ export', 'warning'); return; }
  const ws = XLSX.utils.json_to_sheet(rows), wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'CN');
  const d = new Date(); XLSX.writeFile(wb, `Rattana CN ${({todo:'ค้างออก',done:'ออกแล้ว',wait:'รออนุมัติ',sum:'ค้างออก'})[TAB]} ${d.getFullYear()+543}${pad(d.getMonth()+1)}${pad(d.getDate())}.xlsx`);
}

/* ═══════════════ DEMO DATA ═══════════════ */
let DEMO_DONE = {};
function demoData() {
  if (demoData.cache) return { docs: demoData.cache, done: { ...DEMO_DONE } };
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647; const pick = a => a[Math.floor(rnd() * a.length)];
  const stores = ['ร้าน ทวีทรัพย์', 'ร้านป้าน้อย (ยี่สาร)', 'ร้าน สมศักดิ์พานิช', 'เจ๊มอน (สามพราน)', 'ลุงตู่(ท่าฉลอม)', 'ร้าน พรพรรณ', 'ว.วัชรพล', 'ร้านเจ้อ๊อด(คอกกระบือ)', 'มินิมาร์ท ศรีสุข', 'ร้านป้ายิน(วัดประดู่)', 'บ.เจริญการค้า', 'ร้านยายแดง(บางแพ)'];
  const sales = ['สุกรี ส.', 'นพดล พ.', 'ปวริศ ท.', 'วรพันธ์ พ.', 'ศิริพร ว.'];
  const drivers = ['ณัฐพล อ. (ณัฐ)', 'สมพงษ์ ฉ. (ตี๋)', 'ชยันต์ ย. (จ้า)', 'ออมสิน ป. (ออม)'];
  const prods = [['มิตรผล น้ำตาลทรายขาว 1กก.', 'แพ็คx25(CS)', 655], ['ดีโด้ ลิ้นจี่ 200มล.', 'ลังx48(CS)', 182], ['มาม่าเย็นตาโฟ 60ก.', 'แพ็คx30(PA)', 172], ['คาร์เนชั่นนมข้น 388ก.', 'ชิ้นx1(EA)', 24], ['ทีพอทเอ็กซ์ตร้า 1ลิตร', 'ชิ้นx1(EA)', 49], ['นิสชิน รสไก่เผ็ด 60ก.', 'แพ็คx30(PA)', 266], ['อายิโนะโมะโต๊ะ 420ก.', 'แพ็คx12(PA)', 729]];
  const reasons = ['รับออเดอร์ผิด/ลูกค้าสั่งผิด', 'สินค้าหมดอายุ', 'สินค้าชำรุด(จากคลัง)', 'ขนส่งขึ้นสินค้าผิด'];
  const docs = [], now = Date.now();
  const fmt = t => { const d = new Date(t); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:00`; };
  for (let i = 0; i < 64; i++) {
    const src = rnd() < 0.45 ? 'SALE' : 'DMAN';
    const created = now - rnd() * 16 * 864e5, appr = created + rnd() * 1.5 * 864e5;
    const st = rnd() < 0.1 ? 'pending' : 'approved';
    const lines = Array.from({ length: 1 + Math.floor(rnd() * 3) }, () => { const p = pick(prods), q = 1 + Math.floor(rnd() * 5); return { bc: '885' + Math.floor(rnd() * 1e10), name: p[0], qty: q, unit: p[1], price: p[2], amt: q * p[2], reason: pick(reasons), exp: '' }; });
    const wh = pick(['W1', 'W1', 'W1', 'W3', 'W4', 'W4']);
    docs.push({ key: src === 'SALE' ? 'CN' + Math.floor(1e9 + rnd() * 9e9) : 'CNT' + Math.floor(1e12 + rnd() * 9e12), src, status: st, date: fmt(created), wh,
      store: pick(stores), storeCode: '7' + Math.floor(1e8 + rnd() * 9e8), bill: (rnd() < .5 ? 'DSI1' : 'DC54') + '6910/00' + Math.floor(100 + rnd() * 899),
      person: pick(sales), driver: src === 'DMAN' ? pick(drivers) : '', approver: st === 'approved' ? 'คลัง ' + wh : '', approvedAt: st === 'approved' ? fmt(Math.min(appr, now)) : '',
      docNo: st === 'approved' && rnd() < (src === 'DMAN' ? .6 : .15) ? 'ISS6910/' + Math.floor(100 + rnd() * 899) : '', returnType: src === 'DMAN' ? pick(['คืนบางส่วน', 'ขนส่งเก็บ']) : '',
      amount: lines.reduce((s, l) => s + l.amt, 0), lines });
  }
  docs.filter(d => d.status === 'approved' && rnd() < 0.35).forEach(d => { DEMO_DONE[d.key] = { at: fmt(Math.min(parseDate(d.approvedAt).getTime() + rnd() * 2 * 864e5, now)), docNo: d.docNo || 'ISS6910/' + Math.floor(100 + rnd() * 899), by: pick(['เกตุมณี ย.', 'นัทธกร ธ.', 'ชยพล พ.']), email: 'demo@x', note: '' }; });
  demoData.cache = docs;
  return { docs, done: { ...DEMO_DONE } };
}

  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('appScreen').style.display = 'block';
  document.getElementById('userChip').textContent = currentUser?.name || '-';
  document.getElementById('demoFlag').classList.toggle('hidden', !DEMO);

}

  const s = checkRattanaSession();

  document.getElementById('loginScreen').style.display = 'flex';
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') document.querySelectorAll('.modal-overlay.open').forEach(m => m.classList.remove('open')); });
