:root {
  --navy:        #0d1b3e;
  --navy-mid:    #1a2f5e;
  --navy-light:  #243b73;
  --gold:        #c9a84c;
  --gold-light:  #e8c86a;
  --success:  #2ecc71;
  --danger:   #e74c3c;
  --warning:  #f39c12;
  --info:     #3498db;
  --bg:       #f4f6fb;
  --text:     #0d1b3e;
  --card-bg:  #ffffff;
  --border:   #dde3f0;
  --muted:    #6b7896;
  --row-alt:  #fafbfd;
  --space-xs:  4px;
  --space-sm:  8px;
  --space-md:  16px;
  --space-lg:  24px;
  --space-xl:  32px;
  --radius-sm:  6px;
  --radius-md:  12px;
  --radius-lg:  16px;
  --radius-xl:  20px;
  --shadow-sm:  0 1px 4px rgba(0,0,0,.06);
  --shadow-md:  0 2px 8px rgba(0,0,0,.08);
  --shadow-lg:  0 8px 24px rgba(13,27,62,.12);
  --shadow-gold: 0 4px 12px rgba(201,168,76,.35);
  --drop-bg: rgba(201,168,76,.06);
}
body.dark {
  --bg:       #05080f;
  --text:     #ffffff;
  --card-bg:  #0d1b3e;
  --border:   #1f3563;
  --muted:    #b8c2dc;
  --row-alt:  #0a1226;
  --drop-bg: rgba(201,168,76,.08);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Sarabun',sans-serif;min-height:100dvh;overflow-x:hidden;-webkit-overflow-scrolling:touch;scroll-behavior:smooth;background:var(--bg);color:var(--text);transition:background .25s,color .25s;padding-bottom:86px}
button{font-family:inherit;cursor:pointer;border:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
input,select,textarea{font-family:inherit;font-size:16px}

header{background:var(--navy);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:10px;border-bottom:3px solid var(--gold);padding-top:max(12px,env(safe-area-inset-top))}
.logo-text{font-weight:700;letter-spacing:1px;font-size:17px;color:#fff;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.logo-text span{color:var(--gold)}
.icon-btn{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.2);width:38px;height:38px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-size:18px;transition:background .15s;flex-shrink:0}
.icon-btn:hover{background:rgba(255,255,255,.12)}
.spacer{flex:1}

.hub-btn{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:var(--radius-sm);padding:5px 10px;font-size:13px;font-weight:600;text-decoration:none;cursor:pointer;transition:background .15s;white-space:nowrap;min-height:38px}
.hub-btn:hover{background:rgba(255,255,255,.18)}

.hub-btn-text{letter-spacing:.5px}

.content{padding:12px;max-width:820px;margin:0 auto;width:100%}
@media(min-width:640px){.content{padding:16px}}

.card{background:var(--card-bg);border-radius:var(--radius-md);border:1px solid var(--border);box-shadow:var(--shadow-md);margin-bottom:14px}
.card-gold{border-top:3px solid var(--gold)}
.card-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border);background:linear-gradient(to right,rgba(201,168,76,.07),transparent)}
.card-head h3{font-size:15px;font-weight:700}
.card-body{padding:16px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;border:1px solid transparent;min-height:44px;transition:opacity .15s,transform .1s;-webkit-tap-highlight-color:transparent}
.btn:hover{opacity:.88}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn-gold{background:var(--gold);color:var(--navy);border-color:var(--gold)}
.btn-gold:hover{background:var(--gold-light)}
.btn-outline{background:transparent;color:var(--text);border-color:var(--border)}
.btn-danger{background:var(--danger);color:#fff}
.btn-sm{padding:5px 10px;font-size:12px;min-height:34px}
.btn-lg{padding:14px 24px;font-size:15px;min-height:52px;border-radius:var(--radius-md)}
.btn-block{width:100%}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}

.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;white-space:nowrap}
.badge-gold{background:rgba(201,168,76,.18);color:var(--gold-light);border:1px solid rgba(201,168,76,.4)}
body:not(.dark) .badge-gold{color:var(--navy)}

.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.3px;text-transform:uppercase}
.input{height:44px;padding:0 14px;border-radius:var(--radius-sm);border:1.5px solid var(--border);background:var(--card-bg);color:var(--text);font-size:16px;font-family:inherit;outline:none;width:100%;transition:border-color .15s}
.input:focus{border-color:var(--gold)}
.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(min-width:640px){.field-grid{grid-template-columns:repeat(4,1fr)}}

.mode-group{display:flex;gap:8px;flex-wrap:wrap}
.mode-btn{padding:10px 12px;border-radius:var(--radius-sm);border:1.5px solid var(--border);background:var(--card-bg);color:var(--text);font-size:13px;font-weight:600;min-height:40px;flex:1;min-width:100px}
.mode-btn.active{background:var(--gold);color:var(--navy);border-color:var(--gold)}
.range-row{margin-top:14px}
.range-row label{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.3px;text-transform:uppercase;display:flex;justify-content:space-between}
.range-input{width:100%;height:34px;-webkit-appearance:none;appearance:none;background:transparent;cursor:pointer;display:block}
.range-input::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:var(--border)}
.range-input::-moz-range-track{height:6px;border-radius:3px;background:var(--border)}
.range-input::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:22px;height:22px;border-radius:50%;background:var(--gold);border:2px solid var(--navy);margin-top:-8px;box-shadow:var(--shadow-sm)}
.range-input::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--gold);border:2px solid var(--navy);box-shadow:var(--shadow-sm)}

.dropzone{border:2px dashed var(--border);border-radius:var(--radius-md);padding:28px 16px;text-align:center;background:var(--drop-bg);transition:border-color .15s,background .15s;cursor:pointer}
.dropzone.drag{border-color:var(--gold);background:rgba(201,168,76,.16)}
.dropzone .dz-icon{font-size:34px;margin-bottom:8px}
.dropzone .dz-text{color:var(--muted);font-size:13px;margin-bottom:14px}
.dz-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

.empty-state{padding:36px 16px;text-align:center;color:var(--muted);font-size:14px}

.thumb-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:560px){.thumb-grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:900px){.thumb-grid{grid-template-columns:repeat(4,1fr)}}
.thumb-card{border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden;background:var(--row-alt);position:relative}
.thumb-img-wrap{position:relative;width:100%;aspect-ratio:3/4;background:#000}
.thumb-img-wrap img{width:100%;height:100%;object-fit:contain;background:#111}
.thumb-order{position:absolute;top:6px;left:6px;background:var(--navy);color:#fff;border:1px solid var(--gold);border-radius:50%;width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.thumb-name{font-size:11px;color:var(--muted);padding:6px 8px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thumb-actions{display:flex;gap:4px;padding:6px 8px 8px;flex-wrap:wrap}
.thumb-actions button{flex:1;min-width:32px;height:32px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--card-bg);color:var(--text);font-size:14px;display:flex;align-items:center;justify-content:center}
.thumb-actions button:hover{background:var(--navy-light);color:#fff}
.thumb-actions button.danger:hover{background:var(--danger);color:#fff;border-color:var(--danger)}

.bottom-bar{position:fixed;left:0;right:0;bottom:0;background:var(--card-bg);border-top:1px solid var(--border);padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;z-index:80;box-shadow:0 -4px 16px rgba(0,0,0,.1)}
.bottom-bar .btn-gold{flex:2}
.bottom-bar .btn-outline{flex:1}

#backToTop{position:fixed;bottom:max(90px,calc(82px + env(safe-area-inset-bottom)));right:max(16px,calc(12px + env(safe-area-inset-right)));background:var(--gold);color:var(--navy);border:none;border-radius:50%;width:46px;height:46px;display:none;align-items:center;justify-content:center;box-shadow:var(--shadow-gold);z-index:90;font-size:18px;font-weight:700;cursor:pointer}
#backToTop.show{display:flex}

.toast{position:fixed;bottom:max(96px,env(safe-area-inset-bottom));right:16px;padding:12px 20px;border-radius:var(--radius-md);color:#fff;z-index:9999;animation:slideIn .3s ease;font-weight:500;box-shadow:var(--shadow-lg);max-width:90vw;font-size:13px}
.toast-success{background:var(--success)}
.toast-error{background:var(--danger)}
.toast-warning{background:var(--warning);color:var(--navy)}
.toast-info{background:var(--navy-mid);border-left:3px solid var(--gold)}

.spinner-overlay{display:none;position:fixed;inset:0;background:rgba(13,27,62,.55);align-items:center;justify-content:center;z-index:99999;backdrop-filter:blur(3px)}
.spinner-overlay.show{display:flex}
.spinner-box{background:#fff;border-radius:var(--radius-lg);padding:32px 40px;text-align:center;border-top:4px solid var(--gold);min-width:220px}
.spinner-ring{width:48px;height:48px;border:5px solid #dde3f0;border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px}
body.dark .spinner-box{background:var(--card-bg)}

.modal-overlay{display:none;position:fixed;inset:0;background:rgba(13,27,62,.65);z-index:9000;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(4px)}
.modal-overlay.open{display:flex}
.modal{background:var(--card-bg);border-radius:var(--radius-lg);max-width:400px;width:100%;border-top:4px solid var(--gold);animation:slideUp .22s ease}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border)}
.modal-head h3{font-size:16px;font-weight:700}
.modal-close{background:transparent;border:none;font-size:24px;color:var(--muted);cursor:pointer;padding:4px 8px;border-radius:var(--radius-sm);line-height:1}
.modal-close:hover{color:var(--text);background:rgba(0,0,0,.06)}
.modal-body{padding:20px}
.modal-actions{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.modal-foot{padding:12px 20px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end}

#cropStage{position:relative;width:100%;touch-action:none;background:#000;border-radius:var(--radius-sm);overflow:hidden}
#cropStage img{width:100%;height:100%;display:block}
#cropSvg{position:absolute;inset:0;width:100%;height:100%}
.crop-handle{cursor:grab;touch-action:none}
.crop-handle:active{cursor:grabbing}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes slideIn{from{transform:translateX(120%);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}

.txt-muted{color:var(--muted)}
.txt-sm{font-size:12px}
.flex-between{display:flex;align-items:center;justify-content:space-between;gap:8px}
.hidden{display:none}
footer{text-align:center;padding:16px;color:var(--muted);font-size:11px}
</style>
</head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const THEME_KEY = 'rattana_theme';
function applyTheme(t){ document.body.classList.toggle('dark', t==='dark'); const b=document.getElementById('themeBtn'); if(b) b.textContent = t==='dark' ? '☀️' : '🌙'; }
function toggleTheme(){ const next = document.body.classList.contains('dark') ? 'light':'dark'; localStorage.setItem(THEME_KEY,next); applyTheme(next); }
applyTheme(localStorage.getItem(THEME_KEY) || 'light');

window.addEventListener('scroll', () => {
  document.getElementById('backToTop').classList.toggle('show', window.scrollY > 300);
});

const showSpinner = (m='กำลังโหลด...') => { document.getElementById('spinnerMsg').textContent=m; document.getElementById('spinner').classList.add('show'); };
const hideSpinner = () => document.getElementById('spinner').classList.remove('show');
function showToast(msg, type='info'){
  const t=document.createElement('div'); t.className=`toast toast-${type}`; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(),3500);
}

const MAX_DIM = 1800;
let images = [];
let lastPdf = null;

function fmtBytes(n){
  if (n < 1024) return n + ' B';
  if (n < 1024*1024) return (n/1024).toFixed(1) + ' KB';
  return (n/1024/1024).toFixed(2) + ' MB';
}

function isIOS(){
  return /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
}

function openResultModal(){
  document.getElementById('resultSummary').textContent =
    `${lastPdf.filename} · ${lastPdf.pages} หน้า · ${fmtBytes(lastPdf.blob.size)}`;
  let canShare = false;
  try { canShare = !!(navigator.canShare && navigator.canShare({ files: [lastPdf.file] })); } catch {}
  document.getElementById('shareBtn').classList.toggle('hidden', !canShare);
  const hint = document.getElementById('shareHint');
  if (canShare && isIOS()) {
    hint.textContent = 'ไม่เห็น LINE ในรายการ? กด "ดูเพิ่มเติม" ท้ายแถวไอคอน แล้วเปิดสวิตช์ LINE — ทำครั้งเดียว ครั้งต่อไปขึ้นเลย';
    hint.classList.remove('hidden');
  } else {
    hint.classList.add('hidden');
  }
  document.getElementById('resultModal').classList.add('open');
}
function closeResultModal(){ document.getElementById('resultModal').classList.remove('open'); }

function saveLastPdf(){
  if (!lastPdf) return;
  const url = URL.createObjectURL(lastPdf.blob);
  const a = document.createElement('a');
  a.href = url; a.download = lastPdf.filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  showToast('บันทึกไฟล์แล้ว ✓', 'success');
}

async function shareLastPdf(){
  if (!lastPdf) return;
  try {
    // files only, no title/text — some share targets (LINE included) post title/text as a
    // separate chat message before the file, which is not what "share the file" should do
    await navigator.share({ files: [lastPdf.file] });
  } catch (e) {
    if (e.name !== 'AbortError') showToast('แชร์ไม่สำเร็จ ลองบันทึกลงเครื่องแทน', 'error');
  }
}

function loadImageFromFile(file){
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => { resolve(img); URL.revokeObjectURL(url); };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('load failed')); };
    img.src = url;
  });
}

function loadImageFromDataUrl(dataUrl){
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = dataUrl;
  });
}

// createImageBitmap({imageOrientation:'from-image'}) applies EXIF rotation from phone photos;
// without it, canvas drawImage ignores EXIF and portrait photos can come out sideways.
async function decodeFileToEntry(file){
  let bitmap = null, w, h, drawSource;
  if (window.createImageBitmap) {
    try { bitmap = await createImageBitmap(file, { imageOrientation: 'from-image' }); }
    catch { try { bitmap = await createImageBitmap(file); } catch {} }
  }
  if (bitmap) { w = bitmap.width; h = bitmap.height; drawSource = bitmap; }
  else {
    const img = await loadImageFromFile(file);
    w = img.naturalWidth; h = img.naturalHeight; drawSource = img;
  }
  const scale = Math.min(1, MAX_DIM / Math.max(w, h));
  const cw = Math.max(1, Math.round(w * scale)), ch = Math.max(1, Math.round(h * scale));
  const canvas = document.createElement('canvas');
  canvas.width = cw; canvas.height = ch;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0,0,cw,ch); // flatten transparent PNGs to white before JPEG encode
  ctx.drawImage(drawSource, 0, 0, cw, ch);
  if (bitmap && bitmap.close) bitmap.close();
  // near-lossless: this becomes the working master that rotate/crop re-derive from each time,
  // so keep it high-quality here and do the one real size/quality trade-off later, at export
  return { dataUrl: canvas.toDataURL('image/jpeg', 0.95), width: cw, height: ch };
}

function newId(){ return 'img_' + Date.now() + '_' + Math.random().toString(36).slice(2,9); }

const docFilter = { mode: 'original', shadow: false, brightness: 0, contrast: 0, sharpen: 0 };
let filterDebounceTimer = null;
let filtersBusy = false;

function isFilterDefault(f){
  return f.mode === 'original' && !f.shadow && f.brightness === 0 && f.contrast === 0 && f.sharpen === 0;
}

// Histogram-based contrast stretch: makes the paper background truly white and ink truly dark,
// adapting per-photo instead of relying on one fixed slider value.
function autoLevels(data){
  const hist = new Uint32Array(256);
  for (let i = 0; i < data.length; i += 4) {
    hist[(data[i]*0.299 + data[i+1]*0.587 + data[i+2]*0.114) | 0]++;
  }
  const total = data.length / 4;
  const clip = total * 0.008;
  let lo = 0, acc = 0;
  for (; lo < 255; lo++) { acc += hist[lo]; if (acc >= clip) break; }
  let hi = 255; acc = 0;
  for (; hi > 0; hi--) { acc += hist[hi]; if (acc >= clip) break; }
  if (hi - lo < 20) return;
  const scale = 255 / (hi - lo);
  for (let i = 0; i < data.length; i += 4) {
    data[i]   = (data[i]   - lo) * scale;
    data[i+1] = (data[i+1] - lo) * scale;
    data[i+2] = (data[i+2] - lo) * scale;
  }
}

// Shadow/uneven-lighting removal: a heavily downscaled-then-upscaled copy approximates the
// page's local lighting; dividing the original by it flattens gradients while keeping text sharp
// (text is high-frequency detail that the blur step washes out, so it survives the divide).
function applyDeshadow(ctx, canvas, w, h){
  const sw = Math.max(6, Math.round(w/25)), sh = Math.max(6, Math.round(h/25));
  const small = document.createElement('canvas');
  small.width = sw; small.height = sh;
  small.getContext('2d').drawImage(canvas, 0, 0, sw, sh);
  const illum = document.createElement('canvas');
  illum.width = w; illum.height = h;
  const ictx = illum.getContext('2d');
  ictx.drawImage(small, 0, 0, w, h);

  const src = ctx.getImageData(0, 0, w, h);
  const bg = ictx.getImageData(0, 0, w, h);
  const sd = src.data, bd = bg.data;
  for (let i = 0; i < sd.length; i += 4) {
    sd[i]   = sd[i]   / Math.max(bd[i],   30) * 235;
    sd[i+1] = sd[i+1] / Math.max(bd[i+1], 30) * 235;
    sd[i+2] = sd[i+2] / Math.max(bd[i+2], 30) * 235;
  }
  ctx.putImageData(src, 0, 0);
}

function applySharpen(ctx, canvas, w, h, amount){
  const blurCanvas = document.createElement('canvas');
  blurCanvas.width = w; blurCanvas.height = h;
  const bctx = blurCanvas.getContext('2d');
  bctx.filter = 'blur(2px)';
  bctx.drawImage(canvas, 0, 0);
  const sharp = ctx.getImageData(0, 0, w, h);
  const blurred = bctx.getImageData(0, 0, w, h);
  const sd = sharp.data, bd = blurred.data;
  for (let i = 0; i < sd.length; i += 4) {
    sd[i]   += (sd[i]   - bd[i])   * amount;
    sd[i+1] += (sd[i+1] - bd[i+1]) * amount;
    sd[i+2] += (sd[i+2] - bd[i+2]) * amount;
  }
  ctx.putImageData(sharp, 0, 0);
}

function dist(p1, p2){ return Math.hypot(p1[0]-p2[0], p1[1]-p2[1]); }

function sampleBilinear(data, sw, sh, x, y){
  x = Math.max(0, Math.min(sw - 1.001, x));
  y = Math.max(0, Math.min(sh - 1.001, y));
  const x0 = Math.floor(x), y0 = Math.floor(y), x1 = x0+1, y1 = y0+1;
  const fx = x - x0, fy = y - y0;
  const i00 = (y0*sw+x0)*4, i10 = (y0*sw+x1)*4, i01 = (y1*sw+x0)*4, i11 = (y1*sw+x1)*4;
  const out = [0,0,0,0];
  for (let c = 0; c < 4; c++) {
    const top = data[i00+c]*(1-fx) + data[i10+c]*fx;
    const bot = data[i01+c]*(1-fx) + data[i11+c]*fx;
    out[c] = top*(1-fy) + bot*fy;
  }
  return out;
}

// Classic square-to-quad projective mapping (Heckbert): warps an arbitrary 4-point
// quad (photographed at an angle) back to a flat rectangle, as if scanned straight-on.
function warpQuadToRect(srcCanvas, quad, outW, outH){
  const sw = srcCanvas.width, sh = srcCanvas.height;
  const srcData = srcCanvas.getContext('2d').getImageData(0, 0, sw, sh).data;
  const [[x0,y0],[x1,y1],[x2,y2],[x3,y3]] = quad;

  const dx1 = x1-x2, dx2 = x3-x2, dx3 = x0-x1+x2-x3;
  const dy1 = y1-y2, dy2 = y3-y2, dy3 = y0-y1+y2-y3;
  let a,b,c,d,e,f,g,h;
  if (Math.abs(dx3) < 1e-9 && Math.abs(dy3) < 1e-9) {
    a=x1-x0; b=x2-x1; c=x0; d=y1-y0; e=y2-y1; f=y0; g=0; h=0;
  } else {
    const denom = dx1*dy2 - dx2*dy1;
    g = (dx3*dy2 - dx2*dy3) / denom;
    h = (dx1*dy3 - dx3*dy1) / denom;
    a = x1-x0+g*x1; b = x3-x0+h*x3; c = x0;
    d = y1-y0+g*y1; e = y3-y0+h*y3; f = y0;
  }

  const outCanvas = document.createElement('canvas');
  outCanvas.width = outW; outCanvas.height = outH;
  const octx = outCanvas.getContext('2d');
  const outImg = octx.createImageData(outW, outH);
  const outData = outImg.data;
  for (let dy = 0; dy < outH; dy++) {
    const v = dy / outH;
    for (let dx = 0; dx < outW; dx++) {
      const u = dx / outW;
      const denom2 = g*u + h*v + 1;
      const X = (a*u + b*v + c) / denom2;
      const Y = (d*u + e*v + f) / denom2;
      const px = sampleBilinear(srcData, sw, sh, X, Y);
      const oi = (dy*outW+dx)*4;
      outData[oi]=px[0]; outData[oi+1]=px[1]; outData[oi+2]=px[2]; outData[oi+3]=255;
    }
  }
  octx.putImageData(outImg, 0, 0);

  // hard white edge clamp: even a slightly loose detected quad can leave a thin sliver of
  // desk/background at the very border after warping — force it to paper-white so the page
  // background always comes out clean
  const fringe = Math.max(2, Math.round(Math.min(outW, outH) * 0.012));
  octx.fillStyle = '#ffffff';
  octx.fillRect(0, 0, outW, fringe);
  octx.fillRect(0, outH-fringe, outW, fringe);
  octx.fillRect(0, 0, fringe, outH);
  octx.fillRect(outW-fringe, 0, fringe, outH);

  return outCanvas;
}

// Shrinks a quad inward toward its own centroid — a small safety margin so an
// auto-detected boundary that's a touch too generous doesn't carry background into the crop.
function insetQuad(quad, ratio){
  const cx = (quad[0][0]+quad[1][0]+quad[2][0]+quad[3][0])/4;
  const cy = (quad[0][1]+quad[1][1]+quad[2][1]+quad[3][1])/4;
  return quad.map(([x,y]) => [x + (cx-x)*ratio, y + (cy-y)*ratio]);
}

// Lightweight auto-crop guess: assumes the document contrasts with the surface it's on
// (the common "paper on a desk" case). Samples a border ring as the background estimate,
// classifies pixels that differ from it as "document", then takes the 4 extreme corners
// of that region. Falls back to the full frame when the result looks unreliable.
function detectDocumentQuad(canvas){
  const w = canvas.width, h = canvas.height;
  const fullFrame = [[0,0],[w,0],[w,h],[0,h]];
  const scale = Math.min(1, 300 / Math.max(w, h));
  const sw = Math.max(8, Math.round(w*scale)), sh = Math.max(8, Math.round(h*scale));
  const small = document.createElement('canvas');
  small.width = sw; small.height = sh;
  small.getContext('2d').drawImage(canvas, 0, 0, sw, sh);
  const data = small.getContext('2d').getImageData(0, 0, sw, sh).data;
  const gray = new Float32Array(sw*sh);
  for (let i = 0, p = 0; i < data.length; i += 4, p++) gray[p] = 0.299*data[i]+0.587*data[i+1]+0.114*data[i+2];

  const border = [];
  for (let x = 0; x < sw; x++) { border.push(gray[x], gray[(sh-1)*sw+x]); }
  for (let y = 0; y < sh; y++) { border.push(gray[y*sw], gray[y*sw+sw-1]); }
  border.sort((a,b) => a-b);
  const bg = border[Math.floor(border.length/2)];

  let minSum=Infinity, maxSum=-Infinity, minDiff=Infinity, maxDiff=-Infinity, fgCount=0;
  let tl=[0,0], tr=[sw-1,0], br=[sw-1,sh-1], bl=[0,sh-1];
  const threshold = 28;
  for (let y = 0; y < sh; y++) {
    for (let x = 0; x < sw; x++) {
      if (Math.abs(gray[y*sw+x] - bg) > threshold) {
        fgCount++;
        const s = x+y, dd = x-y;
        if (s < minSum) { minSum=s; tl=[x,y]; }
        if (s > maxSum) { maxSum=s; br=[x,y]; }
        if (dd > maxDiff) { maxDiff=dd; tr=[x,y]; }
        if (dd < minDiff) { minDiff=dd; bl=[x,y]; }
      }
    }
  }
  const area = fgCount / (sw*sh);
  if (area < 0.15 || area > 0.97) return fullFrame;
  const inv = 1/scale;
  const quad = [tl,tr,br,bl].map(([x,y]) => [x*inv, y*inv]);
  return insetQuad(quad, 0.02);
}

async function applyDocFilter(baseDataUrl, w, h, f){
  const img = await loadImageFromDataUrl(baseDataUrl);
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(img, 0, 0, w, h);

  if (!isFilterDefault(f)) {
    if (f.shadow) applyDeshadow(ctx, canvas, w, h);

    const grayscale = f.mode === 'gray' || f.mode === 'bw';
    const imageData = ctx.getImageData(0, 0, w, h);
    const data = imageData.data;
    if (f.mode !== 'original') autoLevels(data);

    const extraContrast = f.mode === 'bw' ? 55 : (f.mode === 'original' ? 0 : 20);
    const c = Math.max(-254, Math.min(254, f.contrast + extraContrast));
    const factor = (259 * (c + 255)) / (255 * (259 - c));
    const b = f.brightness;
    for (let i = 0; i < data.length; i += 4) {
      let r = data[i], g = data[i+1], bl = data[i+2];
      if (grayscale) { const gray = 0.299*r + 0.587*g + 0.114*bl; r = g = bl = gray; }
      data[i]   = factor*(r-128)+128+b;
      data[i+1] = factor*(g-128)+128+b;
      data[i+2] = factor*(bl-128)+128+b;
    }
    ctx.putImageData(imageData, 0, 0);

    if (f.sharpen > 0) applySharpen(ctx, canvas, w, h, f.sharpen/100);
  }

  // single delivery-quality encode point in the whole pipeline (rotate/crop keep a near-lossless
  // master instead), so this is the only place image quality is actually traded for file size
  return canvas.toDataURL('image/jpeg', 0.8);
}

async function reprocessAllImages(){
  if (!images.length) return;
  filtersBusy = true;
  const status = document.getElementById('filterStatus');
  for (let i = 0; i < images.length; i++) {
    status.textContent = `กำลังปรับภาพ ${i+1}/${images.length}...`;
    const item = images[i];
    item.dataUrl = await applyDocFilter(item.baseDataUrl, item.width, item.height, docFilter);
  }
  status.textContent = '';
  filtersBusy = false;
  renderList();
}

function scheduleReprocess(immediate){
  clearTimeout(filterDebounceTimer);
  filterDebounceTimer = setTimeout(reprocessAllImages, immediate ? 0 : 450);
}

function updateShadowToggleUI(){
  const btn = document.getElementById('shadowToggle');
  btn.textContent = `🔦 ลบเงา / ปรับแสงสม่ำเสมอ: ${docFilter.shadow ? 'เปิด' : 'ปิด'}`;
  btn.classList.toggle('btn-gold', docFilter.shadow);
  btn.classList.toggle('btn-outline', !docFilter.shadow);
}

function setMode(mode){
  docFilter.mode = mode;
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
  if (mode !== 'original') {
    docFilter.shadow = true;
    if (docFilter.sharpen === 0) { docFilter.sharpen = 65; document.getElementById('sharpenSlider').value = 65; document.getElementById('sharpenVal').textContent = '65'; }
    updateShadowToggleUI();
  }
  scheduleReprocess(true);
}

function toggleShadow(){
  docFilter.shadow = !docFilter.shadow;
  updateShadowToggleUI();
  scheduleReprocess(true);
}

function resetDocFilter(){
  docFilter.mode = 'original'; docFilter.shadow = false; docFilter.brightness = 0; docFilter.contrast = 0; docFilter.sharpen = 0;
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.toggle('active', b.dataset.mode === 'original'));
  document.getElementById('brightSlider').value = 0; document.getElementById('brightVal').textContent = '0';
  document.getElementById('contrastSlider').value = 0; document.getElementById('contrastVal').textContent = '0';
  document.getElementById('sharpenSlider').value = 0; document.getElementById('sharpenVal').textContent = '0';
  updateShadowToggleUI();
  scheduleReprocess(true);
}

async function addFiles(fileList){
  const files = Array.from(fileList || []);
  const imgFiles = files.filter(f => f.type.startsWith('image/'));
  if (!imgFiles.length) { if (files.length) showToast('ไม่พบไฟล์รูปภาพ','warning'); return; }
  showSpinner('กำลังโหลดรูปภาพ...');
  let okCount = 0;
  for (const file of imgFiles) {
    try {
      const entry = await decodeFileToEntry(file);
      const item = { id: newId(), name: file.name, baseDataUrl: entry.dataUrl, dataUrl: entry.dataUrl, width: entry.width, height: entry.height };
      item.dataUrl = await applyDocFilter(item.baseDataUrl, item.width, item.height, docFilter);
      images.push(item);
      okCount++;
    } catch (e) {
      showToast(`อ่านไฟล์ไม่ได้: ${file.name}`, 'error');
    }
  }
  hideSpinner();
  if (files.length > imgFiles.length) showToast(`ข้ามไฟล์ที่ไม่ใช่รูปภาพ ${files.length - imgFiles.length} ไฟล์`, 'warning');
  if (okCount) showToast(`เพิ่มรูปภาพแล้ว ${okCount} รูป`, 'success');
  renderList();
}

async function rotateImage(id, deg){
  const item = images.find(i => i.id === id);
  if (!item) return;
  const img = await loadImageFromDataUrl(item.baseDataUrl);
  const swapped = (((deg % 360) + 360) % 360) !== 180;
  const nw = swapped ? item.height : item.width;
  const nh = swapped ? item.width : item.height;
  const canvas = document.createElement('canvas');
  canvas.width = nw; canvas.height = nh;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0,0,nw,nh);
  ctx.translate(nw/2, nh/2);
  ctx.rotate(deg * Math.PI/180);
  ctx.drawImage(img, -item.width/2, -item.height/2);
  item.baseDataUrl = canvas.toDataURL('image/jpeg', 0.95);
  item.width = nw; item.height = nh;
  item.dataUrl = await applyDocFilter(item.baseDataUrl, item.width, item.height, docFilter);
  renderList();
}

let cropState = null;

async function openCropModal(id){
  const item = images.find(i => i.id === id);
  if (!item) return;
  cropState = { itemId: id, natW: item.width, natH: item.height, quad: null, dragIdx: -1 };
  document.getElementById('cropImg').src = item.baseDataUrl;
  document.getElementById('cropStage').style.aspectRatio = `${item.width} / ${item.height}`;
  document.getElementById('cropSvg').setAttribute('viewBox', `0 0 ${item.width} ${item.height}`);
  document.getElementById('cropModal').classList.add('open');
  await autoDetectCrop();
}

function closeCropModal(){
  document.getElementById('cropModal').classList.remove('open');
  cropState = null;
}

async function autoDetectCrop(){
  if (!cropState) return;
  const img = await loadImageFromDataUrl(document.getElementById('cropImg').src);
  const c = document.createElement('canvas');
  c.width = cropState.natW; c.height = cropState.natH;
  c.getContext('2d').drawImage(img, 0, 0);
  cropState.quad = detectDocumentQuad(c);
  buildCropHandles();
}

function resetCropToFull(){
  if (!cropState) return;
  cropState.quad = [[0,0],[cropState.natW,0],[cropState.natW,cropState.natH],[0,cropState.natH]];
  buildCropHandles();
}

function buildCropHandles(){
  const svg = document.getElementById('cropSvg');
  const r = Math.max(cropState.natW, cropState.natH) * 0.016;
  svg.innerHTML = `<polygon class="crop-poly" fill="rgba(201,168,76,0.18)" stroke="#c9a84c" stroke-width="${r*0.35}"></polygon>` +
    [0,1,2,3].map(i => `<circle class="crop-handle" data-i="${i}" r="${r}" fill="#c9a84c" stroke="#0d1b3e" stroke-width="${r*0.25}"></circle>`).join('');
  svg.querySelectorAll('.crop-handle').forEach(hEl => {
    hEl.addEventListener('pointerdown', e => {
      e.preventDefault();
      cropState.dragIdx = Number(hEl.dataset.i);
      hEl.setPointerCapture(e.pointerId);
    });
    hEl.addEventListener('pointermove', e => {
      if (cropState.dragIdx !== Number(hEl.dataset.i)) return;
      cropState.quad[cropState.dragIdx] = svgPointFromEvent(e);
      updateCropVisuals();
    });
    hEl.addEventListener('pointerup', () => { cropState.dragIdx = -1; });
  });
  updateCropVisuals();
}

function updateCropVisuals(){
  const svg = document.getElementById('cropSvg');
  const q = cropState.quad;
  svg.querySelector('.crop-poly').setAttribute('points', q.map(p => p.join(',')).join(' '));
  svg.querySelectorAll('.crop-handle').forEach(hEl => {
    const p = q[Number(hEl.dataset.i)];
    hEl.setAttribute('cx', p[0]); hEl.setAttribute('cy', p[1]);
  });
}

function svgPointFromEvent(e){
  const svg = document.getElementById('cropSvg');
  const pt = svg.createSVGPoint();
  pt.x = e.clientX; pt.y = e.clientY;
  const p = pt.matrixTransform(svg.getScreenCTM().inverse());
  return [Math.max(0, Math.min(cropState.natW, p.x)), Math.max(0, Math.min(cropState.natH, p.y))];
}

async function applyCrop(){
  if (!cropState || !cropState.quad) { closeCropModal(); return; }
  const item = images.find(i => i.id === cropState.itemId);
  if (!item) { closeCropModal(); return; }
  showSpinner('กำลังครอบตัด...');
  try {
    const img = await loadImageFromDataUrl(item.baseDataUrl);
    const srcCanvas = document.createElement('canvas');
    srcCanvas.width = item.width; srcCanvas.height = item.height;
    srcCanvas.getContext('2d').drawImage(img, 0, 0);

    const q = cropState.quad;
    let outW = Math.round(Math.max(dist(q[0],q[1]), dist(q[3],q[2])));
    let outH = Math.round(Math.max(dist(q[0],q[3]), dist(q[1],q[2])));
    const capScale = Math.min(1, MAX_DIM / Math.max(outW, outH));
    outW = Math.max(20, Math.round(outW*capScale));
    outH = Math.max(20, Math.round(outH*capScale));

    const warped = warpQuadToRect(srcCanvas, q, outW, outH);
    item.baseDataUrl = warped.toDataURL('image/jpeg', 0.95);
    item.width = outW; item.height = outH;
    item.dataUrl = await applyDocFilter(item.baseDataUrl, item.width, item.height, docFilter);
    closeCropModal();
    renderList();
    showToast('ครอบตัดสำเร็จ ✓', 'success');
  } catch (e) {
    console.error(e);
    showToast('ครอบตัดไม่สำเร็จ', 'error');
  } finally {
    hideSpinner();
  }
}

async function autoCropAll(){
  if (!images.length) return;
  showSpinner('กำลังครอบตัดอัตโนมัติ...');
  try {
    let cropped = 0;
    for (let i = 0; i < images.length; i++) {
      const item = images[i];
      document.getElementById('spinnerMsg').textContent = `กำลังครอบตัดอัตโนมัติ ${i+1}/${images.length}...`;
      const img = await loadImageFromDataUrl(item.baseDataUrl);
      const srcCanvas = document.createElement('canvas');
      srcCanvas.width = item.width; srcCanvas.height = item.height;
      srcCanvas.getContext('2d').drawImage(img, 0, 0);
      const quad = detectDocumentQuad(srcCanvas);
      const isFullFrame = quad[0][0]===0 && quad[0][1]===0 && quad[2][0]===item.width && quad[2][1]===item.height;
      if (isFullFrame) continue;
      let outW = Math.round(Math.max(dist(quad[0],quad[1]), dist(quad[3],quad[2])));
      let outH = Math.round(Math.max(dist(quad[0],quad[3]), dist(quad[1],quad[2])));
      const capScale = Math.min(1, MAX_DIM / Math.max(outW, outH));
      outW = Math.max(20, Math.round(outW*capScale));
      outH = Math.max(20, Math.round(outH*capScale));
      const warped = warpQuadToRect(srcCanvas, quad, outW, outH);
      item.baseDataUrl = warped.toDataURL('image/jpeg', 0.95);
      item.width = outW; item.height = outH;
      item.dataUrl = await applyDocFilter(item.baseDataUrl, item.width, item.height, docFilter);
      cropped++;
    }
    renderList();
    showToast(cropped ? `ครอบตัดอัตโนมัติแล้ว ${cropped} รูป — ตรวจสอบ/ปรับมุมเพิ่มเติมได้ที่ ✂️` : 'ไม่พบขอบเอกสารที่ชัดเจน ลองครอบตัดเองที่ปุ่ม ✂️ แต่ละรูป', cropped ? 'success' : 'warning');
  } finally {
    hideSpinner();
  }
}

function moveImage(id, dir){
  const idx = images.findIndex(i => i.id === id);
  const swapIdx = idx + dir;
  if (idx < 0 || swapIdx < 0 || swapIdx >= images.length) return;
  [images[idx], images[swapIdx]] = [images[swapIdx], images[idx]];
  renderList();
}

function removeImage(id){
  images = images.filter(i => i.id !== id);
  renderList();
}

function clearAll(){
  if (!images.length) return;
  if (!confirm('ล้างรูปภาพทั้งหมดหรือไม่?')) return;
  images = [];
  renderList();
}

function renderList(){
  document.getElementById('listTitle').textContent = `รูปภาพ (${images.length})`;
  document.getElementById('convertBtn').disabled = images.length === 0;
  const empty = document.getElementById('emptyState');
  const grid = document.getElementById('thumbGrid');
  if (!images.length) { empty.classList.remove('hidden'); grid.classList.add('hidden'); grid.innerHTML=''; return; }
  empty.classList.add('hidden'); grid.classList.remove('hidden');
  grid.innerHTML = images.map((item, i) => `
    <div class="thumb-card">
      <div class="thumb-img-wrap">
        <span class="thumb-order">${i+1}</span>
        <img src="${item.dataUrl}" alt="">
      </div>
      <div class="thumb-name" title="${item.name}">${item.name}</div>
      <div class="thumb-actions">
        <button onclick="moveImage('${item.id}',-1)" title="เลื่อนขึ้น" ${i===0?'disabled':''}>↑</button>
        <button onclick="moveImage('${item.id}',1)" title="เลื่อนลง" ${i===images.length-1?'disabled':''}>↓</button>
        <button onclick="rotateImage('${item.id}',90)" title="หมุน">↻</button>
        <button onclick="openCropModal('${item.id}')" title="ครอบตัด">✂️</button>
        <button class="danger" onclick="removeImage('${item.id}')" title="ลบ">🗑</button>
      </div>
    </div>
  `).join('');
}

const PAGE_SIZES = { a4: [595.28, 841.89], letter: [612, 792] };
const MARGINS = { none: 0, normal: 28 };

function defaultFilename(){
  const d = new Date();
  const p = n => String(n).padStart(2,'0');
  return `image-to-pdf-${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}`;
}

async function buildCoverCanvas(item, availW, availH){
  const img = await loadImageFromDataUrl(item.dataUrl);
  const targetAspect = availW/availH, srcAspect = item.width/item.height;
  let sx=0, sy=0, sw=item.width, sh=item.height;
  if (srcAspect > targetAspect) { sw = item.height*targetAspect; sx=(item.width-sw)/2; }
  else { sh = item.width/targetAspect; sy=(item.height-sh)/2; }
  const canvas = document.createElement('canvas');
  canvas.width = Math.round(sw); canvas.height = Math.round(sh);
  canvas.getContext('2d').drawImage(img, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
  return canvas.toDataURL('image/jpeg', 0.85);
}

async function convertToPDF(){
  if (!images.length) return;
  if (filtersBusy) { showToast('กำลังปรับภาพ กรุณารอสักครู่แล้วลองใหม่', 'warning'); return; }
  if (!window.jspdf) { showToast('ไลบรารี PDF ยังโหลดไม่เสร็จ กรุณาลองใหม่อีกครั้ง', 'error'); return; }
  showSpinner('กำลังสร้าง PDF...');
  try {
    const { jsPDF } = window.jspdf;
    const sizeMode = document.getElementById('optPageSize').value;
    const orientMode = document.getElementById('optOrientation').value;
    const marginMode = document.getElementById('optMargin').value;
    const fitMode = document.getElementById('optFit').value;
    const margin = MARGINS[marginMode];
    let doc = null;

    for (const item of images) {
      const imgW = item.width, imgH = item.height;
      let pageW, pageH;
      if (sizeMode === 'original') {
        const px2pt = 72/96;
        pageW = imgW*px2pt + margin*2;
        pageH = imgH*px2pt + margin*2;
      } else {
        const base = PAGE_SIZES[sizeMode];
        const isLandscape = orientMode === 'auto' ? (imgW > imgH) : (orientMode === 'landscape');
        pageW = isLandscape ? Math.max(base[0],base[1]) : Math.min(base[0],base[1]);
        pageH = isLandscape ? Math.min(base[0],base[1]) : Math.max(base[0],base[1]);
      }
      const pageOrientation = pageW > pageH ? 'l' : 'p';

      if (!doc) doc = new jsPDF({ orientation: pageOrientation, unit: 'pt', format: [pageW, pageH], compress: true });
      else doc.addPage([pageW, pageH], pageOrientation);

      const availW = pageW - margin*2, availH = pageH - margin*2;
      if (fitMode === 'cover' && sizeMode !== 'original') {
        const cropUrl = await buildCoverCanvas(item, availW, availH);
        doc.addImage(cropUrl, 'JPEG', margin, margin, availW, availH);
      } else {
        const scale = Math.min(availW/imgW, availH/imgH);
        const w = imgW*scale, h = imgH*scale;
        const x = margin + (availW-w)/2, y = margin + (availH-h)/2;
        doc.addImage(item.dataUrl, 'JPEG', x, y, w, h);
      }
    }

    let filename = document.getElementById('pdfName').value.trim() || defaultFilename();
    if (!filename.toLowerCase().endsWith('.pdf')) filename += '.pdf';
    const blob = doc.output('blob');
    const file = new File([blob], filename, { type: 'application/pdf' });
    lastPdf = { blob, file, filename, pages: doc.internal.getNumberOfPages() };
    openResultModal();
  } catch (e) {
    console.error(e);
    showToast('เกิดข้อผิดพลาดในการสร้าง PDF', 'error');
  } finally {
    hideSpinner();
  }
}

document.getElementById('fileInput').addEventListener('change', e => { addFiles(e.target.files); e.target.value=''; });
document.getElementById('cameraInput').addEventListener('change', e => { addFiles(e.target.files); e.target.value=''; });

const dz = document.getElementById('dropzone');
dz.addEventListener('click', e => { if (e.target === dz) document.getElementById('fileInput').click(); });
dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('drag'); });
dz.addEventListener('dragleave', () => dz.classList.remove('drag'));
dz.addEventListener('drop', e => {
  e.preventDefault(); dz.classList.remove('drag');
  addFiles(e.dataTransfer.files);
});
document.addEventListener('paste', e => {
  const items = e.clipboardData && e.clipboardData.items;
  if (!items) return;
  const files = [];
  for (const it of items) { if (it.kind === 'file' && it.type.startsWith('image/')) { const f = it.getAsFile(); if (f) files.push(f); } }
  if (files.length) addFiles(files);
});
document.getElementById('resultModal').addEventListener('click', e => {
  if (e.target.id === 'resultModal') closeResultModal();
});
document.getElementById('cropModal').addEventListener('click', e => {
  if (e.target.id === 'cropModal') closeCropModal();
});

document.getElementById('modeGroup').addEventListener('click', e => {
  const btn = e.target.closest('.mode-btn');
  if (btn) setMode(btn.dataset.mode);
});
[['brightSlider','brightVal','brightness'], ['contrastSlider','contrastVal','contrast'], ['sharpenSlider','sharpenVal','sharpen']].forEach(([sliderId, valId, key]) => {
  const slider = document.getElementById(sliderId);
  const val = document.getElementById(valId);
  slider.addEventListener('input', () => {
    val.textContent = slider.value;
    docFilter[key] = Number(slider.value);
    scheduleReprocess(false);
  });
});

renderList();
</script>
