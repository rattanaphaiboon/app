<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Rattana Near Me v1.5</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{
  --navy:#0d1b3e;--navy-mid:#1a2f5e;--navy-light:#243b73;--gold:#c9a84c;--gold-light:#e8c86a;
  --success:#2ecc71;--danger:#e74c3c;--warning:#f39c12;--info:#3498db;
  --bg:#f4f6fb;--text:#0d1b3e;--card-bg:#ffffff;--border:#dde3f0;--muted:#6b7896;--row-alt:#fafbfd;
  --radius-sm:6px;--radius-md:12px;--radius-lg:16px;
  --shadow-sm:0 1px 4px rgba(0,0,0,.06);--shadow-md:0 2px 8px rgba(0,0,0,.08);--shadow-lg:0 8px 24px rgba(13,27,62,.12);--shadow-gold:0 4px 12px rgba(201,168,76,.35);
}
body.dark{--bg:#0a1020;--text:#e8eaf0;--card-bg:#111c35;--border:#243b73;--muted:#8a98b8;--row-alt:#0f1830}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Sarabun',sans-serif;font-size:14px;line-height:1.5;min-height:100dvh;overflow-x:hidden;background:var(--bg);color:var(--text);transition:background .25s,color .25s}
button{font-family:inherit;cursor:pointer;border:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
input,select{font-family:inherit;font-size:16px}
a{color:inherit}

header{background:var(--navy);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:1000;display:flex;align-items:center;gap:10px;border-bottom:3px solid var(--gold);padding-top:max(12px,env(safe-area-inset-top))}
.logo-text{font-weight:700;letter-spacing:1px;font-size:18px;color:#fff;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo-text span{color:var(--gold)}
.logo-text .ver-badge{display:inline-block;font-size:10px;font-weight:600;letter-spacing:0;color:var(--navy);background:var(--gold);border-radius:8px;padding:1px 7px;margin-left:6px;vertical-align:middle}
@media(max-width:480px){.logo-text{font-size:16px;white-space:normal;line-height:1.2}.logo-text .ver-badge{display:table;margin:3px 0 0}}
.icon-btn{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.2);width:40px;height:40px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;transition:background .15s}
.icon-btn:hover{background:rgba(255,255,255,.12)}

.content{padding:12px;max-width:1200px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:12px}
@media(min-width:1024px){
  .content{display:grid;grid-template-columns:420px 1fr;align-items:start;padding:20px;gap:16px}
  .col-left{position:sticky;top:76px;display:flex;flex-direction:column;gap:12px}
}
.col-left,.col-right{display:flex;flex-direction:column;gap:12px;min-width:0}
@media(max-width:1023px){
  .col-left,.col-right{display:contents}
  #msg{order:1}.ctrl{order:2}#map{order:3}#listCard{order:4}#dataNote{order:5}
}

.card{background:var(--card-bg);border-radius:var(--radius-md);border:1px solid var(--border);box-shadow:var(--shadow-md)}
.card-gold{border-top:3px solid var(--gold)}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px;border-bottom:1px solid var(--border);background:linear-gradient(to right,rgba(201,168,76,.07),transparent);font-weight:700}
.card-body{padding:14px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 14px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;cursor:pointer;border:1px solid transparent;min-height:44px;transition:opacity .15s,transform .1s;text-decoration:none}
.btn:hover{opacity:.88}.btn:active{transform:scale(.97)}
.btn-primary{background:var(--navy);color:#fff;border-color:var(--navy)}
body.dark .btn-primary{background:var(--navy-light);border-color:var(--navy-light)}
.btn-gold{background:var(--gold);color:var(--navy);border-color:var(--gold)}
.btn-outline{background:transparent;color:var(--text);border-color:var(--border)}
.btn-sm{padding:5px 10px;font-size:12px;min-height:34px}
.btn.on{background:var(--gold);color:var(--navy);border-color:var(--gold)}

.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;white-space:nowrap}
.badge-gold{background:rgba(201,168,76,.18);color:var(--navy);border:1px solid rgba(201,168,76,.4)}
body.dark .badge-gold{color:var(--gold-light)}
.badge-warn{background:#fef3d7;color:#a87800}
body.dark .badge-warn{background:#3a2e15;color:#e8c86a}
.badge-info{background:#e3f0fd;color:#1a6fb8}
body.dark .badge-info{background:#14304f;color:#8cc4f5}

/* ── Message banner ── */
.msg{border-radius:var(--radius-md);padding:14px 16px;color:#fff;background:var(--navy);border-left:5px solid var(--gold);box-shadow:var(--shadow-lg)}
.msg .m-title{font-size:18px;font-weight:700;line-height:1.35}
.msg .m-title b{color:var(--gold-light)}
.msg .m-sub{font-size:13px;opacity:.85;margin-top:4px}
.msg .m-near{margin-top:10px;background:rgba(255,255,255,.08);border-radius:var(--radius-sm);padding:10px 12px;display:flex;align-items:center;gap:10px;cursor:pointer}
.msg .m-near .dist{font-size:20px;font-weight:700;color:var(--gold-light);white-space:nowrap}
.msg .m-near .nm{font-weight:600;font-size:15px;line-height:1.3}
.msg.warn{border-left-color:var(--warning)}
.msg.err{border-left-color:var(--danger)}
.msg .m-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.msg .m-help{margin:8px 0 0 20px;font-size:13px;line-height:1.55;opacity:.95}
.msg .m-help li{margin-bottom:4px}

/* ── Chips ── */
.lbl{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.3px;margin-bottom:6px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;background:var(--card-bg);color:var(--text);border:1.5px solid var(--border);border-radius:20px;padding:6px 14px;font-size:13px;font-weight:600;min-height:36px}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
body.dark .chip.on{background:var(--gold);color:var(--navy);border-color:var(--gold)}
.chip .n{font-weight:500;opacity:.7;margin-left:3px;font-size:11px}
.search{width:100%;height:44px;border-radius:22px;border:1.5px solid var(--border);background:var(--card-bg);color:var(--text);padding:0 16px;outline:none}
.search:focus{border-color:var(--gold)}

/* ── Map ── */
#map{height:min(46dvh,420px);border-radius:var(--radius-md);border:1px solid var(--border);box-shadow:var(--shadow-md);z-index:1}
@media(min-width:1024px){#map{height:calc(100dvh - 120px);max-height:none}}
/* ── ตำแหน่งของฉัน: หมุดสีฟ้า + ป้าย "คุณอยู่ที่นี่" + วงกระเพื่อม ── */
.me-wrap{position:relative;width:44px;height:52px;pointer-events:auto}
.me-pulse{position:absolute;left:22px;top:50px;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:rgba(26,115,232,.45);display:none}
.me-wrap.live .me-pulse{display:block;animation:mePulse 1.8s ease-out infinite}
.me-wrap.live .me-pulse.p2{animation-delay:.9s}
.me-center{position:absolute;left:22px;top:50px;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:#fff;border:3px solid #1a73e8;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.me-pin{position:absolute;left:4px;top:0;width:36px;height:36px;background:#1a73e8;border:3px solid #fff;border-radius:50% 50% 50% 0;transform:rotate(-45deg);box-shadow:0 4px 12px rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center}
.me-pin span{transform:rotate(45deg);font-size:18px;line-height:1}
.me-label{position:absolute;left:22px;bottom:100%;transform:translateX(-50%);margin-bottom:6px;background:#1a73e8;color:#fff;font-family:'Sarabun',sans-serif;font-weight:700;font-size:13px;padding:3px 10px;border-radius:12px;white-space:nowrap;border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.me-label::after{content:'';position:absolute;left:50%;top:100%;margin-left:-5px;border:5px solid transparent;border-top-color:#1a73e8}
.me-wrap.manual .me-pin,.me-wrap.manual .me-label{background:#e74c3c}
.me-wrap.manual .me-label::after{border-top-color:#e74c3c}
.me-wrap.manual .me-center{border-color:#e74c3c}
.leaflet-bar a.me-ctl{font-size:18px;line-height:30px;text-decoration:none}
.pin-mode #map{cursor:crosshair}
.leaflet-popup-content{font-family:'Sarabun',sans-serif;font-size:13px;margin:10px 12px}
.pp-name{font-weight:700;font-size:14px;margin-bottom:2px}
.pp-row{color:#555}
.pp-act{display:flex;gap:6px;margin-top:8px}
.pp-act a{flex:1;text-align:center;background:#0d1b3e;color:#fff;border-radius:6px;padding:6px 8px;text-decoration:none;font-weight:600;font-size:12px}
.pp-act a.g{background:#c9a84c;color:#0d1b3e}
/* ── ไอคอนร้านใกล้ ── */
.sp-wrap{background:none;border:none}
.sp{position:relative;width:34px;height:34px}
.sp-ico{width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-size:30px;line-height:1;cursor:pointer;filter:drop-shadow(0 2px 3px rgba(0,0,0,.45))}
.sp-lbl{position:absolute;left:38px;top:50%;transform:translateY(-50%);background:#fff;color:#0d1b3e;border:1.5px solid #c9a84c;border-radius:8px;padding:3px 8px;box-shadow:0 2px 6px rgba(0,0,0,.25);font-family:'Sarabun',sans-serif;line-height:1.25;white-space:nowrap;max-width:190px;cursor:pointer}
.sp-lbl b{display:block;font-size:12px;font-weight:700;overflow:hidden;text-overflow:ellipsis}
.sp-lbl a,.sp-lbl .sp-none{display:block;font-size:12px;font-weight:600;color:#1a6fb8;text-decoration:none}
.sp-lbl .sp-none{color:#8a98b8;font-weight:500}
.nolbl .sp-lbl{display:none}

/* ── Shop list ── */
.list{display:flex;flex-direction:column}
.shop{display:flex;gap:12px;padding:12px 14px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .12s}
.shop:last-child{border-bottom:none}
.shop:hover{background:rgba(201,168,76,.07)}
.shop.sel{background:rgba(201,168,76,.14)}
.shop .rank{width:30px;height:30px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0}
.shop.very .rank{background:var(--gold);color:var(--navy)}
.shop .info{flex:1;min-width:0}
.shop .nm{font-weight:700;font-size:15px;line-height:1.3;word-break:break-word}
.shop .addr{font-size:12px;color:var(--muted);margin-top:2px}
.shop .tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
.shop .acts{display:flex;gap:6px;margin-top:8px}
.shop .d{text-align:right;flex-shrink:0}
.shop .d .km{font-size:17px;font-weight:700;color:var(--navy);white-space:nowrap;font-variant-numeric:tabular-nums}
body.dark .shop .d .km{color:var(--gold-light)}
.shop .d .dir{font-size:11px;color:var(--muted);white-space:nowrap}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}
.more{padding:10px;text-align:center}
.foot-note{font-size:11px;color:var(--muted);text-align:center;padding:4px 0 8px}

/* ── Toast / spinner / alert ── */
.toast{position:fixed;bottom:max(24px,env(safe-area-inset-bottom));right:16px;left:16px;margin:0 auto;max-width:420px;padding:12px 18px;border-radius:var(--radius-md);color:#fff;z-index:9999;animation:slideUp .3s ease;font-weight:500;box-shadow:var(--shadow-lg);font-size:14px}
.toast-success{background:#1e8449}.toast-error{background:var(--danger)}.toast-warning{background:var(--warning);color:var(--navy)}.toast-info{background:var(--navy-mid);border-left:3px solid var(--gold)}
.near-alert{position:fixed;top:calc(70px + env(safe-area-inset-top));left:12px;right:12px;margin:0 auto;max-width:460px;background:var(--gold);color:var(--navy);border-radius:var(--radius-md);padding:12px 16px;box-shadow:var(--shadow-gold);z-index:2000;font-weight:600;display:none;animation:slideDown .3s ease;cursor:pointer}
.near-alert.show{display:block}
.near-alert .t{font-size:12px;opacity:.8}
.near-alert .n{font-size:17px;font-weight:700;line-height:1.3}
#loadingBar{position:fixed;top:0;left:0;height:3px;background:var(--gold);width:0;transition:width .4s;z-index:10000}
#spinner{display:none;position:fixed;inset:0;background:rgba(13,27,62,.6);align-items:center;justify-content:center;z-index:99999;backdrop-filter:blur(3px)}
#spinner .box{background:var(--card-bg);color:var(--text);border-radius:16px;padding:32px 40px;text-align:center;border-top:4px solid var(--gold);min-width:240px}
#spinner .ring{width:48px;height:48px;border:5px solid #dde3f0;border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px}
#backToTop{position:fixed;bottom:max(24px,calc(16px + env(safe-area-inset-bottom)));right:max(16px,calc(12px + env(safe-area-inset-right)));background:var(--gold);color:var(--navy);border:none;border-radius:50%;width:46px;height:46px;display:none;align-items:center;justify-content:center;box-shadow:var(--shadow-gold);z-index:900;font-size:18px;font-weight:700}
#backToTop.show{display:flex}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes slideDown{from{transform:translateY(-20px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes mePulse{0%{transform:scale(1);opacity:.9}100%{transform:scale(5);opacity:0}}
</style>
</head>
<body>
<div id="loadingBar"></div>
<div id="spinner"><div class="box"><div class="ring"></div><p id="spinnerMsg">กำลังโหลด...</p></div></div>

<header>
  <div class="logo-text">Rattana <span>Near Me</span><span class="ver-badge">v1.5 · 2026-10-22</span></div>
  <button class="icon-btn" id="btnRefresh" title="โหลดข้อมูลร้านใหม่" onclick="refreshData()">⟳</button>
  <button class="icon-btn" id="btnDark" title="โหมดมืด" onclick="toggleDark()">🌙</button>
</header>

<div class="near-alert" id="nearAlert" onclick="onAlertClick()">
  <div class="t">🔔 คุณอยู่ใกล้ร้านค้า</div>
  <div class="n" id="nearAlertName"></div>
  <div class="t" id="nearAlertSub"></div>
</div>

<main class="content">
  <div class="col-left">
    <div class="msg" id="msg">
      <div class="m-title">กำลังหาตำแหน่งของคุณ...</div>
      <div class="m-sub">กรุณากด "อนุญาต" เมื่อเบราว์เซอร์ขอสิทธิ์ตำแหน่ง</div>
    </div>

    <div class="card card-gold ctrl">
      <div class="card-body" style="display:flex;flex-direction:column;gap:12px">
        <div>
          <div class="lbl">รัศมีค้นหา</div>
          <div class="chips" id="radiusChips"></div>
        </div>
        <div>
          <div class="lbl">จังหวัด</div>
          <div class="chips" id="provChips"></div>
        </div>
        <input class="search" id="q" type="search" placeholder="🔍 ค้นหาชื่อร้าน / รหัส / ตำบล / เซลล์" autocomplete="off" oninput="onSearch()">
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn btn-primary btn-sm" id="btnLive" onclick="toggleLive()">📡 ติดตามตำแหน่ง: เปิด</button>
          <button class="btn btn-outline btn-sm" id="btnPin" onclick="togglePinMode()">📌 ปักหมุดเอง</button>
          <button class="btn btn-outline btn-sm" onclick="centerMe()">🎯 ไปที่ฉัน</button>
        </div>
      </div>
    </div>

    <div class="card card-gold" id="listCard">
      <div class="card-head"><span id="listTitle">ร้านใกล้คุณ</span><span class="badge badge-gold" id="listCount">0</span></div>
      <div class="list" id="list"><div class="empty">รอตำแหน่งของคุณ...</div></div>
    </div>
    <div class="foot-note" id="dataNote"></div>
  </div>

  <div class="col-right">
    <div id="map"></div>
  </div>
</main>

<button id="backToTop" onclick="window.scrollTo({top:0,behavior:'smooth'})">▲</button>

<script>
/* เปิดจาก LINE → ให้ LINE เปิดในเบราว์เซอร์ของเครื่องแทน (เบราว์เซอร์ใน LINE ไม่ให้ใช้ GPS) */
if (/\bLine\//i.test(navigator.userAgent || '') && !/[?&]openExternalBrowser=1/.test(location.search)) {
  location.replace(location.href.split('#')[0] + (location.search ? '&' : '?') + 'openExternalBrowser=1');
}

/* ════════ Config ════════ */
const APP_VER   = '1.5';
const SHEET_ID  = '1dAxF4Mz-zhJIVbuJ_Ql126gt08qvVS1wndJD50pqCZI';
const SHEET_TAB = 'Customer';
const PROVINCES = ['สมุทรสาคร', 'เพชรบุรี', 'สมุทรสงคราม'];
const RADII     = [300, 500, 1000, 2000, 5000];
const VERY_NEAR = 100;            // เมตร — แจ้งเตือนเด้งเมื่อเข้าใกล้ร้านในระยะนี้
const NEAREST_FALLBACK = 10;      // ถ้าไม่มีร้านในรัศมี แสดงร้านที่ใกล้ที่สุดกี่ร้าน
const PAGE = 50;
const CACHE_KEY = 'rns_shops_v1';
const PREF_KEY  = 'rns_prefs_v1';
// คอลัมน์ในชีต Customer (อ้างอิงด้วยชื่อหัวคอลัมน์)
const COL = {
  name:'ชื่อร้านค้า', code:'รหัส บีพลัส', addr:'ที่อยู่', moo:'หมู่', area:'ต.,อ.,จ. ขอพร',
  phone:'เบอร์โทร', loc:'Location', type:'ประเภทร้านค้าขอพร', wh:'WH', route:'ชื่อรูท',
  routeArea:'ชื่อรูท-ตำบล', sales:'เซลล์ผู้ดูแล', day:'วันส่ง', status:'_status'
};

/* ════════ State ════════ */
let shops = [];            // ร้านทั้งหมดใน 3 จังหวัดที่มีพิกัด
let noLocCount = 0;
let me = null;             // {lat,lng,acc,ts,manual}
let prefs = loadPrefs();
let watchId = null;
let pinMode = false;
let shown = PAGE;
let lastResult = [];
let selectedId = null;
const alerted = new Set();
let alertShopId = null;

function loadPrefs(){
  const d = {radius:1000, prov:'all', live:true, dark:false};
  try { return Object.assign(d, JSON.parse(localStorage.getItem(PREF_KEY) || '{}')); } catch(e){ return d; }
}
function savePrefs(){ try { localStorage.setItem(PREF_KEY, JSON.stringify(prefs)); } catch(e){} }

/* ════════ Utils ════════ */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad2 = n => String(n).padStart(2,'0');
function formatThaiDate(d){ d = new Date(d); if (isNaN(d)) return '-'; return pad2(d.getDate())+'/'+pad2(d.getMonth()+1)+'/'+(d.getFullYear()+543); }
function formatThaiTime(d){ d = new Date(d); if (isNaN(d)) return '-'; return pad2(d.getHours())+'.'+pad2(d.getMinutes()); }
const fmtNum = n => Number(n).toLocaleString('th-TH');
function fmtDist(m){
  if (m < 1000) return Math.round(m) + ' ม.';
  return parseFloat((m/1000).toFixed(m < 10000 ? 2 : 1)) + ' กม.';
}
function haversine(a, b, c, d){
  const R = 6371000, toR = Math.PI/180;
  const dLat = (c-a)*toR, dLng = (d-b)*toR;
  const x = Math.sin(dLat/2)**2 + Math.cos(a*toR)*Math.cos(c*toR)*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(x));
}
function bearingTh(a, b, c, d){
  const toR = Math.PI/180;
  const y = Math.sin((d-b)*toR)*Math.cos(c*toR);
  const x = Math.cos(a*toR)*Math.sin(c*toR) - Math.sin(a*toR)*Math.cos(c*toR)*Math.cos((d-b)*toR);
  const deg = (Math.atan2(y, x)/toR + 360) % 360;
  const names = ['เหนือ','ตะวันออกเฉียงเหนือ','ตะวันออก','ตะวันออกเฉียงใต้','ใต้','ตะวันตกเฉียงใต้','ตะวันตก','ตะวันตกเฉียงเหนือ'];
  const arrows = ['↑','↗','→','↘','↓','↙','←','↖'];
  const i = Math.round(deg/45) % 8;
  return arrows[i] + ' ทิศ' + names[i];
}
function parseLatLng(s){
  const m = String(s||'').match(/-?\d+(?:\.\d+)?/g);
  if (!m || m.length < 2) return null;
  let lat = parseFloat(m[0]), lng = parseFloat(m[1]);
  if (lat > 90 && lng < 90) { const t = lat; lat = lng; lng = t; }   // สลับลำดับ
  if (lat < 5 || lat > 21 || lng < 97 || lng > 106) return null;     // นอกประเทศไทย
  return {lat, lng};
}
function provinceOf(area){
  const s = String(area||'');
  return PROVINCES.find(p => s.indexOf(p) >= 0) || '';
}
function firstPhone(s){
  const m = String(s||'').replace(/[\s-]/g,'').match(/\+?\d{9,10}/);
  return m ? m[0] : '';
}
function showToast(msg, type='info'){

  document.body.appendChild(t); setTimeout(() => t.remove(), 3500);
}

/* ════════ Data: Google Sheet (gviz JSONP — ใช้ได้ทั้งไฟล์ในเครื่องและ GitHub Pages) ════════ */
function gvizJsonp(tq){
  return new Promise((resolve, reject) => {
    const cb = '__rns_cb' + Date.now() + Math.floor(Math.random()*1000);
    const s = document.createElement('script');
    const timer = setTimeout(() => { cleanup(); reject(new Error('timeout')); }, 30000);
    function cleanup(){ clearTimeout(timer); delete window[cb]; s.remove(); }
    window[cb] = res => { cleanup(); res && res.status !== 'error' ? resolve(res) : reject(new Error((res && res.errors && res.errors[0] && res.errors[0].detailed_message) || 'sheet error')); };
    let url = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/gviz/tq?tqx=responseHandler:' + cb +
              '&sheet=' + encodeURIComponent(SHEET_TAB) + '&headers=1';
    if (tq) url += '&tq=' + encodeURIComponent(tq);
    s.src = url;
    s.onerror = () => { cleanup(); reject(new Error('network')); };
    document.head.appendChild(s);
  });
}
function tableToObjects(res){
  const cols = res.table.cols.map(c => String(c.label||'').trim());
  return res.table.rows.map(r => {
    const o = {};
    cols.forEach((k, i) => {
      const c = r.c[i];
      let v = c == null ? '' : (c.v == null ? '' : c.v);
      if (typeof v === 'number') v = String(v);   // รหัส/เบอร์โทร ต้องเป็น string
      o[k] = String(v).trim();
    });
    return o;
  });
}
async function fetchShops(){
  // ขอเฉพาะคอลัมน์ที่ใช้ + เฉพาะ 3 จังหวัด เพื่อให้โหลดเร็ว
  const where = PROVINCES.map(p => "E contains '" + p + "'").join(' or ');
  let rows;
  try {
    const res = await gvizJsonp('select A,B,C,D,E,F,G,H,K,L,M,N,P,W where ' + where);
    rows = tableToObjects(res);
    if (!rows.length || !(COL.name in rows[0]) || !(COL.loc in rows[0])) throw new Error('layout changed');
  } catch (e) {
    // ถ้าโครงสร้างคอลัมน์ในชีตเปลี่ยน → โหลดทั้งชีตแล้วกรองตามชื่อหัวคอลัมน์
    const res = await gvizJsonp('');
    rows = tableToObjects(res).filter(r => provinceOf(r[COL.area]));
  }
  return buildShops(rows);
}
function buildShops(rows){
  const map = new Map(); let noLoc = 0;
  rows.forEach(r => {
    const prov = provinceOf(r[COL.area]);
    if (!prov) return;
    const ll = parseLatLng(r[COL.loc]);
    if (!ll) { noLoc++; return; }
    const name = r[COL.name] || '(ไม่มีชื่อ)';
    const key = name + '|' + ll.lat.toFixed(5) + ',' + ll.lng.toFixed(5);
    const sales = r[COL.sales], wh = r[COL.wh];
    if (map.has(key)) {           // ร้านซ้ำ (หลายคลัง/หลายเซลล์) → รวมเป็นร้านเดียว
      const s = map.get(key);
      if (sales && s.sales.indexOf(sales) < 0) s.sales.push(sales);
      if (wh && s.wh.indexOf(wh) < 0) s.wh.push(wh);
      if (!s.phone && r[COL.phone]) s.phone = r[COL.phone];
      if (!s.route && r[COL.route]) { s.route = r[COL.route]; s.routeArea = r[COL.routeArea]; s.day = r[COL.day]; }
      return;
    }
    const addrParts = [];
    if (r[COL.addr]) addrParts.push(r[COL.addr]);
    if (r[COL.moo] && r[COL.moo] !== '-') addrParts.push('ม.' + r[COL.moo]);
    const a = String(r[COL.area]||'').split(',').map(x => x.trim()).filter(Boolean);
    if (a.length === 3) addrParts.push('ต.' + a[0] + ' อ.' + a[1] + ' จ.' + a[2]); else if (r[COL.area]) addrParts.push(r[COL.area]);
    map.set(key, {
      id: map.size + 1, name, code: r[COL.code], addr: addrParts.join(' '), prov,
      tambon: a[0] || '', phone: r[COL.phone], type: r[COL.type],
      wh: wh ? [wh] : [], route: r[COL.route], routeArea: r[COL.routeArea], day: r[COL.day],
      sales: sales ? [sales] : [], pending: /pending/i.test(r[COL.status]||''),
      lat: ll.lat, lng: ll.lng
    });
  });
  return { shops: [...map.values()], noLoc };
}
function applyData(d, ts){
  shops = d.shops; noLocCount = d.noLoc;
  shops.forEach(s => s._q = (s.name + ' ' + s.code + ' ' + s.addr + ' ' + s.sales.join(' ') + ' ' + s.route + ' ' + s.routeArea + ' ' + s.type).toLowerCase());
  $('dataNote').textContent = 'ข้อมูลร้าน ' + fmtNum(shops.length) + ' ร้าน (3 จังหวัด)' +
    (noLocCount ? ' · ไม่มีพิกัด ' + fmtNum(noLocCount) + ' แถว' : '') +
    ' · อัปเดต ' + formatThaiDate(ts) + ' ' + formatThaiTime(ts) + ' · v' + APP_VER;
  renderProvChips();
  drawShopMarkers();
  update();
}
async function loadData(manual){
  setLoading(true);

  } catch (e) {
    showToast('โหลดข้อมูลชีตไม่สำเร็จ: ' + e.message, 'error');

  } finally { setLoading(false); hideSpinner(); }
}

function nearIconHtml(s){

function renderNearIcons(list){
  const keep = new Set();
  list.forEach(s => {
    const sig = s.name + '|' + s.phone + '|' + s.lat + ',' + s.lng;
    let o = nearIconById.get(s.id);
    if (o && o.sig !== sig) { nearLayer.removeLayer(o.marker); o = null; }
    if (!o) {
      const m = L.marker([s.lat, s.lng], {
        icon: L.divIcon({className:'sp-wrap', html:nearIconHtml(s), iconSize:[34,34], iconAnchor:[17,17]}),
        zIndexOffset: 500, riseOnHover: true
      });
      m.on('click', () => selectShop(s.id, false));
      m.addTo(nearLayer);
      o = {marker:m, sig};
      nearIconById.set(s.id, o);
    }
    keep.add(s.id);
  });
  nearIconById.forEach((o, id) => { if (!keep.has(id)) { nearLayer.removeLayer(o.marker); nearIconById.delete(id); } });
  nearOrder = list.map(s => s.id);   // เรียงจากใกล้ → ไกล ร้านที่ใกล้กว่าได้แสดงป้ายก่อน
  layoutNearLabels();

// ป้ายชื่อที่ทับกันให้ซ่อน (ยังเห็นไอคอน แตะเพื่อดูรายละเอียด) — ร้านใกล้สุดได้แสดงก่อน
function layoutNearLabels(){
  const placed = [];
  nearOrder.forEach(id => {
    const o = nearIconById.get(id); if (!o) return;
    const el = o.marker.getElement(); if (!el) return;
    el.classList.remove('nolbl');
    const ico = el.querySelector('.sp-ico').getBoundingClientRect();
    const lbl = el.querySelector('.sp-lbl').getBoundingClientRect();
    const box = {l:Math.min(ico.left, lbl.left) - 2, t:Math.min(ico.top, lbl.top) - 2, r:Math.max(ico.right, lbl.right) + 2, b:Math.max(ico.bottom, lbl.bottom) + 2};
    const hit = placed.some(p => box.l < p.r && box.r > p.l && box.t < p.b && box.b > p.t);
    if (hit) {
      el.classList.add('nolbl');
      placed.push({l:ico.left, t:ico.top, r:ico.right, b:ico.bottom});
    } else placed.push(box);
    o.marker.setZIndexOffset(hit ? 500 : 3000);   // ร้านที่มีป้ายอยู่บนไอคอนอื่น ป้ายจะไม่ถูกบัง
  });
}

/* ════════ Geolocation ════════ */
let firstFix = true;
let locatingTimer = null;
function startGeo(){
  if (!('geolocation' in navigator)) { geoError({code:0, message:'เบราว์เซอร์นี้ไม่รองรับ GPS'}); return; }
  if (!window.isSecureContext) { geoError({code:0, message:'ต้องเปิดผ่านลิงก์ https:// เท่านั้นจึงจะใช้ GPS ได้'}); return; }
  stopWatch();
  if (!me) showLocating();
  getPos(true);
}
// ขอตำแหน่งครั้งแรก: แบบแม่นยำ (GPS) ก่อน ถ้าช้า/ไม่ได้ → ลองแบบทั่วไป (Wi-Fi/เสาสัญญาณ) แล้วค่อยติดตามต่อเนื่อง
function getPos(high){
  navigator.geolocation.getCurrentPosition(p => {
    clearTimeout(locatingTimer);
    onPos(p);
    if (prefs.live) startWatch();
  }, err => {
    if (err.code !== 1 && high) { getPos(false); return; }
    clearTimeout(locatingTimer);
    geoError(err);
  }, {enableHighAccuracy:high, maximumAge:high ? 10000 : 300000, timeout:high ? 12000 : 30000});
}
function startWatch(){
  if (watchId != null) navigator.geolocation.clearWatch(watchId);
  watchId = navigator.geolocation.watchPosition(onPos, err => { if (err.code === 1) geoError(err); }, {enableHighAccuracy:true, maximumAge:10000});
  renderLiveBtn();
}
function showLocating(){
  $('msg').className = 'msg';
  $('msg').innerHTML = '<div class="m-title">📡 กำลังหาตำแหน่งของคุณ...</div>' +
    '<div class="m-sub">ถ้าเครื่องถามสิทธิ์ตำแหน่ง ให้กด "อนุญาต"</div>';
  clearTimeout(locatingTimer);
  locatingTimer = setTimeout(() => {
    if (me) return;
    $('msg').innerHTML = '<div class="m-title">📡 ยังหาตำแหน่งอยู่...</div>' +
      '<div class="m-sub">ถ้าอยู่ในอาคาร สัญญาณ GPS อาจอ่อน ลองเดินออกไปที่โล่ง หรือเปิด Wi-Fi ไว้ช่วยหาตำแหน่ง</div>' +
      '<div class="m-actions"><button class="btn btn-outline btn-sm" style="color:#fff;border-color:rgba(255,255,255,.4)" onclick="togglePinMode(true)">📌 ปักหมุดเอง</button></div>';
  }, 10000);
}
function stopWatch(){
  if (watchId != null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
  renderLiveBtn();
}
function onPos(p){
  setMe({lat:p.coords.latitude, lng:p.coords.longitude, acc:p.coords.accuracy, ts:p.timestamp || Date.now(), manual:false}, firstFix);
  firstFix = false;
}

  ];
  if (code === 1) return [
    'คลิกไอคอน 🔒 หน้าแถบที่อยู่ › ตำแหน่ง (Location) › อนุญาต',
    'กด "ลองใหม่" หรือรีเฟรชหน้า'
  ];
  return [
    'ตรวจว่าเปิด "ตำแหน่ง/GPS" ในเครื่องแล้ว',
    'ถ้าอยู่ในอาคาร ลองเดินออกไปที่โล่ง และเปิด Wi-Fi ไว้ช่วยหาตำแหน่ง',
    'กด "ลองใหม่" หรือ "ปักหมุดเอง" แล้วแตะบนแผนที่ตรงที่คุณอยู่'
  ];
}
function geoError(err){
  const why = IN_APP ? 'แอพที่ใช้เปิดลิงก์นี้ไม่ให้ใช้ GPS'
            : err.code === 1 ? 'ยังไม่ได้อนุญาตให้เว็บนี้ใช้ตำแหน่ง'
            : err.code === 2 ? 'หาตำแหน่งไม่ได้ (GPS ปิดอยู่ หรือไม่มีสัญญาณ)'
            : err.code === 3 ? 'หาตำแหน่งนานเกินไป' : (err.message || 'ใช้ GPS ไม่ได้');
  if (me && !me.manual && err.code !== 1) return;   // มีตำแหน่งแล้ว พลาดชั่วคราวไม่เป็นไร
  clearTimeout(locatingTimer);
  stopWatch();
  const steps = geoHelpSteps(err.code);
  $('msg').className = 'msg err';
  $('msg').innerHTML = '<div class="m-title">⚠️ ' + esc(why) + '</div>' +
    '<ol class="m-help">' + steps.map(s => '<li>' + esc(s) + '</li>').join('') + '</ol>' +
    '<div class="m-actions"><button class="btn btn-gold btn-sm" onclick="startGeo()">↻ ลองใหม่</button>' +
    (IN_APP ? '<button class="btn btn-gold btn-sm" onclick="copyLink()">📋 คัดลอกลิงก์</button>' : '') +
    '<button class="btn btn-outline btn-sm" style="color:#fff;border-color:rgba(255,255,255,.4)" onclick="togglePinMode(true)">📌 ปักหมุดเอง</button></div>';
}
function copyLink(){
  const url = location.href.split('#')[0].replace(/[?&]openExternalBrowser=1/, '');
  const done = () => showToast('คัดลอกลิงก์แล้ว — วางใน Chrome หรือ Safari', 'success');
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(done, () => prompt_copy(url));
  else prompt_copy(url);
}
function prompt_copy(url){
  const t = document.createElement('textarea'); t.value = url; document.body.appendChild(t); t.select();
  try { document.execCommand('copy'); showToast('คัดลอกลิงก์แล้ว — วางใน Chrome หรือ Safari', 'success'); }
  catch(e){ showToast(url, 'info'); }
  t.remove();
}
// ถ้าผู้ใช้ไปเปิดสิทธิ์ตำแหน่งแล้ว → เริ่มหาตำแหน่งเองอัตโนมัติ
if (navigator.permissions && navigator.permissions.query) {
  navigator.permissions.query({name:'geolocation'}).then(st => {
    st.onchange = () => { if (st.state === 'granted' && (!me || watchId == null)) startGeo(); };
  }).catch(() => {});
}
function setMe(pos, fit){
  me = pos;
  drawMe();
  update();
  if (fit) centerMe();
}
function toggleLive(){
  prefs.live = !(watchId != null);
  savePrefs();
  if (prefs.live) { firstFix = !me || me.manual; startGeo(); showToast('เปิดติดตามตำแหน่ง', 'info'); }
  else { stopWatch(); showToast('หยุดติดตามตำแหน่ง', 'info'); }
}
function renderLiveBtn(){
  const on = watchId != null;
  $('btnLive').textContent = on ? '📡 ติดตามตำแหน่ง: เปิด' : '📡 ติดตามตำแหน่ง: ปิด';
  $('btnLive').className = 'btn btn-sm ' + (on ? 'btn-primary' : 'btn-outline');
  styleMe();
}
function togglePinMode(force){
  pinMode = typeof force === 'boolean' ? force : !pinMode;
  document.body.classList.toggle('pin-mode', pinMode);
  $('btnPin').classList.toggle('on', pinMode);
  if (pinMode) {
    showToast('แตะบนแผนที่ตรงตำแหน่งที่คุณอยู่', 'info');
    if (window.innerWidth < 1024) $('map').scrollIntoView({behavior:'smooth', block:'center'});
  }
}

/* ════════ Core: หาร้านใกล้ + แสดงข้อความ ════════ */
function filteredShops(){
  const q = $('q').value.trim().toLowerCase();
  return shops.filter(s => (prefs.prov === 'all' || s.prov === prefs.prov) && (!q || s._q.indexOf(q) >= 0));
}
let updTimer = null;
function update(){ clearTimeout(updTimer); updTimer = setTimeout(doUpdate, 30); }
function doUpdate(){
  if (!shops.length) {
    if (me) renderMsg([], []);
    return;
  }
  if (!me) { styleMarkers(new Set()); renderNearIcons([]); return; }
  const list = filteredShops();
  list.forEach(s => s._d = haversine(me.lat, me.lng, s.lat, s.lng));
  list.sort((a, b) => a._d - b._d);
  const inR = list.filter(s => s._d <= prefs.radius);
  lastResult = inR.length ? inR : list.slice(0, NEAREST_FALLBACK);
  const iconShops = inR.slice(0, MAX_NEAR_ICONS);
  styleMarkers(new Set(inR.map(s => s.id)), new Set(iconShops.map(s => s.id)));
  renderNearIcons(iconShops);
  renderMsg(inR, list);
  renderList(inR.length > 0);
  checkVeryNear(list);
}
function renderMsg(inR, list){
  const el = $('msg');
  const t = me ? formatThaiTime(me.ts) : '';
  const accTxt = me.manual ? '📌 ตำแหน่งจากการปักหมุด' : ('ความแม่นยำ ±' + Math.round(me.acc || 0) + ' ม.');
  const sub = '<div class="m-sub">' + accTxt + ' · อัปเดต ' + t + ' น.</div>';
  if (!shops.length) {
    el.className = 'msg'; el.innerHTML = '<div class="m-title">ได้ตำแหน่งแล้ว — กำลังโหลดข้อมูลร้านค้า...</div>' + sub; return;
  }
  const n = list[0];
  const provTxt = prefs.prov === 'all' ? '' : ' (จ.' + prefs.prov + ')';
  const nearHtml = n ? '<div class="m-near" onclick="selectShop(' + n.id + ', true)">' +
      '<div class="dist">' + fmtDist(n._d) + '</div>' +
      '<div style="min-width:0"><div style="font-size:11px;opacity:.75">ร้านที่ใกล้ที่สุด · ' + bearingTh(me.lat, me.lng, n.lat, n.lng) + '</div>' +
      '<div class="nm">' + esc(n.name) + '</div></div></div>' : '';
  if (inR.length) {
    el.className = 'msg';
    el.innerHTML = '<div class="m-title">📍 คุณอยู่ใกล้ร้านค้า <b>' + fmtNum(inR.length) + ' ร้าน</b><br><span style="font-size:14px;font-weight:500">ในรัศมี ' + fmtDist(prefs.radius) + provTxt + '</span></div>' + sub + nearHtml;
  } else if (n) {
    el.className = 'msg warn';
    el.innerHTML = '<div class="m-title">ไม่มีร้านค้าในรัศมี ' + fmtDist(prefs.radius) + provTxt + '</div>' +
      '<div class="m-sub">แสดงร้านที่ใกล้ที่สุด ' + Math.min(NEAREST_FALLBACK, list.length) + ' ร้านแทน</div>' + sub + nearHtml;
  } else {
    el.className = 'msg warn';
    el.innerHTML = '<div class="m-title">ไม่พบร้านค้าตามเงื่อนไขที่เลือก</div>' + sub;
  }
}
function renderList(inRadius){
  const box = $('list');
  $('listTitle').textContent = inRadius ? 'ร้านในรัศมี ' + fmtDist(prefs.radius) : 'ร้านที่ใกล้ที่สุด';
  $('listCount').textContent = fmtNum(lastResult.length) + ' ร้าน';
  if (!lastResult.length) { box.innerHTML = '<div class="empty">ไม่พบร้านค้า</div>'; return; }
  const rows = lastResult.slice(0, shown).map((s, i) => {
    const tel = firstPhone(s.phone);
    const tags = [];
    tags.push('<span class="badge badge-gold">' + esc(s.prov) + '</span>');
    if (s.type) tags.push('<span class="badge badge-info">' + esc(s.type) + '</span>');
    if (s.route) tags.push('<span class="badge badge-gold">🚚 ' + esc(s.route) + (s.routeArea ? ' · ' + esc(s.routeArea) : '') + '</span>');
    if (s.pending) tags.push('<span class="badge badge-warn">รออนุมัติ</span>');
    return '<div class="shop' + (s._d <= VERY_NEAR ? ' very' : '') + (s.id === selectedId ? ' sel' : '') + '" data-id="' + s.id + '" onclick="selectShop(' + s.id + ', true)">' +
      '<div class="rank">' + (i+1) + '</div>' +
      '<div class="info"><div class="nm">' + esc(s.name) + '</div>' +
      '<div class="addr">' + (s.code ? 'รหัส ' + esc(s.code) + ' · ' : '') + esc(s.addr) + '</div>' +
      (s.sales.length ? '<div class="addr">👤 ' + esc(s.sales.join(', ')) + (s.wh.length ? ' · ' + esc(s.wh.join('/')) : '') + '</div>' : '') +
      '<div class="tags">' + tags.join('') + '</div>' +
      '<div class="acts"><a class="btn btn-gold btn-sm" target="_blank" rel="noopener" href="' + navUrl(s) + '" onclick="event.stopPropagation()">🧭 นำทาง</a>' +
      (tel ? '<a class="btn btn-outline btn-sm" href="tel:' + tel + '" onclick="event.stopPropagation()">📞 ' + esc(tel) + '</a>' : '') + '</div></div>' +
      '<div class="d"><div class="km">' + fmtDist(s._d) + '</div><div class="dir">' + bearingTh(me.lat, me.lng, s.lat, s.lng) + '</div></div>' +
    '</div>';
  });
  if (lastResult.length > shown) rows.push('<div class="more"><button class="btn btn-outline btn-sm" onclick="shown+=PAGE;renderList(' + inRadius + ')">แสดงเพิ่ม (' + fmtNum(lastResult.length - shown) + ')</button></div>');
  box.innerHTML = rows.join('');
}
function selectShop(id, fromList){
  const s = shops.find(x => x.id === id); if (!s) return;
  selectedId = id;
  document.querySelectorAll('.shop.sel').forEach(e => e.classList.remove('sel'));
  const row = document.querySelector('.shop[data-id="' + id + '"]');
  if (row) { row.classList.add('sel'); if (!fromList) row.scrollIntoView({behavior:'smooth', block:'nearest'}); }
  const d = me ? haversine(me.lat, me.lng, s.lat, s.lng) : null;
  if (fromList) {
    map.setView([s.lat, s.lng], Math.max(map.getZoom(), 16));
    if (window.innerWidth < 1024) $('map').scrollIntoView({behavior:'smooth', block:'center'});
  }
  L.popup({offset:[0,-4]}).setLatLng([s.lat, s.lng]).setContent(shopPopup(s, d)).openOn(map);
}

/* ════════ แจ้งเตือนเมื่อเข้าใกล้ร้าน ════════ */
let alertTimer = null;
function checkVeryNear(list){
  if (!me || me.manual) return;
  const hit = list.find(s => s._d <= VERY_NEAR && !alerted.has(s.id));
  if (!hit) return;
  list.filter(s => s._d <= VERY_NEAR).forEach(s => alerted.add(s.id));
  alertShopId = hit.id;
  $('nearAlertName').textContent = hit.name;
  $('nearAlertSub').textContent = 'ห่าง ' + fmtDist(hit._d) + ' · ' + bearingTh(me.lat, me.lng, hit.lat, hit.lng) + ' · แตะเพื่อดู';
  $('nearAlert').classList.add('show');
  if (navigator.vibrate) { try { navigator.vibrate([150, 80, 150]); } catch(e){} }
  clearTimeout(alertTimer); alertTimer = setTimeout(() => $('nearAlert').classList.remove('show'), 8000);
}
function onAlertClick(){
  $('nearAlert').classList.remove('show');
  if (alertShopId) selectShop(alertShopId, true);
}

/* ════════ Controls ════════ */
function renderRadiusChips(){
  $('radiusChips').innerHTML = RADII.map(r => '<button class="chip' + (r === prefs.radius ? ' on' : '') + '" onclick="setRadius(' + r + ')">' + fmtDist(r) + '</button>').join('');
}
function renderProvChips(){
  const cnt = {all: shops.length}; PROVINCES.forEach(p => cnt[p] = 0);
  shops.forEach(s => cnt[s.prov]++);
  const opts = [['all','ทั้ง 3 จังหวัด']].concat(PROVINCES.map(p => [p, p]));
  $('provChips').innerHTML = opts.map(o => '<button class="chip' + (o[0] === prefs.prov ? ' on' : '') + '" onclick="setProv(\'' + o[0] + '\')">' + o[1] + '<span class="n">' + fmtNum(cnt[o[0]] || 0) + '</span></button>').join('');
}
function setRadius(r){ prefs.radius = r; savePrefs(); shown = PAGE; renderRadiusChips(); if (radiusCircle) radiusCircle.setRadius(r); update(); if (me) centerMe(); }
function setProv(p){ prefs.prov = p; savePrefs(); shown = PAGE; renderProvChips(); update(); }
let searchTimer = null;
function onSearch(){ clearTimeout(searchTimer); searchTimer = setTimeout(() => { shown = PAGE; update(); }, 200); }
function toggleDark(){
  prefs.dark = !document.body.classList.contains('dark'); savePrefs();
  document.body.classList.toggle('dark', prefs.dark);
  $('btnDark').textContent = prefs.dark ? '☀️' : '🌙';
}
window.addEventListener('scroll', () => $('backToTop').classList.toggle('show', window.scrollY > 300));

/* ════════ Boot ════════ */
(function init(){
  if (prefs.dark) { document.body.classList.add('dark'); $('btnDark').textContent = '☀️'; }
  if (RADII.indexOf(prefs.radius) < 0) prefs.radius = 1000;
  renderRadiusChips();
  renderProvChips();
  renderLiveBtn();
  let cached = null;
  try { cached = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null'); } catch(e){}
  if (cached && cached.data && cached.data.shops) applyData(cached.data, cached.ts);
  loadData(!cached);   // มีแคช → โหลดใหม่เบื้องหลัง ไม่มี spinner
  startGeo();
})();
</script>
