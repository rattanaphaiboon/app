<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>R-Flow — ติดตามงานทีม v2.17</title>
<link rel="icon" type="image/png" href="r-flow-icon.png">
<link rel="manifest" href="r-flow.webmanifest">
<link rel="apple-touch-icon" href="r-flow-icon.png">
<meta name="theme-color" content="#1E3A8A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="R-Flow">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{
--bg:#F4F6F8;--surface:#FFFFFF;--surface2:#EDF0F4;--border:#E2E6EB;--text:#1A242E;--muted:#65717F;
--accent:#1E3A8A;--accent-soft:#E8EDF9;--accent-ink:#16266B;--accent-glow:rgba(30,58,138,.45);
--blue:#2264D1;--blue-soft:#E7EEFA;--amber:#A85B08;--amber-soft:#FAEEDC;--green:#1B8A4C;--green-soft:#E3F3E9;--red:#D23B2E;--red-soft:#FBE8E5;--slate:#64707E;--slate-soft:#ECEFF2;
--shadow:0 1px 2px rgba(18,28,38,.05),0 3px 10px rgba(18,28,38,.06);
--shadow-lg:0 12px 48px rgba(12,20,28,.24);
}
body.dark{
--bg:#0E1316;--surface:#161C21;--surface2:#1E252C;--border:#29323B;--text:#E9EEF3;--muted:#93A0AE;
--accent-soft:#17244A;--accent-ink:#94AEE8;
--blue:#7FAEF2;--blue-soft:#1C2B44;--amber:#E5A85D;--amber-soft:#342917;--green:#5FCB8E;--green-soft:#173321;--red:#F08376;--red-soft:#3B201C;--slate:#9AA7B5;--slate-soft:#242D35;
--shadow:0 1px 2px rgba(0,0,0,.35),0 3px 10px rgba(0,0,0,.28);
--shadow-lg:0 12px 48px rgba(0,0,0,.6);
}
*{-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'IBM Plex Sans Thai','Noto Sans Thai',sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:inherit;color:inherit}
input,textarea,select{font-family:inherit;color:var(--text)}
input::placeholder,textarea::placeholder{color:var(--muted)}
@keyframes shimmer{0%{background-position:120% 0}100%{background-position:-120% 0}}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes panelIn{from{transform:translateX(48px);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,14px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes popIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── shell ── */
.rf-shell{min-height:100vh;min-height:100dvh;display:flex;align-items:stretch;background:var(--bg)}
.rf-main{flex:1;min-width:0;display:flex;flex-direction:column}
.rf-content{flex:1;padding:clamp(14px,2.5vw,26px);width:100%;max-width:1480px;margin:0 auto;box-sizing:border-box}
.rf-view{display:flex;flex-direction:column;gap:16px;animation:fadeUp .3s ease-out}
h1.rf-h1{margin:0;font-size:clamp(20px,2.4vw,25px);font-weight:700}
.rf-sub{color:var(--muted);font-size:14px;margin-top:2px}

/* ── sidebar (desktop) ── */
.rf-side{width:242px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);position:sticky;top:0;height:100vh;height:100dvh;display:flex;flex-direction:column}
.rf-logo-row{display:flex;align-items:center;gap:10px;padding:18px 16px 14px 16px}
.rf-logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent-ink));color:#fff;font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.rf-logo-name{font-size:16px;font-weight:700;line-height:1.2}
.rf-logo-sub{font-size:12.5px;color:var(--muted);line-height:1.2}
.rf-ver{font-size:11px;font-weight:700;color:var(--accent-ink);background:var(--accent-soft);border-radius:99px;padding:1px 8px;margin-left:auto}
.rf-nav{display:flex;flex-direction:column;gap:2px;padding:6px 10px}
.rf-navbtn{display:flex;align-items:center;gap:11px;min-height:42px;padding:0 12px;border-radius:10px;border:none;cursor:pointer;text-align:left;font-size:14px;font-weight:600;background:transparent;color:var(--muted)}
.rf-navbtn:hover{background:var(--surface2)}
.rf-navbtn.on{background:var(--accent-soft);color:var(--accent-ink)}
.rf-memhead{display:flex;align-items:center;justify-content:space-between;padding:10px 10px 0 10px}
.rf-memtog{display:flex;align-items:center;gap:7px;min-height:36px;padding:0 8px;border:none;border-radius:9px;background:none;color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;flex:1;text-align:left}
.rf-memtog:hover{background:var(--surface2)}
.rf-memtog svg{transition:transform .18s}
.rf-clearf{border:none;background:none;color:var(--accent-ink);font-size:13px;font-weight:600;cursor:pointer;padding:2px 8px}
.rf-memlist{display:flex;flex-direction:column;gap:2px;padding:2px 10px;overflow-y:auto;flex:1}
.rf-membtn{display:flex;align-items:center;gap:10px;min-height:40px;padding:0 12px;border-radius:10px;border:none;cursor:pointer;text-align:left;background:transparent;color:var(--text)}
.rf-membtn:hover{background:var(--surface2)}
.rf-membtn.on{background:var(--accent-soft)}
.rf-membtn .n{flex:1;font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rf-membtn .c{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.rf-sidefoot{padding:12px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:8px}
.rf-darkbtn{display:flex;align-items:center;gap:10px;min-height:40px;padding:0 12px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--muted);font-size:14px;font-weight:500;cursor:pointer}
.rf-darkbtn:hover{background:var(--surface2)}
.rf-me{display:flex;align-items:center;gap:10px;padding:4px 6px}
.rf-me .nm{font-size:14px;font-weight:600;line-height:1.25}
.rf-me .dp{font-size:12.5px;color:var(--muted);line-height:1.25}
.rf-out{margin-left:auto;width:32px;height:32px;border:none;border-radius:9px;background:none;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center}
.rf-out:hover{background:var(--surface2);color:var(--red)}

/* ── header ── */
.rf-head{position:sticky;top:0;z-index:40;background:rgba(244,246,248,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--border);padding:10px clamp(14px,2.5vw,24px);padding-top:calc(10px + env(safe-area-inset-top));display:flex;align-items:center;gap:10px}
body.dark .rf-head{background:rgba(14,19,22,.82)}
.rf-head .mlogo{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent-ink));color:#fff;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.rf-loginlogo img,.rf-logo img,.rf-head .mlogo img{width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block}
.rf-search{position:relative;flex:1;max-width:560px}
.rf-search>svg{position:absolute;left:13px;top:50%;transform:translateY(-50%)}
.rf-search input{width:100%;box-sizing:border-box;height:44px;padding:0 38px 0 38px;border-radius:12px;border:1px solid var(--border);background:var(--surface);font-size:15px;outline:none}
.rf-search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.rf-qx{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:32px;height:32px;border:none;border-radius:50%;background:var(--surface2);color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center}
.rf-qdrop{position:absolute;left:0;right:0;top:52px;background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-lg);overflow:hidden;z-index:50;animation:fadeUp .16s ease-out}
.rf-qrow{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:8px 14px;border:none;background:none;cursor:pointer;text-align:left;border-bottom:1px solid var(--border);box-sizing:border-box}
.rf-qrow:hover{background:var(--surface2)}
.rf-iconbtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--border);background:var(--surface);color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.rf-iconbtn:hover{background:var(--surface2)}
.rf-newbtn{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 18px;border-radius:12px;border:none;background:var(--accent);color:#fff;font-size:14.5px;font-weight:600;cursor:pointer;box-shadow:var(--shadow)}
.rf-newbtn:hover{filter:brightness(1.08)}
.rf-newbtn:active{transform:scale(.97)}

/* ── cards / common ── */
.rf-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px;box-shadow:var(--shadow)}
.rf-card-t{font-size:15.5px;font-weight:700;margin-bottom:12px}
.rf-av{border-radius:50%;color:#fff;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-sizing:border-box;position:relative;overflow:hidden}
.rf-av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.rf-av.none{background:transparent!important;color:var(--muted);border:1.5px dashed var(--muted)}
.rf-linebtn{display:flex;align-items:center;justify-content:center;gap:7px;flex:1;min-height:42px;border-radius:11px;border:none;background:#06C755;color:#fff;font-size:14px;font-weight:700;cursor:pointer}
.rf-linebtn:active{transform:scale(.97)}
.rf-cancelbtn{display:flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:0 14px;border-radius:11px;border:1.5px solid var(--red);background:var(--red-soft);color:var(--red);font-size:13.5px;font-weight:700;cursor:pointer}
.rf-cancelbtn:active{transform:scale(.97)}
.rf-imgprev{display:flex;align-items:center;gap:10px;background:var(--surface2);border:1px solid var(--border);border-radius:11px;padding:6px 8px}
.rf-imgprev img{width:44px;height:44px;object-fit:cover;border-radius:8px;display:block}
.rf-cancelnote{background:var(--slate-soft);border-radius:12px;padding:10px 14px;font-size:13.5px;font-weight:600;color:var(--muted)}
.rf-minebtn{display:flex;align-items:center;gap:7px;min-height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--border);background:var(--surface);color:var(--muted);font-size:13.5px;font-weight:600;cursor:pointer;flex-shrink:0;white-space:nowrap}
.rf-minebtn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.rf-perfbtn{display:flex;align-items:center;gap:8px;min-height:40px;padding:4px 15px 4px 5px;border-radius:99px;border:1px solid var(--border);background:var(--surface);cursor:pointer;font-size:14px;font-weight:700;color:var(--text);flex-shrink:0;box-shadow:var(--shadow);max-width:100%}
.rf-perfbtn span{max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rf-perfbtn:hover{background:var(--surface2);border-color:var(--accent);color:var(--accent-ink)}
.rf-perfbtn:active{transform:scale(.97)}
.rf-perfstat{background:var(--surface2);border-radius:12px;padding:10px 12px}
.rf-perfstat .v{font-size:22px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.rf-perfstat .l{font-size:12px;color:var(--muted);margin-top:2px}
.rf-perfsec{font-size:13px;font-weight:700;color:var(--muted);margin:16px 4px 5px}
.rf-perfbars{display:flex;align-items:flex-end;gap:8px;height:86px;margin-top:8px}
.rf-perfbar{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;height:100%;justify-content:flex-end}
.rf-perfbar .bar{width:100%;max-width:30px;border-radius:5px 5px 2px 2px;transition:height .5s cubic-bezier(.22,1,.36,1)}
.rf-cl-item{display:flex;align-items:center;gap:10px;min-height:36px;padding:2px 0;transition:transform .13s ease}
.rf-cl-item.rf-cl-dragging{transition:none;background:var(--surface);border-radius:9px;box-shadow:0 7px 22px rgba(0,0,0,.22);position:relative;z-index:5;padding:2px 6px}
.rf-cl-box{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--border);background:var(--surface);cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;padding:0;transition:background .12s,border-color .12s}
.rf-cl-box.on{background:var(--green);border-color:var(--green)}
.rf-cl-box:disabled{cursor:default;opacity:.7}
.rf-cl-drag{width:30px;height:36px;border:none;background:none;color:var(--muted);cursor:grab;display:flex;align-items:center;justify-content:center;flex-shrink:0;border-radius:6px;padding:0;touch-action:none;opacity:.55;-webkit-user-select:none;user-select:none}
.rf-cl-drag:hover{background:var(--surface2);color:var(--text);opacity:1}
.rf-cl-drag:active{cursor:grabbing;opacity:1}
.rf-cl-mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.rf-cl-t{font-size:14.5px;line-height:1.5;min-width:0;word-break:break-word}
.rf-cl-t.done{color:var(--muted);text-decoration:line-through}
.rf-cl-ts{font-size:11px;color:var(--muted);opacity:.75;line-height:1.3}
.rf-cl-ts.done{color:var(--green);opacity:.95;display:flex;align-items:center;gap:3px}
.rf-cl-ts.done svg{flex-shrink:0}
.rf-cl-del{width:28px;height:28px;border:none;border-radius:8px;background:none;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;opacity:.55}
.rf-cl-del:hover{background:var(--red-soft);color:var(--red);opacity:1}
.rf-sysline{text-align:center;font-size:12.5px;color:var(--muted);padding:1px 8px;line-height:1.55}
.rf-revbanner{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:10px 16px;border-radius:14px;border:1.5px solid var(--amber);background:var(--amber-soft);color:var(--amber);font-size:14.5px;font-weight:700;cursor:pointer;text-align:left;box-sizing:border-box}
.rf-revbanner:active{transform:scale(.99)}
.rf-duechip{font-size:13px;font-weight:600;padding:3px 9px;border-radius:8px;white-space:nowrap}
.rf-row{display:flex;align-items:center;gap:11px;min-height:52px;padding:8px;border:none;border-radius:10px;background:none;cursor:pointer;text-align:left;width:100%;box-sizing:border-box}
.rf-row:hover{background:var(--surface2)}
.rf-row .t1{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rf-row .t2{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rf-viewall{margin-top:8px;min-height:42px;width:100%;border-radius:11px;border:1.5px dashed var(--border);background:none;color:var(--accent-ink);font-size:13.5px;font-weight:700;cursor:pointer}
.rf-viewall:hover{background:var(--accent-soft);border-color:var(--accent)}
.rf-empty{text-align:center;padding:28px 12px;color:var(--muted);font-size:14px}
.rf-skel{border-radius:14px;background:linear-gradient(90deg,var(--surface2) 25%,var(--border) 37%,var(--surface2) 63%);background-size:300% 100%;animation:shimmer 1.3s infinite}
.rf-banner{display:inline-flex;align-items:center;gap:8px;background:var(--accent-soft);color:var(--accent-ink);border:1px solid var(--accent);border-radius:999px;padding:6px 8px 6px 14px;font-size:13.5px;font-weight:600}
.rf-banner button{width:22px;height:22px;border:none;border-radius:50%;background:var(--accent);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}

/* ── dashboard ── */
.rf-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.rf-stat{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;box-shadow:var(--shadow)}
.rf-stat .l{font-size:13px;font-weight:600;color:var(--muted)}
.rf-stat .v{font-size:30px;font-weight:700;line-height:1.25;font-variant-numeric:tabular-nums}
.rf-stat .s{font-size:13px;color:var(--muted)}
.rf-dashgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:14px;align-items:stretch}
.rf-dashcol{display:flex;flex-direction:column;gap:14px;min-width:0}
.rf-wlgroup{border:1px solid var(--border);border-radius:12px;overflow:hidden}
.rf-wlhead{display:flex;align-items:center;gap:10px;min-height:52px;padding:8px 12px;border:none;background:none;cursor:pointer;text-align:left;width:100%;box-sizing:border-box}
.rf-wlhead:hover{background:var(--surface2)}
.rf-wlhead svg{transition:transform .18s;flex-shrink:0}
.rf-bar{position:relative;height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.rf-bar>div{position:absolute;left:0;top:0;bottom:0;border-radius:99px;transition:width .6s cubic-bezier(.22,1,.36,1)}
.rf-wlrow{display:flex;align-items:center;gap:12px;min-height:46px;padding:6px 8px;border:none;border-radius:10px;background:none;cursor:pointer;text-align:left;width:100%;box-sizing:border-box}
.rf-wlrow:hover{background:var(--surface2)}
.rf-feedrow{display:flex;align-items:flex-start;gap:11px;padding:10px 8px;border:none;border-radius:10px;background:none;cursor:pointer;text-align:left;width:100%;min-height:52px;box-sizing:border-box}
.rf-feedrow:hover{background:var(--surface2)}
.rf-bars7{display:flex;align-items:flex-end;gap:6px;height:112px;margin-top:10px}
.rf-bars7 .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;height:100%;justify-content:flex-end}
.rf-bars7 .bar{width:100%;max-width:26px;border-radius:6px 6px 3px 3px;transition:height .5s cubic-bezier(.22,1,.36,1)}
.rf-barcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;height:100%;justify-content:flex-end;border:none;background:none;cursor:pointer;padding:0}
.rf-barcol .bar{width:100%;max-width:26px;border-radius:6px 6px 3px 3px;transition:height .5s cubic-bezier(.22,1,.36,1)}
.rf-barcol:hover .bar{filter:brightness(1.12)}
.rf-legrow{display:flex;align-items:center;gap:9px;border:none;background:none;cursor:pointer;padding:5px 6px;border-radius:9px;width:100%;min-height:42px}
.rf-legrow:hover{background:var(--surface2)}
.rf-cardex-tog{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;margin-top:9px;padding:6px 0 2px 0;border:none;border-top:1px solid var(--border);background:none;color:var(--muted);font-size:12.5px;font-weight:600;cursor:pointer}
.rf-cardex-tog svg{transition:transform .18s}
.rf-cardex{margin-top:7px;display:flex;flex-direction:column;gap:8px;animation:fadeUp .18s ease-out}
.rf-cardcl{display:flex;flex-direction:column;gap:3px}
.rf-cardcl-i{display:flex;align-items:center;gap:7px;font-size:13px}
.rf-cardcl-b{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;padding:0;cursor:pointer}
.rf-cardcl-b.on{background:var(--green);border-color:var(--green)}
.rf-cardcl-i .done{color:var(--muted);text-decoration:line-through}
.rf-cardbc{display:flex;align-items:flex-start;gap:8px;background:var(--surface2);border-radius:10px;padding:8px 10px}
.rf-cardbc .nm{font-size:12px;font-weight:700;color:var(--accent-ink)}
.rf-cardbc .tx{font-size:13px;line-height:1.45;margin-top:1px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

/* ── board ── */
.rf-board-pc{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
.rf-col{background:var(--surface2);border-radius:14px;padding:10px;outline:2px dashed transparent;outline-offset:-2px;transition:outline-color .15s;min-height:220px;min-width:0}
.rf-col.over{outline-color:var(--accent)}
.rf-colhead{display:flex;align-items:center;gap:8px;padding:4px 6px 10px 6px}
.rf-colhead .dot{width:9px;height:9px;border-radius:50%}
.rf-colhead .lb{font-size:14px;font-weight:700}
.rf-colhead .ct{font-size:13px;font-weight:600;color:var(--muted);background:var(--surface);border-radius:99px;padding:1px 8px}

/* ── date helpers (Asia/Bangkok) ── */
function todayIso(){ return new Date().toLocaleDateString('en-CA', { timeZone:'Asia/Bangkok' }); }
function pd(s){ const p = String(s).slice(0,10).split('-').map(Number); return new Date(p[0], p[1]-1, p[2]); }
function isoOf(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function addDays(iso, n){ const d = pd(iso); d.setDate(d.getDate()+n); return isoOf(d); }
function weekStartOf(iso){ const d = pd(iso); d.setDate(d.getDate()-d.getDay()); return isoOf(d); }
function diffDays(iso){ return Math.round((pd(iso) - pd(todayIso())) / 864e5); }
function fmtShort(iso){ const d = pd(iso); return d.getDate() + ' ' + MON[d.getMonth()]; }
function fmtYmd(iso){ return iso ? String(iso).slice(0, 10).replace(/-/g, '/') : ''; }   // 2026-07-24 → 2026/07/24 (แพทเทิร์นวันที่ทั้งแอป)
function tsDateIso(ts){ try { return new Date(ts).toLocaleDateString('en-CA', { timeZone:'Asia/Bangkok' }); } catch(e){ return ''; } }
function tsTime(ts){ try { return new Date(ts).toLocaleTimeString('th-TH', { hour:'2-digit', minute:'2-digit', timeZone:'Asia/Bangkok' }); } catch(e){ return ''; } }
function timeLabel(ts){
  const dIso = tsDateIso(ts); if (!dIso) return '';
  const dd = Math.round((pd(dIso) - pd(todayIso())) / 864e5);
  if (dd === 0) return 'วันนี้ ' + tsTime(ts);
  if (dd === -1) return 'เมื่อวาน ' + tsTime(ts);
  return fmtYmd(dIso) + ' ' + tsTime(ts);
}

/* ── misc helpers ── */
function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function jsq(s){ return String(s == null ? '' : s).replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }
function hashColor(key){ let h = 0; const s = String(key||'?'); for (let i = 0; i < s.length; i++) h = (h*31 + s.charCodeAt(i)) >>> 0; return AVC[h % AVC.length]; }
function stOf(t){ return SL[t.status] ? t.status : 'todo'; }
function firstChar(s){ return String(s||'?').trim().charAt(0) || '?'; }

function userByEmail(em){ em = String(em||'').toLowerCase(); return em ? S.users.find(u => u.email === em) : null; }
function userByName(n){ n = String(n||'').trim(); return n ? S.users.find(u => u.name === n || u.nickname === n) : null; }
function prepUser(u){
  const nick = u.nickname || String(u.name||u.email).split(' ')[0];
  return Object.assign({}, u, { nickname: nick, dept: u.dept || 'ไม่ระบุแผนก', color: hashColor(u.email), photo: u.photo || '' });
}
/* ชื่อที่แสดง: ชื่อจริง สกุล (ชื่อเล่น) */
function dispName(u){
  if (!u) return '';
  return u.name + (u.nickname && u.nickname !== u.name && u.name.indexOf(u.nickname) < 0 ? ' (' + u.nickname + ')' : '');
}
/* คนที่เกี่ยวข้องกับงาน (ผู้รับผิดชอบ) — ใช้ทำ sidebar filter / workload / ทีม */
function teamUsers(){
  const used = {};
  S.tasks.forEach(t => { const u = taskUser(t); if (u && u.email) used[u.email] = true; });
  return S.users.filter(u => used[u.email]);
}
/* หา user ของงาน: email ก่อน → ชื่อ (งาน migrate เก่าอาจมีแต่ชื่อ) */
function taskUser(t){ return userByEmail(t.assigneeEmail) || userByName(t.assigneeName) || null; }

/* checklist: JSON string → [{t,d}] */
function parseCl(t){
  try {
    const a = JSON.parse(t.checklist || '[]');
    return Array.isArray(a) ? a.filter(i => i && i.t != null) : [];
  } catch(e){ return []; }
}
function dueMeta(t){
  const st = stOf(t);
  if (st === 'cancelled') return { dateText: t.dueDate ? fmtYmd(t.dueDate) : '—', bg:'var(--slate-soft)', fg:'var(--muted)', tip: fmtYmd(t.dueDate), badge:'ยกเลิกแล้ว', urg:5, sort:3e9 };
  if (!t.dueDate) return { dateText:'ไม่มีกำหนด', bg:'var(--slate-soft)', fg:'var(--muted)', tip:'ยังไม่กำหนดวันส่ง', badge:null, urg:3, sort:1e9 };
  const d = diffDays(t.dueDate), ds = fmtYmd(t.dueDate);
  if (st === 'done') return { dateText:ds, bg:'var(--green-soft)', fg:'var(--green)', tip:t.dueDate, badge:'เสร็จแล้ว', urg:4, sort:2e9 };
  if (d < 0) return { dateText:ds, bg:'var(--red-soft)', fg:'var(--red)', tip:t.dueDate, badge:'เลยกำหนด ' + (-d) + ' วัน', urg:0, sort:d };
  if (d === 0) return { dateText:'วันนี้', bg:'var(--amber-soft)', fg:'var(--amber)', tip:t.dueDate, badge:'ครบกำหนดวันนี้', urg:1, sort:0 };
  if (d <= 3) return { dateText:ds, bg:'var(--amber-soft)', fg:'var(--amber)', tip:t.dueDate, badge:'เหลือ ' + d + ' วัน', urg:1, sort:d };
  return { dateText:ds, bg:'var(--slate-soft)', fg:'var(--muted)', tip:t.dueDate, badge:null, urg:2, sort:d };
}
function decorate(t){
  const u = taskUser(t);
  const dm = dueMeta(t);
  const cc = S.comments.filter(c => c.taskId === t.id && c.type !== 'system').length;
  const cl = parseCl(t);
  const rawName = u ? dispName(u) : (t.assigneeName || '');
  return {
    id: t.id, title: t.title, detail: t.detail || '—', status: stOf(t), statusLabel: SL[stOf(t)], dueIso: t.dueDate || '',
    u, avName: rawName || 'ยังไม่มอบหมาย', avInit: u ? firstChar(u.nickname) : (rawName ? firstChar(rawName) : '?'),
    avColor: u ? u.color : (rawName ? hashColor(rawName) : ''),
    avPhoto: u ? u.photo : '',
    noAv: !rawName, dept: u ? u.dept : '', warehouse: u ? (u.warehouse || '') : '',
    prioColor: PC[t.priority] || PC.med, prioLabel: PL[t.priority] || PL.med,
    dueText: dm.dateText, dueBg: dm.bg, dueFg: dm.fg, dueTip: dm.tip, badge: dm.badge || '', hasBadge: !!dm.badge,
    cc, urg: dm.urg, sort: dm.sort,
    clTotal: cl.length, clDone: cl.filter(i => i.d).length,
    priv: isPrivate(t)
  };
}
function sortL(a){ return a.slice().sort((x,y) => (x.urg - y.urg) || (x.sort - y.sort)); }
function allDec(){ return S.tasks.map(decorate); }
function fDec(){
  const dec = allDec();
  if (!S.memberFilter) return dec;
  return dec.filter(d => d.u && d.u.email === S.memberFilter);
}
function isInvolved(t){
  if (!S.me) return false;
  const em = S.me.email;
  return String(t.assigneeEmail||'').toLowerCase() === em || String(t.reporterEmail||'').toLowerCase() === em || String(t.createdBy||'').toLowerCase() === em;
}
function canEdit(t){
  if (!S.me) return false;
  if (S.me.role >= 5) return true;
  return isInvolved(t);
}
function isPrivate(t){ return String(t.private||'').trim().toUpperCase() === 'Y'; } // 'Y' = งานเฉพาะทีม (คลังเดียวกัน)
// คอมเม้น: หัวหน้า R5+ ได้ทุกงานที่เห็น · เจ้าของงานคอมเม้นงานตัวเองได้ · คนอื่นดูอย่างเดียว
function canComment(t){
  if (!S.me) return false;
  if (S.me.role >= 5) return true;
  return isInvolved(t);
}

/* ── avatar html (รูปจริงจาก Users Sheet ถ้ามี · โหลดไม่ได้ fallback ตัวอักษร) ── */
function avCore(init, color, photo, size){
  const fs = Math.round(size * 0.48);
  const img = photo ? '<img src="' + esc(photo) + '" alt="" loading="lazy" onerror="this.remove()">' : '';
  return '<div class="rf-av" style="width:' + size + 'px;height:' + size + 'px;font-size:' + fs + 'px;background:' + color + '">' + esc(init) + img + '</div>';
}
function avHtml(d, size){
  const fs = Math.round(size * 0.48);
  if (d.noAv) return '<div class="rf-av none" style="width:' + size + 'px;height:' + size + 'px;font-size:' + fs + 'px">?</div>';
  return avCore(d.avInit, d.avColor, d.avPhoto, size);
}
function avUserHtml(u, size){
  return avCore(firstChar(u.nickname), u.color, u.photo, size);
}

/* ── API ── */
async function api(action, payload){
  const body = Object.assign({ action: action, email: S.me ? S.me.email : (SESSION.email || '') }, payload || {});
  const res = await fetch(CFG.exec, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
  if (!res.ok) throw new Error('เชื่อมต่อไม่สำเร็จ (HTTP ' + res.status + ')');
  const j = await res.json();
  if (!j.ok) throw new Error(j.error || 'ไม่ทราบสาเหตุ');
  return j;
}

function clearSession(){ SESSION = {}; try { localStorage.removeItem('rf_session'); localStorage.removeItem('rf_cache'); } catch(e){} }

/* ── boot cache — เปิดแอปติดทันทีด้วยข้อมูลรอบก่อน แล้ว sync ของจริงเบื้องหลัง (list ใช้ ~3 วิ) ── */
function saveCache(){ try { localStorage.setItem('rf_cache', JSON.stringify({ email: S.me.email, me: S.me, users: S.users, tasks: S.tasks, comments: S.comments })); } catch(e){} }
function loadCache(){
  try {
    const c = JSON.parse(localStorage.getItem('rf_cache') || 'null');
    if (!c || !c.me || c.email !== SESSION.email) return false;
    S.me = c.me; S.users = c.users || []; S.tasks = c.tasks || []; S.comments = c.comments || [];
    return true;
  } catch(e){ return false; }
}

function parseJwt(tok){
  const b = tok.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');
  const s = atob(b);
  return JSON.parse(decodeURIComponent(Array.prototype.map.call(s, c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join('')));
}
function initGsi(){
  if (!(window.google && google.accounts && google.accounts.id)) { setTimeout(initGsi, 250); return; }
  google.accounts.id.initialize({ client_id: CFG.clientId, callback: onCredential });
  const holder = document.getElementById('gsiBtn');
  if (holder) google.accounts.id.renderButton(holder, { theme:'outline', size:'large', shape:'pill', text:'signin_with', locale:'th' });
}
function onCredential(resp){
  let p = null;
  try { p = parseJwt(resp.credential); } catch(e){}
  if (!p || !p.email) { showLoginErr('อ่านข้อมูลบัญชี Google ไม่สำเร็จ ลองใหม่อีกครั้ง'); return; }
  SESSION = { email: String(p.email).toLowerCase(), name: p.name || '' };
  document.getElementById('gsiBtn').style.display = 'none';
  document.getElementById('loginSpin').style.display = 'block';
  document.getElementById('loginErr').style.display = 'none';
  loadAll(false);
}
function showLoginErr(msg){
  showLogin();
  const el = document.getElementById('loginErr');
  el.textContent = msg; el.style.display = 'block';
  document.getElementById('gsiBtn').style.display = 'flex';
  document.getElementById('loginSpin').style.display = 'none';
}
function showLogin(){
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('app').style.display = 'none';
  document.getElementById('overlays').innerHTML = '';
}
function showApp(){
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
}
function logout(){
  clearSession(); S.me = null; S.tasks = []; S.comments = []; S.users = []; S.menuOpen = false;
  try { if (window.google && google.accounts && google.accounts.id) google.accounts.id.disableAutoSelect(); } catch(e){}
  showLogin();
  document.getElementById('gsiBtn').style.display = 'flex';
  document.getElementById('loginSpin').style.display = 'none';
}

/* ── data load ── */
async function loadAll(silent){
  if (!SESSION.email) { showLogin(); return; }
  if (!silent) { S.loading = true; showApp(); render(); }
  try {
    const j = await api('list');
    S.me = prepUser(j.me);
    S.users = (j.users || []).map(prepUser);
    S.tasks = j.tasks || [];
    S.comments = j.comments || [];
    if (!S.calSel) {
      const td = pd(todayIso());
      S.calSel = todayIso(); S.calY = td.getFullYear(); S.calM = td.getMonth();
    }
    S.loading = false;
    saveSession(); saveCache(); showApp(); render(); renderOverlays();
  } catch(e){
    const msg = String(e.message || e);
    if (/user not found|user inactive/i.test(msg)) {
      clearSession();
      showLoginErr(/inactive/i.test(msg) ? 'บัญชีของคุณถูกปิดใช้งาน (inactive) — ติดต่อผู้ดูแลระบบ' : 'ไม่พบอีเมลนี้ในรายชื่อผู้ใช้ Rattana — ติดต่อผู้ดูแลระบบเพื่อเพิ่มสิทธิ์');
      return;
    }
    if (S.loading) { S.loading = false; render(); }
    toast('โหลดข้อมูลไม่สำเร็จ: ' + msg);
  }
}

/* ── back button ปิด sheet แทนออกจากแอป (push dummy history เมื่อเปิด modal) ── */
function anyModalOpen(){ return S.formOpen || S.menuOpen || !!S.listPop || (!!S.detailId && !S.closing); }
function syncHistory(){ if (anyModalOpen() && !S._histPushed) { S._histPushed = true; try { history.pushState({ rf: 1 }, ''); } catch(e){} } }
function dropHistory(){ if (S._histPushed && !anyModalOpen()) { S._histPushed = false; try { history.back(); } catch(e){} } }
window.addEventListener('popstate', function(){
  if (!anyModalOpen()) return;           // ไม่มี sheet เปิด → ปล่อย back ทำงานปกติ
  S._histPushed = false;
  if (S.formOpen) RF.closeForm(true);
  else if (S.menuOpen) RF.closeMenu(true);
  else if (S.listPop) RF.closePop(true);
  else if (S.detailId && !S.closing) RF.closeDetail(true);
  syncHistory();                         // ยังมี sheet อื่นซ้อนอยู่ → กัน back ทะลุ
});

/* ── main render ── */
function render(){
  const app = document.getElementById('app');
  if (!app) return;
  if (S.dragId) return;                  // ระหว่างลากการ์ด ห้าม rebuild DOM — การ์ดที่ลากถูกทำลายแล้ว drop ไม่ทำงาน (กัน sync เบื้องหลังมาชนตอนลาก)
  if (S._clDrag) return;                  // ระหว่างลากจัดลำดับเช็คลิสต์ ห้าม rebuild เช่นกัน
  const sy = window.scrollY;             // จำตำแหน่ง scroll ก่อน rebuild — innerHTML ทำจอเด้งกลับบนสุด
  const mob = isMob();
  let html = '';
  if (!mob) html += sideHtml();
  html += '<div class="rf-main">' + headHtml(mob) + '<div class="rf-content">' + bannerHtml() + (S.loading ? skelHtml() : viewHtml(mob)) + '</div></div>';
  app.innerHTML = html;
  if (mob) {
    app.insertAdjacentHTML('beforeend', bnavHtml() + '<button class="rf-fab" onclick="RF.newTask()" title="สร้างงานใหม่">' + IC.plus.replace('width="16" height="16"','width="24" height="24"') + '</button>');
  }
  window.scrollTo(0, sy);                // คืนตำแหน่งเดิม — หน้าไหนตั้งใจขึ้นบนสุด เรียก scrollTo(0,0) เองหลัง render()
}

function skelHtml(){
  let h = '<div class="rf-view"><div class="rf-skel" style="width:180px;height:26px;border-radius:9px"></div><div class="rf-stats">';
  for (let i = 0; i < 4; i++) h += '<div class="rf-skel" style="height:96px"></div>';
  h += '</div><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px"><div class="rf-skel" style="height:260px;border-radius:16px"></div><div class="rf-skel" style="height:260px;border-radius:16px"></div></div></div>';
  return h;
}

function bannerHtml(){
  if (!S.memberFilter || S.loading || !(S.view === 'board' || S.view === 'cal')) return '';
  const u = userByEmail(S.memberFilter);
  const label = (S.me && S.memberFilter === S.me.email) ? 'งานของฉัน' : 'แสดงเฉพาะ: ' + esc(u ? dispName(u) : '');
  return '<div style="display:flex;align-items:center;gap:8px;margin-bottom:14px"><div class="rf-banner">' + label +
    '<button onclick="RF.clearFilter()">' + IC.xs.replace('width="12" height="12"','width="10" height="10"') + '</button></div></div>';
}

function viewHtml(mob){
  if (S.view === 'dash') return dashHtml();
  if (S.view === 'board') return boardHtml(mob);
  if (S.view === 'cal') return calHtml(mob);
  if (S.view === 'team') return teamHtml();
  return '';
}

/* ── sidebar (desktop) ── */

  const nav = (v, ic, lb) => '<button class="rf-navbtn' + (S.view === v ? ' on' : '') + '" onclick="RF.go(\'' + v + '\')">' + ic + lb + '</button>';
  const open = S.memberOpen || !!S.memberFilter;
  const dec = allDec();
  let mem = '';
  if (open) {
    // หัวหน้า/พนักงาน เห็นเฉพาะคนคลัง (W) เดียวกัน = ลูกทีมตัวเอง · R7 (executive) เห็นทุกคน · ไม่มีค่า W → เห็นทุกคน
    let list = teamUsers();
    if (S.me && S.me.role < 7 && String(S.me.warehouse || '').trim()) {
      const myW = String(S.me.warehouse).trim().toUpperCase();
      list = list.filter(u => String(u.warehouse || '').trim().toUpperCase() === myW || u.email === S.me.email);
    }

      mem += '<button class="rf-membtn' + (S.memberFilter === u.email ? ' on' : '') + '" onclick="RF.pickMember(\'' + jsq(u.email) + '\')">' +
        avUserHtml(u, 24) + '<div class="n">' + esc(dispName(u)) + '</div><div class="c">' + cnt + '</div></button>';
    });

  return '<div class="rf-side">' +
    '<div class="rf-logo-row"><div class="rf-logo"><img src="r-flow-icon-192.png?v=26" alt="" onerror="this.parentNode.textContent=\'ง\'"></div><div><div class="rf-logo-name">R-Flow</div><div class="rf-logo-sub">ติดตามงานทีม</div></div><div class="rf-ver">v' + CFG.version + '</div></div>' +
    '<div class="rf-nav">' + nav('dash', IC.dash, 'ภาพรวม') + nav('board', IC.board, 'บอร์ดงาน') + nav('cal', IC.cal, 'ปฏิทิน') + nav('team', IC.team, 'ทีม') + '</div>' +
    '<div class="rf-memhead"><button class="rf-memtog" onclick="RF.toggleMembers()"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="transform:rotate(' + (open ? 90 : 0) + 'deg)"><path d="m9 5 7 7-7 7"/></svg>กรองตามสมาชิก</button>' +
    (S.memberFilter ? '<button class="rf-clearf" onclick="RF.clearFilter()">ล้าง</button>' : '') + '</div>' +
    '<div class="rf-memlist">' + mem + '</div>' +
    '<div class="rf-sidefoot">' +
      '<div class="rf-me">' + (S.me ? avUserHtml(S.me, 30) : '') + '<div style="min-width:0;flex:1"><div class="nm" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(S.me ? dispName(S.me) : '') + '</div><div class="dp">' + esc(S.me ? (S.me.role >= 5 ? 'หัวหน้าทีม' : S.me.dept) : '') + '</div></div>' +
      '<button class="rf-out" onclick="RF.logout()" title="ออกจากระบบ">' + IC.out + '</button></div>' +
    '</div></div>';
}

function qDropHtml(){
  if (!S.q) return '';
  const qq = S.q.trim().toLowerCase();
  // X โชว์ทันทีที่มีตัวอักษรใดๆ (รวม space) — dropdown ผลลัพธ์โชว์เมื่อมีคำค้นจริง
  if (!qq) return '<button class="rf-qx" onclick="RF.qClear()">' + IC.xs + '</button>';
  const res = sortL(allDec().filter(d => (d.title + ' ' + d.detail + ' ' + d.avName).toLowerCase().includes(qq))).slice(0, 8);
  let h = '<button class="rf-qx" onclick="RF.qClear()">' + IC.xs + '</button><div class="rf-qdrop">';
  res.forEach(d => {
    h += '<button class="rf-qrow" onclick="RF.openTask(\'' + jsq(d.id) + '\')">' + avHtml(d, 26) +
      '<div style="flex:1;min-width:0"><div class="t1" style="font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(d.title) + '</div>' +
      '<div class="t2" style="font-size:13px;color:var(--muted)">' + esc(d.avName) + ' · ' + d.statusLabel + '</div></div>' +
      '<div class="rf-duechip" style="background:' + d.dueBg + ';color:' + d.dueFg + '" title="' + esc(d.dueTip) + '">' + d.dueText + '</div></button>';
  });
  if (!res.length) h += '<div style="padding:22px;text-align:center;color:var(--muted);font-size:14px">ไม่พบงานที่ตรงกับ “' + esc(S.q) + '”</div>';
  return h + '</div>';
}

  let h = '<div class="rf-view"><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">' +

    '<div class="rf-stat"><div class="l">งานทั้งหมด</div><div class="v">' + act.length + '</div><div class="s">ในระบบ</div></div>' +
    '<div class="rf-stat"><div class="l">กำลังทำ</div><div class="v" style="color:var(--blue)">' + act.filter(d => d.status === 'doing').length + '</div><div class="s">กำลังดำเนินการ</div></div>' +
    '<div class="rf-stat"><div class="l">เสร็จแล้ว</div><div class="v" style="color:var(--green)">' + done7 + '</div><div class="s">ใน 7 วันล่าสุด</div></div>' +

  // 2 การ์ดสรุป (คลิกได้) — ย้ายขึ้นมาต่อจาก 4 กล่องสรุปทันที

  return h;

function wlCardHtml(dec){
  const tu = teamUsers();
  const wl0 = tu.map(u => {
    const mine = dec.filter(d => d.u && d.u.email === u.email && d.status !== 'done' && d.status !== 'cancelled');
    return { u, act: mine.length, od: mine.filter(d => d.urg === 0).length };
  });
  const mx = Math.max(1, ...wl0.map(w => w.act), 0);
  const byDept = {};
  wl0.forEach(w => { (byDept[w.u.dept] = byDept[w.u.dept] || []).push(w); });
  const depts = Object.keys(byDept);
  const gmax = Math.max(1, ...depts.map(k => byDept[k].reduce((a, w) => a + w.act, 0)), 0);
  let rows = '';
  depts.forEach(dept => {
    const g = byDept[dept];
    const act = g.reduce((a, w) => a + w.act, 0), od = g.reduce((a, w) => a + w.od, 0);
    const open = !!S.wlOpen[dept];
    rows += '<div class="rf-wlgroup"><button class="rf-wlhead" onclick="RF.toggleWl(\'' + jsq(dept) + '\')">' +
      '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="transform:rotate(' + (open ? 90 : 0) + 'deg)"><path d="m9 5 7 7-7 7"/></svg>' +
      '<div style="flex:1;min-width:0"><div style="display:flex;align-items:baseline;gap:8px;margin-bottom:5px;flex-wrap:wrap"><div style="font-size:14px;font-weight:700">' + esc(dept) + '</div>' +
      '<div style="font-size:13px;color:var(--muted)">' + g.length + ' คน · ' + act + ' งานค้าง</div>' +
      (od > 0 ? '<div style="font-size:13px;font-weight:600;color:var(--red)">เลยกำหนด ' + od + '</div>' : '') + '</div>' +
      '<div class="rf-bar"><div style="width:' + Math.round(act / gmax * 100) + '%;background:var(--accent)"></div><div style="width:' + Math.round(od / gmax * 100) + '%;background:var(--red)"></div></div></div></button>';
    if (open) {
      rows += '<div style="display:flex;flex-direction:column;gap:2px;padding:2px 8px 8px 26px;animation:fadeUp .18s ease-out">';
      g.forEach(w => {
        rows += '<button class="rf-wlrow" onclick="RF.openPerson(\'' + jsq(w.u.email) + '\')">' + avUserHtml(w.u, 28) +
          '<div style="flex:1;min-width:0"><div style="display:flex;align-items:baseline;gap:8px;margin-bottom:5px"><div style="font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(dispName(w.u)) + '</div>' +
          '<div style="font-size:13px;color:var(--muted)">' + w.act + ' งานค้าง</div>' +
          (w.od > 0 ? '<div style="font-size:13px;font-weight:600;color:var(--red)">เลยกำหนด ' + w.od + '</div>' : '') + '</div>' +
          '<div class="rf-bar" style="height:7px"><div style="width:' + Math.round(w.act / mx * 100) + '%;background:var(--accent)"></div><div style="width:' + Math.round(w.od / mx * 100) + '%;background:var(--red)"></div></div></div></button>';
      });
      rows += '</div>';
    }
    rows += '</div>';
  });
  if (!depts.length) rows = '<div class="rf-empty">ยังไม่มีงานที่มอบหมาย</div>';
  return '<div class="rf-card"><div class="rf-card-t">ภาระงานรายแผนก</div><div style="display:flex;flex-direction:column;gap:8px">' + rows + '</div></div>';
}

function feedList(){
  /* ตัด system log + คอมเม้นกำพร้าของงานที่ถูกลบไปแล้ว (คอมเม้นไม่ถูกลบตามงาน) */
  return S.comments.filter(c => c.type !== 'system' && S.tasks.some(x => x.id === c.taskId))
    .sort((a, b) => a.createdAt < b.createdAt ? 1 : -1).map(c => {
    const u = userByEmail(c.authorEmail) || userByName(c.authorName);
    const t = S.tasks.find(x => x.id === c.taskId);
    return { c, u, nick: u ? dispName(u) : (c.authorName || '?'), init: u ? firstChar(u.nickname) : firstChar(c.authorName || '?'), photo: u ? u.photo : '', color: u ? u.color : 'var(--slate)', taskTitle: t ? t.title : '', taskId: c.taskId };
  });
}
function feedRowHtml(f){
  return '<button class="rf-feedrow" onclick="RF.openTask(\'' + jsq(f.taskId) + '\')">' +
    avCore(f.init, f.color, f.photo, 30) +
    '<div style="flex:1;min-width:0"><div style="font-size:13.5px;line-height:1.4"><span style="font-weight:700">' + esc(f.nick) + '</span><span style="color:var(--muted)"> คอมเม้นใน </span><span style="font-weight:600;color:var(--accent-ink)">' + esc(f.taskTitle) + '</span></div>' +

    '<div style="font-size:13px;color:var(--muted);margin-top:2px">' + timeLabel(f.c.createdAt) + '</div></div></button>';

function feedCardHtml(){
  const feed = feedList();
  let h = '<div class="rf-card"><div class="rf-card-t" style="margin-bottom:10px">คอมเม้นล่าสุด</div><div style="display:flex;flex-direction:column">';
  feed.slice(0, 3).forEach(f => { h += feedRowHtml(f); });
  if (!feed.length) h += '<div class="rf-empty">ยังไม่มีคอมเม้น — เปิดงานแล้วเริ่มคุยกันได้เลย</div>';

function upList(dec){
  return sortL(dec.filter(d => d.urg === 0 || (d.status !== 'done' && d.urg !== 3 && d.sort >= 0 && d.sort <= 7)));
}
function upCardHtml(dec){
  const up = upList(dec);
  let h = '<div class="rf-card"><div class="rf-card-t" style="margin-bottom:10px">ครบกำหนดใน 7 วัน</div><div style="display:flex;flex-direction:column">';
  up.slice(0, 4).forEach(d => { h += rowHtml(d, { badge: true }); });
  if (!up.length) h += '<div class="rf-empty"><div style="width:48px;height:48px;border-radius:50%;background:var(--green-soft);color:var(--green);display:flex;align-items:center;justify-content:center;margin:0 auto 10px">' + IC.check + '</div>ไม่มีงานครบกำหนดในช่วงนี้</div>';
  h += '</div>';
  if (up.length > 4) h += '<button class="rf-viewall" onclick="RF.openPop(\'up\')">ดูทั้งหมด ' + up.length + ' งาน</button>';
  return h + '</div>';
}

function donutCardHtml(dec){
  const C = 2 * Math.PI * 40;
  const total = dec.length;
  const entries = COLS.map(c => { const n = dec.filter(d => d.status === c.id).length; return { id: c.id, label: c.label, color: c.dot, n, frac: total ? n / total : 0 }; });
  let acc = 0, segs = '';
  entries.filter(e => e.n > 0).forEach(e => {
    segs += '<circle cx="60" cy="60" r="40" fill="none" stroke="' + e.color + '" stroke-width="15" stroke-dasharray="' + (e.frac * C).toFixed(2) + ' ' + C.toFixed(2) + '" stroke-dashoffset="' + (-acc * C).toFixed(2) + '" transform="rotate(-90 60 60)"/>';
    acc += e.frac;
  });
  let legend = '';
  entries.forEach(e => {
    legend += '<button class="rf-legrow" onclick="RF.openPop(\'status:' + e.id + '\')">' +

function dueBarsCardHtml(dec){

/* ── Board (Kanban) ── */
function clChip(d){
  if (!d.clTotal) return '';
  const doneAll = d.clDone === d.clTotal;
  return '<div class="rf-cc" style="' + (doneAll ? 'color:var(--green)' : '') + '" title="เช็คลิสต์">' + IC.cl + d.clDone + '/' + d.clTotal + '</div>';
}
// คอมเม้นล่าสุดจากหัวหน้า (role>=5, ไม่ใช่ system log) ของงานนี้
function bossComment(taskId){
  let best = null;
  S.comments.forEach(c => {
    if (c.taskId !== taskId || c.type === 'system') return;
    const u = userByEmail(c.authorEmail) || userByName(c.authorName);
    if (u && u.role >= 5 && (!best || c.createdAt > best.createdAt)) best = c;
  });
  return best;
}
// การ์ด kanban แบบกางดู: เช็คลิสต์ + คอมเม้นล่าสุดจากหัวหน้า (คืน '' ถ้าไม่มีอะไรให้กาง)
function cardExpand(d){
  const t = S.tasks.find(x => x.id === d.id);
  if (!t) return '';
  const cl = parseCl(t);
  const bc = bossComment(d.id);
  if (!cl.length && !bc) return '';
  const open = !!S.cardOpen[d.id];
  let panel = '';
  if (open) {
    let inner = '';
    if (cl.length) {
      const canTick = canEdit(t) && stOf(t) !== 'cancelled';   // ติ๊กได้จากบนการ์ดเลย (หัวหน้า/เจ้าของงาน)
      inner += '<div class="rf-cardcl">';
      cl.forEach((it, i) => {
        inner += '<div class="rf-cardcl-i"><button class="rf-cardcl-b' + (it.d ? ' on' : '') + '"' +
          (canTick ? ' onclick="event.stopPropagation();RF.clToggle(\'' + jsq(d.id) + '\',' + i + ')"' : ' disabled style="cursor:default"') + '>' + (it.d ? IC.checkS : '') + '</button>' +
          '<span class="' + (it.d ? 'done' : '') + '">' + esc(it.t) + '</span></div>';
      });
      inner += '</div>';
    }
    if (bc) {
      const u = userByEmail(bc.authorEmail) || userByName(bc.authorName);
      inner += '<div class="rf-cardbc">' + avCore(u ? firstChar(u.nickname) : '?', u ? u.color : 'var(--slate)', u ? u.photo : '', 20) +
        '<div style="flex:1;min-width:0"><div class="nm">' + esc(u ? u.nickname : (bc.authorName || 'หัวหน้า')) + ' · หัวหน้า</div>' +
        '<div class="tx">' + esc(bc.text || '(แนบรูป)') + '</div></div></div>';
    }
    panel = '<div class="rf-cardex">' + inner + '</div>';
  }
  return '<button class="rf-cardex-tog" onclick="event.stopPropagation();RF.toggleCard(\'' + jsq(d.id) + '\')">' +
    '<span>' + (open ? 'ซ่อน' : 'เช็คลิสต์ & คอมเม้นหัวหน้า') + '</span>' +
    '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="transform:rotate(' + (open ? 180 : 0) + 'deg)"><path d="m6 9 6 6 6-6"/></svg></button>' + panel;
}
// สีคลังมาตรฐาน Rattana (ใช้ทุกแอป)
const WCOLOR = { W1:'#FBBF24', W2:'#0EA5E9', W3:'#EF4444', W4:'#15803D', C4:'#4ADE80', HQ:'#C9A84C' };
function wChip(w){
  w = String(w || '').trim().toUpperCase();
  if (!w) return '';
  const bg = WCOLOR[w] || 'var(--slate)';
  const dark = (w === 'W1' || w === 'C4');   // พื้นสว่าง → ตัวอักษรเข้ม
  return '<span style="font-size:11px;font-weight:700;padding:1px 7px;border-radius:6px;background:' + bg + ';color:' + (dark ? '#3a2f00' : '#fff') + '">' + esc(w) + '</span>';
}
// แถวแผนก+คลังของผู้รับผิดชอบ (โชว์บนการ์ด)
function wDeptLine(d){
  const w = d.warehouse || (d.u ? d.u.warehouse : '');
  const dept = d.dept || '';
  if (!w && !dept) return '';
  return '<div style="display:flex;align-items:center;gap:6px;margin-top:6px;min-width:0">' +
    (w ? wChip(w) : '') +
    (dept ? '<span style="font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0">' + esc(dept) + '</span>' : '') + '</div>';
}
function kCardMeta(d){
  // ชื่อเล่นข้าง avatar (ประหยัดที่ — บรรทัดเดิม ไม่เพิ่มความสูงการ์ด) · hover เห็นชื่อเต็ม
  const nm = d.u ? (d.u.nickname || d.avName) : d.avName;
  return '<div style="display:flex;align-items:center;gap:6px;margin-top:9px;min-width:0;flex-wrap:wrap">' + avHtml(d, 24) +
    '<div style="font-size:12.5px;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:76px" title="' + esc(d.avName) + '">' + esc(nm) + '</div>' +
    '<div class="rf-duechip" style="font-size:12.5px;padding:2px 8px;background:' + d.dueBg + ';color:' + d.dueFg + '" title="' + esc(d.dueTip) + '">' + d.dueText + '</div>' +
    '<div style="flex:1"></div>' + (d.priv ? '<span title="เฉพาะทีม" style="font-size:13px">👥</span>' : '') + clChip(d) + (d.cc > 0 ? '<div class="rf-cc">' + IC.cmt + d.cc + '</div>' : '') + '</div>' +
    wDeptLine(d);
}
function boardHtml(mob){
  let all = fDec();
  // กรองตามคลัง/แผนก (dropdown หัวบอร์ด) — เทียบจากคลัง/แผนกของผู้รับผิดชอบงาน
  if (S.filterW) all = all.filter(d => d.u && String(d.u.warehouse || '').trim().toUpperCase() === S.filterW);
  if (S.filterDept) all = all.filter(d => d.u && String(d.u.dept || '').trim() === S.filterDept);

  const nCan = all.length - dec.length;

  const ws = [...new Set(S.users.map(u => String(u.warehouse || '').trim().toUpperCase()).filter(Boolean))]
    .sort((a, b) => ((WORD.indexOf(a) + 1 || 99) - (WORD.indexOf(b) + 1 || 99)) || a.localeCompare(b));
  const ds = [...new Set(S.users.map(u => String(u.dept || '').trim()).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'th'));
  const opt = (v, sel, lb) => '<option value="' + esc(v) + '"' + (sel ? ' selected' : '') + '>' + esc(lb) + '</option>';
  const selW = '<select class="rf-fsel" onchange="RF.setFW(this.value)">' + opt('', !S.filterW, 'คลัง: ทั้งหมด') + ws.map(w => opt(w, S.filterW === w, 'คลัง ' + w)).join('') + '</select>';
  const selD = '<select class="rf-fsel" onchange="RF.setFDept(this.value)">' + opt('', !S.filterDept, 'แผนก: ทั้งหมด') + ds.map(dp => opt(dp, S.filterDept === dp, dp)).join('') + '</select>';
  let h = '<div class="rf-view"><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><h1 class="rf-h1">บอร์ดงาน</h1>' +
    (mob ? '' : '<div style="color:var(--muted);font-size:13.5px">ลากการ์ดเพื่อเปลี่ยนสถานะ · คลิกการ์ดเพื่อดูรายละเอียด</div>') +
    (nCan > 0 ? '<button onclick="RF.openPop(\'cancelled\')" style="border:none;cursor:pointer;font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--slate-soft);color:var(--muted)">ยกเลิกแล้ว ' + nCan + '</button>' : '') +
    '<div style="flex:1"></div>' + selW + selD + '</div>';
  if (!mob) {
    h += '<div class="rf-board-pc" style="grid-template-columns:repeat(4,minmax(0,1fr))">';
    COLS.forEach(c => {
      const cards = sortL(dec.filter(d => d.status === c.id));
      h += '<div class="rf-col' + (S.dragOverCol === c.id ? ' over' : '') + '" ondragover="RF.dragOver(event,\'' + c.id + '\')" ondrop="RF.drop(event,\'' + c.id + '\')">' +
        '<div class="rf-colhead"><div class="dot" style="background:' + c.dot + '"></div><div class="lb">' + c.label + '</div><div class="ct">' + cards.length + '</div></div>' +
        '<div style="display:flex;flex-direction:column;gap:8px">';
      cards.forEach(d => {
        h += '<div class="rf-kcard' + (S.dragId === d.id ? ' drag' : '') + '" draggable="true" ondragstart="RF.dragStart(event,\'' + jsq(d.id) + '\')" ondragend="RF.dragEnd()" onclick="RF.openTask(\'' + jsq(d.id) + '\')" style="border-top-color:' + d.prioColor + '">' +
          '<div class="tt">' + esc(d.title) + '</div>' + kCardMeta(d) + cardExpand(d) + '</div>';
      });
      if (!cards.length) h += '<div class="rf-kempty">ยังไม่มีงาน<br>ลากการ์ดมาวางที่นี่ได้</div>';
      h += '</div></div>';
    });
    h += '</div>';
  } else {
    h += '<div class="rf-seg">';
    COLS.forEach((c, i) => {
      const n = dec.filter(d => d.status === c.id).length;
      h += '<button class="' + (S.boardCol === i ? 'on' : '') + '" onclick="RF.setBoardCol(' + i + ')"><div class="sl">' + c.label + '</div><div class="sc">' + n + '</div></button>';
    });
    h += '</div><div ontouchstart="RF.touchStart(event)" ontouchend="RF.touchEnd(event)" style="display:flex;flex-direction:column;gap:10px;min-height:340px;animation:fadeUp .22s ease-out">';
    const col = COLS[S.boardCol];
    const cards = sortL(dec.filter(d => d.status === col.id));
    cards.forEach(d => {
      h += '<div class="rf-mcard" onclick="RF.openTask(\'' + jsq(d.id) + '\')" style="border-top-color:' + d.prioColor + '"><div class="tt">' + esc(d.title) + '</div>' +
        '<div style="display:flex;align-items:center;gap:8px;margin-top:10px">' + avHtml(d, 26) +
        '<div style="font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(d.avName) + '</div><div style="flex:1"></div>' +
        (d.priv ? '<span title="เฉพาะทีม" style="font-size:13px">👥</span>' : '') + clChip(d) + (d.cc > 0 ? '<div class="rf-cc">' + IC.cmt + d.cc + '</div>' : '') +
        '<div class="rf-duechip" style="background:' + d.dueBg + ';color:' + d.dueFg + '" title="' + esc(d.dueTip) + '">' + d.dueText + '</div></div>' + wDeptLine(d) + cardExpand(d) + '</div>';
    });

      h += '<div style="text-align:center;padding:44px 20px;color:var(--muted)"><div style="width:56px;height:56px;border-radius:18px;background:var(--surface2);display:flex;align-items:center;justify-content:center;margin:0 auto 12px">' + IC.board + '</div>' +
        '<div style="font-size:15px;font-weight:600;color:var(--text);margin-bottom:4px">ยังไม่มีงานในคอลัมน์นี้</div><div style="font-size:13.5px;margin-bottom:16px">สร้างงานใหม่หรือเลื่อนงานจากคอลัมน์อื่น</div>' +
        '<button onclick="RF.newTask()" style="min-height:44px;padding:0 22px;border-radius:12px;border:none;background:var(--accent);color:#fff;font-size:14.5px;font-weight:600;cursor:pointer">+ สร้างงานใหม่</button></div>';
    }
    h += '</div>';
  }
  return h + '</div>';
}

/* ── Calendar ── */
function calHtml(mob){
  const dec = fDec().filter(d => d.status !== 'cancelled');
  const wkStart = S.calWeekStart || weekStartOf(S.calSel || todayIso());
  const wkEnd = addDays(wkStart, 6);
  const title = S.calMode === 'week' ? (fmtYmd(wkStart) + ' – ' + fmtYmd(wkEnd)) : (MONFULL[S.calM] + ' ' + S.calY);
  const seg = (m, lb) => '<button class="' + (S.calMode === m ? 'on' : '') + '" onclick="RF.calMode(\'' + m + '\')">' + lb + '</button>';
  let h = '<div class="rf-view"><div class="rf-calbar"><h1 class="rf-h1">' + title + '</h1>' +
    '<button class="rf-calnav" onclick="RF.calNav(-1)">' + IC.back + '</button>' +
    '<button class="rf-calnav" onclick="RF.calNav(1)">' + IC.chev + '</button>' +
    '<button class="rf-todaybtn" onclick="RF.calToday()">วันนี้</button><div style="flex:1"></div>' +
    '<div class="rf-modeseg">' + seg('month', 'เดือน') + seg('week', 'สัปดาห์') + seg('agenda', 'กำหนดการ') + '</div></div>';

  if (S.calMode === 'month') h += calMonthHtml(dec, mob);
  else if (S.calMode === 'week') h += calWeekHtml(dec, mob, wkStart);
  else h += calAgendaHtml(dec);
  return h + '</div>';
}

function calMonthHtml(dec, mob){
  const y = S.calY, m = S.calM;
  const firstDow = new Date(y, m, 1).getDay();
  const dim = new Date(y, m + 1, 0).getDate();
  const total = Math.ceil((firstDow + dim) / 7) * 7;
  let h = '<div class="rf-card" style="padding:10px"><div class="rf-calgrid7" style="margin-bottom:4px">';
  DOWS.forEach(d => { h += '<div class="rf-dow">' + d + '</div>'; });
  h += '</div><div style="display:flex;flex-direction:column;gap:4px">';
  for (let w = 0; w < total / 7; w++) {
    h += '<div class="rf-calgrid7">';
    for (let i = 0; i < 7; i++) {
      const dte = new Date(y, m, 1 - firstDow + w * 7 + i);
      const dIso = isoOf(dte);
      const inM = dte.getMonth() === m;
      const dayTasks = sortL(dec.filter(d => d.dueIso === dIso));
      const isT = dIso === todayIso(), isSel = dIso === S.calSel;
      const hasOd = dayTasks.some(d => d.urg === 0);
      h += '<button class="rf-day' + (isSel ? ' sel' : '') + '" onclick="RF.calPick(\'' + dIso + '\')" style="min-height:' + (mob ? 52 : 104) + 'px;opacity:' + (inM ? 1 : .35) + '">' +
        '<div class="num' + (isT ? ' today' : '') + '">' + dte.getDate() + '</div>';
      if (!mob) {
        dayTasks.slice(0, 3).forEach(d => {
          const bg = d.urg === 0 ? 'var(--red-soft)' : d.status === 'done' ? 'var(--green-soft)' : d.urg === 1 ? 'var(--amber-soft)' : 'var(--accent-soft)';
          const fg = d.urg === 0 ? 'var(--red)' : d.status === 'done' ? 'var(--green)' : d.urg === 1 ? 'var(--amber)' : 'var(--accent-ink)';
          h += '<div class="rf-daychip" style="background:' + bg + ';color:' + fg + '">' + esc(d.title) + '</div>';
        });
        if (dayTasks.length > 3) h += '<div style="font-size:12.5px;color:var(--muted);padding:0 6px">+' + (dayTasks.length - 3) + ' งาน</div>';
      } else if (dayTasks.length) {
        h += '<div class="rf-dotcount" style="background:' + (hasOd ? 'var(--red)' : 'var(--accent)') + '">' + dayTasks.length + '</div>';
      }
      h += '</button>';
    }
    h += '</div>';
  }
  h += '</div></div>';
  const selRows = sortL(dec.filter(d => d.dueIso === S.calSel));
  const selD = pd(S.calSel);
  h += '<div class="rf-card" style="padding:16px"><div style="font-size:15px;font-weight:700;margin-bottom:8px">งาน' + DOWFULL[selD.getDay()] + ' ' + fmtYmd(S.calSel) + '</div><div style="display:flex;flex-direction:column">';
  selRows.forEach(d => { h += rowHtml(d, { av: 28, badgeOnly: true }); });
  if (!selRows.length) h += '<div class="rf-empty" style="padding:20px">ไม่มีงานครบกำหนดวันนี้</div>';
  return h + '</div></div>';
}

        (rows.length ? '<div style="font-size:13px;color:var(--muted)">' + rows.length + ' งาน</div>' : '') + '</div>';
      rows.forEach(d => {
        h += '<button class="rf-mwkrow" onclick="RF.openTask(\'' + jsq(d.id) + '\')"><div class="rf-prio-line" style="background:' + d.prioColor + '"></div>' + avHtml(d, 26) +
          '<div style="flex:1;min-width:0"><div class="t1" style="font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(d.title) + '</div>' +

function calAgendaHtml(dec){
  const m = S.calM, y = S.calY;
  const dates = [...new Set(dec.filter(d => d.dueIso && pd(d.dueIso).getMonth() === m && pd(d.dueIso).getFullYear() === y).map(d => d.dueIso))].sort();
  let h = '<div style="display:flex;flex-direction:column;gap:12px">';
  let any = false;
  dates.forEach(ds => {
    any = true;
    const dd = pd(ds);
    const isT = ds === todayIso();
    const rows = sortL(dec.filter(d => d.dueIso === ds));
    const od = rows.some(r => r.urg === 0);
    h += '<div class="rf-card" style="padding:14px 16px"><div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">' +
      '<div style="font-size:14px;font-weight:700;color:' + (od ? 'var(--red)' : (isT ? 'var(--accent-ink)' : 'var(--text)')) + '">' + DOWFULL[dd.getDay()] + ' ' + fmtYmd(ds) + '</div>' +
      (isT ? '<div class="rf-todaypill">วันนี้</div>' : '') + '</div><div style="display:flex;flex-direction:column">';
    rows.forEach(d => {
      h += '<button class="rf-row" style="min-height:50px;padding:7px 4px" onclick="RF.openTask(\'' + jsq(d.id) + '\')"><div class="rf-prio-line" style="background:' + d.prioColor + '"></div>' + avHtml(d, 26) +
        '<div style="flex:1;min-width:0"><div class="t1">' + esc(d.title) + '</div><div class="t2">' + esc(d.avName) + ' · ' + d.statusLabel + '</div></div>' +
        (d.hasBadge ? '<div class="rf-duechip" style="background:' + d.dueBg + ';color:' + d.dueFg + '">' + d.badge + '</div>' : '') + '</button>';
    });
    h += '</div></div>';
  });
  const noDue = dec.filter(d => !d.dueIso);
  if (noDue.length) {
    any = true;
    h += '<div class="rf-card" style="padding:14px 16px"><div style="font-size:14px;font-weight:700;color:var(--muted);margin-bottom:6px">ยังไม่กำหนดวันส่ง</div><div style="display:flex;flex-direction:column">';
    noDue.forEach(d => {
      h += '<button class="rf-row" style="min-height:50px;padding:7px 4px" onclick="RF.openTask(\'' + jsq(d.id) + '\')"><div class="rf-prio-line" style="background:' + d.prioColor + '"></div>' + avHtml(d, 26) +
        '<div style="flex:1;min-width:0"><div class="t1">' + esc(d.title) + '</div><div class="t2">' + esc(d.avName) + ' · ' + d.statusLabel + '</div></div></button>';
    });
    h += '</div></div>';
  }
  if (!any) h += '<div style="text-align:center;padding:40px 20px;color:var(--muted)"><div style="font-size:15px;font-weight:600;color:var(--text);margin-bottom:4px">ไม่มีงานในเดือนนี้</div><div style="font-size:13.5px">ลองเลื่อนไปเดือนอื่น หรือสร้างงานใหม่</div></div>';
  return h + '</div>';
}

/* ── Team ── */
function miniChips(o){

    '<div class="rf-minichip" style="background:var(--green-soft);color:var(--green)">เสร็จ ' + o.done + '</div></div>';
}
function teamCardFoot(o){
  return '<div class="rf-bar" style="height:7px;margin-bottom:8px"><div style="width:' + o.pct + '%;background:var(--green)"></div></div>' +
    '<div style="display:flex;align-items:center;justify-content:space-between"><div style="font-size:13px;color:var(--muted)">เสร็จแล้ว ' + o.done + '/' + o.tot + ' งาน</div>' +
    (o.od > 0 ? '<div style="font-size:13px;font-weight:600;color:var(--red)">เลยกำหนด ' + o.od + ' งาน</div>' : '') + '</div>';
}
function statCnt(list){
  const c = st => list.filter(d => d.status === st).length;
  const done = c('done'), tot = list.length;
  return { todo: c('todo'), doing: c('doing'), review: c('review'), done, tot, pct: tot ? Math.round(done / tot * 100) : 0, od: list.filter(d => d.urg === 0).length };
}

  depts.forEach(dept => {

    const o = statCnt(act.filter(d => d.u && ms.some(u => u.email === d.u.email)));
    h += '<button class="rf-teamcard" onclick="RF.deptPick(\'' + jsq(dept) + '\')"><div style="display:flex;align-items:center;gap:12px;margin-bottom:12px">' +

      '<div style="min-width:0;flex:1"><div style="font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(dept) + '</div>' +
      '<div style="font-size:13px;color:var(--muted)">' + ms.length + ' คน</div></div>' + IC.chev + '</div>' + miniChips(o) + teamCardFoot(o) + '</button>';
  });
  if (!depts.length) h += '<div class="rf-empty">ยังไม่มีงานที่มอบหมายให้สมาชิก</div>';
  return h + '</div></div>';
}

/* ── overlays ── */
function renderOverlays(){
  const box = document.getElementById('overlays');
  if (!box) return;
  if (S.closing) return;   // ระหว่าง detail ปิด (animation) ห้าม rebuild — กันเด้งเปิดซ้ำ
  if (S._clDrag) return;   // ระหว่างลากจัดลำดับเช็คลิสต์ ห้าม rebuild — แถวที่ลากจะหาย
  // จำ scroll ภายใน sheet ก่อน rebuild — กันเนื้อหาเด้งขึ้นบนสุดตอนติ๊กเช็คลิสต์/ส่งคอมเม้น/เลือกคนในฟอร์ม (เฉพาะตอน re-render — เปิดใหม่ (fresh) เริ่มบนสุดตามปกติ)
  const keep = {};
  if (S.detailId && !S.detailFresh) { const el = document.getElementById('cmtScroll'); if (el) keep.cmtScroll = el.scrollTop; }
  if (S.formOpen && !S.formFresh) { const el = document.getElementById('formScroll'); if (el) keep.formScroll = el.scrollTop; }
  if (S.listPop && !S.popFresh) { const el = document.getElementById('popScroll'); if (el) keep.popScroll = el.scrollTop; }
  let h = '';
  if (S.detailId) h += detailHtml();
  if (S.formOpen) h += formHtml();
  if (S.listPop) h += popHtml();
  if (S.menuOpen) h += menuHtml();
  box.innerHTML = h;
  // entry animation เล่นเฉพาะตอนเปิดครั้งแรก — re-render ระหว่างเปิด (ส่งคอมเม้น/ติ๊กเช็คลิสต์) ไม่เล่นซ้ำ
  S.detailFresh = false; S.formFresh = false; S.popFresh = false; S.menuFresh = false;
  const ci = document.getElementById('cmtInput');
  if (ci && S.cmtDraft) ci.value = S.cmtDraft;
  const sc = document.getElementById('cmtScroll');
  if (sc && S.scrollCmt) {
    const top = document.getElementById('cmtTop');   // คอมเม้นใหม่อยู่บนสุดของโซน → เลื่อนให้หัวโซนคอมเม้นขึ้นมาบน
    if (top) sc.scrollTop = sc.scrollTop + (top.getBoundingClientRect().top - sc.getBoundingClientRect().top) - 8;
    else sc.scrollTop = sc.scrollHeight;
    S.scrollCmt = false; delete keep.cmtScroll;
  }
  Object.keys(keep).forEach(function(id){ const el = document.getElementById(id); if (el) el.scrollTop = keep[id]; });
}

function detailHtml(){
  const t = S.tasks.find(x => x.id === S.detailId);
  if (!t) return '';

  const dm = dueMeta(t);
  const mob = isMob();

// ผลงานของ user คนหนึ่ง — งานที่มอบหมายให้เขา ทั้งเสร็จ+ยังไม่เสร็จ + กราฟงานเสร็จรายสัปดาห์ (ใช้ทั้งปุ่ม "ผลงาน" และหน้าทีม-รายคน)
function perfBody(user){
  if (!user) return '';
  const mineTasks = S.tasks.filter(t => { const u = taskUser(t); return u && u.email === user.email; });
  const dec = mineTasks.map(decorate);
  const done = sortL(dec.filter(d => d.status === 'done'));
  const active = sortL(dec.filter(d => d.status !== 'done' && d.status !== 'cancelled'));
  const cancelled = sortL(dec.filter(d => d.status === 'cancelled'));
  const overdue = active.filter(d => d.urg === 0).length;
  const total = done.length + active.length;
  const pct = total ? Math.round(done.length / total * 100) : 0;

  // งานเสร็จ = ใช้ updatedAt เป็นเวลาปิดงาน (โดยประมาณ)
  const doneTasks = mineTasks.filter(t => stOf(t) === 'done');
  const td = pd(todayIso());
  const doneThisMonth = doneTasks.filter(t => { const di = tsDateIso(t.updatedAt); if (!di) return false; const d = pd(di); return d.getMonth() === td.getMonth() && d.getFullYear() === td.getFullYear(); }).length;
  const thisWS = weekStartOf(todayIso());
  const weeks = [];
  for (let i = 5; i >= 0; i--) { const ws = addDays(thisWS, -i * 7); weeks.push({ ws, dd: pd(ws), c: 0 }); }
  doneTasks.forEach(t => { const di = tsDateIso(t.updatedAt); if (!di) return; const wk = weeks.find(w => w.ws === weekStartOf(di)); if (wk) wk.c++; });
  const wmax = Math.max(1, ...weeks.map(w => w.c));
  let bars = '';
  weeks.forEach((w, i) => {
    const cur = i === 5;
    bars += '<div class="rf-perfbar" title="สัปดาห์ ' + fmtYmd(w.ws) + ' · ' + w.c + ' งาน"><div style="font-size:11.5px;font-weight:700;color:var(--muted);height:15px;line-height:15px">' + (w.c || '') + '</div>' +
      '<div class="bar" style="height:' + (w.c > 0 ? Math.max(8, Math.round(w.c / wmax * 56)) : 5) + 'px;background:' + (cur ? 'var(--green)' : (w.c > 0 ? 'var(--accent)' : 'var(--surface)')) + '"></div>' +
      '<div style="font-size:11px;color:' + (cur ? 'var(--accent-ink)' : 'var(--muted)') + ';white-space:nowrap">' + (w.dd.getMonth() + 1) + '/' + w.dd.getDate() + '</div></div>';
  });

  const stat = (l, v, c) => '<div class="rf-perfstat"><div class="v" style="color:' + c + '">' + v + '</div><div class="l">' + l + '</div></div>';
  let h = '<div style="display:flex;align-items:center;gap:12px;padding:2px 4px 14px">' + avUserHtml(user, 48) +
    '<div style="min-width:0"><div style="font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(dispName(user)) + '</div>' +
    '<div style="font-size:13px;color:var(--muted)">' + esc(user.role >= 5 ? 'หัวหน้าทีม' : user.dept) + '</div></div></div>';
  h += '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">' +
    stat('เสร็จแล้ว', done.length, 'var(--green)') + stat('ยังไม่เสร็จ', active.length, 'var(--blue)') +
    stat('เลยกำหนด', overdue, overdue ? 'var(--red)' : 'var(--muted)') + '</div>';
  h += '<div style="margin:12px 4px 4px"><div style="display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-bottom:5px"><span>ความคืบหน้ารวม (' + done.length + '/' + total + ')</span><span style="font-weight:700;color:var(--text)">' + pct + '%</span></div>' +
    '<div class="rf-bar" style="height:8px"><div style="width:' + pct + '%;background:var(--green)"></div></div></div>';
  h += '<div style="background:var(--surface2);border-radius:14px;padding:12px 14px;margin-top:12px">' +
    '<div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:2px"><div style="font-size:13.5px;font-weight:700">งานเสร็จรายสัปดาห์</div>' +
    '<div style="font-size:12.5px;color:var(--muted)">เดือนนี้ <span style="font-weight:700;color:var(--green)">' + doneThisMonth + '</span> งาน</div></div>' +
    '<div class="rf-perfbars">' + bars + '</div></div>';
  h += '<div class="rf-perfsec">🔸 ยังไม่เสร็จ (' + active.length + ')</div>';
  if (active.length) active.forEach(d => h += rowHtml(d, { badge: true }));
  else h += '<div class="rf-empty" style="padding:14px">ไม่มีงานค้าง 🎉</div>';
  h += '<div class="rf-perfsec">✅ เสร็จแล้ว (' + done.length + ')</div>';
  if (done.length) done.forEach(d => h += rowHtml(d, {}));
  else h += '<div class="rf-empty" style="padding:14px">ยังไม่มีงานที่ทำเสร็จ</div>';
  if (cancelled.length) { h += '<div class="rf-perfsec">🚫 ยกเลิก (' + cancelled.length + ')</div>'; cancelled.forEach(d => h += rowHtml(d, {})); }
  return h;
}

// ── ลากจัดลำดับเช็คลิสต์ (Pointer Events — ใช้ได้ทั้งมือถือ+PC, ไม่ re-render ระหว่างลาก) ──
RF.clDragStart = (e, id, i) => {
  if (e.button != null && e.button > 0) return;   // เมาส์ซ้าย/นิ้วเท่านั้น
  const t = S.tasks.find(x => x.id === id);
  if (!t || !canEdit(t)) return;
  e.preventDefault();
  const list = document.getElementById('clDragList');
  if (!list) return;
  const rows = Array.from(list.children);
  const row = rows[i];
  if (!row || rows.length < 2) return;
  const rects = rows.map(r => r.getBoundingClientRect());
  S._clDrag = { id, from: i, to: i, rows, rects, startY: e.clientY, row, slot: rects[i].height + 2 };
  row.classList.add('rf-cl-dragging');
  document.body.style.userSelect = 'none';
  document.addEventListener('pointermove', RF._clDragMove, { passive: false });
  document.addEventListener('pointerup', RF._clDragEnd);
  document.addEventListener('pointercancel', RF._clDragEnd);
};
RF._clDragMove = e => {
  const d = S._clDrag; if (!d) return;
  e.preventDefault();
  const dy = e.clientY - d.startY;
  d.row.style.transform = 'translateY(' + dy + 'px)';
  const center = d.rects[d.from].top + d.rects[d.from].height / 2 + dy;
  let to = 0;
  for (let k = 0; k < d.rects.length; k++) {
    if (k === d.from) continue;
    if (center > d.rects[k].top + d.rects[k].height / 2) to++;
  }
  d.to = to;
  for (let k = 0; k < d.rows.length; k++) {
    if (k === d.from) continue;
    let sh = 0;
    if (d.from < to && k > d.from && k <= to) sh = -d.slot;
    else if (d.from > to && k >= to && k < d.from) sh = d.slot;
    d.rows[k].style.transform = sh ? 'translateY(' + sh + 'px)' : '';
  }
};
RF._clDragEnd = () => {
  const d = S._clDrag; if (!d) return;
  document.removeEventListener('pointermove', RF._clDragMove);
  document.removeEventListener('pointerup', RF._clDragEnd);
  document.removeEventListener('pointercancel', RF._clDragEnd);
  document.body.style.userSelect = '';
  d.rows.forEach(r => { r.style.transform = ''; });   // เคลียร์ transform ทุกแถวเสมอ (ไม่พึ่ง re-render อย่างเดียว)
  d.row.classList.remove('rf-cl-dragging');
  const id = d.from, to = d.to, tid = d.id;
  S._clDrag = null;
  const t = S.tasks.find(x => x.id === tid);
  if (!t || !canEdit(t) || id === to) { renderOverlays(); return; }
  const items = parseCl(t);
  if (id < 0 || id >= items.length) { renderOverlays(); return; }
  const [it] = items.splice(id, 1);
  items.splice(Math.max(0, Math.min(to, items.length)), 0, it);
  saveCl(t, items);
};

RF.cmtFile = inp => {
  const f = inp.files && inp.files[0];
  inp.value = '';
  if (!f) return;
  if (!/^image\//.test(f.type)) { toast('เลือกไฟล์รูปภาพเท่านั้น'); return; }
  const rd = new FileReader();
  rd.onload = () => {
    const im = new Image();
    im.onload = () => {
      const MAX = 1280;
      let w = im.width, h = im.height;
      if (w > MAX || h > MAX) { const r = Math.min(MAX / w, MAX / h); w = Math.round(w * r); h = Math.round(h * r); }
      const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
      cv.getContext('2d').drawImage(im, 0, 0, w, h);
      S.cmtImg = { dataUrl: cv.toDataURL('image/jpeg', 0.85), name: String(f.name || 'photo').replace(/\.[^.]+$/, '') + '.jpg' };
      renderOverlays();
    };
    im.onerror = () => toast('อ่านไฟล์รูปไม่สำเร็จ');
    im.src = rd.result;
  };
  rd.readAsDataURL(f);
};

  const fields = {
    title: String(f.title).trim(), detail: String(f.detail).trim(),
    assigneeEmail: f.assigneeEmail, assigneeName: au ? au.name : '',
    priority: f.priority, startDate: f.startDate || '', dueDate: f.dueDate, note: String(f.note).trim(),
    private: f.private ? 'Y' : ''
  };
  const id = f.id;
  // ปิดฟอร์มทันที (optimistic) — ไม่ค้าง "กำลังบันทึก", ยิง API เบื้องหลัง
  S.formOpen = false; S.form = null; S.saving = false;
  dropHistory();
  if (id) {
    const t = S.tasks.find(x => x.id === id);
    const backup = t ? Object.assign({}, t) : null;
    if (t) Object.assign(t, fields, { updatedAt: new Date().toISOString() });
    render(); renderOverlays();
    toast('บันทึกการแก้ไขแล้ว');
    api('update', { id: id, patch: fields }).then(() => loadAll(true)).catch(e => {
      if (t && backup) { Object.keys(t).forEach(k => { if (!(k in backup)) delete t[k]; }); Object.assign(t, backup); }
      render(); renderOverlays();
      toast('บันทึกไม่สำเร็จ: ' + e.message);
    });
  } else {
    const temp = Object.assign({ id: 'tmp-' + Date.now(), status: 'todo', reporterEmail: S.me.email, reporterName: S.me.name, createdBy: S.me.email, createdAt: new Date().toISOString(), updatedAt: new Date().toISOString() }, fields);
    S.tasks.push(temp);
    render(); renderOverlays();
    toast('สร้างงานแล้ว');
    api('create', { task: Object.assign({ status: 'todo' }, fields) }).then(j => {
      temp.id = j.task.id; render(); loadAll(true);
    }).catch(e => {
      S.tasks = S.tasks.filter(x => x !== temp);
      render(); renderOverlays();
      toast('สร้างงานไม่สำเร็จ: ' + e.message + ' — ลองใหม่อีกครั้ง');
    });
  }
};

/* ── boot ── */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (S.formOpen) RF.closeForm();
    else if (S.detailId) RF.closeDetail();
    else if (S.listPop) RF.closePop();
    else if (S.menuOpen) RF.closeMenu();
    else if (S.q) RF.qClear();
  }
});
mq.addEventListener('change', () => { render(); renderOverlays(); });

(function boot(){
  try { S.dark = localStorage.getItem('rf_theme') === 'dark'; } catch(e){}
  document.body.classList.toggle('dark', S.dark);
  const td = pd(todayIso());
  S.calSel = todayIso(); S.calY = td.getFullYear(); S.calM = td.getMonth(); S.calWeekStart = weekStartOf(todayIso());
  initGsi();
  if (SESSION.email) {
    if (loadCache()) { S.loading = false; showApp(); render(); loadAll(true); }   // มี cache → โชว์ทันที + sync เงียบ
    else loadAll(false);
  }
  else showLogin();
})();
</script>
