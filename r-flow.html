/* v2.94: แถบเทียบ "งานที่ทำไป" กับ "เวลาที่ผ่านไป" — เห็นทันทีว่าตามทันแผนไหม
   เส้นประคือตำแหน่งที่ควรจะถึงตอนนี้ ถ้าแถบเขียวสั้นกว่าเส้น แปลว่าช้ากว่าแผน */
/* v2.95: บอกสิ่งที่ต้องทำจริง ไม่ใช่แค่บอกว่าช้า
   "ช้ากว่าแผน 40 จุด" อ่านแล้วยังไม่รู้ว่าต้องทำอะไรต่อ — "ต้องปิดอีก 3 งานใน 8 วัน" ลงมือได้เลย
   โชว์เฉพาะตอนตามไม่ทัน/เริ่มช้า · งานเสร็จครบแล้วหรือไม่ได้กำหนดวันจบ ก็ไม่ต้องเตือน */
function planTodoLine(st){
  const left = st.act - st.done;
  if (left <= 0) return '';
  if (st.daysLeft === null) return 'ยังเหลืออีก ' + left + ' งาน';
  if (st.daysLeft < 0) return 'เลยกำหนดมา ' + Math.abs(st.daysLeft) + ' วัน — ยังเหลืออีก ' + left + ' งาน';
  if (st.daysLeft === 0) return 'วันนี้วันสุดท้าย — ยังเหลืออีก ' + left + ' งาน';
  return 'ต้องปิดอีก ' + left + ' งาน ใน ' + st.daysLeft + ' วัน';
}
/* แถบแผนบนหน้าภาพรวม — เห็นตั้งแต่เปิดแอปว่าแผนไหนกำลังจะไม่ทัน โดยไม่ต้องกดเข้าเมนูแผน
   เรียง "เร่งที่สุดขึ้นก่อน" (ตามไม่ทัน → เริ่มช้า → ปกติ · ในระดับเดียวกันเอาที่เหลือเวลาน้อยกว่าขึ้นก่อน) */
function dashPlansHtml(){
  const open = (S.plans || []).filter(function(p){ return String(p.status || 'active') !== 'done'; });
  if (!open.length) return '';
  const rank = { late: 0, slow: 1, ok: 2 };
  const rows = open.map(function(p){
    const st = planStat(p);
    const pace = planPace(p, st);
    const overdue = st.daysLeft !== null && st.daysLeft < 0 && st.done < st.act;
    const lvl = overdue ? 'late' : (pace ? pace.level : 'ok');
    return { p: p, st: st, pace: pace, lvl: lvl, overdue: overdue };
  }).sort(function(a, b){
    if (rank[a.lvl] !== rank[b.lvl]) return rank[a.lvl] - rank[b.lvl];
    const ad = a.st.daysLeft === null ? 9e9 : a.st.daysLeft, bd = b.st.daysLeft === null ? 9e9 : b.st.daysLeft;
    return ad - bd;
  });
  const alert = rows.filter(function(r){ return r.lvl !== 'ok'; }).length;
  const show = rows.slice(0, 3);
  let h = '<div class="rf-dashplans"><div class="hd">' +
    '<span class="ttl">แผนที่กำลังเดิน</span>' +
    (alert ? '<span class="alert">' + alert + ' แผนต้องเร่ง</span>' : '') +
    '<button onclick="RF.go(\'plans\')">ดูทั้งหมด ' + open.length + ' ›</button></div>';
  show.forEach(function(r){
    const st = r.st, donePct = st.act ? Math.round(st.done / st.act * 100) : 0;
    const when = st.daysLeft === null ? 'ไม่กำหนดวันจบ'
      : st.daysLeft < 0 ? ('เลยกำหนด ' + Math.abs(st.daysLeft) + ' วัน')
      : ('เหลือ ' + st.daysLeft + ' วัน');
    h += '<button class="rf-dashplan ' + r.lvl + '" onclick="RF.openPlan(\'' + jsq(r.p.id) + '\')">' +
      '<div class="nm">' + esc(r.p.name) + '</div>' +
      '<div class="track"><i style="width:' + donePct + '%"></i>' +
      (r.pace ? '<span class="now" style="left:' + Math.max(0, Math.min(100, r.pace.timePct)) + '%"></span>' : '') + '</div>' +
      '<div class="mt"><span class="n">' + st.done + '/' + st.act + ' งาน</span>' +
      '<span class="d">' + esc(when) + '</span></div>' +
      (r.lvl !== 'ok' && planTodoLine(st) ? '<div class="todo">' + esc(planTodoLine(st)) + '</div>' : '') +
      '</button>';
  });
  return h + '</div>';
}

function taskPickListHtml(){
  const pk = S.taskPick; if (!pk) return '';
  const words = String(pk.q || '').trim().toLowerCase().split(/\s+/).filter(Boolean);   // หลายคำเว้นวรรค = ต้องเจอครบทุกคำ
  const sel = pk.sel || [];
  let list = S.tasks.filter(function(t){
    if (String(t.planId || '') === String(pk.planId)) return false;      // อยู่ในแผนนี้อยู่แล้ว
    if (stOf(t) === 'cancelled') return false;
    return canEdit(t);
  }).map(decorate);
  if (words.length) list = list.filter(function(d){ return words.every(function(w){ return d.search.includes(w); }); });
  list = sortL(list);
  const rows = list.slice(0, 80).map(function(d){
    const t = S.tasks.find(function(x){ return x.id === d.id; });
    const inOther = t && t.planId ? planById(t.planId) : null;
    const on = sel.indexOf(d.id) > -1;
    return '<button class="rf-taskpick' + (on ? ' on' : '') + '" onclick="RF.taskPickToggle(\'' + jsq(d.id) + '\')">' +
      '<span class="ck">' + (on ? IC.checkS : '') + '</span>' +
      '<span class="bd"><span class="nm">' + esc(d.title) + '</span>' +
      '<span class="mt">' + esc(d.avName) + ' · ' + esc(d.dueText || 'ไม่มีกำหนด') +
      (inOther ? ' · <b style="color:var(--amber)">อยู่ในแผน ' + esc(inOther.name) + '</b>' : '') + '</span></span></button>';
  }).join('');
  return (rows || '<div class="rf-empty" style="padding:24px 12px;text-align:center;font-size:13px">' +
      (pk.q ? 'ไม่พบงานที่ตรงกับ “' + esc(pk.q) + '”' : 'ไม่มีงานที่เพิ่มเข้าแผนนี้ได้') + '</div>') +
    (list.length > 80 ? '<div class="rf-imghint" style="padding:4px 2px 0">แสดง 80 จาก ' + list.length + ' งาน — พิมพ์ค้นหาเพื่อแคบลง</div>' : '');
}
function taskPickHtml(){
  const pk = S.taskPick; if (!pk) return '';
  const mob = isMob();
  const n = (pk.sel || []).length;
  return '<div class="rf-ov ' + (mob ? 'bottom' : 'center') + '" style="z-index:var(--z-ov-sub)" onclick="RF.taskPickClose()">' +
    '<div class="' + (mob ? 'rf-sheet' : 'rf-modal') + '" style="' + (mob ? 'height:auto;max-height:86dvh;' : 'width:520px;max-width:100%;max-height:80vh;') + '" onclick="event.stopPropagation()">' +
    '<div class="rf-fhead"><div class="t" style="font-size:16px">เพิ่มงานเข้าแผน</div>' +
    '<button class="rf-xbtn" onclick="RF.taskPickClose()">' + IC.x + '</button></div>' +
    '<div style="padding:10px 14px 0"><div style="position:relative">' +
    '<input id="tpQ" class="rf-finput" style="padding-right:42px" value="' + esc(pk.q || '') + '" oninput="RF.taskPickQ(this.value)" placeholder="ค้นหางาน · คน · เช็คลิสต์ · แผนก…">' +
    '<button id="tpQx" class="rf-qx" style="display:' + (pk.q ? 'flex' : 'none') + '" onclick="RF.taskPickQClear()">' + IC.xs + '</button></div></div>' +
    '<div id="tpList" style="flex:1;overflow-y:auto;padding:10px 14px 4px">' + taskPickListHtml() + '</div>' +
    '<div class="rf-ffoot"><button class="rf-cancel" onclick="RF.taskPickClose()">ยกเลิก</button>' +
    '<button class="rf-save" id="tpSave"' + (n ? '' : ' disabled') + ' onclick="RF.taskPickSave()">' +

}
// วาดเฉพาะลิสต์ + ปุ่มบันทึก ไม่ rebuild ทั้ง sheet — กันช่องค้นหาหลุด focus/เคอร์เซอร์กระโดดขณะพิมพ์
function taskPickPatch(){
  const pk = S.taskPick; if (!pk) return;
  const l = document.getElementById('tpList'); if (l) l.innerHTML = taskPickListHtml();
  const x = document.getElementById('tpQx'); if (x) x.style.display = pk.q ? 'flex' : 'none';
  const b = document.getElementById('tpSave');
  const n = (pk.sel || []).length;
  if (b) { b.disabled = !n; b.textContent = n ? 'เพิ่ม ' + n + ' งาน' : 'เลือกงานก่อน'; }
}

/* ── Dashboard ── */
function dashHtml(){
  const mineOnly = S.dashMine !== false && !!S.me;          // เปิดมา = เห็นเฉพาะงานของเราก่อน
  const meE = S.me ? S.me.email : '';
  const all = allDec().filter(d => d.status !== 'cancelled');
  const act = mineOnly ? all.filter(d => d.mine) : all;
  const td = pd(todayIso());
  const overdue = act.filter(d => d.urg === 0);
  const done7 = S.tasks.filter(function(t){
    if (stOf(t) !== 'done' || !t.updatedAt) return false;
    if (mineOnly) { const u = taskUser(t); if (!u || u.email !== meE) return false; }
    const di = tsDateIso(t.updatedAt); return di && diffDays(di) >= -7;
  }).length;
  const scopeTog = S.me ? '<div class="rf-scope">' +
    '<button class="' + (mineOnly ? 'on' : '') + '" onclick="RF.dashScope(1)">ของฉัน</button>' +
    '<button class="' + (!mineOnly ? 'on' : '') + '" onclick="RF.dashScope(0)">ทั้งทีม</button></div>' : '';
  let h = '<div class="rf-view"><div class="rf-dashhead">' +
    '<div class="ttl"><h1 class="rf-h1">' + (mineOnly ? 'ภาพรวมของฉัน' : 'ภาพรวมทีม') + '</h1><div class="rf-sub" style="margin-top:0"><span class="full">วันนี้ · ' + DOWFULL[td.getDay()] + ' ' + fmtYmd(todayIso()) + '</span><span class="short">' + DOWFULL[td.getDay()] + ' ' + fmtShort(todayIso()) + '</span> <span style="opacity:.65">· v' + CFG.version + '</span></div></div>' +
    '<div class="ctl">' + scopeTog +
    (S.me ? '<button class="rf-perfbtn" onclick="RF.openPop(\'myperf\')" title="ผลงานของ' + esc(dispName(S.me)) + '">' + avUserHtml(S.me, 30) +
      '<span class="full">ผลงานของ' + esc(dispName(S.me)) + '</span><span class="short">ผลงานของฉัน</span></button>' : '') +
    '</div></div>' + rtCardHtml() + upNextHtml();

  const revs = sortL(act.filter(d => d.status === 'review'));
  if (S.me && S.me.role >= 5 && revs.length) {
    h += '<button class="rf-revbanner" onclick="RF.openPop(\'review\',' + dashScopeArg() + ')">🔍<div style="flex:1">มีงานรอตรวจ ' + revs.length + ' งาน — แตะเพื่อตรวจ</div>' + IC.chev + '</button>';
  }
  const openN = act.filter(d => d.status !== 'done').length;   // ยังไม่เสร็จ = todo+doing+review (ไม่รวมเสร็จ/ยกเลิก)
  h += '<div class="rf-stats">' +
    '<button class="rf-stat" onclick="RF.openPop(\'open\',' + dashScopeArg() + ')"><div class="l">ยังไม่เสร็จ</div><div class="v" style="color:var(--amber)">' + openN + '</div><div class="s">แตะดูทั้งหมด · จาก ' + act.length + ' งาน</div></button>' +
    '<button class="rf-stat" onclick="RF.openPop(\'status:doing\',' + dashScopeArg() + ')"><div class="l">กำลังทำ</div><div class="v" style="color:var(--blue)">' + act.filter(d => d.status === 'doing').length + '</div><div class="s">กำลังดำเนินการ</div></button>' +
    '<button class="rf-stat" onclick="RF.openPop(\'done7\',' + dashScopeArg() + ')"><div class="l">เสร็จแล้ว</div><div class="v" style="color:var(--green)">' + done7 + '</div><div class="s">ใน 7 วันล่าสุด</div></button>' +
    '<button class="rf-stat" onclick="RF.openPop(\'overdue\',' + dashScopeArg() + ')"><div class="l">เลยกำหนด</div><div class="v" style="color:var(--red)">' + overdue.length + '</div><div class="s" style="color:var(--red)">' + (overdue.length ? 'ต้องติดตามด่วน' : 'ไม่มี — เยี่ยม!') + '</div></button></div>';
  /* v2.89: % ปิดงานตรงเวลา ขึ้นหน้าภาพรวม — เดิมเห็นเฉพาะในหน้าผลงานรายคน
     หัวหน้าจะได้เห็นภาพรวมทันทีโดยไม่ต้องกดเข้าไปดูทีละคน · นับจาก "วันปิดจริง" (v2.88) ใน 30 วันล่าสุด
     ตัดงานที่ไม่ได้ตั้งกำหนดส่งออกจากการคิด % (ไม่มีอะไรให้เกิน) แต่ยังบอกจำนวนไว้ให้เห็น */
  h += onTimeBarHtml(mineOnly ? meE : '', 30);
  h += dashPlansHtml();   // v2.94: แผนที่กำลังเดิน เห็นตั้งแต่เปิดแอป

  // ผลลัพธ์ที่วัดได้ — ของฉัน หรือรวมทั้งทีมตามปุ่มขอบเขต (นับจากงานที่ปิดแล้วเท่านั้น)
  {
    const doneScope = S.tasks.filter(function(t){
      if (stOf(t) !== 'done') return false;
      const u = taskUser(t);
      if (!u) return false;
      return mineOnly ? u.email === meE : true;
    });
    h += impactSumHtml(doneScope, mineOnly ? '' : 'ทั้งทีม');
  }
  // 2 การ์ดสรุป (คลิกได้) — ย้ายขึ้นมาต่อจาก 4 กล่องสรุปทันที
  h += '<div class="rf-dashgrid">' + donutCardHtml(act) + dueBarsCardHtml(act) + '</div>';
  h += '<div class="rf-dashgrid"><div class="rf-dashcol">' + (mineOnly ? '' : wlCardHtml(act)) + feedCardHtml() + '</div><div class="rf-dashcol">' + upCardHtml(act) + '</div></div></div>';
  return h;
}

function wlCardHtml(dec){
  const tu = teamUsers();
  const wl0 = tu.map(u => {
    const mine = dec.filter(d => d.u && d.u.email === u.email && d.status !== 'done' && d.status !== 'cancelled');
    return { u, act: mine.length, od: mine.filter(d => d.urg === 0).length };
  });
  const mx = Math.max(1, ...wl0.map(w => w.act), 0);
  const byDept = {};
  wl0.forEach(w => { (byDept[w.u.dept] = byDept[w.u.dept] || []).push(w); });
  const depts = Object.keys(byDept);
  const gmax = Math.max(1, ...depts.map(k => byDept[k].reduce((a, w) => a + w.act, 0)), 0);
  let rows = '';
  depts.forEach(dept => {
    const g = byDept[dept];
    const act = g.reduce((a, w) => a + w.act, 0), od = g.reduce((a, w) => a + w.od, 0);
    const open = !!S.wlOpen[dept];
    rows += '<div class="rf-wlgroup"><button class="rf-wlhead" onclick="RF.toggleWl(\'' + jsq(dept) + '\')">' +
      '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="transform:rotate(' + (open ? 90 : 0) + 'deg)"><path d="m9 5 7 7-7 7"/></svg>' +
      '<div style="flex:1;min-width:0"><div style="display:flex;align-items:baseline;gap:8px;margin-bottom:5px;flex-wrap:wrap"><div style="font-size:14px;font-weight:700">' + esc(dept) + '</div>' +
      '<div style="font-size:13px;color:var(--muted)">' + g.length + ' คน · ' + act + ' งานค้าง</div>' +
      (od > 0 ? '<div style="font-size:13px;font-weight:600;color:var(--red)">เลยกำหนด ' + od + '</div>' : '') + '</div>' +
      '<div class="rf-bar"><div style="width:' + Math.round(act / gmax * 100) + '%;background:var(--accent)"></div><div style="width:' + Math.round(od / gmax * 100) + '%;background:var(--red)"></div></div></div></button>';
    if (open) {
      rows += '<div style="display:flex;flex-direction:column;gap:2px;padding:2px 8px 8px 26px;animation:fadeUp .18s ease-out">';
      g.forEach(w => {
        rows += '<button class="rf-wlrow" onclick="RF.openPerson(\'' + jsq(w.u.email) + '\')">' + avUserHtml(w.u, 28) +
          '<div style="flex:1;min-width:0"><div style="display:flex;align-items:baseline;gap:8px;margin-bottom:5px"><div style="font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(dispName(w.u)) + '</div>' +
          '<div style="font-size:13px;color:var(--muted)">' + w.act + ' งานค้าง</div>' +
          (w.od > 0 ? '<div style="font-size:13px;font-weight:600;color:var(--red)">เลยกำหนด ' + w.od + '</div>' : '') + '</div>' +
          '<div class="rf-bar" style="height:7px"><div style="width:' + Math.round(w.act / mx * 100) + '%;background:var(--accent)"></div><div style="width:' + Math.round(w.od / mx * 100) + '%;background:var(--red)"></div></div></div></button>';
      });
      rows += '</div>';
    }
    rows += '</div>';
  });
  if (!depts.length) rows = '<div class="rf-empty">ยังไม่มีงานที่มอบหมาย</div>';
  return '<div class="rf-card"><div class="rf-card-t">ภาระงานรายแผนก</div><div style="display:flex;flex-direction:column;gap:8px">' + rows + '</div></div>';
}

function feedList(){
  /* ตัด system log + คอมเม้นกำพร้าของงานที่ถูกลบไปแล้ว (คอมเม้นไม่ถูกลบตามงาน) */
  return S.comments.filter(c => c.type !== 'system' && S.tasks.some(x => x.id === c.taskId))
    .sort((a, b) => newFirst(a.createdAt, b.createdAt)).map(c => {   // ล่าสุดอยู่บน
    const u = userByEmail(c.authorEmail) || userByName(c.authorName);
    const t = S.tasks.find(x => x.id === c.taskId);
    return { c, u, nick: u ? dispName(u) : (c.authorName || '?'), init: u ? firstChar(u.nickname) : firstChar(c.authorName || '?'), photo: u ? u.photo : '', color: u ? u.color : 'var(--slate)', taskTitle: t ? t.title : '', taskId: c.taskId };
  });
}
function feedRowHtml(f){
  return '<button class="rf-feedrow" onclick="RF.openTask(\'' + jsq(f.taskId) + '\')">' +
    avCore(f.init, f.color, f.photo, 30) +
    '<div style="flex:1;min-width:0"><div style="font-size:13.5px;line-height:1.4"><span style="font-weight:700">' + esc(f.nick) + '</span><span style="color:var(--muted)"> คอมเม้นใน </span><span style="font-weight:600;color:var(--accent-ink)">' + esc(f.taskTitle) + '</span></div>' +
    '<div style="font-size:14px;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">' + esc(f.c.text) + '</div>' +
    '<div style="font-size:13px;color:var(--muted);margin-top:2px">' + timeLabel(f.c.createdAt) + '</div></div></button>';
}
function feedCardHtml(){
  const feed = feedList();
  let h = '<div class="rf-card"><div class="rf-card-t" style="margin-bottom:10px">คอมเม้นล่าสุด</div><div style="display:flex;flex-direction:column">';
  feed.slice(0, 3).forEach(f => { h += feedRowHtml(f); });
  if (!feed.length) h += '<div class="rf-empty">ยังไม่มีคอมเม้น — เปิดงานแล้วเริ่มคุยกันได้เลย</div>';
  h += '</div>';
  if (feed.length > 3) h += '<button class="rf-viewall" onclick="RF.openPop(\'feed\')">ดูทั้งหมด ' + feed.length + ' รายการ</button>';
  return h + '</div>';
}

function upList(dec){
  return sortL(dec.filter(d => d.urg === 0 || (d.status !== 'done' && d.urg !== 3 && d.sort >= 0 && d.sort <= 7)));
}
function upCardHtml(dec){
  const up = upList(dec);
  let h = '<div class="rf-card"><div class="rf-card-t" style="margin-bottom:10px">ครบกำหนดใน 7 วัน</div><div style="display:flex;flex-direction:column">';
  up.slice(0, 4).forEach(d => { h += rowHtml(d, { badge: true }); });
  if (!up.length) h += '<div class="rf-empty"><div style="width:48px;height:48px;border-radius:50%;background:var(--green-soft);color:var(--green);display:flex;align-items:center;justify-content:center;margin:0 auto 10px">' + IC.check + '</div>ไม่มีงานครบกำหนดในช่วงนี้</div>';
  h += '</div>';
  if (up.length > 4) h += '<button class="rf-viewall" onclick="RF.openPop(\'up\',' + dashScopeArg() + ')">ดูทั้งหมด ' + up.length + ' งาน</button>';
  return h + '</div>';
}

function donutCardHtml(dec){
  const C = 2 * Math.PI * 40;
  const total = dec.length;
  const entries = COLS.map(c => { const n = dec.filter(d => d.status === c.id).length; return { id: c.id, label: c.label, color: c.dot, n, frac: total ? n / total : 0 }; });
  let acc = 0, segs = '';
  entries.filter(e => e.n > 0).forEach(e => {
    segs += '<circle cx="60" cy="60" r="40" fill="none" stroke="' + e.color + '" stroke-width="15" stroke-dasharray="' + (e.frac * C).toFixed(2) + ' ' + C.toFixed(2) + '" stroke-dashoffset="' + (-acc * C).toFixed(2) + '" transform="rotate(-90 60 60)"/>';
    acc += e.frac;
  });
  let legend = '';
  entries.forEach(e => {
    legend += '<button class="rf-legrow" onclick="RF.openPop(\'status:' + e.id + '\',' + dashScopeArg() + ')">' +
      '<div style="width:11px;height:11px;border-radius:4px;background:' + e.color + ';flex-shrink:0"></div>' +
      '<div style="flex:1;font-size:13.5px;font-weight:600;text-align:left">' + e.label + '</div>' +
      '<div style="font-size:13.5px;font-weight:700">' + e.n + '</div>' +
      '<div style="font-size:13px;color:var(--muted);min-width:34px;text-align:right">' + Math.round(e.frac * 100) + '%</div>' +
      '<span style="color:var(--text-soft);display:flex;opacity:.5">' + IC.chev + '</span></button>';
  });
  return '<div class="rf-card"><div class="rf-card-t" style="margin-bottom:14px">สัดส่วนสถานะงาน</div>' +
    '<div style="display:flex;align-items:center;gap:18px;flex-wrap:wrap"><div style="position:relative;width:120px;height:120px;flex-shrink:0">' +
    '<svg width="120" height="120" viewBox="0 0 120 120"><circle cx="60" cy="60" r="40" fill="none" stroke="var(--surface2)" stroke-width="15"/>' + segs + '</svg>' +
    '<div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center"><div style="font-size:24px;font-weight:700;line-height:1.1">' + total + '</div><div style="font-size:13px;color:var(--muted)">งาน</div></div></div>' +
    '<div style="flex:1;min-width:150px;display:flex;flex-direction:column;gap:2px">' + legend + '</div></div></div>';
}

function dueBarsCardHtml(dec){
  const next7 = [];
  for (let i = 0; i < 7; i++) {
    const dIso = addDays(todayIso(), i);
    const dd = pd(dIso);
    next7.push({ iso: dIso, c: dec.filter(d => d.dueIso === dIso && d.status !== 'done').length, lab: DOWS[dd.getDay()] + ' ' + dd.getDate(), isT: i === 0 });
  }
  const bmax = Math.max(1, ...next7.map(b => b.c));
  let bars = '';
  next7.forEach(b => {
    bars += '<button class="rf-barcol" onclick="RF.openPop(\'due:' + b.iso + '\',' + dashScopeArg() + ')" title="แตะดูงานวันนี้"><div style="font-size:12.5px;font-weight:700;color:var(--muted);height:16px;line-height:16px">' + (b.c || '') + '</div>' +
      '<div class="bar" style="height:' + (b.c > 0 ? Math.max(10, Math.round(b.c / bmax * 70)) : 6) + 'px;background:' + (b.c > 0 ? 'var(--accent)' : 'var(--surface2)') + '"></div>' +
      '<div style="font-size:12.5px;font-weight:600;color:' + (b.isT ? 'var(--accent-ink)' : 'var(--muted)') + ';white-space:nowrap">' + b.lab + '</div></button>';
  });
  return '<div class="rf-card"><div class="rf-card-t" style="margin-bottom:3px">งานครบกำหนด 7 วันข้างหน้า</div>' +
    '<div style="font-size:12.5px;color:var(--muted);margin-bottom:10px">แตะแท่งเพื่อดูงานของวันนั้น</div>' +
    '<div class="rf-bars7" style="height:118px">' + bars + '</div></div>';
}

/* ชิปเป้าหมายบนหัวการ์ด (Surat เลือกแบบ "ชิปตัวเลข") — โชว์เฉพาะงานที่ตั้งเป้าไว้ */
function goalChipsHtml(taskId){
  const t = S.tasks.find(function(x){ return x.id === taskId; });
  if (!t || !hasGoal(t)) return '';
  let c = '';
  if (t.goalSales) c += '<span class="rf-goalchip">🎯 ขาย ฿' + esc(fmtMoney(t.goalSales)) + '/ด.</span>';
  if (t.goalProfit) c += '<span class="rf-goalchip">🎯 กำไร ฿' + esc(fmtMoney(t.goalProfit)) + '/ด.</span>';
  if (t.goalCost) c += '<span class="rf-goalchip">🎯 ลด ฿' + esc(fmtMoney(t.goalCost)) + '/ด.</span>';
  if (t.goalTime) c += '<span class="rf-goalchip">🎯 ' + esc(String(t.goalTime)) + ' ชม./วัน</span>';
  if (!c && String(t.goal || '').trim()) c = '<span class="rf-goalchip">🎯 ' + esc(String(t.goal).slice(0, 34)) + '</span>';
  return c ? '<div class="rf-goalchips">' + c + '</div>' : '';
}
/* ── Board (Kanban) ── */
function clChip(d){
  if (!d.clTotal) return '';
  const doneAll = d.clDone === d.clTotal;
  return '<div class="rf-cc" style="' + (doneAll ? 'color:var(--green)' : '') + '" title="เช็คลิสต์">' + IC.cl + d.clDone + '/' + d.clTotal + '</div>';
}
// คอมเม้นล่าสุดจากหัวหน้า (role>=5, ไม่ใช่ system log) ของงานนี้
function bossComment(taskId){
  let best = null;
  S.comments.forEach(c => {
    if (c.taskId !== taskId || c.type === 'system') return;
    const u = userByEmail(c.authorEmail) || userByName(c.authorName);
    if (isBoss(u) && (!best || c.createdAt > best.createdAt)) best = c;
  });
  return best;
}
// การ์ด kanban แบบกางดู: เช็คลิสต์ + คอมเม้นล่าสุดจากหัวหน้า (คืน '' ถ้าไม่มีอะไรให้กาง)
function cardExpand(d){
  const t = S.tasks.find(x => x.id === d.id);
  if (!t) return '';
  const cl = parseCl(t);
  const bc = bossComment(d.id);
  if (!cl.length && !bc) return '';
  const open = !!S.cardOpen[d.id];
  let panel = '';
  if (open) {
    let inner = '';
    if (cl.length) {
      inner += '<div class="rf-cardcl">';
      cl.forEach((it, i) => {
        inner += '<div class="rf-cardcl-i"><button class="rf-cardcl-b' + (it.d ? ' on' : '') + '"' +
          (canTickCl(t, it) ? ' onclick="event.stopPropagation();RF.clToggle(\'' + jsq(d.id) + '\',' + i + ')"' : ' disabled style="cursor:default"') + '>' + (it.d ? IC.checkS : '') + '</button>' +
          '<span class="' + (it.d ? 'done' : '') + '">' + (i + 1) + '. ' + esc(clStrip(it.t)) + '</span></div>';
      });
      inner += '</div>';
    }
    if (bc) {
      const u = userByEmail(bc.authorEmail) || userByName(bc.authorName);
      inner += '<div class="rf-cardbc">' + avCore(u ? firstChar(u.nickname) : '?', u ? u.color : 'var(--slate)', u ? u.photo : '', 20) +
        '<div style="flex:1;min-width:0"><div class="nm">' + esc(u ? dispName(u) : (bc.authorName || 'หัวหน้า')) + (isBoss(u) ? ' · หัวหน้า' : '') + '</div>' +
        '<div class="tx">' + esc(bc.text || '(แนบรูป)') + '</div></div></div>';
    }
    panel = '<div class="rf-cardex">' + inner + '</div>';
  }
  return '<button class="rf-cardex-tog" onclick="event.stopPropagation();RF.toggleCard(\'' + jsq(d.id) + '\')">' +
    '<span>' + (open ? 'ซ่อน' : 'เช็คลิสต์ & คอมเม้นหัวหน้า') + '</span>' +
    '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="transform:rotate(' + (open ? 180 : 0) + 'deg)"><path d="m6 9 6 6 6-6"/></svg></button>' + panel;
}
// สีคลังมาตรฐาน Rattana (ใช้ทุกแอป)
const WCOLOR = { W1:'#FBBF24', W2:'#0EA5E9', W3:'#EF4444', W4:'#15803D', C4:'#4ADE80', HQ:'#C9A84C' };
function wChip(w){
  w = String(w || '').trim().toUpperCase();
  if (!w) return '';
  const bg = WCOLOR[w] || 'var(--slate)';
  const dark = (w === 'W1' || w === 'C4');   // พื้นสว่าง → ตัวอักษรเข้ม
  return '<span style="font-size:11px;font-weight:700;padding:1px 7px;border-radius:6px;background:' + bg + ';color:' + (dark ? '#3a2f00' : '#fff') + '">' + esc(w) + '</span>';
}
// แถวแผนก+คลังของผู้รับผิดชอบ (โชว์บนการ์ด)
function wDeptLine(d){
  const w = d.warehouse || (d.u ? d.u.warehouse : '');
  const dept = d.dept || '';
  if (!w && !dept) return '';
  return '<div style="display:flex;align-items:center;gap:6px;margin-top:6px;min-width:0">' +
    (w ? wChip(w) : '') +
    (dept ? '<span style="font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0">' + esc(dept) + '</span>' : '') + '</div>';
}
/* v4.0: หัวการ์ด = ชื่องาน + กำหนดส่ง + เช็คลิสต์ อยู่บรรทัดเดียวกัน (Surat เลือกแบบ B แล้วสั่งเพิ่ม)
   เดิมชื่องาน 14.5px/600 แต่ชื่อคน 13.5px/700 → ชื่อคนหนากว่าชื่องาน + avatar 38px ดึงสายตา
   ชื่องานเลยจมทั้งที่เป็นของที่ต้องอ่านก่อน · ตอนนี้ชื่อ 16.5px/800 · คนเล็กลงเป็นบรรทัดรอง
   และยุบแถวล่าง (.rf-kbot) ขึ้นมาอยู่ข้างชื่อ → การ์ดเตี้ยลงอีก 1 แถว */
/* v4.1: ปุ่มโทรทวงงาน — เขียว กดแล้วโทรออกจากเครื่องทันที (Surat สั่ง)
   ไม่มีเบอร์ในชีทพนักงาน → ปุ่มจาง กดไม่ได้ แต่ยังอยู่ที่เดิม (ตำแหน่งปุ่มไม่ขยับไปมาระหว่างแถว) */
function callBtnHtml(u){
  const tel = telDigits(u), nm = u ? dispName(u) : '';
  if (!tel) return '<span class="rf-callbtn off" title="' + esc((nm ? nm + ' — ' : '') + 'ยังไม่มีเบอร์ในชีทพนักงาน') + '">' + IC.phone + '</span>';
  return '<a class="rf-callbtn" href="tel:' + esc(tel) + '" onclick="event.stopPropagation()" title="' + esc('โทรทวงงาน ' + nm + ' · ' + tel) + '">' + IC.phone + '</a>';
}
function kCardHeadHtml(d){
  return '<div class="rf-khead">' +
    '<div class="tt" title="' + esc(d.title) + '">' + esc(d.title) + '</div>' +
    '<div class="rf-kside">' +
      '<div class="rf-duechip" style="background:' + d.dueBg + ';color:' + d.dueFg + '" title="' + esc(d.dueTip) + '">' + d.dueText + '</div>' +
      (d.secret ? '<span title="ส่วนตัว" style="font-size:14px">🔒</span>' : d.priv ? '<span title="เฉพาะทีม" style="font-size:14px">👥</span>' : '') +
      clChip(d) + (d.cc > 0 ? '<div class="rf-cc">' + IC.cmt + d.cc + '</div>' : '') +
    '</div></div>';
}
function kCardMeta(d){
  const w = d.warehouse || (d.u ? d.u.warehouse : ''), dept = d.dept || '';
  return '<div class="rf-kmeta">' +
    '<div class="rf-kwho">' + avHtml(d, 26) +
      '<div style="min-width:0;flex:1">' +
        '<div class="nm" title="' + esc(d.avName) + '">' + esc(d.avName) + '</div>' +
        (w || dept ? '<div class="sub">' + (w ? wChip(w) : '') + (dept ? '<span class="dp">' + esc(dept) + '</span>' : '') + '</div>' : '') +
      '</div></div></div>';
}
function boardHtml(mob){
  let all = fDec();
  // กรองตามคลัง/แผนก (dropdown หัวบอร์ด) — เทียบจากคลัง/แผนกของผู้รับผิดชอบงาน
  if (S.filterWs && S.filterWs.length) all = all.filter(d => d.u && S.filterWs.indexOf(String(d.u.warehouse || '').trim().toUpperCase()) > -1);
  if (S.filterDept) all = all.filter(d => d.u && String(d.u.dept || '').trim() === S.filterDept);
  if (S.filterHandoff) all = all.filter(d => d.isHandoff);   // 📦 เฉพาะฝากของ
  // บอร์ดหลัก = งานที่ยังเดินอยู่ (ไม่รวม เสร็จแล้ว + ยกเลิก) — 2 อย่างนั้นดูในเมนู
  const dec = all.filter(d => d.status !== 'cancelled' && d.status !== 'done');
  const WORD = ['W1', 'W2', 'W3', 'W4', 'C4', 'HQ'];
  const ws = [...new Set(S.users.map(u => String(u.warehouse || '').trim().toUpperCase()).filter(Boolean))]
    .sort((a, b) => ((WORD.indexOf(a) + 1 || 99) - (WORD.indexOf(b) + 1 || 99)) || a.localeCompare(b));
  const ds = [...new Set(S.users.map(u => String(u.dept || '').trim()).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'th'));
  const opt = (v, sel, lb) => '<option value="' + esc(v) + '"' + (sel ? ' selected' : '') + '>' + esc(lb) + '</option>';
  // คลัง — "ทั้งหมด" แยกออกมา + dropdown เลือกได้หลายคลัง (default = คลังตัวเอง)
  const selWs = S.filterWs || [];
  const wAllOn = selWs.length === 0;
  const wLb = wAllOn ? 'ทุกคลัง' : (selWs.length <= 2 ? selWs.join(' · ') : selWs.length + ' คลัง');
  const wDrop = '<div class="rf-wfilter">' +
    '<button class="rf-wchip' + (wAllOn ? ' on' : '') + '" onclick="RF.setFWAll()">ทั้งหมด</button>' +
    '<div class="rf-wdd">' +
      '<button class="rf-wddbtn' + (wAllOn ? '' : ' on') + '" onclick="RF.toggleFwDD()">' + esc(wLb) + ' <span class="cv">▾</span></button>' +
      (S.fwOpen ? '<div class="rf-wddbg" onclick="RF.closeFwDD()"></div><div class="rf-wddpanel">' +
        ws.map(function(w){
          const c = WCOLOR[w] || 'var(--slate)', on = selWs.indexOf(w) > -1;
          return '<button class="rf-wddopt' + (on ? ' on' : '') + '" onclick="RF.toggleFW(\'' + esc(w) + '\')"><span class="dot" style="background:' + c + '"></span><span class="wn">' + esc(w) + '</span>' + (on ? '<span class="ck">✓</span>' : '') + '</button>';
        }).join('') + '</div>' : '') +
    '</div></div>';
  // ปุ่มดูงานที่ปิดแล้ว (เสร็จ/ยกเลิก) — ชิปบนหัวบอร์ดตามที่ Surat สั่ง
  const closedChips = '<button class="rf-closedchip" onclick="RF.openPop(\'done-all\')">✓ เสร็จ' + closedCountLabel('done') + '</button>' +
    '<button class="rf-closedchip can" onclick="RF.openPop(\'cancelled\')">🚫 ยกเลิก' + closedCountLabel('cancelled') + '</button>';
  // ตัวกรอง "เฉพาะฝากของ" — ดูว่าใครกำลังฝากอะไร
  const hoN = fDec().filter(d => d.isHandoff && d.status !== 'done' && d.status !== 'cancelled').length;
  const hoChip = '<button class="rf-closedchip ho' + (S.filterHandoff ? ' on' : '') + '" onclick="RF.toggleHandoffFilter()">📦 ฝากของ' + (hoN ? ' (' + hoN + ')' : '') + '</button>';
  const selD = '<select class="rf-fsel" onchange="RF.setFDept(this.value)">' + opt('', !S.filterDept, 'แผนก: ทั้งหมด') + ds.map(dp => opt(dp, S.filterDept === dp, dp)).join('') + '</select>';
  // สลับมุมมองการเรียง — default 'ครบกำหนด' ตามกฎเรียงลำดับของแอป · 'ใหม่สุด' ไว้ดูงานที่เพิ่งเข้ามา
  const sortTog = '<div class="rf-scope">' +
    '<button class="' + (S.sortMode !== 'new' ? 'on' : '') + '" onclick="RF.setSort(\'due\')" title="เรียงตามกำหนดส่ง — เลยกำหนด/ใกล้ครบขึ้นก่อน">⏰ ครบกำหนด</button>' +
    '<button class="' + (S.sortMode === 'new' ? 'on' : '') + '" onclick="RF.setSort(\'new\')" title="เรียงตามงานที่เข้ามาล่าสุด">🆕 ใหม่สุด</button></div>';
  let h = '<div class="rf-view"><div class="rf-boardbar"><h1 class="rf-h1">บอร์ดงาน</h1>' + memberChipHtml() + closedChips + hoChip +
    '<div class="rf-bbgap" style="flex:1"></div>' + wDrop + selD + sortTog + '</div>';
  if (!mob) {
    h += '<div class="rf-board-pc" style="grid-template-columns:repeat(' + BOARD_COLS.length + ',minmax(0,1fr))">';
    BOARD_COLS.forEach(c => {
      const cards = sortL(dec.filter(d => d.status === c.id));
      h += '<div class="rf-col' + (S.dragOverCol === c.id ? ' over' : '') + '" ondragover="RF.dragOver(event,\'' + c.id + '\')" ondrop="RF.drop(event,\'' + c.id + '\')">' +
        '<div class="rf-colhead"><div class="dot" style="background:' + c.dot + '"></div><div class="lb">' + c.label + '</div><div class="ct">' + cards.length + '</div></div>' +
        '<div style="display:flex;flex-direction:column;gap:8px">';
      cards.forEach(d => {
        h += '<div class="rf-kcard' + (S.dragId === d.id ? ' drag' : '') + '" draggable="true" ondragstart="RF.dragStart(event,\'' + jsq(d.id) + '\')" ondragend="RF.dragEnd()" onclick="RF.openTask(\'' + jsq(d.id) + '\')" style="border-top-color:' + SC[d.status][1] + '">' +
          kCardHeadHtml(d) + goalChipsHtml(d.id) + kCardMeta(d) + cardExpand(d) + '</div>';
      });
      if (!cards.length) h += '<div class="rf-kempty">ยังไม่มีงาน<br>ลากการ์ดมาวางที่นี่ได้</div>';
      h += '</div></div>';
    });
    h += '</div>';
  } else {
    if (S.boardCol >= BOARD_COLS.length) S.boardCol = 0;   // done หลุดออกจากบอร์ดแล้ว → กัน index ค้างเกิน
    h += '<div class="rf-segwrap"><div class="rf-seg">';
    BOARD_COLS.forEach((c, i) => {
      const n = dec.filter(d => d.status === c.id).length;
      h += '<button class="' + (S.boardCol === i ? 'on' : '') + '" onclick="RF.setBoardCol(' + i + ')"><div class="sl">' + c.label + '</div><div class="sc">' + n + '</div></button>';
    });
    h += '</div></div><div ontouchstart="RF.touchStart(event)" ontouchend="RF.touchEnd(event)" style="display:flex;flex-direction:column;gap:10px;min-height:340px;animation:fadeUp .22s ease-out">';
    const col = BOARD_COLS[S.boardCol];
    const cards = sortL(dec.filter(d => d.status === col.id));
    cards.forEach(d => {
      h += '<div class="rf-mcard" onclick="RF.openTask(\'' + jsq(d.id) + '\')" style="border-top-color:' + SC[d.status][1] + '">' +
        kCardHeadHtml(d) + goalChipsHtml(d.id) + kCardMeta(d) + cardExpand(d) + '</div>';
    });
    if (!cards.length) {
      h += '<div style="text-align:center;padding:44px 20px;color:var(--muted)"><div style="width:56px;height:56px;border-radius:18px;background:var(--surface2);display:flex;align-items:center;justify-content:center;margin:0 auto 12px">' + IC.board + '</div>' +
        '<div style="font-size:15px;font-weight:600;color:var(--text);margin-bottom:4px">ยังไม่มีงานในคอลัมน์นี้</div><div style="font-size:13.5px;margin-bottom:16px">สร้างงานใหม่หรือเลื่อนงานจากคอลัมน์อื่น</div>' +
        '<button onclick="RF.newTask()" style="min-height:44px;padding:0 22px;border-radius:12px;border:none;background:var(--accent);color:#fff;font-size:14.5px;font-weight:600;cursor:pointer">+ สร้างงานใหม่</button></div>';
    }
    h += '</div>';
  }
  return h + '</div>';
}

/* ── Calendar ── */
function calHtml(mob){
  const dec = fDec().filter(d => d.status !== 'cancelled');
  const wkStart = S.calWeekStart || weekStartOf(S.calSel || todayIso());
  const wkEnd = addDays(wkStart, 6);
  const title = S.calMode === 'week' ? (fmtYmd(wkStart) + ' – ' + fmtYmd(wkEnd)) : (MONFULL[S.calM] + ' ' + S.calY);
  const seg = (m, lb) => '<button class="' + (S.calMode === m ? 'on' : '') + '" onclick="RF.calMode(\'' + m + '\')">' + lb + '</button>';
  let h = '<div class="rf-view"><div class="rf-calbar"><h1 class="rf-h1">' + title + '</h1>' +
    '<button class="rf-calnav" onclick="RF.calNav(-1)">' + IC.back + '</button>' +
    '<button class="rf-calnav" onclick="RF.calNav(1)">' + IC.chev + '</button>' +
    '<button class="rf-todaybtn" onclick="RF.calToday()">วันนี้</button><div style="flex:1"></div>' +
    '<div class="rf-modeseg">' + seg('month', 'เดือน') + seg('week', 'สัปดาห์') + seg('agenda', 'กำหนดการ') + '</div></div>';
  h += calLegendHtml();

  if (S.calMode === 'month') h += calMonthHtml(dec, mob);
  else if (S.calMode === 'week') h += calWeekHtml(dec, mob, wkStart);
  else h += calAgendaHtml(dec);
  return h + calDayEvHtml(S.calSel) + '</div>';   // นัดจาก Google Calendar ของวันที่เลือก — ต่อท้ายทุกโหมด
}

/* คำอธิบายสีในปฏิทิน — พื้นหลังชิป = กำหนดส่ง (สัญญาณที่เด่นสุด) · งานเสร็จมีขีดฆ่าด้วย */
function calLegendHtml(){
  const item = function(bg, fg, lb){ return '<span class="rf-leg" style="background:' + bg + ';color:' + fg + '"><span class="d" style="background:' + fg + '"></span>' + lb + '</span>'; };
  return '<div class="rf-callegend">' +
    item('var(--red-soft)', 'var(--red)', 'เลยกำหนด') +
    item('var(--amber-soft)', 'var(--amber)', 'ใกล้ครบ ≤3 วัน') +
    item('var(--accent-soft)', 'var(--accent-ink)', 'ยังมีเวลา') +
    item('var(--green-soft)', 'var(--green)', 'เสร็จแล้ว') +
    '</div>';
}
function calMonthHtml(dec, mob){
  const y = S.calY, m = S.calM;
  const firstDow = new Date(y, m, 1).getDay();
  const dim = new Date(y, m + 1, 0).getDate();
  const total = Math.ceil((firstDow + dim) / 7) * 7;
  let h = '<div class="rf-card" style="padding:10px"><div class="rf-calgrid7" style="margin-bottom:4px">';
  DOWS.forEach(d => { h += '<div class="rf-dow">' + d + '</div>'; });
  h += '</div><div style="display:flex;flex-direction:column;gap:4px">';
  for (let w = 0; w < total / 7; w++) {
    h += '<div class="rf-calgrid7">';
    for (let i = 0; i < 7; i++) {
      const dte = new Date(y, m, 1 - firstDow + w * 7 + i);
      const dIso = isoOf(dte);
      const inM = dte.getMonth() === m;
      const dayTasks = sortL(dec.filter(d => d.dueIso === dIso));
      const isT = dIso === todayIso(), isSel = dIso === S.calSel;
      const hasOd = dayTasks.some(d => d.urg === 0);
      h += '<button class="rf-day' + (isSel ? ' sel' : '') + '" onclick="RF.calPick(\'' + dIso + '\')" style="min-height:' + (mob ? 52 : 104) + 'px;opacity:' + (inM ? 1 : .35) + '">' +
        '<div class="num' + (isT ? ' today' : '') + '">' + dte.getDate() + '</div>';
      if (!mob) {
        dayTasks.slice(0, 3).forEach(d => {
          const bg = d.urg === 0 ? 'var(--red-soft)' : d.status === 'done' ? 'var(--green-soft)' : d.urg === 1 ? 'var(--amber-soft)' : 'var(--accent-soft)';
          const fg = d.urg === 0 ? 'var(--red)' : d.status === 'done' ? 'var(--green)' : d.urg === 1 ? 'var(--amber)' : 'var(--accent-ink)';
          const sc = SC[d.status] || SC.todo;
          // แตะที่ชิปเปิดงานเลย (stopPropagation กันไปโดนปุ่มวันที่ครอบอยู่) · จุดสีบอกสถานะ · งานเสร็จขีดฆ่า
          h += '<div class="rf-daychip' + (d.status === 'done' ? ' done' : '') + '" style="background:' + bg + ';color:' + fg + '" ' +
            'title="' + esc(d.title + ' · ' + d.statusLabel + ' · ' + d.avName) + '" ' +
            'onclick="event.stopPropagation();RF.openTask(\'' + jsq(d.id) + '\')">' +
            '<span class="st" style="background:' + sc[1] + '"></span><span class="tx">' + esc(d.title) + '</span></div>';
        });
        if (dayTasks.length > 3) h += '<div style="font-size:12.5px;color:var(--muted);padding:0 6px">+' + (dayTasks.length - 3) + ' งาน</div>';
      } else if (dayTasks.length) {
        /* มือถือ: ตัวเลขต้องบอกได้ว่าวันนั้น "จบหรือยัง" — เดิมน้ำเงินหมด แยกไม่ออก
           เสร็จครบ = เขียวมี ✓ · ยังมีค้าง = สีตามความเร่ง + เลขคืองานที่ยังค้าง + จุดเขียวถ้ามีที่เสร็จแล้วปนอยู่ */
        const openT = dayTasks.filter(d => d.status !== 'done' && d.status !== 'cancelled');
        const doneN = dayTasks.filter(d => d.status === 'done').length;
        if (!openT.length) {
          h += '<div class="rf-dotcount done">✓' + dayTasks.length + '</div>';
        } else {
          const bg = hasOd ? 'var(--red)' : openT.some(d => d.urg === 1) ? 'var(--amber)' : 'var(--accent)';
          h += '<div class="rf-dotcount" style="background:' + bg + '">' + openT.length +
            (doneN ? '<span class="dn"></span>' : '') + '</div>';
        }
      }
      h += '</button>';
    }
    h += '</div>';
  }
  h += '</div></div>';
  const selRows = sortL(dec.filter(d => d.dueIso === S.calSel));
  const selD = pd(S.calSel);
  h += '<div class="rf-card" style="padding:16px"><div style="font-size:15px;font-weight:700;margin-bottom:8px">งาน' + DOWFULL[selD.getDay()] + ' ' + fmtYmd(S.calSel) + '</div><div style="display:flex;flex-direction:column">';

  if (!selRows.length) h += '<div class="rf-empty" style="padding:20px">ไม่มีงานครบกำหนดวันนี้</div>';
  return h + '</div></div>';
}

/* ── Team ── */
function miniChips(o){
  return '<div class="rf-minichips"><div class="rf-minichip" style="background:var(--slate-soft);color:var(--slate)">รอทำ ' + o.todo + '</div>' +
    '<div class="rf-minichip" style="background:var(--blue-soft);color:var(--blue)">กำลังทำ ' + o.doing + '</div>' +
    (o.review > 0 ? '<div class="rf-minichip" style="background:var(--amber-soft);color:var(--amber)">รอตรวจ ' + o.review + '</div>' : '') +
    (o.unack > 0 ? '<div class="rf-minichip rf-unackchip">⏳ ยังไม่กดรับ ' + o.unack + '</div>' : '') +
    '<div class="rf-minichip" style="background:var(--green-soft);color:var(--green)">เสร็จ ' + o.done + '</div></div>';
}
/* งานที่มอบให้คนนี้แล้วเขายังไม่กดรับ (ยังไม่ถึงวันเริ่ม) — หัวหน้าจะได้เห็นว่าใครดองงาน
   เกณฑ์เดียวกับ myUnackTasks() เป๊ะ เพื่อไม่ให้ตัวเลขสองที่ไม่ตรงกัน */
function unackCountFor(email){
  const em = String(email || '').toLowerCase();
  if (!em) return 0;
  return S.tasks.filter(function(t){
    if (stOf(t) !== 'todo' || t.ackAt) return false;
    const asg = String(t.assigneeEmail || '').toLowerCase();
    if (asg !== em || String(t.createdBy || '').toLowerCase() === asg) return false;
    if (startedDue(t)) return false;
    if (t.dueDate && diffDays(t.dueDate) <= 0) return false;
    return true;
  }).length;
}
function teamCardFoot(o){
  return '<div class="rf-bar" style="height:7px;margin-bottom:8px"><div style="width:' + o.pct + '%;background:var(--green)"></div></div>' +
    '<div style="display:flex;align-items:center;justify-content:space-between"><div style="font-size:13px;color:var(--muted)">เสร็จแล้ว ' + o.done + '/' + o.tot + ' งาน</div>' +
    (o.od > 0 ? '<div style="font-size:13px;font-weight:600;color:var(--red)">เลยกำหนด ' + o.od + ' งาน</div>' : '') + '</div>';
}
function statCnt(list, users){
  const c = st => list.filter(d => d.status === st).length;
  const done = c('done'), tot = list.length;
  let unack = 0;
  (users || []).forEach(function(u){ unack += unackCountFor(u.email); });
  return { todo: c('todo'), doing: c('doing'), review: c('review'), done, tot, pct: tot ? Math.round(done / tot * 100) : 0, od: list.filter(d => d.urg === 0).length, unack: unack };
}
/* v3.1: แท็บ "ทีม" รวม 2 อย่างที่เคยแยกกันอยู่ — หน้าทีมเดิม (รายแผนก/รายคน)
   กับชิป "งานทีม" ที่เคยอยู่ในหน้างานของฉัน · Surat เลือกให้มารวมที่เดียว */
function teamTasksHtml(){
  const teamEm = teamScopeEmails();
  const teamWs = [];
  S.users.forEach(function(u){
    const w = String(u.warehouse || '').trim().toUpperCase();
    if (w && teamEm[String(u.email || '').toLowerCase()] && teamWs.indexOf(w) < 0) teamWs.push(w);
  });
  teamWs.sort();
  if (S.mwTeamW && teamWs.indexOf(S.mwTeamW) < 0) S.mwTeamW = '';
  const list = sortL(allDec().filter(function(d){
    if (d.status === 'done' || d.status === 'cancelled') return false;
    if (!d.u || !teamEm[String(d.u.email || '').toLowerCase()]) return false;
    if (S.mwTeamW && String(d.u.warehouse || '').trim().toUpperCase() !== S.mwTeamW) return false;
    return true;
  }));
  const over = list.filter(function(d){ return d.urg === 0; }).length;
  let sel = '';
  if (teamWs.length > 1) {
    sel = '<select class="rf-fsel" style="max-width:150px" onchange="RF.mwTeam(this.value)">' +
      '<option value=""' + (S.mwTeamW ? '' : ' selected') + '>ทุกทีม</option>' +
      teamWs.map(function(w){ return '<option value="' + esc(w) + '"' + (S.mwTeamW === w ? ' selected' : '') + '>' + esc(w) + '</option>'; }).join('') +
      '</select>';
  }
  let h = '<div><h1 class="rf-h1">งานค้างทั้งทีม</h1><div class="rf-sub">' + list.length + ' งานค้าง' +
    (over ? ' · <span style="color:var(--red);font-weight:700">เลยกำหนด ' + over + '</span>' : '') + '</div></div>';
  if (sel) h += '<div class="rf-mwchips rf-teamsel">' + sel + '</div>';
  if (!list.length) h += '<div class="rf-empty" style="padding:36px 16px;text-align:center">ทีมไม่มีงานค้าง 🎉<div style="font-size:13px;color:var(--muted);margin-top:6px">งานของทุกคนในทีมจะมาโผล่ที่นี่ เรียงตามครบกำหนด</div></div>';
  else h += '<div class="rf-list">' + list.map(function(d){ return rowHtml(d, { badge: true }); }).join('') + '</div>';
  return h;
}
function teamModeChips(){
  const b = function(k, lb){
    return '<button class="rf-itemchip' + ((S.teamMode || 'people') === k ? ' on' : '') + '" onclick="RF.teamMode(\'' + k + '\')">' + lb + '</button>';
  };
  return '<div class="rf-mwchips">' + b('people', 'รายคน') + b('tasks', 'งานค้างทั้งทีม') + '</div>';
}
/* v4.7: เป้าของแต่ละทีมบนการ์ดแผนก — เห็นได้เฉพาะผู้บริหาร (Role ≥7) ตามที่ Surat กำหนด
   โชว์แค่บรรทัดเดียว (ทำได้/เป้า + %) · อยากดูละเอียดกดไปหน้าแผนที่กรองแผนกนั้นไว้ให้แล้ว
   ไม่คำนวณซ้ำ — ใช้ planStat ตัวเดียวกับหน้าแผน */
function teamGoalHtml(dept){
  if (!S.me || Number(S.me.role) < 7) return '';
  const ps = (S.plans || []).filter(function(p){ return String(p.dept || '') === dept; });
  if (!ps.length) return '';
  let goal = 0, real = 0;
  ps.forEach(function(p){ const st = planStat(p); goal += st.goalSales; real += st.sales; });
  if (!goal && !real) return '';
  const pct = goal ? Math.round(real / goal * 100) : null;
  const col = pct === null ? 'var(--muted)' : pct >= 80 ? 'var(--green)' : pct >= 40 ? 'var(--amber)' : 'var(--red)';
  return '<div class="rf-teamgoal"><span class="l">แผน ' + ps.length + ' · เป้า</span>' +
    '<span class="v">' + (goal ? '฿' + fmtMoney(real) + ' / ฿' + fmtMoney(goal) : '฿' + fmtMoney(real)) +
    (pct === null ? '' : ' <b style="color:' + col + '">' + pct + '%</b>') + '</span></div>';
}
function teamHtml(){
  // โหมด "งานค้างทั้งทีม" — ลิสต์งานของทุกคน (ของเดิมที่เคยเป็นชิปในหน้างานของฉัน)
  if ((S.teamMode || 'people') === 'tasks' && !S.teamSel && !S.deptSel) {
    return '<div class="rf-view">' + workTabsHtml() + teamModeChips() + teamTasksHtml() + '</div>';
  }
  const dec = allDec();
  const act = dec.filter(d => d.status !== 'cancelled');
  const tu = teamUsers();
  if (S.teamSel) {
    const u = userByEmail(S.teamSel);
    if (!u) { S.teamSel = null; return teamHtml(); }
    // layout เดียวกับหน้า "ผลงาน" (โปรไฟล์ + สถิติ + กราฟ + งานเสร็จ/ยังไม่เสร็จ)
    return '<div class="rf-view">' + workTabsHtml() + '<div><button class="rf-backbtn" onclick="RF.teamBack()" style="margin-bottom:6px">' + IC.back + 'กลับ</button></div>' + perfBody(u) + '</div>';
  }
  if (S.teamDept) {
    const ms = tu.filter(u => u.dept === S.teamDept);
    let h = '<div class="rf-view">' + workTabsHtml() + '<div><button class="rf-backbtn" onclick="RF.deptBack()" style="margin-bottom:12px">' + IC.back + 'ทุกแผนก</button>' +
      '<h1 class="rf-h1">แผนก' + esc(S.teamDept) + '</h1><div class="rf-sub">แตะที่การ์ดเพื่อดูงานรายคน</div></div><div class="rf-teamgrid">';
    ms.forEach(u => {
      const o = statCnt(act.filter(d => d.u && d.u.email === u.email), [u]);
      h += '<button class="rf-teamcard" onclick="RF.teamPick(\'' + jsq(u.email) + '\')"><div style="display:flex;align-items:center;gap:12px;margin-bottom:12px">' +
        '<div class="rf-av" style="width:44px;height:44px;font-size:19px;background:' + u.color + '">' + esc(firstChar(u.nickname)) + '</div>' +
        '<div style="min-width:0"><div style="font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(dispName(u)) + '</div>' +
        '<div style="font-size:13px;color:var(--muted)">' + esc(u.dept) + '</div></div></div>' + miniChips(o) + teamCardFoot(o) + '</button>';
    });
    return h + '</div></div>';
  }
  const deptMap = {};
  tu.forEach(u => { (deptMap[u.dept] = deptMap[u.dept] || []).push(u); });
  const depts = Object.keys(deptMap);
  let h = '<div class="rf-view">' + workTabsHtml() + teamModeChips() + '<div><h1 class="rf-h1">ทีม</h1><div class="rf-sub">' + depts.length + ' แผนก · สมาชิก ' + tu.length + ' คน · แตะแผนกเพื่อดูรายคน</div></div><div class="rf-teamgrid">';
  depts.forEach(dept => {
    const ms = deptMap[dept];
    const o = statCnt(act.filter(d => d.u && ms.some(u => u.email === d.u.email)), ms);
    h += '<button class="rf-teamcard" onclick="RF.deptPick(\'' + jsq(dept) + '\')"><div style="display:flex;align-items:center;gap:12px;margin-bottom:12px">' +
      '<div style="width:44px;height:44px;border-radius:13px;background:var(--accent-soft);color:var(--accent-ink);font-size:19px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0">' + esc(firstChar(dept)) + '</div>' +
      '<div style="min-width:0;flex:1"><div style="font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(dept) + '</div>' +
      '<div style="font-size:13px;color:var(--muted)">' + ms.length + ' คน</div></div>' + IC.chev + '</div>' + miniChips(o) + teamCardFoot(o) + teamGoalHtml(dept) + '</button>';
  });
  if (!depts.length) h += '<div class="rf-empty">ยังไม่มีงานที่มอบหมายให้สมาชิก</div>';
  return h + '</div></div>';
}

/* ── overlays ── */
function renderOverlays(){
  const box = document.getElementById('overlays');
  if (!box) return;
  if (!S.cmtMenu) { const om = document.getElementById('cmtMenu'); if (om) om.remove(); }   // v4.18: กวาดเมนูค้าง
  if (S.closing) return;   // ระหว่าง detail ปิด (animation) ห้าม rebuild — กันเด้งเปิดซ้ำ
  if (S._clDrag) return;   // ระหว่างลากจัดลำดับเช็คลิสต์ ห้าม rebuild — แถวที่ลากจะหาย
  invalidateDec();
  // จำ scroll ภายใน sheet ก่อน rebuild — กันเนื้อหาเด้งขึ้นบนสุดตอนติ๊กเช็คลิสต์/ส่งคอมเม้น/เลือกคนในฟอร์ม (เฉพาะตอน re-render — เปิดใหม่ (fresh) เริ่มบนสุดตามปกติ)
  const keep = {};
  // จำช่องที่กำลังพิมพ์ (คอมเม้น / เพิ่มเช็คลิสต์ / แก้ข้อความเช็คลิสต์ / ค้นหาคน) — sync เบื้องหลังมา rebuild ต้องไม่หลุด
  const fs = focusSnap();
  if (S.detailId && !S.detailFresh) { const el = document.getElementById('cmtScroll'); if (el) keep.cmtScroll = el.scrollTop; }
  if (S.formOpen && !S.formFresh) { const el = document.getElementById('formScroll'); if (el) keep.formScroll = el.scrollTop; }
  /* v4.15: ฟอร์มแผนใช้ id formScroll เหมือนกัน แต่การ์ดข้างบนเช็คแค่ S.formOpen (ฟอร์มงาน)
     ฟอร์มแผนเลยไม่เคยถูกจำตำแหน่ง → เลื่อนลงไปกรอกเป้าแล้วกดอะไรที เด้งขึ้นบนสุดทุกที */
  if (S.planForm && !S.planForm.fresh) { const el = document.getElementById('formScroll'); if (el) keep.formScroll = el.scrollTop; }
  if (S.listPop && !S.popFresh) { const el = document.getElementById('popScroll'); if (el) keep.popScroll = el.scrollTop; }
  let h = '';
  if (S.detailId) h += detailHtml();
  else if (S.taskPending) h += pendingTaskHtml();   // กดนอติแล้วงานยังไม่ sync มา → โชว์หน้ารอทันที
  if (S.impact) h += impactHtml();
  if (S.goalEdit) h += goalEditHtml();
  if (S.planForm) h += planFormHtml();
  if (S.planPick) h += planPickHtml();
  if (S.taskPick) h += taskPickHtml();
  if (S.imgView) h += imgViewHtml();
  if (S.formOpen) h += formHtml();
  if (S.listPop) h += popHtml();
  if (S.asgPick) h += asgPickHtml();
  if (S.recurForm) h += recurFormHtml();
  if (S.menuOpen) h += menuHtml();
  box.innerHTML = h;
  // entry animation เล่นเฉพาะตอนเปิดครั้งแรก — re-render ระหว่างเปิด (ส่งคอมเม้น/ติ๊กเช็คลิสต์) ไม่เล่นซ้ำ
  S.detailFresh = false; S.formFresh = false; S.popFresh = false; S.menuFresh = false;
  if (S.taskPending) S.taskPending.fresh = false;
  if (S.impact) S.impact.fresh = false;
  if (S.goalEdit) S.goalEdit.fresh = false;
  if (S.planForm) S.planForm.fresh = false;
  const ci = document.getElementById('cmtInput');
  if (ci && S.cmtDraft) ci.value = S.cmtDraft;
  focusBack(fs);   // คืน focus + เคอร์เซอร์ + ข้อความที่ค้างอยู่
  const sc = document.getElementById('cmtScroll');
  if (sc && S.scrollCmt) {
    const top = document.getElementById('cmtTop');   // คอมเม้นใหม่อยู่บนสุดของโซน → เลื่อนให้หัวโซนคอมเม้นขึ้นมาบน
    if (top) sc.scrollTop = sc.scrollTop + (top.getBoundingClientRect().top - sc.getBoundingClientRect().top) - 8;
    else sc.scrollTop = sc.scrollHeight;
    S.scrollCmt = false; delete keep.cmtScroll;
  }
  Object.keys(keep).forEach(function(id){ const el = document.getElementById(id); if (el) el.scrollTop = keep[id]; });
}

/* เป้าหมายที่ตั้งไว้ตอนสร้างงาน — โชว์ในฟอร์มปิดงานเพื่อเทียบ + คำนวณ % ตอนกรอกผลจริง */
function hasGoal(t){ return !!(t && (String(t.goal || '').trim() || t.goalSales || t.goalProfit || t.goalCost || t.goalTime)); }
function goalTextParts(t){
  const out = [];
  if (t.goalSales) out.push('ยอดขายเพิ่ม ฿' + fmtMoney(t.goalSales) + '/เดือน');
  if (t.goalProfit) out.push('กำไรเพิ่ม ฿' + fmtMoney(t.goalProfit) + '/เดือน');
  if (t.goalCost) out.push('ค่าใช้จ่ายลด ฿' + fmtMoney(t.goalCost) + '/เดือน');
  if (t.goalTime) out.push('ลดเวลา ' + t.goalTime + ' ชม./วัน');
  if (t.goalDept) out.push('แผนก' + t.goalDept);
  return out;
}
function goalCompareHtml(t, p){
  if (!t || !hasGoal(t)) return '';
  const parts = goalTextParts(t);
  const pct = function(actual, goal){
    const a = impactNum(actual), g = impactNum(goal);
    if (!g) return '';
    return Math.round(a / g * 100) + '%';
  };
  const rows = [];
  if (t.goalSales && p.sales) rows.push('ยอดขาย ' + pct(p.sales, t.goalSales) + ' ของเป้า');
  if (t.goalProfit && p.profit) rows.push('กำไร ' + pct(p.profit, t.goalProfit) + ' ของเป้า');
  if (t.goalCost && p.cost) rows.push('ค่าใช้จ่าย ' + pct(p.cost, t.goalCost) + ' ของเป้า');
  if (t.goalTime && p.time) rows.push('เวลา ' + pct(p.time, t.goalTime) + ' ของเป้า');
  return '<div class="rf-goalbox">' +
    '<div class="h">🎯 เป้าที่ตั้งไว้ตอนสั่งงาน</div>' +
    (parts.length ? '<div class="v">' + esc(parts.join(' · ')) + '</div>' : '') +
    (String(t.goal || '').trim() ? '<div class="d">' + linkify(t.goal) + '</div>' : '') +
    (rows.length ? '<div class="pc">✓ ' + esc(rows.join(' · ')) + '</div>' : '') + '</div>';
}

/* v2.96: แปลงลิงก์รูป Drive ให้เป็น CDN ตรง — drive.google.com/thumbnail ต้องมี session ของ Google
   พอเปิดจากในแอปอื่น (Facebook/LINE) ที่ไม่มี session รูปจะขึ้นเป็นกรอบเปล่า
   lh3.googleusercontent.com/d/<id> โหลดได้ทุกที่ · แปลงตอนแสดงผล รูปเก่าที่เก็บไว้แล้วก็ใช้ได้ทันที */
function driveImgUrl(u){
  const s = String(u || '').trim();
  if (!s) return '';
  if (s.indexOf('lh3.googleusercontent.com') >= 0) return s;
  const m = s.match(/[-\w]{25,}/);                       // ดึง file id ออกจากลิงก์ Drive ทุกรูปแบบ
  if (!m || s.indexOf('google') < 0) return s;           // ไม่ใช่ลิงก์ Drive → ปล่อยผ่าน
  return 'https://lh3.googleusercontent.com/d/' + m[0] + '=w1200';
}
function imgUrls(v){ return String(v || '').split(',').map(function(s){ return driveImgUrl(s.trim()); }).filter(Boolean); }
function taskImagesHtml(t){
  const a = imgUrls(t.images), b = imgUrls(t.doneImages);
  if (!a.length && !b.length) return '';
  const strip = function(list, label, cls){
    if (!list.length) return '';
    return '<div class="rf-imgrow' + (cls ? ' ' + cls : '') + '"><div class="lb">' + label + ' (' + list.length + ')</div><div class="ims">' +
      list.map(function(u){ return imgBtnHtml(u, '<img src="' + esc(u) + '" alt="" referrerpolicy="no-referrer" loading="lazy">'); }).join('') +
      '</div></div>';
  };
  return '<div class="rf-imgsec">' + strip(a, '📷 รูปตอนสั่งงาน', '') + strip(b, '✅ รูปตอนเสร็จ', 'done') + '</div>';
}

/* ถึง/เลยวันเริ่มงานแล้ว → ถือว่างานเริ่มทันที ไม่ต้องรอกดรับ (ปุ่ม "เริ่มทำ" ใช้ได้เลย)
   งานที่วันเริ่มยังไม่มาถึง ยังต้องกดรับตามเดิม — จะได้รู้ว่าเจ้าตัวเห็นงานที่รออยู่แล้ว */
function startedDue(t){ return t && t.startDate ? diffDays(t.startDate) <= 0 : false; }
// งานที่ยังไม่กดรับของเรา (ยังไม่ถึงวันเริ่ม) — ใช้เตือนบนหน้าแอปทุกวัน
function myUnackTasks(){
  if (!S.me) return [];
  const me = String(S.me.email || '').toLowerCase();
  return S.tasks.filter(function(t){
    if (stOf(t) !== 'todo' || t.ackAt) return false;
    const asg = String(t.assigneeEmail || '').toLowerCase();
    if (!asg || asg !== me) return false;
    if (String(t.createdBy || '').toLowerCase() === asg) return false;      // งานที่ตัวเองสร้าง ไม่ต้องรับ
    if (startedDue(t)) return false;                                        // ถึงวันเริ่มแล้ว = เริ่มได้เลย
    if (t.dueDate && diffDays(t.dueDate) <= 0) return false;                // ครบกำหนดแล้ว = ต้องลงมือ ไม่ต้องรับ
    return true;
  });
}
function fmtMoney(v){ const n = Number(String(v).replace(/[^\d.]/g, '')); return isNaN(n) ? String(v) : n.toLocaleString('en-US'); }
function impactNum(v){ const n = Number(String(v == null ? '' : v).replace(/[^\d.]/g, '')); return isNaN(n) ? 0 : n; }
/* รวมผลลัพธ์ที่วัดได้จากงานที่ปิดแล้ว — ใช้ในหน้า "ผลงานของ…"
   ตัวเลขในงานเป็นค่าต่อเดือน/ต่อวัน → รวมกันตรงๆ = ผลรวมที่คนคนนี้สร้างไว้ (ไม่ใช่ค่าเฉลี่ย) */
function impactSumHtml(doneTasks, scopeLabel){
  const has = doneTasks.filter(hasImpact);
  const sum = { sales: 0, profit: 0, cost: 0, time: 0 };
  const depts = {};
  has.forEach(function(t){
    sum.sales += impactNum(t.impactSales);
    sum.profit += impactNum(t.impactProfit);
    sum.cost += impactNum(t.impactCost);
    sum.time += impactNum(t.impactTime);
    const d = String(t.impactDept || '').trim(); if (d) depts[d] = (depts[d] || 0) + 1;
  });
  const noSum = !sum.sales && !sum.profit && !sum.cost && !sum.time;
  if (!has.length) {
    if (!doneTasks.length) return '';
    return '<div class="rf-imsum empty">🏆 ยังไม่มีสรุปผลจากงานที่ปิดไป ' + doneTasks.length + ' งาน' + (scopeLabel ? ' (' + esc(scopeLabel) + ')' : '') +
      '<div class="s">เปิดงานที่เสร็จแล้วกด “เพิ่มสรุปผล” เพื่อเก็บเป็นผลงานที่วัดได้</div></div>';
  }
  let chips = '';
  if (sum.sales) chips += '<div class="rf-imstat"><div class="v">฿' + fmtMoney(sum.sales) + '</div><div class="l">ยอดขายเพิ่ม/เดือน</div></div>';
  if (sum.profit) chips += '<div class="rf-imstat"><div class="v">฿' + fmtMoney(sum.profit) + '</div><div class="l">กำไรเพิ่ม/เดือน</div></div>';
  if (sum.cost) chips += '<div class="rf-imstat"><div class="v">฿' + fmtMoney(sum.cost) + '</div><div class="l">ค่าใช้จ่ายลด/เดือน</div></div>';
  if (sum.time) chips += '<div class="rf-imstat"><div class="v">' + fmtMoney(Math.round(sum.time * 10) / 10) + ' ชม.</div><div class="l">เวลาที่ลดได้/วัน</div></div>';
  const dl = Object.keys(depts).sort(function(a, b){ return depts[b] - depts[a]; });
  return '<div class="rf-imsum">' +

/* v4.13: สถานะส่งของคอมเม้นตัวเอง (Surat สั่ง — "แบบ LINE")
   sending = ยังอยู่ในคิวและกำลังส่ง · failed = ส่งไม่ผ่าน ระบบลองใหม่ให้ทุก 20 วิ · sent = ยืนยันว่าถึงชีทแล้ว
   ผูกกับ clientId ไม่ใช่ id เพราะตอนกำลังส่งยังไม่มี id จากชีท
   v4.14: ✓ ต้องค้างข้ามการปิดแอปเหมือนแอปแชทจริง (Surat สั่ง) — เดิมเก็บใน memory เปิดใหม่แล้วติ๊กหาย
   เก็บเป็นลิสต์ clientId ใน localStorage · เก็บ 400 ตัวล่าสุดพอ (คอมเม้นเก่ากว่านั้นไม่มีใครเลื่อนไปดูสถานะแล้ว) */
const CMTSENT_KEY = 'rf_cmtsent', CMTSENT_MAX = 400;
const _cmtSent = {};
function cmtSentLoad(){
  try { (JSON.parse(localStorage.getItem(CMTSENT_KEY) || '[]') || []).forEach(function(c){ if (c) _cmtSent[c] = 1; }); } catch(e){}
}
function cmtSentMark(cid){
  if (!cid || _cmtSent[cid]) return;
  _cmtSent[cid] = 1;
  try { localStorage.setItem(CMTSENT_KEY, JSON.stringify(Object.keys(_cmtSent).slice(-CMTSENT_MAX))); } catch(e){}
}
function cmtStat(c){
  const cid = c && c.clientId;
  if (!cid || !S.me || String(c.authorEmail || '').toLowerCase() !== String(S.me.email).toLowerCase()) return '';
  const q = wqOp(cid);
  if (q) return q.inflight ? 'sending' : 'failed';
  return _cmtSent[cid] ? 'sent' : '';
}
function cmtStatHtml(c){
  const st = cmtStat(c);
  if (!st) return '';
  if (st === 'sending') return '<div class="rf-cmtstat sending"><span class="rf-spin sm"></span>กำลังส่ง</div>';
  if (st === 'sent') return '<div class="rf-cmtstat sent">ส่งแล้ว ✓</div>';

/* ══ v2.84: วาดใหม่เฉพาะจุด (targeted re-render) ══
   เดิมทุกการกระทำเล็กๆ (ติ๊ก 1 ข้อ · ส่งคอมเม้น 1 อัน) เรียก render() + renderOverlays()
   = สร้าง HTML ทั้งแอปใหม่แล้วยัด innerHTML ทับ → ต้นตอของอาการ "จอเด้ง · ที่พิมพ์ค้างหาย · เลื่อนกลับบนสุด"
   ตอนนี้แตะอะไร วาดใหม่แค่ก้อนนั้น: เช็คลิสต์ → #clSection · คอมเม้น → #cmtSection + #dfoot

   กติกาของ patch ทุกตัว:
   1. เจอ element ไม่ครบ / เปิดงานอื่นอยู่ → คืน false ให้ผู้เรียกถอยไปใช้ render() แบบเดิม (ต้องไม่มีทางจอค้างข้อมูลเก่า)
   2. จำ scroll + ช่องที่กำลังพิมพ์ ก่อนแตะ DOM แล้วคืนหลังเสร็จ
   3. การ์ดที่อยู่ข้างหลัง overlay ผู้ใช้มองไม่เห็นตอนนี้ → ตั้ง flag ไว้ แล้ววาดใหม่ทีเดียวตอนปิดหน้างาน (bgDirty) */
function bgDirty(){ S._bgDirty = true; }
function flushBg(){ if (!S._bgDirty) return; S._bgDirty = false; invalidateDec(); render(); }
/* v2.89: ติ๊ก 1 ข้อ → แตะ DOM แค่แถวนั้น + ตัวเลข x/y + แถบความคืบหน้า
   ใช้ได้เฉพาะช่วงที่ลำดับถูกล็อกอยู่ (_clFreeze 3 วิหลังติ๊ก) เพราะแถวยังอยู่ที่เดิมแน่นอน
   พ้น 3 วิแล้วค่อยวาดทั้งก้อนทีเดียวเพื่อจัดข้อที่เสร็จลงล่าง (ดู RF.clToggle) */
function patchClItem(id, i){
  if (S.detailId !== id || S.closing || S._clDrag || S.clEdit) return false;
  const fz = S._clFreeze;
  if (!fz || fz.id !== id || Date.now() >= fz.until) return false;   // ลำดับอาจสลับ → ต้องวาดทั้งก้อน
  const t = S.tasks.find(function(x){ return x.id === id; });
  if (!t) return false;
  const cl = parseCl(t);
  const it = cl[i];
  const row = document.querySelector('#clDragList .rf-cl-item[data-cli="' + i + '"]');
  if (!it || !row) return false;
  row.outerHTML = clItemHtml(t, it, i, canEdit(t), decorate(t).status === 'cancelled', cl.length);
  const done = cl.filter(function(x){ return x.d; }).length;
  const cnt = document.getElementById('clCount');
  if (cnt) { cnt.textContent = done + '/' + cl.length; cnt.style.color = done === cl.length ? 'var(--green)' : 'var(--muted)'; }
  const fill = document.getElementById('clBarFill');
  if (fill) fill.style.width = Math.round(done / cl.length * 100) + '%';
  const nTodo = document.getElementById('clTodoN'), nDone = document.getElementById('clDoneN');
  if (nTodo) nTodo.textContent = (cl.length - done);      // เลขหัวกองบอกความจริงทันที ถึงแม้แถวยังไม่ย้ายกอง
  if (nDone) nDone.textContent = done;
  bgDirty();
  return true;
}
// วาดใหม่เฉพาะก้อนเช็คลิสต์ในหน้างานที่เปิดอยู่ · คืน false = ทำไม่ได้ ให้ผู้เรียกไปทางเดิม
function patchCl(id){
  if (S.detailId !== id || S.closing || S._clDrag) return false;
  const t = S.tasks.find(function(x){ return x.id === id; });
  const box = document.getElementById('clSection');
  if (!t || !box) return false;
  const sc = document.getElementById('cmtScroll');
  const top = sc ? sc.scrollTop : 0;
  const fs = focusSnap();

  /* หัวการ์ด v2.82: ปุ่มเด่นตามสถานะ + ปุ่มไลน์ (Surat ใช้บ่อย) · ที่เหลือยุบใน ⋯
     เดิมมี 4-5 ปุ่มเรียงกัน + ชิปสถานะซ้ำ 2 ที่ อ่านแล้วงง */
  const lineBtn = '<button class="rf-linebtn" onclick="RF.shareLine(\'' + jsq(t.id) + '\')" title="' + (isPhone() ? 'ส่งงานนี้เข้าไลน์' : 'คัดลอกข้อความไปวางในไลน์') + '">' + IC.send + (isPhone() ? 'ไลน์' : 'ส่งไลน์') + '</button>';
  const moreItems = (edit && !isCan ? '<button onclick="RF.editTask(\'' + jsq(t.id) + '\')">' + IC.edit + 'แก้ไขงาน</button>' : '') +
    '<button onclick="RF.repeatTask(\'' + jsq(t.id) + '\')">📄 ทำซ้ำงานนี้</button>' +
    (edit && !isCan ? '<button onclick="RF.planPickOpen(\'' + jsq(t.id) + '\')">🗂️ ย้ายเข้าแผน…</button>' : '') +
    (!isCan && d.status !== 'done' && !t.ackAt && iAmAsg ? '<button onclick="RF.ackTask(\'' + jsq(t.id) + '\')">✋ กดรับงาน</button>' : '') +
    '<button onclick="RF.copyTaskLink(\'' + jsq(t.id) + '\')">🔗 คัดลอกลิงก์งาน</button>' +
    (canCancel ? '<button class="danger" onclick="RF.cancelTask(\'' + jsq(t.id) + '\')">🚫 ยกเลิกงาน</button>' : '');
  const moreBtn = moreItems ? '<div class="rf-moremenu"><button class="rf-morebtn" onclick="event.stopPropagation();RF.toggleMore()" title="เพิ่มเติม">⋯</button>' +
    (S.moreOpen ? '<div class="rf-morebg" onclick="event.stopPropagation();RF.closeMore()"></div><div class="rf-morepanel" onclick="event.stopPropagation()">' + moreItems + '</div>' : '') + '</div>' : '';
  const actionBar = (ctaPart || lineBtn) ? '<div class="rf-actbar">' + ctaPart + lineBtn + '</div>' : '';
  const rep = userByEmail(t.reporterEmail) || userByName(t.reporterName);
  const repNick = rep ? dispName(rep) : (t.reporterName || '—');
  // ผู้ร่วมงาน — โชว์รวมช่องเดียว (avatar เรียง + ชื่อ) ถ้ามี
  const collabEmails = collabOf(t);
  let collabMeta = '';
  if (collabEmails.length) {
    // รูป + ชื่อ ไล่เรียงเป็นคู่ๆ ต่อกันไป คั่นด้วย , — เดิมแยกเป็น 2 ก้อน (แถวรูป + ก้อนชื่อ) พออยู่มือถือชื่อถูกบีบเป็นคอลัมน์แคบ
    const people = collabEmails.map(function(em){
      const u = userByEmail(em);
      return '<span class="rf-personchip">' + avUserHtml(u || { nickname: '?', color: 'var(--slate)', photo: '' }, 24) +
        '<span class="nm">' + esc(u ? dispName(u) : em) + '</span></span>';
    }).join('<span class="rf-personsep">,</span>');
    collabMeta = '<div style="grid-column:1/-1"><div class="rf-meta-l">ผู้ร่วมงาน (' + collabEmails.length + ')</div>' +
      '<div class="rf-personlist">' + people + '</div></div>';
  }
  // ── ฝากของ: ป้ายกำกับ + ผู้รับปลายทาง + ของ ──
  const isHo = String(t.type || '') === 'handoff';
  const destU = isHo && t.dest ? userByEmail(t.dest) : null;
  let handoffMeta = '';
  if (isHo) {
    handoffMeta = '<div><div class="rf-meta-l">ผู้รับปลายทาง</div><div style="display:flex;align-items:center;gap:8px">' +
      (destU ? avUserHtml(destU, 28) : '<div class="rf-av" style="width:28px;height:28px;font-size:13px;background:var(--slate)">?</div>') +
      '<div><div style="font-size:14px;font-weight:600;line-height:1.3">' + esc(destU ? dispName(destU) : (t.dest || '—')) + '</div><div style="font-size:13px;color:var(--muted);line-height:1.3">' + esc(destU ? (destU.dept || '') : '') + '</div></div></div></div>' +
      '<div style="grid-column:1/-1"><div class="rf-meta-l">ของที่ฝาก</div><div style="font-size:15px;font-weight:600">' + (esc(hItemsLabel(t.items)) || '—') + '</div></div>';
  }

  let pills = '';
  const canPill = iAmAsg && !isCan;   // กดเปลี่ยนสถานะตรงๆ ได้เฉพาะผู้รับผิดชอบ · หัวหน้าใช้ปุ่มตรวจผ่าน/ตีกลับ/ยกเลิกแทน
  COLS.forEach(c => {
    const on = d.status === c.id;
    let st = on ? 'background:' + SC[c.id][0] + ';color:' + SC[c.id][1] + ';border-color:' + SC[c.id][1] + ';' : '';
    if (!canPill) st += 'cursor:default;opacity:' + (on ? '1' : '.5') + ';';
    pills += '<button class="rf-pill" style="' + st + '"' + (canPill ? ' onclick="RF.setStatus(\'' + jsq(t.id) + '\',\'' + c.id + '\')"' : ' disabled') + '>' + c.label + '</button>';
  });

  // แถบ "รับทราบงาน" — ผู้รับผิดชอบกดยืนยันว่าเห็นงานแล้ว (ผู้สั่งเห็นว่ารับแล้ว/ยัง)
  let ackHtml = '';
  {
    const openTask = !isCan && stOf(t) !== 'done';
    if (t.ackAt) {
      const au = userByEmail(t.ackBy);
      ackHtml = '<div class="rf-ackrow ok">✓ รับงานแล้ว · ' + esc(au ? dispName(au) : (t.ackBy || '')) + ' · ' + esc(timeLabel(t.ackAt)) + '</div>';
    } else if (iMustAck) {
      ackHtml = '<div class="rf-ackrow wait">ต้องกดรับงานก่อน ถึงจะเริ่มทำได้</div>';
    } else if (d.autoDoing && openTask) {
      // ถึงวันเริ่มแล้วยังไม่กดรับ — งานเดินเองแล้ว แต่ยังไม่มีใครยืนยันว่าเห็น (ผู้สั่งได้นอติทุกวัน)
      ackHtml = '<div class="rf-ackrow wait" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">' +
        '<span style="flex:1;min-width:180px">▶️ ถึงวันเริ่มแล้ว ระบบถือว่า “กำลังทำ” · ⏳ ยังไม่กดรับงาน</span>' +
        (iAmAsg ? '<button class="rf-editbtn" onclick="RF.ackTask(\'' + jsq(t.id) + '\')">✋ กดรับเลย</button>' : '') + '</div>';
    } else if (needAck && openTask) {
      ackHtml = '<div class="rf-ackrow wait">⏳ ยังไม่กดรับงาน</div>';
    }
  }

  /* เช็คลิสต์ย่อย — แยกเป็น function เพื่อ patch เฉพาะก้อนนี้ได้ (ดู patchCl) */
  const clHtml = clSectionHtml(t, edit, isCan);

  return '<div class="rf-ov ' + (mob ? 'bottom' : 'center') + '" style="' + (S.detailFresh ? '' : 'animation:none') + '" onclick="RF.closeDetail()">' +
    '<div class="' + (mob ? 'rf-sheet' : 'rf-modal rf-detailmodal') + '" style="' + (S.detailFresh ? '' : 'animation:none') + '" onclick="event.stopPropagation()">' +
    '<div class="rf-dhead">' + (mob ? '<div class="rf-grab"></div>' : '') +
    '<div class="rf-dh-titlerow"><h2 class="rf-dh-title">' + esc(t.title) + '</h2>' +
    '<span class="rf-statuspill" style="background:' + SC[d.status][0] + ';color:' + SC[d.status][1] + ';flex-shrink:0">' + d.statusLabel + (d.autoDoing ? ' (อัตโนมัติ)' : '') + '</span>' +
    moreBtn +
    '<button class="rf-xbtn" onclick="RF.closeDetail()">' + IC.x + '</button></div>' +
    actionBar + '</div>' +
    '<div class="rf-dbody" id="cmtScroll">' +
    '<div class="rf-dmeta-line">' +
    (d.unack ? '<span class="rf-spill" style="background:var(--amber-soft);color:var(--amber);font-size:12.5px;font-weight:800;padding:4px 10px;border-radius:99px">⏳ ยังไม่กดรับ</span>' : '') +

    (isSecret(t) ? '<span class="rf-privbadge">🔒 ส่วนตัว</span>' : isPrivate(t) ? '<span class="rf-privbadge">👥 เฉพาะทีม</span>' : '') +
    '</div>' +   // v4.9: "เหลือกี่วัน" ย้ายไปต่อท้ายกำหนดส่งแล้ว (Surat) — แถวนี้จะได้ว่างเมื่อไม่มีป้ายอื่น
    ackHtml +
    '<div class="rf-metagrid">' +
    '<div><div class="rf-meta-l">' + (isHo ? 'ผู้รับฝาก (คนถือไปส่ง)' : 'ผู้รับผิดชอบ') + '</div><div style="display:flex;align-items:center;gap:8px">' + avHtml(d, 28) +
    '<div><div style="font-size:14px;font-weight:600;line-height:1.3">' + esc(d.avName) + '</div><div style="font-size:13px;color:var(--muted);line-height:1.3">' + esc(d.dept || '—') + '</div></div></div></div>' +
    '<div><div class="rf-meta-l">' + (isHo ? 'ผู้ฝาก' : 'ผู้สั่งงาน') + '</div><div style="display:flex;align-items:center;gap:8px">' +
    (rep ? avUserHtml(rep, 28) : '<div class="rf-av" style="width:28px;height:28px;font-size:13px;background:var(--accent)">' + esc(firstChar(repNick)) + '</div>') +
    '<div><div style="font-size:14px;font-weight:600;line-height:1.3">' + esc(repNick) + '</div><div style="font-size:13px;color:var(--muted);line-height:1.3">' + esc(bossLabel(rep, true) || (rep ? rep.dept : '')) + '</div></div></div></div>' +
    handoffMeta + collabMeta +
    '<div><div class="rf-meta-l">' + (isHo ? 'วันที่ส่ง' : 'วันเริ่ม') + '</div><div style="font-size:14px;font-weight:600">' + (t.startDate ? fmtYmd(t.startDate) : '—') + '</div></div>' +
    '<div><div class="rf-meta-l">' + (isHo ? 'คาดว่าจะถึง' : 'กำหนดส่ง') + '</div>' +
    '<div class="rf-duecell"><span style="font-size:14px;font-weight:600;color:' + (dm.urg === 0 ? 'var(--red)' : dm.urg === 1 ? 'var(--amber)' : 'var(--text)') + '">' + (t.dueDate ? fmtYmd(t.dueDate) : 'ไม่มีกำหนด') + '</span>' +
    (remain ? '<span class="rf-remain" style="background:' + dm.bg + ';color:' + dm.fg + '">' + remain + '</span>' : '') +
    /* v4.21: รหัสงานย้ายมาต่อท้ายกำหนดส่ง (Surat สั่ง) — เดิมอยู่บรรทัดของตัวเองเหนือกรอบ
       กินทั้งแถวเพื่อข้อความ 9 ตัวอักษร · ย้ายเข้ามาในกรอบแล้วประหยัดไป 1 บรรทัดเต็ม */
    '<button class="rf-taskcode" onclick="RF.copyCode(\'' + jsq(t.id) + '\')" title="แตะเพื่อคัดลอกรหัสงาน">' + esc(t.id) + '</button>' +
    '</div></div></div>' +
    /* v4.12: แผน + เป้าหมาย ขึ้นมาก่อนแถบสถานะ (Surat สั่ง)
       เดิมอยู่ใต้รายละเอียด/หมายเหตุ ต้องเลื่อนผ่านข้อความยาวๆ ถึงจะเจอ
       ทั้งคู่ตอบว่า "งานนี้อยู่ในแผนไหน ต้องได้ผลเท่าไหร่" — ควรเห็นก่อนจะไปกดเปลี่ยนสถานะ */
    planRowHtml(t) +
    goalCardHtml(t) +
    // v2.83: ลืมตั้งเป้าตอนสร้าง → ตั้งทีหลังได้ ไม่ต้องสร้างงานใหม่ (งานที่ยังไม่ปิด/ไม่ถูกยกเลิก)
    (!hasGoal(t) && !isCan && d.status !== 'done' && canEdit(t)
      ? '<button class="rf-imadd goal" onclick="RF.goalEditOpen(\'' + jsq(t.id) + '\')">🎯 ตั้งเป้าหมายของงานนี้</button>' : '') +
    (isCan
      ? '<div class="rf-cancelnote">🚫 งานนี้ถูกยกเลิกแล้ว' + (S.me && S.me.role >= 5 ? ' — กด "เปิดงานอีกครั้ง" ด้านล่างเพื่อนำกลับมา' : ' — หัวหน้า (R5+) เปิดใหม่ได้') + '</div>'
      : '<div><div class="rf-meta-l" style="margin-bottom:7px">สถานะ</div><div class="rf-pills">' + pills + '</div></div>') +
    '<div><div class="rf-meta-l" style="margin-bottom:6px">รายละเอียด</div><div style="font-size:14.5px;line-height:1.65;white-space:pre-wrap">' + linkify(t.detail || '—') + '</div></div>' +
    (t.note ? '<div class="rf-notebox"><div style="font-size:13px;font-weight:700;color:var(--amber);margin-bottom:4px">หมายเหตุ</div><div style="font-size:14px;line-height:1.6;white-space:pre-wrap">' + linkify(t.note) + '</div></div>' : '') +
    taskImagesHtml(t) +
    impactCardHtml(t) +
    /* งานปิดแล้วแต่ยังไม่ได้สรุปผล — เติมทีหลังได้ (ตอนปิดงานข้ามไปก่อนได้ ไม่บังคับ)
       v2.91: งานต่อเนื่อง (ไม่มีกำหนดส่ง · ยังไม่ปิด) กรอกได้ด้วย — เดิมปุ่มโผล่เฉพาะงานที่ปิดแล้ว
       งานพวกนี้ไม่มีวันปิด จึงไม่มีวันได้กรอกผลงานเลย ทั้งที่เป็นงานที่สร้างมูลค่าต่อเนื่องที่สุด */
    ((!hasImpact(t) && canEdit(t) && !isCan && (d.status === 'done' || !t.dueDate))
      ? '<button class="rf-imadd" onclick="RF.impactOpen(\'' + jsq(t.id) + '\',0)">🏆 ' + (d.status === 'done' ? 'เพิ่มสรุปผลที่ได้จากงานนี้' : 'บันทึกผลที่ได้ถึงตอนนี้') + '</button>' : '') +
    clHtml +
    cmtSectionHtml(t) +
    '</div>' +
    dfootHtml(t) +
    '</div></div>';
}

// ช่องวันที่ YYYY/MM/DD — โชว์ slash แต่ value เก็บ YYYY-MM-DD, ใช้ native picker (showPicker) ให้เลือกง่ายบนมือถือ/PC
/* v3.8: กำหนด/แก้วันที่ได้เฉพาะหัวหน้า (Role 5+) — Surat สั่ง ใช้ทั้งแอป
   คนอื่นยังเห็นวันที่ แต่กดแก้ไม่ได้ (ช่อง input ไม่ถูก render เลย ไม่ใช่แค่ disabled)
   ⚠️ เป็นเรื่อง "สิทธิ์" → ใช้ role เหมือนเดิม ไม่ใช่ isBoss() ที่เป็นแค่ป้ายชื่อ */
function canSetDate(){ return !!(S.me && Number(S.me.role) >= 5); }
const DATE_LOCK_NOTE = '<div class="rf-imhint" style="margin-top:6px">กำหนดวันได้เฉพาะหัวหน้า (Role 5+)</div>';
function dateField(field, value, err, locked){
  const disp = fmtYmd(value);
  return '<div class="rf-datewrap' + (err ? ' err' : '') + (locked ? ' locked' : '') + '">' +
    '<div class="rf-datedisp' + (disp ? '' : ' ph') + '">' + (disp || (locked ? 'หัวหน้าเป็นคนกำหนด' : 'YYYY/MM/DD')) + '</div>' +
    '<span class="rf-dateic">' + IC.calsm + '</span>' +
    (locked ? '' : '<input type="date" class="rf-datenat" value="' + esc(value || '') + '" onchange="RF.fdate(\'' + field + '\',this)" onclick="try{this.showPicker()}catch(e){}">') +
    '</div>';
}
function assListHtml(){
  const aq = (S.assigneeQ || '').toLowerCase();
  const all = S.users.filter(u => !aq || ((u.name || '') + ' ' + (u.nickname || '') + ' ' + (u.dept || '') + ' ' + (u.warehouse || '') + ' ' + (u.email || '')).toLowerCase().includes(aq));
  const list = rankUsers(all).slice(0, 50);   // ทีมตัวเองขึ้นก่อน แล้วเรียง ก-ฮ
  let h = '', lastG = -1;
  list.forEach(u => {
    const g = userGroup(u);
    if (g !== lastG) { lastG = g; if (UGLABEL[g]) h += '<div class="rf-ughead">' + UGLABEL[g] + '</div>'; }
    h += '<button class="rf-assrow" onclick="RF.pickAss(\'' + jsq(u.email) + '\')">' + avUserHtml(u, 28) +
      '<div style="flex:1;min-width:0"><div style="font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(dispName(u)) + (g === 0 ? ' <span style="font-weight:600;color:var(--muted)">(ตัวเอง)</span>' : '') + '</div>' +
      '<div style="font-size:13px;color:var(--muted)">' + esc(u.dept || '') + (u.warehouse ? ' · ' + esc(u.warehouse) : '') + '</div></div></button>';
  });
  if (!list.length) h = '<div style="padding:16px;text-align:center;color:var(--muted);font-size:13.5px">ไม่พบสมาชิกที่ค้นหา</div>';
  else if (all.length > list.length) h += '<div style="padding:10px 14px;text-align:center;color:var(--muted);font-size:12.5px">แสดง ' + list.length + ' จาก ' + all.length + ' คน — พิมพ์ค้นหาเพื่อกรองให้แคบลง</div>';
  return h;
}
/* ผู้ร่วมงาน (หลายคน) — ชิปคนที่เลือก + ช่องค้นหาเพิ่ม · เจ้าของร่วมเต็มตัว (เห็น/แจ้งเตือน/แก้/ติ๊ก) */
function collabListRows(){
  const f = S.form || {};
  const cq = (S.collabQ || '').toLowerCase();
  const picked = (f.collaborators || []).map(function(e){ return String(e).toLowerCase(); });
  const asg = String(f.assigneeEmail || '').toLowerCase();
  const all = S.users.filter(function(u){
    const e = String(u.email || '').toLowerCase();
    if (e === asg || picked.indexOf(e) > -1) return false;            // ตัดผู้รับผิดชอบ + คนที่เลือกแล้ว
    return !cq || ((u.name || '') + ' ' + (u.nickname || '') + ' ' + (u.dept || '') + ' ' + (u.warehouse || '') + ' ' + (u.email || '')).toLowerCase().includes(cq);
  });
  const list = rankUsers(all).slice(0, 40);
  let h = '';
  list.forEach(function(u){
    h += '<button class="rf-assrow" onclick="RF.collabAdd(\'' + jsq(u.email) + '\')">' + avUserHtml(u, 26) +
      '<div style="flex:1;min-width:0"><div style="font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(dispName(u)) + '</div>' +
      '<div style="font-size:13px;color:var(--muted)">' + esc(u.dept || '') + (u.warehouse ? ' · ' + esc(u.warehouse) : '') + '</div></div>' +
      '<span style="color:var(--accent-ink);font-weight:800;font-size:18px;flex-shrink:0">+</span></button>';
  });
  if (!list.length) h = '<div style="padding:14px;text-align:center;color:var(--muted);font-size:13.5px">' + (cq ? 'ไม่พบสมาชิกที่ค้นหา' : 'เลือกครบทุกคนแล้ว') + '</div>';
  return h;
}
function collabPickHtml(){
  const f = S.form || {};
  const chips = (f.collaborators || []).map(function(em){
    const u = userByEmail(em);
    return '<span class="rf-collabchip">' + avUserHtml(u || { nickname:'?', color:'var(--slate)', photo:'' }, 20) +
      '<span class="nm">' + esc(u ? dispName(u) : em) + '</span>' +
      '<button onclick="RF.collabRemove(\'' + jsq(em) + '\')" title="เอาออก">' + IC.xs + '</button></span>';
  }).join('');
  return '<div><div class="rf-flabel">ผู้ร่วมงาน <span style="font-weight:500;color:var(--muted)">(ไม่บังคับ · หลายคนได้)</span></div>' +
    (chips ? '<div class="rf-collabchips">' + chips + '</div>' : '') +
    '<div style="position:relative;margin-bottom:6px">' +
    '<input id="fCollabQ" class="rf-finput" style="padding-right:42px" value="' + esc(S.collabQ || '') + '" oninput="RF.collabQ(this.value)" placeholder="ค้นหาชื่อเพื่อเพิ่มผู้ร่วมงาน…">' +
    '<button id="fCollabQx" class="rf-qx" style="display:' + (S.collabQ ? 'flex' : 'none') + '" onclick="RF.collabQClear()">' + IC.xs + '</button></div>' +
