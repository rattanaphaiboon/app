<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>R-Flow — ติดตามงานทีม v4.22</title>
<link rel="icon" type="image/png" href="r-flow-icon.png">
<link rel="manifest" href="r-flow.webmanifest">
<link rel="apple-touch-icon" href="r-flow-icon.png">
<meta name="theme-color" content="#1E3A8A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="R-Flow">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{
/* ── บันได z-index กลาง (v2.85) — ห้ามใส่เลขมั่วรายจุดอีก ──
   บั๊คจริงที่เจอ: ป๊อป "มอบหมายรายการย่อย" ตั้งไว้ 70 แต่ฟอร์มสร้างงานอยู่ 80
   → กด "+ มอบหมาย" ในฟอร์ม ป๊อปเปิดจริงแต่ไปอยู่ใต้ฟอร์ม มองไม่เห็นและกดไม่ได้
   กติกา: ป๊อปที่ "เปิดจากข้างใน overlay อื่น" (--z-ov-sub) ต้องสูงกว่าทุกตัวที่เปิดมันได้ */
--z-ov-pop:66;      /* ป๊อปลิสต์งาน (เปิดจากหน้าหลัก) */
--z-ov-detail:70;   /* หน้ารายละเอียดงาน */
--z-ov-form:80;     /* ฟอร์มสร้าง/แก้งาน · ฟอร์มงานประจำ */
--z-ov-sheet:82;    /* สรุปผล · เป้าหมาย (เปิดจากหน้างาน) */
--z-menu:85;        /* เมนูหลัก */
--z-ov-sub:88;      /* ป๊อปย่อยที่เปิดได้จากทั้งหน้างานและฟอร์ม — ต้องอยู่บนสุดของกลุ่ม overlay */
--z-toast:95;
--z-imgview:97;     /* v4.3: กดรูปแล้วขยายเต็มจอ — ต้องอยู่บนสุดจริงๆ ทับได้ทุกอย่างรวม toast */
--bg:#F4F6F8;--surface:#FFFFFF;--surface2:#EDF0F4;--border:#E2E6EB;--text:#1A242E;--muted:#65717F;
--accent:#1E3A8A;--accent-soft:#E8EDF9;--accent-ink:#16266B;--accent-glow:rgba(30,58,138,.45);
--blue:#2264D1;--blue-soft:#E7EEFA;--amber:#A85B08;--amber-soft:#FAEEDC;--green:#1B8A4C;--green-soft:#E3F3E9;--red:#D23B2E;--red-soft:#FBE8E5;--slate:#64707E;--slate-soft:#ECEFF2;
/* 🔴 v4.11: สีของ "แผน" — ถูกใช้ 15+ จุดตั้งแต่ v2.93 แต่ไม่เคยประกาศไว้เลย
   var() ที่ชี้ไปตัวแปรที่ไม่มีจริง = ทั้ง declaration ตกไปใช้ค่า initial
   → border-color กลายเป็น currentColor · background กลายเป็นโปร่งใส
   อาการที่เห็น: ติ๊กเลือกงานเข้าแผนแล้วกล่องติ๊กหายทั้งกล่อง (ขอบขาวบนพื้นขาว ถูกขาว)
   โดนหมดทุกจุดที่เป็นสีม่วง: ขอบซ้ายการ์ดแผน · ชิปแผนบนการ์ดงาน · เลขบนเมนู · ปุ่มเลือกแผน */
--purple:#6D3FC4;--purple-soft:#EFE9FB;
--shadow:0 1px 2px rgba(18,28,38,.05),0 3px 10px rgba(18,28,38,.06);
--shadow-lg:0 12px 48px rgba(12,20,28,.24);
}
body.dark{
--bg:#0E1316;--surface:#161C21;--surface2:#1E252C;--border:#29323B;--text:#E9EEF3;--muted:#93A0AE;
--accent-soft:#17244A;--accent-ink:#94AEE8;
--blue:#7FAEF2;--blue-soft:#1C2B44;--amber:#E5A85D;--amber-soft:#342917;--green:#5FCB8E;--green-soft:#173321;--red:#F08376;--red-soft:#3B201C;--slate:#9AA7B5;--slate-soft:#242D35;
--purple:#A78BFA;--purple-soft:#261D3D;
--shadow:0 1px 2px rgba(0,0,0,.35),0 3px 10px rgba(0,0,0,.28);
--shadow-lg:0 12px 48px rgba(0,0,0,.6);
}
*{-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'IBM Plex Sans Thai','Noto Sans Thai',sans-serif;font-size:14px;-webkit-font-smoothing:antialiased;touch-action:manipulation}
button{font-family:inherit;font-size:inherit;color:inherit}
input,textarea,select{font-family:inherit;color:var(--text)}
input::placeholder,textarea::placeholder{color:var(--muted)}
@keyframes shimmer{0%{background-position:120% 0}100%{background-position:-120% 0}}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes panelIn{from{transform:translateX(48px);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,14px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes popIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── shell ── */
.rf-shell{min-height:100vh;min-height:100dvh;display:flex;align-items:stretch;background:var(--bg)}
.rf-main{flex:1;min-width:0;display:flex;flex-direction:column}
.rf-content{flex:1;padding:clamp(14px,2.5vw,26px);width:100%;max-width:1480px;margin:0 auto;box-sizing:border-box}
/* ⚠️ ห้ามใส่ animation/transition ที่ใช้ transform ตรงนี้ (เดิม fadeUp = translateY)
   transform บนตัวครอบทำให้ position:sticky/fixed ข้างในอิงกับกล่องนี้แทน viewport
   → หัวบอร์ดหยุดต่ำกว่า header 8px (การ์ดวิ่งผ่านช่องนั้นให้เห็น) และ dropdown ลอยผิดที่
   ใช้ fadeIn (opacity อย่างเดียว) แทน — ไม่สร้าง containing block */
.rf-view{display:flex;flex-direction:column;gap:16px;animation:fadeIn .28s ease-out}
h1.rf-h1{margin:0;font-size:clamp(20px,2.4vw,25px);font-weight:700}
.rf-sub{color:var(--muted);font-size:14px;margin-top:2px}

/* ── sidebar (desktop) ── */
.rf-side{width:242px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);position:sticky;top:0;height:100vh;height:100dvh;display:flex;flex-direction:column}
.rf-logo-row{display:flex;align-items:center;gap:10px;padding:18px 16px 14px 16px}
.rf-logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent-ink));color:#fff;font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.rf-logo-name{font-size:16px;font-weight:700;line-height:1.2}
.rf-logo-sub{font-size:12.5px;color:var(--muted);line-height:1.2}
.rf-ver{font-size:11px;font-weight:700;color:var(--accent-ink);background:var(--accent-soft);border-radius:99px;padding:1px 8px;margin-left:auto}
.rf-nav{display:flex;flex-direction:column;gap:2px;padding:6px 10px}
.rf-navbtn{display:flex;align-items:center;gap:11px;min-height:42px;padding:0 12px;border-radius:10px;border:none;cursor:pointer;text-align:left;font-size:14px;font-weight:600;background:transparent;color:var(--muted)}
.rf-navbtn:hover{background:var(--surface2)}
.rf-navbtn.on{background:var(--accent-soft);color:var(--accent-ink)}
.rf-memhead{display:flex;align-items:center;justify-content:space-between;padding:10px 10px 0 10px}
.rf-memtog{display:flex;align-items:center;gap:7px;min-height:36px;padding:0 8px;border:none;border-radius:9px;background:none;color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;flex:1;text-align:left}
.rf-memtog:hover{background:var(--surface2)}
.rf-memtog svg{transition:transform .18s}
.rf-clearf{border:none;background:none;color:var(--accent-ink);font-size:13px;font-weight:600;cursor:pointer;padding:2px 8px}
.rf-memlist{display:flex;flex-direction:column;gap:2px;padding:2px 10px;overflow-y:auto;flex:1}
.rf-membtn{display:flex;align-items:center;gap:10px;min-height:40px;padding:0 12px;border-radius:10px;border:none;cursor:pointer;text-align:left;background:transparent;color:var(--text)}
.rf-membtn:hover{background:var(--surface2)}
.rf-membtn.on{background:var(--accent-soft)}
.rf-membtn .n{flex:1;font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rf-membtn .c{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.rf-sidefoot{padding:12px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:8px}
.rf-darkbtn{display:flex;align-items:center;gap:10px;min-height:40px;padding:0 12px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--muted);font-size:14px;font-weight:500;cursor:pointer}
.rf-darkbtn:hover{background:var(--surface2)}
.rf-me{display:flex;align-items:center;gap:10px;padding:4px 6px}
.rf-me .nm{font-size:14px;font-weight:600;line-height:1.25}
.rf-me .dp{font-size:12.5px;color:var(--muted);line-height:1.25}
.rf-out{margin-left:auto;width:32px;height:32px;border:none;border-radius:9px;background:none;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center}
.rf-out:hover{background:var(--surface2);color:var(--red)}

/* ── header ── */
/* หัวบอร์ด (ชิปคลัง + แผนก + เรียง) ติดบนตอนเลื่อน — เกาะใต้ header หลักที่ sticky อยู่แล้ว
   ใช้ตัวแปรความสูง header เพื่อไม่ให้ทับกัน (มือถือ header เตี้ยกว่า) */
.rf-boardbar{position:sticky;top:var(--headh,58px);z-index:30;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:10px 0;margin:-10px 0 0;background:var(--bg);box-shadow:0 8px 10px -8px rgba(18,28,38,.16)}
.rf-head{position:sticky;top:0;z-index:40;background:rgba(244,246,248,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--border);padding:10px clamp(14px,2.5vw,24px);padding-top:calc(10px + env(safe-area-inset-top));display:flex;align-items:center;gap:10px}
body.dark .rf-head{background:rgba(14,19,22,.82)}
.rf-head .mlogo{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent-ink));color:#fff;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.rf-loginlogo img,.rf-logo img,.rf-head .mlogo img{width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block}
.rf-search{position:relative;flex:1;max-width:560px}
.rf-search>svg{position:absolute;left:13px;top:50%;transform:translateY(-50%)}
.rf-search input{width:100%;box-sizing:border-box;height:44px;padding:0 38px 0 38px;border-radius:12px;border:1px solid var(--border);background:var(--surface);font-size:15px;outline:none}
.rf-search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.rf-qx{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:32px;height:32px;border:none;border-radius:50%;background:var(--surface2);color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center}
/* ⚠️ ห้ามใช้ animation ที่มี transform ที่นี่ — ข้างในมี .rf-qsec ที่ sticky (transform ทำให้ sticky อิงผิดจุด) */
.rf-qdrop{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-lg);overflow:hidden auto;max-height:min(64vh,440px);z-index:50;animation:fadeIn .16s ease-out;-webkit-overflow-scrolling:touch}
.rf-qrow{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:8px 14px;border:none;background:none;cursor:pointer;text-align:left;border-bottom:1px solid var(--border);box-sizing:border-box}
.rf-qrow:hover{background:var(--surface2)}
/* ช่องค้นหาแคบกว่าผลลัพธ์มาก (จอใหญ่แชร์ที่กับตัวคั่น · มือถือเหลือ ~143px)
   → กางเฉพาะ dropdown: จอใหญ่ยึดซ้ายกว้าง 520 · มือถือ fixed เต็มจอ ไม่ผูกกับความกว้างช่อง */
@media (min-width:841px){.rf-qdrop{right:auto;width:520px}}
/* มือถือ: กางเต็มความกว้าง — ใช้ absolute อิงกล่องค้นหา (ห้ามใช้ fixed เพราะ .rf-head มี backdrop-filter
   ซึ่งกลายเป็น containing block ทำให้ fixed อ้างอิงผิดจุด) */
@media (max-width:840px){.rf-qdrop{left:-46px;right:-46px;width:auto;max-height:min(70vh,520px)}}
.rf-qrow:last-child{border-bottom:none}
.rf-qrow .t2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rf-qrow .rf-duechip{flex-shrink:0}
.rf-qsec{position:sticky;top:0;z-index:1;display:flex;align-items:center;gap:6px;padding:7px 14px 6px;background:var(--surface2);font-size:11.5px;font-weight:800;letter-spacing:.4px;color:var(--muted);border-bottom:1px solid var(--border)}
.rf-qcnt{flex-shrink:0;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:700;background:var(--slate-soft);color:var(--muted);white-space:nowrap}
.rf-qcnt.on{background:var(--accent-soft);color:var(--accent-ink)}
.rf-iconbtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--border);background:var(--surface);color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.rf-iconbtn:hover{background:var(--surface2)}
.rf-newbtn{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 18px;border-radius:12px;border:none;background:var(--accent);color:#fff;font-size:14.5px;font-weight:600;cursor:pointer;box-shadow:var(--shadow)}
.rf-newbtn:hover{filter:brightness(1.08)}
.rf-newbtn:active{transform:scale(.97)}

/* ── cards / common ── */
.rf-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px;box-shadow:var(--shadow)}
.rf-card-t{font-size:15.5px;font-weight:700;margin-bottom:12px}
.rf-av{border-radius:50%;color:#fff;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-sizing:border-box;position:relative;overflow:hidden}
.rf-av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.rf-av.none{background:transparent!important;color:var(--muted);border:1.5px dashed var(--muted)}
/* รายชื่อคน (ผู้ร่วมงาน ฯลฯ) — รูปติดชื่อเป็นคู่ ไหลต่อกันไป คั่นด้วยจุลภาค */
.rf-personlist{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px}
.rf-personchip{display:inline-flex;align-items:center;gap:6px;background:var(--surface2);border-radius:99px;padding:3px 11px 3px 3px;max-width:100%}
.rf-personchip .nm{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rf-personsep{color:var(--muted);font-weight:700;margin-left:-3px}
.rf-linebtn{display:flex;align-items:center;justify-content:center;gap:7px;flex:1;min-height:42px;border-radius:11px;border:none;background:#06C755;color:#fff;font-size:14px;font-weight:700;cursor:pointer}
/* นัดที่ดึงมาจาก Google Calendar (ดูอย่างเดียว) */
.rf-gcrow{display:flex;align-items:center;gap:9px;padding:8px 0;border-top:1px dashed var(--border);font-size:13.5px}
.rf-gcrow:first-of-type{border-top:none}
.rf-gcrow .dot{width:9px;height:9px;border-radius:50%;background:#7986cb;flex-shrink:0}
.rf-gcrow .tm{font-size:12px;color:var(--muted);flex-shrink:0;min-width:82px}
.rf-gcrow .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rf-calset{display:flex;align-items:center;gap:8px;margin-top:9px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.rf-calset select{height:32px;border:1.5px solid var(--border);border-radius:9px;background:var(--surface);color:var(--text);font-size:12.5px;font-weight:600;padding:0 8px;font-family:inherit;cursor:pointer}
.rf-callink{border:none;background:none;color:var(--red);font-size:12.5px;font-weight:700;cursor:pointer;padding:2px 4px;font-family:inherit}
/* งานประจำ — ใบเช็ครายวัน */
.rf-rtdate{display:flex;align-items:center;gap:6px;margin-bottom:12px}
.rf-rtdate button{width:32px;height:32px;border-radius:9px;border:1.5px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:0}
.rf-rtdate button:disabled{opacity:.35;cursor:default}
.rf-rtdate button.tdy{width:auto;padding:0 11px;font-size:12.5px;font-weight:700;color:var(--accent-ink);font-family:inherit}
.rf-rtdate .d{flex:1;text-align:center;font-size:14px;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rf-rtsum{display:flex;align-items:center;gap:12px;padding:13px 14px;border:1px solid var(--border);border-left:4px solid var(--slate);border-radius:14px;background:var(--surface);box-shadow:var(--shadow);margin-bottom:10px}
.rf-rtsum .n{font-size:18px;font-weight:800;line-height:1.25}
.rf-rtsum .s{font-size:13px;color:var(--muted);margin-top:2px}
.rf-rtsum .pc{font-size:24px;font-weight:800;flex-shrink:0}
.rf-rtrow{display:flex;align-items:center;gap:11px;padding:10px 0;border-top:1px solid var(--border)}
.rf-rtrow:first-of-type{border-top:none}
.rf-rtrow .mid{flex:1;min-width:0}
.rf-rtrow .n{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rf-rtrow .s{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rf-rtrow .sc{font-size:13px;font-weight:800;padding:4px 10px;border-radius:9px;white-space:nowrap;flex-shrink:0}
.rf-rtgridwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.rf-rtgrid{border-collapse:separate;border-spacing:0;font-size:13px;width:100%;min-width:520px}
.rf-rtgrid th{font-size:11px;font-weight:700;color:var(--muted);text-align:center;padding:5px 3px;line-height:1.25}
.rf-rtgrid th:first-child{text-align:left;min-width:150px;font-size:12.5px}
.rf-rtgrid td{text-align:center;padding:3px;border-top:1px solid var(--border)}
.rf-rtgrid td:first-child{text-align:left;font-weight:600;font-size:13.5px;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rf-rtgrid .c{display:inline-flex;align-items:center;justify-content:center;min-width:27px;height:26px;padding:0 3px;border-radius:8px;font-size:12px;font-weight:800}
.rf-rtgrid .c.f{background:var(--green-soft);color:var(--green)}
.rf-rtgrid .c.p{background:var(--amber-soft);color:var(--amber)}
.rf-rtgrid .c.z{background:var(--red-soft);color:var(--red)}
.rf-rtgrid .c.o{background:var(--surface2);color:var(--muted);opacity:.7}
.rf-rtcard{display:flex;align-items:center;gap:12px;width:100%;box-sizing:border-box;padding:12px 13px;margin:14px 0 0;border:1px solid var(--border);border-left:4px solid var(--slate);border-radius:14px;background:var(--surface);box-shadow:var(--shadow);cursor:pointer;text-align:left;font-family:inherit;color:inherit}

.rf-imgx{position:absolute;top:2px;right:2px;width:20px;height:20px;border:none;border-radius:50%;background:rgba(0,0,0,.62);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}

.rf-cancelnote{background:var(--slate-soft);border-radius:12px;padding:10px 14px;font-size:13.5px;font-weight:600;color:var(--muted)}
.rf-minebtn{display:flex;align-items:center;gap:7px;min-height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--border);background:var(--surface);color:var(--muted);font-size:13.5px;font-weight:600;cursor:pointer;flex-shrink:0;white-space:nowrap}

}
.rf-bell{position:relative}
.rf-belldot{position:absolute;top:0;right:0;min-width:17px;height:17px;padding:0 4px;border-radius:99px;background:var(--red);color:#fff;font-size:10.5px;font-weight:800;display:flex;align-items:center;justify-content:center;line-height:1}

.rf-notsec{font-size:12.5px;font-weight:800;color:var(--muted);margin:2px 2px 6px}
.rf-notrow{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;background:none;border:none;border-radius:11px;padding:10px;cursor:pointer}
.rf-notrow:hover{background:var(--surface2)}
.rf-notrow.new{background:var(--accent-soft)}
.rf-notrow .ic{font-size:19px;line-height:1.3;flex-shrink:0}
.rf-notrow .t{font-size:14px;font-weight:700;line-height:1.35}
.rf-notrow .s{font-size:13px;color:var(--muted);line-height:1.4;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.rf-notrow .tm{font-size:11.5px;color:var(--muted);margin-top:2px}
.rf-mwsec{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:800;margin:18px 2px 10px;letter-spacing:.2px}
.rf-mwsec::after{content:'';flex:1;height:1px;background:var(--border);border-radius:1px}
.rf-navnum{display:inline-flex;align-items:center;justify-content:center;min-width:19px;height:19px;padding:0 5px;margin-left:7px;border-radius:99px;background:var(--accent);color:#fff;font-size:11px;font-weight:800;line-height:1;vertical-align:middle}
.rf-cl-row{display:flex;align-items:flex-start;gap:8px;flex-wrap:nowrap;min-width:0}
.rf-cl-asg{flex-shrink:0;font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:99px;border:1px dashed var(--border);background:var(--surface);color:var(--muted);cursor:pointer;font-family:inherit;white-space:nowrap}
/* ชื่อเต็ม (ชื่อจริง+ชื่อเล่น) ยาว — ตัดด้วย ellipsis แต่ hover/แตะเห็นเต็มจาก title */
.rf-cl-asg.on,.rf-cl-asgv{max-width:130px;overflow:hidden;text-overflow:ellipsis;display:inline-block;vertical-align:top}
@media(max-width:560px){.rf-cl-asg .lb{display:none}.rf-cl-asg{padding:3px 9px;font-size:13px}.rf-cl-asg.on,.rf-cl-asgv{max-width:94px;font-size:11.5px}}
.rf-cl-asg.on{border-style:solid;border-color:var(--accent);color:var(--accent-ink);background:var(--accent-soft)}
.rf-cl-asgv{flex-shrink:0;font-size:11.5px;font-weight:700;color:var(--accent-ink);background:var(--accent-soft);border-radius:99px;padding:3px 10px;white-space:nowrap}
.rf-asgrow{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:none;border:none;border-radius:11px;padding:9px 10px;cursor:pointer;color:inherit}
.rf-asgrow:hover{background:var(--surface2)}
.rf-asgrow.on{background:var(--accent-soft)}
.rf-asgrow .n{font-size:14.5px;font-weight:600;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rf-asgrow .s{font-size:12.5px;color:var(--muted);line-height:1.3}
.rf-asgav{width:32px;height:32px;border-radius:50%;background:var(--slate-soft);color:var(--muted);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;flex-shrink:0}
.rf-asgqx{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:26px;height:26px;border:none;border-radius:50%;background:var(--surface2);color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.rf-ackrow{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;box-sizing:border-box;font-size:13.5px;font-weight:700;padding:9px 12px;border-radius:11px;border:1px solid var(--border);background:var(--surface2);color:var(--muted)}
.rf-ackrow.act{background:var(--accent);border-color:var(--accent);color:#fff;cursor:pointer;font-size:14.5px;padding:11px 12px}
.rf-ackrow.act:active{transform:scale(.985)}
.rf-ackrow.ok{background:var(--green-soft);border-color:transparent;color:var(--green)}
.rf-ackrow.wait{background:var(--amber-soft);border-color:transparent;color:var(--amber)}
.rf-recrow{display:flex;align-items:flex-start;gap:10px;padding:11px 8px;border-bottom:1px solid var(--border)}
.rf-recrow .t{font-size:14.5px;font-weight:700;line-height:1.35}
.rf-recrow .s{font-size:12.5px;color:var(--muted);line-height:1.45;margin-top:2px}
.rf-mwcl{display:flex;align-items:flex-start;gap:11px;padding:12px 13px 12px 14px;margin-bottom:9px;border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:14px;background:var(--surface);box-shadow:0 1px 2px rgba(15,23,42,.06)}
body.dark .rf-mwcl{box-shadow:0 1px 3px rgba(0,0,0,.4)}
.rf-mwcl-t{flex:1;min-width:0;text-align:left;background:none;border:none;padding:0;cursor:pointer;color:inherit}
.rf-mwcl-t .t{font-size:14.5px;font-weight:600;line-height:1.4}
.rf-mwcl-t .s{font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.35}
.rf-pull{position:fixed;top:0;left:0;right:0;z-index:90;display:flex;align-items:center;justify-content:center;gap:7px;font-size:13px;font-weight:700;color:var(--accent-ink);background:var(--accent-soft);overflow:hidden;height:0;transition:height .12s}
