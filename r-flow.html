<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>R-Flow — ติดตามงานทีม v2.53</title>
<link rel="icon" type="image/png" href="r-flow-icon.png">
<link rel="manifest" href="r-flow.webmanifest">
<link rel="apple-touch-icon" href="r-flow-icon.png">
<meta name="theme-color" content="#1E3A8A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="R-Flow">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{
--bg:#F4F6F8;--surface:#FFFFFF;--surface2:#EDF0F4;--border:#E2E6EB;--text:#1A242E;--muted:#65717F;
--accent:#1E3A8A;--accent-soft:#E8EDF9;--accent-ink:#16266B;--accent-glow:rgba(30,58,138,.45);
--blue:#2264D1;--blue-soft:#E7EEFA;--amber:#A85B08;--amber-soft:#FAEEDC;--green:#1B8A4C;--green-soft:#E3F3E9;--red:#D23B2E;--red-soft:#FBE8E5;--slate:#64707E;--slate-soft:#ECEFF2;
--shadow:0 1px 2px rgba(18,28,38,.05),0 3px 10px rgba(18,28,38,.06);
--shadow-lg:0 12px 48px rgba(12,20,28,.24);
}
body.dark{
--bg:#0E1316;--surface:#161C21;--surface2:#1E252C;--border:#29323B;--text:#E9EEF3;--muted:#93A0AE;
--accent-soft:#17244A;--accent-ink:#94AEE8;
--blue:#7FAEF2;--blue-soft:#1C2B44;--amber:#E5A85D;--amber-soft:#342917;--green:#5FCB8E;--green-soft:#173321;--red:#F08376;--red-soft:#3B201C;--slate:#9AA7B5;--slate-soft:#242D35;
--shadow:0 1px 2px rgba(0,0,0,.35),0 3px 10px rgba(0,0,0,.28);
--shadow-lg:0 12px 48px rgba(0,0,0,.6);
}
*{-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'IBM Plex Sans Thai','Noto Sans Thai',sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:inherit;color:inherit}
input,textarea,select{font-family:inherit;color:var(--text)}
input::placeholder,textarea::placeholder{color:var(--muted)}
@keyframes shimmer{0%{background-position:120% 0}100%{background-position:-120% 0}}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes panelIn{from{transform:translateX(48px);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,14px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes popIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── shell ── */
.rf-shell{min-height:100vh;min-height:100dvh;display:flex;align-items:stretch;background:var(--bg)}
.rf-main{flex:1;min-width:0;display:flex;flex-direction:column}
.rf-content{flex:1;padding:clamp(14px,2.5vw,26px);width:100%;max-width:1480px;margin:0 auto;box-sizing:border-box}
.rf-view{display:flex;flex-direction:column;gap:16px;animation:fadeUp .3s ease-out}
h1.rf-h1{margin:0;font-size:clamp(20px,2.4vw,25px);font-weight:700}
.rf-sub{color:var(--muted);font-size:14px;margin-top:2px}

/* ── sidebar (desktop) ── */
.rf-side{width:242px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);position:sticky;top:0;height:100vh;height:100dvh;display:flex;flex-direction:column}
.rf-logo-row{display:flex;align-items:center;gap:10px;padding:18px 16px 14px 16px}
.rf-logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent-ink));color:#fff;font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.rf-logo-name{font-size:16px;font-weight:700;line-height:1.2}
.rf-logo-sub{font-size:12.5px;color:var(--muted);line-height:1.2}
.rf-ver{font-size:11px;font-weight:700;color:var(--accent-ink);background:var(--accent-soft);border-radius:99px;padding:1px 8px;margin-left:auto}
.rf-nav{display:flex;flex-direction:column;gap:2px;padding:6px 10px}
.rf-navbtn{display:flex;align-items:center;gap:11px;min-height:42px;padding:0 12px;border-radius:10px;border:none;cursor:pointer;text-align:left;font-size:14px;font-weight:600;background:transparent;color:var(--muted)}
.rf-navbtn:hover{background:var(--surface2)}
.rf-navbtn.on{background:var(--accent-soft);color:var(--accent-ink)}
.rf-memhead{display:flex;align-items:center;justify-content:space-between;padding:10px 10px 0 10px}
.rf-memtog{display:flex;align-items:center;gap:7px;min-height:36px;padding:0 8px;border:none;border-radius:9px;background:none;color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;flex:1;text-align:left}
.rf-memtog:hover{background:var(--surface2)}
.rf-memtog svg{transition:transform .18s}
.rf-clearf{border:none;background:none;color:var(--accent-ink);font-size:13px;font-weight:600;cursor:pointer;padding:2px 8px}
.rf-memlist{display:flex;flex-direction:column;gap:2px;padding:2px 10px;overflow-y:auto;flex:1}
.rf-membtn{display:flex;align-items:center;gap:10px;min-height:40px;padding:0 12px;border-radius:10px;border:none;cursor:pointer;text-align:left;background:transparent;color:var(--text)}
.rf-membtn:hover{background:var(--surface2)}
.rf-membtn.on{background:var(--accent-soft)}
.rf-membtn .n{flex:1;font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rf-membtn .c{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.rf-sidefoot{padding:12px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:8px}
.rf-darkbtn{display:flex;align-items:center;gap:10px;min-height:40px;padding:0 12px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--muted);font-size:14px;font-weight:500;cursor:pointer}
.rf-darkbtn:hover{background:var(--surface2)}
.rf-me{display:flex;align-items:center;gap:10px;padding:4px 6px}
.rf-me .nm{font-size:14px;font-weight:600;line-height:1.25}
.rf-me .dp{font-size:12.5px;color:var(--muted);line-height:1.25}
.rf-out{margin-left:auto;width:32px;height:32px;border:none;border-radius:9px;background:none;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center}
.rf-out:hover{background:var(--surface2);color:var(--red)}

/* ── header ── */
.rf-head{position:sticky;top:0;z-index:40;background:rgba(244,246,248,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--border);padding:10px clamp(14px,2.5vw,24px);padding-top:calc(10px + env(safe-area-inset-top));display:flex;align-items:center;gap:10px}
body.dark .rf-head{background:rgba(14,19,22,.82)}
.rf-head .mlogo{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent-ink));color:#fff;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.rf-loginlogo img,.rf-logo img,.rf-head .mlogo img{width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block}
.rf-search{position:relative;flex:1;max-width:560px}
.rf-search>svg{position:absolute;left:13px;top:50%;transform:translateY(-50%)}
.rf-search input{width:100%;box-sizing:border-box;height:44px;padding:0 38px 0 38px;border-radius:12px;border:1px solid var(--border);background:var(--surface);font-size:15px;outline:none}
.rf-search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.rf-qx{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:32px;height:32px;border:none;border-radius:50%;background:var(--surface2);color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center}
.rf-qdrop{position:absolute;left:0;right:0;top:52px;background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-lg);overflow:hidden;z-index:50;animation:fadeUp .16s ease-out}
.rf-qrow{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:8px 14px;border:none;background:none;cursor:pointer;text-align:left;border-bottom:1px solid var(--border);box-sizing:border-box}
.rf-qrow:hover{background:var(--surface2)}
.rf-iconbtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--border);background:var(--surface);color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.rf-iconbtn:hover{background:var(--surface2)}
.rf-newbtn{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 18px;border-radius:12px;border:none;background:var(--accent);color:#fff;font-size:14.5px;font-weight:600;cursor:pointer;box-shadow:var(--shadow)}
.rf-newbtn:hover{filter:brightness(1.08)}
.rf-newbtn:active{transform:scale(.97)}

/* ── cards / common ── */
.rf-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px;box-shadow:var(--shadow)}
.rf-card-t{font-size:15.5px;font-weight:700;margin-bottom:12px}
.rf-av{border-radius:50%;color:#fff;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-sizing:border-box;position:relative;overflow:hidden}
.rf-av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.rf-av.none{background:transparent!important;color:var(--muted);border:1.5px dashed var(--muted)}
.rf-linebtn{display:flex;align-items:center;justify-content:center;gap:7px;flex:1;min-height:42px;border-radius:11px;border:none;background:#06C755;color:#fff;font-size:14px;font-weight:700;cursor:pointer}
/* นัดที่ดึงมาจาก Google Calendar (ดูอย่างเดียว) */
.rf-gcrow{display:flex;align-items:center;gap:9px;padding:8px 0;border-top:1px dashed var(--border);font-size:13.5px}
.rf-gcrow:first-of-type{border-top:none}
.rf-gcrow .dot{width:9px;height:9px;border-radius:50%;background:#7986cb;flex-shrink:0}
.rf-gcrow .tm{font-size:12px;color:var(--muted);flex-shrink:0;min-width:82px}
.rf-gcrow .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rf-calset{display:flex;align-items:center;gap:8px;margin-top:9px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.rf-calset select{height:32px;border:1.5px solid var(--border);border-radius:9px;background:var(--surface);color:var(--text);font-size:12.5px;font-weight:600;padding:0 8px;font-family:inherit;cursor:pointer}
.rf-callink{border:none;background:none;color:var(--red);font-size:12.5px;font-weight:700;cursor:pointer;padding:2px 4px;font-family:inherit}
/* แถบ "ต้องทำก่อน" บนสุดของภาพรวม */
.rf-upnext{border:1px solid var(--border);border-left:4px solid var(--slate);border-radius:14px;background:var(--surface);box-shadow:var(--shadow);padding:10px 12px;margin:14px 0 0}
.rf-upnext .hd{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.3px;margin-bottom:6px}
.rf-upnext .hd button{border:none;background:none;color:var(--accent-ink);font-size:12.5px;font-weight:800;cursor:pointer;padding:2px 4px;font-family:inherit}
.rf-upnext .hd button:hover{text-decoration:underline}
.rf-uprow{display:flex;align-items:center;gap:10px;width:100%;padding:9px 0;border:none;border-top:1px solid var(--border);background:none;cursor:pointer;text-align:left;font-family:inherit;color:inherit;box-sizing:border-box}
.rf-uprow:first-of-type{border-top:none}
.rf-uprow:hover .t1{color:var(--accent-ink)}
.rf-uprow .num{width:30px;height:30px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:14px;flex-shrink:0}
.rf-uprow .mid{flex:1;min-width:0}
.rf-uprow .t1{font-size:14.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.35}
.rf-uprow .t2{display:flex;align-items:center;gap:6px;margin-top:3px;font-size:12.5px;color:var(--muted);min-width:0;overflow:hidden;white-space:nowrap}
.rf-uprow .due{font-size:12.5px;font-weight:700;padding:3px 9px;border-radius:8px;white-space:nowrap;flex-shrink:0}
.rf-ughead{font-size:11.5px;font-weight:800;color:var(--muted);letter-spacing:.4px;padding:11px 4px 5px;position:sticky;top:0;background:var(--surface);z-index:1}
.rf-clshare{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10px;border-radius:99px;border:1px solid #06C755;background:none;color:#06C755;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap;flex-shrink:0}
.rf-clshare:hover{background:#06C755;color:#fff}
.rf-clshare svg{width:13px;height:13px}
.rf-linebtn:active{transform:scale(.97)}
.rf-cancelbtn{display:flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:0 14px;border-radius:11px;border:1.5px solid var(--red);background:var(--red-soft);color:var(--red);font-size:13.5px;font-weight:700;cursor:pointer}
.rf-cancelbtn:active{transform:scale(.97)}
.rf-imgprev{display:flex;align-items:center;gap:10px;background:var(--surface2);border:1px solid var(--border);border-radius:11px;padding:6px 8px}
.rf-imgprev img{width:44px;height:44px;object-fit:cover;border-radius:8px;display:block}
.rf-imgprevs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.rf-imgprev1{position:relative;width:60px;height:60px;border-radius:10px;overflow:hidden;flex-shrink:0;border:1px solid var(--border)}
.rf-imgprev1 img{width:100%;height:100%;object-fit:cover;display:block}
.rf-imgx{position:absolute;top:2px;right:2px;width:20px;height:20px;border:none;border-radius:50%;background:rgba(0,0,0,.62);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.rf-upprog{font-size:12px;color:var(--muted);padding:0 4px 8px}
.rf-cmtimgs{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.rf-cmtimgs img{width:118px;height:118px;object-fit:cover;border-radius:12px;display:block}
.rf-cancelnote{background:var(--slate-soft);border-radius:12px;padding:10px 14px;font-size:13.5px;font-weight:600;color:var(--muted)}
.rf-minebtn{display:flex;align-items:center;gap:7px;min-height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--border);background:var(--surface);color:var(--muted);font-size:13.5px;font-weight:600;cursor:pointer;flex-shrink:0;white-space:nowrap}
.rf-minebtn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.rf-perfbtn{display:flex;align-items:center;gap:8px;min-height:40px;padding:4px 15px 4px 5px;border-radius:99px;border:1px solid var(--border);background:var(--surface);cursor:pointer;font-size:14px;font-weight:700;color:var(--text);flex-shrink:0;box-shadow:var(--shadow);max-width:100%}
.rf-perfbtn span{max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rf-perfbtn .short,.rf-sub .short{display:none}
/* แถบเตือนเปิดแจ้งเตือน — โผล่ทุกครั้งที่เปิดแอปจนกว่าจะเปิดจริง (ปิดได้ แต่เป็นแค่รอบนี้) */
.rf-nag{display:flex;align-items:center;gap:10px;margin-bottom:12px;padding:11px 12px 11px 14px;border-radius:14px;border:1px solid var(--amber);background:var(--amber-soft);font-size:13.5px;line-height:1.45;box-sizing:border-box}
.rf-nag .ic{font-size:19px;flex-shrink:0;line-height:1}
.rf-nag .tx{flex:1;min-width:0;color:var(--amber);font-weight:600}
.rf-nag .tx b{font-weight:800}
.rf-nagbtn{flex-shrink:0;height:34px;padding:0 14px;border-radius:99px;border:none;background:var(--amber);color:#fff;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit;white-space:nowrap}
.rf-nagbtn:active{transform:scale(.97)}
@media(max-width:560px){.rf-nag{flex-wrap:wrap}.rf-nag .tx{flex:1 0 calc(100% - 29px)}.rf-nagbtn{width:100%;height:38px;order:3}}
/* หัวแดชบอร์ด — ชื่อเต็ม (ชื่อจริง+ชื่อเล่น) ยาวกว่าชื่อเล่นมาก ถ้าปล่อยแถวเดียวหัวข้อจะโดนบีบจนตัวหนังสือไทยแตกทีละพยางค์ */
.rf-dashhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rf-dashhead .ttl{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;flex:1 1 auto;min-width:200px}
.rf-dashhead .ctl{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0}
@media(max-width:640px){
  .rf-dashhead .ttl{flex:1 0 100%}
  .rf-dashhead .ctl{width:100%}
  .rf-perfbtn{flex:1;min-width:0;justify-content:flex-start}
  .rf-perfbtn .full,.rf-sub .full{display:none}
  .rf-perfbtn .short,.rf-sub .short{display:inline}
}
.rf-bell{position:relative}
.rf-belldot{position:absolute;top:0;right:0;min-width:17px;height:17px;padding:0 4px;border-radius:99px;background:var(--red);color:#fff;font-size:10.5px;font-weight:800;display:flex;align-items:center;justify-content:center;line-height:1}
/* จุดส้มเปล่าๆ = ยังไม่ได้เปิดแจ้งเตือน (ไม่ใช่จำนวนที่ค้างอ่าน) */
.rf-belldot.warn{min-width:11px;width:11px;height:11px;padding:0;background:var(--amber);box-shadow:0 0 0 2px var(--surface)}
.rf-notsec{font-size:12.5px;font-weight:800;color:var(--muted);margin:2px 2px 6px}
.rf-notrow{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;background:none;border:none;border-radius:11px;padding:10px;cursor:pointer}
.rf-notrow:hover{background:var(--surface2)}
.rf-notrow.new{background:var(--accent-soft)}
.rf-notrow .ic{font-size:19px;line-height:1.3;flex-shrink:0}
.rf-notrow .t{font-size:14px;font-weight:700;line-height:1.35}
.rf-notrow .s{font-size:13px;color:var(--muted);line-height:1.4;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.rf-notrow .tm{font-size:11.5px;color:var(--muted);margin-top:2px}
.rf-mwsec{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:800;margin:18px 2px 10px;letter-spacing:.2px}
.rf-mwsec::after{content:'';flex:1;height:1px;background:var(--border);border-radius:1px}
.rf-navnum{display:inline-flex;align-items:center;justify-content:center;min-width:19px;height:19px;padding:0 5px;margin-left:7px;border-radius:99px;background:var(--accent);color:#fff;font-size:11px;font-weight:800;line-height:1;vertical-align:middle}
.rf-cl-row{display:flex;align-items:flex-start;gap:8px;flex-wrap:nowrap;min-width:0}
.rf-cl-asg{flex-shrink:0;font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:99px;border:1px dashed var(--border);background:var(--surface);color:var(--muted);cursor:pointer;font-family:inherit;white-space:nowrap}
/* ชื่อเต็ม (ชื่อจริง+ชื่อเล่น) ยาว — ตัดด้วย ellipsis แต่ hover/แตะเห็นเต็มจาก title */
.rf-cl-asg.on,.rf-cl-asgv{max-width:130px;overflow:hidden;text-overflow:ellipsis;display:inline-block;vertical-align:top}
@media(max-width:560px){.rf-cl-asg .lb{display:none}.rf-cl-asg{padding:3px 9px;font-size:13px}.rf-cl-asg.on,.rf-cl-asgv{max-width:94px;font-size:11.5px}}
.rf-cl-asg.on{border-style:solid;border-color:var(--accent);color:var(--accent-ink);background:var(--accent-soft)}
.rf-cl-asgv{flex-shrink:0;font-size:11.5px;font-weight:700;color:var(--accent-ink);background:var(--accent-soft);border-radius:99px;padding:3px 10px;white-space:nowrap}
.rf-asgrow{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:none;border:none;border-radius:11px;padding:9px 10px;cursor:pointer;color:inherit}
.rf-asgrow:hover{background:var(--surface2)}
.rf-asgrow.on{background:var(--accent-soft)}
.rf-asgrow .n{font-size:14.5px;font-weight:600;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rf-asgrow .s{font-size:12.5px;color:var(--muted);line-height:1.3}
.rf-asgav{width:32px;height:32px;border-radius:50%;background:var(--slate-soft);color:var(--muted);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;flex-shrink:0}
.rf-asgqx{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:26px;height:26px;border:none;border-radius:50%;background:var(--surface2);color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.rf-ackrow{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;box-sizing:border-box;font-size:13.5px;font-weight:700;padding:9px 12px;border-radius:11px;border:1px solid var(--border);background:var(--surface2);color:var(--muted)}
.rf-ackrow.act{background:var(--accent);border-color:var(--accent);color:#fff;cursor:pointer;font-size:14.5px;padding:11px 12px}
.rf-ackrow.act:active{transform:scale(.985)}
.rf-ackrow.ok{background:var(--green-soft);border-color:transparent;color:var(--green)}
.rf-ackrow.wait{background:var(--amber-soft);border-color:transparent;color:var(--amber)}
.rf-ordack{font-size:11.5px;font-weight:700;color:var(--amber);background:var(--amber-soft);border-radius:7px;padding:2px 8px;display:inline-block;margin:-3px 0 10px 17px}
.rf-recrow{display:flex;align-items:flex-start;gap:10px;padding:11px 8px;border-bottom:1px solid var(--border)}
.rf-recrow .t{font-size:14.5px;font-weight:700;line-height:1.35}
.rf-recrow .s{font-size:12.5px;color:var(--muted);line-height:1.45;margin-top:2px}
.rf-mwcl{display:flex;align-items:flex-start;gap:11px;padding:12px 13px 12px 14px;margin-bottom:9px;border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:14px;background:var(--surface);box-shadow:0 1px 2px rgba(15,23,42,.06)}
body.dark .rf-mwcl{box-shadow:0 1px 3px rgba(0,0,0,.4)}
.rf-mwcl-t{flex:1;min-width:0;text-align:left;background:none;border:none;padding:0;cursor:pointer;color:inherit}
.rf-mwcl-t .t{font-size:14.5px;font-weight:600;line-height:1.4}
.rf-mwcl-t .s{font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.35}
.rf-pull{position:fixed;top:0;left:0;right:0;z-index:90;display:flex;align-items:center;justify-content:center;gap:7px;font-size:13px;font-weight:700;color:var(--accent-ink);background:var(--accent-soft);overflow:hidden;height:0;transition:height .12s}
.rf-pull.go{color:#fff;background:var(--accent)}
body{overscroll-behavior-y:contain}
.rf-perfbtn:hover{background:var(--surface2);border-color:var(--accent);color:var(--accent-ink)}
.rf-perfbtn:active{transform:scale(.97)}
.rf-perfstat{background:var(--surface2);border-radius:12px;padding:10px 12px}
.rf-perfstat .v{font-size:22px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.rf-perfstat .l{font-size:12px;color:var(--muted);margin-top:2px}
.rf-perfsec{font-size:13px;font-weight:700;color:var(--muted);margin:16px 4px 5px}
.rf-perfbars{display:flex;align-items:flex-end;gap:8px;height:86px;margin-top:8px}
.rf-perfbar{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;height:100%;justify-content:flex-end}
.rf-perfbar .bar{width:100%;max-width:30px;border-radius:5px 5px 2px 2px;transition:height .5s cubic-bezier(.22,1,.36,1)}
.rf-cl-item{display:flex;align-items:flex-start;gap:10px;min-height:36px;padding:9px 0;border-bottom:1px solid var(--border);transition:transform .13s ease}
.rf-cl-item:last-child{border-bottom:none}
.rf-cl-item.rf-cl-dragging{transition:none;background:var(--surface);border-radius:9px;border-bottom-color:transparent;box-shadow:0 7px 22px rgba(0,0,0,.22);position:relative;z-index:5;padding:9px 6px}
.rf-cl-box{margin-top:2px;width:22px;height:22px;border-radius:7px;border:1.5px solid var(--border);background:var(--surface);cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;padding:0;transition:background .12s,border-color .12s}
.rf-cl-box.on{background:var(--green);border-color:var(--green)}
.rf-cl-box:disabled{cursor:default;opacity:.7}
.rf-cl-drag{width:30px;height:36px;border:none;background:none;color:var(--muted);cursor:grab;display:flex;align-items:center;justify-content:center;flex-shrink:0;border-radius:6px;padding:0;touch-action:none;opacity:.55;-webkit-user-select:none;user-select:none}
.rf-cl-drag:hover{background:var(--surface2);color:var(--text);opacity:1}
.rf-cl-drag:active{cursor:grabbing;opacity:1}
.rf-cl-mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.rf-cl-n{flex-shrink:0;font-size:14.5px;line-height:1.5;font-weight:800;color:var(--muted);opacity:.55;font-variant-numeric:tabular-nums}
.rf-cl-n.done{text-decoration:line-through}
.rf-cl-t{flex:1;font-size:14.5px;line-height:1.5;min-width:0;word-break:break-word}
.rf-cl-t.done{color:var(--muted);text-decoration:line-through}
.rf-cl-ts{font-size:11px;color:var(--muted);opacity:.75;line-height:1.3}
.rf-cl-ts.done{color:var(--green);opacity:.95;display:flex;align-items:center;gap:3px}
.rf-cl-ts.done svg{flex-shrink:0}
.rf-cl-del{width:28px;height:28px;border:none;border-radius:8px;background:none;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;opacity:.55}
.rf-cl-del:hover{background:var(--red-soft);color:var(--red);opacity:1}
.rf-sysline{text-align:center;font-size:12.5px;color:var(--muted);padding:1px 8px;line-height:1.55}
.rf-revbanner{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:10px 16px;border-radius:14px;border:1.5px solid var(--amber);background:var(--amber-soft);color:var(--amber);font-size:14.5px;font-weight:700;cursor:pointer;text-align:left;box-sizing:border-box}
.rf-revbanner:active{transform:scale(.99)}
.rf-duechip{font-size:13px;font-weight:600;padding:3px 9px;border-radius:8px;white-space:nowrap}
.rf-row{display:flex;align-items:center;gap:11px;min-height:52px;padding:8px;border:none;border-radius:10px;background:none;cursor:pointer;text-align:left;width:100%;box-sizing:border-box}
.rf-row:hover{background:var(--surface2)}
.rf-row .t1{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rf-row .t2{display:flex;align-items:center;gap:7px;min-width:0;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden}
.rf-row .t2 .nm{min-width:0;overflow:hidden;text-overflow:ellipsis}
.rf-spill{flex-shrink:0;font-size:11.5px;font-weight:800;padding:2px 9px;border-radius:99px;line-height:1.45}
.rf-rchip{flex-shrink:0;display:inline-flex;align-items:center;gap:3px;font-size:12.5px;font-weight:600;opacity:.85}
/* ── โหมดการ์ด: ใช้กับลิสต์ที่อยู่บนพื้นหน้า (งานของฉัน / ป๊อปอัป) ให้มีมิติ · ลิสต์ที่อยู่ในการ์ดอยู่แล้ว (แดชบอร์ด) คงแบบเรียบ ── */
.rf-list .rf-row{position:relative;overflow:hidden;min-height:60px;padding:11px 13px 11px 17px;margin-bottom:9px;border:1px solid var(--border);border-radius:14px;background:var(--surface);box-shadow:0 1px 2px rgba(15,23,42,.06);transition:transform .14s ease,box-shadow .14s ease,border-color .14s}
.rf-list .rf-row::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--rc,var(--slate))}
.rf-list .rf-row:hover{background:var(--surface);transform:translateY(-1px);box-shadow:0 7px 18px rgba(15,23,42,.11);border-color:var(--rc,var(--accent))}
.rf-list .rf-row:active{transform:translateY(0);box-shadow:0 1px 2px rgba(15,23,42,.06)}
.rf-list .rf-row.isdone{opacity:.72}
.rf-list .rf-row.isdone .t1{text-decoration:line-through;text-decoration-color:var(--border)}
body.dark .rf-list .rf-row{box-shadow:0 1px 3px rgba(0,0,0,.4)}
body.dark .rf-list .rf-row:hover{box-shadow:0 8px 20px rgba(0,0,0,.5)}
.rf-viewall{margin-top:8px;min-height:42px;width:100%;border-radius:11px;border:1.5px dashed var(--border);background:none;color:var(--accent-ink);font-size:13.5px;font-weight:700;cursor:pointer}
.rf-viewall:hover{background:var(--accent-soft);border-color:var(--accent)}
.rf-empty{text-align:center;padding:28px 12px;color:var(--muted);font-size:14px}
.rf-skel{border-radius:14px;background:linear-gradient(90deg,var(--surface2) 25%,var(--border) 37%,var(--surface2) 63%);background-size:300% 100%;animation:shimmer 1.3s infinite}
.rf-banner{display:inline-flex;align-items:center;gap:8px;background:var(--accent-soft);color:var(--accent-ink);border:1px solid var(--accent);border-radius:999px;padding:6px 8px 6px 14px;font-size:13.5px;font-weight:600}
.rf-banner button{width:22px;height:22px;border:none;border-radius:50%;background:var(--accent);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}

/* ── dashboard ── */
.rf-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.rf-stat{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;box-shadow:var(--shadow)}
.rf-stat .l{font-size:13px;font-weight:600;color:var(--muted)}
.rf-stat .v{font-size:30px;font-weight:700;line-height:1.25;font-variant-numeric:tabular-nums}
.rf-stat .s{font-size:13px;color:var(--muted)}
button.rf-stat{cursor:pointer;text-align:left;font:inherit;color:inherit;position:relative;transition:border-color .12s,transform .08s,box-shadow .12s}
button.rf-stat:hover{border-color:var(--accent);box-shadow:0 5px 16px rgba(0,0,0,.10)}
button.rf-stat:active{transform:scale(.985)}
button.rf-stat::after{content:'›';position:absolute;top:9px;right:14px;font-size:22px;line-height:1;color:var(--muted);opacity:.4}
.rf-dashgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:14px;align-items:stretch}
.rf-dashcol{display:flex;flex-direction:column;gap:14px;min-width:0}
.rf-wlgroup{border:1px solid var(--border);border-radius:12px;overflow:hidden}
.rf-wlhead{display:flex;align-items:center;gap:10px;min-height:52px;padding:8px 12px;border:none;background:none;cursor:pointer;text-align:left;width:100%;box-sizing:border-box}
.rf-wlhead:hover{background:var(--surface2)}
.rf-wlhead svg{transition:transform .18s;flex-shrink:0}
.rf-bar{position:relative;height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.rf-bar>div{position:absolute;left:0;top:0;bottom:0;border-radius:99px;transition:width .6s cubic-bezier(.22,1,.36,1)}
.rf-wlrow{display:flex;align-items:center;gap:12px;min-height:46px;padding:6px 8px;border:none;border-radius:10px;background:none;cursor:pointer;text-align:left;width:100%;box-sizing:border-box}
.rf-wlrow:hover{background:var(--surface2)}
.rf-feedrow{display:flex;align-items:flex-start;gap:11px;padding:10px 8px;border:none;border-radius:10px;background:none;cursor:pointer;text-align:left;width:100%;min-height:52px;box-sizing:border-box}
.rf-feedrow:hover{background:var(--surface2)}
.rf-bars7{display:flex;align-items:flex-end;gap:6px;height:112px;margin-top:10px}
.rf-bars7 .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;height:100%;justify-content:flex-end}
.rf-bars7 .bar{width:100%;max-width:26px;border-radius:6px 6px 3px 3px;transition:height .5s cubic-bezier(.22,1,.36,1)}
.rf-barcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;height:100%;justify-content:flex-end;border:none;background:none;cursor:pointer;padding:0}
.rf-barcol .bar{width:100%;max-width:26px;border-radius:6px 6px 3px 3px;transition:height .5s cubic-bezier(.22,1,.36,1)}
.rf-barcol:hover .bar{filter:brightness(1.12)}
.rf-legrow{display:flex;align-items:center;gap:9px;border:none;background:none;cursor:pointer;padding:5px 6px;border-radius:9px;width:100%;min-height:42px}
.rf-legrow:hover{background:var(--surface2)}
.rf-cardex-tog{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;margin-top:9px;padding:6px 0 2px 0;border:none;border-top:1px solid var(--border);background:none;color:var(--muted);font-size:12.5px;font-weight:600;cursor:pointer}
.rf-cardex-tog svg{transition:transform .18s}
.rf-cardex{margin-top:7px;display:flex;flex-direction:column;gap:8px;animation:fadeUp .18s ease-out}
.rf-cardcl{display:flex;flex-direction:column;gap:3px}
.rf-cardcl-i{display:flex;align-items:center;gap:7px;font-size:13px}
.rf-cardcl-b{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;padding:0;cursor:pointer}
.rf-cardcl-b.on{background:var(--green);border-color:var(--green)}
.rf-cardcl-i .done{color:var(--muted);text-decoration:line-through}
.rf-cardbc{display:flex;align-items:flex-start;gap:8px;background:var(--surface2);border-radius:10px;padding:8px 10px}
.rf-cardbc .nm{font-size:12px;font-weight:700;color:var(--accent-ink)}
.rf-cardbc .tx{font-size:13px;line-height:1.45;margin-top:1px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

/* ── board ── */
.rf-board-pc{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
.rf-col{background:var(--surface2);border-radius:14px;padding:10px;outline:2px dashed transparent;outline-offset:-2px;transition:outline-color .15s;min-height:220px;min-width:0}
.rf-col.over{outline-color:var(--accent)}
.rf-colhead{display:flex;align-items:center;gap:8px;padding:4px 6px 10px 6px}
.rf-colhead .dot{width:9px;height:9px;border-radius:50%}
.rf-colhead .lb{font-size:14px;font-weight:700}
.rf-colhead .ct{font-size:13px;font-weight:600;color:var(--muted);background:var(--surface);border-radius:99px;padding:1px 8px}
.rf-fsel{height:30px;border:1.5px solid var(--border);border-radius:9px;background:var(--surface);color:var(--text);font-size:12.5px;font-weight:600;padding:0 8px;cursor:pointer;max-width:46vw;font-family:inherit}
.rf-scope{display:flex;border:1.5px solid var(--border);border-radius:99px;overflow:hidden;flex-shrink:0}
.rf-scope button{border:none;background:var(--surface);color:var(--muted);font-size:12.5px;font-weight:800;padding:0 14px;height:32px;cursor:pointer;font-family:inherit;white-space:nowrap}
.rf-scope button.on{background:var(--accent);color:#fff}
.rf-wchips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.rf-wchip{height:30px;padding:0 12px;border-radius:99px;border:1.5px solid var(--border);background:var(--surface);color:var(--muted);font-size:12.5px;font-weight:800;cursor:pointer;font-family:inherit;white-space:nowrap;line-height:1}
.rf-wchip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.rf-wchip:active{transform:scale(.96)}
.rf-kcard{background:var(--surface);border-radius:12px;padding:11px 12px 10px 12px;box-shadow:var(--shadow);cursor:pointer;border-top:3px solid var(--slate);transition:box-shadow .15s,transform .15s,opacity .15s;min-width:0}
.rf-kcard:hover{box-shadow:var(--shadow-lg);transform:translateY(-1px)}
.rf-kcard:active{transform:scale(.985)}
.rf-kcard .tt{font-size:14.5px;font-weight:600;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rf-kcard.drag{opacity:.35}
.rf-cc{display:flex;align-items:center;gap:4px;color:var(--muted);font-size:13px;font-weight:600}
.rf-kempty{border:1.5px dashed var(--border);border-radius:12px;padding:22px 12px;text-align:center;color:var(--muted);font-size:13.5px}
.rf-seg{position:sticky;top:calc(66px + env(safe-area-inset-top));z-index:30;display:flex;background:var(--surface2);border-radius:13px;padding:4px;gap:3px}
.rf-seg button{flex:1;min-height:44px;border:none;border-radius:10px;cursor:pointer;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;transition:background .18s}
.rf-seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.rf-seg .sl{font-size:13px;font-weight:700;line-height:1.2}
.rf-seg .sc{font-size:12.5px;font-weight:600;opacity:.75;line-height:1.2;font-variant-numeric:tabular-nums}
.rf-mcard{background:var(--surface);border-radius:13px;padding:13px 14px 12px 14px;box-shadow:var(--shadow);cursor:pointer;border-top:3px solid var(--slate)}
.rf-mcard:active{transform:scale(.985)}
.rf-mcard .tt{font-size:15px;font-weight:600;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ── calendar ── */
.rf-calbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rf-calnav{width:38px;height:38px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center}
.rf-calnav:hover{background:var(--surface2)}
.rf-todaybtn{min-height:38px;padding:0 15px;border-radius:10px;border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent-ink);font-size:13.5px;font-weight:700;cursor:pointer}
.rf-modeseg{display:flex;background:var(--surface2);border-radius:11px;padding:3px;gap:2px}
.rf-modeseg button{min-height:38px;padding:0 16px;border:none;border-radius:9px;cursor:pointer;font-size:13.5px;font-weight:600;background:transparent;color:var(--muted)}
.rf-modeseg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.rf-calgrid7{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.rf-dow{text-align:center;font-size:13px;font-weight:600;color:var(--muted);padding:6px 0}
.rf-day{border-radius:10px;border:1.5px solid var(--border);background:var(--surface);cursor:pointer;padding:5px;display:flex;flex-direction:column;align-items:stretch;gap:3px;overflow:hidden;text-align:left}
.rf-day:hover{border-color:var(--accent)}
.rf-day.sel{background:var(--accent-soft);border-color:var(--accent)}
.rf-day .num{width:24px;height:24px;border-radius:50%;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;margin:0 auto}
.rf-day .num.today{background:var(--accent);color:#fff}
.rf-daychip{display:flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;padding:2px 6px;border-radius:6px;cursor:pointer;transition:filter .12s}
.rf-daychip:hover{filter:brightness(.94)}
.rf-daychip:hover .tx{text-decoration:underline}
.rf-daychip .st{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.rf-daychip .tx{min-width:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rf-daychip.done{opacity:.78}
.rf-daychip.done .tx{text-decoration:line-through}
.rf-dotcount{min-width:18px;height:18px;border-radius:9px;color:#fff;font-size:12.5px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px;margin:0 auto}
.rf-wkcol{border-radius:13px;padding:8px;min-height:150px;min-width:0;display:flex;flex-direction:column;gap:7px;background:var(--surface2)}
.rf-wkcol.today{background:var(--accent-soft)}
.rf-wkcard{border:none;background:var(--surface);border-radius:11px;padding:9px 10px;box-shadow:var(--shadow);cursor:pointer;text-align:left;border-left:3px solid var(--slate);min-width:0;transition:box-shadow .15s,transform .15s}
.rf-wkcard:hover{box-shadow:var(--shadow-lg);transform:translateY(-1px)}
.rf-mwkday{border-radius:14px;padding:12px 14px;background:var(--surface2)}
.rf-mwkday.today{background:var(--accent-soft)}
.rf-mwkrow{display:flex;align-items:center;gap:10px;min-height:50px;padding:7px 8px;border:none;border-radius:11px;background:var(--surface);box-shadow:var(--shadow);cursor:pointer;text-align:left;width:100%;margin-top:7px;box-sizing:border-box}
.rf-mwkrow:active{transform:scale(.985)}
.rf-prio-line{width:4px;height:32px;border-radius:4px;flex-shrink:0}
.rf-todaypill{font-size:12.5px;font-weight:700;background:var(--accent);color:#fff;border-radius:99px;padding:1px 9px}

function tsTime(ts){ try { if (!_fmtT) _fmtT = new Intl.DateTimeFormat('th-TH', { hour:'2-digit', minute:'2-digit', timeZone:'Asia/Bangkok' }); return _fmtT.format(new Date(ts)); } catch(e){ return ''; } }
function timeLabel(ts){
  const dIso = tsDateIso(ts); if (!dIso) return '';
  const dd = Math.round((pd(dIso) - pd(todayIso())) / 864e5);
  if (dd === 0) return 'วันนี้ ' + tsTime(ts);
  if (dd === -1) return 'เมื่อวาน ' + tsTime(ts);
  return fmtYmd(dIso) + ' ' + tsTime(ts);
}

/* ── misc helpers ── */
function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
// jsq ใช้ในสตริง JS ที่อยู่ใน onclick="..." → ต้องกันทั้ง 2 ชั้น: ชั้น JS (\ ') และชั้น HTML attribute (& " <)
// ไม่งั้นค่าจากชีท (เช่น ชื่อแผนก) ที่มี " หลุดออกจาก attribute ได้
function jsq(s){
  return String(s == null ? '' : s)
    .split('\\').join('\\\\')
    .split("'").join("\\'")
    .split('&').join('&amp;')
    .split('"').join('&quot;')
    .split('<').join('&lt;');
}
function hashColor(key){ let h = 0; const s = String(key||'?'); for (let i = 0; i < s.length; i++) h = (h*31 + s.charCodeAt(i)) >>> 0; return AVC[h % AVC.length]; }
function stOf(t){ return SL[t.status] ? t.status : 'todo'; }
function firstChar(s){ return String(s||'?').trim().charAt(0) || '?'; }

/* ── แคชต่อรอบ render — allDec/นับคอมเม้น/หาคนจากอีเมล ถูกเรียกซ้ำหลายรอบต่อ 1 render
      ก่อนหน้านี้ decorate() วน S.comments ทุกงาน = O(งาน × คอมเม้น) → 300 งาน/1500 คอมเม้น = render 220ms
      ล้างแคชที่: ต้น render()/renderOverlays() และทุกจุดที่เขียน S.tasks/S.comments/S.users ── */
let _decMemo = null, _ccMap = null, _uMap = null;
function invalidateDec(){ _decMemo = null; _ccMap = null; _uMap = null; }
function ccOf(id){
  if (!_ccMap) { _ccMap = {}; S.comments.forEach(function(c){ if (c.type !== 'system') _ccMap[c.taskId] = (_ccMap[c.taskId] || 0) + 1; }); }
  return _ccMap[id] || 0;
}
function userByEmail(em){
  em = String(em||'').toLowerCase();
  if (!em) return null;
  if (!_uMap) { _uMap = {}; S.users.forEach(function(u){ if (u && u.email) _uMap[u.email] = u; }); }
  return _uMap[em] || null;
}
function userByName(n){ n = String(n||'').trim(); return n ? S.users.find(u => u.name === n || u.nickname === n) : null; }
function prepUser(u){
  const nick = u.nickname || String(u.name||u.email).split(' ')[0];
  return Object.assign({}, u, { nickname: nick, dept: u.dept || 'ไม่ระบุแผนก', color: hashColor(u.email), photo: u.photo || '' });
}
/* ชื่อที่แสดง: ชื่อจริง สกุล (ชื่อเล่น) */
function dispName(u){
  if (!u) return '';
  const nm = String(u.name || '').trim(), nk = String(u.nickname || '').trim();
  // ยังไม่ได้กรอกชื่อ-สกุลในชีท → โชว์อีเมลแทน (ห้ามโชว์ชื่อเล่นเดี่ยวๆ)
  if (!nm) return nk && nk.indexOf('@') < 0 ? nk : String(u.email || '').split('@')[0];
  return nm + (nk && nk !== nm && nm.indexOf(nk) < 0 ? ' (' + nk + ')' : '');
}
/* เรียงรายชื่อคน: ตัวเอง → แผนกเดียวกัน → คลังเดียวกัน → คนอื่น · ในกลุ่มเรียง ก-ฮ */
function userGroup(u){
  if (!S.me) return 3;
  if (u.email === S.me.email) return 0;
  const meD = String(S.me.dept || '').trim(), meW = String(S.me.warehouse || '').trim().toUpperCase();
  if (meD && meD !== 'ไม่ระบุแผนก' && String(u.dept || '').trim() === meD) return 1;
  if (meW && String(u.warehouse || '').trim().toUpperCase() === meW) return 2;
  return 3;
}
const UGLABEL = ['', 'แผนกเดียวกัน', 'คลังเดียวกัน', 'แผนกอื่น'];
function rankUsers(list){
  return list.slice().sort(function(a, b){
    return (userGroup(a) - userGroup(b)) || dispName(a).localeCompare(dispName(b), 'th');
  });
}
/* คนที่เกี่ยวข้องกับงาน (ผู้รับผิดชอบ) — ใช้ทำ sidebar filter / workload / ทีม */
function teamUsers(){
  const used = {};
  S.tasks.forEach(t => { const u = taskUser(t); if (u && u.email) used[u.email] = true; });
  return S.users.filter(u => used[u.email]);
}
/* หา user ของงาน: email ก่อน → ชื่อ (งาน migrate เก่าอาจมีแต่ชื่อ) */
function taskUser(t){ return userByEmail(t.assigneeEmail) || userByName(t.assigneeName) || null; }

/* checklist: JSON string → [{t,d}] */
function parseCl(t){
  try {
    const a = JSON.parse(t.checklist || '[]');
    return Array.isArray(a) ? a.filter(i => i && i.t != null) : [];
  } catch(e){ return []; }
}
function dueMeta(t){
  const st = stOf(t);
  if (st === 'cancelled') return { dateText: t.dueDate ? fmtYmd(t.dueDate) : '—', bg:'var(--slate-soft)', fg:'var(--muted)', tip: fmtYmd(t.dueDate), badge:'ยกเลิกแล้ว', urg:5, sort:3e9 };
  if (st === 'done') return { dateText: t.dueDate ? fmtYmd(t.dueDate) : 'ไม่มีกำหนด', bg:'var(--green-soft)', fg:'var(--green)', tip: t.dueDate || 'ยังไม่กำหนดวันส่ง', badge:'เสร็จแล้ว', urg:4, sort:2e9 };
  if (!t.dueDate) return { dateText:'ไม่มีกำหนด', bg:'var(--slate-soft)', fg:'var(--muted)', tip:'ยังไม่กำหนดวันส่ง', badge:null, urg:3, sort:1e9 };
  const d = diffDays(t.dueDate), ds = fmtYmd(t.dueDate);
  if (d < 0) return { dateText:ds, bg:'var(--red-soft)', fg:'var(--red)', tip:t.dueDate, badge:'เลยกำหนด ' + (-d) + ' วัน', urg:0, sort:d };
  if (d === 0) return { dateText:'วันนี้', bg:'var(--amber-soft)', fg:'var(--amber)', tip:t.dueDate, badge:'ครบกำหนดวันนี้', urg:1, sort:0 };
  if (d <= 3) return { dateText:ds, bg:'var(--amber-soft)', fg:'var(--amber)', tip:t.dueDate, badge:'เหลือ ' + d + ' วัน', urg:1, sort:d };
  return { dateText:ds, bg:'var(--slate-soft)', fg:'var(--muted)', tip:t.dueDate, badge:null, urg:2, sort:d };
}
function decorate(t){
  const u = taskUser(t);
  const dm = dueMeta(t);
  const cc = ccOf(t.id);
  const cl = parseCl(t);
  const rawName = u ? dispName(u) : (t.assigneeName || '');
  return {
    id: t.id, title: t.title, detail: t.detail || '—', status: stOf(t), statusLabel: SL[stOf(t)], dueIso: t.dueDate || '',
    u, avName: rawName || 'ยังไม่มอบหมาย', avInit: u ? firstChar(u.nickname) : (rawName ? firstChar(rawName) : '?'),
    avColor: u ? u.color : (rawName ? hashColor(rawName) : ''),
    avPhoto: u ? u.photo : '',
    noAv: !rawName, dept: u ? u.dept : '', warehouse: u ? (u.warehouse || '') : '',
    prioColor: PC[t.priority] || PC.med, prioLabel: PL[t.priority] || PL.med,
    dueText: dm.dateText, dueBg: dm.bg, dueFg: dm.fg, dueTip: dm.tip, badge: dm.badge || '', hasBadge: !!dm.badge,
    cc, urg: dm.urg, sort: dm.sort,
    ts: t.createdAt || '',
    rk: recencyKey(t),
    clTotal: cl.length, clDone: cl.filter(i => i.d).length,
    priv: isPrivate(t), secret: isSecret(t)
  };
}

/* ═══════════════════════════════════════════════════════════════════════════
   📌 กฎการเรียงลำดับ (SORT RULE) — ใช้กับ "ทุกลิสต์" ในแอปนี้ ห้ามยกเว้น
   ───────────────────────────────────────────────────────────────────────────
   1) มีกำหนดส่ง (deadline) → ดู deadline ก่อนเสมอ
      เลยกำหนด → วันนี้/ใกล้ครบ → ไกล → ไม่มีกำหนด → เสร็จแล้ว → ยกเลิก
   2) เสมอกัน (deadline เท่ากัน / ไม่มี deadline) → "ล่าสุดอยู่บน" (ใหม่→เก่า)
   3) ลิสต์ที่ไม่มี deadline เลย (คอมเม้น · แจ้งเตือน · ฟีด · งานประจำ)
      → "ล่าสุดอยู่บน" ล้วนๆ
   ยกเว้นได้กรณีเดียว: ลำดับที่ผู้ใช้จัดเอง (เช็คลิสต์ที่ลากเรียง) และ
   ปฏิทิน/กราฟที่ต้องไล่วันจากน้อยไปมากตามธรรมชาติ
   ═══════════════════════════════════════════════════════════════════════════ */
// เวลา "ล่าสุด" ของงาน — งานที่ปิดแล้วใช้เวลาปิด (เพิ่งเสร็จอยู่บน) · งานที่ยังเปิดใช้เวลาสร้าง (เพิ่งสร้างอยู่บน)
// เช็คลิสต์เดินเลขให้เอง → ตัดเลขที่พิมพ์นำหน้ามาเองทิ้ง ("1. งาน" / "2.งาน" / "3) งาน")
// ต้องตามด้วยตัวที่ไม่ใช่เลข กัน "3.5 นิ้ว" โดนตัด
function clStrip(s){ return String(s == null ? '' : s).replace(/^\s*\d{1,2}\s*[.)]\s*(?=\D)/, '').trim(); }
function recencyKey(t){
  const st = stOf(t);
  return (st === 'done' || st === 'cancelled') ? (t.updatedAt || t.createdAt || '') : (t.createdAt || '');
}
// ใหม่→เก่า (ใช้กับค่า timestamp ISO ที่เทียบ string ตรงๆ ได้)
function newFirst(a, b){ const x = a || '', y = b || ''; return x < y ? 1 : x > y ? -1 : 0; }
// โหมด 'due' (default ตามกฎ) = deadline ก่อน แล้วล่าสุดอยู่บน · โหมด 'new' = ล่าสุดอยู่บนล้วนๆ (ปุ่มสลับที่หัวบอร์ด)
function sortL(a){
  if (S.sortMode === 'new') return a.slice().sort((x,y) => newFirst(x.rk, y.rk) || (x.urg - y.urg) || (x.sort - y.sort));
  return a.slice().sort((x,y) => (x.urg - y.urg) || (x.sort - y.sort) || newFirst(x.rk, y.rk));
}
function allDec(){ if (!_decMemo) _decMemo = S.tasks.map(decorate); return _decMemo; }
function fDec(){
  const dec = allDec();
  if (!S.memberFilter) return dec;
  return dec.filter(d => d.u && d.u.email === S.memberFilter);
}
function isInvolved(t){
  if (!S.me) return false;
  const em = S.me.email;
  return String(t.assigneeEmail||'').toLowerCase() === em || String(t.reporterEmail||'').toLowerCase() === em || String(t.createdBy||'').toLowerCase() === em;
}
/* ⚠️ แก้งานได้เฉพาะคนที่ "มีชื่ออยู่บนงาน" เท่านั้น — ผู้สั่ง / ผู้รับผิดชอบ
   หัวหน้าที่ไม่เกี่ยวกับงานนี้ก็แก้ไม่ได้ (คอมเม้นได้อย่างเดียว) — คำสั่ง Surat 2026-07-21
   คนที่ถูกมอบเฉพาะ "ข้อในเช็คลิสต์" ไม่ผ่านตรงนี้ แต่ติ๊กข้อตัวเองได้ผ่าน canTickCl() */
function canEdit(t){
  if (!S.me) return false;
  return isInvolved(t);
}
// ติ๊กข้อนี้ได้ไหม — ข้อที่มอบหมายแล้ว = เฉพาะเจ้าของข้อกับคนที่มอบ · ข้อที่ยังไม่มอบ = คนที่แก้งานได้
function canTickCl(t, it){
  if (!S.me || stOf(t) === 'cancelled') return false;
  const me = S.me.email;
  if (it && it.asg) return String(it.asg).toLowerCase() === me || String(it.asgBy || '').toLowerCase() === me;
  return canEdit(t);
}
function privOf(t){ const p = String(t.private||'').trim().toUpperCase(); return p === 'P' ? 'P' : (p === 'Y' ? 'Y' : ''); }
function isPrivate(t){ return privOf(t) === 'Y'; }   // 'Y' = เฉพาะทีม (คลังเดียวกัน)
function isSecret(t){ return privOf(t) === 'P'; }    // 'P' = ส่วนตัว (คนสร้าง + ผู้รับผิดชอบ)
// คอมเม้น: หัวหน้า R5+ ได้ทุกงานที่เห็น · เจ้าของงานคอมเม้นงานตัวเองได้ · คนอื่นดูอย่างเดียว
function canComment(t){
  if (!S.me) return false;
  if (S.me.role >= 5) return true;
  return isInvolved(t) || hasMyClItem(t);   // ถูกมอบข้อในเช็คลิสต์ = คุยในงานได้
}
// มีข้อในเช็คลิสต์ที่มอบให้เราไหม
function hasMyClItem(t){
  if (!S.me) return false;
  const me = S.me.email;
  return parseCl(t).some(function(i){ return String(i.asg || '').toLowerCase() === me; });
}

/* ── avatar html (รูปจริงจาก Users Sheet ถ้ามี · โหลดไม่ได้ fallback ตัวอักษร) ── */
function avCore(init, color, photo, size){
  const fs = Math.round(size * 0.48);
  const img = photo ? '<img src="' + esc(photo) + '" alt="" loading="lazy" onerror="this.remove()">' : '';
  return '<div class="rf-av" style="width:' + size + 'px;height:' + size + 'px;font-size:' + fs + 'px;background:' + color + '">' + esc(init) + img + '</div>';
}
function avHtml(d, size){
  const fs = Math.round(size * 0.48);
  if (d.noAv) return '<div class="rf-av none" style="width:' + size + 'px;height:' + size + 'px;font-size:' + fs + 'px">?</div>';
  return avCore(d.avInit, d.avColor, d.avPhoto, size);
}
function avUserHtml(u, size){
  return avCore(firstChar(u.nickname), u.color, u.photo, size);
}

/* ── API ── */
async function api(action, payload){
  const body = Object.assign({ action: action, email: S.me ? S.me.email : (SESSION.email || '') }, payload || {});
  const res = await fetch(CFG.exec, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
  if (!res.ok) throw new Error('เชื่อมต่อไม่สำเร็จ (HTTP ' + res.status + ')');
  const j = await res.json();
  if (!j.ok) throw new Error(j.error || 'ไม่ทราบสาเหตุ');
  return j;
}

    S.me = c.me; S.users = c.users || []; S.tasks = c.tasks || []; S.comments = c.comments || [];
    invalidateDec();
    initWarehouseFilter();   // เปิดจาก cache ก็ให้ชิปคลังเป็นคลังตัวเองตั้งแต่เฟรมแรก
    return true;
  } catch(e){ return false; }
}

function parseJwt(tok){
  const b = tok.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');
  const s = atob(b);
  return JSON.parse(decodeURIComponent(Array.prototype.map.call(s, c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join('')));
}
function initGsi(){
  if (!(window.google && google.accounts && google.accounts.id)) { setTimeout(initGsi, 250); return; }
  google.accounts.id.initialize({ client_id: CFG.clientId, callback: onCredential });
  const holder = document.getElementById('gsiBtn');
  if (holder) google.accounts.id.renderButton(holder, { theme:'outline', size:'large', shape:'pill', text:'signin_with', locale:'th' });
}
function onCredential(resp){
  let p = null;
  try { p = parseJwt(resp.credential); } catch(e){}
  if (!p || !p.email) { showLoginErr('อ่านข้อมูลบัญชี Google ไม่สำเร็จ ลองใหม่อีกครั้ง'); return; }
  SESSION = { email: String(p.email).toLowerCase(), name: p.name || '' };
  document.getElementById('gsiBtn').style.display = 'none';
  document.getElementById('loginSpin').style.display = 'block';
  document.getElementById('loginErr').style.display = 'none';

}

/* ── data load ── */
let _pollStarted = false, _prevUnread = null, _pendingTaskOpen = '';
// ครั้งแรกที่รู้ว่าเราอยู่คลังไหน → ตั้งชิปคลังเป็นคลังตัวเอง (ทำครั้งเดียว · ถ้าผู้ใช้กด "ทั้งหมด" เองต้องไม่ถูกเซ็ตกลับ)
function initWarehouseFilter(){
  if (S._fwInit) return;
  S._fwInit = true;
  if (S.me && S.me.role >= 7) return;   // ผู้บริหาร (R7) เปิดมาเห็นทุกคลัง
  const myW = String((S.me && S.me.warehouse) || '').trim().toUpperCase();
  if (myW) S.filterW = myW;
}
async function loadAll(silent){
  if (!SESSION.email) { showLogin(); return; }
  if (!silent) { S.loading = true; showApp(); render(); }
  try {
    const j = await api('list');
    S.me = prepUser(j.me);
    initWarehouseFilter();
    S.users = (j.users || []).map(prepUser);
    S.tasks = j.tasks || [];
    S.comments = j.comments || [];
    invalidateDec();
    const _nu = notifUnread();   // มีของใหม่เข้ามาระหว่าง sync → เด้ง toast (ข้ามรอบโหลดแรก)
    if (_prevUnread !== null && _nu > _prevUnread) toast('🔔 มีแจ้งเตือนใหม่ ' + (_nu - _prevUnread) + ' รายการ');
    _prevUnread = _nu;
    updateAppBadge();
    if (!S.calSel) {
      const td = pd(todayIso());
      S.calSel = todayIso(); S.calY = td.getFullYear(); S.calM = td.getMonth();
    }
    S.loading = false;
    saveSession(); saveCache(); showApp(); render(); renderOverlays();
    calSyncIfStale();
    maybeFirstNag();
    if (_pendingTaskOpen && S.tasks.some(function(t){ return t.id === _pendingTaskOpen; })) { RF.openTask(_pendingTaskOpen); _pendingTaskOpen = ''; }   // เปิดงานจากลิงก์นอติ หลังข้อมูลพร้อม
  } catch(e){
    const msg = String(e.message || e);
    if (/user not found|user inactive/i.test(msg)) {
      clearSession();
      showLoginErr(/inactive/i.test(msg) ? 'บัญชีของคุณถูกปิดใช้งาน (inactive) — ติดต่อผู้ดูแลระบบ' : 'ไม่พบอีเมลนี้ในรายชื่อผู้ใช้ Rattana — ติดต่อผู้ดูแลระบบเพื่อเพิ่มสิทธิ์');
      return;
    }
    if (S.loading) { S.loading = false; render(); }
    toast('โหลดข้อมูลไม่สำเร็จ: ' + msg);
  }
}

// รีเฟรชเงียบทุก 40 วิ (เฉพาะตอนเปิดแอปอยู่ + ไม่มี modal เปิด) + รีเฟรชทันทีเมื่อสลับกลับมาแอป
// คอมเม้นสด: ดึงเฉพาะคอมเม้นของงานที่เปิดอยู่ (เบากว่าโหลดทั้งก้อนมาก) — ไม่ rebuild ถ้าไม่มีอะไรใหม่
async function pollComments(){
  const taskId = S.detailId;
  if (!taskId || !SESSION.email || S.cmtSending || S._cmtBusy) return;   // _cmtBusy = คอมเม้นเราเองยังบันทึกไม่เสร็จ ดึงตอนนี้จะซ้ำ
  try {
    const j = await api('listComments', { taskId: taskId });
    if (S.detailId !== taskId) return;                       // ผู้ใช้เปลี่ยนงานระหว่างรอ → ทิ้งผลลัพธ์
    const fresh = j.comments || [];
    const cur = S.comments.filter(function(c){ return c.taskId === taskId; });
    const tmps = cur.filter(function(c){ return String(c.id || '').indexOf('tmp') === 0; });   // ที่เพิ่งส่งยังไม่ตอบกลับ เก็บไว้
    const added = fresh.length - (cur.length - tmps.length);
    if (added <= 0) return;                                  // ไม่มีคอมเม้นใหม่ → ไม่ต้อง rebuild (กันจอกระตุก)
    S.comments = S.comments.filter(function(c){ return c.taskId !== taskId; }).concat(fresh, tmps);
    invalidateDec();
    toast('💬 มีคอมเม้นใหม่ ' + added);
    renderOverlays(); render();
  } catch(e){}
}

function startPolling(){
  if (_pollStarted) return;
  _pollStarted = true;
  // ห้าม sync ตอนกรอกฟอร์ม/ลากของ (จอจะกระตุก) — แต่ "เปิดหน้ารายละเอียดอยู่" sync ได้ (เดิมบล็อกไว้ เลยไม่เห็นคอมเม้นใหม่)
  // + ห้าม sync ตอน "กำลังพิมพ์อยู่" ทุกช่อง — rebuild ระหว่างพิมพ์ทำ focus/ข้อความหลุด (เลื่อนไปรอบหน้าแทน)
  const canSync = function(){ return SESSION.email && !S.loading && document.visibilityState === 'visible' && !S.formOpen && !S.asgPick && !S.dragId && !S._clDrag && !S.recurForm && !typingNow(); };
  setInterval(function(){ if (canSync()) loadAll(true); }, 75000);
  setInterval(function(){ if (canSync() && S.detailId && !S.closing) pollComments(); }, 15000);
  document.addEventListener('visibilitychange', function(){
    if (document.visibilityState !== 'visible') return;
    updateAppBadge();                    // กลับเข้าแอป → เลขแดงบนไอคอนตรงกับที่ยังไม่ได้อ่านจริง
    if (canSync()) loadAll(true);
  });
}

/* ── ลากลงเพื่อรีเฟรช (มือถือ) — เร็วกว่า native pull-to-refresh เพราะ sync เงียบ ไม่โหลดหน้าใหม่ทั้งหน้า ── */
function initPullRefresh(){
  const TH = 70;                       // ต้องลากลงเกินนี้ถึงจะรีเฟรช
  let startY = 0, pulling = false, dist = 0, bar = null;
  function barEl(){
    if (!bar || !document.body.contains(bar)) { bar = document.createElement('div'); bar.className = 'rf-pull'; document.body.appendChild(bar); }
    return bar;
  }
  function show(d){
    const el = barEl(), go = d >= TH;
    el.style.height = Math.min(d, 90) + 'px';
    el.classList.toggle('go', go);
    el.textContent = go ? '↻ ปล่อยเพื่อรีเฟรช' : '↓ ลากลงเพื่อรีเฟรช';
  }
  function hide(){ if (bar) { bar.style.height = '0px'; bar.classList.remove('go'); } }
  document.addEventListener('touchstart', function(e){
    pulling = false; dist = 0;
    if (!SESSION.email || S.loading || anyModalOpen()) return;
    if ((window.scrollY || document.documentElement.scrollTop || 0) > 0) return;
    if (!e.touches || e.touches.length !== 1) return;
    startY = e.touches[0].clientY; pulling = true;
  }, { passive: true });
  document.addEventListener('touchmove', function(e){
    if (!pulling) return;
    dist = e.touches[0].clientY - startY;
    if (dist > 0 && (window.scrollY || 0) === 0) show(dist); else hide();
  }, { passive: true });
  document.addEventListener('touchend', function(){
    if (pulling && dist >= TH) { hide(); toast('กำลังรีเฟรช…'); loadAll(true); } else hide();
    pulling = false; dist = 0;
  });
  document.addEventListener('touchcancel', function(){ hide(); pulling = false; dist = 0; });
}

// deep-link จากนอติ: ลิงก์มี ?task=<id> → เปิดงานนั้น
function taskFromLink(u){ try { const m = String(u || '').match(/[?&#]task=([^&#]+)/); return m ? decodeURIComponent(m[1]) : ''; } catch(e){ return ''; } }
function openTaskFromLink(u){ const id = taskFromLink(u); if (id && S.tasks.some(function(t){ return t.id === id; })) { RF.openTask(id); return true; } return false; }
function setupDeepLink(){
  _pendingTaskOpen = taskFromLink(location.href);   // แอปเปิดจากนอติ (ปิดอยู่) → จำไว้เปิดหลังโหลดเสร็จ
  try {
    if ('serviceWorker' in navigator) navigator.serviceWorker.addEventListener('message', function(e){
      if (e.data && e.data.type === 'rf-open') openTaskFromLink(e.data.link);   // แอปเปิดอยู่ กดนอติ → เปิดงานทันที
    });
  } catch(e){}
}

/* ── back button ปิด sheet แทนออกจากแอป (push dummy history เมื่อเปิด modal) ── */
function anyModalOpen(){ return S.formOpen || S.menuOpen || !!S.listPop || !!S.asgPick || !!S.recurForm || (!!S.detailId && !S.closing); }
function syncHistory(){ if (anyModalOpen() && !S._histPushed) { S._histPushed = true; try { history.pushState({ rf: 1 }, ''); } catch(e){} } }
function dropHistory(){ if (S._histPushed && !anyModalOpen()) { S._histPushed = false; try { history.back(); } catch(e){} } }
window.addEventListener('popstate', function(){
  if (!anyModalOpen()) return;           // ไม่มี sheet เปิด → ปล่อย back ทำงานปกติ
  S._histPushed = false;
  if (S.asgPick) RF.clAsgClose();
  else if (S.recurForm) RF.recurClose();
  else if (S.formOpen) RF.closeForm(true);
  else if (S.menuOpen) RF.closeMenu(true);
  else if (S.listPop) RF.closePop(true);
  else if (S.detailId && !S.closing) RF.closeDetail(true);
  syncHistory();                         // ยังมี sheet อื่นซ้อนอยู่ → กัน back ทะลุ
});

/* ── main render ── */
function render(){
  const app = document.getElementById('app');
  if (!app) return;
  if (S.dragId) return;                  // ระหว่างลากการ์ด ห้าม rebuild DOM — การ์ดที่ลากถูกทำลายแล้ว drop ไม่ทำงาน (กัน sync เบื้องหลังมาชนตอนลาก)
  if (S._clDrag) return;                  // ระหว่างลากจัดลำดับเช็คลิสต์ ห้าม rebuild เช่นกัน
  invalidateDec();
  const fs = focusSnap();                // จำช่องที่กำลังพิมพ์อยู่ (เช่น ช่องค้นหา) — innerHTML ทำ focus + ตัวหนังสือหลุด
  const sy = window.scrollY;             // จำตำแหน่ง scroll ก่อน rebuild — innerHTML ทำจอเด้งกลับบนสุด
  const mob = isMob();
  let html = '';
  if (!mob) html += sideHtml();
  html += '<div class="rf-main">' + headHtml(mob) + '<div class="rf-content">' + bannerHtml() + (S.loading ? skelHtml() : viewHtml(mob)) + '</div></div>';
  app.innerHTML = html;
  if (mob) {
    app.insertAdjacentHTML('beforeend', bnavHtml() + '<button class="rf-fab" onclick="RF.newTask()" title="สร้างงานใหม่">' + IC.plus.replace('width="16" height="16"','width="24" height="24"') + '</button>');
  }
  window.scrollTo(0, sy);                // คืนตำแหน่งเดิม — หน้าไหนตั้งใจขึ้นบนสุด เรียก scrollTo(0,0) เองหลัง render()
  focusBack(fs);
}

/* ── กันพิมพ์อยู่แล้วโดนเด้งออก ──
   ทุกช่องที่มี id: จำ focus + ตำแหน่งเคอร์เซอร์ + ข้อความ ก่อน rebuild แล้วคืนให้หลัง rebuild
   (ช่องที่เก็บค่าไว้ใน DOM อย่างเดียว เช่น ช่องเพิ่มเช็คลิสต์ ถ้าไม่คืนค่า ข้อความที่พิมพ์ค้างจะหาย) */
function isTyping(){
  const ae = document.activeElement;
  if (!ae) return false;
  return ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA' || ae.isContentEditable === true;
}
// "กำลังพิมพ์อยู่จริง" = อยู่ในช่อง + เพิ่งกดแป้นภายใน 5 วิ — ถ้าเช็คแค่ "เคอร์เซอร์อยู่ในช่อง"
// คนที่คลิกช่องค้นหาแล้วปล่อยไว้ จะบล็อก sync ค้างไปตลอด
let _lastKey = 0;
document.addEventListener('keydown', function(){ _lastKey = Date.now(); }, true);
function typingNow(){ return isTyping() && (Date.now() - _lastKey) < 5000; }
function focusSnap(){
  const ae = document.activeElement;
  if (!ae || !ae.id || !isTyping()) return null;
  const o = { id: ae.id, v: ae.value };
  try { o.s = ae.selectionStart; o.e = ae.selectionEnd; } catch(err){}
  return o;
}
function focusBack(snap){
  if (!snap) return;
  const el = document.getElementById(snap.id);
  if (!el) return;
  if (snap.v && !el.value) el.value = snap.v;
  try { el.focus({ preventScroll: true }); if (snap.s != null) el.setSelectionRange(snap.s, snap.e); } catch(err){}
}

function skelHtml(){

  h += '</div><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px"><div class="rf-skel" style="height:260px;border-radius:16px"></div><div class="rf-skel" style="height:260px;border-radius:16px"></div></div>' +

  return h;
}

/* คนที่ยังไม่เปิดแจ้งเตือน → เตือนทุกครั้งที่เปิดแอป (กดปิดได้ แต่แค่รอบนี้ เปิดแอปใหม่เตือนอีก) */
/* ยังไม่ได้เปิดแจ้งเตือน? — v2.51 ย้ายจากแถบบนหน้าภาพรวม เข้าไปอยู่ใน "กระดิ่ง" แทน
   (กินที่หน้าแรกน้อยลง แต่ยังไม่พลาด เพราะกระดิ่งขึ้นจุดส้มเตือนไว้) */
function pushNagNeed(){
  if (!pushConfigured() || !S.me || pushOn()) return null;
  const iOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
  const installed = !!(window.navigator.standalone || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches));
  let denied = false;
  try { denied = ('Notification' in window) && Notification.permission === 'denied'; } catch(e){}
  if (iOS && !installed) return { k:'ios', tx:'iPhone ต้องกด <b>แชร์ → เพิ่มลงในหน้าจอโฮม</b> ก่อน แล้วเปิดจากไอคอนนั้น ถึงจะรับแจ้งเตือนได้' };
  if (denied) return { k:'denied', tx:'แจ้งเตือนถูกปิดไว้ที่เครื่อง — เปิดใหม่ที่ <b>ตั้งค่าเครื่อง → การแจ้งเตือน → R-Flow</b>' };
  return { k:'ask', tx:'ยังไม่ได้เปิดแจ้งเตือน — มีคนมอบงานหรือคอมเม้นถึงคุณจะไม่รู้เลย',
    btn:'<button class="rf-nagbtn" onclick="RF.enablePush()">เปิดแจ้งเตือน</button>' };
}
function pushNagHtml(){
  const n = pushNagNeed();
  if (!n) return '';
  return '<div class="rf-nag"><div class="ic">🔔</div><div class="tx">' + n.tx + '</div>' + (n.btn || '') + '</div>';
}
/* เตือนเรื่องเปิดแจ้งเตือน "ครั้งเดียว" ตอนใช้ครั้งแรก — เปิดกระดิ่งให้เลย ไม่งั้นคนที่ไม่เคยแตะกระดิ่งจะไม่มีวันรู้
   หลังจากนั้นเหลือแค่จุดส้มบนกระดิ่ง · จำแยกตามเคส (ios/denied/ask) — เคสเปลี่ยน (เช่นติดตั้ง PWA แล้ว) เตือนใหม่ได้อีกครั้ง */
let _nagChecked = false;
function maybeFirstNag(){
  if (_nagChecked || !S.me || S.loading) return;
  _nagChecked = true;
  const n = pushNagNeed();
  if (!n) return;
  const key = 'rf_nag_seen_' + S.me.email;
  let seen = '';
  try { seen = localStorage.getItem(key) || ''; } catch(e){}
  if (seen === n.k) return;
  try { localStorage.setItem(key, n.k); } catch(e){}
  setTimeout(function(){
    if (anyModalOpen()) return;                              // กำลังเปิดอย่างอื่นอยู่ อย่าไปแทรก
    S.listPop = 'notif'; S.popFresh = true;                  // ⚠️ ไม่เรียก RF.openNotif — จะไปล้างสถานะ "ยังไม่ได้อ่าน" ทิ้ง
    renderOverlays(); syncHistory(); render();
    toast(n.k === 'ask' ? '🔔 เปิดแจ้งเตือนก่อน จะได้ไม่พลาดงานที่มอบให้คุณ' : '🔔 เครื่องนี้ยังรับแจ้งเตือนไม่ได้ — ดูวิธีแก้ด้านล่าง');
  }, 700);
}

  if (S.memberFilter && !S.loading && (S.view === 'board' || S.view === 'cal')) {

// จำนวนงานค้างของเรา (ยังไม่เสร็จ + ไม่ยกเลิก) — ใช้ทำ badge ที่เมนู "งานของฉัน"
function myOpenCount(){
  if (!S.me) return 0;
  const me = S.me.email;
  return allDec().filter(function(d){ return d.u && d.u.email === me && d.status !== 'done' && d.status !== 'cancelled'; }).length;
}
function navNum(){ const n = myOpenCount(); return n ? '<span class="rf-navnum">' + (n > 99 ? '99+' : n) + '</span>' : ''; }
// มือถือ: badge ต้องลอยมุมบนขวาของไอคอน — ถ้าต่อท้ายข้อความ label ปุ่มจะแคบเกินแล้วเลขตกไปบรรทัดล่าง ทะลุแถบ nav
function navDot(){ const n = myOpenCount(); return n ? '<span class="rf-navdot">' + (n > 99 ? '99+' : n) + '</span>' : ''; }

// checklist ข้อที่ "มอบให้เรา" จากทุกงาน (รวมงานของคนอื่น) เฉพาะที่ยังไม่ติ๊ก — เรียงตามกำหนดส่งของงานแม่
function myChecklistItems(){
  if (!S.me) return [];
  const me = S.me.email, out = [];
  S.tasks.forEach(function(t){
    const st = stOf(t);
    if (st === 'cancelled' || st === 'done') return;
    parseCl(t).forEach(function(it, i){
      if (it.asg === me && !it.d) out.push({ t: t, i: i, text: it.t, due: t.dueDate || '', urg: dueMeta(t).urg, sort: dueMeta(t).sort, ts: it.ts || t.createdAt || '' });
    });
  });
  out.sort(function(a, b){ return (a.urg - b.urg) || (a.sort - b.sort) || newFirst(a.ts, b.ts); });   // deadline ก่อน → ล่าสุดอยู่บน
  return out;
}

/* ── งานของฉัน — list เรียงตามกำหนดส่งใกล้สุด + รายการย่อย (checklist) ที่คนมอบให้เรา ── */
function myWorkHtml(){
  if (!S.me) return '';
  const me = S.me.email;
  const mine = allDec().filter(function(d){ return d.u && d.u.email === me && d.status !== 'cancelled'; });
  const active = sortL(mine.filter(function(d){ return d.status !== 'done'; }));   // sortL = เลยกำหนด→ใกล้→ไกล→ไม่มีกำหนด
  const done = mine.filter(function(d){ return d.status === 'done'; });
  const overdueN = active.filter(function(d){ return d.urg === 0; }).length;
  const clMine = myChecklistItems();
  const meL = String(me || '').toLowerCase();
  // งานที่ "เราสั่ง" ให้คนอื่นทำ — ไว้ติดตามว่าเขารับงานแล้วยัง / คืบหน้าถึงไหน
  const ordered = sortL(allDec().filter(function(d){
    const t2 = S.tasks.find(function(x){ return x.id === d.id; });
    if (!t2) return false;
    return String(t2.reporterEmail || '').toLowerCase() === meL &&
      String(t2.assigneeEmail || '').toLowerCase() !== meL &&
      d.status !== 'done' && d.status !== 'cancelled';
  }));
  const unack = ordered.filter(function(d){ const t2 = S.tasks.find(function(x){ return x.id === d.id; }); return t2 && !t2.ackAt; }).length;
  const tab = S.mwTab === 'out' ? 'out' : 'in';

  let h = '<div class="rf-view">' +
    '<div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px"><h1 class="rf-h1">งานของฉัน</h1>' +
    '<div class="rf-sub" style="margin-top:0">' +
    (tab === 'in'
      ? active.length + ' งานค้าง' + (clMine.length ? ' · ' + clMine.length + ' รายการย่อย' : '') +
        (overdueN ? ' · <span style="color:var(--red);font-weight:700">เลยกำหนด ' + overdueN + '</span>' : '')
      : ordered.length + ' งานที่สั่งไว้' + (unack ? ' · <span style="color:var(--amber);font-weight:700">ยังไม่รับ ' + unack + '</span>' : '')) +
    '</div></div>' +
    '<div class="rf-scope" style="margin-bottom:12px">' +
    '<button class="' + (tab === 'in' ? 'on' : '') + '" onclick="RF.mwTab(\'in\')">งานที่รับมา' + (active.length + clMine.length ? ' ' + (active.length + clMine.length) : '') + '</button>' +
    '<button class="' + (tab === 'out' ? 'on' : '') + '" onclick="RF.mwTab(\'out\')">งานที่ฉันสั่ง' + (ordered.length ? ' ' + ordered.length : '') + '</button></div>';

  if (tab === 'out') {
    if (!ordered.length) h += '<div class="rf-empty" style="padding:36px 16px;text-align:center">ยังไม่ได้สั่งงานใคร<div style="font-size:13px;color:var(--muted);margin-top:6px">งานที่คุณมอบให้คนอื่นจะมาโผล่ที่นี่</div></div>';
    else {
      if (unack) h += '<div class="rf-mwsec" style="color:var(--amber)">⏳ ยังไม่กดรับงาน <span style="opacity:.55">(' + unack + ')</span></div>';
      h += '<div class="rf-list">';
      ordered.forEach(function(d){
        const t2 = S.tasks.find(function(x){ return x.id === d.id; });
        h += '<div class="rf-ordrow">' + rowHtml(d, { badge: true }) +
          (t2 && !t2.ackAt ? '<div class="rf-ordack">⏳ ยังไม่กดรับงาน</div>' : '') + '</div>';
      });
      h += '</div>';
    }
    return h + '</div>';
  }

  if (clMine.length) {
    h += '<div class="rf-mwsec" style="color:var(--accent-ink)">☑️ รายการย่อยที่มอบให้ฉัน <span style="opacity:.55">(' + clMine.length + ')</span></div>';
    clMine.forEach(function(c){
      h += '<div class="rf-mwcl">' +
        '<button class="rf-cl-box" onclick="event.stopPropagation();RF.clToggle(\'' + jsq(c.t.id) + '\',' + c.i + ')" title="ติ๊กว่าเสร็จ"></button>' +
        '<button class="rf-mwcl-t" onclick="RF.openTask(\'' + jsq(c.t.id) + '\')">' +
        '<div class="t">' + esc(clStrip(c.text)) + '</div>' +
        '<div class="s">จากงาน: ' + esc(c.t.title || '') + (c.due ? ' · กำหนด ' + fmtYmd(c.due) : '') + '</div>' +
        '</button></div>';
    });
  }

  h += '<div class="rf-mwsec"' + (clMine.length ? ' style="margin-top:18px"' : '') + '>📋 งานที่ต้องทำ <span style="opacity:.55">(' + active.length + ')</span></div>';
  if (!active.length) h += '<div class="rf-empty" style="padding:32px 16px;text-align:center">🎉 ไม่มีงานค้าง<div style="font-size:13px;color:var(--muted);margin-top:6px">งานที่มอบให้คุณจะมาโผล่ที่นี่</div></div>';
  else h += '<div class="rf-list">' + active.map(function(d){ return rowHtml(d, { badge: true }); }).join('') + '</div>';

  if (done.length) h += '<div class="rf-mwsec" style="color:var(--green);margin-top:22px">✅ เสร็จแล้ว <span style="opacity:.55">(' + done.length + ')</span></div>' +
    '<div class="rf-list">' + sortL(done).slice(0, 20).map(function(d){ return rowHtml(d, {}); }).join('') + '</div>';
  return h + '</div>';
}

/* ── แถบ "ต้องทำก่อน" — 2 งานของเราที่ใกล้ครบกำหนดที่สุด (บนสุดของภาพรวม) ──

const UPNEXT_N = 2;

  if (!S.me) return [];

    .filter(function(d){ return d.u && d.u.email === me && d.status !== 'done' && d.status !== 'cancelled'; })
    .sort(function(x, y){ return (x.urg - y.urg) || (x.sort - y.sort) || newFirst(x.rk, y.rk); })
    .slice(0, UPNEXT_N);
}
function upNextHtml(){
  if (S.loading) return '';

  if (!list.length) return '';

    const sc = SC[d.status] || SC.todo;

    '<button onclick="RF.go(\'mine\')">ดูทั้งหมด ›</button></div>' + rows + '</div>';
}

  const meta = '<div class="t2"><span class="rf-spill" style="background:' + sc[0] + ';color:' + sc[1] + '">' + d.statusLabel + '</span>' +
    '<span class="nm">' + esc(d.avName) + '</span>' +
    (d.clTotal ? '<span class="rf-rchip"' + (d.clDone === d.clTotal ? ' style="color:var(--green)"' : '') + '>' + IC.cl + d.clDone + '/' + d.clTotal + '</span>' : '') +
    (d.cc > 0 ? '<span class="rf-rchip">' + IC.cmt + d.cc + '</span>' : '') +
    (d.secret ? '<span class="rf-rchip" title="ส่วนตัว">🔒</span>' : d.priv ? '<span class="rf-rchip" title="เฉพาะทีม">👥</span>' : '') + '</div>';
  return '<button class="rf-row' + (d.status === 'done' ? ' isdone' : '') + '" style="--rc:' + sc[1] + '" onclick="RF.openTask(\'' + jsq(d.id) + '\')">' + avHtml(d, opt.av || 32) +
    '<div style="flex:1;min-width:0"><div class="t1">' + esc(d.title) + '</div>' + meta + '</div>' + right + '</button>';
}

/* ── Dashboard ── */
function dashHtml(){
  const mineOnly = S.dashMine !== false && !!S.me;          // เปิดมา = เห็นเฉพาะงานของเราก่อน
  const meE = S.me ? S.me.email : '';
  const all = allDec().filter(d => d.status !== 'cancelled');
  const act = mineOnly ? all.filter(d => d.u && d.u.email === meE) : all;
  const td = pd(todayIso());
  const overdue = act.filter(d => d.urg === 0);
  const done7 = S.tasks.filter(function(t){
    if (stOf(t) !== 'done' || !t.updatedAt) return false;
    if (mineOnly) { const u = taskUser(t); if (!u || u.email !== meE) return false; }
    const di = tsDateIso(t.updatedAt); return di && diffDays(di) >= -7;
  }).length;
  const scopeTog = S.me ? '<div class="rf-scope">' +
    '<button class="' + (mineOnly ? 'on' : '') + '" onclick="RF.dashScope(1)">ของฉัน</button>' +
    '<button class="' + (!mineOnly ? 'on' : '') + '" onclick="RF.dashScope(0)">ทั้งทีม</button></div>' : '';
  let h = '<div class="rf-view"><div class="rf-dashhead">' +
    '<div class="ttl"><h1 class="rf-h1">' + (mineOnly ? 'ภาพรวมของฉัน' : 'ภาพรวมทีม') + '</h1><div class="rf-sub" style="margin-top:0"><span class="full">วันนี้ · ' + DOWFULL[td.getDay()] + ' ' + fmtYmd(todayIso()) + '</span><span class="short">' + DOWFULL[td.getDay()] + ' ' + fmtShort(todayIso()) + '</span> <span style="opacity:.65">· v' + CFG.version + '</span></div></div>' +
    '<div class="ctl">' + scopeTog +
    (S.me ? '<button class="rf-perfbtn" onclick="RF.openPop(\'myperf\')" title="ผลงานของ' + esc(dispName(S.me)) + '">' + avUserHtml(S.me, 30) +
      '<span class="full">ผลงานของ' + esc(dispName(S.me)) + '</span><span class="short">ผลงานของฉัน</span></button>' : '') +
    '</div></div>' + upNextHtml();

  const revs = sortL(act.filter(d => d.status === 'review'));
  if (S.me && S.me.role >= 5 && revs.length) {
    h += '<button class="rf-revbanner" onclick="RF.openPop(\'review\',' + dashScopeArg() + ')">🔍<div style="flex:1">มีงานรอตรวจ ' + revs.length + ' งาน — แตะเพื่อตรวจ</div>' + IC.chev + '</button>';
  }
  const openN = act.filter(d => d.status !== 'done').length;   // ยังไม่เสร็จ = todo+doing+review (ไม่รวมเสร็จ/ยกเลิก)
  h += '<div class="rf-stats">' +
    '<button class="rf-stat" onclick="RF.openPop(\'open\',' + dashScopeArg() + ')"><div class="l">ยังไม่เสร็จ</div><div class="v" style="color:var(--amber)">' + openN + '</div><div class="s">แตะดูทั้งหมด · จาก ' + act.length + ' งาน</div></button>' +
    '<button class="rf-stat" onclick="RF.openPop(\'status:doing\',' + dashScopeArg() + ')"><div class="l">กำลังทำ</div><div class="v" style="color:var(--blue)">' + act.filter(d => d.status === 'doing').length + '</div><div class="s">กำลังดำเนินการ</div></button>' +
    '<button class="rf-stat" onclick="RF.openPop(\'done7\',' + dashScopeArg() + ')"><div class="l">เสร็จแล้ว</div><div class="v" style="color:var(--green)">' + done7 + '</div><div class="s">ใน 7 วันล่าสุด</div></button>' +
    '<button class="rf-stat" onclick="RF.openPop(\'overdue\',' + dashScopeArg() + ')"><div class="l">เลยกำหนด</div><div class="v" style="color:var(--red)">' + overdue.length + '</div><div class="s" style="color:var(--red)">' + (overdue.length ? 'ต้องติดตามด่วน' : 'ไม่มี — เยี่ยม!') + '</div></button></div>';

  // 2 การ์ดสรุป (คลิกได้) — ย้ายขึ้นมาต่อจาก 4 กล่องสรุปทันที
  h += '<div class="rf-dashgrid">' + donutCardHtml(act) + dueBarsCardHtml(act) + '</div>';
  h += '<div class="rf-dashgrid"><div class="rf-dashcol">' + (mineOnly ? '' : wlCardHtml(act)) + feedCardHtml() + '</div><div class="rf-dashcol">' + upCardHtml(act) + '</div></div></div>';
  return h;
}

function wlCardHtml(dec){
  const tu = teamUsers();
  const wl0 = tu.map(u => {
    const mine = dec.filter(d => d.u && d.u.email === u.email && d.status !== 'done' && d.status !== 'cancelled');
    return { u, act: mine.length, od: mine.filter(d => d.urg === 0).length };
  });
  const mx = Math.max(1, ...wl0.map(w => w.act), 0);
  const byDept = {};
  wl0.forEach(w => { (byDept[w.u.dept] = byDept[w.u.dept] || []).push(w); });
  const depts = Object.keys(byDept);
  const gmax = Math.max(1, ...depts.map(k => byDept[k].reduce((a, w) => a + w.act, 0)), 0);
  let rows = '';
  depts.forEach(dept => {
    const g = byDept[dept];
    const act = g.reduce((a, w) => a + w.act, 0), od = g.reduce((a, w) => a + w.od, 0);
    const open = !!S.wlOpen[dept];
    rows += '<div class="rf-wlgroup"><button class="rf-wlhead" onclick="RF.toggleWl(\'' + jsq(dept) + '\')">' +
      '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="transform:rotate(' + (open ? 90 : 0) + 'deg)"><path d="m9 5 7 7-7 7"/></svg>' +
      '<div style="flex:1;min-width:0"><div style="display:flex;align-items:baseline;gap:8px;margin-bottom:5px;flex-wrap:wrap"><div style="font-size:14px;font-weight:700">' + esc(dept) + '</div>' +
      '<div style="font-size:13px;color:var(--muted)">' + g.length + ' คน · ' + act + ' งานค้าง</div>' +
      (od > 0 ? '<div style="font-size:13px;font-weight:600;color:var(--red)">เลยกำหนด ' + od + '</div>' : '') + '</div>' +
      '<div class="rf-bar"><div style="width:' + Math.round(act / gmax * 100) + '%;background:var(--accent)"></div><div style="width:' + Math.round(od / gmax * 100) + '%;background:var(--red)"></div></div></div></button>';
    if (open) {
      rows += '<div style="display:flex;flex-direction:column;gap:2px;padding:2px 8px 8px 26px;animation:fadeUp .18s ease-out">';
      g.forEach(w => {
        rows += '<button class="rf-wlrow" onclick="RF.openPerson(\'' + jsq(w.u.email) + '\')">' + avUserHtml(w.u, 28) +
          '<div style="flex:1;min-width:0"><div style="display:flex;align-items:baseline;gap:8px;margin-bottom:5px"><div style="font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(dispName(w.u)) + '</div>' +
          '<div style="font-size:13px;color:var(--muted)">' + w.act + ' งานค้าง</div>' +
          (w.od > 0 ? '<div style="font-size:13px;font-weight:600;color:var(--red)">เลยกำหนด ' + w.od + '</div>' : '') + '</div>' +
          '<div class="rf-bar" style="height:7px"><div style="width:' + Math.round(w.act / mx * 100) + '%;background:var(--accent)"></div><div style="width:' + Math.round(w.od / mx * 100) + '%;background:var(--red)"></div></div></div></button>';
      });
      rows += '</div>';
    }
    rows += '</div>';
  });
  if (!depts.length) rows = '<div class="rf-empty">ยังไม่มีงานที่มอบหมาย</div>';
  return '<div class="rf-card"><div class="rf-card-t">ภาระงานรายแผนก</div><div style="display:flex;flex-direction:column;gap:8px">' + rows + '</div></div>';
}

function feedList(){

  return S.comments.filter(c => c.type !== 'system' && S.tasks.some(x => x.id === c.taskId))
