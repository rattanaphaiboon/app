/* ── v2.88: วันที่ปิดงานจริง ──
   เดิมกราฟใช้ Updated At = "วันแก้ล่าสุด" ซึ่งขยับทุกครั้งที่แตะงาน (คอมเม้น · ติ๊กเช็คลิสต์ · แก้หัวข้อ)
   งานที่ปิดไปตั้งแต่เดือนก่อน พอมีคนคอมเม้นวันนี้ ก็เด้งมาโผล่เป็น "เสร็จสัปดาห์นี้" → ตัวเลขเชื่อไม่ได้
   ชีทไม่มีคอลัมน์วันปิดงาน แต่ทุกครั้งที่เปลี่ยนสถานะ หลังบ้านเขียนบันทึกระบบไว้ให้แล้ว
   ("เปลี่ยนสถานะ: กำลังทำ → เสร็จแล้ว") — อ่านเวลาจากบันทึกนั้นได้เลย ไม่ต้องแก้หลังบ้าน */
const DONE_RE = /เปลี่ยนสถานะ:[^·]*→\s*เสร็จแล้ว/;
let _doneDateCache = null;
function doneDateMap(){
  if (_doneDateCache) return _doneDateCache;
  const m = {};
  (S.comments || []).forEach(function(c){
    if (c.type !== 'system' || !DONE_RE.test(String(c.text || ''))) return;
    const iso = tsDateIso(c.createdAt);
    if (!iso) return;
    // ปิด-เปิด-ปิดใหม่ได้ → เอาครั้งล่าสุดเสมอ
    if (!m[c.taskId] || String(c.createdAt) > String(m[c.taskId].ts)) m[c.taskId] = { d: iso, ts: c.createdAt };
  });
  _doneDateCache = m;
  return m;
}
// งานเก่าที่ปิดไปก่อนระบบเก็บบันทึก → ถอยไปใช้ Updated At เหมือนเดิม (ดีกว่าไม่นับเลย)
function doneDateIso(t){
  // v4.2: ใช้คอลัมน์ Done At ก่อน — เดิมงมหาจาก system comment ด้วย regex
  // พอคอมเม้นย้ายไปคลังเก็บ วิธีเดิมหาไม่เจอ · งานเก่าที่ยังไม่มีค่า ยังถอยไปใช้วิธีเดิมได้
  if (t && t.doneAt) { const d = tsDateIso(t.doneAt); if (d) return d; }
  const hit = doneDateMap()[t.id];
  return hit ? hit.d : tsDateIso(t.updatedAt);
}
// เทียบวันปิดจริงกับกำหนดส่ง — null = งานไม่มีกำหนดส่ง (ไม่เอามานับตรงเวลา/สาย)
function doneOnTime(t){
  const due = String(t.dueDate || '').slice(0, 10);
  if (!due) return null;
  const di = doneDateIso(t);
  if (!di) return null;
  return di <= due;
}

/* แถบ "ปิดงานตรงเวลากี่ %" — ใช้บนหน้าภาพรวม (ทั้งของฉันและทั้งทีม)
   email ว่าง = ทั้งทีม · days = ย้อนหลังกี่วัน (นับจากวันปิดจริง ไม่ใช่วันแก้ล่าสุด) */
function onTimeStats(email, days){
  const out = { ok: 0, late: 0, noDue: 0 };
  S.tasks.forEach(function(t){
    if (stOf(t) !== 'done') return;
    if (email) { const u = taskUser(t); if (!u || u.email !== email) return; }
    const di = doneDateIso(t);
    if (!di || diffDays(di) < -days) return;      // นับเฉพาะช่วงที่กำหนด
    const ot = doneOnTime(t);
    if (ot === null) out.noDue++; else if (ot) out.ok++; else out.late++;
  });
  return out;
}
function onTimeBarHtml(email, days){
  const st = onTimeStats(email, days);
  const rated = st.ok + st.late;
  if (!rated && !st.noDue) return '';            // ยังไม่มีงานปิดในช่วงนี้ → ไม่ต้องโชว์แถบเปล่า
  const pct = rated ? Math.round(st.ok / rated * 100) : 0;
  const col = !rated ? 'var(--muted)' : pct >= 80 ? 'var(--green)' : pct >= 50 ? 'var(--amber)' : 'var(--red)';
  return '<div class="rf-otcard">' +
    '<div class="hd"><span class="ttl">ปิดงานตรงเวลา</span><span class="sub">' + days + ' วันล่าสุด</span>' +
    (rated ? '<span class="big" style="color:' + col + '">' + pct + '%</span>' : '') + '</div>' +
    (rated ? '<div class="rf-bar" style="height:7px"><div style="width:' + pct + '%;background:' + col + '"></div></div>' : '') +
    '<div class="rf-otrow" style="margin-top:7px">' +
    otChip('ok', 'ตรงเวลา', st.ok, email, days) +
    otChip('late', 'เกินกำหนด', st.late, email, days) +
    otChip('nodue', 'ไม่ได้ตั้งกำหนด', st.noDue, email, days) +
    '</div></div>';
}
// v3.8: กดชิปแล้วเปิดลิสต์งานจริงในกองนั้น — เดิมเห็นแต่ตัวเลข ไม่รู้ว่างานไหนสาย
function otChip(kind, lb, n, email, days){
  if (!n) return '';
  return '<button class="' + (kind === 'nodue' ? 'none' : kind) + '" title="ดูว่างานไหนบ้าง" ' +
    'onclick="RF.openPop(\'ot:' + kind + ':' + days + ':' + jsq(email || '') + '\')">' + lb + ' ' + n + ' ›</button>';
}
// งานที่ปิดแล้วในช่วงที่กำหนด แยกตามผลว่าทันกำหนดไหม (เกณฑ์เดียวกับ onTimeStats เป๊ะ)
function onTimeList(email, days, kind){
  return S.tasks.filter(function(t){
    if (stOf(t) !== 'done') return false;
    if (email) { const u = taskUser(t); if (!u || u.email !== email) return false; }
    const di = doneDateIso(t);
    if (!di || diffDays(di) < -days) return false;
    const ot = doneOnTime(t);
    return kind === 'nodue' ? ot === null : kind === 'ok' ? ot === true : ot === false;
  });
}

// ผลงานของ user คนหนึ่ง — งานที่มอบหมายให้เขา ทั้งเสร็จ+ยังไม่เสร็จ + กราฟงานเสร็จรายสัปดาห์ (ใช้ทั้งปุ่ม "ผลงาน" และหน้าทีม-รายคน)
function perfBody(user){
  if (!user) return '';
  const mineTasks = S.tasks.filter(t => { const u = taskUser(t); return u && u.email === user.email; });
  const dec = mineTasks.map(decorate);
  const done = sortL(dec.filter(d => d.status === 'done'));
  const active = sortL(dec.filter(d => d.status !== 'done' && d.status !== 'cancelled'));
  const cancelled = sortL(dec.filter(d => d.status === 'cancelled'));
  const overdue = active.filter(d => d.urg === 0).length;
  const total = done.length + active.length;
  const pct = total ? Math.round(done.length / total * 100) : 0;

  /* v2.88: นับตาม "วันที่ปิดงานจริง" (doneDateIso) ไม่ใช่วันแก้ล่าสุด + แยกตรงเวลา/เกินกำหนด */
  const doneTasks = mineTasks.filter(t => stOf(t) === 'done');
  const td = pd(todayIso());
  const doneThisMonth = doneTasks.filter(t => { const di = doneDateIso(t); if (!di) return false; const d = pd(di); return d.getMonth() === td.getMonth() && d.getFullYear() === td.getFullYear(); }).length;
  const thisWS = weekStartOf(todayIso());
  const weeks = [];
  for (let i = 5; i >= 0; i--) { const ws = addDays(thisWS, -i * 7); weeks.push({ ws, dd: pd(ws), c: 0, ok: 0, late: 0 }); }
  let okN = 0, lateN = 0, noDueN = 0;
  doneTasks.forEach(t => {
    const di = doneDateIso(t); if (!di) return;
    const ot = doneOnTime(t);
    if (ot === null) noDueN++; else if (ot) okN++; else lateN++;
    const wk = weeks.find(w => w.ws === weekStartOf(di));
    if (wk) { wk.c++; if (ot === false) wk.late++; else wk.ok++; }   // ไม่มีกำหนดส่ง นับรวมกับตรงเวลา (ไม่มีอะไรให้เกิน)
  });
  const wmax = Math.max(1, ...weeks.map(w => w.c));
  let bars = '';
  weeks.forEach((w, i) => {
    const cur = i === 5;
    const h = w.c > 0 ? Math.max(8, Math.round(w.c / wmax * 56)) : 5;
    const lateH = w.c > 0 ? Math.round(h * (w.late / w.c)) : 0;      // แท่งเดียวแบ่ง 2 สี: ท่อนแดง = ที่เกินกำหนด
    const okH = h - lateH;
    const tip = 'สัปดาห์ ' + fmtYmd(w.ws) + ' · เสร็จ ' + w.c + ' งาน' + (w.late ? ' (เกินกำหนด ' + w.late + ')' : '');
    bars += '<div class="rf-perfbar" title="' + esc(tip) + '"><div style="font-size:11.5px;font-weight:700;color:var(--muted);height:15px;line-height:15px">' + (w.c || '') + '</div>' +
      '<div class="bar" style="height:' + h + 'px;background:' + (w.c > 0 ? 'transparent' : 'var(--surface)') + ';display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden">' +
      (lateH ? '<div style="height:' + lateH + 'px;background:var(--red)"></div>' : '') +
      (okH > 0 && w.c > 0 ? '<div style="height:' + okH + 'px;background:' + (cur ? 'var(--green)' : 'var(--accent)') + '"></div>' : '') +
      '</div>' +
      '<div style="font-size:11px;color:' + (cur ? 'var(--accent-ink)' : 'var(--muted)') + ';white-space:nowrap">' + (w.dd.getMonth() + 1) + '/' + w.dd.getDate() + '</div></div>';
  });
  // สรุปตรงเวลา/เกินกำหนด — ของงานที่ปิดแล้วทั้งหมดของคนนี้
  const rated = okN + lateN;
  const otPct = rated ? Math.round(okN / rated * 100) : 0;
  const onTimeLine = rated
    ? '<div class="rf-otrow"><span class="ok">ตรงเวลา ' + okN + '</span>' +
      (lateN ? '<span class="late">เกินกำหนด ' + lateN + '</span>' : '') +
      (noDueN ? '<span class="none">ไม่มีกำหนด ' + noDueN + '</span>' : '') +
      '<span class="pct">' + otPct + '% ตรงเวลา</span></div>'
    : (noDueN ? '<div class="rf-otrow"><span class="none">งานที่ปิดไป ' + noDueN + ' งาน ไม่ได้ตั้งกำหนดส่งไว้</span></div>' : '');

  const stat = (l, v, c) => '<div class="rf-perfstat"><div class="v" style="color:' + c + '">' + v + '</div><div class="l">' + l + '</div></div>';
  let h = '<div style="display:flex;align-items:center;gap:12px;padding:2px 4px 14px">' + avUserHtml(user, 48) +
    '<div style="min-width:0"><div style="font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(dispName(user)) + '</div>' +
    '<div style="font-size:13px;color:var(--muted)">' + esc(bossLabel(user, true) || user.dept) + '</div></div></div>';
  h += '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">' +
    stat('เสร็จแล้ว', done.length, 'var(--green)') + stat('ยังไม่เสร็จ', active.length, 'var(--blue)') +
    stat('เลยกำหนด', overdue, overdue ? 'var(--red)' : 'var(--muted)') + '</div>';
  h += '<div style="margin:12px 4px 4px"><div style="display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-bottom:5px"><span>ความคืบหน้ารวม (' + done.length + '/' + total + ')</span><span style="font-weight:700;color:var(--text)">' + pct + '%</span></div>' +
    '<div class="rf-bar" style="height:8px"><div style="width:' + pct + '%;background:var(--green)"></div></div></div>';
  h += impactSumHtml(doneTasks);   // ผลลัพธ์ที่วัดได้ — วัดคุณค่างาน ไม่ใช่แค่นับจำนวน
  h += '<div style="background:var(--surface2);border-radius:14px;padding:12px 14px;margin-top:12px">' +
    '<div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:2px"><div style="font-size:13.5px;font-weight:700">งานเสร็จรายสัปดาห์</div>' +
    '<div style="font-size:12.5px;color:var(--muted)">เดือนนี้ <span style="font-weight:700;color:var(--green)">' + doneThisMonth + '</span> งาน</div></div>' +
    onTimeLine +
    '<div class="rf-perfbars">' + bars + '</div></div>';
  h += '<div class="rf-perfsec">🔸 ยังไม่เสร็จ (' + active.length + ')</div>';
  if (active.length) h += '<div class="rf-list">' + active.map(d => rowHtml(d, { badge: true })).join('') + '</div>';
  else h += '<div class="rf-empty" style="padding:14px">ไม่มีงานค้าง 🎉</div>';
  h += '<div class="rf-perfsec">✅ เสร็จแล้ว (' + done.length + ')</div>';
  if (done.length) h += '<div class="rf-list">' + done.map(d => rowHtml(d, {})).join('') + '</div>';
  else h += '<div class="rf-empty" style="padding:14px">ยังไม่มีงานที่ทำเสร็จ</div>';
  if (cancelled.length) h += '<div class="rf-perfsec">🚫 ยกเลิก (' + cancelled.length + ')</div><div class="rf-list">' + cancelled.map(d => rowHtml(d, {})).join('') + '</div>';
  return h;
}
/* ลิสต์ที่ป๊อปอัปใช้ — ถ้าเปิดจากแดชบอร์ดโหมด "ของฉัน" ต้องกรองเหมือนกัน
   (เดิมตัวเลขบนแดชบอร์ดกรองของฉัน แต่ลิสต์ที่กดเข้าไปโชว์ทั้งทีม → เลขไม่ตรงกัน) */
// แดชบอร์ดกำลังกรอง "ของฉัน" อยู่ไหม — ส่งต่อให้ป๊อปอัปที่กดจากตัวเลขบนแดชบอร์ด
function dashScopeArg(){ return (S.dashMine !== false && S.me) ? 1 : 0; }
function popDec(){
  const all = allDec();
  if (S.popMine && S.me) return all.filter(d => d.mine);
  return all;
}
function popSuffix(){ return S.popMine ? ' · ของฉัน' : ''; }
/* แถบหัวป๊อป "เสร็จแล้ว/ยกเลิก" — ค้นหา + กรองคน (หลายคน) + ปุ่มลบรวม(เฉพาะยกเลิก)
   ติดบนสุด full-bleed (margin ลบ = คลุมพื้นที่ padding ของ popScroll) กันแถวเลื่อนโผล่ทับ */
// กรองลิสต์ปิดแล้ว (เสร็จ/ยกเลิก) ตามตัวกรองปัจจุบัน (คนหลายคน + คำค้น) — ใช้ร่วมทั้งแสดงผลและเลือกทั้งหมด
function closedFiltered(full){
  let list = full;
  if (S.popPerson) list = list.filter(function(d){ return d.u && String(d.u.email).toLowerCase() === String(S.popPerson).toLowerCase(); });
  const selP = S.popPeople || {};
  if (Object.keys(selP).some(function(k){ return selP[k]; })) list = list.filter(function(d){ return d.u && selP[String(d.u.email).toLowerCase()]; });
  const pq = String(S.popQ || '').trim().toLowerCase();
  if (pq) list = list.filter(function(d){ return d.search.includes(pq); });
  return list;
}
function closedHdrHtml(isCan, full){
  // v2.98: กำลังดูของคนใดคนหนึ่ง → โชว์ปุ่มย้อนกลับแทนชิปคน (ไม่ต้องมี 2 ที่ให้สับสน)
  if (!isCan && S.popPerson) {

    return '<div class="rf-closehdr">' +
      '<button class="rf-backbtn" style="padding:0 0 8px" onclick="RF.popPersonBack()">‹ รายชื่อทั้งหมด</button>' +

      '<div class="nm">' + esc(u ? dispName(u) : String(S.popPerson)) + '</div>' +

      (S.popQ ? '<button class="rf-qx" onclick="RF.popSearchClear()">' + IC.xs + '</button>' : '') + '</div></div>';
  }
  // v2.98: หน้ารายชื่อคน มีการ์ดคนอยู่แล้ว ไม่ต้องมีชิปกรองคนซ้ำอีกแถว (แถวชิปยาวเกินขอบจอด้วย)
  const peopleView = !isCan && !S.popPerson && !String(S.popQ || '').trim();
  const people = {};
  full.forEach(function(d){ if (d.u && d.u.email) people[String(d.u.email).toLowerCase()] = d.u; });
  const us = peopleView ? [] : rankUsers(Object.keys(people).map(function(e){ return people[e]; }));
  const selP = S.popPeople || {};

  let chips = '';
  if (us.length > 1) {
    chips = '<div class="rf-pfchips"><button class="rf-pfchip' + (anyP ? '' : ' on') + '" onclick="RF.popPeopleAll()">ทุกคน</button>';
    us.forEach(function(u){ const e = String(u.email).toLowerCase(); chips += '<button class="rf-pfchip' + (selP[e] ? ' on' : '') + '" onclick="RF.popTogglePerson(\'' + jsq(e) + '\')">' + avUserHtml(u, 18) + '<span>' + esc(dispName(u)) + '</span></button>'; });
    chips += '</div>';
  }
  let bar = '';
  if (isCan) {
    const del = curCancelDel(), selN = selCancelVisible().length;   // เฉพาะที่เห็นตอนนี้ (ผ่านตัวกรอง)
    const allSel = del.length && selN >= del.length;
    if (del.length) bar = '<div class="rf-canbar">' +

      '<div style="flex:1"></div>' +
      '<button class="rf-candel"' + (selN ? '' : ' disabled') + ' onclick="RF.bulkDeleteCancel()">🗑 ลบที่เลือก' + (selN ? ' (' + selN + ')' : '') + '</button></div>';
  }
  return '<div class="rf-closehdr">' +
    '<div style="position:relative"><input id="popQ" class="rf-finput" style="height:40px;padding-right:38px" value="' + esc(S.popQ || '') + '" oninput="RF.popSearch(this.value)" placeholder="ค้นหาในรายการนี้ · ชื่องาน · คน…">' +
    (S.popQ ? '<button class="rf-qx" onclick="RF.popSearchClear()">' + IC.xs + '</button>' : '') + '</div>' +

/* ตัวห่อป๊อป — แยกออกมาเพื่อให้ popHtml คืนค่ากลางทางได้ (ตอนโชว์รายชื่อคน) */

/* v2.98: รายชื่อคน + จำนวนงานที่ปิดไป — ตัวเองขึ้นบนสุด ตามด้วยคนในทีมเรา แล้วค่อยคนอื่น
   (ในแต่ละกลุ่มเรียงจำนวนมาก→น้อย ตามกฎเรียง "ยอดรวมของกลุ่ม") */
function closedPeopleHtml(full){
  const by = {};
  full.forEach(function(d){
    const e = d.u && d.u.email ? String(d.u.email).toLowerCase() : '';
    if (!e) return;
    if (!by[e]) by[e] = { u: d.u, n: 0, last: '' };
    by[e].n++;
    const t = S.tasks.find(function(x){ return x.id === d.id; });
    const ts = t ? String(t.updatedAt || '') : '';
    if (ts > by[e].last) by[e].last = ts;
  });

/* -- Recurring (งานประจำ) -- ทุกคนตั้งของตัวเองได้ · หัวหน้าตั้งให้ทีมได้ -- */
/* สถิติของสูตร = นับจาก "ใบเช็ควันที่กำลังดูอยู่" (โมเดล B)
   ⚠️ ของเดิมนับจาก S.tasks ผ่าน recurId — ใช้ไม่ได้แล้วตั้งแต่เลิกให้ recurJob สร้างงานจริง (ตัวเลขจะค้างตลอด) */
function recurDayStat(rid){
  let people = 0, done = 0;
  (S.rt.logs || []).forEach(function(l){
    const mine = parseCl({ checklist: l.items }).filter(function(i){ return String(i.rid || '') === String(rid); });
    if (!mine.length) return;
    people++;
    if (mine.every(function(i){ return i.d; })) done++;
  });
  return { people: people, done: done };
}
const RDOW = ['อา','จ','อ','พ','พฤ','ศ','ส'];
function isLastDom(s){ const v = String(s == null ? '' : s).trim().toLowerCase(); return v === 'last' || v === 'สิ้นเดือน'; }
function recurFreqLabel(r){
  const f = String(r.freq || 'daily').toLowerCase();
  if (f === 'weekly') {
    const ds = String(r.days || '').split(',').map(function(d){ return String(d).trim(); }).filter(Boolean);   // ไม่ filter → '' กลายเป็นวันอาทิตย์
    return ds.length ? 'ทุก ' + ds.map(function(d){ return RDOW[Number(d)] || d; }).join(' ') : 'ทุกสัปดาห์ · -';
  }
  if (f === 'monthly') {
    const ps = String(r.days || '').split(',').map(function(d){
      const s = String(d).trim();
      return !s ? '' : isLastDom(s) ? 'สิ้นเดือน' : 'วันที่ ' + s;
    }).filter(Boolean);
    return 'ทุกเดือน · ' + (ps.join(' · ') || '-');
  }
  return 'ทุกวัน';
}
/* ตั้งงานประจำให้ใครได้บ้าง — กฎเดียวกับหลังบ้าน recurCanAssign_

    if (S.me.role < 5) return false;
    return userGroup(u) <= 2;
  });
}

/* ── toast ── */
let toastTimer = null;
function toast(msg, undoFn){
  let el = document.getElementById('toastBox');
  if (el) el.remove();
  el = document.createElement('div');
  el.id = 'toastBox';
  el.className = 'rf-toast' + (isMob() ? ' mob' : '') + (undoFn ? ' undo' : '');
  if (undoFn) {
    el.innerHTML = '<span class="msg">' + esc(msg) + '</span>' +
      '<button onclick="RF.undoLast()">เลิกทำ<span class="fill"></span></button>';
  } else el.textContent = msg;
  document.body.appendChild(el);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { const e2 = document.getElementById('toastBox'); if (e2) e2.remove(); _undo = null; }, undoFn ? UNDO_MS : 2600);
}
/* ── v2.86: เลิกทำ (undo) ภายใน 10 วิ ──
   เผลอกดโดนแล้วของหาย เป็นเรื่องที่เจอจริงบนมือถือ (นิ้วไปโดนตอนเลื่อนจอ)
   ทุกปุ่มที่ลบ/เปลี่ยนข้อมูล เรียกผ่าน 2 ทางนี้เท่านั้น: saveCl(t, items, undoMsg) และ applyStatus(...)
   → ได้ undo ครบทุกจุดโดยไม่ต้องไล่แก้ทีละปุ่ม
   หลักการ: ส่งขึ้นเซิร์ฟเวอร์ทันทีเหมือนเดิม (คนอื่นเห็นทันที) · กด "เลิกทำ" = ส่งค่าเดิมกลับไปทับ
   ไม่ใช้วิธีหน่วงส่ง 10 วิ เพราะถ้าผู้ใช้ปิดแอปก่อนครบเวลา งานจะหายไปเฉยๆ */
const UNDO_MS = 10000;
let _undo = null;
function undoable(msg, undoFn){ _undo = undoFn; toast(msg, undoFn); }
RF.wqFlush = () => { wqFlush(); };   // ปุ่ม "ลองเดี๋ยวนี้" ในแถบของค้าง
RF.undoLast = () => {
  const fn = _undo;
  _undo = null;
  clearTimeout(toastTimer);
  const el = document.getElementById('toastBox'); if (el) el.remove();
  if (typeof fn === 'function') fn();
};

/* ── actions ── */
/* v2.87: จำตำแหน่งที่เลื่อนค้างไว้ของแต่ละหน้า — เดิมสลับหน้าแล้วกลับมา จอเด้งขึ้นบนสุดทุกครั้ง
   เลื่อนดูงานทีมยาวๆ แวะดูปฏิทินแล้วกลับมา ต้องไล่เลื่อนใหม่หมด
   กติกา: กลับมาหน้าที่เคยอยู่ = คืนตำแหน่งเดิม · กดแท็บที่อยู่ปัจจุบันซ้ำ = ขึ้นบนสุด (เหมือนแอปทั่วไป) */
/* ══ v3.3: จำตำแหน่งที่เลื่อนค้างไว้ — ข้ามการปิดแอปด้วย ══
   ของเดิมเก็บตอนกด RF.go เท่านั้น และคีย์แยกแค่แท็บของหน้า "ของฉัน"
   → เข้าแผนรายตัว/ดูรายคนแล้วกดกลับ จอเด้งไปคนละที่ เพราะทั้งหน้าใช้คีย์เดียวกัน
     และเปลี่ยนหน้าด้วยวิธีอื่น (กดการ์ดแผน · เลือกคน · สลับชิป) ไม่ได้เก็บอะไรไว้เลย
   ตอนนี้: เก็บระหว่างเลื่อนจริง (ไม่ต้องรอออกจากหน้า) · คีย์แยกถึงระดับหน้าย่อย · เก็บลงเครื่อง */
const SCROLL_KEY = 'rf_scroll';
let _scrollMemo = {};
try { _scrollMemo = JSON.parse(localStorage.getItem(SCROLL_KEY) || '{}') || {}; } catch(e){ _scrollMemo = {}; }
// คีย์ต้องแยกถึง "หน้าย่อย" ที่ผู้ใช้เห็นจริง ไม่งั้นกลับมาแล้วจอไปโผล่ตำแหน่งของอีกหน้า
function scrollKey(v){
  const view = v || S.view;
  if (view === 'mine') return 'mine:' + (S.mwTab || '');
  if (view === 'plans') return 'plans:' + (S.planSel || '');
  if (view === 'team') return 'team:' + (S.teamMode || 'people') + ':' + (S.deptSel || '') + ':' + (S.teamSel || '');
  if (view === 'board') return 'board:' + (S.boardCol || '');
  return String(view) + ':';
}
let _scrollSaveT = null;
function saveScrollMemo(){
  try {
    const keys = Object.keys(_scrollMemo);
    if (keys.length > 40) keys.slice(0, keys.length - 40).forEach(function(k){ delete _scrollMemo[k]; });   // กันบวม
    localStorage.setItem(SCROLL_KEY, JSON.stringify(_scrollMemo));
  } catch(e){}
}
function rememberScroll(){
  if (S.loading || anyModalOpen()) return;          // ตอนมี sheet เปิดอยู่ จอหลักไม่ได้เลื่อนจริง
  _scrollMemo[scrollKey()] = Math.round(window.scrollY);
  clearTimeout(_scrollSaveT);
  _scrollSaveT = setTimeout(saveScrollMemo, 400);   // เขียนลงเครื่องแบบหน่วง ไม่ให้เขียนรัวตอนเลื่อน
}
window.addEventListener('scroll', function(){
  clearTimeout(_scrollSaveT);
  _scrollSaveT = setTimeout(rememberScroll, 180);
}, { passive: true });
window.addEventListener('pagehide', function(){ rememberScroll(); saveScrollMemo(); });
function goScroll(y){
  window.scrollTo(0, y);
  // เนื้อหาบางหน้าสูงไม่พอทันทีหลัง render (รูป/ฟอนต์ยังโหลด) — ย้ำอีก 2 จังหวะ
  if (y > 0) {
    requestAnimationFrame(function(){ window.scrollTo(0, y); });
    setTimeout(function(){ if (Math.abs(window.scrollY - y) > 4) window.scrollTo(0, y); }, 120);
  }
}
// กลับเข้าหน้าไหน ให้ไปตำแหน่งที่ค้างไว้ของหน้านั้น (ไม่มีก็บนสุด)
function restoreScroll(){ goScroll(_scrollMemo[scrollKey()] || 0); }
RF.go = v => {
  rememberScroll();                                 // เก็บของหน้าเดิมก่อนออก
  if (isWorkView(v)) S.workLast = v;                // จำแท็บล่าสุดในกลุ่ม "งาน"
  saveLastView(v);                                  // v3.2: เปิดแอปครั้งหน้ามาที่หน้าเดิม
  const same = S.view === v;
  S.view = v; S.q = '';
  render();
  goScroll(same ? 0 : (_scrollMemo[scrollKey(v)] || 0));   // กดปุ่มเดิมซ้ำ = กลับบนสุด
};

/* ── Web Push (FCM) — โครงรอ config · ไม่โหลด SDK/ไม่ทำงาน/ปุ่มไม่โผล่ จนกว่า CFG.firebase.apiKey + CFG.vapidKey จะถูกใส่ ── */
/* ══════════════════════════════════════════════════════════════════════════
   GOOGLE CALENDAR — งานของเรา → ปฏิทินส่วนตัวของเราเอง (แบบ ค)
   ──────────────────────────────────────────────────────────────────────────
   · เขียนเป็น "กิจกรรมทั้งวัน" ในวันครบกำหนด — ไม่ต้องกรอกเวลาเพิ่ม
   · รหัสกิจกรรมคำนวณจาก taskId ตรงๆ (calEventId) → ไม่ต้องเก็บ mapping ที่ไหนเลย
     เปลี่ยนเครื่อง/ล้างแคช ก็ยังอัปเดตกิจกรรมเดิม ไม่สร้างซ้ำ
   · อ่านนัดของเราเองกลับมาโชว์ในหน้าปฏิทินด้วย (สิทธิ์เดียวกัน ไม่ต้องขอเพิ่ม)
   ⚠️ ต้องเปิด "Google Calendar API" ใน Google Cloud project ก่อน แล้วตั้ง CFG.calendar.on = true
   ══════════════════════════════════════════════════════════════════════════ */
const CAL_API = 'https://www.googleapis.com/calendar/v3/calendars/primary/events';
const CAL_LEADS = [{ v:0, l:'ไม่เตือน' }, { v:1, l:'1 วันก่อน 09:00' }, { v:2, l:'2 วันก่อน 09:00' }, { v:3, l:'3 วันก่อน 09:00' }];
function calConfigured(){ return !!(CFG.calendar && CFG.calendar.on); }
function calOn(){ try { return calConfigured() && localStorage.getItem('rf_cal_on') === '1'; } catch(e){ return false; } }
function calLead(){ try { const n = parseInt(localStorage.getItem('rf_cal_lead'), 10); return isNaN(n) ? 1 : n; } catch(e){ return 1; } }
/* รหัสกิจกรรม Google รับแค่ a-v กับ 0-9 (⚠️ w x y z ใช้ไม่ได้ — คำว่า "rflow" จึงใช้เป็น prefix ไม่ได้)
   → prefix 'rflotask' + taskId ที่เข้ารหัสเป็น hex (0-9a-f อยู่ในช่วงพอดี) */
const CAL_PREFIX = 'rflotask';
function calEventId(taskId){
  let hex = '';
  const s = String(taskId || '');
  for (let i = 0; i < s.length; i++) hex += ('000' + s.charCodeAt(i).toString(16)).slice(-4);
  return CAL_PREFIX + hex;
}
let _calTok = '', _calExp = 0;
function calToken(interactive){
  if (_calTok && Date.now() < _calExp - 60000) return Promise.resolve(_calTok);
  return new Promise(function(res, rej){
    if (!(window.google && google.accounts && google.accounts.oauth2)) { rej(new Error('Google SDK ยังไม่พร้อม ลองใหม่อีกครั้ง')); return; }
    const tc = google.accounts.oauth2.initTokenClient({
      client_id: CFG.clientId,
      scope: CFG.calendar.scope,
      prompt: interactive ? 'consent' : '',
      callback: function(r){
        if (r && r.access_token) { _calTok = r.access_token; _calExp = Date.now() + ((r.expires_in || 3600) * 1000); res(_calTok); }
        else rej(new Error((r && r.error_description) || 'ขอสิทธิ์ปฏิทินไม่สำเร็จ'));
      },
      error_callback: function(e){ rej(new Error((e && e.message) || 'ปิดหน้าต่างขออนุญาตก่อนกดยอมรับ')); }
    });
    tc.requestAccessToken();
  });
}
function calFetch(url, opt){
  return calToken(false).then(function(tok){
    const o = Object.assign({ method: 'GET' }, opt || {});
    o.headers = Object.assign({ Authorization: 'Bearer ' + tok }, o.headers || {});
    if (o.body && typeof o.body !== 'string') { o.body = JSON.stringify(o.body); o.headers['Content-Type'] = 'application/json'; }
    return fetch(url, o).then(function(r){
      if (r.status === 204) return {};
      return r.json().catch(function(){ return {}; }).then(function(j){
        if (r.ok) return j;
        const msg = (j && j.error && j.error.message) || ('HTTP ' + r.status);
        const err = new Error(msg); err.status = r.status; throw err;
      });
    });
  });
}
// สีกิจกรรมตามสถานะ (colorId ของ Google Calendar)
function calColor(d){
  if (d.status === 'done') return '10';                 // เขียว
  if (d.urg === 0) return '11';                         // แดง — เลยกำหนด
  if (d.urg === 1) return '6';                          // ส้ม — ครบวันนี้/ใกล้
  if (d.status === 'doing' || d.status === 'review') return '9';   // น้ำเงิน
  return '8';                                           // เทา — รอทำ
}
function calBody(t){
  const d = decorate(t), cl = parseCl(t), st = stOf(t);
  const rep = userByEmail(t.reporterEmail) || userByName(t.reporterName);
  const emo = st === 'done' ? '✅' : (d.urg === 0 ? '🔴' : (d.urg === 1 ? '🟠' : (st === 'doing' || st === 'review' ? '🔵' : '⚪')));
  let desc = 'สถานะ: ' + d.statusLabel + '\n';
  if (rep) desc += 'สั่งโดย: ' + dispName(rep) + '\n';
  if (t.detail) desc += '\n' + String(t.detail).slice(0, 400) + '\n';
  if (cl.length) {
    desc += '\nเช็คลิสต์ ' + cl.filter(function(i){ return i.d; }).length + '/' + cl.length + ' ข้อ\n';
    cl.slice(0, 20).forEach(function(it, i){ desc += (it.d ? '✅' : '⬜') + ' ' + (i + 1) + '. ' + clStrip(it.t) + '\n'; });
    if (cl.length > 20) desc += '…และอีก ' + (cl.length - 20) + ' ข้อ\n';
  }
  desc += '\n— R-Flow';
  const lead = calLead();
  return {
    id: calEventId(t.id),
    summary: emo + ' ' + String(t.title || ''),
    description: desc,
    start: { date: t.dueDate },
    end: { date: addDays(t.dueDate, 1) },        // กิจกรรมทั้งวัน — วันจบต้อง +1 (Google นับแบบไม่รวมวันจบ)
    colorId: calColor(d),
    transparency: 'transparent',                 // ไม่ทำให้ปฏิทินขึ้นว่า "ไม่ว่าง"
    reminders: { useDefault: false, overrides: lead > 0 ? [{ method: 'popup', minutes: lead * 1440 - 540 }] : [] }
  };
}
function calUpsert(t){
  const body = calBody(t), id = body.id;
  return calFetch(CAL_API + '/' + id, { method: 'PUT', body: body })
    .catch(function(e){
      if (e.status === 404 || e.status === 410) return calFetch(CAL_API, { method: 'POST', body: body });   // ยังไม่มี → สร้างใหม่
      throw e;
    });
}
function calRemove(taskId){
  return calFetch(CAL_API + '/' + calEventId(taskId), { method: 'DELETE' })
    .catch(function(e){ if (e.status === 404 || e.status === 410) return {}; throw e; });   // ไม่มีอยู่แล้ว = ถือว่าสำเร็จ
}
// งานที่ควรอยู่ในปฏิทินของเรา = งานที่มอบให้เรา + มีวันครบกำหนด + ไม่ยกเลิก
function calMine(){
  if (!S.me) return { keep: [], drop: [] };
  const me = S.me.email, keep = [], drop = [];
  S.tasks.forEach(function(t){
    const u = taskUser(t);
    if (!u || u.email !== me) return;
    if (t.dueDate && stOf(t) !== 'cancelled') keep.push(t); else drop.push(t);
  });
  return { keep: keep, drop: drop };
}
// ซิงก์ทั้งก้อนอย่างมาก 10 นาที/ครั้ง — งานที่แก้รายตัวใช้ calSyncOne อยู่แล้ว ไม่ต้องรอ
function calSyncIfStale(){
  if (!calOn() || !S.me) return;
  const last = S.cal.lastSync ? Date.parse(S.cal.lastSync) : 0;
  if (Date.now() - last < 600000) return;
  calSyncAll(true);
}
function calSyncAll(silent){
  if (!calOn() || !S.me || S.cal.busy) return Promise.resolve();
  S.cal.busy = true; if (!silent) render();
  const m = calMine();
  const jobs = m.keep.map(function(t){ return function(){ return calUpsert(t); }; })
    .concat(m.drop.map(function(t){ return function(){ return calRemove(t.id); }; }));
  let i = 0, okN = 0, errMsg = '';
  const step = function(){
    if (i >= jobs.length) return Promise.resolve();
    return jobs[i++]().then(function(){ okN++; }).catch(function(e){ if (!errMsg) errMsg = e.message; }).then(step);
  };
  return step().then(function(){
    S.cal.busy = false; S.cal.lastSync = new Date().toISOString(); S.cal.err = errMsg;
    try { localStorage.setItem('rf_cal_sync', S.cal.lastSync); } catch(e){}
    render();
    if (!silent) toast(errMsg ? 'ลงปฏิทินไม่ครบ: ' + errMsg : 'ลงปฏิทินแล้ว ' + okN + ' รายการ ✓');
  }).catch(function(e){
    S.cal.busy = false; S.cal.err = e.message; render();
    if (!silent) toast('ลงปฏิทินไม่สำเร็จ: ' + e.message);
  });
}
// ซิงก์งานเดียว (หลังแก้/เปลี่ยนสถานะ) — เงียบ ไม่รบกวนผู้ใช้
function calSyncOne(taskId){
  if (!calOn() || !S.me) return;
  const t = S.tasks.find(function(x){ return x.id === taskId; });
  if (!t) { calRemove(taskId).catch(function(){}); return; }
  const u = taskUser(t);
  if (!u || u.email !== S.me.email || !t.dueDate || stOf(t) === 'cancelled') { calRemove(taskId).catch(function(){}); return; }
  calUpsert(t).catch(function(){});
}
/* อ่านนัดของเราเองมาโชว์ในหน้าปฏิทิน — ตัดกิจกรรมที่แอปสร้างเองออก (ไม่งั้นซ้ำกับงาน) */
function calLoadEvents(fromIso, toIso){
  if (!calOn()) return Promise.resolve([]);
  const q = '?timeMin=' + encodeURIComponent(fromIso + 'T00:00:00+07:00') +
    '&timeMax=' + encodeURIComponent(toIso + 'T23:59:59+07:00') +
    '&singleEvents=true&orderBy=startTime&maxResults=250';
  return calFetch(CAL_API + q).then(function(j){
    return (j.items || []).filter(function(e){ return String(e.id || '').indexOf(CAL_PREFIX) !== 0 && e.status !== 'cancelled'; })
      .map(function(e){
        const allDay = !!(e.start && e.start.date);
        const sIso = allDay ? e.start.date : String(e.start.dateTime || '').slice(0, 10);
        return { id: e.id, title: e.summary || '(ไม่มีชื่อ)', allDay: allDay, iso: sIso,
          time: allDay ? 'ทั้งวัน' : (tsTime(e.start.dateTime) + (e.end && e.end.dateTime ? '–' + tsTime(e.end.dateTime) : '')) };
      });
  }).catch(function(){ return []; });
}
function calRefreshEvents(){
  if (!calOn()) return;
  const from = addDays(todayIso(), -7), to = addDays(todayIso(), 45);
  calLoadEvents(from, to).then(function(evs){ S.cal.events = evs; render(); });
}
// นัดจากปฏิทินของวันที่เลือก (โชว์ใต้รายการงานในหน้าปฏิทิน)
function calDayEvHtml(iso){
  if (!calOn() || !iso) return '';

  if (!evs.length) return '';

    '<div style="font-size:12.5px;color:var(--muted);margin-bottom:8px">ดึงมาจาก Google Calendar — ดูได้อย่างเดียว</div>';
  evs.forEach(function(e){
    h += '<div class="rf-gcrow"><span class="dot"></span><span class="tm">' + esc(e.time) + '</span><span class="nm">' + esc(e.title) + '</span></div>';
  });
  return h + '</div>';
}
// แถวตั้งค่าใต้ปุ่ม — โผล่เฉพาะคนที่เปิดปฏิทินแล้ว
function calSetHtml(){

  return '<div class="rf-calset"><span>เตือนล่วงหน้า</span>' +
    '<select onchange="RF.calLead(this.value)">' +
    CAL_LEADS.map(function(o){ return '<option value="' + o.v + '"' + (o.v === lead ? ' selected' : '') + '>' + o.l + '</option>'; }).join('') +
    '</select><div style="flex:1"></div><button class="rf-callink" onclick="RF.calOff()">เลิกลง</button></div>' +
    (sync ? '<div style="font-size:12px;color:var(--muted);margin-top:2px">งานที่มอบให้คุณ' + sync + '</div>' : '');
}
function calBtnHtml(cls){
  if (!calConfigured()) return '';
  const ic = '<span style="font-size:16px;flex-shrink:0">📅</span>';
  if (S.cal.busy) return '<button class="' + (cls || 'rf-darkbtn') + '" disabled>' + ic + 'กำลังลงปฏิทิน…</button>';
  if (calOn()) return '<button class="' + (cls || 'rf-darkbtn') + '" style="color:var(--green)" onclick="RF.calSync()" title="แตะเพื่อซิงก์ใหม่">' + ic + 'ลงปฏิทินแล้ว ✓</button>';

RF.calEnable = () => {

  S.menuOpen = false; renderOverlays();

function pushConfigured(){ return !!(CFG.firebase && CFG.firebase.apiKey && CFG.vapidKey); }
function pushOn(){ try { return ('Notification' in window) && Notification.permission === 'granted' && localStorage.getItem('rf_push_on') === '1'; } catch(e){ return false; } }
function pushBtnHtml(cls){
  if (!pushConfigured()) return '';
  const bell = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>';
  if (pushOn()) return '<button class="' + (cls || 'rf-darkbtn') + '" style="color:var(--green)" onclick="RF.enablePush()" title="แตะเพื่อลงทะเบียนเครื่องนี้ซ้ำ">' + bell + 'เปิดแจ้งเตือนแล้ว ✓</button>';
  return '<button class="' + (cls || 'rf-darkbtn') + '" onclick="RF.enablePush()">' + bell + 'เปิดแจ้งเตือน</button>';

/* ── ย้ายโปรเจ็ค Firebase แล้วรหัสอุปกรณ์เก่าไม่ยอมเปลี่ยน ──────────────────────────
   เบราว์เซอร์เก็บ PushSubscription ที่ผูกกับ VAPID key เดิมไว้ ถ้าไม่ยกเลิกก่อน
   getToken() จะคืน "ของเดิม" กลับมา → หลังบ้านยิงแล้วได้ 403 PERMISSION_DENIED เงียบๆ
   จึงต้องจำไว้ว่าเครื่องนี้ลงทะเบียนกับโปรเจ็คไหน · เปลี่ยนเมื่อไหร่ = ล้างของเก่าก่อนขอใหม่
   (เคสจริง 2026-07-24: ย้าย r-flow-7d729 → r-notification-913fd แล้วนอติเงียบทั้งระบบ) */
const PUSH_PROJ_KEY = 'rf_push_proj';
function pushProjNow(){ return String((CFG.firebase && CFG.firebase.projectId) || ''); }
function pushProjChanged(){
  try { return localStorage.getItem(PUSH_PROJ_KEY) !== pushProjNow(); } catch(e){ return false; }
}
function pushProjSave(){ try { localStorage.setItem(PUSH_PROJ_KEY, pushProjNow()); } catch(e){} }
// ต้องยกเลิก subscription เก่า "หลัง" service worker ตัวใหม่ active แล้ว ไม่งั้นสมัครใหม่ด้วย config เก่าอีกรอบ
function pushResetOldSub(reg){
  if (!pushProjChanged()) return Promise.resolve();
  return Promise.resolve()
    .then(function(){ return reg.update(); })                       // ดึง firebase-messaging-sw.js ตัวใหม่มาก่อน
    .catch(function(){})
    .then(function(){ return reg.pushManager.getSubscription(); })
    .then(function(s){ return s ? s.unsubscribe() : null; })
    .catch(function(){});
}
let _fbLoaded = false;
function loadFirebase(){
  if (_fbLoaded && window.firebase) return Promise.resolve();
  const V = '10.12.2';
  const add = src => new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('โหลด Firebase SDK ไม่สำเร็จ')); document.head.appendChild(s); });
  return add('https://www.gstatic.com/firebasejs/' + V + '/firebase-app-compat.js')
    .then(() => add('https://www.gstatic.com/firebasejs/' + V + '/firebase-messaging-compat.js'))
    .then(() => { _fbLoaded = true; });
}
RF.enablePush = () => {
  if (!pushConfigured()) { toast('ยังไม่ได้ตั้งค่า Firebase'); return; }
  if (!('serviceWorker' in navigator) || !('Notification' in window) || !('PushManager' in window)) { toast('เบราว์เซอร์นี้ยังไม่รองรับการแจ้งเตือน'); return; }
  S.menuOpen = false; renderOverlays();
  Promise.resolve()
    .then(() => Notification.requestPermission())
    .then(perm => {
      if (perm !== 'granted') { toast('ยังไม่ได้อนุญาตแจ้งเตือน'); render(); return null; }   // แถบเตือนเปลี่ยนข้อความเป็น "ไปเปิดที่ตั้งค่าเครื่อง"
      return loadFirebase()
        .then(() => { if (!firebase.apps.length) firebase.initializeApp(CFG.firebase); return navigator.serviceWorker.register('firebase-messaging-sw.js'); })
        .then(reg => pushResetOldSub(reg).then(() => reg))     // ย้ายโปรเจ็คแล้ว → ล้าง subscription เก่าก่อน ไม่งั้นได้ token เดิมคืนมา
        .then(reg => firebase.messaging().getToken({ vapidKey: CFG.vapidKey, serviceWorkerRegistration: reg }))
        .then(token => {
          if (!token) { toast('ขอ token ไม่สำเร็จ'); return; }
          try { localStorage.setItem('rf_push_on', '1'); } catch(e){}
          pushProjSave();
          pushListen();
          return api('savePushToken', { token: token, ua: navigator.userAgent }).then(() => { toast('เปิดแจ้งเตือนแล้ว ✓'); render(); });
        });
    })
    .catch(e => toast('เปิดแจ้งเตือนไม่สำเร็จ: ' + (e && e.message || e)));
};
// เด้ง toast ตอนแอปเปิดอยู่ (foreground) — SW จัดการเฉพาะตอนแอปปิด/พื้นหลัง
function pushListen(){
  try {
    firebase.messaging().onMessage(function(p){
      const d = (p && p.data) || {}, n = (p && p.notification) || {};   // หลังบ้านส่ง data-only → อ่านจาก data ก่อน
      const ti = d.title || n.title || 'แจ้งเตือน', bo = d.body || n.body || '';
      pushLog('นอติเข้าตอนเปิดแอปอยู่: ' + ti, d);
      toast('🔔 ' + ti + (bo ? ' — ' + bo : ''));
      loadAll(true);                                                     // ดึงงานใหม่มาเลย ไม่ต้องรอรอบ poll
    });
  } catch(e){}
}
// คนที่เคยเปิดแจ้งเตือนแล้ว → ทุกครั้งที่เปิดแอป: ต่อ SW + ฟัง foreground + refresh token เงียบๆ
function initPushOnBoot(){
  try {
    if (!pushConfigured() || !SESSION.email) return;
    if (!('serviceWorker' in navigator) || !('Notification' in window)) return;
    if (Notification.permission !== 'granted' || localStorage.getItem('rf_push_on') !== '1') return;
    const migrating = pushProjChanged();
    loadFirebase()
      .then(function(){ if (!firebase.apps.length) firebase.initializeApp(CFG.firebase); return navigator.serviceWorker.register('firebase-messaging-sw.js'); })
      .then(function(reg){ return pushResetOldSub(reg).then(function(){ return reg; }); })
      .then(function(reg){ return firebase.messaging().getToken({ vapidKey: CFG.vapidKey, serviceWorkerRegistration: reg }); })
      .then(function(token){
        if (!token) return;
        pushProjSave();
        pushListen();
        api('savePushToken', { token: token, ua: navigator.userAgent })
          .then(function(){ if (migrating) toast('🔔 ต่อระบบแจ้งเตือนใหม่เรียบร้อย'); })
          .catch(function(){});
      })
      .catch(function(e){ if (migrating) toast('ต่อระบบแจ้งเตือนใหม่ไม่สำเร็จ — กดปุ่มเปิดแจ้งเตือนในเมนูอีกครั้ง'); });
  } catch(e){}
}

function notifFeed(){
  if (!S.me) return [];
  const me = S.me.email, items = [];
  S.tasks.forEach(function(t){
    if (t.assigneeEmail === me && t.createdBy && t.createdBy !== me && stOf(t) !== 'cancelled')
      items.push({ type:'assign', taskId:t.id, title:'มอบงานให้คุณ', sub:t.title || '', ts:t.createdAt || '' });
  });
  const mine = {};
  S.tasks.forEach(function(t){ if (t.assigneeEmail === me || t.reporterEmail === me) mine[t.id] = t; });
  S.comments.forEach(function(c){
    if (c.type === 'system' || !mine[c.taskId] || !c.authorEmail || c.authorEmail === me) return;
    const u = userByEmail(c.authorEmail);
    items.push({ type:'comment', taskId:c.taskId, title:(u ? dispName(u) : (c.authorName || 'มีคน')) + ' คอมเม้น', sub:'"' + (mine[c.taskId].title || '') + '" · ' + (c.text || '(รูป)'), ts:c.createdAt || '' });
  });
  items.sort(function(a, b){ return newFirst(a.ts, b.ts); });   // ล่าสุดอยู่บน
  return items.slice(0, 40);
}

// เก็บเฉพาะตัวเลข (ผู้ใช้พิมพ์ "8,000 บาท" ได้ → เก็บ 8000) · ส่งเป็น string ตามกฎหลังบ้าน
function numOnly(v){
  /* v3.0: เดิมเก็บ "ตัวเลขกับจุด" ทั้งหมด → พิมพ์ "2.5 ชม." ได้ "2.5." (จุดจากคำว่า ชม. ติดมาด้วย)
     "8,000 บาท." ก็ได้ "8000." · ค่าแบบนี้ขึ้นชีทแล้วเอาไปคำนวณต่อพลาดได้ — ต้องเหลือจุดเดียวและไม่ลงท้ายด้วยจุด */
  let s = String(v == null ? '' : v).replace(/[^\d.]/g, '');
  const i = s.indexOf('.');
  if (i >= 0) s = s.slice(0, i + 1) + s.slice(i + 1).replace(/\./g, '');   // เหลือจุดทศนิยมตัวแรกตัวเดียว
  s = s.replace(/\.$/, '').replace(/^\./, '0.');                          // ตัดจุดท้าย · ".5" -> "0.5"
  return s;
}
/* v3.4: ช่องกรอกตัวเลขใส่ , คั่นหลักพันให้ขณะพิมพ์ — 6000000 อ่านยาก ต้องนั่งนับศูนย์
   เก็บ/ส่งขึ้นชีทยังเป็นตัวเลขล้วนเหมือนเดิม (numOnly ตัด , ทิ้งตอนบันทึกอยู่แล้ว) */
function commaNum(v){
  let s = String(v == null ? '' : v).replace(/[^\d.]/g, '');
  if (!s) return '';
  const i = s.indexOf('.');
  let ip = i < 0 ? s : s.slice(0, i);
  const dp = i < 0 ? '' : '.' + s.slice(i + 1).replace(/\./g, '');
  ip = ip.replace(/^0+(?=\d)/, '');                                       // "007" -> "7"
  ip = ip.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return ip + dp;
}
/* จัดรูปช่องขณะพิมพ์ + คงตำแหน่งเคอร์เซอร์ไว้ที่เดิม (นับจากจำนวนตัวเลขที่อยู่ก่อนเคอร์เซอร์
   ไม่ใช่ตำแหน่งตัวอักษร — ไม่งั้นพอ , โผล่ เคอร์เซอร์จะกระโดด แก้เลขกลางตัวไม่ได้) */
RF.numFmt = el => {
  if (!el) return '';
  const before = String(el.value || '');
  const pos = el.selectionStart == null ? before.length : el.selectionStart;
  const nBefore = before.slice(0, pos).replace(/[^\d.]/g, '').length;
  const out = commaNum(before);
  if (out !== before) {
    el.value = out;
    let n = 0, p = 0;
    for (let j = 0; j < out.length; j++) { p = j + 1; if (/[\d.]/.test(out[j])) { n++; if (n >= nBefore) break; } }
    if (!nBefore) p = 0;
    try { el.setSelectionRange(p, p); } catch(e){}
  }
  return out;
};

function applyStatus(id, status, impactPatch){

  S.comments.push(sysTmp);
  const oldIm = { impact: t.impact, impactSales: t.impactSales, impactProfit: t.impactProfit, impactCost: t.impactCost, impactTime: t.impactTime, impactDept: t.impactDept };
  if (impactPatch) Object.keys(impactPatch).forEach(function(k){ t[k] = impactPatch[k]; });
  invalidateDec(); render(); renderOverlays();
  const _msg = status === 'review' ? 'ส่งตรวจแล้ว — รอหัวหน้าตรวจ' : (status === 'done' && old === 'review') ? 'ตรวจผ่านแล้ว ✓' : 'ย้ายงานไป “' + SL[status] + '” แล้ว';
  toast(_msg);   // v2.94: เปลี่ยนสถานะกดกลับเองได้ที่ชิปสถานะ ไม่ต้องมีปุ่มเลิกทำ
  // มีสรุปผล → ส่งไปพร้อมสถานะในคำขอเดียว (update รองรับ status + field อื่นพร้อมกัน)
  /* v4.6: เปลี่ยนสถานะก็ลงคิวถาวรเหมือนเช็คลิสต์ (Surat: "ถ้าส่งไม่ไปให้ขึ้นโชว์ และพยายามส่งใหม่")

/* v2.89: รวมการบันทึกเช็คลิสต์ที่ติดๆ กันเป็นคำขอเดียว

/* v4.13 — ทางเดียวของการส่งคอมเม้น (ใช้ทั้งมีรูป/ไม่มีรูป)
   ลำดับสำคัญ: ขึ้นจอ → เข้าคิว → ค่อยยิง
   ปิดแอป/สลับแอปกลางคัน request โดนยกเลิกเงียบๆ แต่ของอยู่ในคิวแล้ว เปิดใหม่ wqFlush ส่งต่อให้เอง
   ส่งซ้ำได้ไม่กลัวของซ้ำ เพราะหลังบ้าน v1.44 กันด้วย Client ID */
function cmtSendQueued(taskId, tx, imageUrl, cid, mentions, replyTo){
  const payload = { taskId: taskId, text: tx, clientId: cid, imageUrl: imageUrl || '', replyTo: replyTo || '' };
  const local = { id: 'tmp-' + cid, taskId: taskId, authorEmail: S.me.email, authorName: S.me.name,
                  text: tx, imageUrl: imageUrl || '', createdAt: new Date().toISOString(), clientId: cid,
                  replyTo: replyTo || '' };
  S.comments.push(local);
  wqPushOp({ kind: 'comment', cid: cid, taskId: taskId, payload: payload, mentions: mentions, local: local,
             label: 'คอมเม้น: ' + tx.slice(0, 30) });
  S._cmtBusy = true;            // กัน poll ดึงคอมเม้นที่เพิ่งบันทึกกลับมาซ้ำกับตัวชั่วคราว
  invalidateDec();
  if (!patchCmt(taskId)) { renderOverlays(); render(); }
  api('addComment', { comment: payload, mentions: mentions }, { wqBacked: true }).then(function(j){
    wqDropOp(cid); wqOpDone({ kind: 'comment', cid: cid }, j);
    S._cmtBusy = false;
  }).catch(function(e){
    S._cmtBusy = false;
    if (e && e.offline) { wqMarkFailedOp(cid); invalidateDec(); if (!patchCmt(taskId)) { renderOverlays(); render(); } return; }
    wqDropOp(cid); wqOpFailed({ kind: 'comment', cid: cid, payload: payload }, e);
  });
}
const CMT_MAXN = 8;   // แนบได้สูงสุด 8 รูป/คอมเม้น
// ย่อรูป + เพิ่มเข้า S.cmtImgs — ใช้ร่วมทั้งเลือกไฟล์ ถ่ายรูป และวาง (แคป)
function addCmtImageFile(f, cb){
  const rd = new FileReader();
  rd.onload = function(){
    const im = new Image();
    im.onload = function(){
      const MAX = 1280;
      let w = im.width, h = im.height;
      if (w > MAX || h > MAX) { const r = Math.min(MAX / w, MAX / h); w = Math.round(w * r); h = Math.round(h * r); }
      const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
      cv.getContext('2d').drawImage(im, 0, 0, w, h);
      if (!S.cmtImgs) S.cmtImgs = [];
      if (S.cmtImgs.length < CMT_MAXN) S.cmtImgs.push({ dataUrl: cv.toDataURL('image/jpeg', 0.85), name: String((f && f.name) || 'capture').replace(/\.[^.]+$/, '') + '.jpg' });
      renderOverlays(); if (cb) cb();
    };
    im.onerror = function(){ toast('อ่านไฟล์รูปไม่สำเร็จ'); };
    im.src = rd.result;
  };
  rd.readAsDataURL(f);
}
function addCmtImages(files){
  const imgFiles = Array.from(files || []).filter(f => /^image\//.test(f.type));
  if (!imgFiles.length) return false;
  if (!S.cmtImgs) S.cmtImgs = [];
  const room = CMT_MAXN - S.cmtImgs.length;
  if (room <= 0) { toast('แนบได้สูงสุด ' + CMT_MAXN + ' รูป'); return true; }
  if (imgFiles.length > room) toast('แนบได้สูงสุด ' + CMT_MAXN + ' รูป');
  imgFiles.slice(0, room).forEach(function(f){ addCmtImageFile(f); });
  return true;
}
RF.cmtFile = inp => {

// วางรูป (แคปหน้าจอ Ctrl+V / วางจากคลิปบอร์ด) ในคอมเม้น — ทำงานเฉพาะตอนเปิดงานอยู่ + คอมเม้นได้
document.addEventListener('paste', function(e){
  const items = (e.clipboardData && e.clipboardData.items) || [];
  const files = [];
  for (let i = 0; i < items.length; i++) { if (items[i].kind === 'file' && /^image\//.test(items[i].type)) { const f = items[i].getAsFile(); if (f) files.push(f); } }
  if (!files.length) return;
  // ฟอร์มปิดงาน (รูปตอนเสร็จ) และฟอร์มสร้างงาน (รูปประกอบ) มาก่อน — เปิดซ้อนอยู่บนสุด
  if (S.impact) { e.preventDefault(); RF.imgPick('done', files); toast('📎 วางรูปแล้ว'); return; }
  if (S.formOpen && S.form && !S.form.id) { e.preventDefault(); RF.imgPick('form', files); toast('📎 วางรูปแล้ว'); return; }
  if (!S.detailId || S.closing) return;
  const t = S.tasks.find(function(x){ return x.id === S.detailId; });
  if (!t || !canComment(t) || S.cmtSending) return;
  e.preventDefault();
  if (addCmtImages(files)) toast('📎 วางรูปแล้ว — กดส่งเพื่อโพสต์');
});

function openLine(text){ window.open('https://line.me/R/msg/text/?' + encodeURIComponent(text), '_blank'); }
function isPhone(){ return /Android|iPhone|iPad|iPod/i.test(navigator.userAgent); }
function copyToClip(text){
  const ok = function(){ toast('คัดลอกข้อความแล้ว — เปิดไลน์แล้ววาง (Ctrl+V)'); };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(ok).catch(function(){ clipFallback(text, ok); });
  } else clipFallback(text, ok);
}
function clipFallback(text, ok){
  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;top:-2000px;left:0;opacity:0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    ok();
  } catch(e){ toast('คัดลอกไม่สำเร็จ — ลองเลือกข้อความเองอีกที'); }
}
function shareText(text){
  if (!isPhone()) { copyToClip(text); return; }
  if (navigator.share) { navigator.share({ text: text }).catch(function(err){ if (err && err.name !== 'AbortError') openLine(text); }); return; }
  openLine(text);
}

function imgBucket(kind){
  if (kind === 'done') { if (S.impact) { S.impact.images = S.impact.images || []; return S.impact.images; } return null; }
  if (S.form) { S.form.images = S.form.images || []; return S.form.images; }

function addTaskImageFile(kind, f){
  const arr = imgBucket(kind); if (!arr || arr.length >= MAX_TASK_IMG) return;
  const rd = new FileReader();
  rd.onload = function(){
    const im = new Image();
    im.onload = function(){
      const MAX = 1280;
      let w = im.width, h = im.height;
      if (w > MAX || h > MAX) { const r = Math.min(MAX / w, MAX / h); w = Math.round(w * r); h = Math.round(h * r); }
      const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
      cv.getContext('2d').drawImage(im, 0, 0, w, h);
      const a = imgBucket(kind); if (!a || a.length >= MAX_TASK_IMG) return;
      a.push({ dataUrl: cv.toDataURL('image/jpeg', 0.85), name: String((f && f.name) || 'capture').replace(/\.[^.]+$/, '') + '.jpg' });
      renderOverlays();
    };
    im.onerror = function(){ toast('อ่านไฟล์รูปไม่สำเร็จ'); };
    im.src = rd.result;
  };
  rd.readAsDataURL(f);
}
RF.imgPick = (kind, files) => {
  const arr = imgBucket(kind); if (!arr) return;
  const imgs = Array.from(files || []).filter(function(f){ return /^image\//.test(f.type); });
  const room = MAX_TASK_IMG - arr.length;
  if (room <= 0) { toast('แนบได้สูงสุด ' + MAX_TASK_IMG + ' รูป'); return; }
  if (imgs.length > room) toast('แนบได้สูงสุด ' + MAX_TASK_IMG + ' รูป');
  imgs.slice(0, room).forEach(function(f){ addTaskImageFile(kind, f); });
};

   ทำหลังบันทึกงานเสร็จเสมอ — ต้องมี task id ก่อน */
function uploadTaskImages(taskId, imgs, field){
  if (!imgs || !imgs.length) return Promise.resolve();
  toast('กำลังอัปโหลดรูป ' + imgs.length + ' รูป…');
  const urls = [];
  let chain = Promise.resolve();
  imgs.forEach(function(im){
    chain = chain.then(function(){
      return api('uploadImage', { image: { dataUrl: im.dataUrl, filename: im.name } })
        .then(function(j){ if (j && j.image && j.image.url) urls.push(j.image.url); });
    });
  });
  return chain.then(function(){
    if (!urls.length) return;
    const patch = {}; patch[field] = urls.join(',');
    const t = S.tasks.find(function(x){ return x.id === taskId; });
    if (t) { t[field] = urls.join(','); invalidateDec(); render(); renderOverlays(); }
    return api('update', { id: taskId, patch: patch }).then(function(){ toast('แนบรูปแล้ว ' + urls.length + ' รูป ✓'); });
  }).catch(function(e){ toast('อัปโหลดรูปไม่สำเร็จ: ' + (e && e.message || e)); });
}

RF.saveForm = () => {
  const f = S.form;
  if (!f || S.saving) return;
  let fields;
  if (f.mode === 'handoff') {
    // ── ฝากของ — carrier=assigneeEmail · dest=ผู้รับปลายทาง · items ──
    const errs = {};
    if (!f.assigneeEmail) errs.carrier = 'เลือกผู้รับฝากก่อน';
    if (!f.dest) errs.dest = 'เลือกผู้รับปลายทางก่อน';
    if (!(f.items || []).length) errs.items = 'เลือกของที่ฝากอย่างน้อย 1 อย่าง';
    S.errs = errs;
    if (Object.keys(errs).length) { renderOverlays(); return; }
    const au = userByEmail(f.assigneeEmail), destU = userByEmail(f.dest);
    const itemsCsv = (f.items || []).join(',');
    fields = {
      title: '📦 ฝาก' + hItemsLabel(itemsCsv).replace(/[🧾📄📦💵➕]\s?/g, '') + (destU ? ' → ' + dispName(destU) : ''),
      detail: '', assigneeEmail: f.assigneeEmail, assigneeName: au ? au.name : '',
      priority: 'med', startDate: f.startDate || todayIso(), dueDate: f.dueDate || '', note: String(f.note || '').trim(),
      private: '', collaborators: '', type: 'handoff', dest: f.dest, items: itemsCsv, planId: String(f.planId || '')
    };
  } else {
    const errs = {};
    if (!String(f.title).trim()) errs.title = 'กรุณาใส่ชื่องาน';
    if (!f.assigneeEmail) errs.assignee = 'กรุณาเลือกผู้รับผิดชอบ';
    if (!f.dueDate && canSetDate()) errs.dueDate = 'กรุณากำหนดวันส่ง';   // คนที่ตั้งวันไม่ได้ก็บังคับไม่ได้ — หัวหน้ามาใส่ให้ทีหลัง
    S.errs = errs;
    if (Object.keys(errs).length) { renderOverlays(); return; }
    const au = userByEmail(f.assigneeEmail);
    const asgLo = String(f.assigneeEmail || '').toLowerCase();
    const collab = (f.collaborators || []).filter(function(e){ return String(e).toLowerCase() !== asgLo; }).join(',');
    fields = {
      title: String(f.title).trim(), detail: String(f.detail).trim(),
      assigneeEmail: f.assigneeEmail, assigneeName: au ? au.name : '',
      priority: f.priority, startDate: f.startDate || '', dueDate: f.dueDate, note: String(f.note).trim(),
      private: f.private || '', collaborators: collab, planId: String(f.planId || '')
    };
    if (!f.id) {   // เช็คลิสต์ + เป้าหมาย + รูป ใส่ได้ตอน "สร้าง" เท่านั้น
      const rest = clStrip(String(f.clAddTx || '').trim());
      const cl = (f.clItems || []).map(clItemOf).concat(rest ? [{ t: rest, asg: '', due: '' }] : [])
        .map(function(it){ return { t: clStrip(it.t), asg: it.asg || '', due: it.due || '' }; })
        .filter(function(it){ return !!it.t; })
        .map(function(it){
          const o = { t: it.t, d: false, ts: new Date().toISOString(), by: S.me ? S.me.email : '' };
          if (it.asg) { o.asg = it.asg; o.asgBy = S.me ? S.me.email : ''; }
          if (it.due) o.due = it.due;
          return o;
        });
      if (cl.length) fields.checklist = JSON.stringify(cl);
      const gp = numOnly(f.goalProfit), gc = numOnly(f.goalCost), gt = numOnly(f.goalTime);
      if (String(f.goal || '').trim() || gp || gc || gt || f.goalDept) {
        fields.goal = String(f.goal || '').trim();
        fields.goalProfit = gp; fields.goalCost = gc; fields.goalTime = gt; fields.goalDept = String(f.goalDept || '');
      }
    }
  }
  const pendingImgs = (!f.id && f.images && f.images.length) ? f.images.slice(0, MAX_TASK_IMG) : [];
  const id = f.id;
  // ปิดฟอร์มทันที (optimistic) — ไม่ค้าง "กำลังบันทึก", ยิง API เบื้องหลัง
  S.formOpen = false; S.form = null; S.saving = false;
  dropHistory();
  if (id) {
    const t = S.tasks.find(x => x.id === id);
    const backup = t ? Object.assign({}, t) : null;
    if (t) Object.assign(t, fields, { updatedAt: new Date().toISOString() });
    render(); renderOverlays();
    toast('บันทึกการแก้ไขแล้ว');
    api('update', { id: id, patch: fields }).then(() => { calSyncOne(id); loadAll(true); }).catch(e => {
      if (t && backup) { Object.keys(t).forEach(k => { if (!(k in backup)) delete t[k]; }); Object.assign(t, backup); }
      render(); renderOverlays();
      toast('บันทึกไม่สำเร็จ: ' + e.message);
    });
  } else {
    /* v4.13: สร้างงานก็เข้าคิวเหมือนคอมเม้น — ปิดแอปกลางคันแล้วงานไม่หาย
       (ปลอดภัยแล้วเพราะหลังบ้าน v1.44 กันของซ้ำด้วย Client ID) */
    const cid = uuid();
    const payload = Object.assign({ status: 'todo' }, fields, { clientId: cid });
    const temp = Object.assign({ id: 'tmp-' + cid, status: 'todo', reporterEmail: S.me.email, reporterName: S.me.name, createdBy: S.me.email, createdAt: new Date().toISOString(), updatedAt: new Date().toISOString(), clientId: cid }, fields);
    S.tasks.push(temp);
    wqPushOp({ kind: 'create', cid: cid, taskId: temp.id, payload: payload, local: temp, label: 'สร้างงาน: ' + String(fields.title || '').slice(0, 30) });
    // ✅ ถ้ามีตัวกรองบอร์ดค้างอยู่ (เช่นจากค้นหาคน) ที่จะซ่อนงานใหม่นี้ → ล้างให้ ไม่งั้น "สร้างแล้วไม่เห็น"
    const unhid = clearFiltersHiding(temp);
    render(); renderOverlays();
    toast(unhid ? 'สร้างงานแล้ว — ล้างตัวกรองให้เห็นงานใหม่' : 'สร้างงานแล้ว');
    api('create', { task: payload }, { wqBacked: true }).then(j => {
      wqDropOp(cid);
      if (S.detailId === temp.id) S.detailId = j.task.id;   // เปิดดูงานที่เพิ่งสร้างอยู่ → id เปลี่ยน ต้องตามไปด้วย ไม่งั้นหน้ารายละเอียดหายเฉยๆ
      temp.id = j.task.id; invalidateDec(); render(); renderOverlays(); calSyncOne(temp.id);
      // รูปแนบ — อัปโหลดหลังสร้างงานเสร็จ (ต้องมี id ก่อน) แล้วค่อย patch URL กลับเข้างาน
      if (pendingImgs.length) return uploadTaskImages(temp.id, pendingImgs, 'images');
    }).then(function(){ loadAll(true); }).catch(e => {
      if (e && e.offline) {          // ยังอยู่ในคิว — งานยังอยู่บนจอ ระบบลองส่งใหม่ให้เอง
        wqMarkFailedOp(cid); invalidateDec(); render(); renderOverlays();
        toast('ยังส่งไม่ขึ้นระบบ — เก็บไว้ให้แล้ว กำลังลองส่งใหม่');
        return;
      }
      wqDropOp(cid);
      wqOpFailed({ kind: 'create', cid: cid }, e);
    });
  }
};

/* ══ v4.16 — คอมเม้น: ตอบกลับ + แก้ไข ══════════════════════════════════
   ⚠️ ผูก event แบบ delegation ที่ document ตัวเดียว ไม่ใช้ inline onclick
   เพราะ id ต้องถูกยัดเป็น string ใน HTML แล้วต้อง escape ' ซึ่งพังมาแล้วหลายรอบ
   และ overlay ถูก rebuild บ่อย ผูกที่ document ทีเดียวจบ ไม่ต้องผูกใหม่ทุก render */
function cmtById(id){ return S.comments.find(function(c){ return c.id === id; }); }

     เดิมเก็บแค่ id คอมเม้น พอเปลี่ยนงานแถบยังค้าง เสี่ยงตอบไปติดงานผิดใบ */

RF.cmtMenuOpen = (id, x, y) => {

  const w = d.offsetWidth, h = d.offsetHeight;
  d.style.left = Math.max(8, Math.min(m.x, window.innerWidth - w - 8)) + 'px';

/* ปัดขวา = ตอบกลับ (เกิน 55px ปล่อยแล้วติด) · ปัดแนวตั้งเกินแนวนอน = ปล่อยให้จอเลื่อนตามปกติ */
let _sw = null;
document.addEventListener('pointerdown', function(e){
  /* v4.18: แตะที่ไหนก็ตามที่ไม่ใช่ตัวเมนู = ปิดเมนู
     เดิมรอ event 'click' อย่างเดียว ซึ่งบนมือถือบางจังหวะไม่ถึง document
     เมนูเลยลอยค้างทับทั้งจอ กดอะไรไม่ได้เลย (Surat เจอจริง 31 ก.ค.) */
  if (S.cmtMenu && !(e.target.closest && e.target.closest('#cmtMenu'))) RF.cmtMenuClose();
  const row = e.target.closest && e.target.closest('.rf-cmt[data-cid]');
  if (!row || e.target.closest('button, a, input, textarea')) return;
  _sw = { row: row, id: row.getAttribute('data-cid'), x: e.clientX, y: e.clientY, dx: 0, locked: '', t: Date.now() };
  _sw.hold = setTimeout(function(){                       // กดค้าง = เปิดเมนู (มือถือแทนคลิกขวา)
    if (_sw && !_sw.locked) { const q = _sw; _sw = null; q.row.style.transform = ''; RF.cmtMenuOpen(q.id, q.x, q.y); }
  }, 500);
}, { passive: true });
document.addEventListener('pointermove', function(e){
  if (!_sw) return;
  const dx = e.clientX - _sw.x, dy = e.clientY - _sw.y;
  if (!_sw.locked) {
    if (Math.abs(dy) > 10 && Math.abs(dy) > Math.abs(dx)) { clearTimeout(_sw.hold); _sw = null; return; }  // เลื่อนจอ
    if (dx > 10) { _sw.locked = 'x'; clearTimeout(_sw.hold); _sw.row.classList.add('swiping'); }
    else if (Math.abs(dx) > 10) { clearTimeout(_sw.hold); _sw = null; return; }
    else return;
  }
  _sw.dx = Math.max(0, Math.min(dx, 90));
  _sw.row.style.transform = 'translateX(' + _sw.dx + 'px)';
  const ic = _sw.row.querySelector('.rf-swipeic');
  if (ic) ic.style.opacity = Math.min(1, _sw.dx / 55);
}, { passive: true });
document.addEventListener('pointerup', function(){
  if (!_sw) return;
  clearTimeout(_sw.hold);
  const q = _sw; _sw = null;
  q.row.classList.remove('swiping'); q.row.classList.add('snapback');
  q.row.style.transform = '';
  const ic = q.row.querySelector('.rf-swipeic'); if (ic) ic.style.opacity = 0;
  setTimeout(function(){ q.row.classList.remove('snapback'); }, 200);
  if (q.locked === 'x' && q.dx >= 55) RF.replyTo(q.id);
});
document.addEventListener('pointercancel', function(){
  if (!_sw) return;
  clearTimeout(_sw.hold);
  _sw.row.style.transform = ''; _sw.row.classList.remove('swiping');
  const ic = _sw.row.querySelector('.rf-swipeic'); if (ic) ic.style.opacity = 0;
  _sw = null;
});
document.addEventListener('contextmenu', function(e){
  const row = e.target.closest && e.target.closest('.rf-cmt[data-cid]');
  if (!row) return;
  e.preventDefault();
  RF.cmtMenuOpen(row.getAttribute('data-cid'), e.clientX, e.clientY);
});
/* 🔴 v4.20: ต้องดักที่ **capture phase** (true ท้ายสุด) ห้ามใช้ bubble
   กล่อง overlay ทุกตัว (หน้างาน · ฟอร์ม · ฟอร์มแผน) มี onclick="event.stopPropagation()"
   ไว้กันคลิกทะลุไปโดนพื้นหลังแล้วปิดหน้า → คลิกข้างในไม่มีทางไปถึง document ในขา bubble
   ผลคือปุ่มที่ผูกด้วย data-act ข้างในหน้ารายละเอียด **ตายสนิทมาตั้งแต่ v4.16**:
   ✕ เลิกตอบ · บันทึก/ยกเลิกตอนแก้ข้อความ · กดกล่องอ้างข้อความเพื่อเด้งไปต้นฉบับ
   (Surat แจ้งว่ากด ✕ ไม่ได้ — ตอนนั้นแก้ไปแค่เมนูค้าง ซึ่งเป็นคนละสาเหตุที่บังเอิญเกิดพร้อมกัน)
   capture ทำงานก่อน target เสมอ → stopPropagation ขา bubble ทำอะไรไม่ได้ */
document.addEventListener('click', function(e){
  const b = e.target.closest && e.target.closest('[data-act]');
  if (!b) { if (S.cmtMenu) RF.cmtMenuClose(); return; }
  const act = b.getAttribute('data-act');
  if (act === 'reply') { RF.cmtMenuClose(); RF.replyTo(b.getAttribute('data-cid')); return; }
  if (act === 'edit') { RF.cmtMenuClose(); RF.cmtEditStart(b.getAttribute('data-cid')); return; }
  if (act === 'replycancel') { RF.replyCancel(); return; }
  if (act === 'editsave') { RF.cmtEditSave(); return; }
  if (act === 'editcancel') { RF.cmtEditCancel(); return; }
  if (act === 'jump') { RF.cmtJump(b.getAttribute('data-to')); return; }
  if (act === 'fmode') { RF.planToForm(b.getAttribute('data-m')); return; }
  if (act === 'emojitoggle') { RF.cmtEmojiToggle(); return; }
  if (act === 'emoji') { RF.cmtEmojiPick(b.getAttribute('data-e')); return; }
}, true);
window.addEventListener('scroll', function(){ if (S.cmtMenu) RF.cmtMenuClose(); }, true);

/* ── boot ── */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (S.cmtMenu) RF.cmtMenuClose();        // v4.16: เมนูคอมเม้นอยู่บนสุด ปิดก่อน
    else if (S.cmtEdit) RF.cmtEditCancel();
    else if (S.cmtReplyTo) RF.replyCancel();
    else if (S.imgView) RF.imgViewClose();        // ปิดตัวที่ซ้อนบนสุดก่อนเสมอ
    else if (S.asgPick) RF.clAsgClose();
    else if (S.taskPick) RF.taskPickClose();
    else if (S.planPick) RF.planPickClose();
    else if (S.planForm) RF.planClose();
    else if (S.goalEdit) RF.goalEditClose();
    else if (S.impact) RF.impactClose();      // เดิมตกไป — กด Esc ตอนกรอกสรุปผลแล้วไปปิดหน้างานข้างหลังแทน
    else if (S.recurForm) RF.recurClose();
    else if (S.formOpen) RF.closeForm();
    else if (S.detailId) RF.closeDetail();
    else if (S.listPop) RF.closePop();
    else if (S.menuOpen) RF.closeMenu();
    else if (S.q) RF.qClear();
  }
});
mq.addEventListener('change', () => { render(); renderOverlays(); });

/* v3.6: เปิดแอปมาที่ "ภาพรวม" เสมอ (Surat สั่ง) — v3.2 เคยให้เด้งกลับหน้าที่ค้างไว้ล่าสุด
   แต่หน้าแรกคือที่ที่ควรเห็นภาพทั้งหมดก่อนตัดสินใจว่าจะไปไหนต่อ
   ยังเก็บ "แท็บล่าสุดในกลุ่มงาน" ไว้ — ใช้ตอนกดปุ่ม "งาน" จากหน้าอื่น ไม่ใช่ตอนเปิดแอป */
const LASTVIEW_KEY = 'rf_lastview';
function saveLastView(v){
  try { localStorage.setItem(LASTVIEW_KEY, JSON.stringify({ view: v, work: S.workLast || '' })); } catch(e){}
}
function loadLastView(){
  try {
    const o = JSON.parse(localStorage.getItem(LASTVIEW_KEY) || 'null');
    if (o && isWorkView(o.work)) S.workLast = o.work;
  } catch(e){}
}
(function boot(){
  try { S.dark = localStorage.getItem('rf_theme') === 'dark'; } catch(e){}
  loadLastView();
  document.body.classList.toggle('dark', S.dark);
  const td = pd(todayIso());
  S.calSel = todayIso(); S.calY = td.getFullYear(); S.calM = td.getMonth(); S.calWeekStart = weekStartOf(todayIso());
  initGsi();
  { const vb = document.getElementById('verBadge'); if (vb) vb.textContent = 'v' + CFG.version; }   // เลขเวอร์ชันหน้าแรก ผูกกับ CFG ตัวเดียว ไม่ต้องแก้ 2 ที่
  planFilterLoad();  // v4.12: คืนตัวกรอง ปี/คลัง/แผนก ที่เลือกไว้รอบก่อน
  cmtSentLoad();     // v4.14: คืนติ๊ก ✓ ของคอมเม้นที่ยืนยันแล้ว ไม่ให้หายตอนปิดแอป
  setupDeepLink();   // จำ ?task= จากลิงก์นอติ + ฟัง message จาก service worker
  if (SESSION.email) {
    /* v4.8: เปิดจากลิงก์งาน (?task=) — ถ้างานนั้นมีใน cache อยู่แล้ว เปิดเลยไม่ต้องรอ loadAll
       เดิมรอ resolvePendingOpen() ที่ท้าย loadAll อย่างเดียว พอ loadAll คืนก่อนกำหนด (มีเขียนค้าง)
       ลิงก์เลยไม่เด้งไปหน้างานเลย — Surat เจอจริง 30 ก.ค. */
    if (loadCache()) { S.loading = false; showApp(); render(); restoreScroll(); resolvePendingOpen(true); loadAll(true); }   // มี cache → โชว์ทันที + คืนตำแหน่งเดิม + sync เงียบ
    else loadAll(false);
    initSession();
  }
  else showLogin();
})();
</script>
