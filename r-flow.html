body{overscroll-behavior-y:contain}
.rf-perfbtn:hover{background:var(--surface2);border-color:var(--accent);color:var(--accent-ink)}
.rf-perfbtn:active{transform:scale(.97)}
.rf-perfstat{background:var(--surface2);border-radius:12px;padding:10px 12px}
.rf-perfstat .v{font-size:22px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.rf-perfstat .l{font-size:12px;color:var(--muted);margin-top:2px}
.rf-perfsec{font-size:13px;font-weight:700;color:var(--muted);margin:16px 4px 5px}
.rf-perfbars{display:flex;align-items:flex-end;gap:8px;height:86px;margin-top:8px}
.rf-perfbar{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;height:100%;justify-content:flex-end}
.rf-perfbar .bar{width:100%;max-width:30px;border-radius:5px 5px 2px 2px;transition:height .5s cubic-bezier(.22,1,.36,1)}
/* v2.88: สรุปตรงเวลา/เกินกำหนด ใต้หัวกราฟ — บรรทัดเดียว ชิปเล็ก */
.rf-otrow{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-top:6px;font-size:11.5px;font-weight:800}
/* v3.8: ชิปพวกนี้กดเข้าไปดูงานจริงได้ — เป็น <button> แล้ว (เดิมเป็น <span> ดูได้อย่างเดียว) */
.rf-otrow span,.rf-otrow button{padding:3px 9px;border-radius:8px;white-space:nowrap;font-size:11.5px;font-weight:800;font-family:inherit;border:1px solid transparent}
.rf-otrow button{cursor:pointer}
.rf-otrow button:hover{filter:brightness(.94)}
.rf-otrow .ok{background:var(--green-soft);color:var(--green)}
.rf-otrow button.ok:hover{border-color:var(--green)}
.rf-otrow .late{background:var(--red-soft);color:var(--red)}
.rf-otrow button.late:hover{border-color:var(--red)}
.rf-otrow .none{background:var(--surface2);color:var(--muted)}
.rf-otrow button.none:hover{border-color:var(--border)}
.rf-otrow .pct{margin-left:auto;background:none;padding:2px 0;color:var(--muted)}
/* v2.89: การ์ด "ปิดงานตรงเวลา" บนหน้าภาพรวม */
.rf-otcard{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);padding:13px 15px;margin-top:12px}
.rf-otcard .hd{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.rf-otcard .ttl{font-size:14px;font-weight:800}
.rf-otcard .sub{font-size:12px;color:var(--muted);font-weight:600}
.rf-otcard .big{margin-left:auto;font-size:22px;font-weight:800;line-height:1}
/* v2.88: แถบ "ยังส่งไม่ได้" — พื้นทึบ อ่านออกทั้งโหมดสว่าง/มืด */
.rf-wqbar{display:flex;align-items:center;gap:9px;background:var(--amber-soft);border:1px solid #EBD6AE;border-radius:12px;padding:9px 12px;margin-bottom:12px;font-size:12.5px;font-weight:700;color:var(--amber)}
.rf-wqbar .dot{width:8px;height:8px;border-radius:50%;background:var(--amber);flex-shrink:0;animation:wqPulse 1.6s ease-in-out infinite}
.rf-wqbar .tx{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rf-wqbar button{flex-shrink:0;border:none;background:var(--amber);color:#fff;font-family:inherit;font-size:12px;font-weight:800;padding:5px 11px;border-radius:8px;cursor:pointer}
/* v4.11: แถบ "ของบนจอยังเป็นรอบที่แล้ว" — โทนเทากลางๆ ไม่ใช่สีเตือน เพราะไม่ได้มีอะไรผิด แค่ยังไม่สด */
.rf-stalebar{display:flex;align-items:center;gap:9px;background:var(--slate-soft);border:1px solid var(--border);border-radius:12px;padding:9px 12px;margin-bottom:12px;font-size:12.5px;font-weight:700;color:var(--slate)}
.rf-stalebar .tx{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rf-spin.sm{width:14px;height:14px;border-width:2px;margin:0;flex-shrink:0}
/* v4.13: สถานะส่งของคอมเม้นตัวเอง แบบเดียวกับแอปแชท — กด "ส่ง" แล้วเห็นเลยว่าถึงหรือยัง */
/* v4.21: แผง emoji เหนือช่องพิมพ์ — 20 ตัวที่ใช้กันจริงในแชทที่ทำงาน
   เรียง 10 คอลัมน์บน PC · มือถือย่อเป็น 7 ต่อแถว ปุ่มยังกดง่ายอยู่ (44px ตามระยะนิ้ว) */
.rf-emojibar{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;background:var(--surface2);border-radius:12px;padding:7px;margin-bottom:8px}
@media(max-width:520px){.rf-emojibar{grid-template-columns:repeat(7,1fr)}}
.rf-emojibar button{height:40px;border:none;background:none;border-radius:9px;font-size:21px;line-height:1;cursor:pointer;padding:0}
.rf-emojibar button:hover{background:var(--surface)}
.rf-emojibar button:active{transform:scale(.9)}
.rf-emojibtn.on{border-color:var(--accent);color:var(--accent-ink);background:var(--accent-soft)}
.rf-cmtstat{display:flex;align-items:center;gap:5px;margin-top:4px;font-size:11.5px;font-weight:700;color:var(--muted)}
.rf-cmtstat.sent{color:var(--green)}
.rf-cmtstat.failed{color:var(--red)}
.rf-cmtstat .rf-spin.sm{width:11px;height:11px;border-width:2px}
.rf-cmtstat button{border:none;background:var(--red-soft);color:var(--red);font-family:inherit;font-size:11px;font-weight:800;padding:2px 8px;border-radius:7px;cursor:pointer}
@keyframes wqPulse{0%,100%{opacity:1}50%{opacity:.35}}
.rf-cl-item{display:flex;align-items:flex-start;gap:10px;min-height:36px;padding:9px 0;border-bottom:1px solid var(--border);transition:transform .13s ease}
.rf-cl-item:last-child{border-bottom:none}
.rf-cl-item.rf-cl-dragging{transition:none;background:var(--surface);border-radius:9px;border-bottom-color:transparent;box-shadow:0 7px 22px rgba(0,0,0,.22);position:relative;z-index:5;padding:9px 6px}
.rf-cl-box{margin-top:2px;width:22px;height:22px;border-radius:7px;border:1.5px solid var(--border);background:var(--surface);cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;padding:0;transition:background .12s,border-color .12s}
.rf-cl-box.on{background:var(--green);border-color:var(--green)}
.rf-cl-box:disabled{cursor:default;opacity:.7}
.rf-cl-drag{width:30px;height:36px;border:none;background:none;color:var(--muted);cursor:grab;display:flex;align-items:center;justify-content:center;flex-shrink:0;border-radius:6px;padding:0;touch-action:none;opacity:.85;-webkit-user-select:none;user-select:none}
.rf-cl-drag:hover{background:var(--surface2);color:var(--text);opacity:1}
.rf-cl-drag:active{cursor:grabbing;opacity:1}
.rf-cl-mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
/* v2.87: รายการย่อยเคยกินพื้นที่ข้อละ 5-6 บรรทัด เพราะปุ่ม (มอบหมาย/วันเสร็จ/ลาก/ลบ) เบียดอยู่แถวเดียว
   กับข้อความ ทำให้ข้อความเหลือความกว้างนิดเดียวแล้วตกบรรทัดยาวเป็นพรืด
   ตอนนี้: ข้อความได้เต็มความกว้าง จำกัด 2 บรรทัด · ปุ่มย้ายลงไปอยู่แถวล่างคู่กับ "เพิ่มโดย…" */
/* 🔴 v4.19: เลิกตัดข้อความเช็คลิสต์ที่ 2 บรรทัด (Surat แจ้ง "อ่านไม่ได้")
   เดิมตัดตายตัวแล้วมีคลาส .open ไว้กางออก — แต่คนที่ "แก้ไขได้" (คือเจ้าของงานเกือบทุกคน)
   แตะข้อความแล้วเข้าโหมดแก้ไขแทน ไม่มีทางกางเลย → ข้อความยาวอ่านไม่จบตลอดกาล
   รายการย่อยมีไว้อ่านแล้วทำตาม ตัดทิ้งครึ่งเดียวคือทำลายจุดประสงค์ของมันเอง
   เหตุผลเดิมที่ตัด (v2.87) คือข้อความโดนปุ่มเบียดจนเหลือคอลัมน์แคบแล้วตกบรรทัดเป็นพรืด
   ซึ่งย้ายปุ่มลงแถวล่างไปแล้วตั้งแต่ตอนนั้น — ตอนนี้ข้อความได้เต็มความกว้าง ยาวสุดก็ 3-4 บรรทัด
   (คลาส .open/.more ที่เหลือกลายเป็นของว่างเปล่า ไม่มีผลอะไรแล้ว) */
.rf-cl-sub{display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:0}
.rf-cl-sub .rf-cl-ts{flex:1;min-width:60px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rf-cl-sub .rf-cl-ts .ok{min-width:0;flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* v4.12: เช็คลิสต์อ่านยาก สีเทากลืนพื้น (Surat สั่ง · ดูทุกหน้าที่มีเช็คลิสต์)
   ต้นเหตุไม่ใช่ตัว --muted (ผ่าน 5.2:1 อยู่แล้ว) แต่เป็น `opacity` ที่ไปคูณทับอีกชั้น
   .55 → เหลือ ~2.2:1 · .75 → ~2.9:1 ทั้งคู่ต่ำกว่าเกณฑ์อ่านออก โดยเฉพาะตัวหนังสือ 11px
   → ตัด opacity ออกจากทุกตัวที่เป็น "ตัวหนังสือ" · เหลือไว้เฉพาะไอคอนปุ่ม (ยกจาก .55 → .85) */
.rf-cl-n{flex-shrink:0;font-size:14.5px;line-height:1.5;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.rf-cl-n.done{color:var(--muted)}
.rf-cl-t{flex:1;font-size:14.5px;line-height:1.5;min-width:0;word-break:break-word}
.rf-cl-t.done{color:var(--muted)}
.rf-cl-ts{font-size:11.5px;color:var(--muted);line-height:1.35}
.rf-cl-ts.done{color:var(--green);display:flex;align-items:center;gap:3px}
.rf-cl-ts.done svg{flex-shrink:0}
.rf-cl-del{width:28px;height:28px;border:none;border-radius:8px;background:none;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;opacity:.85}
.rf-cl-del:hover{background:var(--red-soft);color:var(--red);opacity:1}
.rf-sysline{text-align:center;font-size:12.5px;color:var(--muted);padding:1px 8px;line-height:1.55}
.rf-revbanner{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:10px 16px;border-radius:14px;border:1.5px solid var(--amber);background:var(--amber-soft);color:var(--amber);font-size:14.5px;font-weight:700;cursor:pointer;text-align:left;box-sizing:border-box}
.rf-revbanner:active{transform:scale(.99)}
.rf-duechip{font-size:13px;font-weight:600;padding:3px 9px;border-radius:8px;white-space:nowrap}
.rf-row{display:flex;align-items:center;gap:11px;min-height:52px;padding:8px;border:none;border-radius:10px;background:none;cursor:pointer;text-align:left;width:100%;box-sizing:border-box}
.rf-row:hover{background:var(--surface2)}
.rf-row .t1{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rf-row .t2{display:flex;align-items:center;gap:7px;min-width:0;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden}
.rf-row .t2 .nm{min-width:0;overflow:hidden;text-overflow:ellipsis}
.rf-spill{flex-shrink:0;font-size:11.5px;font-weight:800;padding:2px 9px;border-radius:99px;line-height:1.45}
.rf-rchip{flex-shrink:0;display:inline-flex;align-items:center;gap:3px;font-size:12.5px;font-weight:600;opacity:.85}
/* ── โหมดการ์ด: ใช้กับลิสต์ที่อยู่บนพื้นหน้า (งานของฉัน / ป๊อปอัป) ให้มีมิติ · ลิสต์ที่อยู่ในการ์ดอยู่แล้ว (แดชบอร์ด) คงแบบเรียบ ── */
.rf-list .rf-row{position:relative;overflow:hidden;min-height:60px;padding:11px 13px 11px 17px;margin-bottom:9px;border:1px solid var(--border);border-radius:14px;background:var(--surface);box-shadow:0 1px 2px rgba(15,23,42,.06);transition:transform .14s ease,box-shadow .14s ease,border-color .14s}
.rf-list .rf-row::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--rc,var(--slate))}
.rf-list .rf-row:hover{background:var(--surface);transform:translateY(-1px);box-shadow:0 7px 18px rgba(15,23,42,.11);border-color:var(--rc,var(--accent))}
.rf-list .rf-row:active{transform:translateY(0);box-shadow:0 1px 2px rgba(15,23,42,.06)}
.rf-list .rf-row.isdone{opacity:.72}
.rf-list .rf-row.isdone .t1{color:var(--muted)}
body.dark .rf-list .rf-row{box-shadow:0 1px 3px rgba(0,0,0,.4)}
body.dark .rf-list .rf-row:hover{box-shadow:0 8px 20px rgba(0,0,0,.5)}
.rf-viewall{margin-top:8px;min-height:42px;width:100%;border-radius:11px;border:1.5px dashed var(--border);background:none;color:var(--accent-ink);font-size:13.5px;font-weight:700;cursor:pointer}
.rf-viewall:hover{background:var(--accent-soft);border-color:var(--accent)}
.rf-empty{text-align:center;padding:28px 12px;color:var(--muted);font-size:14px}
.rf-skel{border-radius:14px;background:linear-gradient(90deg,var(--surface2) 25%,var(--border) 37%,var(--surface2) 63%);background-size:300% 100%;animation:shimmer 1.3s infinite}
.rf-banner{display:inline-flex;align-items:center;gap:8px;background:var(--accent-soft);color:var(--accent-ink);border:1px solid var(--accent);border-radius:999px;padding:6px 8px 6px 14px;font-size:13.5px;font-weight:600;min-width:0;flex-shrink:0}
.rf-banner .lbl{min-width:0;max-width:180px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rf-banner button{width:22px;height:22px;border:none;border-radius:50%;background:var(--accent);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}

/* ── dashboard ── */
.rf-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.rf-stat{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;box-shadow:var(--shadow)}
.rf-stat .l{font-size:13px;font-weight:600;color:var(--muted)}
.rf-stat .v{font-size:30px;font-weight:700;line-height:1.25;font-variant-numeric:tabular-nums}
.rf-stat .s{font-size:13px;color:var(--muted)}
button.rf-stat{cursor:pointer;text-align:left;font:inherit;color:inherit;position:relative;transition:border-color .12s,transform .08s,box-shadow .12s}
button.rf-stat:hover{border-color:var(--accent);box-shadow:0 5px 16px rgba(0,0,0,.10)}
button.rf-stat:active{transform:scale(.985)}
button.rf-stat::after{content:'›';position:absolute;top:9px;right:14px;font-size:22px;line-height:1;color:var(--muted);opacity:.4}
.rf-dashgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:14px;align-items:stretch}
.rf-dashcol{display:flex;flex-direction:column;gap:14px;min-width:0}
.rf-wlgroup{border:1px solid var(--border);border-radius:12px;overflow:hidden}
.rf-wlhead{display:flex;align-items:center;gap:10px;min-height:52px;padding:8px 12px;border:none;background:none;cursor:pointer;text-align:left;width:100%;box-sizing:border-box}
.rf-wlhead:hover{background:var(--surface2)}
.rf-wlhead svg{transition:transform .18s;flex-shrink:0}
.rf-bar{position:relative;height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.rf-bar>div{position:absolute;left:0;top:0;bottom:0;border-radius:99px;transition:width .6s cubic-bezier(.22,1,.36,1)}
.rf-wlrow{display:flex;align-items:center;gap:12px;min-height:46px;padding:6px 8px;border:none;border-radius:10px;background:none;cursor:pointer;text-align:left;width:100%;box-sizing:border-box}
.rf-wlrow:hover{background:var(--surface2)}
.rf-feedrow{display:flex;align-items:flex-start;gap:11px;padding:10px 8px;border:none;border-radius:10px;background:none;cursor:pointer;text-align:left;width:100%;min-height:52px;box-sizing:border-box}
.rf-feedrow:hover{background:var(--surface2)}
.rf-bars7{display:flex;align-items:flex-end;gap:6px;height:112px;margin-top:10px}
.rf-bars7 .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;height:100%;justify-content:flex-end}
.rf-bars7 .bar{width:100%;max-width:26px;border-radius:6px 6px 3px 3px;transition:height .5s cubic-bezier(.22,1,.36,1)}
.rf-barcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;height:100%;justify-content:flex-end;border:none;background:none;cursor:pointer;padding:0}
.rf-barcol .bar{width:100%;max-width:26px;border-radius:6px 6px 3px 3px;transition:height .5s cubic-bezier(.22,1,.36,1)}
.rf-barcol:hover .bar{filter:brightness(1.12)}
.rf-legrow{display:flex;align-items:center;gap:9px;border:none;background:none;cursor:pointer;padding:5px 6px;border-radius:9px;width:100%;min-height:42px}
.rf-legrow:hover{background:var(--surface2)}
.rf-cardex-tog{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;margin-top:9px;padding:6px 0 2px 0;border:none;border-top:1px solid var(--border);background:none;color:var(--muted);font-size:12.5px;font-weight:600;cursor:pointer}
.rf-cardex-tog svg{transition:transform .18s}
.rf-cardex{margin-top:7px;display:flex;flex-direction:column;gap:8px;animation:fadeUp .18s ease-out}
.rf-cardcl{display:flex;flex-direction:column;gap:3px}
.rf-cardcl-i{display:flex;align-items:center;gap:7px;font-size:13px}
.rf-cardcl-b{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;padding:0;cursor:pointer}
.rf-cardcl-b.on{background:var(--green);border-color:var(--green)}
.rf-cardcl-i .done{color:var(--muted)}
.rf-cardbc{display:flex;align-items:flex-start;gap:8px;background:var(--surface2);border-radius:10px;padding:8px 10px}
.rf-cardbc .nm{font-size:12px;font-weight:700;color:var(--accent-ink)}
.rf-cardbc .tx{font-size:13px;line-height:1.45;margin-top:1px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

/* ── board ── */
.rf-board-pc{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
.rf-col{background:var(--surface2);border-radius:14px;padding:10px;outline:2px dashed transparent;outline-offset:-2px;transition:outline-color .15s;min-height:220px;min-width:0}
.rf-col.over{outline-color:var(--accent)}
.rf-colhead{display:flex;align-items:center;gap:8px;padding:4px 6px 10px 6px}
.rf-colhead .dot{width:9px;height:9px;border-radius:50%}
.rf-colhead .lb{font-size:14px;font-weight:700}
.rf-colhead .ct{font-size:13px;font-weight:600;color:var(--muted);background:var(--surface);border-radius:99px;padding:1px 8px}
.rf-fsel{height:30px;border:1.5px solid var(--border);border-radius:9px;background:var(--surface);color:var(--text);font-size:12.5px;font-weight:600;padding:0 8px;cursor:pointer;max-width:46vw;font-family:inherit}
.rf-scope{display:flex;border:1.5px solid var(--border);border-radius:99px;overflow:hidden;flex-shrink:0}
.rf-scope button{border:none;background:var(--surface);color:var(--muted);font-size:12.5px;font-weight:800;padding:0 14px;height:32px;cursor:pointer;font-family:inherit;white-space:nowrap}
.rf-scope button.on{background:var(--accent);color:#fff}
.rf-wchips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.rf-wchip{height:30px;padding:0 12px;border-radius:99px;border:1.5px solid var(--border);background:var(--surface);color:var(--muted);font-size:12.5px;font-weight:800;cursor:pointer;font-family:inherit;white-space:nowrap;line-height:1}
.rf-wchip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.rf-wchip:active{transform:scale(.96)}
.rf-wfilter{display:flex;gap:6px;align-items:center}
.rf-wdd{position:relative}
.rf-wddbtn{height:30px;padding:0 11px;border-radius:99px;border:1.5px solid var(--border);background:var(--surface);color:var(--muted);font-size:12.5px;font-weight:800;cursor:pointer;font-family:inherit;white-space:nowrap;line-height:1;display:inline-flex;align-items:center;gap:5px}
.rf-wddbtn.on{border-color:var(--accent);color:var(--accent-ink);background:var(--accent-soft)}
.rf-wddbtn .cv{font-size:10px}
.rf-wddbg{position:fixed;inset:0;z-index:40}
.rf-wddpanel{position:absolute;top:36px;right:0;z-index:41;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-lg);padding:6px;min-width:150px;display:flex;flex-direction:column;gap:2px;animation:fadeUp .14s ease-out}
.rf-wddopt{display:flex;align-items:center;gap:9px;height:38px;padding:0 10px;border:none;background:none;border-radius:8px;cursor:pointer;font-family:inherit;font-size:14px;font-weight:700;color:var(--text);text-align:left}
.rf-wddopt:hover{background:var(--surface2)}
.rf-wddopt.on{background:var(--accent-soft)}
.rf-wddopt .dot{width:11px;height:11px;border-radius:50%;flex-shrink:0}
.rf-wddopt .wn{flex:1}
.rf-wddopt .ck{color:var(--accent-ink);font-weight:900}
.rf-closedchip{height:30px;padding:0 11px;border-radius:99px;border:1.5px solid var(--border);background:var(--surface);color:var(--muted);font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap;line-height:1;flex-shrink:0}
.rf-closedchip:hover{background:var(--surface2);color:var(--green);border-color:var(--green)}
.rf-closedchip.can:hover{color:var(--red);border-color:var(--red)}
.rf-closedchip.ho:hover{color:var(--accent-ink);border-color:var(--accent)}
.rf-closedchip.ho.on{background:var(--accent);border-color:var(--accent);color:#fff}
/* v3.4: ตัวกรองแผน (ยังไม่จบ · เลยกำหนด · จบแล้ว · ทั้งหมด) */
/* v4.17: หัวหน้าแผนเคยกิน 5 บรรทัด (หัวข้อ · ปุ่มสร้าง · ชิปขอบเขต · ชิปสถานะ · ตัวกรอง)
   ทั้งที่ของจริงคือ "ตัวเลือก 5 ตัว + ปุ่ม 1 ปุ่ม" — ยุบเป็นแถบเดียว (Surat สั่ง)
   ชิป 2 แถวกลายเป็น dropdown 2 ตัว (ตัวเลือกมี 3-4 ตัว ใส่จำนวนไว้ในชื่อ ข้อมูลไม่หาย)
   จอกว้าง = บรรทัดเดียวจริง · จอแคบ = ตัดบรรทัดเองตามที่ว่าง ไม่ล้นขอบ */
.rf-plantool{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:2px 0 12px}
.rf-plantool .ttl{font-size:20px;font-weight:800;flex-shrink:0;line-height:1.2}
.rf-plantool .sub{font-size:12.5px;color:var(--muted);font-weight:600;flex-shrink:0}
.rf-plantool .sp{flex:1 1 auto;min-width:0}
.rf-plantool .newbtn{flex-shrink:0;height:32px;border:none;border-radius:10px;background:var(--accent);color:#fff;font-family:inherit;font-size:13px;font-weight:800;padding:0 14px;cursor:pointer;white-space:nowrap}
.rf-plantool .newbtn:hover{filter:brightness(1.08)}
.rf-plantool .rf-fsel{max-width:none}
.rf-plantool .rf-fsel.scope{border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.rf-plantool .rf-fsel.stat{border-color:var(--purple);color:var(--purple);font-weight:700}
.rf-plantool .clr{flex-shrink:0;height:30px;border:1.5px solid var(--border);border-radius:9px;background:var(--surface);color:var(--muted);font-family:inherit;font-size:12.5px;font-weight:700;padding:0 10px;cursor:pointer;white-space:nowrap}
.rf-planchips{display:flex;gap:7px;overflow-x:auto;padding-bottom:2px;margin-bottom:12px;-webkit-overflow-scrolling:touch}
.rf-planchips .rf-closedchip:hover{color:var(--purple);border-color:var(--purple)}
.rf-planchips .rf-closedchip.on{background:var(--purple);border-color:var(--purple);color:#fff}
/* v3.7: แถวบน = ของใคร (แผนเรา/ทีมอื่น) · แถวล่าง = สถานะ — คนละสีจะได้ไม่สับสนว่ากดอันไหนอยู่ */
.rf-planchips.scope{margin-bottom:8px}
.rf-planchips.scope .rf-closedchip:hover{color:var(--accent-ink);border-color:var(--accent)}
.rf-planchips.scope .rf-closedchip.on{background:var(--accent);border-color:var(--accent);color:#fff}
@media(max-width:400px){.rf-planchips .rf-closedchip{font-size:11.5px;padding:0 9px}}   /* 4 ชิปให้พอดีจอแคบ ไม่ต้องเลื่อนหา */
.rf-modeseg2{display:flex;gap:8px;margin-bottom:14px}
.rf-modeseg2 button{flex:1;height:42px;border:1.5px solid var(--border);background:var(--surface);color:var(--muted);font-size:14.5px;font-weight:700;border-radius:12px;cursor:pointer;font-family:inherit}
.rf-modeseg2 button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink)}
/* v3.4: 3 ปุ่ม (งานใหม่ · ฝากของ · แผน) — บีบให้ยังอยู่บรรทัดเดียวที่จอ 375px */
.rf-modeseg2.three button{font-size:13px;padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
@media(max-width:360px){.rf-modeseg2.three button{font-size:12px}}
.rf-hnote{font-size:12.5px;color:var(--muted);background:var(--surface2);border-radius:10px;padding:9px 12px;line-height:1.5;margin-bottom:4px}
.rf-itemchips{display:flex;flex-wrap:wrap;gap:8px}
.rf-itemchip{padding:8px 14px;border:1.5px solid var(--border);background:var(--surface);color:var(--text);font-size:14px;font-weight:600;border-radius:99px;cursor:pointer;font-family:inherit}
.rf-itemchip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink)}
.rf-chipn{display:inline-block;min-width:20px;padding:0 6px;margin-left:2px;border-radius:99px;background:var(--slate-soft);color:var(--muted);font-size:12.5px;font-weight:800;line-height:19px;text-align:center}
.rf-itemchip.on .rf-chipn{background:var(--accent);color:#fff}
/* ชิปหน้า "งานของฉัน" — บรรทัดเดียวเสมอ เลื่อนแนวนอนถ้าไม่พอ (เดิม wrap 2 แถวบนมือถือ กินที่ฟรี) */
.rf-mwchips{flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;gap:8px;margin:10px -14px 12px;padding:2px 14px 4px;
  scrollbar-width:none;-ms-overflow-style:none;-webkit-overflow-scrolling:touch}
.rf-mwchips::-webkit-scrollbar{display:none}
.rf-mwchips > *{flex-shrink:0}
@media (max-width:840px){
  .rf-mwchips .rf-itemchip{padding:7px 12px;font-size:13.5px}
  .rf-mwchips .rf-fsel{height:36px;min-height:36px;font-size:13px}
}
.rf-kcard{background:var(--surface);border-radius:12px;padding:11px 12px 10px 12px;box-shadow:var(--shadow);cursor:pointer;border-top:3px solid var(--slate);transition:box-shadow .15s,transform .15s,opacity .15s;min-width:0}
.rf-kcard:hover{box-shadow:var(--shadow-lg);transform:translateY(-1px)}
.rf-kcard:active{transform:scale(.985)}
/* v4.0: ชื่องานเป็นของที่ต้องอ่านก่อน — ใหญ่และหนากว่าทุกอย่างบนการ์ด
   กำหนดส่ง + เช็คลิสต์ ย้ายมาอยู่บรรทัดเดียวกับชื่อ (ชิดขวา) แทนที่จะกินอีกแถวข้างล่าง */
.rf-khead{display:flex;align-items:flex-start;gap:10px;min-width:0}
.rf-khead .tt{flex:1;min-width:0;font-size:16.5px;font-weight:800;line-height:1.35;letter-spacing:-.2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rf-kside{display:flex;align-items:center;gap:6px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end;max-width:52%}
.rf-kmeta{margin-top:8px}
.rf-kwho{display:flex;align-items:center;gap:8px;min-width:0}
/* ชื่อคนเป็นข้อมูลรอง — เบากว่าชื่องาน ไม่แย่งสายตา (บนบอร์ดที่กรองคนเดียว ชื่อซ้ำทุกใบอยู่แล้ว) */
.rf-kwho .nm{font-size:12.5px;font-weight:600;color:var(--muted);line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rf-kwho .sub{display:flex;align-items:center;gap:6px;margin-top:2px;min-width:0}
.rf-kwho .sub .dp{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.rf-kcard.drag{opacity:.35}
.rf-cc{display:flex;align-items:center;gap:4px;color:var(--muted);font-size:13px;font-weight:600}
.rf-kempty{border:1.5px dashed var(--border);border-radius:12px;padding:22px 12px;text-align:center;color:var(--muted);font-size:13.5px}
/* แถบสถานะ (รอทำ/กำลังทำ/รอตรวจ) บนมือถือ — ตัว sticky ต้องเป็น "ตัวห่อ" ที่พื้นหลังทึบเต็มความกว้าง
   ถ้าให้ .rf-seg sticky เองจะเห็นการ์ดวิ่งทะลุช่องว่างซ้าย-ขวาและมุมโค้ง */
.rf-segwrap{position:sticky;top:calc(var(--headh,58px) + 52px);z-index:29;background:var(--bg);margin:0 -14px;padding:6px 14px 8px;box-shadow:0 8px 10px -8px rgba(18,28,38,.16)}
.rf-seg{display:flex;background:var(--surface2);border-radius:13px;padding:4px;gap:3px}
.rf-seg button{flex:1;min-height:44px;border:none;border-radius:10px;cursor:pointer;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;transition:background .18s}
.rf-seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.rf-seg .sl{font-size:13px;font-weight:700;line-height:1.2}
.rf-seg .sc{font-size:12.5px;font-weight:600;opacity:.75;line-height:1.2;font-variant-numeric:tabular-nums}
/* v4.1: แถวงานที่ยังไม่กดรับ + ปุ่มโทรทวง */
.rf-callrow{display:flex;align-items:center;gap:8px;min-width:0}
.rf-callrow > .rf-row{flex:1;min-width:0}
.rf-callbtn{width:42px;height:42px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--green-soft);color:var(--green);border:1.5px solid var(--green);text-decoration:none;cursor:pointer;transition:transform .12s}
.rf-callbtn:hover{background:var(--green);color:#fff}
.rf-callbtn:active{transform:scale(.9)}
.rf-callbtn.off{background:var(--surface2);color:var(--muted);border-color:var(--border);cursor:default;opacity:.55}
.rf-callbtn.off:hover{background:var(--surface2);color:var(--muted)}
.rf-mcard{background:var(--surface);border-radius:13px;padding:13px 14px 12px 14px;box-shadow:var(--shadow);cursor:pointer;border-top:3px solid var(--slate)}
.rf-mcard:active{transform:scale(.985)}
.rf-mcard .rf-khead .tt{font-size:16.5px}   /* มือถือใช้หัวการ์ดชุดเดียวกับบอร์ด PC */

/* ── calendar ── */
.rf-calbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rf-calnav{width:38px;height:38px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center}
.rf-calnav:hover{background:var(--surface2)}
.rf-todaybtn{min-height:38px;padding:0 15px;border-radius:10px;border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent-ink);font-size:13.5px;font-weight:700;cursor:pointer}
.rf-modeseg{display:flex;background:var(--surface2);border-radius:11px;padding:3px;gap:2px}
.rf-modeseg button{min-height:38px;padding:0 16px;border:none;border-radius:9px;cursor:pointer;font-size:13.5px;font-weight:600;background:transparent;color:var(--muted)}
.rf-modeseg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.rf-calgrid7{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.rf-dow{text-align:center;font-size:13px;font-weight:600;color:var(--muted);padding:6px 0}
.rf-day{border-radius:10px;border:1.5px solid var(--border);background:var(--surface);cursor:pointer;padding:5px;display:flex;flex-direction:column;align-items:stretch;gap:3px;overflow:hidden;text-align:left}
.rf-day:hover{border-color:var(--accent)}
.rf-day.sel{background:var(--accent-soft);border-color:var(--accent)}
.rf-day .num{width:24px;height:24px;border-radius:50%;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;margin:0 auto}
.rf-day .num.today{background:var(--accent);color:#fff}
.rf-daychip{display:flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;padding:2px 6px;border-radius:6px;cursor:pointer;transition:filter .12s}
.rf-daychip:hover{filter:brightness(.94)}
.rf-daychip:hover .tx{text-decoration:underline}
.rf-daychip .st{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.rf-daychip .tx{min-width:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rf-daychip.done{opacity:.78}
.rf-daychip.done .tx{opacity:.85}
/* คำอธิบายสีปฏิทิน — บรรทัดเดียวเสมอ เลื่อนแนวนอนถ้าไม่พอ (เดิม wrap 2 แถวบนมือถือ) */
.rf-callegend{display:flex;flex-wrap:nowrap;overflow-x:auto;gap:6px;padding:0 14px 10px;margin:0 -14px;
  scrollbar-width:none;-ms-overflow-style:none;-webkit-overflow-scrolling:touch}
.rf-callegend::-webkit-scrollbar{display:none}
.rf-callegend > *{flex-shrink:0}
.rf-leg{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:7px;font-size:12px;font-weight:700;white-space:nowrap}
.rf-leg .d{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.rf-dotcount{position:relative;min-width:18px;height:18px;border-radius:9px;color:#fff;font-size:12.5px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px;margin:0 auto}
.rf-dotcount.done{background:var(--green-soft);color:var(--green)}
.rf-dotcount .dn{position:absolute;right:-3px;top:-3px;width:7px;height:7px;border-radius:50%;background:var(--green);border:1.5px solid var(--surface)}
.rf-wkcol{border-radius:13px;padding:8px;min-height:150px;min-width:0;display:flex;flex-direction:column;gap:7px;background:var(--surface2)}
.rf-wkcol.today{background:var(--accent-soft)}
.rf-wkcard{border:none;background:var(--surface);border-radius:11px;padding:9px 10px;box-shadow:var(--shadow);cursor:pointer;text-align:left;border-left:3px solid var(--slate);min-width:0;transition:box-shadow .15s,transform .15s}
.rf-wkcard:hover{box-shadow:var(--shadow-lg);transform:translateY(-1px)}
.rf-mwkday{border-radius:14px;padding:12px 14px;background:var(--surface2)}
.rf-mwkday.today{background:var(--accent-soft)}
.rf-mwkrow{display:flex;align-items:center;gap:10px;min-height:50px;padding:7px 8px;border:none;border-radius:11px;background:var(--surface);box-shadow:var(--shadow);cursor:pointer;text-align:left;width:100%;margin-top:7px;box-sizing:border-box}
.rf-mwkrow:active{transform:scale(.985)}
.rf-prio-line{width:4px;height:32px;border-radius:4px;flex-shrink:0}
.rf-todaypill{font-size:12.5px;font-weight:700;background:var(--accent);color:#fff;border-radius:99px;padding:1px 9px}

/* ── team ── */
.rf-teamgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:14px}
.rf-teamcard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px;box-shadow:var(--shadow);cursor:pointer;text-align:left;transition:box-shadow .15s,transform .15s}
.rf-teamcard:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px)}
.rf-teamcard:active{transform:scale(.985)}
.rf-minichips{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px}
.rf-minichip{font-size:12.5px;font-weight:600;padding:2px 8px;border-radius:7px;white-space:nowrap}
.rf-backbtn{display:inline-flex;align-items:center;gap:7px;min-height:40px;padding:0 14px 0 10px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--muted);font-size:14px;font-weight:600;cursor:pointer}
.rf-backbtn:hover{background:var(--surface2)}

/* ── bottom nav + fab (mobile) ── */
.rf-bnav{position:fixed;left:0;right:0;bottom:var(--vvgap,0px);z-index:50;background:var(--surface);border-top:1px solid var(--border);display:flex;padding-bottom:env(safe-area-inset-bottom);transition:bottom .18s ease}
.rf-bnav button{position:relative;flex:1;height:60px;border:none;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted)}
.rf-navdot{position:absolute;top:7px;left:50%;margin-left:4px;min-width:17px;height:17px;padding:0 4px;border-radius:99px;background:var(--accent);color:#fff;font-size:10.5px;font-weight:800;display:flex;align-items:center;justify-content:center;line-height:1;box-shadow:0 0 0 2px var(--surface);pointer-events:none}
.rf-bnav button.on{color:var(--accent-ink)}
.rf-bnav span{font-size:12.5px;font-weight:600}
/* v2.99: 6 ปุ่ม — บีบให้พอดีจอแคบโดยยังกดถนัด (ปุ่มสูงเท่าเดิม) */
.rf-bnav.six button{gap:2px}
.rf-bnav.six span{font-size:11px;letter-spacing:-.2px}
@media(max-width:360px){.rf-bnav.six span{font-size:10px}}
.rf-fab{position:fixed;right:16px;bottom:calc(78px + var(--vvgap,0px) + env(safe-area-inset-bottom));z-index:50;width:56px;height:56px;border-radius:50%;border:none;background:var(--accent);color:#fff;cursor:pointer;box-shadow:0 6px 20px var(--accent-glow);display:flex;align-items:center;justify-content:center;transition:transform .15s,bottom .18s ease}
.rf-fab:active{transform:scale(.92)}

/* ── overlays: detail / form / popup ── */
.rf-ov{position:fixed;inset:0;background:rgba(10,16,20,.45);z-index:var(--z-ov-detail);display:flex;animation:fadeIn .2s;transition:opacity .2s}
.rf-ov.closing{opacity:0}
.rf-ov.bottom{align-items:flex-end}
.rf-ov.right{justify-content:flex-end}
.rf-ov.center{align-items:center;justify-content:center;padding:24px}
.rf-sheet{width:100%;height:90vh;height:90dvh;max-height:90dvh;background:var(--surface);border-radius:20px 20px 0 0;display:flex;flex-direction:column;animation:sheetUp .32s cubic-bezier(.32,.72,.33,1);box-sizing:border-box;transition:transform .22s ease-in}
.rf-ov.closing .rf-sheet{transform:translateY(100%)}
.rf-panel{width:480px;max-width:94vw;height:100%;background:var(--surface);display:flex;flex-direction:column;box-shadow:var(--shadow-lg);animation:panelIn .24s ease-out;box-sizing:border-box;transition:transform .2s,opacity .2s}
.rf-ov.closing .rf-panel{transform:translateX(40px);opacity:0}
.rf-modal{background:var(--surface);border-radius:18px;display:flex;flex-direction:column;box-shadow:var(--shadow-lg);animation:popIn .22s ease-out;box-sizing:border-box;max-height:90vh;max-height:90dvh}
.rf-sheet.formsheet{height:auto;max-height:92dvh}
/* v4.12: หัวข้อเคยชิดขอบบนจนอึดอัด (Surat สั่ง) — บน PC ไม่มีแถบจับ ชื่องานเลยเริ่มที่ 10px พอดี
   ยกเป็น 17px ทั้งคู่ · มือถือมีแถบจับ 4px + margin 6px ต่อท้ายอยู่แล้ว รวมแล้วยังหายใจได้ */
.rf-dhead{padding:17px 16px 13px 18px;border-bottom:1px solid var(--border);flex-shrink:0}
.rf-grab{width:38px;height:4px;border-radius:99px;background:var(--border);margin:0 auto 6px auto}
.rf-dh-titlerow{display:flex;align-items:flex-start;gap:8px}
.rf-dh-title{margin:0;flex:1;min-width:0;font-size:18px;font-weight:700;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rf-actbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}
.rf-actbar .rf-cta{width:auto;flex:1 1 120px;min-height:42px;font-size:14.5px}
.rf-actbar .rf-cancelbtn{flex:0 0 auto}
.rf-actbar .rf-linebtn{flex:0 0 auto;padding:0 16px}
.rf-actbar .rf-revpair{display:flex;gap:8px;flex:1 1 100%}
.rf-actbar .rf-revpair .rf-cta{flex:1 1 auto}
.rf-actbar .rf-waitnote{flex:1 1 100%}
.rf-dmeta-line{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rf-dmeta-line:empty{display:none}   /* v4.9: ไม่มีป้ายอะไรเลย = ไม่ต้องกินที่ (gap ของ .rf-dbody ยังนับ div ว่างอยู่) */
/* v4.9: "เหลือกี่วัน" มาอยู่ต่อท้ายวันกำหนดส่ง — บรรทัดบนจะได้ว่าง */
.rf-duecell{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;min-width:0}
.rf-remain{font-size:12.5px;font-weight:700;padding:2px 9px;border-radius:8px;white-space:nowrap;flex-shrink:0}
.rf-statuspill{font-size:13px;font-weight:700;padding:4px 11px;border-radius:99px}
/* v4.15: รหัสงานเล็กๆ ในหน้ารายละเอียด (Surat สั่ง) — ผู้ใช้เจอเรื่องแปลกแล้วแคปมาบอกได้ตรงใบ
   เคสจริง 31 ก.ค.: มิกกดงานตัวเองแล้วเปิดงานเฟิร์น กว่าจะรู้ว่าใบไหนต้องไปไล่ในชีทเอง
   แตะแล้วก๊อปได้เลย จะได้พิมพ์ส่งต่อไม่ผิด */
.rf-taskcode{flex-shrink:0;font-size:11px;font-weight:800;letter-spacing:.3px;color:var(--muted);background:var(--surface2);border:1px solid var(--border);border-radius:7px;padding:2px 8px;font-family:inherit;cursor:pointer}
.rf-taskcode:hover{color:var(--accent-ink);border-color:var(--accent-soft)}
.rf-editbtn{display:flex;align-items:center;gap:6px;min-height:38px;padding:0 13px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--muted);font-size:13.5px;font-weight:600;cursor:pointer}
.rf-editbtn:hover{background:var(--surface2)}
.rf-xbtn{width:38px;height:38px;border:none;border-radius:10px;background:var(--surface2);color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.rf-dbody{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:16px;-webkit-overflow-scrolling:touch}
.rf-metagrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;background:var(--surface2);border-radius:14px;padding:14px}
.rf-meta-l{font-size:13px;font-weight:600;color:var(--muted);margin-bottom:5px}
.rf-pills{display:flex;gap:6px;flex-wrap:wrap}
.rf-pill{min-height:40px;padding:0 15px;border-radius:10px;border:1.5px solid var(--border);background:transparent;color:var(--muted);font-size:13.5px;font-weight:600;cursor:pointer;transition:all .15s}
.rf-notebox{background:var(--amber-soft);border-radius:12px;padding:12px 14px}
/* สรุปผลตอนปิดงาน */
.rf-imhint{font-size:13px;color:var(--muted);line-height:1.6;margin:8px 0 2px}
.rf-imgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rf-imunit{position:relative}
.rf-imunit input{padding-right:66px}
.rf-imunit span{position:absolute;right:13px;top:50%;transform:translateY(-50%);font-size:12.5px;font-weight:700;color:var(--muted);pointer-events:none}
.rf-imcard{background:var(--green-soft);border-left:4px solid var(--green);border-radius:12px;padding:12px 14px}
.rf-imcard .h{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--green);margin-bottom:5px}
.rf-imcard .h button{margin-left:auto;border:none;background:none;color:var(--green);font-weight:700;font-size:12.5px;cursor:pointer;font-family:inherit;padding:2px 4px}
.rf-imcard .txt{font-size:14px;line-height:1.6;white-space:pre-wrap}
.rf-immetrics{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}
.rf-immetric{background:var(--surface);color:var(--green);border-radius:9px;padding:6px 10px;font-size:12.5px;font-weight:700}
.rf-immetric.dept{color:var(--blue)}
/* ── v2.82: เป้าหมาย · รูปแนบ · เมนู ⋯ · เช็คลิสต์ในฟอร์ม ── */
.rf-goalbox{background:var(--accent-soft);border-left:4px solid var(--accent);border-radius:12px;padding:11px 13px}
.rf-goalbox .h{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:800;color:var(--accent-ink);margin-bottom:4px}
.rf-goalbox .h button{margin-left:auto;border:none;background:none;color:var(--accent-ink);font-weight:700;font-size:12.5px;cursor:pointer;font-family:inherit;padding:2px 4px}
.rf-goalbox .v{font-size:14px;font-weight:700;line-height:1.5}
.rf-goalbox .d{font-size:13.5px;color:var(--muted);line-height:1.55;margin-top:3px}
.rf-goalbox .pc{margin-top:8px;background:var(--surface);border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:800;color:var(--green)}
.rf-goalchips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.rf-goalchip{background:var(--accent-soft);color:var(--accent-ink);border-radius:8px;padding:2px 8px;font-size:11.5px;font-weight:800;white-space:nowrap}
.rf-imgpick{display:flex;flex-wrap:wrap;gap:8px}
.rf-imgthumb{position:relative;width:66px;height:66px;border-radius:11px;overflow:hidden;background:var(--surface2);flex-shrink:0}
.rf-imgthumb img{width:100%;height:100%;object-fit:cover;display:block}
.rf-imgthumb button{position:absolute;top:2px;right:2px;width:20px;height:20px;border:none;border-radius:50%;background:rgba(15,23,42,.72);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.rf-imgadd{width:66px;height:66px;border-radius:11px;border:1.5px dashed var(--border);background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:11.5px;font-weight:700;cursor:pointer;font-family:inherit;flex-shrink:0}
.rf-imgadd:hover{border-color:var(--accent);color:var(--accent-ink)}
.rf-imghint{font-size:12px;color:var(--muted);margin-top:7px}
.rf-imgsec{display:flex;flex-direction:column;gap:10px}
.rf-imgrow .lb{font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:5px}
.rf-imgrow.done .lb{color:var(--green)}
.rf-imgrow .ims{display:flex;flex-wrap:wrap;gap:7px}
.rf-imgrow img{width:76px;height:76px;object-fit:cover;border-radius:11px;display:block;border:1px solid var(--border)}
.rf-moremenu{position:relative;flex-shrink:0}
.rf-morebtn{width:34px;height:34px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--muted);font-size:17px;font-weight:800;line-height:1;cursor:pointer;font-family:inherit}
.rf-morebg{position:fixed;inset:0;z-index:60}
.rf-morepanel{position:absolute;right:0;top:40px;z-index:61;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-lg);padding:5px;min-width:186px;display:flex;flex-direction:column;gap:1px}
.rf-morepanel button{display:flex;align-items:center;gap:8px;width:100%;padding:10px 11px;border:none;background:none;border-radius:9px;font-family:inherit;font-size:13.5px;font-weight:600;color:var(--text);cursor:pointer;text-align:left}
.rf-morepanel button:hover{background:var(--surface2)}
.rf-morepanel button.danger{color:var(--red)}
.rf-detailmodal{width:720px;max-width:100%;height:min(86vh,860px)}
.rf-newclmid{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.rf-newclbtns{display:flex;flex-wrap:wrap;gap:6px}
.rf-newclx{width:26px;height:26px;border:none;border-radius:8px;background:none;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.rf-cl-due{border:1.4px solid var(--border);background:var(--surface);border-radius:99px;padding:2px 9px;font-size:11.5px;font-weight:700;color:var(--muted);cursor:pointer;font-family:inherit;white-space:nowrap;flex-shrink:0}
.rf-cl-due.on{border-color:var(--amber);background:var(--amber-soft);color:var(--amber)}
.rf-cl-due.on.over{border-color:var(--red);background:var(--red-soft);color:var(--red)}
.rf-cl-due:disabled{cursor:default}
/* v2.90: หัวกอง "ยังไม่ทำ / ทำแล้ว" + ปุ่มกางส่วนที่พับไว้ */
.rf-clgrp{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:800;color:var(--muted);letter-spacing:.2px;padding:9px 2px 5px;border-bottom:1px solid var(--border);white-space:nowrap}
.rf-clgrp:first-child{padding-top:2px}
.rf-clgrp .n{background:var(--surface2);border-radius:7px;padding:1px 7px;font-size:11px}
.rf-clgrp.done{color:var(--green)}
.rf-clgrp.done .n{background:var(--green-soft);color:var(--green)}
.rf-clmore{width:100%;border:none;background:none;color:var(--accent-ink);font-family:inherit;font-size:12.5px;font-weight:800;padding:9px 0;cursor:pointer;border-bottom:1px solid var(--border)}
.rf-clmore:hover{background:var(--surface2)}
/* v3.1: แท็บกลางของกลุ่ม "งาน" (แผน · ของฉัน · ทีม) */
.rf-worktabs{display:flex;gap:5px;background:var(--surface2);border-radius:12px;padding:4px;margin-bottom:14px}
.rf-worktabs button{flex:1;min-width:0;border:none;background:none;font-family:inherit;font-size:13.5px;font-weight:800;color:var(--muted);padding:9px 4px;border-radius:9px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;justify-content:center;gap:5px;min-height:42px}
.rf-worktabs button.on{background:var(--surface);color:var(--accent-ink);box-shadow:var(--shadow)}
.rf-worktabs button .n{background:var(--surface2);color:var(--muted);border-radius:99px;padding:1px 7px;font-size:11px;font-weight:800}
.rf-worktabs button.on .n{background:var(--accent);color:#fff}
/* v2.98: รายชื่อคนในป๊อปงานที่เสร็จแล้ว */
.rf-donepeople{display:flex;flex-direction:column;gap:8px}
.rf-donepr{display:flex;align-items:center;gap:11px;width:100%;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:10px 12px;cursor:pointer;min-height:60px}
.rf-donepr:hover{border-color:var(--accent);background:var(--accent-soft)}
.rf-donepr.me{border-color:var(--accent);background:var(--accent-soft)}
.rf-donepr .mid{flex:1;min-width:0}
.rf-donepr .nm{font-size:14.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rf-donepr .nm .tag{background:var(--accent);color:#fff;border-radius:6px;padding:1px 6px;font-size:10.5px;font-weight:800;vertical-align:middle}
.rf-donepr .sb{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rf-donepr .ct{flex-shrink:0;background:var(--green-soft);color:var(--green);border-radius:9px;padding:4px 11px;font-size:15px;font-weight:800}
.rf-donepr svg{flex-shrink:0;color:var(--muted)}
.rf-donewho{display:flex;align-items:center;gap:9px}
.rf-donewho .nm{flex:1;min-width:0;font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rf-donewho .ct{flex-shrink:0;font-size:12.5px;font-weight:800;color:var(--green)}
/* ══ v2.94: แผนบนหน้าภาพรวม · กราฟเทียบเวลา · ผลงานรวมจากแผนที่จบ ══ */
.rf-dashplans{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);padding:12px 14px;margin-top:12px}
.rf-dashplans .hd{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.rf-dashplans .hd .ttl{font-size:14px;font-weight:800;white-space:nowrap}
.rf-dashplans .hd .alert{background:var(--red-soft);color:var(--red);border-radius:8px;padding:2px 8px;font-size:11px;font-weight:800;white-space:nowrap}
.rf-dashplans .hd button{margin-left:auto;border:none;background:none;color:var(--accent-ink);font-family:inherit;font-size:12.5px;font-weight:800;cursor:pointer;white-space:nowrap;padding:2px 0}
.rf-dashplan{display:block;width:100%;text-align:left;font-family:inherit;background:none;border:none;border-left:3px solid var(--purple);border-radius:9px;padding:7px 10px;margin-bottom:6px;cursor:pointer}
.rf-dashplan:last-child{margin-bottom:0}
.rf-dashplan:hover{background:var(--surface2)}
.rf-dashplan.slow{border-left-color:var(--amber)}
.rf-dashplan.late{border-left-color:var(--red)}
.rf-dashplan .nm{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.rf-dashplan .track{position:relative;height:6px;border-radius:99px;background:var(--surface2);margin-top:6px;overflow:visible}
.rf-dashplan .track i{display:block;height:100%;border-radius:99px;background:var(--green)}
.rf-dashplan.late .track i{background:var(--red)}
.rf-dashplan.slow .track i{background:var(--amber)}
.rf-dashplan .track .now{position:absolute;top:-3px;width:2px;height:12px;background:var(--text);opacity:.45;border-radius:2px}
.rf-dashplan .mt{display:flex;align-items:center;gap:8px;margin-top:5px;font-size:11.5px;font-weight:700;color:var(--muted)}
.rf-dashplan .mt .d{margin-left:auto;white-space:nowrap}
.rf-dashplan.late .mt .d{color:var(--red)}
.rf-dashplan.slow .mt .d{color:var(--amber)}
.rf-dashplan .todo{margin-top:4px;font-size:11.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rf-dashplan.late .todo{color:var(--red)}
.rf-dashplan.slow .todo{color:var(--amber)}
/* กราฟคืบหน้าเทียบเวลาในหน้าแผน */
/* ผลงานรวมจากแผนที่จบแล้ว */
.rf-plansum{background:var(--green-soft);border:1px solid #BFE3CE;border-radius:16px;padding:13px 15px;margin-top:16px}
.rf-plansum .h{display:flex;align-items:baseline;gap:8px;font-size:13.5px;font-weight:800;color:var(--green);margin-bottom:9px;flex-wrap:wrap}
.rf-plansum .h span{font-size:11.5px;font-weight:700;color:var(--muted)}
.rf-plansum .rf-plankpi .k{background:var(--surface)}
.rf-plansum.empty{font-size:13px;font-weight:700;color:var(--green);line-height:1.6}
.rf-plansum.empty .s{font-size:12px;font-weight:600;color:var(--muted);margin-top:4px}
/* ══ แผน (Plan) — v2.93 ══ */
.rf-plangrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.rf-plancard{text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--purple);border-radius:15px;box-shadow:var(--shadow);padding:12px 14px;cursor:pointer;display:block;width:100%;transition:transform .12s,box-shadow .12s}
.rf-plancard:hover{transform:translateY(-1px);box-shadow:var(--shadow-lg)}
.rf-plancard .pt{font-weight:800;font-size:15px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rf-plancard .pm{font-size:12px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rf-planbar{height:7px;border-radius:99px;background:var(--surface2);margin-top:10px;overflow:hidden;display:flex}
.rf-planbar i{display:block;height:100%;transition:width .4s cubic-bezier(.22,1,.36,1)}
.rf-plankpi{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}
.rf-plankpi.big{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.rf-plankpi .k{background:var(--surface2);border-radius:10px;padding:7px 9px;min-width:0}
.rf-plankpi .k .v{font-size:15px;font-weight:800;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rf-plankpi .k .l{font-size:11px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rf-plankpi .k.ok .v{color:var(--green)}
.rf-plankpi .k.miss .v{color:var(--red)}
.rf-planhead{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);padding:14px 16px;margin-bottom:14px}
.rf-planhead .hd{display:flex;align-items:center;gap:10px;min-width:0}
.rf-planhead .hd h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rf-planhead .hd .rf-editbtn{margin-left:auto;flex-shrink:0}
.rf-planhead .dt{font-size:13.5px;color:var(--muted);line-height:1.6;margin-top:7px;white-space:pre-wrap}
/* ── v3.5: หัวการ์ดแผนแบบกระชับ (แบบ B) — ยุบ 3 กล่องที่พูดเรื่องเดียวกันเหลือ แถบเดียว + บรรทัดเดียว ── */
.rf-pmeta{display:flex;align-items:center;gap:6px 10px;flex-wrap:wrap;margin-top:5px;font-size:13px;color:var(--muted);font-weight:600;min-width:0}
.rf-pmeta .who{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rf-pmeta .pill{background:var(--surface2);border-radius:99px;padding:2px 9px;font-size:12px;font-weight:800;color:var(--text);white-space:nowrap;flex-shrink:0}
.rf-pmeta .pill.late{background:var(--red-soft);color:var(--red)}
.rf-ptrack{position:relative;margin:13px 0 6px}
.rf-ptrack .bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;display:flex}
.rf-ptrack .bar i{display:block;height:100%;transition:width .4s cubic-bezier(.22,1,.36,1)}
.rf-ptrack .now{position:absolute;top:-3px;width:2px;height:14px;background:var(--text);border-radius:2px;pointer-events:none}
.rf-ptrack .now b{position:absolute;top:-14px;font-size:9.5px;font-weight:800;color:var(--muted);white-space:nowrap}
.rf-punder{display:flex;justify-content:space-between;gap:10px;font-size:11.5px;color:var(--muted);font-weight:700}
.rf-punder span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rf-punder .warnfg{color:var(--amber)}
.rf-punder .latefg{color:var(--red)}
.rf-ptodo{margin-top:7px;background:var(--amber-soft);color:var(--amber);border-radius:9px;padding:6px 10px;font-size:12px;font-weight:800;line-height:1.5}
.rf-pgoal{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--surface2);border-radius:11px;padding:8px 11px;margin-top:11px;font-size:12.5px;font-weight:700;min-width:0}
.rf-pgoal .seg{display:flex;align-items:baseline;gap:5px;white-space:nowrap}
.rf-pgoal .seg .l{color:var(--muted);font-size:11.5px}
.rf-pgoal .seg .v{font-weight:800}
.rf-pgoal .seg .v.ok{color:var(--green)}
.rf-pgoal .dot{color:var(--border);font-weight:800}
.rf-pghint{margin-top:6px;font-size:11.5px;color:var(--muted);font-weight:600;line-height:1.5}
/* v3.6: ป้ายช่วงเวลา/ขอบเขตของแผน — คลังใช้สีตามตารางรหัสคลัง (ไม่มี emoji) */
.rf-ptag{background:var(--surface2);color:var(--muted);border-radius:99px;padding:2px 8px;font-size:11.5px;font-weight:800;white-space:nowrap;flex-shrink:0}
.rf-ptag.wh{background:transparent;color:var(--wc);border:1.5px solid var(--wc);padding:1px 7px}
.rf-ptags{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.rf-pcust{display:flex;align-items:center;gap:7px;margin-top:9px;font-size:12.5px;font-weight:700;color:var(--muted);cursor:pointer}
.rf-pcust input{width:16px;height:16px;accent-color:var(--accent);cursor:pointer;flex-shrink:0}
.rf-plannote{background:var(--amber-soft);color:var(--amber);border-radius:10px;padding:8px 11px;font-size:12px;font-weight:700;margin-top:10px;line-height:1.5}
.rf-backbtn{border:none;background:none;color:var(--accent-ink);font-family:inherit;font-size:13.5px;font-weight:800;padding:2px 0 10px;cursor:pointer}
/* ชิปบอกแผนบนการ์ดงาน */
.rf-planchipwrap{margin-top:4px}
.rf-planchip{display:inline-block;max-width:100%;background:var(--purple-soft);color:var(--purple);border-radius:7px;padding:2px 8px;font-size:11px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;vertical-align:top;cursor:pointer}
/* ตัวเลือกแผนในป๊อป */
.rf-planpick{display:flex;align-items:center;gap:10px;width:100%;text-align:left;font-family:inherit;background:var(--surface);border:1.5px solid var(--border);border-radius:12px;padding:11px 12px;margin-bottom:8px;cursor:pointer;min-height:48px}
.rf-planpick .rd{width:18px;height:18px;border-radius:50%;border:2px solid var(--border);flex-shrink:0}
.rf-planpick.on{border-color:var(--purple);background:var(--purple-soft)}
.rf-planpick.on .rd{border-color:var(--purple);background:var(--purple);box-shadow:inset 0 0 0 3px var(--surface)}
.rf-planpick .nm{flex:1;min-width:0;font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rf-planpick .ct{flex-shrink:0;font-size:11.5px;font-weight:700;color:var(--muted)}
/* v3.4: เลือกงานเข้าแผน (ติ๊กได้หลายงาน) */
.rf-taskpick{display:flex;align-items:center;gap:10px;width:100%;text-align:left;font-family:inherit;background:var(--surface);border:1.5px solid var(--border);border-radius:12px;padding:9px 12px;margin-bottom:8px;cursor:pointer;min-height:48px}
.rf-taskpick .ck{width:20px;height:20px;border-radius:6px;border:2px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff}
.rf-taskpick.on{border-color:var(--purple);background:var(--purple-soft)}
.rf-taskpick.on .ck{border-color:var(--purple);background:var(--purple)}
/* โหมดมืดใช้ม่วงอ่อนเป็นสีตัวอักษร → พื้นที่ "ถมม่วง" ต้องใช้หมึกเข้ม ไม่ใช่ #fff (ขาวบนม่วงอ่อนอ่านไม่ออก) */
body.dark .rf-taskpick .ck,body.dark .rf-planchips .rf-closedchip.on{color:#1B1230}
.rf-taskpick .bd{flex:1;min-width:0;display:block}
.rf-taskpick .nm{display:block;font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rf-taskpick .mt{display:block;font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rf-planselbtn{width:100%;text-align:left;font-family:inherit;font-size:14px;font-weight:600;color:var(--muted);background:var(--surface);border:1.5px solid var(--border);border-radius:11px;padding:11px 12px;min-height:46px;cursor:pointer;display:flex;align-items:center;gap:8px}
.rf-planselbtn.on{border-color:var(--purple);background:var(--purple-soft);color:var(--purple);font-weight:800}
.rf-planselbtn .cv{margin-left:auto;flex-shrink:0;font-size:12px;font-weight:800;color:var(--accent-ink);opacity:.8}
.rf-navnum{background:var(--purple-soft);color:var(--purple);border-radius:99px;padding:1px 7px;font-size:11px;font-weight:800;margin-left:6px}
/* v2.91: ข้อที่ยังไม่ทำ โชว์ใต้ชื่องานบนการ์ด */
.rf-clpeek{margin-top:4px;display:flex;flex-direction:column;gap:1px}
.rf-clpeek .ln{font-size:12.5px;color:var(--muted);line-height:1.45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.rf-clpeek .ln.more{font-size:11.5px;font-weight:700}
/* กอง "ทำต่อเนื่อง" ในหน้างานของฉัน */
.rf-mwsec.ong{color:var(--slate)}
.rf-mwsec.ong .hint{margin-left:auto;font-size:11px;font-weight:700;opacity:.7}
.rf-ongrow{display:flex;flex-direction:column}
.rf-ongrow.warn{border-left:3px solid var(--amber);border-radius:12px;background:#FEFBF4}
.rf-ongfix{border:none;background:none;color:var(--amber);font-family:inherit;font-size:11.5px;font-weight:800;text-align:left;padding:0 12px 9px 12px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* แถบบอกที่มาในฟอร์ม "ทำซ้ำงาน" */
.rf-repeatbar{background:var(--accent-soft);color:var(--accent-ink);border-radius:11px;padding:9px 12px;font-size:12.5px;font-weight:700;line-height:1.5}
/* v2.85: ปุ่ม "วันเสร็จ" รายข้อ — วางช่องวันที่ของเครื่องทับปุ่มแบบโปร่งใส (pattern เดียวกับ .rf-datewrap ของฟอร์ม)
   ของเดิมสร้าง input ลอยไว้นอกจอ (left:-9999px) แล้วเรียก showPicker() — บน PC เบราว์เซอร์ไม่ยอมเปิด
   ปฏิทินให้ช่องที่ไม่ได้แสดงผลจริง แล้ว fallback ไป .click() ก็ไม่เกิดอะไรเพราะช่องอยู่นอกจอ = กดแล้วเงียบ */
.rf-cl-duewrap{position:relative;display:inline-flex;flex-shrink:0}
.rf-cl-duenat{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:none;padding:0;margin:0;cursor:pointer;background:none}
.rf-cl-duenat::-webkit-calendar-picker-indicator{position:absolute;left:0;top:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.rf-cl-ts .ok{color:var(--green);font-weight:700}
.rf-imadd{width:100%;border:1.5px dashed var(--border);background:none;color:var(--muted);font-weight:700;font-size:13.5px;padding:12px;border-radius:12px;cursor:pointer;font-family:inherit}
.rf-imadd:hover{border-color:var(--green);color:var(--green)}
.rf-imadd.goal:hover{border-color:var(--accent);color:var(--accent-ink)}
.rf-imadd.plan:hover{border-color:var(--purple);color:var(--purple)}
/* v2.99: แถวแผนในหน้างาน */
.rf-taskplan{display:flex;align-items:stretch;gap:8px;background:var(--purple-soft);border-radius:12px;padding:4px}
.rf-taskplan .go{flex:1;min-width:0;display:flex;align-items:center;gap:9px;background:none;border:none;font-family:inherit;text-align:left;cursor:pointer;padding:7px 8px;color:var(--purple)}
.rf-taskplan .ic{flex-shrink:0;font-size:16px}
.rf-taskplan .mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.rf-taskplan .nm{font-size:13.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rf-taskplan .sb{font-size:11.5px;font-weight:600;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rf-taskplan .go svg{flex-shrink:0;opacity:.6}
.rf-taskplan .ch{flex-shrink:0;background:var(--surface);border:none;border-radius:9px;color:var(--purple);font-family:inherit;font-size:12px;font-weight:800;padding:0 12px;cursor:pointer}
/* สรุปผลรวมในหน้า "ผลงานของ…" */
.rf-ackbanner{width:100%;display:flex;align-items:center;gap:10px;background:var(--amber-soft);color:var(--amber);border:none;border-radius:13px;padding:11px 13px;margin-bottom:13px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;text-align:left}
.rf-ackbanner .s{font-size:12.5px;font-weight:600;opacity:.85;margin-top:2px}
.rf-ackbanner .x{display:flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:8px;flex-shrink:0}
.rf-ackbanner .x:hover{background:rgba(0,0,0,.06)}
.rf-ackall{width:100%;min-height:46px;border:none;border-radius:12px;background:var(--green);color:#fff;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
.rf-ackall:disabled{opacity:.6;cursor:default}
.rf-unackchip{background:var(--amber-soft);color:var(--amber)}
.rf-imsum{background:var(--green-soft);border-radius:14px;padding:12px 14px;margin-top:12px}
.rf-imsum.empty{background:var(--surface2);color:var(--muted);font-size:13.5px;font-weight:700}
.rf-imsum .h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;font-size:13.5px;font-weight:700;color:var(--green);margin-bottom:9px}
.rf-imsum .h span{font-size:12px;font-weight:600;color:var(--muted)}
.rf-imsum .s{font-size:12.5px;color:var(--muted);margin-top:8px;line-height:1.5}
.rf-imstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px}
.rf-imstat{background:var(--surface);border-radius:11px;padding:9px 10px;text-align:center}
.rf-imstat .v{font-size:16px;font-weight:800;color:var(--green);line-height:1.25}
.rf-imstat .l{font-size:11.5px;color:var(--muted);font-weight:600;margin-top:2px}
@media(max-width:520px){.rf-imgrid{grid-template-columns:1fr}}
/* v4.16: ปัดขวาเพื่อตอบกลับ (Surat: "เหมือนตอบไลน์") — ต้อง position:relative ไว้วางไอคอนลูกศร
   touch-action:pan-y = ยอมให้เลื่อนจอแนวตั้งตามปกติ แต่แนวนอนเราจัดการเอง ไม่งั้นปัดแล้วจอเลื่อนตาม */
.rf-cmt{display:flex;align-items:flex-start;gap:10px;animation:fadeUp .2s ease-out;position:relative;touch-action:pan-y}
.rf-cmt.swiping{transition:none}
.rf-cmt.snapback{transition:transform .18s ease-out}
.rf-cmt .rf-swipeic{position:absolute;left:-30px;top:50%;transform:translateY(-50%);width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none}
/* กล่องอ้างข้อความที่ตอบ — กดแล้วเด้งไปหาต้นฉบับ */
.rf-cmtquote{display:block;width:100%;text-align:left;font-family:inherit;cursor:pointer;background:var(--accent-soft);border:none;border-left:3px solid var(--accent);border-radius:8px;padding:5px 9px;margin-top:4px}
.rf-cmtquote .qn{font-size:11.5px;font-weight:800;color:var(--accent-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rf-cmtquote .qt{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.rf-cmt.hl .bub{animation:cmtHl 1.4s ease-out}
@keyframes cmtHl{0%,55%{background:var(--accent-soft)}100%{background:var(--surface2)}}
.rf-edited{font-size:11px;color:var(--muted);font-weight:600;margin-left:6px}
/* แถบ "กำลังตอบ…" เหนือช่องพิมพ์ */
.rf-replybar{display:flex;align-items:center;gap:9px;background:var(--accent-soft);border-left:3px solid var(--accent);border-radius:10px;padding:7px 10px;margin-bottom:8px}
.rf-replybar .mid{flex:1;min-width:0}
.rf-replybar .n{font-size:11.5px;font-weight:800;color:var(--accent-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rf-replybar .t{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rf-replybar button{flex-shrink:0;width:28px;height:28px;border:none;background:none;color:var(--muted);font-size:15px;cursor:pointer}
/* เมนูคลิกขวา / กดค้าง */
.rf-cmtmenu{position:fixed;z-index:var(--z-ov-sub);background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-lg);padding:5px;min-width:150px}
.rf-cmtmenu button{display:block;width:100%;text-align:left;border:none;background:none;font-family:inherit;font-size:13.5px;font-weight:600;color:var(--text);padding:9px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}
.rf-cmtmenu button:hover{background:var(--surface2)}
/* แก้ข้อความในที่เดิม */
.rf-cmtedit{margin-top:4px}
.rf-cmtedit textarea{width:100%;border:1.5px solid var(--accent);border-radius:10px;padding:8px 11px;font-family:inherit;font-size:14.5px;line-height:1.55;resize:vertical;background:var(--surface);color:var(--text)}
.rf-cmtedit .row{display:flex;gap:7px;margin-top:6px}
.rf-cmtedit .row button{border:none;border-radius:9px;font-family:inherit;font-size:12.5px;font-weight:800;padding:7px 14px;cursor:pointer}
.rf-cmtedit .row .ok{background:var(--accent);color:#fff}
.rf-cmtedit .row .no{background:var(--surface2);color:var(--muted)}
.rf-cmt .bub{background:var(--surface2);border-radius:4px 14px 14px 14px;padding:9px 13px;font-size:14.5px;line-height:1.55;margin-top:4px;display:inline-block;white-space:pre-wrap;word-break:break-word}
.rf-dfoot{flex-shrink:0;border-top:1px solid var(--border);background:var(--surface);padding:12px 16px calc(12px + env(safe-area-inset-bottom)) 16px;display:flex;flex-direction:column;gap:10px}
.rf-cta{width:100%;min-height:48px;border-radius:13px;border:none;background:var(--accent);color:#fff;font-size:15.5px;font-weight:700;cursor:pointer;transition:filter .15s}
.rf-cta:hover{filter:brightness(1.06)}
.rf-cta:active{transform:scale(.985)}
.rf-cta.ghost{background:var(--surface2);color:var(--text)}
.rf-cmtbar{display:flex;gap:8px;align-items:center}
.rf-cmtbar input{flex:1;height:44px;padding:0 15px;border-radius:12px;border:1px solid var(--border);background:var(--surface2);font-size:15px;outline:none;box-sizing:border-box;min-width:0}
/* v4.3: กดรูปแล้วขยายในแอปเลย ไม่เด้งออกไปหน้าเว็บอื่น */
.rf-imgov{position:fixed;inset:0;z-index:var(--z-imgview);background:rgba(8,12,16,.92);display:flex;align-items:center;justify-content:center;padding:52px 14px calc(58px + env(safe-area-inset-bottom));animation:fadeIn .16s}
.rf-imgov img{max-width:100%;max-height:100%;object-fit:contain;border-radius:10px;display:block}
.rf-imgovx{position:absolute;top:calc(12px + env(safe-area-inset-top));right:14px;width:40px;height:40px;border-radius:50%;border:none;background:rgba(255,255,255,.14);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center}
.rf-imgovx:hover{background:rgba(255,255,255,.26)}
.rf-imgovbar{position:absolute;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:10px}
.rf-imgovbar a{color:#fff;background:rgba(255,255,255,.14);border-radius:99px;padding:8px 16px;font-size:13px;font-weight:700;text-decoration:none}
.rf-imgovbar a:hover{background:rgba(255,255,255,.26)}
.rf-imgbtn{border:none;background:none;padding:0;cursor:zoom-in;display:block;font:inherit;color:inherit}
/* v4.6: ป้าย "ยังไม่ได้ส่ง" บนแถวงานที่ค้างอยู่ในคิว — กะพริบเบาๆ ให้รู้ว่าระบบยังพยายามส่งอยู่ ไม่ได้นิ่ง */
/* v4.7: ตัวกรอง ปี/คลัง/แผนก + การ์ดสรุปผลรวมบนหน้าแผน */
.rf-planpick-row{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.rf-planpick-row .rf-fsel{min-width:0;flex:0 1 auto}
.rf-rollup{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:14px;box-shadow:var(--shadow);padding:12px 14px;margin-bottom:14px}
.rf-rollup .hd{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.rf-rollup .ttl{font-size:14.5px;font-weight:800}
.rf-rollup .sub{font-size:12px;color:var(--muted);font-weight:600;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rf-rollup .big{margin-left:auto;font-size:22px;font-weight:800;line-height:1}
.rf-rollhit{margin-top:7px;font-size:12.5px;font-weight:700;color:var(--muted)}
.rf-rollhit b{color:var(--green);font-size:14px}
.rf-rollby{margin-top:10px;border-top:1px solid var(--border);padding-top:8px}
.rf-rollby .row{display:flex;align-items:baseline;gap:10px;font-size:12.5px;font-weight:700;padding:3px 0;min-width:0}
.rf-rollby .row .lb{color:var(--muted);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rf-rollby .row .vl{margin-left:auto;font-weight:800;white-space:nowrap;flex-shrink:0}
.rf-teamgoal{display:flex;align-items:baseline;gap:8px;margin-top:9px;padding-top:8px;border-top:1px solid var(--border);font-size:12px;font-weight:700;min-width:0}
.rf-teamgoal .l{color:var(--muted);white-space:nowrap}
.rf-teamgoal .v{margin-left:auto;font-weight:800;white-space:nowrap}
.rf-unsent{background:var(--red-soft);color:var(--red);animation:unsentBlink 1.6s ease-in-out infinite}
@keyframes unsentBlink{0%,100%{opacity:1}50%{opacity:.5}}
.rf-lnk{color:var(--blue);text-decoration:underline;word-break:break-all}
.rf-lnk:hover{color:var(--accent-ink)}
.rf-mention{color:var(--accent-ink);font-weight:800;background:var(--accent-soft);border-radius:5px;padding:0 3px}
.rf-mentiondd{display:flex;flex-direction:column;gap:1px;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-lg);overflow:hidden auto;max-height:220px;margin-bottom:8px;animation:fadeUp .12s ease-out}
.rf-mentionrow{display:flex;align-items:center;gap:9px;width:100%;min-height:46px;padding:6px 12px;border:none;background:none;cursor:pointer;text-align:left;font-family:inherit}
.rf-mentionrow:hover{background:var(--surface2)}
.rf-mentionrow .nm{flex:1;min-width:0;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rf-mentionrow .tg{font-size:12.5px;color:var(--accent-ink);font-weight:700;flex-shrink:0}
.rf-cmtbar input:focus{border-color:var(--accent);background:var(--surface)}
.rf-send{width:44px;height:44px;border-radius:12px;border:none;background:var(--accent);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.rf-send:active{transform:scale(.92)}
.rf-send:disabled{opacity:.55}

/* ── form ── */
.rf-fhead{padding:14px 16px 12px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-shrink:0}
.rf-fhead .t{font-size:17px;font-weight:700;flex:1}
.rf-fbody{flex:1;overflow-y:auto;padding:18px 20px;display:flex;flex-direction:column;gap:16px;-webkit-overflow-scrolling:touch}
/* 🔴 v4.22 — กล่องเลื่อนที่เป็น flex column ต้องกัน flex-shrink ของลูกเสมอ
   บั๊คจริง (Surat แจ้ง "งานใกล้/เลยกำหนด ล้นในกรอบ"): #popScroll เป็น display:flex;flex-direction:column
   ลูกทุกตัวจึงได้ flex-shrink:1 มาโดยปริยาย → พอเนื้อหารวมสูงเกินกล่อง **ลูกโดนบีบให้เตี้ยลงทุกตัว**
   แถวเป็น <button> ซึ่งตัดเนื้อหาที่ล้นทิ้ง + จัดกึ่งกลางแนวตั้ง → ชื่องานหายไปเฉยๆ
   แถวที่มีเช็คลิสต์เยอะโดนบีบหนักกว่า เลยหายทั้งชื่อ ส่วนแถวสั้นๆ รอด — ตรงกับที่เห็นในภาพ
   ซ้ำร้าย: พอทุกตัวถูกบีบให้พอดีกล่อง scrollHeight = clientHeight → **เลื่อนดูส่วนที่ถูกตัดก็ไม่ได้**
   วัดจริงก่อนแก้: แถวโดนบีบ 31px/14px/31px · 326/326 เลื่อนไม่ได้
             หลังแก้: 129/92/129px ครบ · 488/326 เลื่อนได้ปกติ */
.rf-fbody > *,#popScroll > *{flex-shrink:0}
.rf-flabel{font-size:13.5px;font-weight:600;margin-bottom:6px}
.rf-finput{width:100%;box-sizing:border-box;height:46px;padding:0 14px;border-radius:12px;border:1.5px solid var(--border);background:var(--surface);font-size:15px;outline:none}
.rf-finput:focus{border-color:var(--accent)}
.rf-finput.err{border-color:var(--red)}
.rf-datewrap{position:relative}
.rf-datedisp{width:100%;box-sizing:border-box;height:46px;padding:0 40px 0 14px;border-radius:12px;border:1.5px solid var(--border);background:var(--surface);font-size:15px;display:flex;align-items:center;font-variant-numeric:tabular-nums}
.rf-datewrap.err .rf-datedisp{border-color:var(--red)}
.rf-datewrap.locked .rf-datedisp{background:var(--surface2);color:var(--muted);border-style:dashed}
.rf-datedisp.ph{color:var(--muted)}
.rf-dateic{position:absolute;right:13px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none;display:flex}
.rf-datenat{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:none;padding:0;margin:0;cursor:pointer;background:none}
.rf-datenat::-webkit-calendar-picker-indicator{position:absolute;left:0;top:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.rf-ftext{width:100%;box-sizing:border-box;padding:11px 14px;border-radius:12px;border:1.5px solid var(--border);background:var(--surface);font-size:15px;outline:none;resize:vertical;line-height:1.55}
.rf-ftext:focus{border-color:var(--accent)}
.rf-ferr{font-size:13px;color:var(--red);margin-top:5px}
.rf-asschip{display:inline-flex;align-items:center;gap:9px;background:var(--accent-soft);border:1.5px solid var(--accent);border-radius:12px;padding:7px 8px}
.rf-newcl{display:flex;flex-direction:column;gap:2px;margin-bottom:8px}
.rf-newclrow{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--surface2);border-radius:9px}
.rf-newclrow .n{font-size:13px;font-weight:800;color:var(--accent-ink);flex-shrink:0}
.rf-newclrow .t{flex:1;min-width:0;font-size:14px;word-break:break-word}
/* v3.8: ต้องเจาะจงที่ปุ่มลบเท่านั้น — เดิมเขียน `.rf-newclrow button` ครอบปุ่มทุกตัวในแถว
   ปุ่ม "มอบหมาย"/"วันเสร็จ" เลยถูกบีบเป็นวงกลม 26x26 ตัวหนังสือล้นทับกัน และกดไม่โดน (พื้นที่กดเหลือ 26px) */
.rf-newclrow > .rf-newclx{width:26px;height:26px;border:none;border-radius:50%;background:var(--surface);color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.rf-newclrow > .rf-newclx:hover{background:var(--red-soft);color:var(--red)}
.rf-newclbar{display:flex;gap:8px;align-items:stretch}
.rf-newclbar input{flex:1;min-width:0}
.rf-clabtn{flex-shrink:0;padding:0 15px;border-radius:11px;border:1.5px solid var(--accent);background:var(--accent-soft);color:var(--accent-ink);font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap}
.rf-selfbtn{display:flex;align-items:center;gap:9px;width:100%;box-sizing:border-box;padding:11px 13px;border-radius:12px;border:1.5px solid var(--border);background:var(--surface);color:var(--text);font-size:14.5px;font-weight:700;cursor:pointer;font-family:inherit;text-align:left}
.rf-selfbtn .bx{width:22px;height:22px;border-radius:7px;border:2px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;color:#fff}
.rf-selfbtn.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink)}
.rf-selfbtn.on .bx{background:var(--accent);border-color:var(--accent)}
/* หัวป๊อปเสร็จ/ยกเลิก — ติดบนสุด full-bleed (margin ลบคลุมพื้นที่ padding ของ popScroll) */
.rf-closehdr{position:sticky;top:0;z-index:3;background:var(--surface);margin:-12px -14px 8px;padding:12px 14px 10px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:8px}
.rf-pfchips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.rf-pfchip{display:inline-flex;align-items:center;gap:5px;flex-shrink:0;border:1px solid var(--border);background:var(--surface);color:var(--muted);font-size:12.5px;font-weight:600;padding:3px 10px 3px 4px;border-radius:99px;cursor:pointer;font-family:inherit;white-space:nowrap}
.rf-pfchip:first-child{padding-left:11px}
.rf-pfchip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.rf-canbar{display:flex;align-items:center;gap:8px}
.rf-cansel{border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:13px;font-weight:600;padding:7px 12px;border-radius:9px;cursor:pointer;font-family:inherit}
.rf-cansel:hover{background:var(--surface2)}
.rf-candel{border:none;background:var(--red);color:#fff;font-size:13px;font-weight:700;padding:7px 14px;border-radius:9px;cursor:pointer;font-family:inherit}
.rf-candel:disabled{opacity:.45;cursor:default}
.rf-canrow{display:flex;align-items:center;gap:8px}
.rf-canck{flex-shrink:0;display:flex;align-items:center;justify-content:center;padding:4px;cursor:pointer}
.rf-canck input{width:20px;height:20px;cursor:pointer;accent-color:var(--red)}
.rf-canck-sp{flex-shrink:0;width:28px}
.rf-collabchips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.rf-collabchip{display:inline-flex;align-items:center;gap:6px;background:var(--surface2);border:1px solid var(--border);border-radius:999px;padding:3px 5px 3px 4px;max-width:100%}
.rf-collabchip .nm{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.rf-collabchip button{width:22px;height:22px;border:none;border-radius:50%;background:var(--surface);color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.rf-collabchip button:hover{background:var(--red-soft);color:var(--red)}
.rf-asslist{border:1px solid var(--border);border-radius:12px;overflow:hidden;max-height:196px;overflow-y:auto}
.rf-assrow{display:flex;align-items:center;gap:10px;width:100%;min-height:48px;padding:6px 12px;border:none;background:var(--surface);cursor:pointer;text-align:left;border-bottom:1px solid var(--border);box-sizing:border-box}
.rf-assrow:hover{background:var(--surface2)}
.rf-priobtns{display:flex;gap:6px}
.rf-priobtn{flex:1;min-height:44px;border-radius:11px;border:1.5px solid var(--border);background:transparent;color:var(--muted);font-size:14px;font-weight:600;cursor:pointer;transition:all .15s}
.rf-privtoggle{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rf-privopt{padding:10px 12px;border-radius:12px;border:1.5px solid var(--border);background:var(--surface);cursor:pointer;text-align:left;color:var(--text)}

/* ── date helpers (Asia/Bangkok) ── */
/* toLocaleDateString สร้าง Intl formatter ใหม่ทุกครั้ง (~0.15ms) — diffDays เรียกทุกงานทุก render

let _tIso = '', _tAt = 0, _tMid = 0;
function todayIso(){
  const now = Date.now();
  if (!_tIso || now - _tAt > 60000) {
    _tIso = new Date(now).toLocaleDateString('en-CA', { timeZone:'Asia/Bangkok' });

function pd(s){ const p = String(s).slice(0,10).split('-').map(Number); return new Date(p[0], p[1]-1, p[2]); }

function addDays(iso, n){ const d = pd(iso); d.setDate(d.getDate()+n); return isoOf(d); }

/* ── misc helpers ── */
function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

  return String(s == null ? '' : s)
    .split('\\').join('\\\\')
    .split("'").join("\\'")
    .split('&').join('&amp;')
    .split('"').join('&quot;')
    .split('<').join('&lt;');

}
function userByEmail(em){

function userByName(n){ n = String(n||'').trim(); return n ? S.users.find(u => u.name === n || u.nickname === n) : null; }

function dispName(u){
  if (!u) return '';
