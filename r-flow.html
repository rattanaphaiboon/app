   ⚠️ ใช้กับ "ป้ายที่โชว์" เท่านั้น — การเช็คสิทธิ์ยังใช้ role เหมือนเดิมทุกจุด */
/* v4.1: เบอร์โทรจากชีทพนักงาน (คอลัมน์ "เบอร์โทรพนง.") — ใช้กดโทรทวงงาน
   ⚠️ ถ้าชีทเก็บเป็นตัวเลข 0 นำหน้าจะหาย (081... เหลือ 81...) → เติมคืนให้เมื่อยาว 9 หลักและไม่ขึ้นต้นด้วย 0 */
function telDigits(u){
  let s = String((u && u.tel) || '').replace(/[^\d]/g, '');
  if (!s) return '';
  if (s.length === 9 && s[0] !== '0') s = '0' + s;
  return s.length >= 9 ? s : '';
}
function isBoss(u){
  if (!u || !(Number(u.role) >= 5)) return false;
  return String(u.apprStage || '').trim().toLowerCase() !== 'normal';
}
function bossLabel(u, full){ return isBoss(u) ? (full ? 'หัวหน้าทีม' : 'หัวหน้า') : ''; }
/* เรียงรายชื่อคน: ตัวเอง → แผนกเดียวกัน → คลังเดียวกัน → คนอื่น · ในกลุ่มเรียง ก-ฮ */
function userGroup(u){
  if (!S.me) return 3;
  if (u.email === S.me.email) return 0;
  const meD = String(S.me.dept || '').trim(), meW = String(S.me.warehouse || '').trim().toUpperCase();
  if (meD && meD !== 'ไม่ระบุแผนก' && String(u.dept || '').trim() === meD) return 1;
  if (meW && String(u.warehouse || '').trim().toUpperCase() === meW) return 2;
  return 3;
}
const UGLABEL = ['', 'แผนกเดียวกัน', 'คลังเดียวกัน', 'แผนกอื่น'];
function rankUsers(list){
  return list.slice().sort(function(a, b){
    return (userGroup(a) - userGroup(b)) || dispName(a).localeCompare(dispName(b), 'th');
  });
}
/* คนที่เกี่ยวข้องกับงาน (ผู้รับผิดชอบ) — ใช้ทำ sidebar filter / workload / ทีม */
function teamUsers(){
  const used = {};
  S.tasks.forEach(t => { const u = taskUser(t); if (u && u.email) used[u.email] = true; });
  return S.users.filter(u => used[u.email]);
}
/* หา user ของงาน: email ก่อน → ชื่อ (งาน migrate เก่าอาจมีแต่ชื่อ) */
function taskUser(t){ return userByEmail(t.assigneeEmail) || userByName(t.assigneeName) || null; }

/* checklist: JSON string → [{t,d}] */
function parseCl(t){
  try {
    const a = JSON.parse(t.checklist || '[]');
    return Array.isArray(a) ? a.filter(i => i && i.t != null) : [];
  } catch(e){ return []; }
}
function dueMeta(t){
  const st = stOf(t);
  if (st === 'cancelled') return { dateText: t.dueDate ? fmtYmd(t.dueDate) : '—', bg:'var(--slate-soft)', fg:'var(--muted)', tip: fmtYmd(t.dueDate), badge:'ยกเลิกแล้ว', urg:5, sort:3e9 };
  if (st === 'done') return { dateText: t.dueDate ? fmtYmd(t.dueDate) : 'ไม่มีกำหนด', bg:'var(--green-soft)', fg:'var(--green)', tip: t.dueDate || 'ยังไม่กำหนดวันส่ง', badge:'เสร็จแล้ว', urg:4, sort:2e9 };
  if (!t.dueDate) return { dateText:'ไม่มีกำหนด', bg:'var(--slate-soft)', fg:'var(--muted)', tip:'ยังไม่กำหนดวันส่ง', badge:null, urg:3, sort:1e9 };
  const d = diffDays(t.dueDate), ds = fmtYmd(t.dueDate);
  if (d < 0) return { dateText:ds, bg:'var(--red-soft)', fg:'var(--red)', tip:t.dueDate, badge:'เลยกำหนด ' + (-d) + ' วัน', urg:0, sort:d };
  if (d === 0) return { dateText:'วันนี้', bg:'var(--amber-soft)', fg:'var(--amber)', tip:t.dueDate, badge:'ครบกำหนดวันนี้', urg:1, sort:0 };
  if (d <= 3) return { dateText:ds, bg:'var(--amber-soft)', fg:'var(--amber)', tip:t.dueDate, badge:'เหลือ ' + d + ' วัน', urg:1, sort:d };
  return { dateText:ds, bg:'var(--slate-soft)', fg:'var(--muted)', tip:t.dueDate, badge:null, urg:2, sort:d };
}
/* ข้อความรวมสำหรับค้นหา 1 งาน — ค้นเจอจากทุกมุม: ชื่อ · รายละเอียด · ผู้รับผิดชอบ · ผู้สั่งงาน
   · ผู้ร่วมงาน · ทุกข้อในเช็คลิสต์ (+ คนที่มอบรายข้อ) · แผนก/คลัง (ชิป) */
function taskSearchBlob(t, u, rawName, cl){
  const parts = [t.title || '', t.detail || '', t.note || '', rawName || ''];
  const rep = userByEmail(t.reporterEmail) || userByName(t.reporterName);
  if (rep) parts.push(dispName(rep)); else if (t.reporterName) parts.push(t.reporterName);
  const cr = userByEmail(t.createdBy);
  if (cr) parts.push(dispName(cr));
  collabOf(t).forEach(function(em){ const cu = userByEmail(em); parts.push(cu ? dispName(cu) : em); });
  (cl || []).forEach(function(i){
    if (!i) return;
    if (i.t) parts.push(i.t);
    if (i.asg) { const au = userByEmail(i.asg); parts.push(au ? dispName(au) : i.asg); }   // คนที่ถูกมอบรายข้อ
  });
  if (u) { if (u.dept) parts.push(u.dept); if (u.warehouse) parts.push(u.warehouse); }
  return parts.join(' ').toLowerCase();
}
/* ถึงวันเริ่มแล้วแต่ยังไม่กดรับ → แอปถือว่า "กำลังทำ" ให้อัตโนมัติ (งานเดินแล้ว)
   แต่ยังติดป้าย "ยังไม่กดรับ" คู่ไว้ + หลังบ้านเตือนผู้สั่งงานทุกวัน
   ⚠️ เป็นการ "แสดงผล" เท่านั้น — สถานะจริงในชีทยังเป็น todo (stOf(t)) ปุ่มเปลี่ยนสถานะจึงทำงานตามเดิม */
function autoDoing(t){
  if (!t || stOf(t) !== 'todo' || t.ackAt) return false;
  const asg = String(t.assigneeEmail || '').toLowerCase();
  if (!asg || String(t.createdBy || '').toLowerCase() === asg) return false;
  return startedDue(t) || (t.dueDate && diffDays(t.dueDate) <= 0);
}
function decorate(t){
  const u = taskUser(t);
  const dm = dueMeta(t);
  const cc = ccOf(t.id);
  const cl = parseCl(t);
  const rawName = u ? dispName(u) : (t.assigneeName || '');
  const auto = autoDoing(t);
  const st = auto ? 'doing' : stOf(t);
  return {
    id: t.id, title: t.title, detail: t.detail || '—', status: st, statusLabel: SL[st], autoDoing: auto, unack: auto, dueIso: t.dueDate || '',
    u, avName: rawName || 'ยังไม่มอบหมาย', avInit: u ? firstChar(u.nickname) : (rawName ? firstChar(rawName) : '?'),
    avColor: u ? u.color : (rawName ? hashColor(rawName) : ''),
    avPhoto: u ? u.photo : '',
    noAv: !rawName, dept: u ? u.dept : '', warehouse: u ? (u.warehouse || '') : '',
    prioColor: PC[t.priority] || PC.med, prioLabel: PL[t.priority] || PL.med,
    dueText: dm.dateText, dueBg: dm.bg, dueFg: dm.fg, dueTip: dm.tip, badge: dm.badge || '', hasBadge: !!dm.badge,
    cc, urg: dm.urg, sort: dm.sort,
    ts: t.createdAt || '',
    rk: recencyKey(t),
    clTotal: cl.length, clDone: cl.filter(i => i.d).length,
    // v2.91: 2 ข้อแรกที่ยังไม่ทำ — เอาไปโชว์บนการ์ดในหน้าลิสต์ จะได้รู้ว่างานค้างตรงไหนโดยไม่ต้องเปิดเข้าไป
    clNext: cl.filter(function(i){ return !i.d; }).slice(0, 2).map(function(i){ return clStrip(i.t); }),
    priv: isPrivate(t), secret: isSecret(t),
    // "งานของฉัน" = ผู้รับผิดชอบ หรือ ผู้ร่วมงาน (เจ้าของร่วม) หรือผู้รับปลายทางของฝากของ
    mine: !!(S.me && ((u && u.email === S.me.email) || collabOf(t).indexOf(S.me.email) > -1 || String(t.dest || '').toLowerCase() === S.me.email)),
    isHandoff: String(t.type || '') === 'handoff', dest: t.dest || '', items: t.items || '',
    // ข้อความสำหรับค้นหา — ครอบทุกอย่างในงาน: ชื่อ/รายละเอียด/ผู้รับผิดชอบ/ผู้สั่ง/ผู้ร่วมงาน/เช็คลิสต์/แผนก/คลัง
    search: taskSearchBlob(t, u, rawName, cl)
  };
}

/* ═══════════════════════════════════════════════════════════════════════════
   📌 กฎการเรียงลำดับ (SORT RULE) — ใช้กับ "ทุกลิสต์" ในแอปนี้ ห้ามยกเว้น
   ───────────────────────────────────────────────────────────────────────────
   1) มีกำหนดส่ง (deadline) → ดู deadline ก่อนเสมอ
      เลยกำหนด → วันนี้/ใกล้ครบ → ไกล → ไม่มีกำหนด → เสร็จแล้ว → ยกเลิก
   2) เสมอกัน (deadline เท่ากัน / ไม่มี deadline) → "ล่าสุดอยู่บน" (ใหม่→เก่า)
   3) ลิสต์ที่ไม่มี deadline เลย (คอมเม้น · แจ้งเตือน · ฟีด · งานประจำ)
      → "ล่าสุดอยู่บน" ล้วนๆ
   ยกเว้นได้กรณีเดียว: ลำดับที่ผู้ใช้จัดเอง (เช็คลิสต์ที่ลากเรียง) และ
   ปฏิทิน/กราฟที่ต้องไล่วันจากน้อยไปมากตามธรรมชาติ
   ═══════════════════════════════════════════════════════════════════════════ */
// เวลา "ล่าสุด" ของงาน — งานที่ปิดแล้วใช้เวลาปิด (เพิ่งเสร็จอยู่บน) · งานที่ยังเปิดใช้เวลาสร้าง (เพิ่งสร้างอยู่บน)
// เช็คลิสต์เดินเลขให้เอง → ตัดเลขที่พิมพ์นำหน้ามาเองทิ้ง ("1. งาน" / "2.งาน" / "3) งาน")
// ต้องตามด้วยตัวที่ไม่ใช่เลข กัน "3.5 นิ้ว" โดนตัด
function clStrip(s){ return String(s == null ? '' : s).replace(/^\s*\d{1,2}\s*[.)]\s*(?=\D)/, '').trim(); }
// ย่อข้อความรายการย่อยไว้โชว์ใน toast — ต้องพอดี 1 บรรทัดที่จอ 375px
function clShort(s){ const v = clStrip(s); return v.length > 22 ? v.slice(0, 22) + '…' : v; }
function recencyKey(t){
  const st = stOf(t);
  return (st === 'done' || st === 'cancelled') ? (t.updatedAt || t.createdAt || '') : (t.createdAt || '');
}
// ใหม่→เก่า (ใช้กับค่า timestamp ISO ที่เทียบ string ตรงๆ ได้)
function newFirst(a, b){ const x = a || '', y = b || ''; return x < y ? 1 : x > y ? -1 : 0; }
// โหมด 'due' (default ตามกฎ) = deadline ก่อน แล้วล่าสุดอยู่บน · โหมด 'new' = ล่าสุดอยู่บนล้วนๆ (ปุ่มสลับที่หัวบอร์ด)
/* comparator กลางตัวเดียวของทั้งแอป — ใช้ได้กับทุกอย่างที่มี {urg, sort, rk}
   (งาน · ฝากของ · ข้อเช็คลิสต์) → เอามาเรียงรวมในลิสต์เดียวกันได้ ครบกำหนดก่อนขึ้นบนเสมอ */
function dueCmp(x, y){
  if (S.sortMode === 'new') return newFirst(x.rk, y.rk) || (x.urg - y.urg) || (x.sort - y.sort);
  return (x.urg - y.urg) || (x.sort - y.sort) || newFirst(x.rk, y.rk);
}
function sortL(a){ return a.slice().sort(dueCmp); }
function allDec(){ if (!_decMemo) _decMemo = S.tasks.map(decorate); return _decMemo; }
function fDec(){
  const dec = allDec();
  if (!S.memberFilter) return dec;
  return dec.filter(d => d.u && d.u.email === S.memberFilter);
}
// ผู้ร่วมงาน (collaborators) — เจ้าของร่วมเต็มตัว เก็บเป็นอีเมลคั่นด้วย ,
function collabOf(t){ return String((t && t.collaborators) || '').split(',').map(function(s){ return String(s).trim().toLowerCase(); }).filter(Boolean); }
function isInvolved(t){
  if (!S.me) return false;
  const em = S.me.email;
  return String(t.assigneeEmail||'').toLowerCase() === em || String(t.reporterEmail||'').toLowerCase() === em || String(t.createdBy||'').toLowerCase() === em || collabOf(t).indexOf(em) > -1;
}
/* ⚠️ แก้งานได้เฉพาะคนที่ "มีชื่ออยู่บนงาน" เท่านั้น — ผู้สั่ง / ผู้รับผิดชอบ
   หัวหน้าที่ไม่เกี่ยวกับงานนี้ก็แก้ไม่ได้ (คอมเม้นได้อย่างเดียว) — คำสั่ง Surat 2026-07-21
   คนที่ถูกมอบเฉพาะ "ข้อในเช็คลิสต์" ไม่ผ่านตรงนี้ แต่ติ๊กข้อตัวเองได้ผ่าน canTickCl() */
function canEdit(t){
  if (!S.me) return false;
  return isInvolved(t);
}
// ติ๊กข้อนี้ได้ไหม — ข้อที่มอบหมายแล้ว = เฉพาะเจ้าของข้อกับคนที่มอบ · ข้อที่ยังไม่มอบ = คนที่แก้งานได้
function canTickCl(t, it){
  if (!S.me || stOf(t) === 'cancelled') return false;
  const me = S.me.email;
  if (it && it.asg) return String(it.asg).toLowerCase() === me || String(it.asgBy || '').toLowerCase() === me;
  return canEdit(t);
}
function privOf(t){ const p = String(t.private||'').trim().toUpperCase(); return p === 'P' ? 'P' : (p === 'Y' ? 'Y' : ''); }
function isPrivate(t){ return privOf(t) === 'Y'; }   // 'Y' = เฉพาะทีม (คลังเดียวกัน)
function isSecret(t){ return privOf(t) === 'P'; }    // 'P' = ส่วนตัว (คนสร้าง + ผู้รับผิดชอบ)
// คอมเม้น: หัวหน้า R5+ ได้ทุกงานที่เห็น · เจ้าของงานคอมเม้นงานตัวเองได้ · คนอื่นดูอย่างเดียว
function canComment(t){
  if (!S.me) return false;
  if (S.me.role >= 5) return true;
  return isInvolved(t) || hasMyClItem(t);   // ถูกมอบข้อในเช็คลิสต์ = คุยในงานได้
}
// มีข้อในเช็คลิสต์ที่มอบให้เราไหม
function hasMyClItem(t){
  if (!S.me) return false;
  const me = S.me.email;
  return parseCl(t).some(function(i){ return String(i.asg || '').toLowerCase() === me; });
}

/* ── avatar html (รูปจริงจาก Users Sheet ถ้ามี · โหลดไม่ได้ fallback ตัวอักษร) ── */
function avCore(init, color, photo, size){
  const fs = Math.round(size * 0.48);
  /* ⚠️ รูปจาก Google Drive: ต้องมี referrerpolicy="no-referrer" ไม่งั้นบางเครื่อง (เจอจริงบน iOS)
     โดน Drive ปฏิเสธเพราะ referer ข้ามโดเมน แล้วรูปไม่ขึ้นทั้งแอปทั้งที่ URL เปิดตรงๆ ได้
     · ไม่ใช้ loading="lazy" — avatar เล็กและอยู่ใน scroll container ซึ่ง iOS มักไม่ยอมโหลด
     · โหลดพลาด = ลองใหม่ 1 ครั้งก่อนค่อยซ่อน (เดิมลบทิ้งทันที เน็ตสะดุดครั้งเดียวรูปหายยาว) */
  const img = photo ? '<img src="' + esc(photo) + '" alt="" decoding="async" referrerpolicy="no-referrer" ' +
    'onerror="if(this.dataset.r){this.remove();}else{this.dataset.r=1;const s=this.src;this.src=\'\';setTimeout(()=>{this.src=s;},600);}">' : '';
  return '<div class="rf-av" style="width:' + size + 'px;height:' + size + 'px;font-size:' + fs + 'px;background:' + color + '">' + esc(init) + img + '</div>';
}
function avHtml(d, size){
  const fs = Math.round(size * 0.48);
  if (d.noAv) return '<div class="rf-av none" style="width:' + size + 'px;height:' + size + 'px;font-size:' + fs + 'px">?</div>';
  return avCore(d.avInit, d.avColor, d.avPhoto, size);
}
function avUserHtml(u, size){
  return avCore(firstChar(u.nickname), u.color, u.photo, size);
}

/* ── API ── */
/* action ที่ "เขียนข้อมูล" — ระหว่างที่ยังบันทึกไม่เสร็จ ห้าม loadAll เบื้องหลังมาทับ state
   (ไม่งั้นงานที่เพิ่งกด/ติ๊ก/เปลี่ยนสถานะจะหายเพราะ refresh ดึงข้อมูลเก่ามาทับ) */
/* 🔴 v4.15 — ลิสต์นี้คือ "การเขียนที่เปลี่ยนสิ่งที่ list ส่งกลับมา" เท่านั้น ห้ามใส่มั่ว
   บั๊คจริง 31 ก.ค.: `savePushToken` เคยอยู่ในนี้ · `initPushOnBoot()` ยิงมันทุกครั้งที่เปิดแอป
   → ชนการ์ด `_writeSeq !== seq0` ใน loadAll → **ทิ้งผลโหลดทั้งก้อน** → ต้องรอ poll รอบถัดไป 75 วิ
   ผู้ใช้เห็นเป็น "เปิดแอปแล้วโหลดนานมาก ~1 นาที" (Surat แจ้ง) ทั้งที่หลังบ้านตอบใน 3.5 วิ
   savePushToken เขียนลงแท็บ PushTokens ซึ่ง list ไม่แตะเลย → ไม่ต้องกันข้อมูลทับ */
const WRITE_ACTIONS = { create:1, update:1, changeStatus:1, 'delete':1, addComment:1, uploadImage:1, saveRecur:1, deleteRecur:1, tickRoutine:1, markLeave:1, runRoutineJob:1 };
let _pendingWrites = 0;
/* v2.83: นับ "จำนวนครั้งที่เขียน" สะสม — loadAll จำเลขนี้ก่อนยิง แล้วเทียบตอนได้ผลกลับมา
   ถ้าไม่เท่า = มีคนกด/ติ๊ก/บันทึกระหว่างที่ list กำลังโหลด → ผลที่ได้เป็นข้อมูล "ก่อนกด" ต้องทิ้ง
   (เดิมเช็คแค่ _pendingWrites > 0 ตอนได้ผล — เขียนที่เสร็จเร็วกว่า list จะรอด แล้วโดนข้อมูลเก่าทับ = ติ๊กแล้วหาย) */
let _writeSeq = 0;
/* v4.5: opts.wqBacked = การเขียนที่ "ลงคิว localStorage ไว้แล้ว" (ติ๊กเช็คลิสต์)
   ไม่ต้องนับเป็น pending write เพราะ wqApply() เอาของในคิวมาทับข้อมูลที่เพิ่งโหลดให้อยู่แล้ว
   ถ้านับ จะไปทริกการ์ดใน loadAll แล้ว "ทิ้งผลโหลดทั้งก้อน" → จอว่างจนกว่าจะถึงรอบ poll 75 วิ
   (บั๊คจริง v4.4: หลังเปลี่ยนมาลงคิวทุกครั้ง คิวมีของค้าง → boot ยิง wqFlush ชนกับ loadAll
    ผลโหลดโดนทิ้ง งานเลยขึ้นช้า ~2 นาที — Surat เจอ 30 ก.ค.) */
async function api(action, payload, opts){
  const isWrite = !!WRITE_ACTIONS[action] && !(opts && opts.wqBacked);
  if (isWrite) { _pendingWrites++; _writeSeq++; }
  try {
    const body = Object.assign({ action: action, email: S.me ? S.me.email : (SESSION.email || '') }, payload || {});
    let res;
    // v2.88: fetch พังเอง = เน็ตไม่ถึง (สัญญาณหลุดในคลัง) → ติดธง offline ไว้ให้ผู้เรียกเอาเข้าคิวส่งซ้ำได้
    // ต่างจากหลังบ้านตอบว่าไม่ผ่าน (ไม่มีสิทธิ์/ข้อมูลผิด) ซึ่งส่งซ้ำกี่ครั้งก็ไม่ผ่าน ต้องคืนค่าเดิมทันที
    try {
      res = await fetch(CFG.exec, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
    } catch(netErr){
      const e2 = new Error('เชื่อมต่อไม่ได้ — เน็ตหลุดหรือสัญญาณอ่อน');
      e2.offline = true;
      throw e2;
    }
    if (!res.ok) {
      const e3 = new Error('เชื่อมต่อไม่สำเร็จ (HTTP ' + res.status + ')');
      if (res.status >= 500 || res.status === 0) e3.offline = true;   // ฝั่ง Google ล่มชั่วคราว → ส่งซ้ำได้
      throw e3;
    }
    const j = await res.json();
    if (!j.ok) throw new Error(j.error || 'ไม่ทราบสาเหตุ');
    return j;
  } finally {
    if (isWrite) _pendingWrites = Math.max(0, _pendingWrites - 1);
  }
}

/* ── v2.88: คิวบันทึกที่ค้าง — เน็ตวูบแล้วส่งซ้ำให้เอง ──
   คนนับสต๊อกในคลังสัญญาณหลุดบ่อย ติ๊กแล้วเด้งกลับเงียบๆ ต้องคอยเช็คเองว่าติดจริงไหม
   คิวเฉพาะ 'update' (เขียนทับด้วยค่าเดิมซ้ำกี่รอบผลก็เท่าเดิม) — ❌ ห้ามคิว addComment/create
   เพราะส่งซ้ำ = ได้คอมเม้น/งานซ้ำ · เก็บใน localStorage เพื่อให้รอดแม้ปิดแอปไปแล้วเปิดใหม่ */
const WQ_KEY = 'rf_wq';
let _wq = [], _wqBusy = false;
function wqLoad(){ try { _wq = JSON.parse(localStorage.getItem(WQ_KEY) || '[]') || []; } catch(e){ _wq = []; } }
function wqSave(){ try { localStorage.setItem(WQ_KEY, JSON.stringify(_wq.slice(-80))); } catch(e){} }
/* inflight = "กำลังส่งอยู่ ยังไม่ได้ล้มเหลว" — ลงคิวไว้กันหาย แต่ยังไม่ต้องขึ้นแถบเตือนสีเหลือง
   แถบเตือนนับเฉพาะของที่ส่งไม่ผ่านจริงๆ ไม่งั้นมันจะกระพริบทุกครั้งที่ติ๊กเช็คลิสต์ */
function wqPush(id, patch, label, inflight){
  // งานเดียวแก้ค้างหลายรอบ → รวมเป็นรายการเดียว (ค่าล่าสุดชนะ) ไม่ให้คิวบวม
  const cur = _wq.find(function(x){ return x.id === id; });
  if (cur) { Object.assign(cur.patch, patch); cur.label = label || cur.label; if (!inflight) cur.inflight = false; }
  else _wq.push({ id: id, patch: patch, label: label || '', ts: new Date().toISOString(), inflight: !!inflight });
  wqSave();
  if (!inflight) render();
}
// ส่งผ่านแล้ว (หรือหลังบ้านปฏิเสธถาวร) → เอาคีย์นั้นออกจากคิว
// ⚠️ เอาออกเฉพาะตอนค่าที่คิวถืออยู่ยังเป็นค่าเดิมที่เราส่งไป — ถ้ามีการแก้ใหม่แทรกเข้ามาระหว่างรอ ต้องเก็บของใหม่ไว้
function wqDone(id, key, sentVal){
  const i = _wq.findIndex(function(x){ return x.id === id; });
  if (i < 0) return;
  const it = _wq[i];
  if (it.patch[key] !== sentVal) return;
  delete it.patch[key];
  if (!Object.keys(it.patch).length) _wq.splice(i, 1);
  wqSave();
}
/* v4.13: งานแบบ "ส่งครั้งเดียวจบ" — คอมเม้น / สร้างงาน
   เข้าคิวได้แล้วเพราะหลังบ้าน v1.44 กันของซ้ำด้วย Client ID (ส่งซ้ำได้ของเดิม ไม่ได้ของใหม่)
   ต่างจาก update ตรงที่ไม่ merge patch — ซ้ำ cid = ใบเดียวกัน ไม่ต้องเพิ่ม
   local = สำเนาไว้โชว์บนจอ ถ้า loadAll เอาข้อมูลจากชีทมาทับแล้วยังไม่มีของเรา (ห้ามใส่ dataUrl รูป localStorage จะเต็ม) */
function wqPushOp(op){
  if (!op || !op.cid) return;
  if (_wq.some(function(x){ return x.cid === op.cid; })) return;
  _wq.push(Object.assign({ ts: new Date().toISOString(), inflight: true }, op));
  wqSave();
}
function wqDropOp(cid){
  const i = _wq.findIndex(function(x){ return x.cid === cid; });
  if (i >= 0) { _wq.splice(i, 1); wqSave(); }
}
function wqOp(cid){ return _wq.find(function(x){ return x.cid === cid; }); }
function wqFailedCount(){ return _wq.filter(function(x){ return !x.inflight; }).length; }
function wqFailedIds(){ const m = {}; _wq.forEach(function(x){ if (!x.inflight) m[x.id || x.taskId] = 1; }); return m; }
function wqMarkFailedOp(cid){ const it = wqOp(cid); if (it) { it.inflight = false; wqSave(); wqRetrySoon(); } }
function wqMarkFailed(id){ const it = _wq.find(function(x){ return x.id === id; }); if (it) { it.inflight = false; wqSave(); wqRetrySoon(); render(); } }
/* v4.6: มีของส่งไม่ผ่านค้างอยู่ → ลองส่งใหม่เองทุก 20 วิ จนกว่าจะหมดคิว (Surat สั่ง)
   เดิมรอ 3 จังหวะเท่านั้น: เน็ตกลับมา · กลับเข้าแอป · รอบ poll 75 วิ — ถ้าผู้ใช้เปิดแอปค้างไว้เฉยๆ ของค้างนาน */
let _wqRetryT = null, _wqNagged = false;
function wqRetrySoon(){
  if (_wqRetryT) return;
  _wqRetryT = setInterval(function(){
    if (!_wq.length) { clearInterval(_wqRetryT); _wqRetryT = null; _wqNagged = false; render(); return; }
    /* v4.7: ค้างเกิน 5 นาที = ไม่ใช่เน็ตกระตุกแล้ว ต้องเด้งบอกสักครั้ง (Surat สั่ง)
       ปกติผู้ใช้ต้องเห็นป้ายแดงเองถึงจะรู้ — ปิดแอปไปแล้วจะไม่มีทางรู้เลยว่าของยังไม่ขึ้น */
    if (!_wqNagged) {
      const oldest = _wq.reduce(function(a, x){ return (!a || x.ts < a) ? x.ts : a; }, '');
      if (oldest && (Date.now() - new Date(oldest).getTime()) > 300000) {
        _wqNagged = true;
        toast('⚠️ มี ' + _wq.length + ' รายการยังส่งขึ้นระบบไม่ได้เกิน 5 นาที — เช็คสัญญาณเน็ต แล้วเปิดแอปค้างไว้จนกว่าจะขึ้นครบ');
      }
    }
    wqFlush();
  }, 20000);
}
function wqSendOp(it){
  if (it.kind === 'comment') return api('addComment', { comment: it.payload, mentions: it.mentions || [] }, { wqBacked: true });
  if (it.kind === 'create')  return api('create', { task: it.payload }, { wqBacked: true });
  return Promise.reject(new Error('ไม่รู้จักงานชนิด ' + it.kind));
}
// ส่งผ่านแล้ว → เอาตัวชั่วคราวบนจอออก ใส่ของจริงจากชีทแทน
function wqOpDone(it, j){
  if (it.kind === 'comment' && j && j.comment) {
    cmtSentMark(it.cid);
    const i = S.comments.findIndex(function(c){ return c.clientId === it.cid; });
    if (i >= 0) S.comments[i] = j.comment; else S.comments.push(j.comment);
  }
  if (it.kind === 'create' && j && j.task) {
    const t = S.tasks.find(function(x){ return x.clientId === it.cid; });
    if (t) { if (S.detailId === t.id) S.detailId = j.task.id; t.id = j.task.id; }
  }
  invalidateDec(); render(); renderOverlays();
}
// หลังบ้านปฏิเสธถาวร (ไม่ใช่เน็ต) → ส่งซ้ำก็ไม่ผ่าน เอาตัวชั่วคราวออกแล้วบอกเหตุผล
function wqOpFailed(it, e){
  const msg = (e && e.message) || String(e);
  if (it.kind === 'comment') {
    S.comments = S.comments.filter(function(c){ return c.clientId !== it.cid; });
    if (it.payload && it.payload.text && !S.cmtDraft) S.cmtDraft = it.payload.text;   // คืนข้อความให้พิมพ์ต่อ ไม่ให้หายเปล่า
    toast('ส่งคอมเม้นไม่สำเร็จ: ' + msg);
  }
  if (it.kind === 'create') {
    const t = S.tasks.find(function(x){ return x.clientId === it.cid; });
    if (t && S.detailId === t.id) { S.detailId = null; S.closing = false; }
    S.tasks = S.tasks.filter(function(x){ return x.clientId !== it.cid; });
    toast('สร้างงานไม่สำเร็จ: ' + msg + ' — ลองใหม่อีกครั้ง');
  }
  invalidateDec(); render(); renderOverlays();
}
// เอาของที่ยังส่งไม่สำเร็จมาทับข้อมูลที่เพิ่งโหลดมา — ไม่งั้นสิ่งที่ผู้ใช้ทำไว้จะหายไปต่อหน้า
/* 🔴 v4.11: ของในคิวห้ามทับข้อมูลที่ชีท "เห็นทีหลัง" แล้ว
   เดิม replay ทุกใบทุกรอบโดยไม่มีวันหมดอายุ → ใบที่ค้าง (ส่งถึงชีทแล้วแต่คำตอบหายกลางทาง)
   จะย้อนสถานะเก่าทับของจริง **ทุกครั้งที่เปิดแอป** = งานที่ปิดไปแล้วโผล่กลับมาค้างอยู่
   ตั้งแต่ v4.4/v4.6 ที่ให้ติ๊กเช็คลิสต์+เปลี่ยนสถานะเข้าคิวทุกครั้ง โอกาสเจอเพิ่มขึ้นมาก
   กติกา: ชีทถูกแก้หลังเวลาที่เราเข้าคิว = ของเราถึงแล้ว (หรือมีคนแก้ทีหลัง) → ชีทชนะ ทิ้งใบนั้น
   ที่ยังค้างจริงๆ (ออฟไลน์) ts จะใหม่กว่า updatedAt ของชีทเสมอ → ยังถูกเก็บ+ส่งต่อเหมือนเดิม */
function wqTime(v){ const n = Date.parse(v); return isFinite(n) ? n : NaN; }
function wqApply(){
  const now = Date.now();
  const keep = [];
  _wq.forEach(function(it){
    const qt = wqTime(it.ts);
    if (isFinite(qt) && now - qt > 3 * 864e5) return;            // ค้างเกิน 3 วัน = ไม่ใช่ของสดแล้ว ทิ้ง
    /* v4.13: คอมเม้น/งานที่ยังส่งไม่ถึงชีท — loadAll เพิ่งเอาชุดจากชีทมาทับ ของเราหายจากจอ
       เอากลับใส่ให้ ถ้าในชุดใหม่ยังไม่มีใบที่ clientId ตรงกัน (มีแล้ว = ถึงชีทแล้ว ไม่ต้องใส่ซ้ำ) */
    if (it.kind === 'comment') {
      if (it.local && !S.comments.some(function(c){ return c.clientId === it.cid; })) S.comments.push(it.local);
      keep.push(it); return;
    }
    if (it.kind === 'create') {
      if (it.local && !S.tasks.some(function(x){ return x.clientId === it.cid; })) S.tasks.push(it.local);
      keep.push(it); return;
    }
    const t = S.tasks.find(function(x){ return x.id === it.id; });
    if (!t) { keep.push(it); return; }                           // ยังไม่เห็นงานนี้ในชุดที่โหลดมา — เก็บไว้ก่อน
    const st = wqTime(t.updatedAt);
    if (isFinite(qt) && isFinite(st) && st > qt) return;         // ชีทใหม่กว่า → ชีทชนะ
    Object.keys(it.patch).forEach(function(k){ t[k] = it.patch[k]; });
    keep.push(it);
  });
  if (keep.length !== _wq.length) { _wq = keep; wqSave(); }
}
/* 🔴 v4.10 — เอาของออกจากคิวต้อง "เทียบค่าที่ส่งไปจริง" ห้าม shift() ตัวหน้าทิ้งดื้อๆ
   ระหว่างที่รอหลังบ้านตอบ (GAS ใช้ 3-6 วิ) คิวขยับได้ 2 ทาง แล้ว shift() ลบผิดตัวทั้งคู่:
   (ก) คำขอตรงของงานอื่นสำเร็จ → wqDone splice ตัวหน้าออกไปแล้ว → shift() ไปลบ "ตัวถัดไปที่ยังไม่เคยส่ง" = หายถาวร
   (ข) ผู้ใช้ติ๊กเพิ่มระหว่างรอ → ค่าใหม่ merge เข้า patch เดิม → shift() ทิ้งทั้งก้อนรวมค่าใหม่ที่ยังไม่ได้ส่ง
   → ใช้ wqDone() ทีละคีย์เหมือนทางอื่นทั้งหมด: ตรงกับที่ส่งไปเท่านั้นถึงเอาออก ค่าใหม่ที่แทรกเข้ามาอยู่ต่อ */
async function wqFlush(){
  if (_wqBusy || !_wq.length) return;
  if (navigator.onLine === false) return;
  _wqBusy = true;
  const before = _wq.length;
  try {
    let guard = 0;
    while (_wq.length && guard++ < 200) {       // กันวนไม่รู้จบถ้ามีค่าใหม่แทรกทุกรอบ
      const it = _wq[0];
      /* v4.13: งานส่งครั้งเดียวจบ (คอมเม้น/สร้างงาน) — สำเร็จหรือโดนปฏิเสธถาวร = เอาออกทั้งใบ
         ไม่ต้องเทียบทีละคีย์เหมือน update เพราะไม่มีการ merge ค่าใหม่เข้าใบเดิม */
      if (it.kind) {
        try {
          const j = await wqSendOp(it);
          wqDropOp(it.cid);
          wqOpDone(it, j);
        } catch(e){
          if (e && e.offline) { it.inflight = false; wqSave(); break; }
          wqDropOp(it.cid);
          wqOpFailed(it, e);
        }
        continue;
      }
      const sent = Object.assign({}, it.patch); // ค่าที่ส่งไปจริงรอบนี้ — ใช้เทียบตอนเอาออก
      if (!Object.keys(sent).length) { _wq.splice(0, 1); wqSave(); continue; }   // ไม่มีอะไรจะส่ง = ทิ้ง กันวนเปล่า
      try {
        await api('update', { id: it.id, patch: sent }, { wqBacked: true });
        Object.keys(sent).forEach(function(k){ wqDone(it.id, k, sent[k]); });
        wqSave();
      } catch(e){
        if (e && e.offline) {                   // ยังส่งไม่ได้ → เก็บไว้ก่อน ลองใหม่รอบหน้า
          wqMarkFailed(it.id);                  // v4.10: ต้องขึ้นแถบเตือน+ป้ายบนแถวงานด้วย ไม่งั้นของค้างแบบเงียบๆ
          break;
        }
        Object.keys(sent).forEach(function(k){ wqDone(it.id, k, sent[k]); });   // หลังบ้านปฏิเสธ → ส่งซ้ำก็ไม่ผ่าน
        wqSave();
        toast('บันทึกที่ค้างไว้ไม่ผ่าน: ' + (e && e.message || e));
      }
    }
  } finally { _wqBusy = false; }
  if (before && !_wq.length) { toast('ส่งงานที่ค้างขึ้นครบแล้ว ✓'); loadAll(true); }
  render();
}
window.addEventListener('online', function(){ wqFlush(); });
/* ── session / auth ── */
let SESSION = {};
try { SESSION = JSON.parse(localStorage.getItem('rf_session') || '{}'); } catch(e){}
function saveSession(){ try { localStorage.setItem('rf_session', JSON.stringify({ email: S.me.email, name: S.me.name })); } catch(e){} }
function clearSession(){ SESSION = {}; try { localStorage.removeItem('rf_session'); localStorage.removeItem('rf_cache'); } catch(e){} }

/* ── boot cache — เปิดแอปติดทันทีด้วยข้อมูลรอบก่อน แล้ว sync ของจริงเบื้องหลัง (list ใช้ ~3 วิ) ── */
// v3.6: ต้องเก็บ plans ด้วย — เดิมไม่ได้เก็บ เปิดแอปจาก cache แล้วหน้าแผนขึ้น "ยังไม่มีแผน" จนกว่า loadAll จะกลับมา (ตกใจว่าแผนหาย)
/* 🔴 v4.11 — "เปิดจอมาแล้วงานที่ทำเสร็จ/เก็บไปแล้วยังค้างอยู่ คนตกใจ" (Surat แจ้ง 30 ก.ค.)
   ต้นเหตุ: cache ก้อนนี้ไม่มีวันหมดอายุ และหน้าตาเหมือนข้อมูลสดทุกประการ
   เปิดแอป = โชว์ snapshot รอบที่แล้วทันที แล้วค้างจนกว่า loadAll จะกลับมา
   ปกติ 3-6 วิ แต่ถ้า GAS เพิ่งตื่น (cold start) คือ ~90 วิ — ผู้ใช้นั่งดูจอที่ยังเป็นของเมื่อวาน
   ยิ่งวันนี้ย้ายงานที่ปิดแล้ว 54 ใบเข้าคลังเก็บ snapshot เก่าของทุกคนยิ่งไม่ตรงหนัก
   แก้ 2 ชั้น: (1) ประทับเวลาไว้ทุกครั้ง (2) ตราบใดที่ยังไม่ได้ข้อมูลสดรอบแรก ต้องมีแถบบอกชัดว่า "นี่ของเก่า" */
let _bootStale = 0;      // เวลาที่ cache ถูกบันทึกไว้ (0 = ข้อมูลสดแล้ว)
function saveCache(){ try { localStorage.setItem('rf_cache', JSON.stringify({ email: S.me.email, ts: new Date().toISOString(), me: S.me, users: S.users, tasks: S.tasks, comments: S.comments, plans: S.plans })); } catch(e){} }
function loadCache(){
  try {
    const c = JSON.parse(localStorage.getItem('rf_cache') || 'null');
    if (!c || !c.me || c.email !== SESSION.email) return false;
    S.me = c.me; S.users = c.users || []; S.tasks = c.tasks || []; S.comments = c.comments || []; S.plans = c.plans || [];
    _bootStale = Date.parse(c.ts || '') || -1;   // -1 = ของเก่าจากก่อนมีการประทับเวลา (ยังต้องขึ้นแถบ)
    invalidateDec();
    initWarehouseFilter();   // เปิดจาก cache ก็ให้ชิปคลังเป็นคลังตัวเองตั้งแต่เฟรมแรก
    return true;
  } catch(e){ return false; }
}
// อายุของที่ค้างบนจอ — ใช้เขียนข้อความบนแถบให้ตรงกับความจริง ไม่ใช่แค่ "กำลังโหลด"
function staleLabel(){
  if (!_bootStale) return '';
  if (_bootStale < 0) return 'ข้อมูลรอบที่แล้ว';
  const mins = Math.floor((Date.now() - _bootStale) / 60000);
  if (mins < 1) return 'ข้อมูลเมื่อครู่นี้';
  if (mins < 60) return 'ข้อมูลเมื่อ ' + mins + ' นาทีที่แล้ว';
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return 'ข้อมูลเมื่อ ' + hrs + ' ชม.ที่แล้ว';
  return 'ข้อมูลเมื่อ ' + Math.floor(hrs / 24) + ' วันที่แล้ว';
}

function parseJwt(tok){
  const b = tok.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');
  const s = atob(b);
  return JSON.parse(decodeURIComponent(Array.prototype.map.call(s, c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join('')));
}
function initGsi(){
  if (!(window.google && google.accounts && google.accounts.id)) { setTimeout(initGsi, 250); return; }
  google.accounts.id.initialize({ client_id: CFG.clientId, callback: onCredential });
  const holder = document.getElementById('gsiBtn');
  if (holder) google.accounts.id.renderButton(holder, { theme:'outline', size:'large', shape:'pill', text:'signin_with', locale:'th' });
}
function onCredential(resp){
  let p = null;
  try { p = parseJwt(resp.credential); } catch(e){}
  if (!p || !p.email) { showLoginErr('อ่านข้อมูลบัญชี Google ไม่สำเร็จ ลองใหม่อีกครั้ง'); return; }
  SESSION = { email: String(p.email).toLowerCase(), name: p.name || '' };
  document.getElementById('gsiBtn').style.display = 'none';
  document.getElementById('loginSpin').style.display = 'block';
  document.getElementById('loginErr').style.display = 'none';
  loadAll(false).then(initSession);   // ล็อกอินครั้งแรกต้องเปิด auto-refresh/นอติ/ลากรีเฟรช เหมือนตอน boot ด้วย
}
// เปิดระบบที่ต้องมี session — เรียกได้ซ้ำ (startPolling กันซ้ำในตัวเอง)
function initSession(){
  if (!SESSION.email) return;
  wqLoad(); wqFlush(); if (_wq.length) wqRetrySoon();   // มีของค้างจากรอบก่อน (ปิดแอปตอนเน็ตหลุด) → ส่งต่อให้จบ + ตั้งลองซ้ำทุก 20 วิ
  if (calOn()) calRefreshEvents();   // ดึงนัดจากปฏิทินมาโชว์ (ส่วนซิงก์งานทำใน loadAll ตอนข้อมูลพร้อม)
  initNotifSeen();    // ตั้ง "เวลาดูล่าสุด" ครั้งแรก — ไม่นับงานเก่าเป็นใหม่
  /* v4.15: เลื่อนออกไปก่อน — Apps Script รันทีละคำขอต่อผู้ใช้ ยิงพร้อม list ตอนเปิดแอป
     ทำให้ข้อมูลจริงมาช้าลงโดยไม่จำเป็น · แจ้งเตือนช้าไป 3 วิ ไม่มีใครรู้สึก */
  setTimeout(initPushOnBoot, 3000);   // คนที่เปิดแจ้งเตือนแล้ว → ต่อ listener + refresh token
  startPolling();     // รีเฟรชอัตโนมัติ — เห็นงานใหม่/นอติโดยไม่ต้องรีเฟรชเอง
  initPullRefresh();  // มือถือ: ลากลงบนสุดเพื่อรีเฟรช
}

/* ── data load ── */
let _pollStarted = false, _prevUnread = null, _pendingTaskOpen = '';
/* ══ v4.2: คลังเก็บงานที่ปิดแล้ว ══
   เปิดแอปมาได้แค่ "ดัชนีย่อ" ของงานที่ปิดแล้ว (พอสำหรับตัวเลขบนภาพรวม/แผน แต่ไม่มีรายละเอียด/เช็คลิสต์/รูป)
   จะเห็นของเต็มต้องกดดู — โหลดครั้งเดียวต่อการเปิดแอป แล้วเก็บไว้ทับกลับทุกครั้งที่ sync */
let _arcFull = {}, _arcCmts = [], _arcState = '';   // '' ยังไม่โหลด · 'loading' · 'done'
function needArchive(t){ return !!(t && t.lite); }
function loadArchive(){
  if (_arcState === 'done') return Promise.resolve();
  if (_arcState === 'loading') return Promise.resolve();
  _arcState = 'loading';
  return api('listArchive', {}).then(function(j){
    (j.tasks || []).forEach(function(t){ _arcFull[t.id] = t; });
    _arcCmts = j.comments || [];
    const byId = {};
    S.tasks.forEach(function(t){ byId[t.id] = 1; });
    S.tasks = S.tasks.map(function(t){ return _arcFull[t.id] || t; });
    Object.keys(_arcFull).forEach(function(id){ if (!byId[id]) S.tasks.push(_arcFull[id]); });
    const have = {}; S.comments.forEach(function(c){ have[c.id] = 1; });
    _arcCmts.forEach(function(c){ if (!have[c.id]) S.comments.push(c); });
    _arcState = 'done';
    invalidateDec(); render(); renderOverlays();
  }).catch(function(e){
    _arcState = '';
    // หลังบ้านยังไม่ได้ deploy v1.42 → ไม่มี action นี้ · ไม่ต้องกวนผู้ใช้ ของเดิมยังใช้ได้ปกติ
    if (!(e && /unknown action/i.test(String(e.message || e)))) toast('โหลดงานที่ปิดแล้วไม่สำเร็จ: ' + (e && e.message || e));
  });
}
// ครั้งแรกที่รู้ว่าเราอยู่คลังไหน → ตั้งชิปคลังเป็นคลังตัวเอง (ทำครั้งเดียว · ถ้าผู้ใช้กด "ทั้งหมด" เองต้องไม่ถูกเซ็ตกลับ)
function initWarehouseFilter(){
  if (S._fwInit) return;
  S._fwInit = true;
  if (S.me && S.me.role >= 7) return;   // ผู้บริหาร (R7) เปิดมาเห็นทุกคลัง
  const myW = String((S.me && S.me.warehouse) || '').trim().toUpperCase();
  if (myW) S.filterWs = [myW];          // default = คลังตัวเอง (เลือกเพิ่มได้)
}
/* v4.15: นัดโหลดใหม่เร็วๆ หลังผลโหลดถูกทิ้ง — กันซ้อนด้วยตัวจับเวลาตัวเดียว */
let _reloadT = null;
function retrySoonLoad(){
  if (_reloadT) return;
  _reloadT = setTimeout(function(){ _reloadT = null; loadAll(true); }, 3000);
}
async function loadAll(silent){
  if (!SESSION.email) { showLogin(); return; }
  if (!silent) { S.loading = true; showApp(); render(); }
  const seq0 = _writeSeq;   // จำจุดเริ่ม — ใช้เทียบว่ามีการเขียนแทรกเข้ามาระหว่างรอผลไหม
  try {
    const j = await api('list');
    /* ระหว่างดึงข้อมูล ผู้ใช้เพิ่งกด/ติ๊ก/บันทึกอะไร → อย่าทับ state ด้วยข้อมูลเก่า (กัน "สั่งงานอยู่แล้วหาย")
       เช็ค 2 ชั้น: ยังเขียนไม่เสร็จ (_pendingWrites) + เขียนไปแล้วระหว่างรอ (_writeSeq เปลี่ยน) */
    // v4.5: กันจอว่าง — ถ้ายังไม่มีข้อมูลอะไรบนจอเลย ห้ามทิ้งผลโหลด ต่อให้มีเขียนค้างอยู่
    // (ทิ้งแล้วผู้ใช้เห็น "ไม่มีงาน" แล้วเข้าใจผิดว่างานหมดแล้ว — อันตรายกว่าข้อมูลเก่าทับ)
    /* v4.15: ทิ้งผลโหลดแล้วห้ามปล่อยให้รอรอบ poll ถัดไป (75 วิ) — ลองใหม่ใน 3 วิ
       ต้นเหตุที่ทำให้ต้องทิ้งมักจบภายในไม่กี่วินาที (เขียนเสร็จ/พิมพ์เสร็จ) รอเป็นนาทีไม่มีเหตุผล */
    if (silent && S.tasks.length && (_pendingWrites > 0 || _writeSeq !== seq0)) { resolvePendingOpen(true); retrySoonLoad(); return; }
    if (silent && typingNow()) { retrySoonLoad(); return; }   // กำลังพิมพ์อยู่ → เลื่อนไปรอบหน้า ไม่ rebuild ทับของที่ค้างในช่อง
    S.me = prepUser(j.me);
    S.beVer = String(j.ver || '');   // v4.12: เวอร์ชันหลังบ้าน — ใช้เช็คว่ารองรับกันของซ้ำ (Client ID) แล้วหรือยัง
    initWarehouseFilter();
    S.users = (j.users || []).map(prepUser);
    /* v4.2: หลังบ้านส่งงานที่ปิดแล้วมาเป็น "ดัชนีย่อ" (j.closed) แทนแถวเต็ม
       รวมเข้า S.tasks เลย → ตัวเลขบนภาพรวม · ผลของแผน · ผลงานรายคน ใช้ได้เหมือนเดิมทุกอย่าง
       ตัวเต็ม (รายละเอียด/เช็คลิสต์/รูป/คอมเม้น) ค่อยโหลดตอนกดดูด้วย loadArchive()
       ⚠️ ต้องเอาตัวเต็มที่โหลดไว้แล้วทับกลับ ไม่งั้น sync รอบถัดไปจะกลายเป็นแถวย่อยอีก */
    S.tasks = (j.tasks || []).concat(j.closed || []).map(function(t){ return _arcFull[t.id] || t; });
    S.comments = j.comments || [];
    if (_arcCmts.length) { const have = {}; S.comments.forEach(function(c){ have[c.id] = 1; }); _arcCmts.forEach(function(c){ if (!have[c.id]) S.comments.push(c); }); }
    S.plans = j.plans || [];
    wqApply();   // ของที่ยังส่งไม่สำเร็จต้องยังเห็นอยู่ ไม่ถูกข้อมูลจากชีททับหาย
    invalidateDec();
    const _nu = notifUnread();   // มีของใหม่เข้ามาระหว่าง sync → เด้ง toast (ข้ามรอบโหลดแรก)
    if (_prevUnread !== null && _nu > _prevUnread) toast('🔔 มีแจ้งเตือนใหม่ ' + (_nu - _prevUnread) + ' รายการ');
    _prevUnread = _nu;
    updateAppBadge();
    if (!S.calSel) {
      const td = pd(todayIso());
      S.calSel = todayIso(); S.calY = td.getFullYear(); S.calM = td.getMonth();
    }
    S.loading = false;
    _bootStale = 0;    // v4.11: ได้ของสดจากชีทแล้ว — แถบ "ข้อมูลเมื่อ…" หายไปเอง
    saveSession(); saveCache(); showApp(); render(); renderOverlays();
    if (!silent) restoreScroll();     // เปิดแอปครั้งแรก: ข้อมูลพร้อมแล้วค่อยเลื่อนไปที่ค้างไว้
    calSyncIfStale();
    maybeFirstNag();
    rtLoadMine();
    resolvePendingOpen();   // เปิดงานจากลิงก์นอติ หลังข้อมูลพร้อม (ถ้ายังไม่พบ → หน้ารอบอกสาเหตุ)
    if (_pendingRoutine) { _pendingRoutine = false; RF.openRoutine(); }   // เปิดจากนอติงานประจำ (?routine=1)
  } catch(e){
    const msg = String(e.message || e);
    if (/user not found|user inactive/i.test(msg)) {
      clearSession();
      showLoginErr(/inactive/i.test(msg) ? 'บัญชีของคุณถูกปิดใช้งาน (inactive) — ติดต่อผู้ดูแลระบบ' : 'ไม่พบอีเมลนี้ในรายชื่อผู้ใช้ Rattana — ติดต่อผู้ดูแลระบบเพื่อเพิ่มสิทธิ์');
      return;
    }
    if (S.loading) { S.loading = false; render(); }
    toast('โหลดข้อมูลไม่สำเร็จ: ' + msg);
  }
}

// รีเฟรชเงียบทุก 40 วิ (เฉพาะตอนเปิดแอปอยู่ + ไม่มี modal เปิด) + รีเฟรชทันทีเมื่อสลับกลับมาแอป
// คอมเม้นสด: ดึงเฉพาะคอมเม้นของงานที่เปิดอยู่ (เบากว่าโหลดทั้งก้อนมาก) — ไม่ rebuild ถ้าไม่มีอะไรใหม่
async function pollComments(){
  const taskId = S.detailId;
  if (!taskId || !SESSION.email || S.cmtSending || S._cmtBusy) return;   // _cmtBusy = คอมเม้นเราเองยังบันทึกไม่เสร็จ ดึงตอนนี้จะซ้ำ
  try {
    const j = await api('listComments', { taskId: taskId });
    if (S.detailId !== taskId) return;                       // ผู้ใช้เปลี่ยนงานระหว่างรอ → ทิ้งผลลัพธ์
    const fresh = j.comments || [];
    const cur = S.comments.filter(function(c){ return c.taskId === taskId; });
    const tmps = cur.filter(function(c){ return String(c.id || '').indexOf('tmp') === 0; });   // ที่เพิ่งส่งยังไม่ตอบกลับ เก็บไว้
    const added = fresh.length - (cur.length - tmps.length);
    if (added <= 0) return;                                  // ไม่มีคอมเม้นใหม่ → ไม่ต้อง rebuild (กันจอกระตุก)
    S.comments = S.comments.filter(function(c){ return c.taskId !== taskId; }).concat(fresh, tmps);
    invalidateDec();
    toast('💬 มีคอมเม้นใหม่ ' + added);
    if (!patchCmt(taskId)) { renderOverlays(); render(); }
  } catch(e){}
}

function startPolling(){
  if (_pollStarted) return;
  _pollStarted = true;
  // ห้าม sync ตอนกรอกฟอร์ม/ลากของ (จอจะกระตุก) — แต่ "เปิดหน้ารายละเอียดอยู่" sync ได้ (เดิมบล็อกไว้ เลยไม่เห็นคอมเม้นใหม่)
  // + ห้าม sync ตอน "กำลังพิมพ์อยู่" ทุกช่อง — rebuild ระหว่างพิมพ์ทำ focus/ข้อความหลุด (เลื่อนไปรอบหน้าแทน)
  window.addEventListener('pagehide', flushClSaves);      // ปิดแท็บ/สลับหน้า — จังหวะสุดท้ายที่ยังส่งได้
  window.addEventListener('beforeunload', flushClSaves);
  const canSync = function(){ return SESSION.email && !S.loading && document.visibilityState === 'visible' && !S.formOpen && !S.goalEdit && !S.impact && !S.asgPick && !S.dragId && !S._clDrag && !S.recurForm && !S.clEdit && _pendingWrites === 0 && !hasPendingClSave() && !typingNow(); };
  setInterval(function(){ if (canSync()) { wqFlush(); loadAll(true); } }, 75000);
  setInterval(function(){ if (canSync() && S.detailId && !S.closing) pollComments(); }, 15000);
  document.addEventListener('visibilitychange', function(){
    if (document.visibilityState !== 'visible') { flushClSaves(); return; }   // สลับออกจากแอป → ส่งที่ค้างก่อน
    updateAppBadge();                    // กลับเข้าแอป → เลขแดงบนไอคอนตรงกับที่ยังไม่ได้อ่านจริง
    wqFlush();                           // กลับมาแล้วเน็ตอาจติดแล้ว → ส่งของที่ค้างก่อน
    if (canSync()) loadAll(true);
  });
}

/* ── ลากลงเพื่อรีเฟรช (มือถือ) — เร็วกว่า native pull-to-refresh เพราะ sync เงียบ ไม่โหลดหน้าใหม่ทั้งหน้า ── */
function initPullRefresh(){
  const TH = 70;                       // ต้องลากลงเกินนี้ถึงจะรีเฟรช
  let startY = 0, pulling = false, dist = 0, bar = null;
  function barEl(){
    if (!bar || !document.body.contains(bar)) { bar = document.createElement('div'); bar.className = 'rf-pull'; document.body.appendChild(bar); }
    return bar;
  }
  function show(d){
    const el = barEl(), go = d >= TH;
    el.style.height = Math.min(d, 90) + 'px';
    el.classList.toggle('go', go);
    el.textContent = go ? '↻ ปล่อยเพื่อรีเฟรช' : '↓ ลากลงเพื่อรีเฟรช';
  }
  function hide(){ if (bar) { bar.style.height = '0px'; bar.classList.remove('go'); } }
  document.addEventListener('touchstart', function(e){
    pulling = false; dist = 0;
    if (!SESSION.email || S.loading || anyModalOpen()) return;
    if ((window.scrollY || document.documentElement.scrollTop || 0) > 0) return;
    if (!e.touches || e.touches.length !== 1) return;
    startY = e.touches[0].clientY; pulling = true;
  }, { passive: true });
  document.addEventListener('touchmove', function(e){
    if (!pulling) return;
    dist = e.touches[0].clientY - startY;
    if (dist > 0 && (window.scrollY || 0) === 0) show(dist); else hide();
  }, { passive: true });
  document.addEventListener('touchend', function(){
    if (pulling && dist >= TH) { hide(); toast('กำลังรีเฟรช…'); loadAll(true); } else hide();
    pulling = false; dist = 0;
  });
  document.addEventListener('touchcancel', function(){ hide(); pulling = false; dist = 0; });
}

/* ── deep-link จากนอติ: ลิงก์มี ?task=<id> → เปิดงานนั้น ──
   โหมดตรวจ (debug): เปิดแอปด้วย ?debug=1 ครั้งเดียว → toast ทุกครั้งที่ SW ส่งเรื่องมา (ปิดด้วย ?debug=0)
   ไว้ไล่เคสมือถือรุ่นแปลกๆ ว่ากดนอติแล้วข้อความถึงแอปไหม โดยไม่ต้องต่อคอมฯ เปิด console */
function pushDebugOn(){ try { return localStorage.getItem('rf_push_debug') === '1'; } catch(e){ return false; } }
function pushLog(msg, obj){
  try { console.log('[R-Flow push] ' + msg, obj === undefined ? '' : obj); } catch(e){}
  if (pushDebugOn()) { try { toast('🐞 ' + msg); } catch(e){} }
}
function taskFromLink(u){ try { const m = String(u || '').match(/[?&#]task=([^&#]+)/); return m ? decodeURIComponent(m[1]) : ''; } catch(e){ return ''; } }
// tag ของนอติ = 'task-<id>' — ใช้กู้ id ตอน notification.data หาย (iOS PWA / SW ถูกปลุกใหม่)
function tagTaskId(tag){ const t = String(tag || ''); return t.indexOf('task-') === 0 ? t.slice(5) : ''; }
// meta = ข้อมูลจากตัวนอติเอง (ชื่องาน/คนสั่ง) — ใช้โชว์ระหว่างรอโหลด ไม่ต้องรอ backend
function openTaskFromLink(u, meta){
  const id = taskFromLink(u);
  if (!id) return false;
  if (S.tasks.some(function(t){ return t.id === id; })) { pushLog('เปิดงาน ' + id + ' (มีในเครื่องแล้ว)'); RF.openTask(id); hintMoreNotifs(id); return true; }
  pushLog('งาน ' + id + ' ยังไม่มีในเครื่อง → เปิดหน้ารอ + ดึงข้อมูลใหม่');
  openTaskPending(id, meta);   // งานเพิ่งถูกสร้าง/ยังไม่ sync → เปิดหน้ารอทันที แล้วค่อยโหลด
  return true;
}
// เปิดงานจากนอติแล้วยังมีนอติค้างอีก → บอกให้รู้ จะได้ไม่ต้องไล่กดทีละอันจาก shade
function hintMoreNotifs(openedId){
  try {
    const seen = notifSeen(); if (!seen) return;
    const n = notifFeed().filter(function(i){ return i.ts > seen && i.taskId !== openedId; }).length;
    if (n > 0) setTimeout(function(){ toast('🔔 ยังมีแจ้งเตือนใหม่อีก ' + n + ' รายการ — แตะกระดิ่งดูทั้งหมด'); }, 900);
  } catch(e){}
}
let _pendTimer = null;
function openTaskPending(id, meta){
  meta = meta || {};
  S.taskPending = { id: id, title: String(meta.title || ''), sub: String(meta.sub || ''), failed: false, fresh: true };
  _pendingTaskOpen = id;
  S.detailId = null; S.closing = false; S.listPop = null; S.menuOpen = false;
  renderOverlays(); syncHistory();
  loadAll(true);
  if (_pendTimer) clearTimeout(_pendTimer);
  _pendTimer = setTimeout(function(){                         // เน็ตค้าง/โหลดไม่จบ → ให้ปุ่มลองใหม่ ไม่ปล่อยหมุนค้าง
    if (S.taskPending && !S.detailId) { S.taskPending.failed = true; renderOverlays(); }
  }, 15000);
}
// โหลดเสร็จแล้ว → เปิดงานที่ค้างอยู่ (จากลิงก์ตอนเปิดแอป หรือจากนอติตอนแอปเปิดอยู่)
/* softOnly = เรียกตอนข้อมูลยังไม่ครบ (จาก cache / โหลดที่คืนก่อนกำหนด)
   → เปิดได้เฉพาะงานที่มีอยู่แล้วจริง · ยังไม่มีก็เงียบไว้ ห้ามสรุปว่า "ไม่พบงาน" เพราะของจริงอาจกำลังมา */
function resolvePendingOpen(softOnly){
  const id = _pendingTaskOpen || (S.taskPending && S.taskPending.id) || '';
  if (!id) return;
  if (softOnly && !S.tasks.some(function(t){ return t.id === id; })) return;
  if (S.tasks.some(function(t){ return t.id === id; })) {
    _pendingTaskOpen = ''; if (_pendTimer) { clearTimeout(_pendTimer); _pendTimer = null; }
    pushLog('โหลดเสร็จ → เปิดงาน ' + id);
    RF.openTask(id);
    hintMoreNotifs(id);
    return;
  }
  _pendingTaskOpen = '';                                       // โหลดสดแล้วยังไม่มี = ถูกลบ หรือไม่มีสิทธิ์เห็น
  pushLog('โหลดเสร็จแล้วยังไม่พบงาน ' + id);
  if (S.taskPending) { S.taskPending.failed = true; S.taskPending.gone = true; renderOverlays(); }
  else toast('ไม่พบงานนี้ — อาจถูกลบ หรือคุณไม่มีสิทธิ์เห็น');
}
let _pendingRoutine = false;
function routineFromLink(u){ return /[?&]routine=1/.test(String(u || '')); }
function setupDeepLink(){
  try {
    const dbg = String(location.search || '').match(/[?&]debug=([01])/);
    if (dbg) localStorage.setItem('rf_push_debug', dbg[1]);
  } catch(e){}
  _pendingTaskOpen = taskFromLink(location.href);   // แอปเปิดจากนอติ (ปิดอยู่) → จำไว้เปิดหลังโหลดเสร็จ
  _pendingRoutine = routineFromLink(location.href); // นอติงานประจำใช้ ?routine=1 (ไม่มี task id)
  try {
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.addEventListener('message', function(e){
        if (!e.data || e.data.type !== 'rf-open') return;
        pushLog('ได้รับจากนอติ: ' + (e.data.link || '') + (e.data.tag ? ' [tag ' + e.data.tag + ']' : ''), e.data);
        if (routineFromLink(e.data.link)) { RF.openRoutine(); return; }          // แอปเปิดอยู่ กดนอติงานประจำ
        const d = e.data.data || {};
        const meta = { title: d.taskTitle || e.data.body || '', sub: d.fromName ? ((e.data.title || 'แจ้งเตือน') + ' · จาก ' + d.fromName) : (e.data.title || '') };
        if (openTaskFromLink(e.data.link, meta)) return;
        const tid = tagTaskId(e.data.tag);                                        // ลิงก์ไม่มี ?task= → เอา id จาก tag ของนอติ
        if (tid) { pushLog('ลิงก์ไม่มี task → ใช้ tag: ' + tid); openTaskFromLink('?task=' + encodeURIComponent(tid), meta); return; }
        // ระบุงานไม่ได้จริงๆ → เปิดรายการแจ้งเตือน ไม่ปล่อยให้ค้างหน้าเดิม (ผู้ใช้จะนึกว่ากดแล้วไปงานเก่า)
        pushLog('ระบุงานจากนอติไม่ได้ → เปิดรายการแจ้งเตือนแทน');
        RF.openNotif();
      });
      // ⚠️ คิวข้อความของ ServiceWorkerContainer เริ่มต้นปิดอยู่ — addEventListener อย่างเดียวบางเบราว์เซอร์ไม่ได้รับเลย
      if (navigator.serviceWorker.startMessages) navigator.serviceWorker.startMessages();
    }
  } catch(e){}
}

function anyModalOpen(){ return S.formOpen || S.menuOpen || !!S.listPop || !!S.asgPick || !!S.recurForm || !!S.taskPending || !!S.impact || !!S.goalEdit || !!S.planForm || !!S.planPick || !!S.taskPick || !!S.imgView || (!!S.detailId && !S.closing); }
function syncHistory(){ if (anyModalOpen() && !S._histPushed) { S._histPushed = true; try { history.pushState({ rf: 1 }, ''); } catch(e){} } }
function dropHistory(){ if (S._histPushed && !anyModalOpen()) { S._histPushed = false; try { history.back(); } catch(e){} } }
window.addEventListener('popstate', function(){
  if (!anyModalOpen()) return;           // ไม่มี sheet เปิด → ปล่อย back ทำงานปกติ

  else if (S.asgPick) RF.clAsgClose();

  else if (S.planPick) RF.planPickClose(true);
  else if (S.planForm) RF.planClose(true);
  else if (S.goalEdit) RF.goalEditClose(true);

  else if (S.listPop) RF.closePop(true);
  else if (S.taskPending) RF.closePending(true);
  else if (S.detailId && !S.closing) RF.closeDetail(true);

/* ── main render ── */
function render(){
  const app = document.getElementById('app');
  if (!app) return;
  S._bgDirty = false;                    // วาดทั้งหน้าอยู่แล้ว — ของที่ค้างไว้ให้วาดทีหลังถือว่าเคลียร์
  if (S.dragId) return;                  // ระหว่างลากการ์ด ห้าม rebuild DOM — การ์ดที่ลากถูกทำลายแล้ว drop ไม่ทำงาน (กัน sync เบื้องหลังมาชนตอนลาก)
  if (S._clDrag) return;                  // ระหว่างลากจัดลำดับเช็คลิสต์ ห้าม rebuild เช่นกัน
  invalidateDec();
  const fs = focusSnap();                // จำช่องที่กำลังพิมพ์อยู่ (เช่น ช่องค้นหา) — innerHTML ทำ focus + ตัวหนังสือหลุด
  const sy = window.scrollY;             // จำตำแหน่ง scroll ก่อน rebuild — innerHTML ทำจอเด้งกลับบนสุด
  const mob = isMob();
  let html = '';
  if (!mob) html += sideHtml();
  html += '<div class="rf-main">' + headHtml(mob) + '<div class="rf-content">' + bannerHtml() + (S.loading ? skelHtml() : viewHtml(mob)) + '</div></div>';
  app.innerHTML = html;
  if (mob) {
    app.insertAdjacentHTML('beforeend', bnavHtml() + '<button class="rf-fab" onclick="RF.newTask()" title="สร้างงานใหม่">' + IC.plus.replace('width="16" height="16"','width="24" height="24"') + '</button>');
  }
  window.scrollTo(0, sy);                // คืนตำแหน่งเดิม — หน้าไหนตั้งใจขึ้นบนสุด เรียก scrollTo(0,0) เองหลัง render()
  focusBack(fs);
  syncHeadH();
}
// วัดความสูง header จริงแล้วเก็บใน --headh — แถบที่ sticky ใต้มัน (หัวบอร์ด) จะได้ไม่ทับ
function syncHeadH(){
  const hd = document.querySelector('.rf-head');
  if (hd) document.documentElement.style.setProperty('--headh', Math.round(hd.getBoundingClientRect().height) + 'px');
}

/* ── กันพิมพ์อยู่แล้วโดนเด้งออก ──
   ทุกช่องที่มี id: จำ focus + ตำแหน่งเคอร์เซอร์ + ข้อความ ก่อน rebuild แล้วคืนให้หลัง rebuild
   (ช่องที่เก็บค่าไว้ใน DOM อย่างเดียว เช่น ช่องเพิ่มเช็คลิสต์ ถ้าไม่คืนค่า ข้อความที่พิมพ์ค้างจะหาย) */
function isTyping(){
  const ae = document.activeElement;
  if (!ae) return false;
  return ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA' || ae.isContentEditable === true;
}
/* "กำลังพิมพ์อยู่จริง" — ถ้าเช็คแค่ "เคอร์เซอร์อยู่ในช่อง" คนที่คลิกช่องค้นหาแล้วปล่อยไว้จะบล็อก sync ค้างตลอด
   v2.83 แก้ 2 จุดที่ทำให้ "พิมพ์อยู่แล้วเด้ง":
   1. เดิมฟังแต่ keydown — คีย์บอร์ดมือถือ (Gboard/แป้นไทย iOS) ส่ง input/composition ไม่ส่ง keydown
      → บนมือถือ typingNow() เป็น false ตลอด = sync เข้ามา rebuild ระหว่างพิมพ์ได้เต็มๆ
   2. เดิมหมดอายุ 5 วิ — หยุดคิดแป๊บเดียวก็โดน rebuild ทั้งที่ข้อความยังค้างในช่อง */
let _lastKey = 0, _composing = false;
document.addEventListener('keydown', function(){ _lastKey = Date.now(); }, true);
document.addEventListener('input', function(){ _lastKey = Date.now(); }, true);
document.addEventListener('compositionstart', function(){ _composing = true; }, true);
document.addEventListener('compositionend', function(){ _composing = false; _lastKey = Date.now(); }, true);
/* v2.96: แถบล่างต้องติดขอบจอเสมอ แม้เปิดจากในแอปอื่น (Facebook/LINE in-app browser)

let _vvGap = 0, _vvT = null, _vvScrollAt = 0;
function fixViewportGap(){
  const vv = window.visualViewport;
  if (!vv) return;
  if (Date.now() - _vvScrollAt < 300) { schedViewportGap(); return; }   // ยังเลื่อนอยู่ — ค่ายังไม่นิ่ง รอก่อน
  if (typeof isTyping === 'function' && isTyping()) return;             // คีย์บอร์ดขึ้นอยู่ = vv เตี้ยลง ไม่ใช่ขอบจอจริง
  if (Math.abs(vv.offsetTop) > 1 || vv.scale > 1.01) return;            // กำลังลากเกินขอบ/ซูมอยู่
  let gap = Math.round(window.innerHeight - vv.height - vv.offsetTop);
  if (!(gap > 4 && gap < 120)) gap = 0;                                 // <4px = ปัดเศษ · >120px = คีย์บอร์ด/ค่าเพี้ยน
  if (gap === _vvGap) return;

function schedViewportGap(){ clearTimeout(_vvT); _vvT = setTimeout(fixViewportGap, 300); }
if (window.visualViewport) {

  window.addEventListener('orientationchange', function(){ setTimeout(schedViewportGap, 400); });
  schedViewportGap();
}

  let denied = false;
  try { denied = ('Notification' in window) && Notification.permission === 'denied'; } catch(e){}
  if (iOS && !installed) return { k:'ios', tx:'iPhone ต้องกด <b>แชร์ → เพิ่มลงในหน้าจอโฮม</b> ก่อน แล้วเปิดจากไอคอนนั้น ถึงจะรับแจ้งเตือนได้' };

  return { k:'ask', tx:'ยังไม่ได้เปิดแจ้งเตือน — มีคนมอบงานหรือคอมเม้นถึงคุณจะไม่รู้เลย',

    if (limit && String(u.warehouse || '').trim().toUpperCase() !== myW && u.email !== S.me.email) return;
    out[String(u.email).toLowerCase()] = true;
  });
  return out;
}

/* ── งานของฉัน — list เรียงตามกำหนดส่งใกล้สุด + รายการย่อย (checklist) ที่คนมอบให้เรา ── */
function myWorkHtml(){
  if (!S.me) return '';
  const me = S.me.email;
  const mine = allDec().filter(function(d){ return d.mine && d.status !== 'cancelled'; });
  const active = sortL(mine.filter(function(d){ return d.status !== 'done'; }));   // sortL = เลยกำหนด→ใกล้→ไกล→ไม่มีกำหนด
  const done = mine.filter(function(d){ return d.status === 'done'; });
  const overdueN = active.filter(function(d){ return d.urg === 0; }).length;
  const clMine = myChecklistItems();
  const meL = String(me || '').toLowerCase();
  // งานที่ "เราสั่ง" ให้คนอื่นทำ — ไว้ติดตามว่าเขารับงานแล้วยัง / คืบหน้าถึงไหน
  const ordered = sortL(allDec().filter(function(d){
    const t2 = S.tasks.find(function(x){ return x.id === d.id; });
    if (!t2) return false;
    return String(t2.reporterEmail || '').toLowerCase() === meL &&
      String(t2.assigneeEmail || '').toLowerCase() !== meL &&
      d.status !== 'done' && d.status !== 'cancelled';
  }));
  const unack = ordered.filter(function(d){ const t2 = S.tasks.find(function(x){ return x.id === d.id; }); return t2 && !t2.ackAt; }).length;
  // v3.1: ชิป "งานทีม" ย้ายไปอยู่ในแท็บ "ทีม" แล้ว — ค่าเก่าที่ค้างอยู่ให้กลับมาเป็นงานที่รับมา
  const tab = (S.mwTab === 'out') ? 'out' : 'in';
  // งานทั้งทีม (ตามขอบเขตที่เห็นได้) — ของทุกคนรวมเราเอง เรียงครบกำหนดก่อน
  // v3.1: ลิสต์ "งานค้างทั้งทีม" ย้ายไปอยู่ในแท็บ "ทีม" แล้ว (teamTasksHtml) — ตรงนี้ไม่ต้องคำนวณซ้ำ

  const chip = function(k, lb, n){
    return '<button class="rf-itemchip' + (tab === k ? ' on' : '') + '" onclick="RF.mwTab(\'' + k + '\')">' + lb +
      (n ? ' <span class="rf-chipn">' + n + '</span>' : '') + '</button>';
  };
  // เลือกทีมที่จะดู — โผล่เฉพาะตอนอยู่ชิป "งานทีม" และเห็นได้มากกว่า 1 คลัง
  let teamSel = '';
  if (tab === 'team' && teamWs.length > 1) {
    teamSel = '<select class="rf-fsel" style="max-width:150px" onchange="RF.mwTeam(this.value)">' +
      '<option value=""' + (S.mwTeamW ? '' : ' selected') + '>👥 ทุกทีม</option>' +
      teamWs.map(function(w){ return '<option value="' + esc(w) + '"' + (S.mwTeamW === w ? ' selected' : '') + '>' + esc(w) + '</option>'; }).join('') +
      '</select>';
  }
  const sub = tab === 'in'
    ? (active.length + clMine.length) + ' รายการต้องทำ' + (clMine.length ? ' (รวมเช็คลิสต์ ' + clMine.length + ')' : '') +
      (overdueN ? ' · <span style="color:var(--red);font-weight:700">เลยกำหนด ' + overdueN + '</span>' : '')
    : ordered.length + ' งานที่สั่งไว้' + (unack ? ' · <span style="color:var(--amber);font-weight:700">ยังไม่รับ ' + unack + '</span>' : '');

  let h = '<div class="rf-view">' + workTabsHtml() +
    '<div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:4px"><h1 class="rf-h1">งานของฉัน</h1>' +
    '<div class="rf-sub" style="margin-top:0">' + sub + '</div></div>' +
    '<div class="rf-itemchips rf-mwchips">' +
    chip('in', 'งานที่รับมา', active.length + clMine.length) +
    chip('out', 'งานที่ฉันสั่ง', ordered.length) + '</div>';

  if (tab === 'out') {
    if (!ordered.length) h += '<div class="rf-empty" style="padding:36px 16px;text-align:center">ยังไม่ได้สั่งงานใคร<div style="font-size:13px;color:var(--muted);margin-top:6px">งานที่คุณมอบให้คนอื่นจะมาโผล่ที่นี่</div></div>';
    else {
      /* v4.0: "ยังไม่กดรับ" แยกมากองรวมกันข้างบน (Surat สั่ง)
         เดิมหัวข้อบอกจำนวนไว้เฉยๆ แต่ลิสต์ข้างล่างปนกันหมด แล้วแปะป้าย "ยังไม่กดรับงาน"
         ซ้ำใต้การ์ดทีละใบ — อ่านแล้วไม่รู้ว่าหัวข้อคุมถึงไหน
         ทั้ง 2 กองเรียงตามกำหนดส่งเหมือนเดิม (ordered ผ่าน sortL มาแล้ว) */
      const waiting = [], acked = [];
      ordered.forEach(function(d){
        const t2 = S.tasks.find(function(x){ return x.id === d.id; });
        (t2 && !t2.ackAt ? waiting : acked).push(d);
      });
      const sec = function(list, label, color, call){
        if (!list.length) return '';
        return '<div class="rf-mwsec"' + (color ? ' style="color:' + color + '"' : '') + '>' + label +
          ' <span style="opacity:.55">(' + list.length + ')</span></div>' +
          '<div class="rf-list">' + list.map(function(d){
            const row = rowHtml(d, { badge: true });
            return call ? '<div class="rf-callrow">' + row + callBtnHtml(d.u) + '</div>' : row;
          }).join('') + '</div>';
      };
      h += sec(waiting, '⏳ ยังไม่กดรับงาน', 'var(--amber)', true) + sec(acked, '✓ รับงานแล้ว', '');
    }
    return h + '</div>';
  }

  /* งาน · ฝากของ · ข้อเช็คลิสต์ที่มอบให้เรา = ลิสต์เดียว เรียงครบกำหนดก่อนขึ้นบนทั้งหมด
     (เดิมแยก 2 กอง ทำให้ข้อเช็คลิสต์ที่ยังไม่ถึงกำหนดลอยอยู่เหนืองานที่เลยกำหนดแล้ว) */
  const feed = active.map(function(d){ return { kind: 'task', urg: d.urg, sort: d.sort, rk: d.rk, d: d }; })
    .concat(clMine.map(function(c){ return { kind: 'cl', urg: c.urg, sort: c.sort, rk: c.rk, c: c }; }));
  feed.sort(dueCmp);

  /* v2.91: งานที่ไม่มีกำหนดส่ง = "ทำต่อเนื่อง" แยกกองของตัวเอง
     เดิมกองรวมกับงานที่มีเดดไลน์ ทำให้ 2 อย่างนี้ปนกันจนแยกไม่ออก:
     งานที่ตั้งใจไม่มีวันจบ (ดูแลระบบ · ตามหนี้ประจำ) กับ งานที่ลืมใส่กำหนด — อย่างหลังจมหายไปเงียบๆ */
  const isOngoing = function(it){
    if (it.kind !== 'task') return false;          // ข้อเช็คลิสต์ที่มอบให้เรา ไม่นับ
    return !it.d.dueIso;
  };
  const feedDue = feed.filter(function(it){ return !isOngoing(it); });
  const feedOng = feed.filter(isOngoing);
  h += '<div class="rf-mwsec">📋 ต้องทำ <span style="opacity:.55">(' + feedDue.length + ')</span></div>';
  if (!feedDue.length) h += '<div class="rf-empty" style="padding:32px 16px;text-align:center">🎉 ไม่มีงานค้าง<div style="font-size:13px;color:var(--muted);margin-top:6px">งานที่มอบให้คุณจะมาโผล่ที่นี่</div></div>';
  else {
    h += '<div class="rf-list">';
    feedDue.forEach(function(it){
      if (it.kind === 'task') { h += rowHtml(it.d, { badge: true, goal: true }); return; }   // งานของฉัน — เห็นเป้าทุกวัน
      const c = it.c, dm = dueMeta(c.t);
      h += '<div class="rf-mwcl">' +
        '<button class="rf-cl-box" onclick="event.stopPropagation();RF.clToggle(\'' + jsq(c.t.id) + '\',' + c.i + ')" title="ติ๊กว่าเสร็จ"></button>' +
        '<button class="rf-mwcl-t" onclick="RF.openTask(\'' + jsq(c.t.id) + '\')">' +
        '<div class="t">' + esc(clStrip(c.text)) + '</div>' +
        '<div class="s">☑️ เช็คลิสต์ · จากงาน: ' + esc(c.t.title || '') + '</div></button>' +
        '<div style="text-align:right;flex-shrink:0"><div class="rf-duechip" style="background:' + dm.bg + ';color:' + dm.fg + '">' + dm.dateText + '</div>' +
        (dm.badge ? '<div style="font-size:13px;font-weight:600;color:' + dm.fg + ';margin-top:3px">' + dm.badge + '</div>' : '') + '</div></div>';
    });
    h += '</div>';
  }
  /* กอง "ทำต่อเนื่อง" — ไม่มีกำหนดส่ง
     งานที่ "น่าจะลืมใส่กำหนด" (เพิ่งสร้างไม่เกิน 7 วัน · ยังไม่เริ่มทำ · ยังไม่มีใครคุยในงาน)
     ขึ้นป้ายเหลืองเตือน แตะแล้วใส่วันได้เลย — ที่เหลือถือว่าตั้งใจไม่มีวันจบ */
  if (feedOng.length) {
    h += '<div class="rf-mwsec ong">♾️ ทำต่อเนื่อง <span style="opacity:.55">(' + feedOng.length + ')</span>' +
      '<span class="hint">ไม่มีวันจบ</span></div><div class="rf-list">';
    feedOng.forEach(function(it){
      const d = it.d;
      const t2 = S.tasks.find(function(x){ return x.id === d.id; });
      const fresh = t2 && t2.createdAt ? diffDays(tsDateIso(t2.createdAt) || '') >= -7 : false;
      const untouched = d.status === 'todo' && !d.cc && (!t2 || !t2.ackAt);
      const maybeForgot = fresh && untouched;
      h += '<div class="rf-ongrow' + (maybeForgot ? ' warn' : '') + '">' + rowHtml(d, { goal: true, badgeOnly: true }) +
        (maybeForgot ? '<button class="rf-ongfix" onclick="RF.openTask(\'' + jsq(d.id) + '\')">ยังไม่ตั้งกำหนดส่ง — แตะเพื่อใส่วัน</button>' : '') +
        '</div>';
    });
    h += '</div>';
  }

  if (done.length) h += '<div class="rf-mwsec" style="color:var(--green);margin-top:22px">✅ เสร็จแล้ว <span style="opacity:.55">(' + done.length + ')</span></div>' +
    '<div class="rf-list">' + sortL(done).slice(0, 20).map(function(d){ return rowHtml(d, {}); }).join('') + '</div>';
  return h + '</div>';
}

/* คนที่ตรงกับคำค้น — ขอบเขตเดียวกับลิสต์ "กรองตามสมาชิก" (R<7 เห็นเฉพาะคลังตัวเอง)
   เรียง: มีงานค้างก่อน → ตัวเอง/แผนกเดียวกัน/คลังเดียวกัน → ก-ฮ */
function qUsers(qq){
  let list = S.users.slice();
  if (S.me && S.me.role < 7 && String(S.me.warehouse || '').trim()) {
    const myW = String(S.me.warehouse).trim().toUpperCase();
    list = list.filter(u => String(u.warehouse || '').trim().toUpperCase() === myW || u.email === S.me.email);
  }
  list = list.filter(u => ((u.name || '') + ' ' + (u.nickname || '') + ' ' + (u.dept || '') + ' ' + (u.warehouse || '') + ' ' + (u.email || '')).toLowerCase().includes(qq));
  if (!list.length) return [];
  const dec = allDec();
  return list.map(function(u){
    const own = dec.filter(d => d.u && d.u.email === u.email);
    return { u, open: own.filter(d => d.status !== 'done' && d.status !== 'cancelled').length, all: own.length };
  }).sort(function(a, b){
    return ((b.open > 0) - (a.open > 0)) || (userGroup(a.u) - userGroup(b.u)) || dispName(a.u).localeCompare(dispName(b.u), 'th');
  }).slice(0, 5);
}
function qDropHtml(){
  if (!S.q) return '';
  const qq = S.q.trim().toLowerCase();
  // X โชว์ทันทีที่มีตัวอักษรใดๆ (รวม space) — dropdown ผลลัพธ์โชว์เมื่อมีคำค้นจริง
  if (!qq) return '<button class="rf-qx" onclick="RF.qClear()">' + IC.xs + '</button>';
  const us = qUsers(qq);
  // ค้นจากทุกมุมของงาน (d.search) ไม่ใช่แค่ชื่อ+รายละเอียด — ครอบผู้สั่ง/ผู้ร่วม/เช็คลิสต์/แผนก/คลัง
  const res = sortL(allDec().filter(d => d.search.includes(qq))).slice(0, 12);
  let h = '<button class="rf-qx" onclick="RF.qClear()">' + IC.xs + '</button><div class="rf-qdrop">';
  if (us.length) {

    us.forEach(function(o){

        '<div style="flex:1;min-width:0"><div class="t1" style="font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(dispName(o.u)) + '</div>' +
        '<div class="t2" style="font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(o.u.dept || '—') + (o.u.warehouse ? ' · ' + esc(o.u.warehouse) : '') + '</div></div>' +
        '<div class="rf-qcnt' + (o.open ? ' on' : '') + '">' + cnt + '</div></button>';

  if (res.length) h += '<div class="rf-qsec">งาน</div>';
  res.forEach(d => {
    h += '<button class="rf-qrow" onclick="RF.openTask(\'' + jsq(d.id) + '\')">' + avHtml(d, 26) +
      '<div style="flex:1;min-width:0"><div class="t1" style="font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(d.title) + '</div>' +
      '<div class="t2" style="font-size:13px;color:var(--muted)">' + esc(d.avName) + ' · ' + d.statusLabel + '</div></div>' +
      '<div class="rf-duechip" style="background:' + d.dueBg + ';color:' + d.dueFg + '" title="' + esc(d.dueTip) + '">' + d.dueText + '</div></button>';
  });
  if (!res.length && !us.length) h += '<div style="padding:22px;text-align:center;color:var(--muted);font-size:14px">ไม่พบงานหรือคนที่ตรงกับ “' + esc(S.q) + '”</div>';
  return h + '</div>';
}

/* ── bottom nav (mobile) ── */
function bnavHtml(){

function clPeekHtml(d, opt){

/* ══ แผน (Plan) — v2.93 ══
   งานหลายใบที่มุ่งเป้าเดียวกันอยู่ใต้แผนเดียว · 1 งานอยู่ได้แผนเดียว · งานจรไม่ต้องอยู่ในแผนก็ได้
   ทุกคนสร้างแผนเองได้ · แก้/ลบได้เฉพาะเจ้าของแผนกับหัวหน้า (R5+) — ลบแผนแล้วงานไม่หาย แค่หลุดออกจากแผน */
/* ══ v3.6: ช่วงเวลา + ขอบเขตของแผน เลือกจาก dropdown แล้ว "วัดผลรวมกันได้" ══
   เดิมพิมพ์วันเริ่ม-วันจบเอง → แผนที่ลืมใส่วันจะไม่มีขีด "วันนี้" เทียบความคืบหน้าไม่ได้เลย
   และไม่มีทางรวมดูว่า "ไตรมาส 3 ทั้งบริษัททำได้เท่าไหร่" หรือ "แผนของ W1 ปีนี้มีกี่แผน"
   ตอนนี้เก็บ year (ค.ศ.) · period · warehouse · dept แล้วคำนวณวันเริ่ม-วันจบให้เอง */
const PLAN_PERIODS = (function(){
  const a = [{ v: 'all', t: 'ทั้งปี' }];
  for (let q = 1; q <= 4; q++) a.push({ v: 'Q' + q, t: 'ไตรมาส ' + q + ' (' + MON[(q - 1) * 3] + '–' + MON[(q - 1) * 3 + 2] + ')' });
  for (let m = 1; m <= 12; m++) a.push({ v: 'M' + m, t: MONFULL[m - 1] });
  return a;
})();
const PLAN_WH = ['W1', 'W2', 'W3', 'W4', 'C4', 'HQ'];
function planPeriodLabel(per){ const o = PLAN_PERIODS.find(function(x){ return x.v === String(per || ''); }); return o ? o.t : ''; }
function planPeriodShort(per){
  const p = String(per || '');
  if (p === 'all') return 'ทั้งปี';
  const q = p.match(/^Q([1-4])$/); if (q) return 'Q' + q[1];
  const m = p.match(/^M(\d{1,2})$/); return m ? MON[Number(m[1]) - 1] : '';
}
function planPeriodRange(y, per){
  const yy = Number(y) || 0;
  if (!yy) return { start: '', end: '' };
  const p2 = function(n){ return (n < 10 ? '0' : '') + n; };
  const lastDay = function(mo){ return new Date(Date.UTC(yy, mo, 0)).getUTCDate(); };   // mo นับ 1-12 (Date.UTC เดือน 0-based + วันที่ 0 = วันสุดท้ายของเดือนก่อนหน้า)
  const p = String(per || 'all');
  if (p === 'all') return { start: yy + '-01-01', end: yy + '-12-31' };
  const q = p.match(/^Q([1-4])$/);
  if (q) { const s = (Number(q[1]) - 1) * 3 + 1, e = s + 2; return { start: yy + '-' + p2(s) + '-01', end: yy + '-' + p2(e) + '-' + p2(lastDay(e)) }; }
  const m = p.match(/^M(\d{1,2})$/);
  if (m) { const n = Number(m[1]); return { start: yy + '-' + p2(n) + '-01', end: yy + '-' + p2(n) + '-' + p2(lastDay(n)) }; }
  return { start: '', end: '' };
}
function beYear(y){ return Number(y) ? String(Number(y) + 543) : ''; }        // ค.ศ. ที่เก็บ → พ.ศ. ที่คนอ่าน
// แผนกดึงจากชีทพนักงานจริง ไม่ใช่ลิสต์ที่พิมพ์ตายตัว — มีคนแผนกใหม่แล้วมีให้เลือกเอง
function planDepts(){
  const seen = {};
  (S.users || []).forEach(function(u){ const d = String(u.dept || '').trim(); if (d && d !== 'ไม่ระบุแผนก') seen[d] = 1; });
  return Object.keys(seen).sort(function(a, b){ return a.localeCompare(b, 'th'); });
}
function planTagsHtml(p){
  let h = '';
  if (p.year) h += '<span class="rf-ptag">' + esc(planPeriodShort(p.period) || 'ทั้งปี') + '/' + beYear(p.year).slice(-2) + '</span>';
  if (p.warehouse) h += '<span class="rf-ptag wh" style="--wc:' + (WCOLOR[p.warehouse] || 'var(--slate)') + '">' + esc(p.warehouse) + '</span>';
  if (p.dept) h += '<span class="rf-ptag">' + esc(p.dept) + '</span>';
  return h;
}
function planById(id){ return (S.plans || []).find(function(x){ return String(x.id) === String(id); }) || null; }
function planTasks(id){ return S.tasks.filter(function(t){ return String(t.planId || '') === String(id); }); }
function planNum(){ const n = (S.plans || []).filter(function(p){ return String(p.status || 'active') !== 'done'; }).length; return n ? ' <span class="rf-navnum">' + n + '</span>' : ''; }
function planCanManage(p){
  if (!p || !S.me) return false;
  if (S.me.role >= 5) return true;
  const me = String(S.me.email || '').toLowerCase();
  return String(p.ownerEmail || '').toLowerCase() === me || String(p.createdBy || '').toLowerCase() === me;
}
// สรุปแผน: ทำไปกี่งาน + ผลจริงที่ได้ (บวกจากสรุปผลของงานที่ปิดแล้ว) เทียบกับเป้าของแผน
function planStat(p){
  const list = planTasks(p.id);
  const dec = list.map(decorate);
  const done = dec.filter(function(d){ return d.status === 'done'; }).length;
  const doing = dec.filter(function(d){ return d.status === 'doing' || d.status === 'review'; }).length;
  const cancel = dec.filter(function(d){ return d.status === 'cancelled'; }).length;
  const act = list.length - cancel;
  let sales = 0, profit = 0, cost = 0, time = 0, noImpact = 0;
  // v2.97: เป้าที่ "วางไว้แล้ว" = เอาเป้าของงานทุกใบในแผนมาบวกกัน (ไม่นับงานที่ยกเลิก)
  // ใช้ตอบว่า "ตั้งเป้าแผนไว้ 1 ล้าน แต่งานที่วางไว้รวมกันได้แค่ 8 แสน — ยังขาดอีก 2 แสน"
  let planSales = 0, planProfit = 0, planCost = 0, planTime = 0, noGoal = 0;
  list.forEach(function(t){
    if (stOf(t) !== 'cancelled') {
      planSales += impactNum(t.goalSales); planProfit += impactNum(t.goalProfit);
      planCost += impactNum(t.goalCost); planTime += impactNum(t.goalTime);
      if (!hasGoal(t)) noGoal++;
    }
    if (stOf(t) !== 'done') return;
    if (!hasImpact(t)) { noImpact++; return; }
    sales += impactNum(t.impactSales); profit += impactNum(t.impactProfit);
    cost += impactNum(t.impactCost); time += impactNum(t.impactTime);
  });
  const goalSales = impactNum(p.goalSales);
  const pct = goalSales ? Math.round(sales / goalSales * 100) : null;
  const daysLeft = p.endDate ? diffDays(p.endDate) : null;
  // ครอบคลุมเป้าไหม: เป้าที่วางไว้ในงานรวมกัน เทียบกับเป้าของแผน
  const covPct = goalSales ? Math.round(planSales / goalSales * 100) : null;
  return { n: list.length, act: act, done: done, doing: doing, cancel: cancel,
           sales: sales, profit: profit, cost: cost, time: time, noImpact: noImpact,
           planSales: planSales, planProfit: planProfit, planCost: planCost, planTime: planTime,
           noGoal: noGoal, covPct: covPct, gapSales: goalSales ? Math.max(0, goalSales - planSales) : 0,
           goalSales: goalSales, pct: pct, daysLeft: daysLeft };
}
/* v2.94: แผนตามทันไหม — เทียบ "ทำไปกี่ %" กับ "เวลาผ่านไปกี่ %"
   เวลาผ่าน 70% แต่ทำได้ 30% = ช้ากว่าแผน 40 จุด · ไม่มีวันเริ่ม-วันจบ = วัดไม่ได้ (คืน null)
   เกณฑ์: ช้ากว่า 25 จุดขึ้นไป = ตามไม่ทัน · 10-25 = เริ่มช้า · ที่เหลือ = ตามทัน */
function planPace(p, st){
  const sd = String(p.startDate || '').slice(0, 10), ed = String(p.endDate || '').slice(0, 10);
  if (!sd || !ed) return null;
  const total = daysBetween(sd, ed);
  if (total <= 0) return null;
  const gone = Math.max(0, Math.min(total, daysBetween(sd, todayIso())));
  const timePct = Math.round(gone / total * 100);
  const workPct = st.act ? Math.round(st.done / st.act * 100) : 0;
  const gap = workPct - timePct;
  return { timePct: timePct, workPct: workPct, gap: gap,
           level: gap <= -25 ? 'late' : gap <= -10 ? 'slow' : 'ok' };
}
function daysBetween(a, b){
  const d1 = pd(String(a).slice(0, 10)), d2 = pd(String(b).slice(0, 10));
  if (!d1 || !d2) return 0;
  return Math.round((d2 - d1) / 86400000);
}
function planCardHtml(p){
  const st = planStat(p);
  const closed = String(p.status || 'active') === 'done';
  // ขอบซ้ายบอกสถานะ: จบแล้ว=เขียว · ใกล้หมดเวลาแต่ยังไม่คืบ=เหลือง · กำลังเดิน=ม่วง
  const pace = planPace(p, st);
  const overdue = !closed && st.daysLeft !== null && st.daysLeft < 0 && st.done < st.act;
  const col = closed ? 'var(--green)'
    : overdue || (pace && pace.level === 'late') ? 'var(--red)'
    : (pace && pace.level === 'slow') ? 'var(--amber)' : 'var(--purple)';
  const donePct = st.act ? Math.round(st.done / st.act * 100) : 0;
  const doingPct = st.act ? Math.round(st.doing / st.act * 100) : 0;
  const owner = userByEmail(p.ownerEmail);
  const when = closed ? ('จบแล้ว' + (p.endDate ? ' ' + fmtYmd(p.endDate) : ''))
    : (st.daysLeft === null ? 'ไม่กำหนดวันจบ' : st.daysLeft < 0 ? ('เลยกำหนด ' + Math.abs(st.daysLeft) + ' วัน') : ('เหลือ ' + st.daysLeft + ' วัน'));
  let kpi = '<div class="k"><div class="v">' + st.done + '/' + st.act + '</div><div class="l">งานเสร็จแล้ว</div></div>';
  if (st.goalSales) {
    const okPct = st.pct >= 80;
    kpi += '<div class="k ' + (okPct ? 'ok' : st.pct >= 40 ? '' : 'miss') + '"><div class="v">' + st.pct + '%</div><div class="l">ของเป้ายอดขาย</div></div>';
  } else if (st.sales) {
    kpi += '<div class="k ok"><div class="v">฿' + fmtMoney(st.sales) + '</div><div class="l">ยอดขายเพิ่ม</div></div>';
  } else {
    kpi += '<div class="k"><div class="v">' + st.doing + '</div><div class="l">กำลังทำอยู่</div></div>';
  }
  return '<button class="rf-plancard" style="border-left-color:' + col + '" onclick="RF.openPlan(\'' + jsq(p.id) + '\')">' +
    '<div class="pt">' + esc(p.name) + '</div>' +
    '<div class="pm">' + esc(when) + ' · ' + st.n + ' งาน' + (owner ? ' · ' + esc(dispName(owner)) : '') + '</div>' +
    (planTagsHtml(p) ? '<div class="rf-ptags">' + planTagsHtml(p) + '</div>' : '') +
    '<div class="rf-planbar"><i style="width:' + donePct + '%;background:var(--green)"></i><i style="width:' + doingPct + '%;background:var(--blue)"></i></div>' +
    '<div class="rf-plankpi">' + kpi + '</div>' +
    '</button>';
}
/* v3.4: กลุ่มของแผนสำหรับตัวกรอง — แผนที่จบแล้ว/เลยกำหนดจะได้ไม่กองรวมกับแผนที่กำลังเดิน
   จบแล้ว = เจ้าของกดปิดเอง (status=done) · เลยกำหนด = ยังไม่ปิดแต่เลยวันจบและงานยังไม่ครบ */
function planBucket(p){
  if (String(p.status || 'active') === 'done') return 'done';
  const st = planStat(p);
  return (st.daysLeft !== null && st.daysLeft < 0 && st.done < st.act) ? 'late' : 'active';
}
/* v3.7: "แผนเรา" = แผนที่เกี่ยวกับเราจริงๆ — แผนกเดียวกัน · คลังเดียวกัน · เราเป็นเจ้าของ
   หรือแผนที่ไม่ระบุทั้งแผนกและคลัง = แผนระดับบริษัท ทุกคนนับเป็นของตัวเอง
   (แผนเก่าที่ยังไม่มีคอลัมน์ Year/Dept/Warehouse เข้าเงื่อนไขนี้ → ไม่หายไปไหน) */
function planMine(p){
  if (!S.me) return true;
  if (String(p.ownerEmail || '').toLowerCase() === String(S.me.email || '').toLowerCase()) return true;
  const pDept = String(p.dept || '').trim(), pWh = String(p.warehouse || '').trim().toUpperCase();
  if (!pDept && !pWh) return true;
  const myDept = String(S.me.dept || '').trim(), myWh = String(S.me.warehouse || '').trim().toUpperCase();
  if (pDept && myDept && myDept !== 'ไม่ระบุแผนก' && pDept === myDept) return true;
  return !!(pWh && myWh && pWh === myWh);
}
// ชื่อกลุ่มตอนไล่ดูแผนของทีมอื่น — แผนกมาก่อน ไม่มีแผนกก็ใช้คลัง ไม่มีทั้งคู่ = ทั้งบริษัท
function planGroupName(p){
  const d = String(p.dept || '').trim(); if (d) return d;
  const w = String(p.warehouse || '').trim(); if (w) return 'คลัง ' + w;
  return 'ทั้งบริษัท';
}
/* v4.7: แถวตัวกรอง ปี / คลัง / แผนก — ต่อจากชิปขอบเขตกับชิปสถานะ
   ใช้ <select> เพราะตัวเลือกโตตามข้อมูล (แผนกมี 8+ คลัง 6) ทำเป็นชิปจะล้นจอ */
/* v4.17: คืนเฉพาะตัว <select> ไม่มี wrapper แล้ว — ไปอยู่ในแถบรวม .rf-plantool
   ปุ่มล้างตัวกรองโผล่เฉพาะตอนมีตัวกรองค้างอยู่จริง ไม่งั้นกินที่เปล่า */
function planPickSelsHtml(yrs, whs, dps){

}
/* v4.7: สรุปผลตามช่วงที่กรองอยู่ — ตอบ "Q3/69 ทั้งบริษัททำได้เท่าไหร่ · ถึงเป้ากี่แผน"
   ใช้ตัวเลขชุดเดียวกับในหน้าแผนรายตัว (planStat) ไม่คำนวณคนละทางให้เลขขัดกันเอง
   แยกตามคลัง/แผนกด้วย เพราะคำถามถัดไปเสมอคือ "แล้วทีมไหนทำได้/ไม่ได้" */
function planRollupHtml(list){
  if (!list.length) return '';
  const sum = { goal: 0, plan: 0, real: 0, profit: 0, cost: 0, time: 0, hit: 0, rated: 0 };
  const by = {};
  list.forEach(function(p){
    const st = planStat(p);
    sum.goal += st.goalSales; sum.plan += st.planSales; sum.real += st.sales;
    sum.profit += st.profit; sum.cost += st.cost; sum.time += st.time;
    if (st.goalSales) { sum.rated++; if (st.sales >= st.goalSales) sum.hit++; }
    const k = planGroupName(p);
    const g = by[k] = by[k] || { n: 0, goal: 0, real: 0 };
    g.n++; g.goal += st.goalSales; g.real += st.sales;
  });
  if (!sum.goal && !sum.real && !sum.profit && !sum.cost && !sum.time) return '';
  const pct = sum.goal ? Math.round(sum.real / sum.goal * 100) : null;
  const col = pct === null ? 'var(--muted)' : pct >= 80 ? 'var(--green)' : pct >= 40 ? 'var(--amber)' : 'var(--red)';
  const scope = [S.planYear ? planScopeYearLabel() : '', S.planWh || '', S.planDept || ''].filter(Boolean).join(' · ') || 'ทุกแผนที่กรองอยู่';
  const k = function(v, lb, unit){ return v ? '<div class="k"><div class="v">' + (unit === 'hr' ? fmtMoney(Math.round(v * 10) / 10) + ' ชม.' : '฿' + fmtMoney(v)) + '</div><div class="l">' + lb + '</div></div>' : ''; };
  const rows = Object.keys(by).sort(function(a, b){ return by[b].real - by[a].real || by[b].goal - by[a].goal; }).map(function(name){
    const g = by[name], gp = g.goal ? Math.round(g.real / g.goal * 100) : null;
    const gc = gp === null ? 'var(--muted)' : gp >= 80 ? 'var(--green)' : gp >= 40 ? 'var(--amber)' : 'var(--red)';
    return '<div class="row"><span class="lb">' + esc(name) + ' <b>(' + g.n + ')</b></span>' +
      '<span class="vl">' + (g.goal ? '฿' + fmtMoney(g.real) + ' / ฿' + fmtMoney(g.goal) : '฿' + fmtMoney(g.real)) +
      (gp === null ? '' : ' <b style="color:' + gc + '">' + gp + '%</b>') + '</span></div>';
  }).join('');
  return '<div class="rf-rollup">' +
    '<div class="hd"><span class="ttl">สรุปผลรวม</span><span class="sub">' + esc(scope) + ' · ' + list.length + ' แผน</span>' +
    (pct === null ? '' : '<span class="big" style="color:' + col + '">' + pct + '%</span>') + '</div>' +
    (sum.rated ? '<div class="rf-rollhit">ถึงเป้าแล้ว <b>' + sum.hit + '</b> จาก ' + sum.rated + ' แผนที่ตั้งเป้ายอดขายไว้</div>' : '') +
    (sum.goal ? '<div class="rf-pgoal" style="margin-top:9px">' +
      '<span class="seg"><span class="l">เป้ารวม</span><span class="v">฿' + fmtMoney(sum.goal) + '</span></span><span class="dot">·</span>' +
      '<span class="seg"><span class="l">วางไว้</span><span class="v">฿' + fmtMoney(sum.plan) + '</span></span><span class="dot">·</span>' +
      '<span class="seg"><span class="l">ทำได้</span><span class="v ok">฿' + fmtMoney(sum.real) + '</span></span></div>' : '') +
    (k(sum.profit, 'กำไรเพิ่ม/เดือน') + k(sum.cost, 'ค่าใช้จ่ายลด/เดือน') + k(sum.time, 'เวลาที่ลดได้/วัน', 'hr')
      ? '<div class="rf-plankpi big" style="margin-top:9px">' + k(sum.profit, 'กำไรเพิ่ม/เดือน') + k(sum.cost, 'ค่าใช้จ่ายลด/เดือน') + k(sum.time, 'เวลาที่ลดได้/วัน', 'hr') + '</div>' : '') +
    (rows ? '<div class="rf-rollby">' + rows + '</div>' : '') +
    '</div>';

function planScopeYearLabel(){

  const keys = Object.keys(ps);
  return (keys.length === 1 ? planPeriodShort(keys[0]) + '/' + beYear(y).slice(-2) : 'ปี ' + beYear(y));
}
function plansHtml(){
  const all = (S.plans || []).slice().sort(function(a, b){
    const ad = String(a.status || 'active') === 'done', bd = String(b.status || 'active') === 'done';
    if (ad !== bd) return ad ? 1 : -1;                       // แผนที่จบแล้วลงล่าง
    return newFirst(a.updatedAt || a.createdAt || '', b.updatedAt || b.createdAt || '');   // ที่เหลือล่าสุดอยู่บน
  });
  const sc = S.planScope || 'mine';                          // เปิดหน้ามาเห็นแผนเราก่อนเสมอ
  const scCnt = { mine: 0, others: 0 };
  all.forEach(function(p){ planMine(p) ? scCnt.mine++ : scCnt.others++; });
  /* v4.7: ตัวกรอง ปี / คลัง / แผนก — เอาเฉพาะค่าที่มีจริงในแผน ไม่โชว์ตัวเลือกที่ไม่มีของ
     ค่าที่เลือกไว้แล้วหายไปจากข้อมูล (เช่นแก้แผนจนไม่เหลือคลังนั้น) → เคลียร์ทิ้ง ไม่ให้ลิสต์ว่างแบบงงๆ */
  const uniq = function(k){ const o = {}; all.forEach(function(p){ const v = String(p[k] || ''); if (v) o[v] = 1; }); return Object.keys(o); };
  const yrs = uniq('year').sort().reverse(), whs = uniq('warehouse').sort(), dps = uniq('dept').sort(function(a,b){ return a.localeCompare(b,'th'); });
  /* ⚠️ v4.12: เคลียร์ได้ต่อเมื่อ "มีแผนโหลดมาแล้วจริง" เท่านั้น
     ตอนเปิดแอปแวบแรก S.plans ยังว่าง → yrs/whs/dps ว่างตาม → จะไปล้างค่าที่จำไว้ทิ้งทันที
     (บั๊คที่จะเกิดพอดีกับการทำให้ตัวกรองจำค่า — จำแล้วโดนล้างก่อนได้ใช้) */
  if (all.length) {
    if (S.planYear && yrs.indexOf(S.planYear) < 0) { S.planYear = ''; planFilterSave(); }

  }
  const scoped = all.filter(function(p){
    if (sc !== 'all' && (sc === 'mine' ? !planMine(p) : planMine(p))) return false;
    if (S.planYear && String(p.year || '') !== S.planYear) return false;
    if (S.planWh && String(p.warehouse || '') !== S.planWh) return false;
    if (S.planDept && String(p.dept || '') !== S.planDept) return false;
    return true;
  });
  const bk = {}; scoped.forEach(function(p){ bk[p.id] = planBucket(p); });
  const cnt = { active: 0, late: 0, done: 0 };
  scoped.forEach(function(p){ cnt[bk[p.id]]++; });           // เลขบนชิปสถานะนับเฉพาะในขอบเขตที่เลือกอยู่
  const fl = S.planFilter || 'open';

  /* v4.17: ชิป 2 แถว → dropdown 2 ตัว · จำนวนย้ายไปอยู่ในชื่อตัวเลือก ข้อมูลไม่หาย */
  const pick = function(fn, cls, cur, opts){

  const inPlan = S.tasks.filter(function(t){ return t.planId; }).length;
  let h = '<div class="rf-view">' + workTabsHtml() + '<div class="rf-plantool">' +

      pick('planFilter', 'stat', fl, [['open', 'ยังไม่จบ', cnt.active + cnt.late], ['late', 'เลยกำหนด', cnt.late],
                                       ['done', 'จบแล้ว', cnt.done], ['all', 'ทุกสถานะ', null]]) +

  }
  h += '<span class="sp"></span><button class="newbtn" onclick="RF.planNew()">+ สร้างแผนใหม่</button></div>';

    h += '<div class="rf-empty" style="padding:36px 16px;text-align:center">ยังไม่มีแผน' +

  } else if (!list.length) {
    h += '<div class="rf-empty" style="padding:30px 16px;text-align:center;font-size:14px">' +
      (sc === 'others' ? 'ไม่มีแผนของทีมอื่นในกลุ่มนี้' : 'ไม่มีแผนในกลุ่มนี้') + '</div>';
  } else if (sc === 'mine') {

        '<div class="rf-plangrid">' + grp[k].map(planCardHtml).join('') + '</div>';

  return h + '</div>';

/* v2.94: แผนที่จบแล้วรวมได้เท่าไหร่ — ผลงานสะสมของทีมที่จับต้องได้
