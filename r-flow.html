function donutCardHtml(dec){
  const C = 2 * Math.PI * 40;
  const total = dec.length;
  const entries = COLS.map(c => { const n = dec.filter(d => d.status === c.id).length; return { id: c.id, label: c.label, color: c.dot, n, frac: total ? n / total : 0 }; });
  let acc = 0, segs = '';
  entries.filter(e => e.n > 0).forEach(e => {
    segs += '<circle cx="60" cy="60" r="40" fill="none" stroke="' + e.color + '" stroke-width="15" stroke-dasharray="' + (e.frac * C).toFixed(2) + ' ' + C.toFixed(2) + '" stroke-dashoffset="' + (-acc * C).toFixed(2) + '" transform="rotate(-90 60 60)"/>';
    acc += e.frac;
  });
  let legend = '';
  entries.forEach(e => {
    legend += '<button class="rf-legrow" onclick="RF.openPop(\'status:' + e.id + '\',' + dashScopeArg() + ')">' +
      '<div style="width:11px;height:11px;border-radius:4px;background:' + e.color + ';flex-shrink:0"></div>' +
      '<div style="flex:1;font-size:13.5px;font-weight:600;text-align:left">' + e.label + '</div>' +
      '<div style="font-size:13.5px;font-weight:700">' + e.n + '</div>' +
      '<div style="font-size:13px;color:var(--muted);min-width:34px;text-align:right">' + Math.round(e.frac * 100) + '%</div>' +
      '<span style="color:var(--text-soft);display:flex;opacity:.5">' + IC.chev + '</span></button>';
  });
  return '<div class="rf-card"><div class="rf-card-t" style="margin-bottom:14px">สัดส่วนสถานะงาน</div>' +
    '<div style="display:flex;align-items:center;gap:18px;flex-wrap:wrap"><div style="position:relative;width:120px;height:120px;flex-shrink:0">' +
    '<svg width="120" height="120" viewBox="0 0 120 120"><circle cx="60" cy="60" r="40" fill="none" stroke="var(--surface2)" stroke-width="15"/>' + segs + '</svg>' +
    '<div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center"><div style="font-size:24px;font-weight:700;line-height:1.1">' + total + '</div><div style="font-size:13px;color:var(--muted)">งาน</div></div></div>' +
    '<div style="flex:1;min-width:150px;display:flex;flex-direction:column;gap:2px">' + legend + '</div></div></div>';
}

function dueBarsCardHtml(dec){
  const next7 = [];
  for (let i = 0; i < 7; i++) {
    const dIso = addDays(todayIso(), i);
    const dd = pd(dIso);
    next7.push({ iso: dIso, c: dec.filter(d => d.dueIso === dIso && d.status !== 'done').length, lab: DOWS[dd.getDay()] + ' ' + dd.getDate(), isT: i === 0 });
  }
  const bmax = Math.max(1, ...next7.map(b => b.c));
  let bars = '';
  next7.forEach(b => {
    bars += '<button class="rf-barcol" onclick="RF.openPop(\'due:' + b.iso + '\',' + dashScopeArg() + ')" title="แตะดูงานวันนี้"><div style="font-size:12.5px;font-weight:700;color:var(--muted);height:16px;line-height:16px">' + (b.c || '') + '</div>' +
      '<div class="bar" style="height:' + (b.c > 0 ? Math.max(10, Math.round(b.c / bmax * 70)) : 6) + 'px;background:' + (b.c > 0 ? 'var(--accent)' : 'var(--surface2)') + '"></div>' +
      '<div style="font-size:12.5px;font-weight:600;color:' + (b.isT ? 'var(--accent-ink)' : 'var(--muted)') + ';white-space:nowrap">' + b.lab + '</div></button>';
  });
  return '<div class="rf-card"><div class="rf-card-t" style="margin-bottom:3px">งานครบกำหนด 7 วันข้างหน้า</div>' +
    '<div style="font-size:12.5px;color:var(--muted);margin-bottom:10px">แตะแท่งเพื่อดูงานของวันนั้น</div>' +
    '<div class="rf-bars7" style="height:118px">' + bars + '</div></div>';

/* ── Board (Kanban) ── */
function clChip(d){
  if (!d.clTotal) return '';
  const doneAll = d.clDone === d.clTotal;
  return '<div class="rf-cc" style="' + (doneAll ? 'color:var(--green)' : '') + '" title="เช็คลิสต์">' + IC.cl + d.clDone + '/' + d.clTotal + '</div>';
}
// คอมเม้นล่าสุดจากหัวหน้า (role>=5, ไม่ใช่ system log) ของงานนี้
function bossComment(taskId){
  let best = null;
  S.comments.forEach(c => {
    if (c.taskId !== taskId || c.type === 'system') return;
    const u = userByEmail(c.authorEmail) || userByName(c.authorName);
    if (u && u.role >= 5 && (!best || c.createdAt > best.createdAt)) best = c;
  });
  return best;
}
// การ์ด kanban แบบกางดู: เช็คลิสต์ + คอมเม้นล่าสุดจากหัวหน้า (คืน '' ถ้าไม่มีอะไรให้กาง)
function cardExpand(d){
  const t = S.tasks.find(x => x.id === d.id);
  if (!t) return '';
  const cl = parseCl(t);
  const bc = bossComment(d.id);
  if (!cl.length && !bc) return '';
  const open = !!S.cardOpen[d.id];
  let panel = '';
  if (open) {
    let inner = '';
    if (cl.length) {
      inner += '<div class="rf-cardcl">';
      cl.forEach((it, i) => {
        inner += '<div class="rf-cardcl-i"><button class="rf-cardcl-b' + (it.d ? ' on' : '') + '"' +
          (canTickCl(t, it) ? ' onclick="event.stopPropagation();RF.clToggle(\'' + jsq(d.id) + '\',' + i + ')"' : ' disabled style="cursor:default"') + '>' + (it.d ? IC.checkS : '') + '</button>' +
          '<span class="' + (it.d ? 'done' : '') + '">' + (i + 1) + '. ' + esc(clStrip(it.t)) + '</span></div>';
      });
      inner += '</div>';
    }
    if (bc) {
      const u = userByEmail(bc.authorEmail) || userByName(bc.authorName);
      inner += '<div class="rf-cardbc">' + avCore(u ? firstChar(u.nickname) : '?', u ? u.color : 'var(--slate)', u ? u.photo : '', 20) +
        '<div style="flex:1;min-width:0"><div class="nm">' + esc(u ? dispName(u) : (bc.authorName || 'หัวหน้า')) + ' · หัวหน้า</div>' +
        '<div class="tx">' + esc(bc.text || '(แนบรูป)') + '</div></div></div>';
    }
    panel = '<div class="rf-cardex">' + inner + '</div>';
  }
  return '<button class="rf-cardex-tog" onclick="event.stopPropagation();RF.toggleCard(\'' + jsq(d.id) + '\')">' +
    '<span>' + (open ? 'ซ่อน' : 'เช็คลิสต์ & คอมเม้นหัวหน้า') + '</span>' +
    '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="transform:rotate(' + (open ? 180 : 0) + 'deg)"><path d="m6 9 6 6 6-6"/></svg></button>' + panel;
}
// สีคลังมาตรฐาน Rattana (ใช้ทุกแอป)

function boardHtml(mob){
  let all = fDec();
  // กรองตามคลัง/แผนก (dropdown หัวบอร์ด) — เทียบจากคลัง/แผนกของผู้รับผิดชอบงาน
  if (S.filterW) all = all.filter(d => d.u && String(d.u.warehouse || '').trim().toUpperCase() === S.filterW);
  if (S.filterDept) all = all.filter(d => d.u && String(d.u.dept || '').trim() === S.filterDept);
  const dec = all.filter(d => d.status !== 'cancelled');
  const nCan = all.length - dec.length;
  const WORD = ['W1', 'W2', 'W3', 'W4', 'C4', 'HQ'];
  const ws = [...new Set(S.users.map(u => String(u.warehouse || '').trim().toUpperCase()).filter(Boolean))]
    .sort((a, b) => ((WORD.indexOf(a) + 1 || 99) - (WORD.indexOf(b) + 1 || 99)) || a.localeCompare(b));
  const ds = [...new Set(S.users.map(u => String(u.dept || '').trim()).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'th'));
  const opt = (v, sel, lb) => '<option value="' + esc(v) + '"' + (sel ? ' selected' : '') + '>' + esc(lb) + '</option>';

  const chipW = '<div class="rf-wchips">' +
    '<button class="rf-wchip' + (!S.filterW ? ' on' : '') + '" onclick="RF.setFW(\'\')">ทั้งหมด</button>' +

      const c = WCOLOR[w] || 'var(--slate)', on = S.filterW === w, lightBg = (w === 'W1' || w === 'C4');
      return '<button class="rf-wchip" onclick="RF.setFW(\'' + esc(w) + '\')" style="' +
        (on ? 'background:' + c + ';border-color:' + c + ';color:' + (lightBg ? '#1a2430' : '#fff')
            : 'border-color:' + c + ';color:' + c) + '">' + esc(w) + '</button>';
    }).join('') + '</div>';
  const selD = '<select class="rf-fsel" onchange="RF.setFDept(this.value)">' + opt('', !S.filterDept, 'แผนก: ทั้งหมด') + ds.map(dp => opt(dp, S.filterDept === dp, dp)).join('') + '</select>';
  // สลับมุมมองการเรียง — default 'ครบกำหนด' ตามกฎเรียงลำดับของแอป · 'ใหม่สุด' ไว้ดูงานที่เพิ่งเข้ามา
  const sortTog = '<div class="rf-scope">' +
    '<button class="' + (S.sortMode !== 'new' ? 'on' : '') + '" onclick="RF.setSort(\'due\')" title="เรียงตามกำหนดส่ง — เลยกำหนด/ใกล้ครบขึ้นก่อน">⏰ ครบกำหนด</button>' +
    '<button class="' + (S.sortMode === 'new' ? 'on' : '') + '" onclick="RF.setSort(\'new\')" title="เรียงตามงานที่เข้ามาล่าสุด">🆕 ใหม่สุด</button></div>';
  let h = '<div class="rf-view"><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><h1 class="rf-h1">บอร์ดงาน</h1>' +
    (nCan > 0 ? '<button onclick="RF.openPop(\'cancelled\')" style="border:none;cursor:pointer;font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--slate-soft);color:var(--muted)">ยกเลิกแล้ว ' + nCan + '</button>' : '') +
    '<div style="flex:1"></div>' + chipW + selD + sortTog + '</div>';
  if (!mob) {
    h += '<div class="rf-board-pc" style="grid-template-columns:repeat(4,minmax(0,1fr))">';
    COLS.forEach(c => {
      const cards = sortL(dec.filter(d => d.status === c.id));
      h += '<div class="rf-col' + (S.dragOverCol === c.id ? ' over' : '') + '" ondragover="RF.dragOver(event,\'' + c.id + '\')" ondrop="RF.drop(event,\'' + c.id + '\')">' +
        '<div class="rf-colhead"><div class="dot" style="background:' + c.dot + '"></div><div class="lb">' + c.label + '</div><div class="ct">' + cards.length + '</div></div>' +
        '<div style="display:flex;flex-direction:column;gap:8px">';
      cards.forEach(d => {
        h += '<div class="rf-kcard' + (S.dragId === d.id ? ' drag' : '') + '" draggable="true" ondragstart="RF.dragStart(event,\'' + jsq(d.id) + '\')" ondragend="RF.dragEnd()" onclick="RF.openTask(\'' + jsq(d.id) + '\')" style="border-top-color:' + SC[d.status][1] + '">' +
          '<div class="tt">' + esc(d.title) + '</div>' + kCardMeta(d) + cardExpand(d) + '</div>';
      });
      if (!cards.length) h += '<div class="rf-kempty">ยังไม่มีงาน<br>ลากการ์ดมาวางที่นี่ได้</div>';
      h += '</div></div>';
    });
    h += '</div>';
  } else {
    h += '<div class="rf-seg">';
    COLS.forEach((c, i) => {
      const n = dec.filter(d => d.status === c.id).length;
      h += '<button class="' + (S.boardCol === i ? 'on' : '') + '" onclick="RF.setBoardCol(' + i + ')"><div class="sl">' + c.label + '</div><div class="sc">' + n + '</div></button>';
    });
    h += '</div><div ontouchstart="RF.touchStart(event)" ontouchend="RF.touchEnd(event)" style="display:flex;flex-direction:column;gap:10px;min-height:340px;animation:fadeUp .22s ease-out">';
    const col = COLS[S.boardCol];
    const cards = sortL(dec.filter(d => d.status === col.id));
    cards.forEach(d => {
      h += '<div class="rf-mcard" onclick="RF.openTask(\'' + jsq(d.id) + '\')" style="border-top-color:' + SC[d.status][1] + '"><div class="tt">' + esc(d.title) + '</div>' +
        '<div style="display:flex;align-items:center;gap:8px;margin-top:10px">' + avHtml(d, 26) +
        '<div style="font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(d.avName) + '</div><div style="flex:1"></div>' +
        (d.secret ? '<span title="ส่วนตัว" style="font-size:13px">🔒</span>' : d.priv ? '<span title="เฉพาะทีม" style="font-size:13px">👥</span>' : '') + clChip(d) + (d.cc > 0 ? '<div class="rf-cc">' + IC.cmt + d.cc + '</div>' : '') +
        '<div class="rf-duechip" style="background:' + d.dueBg + ';color:' + d.dueFg + '" title="' + esc(d.dueTip) + '">' + d.dueText + '</div></div>' + wDeptLine(d) + cardExpand(d) + '</div>';
    });
    if (!cards.length) {
      h += '<div style="text-align:center;padding:44px 20px;color:var(--muted)"><div style="width:56px;height:56px;border-radius:18px;background:var(--surface2);display:flex;align-items:center;justify-content:center;margin:0 auto 12px">' + IC.board + '</div>' +
        '<div style="font-size:15px;font-weight:600;color:var(--text);margin-bottom:4px">ยังไม่มีงานในคอลัมน์นี้</div><div style="font-size:13.5px;margin-bottom:16px">สร้างงานใหม่หรือเลื่อนงานจากคอลัมน์อื่น</div>' +
        '<button onclick="RF.newTask()" style="min-height:44px;padding:0 22px;border-radius:12px;border:none;background:var(--accent);color:#fff;font-size:14.5px;font-weight:600;cursor:pointer">+ สร้างงานใหม่</button></div>';
    }
    h += '</div>';
  }
  return h + '</div>';
}

/* ── Calendar ── */
function calHtml(mob){
  const dec = fDec().filter(d => d.status !== 'cancelled');
  const wkStart = S.calWeekStart || weekStartOf(S.calSel || todayIso());
  const wkEnd = addDays(wkStart, 6);
  const title = S.calMode === 'week' ? (fmtYmd(wkStart) + ' – ' + fmtYmd(wkEnd)) : (MONFULL[S.calM] + ' ' + S.calY);
  const seg = (m, lb) => '<button class="' + (S.calMode === m ? 'on' : '') + '" onclick="RF.calMode(\'' + m + '\')">' + lb + '</button>';
  let h = '<div class="rf-view"><div class="rf-calbar"><h1 class="rf-h1">' + title + '</h1>' +
    '<button class="rf-calnav" onclick="RF.calNav(-1)">' + IC.back + '</button>' +
    '<button class="rf-calnav" onclick="RF.calNav(1)">' + IC.chev + '</button>' +
    '<button class="rf-todaybtn" onclick="RF.calToday()">วันนี้</button><div style="flex:1"></div>' +
    '<div class="rf-modeseg">' + seg('month', 'เดือน') + seg('week', 'สัปดาห์') + seg('agenda', 'กำหนดการ') + '</div></div>';

  if (S.calMode === 'month') h += calMonthHtml(dec, mob);
  else if (S.calMode === 'week') h += calWeekHtml(dec, mob, wkStart);
  else h += calAgendaHtml(dec);
  return h + calDayEvHtml(S.calSel) + '</div>';   // นัดจาก Google Calendar ของวันที่เลือก — ต่อท้ายทุกโหมด
}

function calMonthHtml(dec, mob){
  const y = S.calY, m = S.calM;
  const firstDow = new Date(y, m, 1).getDay();
  const dim = new Date(y, m + 1, 0).getDate();
  const total = Math.ceil((firstDow + dim) / 7) * 7;
  let h = '<div class="rf-card" style="padding:10px"><div class="rf-calgrid7" style="margin-bottom:4px">';
  DOWS.forEach(d => { h += '<div class="rf-dow">' + d + '</div>'; });
  h += '</div><div style="display:flex;flex-direction:column;gap:4px">';
  for (let w = 0; w < total / 7; w++) {
    h += '<div class="rf-calgrid7">';
    for (let i = 0; i < 7; i++) {
      const dte = new Date(y, m, 1 - firstDow + w * 7 + i);
      const dIso = isoOf(dte);
      const inM = dte.getMonth() === m;
      const dayTasks = sortL(dec.filter(d => d.dueIso === dIso));
      const isT = dIso === todayIso(), isSel = dIso === S.calSel;
      const hasOd = dayTasks.some(d => d.urg === 0);
      h += '<button class="rf-day' + (isSel ? ' sel' : '') + '" onclick="RF.calPick(\'' + dIso + '\')" style="min-height:' + (mob ? 52 : 104) + 'px;opacity:' + (inM ? 1 : .35) + '">' +
        '<div class="num' + (isT ? ' today' : '') + '">' + dte.getDate() + '</div>';
      if (!mob) {
        dayTasks.slice(0, 3).forEach(d => {
          const bg = d.urg === 0 ? 'var(--red-soft)' : d.status === 'done' ? 'var(--green-soft)' : d.urg === 1 ? 'var(--amber-soft)' : 'var(--accent-soft)';
          const fg = d.urg === 0 ? 'var(--red)' : d.status === 'done' ? 'var(--green)' : d.urg === 1 ? 'var(--amber)' : 'var(--accent-ink)';
          const sc = SC[d.status] || SC.todo;
          // แตะที่ชิปเปิดงานเลย (stopPropagation กันไปโดนปุ่มวันที่ครอบอยู่) · จุดสีบอกสถานะ · งานเสร็จขีดฆ่า
          h += '<div class="rf-daychip' + (d.status === 'done' ? ' done' : '') + '" style="background:' + bg + ';color:' + fg + '" ' +
            'title="' + esc(d.title + ' · ' + d.statusLabel + ' · ' + d.avName) + '" ' +
            'onclick="event.stopPropagation();RF.openTask(\'' + jsq(d.id) + '\')">' +
            '<span class="st" style="background:' + sc[1] + '"></span><span class="tx">' + esc(d.title) + '</span></div>';
        });
        if (dayTasks.length > 3) h += '<div style="font-size:12.5px;color:var(--muted);padding:0 6px">+' + (dayTasks.length - 3) + ' งาน</div>';
      } else if (dayTasks.length) {
        h += '<div class="rf-dotcount" style="background:' + (hasOd ? 'var(--red)' : 'var(--accent)') + '">' + dayTasks.length + '</div>';
      }
      h += '</button>';
    }
    h += '</div>';
  }
  h += '</div></div>';
  const selRows = sortL(dec.filter(d => d.dueIso === S.calSel));
  const selD = pd(S.calSel);
  h += '<div class="rf-card" style="padding:16px"><div style="font-size:15px;font-weight:700;margin-bottom:8px">งาน' + DOWFULL[selD.getDay()] + ' ' + fmtYmd(S.calSel) + '</div><div style="display:flex;flex-direction:column">';
  selRows.forEach(d => { h += rowHtml(d, { av: 28, badgeOnly: true }); });
  if (!selRows.length) h += '<div class="rf-empty" style="padding:20px">ไม่มีงานครบกำหนดวันนี้</div>';
  return h + '</div></div>';
}

function calWeekHtml(dec, mob, wkStart){
  let h = '';
  if (!mob) {
    h += '<div style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px">';
    for (let i = 0; i < 7; i++) {
      const dIso = addDays(wkStart, i);
      const dd = pd(dIso);
      const rows = sortL(dec.filter(d => d.dueIso === dIso));
      const isT = dIso === todayIso();
      h += '<div class="rf-wkcol' + (isT ? ' today' : '') + '" title="' + dIso + '"><div style="display:flex;align-items:center;justify-content:center;gap:6px;padding:2px 0">' +
        '<div style="font-size:13px;font-weight:600;color:var(--muted)">' + DOWS[dd.getDay()] + '</div>' +
        '<div style="width:26px;height:26px;border-radius:50%;background:' + (isT ? 'var(--accent)' : 'transparent') + ';color:' + (isT ? '#fff' : 'var(--text)') + ';font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center">' + dd.getDate() + '</div>' +
        (rows.length ? '<div class="rf-dotcount" style="margin:0;background:' + (rows.some(r => r.urg === 0) ? 'var(--red)' : 'var(--accent)') + '">' + rows.length + '</div>' : '') + '</div>';
      rows.forEach(d => {
        h += '<button class="rf-wkcard" onclick="RF.openTask(\'' + jsq(d.id) + '\')" style="border-left-color:' + d.prioColor + '">' +
          '<div style="font-size:13.5px;font-weight:600;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">' + esc(d.title) + '</div>' +
          '<div style="display:flex;align-items:center;gap:6px;margin-top:7px;min-width:0">' + avHtml(d, 20) +
          '<div style="font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0">' + esc(d.avName) + '</div></div>' +
          '<div style="margin-top:6px"><span class="rf-duechip" style="font-size:12.5px;padding:2px 7px;background:' + d.dueBg + ';color:' + d.dueFg + '">' + (d.badge || d.statusLabel) + '</span></div></button>';
      });
      if (!rows.length) h += '<div style="flex:1;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;opacity:.6;min-height:40px">—</div>';
      h += '</div>';
    }
    h += '</div>';
  } else {
    h += '<div style="display:flex;flex-direction:column;gap:10px">';
    for (let i = 0; i < 7; i++) {
      const dIso = addDays(wkStart, i);
      const dd = pd(dIso);
      const rows = sortL(dec.filter(d => d.dueIso === dIso));
      const isT = dIso === todayIso();
      h += '<div class="rf-mwkday' + (isT ? ' today' : '') + '" title="' + dIso + '"><div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">' +
        '<div style="font-size:14px;font-weight:700">' + DOWFULL[dd.getDay()] + ' ' + fmtYmd(dIso) + '</div>' +
        (isT ? '<div class="rf-todaypill">วันนี้</div>' : '') + '<div style="flex:1"></div>' +
        (rows.length ? '<div style="font-size:13px;color:var(--muted)">' + rows.length + ' งาน</div>' : '') + '</div>';
      rows.forEach(d => {
        h += '<button class="rf-mwkrow" onclick="RF.openTask(\'' + jsq(d.id) + '\')"><div class="rf-prio-line" style="background:' + d.prioColor + '"></div>' + avHtml(d, 26) +
          '<div style="flex:1;min-width:0"><div class="t1" style="font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(d.title) + '</div>' +
          '<div class="t2" style="font-size:13px;color:var(--muted)">' + esc(d.avName) + ' · ' + d.statusLabel + '</div></div>' +
          (d.hasBadge ? '<div class="rf-duechip" style="font-size:12.5px;padding:3px 8px;background:' + d.dueBg + ';color:' + d.dueFg + '">' + d.badge + '</div>' : '') + '</button>';
      });
      if (!rows.length) h += '<div style="color:var(--muted);font-size:13px;padding:4px 0 2px 0;opacity:.7">ไม่มีงานครบกำหนด</div>';
      h += '</div>';
    }
    h += '</div>';
  }
  return h;
}

function calAgendaHtml(dec){
  const m = S.calM, y = S.calY;
  const dates = [...new Set(dec.filter(d => d.dueIso && pd(d.dueIso).getMonth() === m && pd(d.dueIso).getFullYear() === y).map(d => d.dueIso))].sort();
  let h = '<div style="display:flex;flex-direction:column;gap:12px">';
  let any = false;
  dates.forEach(ds => {
    any = true;
    const dd = pd(ds);
    const isT = ds === todayIso();
    const rows = sortL(dec.filter(d => d.dueIso === ds));
    const od = rows.some(r => r.urg === 0);
    h += '<div class="rf-card" style="padding:14px 16px"><div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">' +
      '<div style="font-size:14px;font-weight:700;color:' + (od ? 'var(--red)' : (isT ? 'var(--accent-ink)' : 'var(--text)')) + '">' + DOWFULL[dd.getDay()] + ' ' + fmtYmd(ds) + '</div>' +
      (isT ? '<div class="rf-todaypill">วันนี้</div>' : '') + '</div><div style="display:flex;flex-direction:column">';
    rows.forEach(d => {
      h += '<button class="rf-row" style="min-height:50px;padding:7px 4px" onclick="RF.openTask(\'' + jsq(d.id) + '\')"><div class="rf-prio-line" style="background:' + d.prioColor + '"></div>' + avHtml(d, 26) +
        '<div style="flex:1;min-width:0"><div class="t1">' + esc(d.title) + '</div><div class="t2">' + esc(d.avName) + ' · ' + d.statusLabel + '</div></div>' +
        (d.hasBadge ? '<div class="rf-duechip" style="background:' + d.dueBg + ';color:' + d.dueFg + '">' + d.badge + '</div>' : '') + '</button>';
    });
    h += '</div></div>';
  });
  const noDue = dec.filter(d => !d.dueIso);
  if (noDue.length) {
    any = true;
    h += '<div class="rf-card" style="padding:14px 16px"><div style="font-size:14px;font-weight:700;color:var(--muted);margin-bottom:6px">ยังไม่กำหนดวันส่ง</div><div style="display:flex;flex-direction:column">';
    noDue.forEach(d => {
      h += '<button class="rf-row" style="min-height:50px;padding:7px 4px" onclick="RF.openTask(\'' + jsq(d.id) + '\')"><div class="rf-prio-line" style="background:' + d.prioColor + '"></div>' + avHtml(d, 26) +
        '<div style="flex:1;min-width:0"><div class="t1">' + esc(d.title) + '</div><div class="t2">' + esc(d.avName) + ' · ' + d.statusLabel + '</div></div></button>';
    });
    h += '</div></div>';
  }
  if (!any) h += '<div style="text-align:center;padding:40px 20px;color:var(--muted)"><div style="font-size:15px;font-weight:600;color:var(--text);margin-bottom:4px">ไม่มีงานในเดือนนี้</div><div style="font-size:13.5px">ลองเลื่อนไปเดือนอื่น หรือสร้างงานใหม่</div></div>';
  return h + '</div>';
}

/* ── Team ── */
function miniChips(o){
  return '<div class="rf-minichips"><div class="rf-minichip" style="background:var(--slate-soft);color:var(--slate)">รอทำ ' + o.todo + '</div>' +
    '<div class="rf-minichip" style="background:var(--blue-soft);color:var(--blue)">กำลังทำ ' + o.doing + '</div>' +
    (o.review > 0 ? '<div class="rf-minichip" style="background:var(--amber-soft);color:var(--amber)">รอตรวจ ' + o.review + '</div>' : '') +
    '<div class="rf-minichip" style="background:var(--green-soft);color:var(--green)">เสร็จ ' + o.done + '</div></div>';
}
function teamCardFoot(o){
  return '<div class="rf-bar" style="height:7px;margin-bottom:8px"><div style="width:' + o.pct + '%;background:var(--green)"></div></div>' +
    '<div style="display:flex;align-items:center;justify-content:space-between"><div style="font-size:13px;color:var(--muted)">เสร็จแล้ว ' + o.done + '/' + o.tot + ' งาน</div>' +
    (o.od > 0 ? '<div style="font-size:13px;font-weight:600;color:var(--red)">เลยกำหนด ' + o.od + ' งาน</div>' : '') + '</div>';
}
function statCnt(list){
  const c = st => list.filter(d => d.status === st).length;
  const done = c('done'), tot = list.length;
  return { todo: c('todo'), doing: c('doing'), review: c('review'), done, tot, pct: tot ? Math.round(done / tot * 100) : 0, od: list.filter(d => d.urg === 0).length };
}
function teamHtml(){

    return '<div class="rf-view"><div><button class="rf-backbtn" onclick="RF.teamBack()" style="margin-bottom:6px">' + IC.back + 'กลับ</button></div>' + perfBody(u) + '</div>';
  }
  if (S.teamDept) {
    const ms = tu.filter(u => u.dept === S.teamDept);
    let h = '<div class="rf-view"><div><button class="rf-backbtn" onclick="RF.deptBack()" style="margin-bottom:12px">' + IC.back + 'ทุกแผนก</button>' +
      '<h1 class="rf-h1">แผนก' + esc(S.teamDept) + '</h1><div class="rf-sub">แตะที่การ์ดเพื่อดูงานรายคน</div></div><div class="rf-teamgrid">';
    ms.forEach(u => {
      const o = statCnt(act.filter(d => d.u && d.u.email === u.email));
      h += '<button class="rf-teamcard" onclick="RF.teamPick(\'' + jsq(u.email) + '\')"><div style="display:flex;align-items:center;gap:12px;margin-bottom:12px">' +
        '<div class="rf-av" style="width:44px;height:44px;font-size:19px;background:' + u.color + '">' + esc(firstChar(u.nickname)) + '</div>' +
        '<div style="min-width:0"><div style="font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(dispName(u)) + '</div>' +
        '<div style="font-size:13px;color:var(--muted)">' + esc(u.dept) + '</div></div></div>' + miniChips(o) + teamCardFoot(o) + '</button>';
    });
    return h + '</div></div>';
  }
  const deptMap = {};
  tu.forEach(u => { (deptMap[u.dept] = deptMap[u.dept] || []).push(u); });
  const depts = Object.keys(deptMap);
  let h = '<div class="rf-view"><div><h1 class="rf-h1">ทีม</h1><div class="rf-sub">' + depts.length + ' แผนก · สมาชิก ' + tu.length + ' คน · แตะแผนกเพื่อดูรายคน</div></div><div class="rf-teamgrid">';
  depts.forEach(dept => {
    const ms = deptMap[dept];
    const o = statCnt(act.filter(d => d.u && ms.some(u => u.email === d.u.email)));
    h += '<button class="rf-teamcard" onclick="RF.deptPick(\'' + jsq(dept) + '\')"><div style="display:flex;align-items:center;gap:12px;margin-bottom:12px">' +
      '<div style="width:44px;height:44px;border-radius:13px;background:var(--accent-soft);color:var(--accent-ink);font-size:19px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0">' + esc(firstChar(dept)) + '</div>' +
      '<div style="min-width:0;flex:1"><div style="font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(dept) + '</div>' +
      '<div style="font-size:13px;color:var(--muted)">' + ms.length + ' คน</div></div>' + IC.chev + '</div>' + miniChips(o) + teamCardFoot(o) + '</button>';
  });
  if (!depts.length) h += '<div class="rf-empty">ยังไม่มีงานที่มอบหมายให้สมาชิก</div>';
  return h + '</div></div>';
}

/* ── overlays ── */
function renderOverlays(){
  const box = document.getElementById('overlays');
  if (!box) return;
  if (S.closing) return;   // ระหว่าง detail ปิด (animation) ห้าม rebuild — กันเด้งเปิดซ้ำ
  if (S._clDrag) return;   // ระหว่างลากจัดลำดับเช็คลิสต์ ห้าม rebuild — แถวที่ลากจะหาย
  invalidateDec();
  // จำ scroll ภายใน sheet ก่อน rebuild — กันเนื้อหาเด้งขึ้นบนสุดตอนติ๊กเช็คลิสต์/ส่งคอมเม้น/เลือกคนในฟอร์ม (เฉพาะตอน re-render — เปิดใหม่ (fresh) เริ่มบนสุดตามปกติ)
  const keep = {};
  // จำช่องที่กำลังพิมพ์ (คอมเม้น / เพิ่มเช็คลิสต์ / แก้ข้อความเช็คลิสต์ / ค้นหาคน) — sync เบื้องหลังมา rebuild ต้องไม่หลุด
  const fs = focusSnap();
  if (S.detailId && !S.detailFresh) { const el = document.getElementById('cmtScroll'); if (el) keep.cmtScroll = el.scrollTop; }
  if (S.formOpen && !S.formFresh) { const el = document.getElementById('formScroll'); if (el) keep.formScroll = el.scrollTop; }
  if (S.listPop && !S.popFresh) { const el = document.getElementById('popScroll'); if (el) keep.popScroll = el.scrollTop; }
  let h = '';
  if (S.detailId) h += detailHtml();
  if (S.formOpen) h += formHtml();
  if (S.listPop) h += popHtml();
  if (S.asgPick) h += asgPickHtml();
  if (S.recurForm) h += recurFormHtml();
  if (S.menuOpen) h += menuHtml();
  box.innerHTML = h;
  // entry animation เล่นเฉพาะตอนเปิดครั้งแรก — re-render ระหว่างเปิด (ส่งคอมเม้น/ติ๊กเช็คลิสต์) ไม่เล่นซ้ำ
  S.detailFresh = false; S.formFresh = false; S.popFresh = false; S.menuFresh = false;
  const ci = document.getElementById('cmtInput');
  if (ci && S.cmtDraft) ci.value = S.cmtDraft;
  focusBack(fs);   // คืน focus + เคอร์เซอร์ + ข้อความที่ค้างอยู่
  const sc = document.getElementById('cmtScroll');
  if (sc && S.scrollCmt) {
    const top = document.getElementById('cmtTop');   // คอมเม้นใหม่อยู่บนสุดของโซน → เลื่อนให้หัวโซนคอมเม้นขึ้นมาบน
    if (top) sc.scrollTop = sc.scrollTop + (top.getBoundingClientRect().top - sc.getBoundingClientRect().top) - 8;
    else sc.scrollTop = sc.scrollHeight;
    S.scrollCmt = false; delete keep.cmtScroll;
  }
  Object.keys(keep).forEach(function(id){ const el = document.getElementById(id); if (el) el.scrollTop = keep[id]; });
}

function detailHtml(){
  const t = S.tasks.find(x => x.id === S.detailId);
  if (!t) return '';
  const d = decorate(t);
  const dm = dueMeta(t);
  const mob = isMob();
  const edit = canEdit(t);
  const thread = S.comments.filter(c => c.taskId === t.id).sort((a, b) => newFirst(a.createdAt, b.createdAt));   // ใหม่→เก่า (ล่าสุดอยู่บน)
  const remain = dm.badge || (dm.urg === 2 ? 'เหลือ ' + dm.sort + ' วัน' : '');
  const isCan = d.status === 'cancelled';
  const boss = S.me && S.me.role >= 5 && edit;   // หัวหน้า "ที่มีชื่ออยู่บนงานนี้" เท่านั้น — คนนอกกดอะไรไม่ได้
  const canCancel = boss && !isCan && d.status !== 'done';
  const ctaMap = { todo: { l:'เริ่มทำ', n:'doing' }, doing: { l:'ส่งตรวจ 📤', n:'review' }, done: { l:'เปิดงานอีกครั้ง', n:'doing' }, cancelled: { l:'เปิดงานอีกครั้ง', n:'todo' } };
  // ── รับงานก่อนเริ่มทำ ── ยกเว้น 2 กรณี: มอบให้ตัวเอง / ครบกำหนดวันนี้-เลยแล้ว (ต้องเริ่มเลย)
  const meL2 = S.me ? String(S.me.email || '').toLowerCase() : '';
  const asgL = String(t.assigneeEmail || '').toLowerCase();
  const selfMade = !!asgL && String(t.createdBy || '').toLowerCase() === asgL;
  const dueNow = t.dueDate ? diffDays(t.dueDate) <= 0 : false;
  const ackSkip = selfMade || dueNow;
  const needAck = !!asgL && !t.ackAt && !ackSkip && !isCan && d.status === 'todo';
  const iMustAck = needAck && asgL === meL2;
  const iAmAsg = !!asgL && asgL === meL2;   // เปลี่ยนสถานะได้เฉพาะผู้รับผิดชอบ (หัวหน้าไว้ตรวจ/ยกเลิก/เปิดใหม่)
  let ctaPart = '';
  if (iMustAck) {
    ctaPart = '<button class="rf-cta" onclick="RF.ackTask(\'' + jsq(t.id) + '\')">✋ รับงาน</button>';
  } else if (edit && d.status === 'review') {
    ctaPart = boss
      ? '<div class="rf-revpair"><button class="rf-cta ghost" onclick="RF.setStatus(\'' + jsq(t.id) + '\',\'doing\')">ตีกลับให้แก้</button>' +
        '<button class="rf-cta" style="flex:1.4" onclick="RF.setStatus(\'' + jsq(t.id) + '\',\'done\')">ตรวจผ่าน ✓</button></div>'
      : '<div class="rf-cancelnote rf-waitnote" style="text-align:center">⏳ ส่งตรวจแล้ว — รอหัวหน้าตรวจ</div>';
  } else if (iAmAsg && !isCan && (d.status === 'todo' || d.status === 'doing')) {
    const cta = ctaMap[d.status];
    ctaPart = '<button class="rf-cta" onclick="RF.setStatus(\'' + jsq(t.id) + '\',\'' + cta.n + '\')">' + cta.l + '</button>';
  } else if (boss && (isCan || d.status === 'done')) {
    const cta = ctaMap[d.status] || ctaMap.todo;
    ctaPart = '<button class="rf-cta ghost" onclick="RF.setStatus(\'' + jsq(t.id) + '\',\'' + cta.n + '\')">' + cta.l + '</button>';
  }
  const lineBtn = '<button class="rf-linebtn" onclick="RF.shareLine(\'' + jsq(t.id) + '\')" title="' + (isPhone() ? 'ส่งงานนี้เข้าไลน์' : 'คัดลอกข้อความไปวางในไลน์') + '">' + IC.send + (isPhone() ? 'ไลน์' : 'คัดลอกส่งไลน์') + '</button>';
  const cancelBtn = canCancel ? '<button class="rf-cancelbtn" onclick="RF.cancelTask(\'' + jsq(t.id) + '\')">ยกเลิกงาน</button>' : '';
  const actionBar = '<div class="rf-actbar">' + ctaPart + cancelBtn + lineBtn + '</div>';
  const rep = userByEmail(t.reporterEmail) || userByName(t.reporterName);
  const repNick = rep ? dispName(rep) : (t.reporterName || '—');

  let pills = '';
  const canPill = iAmAsg && !isCan;   // กดเปลี่ยนสถานะตรงๆ ได้เฉพาะผู้รับผิดชอบ · หัวหน้าใช้ปุ่มตรวจผ่าน/ตีกลับ/ยกเลิกแทน
  COLS.forEach(c => {
    const on = d.status === c.id;
    let st = on ? 'background:' + SC[c.id][0] + ';color:' + SC[c.id][1] + ';border-color:' + SC[c.id][1] + ';' : '';
    if (!canPill) st += 'cursor:default;opacity:' + (on ? '1' : '.5') + ';';
    pills += '<button class="rf-pill" style="' + st + '"' + (canPill ? ' onclick="RF.setStatus(\'' + jsq(t.id) + '\',\'' + c.id + '\')"' : ' disabled') + '>' + c.label + '</button>';
  });

  let cmts = '';
  thread.forEach(c => {
    const u = userByEmail(c.authorEmail) || userByName(c.authorName);
    const nm = u ? dispName(u) : (c.authorName || '?');
    if (c.type === 'system') {
      cmts += '<div class="rf-sysline">⚙️ ' + esc(u ? dispName(u) : nm) + ' · ' + esc(c.text) + ' · ' + timeLabel(c.createdAt) + '</div>';
      return;
    }
    const who = (u && S.me && u.email === S.me.email) ? nm + ' · คุณ' : (u && u.role >= 5 ? nm + ' · หัวหน้า' : nm);
    const urls = String(c.imageUrl || '').split('\n').map(s => s.trim()).filter(Boolean);
    let imgHtml = '';
    if (urls.length === 1) imgHtml = '<div style="margin-top:6px"><a href="' + esc(urls[0]) + '" target="_blank" rel="noopener"><img src="' + esc(urls[0]) + '" alt="รูปแนบ" style="max-width:220px;border-radius:12px;display:block"></a></div>';
    else if (urls.length > 1) imgHtml = '<div class="rf-cmtimgs">' + urls.map(function(u2){ return '<a href="' + esc(u2) + '" target="_blank" rel="noopener"><img src="' + esc(u2) + '" alt="รูปแนบ"></a>'; }).join('') + '</div>';
    cmts += '<div class="rf-cmt">' + avCore(u ? firstChar(u.nickname) : firstChar(nm), u ? u.color : 'var(--slate)', u ? u.photo : '', 32) +
      '<div style="flex:1;min-width:0"><div style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap"><div style="font-size:13.5px;font-weight:700">' + esc(who) + '</div>' +
      '<div style="font-size:13px;color:var(--muted)">' + timeLabel(c.createdAt) + '</div></div>' +
      (c.text ? '<div class="bub">' + esc(c.text) + '</div>' : '') +
      imgHtml +
      '</div></div>';
  });
  if (!thread.length) cmts = '<div style="text-align:center;padding:16px;color:var(--muted);font-size:14px">ยังไม่มีคอมเม้น — เริ่มรายงานความคืบหน้าได้เลย</div>';
  const humanCc = thread.filter(c => c.type !== 'system').length;
  // แถบ "รับทราบงาน" — ผู้รับผิดชอบกดยืนยันว่าเห็นงานแล้ว (ผู้สั่งเห็นว่ารับแล้ว/ยัง)
  let ackHtml = '';
  {
    const openTask = !isCan && stOf(t) !== 'done';
    if (t.ackAt) {
      const au = userByEmail(t.ackBy);
      ackHtml = '<div class="rf-ackrow ok">✓ รับงานแล้ว · ' + esc(au ? dispName(au) : (t.ackBy || '')) + ' · ' + esc(timeLabel(t.ackAt)) + '</div>';
    } else if (iMustAck) {
      ackHtml = '<div class="rf-ackrow wait">ต้องกดรับงานก่อน ถึงจะเริ่มทำได้</div>';
    } else if (needAck && openTask) {
      ackHtml = '<div class="rf-ackrow wait">⏳ ยังไม่กดรับงาน</div>';

  }
  const cmtImgs = S.cmtImgs || [];
  let imgPrev = '';

    imgPrev = '<div class="rf-imgprevs">' + cmtImgs.map(function(im, ix){

        (S.cmtSending ? '' : '<button class="rf-imgx" onclick="RF.cmtImgClear(' + ix + ')" title="ลบรูป">' + IC.xs + '</button>') + '</div>';

  return '<div class="rf-ov ' + (mob ? 'bottom' : 'right') + '" style="' + (S.detailFresh ? '' : 'animation:none') + '" onclick="RF.closeDetail()">' +

    (isSecret(t) ? '<span class="rf-privbadge">🔒 ส่วนตัว</span>' : isPrivate(t) ? '<span class="rf-privbadge">👥 เฉพาะทีม</span>' : '') +

    ackHtml +

// ผลงานของ user คนหนึ่ง — งานที่มอบหมายให้เขา ทั้งเสร็จ+ยังไม่เสร็จ + กราฟงานเสร็จรายสัปดาห์ (ใช้ทั้งปุ่ม "ผลงาน" และหน้าทีม-รายคน)
function perfBody(user){
  if (!user) return '';
  const mineTasks = S.tasks.filter(t => { const u = taskUser(t); return u && u.email === user.email; });
  const dec = mineTasks.map(decorate);
  const done = sortL(dec.filter(d => d.status === 'done'));
  const active = sortL(dec.filter(d => d.status !== 'done' && d.status !== 'cancelled'));
  const cancelled = sortL(dec.filter(d => d.status === 'cancelled'));
  const overdue = active.filter(d => d.urg === 0).length;
  const total = done.length + active.length;
  const pct = total ? Math.round(done.length / total * 100) : 0;

  // งานเสร็จ = ใช้ updatedAt เป็นเวลาปิดงาน (โดยประมาณ)
  const doneTasks = mineTasks.filter(t => stOf(t) === 'done');
  const td = pd(todayIso());
  const doneThisMonth = doneTasks.filter(t => { const di = tsDateIso(t.updatedAt); if (!di) return false; const d = pd(di); return d.getMonth() === td.getMonth() && d.getFullYear() === td.getFullYear(); }).length;
  const thisWS = weekStartOf(todayIso());
  const weeks = [];
  for (let i = 5; i >= 0; i--) { const ws = addDays(thisWS, -i * 7); weeks.push({ ws, dd: pd(ws), c: 0 }); }
  doneTasks.forEach(t => { const di = tsDateIso(t.updatedAt); if (!di) return; const wk = weeks.find(w => w.ws === weekStartOf(di)); if (wk) wk.c++; });
  const wmax = Math.max(1, ...weeks.map(w => w.c));
  let bars = '';
  weeks.forEach((w, i) => {
    const cur = i === 5;
    bars += '<div class="rf-perfbar" title="สัปดาห์ ' + fmtYmd(w.ws) + ' · ' + w.c + ' งาน"><div style="font-size:11.5px;font-weight:700;color:var(--muted);height:15px;line-height:15px">' + (w.c || '') + '</div>' +
      '<div class="bar" style="height:' + (w.c > 0 ? Math.max(8, Math.round(w.c / wmax * 56)) : 5) + 'px;background:' + (cur ? 'var(--green)' : (w.c > 0 ? 'var(--accent)' : 'var(--surface)')) + '"></div>' +
      '<div style="font-size:11px;color:' + (cur ? 'var(--accent-ink)' : 'var(--muted)') + ';white-space:nowrap">' + (w.dd.getMonth() + 1) + '/' + w.dd.getDate() + '</div></div>';
  });

  const stat = (l, v, c) => '<div class="rf-perfstat"><div class="v" style="color:' + c + '">' + v + '</div><div class="l">' + l + '</div></div>';
  let h = '<div style="display:flex;align-items:center;gap:12px;padding:2px 4px 14px">' + avUserHtml(user, 48) +
    '<div style="min-width:0"><div style="font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(dispName(user)) + '</div>' +
    '<div style="font-size:13px;color:var(--muted)">' + esc(user.role >= 5 ? 'หัวหน้าทีม' : user.dept) + '</div></div></div>';
  h += '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">' +
    stat('เสร็จแล้ว', done.length, 'var(--green)') + stat('ยังไม่เสร็จ', active.length, 'var(--blue)') +
    stat('เลยกำหนด', overdue, overdue ? 'var(--red)' : 'var(--muted)') + '</div>';
  h += '<div style="margin:12px 4px 4px"><div style="display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-bottom:5px"><span>ความคืบหน้ารวม (' + done.length + '/' + total + ')</span><span style="font-weight:700;color:var(--text)">' + pct + '%</span></div>' +
    '<div class="rf-bar" style="height:8px"><div style="width:' + pct + '%;background:var(--green)"></div></div></div>';
  h += '<div style="background:var(--surface2);border-radius:14px;padding:12px 14px;margin-top:12px">' +
    '<div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:2px"><div style="font-size:13.5px;font-weight:700">งานเสร็จรายสัปดาห์</div>' +
    '<div style="font-size:12.5px;color:var(--muted)">เดือนนี้ <span style="font-weight:700;color:var(--green)">' + doneThisMonth + '</span> งาน</div></div>' +
    '<div class="rf-perfbars">' + bars + '</div></div>';
  h += '<div class="rf-perfsec">🔸 ยังไม่เสร็จ (' + active.length + ')</div>';
  if (active.length) h += '<div class="rf-list">' + active.map(d => rowHtml(d, { badge: true })).join('') + '</div>';
  else h += '<div class="rf-empty" style="padding:14px">ไม่มีงานค้าง 🎉</div>';
  h += '<div class="rf-perfsec">✅ เสร็จแล้ว (' + done.length + ')</div>';
  if (done.length) h += '<div class="rf-list">' + done.map(d => rowHtml(d, {})).join('') + '</div>';
  else h += '<div class="rf-empty" style="padding:14px">ยังไม่มีงานที่ทำเสร็จ</div>';
  if (cancelled.length) h += '<div class="rf-perfsec">🚫 ยกเลิก (' + cancelled.length + ')</div><div class="rf-list">' + cancelled.map(d => rowHtml(d, {})).join('') + '</div>';
  return h;
}
/* ลิสต์ที่ป๊อปอัปใช้ — ถ้าเปิดจากแดชบอร์ดโหมด "ของฉัน" ต้องกรองเหมือนกัน
   (เดิมตัวเลขบนแดชบอร์ดกรองของฉัน แต่ลิสต์ที่กดเข้าไปโชว์ทั้งทีม → เลขไม่ตรงกัน) */
// แดชบอร์ดกำลังกรอง "ของฉัน" อยู่ไหม — ส่งต่อให้ป๊อปอัปที่กดจากตัวเลขบนแดชบอร์ด

function popSuffix(){ return S.popMine ? ' · ของฉัน' : ''; }

  else if (lp === 'cancelled') { title = 'งานที่ยกเลิกแล้ว'; sortL(fDec().filter(d => d.status === 'cancelled')).forEach(d => body += rowHtml(d, {})); }

  else if (lp === 'open') { title = 'งานที่ยังไม่เสร็จ' + (popSuffix() || ' · ทั้งหมด'); sortL(popDec().filter(d => d.status !== 'done' && d.status !== 'cancelled')).forEach(d => body += rowHtml(d, { badge: true })); }
  else if (lp === 'overdue') { title = 'งานเลยกำหนด' + popSuffix(); sortL(popDec().filter(d => d.urg === 0)).forEach(d => body += rowHtml(d, { badge: true })); }
  else if (lp === 'done7') { title = 'งานเสร็จแล้ว · 7 วันล่าสุด' + popSuffix(); sortL(popDec().filter(function(d){ const t = S.tasks.find(x => x.id === d.id); if (!t || d.status !== 'done' || !t.updatedAt) return false; const di = tsDateIso(t.updatedAt); return di && diffDays(di) >= -7; })).forEach(d => body += rowHtml(d, {})); }
  else if (lp === 'recur') {
    title = 'งานประจำ';
    body += '<button class="rf-cta" style="margin-bottom:12px" onclick="RF.recurNew()">+ เพิ่มงานประจำ</button>';
    const rlist = (S.recur || []).slice().sort(function(a, b){ return newFirst(a.createdAt, b.createdAt); });   // ตั้งล่าสุดอยู่บน
    if (!rlist.length) body += '<div class="rf-empty" style="padding:26px 16px;text-align:center">ยังไม่มีงานประจำ<div style="font-size:13px;color:var(--muted);margin-top:6px">กดปุ่มด้านบนเพื่อตั้งงานที่ต้องทำซ้ำทุกวัน/สัปดาห์/เดือน</div></div>';
    rlist.forEach(function(r){
      const ru = userByEmail(r.assigneeEmail);
      const st = recurStats(r.id);
      const on = String(r.active || '').trim().toUpperCase() === 'Y';
      body += '<div class="rf-recrow">' +

function recurStats(rid){
  let total = 0, done = 0, full = 0;
  S.tasks.forEach(function(t){
    if (String(t.recurId || '') !== String(rid)) return;
    total++;
    if (stOf(t) === 'done') done++;
    const cl = parseCl(t);
    if (cl.length && cl.every(function(i){ return i.d; })) full++;
  });
  return { total: total, done: done, full: full };
}

/* ── Web Push (FCM) — โครงรอ config · ไม่โหลด SDK/ไม่ทำงาน/ปุ่มไม่โผล่ จนกว่า CFG.firebase.apiKey + CFG.vapidKey จะถูกใส่ ── */
/* ══════════════════════════════════════════════════════════════════════════
   GOOGLE CALENDAR — งานของเรา → ปฏิทินส่วนตัวของเราเอง (แบบ ค)
   ──────────────────────────────────────────────────────────────────────────
   · เขียนเป็น "กิจกรรมทั้งวัน" ในวันครบกำหนด — ไม่ต้องกรอกเวลาเพิ่ม
   · รหัสกิจกรรมคำนวณจาก taskId ตรงๆ (calEventId) → ไม่ต้องเก็บ mapping ที่ไหนเลย
     เปลี่ยนเครื่อง/ล้างแคช ก็ยังอัปเดตกิจกรรมเดิม ไม่สร้างซ้ำ
   · อ่านนัดของเราเองกลับมาโชว์ในหน้าปฏิทินด้วย (สิทธิ์เดียวกัน ไม่ต้องขอเพิ่ม)
   ⚠️ ต้องเปิด "Google Calendar API" ใน Google Cloud project ก่อน แล้วตั้ง CFG.calendar.on = true
   ══════════════════════════════════════════════════════════════════════════ */
const CAL_API = 'https://www.googleapis.com/calendar/v3/calendars/primary/events';
const CAL_LEADS = [{ v:0, l:'ไม่เตือน' }, { v:1, l:'1 วันก่อน 09:00' }, { v:2, l:'2 วันก่อน 09:00' }, { v:3, l:'3 วันก่อน 09:00' }];
function calConfigured(){ return !!(CFG.calendar && CFG.calendar.on); }
function calOn(){ try { return calConfigured() && localStorage.getItem('rf_cal_on') === '1'; } catch(e){ return false; } }
function calLead(){ try { const n = parseInt(localStorage.getItem('rf_cal_lead'), 10); return isNaN(n) ? 1 : n; } catch(e){ return 1; } }
/* รหัสกิจกรรม Google รับแค่ a-v กับ 0-9 (⚠️ w x y z ใช้ไม่ได้ — คำว่า "rflow" จึงใช้เป็น prefix ไม่ได้)
   → prefix 'rflotask' + taskId ที่เข้ารหัสเป็น hex (0-9a-f อยู่ในช่วงพอดี) */
const CAL_PREFIX = 'rflotask';
function calEventId(taskId){
  let hex = '';
  const s = String(taskId || '');
  for (let i = 0; i < s.length; i++) hex += ('000' + s.charCodeAt(i).toString(16)).slice(-4);
  return CAL_PREFIX + hex;
}
let _calTok = '', _calExp = 0;
function calToken(interactive){
  if (_calTok && Date.now() < _calExp - 60000) return Promise.resolve(_calTok);
  return new Promise(function(res, rej){
    if (!(window.google && google.accounts && google.accounts.oauth2)) { rej(new Error('Google SDK ยังไม่พร้อม ลองใหม่อีกครั้ง')); return; }
    const tc = google.accounts.oauth2.initTokenClient({
      client_id: CFG.clientId,
      scope: CFG.calendar.scope,
      prompt: interactive ? 'consent' : '',
      callback: function(r){
        if (r && r.access_token) { _calTok = r.access_token; _calExp = Date.now() + ((r.expires_in || 3600) * 1000); res(_calTok); }
        else rej(new Error((r && r.error_description) || 'ขอสิทธิ์ปฏิทินไม่สำเร็จ'));
      },
      error_callback: function(e){ rej(new Error((e && e.message) || 'ปิดหน้าต่างขออนุญาตก่อนกดยอมรับ')); }
    });
    tc.requestAccessToken();
  });
}
function calFetch(url, opt){
  return calToken(false).then(function(tok){
    const o = Object.assign({ method: 'GET' }, opt || {});
    o.headers = Object.assign({ Authorization: 'Bearer ' + tok }, o.headers || {});
    if (o.body && typeof o.body !== 'string') { o.body = JSON.stringify(o.body); o.headers['Content-Type'] = 'application/json'; }
    return fetch(url, o).then(function(r){
      if (r.status === 204) return {};
      return r.json().catch(function(){ return {}; }).then(function(j){
        if (r.ok) return j;
        const msg = (j && j.error && j.error.message) || ('HTTP ' + r.status);
        const err = new Error(msg); err.status = r.status; throw err;
      });
    });
  });
}
// สีกิจกรรมตามสถานะ (colorId ของ Google Calendar)
function calColor(d){
  if (d.status === 'done') return '10';                 // เขียว
  if (d.urg === 0) return '11';                         // แดง — เลยกำหนด
  if (d.urg === 1) return '6';                          // ส้ม — ครบวันนี้/ใกล้
  if (d.status === 'doing' || d.status === 'review') return '9';   // น้ำเงิน
  return '8';                                           // เทา — รอทำ
}
function calBody(t){
  const d = decorate(t), cl = parseCl(t), st = stOf(t);
  const rep = userByEmail(t.reporterEmail) || userByName(t.reporterName);
  const emo = st === 'done' ? '✅' : (d.urg === 0 ? '🔴' : (d.urg === 1 ? '🟠' : (st === 'doing' || st === 'review' ? '🔵' : '⚪')));
  let desc = 'สถานะ: ' + d.statusLabel + ' · ความสำคัญ: ' + d.prioLabel + '\n';
  if (rep) desc += 'สั่งโดย: ' + dispName(rep) + '\n';
  if (t.detail) desc += '\n' + String(t.detail).slice(0, 400) + '\n';
  if (cl.length) {
    desc += '\nเช็คลิสต์ ' + cl.filter(function(i){ return i.d; }).length + '/' + cl.length + ' ข้อ\n';
    cl.slice(0, 20).forEach(function(it, i){ desc += (it.d ? '✅' : '⬜') + ' ' + (i + 1) + '. ' + clStrip(it.t) + '\n'; });
    if (cl.length > 20) desc += '…และอีก ' + (cl.length - 20) + ' ข้อ\n';
  }
  desc += '\n— R-Flow';
  const lead = calLead();
  return {
    id: calEventId(t.id),
    summary: emo + ' ' + String(t.title || ''),
    description: desc,
    start: { date: t.dueDate },
    end: { date: addDays(t.dueDate, 1) },        // กิจกรรมทั้งวัน — วันจบต้อง +1 (Google นับแบบไม่รวมวันจบ)
    colorId: calColor(d),
    transparency: 'transparent',                 // ไม่ทำให้ปฏิทินขึ้นว่า "ไม่ว่าง"
    reminders: { useDefault: false, overrides: lead > 0 ? [{ method: 'popup', minutes: lead * 1440 - 540 }] : [] }
  };
}
function calUpsert(t){
  const body = calBody(t), id = body.id;
  return calFetch(CAL_API + '/' + id, { method: 'PUT', body: body })
    .catch(function(e){
      if (e.status === 404 || e.status === 410) return calFetch(CAL_API, { method: 'POST', body: body });   // ยังไม่มี → สร้างใหม่
      throw e;
    });
}
function calRemove(taskId){
  return calFetch(CAL_API + '/' + calEventId(taskId), { method: 'DELETE' })
    .catch(function(e){ if (e.status === 404 || e.status === 410) return {}; throw e; });   // ไม่มีอยู่แล้ว = ถือว่าสำเร็จ
}
// งานที่ควรอยู่ในปฏิทินของเรา = งานที่มอบให้เรา + มีวันครบกำหนด + ไม่ยกเลิก
function calMine(){
  if (!S.me) return { keep: [], drop: [] };
  const me = S.me.email, keep = [], drop = [];
  S.tasks.forEach(function(t){
    const u = taskUser(t);
    if (!u || u.email !== me) return;
    if (t.dueDate && stOf(t) !== 'cancelled') keep.push(t); else drop.push(t);
  });
  return { keep: keep, drop: drop };
}
// ซิงก์ทั้งก้อนอย่างมาก 10 นาที/ครั้ง — งานที่แก้รายตัวใช้ calSyncOne อยู่แล้ว ไม่ต้องรอ
function calSyncIfStale(){
  if (!calOn() || !S.me) return;
  const last = S.cal.lastSync ? Date.parse(S.cal.lastSync) : 0;
  if (Date.now() - last < 600000) return;
  calSyncAll(true);
}
function calSyncAll(silent){
  if (!calOn() || !S.me || S.cal.busy) return Promise.resolve();
  S.cal.busy = true; if (!silent) render();
  const m = calMine();
  const jobs = m.keep.map(function(t){ return function(){ return calUpsert(t); }; })
    .concat(m.drop.map(function(t){ return function(){ return calRemove(t.id); }; }));
  let i = 0, okN = 0, errMsg = '';
  const step = function(){
    if (i >= jobs.length) return Promise.resolve();
    return jobs[i++]().then(function(){ okN++; }).catch(function(e){ if (!errMsg) errMsg = e.message; }).then(step);
  };
  return step().then(function(){
    S.cal.busy = false; S.cal.lastSync = new Date().toISOString(); S.cal.err = errMsg;
    try { localStorage.setItem('rf_cal_sync', S.cal.lastSync); } catch(e){}
    render();
    if (!silent) toast(errMsg ? 'ลงปฏิทินไม่ครบ: ' + errMsg : 'ลงปฏิทินแล้ว ' + okN + ' รายการ ✓');
  }).catch(function(e){
    S.cal.busy = false; S.cal.err = e.message; render();
    if (!silent) toast('ลงปฏิทินไม่สำเร็จ: ' + e.message);
  });
}
// ซิงก์งานเดียว (หลังแก้/เปลี่ยนสถานะ) — เงียบ ไม่รบกวนผู้ใช้
function calSyncOne(taskId){
  if (!calOn() || !S.me) return;
  const t = S.tasks.find(function(x){ return x.id === taskId; });
  if (!t) { calRemove(taskId).catch(function(){}); return; }
  const u = taskUser(t);
  if (!u || u.email !== S.me.email || !t.dueDate || stOf(t) === 'cancelled') { calRemove(taskId).catch(function(){}); return; }
  calUpsert(t).catch(function(){});
}
/* อ่านนัดของเราเองมาโชว์ในหน้าปฏิทิน — ตัดกิจกรรมที่แอปสร้างเองออก (ไม่งั้นซ้ำกับงาน) */
function calLoadEvents(fromIso, toIso){
  if (!calOn()) return Promise.resolve([]);
  const q = '?timeMin=' + encodeURIComponent(fromIso + 'T00:00:00+07:00') +
    '&timeMax=' + encodeURIComponent(toIso + 'T23:59:59+07:00') +
    '&singleEvents=true&orderBy=startTime&maxResults=250';
  return calFetch(CAL_API + q).then(function(j){
    return (j.items || []).filter(function(e){ return String(e.id || '').indexOf(CAL_PREFIX) !== 0 && e.status !== 'cancelled'; })
      .map(function(e){
        const allDay = !!(e.start && e.start.date);
        const sIso = allDay ? e.start.date : String(e.start.dateTime || '').slice(0, 10);
        return { id: e.id, title: e.summary || '(ไม่มีชื่อ)', allDay: allDay, iso: sIso,
          time: allDay ? 'ทั้งวัน' : (tsTime(e.start.dateTime) + (e.end && e.end.dateTime ? '–' + tsTime(e.end.dateTime) : '')) };
      });
  }).catch(function(){ return []; });
}
function calRefreshEvents(){
  if (!calOn()) return;
  const from = addDays(todayIso(), -7), to = addDays(todayIso(), 45);
  calLoadEvents(from, to).then(function(evs){ S.cal.events = evs; render(); });
}
// นัดจากปฏิทินของวันที่เลือก (โชว์ใต้รายการงานในหน้าปฏิทิน)
function calDayEvHtml(iso){
  if (!calOn() || !iso) return '';
  const evs = (S.cal.events || []).filter(function(e){ return e.iso === iso; });
  if (!evs.length) return '';
  let h = '<div class="rf-card" style="padding:16px;margin-top:12px"><div style="font-size:15px;font-weight:700;margin-bottom:4px">📅 นัดในปฏิทินของคุณ <span style="font-weight:600;color:var(--muted);font-size:13px">(' + evs.length + ')</span></div>' +
    '<div style="font-size:12.5px;color:var(--muted);margin-bottom:8px">ดึงมาจาก Google Calendar — ดูได้อย่างเดียว</div>';
  evs.forEach(function(e){
    h += '<div class="rf-gcrow"><span class="dot"></span><span class="tm">' + esc(e.time) + '</span><span class="nm">' + esc(e.title) + '</span></div>';
  });
  return h + '</div>';
}
// แถวตั้งค่าใต้ปุ่ม — โผล่เฉพาะคนที่เปิดปฏิทินแล้ว
function calSetHtml(){
  if (!calOn()) return '';
  const lead = calLead();
  const sync = S.cal.lastSync ? ' · ซิงก์ ' + tsTime(S.cal.lastSync) : '';
  return '<div class="rf-calset"><span>เตือนล่วงหน้า</span>' +
    '<select onchange="RF.calLead(this.value)">' +
    CAL_LEADS.map(function(o){ return '<option value="' + o.v + '"' + (o.v === lead ? ' selected' : '') + '>' + o.l + '</option>'; }).join('') +
    '</select><div style="flex:1"></div><button class="rf-callink" onclick="RF.calOff()">เลิกลง</button></div>' +
    (sync ? '<div style="font-size:12px;color:var(--muted);margin-top:2px">งานที่มอบให้คุณ' + sync + '</div>' : '');
}
function calBtnHtml(cls){
  if (!calConfigured()) return '';
  const ic = '<span style="font-size:16px;flex-shrink:0">📅</span>';
  if (S.cal.busy) return '<button class="' + (cls || 'rf-darkbtn') + '" disabled>' + ic + 'กำลังลงปฏิทิน…</button>';
  if (calOn()) return '<button class="' + (cls || 'rf-darkbtn') + '" style="color:var(--green)" onclick="RF.calSync()" title="แตะเพื่อซิงก์ใหม่">' + ic + 'ลงปฏิทินแล้ว ✓</button>';
  return '<button class="' + (cls || 'rf-darkbtn') + '" onclick="RF.calEnable()">' + ic + 'ลงปฏิทินของฉัน</button>';

RF.calEnable = () => {
  if (!calConfigured()) { toast('ยังไม่ได้เปิดใช้ Google Calendar'); return; }
  S.menuOpen = false; renderOverlays();
  toast('กำลังขอสิทธิ์ปฏิทิน…');
  calToken(true).then(function(){
    try { localStorage.setItem('rf_cal_on', '1'); } catch(e){}
    render();
    return calSyncAll(false).then(calRefreshEvents);
  }).catch(function(e){
    const m = String(e.message || e);
    toast(/has not been used|disabled|SERVICE_DISABLED/i.test(m) ? 'ยังไม่ได้เปิด Google Calendar API ที่ Google Cloud' : 'เปิดปฏิทินไม่สำเร็จ: ' + m);
  });
};
RF.calSync = () => { calSyncAll(false).then(calRefreshEvents); };
RF.calOff = () => {
  if (!confirm('เลิกลงปฏิทิน?\nกิจกรรมที่ลงไปแล้วจะยังค้างอยู่ในปฏิทิน ต้องลบเอง')) return;
  try { localStorage.removeItem('rf_cal_on'); } catch(e){}
  S.cal.events = []; render(); toast('เลิกลงปฏิทินแล้ว');
};
RF.calLead = v => {
  try { localStorage.setItem('rf_cal_lead', String(v)); } catch(e){}
  renderOverlays(); toast('บันทึกแล้ว — จะมีผลกับงานที่ซิงก์รอบถัดไป');
};

function pushConfigured(){ return !!(CFG.firebase && CFG.firebase.apiKey && CFG.vapidKey); }
function pushOn(){ try { return ('Notification' in window) && Notification.permission === 'granted' && localStorage.getItem('rf_push_on') === '1'; } catch(e){ return false; } }
function pushBtnHtml(cls){
  if (!pushConfigured()) return '';
  const bell = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>';
  if (pushOn()) return '<button class="' + (cls || 'rf-darkbtn') + '" style="color:var(--green)" onclick="RF.enablePush()" title="แตะเพื่อลงทะเบียนเครื่องนี้ซ้ำ">' + bell + 'เปิดแจ้งเตือนแล้ว ✓</button>';
  return '<button class="' + (cls || 'rf-darkbtn') + '" onclick="RF.enablePush()">' + bell + 'เปิดแจ้งเตือน</button>';
}
let _fbLoaded = false;
function loadFirebase(){
  if (_fbLoaded && window.firebase) return Promise.resolve();
  const V = '10.12.2';
  const add = src => new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('โหลด Firebase SDK ไม่สำเร็จ')); document.head.appendChild(s); });
  return add('https://www.gstatic.com/firebasejs/' + V + '/firebase-app-compat.js')
    .then(() => add('https://www.gstatic.com/firebasejs/' + V + '/firebase-messaging-compat.js'))
    .then(() => { _fbLoaded = true; });
}
RF.enablePush = () => {
  if (!pushConfigured()) { toast('ยังไม่ได้ตั้งค่า Firebase'); return; }
  if (!('serviceWorker' in navigator) || !('Notification' in window) || !('PushManager' in window)) { toast('เบราว์เซอร์นี้ยังไม่รองรับการแจ้งเตือน'); return; }
  S.menuOpen = false; renderOverlays();
  Promise.resolve()
    .then(() => Notification.requestPermission())
    .then(perm => {
      if (perm !== 'granted') { toast('ยังไม่ได้อนุญาตแจ้งเตือน'); render(); return null; }   // แถบเตือนเปลี่ยนข้อความเป็น "ไปเปิดที่ตั้งค่าเครื่อง"
      return loadFirebase()
        .then(() => { if (!firebase.apps.length) firebase.initializeApp(CFG.firebase); return navigator.serviceWorker.register('firebase-messaging-sw.js'); })
        .then(reg => firebase.messaging().getToken({ vapidKey: CFG.vapidKey, serviceWorkerRegistration: reg }))
        .then(token => {
          if (!token) { toast('ขอ token ไม่สำเร็จ'); return; }
          try { localStorage.setItem('rf_push_on', '1'); } catch(e){}
          pushListen();
          return api('savePushToken', { token: token, ua: navigator.userAgent }).then(() => { toast('เปิดแจ้งเตือนแล้ว ✓'); render(); });
        });
    })
    .catch(e => toast('เปิดแจ้งเตือนไม่สำเร็จ: ' + (e && e.message || e)));
};
// เด้ง toast ตอนแอปเปิดอยู่ (foreground) — SW จัดการเฉพาะตอนแอปปิด/พื้นหลัง
function pushListen(){
  try {
    firebase.messaging().onMessage(function(p){
      const d = (p && p.data) || {}, n = (p && p.notification) || {};   // หลังบ้านส่ง data-only → อ่านจาก data ก่อน
      const ti = d.title || n.title || 'แจ้งเตือน', bo = d.body || n.body || '';
      toast('🔔 ' + ti + (bo ? ' — ' + bo : ''));
      loadAll(true);                                                     // ดึงงานใหม่มาเลย ไม่ต้องรอรอบ poll
    });
  } catch(e){}
}
// คนที่เคยเปิดแจ้งเตือนแล้ว → ทุกครั้งที่เปิดแอป: ต่อ SW + ฟัง foreground + refresh token เงียบๆ
function initPushOnBoot(){
  try {
    if (!pushConfigured() || !SESSION.email) return;
    if (!('serviceWorker' in navigator) || !('Notification' in window)) return;
    if (Notification.permission !== 'granted' || localStorage.getItem('rf_push_on') !== '1') return;
    loadFirebase()
      .then(function(){ if (!firebase.apps.length) firebase.initializeApp(CFG.firebase); return navigator.serviceWorker.register('firebase-messaging-sw.js'); })
      .then(function(reg){ return firebase.messaging().getToken({ vapidKey: CFG.vapidKey, serviceWorkerRegistration: reg }); })
      .then(function(token){ if (token){ pushListen(); api('savePushToken', { token: token, ua: navigator.userAgent }).catch(function(){}); } })
      .catch(function(){});
  } catch(e){}
}

/* ── กระดิ่งแจ้งเตือนในแอป — คำนวณจาก S.tasks/S.comments ที่มีอยู่ ไม่แตะ backend ── */
function notifSeen(){ try { return localStorage.getItem('rf_notif_seen') || ''; } catch(e){ return ''; } }
function setNotifSeen(){ try { localStorage.setItem('rf_notif_seen', new Date().toISOString()); } catch(e){} }
function initNotifSeen(){ try { if (!localStorage.getItem('rf_notif_seen')) localStorage.setItem('rf_notif_seen', new Date().toISOString()); } catch(e){} }
function notifFeed(){
  if (!S.me) return [];
  const me = S.me.email, items = [];
  S.tasks.forEach(function(t){
    if (t.assigneeEmail === me && t.createdBy && t.createdBy !== me && stOf(t) !== 'cancelled')
      items.push({ type:'assign', taskId:t.id, title:'มอบงานให้คุณ', sub:t.title || '', ts:t.createdAt || '' });
  });
  const mine = {};
  S.tasks.forEach(function(t){ if (t.assigneeEmail === me || t.reporterEmail === me) mine[t.id] = t; });
  S.comments.forEach(function(c){
    if (c.type === 'system' || !mine[c.taskId] || !c.authorEmail || c.authorEmail === me) return;
    const u = userByEmail(c.authorEmail);
    items.push({ type:'comment', taskId:c.taskId, title:(u ? dispName(u) : (c.authorName || 'มีคน')) + ' คอมเม้น', sub:'"' + (mine[c.taskId].title || '') + '" · ' + (c.text || '(รูป)'), ts:c.createdAt || '' });
  });
  items.sort(function(a, b){ return newFirst(a.ts, b.ts); });   // ล่าสุดอยู่บน
  return items.slice(0, 40);
}
function notifUnread(){ const seen = notifSeen(); if (!seen) return 0; return notifFeed().filter(function(i){ return i.ts > seen; }).length; }
// เลขแดงบนไอคอนแอปที่หน้าจอ (App Badge) — ต้องติดตั้ง PWA ลงจอโฮมก่อนถึงจะเห็น
function updateAppBadge(){
  try {
    if (!navigator.setAppBadge) return;
    const n = notifUnread();
    if (n > 0) navigator.setAppBadge(n).catch(function(){});
    else if (navigator.clearAppBadge) navigator.clearAppBadge().catch(function(){});
  } catch(e){}
}
function notifDue(){
  if (!S.me) return [];
  const me = S.me.email;
  return sortL(allDec().filter(function(d){ return d.u && d.u.email === me && d.status !== 'done' && d.status !== 'cancelled' && (d.urg === 0 || d.urg === 1); }));
}
function notifBellHtml(){

RF.clDragStart = (e, id, i) => {

RF._clDragMove = e => {

  const center = d.rects[d.from].top + d.rects[d.from].height / 2 + dy;
  let to = 0;
  for (let k = 0; k < d.rects.length; k++) {
    if (k === d.from) continue;
    if (center > d.rects[k].top + d.rects[k].height / 2) to++;

  d.to = to;
  for (let k = 0; k < d.rows.length; k++) {
    if (k === d.from) continue;
    let sh = 0;
    if (d.from < to && k > d.from && k <= to) sh = -d.slot;
    else if (d.from > to && k >= to && k < d.from) sh = d.slot;
    d.rows[k].style.transform = sh ? 'translateY(' + sh + 'px)' : '';

RF._clDragEnd = () => {

  if (id < 0 || id >= items.length) { renderOverlays(); return; }

  const room = MAXN - S.cmtImgs.length;
  if (room <= 0) { toast('แนบได้สูงสุด ' + MAXN + ' รูป'); return; }
  if (imgFiles.length > room) toast('แนบได้สูงสุด ' + MAXN + ' รูป');
  imgFiles.slice(0, room).forEach(function(f){
    const rd = new FileReader();
    rd.onload = function(){
      const im = new Image();
      im.onload = function(){
        const MAX = 1280;
        let w = im.width, h = im.height;
        if (w > MAX || h > MAX) { const r = Math.min(MAX / w, MAX / h); w = Math.round(w * r); h = Math.round(h * r); }
        const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
        cv.getContext('2d').drawImage(im, 0, 0, w, h);
        if (!S.cmtImgs) S.cmtImgs = [];
        if (S.cmtImgs.length < MAXN) S.cmtImgs.push({ dataUrl: cv.toDataURL('image/jpeg', 0.85), name: String(f.name || 'photo').replace(/\.[^.]+$/, '') + '.jpg' });
        renderOverlays();
      };
      im.onerror = function(){ toast('อ่านไฟล์รูปไม่สำเร็จ'); };
      im.src = rd.result;
    };
    rd.readAsDataURL(f);
  });
};
RF.cmtImgClear = ix => { if (!S.cmtImgs) return; if (ix == null) S.cmtImgs = []; else S.cmtImgs.splice(ix, 1); renderOverlays(); };
RF.cancelTask = id => {
  if (!S.me || S.me.role < 5) { toast('ยกเลิกงานได้เฉพาะหัวหน้า (R5+)'); return; }
  if (!confirm('ยกเลิกงานนี้?\nงานจะถูกซ่อนจากบอร์ด/ปฏิทิน (หัวหน้าเปิดกลับมาได้ภายหลัง)')) return;
  RF.setStatus(id, 'cancelled');
};
/* ส่งไลน์ — มือถือเปิดไลน์ให้เลย · คอมส่งไม่ได้ (line.me เปิดได้แต่ส่งไม่ออก) → คัดลอกให้แทน */
function openLine(text){ window.open('https://line.me/R/msg/text/?' + encodeURIComponent(text), '_blank'); }
function isPhone(){ return /Android|iPhone|iPad|iPod/i.test(navigator.userAgent); }
function copyToClip(text){
  const ok = function(){ toast('คัดลอกข้อความแล้ว — เปิดไลน์แล้ววาง (Ctrl+V)'); };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(ok).catch(function(){ clipFallback(text, ok); });
  } else clipFallback(text, ok);
}
function clipFallback(text, ok){
  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;top:-2000px;left:0;opacity:0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    ok();
  } catch(e){ toast('คัดลอกไม่สำเร็จ — ลองเลือกข้อความเองอีกที'); }
}
function shareText(text){
  if (!isPhone()) { copyToClip(text); return; }
  if (navigator.share) { navigator.share({ text: text }).catch(function(err){ if (err && err.name !== 'AbortError') openLine(text); }); return; }
  openLine(text);
}
RF.shareLine = id => {
  const t = S.tasks.find(x => x.id === id);
  if (!t) return;
  const d = decorate(t);
  const cs = S.comments.filter(c => c.taskId === id && c.type !== 'system').sort((a, b) => newFirst(a.createdAt, b.createdAt));
  const last = cs[0];   // ล่าสุดอยู่บน
  let text = '📋 ' + t.title +
    '\nสถานะ: ' + d.statusLabel + (d.hasBadge && d.status !== 'done' && d.status !== 'cancelled' ? ' · ' + d.badge : '') +
    '\nผู้รับผิดชอบ: ' + d.avName +
    (t.dueDate ? '\nกำหนดส่ง: ' + fmtYmd(t.dueDate) : '') +
    (d.clTotal ? '\nเช็คลิสต์: ' + d.clDone + '/' + d.clTotal + ' ข้อ' : '');
  if (t.detail) text += '\nรายละเอียด: ' + String(t.detail).replace(/\s+/g, ' ').slice(0, 150);
  if (last) {
    const lu = userByEmail(last.authorEmail) || userByName(last.authorName);
    text += '\n💬 ล่าสุด ' + (lu ? dispName(lu) : (last.authorName || '')) + ': ' + (String(last.text || '').slice(0, 120) || '(แนบรูป)');
  }
  text += shareSignature();
  shareText(text);
};
// ท้ายข้อความที่ส่งออกนอกแอป — ต้องบอกว่าใครเป็นคนส่ง ไม่งั้นคนรับในกลุ่มไลน์ไม่รู้ว่าใครแชร์มา
function shareSignature(){
  return '\n\nส่งโดย ' + (S.me ? dispName(S.me) : '') + '\n— R-Flow';
}
// ส่งเช็คลิสต์ทั้งชุด — ทุกข้อ ติ๊กแล้ว ✅ / ยังไม่ติ๊ก ⬜ + ชื่อคนที่ถูกมอบหมายรายข้อ
RF.shareCl = id => {
  const t = S.tasks.find(x => x.id === id);
  if (!t) return;
  const cl = parseCl(t);
  if (!cl.length) { toast('งานนี้ยังไม่มีเช็คลิสต์'); return; }
  const d = decorate(t), done = cl.filter(i => i.d).length, MAX = 15;
  let text = '☑️ เช็คลิสต์ — ' + t.title +
    '\nผู้รับผิดชอบ: ' + d.avName + (t.dueDate ? ' · กำหนดส่ง ' + fmtYmd(t.dueDate) : '') +
    '\nความคืบหน้า: ' + done + '/' + cl.length + ' ข้อ\n';
  cl.slice(0, MAX).forEach(function(it, i){
    const au = it.asg ? userByEmail(it.asg) : null;
    text += '\n' + (it.d ? '✅' : '⬜') + ' ' + (i + 1) + '. ' + clStrip(it.t) + (au ? ' — ' + dispName(au) : '');
  });
  if (cl.length > MAX) text += '\n…และอีก ' + (cl.length - MAX) + ' ข้อ';
  text += shareSignature();
  shareText(text);
};
RF.newTask = () => {
  S.form = { id: null, title: '', detail: '', assigneeEmail: '', priority: 'med', startDate: todayIso(), dueDate: '', note: '', private: '' };
  S.formOpen = true; S.formFresh = true; S.errs = {}; S.assigneeQ = ''; S.saving = false;
  renderOverlays(); syncHistory();
};
RF.editTask = id => {
  const t = S.tasks.find(x => x.id === id);
  if (!t) return;
  const u = taskUser(t);
  S.form = { id: t.id, title: t.title, detail: t.detail || '', assigneeEmail: u ? u.email : '', priority: PL[t.priority] ? t.priority : 'med', startDate: t.startDate || '', dueDate: t.dueDate || '', note: t.note || '', private: privOf(t) };
  S.formOpen = true; S.formFresh = true; S.errs = {}; S.assigneeQ = ''; S.saving = false;
  renderOverlays(); syncHistory();
};
RF.closeForm = (fromPop) => { if (!fromPop && S._histPushed) { try { history.back(); return; } catch(e){} } S.formOpen = false; S.form = null; S.errs = {}; S.saving = false; renderOverlays(); };
RF.ff = (k, v) => { if (S.form) S.form[k] = v; };
RF.fdate = (k, inp) => {
  if (S.form) S.form[k] = inp.value;
  const w = inp.closest('.rf-datewrap');
  if (w) {
    const disp = w.querySelector('.rf-datedisp');
    disp.textContent = inp.value ? fmtYmd(inp.value) : 'YYYY/MM/DD';
    disp.classList.toggle('ph', !inp.value);
    if (k === 'dueDate' && inp.value) w.classList.remove('err');
  }
};
RF.assQ = v => { S.assigneeQ = v; const l = document.getElementById('assList'); if (l) l.innerHTML = assListHtml(); const x = document.getElementById('assQx'); if (x) x.style.display = v ? 'flex' : 'none'; };
RF.assQClear = () => { RF.assQ(''); const i = document.getElementById('assQInput'); if (i) { i.value = ''; i.focus(); } };
RF.pickAss = em => { if (S.form) { S.form.assigneeEmail = em; S.errs.assignee = null; } renderOverlays(); };
RF.clearAss = () => { if (S.form) S.form.assigneeEmail = ''; S.assigneeQ = ''; renderOverlays(); };
RF.setPrio = p => { if (S.form) S.form.priority = p; renderOverlays(); };
RF.setPriv = v => { if (S.form) S.form.private = v || ''; renderOverlays(); };
RF.saveForm = () => {
  const f = S.form;
  if (!f || S.saving) return;
  const errs = {};
  if (!String(f.title).trim()) errs.title = 'กรุณาใส่ชื่องาน';
  if (!f.assigneeEmail) errs.assignee = 'กรุณาเลือกผู้รับผิดชอบ';
  if (!f.dueDate) errs.dueDate = 'กรุณากำหนดวันส่ง';
  S.errs = errs;
  if (Object.keys(errs).length) { renderOverlays(); return; }
  const au = userByEmail(f.assigneeEmail);
  const fields = {
    title: String(f.title).trim(), detail: String(f.detail).trim(),
    assigneeEmail: f.assigneeEmail, assigneeName: au ? au.name : '',
    priority: f.priority, startDate: f.startDate || '', dueDate: f.dueDate, note: String(f.note).trim(),
    private: f.private || ''
  };
  const id = f.id;
  // ปิดฟอร์มทันที (optimistic) — ไม่ค้าง "กำลังบันทึก", ยิง API เบื้องหลัง
  S.formOpen = false; S.form = null; S.saving = false;
  dropHistory();
  if (id) {
    const t = S.tasks.find(x => x.id === id);
    const backup = t ? Object.assign({}, t) : null;
    if (t) Object.assign(t, fields, { updatedAt: new Date().toISOString() });
    render(); renderOverlays();
    toast('บันทึกการแก้ไขแล้ว');
    api('update', { id: id, patch: fields }).then(() => { calSyncOne(id); loadAll(true); }).catch(e => {
      if (t && backup) { Object.keys(t).forEach(k => { if (!(k in backup)) delete t[k]; }); Object.assign(t, backup); }
      render(); renderOverlays();
      toast('บันทึกไม่สำเร็จ: ' + e.message);
    });
  } else {
    const temp = Object.assign({ id: 'tmp-' + Date.now(), status: 'todo', reporterEmail: S.me.email, reporterName: S.me.name, createdBy: S.me.email, createdAt: new Date().toISOString(), updatedAt: new Date().toISOString() }, fields);
    S.tasks.push(temp);
    render(); renderOverlays();
    toast('สร้างงานแล้ว');
    api('create', { task: Object.assign({ status: 'todo' }, fields) }).then(j => {
      if (S.detailId === temp.id) S.detailId = j.task.id;   // เปิดดูงานที่เพิ่งสร้างอยู่ → id เปลี่ยน ต้องตามไปด้วย ไม่งั้นหน้ารายละเอียดหายเฉยๆ
      temp.id = j.task.id; invalidateDec(); render(); renderOverlays(); calSyncOne(temp.id); loadAll(true);
    }).catch(e => {
      S.tasks = S.tasks.filter(x => x !== temp);
      if (S.detailId === temp.id) { S.detailId = null; S.closing = false; }
      invalidateDec(); render(); renderOverlays();
      toast('สร้างงานไม่สำเร็จ: ' + e.message + ' — ลองใหม่อีกครั้ง');
    });
  }
};

/* ── boot ── */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (S.asgPick) RF.clAsgClose();          // ปิดตัวที่ซ้อนบนสุดก่อนเสมอ
    else if (S.recurForm) RF.recurClose();
    else if (S.formOpen) RF.closeForm();
    else if (S.detailId) RF.closeDetail();
    else if (S.listPop) RF.closePop();
    else if (S.menuOpen) RF.closeMenu();
    else if (S.q) RF.qClear();
  }
});
mq.addEventListener('change', () => { render(); renderOverlays(); });

(function boot(){
  try { S.dark = localStorage.getItem('rf_theme') === 'dark'; } catch(e){}
  document.body.classList.toggle('dark', S.dark);
  const td = pd(todayIso());
  S.calSel = todayIso(); S.calY = td.getFullYear(); S.calM = td.getMonth(); S.calWeekStart = weekStartOf(todayIso());
  initGsi();
  setupDeepLink();   // จำ ?task= จากลิงก์นอติ + ฟัง message จาก service worker
  if (SESSION.email) {
    if (loadCache()) { S.loading = false; showApp(); render(); loadAll(true); }   // มี cache → โชว์ทันที + sync เงียบ
    else loadAll(false);
    initSession();
  }
  else showLogin();
})();
</script>
