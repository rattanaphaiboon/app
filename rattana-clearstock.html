<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Rattana ClearStock v1.0</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{
  --navy:#0d1b3e;--navy-mid:#1a2f5e;--navy-light:#243b73;--gold:#c9a84c;--gold-light:#e8c86a;
  --success:#2ecc71;--danger:#e74c3c;--warning:#f39c12;--info:#3498db;
  --bg:#f4f6fb;--text:#0d1b3e;--card-bg:#ffffff;--border:#dde3f0;--muted:#6b7896;--row-alt:#fafbfd;
  --radius-sm:6px;--radius-md:12px;--radius-lg:16px;
  --shadow-md:0 2px 8px rgba(0,0,0,.08);--shadow-lg:0 8px 24px rgba(13,27,62,.12);--shadow-gold:0 4px 12px rgba(201,168,76,.35);
  /* scanner tokens */
  --navy3:#0a1f47;--gold2:#e8c86a;--gold3:#a07830;--red:#e74c3c;--green:#1e9e5a;--rsm:10px;--radius:16px;
  /* tinted surfaces */
  --w4-tint:linear-gradient(135deg,rgba(52,152,219,.10),rgba(52,152,219,.02));--w4-border:rgba(52,152,219,.35);
  --c4-tint:linear-gradient(135deg,rgba(201,168,76,.14),rgba(201,168,76,.03));--c4-border:rgba(201,168,76,.45);
  --sugg-bg:linear-gradient(135deg,rgba(46,204,113,.10),rgba(46,204,113,.02));--sugg-border:rgba(46,204,113,.4);
  --warn-bg:#fff8e6;
}
body.dark{
  --bg:#05080f;--text:#ffffff;--card-bg:#0d1b3e;--border:#1f3563;--muted:#b8c2dc;--row-alt:#0a1226;
  --w4-tint:transparent;--w4-border:rgba(52,152,219,.6);
  --c4-tint:transparent;--c4-border:rgba(201,168,76,.6);
  --sugg-bg:transparent;--sugg-border:rgba(46,204,113,.6);
  --warn-bg:transparent;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Sarabun',sans-serif;font-size:14px;line-height:1.5;min-height:100dvh;overflow-x:hidden;background:var(--bg);color:var(--text);transition:background .25s,color .25s}
button{font-family:inherit;cursor:pointer;border:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
input,select,textarea{font-family:inherit;font-size:16px}

/* header */
.topwrap{position:sticky;top:0;z-index:100}
header{background:var(--navy);color:#fff;padding:10px 12px;display:flex;align-items:center;gap:8px;padding-top:max(10px,env(safe-area-inset-top))}
.logo-text{font-weight:700;letter-spacing:1px;font-size:16px;color:#fff;white-space:nowrap}
.logo-text span{color:var(--gold)}
.logo-text small{font-size:10px;color:rgba(255,255,255,.55);font-weight:500;letter-spacing:0;margin-left:2px}
.icon-btn{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.2);width:38px;height:38px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.icon-btn:hover{background:rgba(255,255,255,.12)}
.hub-btn{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:var(--radius-sm);padding:5px 10px;font-size:13px;font-weight:600;text-decoration:none;white-space:nowrap;min-height:38px;flex-shrink:0}
.hub-btn:hover{background:rgba(255,255,255,.18)}
.hub-btn-icon{width:22px;height:22px;border-radius:5px;flex-shrink:0;background:var(--gold);display:inline-flex;align-items:center;justify-content:center;color:var(--navy);font-weight:800;font-size:13px}
@media(max-width:400px){
  header{gap:6px;padding-left:10px;padding-right:10px}
  .hub-btn-text,.logo-text small{display:none}
  .hub-btn{padding:5px 7px}
  .logo-text{font-size:13px;letter-spacing:.5px;overflow:hidden;text-overflow:ellipsis}
  .icon-btn{width:34px;height:36px;font-size:15px}
}

/* tabs */
.tab-nav{display:flex;background:var(--navy);border-bottom:3px solid var(--gold);padding:0 8px;gap:4px;overflow-x:auto;scrollbar-width:none}
.tab-nav::-webkit-scrollbar{display:none}
.tab-btn{background:transparent;color:rgba(255,255,255,.65);padding:11px 14px;font-size:13px;font-weight:600;border-bottom:3px solid transparent;white-space:nowrap;flex-shrink:0;margin-bottom:-3px;border-radius:var(--radius-sm) var(--radius-sm) 0 0;display:flex;align-items:center;gap:6px}
.tab-btn:hover{color:#fff;background:rgba(255,255,255,.06)}
.tab-btn.active{color:var(--navy);background:var(--gold);font-weight:700}
.tab-count{background:var(--danger);color:#fff;border-radius:10px;font-size:11px;padding:0 6px;min-width:18px;text-align:center;line-height:18px}
.tab-count:empty{display:none}

.content{padding:12px;max-width:900px;margin:0 auto;width:100%}
@media(min-width:640px){.content{padding:16px}}
.tab-pane{display:none;animation:fadeIn .2s ease}
.tab-pane.active{display:block}

/* cards / buttons / badges */
.card{background:var(--card-bg);border-radius:var(--radius-md);border:1px solid var(--border);box-shadow:var(--shadow-md);margin-bottom:12px}
.card-gold{border-top:3px solid var(--gold)}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px;border-bottom:1px solid var(--border)}
.card-head h3{font-size:15px;font-weight:700}
.card-body{padding:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border-radius:var(--radius-sm);font-size:14px;font-weight:600;border:1px solid transparent;min-height:44px;transition:opacity .15s,transform .1s}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--navy);color:#fff;border-color:var(--navy)}
body.dark .btn-primary{background:var(--navy-light);border-color:var(--navy-light)}
.btn-gold{background:var(--gold);color:var(--navy)}
.btn-outline{background:transparent;color:var(--text);border-color:var(--border)}
.btn-danger{background:var(--danger);color:#fff}
.btn-success{background:#1e9e5a;color:#fff}
.btn-sm{padding:5px 10px;font-size:12px;min-height:32px}
.btn-block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;white-space:nowrap}
.b-ack{background:#fef3d7;color:#a87800}.b-appr{background:#e3f0fd;color:#1a6fb8}.b-post{background:#efe6fb;color:#6b3fa0}
.b-postd{background:#e0f4f4;color:#127272}.b-closed{background:#e8f7ee;color:#1e8449}.b-rej{background:#ffd5d0;color:#c0392b}.b-can{background:#eceff4;color:#6b7896}
.b-tr{background:rgba(52,152,219,.14);color:#1a6fb8}.b-aj{background:rgba(201,168,76,.2);color:#8a6a10}
body.dark .b-ack{background:#3a2e15;color:#e8c86a}body.dark .b-appr{background:#13304d;color:#8cc4f5}body.dark .b-post{background:#2c1d42;color:#c9a6f2}
body.dark .b-postd{background:#103333;color:#7fdcdc}body.dark .b-closed{background:#1a3a25;color:#7be0a3}body.dark .b-rej{background:#3a1a17;color:#ff8a7e}body.dark .b-can{background:#1c2540;color:#b8c2dc}
body.dark .b-tr{color:#8cc4f5}body.dark .b-aj{color:#e8c86a}
.txt-muted{color:var(--muted)}.txt-sm{font-size:12px}.txt-danger{color:var(--danger)}.txt-ok{color:#1e9e5a}.bold{font-weight:700}
body.dark .txt-ok{color:#7be0a3}
.hidden{display:none!important}
.num{font-variant-numeric:tabular-nums}

/* search box (barcode skill) */
.search-box{background:var(--card-bg);border-radius:16px;padding:12px;margin-bottom:10px;box-shadow:0 4px 16px rgba(13,43,94,.06);border:1px solid var(--border)}
.search-row{display:flex;gap:8px}
.search-input-wrap{position:relative;flex:1}
.search-input{width:100%;height:48px;border:1.5px solid var(--border);border-radius:12px;padding:0 40px 0 14px;font-size:16px;color:var(--text);background:var(--card-bg);outline:none;transition:all .2s}
.search-input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,168,76,.18)}
.clear-btn{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;width:30px;height:30px;border-radius:50%;display:none;align-items:center;justify-content:center}
.clear-btn.visible{display:flex}
.clear-btn svg{width:16px;height:16px;fill:var(--muted)}
.scan-btn{background:linear-gradient(135deg,#1a3a6b,#0d2b5e);border-radius:12px;height:48px;padding:0 14px;display:flex;align-items:center;gap:7px;color:#f0c862;font-size:14px;font-weight:700;flex-shrink:0;box-shadow:0 4px 12px rgba(13,43,94,.2)}
.scan-btn svg{width:18px;height:18px;fill:#f0c862}
.scan-btn:active{transform:scale(.96)}
.sbar{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);padding:2px 4px 10px}
.sdot{width:9px;height:9px;border-radius:50%;background:var(--muted);flex-shrink:0}
.sdot.loading{background:var(--gold2);animation:pulse 1.2s ease-in-out infinite}
.sdot.ok{background:var(--green)}.sdot.err{background:var(--red)}

/* result list */
.res-item{display:flex;gap:10px;align-items:center;padding:11px 12px;border-bottom:1px solid var(--border);cursor:pointer}
.res-item:last-child{border-bottom:none}
.res-item:hover{background:rgba(201,168,76,.07)}
.res-name{font-weight:600;font-size:14px;line-height:1.3}
.res-meta{font-size:12px;color:var(--muted)}
.res-stock{margin-left:auto;text-align:right;font-size:12px;white-space:nowrap}

/* detail compare */
.p-title{font-size:17px;font-weight:700;line-height:1.35}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-size:12px;border:1px solid var(--border);border-radius:8px;padding:3px 8px;color:var(--muted)}
.chip b{color:var(--text);font-family:'Courier New',monospace}
.chip.hit{border-color:var(--gold);background:rgba(201,168,76,.12)}
.cmp-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.wh-box{border-radius:var(--radius-md);padding:12px;border:1.5px solid}
.wh-w4{background:var(--w4-tint);border-color:var(--w4-border)}
.wh-c4{background:var(--c4-tint);border-color:var(--c4-border)}
.wh-name{font-size:12px;font-weight:700;letter-spacing:.3px;color:var(--muted);text-transform:uppercase}
.wh-name b{font-size:16px;color:var(--text);margin-right:4px}
.wh-qty{font-size:20px;font-weight:700;line-height:1.25;margin-top:4px}
.wh-qty.neg{color:var(--danger)}
.wh-sub{font-size:12px;color:var(--muted)}
.cnt-label{font-size:11px;font-weight:600;color:var(--muted);margin-top:10px;margin-bottom:4px}
.qty-pair{display:flex;gap:6px}
.qty-pair label{flex:1;position:relative}
.qty-pair input{width:100%;height:44px;border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:0 40px 0 10px;background:var(--card-bg);color:var(--text);outline:none;font-variant-numeric:tabular-nums}
.qty-pair input:focus{border-color:var(--gold)}
.qty-pair span{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--muted);pointer-events:none}
.diff{margin-top:8px;font-size:13px;font-weight:600;min-height:20px}
.total-row{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:10px;padding:10px 12px;border-radius:var(--radius-sm);border:1px dashed var(--border);font-size:13px}
.sugg{margin-top:12px;border:1.5px solid var(--sugg-border);background:var(--sugg-bg);border-radius:var(--radius-md);padding:12px}
.sugg h4{font-size:14px;margin-bottom:6px}
.sugg ul{list-style:none;display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.sugg li{font-size:14px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg button{min-height:44px;border:1.5px solid var(--border);background:var(--card-bg);color:var(--text);border-radius:var(--radius-sm);font-size:13px;font-weight:600;padding:6px}
.seg button.on{border-color:var(--gold);background:var(--gold);color:var(--navy)}
.sign-row{display:flex;gap:6px;margin-top:8px}
.sign-row button{flex:1;min-height:40px;border:1.5px solid var(--border);background:var(--card-bg);color:var(--text);border-radius:var(--radius-sm);font-weight:700}
.sign-row button.on.plus{background:#1e9e5a;color:#fff;border-color:#1e9e5a}
.sign-row button.on.minus{background:var(--danger);color:#fff;border-color:var(--danger)}
.input{height:44px;padding:0 12px;border-radius:var(--radius-sm);border:1.5px solid var(--border);background:var(--card-bg);color:var(--text);outline:none;width:100%}
.input:focus{border-color:var(--gold)}
textarea.input{height:auto;padding:10px 12px;resize:vertical}
.field-label{font-size:12px;font-weight:600;color:var(--muted);margin:12px 0 4px;display:block}

/* cart & docs */
.grp-head{display:flex;align-items:center;gap:8px;justify-content:space-between}
.line{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--border)}
.line:last-child{border-bottom:none}
.line-main{flex:1;min-width:0}
.line-name{font-weight:600;line-height:1.3}
.line-qty{font-weight:700;white-space:nowrap}
.empty{text-align:center;color:var(--muted);padding:40px 16px}
.empty .big{font-size:40px;margin-bottom:6px}
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
@media(min-width:640px){.stat-grid{grid-template-columns:repeat(4,1fr)}}
.stat-card{background:var(--card-bg);border-radius:var(--radius-md);padding:12px;border:1px solid var(--border);border-top:3px solid var(--gold);cursor:pointer;text-align:left;color:var(--text)}
.stat-card.on{outline:2px solid var(--gold)}
.stat-card .s-label{font-size:11px;color:var(--muted);font-weight:600}
.stat-card .s-value{font-size:24px;font-weight:700;line-height:1.2}
.filters{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:8px;margin-bottom:4px}
.filters::-webkit-scrollbar{display:none}
.fchip{border:1.5px solid var(--border);background:var(--card-bg);color:var(--text);border-radius:20px;padding:6px 12px;font-size:13px;font-weight:600;white-space:nowrap;min-height:36px}
.fchip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
body.dark .fchip.on{background:var(--gold);color:var(--navy);border-color:var(--gold)}
.doc-card{padding:12px 14px;cursor:pointer}
.doc-card:hover{background:rgba(201,168,76,.05)}
.doc-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.doc-id{font-family:'Courier New',monospace;font-weight:700;font-size:14px}
.doc-items{font-size:13px;margin-top:6px;line-height:1.4}
.doc-meta{font-size:12px;color:var(--muted);margin-top:4px}
.mine{border-left:4px solid var(--danger)}

/* stepper */
.steps{display:flex;flex-direction:column;gap:0;margin:4px 0 8px}
.step{display:flex;gap:10px;position:relative;padding-bottom:12px}
.step:not(:last-child)::before{content:'';position:absolute;left:11px;top:24px;bottom:0;width:2px;background:var(--border)}
.step-dot{width:24px;height:24px;border-radius:50%;border:2px solid var(--border);background:var(--card-bg);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;z-index:1;color:var(--muted)}
.step.done .step-dot{background:#1e9e5a;border-color:#1e9e5a;color:#fff}
.step.cur .step-dot{border-color:var(--gold);color:var(--gold);box-shadow:0 0 0 3px rgba(201,168,76,.25)}
.step.bad .step-dot{background:var(--danger);border-color:var(--danger);color:#fff}
.step-t{font-weight:600;font-size:14px}
.step-s{font-size:12px;color:var(--muted)}
.lv{display:grid;grid-template-columns:auto 1fr 1fr 1fr;gap:2px 10px;font-size:12px;margin-top:6px;align-items:center}
.lv .h{color:var(--muted);font-weight:600}
.verify-ok{color:#1e9e5a;font-weight:600}.verify-bad{color:#c87f0a;font-weight:600}
body.dark .verify-ok{color:#7be0a3}body.dark .verify-bad{color:#e8c86a}
.notice{background:var(--warn-bg);border:1.5px solid rgba(243,156,18,.45);border-radius:var(--radius-md);padding:12px;font-size:13px;margin-bottom:12px}

/* modal / toast / spinner */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(13,27,62,.65);z-index:9000;align-items:flex-start;justify-content:center;padding:16px;backdrop-filter:blur(4px);overflow-y:auto}
.modal-overlay.open{display:flex}
.modal{background:var(--card-bg);border-radius:var(--radius-lg);max-width:560px;width:100%;border-top:4px solid var(--gold);animation:slideUp .22s ease;margin:auto 0}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border);gap:8px}
.modal-head h3{font-size:16px;font-weight:700}
.modal-close{background:transparent;font-size:26px;color:var(--muted);padding:2px 8px;line-height:1}
.modal-body{padding:16px}
.toast{position:fixed;bottom:max(24px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);padding:12px 20px;border-radius:var(--radius-md);color:#fff;z-index:99999;animation:fadeIn .25s ease;font-weight:500;box-shadow:var(--shadow-lg);max-width:92vw;font-size:14px}
.toast-success{background:#1e9e5a}.toast-error{background:var(--danger)}.toast-warning{background:var(--warning);color:var(--navy)}.toast-info{background:var(--navy-mid);border-left:3px solid var(--gold)}
#spinner{display:none;position:fixed;inset:0;background:rgba(13,27,62,.6);align-items:center;justify-content:center;z-index:99990;backdrop-filter:blur(3px)}
.spinner-box{background:var(--card-bg);border-radius:16px;padding:28px 36px;text-align:center;border-top:4px solid var(--gold);min-width:240px}
.spinner-ring{width:48px;height:48px;border:5px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px}
#backToTop{position:fixed;bottom:max(24px,calc(16px + env(safe-area-inset-bottom)));right:16px;background:var(--gold);color:var(--navy);border-radius:50%;width:46px;height:46px;display:none;align-items:center;justify-content:center;box-shadow:var(--shadow-gold);z-index:90;font-size:18px;font-weight:700}
#backToTop.show{display:flex}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.85)}}

/* login */
#loginScreen{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:16px;background:linear-gradient(160deg,var(--navy) 0%,#05080f 100%)}
.login-card{background:var(--card-bg);border-radius:var(--radius-lg);padding:28px 22px;max-width:380px;width:100%;text-align:center;border-top:4px solid var(--gold)}
.login-card h1{font-size:22px;letter-spacing:1px}
.login-card h1 span{color:var(--gold)}
#loginError{color:var(--danger);font-size:13px;margin-top:12px;min-height:18px}
.gsi-wrap{display:flex;justify-content:center;margin-top:20px;min-height:44px}

/* scanner screen (barcode skill) */
#s-scanner{display:none;position:fixed;inset:0;z-index:5000;background:var(--bg);overflow-y:auto}
#s-scanner.open{display:block}
.topbar{background:var(--navy);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top));border-bottom:3px solid var(--gold)}
.topbar-back{background:transparent;width:40px;height:40px;border-radius:8px;display:flex;align-items:center;justify-content:center}
.topbar-back svg{width:22px;height:22px;fill:#fff}
.topbar-title{font-weight:700;font-size:16px}
.topbar-sub{font-size:11px;color:rgba(255,255,255,.6)}
.scanner-wrap{background:var(--navy3);border-radius:var(--radius) var(--radius) 0 0;overflow:hidden;position:relative}
#html5-qr-reader{width:100%;border:none!important}
#html5-qr-reader video{width:100%!important;object-fit:cover;display:block}
#html5-qr-reader img,#html5-qr-reader__dashboard,#html5-qr-reader__header_message{display:none!important}
.scanner-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:10}
.scanner-frame{width:300px;height:170px;max-width:84%;border-radius:14px;position:relative;box-shadow:0 0 0 9999px rgba(0,0,0,.35)}
.scanner-line{position:absolute;left:10px;right:10px;height:2px;background:var(--gold2);opacity:.85;animation:scanline 1.8s ease-in-out infinite}
@keyframes scanline{0%{top:6px;opacity:1}50%{top:160px;opacity:.6}100%{top:6px;opacity:1}}
.scan-corner{position:absolute;width:20px;height:20px;border-color:var(--gold2);border-style:solid;border-width:0}
.sc-tl{top:-2px;left:-2px;border-top-width:3px;border-left-width:3px;border-top-left-radius:5px}
.sc-tr{top:-2px;right:-2px;border-top-width:3px;border-right-width:3px;border-top-right-radius:5px}
.sc-bl{bottom:-2px;left:-2px;border-bottom-width:3px;border-left-width:3px;border-bottom-left-radius:5px}
.sc-br{bottom:-2px;right:-2px;border-bottom-width:3px;border-right-width:3px;border-bottom-right-radius:5px}
.scanner-hint{background:var(--card-bg);border:1px solid var(--border);border-top:none;border-radius:0 0 var(--radius) var(--radius);padding:10px;text-align:center;font-size:13px;color:var(--muted);margin-bottom:12px}
.scanner-controls{display:flex;gap:8px;margin-bottom:10px}
.stop-btn{background:var(--red);color:#fff;border-radius:var(--rsm);padding:13px;font-size:14px;font-weight:600;flex:1}
.torch-btn{background:var(--navy-mid);color:var(--gold2);border:2px solid rgba(240,192,64,.3);border-radius:var(--rsm);padding:13px 16px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;flex-shrink:0}
.torch-btn svg{width:18px;height:18px;fill:var(--gold2)}
.torch-btn.on{background:var(--gold3);border-color:var(--gold2)}
.scan-status{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--rsm);padding:10px 14px;margin-bottom:12px;font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px;min-height:42px}
.manual-row{display:flex;gap:8px;margin-bottom:12px}
.manual-input{flex:1;border:1.5px solid var(--border);border-radius:var(--rsm);padding:11px 13px;font-size:16px;outline:none;background:var(--card-bg);color:var(--text)}
.manual-btn{background:var(--navy);color:var(--gold2);border-radius:var(--rsm);padding:11px 18px;font-size:14px;font-weight:600}

<script>
/* ════════════════════════════════════════════════════════════════
   Rattana ClearStock v1.0 — ยิงบาร์เทียบสต็อก W4 / C4
   ════════════════════════════════════════════════════════════════ */
const APP_VERSION = '1.0';
// ↓↓↓ วาง Web App URL ของ Apps Script (Deploy → Web app) ตรงนี้ ↓↓↓
const GAS_URL = '';
const DEMO = new URLSearchParams(location.search).has('demo');

const WH = { W4: 'W4 นครปฐม', C4: 'C4 รัตนมาร์ท' };
const KINDS = {
  TR_W4_C4: { type: 'TRANSFER', label: 'โอนย้าย W4 → C4', short: 'โอน W4→C4', from: 'W4', to: 'C4' },
  TR_C4_W4: { type: 'TRANSFER', label: 'โอนย้าย C4 → W4', short: 'โอน C4→W4', from: 'C4', to: 'W4' },
  AJ_W4:    { type: 'ADJUST',   label: 'ขอปรับสต็อก W4',  short: 'ปรับ W4', wh: 'W4' },
  AJ_C4:    { type: 'ADJUST',   label: 'ขอปรับสต็อก C4',  short: 'ปรับ C4', wh: 'C4' },
};
const STATUS = {
  PENDING_ACK:      { th: 'รอคลังรับทราบ', cls: 'b-ack' },
  PENDING_APPROVAL: { th: 'รออนุมัติ', cls: 'b-appr' },
  APPROVED:         { th: 'อนุมัติแล้ว · รอทำในระบบ', cls: 'b-post' },
  POSTED:           { th: 'ทำในระบบแล้ว · รอยืนยัน PDDT', cls: 'b-postd' },
  CLOSED:           { th: 'ยืนยันใน PDDT แล้ว', cls: 'b-closed' },
  REJECTED:         { th: 'ไม่อนุมัติ', cls: 'b-rej' },
  CANCELLED:        { th: 'ยกเลิก', cls: 'b-can' },
};
const BC_COLS = ['EA', 'PA', 'BP', 'CS'];

let currentUser = null, PERMS = {};
let PRODUCTS = [], BC_INDEX = new Map(), SYNC_AT = '', LOADED_AT = '';
let DOCS = [], CART = [];
let currentProduct = null, scannedUnit = '';
let docFilter = 'mine', negFilter = 'any';
let detailKind = 'TR_W4_C4', adjSign = -1;

/* ───────── helpers ───────── */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const normalizeEmail = s => String(s || '').replace(/[​‌‍﻿]/g, '').replace(/\s+/g, '').toLowerCase();
const sleep = ms => new Promise(r => setTimeout(r, ms));
const fmtN = n => Number(n || 0).toLocaleString('th-TH');

function formatThaiDate(input) {
  if (!input) return '-';
  const d = input instanceof Date ? input : new Date(input);
  if (isNaN(d)) return String(input);
  return `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}/${d.getFullYear() + 543}`;
}
function formatThaiTime(input) {
  const d = input instanceof Date ? input : new Date(input);
  if (isNaN(d)) return '';
  return `${String(d.getHours()).padStart(2, '0')}.${String(d.getMinutes()).padStart(2, '0')}`;
}
const formatThaiDateTime = v => (v ? `${formatThaiDate(v)} ${formatThaiTime(v)}` : '-');

const showSpinner = (m = 'กำลังโหลด...') => { $('spinnerMsg').textContent = m; $('spinner').style.display = 'flex'; };
const hideSpinner = () => { $('spinner').style.display = 'none'; };
function showToast(msg, type = 'info') {
  const t = document.createElement('div');
  t.className = `toast toast-${type}`; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 3500);
}
function setStat(text, kind = '') { $('stat-text').textContent = text; $('stat-dot').className = 'sdot ' + kind; }

/* ───────── theme ───────── */
const THEME_KEY = 'rattana_theme';
function applyTheme(t) {
  document.body.classList.toggle('dark', t === 'dark');
  const b = $('themeBtn'); if (b) b.textContent = t === 'dark' ? '☀️' : '🌙';
}
function toggleTheme() {
  const next = document.body.classList.contains('dark') ? 'light' : 'dark';
  try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
  applyTheme(next);
}
try { applyTheme(localStorage.getItem(THEME_KEY) || 'light'); } catch (e) { applyTheme('light'); }

/* ───────── units & CS.EA ───────── */
const unitName = u => String(u || '').split('x')[0].replace(/\(.*\)/, '').trim();

/** Bplus "3.14" = 3 ลัง 14 ชิ้น → รวมเป็นชิ้น ; ว่าง → null */
function csEaToEa(s, qcs) {
  s = String(s ?? '').trim();
  if (!s) return null;
  const neg = s.startsWith('-'); if (neg) s = s.slice(1);
  const [a, b = ''] = s.split('.');
  const q = qcs > 0 ? qcs : 1;
  const tot = (parseInt(a || '0', 10) || 0) * q + (parseInt(b || '0', 10) || 0);
  return neg ? -tot : tot;
}
function eaToCsEa(ea, qcs) {
  if (ea === null || ea === undefined || ea === '') return '';
  const q = qcs > 0 ? qcs : 1, a = Math.abs(ea);
  return (ea < 0 ? '-' : '') + Math.floor(a / q) + '.' + (a % q);
}
/** ชิ้นรวม → "3 ลัง 14 ชิ้น" */
function fmtQty(ea, p, signed = false) {
  if (ea === null || ea === undefined || ea === '') return '—';
  ea = Number(ea);
  const q = p?.qcs > 1 ? p.qcs : 1;
  const a = Math.abs(ea), cs = Math.floor(a / q), r = a % q, parts = [];
  if (q > 1 && cs) parts.push(`${fmtN(cs)} ${p.csName || 'ลัง'}`);
  if (r || !parts.length) parts.push(`${fmtN(q > 1 ? r : a)} ${p?.eaName || 'ชิ้น'}`);
  const sign = ea < 0 ? '−' : (signed && ea > 0 ? '+' : '');
  return sign + parts.join(' ');
}

/* ───────── API ───────── */
async function api(action, params = {}) {
  if (DEMO) return Mock.call(action, { ...params, email: currentUser?.email });
  if (!GAS_URL) throw new Error('ยังไม่ได้ตั้งค่า GAS_URL ในไฟล์');
  const res = await fetch(GAS_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action, email: currentUser?.email || params.email || '', ...params }),
  });
  const j = await res.json();
  if (!j.ok) throw new Error(j.error || 'เกิดข้อผิดพลาด');
  return j;
}

/* ───────── auth (SSO with Rattana Hub) ───────── */
function decodeJwtPayload(token) {
  const parts = String(token || '').split('.');
  if (parts.length < 2) throw new Error('JWT format invalid');
  let b64 = parts[1].replace(/-/g, '+').replace(/_/g, '/');
  const pad = (4 - b64.length % 4) % 4; if (pad) b64 += '='.repeat(pad);
  const bin = atob(b64), bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return JSON.parse(new TextDecoder('utf-8').decode(bytes));
}
function checkRattanaSession() {
  try {
    const p = JSON.parse(localStorage.getItem('rattana_session') || localStorage.getItem('rattanaUser') || 'null');
    if (!p?.data?.email || !p.exp || Date.now() > p.exp) return null;
    return p.data;
  } catch { return null; }
}
function saveSharedSession(data) {
  const payload = JSON.stringify({ data, exp: Date.now() + 30 * 24 * 60 * 60 * 1000 });
  try { localStorage.setItem('rattana_session', payload); localStorage.setItem('rattanaUser', payload); } catch (e) {}
}
function showLogin(msg = '') {
  $('appScreen').style.display = 'none';
  $('loginScreen').style.display = 'flex';
  $('loginError').textContent = msg;
  $('demoLink').classList.toggle('hidden', !!GAS_URL);
}
async function handleGoogleLogin(r) {
  showSpinner('กำลังตรวจสอบผู้ใช้...');
  try {
    const p = decodeJwtPayload(r.credential);
    await startSession({ email: normalizeEmail(p.email), picture: p.picture || '' }, true);
  } catch (e) { showLogin(e.message || 'เข้าสู่ระบบไม่สำเร็จ'); }
  finally { hideSpinner(); }
}
async function startSession(base, saveShared) {
  currentUser = { email: normalizeEmail(base.email) };
  const { user } = await api('me');
  PERMS = user.perms || {};
  currentUser = {
    email: user.email, name: user.name, role: user.role, dept: user.dept, warehouse: user.w,
    empId: String(user.empId || ''), stage: user.stage, picture: base.picture || '',
    nickname: base.nickname || '', company: base.company || '',
  };
  if (saveShared) {
    saveSharedSession({ email: currentUser.email, name: currentUser.name, nickname: '', role: currentUser.role,
      dept: currentUser.dept, company: '', warehouse: currentUser.warehouse, empId: currentUser.empId, picture: currentUser.picture });
  }
  $('loginScreen').style.display = 'none';
  $('appScreen').style.display = 'block';
  await initApp();
}
function logout() {
  ['rattana_session', 'rattanaUser'].forEach(k => { try { localStorage.removeItem(k); } catch (e) {} });
  location.href = location.pathname;
}

/* ───────── data loading ───────── */
function buildProducts(res) {
  const ci = n => res.cols.indexOf(n);
  const I = { name: ci('PRODUCT NAME'), short: ci('SHORT NAME'), w4: ci('STOCK W4'), c4: ci('STOCK C4') };
  BC_INDEX = new Map();
  PRODUCTS = res.rows.map((r, i) => {
    const codes = {}, units = {}, qty = {};
    BC_COLS.forEach(u => { codes[u] = r[ci('CODE ' + u)] || ''; units[u] = r[ci('UNIT ' + u)] || ''; qty[u] = parseInt(r[ci('QTY ' + u)], 10) || 0; });
    const qcs = qty.CS > 0 ? qty.CS : 1;
    const p = {
      i, name: r[I.name], short: r[I.short] || '', codes, units, qty, qcs,
      eaName: unitName(units.EA) || 'ชิ้น', csName: unitName(units.CS) || 'ลัง',
      w4Raw: r[I.w4] || '', c4Raw: r[I.c4] || '',
    };
    p.w4 = csEaToEa(p.w4Raw, qcs); p.c4 = csEaToEa(p.c4Raw, qcs);
    p.key = (p.name + ' ' + p.short + ' ' + Object.values(codes).join(' ')).toLowerCase();
    BC_COLS.forEach(u => {
      const c = codes[u].trim(); if (!c) return;
      if (!BC_INDEX.has(c)) BC_INDEX.set(c, []);
      BC_INDEX.get(c).push({ p, unit: u });
    });
    return p;
  });
  SYNC_AT = res.syncAt || ''; LOADED_AT = res.loadedAt || new Date().toISOString();
}
async function loadProducts(fresh = false) {
  setStat('กำลังโหลดสินค้าจาก PDDT...', 'loading');
  const res = await api('products', { fresh });
  buildProducts(res);
  setStat(`พร้อม · สินค้า ${fmtN(PRODUCTS.length)} รายการ · PDDT sync ${SYNC_AT || '-'}`, 'ok');
}
async function loadDocs() {
  const res = await api('docs');
  DOCS = res.docs || [];
  renderDocs(); updateBadges();
}
async function refreshData() {
  const b = $('btnRefresh'); b.disabled = true;
  showSpinner('กำลังโหลดข้อมูลใหม่...');
  try {
    await Promise.all([loadProducts(true), loadDocs()]);
    if (currentProduct) showDetail(PRODUCTS[currentProduct.i] || currentProduct, scannedUnit);
    renderNeg();
    showToast('อัปเดตเรียบร้อย ✓', 'success');
  } catch (e) { showToast(e.message, 'error'); }
  finally { hideSpinner(); b.disabled = false; }
}
async function initApp() {
  $('demoBanner').classList.toggle('hidden', !DEMO);
  loadCart(); renderCart();
  showSpinner('กำลังโหลดสินค้า (~13,000 รายการ)...');
  try {
    await Promise.all([loadProducts(), loadDocs()]);
    renderNeg();
  } catch (e) { setStat(e.message, 'err'); showToast(e.message, 'error'); }
  finally { hideSpinner(); }
  $('search-input').focus();
  setInterval(() => { if (!document.hidden) loadDocs().catch(() => {}); }, 60000);
}

/* ───────── tabs ───────── */
function switchTab(name) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
  document.querySelectorAll('.tab-pane').forEach(p => p.classList.toggle('active', p.id === 'tab-' + name));
  window.scrollTo({ top: 0 });
  if (name === 'scan' && !currentProduct) setTimeout(() => $('search-input').focus(), 50);
}

/** แนะนำ: ส่วนที่ W4 กับ C4 ต่างกันสวนทาง = ของย้ายที่โดยไม่มีใบโอน ; ที่เหลือ = ขอปรับสต็อก */
function suggest(p, cnt) {
  const sys = { w4: p.w4 || 0, c4: p.c4 || 0 };
  const d = { w4: cnt.w4 === null ? null : cnt.w4 - sys.w4, c4: cnt.c4 === null ? null : cnt.c4 - sys.c4 };
  const out = [];

  if (d.w4 !== null && d.c4 !== null) {
    if (rW4 < 0 && rC4 > 0) { const t = Math.min(-rW4, rC4); out.push({ kind: 'TR_W4_C4', qty: t, why: 'ของอยู่ C4 จริงแต่ระบบยังอยู่ W4' }); rW4 += t; rC4 -= t; }
    else if (rW4 > 0 && rC4 < 0) { const t = Math.min(rW4, -rC4); out.push({ kind: 'TR_C4_W4', qty: t, why: 'ของอยู่ W4 จริงแต่ระบบยังอยู่ C4' }); rW4 -= t; rC4 += t; }
  }
  if (rW4) out.push({ kind: 'AJ_W4', qty: rW4, why: rW4 < 0 ? 'W4 ของขาดจากระบบ' : 'W4 ของเกินระบบ' });
  if (rC4) out.push({ kind: 'AJ_C4', qty: rC4, why: rC4 < 0 ? 'C4 ของขาดจากระบบ' : 'C4 ของเกินระบบ' });
  return { d, out };
}

  ['W4', 'C4'].forEach(w => {
    const v = d[w.toLowerCase()], el = $('diff' + w);
    el.innerHTML = v === null ? '' : v === 0 ? '<span class="txt-ok">✓ ตรงกับระบบ</span>'
      : `<span class="${v < 0 ? 'txt-danger' : 'txt-ok'}">${v < 0 ? 'ขาด' : 'เกิน'} ${esc(fmtQty(Math.abs(v), p))}</span>`;
  });

  const cntT = cnt.w4 !== null && cnt.c4 !== null ? cnt.w4 + cnt.c4 : null;

  lastSugg = out;
  $('suggArea').innerHTML = out.length ? `<div class="sugg"><h4>💡 คำแนะนำการแก้ไข</h4><ul>${out.map(s =>
      `<li><span class="badge ${KINDS[s.kind].type === 'TRANSFER' ? 'b-tr' : 'b-aj'}">${KINDS[s.kind].label}</span> <b class="num">${esc(fmtQty(s.qty, p, KINDS[s.kind].type === 'ADJUST'))}</b><br><span class="txt-muted txt-sm">${esc(s.why)}</span></li>`).join('')}</ul>

    : (cnt.w4 !== null || cnt.c4 !== null) && !d.w4 && !d.c4 ? '<div class="sugg"><h4>✅ สต็อกตรงกับระบบ ไม่ต้องแก้ไข</h4></div>' : '';
}

  if (d.status === 'PENDING_APPROVAL' && PERMS.approve && !isCreator(d)) a.push('approve');

let html5QrScanner = null, scannerActive = false, lastScanned = '', torchOn = false, torchTrack = null;
function beep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.value = 1000; gain.gain.value = 0.1; osc.start();
    setTimeout(() => { osc.stop(); ctx.close(); }, 80);
  } catch (e) {}
}
function vibrate(p) { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} }
function setScanStatus(text, kind) {
  $('scan-status-text').textContent = text;
  document.querySelector('#scan-status .sdot').className = 'sdot' + (kind ? ' ' + kind : '');
}
function show(id) { $('s-scanner').classList.toggle('open', id === 's-scanner'); }
async function startScan() {
  setScanStatus('กำลังเปิดกล้อง...', '');
  lastScanned = ''; scannerActive = true; torchOn = false; torchTrack = null;
  $('torch-btn').classList.remove('on');
  if (typeof Html5Qrcode === 'undefined') { setScanStatus('โหลดไลบรารีไม่ได้ — ใช้ช่องพิมพ์ด้านล่าง', 'err'); return; }
  try {
    await navigator.mediaDevices.getUserMedia({ video: true }).then(s => s.getTracks().forEach(t => t.stop())).catch(() => {});
    const devices = await Html5Qrcode.getCameras().catch(() => []);
    let camId = null;
    if (devices && devices.length) {
      const back = devices.find(d => /(back|rear|environment|0)/i.test(d.label));
      camId = (back || devices[devices.length - 1]).id;
    }
    if (html5QrScanner) { try { await html5QrScanner.stop(); } catch (e) {} html5QrScanner = null; }
    html5QrScanner = new Html5Qrcode('html5-qr-reader', { verbose: false, experimentalFeatures: { useBarCodeDetectorIfSupported: true } });
    const config = {
      fps: 25, qrbox: { width: 320, height: 180 }, aspectRatio: 1.7777,
      videoConstraints: {
        facingMode: { ideal: 'environment' }, width: { ideal: 1920, min: 1280 }, height: { ideal: 1080, min: 720 },
        focusMode: 'continuous', advanced: [{ focusMode: 'continuous' }, { zoom: 1.5 }],
      },
      formatsToSupport: [
        Html5QrcodeSupportedFormats.EAN_13, Html5QrcodeSupportedFormats.EAN_8, Html5QrcodeSupportedFormats.UPC_A,
        Html5QrcodeSupportedFormats.UPC_E, Html5QrcodeSupportedFormats.CODE_128, Html5QrcodeSupportedFormats.CODE_39,
        Html5QrcodeSupportedFormats.CODE_93, Html5QrcodeSupportedFormats.ITF, Html5QrcodeSupportedFormats.QR_CODE,
      ],
    };
    const cameraConfig = camId ? { deviceId: { exact: camId } } : { facingMode: { exact: 'environment' } };
    await html5QrScanner.start(cameraConfig, config, decoded => {
      if (!scannerActive || decoded === lastScanned) return;
      lastScanned = decoded; beep(); vibrate([60, 40, 60]); onScanFound(decoded);
    }, () => {});
    setTimeout(() => {
      try {
        const v = document.querySelector('#html5-qr-reader video');
        const track = v?.srcObject?.getVideoTracks?.()[0];
        if (!track) return;
        const caps = track.getCapabilities ? track.getCapabilities() : {};
        if (caps.torch) { torchTrack = track; $('torch-btn').style.display = 'flex'; } else $('torch-btn').style.display = 'none';
        const adv = [];
        if (caps.focusMode && caps.focusMode.includes('continuous')) adv.push({ focusMode: 'continuous' });
        if (caps.zoom && caps.zoom.max >= 1.5) adv.push({ zoom: Math.min(1.5, caps.zoom.max) });
        if (adv.length) track.applyConstraints({ advanced: adv }).catch(() => {});
      } catch (e) { $('torch-btn').style.display = 'none'; }
    }, 800);
    setScanStatus('กล้องพร้อม — วางบาร์โค้ดให้อยู่ในกรอบสีทอง', 'ok');
    $('scan-hint').textContent = 'บาร์โค้ดโค้ง/ขวด: ถอยห่าง 15-25 ซม. / ใช้ไฟถ้าแสงน้อย';
  } catch (e) {
    let msg = 'เปิดกล้องไม่ได้ — ลองพิมพ์บาร์โค้ดด้านล่าง';
    if (e.name === 'NotAllowedError' || String(e).includes('Permission')) msg = 'กรุณาอนุญาตกล้อง: Settings → Browser → Camera → Allow';
    else if (e.name === 'NotFoundError') msg = 'ไม่พบกล้อง — ใช้ช่องพิมพ์ด้านล่างแทน';
    setScanStatus(msg, 'err'); $('torch-btn').style.display = 'none';
  }
}
async function stopScan() {
  scannerActive = false;
  if (torchOn && torchTrack) { try { await torchTrack.applyConstraints({ advanced: [{ torch: false }] }); } catch (e) {} }
  torchOn = false; torchTrack = null;
  if (html5QrScanner) {
    try { await html5QrScanner.stop(); } catch (e) {}
    try { html5QrScanner.clear(); } catch (e) {}
    html5QrScanner = null;
  }
  $('manual-bc').value = '';
}

    $('results-area').innerHTML = `<div class="card"><div class="empty"><div class="big">❓</div>ไม่พบบาร์โค้ด <b>${esc(code)}</b> ในระบบ</div></div>`;
  }
}

  if (!torchTrack) return;

  catch (e) { this.style.display = 'none'; }
};

const manualGo = () => { const v = $('manual-bc').value.trim(); if (v) { stopScan(); onScanFound(v); } };

    { id: 'TR-691103-001', kind: 'TR_W4_C4', status: 'PENDING_APPROVAL', note: 'ของย้ายไปหน้าร้านโดยไม่ได้ทำใบโอน', createdAt: ago(3), createdBy: 'สมชาย คลังดี', createdEmail: 'somchai@x', ackAt: ago(2), ackBy: 'สมหญิง W4',
      lines: [{ no: 1, barcode: '8850987101021', name: 'มาม่า รสต้มยำกุ้ง 55ก.', unitCs: 'ลังx30(CS)', qtyCs: 30, qty: 24, w4Before: -12, c4Before: 78, w4Expect: -36, c4Expect: 102, reason: 'C4 นับได้ 102 ซอง' }] },
    { id: 'AJ-691102-001', kind: 'AJ_C4', status: 'POSTED', note: '', createdAt: ago(28), createdBy: 'สมชาย คลังดี', createdEmail: 'somchai@x', ackAt: ago(27), ackBy: 'มานี รัตนมาร์ท', approvedAt: ago(26), approvedBy: 'ผู้จัดการ W4', postedAt: ago(20), postedBy: 'สมหญิง W4', bplusDocNo: 'AJ6911-0007',
      lines: [{ no: 1, barcode: '8851952350017', name: 'น้ำดื่มคริสตัล 600มล.', unitCs: 'ลังx24(CS)', qtyCs: 24, qty: 48, w4Before: 960, c4Before: -96, w4Expect: 960, c4Expect: -48, reason: 'รับของไม่ได้คีย์' }] },
  ];
  docs.forEach(d => { d.lineCount = d.lines.length; d.lines.forEach(l => { l.docId = d.id; }); });
  let seq = 1;
  const need = (c, m) => { if (!c) throw new Error(m); };
  return {
    async call(action, p) {
      await sleep(250);
      const now = new Date().toISOString(), who = user.name;
      switch (action) {
        case 'me': return { ok: true, user: { ...user, perms } };
        case 'products': return { ok: true, cols, rows, syncAt: '3/11/2569 08:28:40', loadedAt: now };
        case 'docs': return { ok: true, docs: JSON.parse(JSON.stringify(docs)) };
        case 'create': {
          const ids = p.docs.map(d => {
            const id = (KINDS[d.kind].type === 'TRANSFER' ? 'TR' : 'AJ') + '-691103-' + String(100 + seq++);
            const lines = d.lines.map((l, i) => {
              const q = KINDS[d.kind].type === 'TRANSFER' ? Math.abs(l.qty) : l.qty;
              const dl = { TR_W4_C4: [-q, q], TR_C4_W4: [q, -q], AJ_W4: [q, 0], AJ_C4: [0, q] }[d.kind];
              return { ...l, docId: id, no: i + 1, qty: q, w4Expect: l.w4Before == null ? '' : l.w4Before + dl[0], c4Expect: l.c4Before == null ? '' : l.c4Before + dl[1] };
            });
            docs.unshift({ id, kind: d.kind, status: 'PENDING_ACK', note: d.note, createdAt: now, createdBy: who, createdEmail: user.email, lineCount: lines.length, lines });
            return id;
          });
          return { ok: true, ids };
        }
        default: {
          const d = docs.find(x => x.id === p.docId); need(d, 'ไม่พบเอกสาร');
          const mine = d.createdEmail === user.email;
          if (action === 'ack') { need(d.status === 'PENDING_ACK', 'สถานะไม่ถูกต้อง'); Object.assign(d, { status: 'PENDING_APPROVAL', ackAt: now, ackBy: who, ackNote: p.note }); }
          if (action === 'approve') { need(d.status === 'PENDING_APPROVAL', 'สถานะไม่ถูกต้อง'); need(!mine, 'ผู้สร้างเอกสารอนุมัติเอกสารของตัวเองไม่ได้'); Object.assign(d, { status: 'APPROVED', approvedAt: now, approvedBy: who, approveNote: p.note }); }
          if (action === 'reject') { need(p.note, 'กรุณาระบุเหตุผล'); Object.assign(d, { status: 'REJECTED', rejectedAt: now, rejectedBy: who, rejectReason: p.note }); }
          if (action === 'cancel') Object.assign(d, { status: 'CANCELLED', rejectedAt: now, rejectedBy: who, rejectReason: p.note || 'ยกเลิกโดยผู้สร้าง' });
          if (action === 'post') { need(p.bplusDocNo, 'กรุณาระบุเลขที่เอกสาร Bplus'); Object.assign(d, { status: 'POSTED', postedAt: now, postedBy: who, bplusDocNo: p.bplusDocNo }); }
          if (action === 'close') {
            Object.assign(d, { status: 'CLOSED', closedAt: now, closedBy: who, pddtSyncAt: '3/11/2569 08:28:40' });
            d.lines.forEach(l => {
              const pr = currentStockFor(l.barcode);
              l.w4After = pr?.w4 ?? ''; l.c4After = pr?.c4 ?? '';
              l.verify = Number(l.w4After) === Number(l.w4Expect) && Number(l.c4After) === Number(l.c4Expect) ? 'ตรงตามที่ควรเป็น' : 'ต่างจากที่ควรเป็น (อาจมีขาย/รับเข้าระหว่างทาง)';
            });
          }
          return { ok: true };
        }
      }
    },
  };
})();

/* ───────── boot ───────── */
window.addEventListener('load', async () => {
  if (DEMO) {
    showSpinner('เปิดโหมดสาธิต...');
    try { await startSession({ email: 'demo@rattanaphaiboon.com' }, false); } finally { hideSpinner(); }
    return;
  }
  const s = checkRattanaSession();
  if (!s) { showLogin(); return; }
  showSpinner('กำลังตรวจสอบผู้ใช้...');
  try { await startSession(s, false); }
  catch (e) { showLogin(e.message); }
  finally { hideSpinner(); }
});
</script>
