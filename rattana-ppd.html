<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Rattana PPD Audit · v1.0</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --navy:#0d1b3e;--navy-mid:#1a2f5e;--navy-light:#243b73;--gold:#c9a84c;--gold-light:#e8c86a;
  --success:#2ecc71;--danger:#e74c3c;--warning:#f39c12;--info:#3498db;
  --bg:#f4f6fb;--text:#0d1b3e;--card-bg:#fff;--border:#dde3f0;--muted:#6b7896;--row-alt:#fafbfd;
  --radius-sm:6px;--radius-md:12px;--radius-lg:16px;
  --shadow-sm:0 1px 4px rgba(0,0,0,.06);--shadow-md:0 2px 8px rgba(0,0,0,.08);--shadow-lg:0 8px 24px rgba(13,27,62,.12);--shadow-gold:0 4px 12px rgba(201,168,76,.35);
  --half-bg:linear-gradient(135deg,rgba(243,156,18,.10),rgba(243,156,18,.02));
}
body.dark{--bg:#05080f;--text:#fff;--card-bg:#0d1b3e;--border:#1f3563;--muted:#b8c2dc;--row-alt:#0a1226;--half-bg:transparent;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Sarabun',sans-serif;font-size:14px;line-height:1.5;min-height:100dvh;overflow-x:hidden;background:var(--bg);color:var(--text);transition:background .25s,color .25s}
button{font-family:inherit;cursor:pointer;border:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
input,select,textarea{font-family:inherit;font-size:16px}
/* header */
header{background:var(--navy);color:#fff;padding:10px 14px;position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:10px;border-bottom:3px solid var(--gold);padding-top:max(10px,env(safe-area-inset-top))}
.logo-text{font-weight:700;letter-spacing:1px;font-size:17px;color:#fff;white-space:nowrap}
.logo-text span{color:var(--gold)}
.spacer{flex:1}
.icon-btn{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.2);width:36px;height:36px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-size:17px;transition:background .15s;flex-shrink:0}
.icon-btn:hover{background:rgba(255,255,255,.12)}
.hub-btn{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:var(--radius-sm);padding:5px 9px;font-size:12px;font-weight:600;text-decoration:none;white-space:nowrap;min-height:36px}
.hub-btn:hover{background:rgba(255,255,255,.18)}
.user-chip{font-size:11px;color:rgba(255,255,255,.85);text-align:right;line-height:1.25;max-width:110px;overflow:hidden}
.user-chip b{color:var(--gold);font-weight:600}
/* tabs */
.tab-nav{display:flex;background:var(--navy);border-bottom:3px solid var(--gold);padding:0 6px;gap:3px;overflow-x:auto;scrollbar-width:none;position:sticky;top:56px;z-index:90}
.tab-nav::-webkit-scrollbar{display:none}
.tab-btn{background:transparent;color:rgba(255,255,255,.6);padding:11px 16px;font-size:13px;font-weight:600;border-bottom:3px solid transparent;white-space:nowrap;flex-shrink:0;transition:all .18s;margin-bottom:-3px;border-radius:var(--radius-sm) var(--radius-sm) 0 0}
.tab-btn.active{color:var(--navy);background:var(--gold);font-weight:700}
/* layout */
.content{padding:12px;max-width:1000px;margin:0 auto;width:100%}
.page{display:none}.page.active{display:block;animation:fadeIn .2s ease}
.card{background:var(--card-bg);border-radius:var(--radius-md);border:1px solid var(--border);box-shadow:var(--shadow-md);margin-bottom:12px}
.card-gold{border-top:3px solid var(--gold)}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px;border-bottom:1px solid var(--border);background:linear-gradient(to right,rgba(201,168,76,.07),transparent)}
.card-head h3{font-size:15px;font-weight:700}
.card-body{padding:14px}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;border:1px solid transparent;min-height:42px;transition:opacity .15s,transform .1s}
.btn:hover{opacity:.9}.btn:active{transform:scale(.97)}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-gold{background:var(--gold);color:var(--navy)}.btn-primary{background:var(--navy);color:#fff}
.btn-outline{background:transparent;color:var(--text);border-color:var(--border)}
.btn-success{background:var(--success);color:#fff}.btn-danger{background:var(--danger);color:#fff}
.btn-block{width:100%}.btn-sm{min-height:34px;padding:6px 12px;font-size:12px}
/* pills (คลัง/แผนก select) */
.pill-row{display:flex;flex-wrap:wrap;gap:8px}
.pill{padding:9px 15px;border-radius:20px;border:1.5px solid var(--border);background:var(--card-bg);color:var(--text);font-size:14px;font-weight:600;min-height:42px}
.pill.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.pill.on.gold{background:var(--gold);color:var(--navy);border-color:var(--gold)}
/* field */
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.3px;text-transform:uppercase}
.input{height:44px;padding:0 13px;border-radius:var(--radius-sm);border:1.5px solid var(--border);background:var(--card-bg);color:var(--text);font-size:16px;outline:none;width:100%}
.input:focus{border-color:var(--gold)}
textarea.input{height:auto;min-height:60px;padding:9px 13px;resize:vertical}
.input-sm{height:38px;font-size:14px;width:80px;text-align:center}
/* stat grid */
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
@media(min-width:640px){.stat-grid{grid-template-columns:repeat(4,1fr)}}
.stat-card{background:var(--card-bg);border-radius:var(--radius-md);padding:14px;border:1px solid var(--border);border-top:3px solid var(--gold)}
.stat-card .s-label{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;margin-bottom:5px}
.stat-card .s-value{font-size:24px;font-weight:700;line-height:1.1}
.stat-card .s-sub{font-size:11px;color:var(--muted);margin-top:3px}
/* audit item */
.dept-sec{margin-bottom:14px}
.dept-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 13px;background:var(--navy);color:#fff;border-radius:var(--radius-sm);cursor:pointer;position:sticky;top:99px;z-index:20}
.dept-head .d-name{font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px}
.dept-head .d-pct{font-size:13px;font-weight:700;color:var(--gold)}
.item{border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;margin-top:8px;background:var(--card-bg)}
.item.na{opacity:.55}
.item .i-main{font-size:11px;color:var(--muted);font-weight:600;margin-bottom:2px}
.item .i-sub{font-size:14px;font-weight:700;margin-bottom:4px}
.item .i-desc{font-size:12px;color:var(--muted);white-space:pre-line;margin-bottom:8px;max-height:60px;overflow:auto}
.score-row{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:8px}
.sbtn{padding:9px 4px;border-radius:var(--radius-sm);border:1.5px solid var(--border);background:var(--card-bg);color:var(--text);font-size:12px;font-weight:700;min-height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.sbtn .em{font-size:16px}
.sbtn.on-pass{background:var(--success);color:#fff;border-color:var(--success)}
.sbtn.on-half{background:var(--warning);color:var(--navy);border-color:var(--warning)}
.sbtn.on-fail{background:var(--danger);color:#fff;border-color:var(--danger)}
.sbtn.on-na{background:var(--navy-mid);color:#fff;border-color:var(--navy-mid)}
.item-extra{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.item-extra .field{margin-bottom:0}
.thumb{width:52px;height:52px;border-radius:var(--radius-sm);object-fit:cover;border:1px solid var(--border)}
.mini{font-size:11px;color:var(--muted)}
/* sticky score bar */
.scorebar{position:sticky;top:56px;z-index:85;background:var(--card-bg);border:1px solid var(--border);border-top:3px solid var(--gold);border-radius:0 0 var(--radius-md) var(--radius-md);padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:var(--shadow-md);margin-bottom:12px}
.scorebar .big{font-size:22px;font-weight:800}
.grade-chip{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:34px;padding:0 8px;border-radius:9px;font-weight:800;font-size:16px;color:#fff}
/* CAR */
.car-item{border:1px solid var(--border);border-left:4px solid var(--muted);border-radius:var(--radius-sm);padding:12px;margin-bottom:10px;background:var(--card-bg)}
.car-item.open{border-left-color:var(--danger)}
.car-item.aging{border-left-color:var(--warning)}
.car-item.done{border-left-color:var(--success);opacity:.75}
.badge{display:inline-block;padding:2px 9px;border-radius:10px;font-size:11px;font-weight:700}
.b-open{background:#ffd5d0;color:#c0392b}.b-done{background:#e8f7ee;color:#1e8449}.b-age{background:#fef3d7;color:#a87800}
body.dark .b-open{background:#3a1a17;color:#ff8a7e}body.dark .b-done{background:#1a3a25;color:#7be0a3}body.dark .b-age{background:#3a2e15;color:#e8c86a}
/* login */
#loginScreen{display:none;position:fixed;inset:0;background:linear-gradient(160deg,var(--navy),#05080f);align-items:center;justify-content:center;padding:20px;z-index:5000}
.login-box{background:var(--card-bg);border-radius:var(--radius-lg);padding:32px 26px;max-width:360px;width:100%;text-align:center;border-top:4px solid var(--gold)}
.login-box h1{font-size:20px;margin-bottom:4px}.login-box p{color:var(--muted);font-size:13px;margin-bottom:20px}
.login-logo{width:76px;height:76px;margin:0 auto 14px;border-radius:20px;background:var(--navy);color:var(--gold);display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;box-shadow:var(--shadow-gold)}
/* spinner/toast */
#spinner{display:none;position:fixed;inset:0;background:rgba(13,27,62,.55);align-items:center;justify-content:center;z-index:9999;backdrop-filter:blur(3px)}
#spinner.show{display:flex}
.spin-box{background:var(--card-bg);border-radius:var(--radius-lg);padding:28px 36px;text-align:center;border-top:4px solid var(--gold)}
.ring{width:46px;height:46px;border:5px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
.toast{position:fixed;bottom:max(20px,env(safe-area-inset-bottom));right:16px;padding:12px 18px;border-radius:var(--radius-md);color:#fff;z-index:9998;font-weight:600;font-size:13px;box-shadow:var(--shadow-lg);max-width:88vw;animation:slideIn .3s ease}
.toast-success{background:var(--success)}.toast-error{background:var(--danger)}.toast-warning{background:var(--warning);color:var(--navy)}.toast-info{background:var(--navy-mid);border-left:3px solid var(--gold)}
#backToTop{position:fixed;bottom:max(20px,calc(14px + env(safe-area-inset-bottom)));right:16px;background:var(--gold);color:var(--navy);border-radius:50%;width:46px;height:46px;display:none;align-items:center;justify-content:center;box-shadow:var(--shadow-gold);z-index:80;font-size:18px;font-weight:700}
#backToTop.show{display:flex}
.empty{text-align:center;padding:40px 16px;color:var(--muted);font-size:14px}
.info-note{font-size:12px;color:var(--muted);background:var(--half-bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:9px 12px;margin-bottom:12px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes slideIn{from{transform:translateX(120%);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.hidden{display:none!important}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-box">
    <div class="login-logo">R</div>
    <h1>Rattana PPD Audit</h1>
    <p>ระบบตรวจ Audit · Performance and Process Development</p>
    <div id="g_id_onload" data-client_id="615875645128-gasjjvkt6lu8g449cbnhl40k1pu25r0b.apps.googleusercontent.com" data-callback="handleGoogleLogin" data-auto_prompt="false"></div>
    <div class="g_id_signin" data-type="standard" data-size="large" data-theme="outline" data-text="sign_in_with" style="display:flex;justify-content:center"></div>
    <p id="loginErr" style="color:var(--danger);margin-top:14px;font-weight:600;display:none"></p>
  </div>
</div>

<!-- APP -->
<div id="appScreen" class="hidden">
  <header>
    <span class="logo-text">RATTANA <span>PPD</span></span>
    <span class="mini" style="color:rgba(255,255,255,.5)">v1.0</span>
    <span class="spacer"></span>
    <div class="user-chip" id="userChip"></div>
    <button class="icon-btn" id="btnRefresh" onclick="refreshAll()" title="รีเฟรช">↻</button>
    <button class="icon-btn" id="themeBtn" onclick="toggleTheme()" title="สลับธีม">🌙</button>
    <a href="https://rattanaphaiboon.github.io/app/rattana-hub.html" class="hub-btn" title="กลับ Hub">🏠 Hub</a>
  </header>

  <nav class="tab-nav">
    <button class="tab-btn active" data-tab="audit" onclick="switchTab('audit')">📝 ตรวจ</button>
    <button class="tab-btn" data-tab="dash" onclick="switchTab('dash')">📊 Dashboard</button>
    <button class="tab-btn" data-tab="car" onclick="switchTab('car')">🔧 CAR ติดตาม</button>
  </nav>

  <div class="content">
    <!-- ===== AUDIT ===== -->
    <section id="page-audit" class="page active">
      <div class="card card-gold">
        <div class="card-head"><h3>เริ่มรอบตรวจ</h3><span class="mini" id="draftHint"></span></div>
        <div class="card-body">
          <div class="field"><label>ศูนย์ / คลัง</label><div class="pill-row" id="whPills"></div></div>
          <div style="display:flex;gap:10px;flex-wrap:wrap">
            <div class="field" style="flex:1;min-width:120px"><label>ครั้งที่</label><input class="input" id="inpRound" type="number" min="1" inputmode="numeric"></div>
            <div class="field" style="flex:1;min-width:150px"><label>วันที่ตรวจ</label><input class="input" id="inpDate" type="date"></div>
          </div>
          <button class="btn btn-gold btn-block" id="btnStart" onclick="startAudit()">โหลดหัวข้อตรวจ →</button>
        </div>
      </div>

      <div id="auditWorkspace" class="hidden">
        <div class="scorebar">
          <div>
            <div class="mini">คะแนนรวม (สด)</div>
            <div><span class="big" id="liveScore">0.0</span><span style="font-size:14px">%</span></div>
          </div>
          <div style="text-align:center"><div class="mini">เกรด</div><span class="grade-chip" id="liveGrade" style="background:var(--muted)">–</span></div>
          <div style="text-align:right"><div class="mini">ตรวจแล้ว</div><div style="font-weight:700" id="liveProg">0 / 0</div></div>
        </div>
        <div class="info-note" id="auditCtx"></div>
        <div id="deptSections"></div>
        <button class="btn btn-primary btn-block" style="margin-top:6px" onclick="saveAudit()">💾 บันทึกผลตรวจ</button>
        <button class="btn btn-outline btn-block" style="margin-top:8px" onclick="clearDraft()">ล้างร่างรอบนี้</button>
        <div style="height:30px"></div>
      </div>
    </section>

    <!-- ===== DASHBOARD ===== -->
    <section id="page-dash" class="page">
      <div class="card card-gold">
        <div class="card-head"><h3>ตัวกรอง</h3></div>
        <div class="card-body">
          <div class="field"><label>ครั้งที่</label><div class="pill-row" id="dashRoundPills"></div></div>
          <div class="field" style="margin-bottom:0"><label>ปี</label><div class="pill-row" id="dashYearPills"></div></div>
        </div>
      </div>
      <div class="stat-grid" id="dashStats"></div>
      <div class="card"><div class="card-head"><h3>คะแนนรายศูนย์</h3></div><div class="card-body" id="dashCenters"></div></div>
      <div class="card"><div class="card-head"><h3>เทรนด์รายครั้ง</h3></div><div class="card-body"><canvas id="trendChart" height="160"></canvas></div></div>
      <div class="card"><div class="card-head"><h3>ข้อที่ตกบ่อยสุด</h3></div><div class="card-body" id="dashWorst"></div></div>
    </section>

    <!-- ===== CAR ===== -->
    <section id="page-car" class="page">
      <div class="stat-grid" id="carStats"></div>
      <div class="card card-gold">
        <div class="card-head"><h3>ตัวกรอง</h3></div>
        <div class="card-body">
          <div class="pill-row" id="carFilterPills"></div>
        </div>
      </div>
      <div id="carList"></div>
    </section>
  </div>
</div>

<button id="backToTop" onclick="scrollTo({top:0,behavior:'smooth'})">↑</button>
<div id="spinner"><div class="spin-box"><div class="ring"></div><p id="spinMsg">กำลังโหลด...</p></div></div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
/* ═══════════════ CONFIG ═══════════════ */
const CFG = {
  proxy: 'https://script.google.com/macros/s/AKfycbxfCb3brtjztaDmXukA_6gMGEfx2L3yT_y9vLllJ-p-1BDcAaa0hqcFW_Qyc_n8F-5-/exec',
  token: 'ppd-2569-r7k4mq',
  usersSheetId: '1M6HdISsLN684qRWyQ73CA4AmUzmYtZaOlffDJXZZIXQ',
  usersSheetName: 'Rattana Users for apps',
  warehouses: { W1:'สมุทรสงคราม', W2:'สุพรรณบุรี', W3:'ราชบุรี', W4:'นครปฐม', HQ:'สำนักงานใหญ่' },
  depts: ['ขาย','คลัง','ส่วนกลาง','ขนส่ง'],
  // เกณฑ์เกรด — ⚠️ ค่าเริ่มต้น ยังไม่ยืนยันกับแท็บ "เกรด" ในชีท แก้ได้ที่นี่จุดเดียว
  grades: [ {min:90,g:'A',c:'#2ecc71'},{min:80,g:'B',c:'#27ae60'},{min:70,g:'C',c:'#f39c12'},{min:60,g:'D',c:'#e67e22'},{min:0,g:'F',c:'#e74c3c'} ],
  defaultWeight: d => d === 'ส่วนกลาง' ? 10 : 30,   // สังเกตจากข้อมูล: ส่วนกลาง นน.10, อื่น นน.30
  defaultFull: 5
};

/* ═══════════════ STATE ═══════════════ */
let currentUser = null;
let DATA = { checklist:[], audits:[], car:[] };
let defMap = {};        // (แผนก||หัวข้อย่อย) → {full, weight, main}
let audit = null;       // รอบตรวจปัจจุบัน
let trendChart = null;

/* ═══════════════ HELPERS ═══════════════ */
const $ = id => document.getElementById(id);
const clean = s => String(s==null?'':s).replace(/[​‌‍﻿]/g,'').replace(/ /g,' ');
const normKey = s => clean(s).replace(/\s+/g,' ').trim().toLowerCase();
const num = v => { const s = clean(v).trim(); return /^-?\d+(\.\d+)?$/.test(s) ? parseFloat(s) : null; };
const esc = s => clean(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ดึงค่าจาก row ด้วย "ชื่อเชิงตรรกะ" — ทนหัวตารางที่มี newline/ช่องว่างซ้อน
function pick(row, ...names){
  if(!row) return '';
  const want = names.map(normKey);
  for(const k in row){ if(want.includes(normKey(k))) return clean(row[k]); }
  // เผื่อ key มี newline ในตัว → เทียบแบบ contains
  for(const k in row){ const nk=normKey(k); if(want.some(w=>nk===w)) return clean(row[k]); }
  return '';
}
const P_PASS='ผ่าน=1 ไม่ผ่าน=0', P_FULL='คะแนนเต็ม', P_WEIGHT='น้ำหนัก', P_XW='คะแนนxน้ำหนัก', P_TOT='สูตร total X weight';

function fmtThaiDate(input){
  const d = parseDate(input); if(!d) return '-';
  return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()+543}`;
}
function parseDate(v){
  if(v instanceof Date) return isNaN(v)?null:v;
  const s = clean(v).trim(); if(!s) return null;
  let m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);       // d/M/yyyy
  if(m){ let y=+m[3]; if(y>2400) y-=543; return new Date(y, +m[2]-1, +m[1]); }
  m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);                 // yyyy-mm-dd
  if(m) return new Date(+m[1], +m[2]-1, +m[3]);
  const d = new Date(s); return isNaN(d)?null:d;
}
const toGregStr = d => `${d.getDate()}/${d.getMonth()+1}/${d.getFullYear()}`;
const yearOf = v => { const d=parseDate(v); return d?d.getFullYear():null; };
const gradeOf = pct => CFG.grades.find(g=>pct>=g.min) || CFG.grades[CFG.grades.length-1];

async function api(action, params={}){
  const u = new URL(CFG.proxy);
  u.searchParams.set('action', action); u.searchParams.set('token', CFG.token);
  for(const k in params) u.searchParams.set(k, params[k]);
  const r = await fetch(u.toString());
  const j = await r.json();
  if(j.ok===false) throw new Error(j.message||('action '+action+' ล้มเหลว'));
  return j;
}
async function apiPost(action, body={}){
  // text/plain กัน CORS preflight (Apps Script ไม่ตอบ OPTIONS)
  const r = await fetch(CFG.proxy, {
    method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(Object.assign({action, token:CFG.token, actorEmail:currentUser?.email||''}, body))
  });
  const j = await r.json();
  if(j.ok===false) throw new Error(j.message||('action '+action+' ล้มเหลว'));
  return j;
}

function checkRattanaSession(){
  try{ const raw=localStorage.getItem('rattana_session')||localStorage.getItem('rattanaUser'); if(!raw) return null;
    const p=JSON.parse(raw); if(!p?.data?.email||!p.exp||Date.now()>p.exp) return null; return p.data;
  }catch{ return null; }
}
function saveSession(u){ const p={data:u,exp:Date.now()+30*24*60*60*1000}; localStorage.setItem('rattana_session',JSON.stringify(p)); localStorage.setItem('rattanaUser',JSON.stringify(p)); }
function logout(){ localStorage.removeItem('rattana_session'); localStorage.removeItem('rattanaUser'); location.reload(); }
const normEmail = s => clean(s).replace(/\s+/g,'').toLowerCase();
function decodeJwt(t){ const p=String(t||'').split('.'); if(p.length<2) throw 0; let b=p[1].replace(/-/g,'+').replace(/_/g,'/'); b+='='.repeat((4-b.length%4)%4); const bin=atob(b),by=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++)by[i]=bin.charCodeAt(i); return JSON.parse(new TextDecoder('utf-8').decode(by)); }

async function handleGoogleLogin(resp){
  showSpin('กำลังตรวจสอบสิทธิ์...');
  try{
    const email = normEmail(decodeJwt(resp.credential).email);
    let user = { email, name:email.split('@')[0], role:1, dept:'', warehouse:'', empId:'' };
    // ตรวจกับ Users Sheet (best-effort — ถ้าดึงไม่ได้ ยังให้เข้าได้ เพราะ proxy คือด่านจริง)
    try{
      const url=`https://docs.google.com/spreadsheets/d/${CFG.usersSheetId}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(CFG.usersSheetName)}`;
      const rows = parseCsv(await (await fetch(url)).text());
      const u = rows.find(r=>normEmail(r['E-mail'])===email);
      if(u){
        if(String(u['Status']||'').trim().toLowerCase()!=='active'){ loginErr('บัญชีถูกระงับ ติดต่อแอดมิน'); return; }
        user = { email, name:u['ชื่อ - สกุล']||email.split('@')[0], nickname:u['ชื่อเล่น']||'',
                 role:parseInt(u['User Role'])||1, dept:u['แผนก']||'', warehouse:u['W']||'', empId:u['รหัสพนักงาน']||'' };
      }
    }catch(e){ /* ปล่อยผ่าน ใช้ข้อมูลจาก Google */ }
    currentUser = user; saveSession(user); enterApp();
  }catch(e){ loginErr('เข้าสู่ระบบไม่สำเร็จ ลองใหม่'); }
  finally{ hideSpin(); }
}
function loginErr(m){ const e=$('loginErr'); e.textContent=m; e.style.display='block'; }
function parseCsv(text){
  if(!text) return []; if(text.charCodeAt(0)===0xFEFF) text=text.slice(1);
  const rows=[]; let row=[],cell='',q=false;
  for(let i=0;i<text.length;i++){ const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cell+='"';i++;}else q=false; } else cell+=c; }
    else { if(c==='"')q=true; else if(c===','){row.push(cell);cell='';} else if(c==='\r'){} else if(c==='\n'){row.push(cell);rows.push(row);row=[];cell='';} else cell+=c; } }
  if(cell.length||row.length){row.push(cell);rows.push(row);}
  if(!rows.length) return [];
  const h=rows[0].map(x=>clean(x).trim());
  return rows.slice(1).filter(r=>r.some(c=>clean(c).trim())).map(r=>Object.fromEntries(h.map((k,i)=>[k,clean(r[i]).trim()])));
}

async function uploadItemPhoto(id, input){

  }catch(e){ toast('อัพโหลดรูปไม่สำเร็จ: '+e.message,'error'); }
  finally{ hideSpin(); }
}
function resizeToBase64(file, max=1280, q=0.7){
  return new Promise((res,rej)=>{ const img=new Image(); img.onload=()=>{
    let {width:w,height:h}=img; if(w>h&&w>max){h=h*max/w;w=max;}else if(h>max){w=w*max/h;h=max;}
    const c=document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h);
    res(c.toDataURL('image/jpeg',q).split(',')[1]);
  }; img.onerror=rej; img.src=URL.createObjectURL(file); });
}

function recalcLive(){
  let num_=0, den=0, done=0, total=0;
  const dp={};
  audit.items.forEach(it=>{
    if(it.na) return;
    total++;
    CFG.depts;
    const key=it.dept; dp[key]=dp[key]||{n:0,d:0,done:0,tot:0}; dp[key].tot++;
    if(it.pass!==null){ done++; dp[key].done++;
      const contrib=it.pass*it.full*it.weight, max=it.full*it.weight;
      num_+=contrib; den+=max; dp[key].n+=contrib; dp[key].d+=max;
    }
  });
  const pct = den>0 ? num_/den*100 : 0;
  $('liveScore').textContent = pct.toFixed(1);
  const g=gradeOf(pct); const gc=$('liveGrade'); gc.textContent=g.g; gc.style.background=g.c;
  $('liveProg').textContent = `${done} / ${total}`;
  Object.entries(dp).forEach(([d,o])=>{ const el=$('dp-'+d); if(el) el.textContent = o.d>0?`${(o.n/o.d*100).toFixed(0)}% · ${o.done}/${o.tot}`:`0/${o.tot}`; });
}

async function saveAudit(){

  if(!scored.length){ toast('ยังไม่ได้ให้คะแนนข้อใดเลย','warning'); return; }
  const naCount = audit.items.filter(it=>it.na).length;
  const unscored = audit.items.filter(it=>!it.na && it.pass===null).length;
  if(!confirm(`บันทึก ${scored.length} ข้อ\n(N/A ${naCount} · ยังไม่ตรวจ ${unscored})\nศูนย์ ${selWhCode} ครั้งที่ ${audit.round} ?`)) return;

  showSpin('กำลังบันทึกผลตรวจ...');

    const dateStr = toGregStr(parseDate(audit.date));
    const lines = scored.map(it=>({
      'ใช้/ไม่ใช้':'ใช้', 'วันที่ตรวจ':dateStr, 'คลัง':audit.wh, 'แผนก':it.dept,
      'หัวข้อหลัก':it.main, 'หัวข้อย่อย':it.sub, 'อธิบายเพิ่มเติม (ยกตัวอย่างเช่น)':it.desc,
      'สิ่งที่พบ':it.found, 'คะแนน ที่ได้': it.pass>0?(it.pass*it.full):'', 'คะแนนเต็ม':it.full, 'น้ำหนัก':it.weight,
      'ผ่าน=1 ไม่ผ่าน=0':it.pass, 'คะแนน *':it.pass*it.full, 'คะแนนxน้ำหนัก':it.pass*it.full*it.weight,
      'สูตร total X weight':it.full*it.weight, 'ครั้งที่':audit.round, 'คนตรวจ':currentUser.name||currentUser.email,
      'รูปภาพประกอบ':it.photo||''
    }));
    const r = await apiPost('saveAudit',{ lines });
    localStorage.removeItem(draftKey());
    toast(`บันทึก ${r.saved} ข้อสำเร็จ ✓`,'success');
    audit=null; $('auditWorkspace').classList.add('hidden'); updateDraftHint();
    await loadAll();
  }catch(e){ toast('บันทึกไม่สำเร็จ: '+e.message,'error'); }

}

function pillBtns(group,opts,cur){ return opts.map(([v,l])=>`<button class="pill ${String(cur)===String(v)?'on gold':''}" onclick="setDashFilter('${group}','${v}')">${esc(l)}</button>`).join(''); }

function dashRows(){ return DATA.audits.filter(r=>{
  const useOk = pick(r,'ใช้/ไม่ใช้').trim()!=='ไม่ใช้';
  const rOk = dashRound==='all'||pick(r,'ครั้งที่')===dashRound;
  const yOk = dashYear==='all'||String(yearOf(pick(r,'วันที่ตรวจ')))===String(dashYear);
  return useOk&&rOk&&yOk;
}); }
function scoreRows(rows){ let n=0,d=0,pass=0,fail=0,cnt=0;
  rows.forEach(r=>{ const xw=num(pick(r,P_XW)), tot=num(pick(r,P_TOT)), p=num(pick(r,P_PASS));
    if(tot!=null&&tot>0&&p!=null){ n+=(xw??0); d+=tot; cnt++; if(p>=1)pass++; else if(p===0)fail++; } });
  return { pct: d>0?n/d*100:0, n,d,pass,fail,cnt };
}
function drawDash(){
  const rows=dashRows(); const all=scoreRows(rows); const g=gradeOf(all.pct);
  $('dashStats').innerHTML = `
    ${statCard('คะแนนรวม', all.pct.toFixed(1)+'%', 'เกรด '+g.g, g.c)}
    ${statCard('ข้อที่ตรวจ', all.cnt, all.pass+' ผ่าน · '+all.fail+' ตก')}
    ${statCard('PPD (0–4)', (all.pct/100*4).toFixed(2), 'เข้าสรุป26')}
    ${statCard('รอบที่แสดง', dashRound==='all'?'ทุกครั้ง':('ครั้งที่ '+dashRound), dashYear==='all'?'ทุกปี':('พ.ศ. '+(+dashYear+543)))}`;

  // per center
  const centers = Object.keys(CFG.warehouses).map(w=>{
    const cr = rows.filter(r=>pick(r,'คลัง')===w); if(!cr.length) return null;
    const s=scoreRows(cr); const cg=gradeOf(s.pct);
    // แผนกที่ต้อง focus = แผนกที่ % ต่ำสุด
    let worst=null;
    CFG.depts.forEach(d=>{ const ds=scoreRows(cr.filter(r=>pick(r,'แผนก')===d)); if(ds.cnt&&(!worst||ds.pct<worst.pct)) worst={d,pct:ds.pct}; });
    return {w,s,cg,worst};
  }).filter(Boolean).sort((a,b)=>b.s.pct-a.s.pct);
  $('dashCenters').innerHTML = centers.length ? centers.map(c=>`
    <div style="display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)">
      <span class="grade-chip" style="background:${c.cg.c}">${c.cg.g}</span>
      <div style="flex:1"><b>${c.w} · ${CFG.warehouses[c.w]}</b><br>
        <span class="mini">${c.s.pct.toFixed(1)}% · ${c.s.cnt} ข้อ${c.worst?` · ต้อง focus: <b style="color:var(--danger)">${esc(c.worst.d)}</b> (${c.worst.pct.toFixed(0)}%)`:''}</span></div>
    </div>`).join('') : '<div class="empty">ไม่มีข้อมูลตามตัวกรอง</div>';

  drawTrend();

  // worst items
  const map={};
  rows.forEach(r=>{ const p=num(pick(r,P_PASS)); if(p===0){ const k=pick(r,'แผนก')+' · '+pick(r,'หัวข้อย่อย'); map[k]=(map[k]||0)+1; } });
  const worst=Object.entries(map).sort((a,b)=>b[1]-a[1]).slice(0,10);
  $('dashWorst').innerHTML = worst.length ? worst.map(([k,n])=>`
    <div style="display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)">
      <span style="font-size:13px">${esc(k)}</span><span class="badge b-open">ตก ${n} ครั้ง</span></div>`).join('') : '<div class="empty">ไม่มีข้อตก 👍</div>';
}
function statCard(label,val,sub,color){ return `<div class="stat-card" ${color?`style="border-top-color:${color}"`:''}>
  <div class="s-label">${esc(label)}</div><div class="s-value" ${color?`style="color:${color}"`:''}>${esc(val)}</div><div class="s-sub">${esc(sub||'')}</div></div>`; }

function drawTrend(){
  const rounds=[...new Set(DATA.audits.map(r=>pick(r,'ครั้งที่')).filter(Boolean))].sort((a,b)=>+a-+b);
  const yFilter = r => dashYear==='all'||String(yearOf(pick(r,'วันที่ตรวจ')))===String(dashYear);
  const ds = Object.keys(CFG.warehouses).map((w,i)=>{
    const colors=['#c9a84c','#3498db','#2ecc71','#e74c3c','#9b59b6'];
    return { label:w, borderColor:colors[i%5], backgroundColor:colors[i%5], tension:.3, spanGaps:true,
      data: rounds.map(rd=>{ const rr=DATA.audits.filter(r=>pick(r,'คลัง')===w&&pick(r,'ครั้งที่')===rd&&yFilter(r)&&pick(r,'ใช้/ไม่ใช้').trim()!=='ไม่ใช้'); const s=scoreRows(rr); return s.cnt?+s.pct.toFixed(1):null; }) };
  });
  if(trendChart) trendChart.destroy();
  const dark=document.body.classList.contains('dark');
  trendChart = new Chart($('trendChart'),{ type:'line',
    data:{ labels:rounds.map(r=>'ครั้ง '+r), datasets:ds },
    options:{ responsive:true, plugins:{legend:{labels:{color:dark?'#fff':'#0d1b3e',boxWidth:12,font:{size:11}}}},
      scales:{ y:{min:0,max:100,ticks:{color:dark?'#b8c2dc':'#6b7896'},grid:{color:dark?'#1f3563':'#eee'}}, x:{ticks:{color:dark?'#b8c2dc':'#6b7896'},grid:{display:false}} } } });
}

/* ═══════════════ CAR ═══════════════ */
let carFilter='open';
function carStatus(r){ const fix=pick(r,'แก้ไข'), done=pick(r,'วันที่เสร็จ'); return (fix&&done)?'done':'open'; }
function carAge(r){ const d=parseDate(pick(r,'วันที่ตรวจ')); if(!d) return null; return Math.floor((Date.now()-d.getTime())/86400000); }
function renderCar(){
  const open=DATA.car.filter(r=>carStatus(r)==='open'), done=DATA.car.filter(r=>carStatus(r)==='done');
  const aging=open.filter(r=>{const a=carAge(r);return a!=null&&a>30;});
  $('carStats').innerHTML = `
    ${statCard('ค้างแก้ไข', open.length, 'ยังไม่ปิด', '#e74c3c')}
    ${statCard('ค้างเกิน 30 วัน', aging.length, 'เร่งด่วน', '#f39c12')}
    ${statCard('ปิดแล้ว', done.length, 'เสร็จสิ้น', '#2ecc71')}
    ${statCard('ทั้งหมด', DATA.car.length, 'ทุกรายการ')}`;
  $('carFilterPills').innerHTML = [['open','ค้างแก้ไข'],['aging','เกิน 30 วัน'],['done','ปิดแล้ว'],['all','ทั้งหมด']]
    .map(([v,l])=>`<button class="pill ${carFilter===v?'on gold':''}" onclick="setCarFilter('${v}')">${l}</button>`).join('');
  let list = DATA.car.filter(r=>pick(r,'หัวข้อย่อย'));
  if(carFilter==='open') list=list.filter(r=>carStatus(r)==='open');
  else if(carFilter==='done') list=list.filter(r=>carStatus(r)==='done');
  else if(carFilter==='aging') list=list.filter(r=>carStatus(r)==='open'&&carAge(r)>30);
  list.sort((a,b)=>(carAge(b)??-1)-(carAge(a)??-1));
  $('carList').innerHTML = list.length ? list.map((r,i)=>carHtml(r,DATA.car.indexOf(r))).join('') : '<div class="empty">ไม่มีรายการตามตัวกรอง</div>';
}
function setCarFilter(v){ carFilter=v; renderCar(); }
function carHtml(r,idx){
  const st=carStatus(r), age=carAge(r), aging=st==='open'&&age>30;
  const cls = st==='done'?'done':(aging?'aging':'open');
  const badge = st==='done'?'<span class="badge b-done">ปิดแล้ว</span>':(aging?`<span class="badge b-age">ค้าง ${age} วัน</span>`:`<span class="badge b-open">ค้าง ${age??'?'} วัน</span>`);
  return `<div class="car-item ${cls}">
    <div style="display:flex;justify-content:space-between;gap:8px;margin-bottom:4px">
      <span class="mini"><b>${esc(pick(r,'คลัง'))}</b> · ${esc(pick(r,'แผนก'))} · ${fmtThaiDate(pick(r,'วันที่ตรวจ'))}</span>${badge}</div>
    <div style="font-weight:700;font-size:14px">${esc(pick(r,'หัวข้อย่อย'))}</div>
    ${pick(r,'สาเหตุ')?`<div class="mini" style="margin-top:4px">🔍 สาเหตุ: ${esc(pick(r,'สาเหตุ'))}</div>`:''}
    ${pick(r,'แก้ไข')?`<div class="mini">🔧 แก้ไข: ${esc(pick(r,'แก้ไข'))} ${pick(r,'ชื่อผู้แก้ไข')?('· '+esc(pick(r,'ชื่อผู้แก้ไข'))):''}</div>`:''}
    ${st==='open'?`<button class="btn btn-success btn-sm btn-block" style="margin-top:8px" onclick="openCloseCar(${idx})">✓ บันทึกการแก้ไข / ปิด</button>`:''}
  </div>`;
}
async function openCloseCar(idx){
  const r=DATA.car[idx];
  const fix=prompt(`ปิด CAR: ${pick(r,'หัวข้อย่อย')}\n\nระบุการแก้ไขที่ทำ:`, pick(r,'แก้ไข')); if(fix===null) return;
  if(!fix.trim()){ toast('ต้องระบุการแก้ไข','warning'); return; }
  showSpin('กำลังปิด CAR...');
  try{
    await apiPost('closeCar',{ 'วันที่ตรวจ':pick(r,'วันที่ตรวจ'),'คลัง':pick(r,'คลัง'),'แผนก':pick(r,'แผนก'),'หัวข้อย่อย':pick(r,'หัวข้อย่อย'),
      'แก้ไข':fix, 'ชื่อผู้แก้ไข':currentUser.name||currentUser.email });
    toast('ปิด CAR แล้ว ✓','success'); await loadAll(); renderCar();
  }catch(e){ toast('ปิด CAR ไม่สำเร็จ: '+e.message,'error'); }
  finally{ hideSpin(); }
}

/* live draft hint on round change */
document.addEventListener('input',e=>{ if(e.target.id==='inpRound') updateDraftHint(); });
boot();
