<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rattana Sales Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0d1b3e;--navy-mid:#1a2f5e;--navy-light:#243b73;--gold:#c9a84c;--gold-light:#e8c86a;--success:#2ecc71;--danger:#e74c3c;--warning:#f39c12;--bg:#eef0f7;--card:#fff;--border:#dde3f0;--text:#0d1b3e;--muted:#6b7896}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Sarabun',sans-serif;background:var(--bg);color:var(--text)}
.app{display:flex;height:100vh;overflow:hidden}
.main{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.topbar{background:var(--card);border-bottom:1px solid var(--border);padding:10px 18px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.tb-l{display:flex;align-items:center;gap:10px}
.tb-ico{font-size:22px}.tb-t{font-size:18px;font-weight:700;color:var(--navy)}
.tb-r{display:flex;align-items:center;gap:8px}
.fp{display:flex;align-items:center;gap:5px;padding:6px 13px;border:1.5px solid var(--border);border-radius:20px;background:var(--card);color:var(--text);font-family:'Sarabun',sans-serif;font-size:12px;cursor:pointer;font-weight:500;white-space:nowrap}
.fp:hover{border-color:var(--gold)}
/* Tab bar */
.tabbar{background:var(--card);border-bottom:2px solid var(--border);padding:0 18px;display:flex;gap:0;flex-shrink:0}
.tab{padding:10px 18px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:color .15s,border-color .15s;white-space:nowrap}
.tab:hover{color:var(--navy)}
.tab.active{color:var(--navy);border-bottom-color:var(--gold)}

.content{flex:1;overflow-y:auto;padding:14px 18px}
.content::-webkit-scrollbar{width:5px}.content::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

/* KPI */
.krow{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.kcard{background:var(--card);border-radius:12px;padding:14px 16px;border:1px solid var(--border);display:flex;align-items:center;gap:12px;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.kico{width:48px;height:48px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.kico.b{background:#e3f0fd}.kico.g{background:#e8f7ee}.kico.o{background:#fff3e0}.kico.p{background:#fce4ec}
.klbl{font-size:10px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.35px}
.kval{font-size:20px;font-weight:700;line-height:1.2;margin:2px 0}
.ksub{font-size:11px;font-weight:600}.ksub.ok{color:var(--success)}.ksub.mu{color:var(--muted)}

/* Person section */
.psec{background:var(--card);border-radius:12px;border:1px solid var(--border);margin-bottom:14px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.psec-body{display:grid;grid-template-columns:165px minmax(0,1fr)}

/* Info col */
.pinfo{padding:15px 13px;border-right:1px solid var(--border);display:flex;flex-direction:column;gap:4px}
.pi-name{font-weight:700;font-size:15px;color:var(--navy);margin-bottom:4px}
.pi-s{font-size:19px;font-weight:700;line-height:1.15}
.pi-u{font-size:11px;color:var(--muted)}
.pi-bar{background:var(--border);border-radius:4px;height:7px;margin:5px 0 2px}
.pi-bar-f{height:7px;border-radius:4px}
.pi-al{font-size:10px;color:var(--muted)}
.pi-ap{font-size:26px;font-weight:700;line-height:1}
.pi-tl{font-size:10px;color:var(--muted);margin-top:8px}
.pi-tv{font-size:12px;font-weight:600}
.pi-goal{margin-top:auto;text-align:center;font-size:30px;padding-top:8px}

/* Category cards col */
.pcat{overflow:hidden;padding:10px 12px}
.sec-t{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:8px}
.cat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.cat-card{background:var(--bg);border-radius:8px;padding:9px 10px;border:1px solid var(--border);position:relative;overflow:hidden}
.cat-card.tot-card{grid-column:1/-1;background:#f0f3ff;border-color:#c8d0ee;display:flex;align-items:center;justify-content:space-between;padding:8px 12px}
.cc-name{font-size:10px;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:4px}
.cc-sales{font-size:13px;font-weight:700;color:var(--text);margin-bottom:5px}
.cc-bar-bg{background:#dde3f0;border-radius:3px;height:5px;margin-bottom:4px}
.cc-bar-fg{height:5px;border-radius:3px}
.cc-bot{display:flex;align-items:center;justify-content:space-between}
.cc-ach{font-size:11px;font-weight:700}
.cc-tgt{font-size:9px;color:var(--muted)}
.tot-card .tot-lbl{font-size:12px;font-weight:700;color:var(--navy)}
.tot-card .tot-sales{font-size:14px;font-weight:700;color:var(--navy)}
.tot-card .tot-ach{font-size:14px;font-weight:700}
.tot-card .tot-tgt{font-size:11px;color:var(--muted);font-weight:600}

.vbadge{position:fixed;bottom:6px;right:8px;background:rgba(13,27,62,.55);color:rgba(255,255,255,.4);font-size:9px;padding:2px 6px;border-radius:4px;font-family:monospace;z-index:1000}
</style>
</head>

function renderPeople(catsByPerson){
  const con = document.getElementById('content');
  DATA.people.forEach(p=>{
    const totalSales  = p.cats.reduce((s,c)=>s+c.sales,0);
    const totalTarget = p.cats.reduce((s,c)=>s+c.target,0);
    const a = p.achievement;

    /* Build cat list: real names from sheet, sales distributed by SKU proportion */
    const skuMap = catsByPerson[p.name];
    const sheetCats = skuMap ? Object.entries(skuMap).sort((a,b)=>b[1]-a[1]) : null;

    const personSales = _salesByCatType[p.name] || {};
    const hasSalesData = Object.keys(personSales).length > 0;

    let displayCats;
    if(sheetCats && sheetCats.length){
      const totalSku = sheetCats.reduce((s,[,n])=>s+n,0);
      displayCats = sheetCats.map(([catName, sku])=>{
        const ratio = sku/totalSku;
        return {
          name: catName,
          sales: hasSalesData ? (personSales[catName]||0) : 0,
          target: (_targetByCatType[p.name]&&_targetByCatType[p.name][catName]!=null) ? _targetByCatType[p.name][catName] : Math.round(totalTarget*ratio),
        };
      });
    } else {
      displayCats = p.cats;
    }
    displayCats = [...displayCats].sort((a,b)=>b.sales-a.sales);

    /* ถ้ามียอดจริง ให้คำนวณ totalSales จริงด้วย */
    const realTotalSales = hasSalesData
      ? displayCats.reduce((s,c)=>s+c.sales,0)
      : totalSales;

    let cards = '';
    displayCats.forEach(c=>{
      const ca = c.target>0 ? Math.round(c.sales/c.target*1000)/10 : 0;
      const barW = realTotalSales>0 ? Math.min(c.sales/realTotalSales*100*3,100).toFixed(1) : 0;
      cards += `<div class="cat-card">
        <div class="cc-name">${c.name}</div>
        <div class="cc-sales">${fmt(c.sales)}</div>
        <div class="cc-bar-bg"><div class="cc-bar-fg" style="width:${barW}%;background:${p.color}88"></div></div>

          <span class="cc-ach" style="color:${ach(ca)}">${ca}%</span>
          <span class="cc-tgt">เป้า ${fmt(c.target)}</span>
        </div>
      </div>`;
    });
    const realAch = totalTarget>0 ? Math.round(realTotalSales/totalTarget*1000)/10 : 0;
    cards += `<div class="cat-card tot-card">
      <span class="tot-lbl">รวม</span>
      <span class="tot-sales">${fmt(realTotalSales)}</span>
      <span class="tot-ach" style="color:${ach(realAch)}">${realAch}%</span>
      <span class="tot-tgt">เป้า ${fmt(totalTarget)}</span>
    </div>`;

    con.insertAdjacentHTML('beforeend',`
      <div class="psec" id="${p.id}" style="border-left:3px solid ${p.color}">
        <div class="psec-body">
          <div class="pinfo">
            <div class="pi-name">${p.name}</div>
            <div class="pi-s" style="color:${p.color}">${fmt(hasSalesData?realTotalSales:0)}</div>
            <div class="pi-u">บาท</div>
            <div class="pi-bar" style="margin-top:12px"><div class="pi-bar-f" style="width:${Math.min(hasSalesData?realAch:a,100)}%;background:${p.color}"></div></div>
            <div class="pi-al">Achievement</div>
            <div class="pi-ap" style="color:${ach(hasSalesData?realAch:a)}">${hasSalesData?realAch:a}%</div>

            <div class="pi-goal">${a>=100?'🏆':a>=80?'⭐':'📦'}</div>

            <div class="sec-t">หมวดหมู่สินค้า</div>
            <div class="cat-grid">${cards}</div>

/* ── Generic JSONP helper ── */
let _gvizSeq = 0;
function jsonpFetch(sheetId, sheetName, tq){
  return new Promise((resolve, reject)=>{
    const cbName = '_gvizCb'+(++_gvizSeq);
    const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json;responseHandler:${cbName}&sheet=${encodeURIComponent(sheetName)}&tq=${encodeURIComponent(tq)}`;
    const timer = setTimeout(()=>{ cleanup(); reject(new Error('timeout 12s')); }, 12000);
    function cleanup(){ delete window[cbName]; if(s.parentNode)s.remove(); clearTimeout(timer); }
    window[cbName] = function(res){
      cleanup();
      if(!res || !res.table){
        const msg = res&&res.errors ? res.errors.map(e=>e.detailed_message||e.message).join('; ') : 'no table in response';
        reject(new Error(msg));
      } else {
        resolve(res);
      }
    };
    const s = document.createElement('script'); s.src = url;
    s.onerror = ()=>{ cleanup(); reject(new Error('script load failed')); };
    document.head.appendChild(s);
  });
}

/* ── Fetch sales + join with Location Detail ── */
const SALES_SHEET_ID  = '1D0zsHDPVNFtrKBsOBWeCceDmXRSmLSi6rjNM6bkJ4iY';
const LOC_SHEET_ID    = '1AxNqqpGOC5_1AacEXhW7tcTTiZnR6UJofPerubh8AkM';
const PDDT_SHEET_ID   = '16mYDqAqqJma-_0vCIAajy6bcjdOZ7F6VagxkdkqAB2I';

async function fetchSalesData(){
  const UNIT_ORDER = ['CS','BP','PA','EA'];

  /* 1. Sales: PRODUCT_NAME(G), R unit(N), SUM QTY(H), SUM TOTAL(J) */
  const salesRes = await jsonpFetch(SALES_SHEET_ID, 'Data',
    'SELECT G,N,SUM(H),SUM(J) GROUP BY G,N ORDER BY G ASC');
  const sales = salesRes.table.rows.map(r=>({
    product: r.c[0]&&r.c[0].v||'',
    runit:   r.c[1]&&r.c[1].v||'',
    qty:     r.c[2]&&r.c[2].v||0,
    total:   r.c[3]&&r.c[3].v||0,
  })).sort((a,b)=>{
    const nc = a.product.localeCompare(b.product,'th');
    if(nc!==0) return nc;
    const au=UNIT_ORDER.indexOf(a.runit), bu=UNIT_ORDER.indexOf(b.runit);
    return (au<0?99:au)-(bu<0?99:bu);
  });

  /* 2. Location Detail: PRODUCT NAME(G), Unit(H), Shelf(J), Bay(K), Level(L), CAT GROUP(P), CAT BRAND(Q), CAT SIZE(R), ผู้รับผิดชอบ(S) */
  const locRes = await jsonpFetch(LOC_SHEET_ID, 'Location Detail',
    'SELECT G,H,J,K,L,P,Q,R,S,T');
  const locMap = {};
  locRes.table.rows.forEach(r=>{
    const v = i => r.c[i]&&r.c[i].v!=null ? String(r.c[i].v) : '';
    const prod = v(0), unit = v(1), key = prod+'|'+unit;
    const entry = {
      shelf: v(2), bay: v(3), level: v(4),
      catType: v(5), catGrp: v(6), catBrnd: v(7), catSize: v(8), person: v(9),
    };
    /* ถ้ายังไม่มี หรือ entry เดิมไม่มีผู้รับผิดชอบแต่ entry ใหม่มี → แทนที่ */
    if(!locMap[key] || (!locMap[key].person && entry.person)){
      locMap[key] = entry;
    }
  });

  /* 3. Join & build salesByCatType */
  const rows = sales.map(s=>({
    ...s,
    ...(locMap[s.product+'|'+s.runit]||{shelf:'',bay:'',level:'',catType:'',catGrp:'',catBrnd:'',catSize:'',person:''}),
  }));

  const byCatType = {};
  rows.forEach(r=>{
    if(!r.person||!r.catType) return;
    if(!byCatType[r.person]) byCatType[r.person]={};
    byCatType[r.person][r.catType] = (byCatType[r.person][r.catType]||0) + r.total;
  });
  _salesByCatType = byCatType;

  return rows;
}

/* ── Fetch PDDT sheet ── */
let _pddtData = null;
let _skuImageMap = {};

async function fetchSKUUsage(){
  const res = await jsonpFetch(PDDT_SHEET_ID, 'SKU_USAGE', 'SELECT *');
  const cols = res.table.cols;
  const idx = {};
  cols.forEach((c,i)=>{ if(c.label) idx[c.label.trim().toLowerCase()] = i; });
  /* หา index ชื่อสินค้า */
  const iName = cols.findIndex(c=>c.label&&/product.?name/i.test(c.label));
  /* หา index รูป: คอลัมน์ที่ label มี image/รูป/photo/img/url */
  let iImg = cols.findIndex(c=>c.label&&/image|รูป|photo|img\b|picture/i.test(c.label));
  /* fallback: หาคอลัมน์แรกที่ค่า row[0] ขึ้นต้น http */
  if(iImg<0 && res.table.rows.length){
    iImg = res.table.rows[0].c.findIndex(c=>c&&c.v&&String(c.v).startsWith('http'));
  }
  if(iName<0||iImg<0) return;
  res.table.rows.forEach(r=>{
    const name = r.c[iName]&&r.c[iName].v ? String(r.c[iName].v).trim() : '';
    const img  = r.c[iImg]&&r.c[iImg].v  ? String(r.c[iImg].v).trim()  : '';
    if(name&&img) _skuImageMap[name] = img;
  });
}

async function fetchPDDT(){
  const [res] = await Promise.all([
    jsonpFetch(PDDT_SHEET_ID, 'PDDT', 'SELECT *'),
    fetchSKUUsage().catch(()=>{}),
  ]);
  const cols = res.table.cols;
  const idx = {};
  cols.forEach((c,i)=>{ if(c.label) idx[c.label.trim()] = i; });
  const iName = idx['PRODUCT NAME'] ?? -1;
  const iAvg  = idx['AVERAGE 60D_C4'] ?? -1;
  const iSell = idx['SELL 7D C4'] ?? -1;
  const iIB   = idx['IB C4'] ?? -1;
  if(iName<0) throw new Error('ไม่พบคอลัมน์ PRODUCT NAME ใน PDDT (cols: '+cols.map(c=>c.label).join(', ')+')');
  return res.table.rows
    .filter(r => iIB>=0 && r.c[iIB] && r.c[iIB].v!=null && String(r.c[iIB].v).trim()!=='')
    .map(r=>{
      const v = i => (i>=0 && r.c[i] && r.c[i].v!=null) ? r.c[i].v : null;
      const name = String(v(iName)||'');
      return { name, avg60: Number(v(iAvg)||0), sell7: Number(v(iSell)||0), img: _skuImageMap[name]||'' };
    })
    .filter(r=>r.name);
}

function renderMissingTab(rows){
  const con = document.getElementById('content');

    con.innerHTML=`<div style="text-align:center;padding:48px;color:var(--muted)">ไม่มีข้อมูล</div>`;

  const cards = rows.map(r=>{
    const daily7  = r.sell7 / 7;
    const daily60 = r.avg60;
    const diff    = daily60 > 0 ? (daily7 - daily60) / daily60 * 100 : 0;
    const trend   = diff > 5 ? '📈' : diff < -5 ? '📉' : '➡️';
    const tColor  = diff > 5 ? '#2ecc71' : diff < -5 ? '#e74c3c' : '#c9a84c';
    const sign    = diff > 0 ? '+' : '';
    const imgHtml = r.img
      ? `<img src="${r.img}" alt="" style="width:100%;height:100px;object-fit:contain;border-radius:8px;background:var(--bg);margin-bottom:8px" onerror="this.style.display='none'">`
      : `<div style="height:100px;border-radius:8px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:28px;margin-bottom:8px">📦</div>`;
    return `<div style="background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px;box-shadow:0 1px 4px rgba(0,0,0,.04)">
      ${imgHtml}
      <div style="font-size:12px;font-weight:600;color:var(--navy);margin-bottom:8px;line-height:1.3">${r.name}</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px">
        <div style="background:var(--bg);border-radius:8px;padding:8px 10px">
          <div style="font-size:10px;color:var(--muted);margin-bottom:2px">AVG 60D/วัน</div>
          <div style="font-size:15px;font-weight:700;color:var(--navy)">${fmt(Math.round(daily60))}</div>
        </div>
        <div style="background:var(--bg);border-radius:8px;padding:8px 10px">
          <div style="font-size:10px;color:var(--muted);margin-bottom:2px">SELL 7D/วัน</div>
          <div style="font-size:15px;font-weight:700;color:var(--navy)">${fmt(Math.round(daily7))}</div>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:6px">
        <span style="font-size:18px">${trend}</span>
        <span style="font-size:12px;font-weight:700;color:${tColor}">${sign}${diff.toFixed(1)}%</span>
        <span style="font-size:11px;color:var(--muted)">เทียบ 60 วัน</span>
      </div>
    </div>`;
  }).join('');
  con.innerHTML=`
    <div style="margin-bottom:12px;font-size:13px;color:var(--muted)">${rows.length} รายการ · มี IB C4</div>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px">${cards}</div>`;
}

/* ── Fetch Target sheet ── */
async function fetchTargetData(){
  const res = await jsonpFetch(LOC_SHEET_ID, 'Target', 'SELECT A,B,C');
  const map = {};
  res.table.rows.forEach(r=>{
    const v = i => r.c[i]&&r.c[i].v!=null ? String(r.c[i].v).trim() : '';
    const person = v(0), catType = v(1), target = r.c[2]&&r.c[2].v!=null ? Number(r.c[2].v) : 0;
    if(!person||!catType) return;
    if(!map[person]) map[person]={};
    map[person][catType] = (map[person][catType]||0) + target;
  });
  _targetByCatType = map;
}

/* ── Tab switcher ── */
function switchTab(tab){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('tab-'+tab).classList.add('active');
  if(tab==='dashboard'){
    document.getElementById('content').innerHTML='';
    renderKPI();
    renderPeople(_catsByPerson);
  } else if(tab==='sales'){
    if(_salesData){
      renderSalesTab(_salesData);
    } else {
      document.getElementById('content').innerHTML=`
        <div style="display:flex;align-items:center;justify-content:center;height:300px;flex-direction:column;gap:16px;color:var(--muted)">
          <div style="width:40px;height:40px;border:4px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite"></div>
          <div style="font-size:13px">กำลังโหลดข้อมูลยอดขาย...</div>
        </div>
        <style>@keyframes spin{to{transform:rotate(360deg)}}</style>`;
      fetchSalesData().then(rows=>{
        _salesData = rows;
        renderSalesTab(rows);
      }).catch(e=>{
        document.getElementById('content').innerHTML=`<div style="text-align:center;padding:48px;color:var(--danger)">โหลดข้อมูลไม่สำเร็จ: ${e.message}</div>`;
      });
    }
  } else if(tab==='missing'){
    if(_pddtData){
      renderMissingTab(_pddtData);
    } else {
      document.getElementById('content').innerHTML=`
        <div style="display:flex;align-items:center;justify-content:center;height:300px;flex-direction:column;gap:16px;color:var(--muted)">
          <div style="width:40px;height:40px;border:4px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite"></div>
          <div style="font-size:13px">กำลังโหลดข้อมูลสินค้าหาย...</div>
        </div>
        <style>@keyframes spin{to{transform:rotate(360deg)}}</style>`;
      fetchPDDT().then(rows=>{
        _pddtData = rows;
        renderMissingTab(rows);
      }).catch(e=>{
        document.getElementById('content').innerHTML=`<div style="text-align:center;padding:48px;color:var(--danger)">โหลดข้อมูลไม่สำเร็จ: ${e.message}</div>`;
      });
    }
  }
}

function showSalesBanner(msg, isErr){
  let b = document.getElementById('sales-banner');
  if(!b){ b = document.createElement('div'); b.id='sales-banner'; b.style.cssText='margin-bottom:10px;padding:8px 14px;border-radius:8px;font-size:12px;font-weight:600'; document.getElementById('content').prepend(b); }
  b.style.background = isErr ? '#fdecea' : '#e8f7ee';
  b.style.color = isErr ? 'var(--danger)' : '#1a7a45';
  b.textContent = msg;
}
function removeSalesBanner(){ const b=document.getElementById('sales-banner'); if(b)b.remove(); }

async function init(){
  renderTopbar();
  _catsByPerson = await fetchCatsByPerson();
  document.getElementById('content').innerHTML='';
  renderKPI();
  renderPeople(_catsByPerson);
  showSalesBanner('⏳ กำลังโหลดยอดขายจริงและเป้าหมาย...');
  const salesP  = fetchSalesData().catch(e=>{ console.error('sales fetch error:', e); return null; });
  const targetP = fetchTargetData().catch(e=>{ showSalesBanner('❌ Target sheet error: '+e.message, true); console.error('target fetch error:', e); });
  Promise.all([salesP, targetP]).then(([rows])=>{
    if(rows) _salesData = rows;
    const activeTab = document.querySelector('.tab.active');
    if(activeTab && activeTab.id==='tab-dashboard'){
      document.getElementById('content').innerHTML='';
      renderKPI();
      renderPeople(_catsByPerson);
      showSalesBanner(rows ? '✅ โหลดข้อมูลจริงแล้ว' : '⚠️ โหลดยอดขายไม่สำเร็จ เป้า/ยอดแสดงเป็น 0');
      setTimeout(removeSalesBanner, 4000);
    }
  });
}
init();
