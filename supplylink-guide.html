<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ฝึกใช้ SupplyLink v1.4.2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0A1F47; --navy-2:#1E3A70; --gold:#E8BC42; --gold-deep:#8A6510; --gold-soft:#FBF4DE;
  --ink:#1C2433; --ink-2:#3D4759; --ink-3:#586379; --bg:#EEF2F8; --card:#FFFFFF; --line:#E3E7EF;
  --ok:#146C43; --bad:#A3401F; --mask:rgba(10,31,71,.30);
  --fs-xs:12.5px; --fs-sm:14px; --fs-md:16px; --fs-lg:19px; --fs-xl:26px;
  --sp-1:6px; --sp-2:10px; --sp-3:14px; --sp-4:20px; --gap-card:12px; --pad-card:16px;
  --r-sm:10px; --r-md:16px; --r-lg:24px; --r-phone:34px;
  --z-sticky:100; --z-tip:1000; --z-modal:2000; --z-toast:3000;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --ink:#E6EAF2; --ink-2:#C3CAD8; --ink-3:#AEB8CB; --bg:#0B1222; --card:#141D33; --line:#26304A; --gold-soft:#2A2410; } }
:root[data-theme="dark"]{ --ink:#E6EAF2; --ink-2:#C3CAD8; --ink-3:#AEB8CB; --bg:#0B1222; --card:#141D33; --line:#26304A; --gold-soft:#2A2410; }
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans Thai',sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer}
[hidden]{display:none!important}
.one{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.top{position:sticky;top:0;z-index:var(--z-sticky);background:var(--navy);color:#fff;padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;display:flex;align-items:center;gap:var(--sp-2);box-shadow:0 2px 8px rgba(0,0,0,.18)}
.top .brand{font-size:var(--fs-xs);font-weight:700;letter-spacing:2px;color:var(--gold)}
.top .ttl{font-size:var(--fs-md);font-weight:700;flex:1 1 auto}
.top .ver{font-size:var(--fs-xs);color:#C9D2E3;flex-shrink:0}
.iconbtn{width:40px;height:40px;border-radius:20px;border:0;background:rgba(255,255,255,.12);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.wrap{max-width:440px;margin:0 auto;padding:var(--sp-3) 16px calc(env(safe-area-inset-bottom) + 28px)}
.hero h1{margin:0 0 var(--sp-1);font-size:var(--fs-xl);line-height:1.3;color:var(--navy)}
:root[data-theme="dark"] .hero h1{color:var(--ink)}
.hero p{margin:0 0 var(--sp-4);font-size:var(--fs-sm);line-height:1.6;color:var(--ink-2)}
.lesson{width:100%;text-align:left;border:0;background:var(--card);border-radius:var(--r-md);padding:var(--pad-card);display:flex;align-items:center;gap:var(--sp-3);margin-bottom:var(--gap-card);box-shadow:0 4px 14px rgba(10,31,71,.08);color:var(--ink)}
.lesson .num{width:44px;height:44px;border-radius:22px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:var(--fs-lg);flex-shrink:0}
.lesson .txt{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px}
.lesson b{font-size:var(--fs-md);color:var(--navy)}
:root[data-theme="dark"] .lesson b{color:var(--ink)}
.lesson span{font-size:var(--fs-xs);color:var(--ink-3)}
.lesson .done{font-size:var(--fs-xs);font-weight:700;color:var(--ok);flex-shrink:0}
.lgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--gap-card);margin-bottom:var(--gap-card)}
.lcell{position:relative;text-align:left;border:0;background:var(--card);border-radius:var(--r-md);padding:14px;display:flex;flex-direction:column;gap:8px;box-shadow:0 4px 14px rgba(10,31,71,.08);color:var(--ink);min-width:0;min-height:118px}
.lcell .num{width:36px;height:36px;border-radius:18px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:var(--fs-md)}
.lcell b{font-size:var(--fs-md);color:var(--navy)}
:root[data-theme="dark"] .lcell b{color:var(--ink)}
.lcell .sub{font-size:var(--fs-xs);color:var(--ink-3)}
.lcell .ok{position:absolute;top:12px;right:12px;font-size:11.5px;font-weight:700;color:var(--ok)}
.note{font-size:var(--fs-xs);line-height:1.6;color:var(--ink-3);margin-top:var(--sp-3)}
/* ผู้เล่น */
.player{display:flex;flex-direction:column;align-items:center;gap:var(--sp-3)}
.prog{width:100%;display:flex;align-items:center;gap:var(--sp-2);font-size:var(--fs-xs);color:var(--ink-3)}
.bar{flex:1 1 auto;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);transition:width .3s}
.stage{position:relative;width:min(100%, 390px, calc((100dvh - 200px) * 390 / 844));aspect-ratio:390/844;border-radius:var(--r-phone);overflow:hidden;background:var(--navy);box-shadow:0 0 0 8px var(--navy),0 18px 40px rgba(10,31,71,.28);touch-action:manipulation;user-select:none}
.stage img.scr{position:absolute;inset:0;width:100%;height:100%;display:block}
.hole{position:absolute;border-radius:14px;box-shadow:0 0 0 9999px var(--mask);transition:all .35s ease;pointer-events:none}
.ring{position:absolute;border-radius:14px;border:3px solid var(--gold);pointer-events:none;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(232,188,66,.7)}50%{box-shadow:0 0 0 10px rgba(232,188,66,0)}}
.ring.press{animation:none;background:rgba(232,188,66,.28);box-shadow:0 0 0 6px rgba(232,188,66,.45);transform:scale(.97);transition:transform .12s,background .12s}
.hit{position:absolute;border:0;background:transparent;border-radius:14px;padding:0;-webkit-appearance:none;appearance:none;outline:none}
.hit:active,.hit:focus{background:transparent}
.tip,.hand{transition:opacity .12s}
.hand{position:absolute;width:44px;height:44px;pointer-events:none;animation:tap 1.4s ease-in-out infinite;filter:drop-shadow(0 3px 4px rgba(0,0,0,.35))}
@keyframes tap{0%,100%{transform:translate(0,0)}50%{transform:translate(-6px,-6px)}}
.tip{position:absolute;left:12px;right:12px;background:var(--card);color:var(--ink);border-radius:var(--r-md);padding:12px 14px;box-shadow:0 10px 28px rgba(0,0,0,.3);font-size:var(--fs-sm);line-height:1.55;pointer-events:none;z-index:var(--z-tip)}
.tip b{display:block;font-size:var(--fs-md);color:var(--navy);margin-bottom:2px}
:root[data-theme="dark"] .tip b{color:var(--gold)}
.miss{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fx{position:absolute;pointer-events:none}
.quiz .stage{width:min(100%, 390px)}                         /* แบบฝึกหัด: จอเต็มกว้าง กดง่าย เลื่อนลงดูส่วนล่างได้ */
.quiz.tap{padding-bottom:var(--qfb-room)}
.quiz.tap .qfb.on{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 10px);width:calc(100% - 24px);max-width:390px;z-index:var(--z-tip);box-shadow:0 10px 28px rgba(10,31,71,.3)}
.qlink{flex-shrink:0;border:0;background:transparent;color:var(--ink-2);font-weight:700;font-size:var(--fs-xs);padding:8px 4px;text-decoration:underline;text-underline-offset:3px}
:root{ --qfb-room:150px; }
.end .ctl{position:static}                                  /* จอจบบท: ปุ่มเรียงต่อกัน ไม่ลอยทับปุ่มทำแบบฝึกหัด */
.end .stage{width:min(100%, 390px, calc((100dvh - 290px) * 390 / 844))}
.qcard{width:100%;max-width:390px;background:var(--navy);color:#fff;border-radius:var(--r-md);padding:12px 14px;display:flex;flex-direction:column;gap:3px}
.qcard b{font-size:var(--fs-xs);letter-spacing:1px;color:var(--gold)}
.qcard span{font-size:var(--fs-md);line-height:1.5}
.qopts{width:100%;max-width:390px;display:flex;flex-direction:column;gap:var(--sp-2)}
.qopt{width:100%;text-align:left;min-height:52px;border:0;border-radius:var(--r-md);background:var(--card);color:var(--ink);padding:12px 14px;font-size:var(--fs-md);line-height:1.45;box-shadow:0 0 0 1.5px var(--line)}
.qopt.ok{box-shadow:0 0 0 3px var(--ok);background:var(--ok-soft)}
.qopt.bad{box-shadow:0 0 0 3px var(--bad);background:var(--bad-soft)}
.qopt:disabled{color:var(--ink)}
.qok{position:absolute;border-radius:14px;border:3px solid var(--ok);box-shadow:0 0 0 9999px rgba(10,31,71,.22);pointer-events:none}
.qbad{position:absolute;border-radius:14px;border:3px dashed var(--bad);background:rgba(163,64,31,.12);pointer-events:none}
.qdot{position:absolute;width:28px;height:28px;border-radius:14px;border:3px solid var(--bad);background:rgba(163,64,31,.18);pointer-events:none}
.qfb{width:100%;max-width:390px;border-radius:var(--r-md);display:none;flex-direction:column;gap:6px;font-size:var(--fs-sm);line-height:1.55}
.qfb.on{display:flex;padding:12px 14px}
.qfb.ok{background:var(--ok-soft);color:var(--ok-ink)}
.qfb.bad{background:var(--bad-soft);color:var(--bad-ink)}
.qfb b{font-size:var(--fs-md)}
.qfb .btn{margin-top:4px}
:root{ --ok-soft:#E8F5EE; --ok-ink:#0F3D27; --bad-soft:#FBEDE8; --bad-ink:#6E2412; }
:root[data-theme="dark"]{ --ok-soft:#123227; --ok-ink:#BFEBD3; --bad-soft:#3A1A12; --bad-ink:#F6C9BB; }

.ctl{width:100%;max-width:390px;position:sticky;bottom:calc(env(safe-area-inset-bottom) + 8px);display:flex;gap:var(--sp-2)}
.btn{flex:1 1 0;min-height:46px;border-radius:var(--r-sm);border:0;font-weight:700;font-size:var(--fs-sm)}
.btn.ghost{background:var(--card);color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--line)}
.btn.navy{background:var(--navy);color:#fff}
.btn.gold{background:var(--gold);color:var(--navy)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:999px;font-size:var(--fs-sm);z-index:var(--z-toast);opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1}
/* การ์ด LINE (วาดตามข้อความในการ์ดจริง) */
.linebg{position:absolute;inset:0;background:#8CABD9;padding:7% 6%;display:flex;flex-direction:column;gap:3%}
.lfrom{display:flex;align-items:center;gap:8px;font-size:3.6cqw;font-weight:600;color:var(--navy)}
.lfrom i{width:9cqw;height:9cqw;border-radius:50%;background:var(--navy);color:var(--gold);font-style:normal;font-size:2.8cqw;font-weight:700;display:flex;align-items:center;justify-content:center}
.lcard{background:#fff;border-radius:5cqw;overflow:hidden;color:#1C2433}
.lhead{background:var(--navy);padding:4.5cqw 5cqw;display:flex;flex-direction:column;gap:1cqw}
.lhead small{font-size:3cqw;font-weight:700;letter-spacing:.6cqw;color:#fff}
.lhead b{font-size:4.6cqw;color:#fff}
.lhead span{font-size:3.6cqw;font-weight:700;color:var(--gold)}
.lbody{padding:4cqw 5cqw;display:flex;flex-direction:column;gap:2.4cqw;font-size:3.5cqw}
.lrow{display:flex;gap:2cqw}.lrow span{color:#6F7C93;width:22cqw;flex-shrink:0}.lrow b{color:var(--navy);min-width:0}
.ltot{background:#FBF4DE;border-radius:3cqw;padding:3cqw;display:flex;align-items:center;gap:2cqw}.ltot span{flex:1 1 auto;color:#3D4759}.ltot b{font-size:4.4cqw;color:var(--navy)}
.lbtn{margin:0 5cqw 5cqw;background:var(--navy);color:#fff;border-radius:3cqw;padding:3.4cqw;text-align:center;font-size:4cqw;font-weight:700}
.stage{container-type:inline-size}
.endcard{position:absolute;inset:0;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--sp-3);padding:10%;text-align:center}
.endcard .ok{width:72px;height:72px;border-radius:36px;background:var(--ok);display:flex;align-items:center;justify-content:center}
.endcard b{font-size:var(--fs-lg);color:var(--navy)}
:root[data-theme="dark"] .endcard b{color:var(--ink)}
.endcard span{font-size:var(--fs-sm);line-height:1.6;color:var(--ink-2)}
</style>
</head>

<script>

  function cardKey(node) {

  /* ค่าที่ token แต่ละตัวคลี่ออกมาจริง — ใช้จับว่า element ที่ชี้อยู่กินโทเคนตัวไหน */

  }
  function shortSel(node) {

    }

  }

  }

  /* ชื่อไฟล์เดิมของหน้านี้ — เซฟทับตัวเอง ไม่สร้างไฟล์ชื่อใหม่ */

  /* เซฟทับไฟล์เดิมถ้าเบราว์เซอร์ให้ · ไม่งั้นโหลดไฟล์ชื่อเดิมลง Downloads แล้วเอาไปวางทับ */
  function saveSelf(box) {

    var sh = el('button', 'rkt-b', 'เงา เปิด/ปิด');
    sh.onclick = function () {
      var c = cards[picked] = cards[picked] || {};
      c['box-shadow'] = c['box-shadow'] === 'none' ? '0 2px 6px rgba(15,23,42,.14)' : 'none';
      applyCards();
    };
    var cl = el('button', 'rkt-b warn', 'ล้างตรงนี้');
    cl.onclick = function () { delete cards[picked]; applyCards(); rebuild(); };
    bt.appendChild(sh); bt.appendChild(cl);
    bd.appendChild(bt);

    /* โทเคนที่จุดนี้กินอยู่ — แก้ตรงนี้เปลี่ยนทั้งแอป ไม่ใช่แค่ตรงที่ชี้ */
    var toks = tokensOf(selEl);
    bd.appendChild(el('div', 'rkt-gt', 'โทเคนที่ตรงนี้ใช้อยู่ (' + toks.length + ')'));
    if (!toks.length) {
      bd.appendChild(el('div', 'rkt-hint', 'ตรงนี้ไม่ได้ใช้ค่าจาก :root ตรงๆ (อาจ hardcode ไว้) ปรับด้วยช่องข้างบนแทนได้'));
    } else {
      bd.appendChild(el('div', 'rkt-hint', 'แก้ตรงนี้ = เปลี่ยนทั้งแอปทุกที่ที่ใช้โทเคนตัวนั้น ไม่ใช่แค่จุดที่ชี้'));
      toks.forEach(function (t) {
        var r = tokenRow(t.name, orig[t.name]);
        var lbl = r.querySelector('.rkt-n');
        if (lbl) { lbl.textContent = t.name + '  (' + t.role + ')'; lbl.title = t.name + ' — ' + t.role; }
        bd.appendChild(r);
      });
    }
  }

  function buildPos(bd) {
    var sw = el('button', 'rkt-b pri', 'สลับที่ 2 ใบ (แตะทีละใบ)');
    sw.onclick = function () {
      stopMode(); mode = 'swap'; document.body.classList.add('rkt-swapmode');
      toast('แตะใบแรก แล้วแตะใบที่จะสลับด้วย');
    };
    bd.appendChild(sw);
    bd.appendChild(el('div', 'rkt-note', 'สลับได้เฉพาะของที่อยู่ในกล่องเดียวกัน · ใช้กับการ์ดในลิสต์เดียวกันได้เลย'));

    if (!blocks.length) blocks = scanBlocks();
    bd.appendChild(el('div', 'rkt-gt', 'บล็อกใหญ่ (' + blocks.length + ')'));
    if (!blocks.length) {
      bd.appendChild(el('div', 'rkt-note', 'หน้านี้ยังไม่มี element ที่ติด data-tweak="ชื่อบล็อก" บอก Claude ให้ติดให้ก่อน'));
      return;
    }
    blocks.forEach(function (b, i) {
      var d = el('div', 'rkt-sec');
      d.appendChild(el('span', 'nm', (i+1) + '. ' + b.name));
      var up = el('button', 'rkt-mini', '↑'), dn = el('button', 'rkt-mini', '↓');
      var ey = el('button', 'rkt-mini' + (b.hidden ? ' off' : ''), '👁');
      up.onclick = function () { if (i > 0) { blocks.splice(i-1, 0, blocks.splice(i,1)[0]); applyBlocks(); rebuild(); } };
      dn.onclick = function () { if (i < blocks.length-1) { blocks.splice(i+1, 0, blocks.splice(i,1)[0]); applyBlocks(); rebuild(); } };
      ey.onclick = function () { b.hidden = !b.hidden; applyBlocks(); rebuild(); };
      d.appendChild(up); d.appendChild(dn); d.appendChild(ey);
      bd.appendChild(d);
    });
  }

  /* ─────────── แผง ─────────── */
  function rebuild() {
    if (!panel) return;
    var bd = panel.querySelector('.rkt-bd');
    bd.innerHTML = '';
    panel.querySelectorAll('.rkt-tb').forEach(function (b) {
      b.className = 'rkt-tb' + (b.dataset.t === tab ? ' on' : '');
    });
    if (tab === 'pick') buildCard(bd);
    else if (tab === 'tone') buildTone(bd);
    else buildPos(bd);
  }

  function open() {
    if (panel) { panel.style.display = 'flex'; return; }
    orig = readTokens();
    if (!Object.keys(orig).length) { toast('แอปนี้ยังไม่ได้ใช้ CSS variable ปรับไม่ได้'); return; }
    if (!document.getElementById('rk-tweak-style')) {
      var st = el('style'); st.id = 'rk-tweak-style'; st.textContent = CSS; document.head.appendChild(st);
    }

    panel = el('div', 'rkt d-' + dock);
    var hd = el('div', 'rkt-hd'); hd.appendChild(el('b', null, 'ปรับหน้าตา'));

    /* ย้ายกล่องไปมุมที่ไม่บังของที่กำลังดู */
    var dk = el('div', 'rkt-dk');
    [['left','◧','ชิดซ้าย'], ['right','◨','ชิดขวา'], ['bottom','▤','ด้านล่าง'],
     ['float','❐','ลอย'], ['min','—','ย่อ']].forEach(function (d) {
      var b = el('button', dock === d[0] ? 'on' : '', d[1]); b.title = d[2];
      b.onclick = function () {
        dock = d[0];
        panel.className = 'rkt d-' + dock;
        try { localStorage.setItem(DOCKKEY, dock); } catch (e) {}
        dk.querySelectorAll('button').forEach(function (q, i) {
          q.className = (['left','right','bottom','float','min'][i] === dock) ? 'on' : '';
        });
      };
      dk.appendChild(b);
    });
    hd.appendChild(dk);
    var x = el('button', 'rkt-x', '✕'); x.onclick = close; hd.appendChild(x);
    panel.appendChild(hd);

    var tabs = el('div', 'rkt-tabs');
    [['pick','ชี้แล้วปรับ'], ['tone','โทนรวม'], ['pos','ตำแหน่ง']].forEach(function (t) {
      var b = el('button', 'rkt-tb', t[1]); b.dataset.t = t[0];
      b.onclick = function () { stopMode(); tab = t[0]; rebuild(); };
      tabs.appendChild(b);
    });
    panel.appendChild(tabs);
    panel.appendChild(el('div', 'rkt-bd'));

    var ft = el('div', 'rkt-ft');
    var out = el('textarea'); out.className = 'rkt-out'; out.readOnly = true;
    out.placeholder = 'ปรับเสร็จแล้วกดปุ่มเขียวข้างบน ข้อความจะมาอยู่ตรงนี้';

    /* ปุ่มเดียวจบ: เขียนข้อตกลงลงตัวไฟล์ mockup เอง ไม่สร้างไฟล์ชื่อใหม่ */
    var b1 = el('button', 'rkt-b go', 'เสร็จแล้ว · เซฟลง mockup');
    b1.title = 'เขียนหน้าตาที่ปรับไว้ลงในไฟล์ mockup ตัวนี้เลย';
    b1.onclick = function () { saveLocal(true); saveSelf(out); };

    var help = el('div', 'rkt-note');
    help.innerHTML = 'กดปุ่มเขียว → เลือกทับไฟล์เดิม <b>' + selfName() + '</b> → กด Save<br>' +
      'แล้ว<b>พิมพ์บอก Claude ว่า "ปรับไว้แล้ว"</b> พอเลย ไม่ต้องก๊อปอะไร';
    var b2 = el('button', 'rkt-b', 'ดู CSS');
    b2.onclick = function () { out.value = cssText(); out.focus(); out.select(); };
    var b3 = el('button', 'rkt-b', 'คัดลอกแทน');
    b3.onclick = function () { copy(agreedBlockText(), out, 'คัดลอกแล้ว วางในแชท กด Ctrl+V'); };
    var b4 = el('button', 'rkt-b warn', 'ล้างทั้งหมด'); b4.onclick = resetAll;
    var bs = el('div', 'rkt-btns');
    [b2, b3, b4].forEach(function (b) { bs.appendChild(b); });
    ft.appendChild(b1); ft.appendChild(help); ft.appendChild(out); ft.appendChild(bs);
    panel.appendChild(ft);

    document.body.appendChild(panel);
    document.addEventListener('click', onPageClick, true);
    document.addEventListener('mouseover', onPageOver, true);
    rebuild();
  }
  function close() {
    stopMode();
    document.removeEventListener('click', onPageClick, true);
    document.removeEventListener('mouseover', onPageOver, true);
    if (panel) { panel.remove(); panel = null; }
  }

  W.RK.tweak = { open: open, close: close, css: cssText, agreed: agreedBlockText,
                 html: buildSelfHtml, save: function () { saveSelf(null); }, reset: resetAll };

  document.addEventListener('keydown', function (e) {
    if (e.ctrlKey && e.shiftKey && (e.key === 'T' || e.key === 't')) { e.preventDefault(); panel ? close() : open(); }
    if (e.key === 'Escape' && mode) { stopMode(); rebuild(); }
  });

  function boot() {
    orig = readTokens();
    blocks = scanBlocks();
    /* 1) ข้อตกลงที่ฝังไว้ในไฟล์ (ของจริงต้องสร้างตามนี้) */
    var tag = document.getElementById('rk-tweak-agreed');
    if (tag) { try { applyAgreement(JSON.parse(tag.textContent)); } catch (e) {} }
    /* 2) ของที่ยังลองอยู่ในเครื่องนี้ ทับข้อตกลงได้ */
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) applyAgreement(JSON.parse(raw));
    } catch (e) {}
    if (/[?&]tweak=1/.test(location.search)) open();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>

</body>
