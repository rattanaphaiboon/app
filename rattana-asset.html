<style>
:root{
  --navy:#0d1b3e;--navy-mid:#1a2f5e;--navy-light:#243b73;--gold:#c9a84c;--gold-light:#e8c86a;
  --success:#2ecc71;--danger:#e74c3c;--warning:#f39c12;--info:#3498db;
  --bg:#f4f6fb;--text:#0d1b3e;--card-bg:#fff;--border:#dde3f0;--muted:#6b7896;--row-alt:#fafbfd;
  --radius-sm:6px;--radius-md:12px;--radius-lg:16px;
  --shadow-sm:0 1px 4px rgba(0,0,0,.06);--shadow-md:0 2px 8px rgba(0,0,0,.08);--shadow-lg:0 8px 24px rgba(13,27,62,.12);--shadow-gold:0 4px 12px rgba(201,168,76,.35);
  --tint-gold:rgba(201,168,76,.12);
}
body.dark{--bg:#05080f;--text:#fff;--card-bg:#0d1b3e;--border:#1f3563;--muted:#b8c2dc;--row-alt:#0a1226;--tint-gold:rgba(201,168,76,.16)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Sarabun',sans-serif;font-size:14px;line-height:1.5;min-height:100dvh;overflow-x:hidden;background:var(--bg);color:var(--text);transition:background .25s,color .25s}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--text)}
.hidden{display:none!important}
.ti{line-height:1}

/* header */
.topbar{position:sticky;top:0;z-index:100}
header{background:var(--navy);color:#fff;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top));display:flex;align-items:center;gap:8px;border-bottom:3px solid var(--gold)}
.logo-text{font-weight:700;letter-spacing:1.5px;font-size:17px;color:#fff;white-space:nowrap}
.logo-text span{color:var(--gold)}
.ver{font-size:10px;color:rgba(255,255,255,.55);margin-left:2px}
.hspace{flex:1}
.icon-btn{color:#fff;border:1px solid rgba(255,255,255,.2);width:38px;height:38px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
.icon-btn:active{background:rgba(255,255,255,.15)}
.hub-btn{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:var(--radius-sm);padding:5px 10px;font-size:13px;font-weight:600;text-decoration:none;white-space:nowrap;min-height:38px}
@media(max-width:430px){.ver{display:none}.logo-text{font-size:15px;letter-spacing:.8px}header{gap:6px;padding-left:10px;padding-right:10px}.icon-btn{width:34px;height:34px;font-size:17px}.hub-btn{padding:5px 7px;min-height:34px}.hub-btn>span:last-child{display:none}}
@media(max-width:340px){#btnUser{display:none}}

cy27/Hy03yFaBj+KGAAAAAElFTkSuQmCC");background-size:cover;background-position:center;display:inline-block}
.tab-nav{display:flex;background:var(--navy);border-bottom:3px solid var(--gold);padding:0 8px;gap:4px;overflow-x:auto;scrollbar-width:none}
.tab-nav::-webkit-scrollbar{display:none}
.tab-btn{color:rgba(255,255,255,.65);padding:10px 16px;font-size:13.5px;font-weight:600;border-bottom:3px solid transparent;white-space:nowrap;margin-bottom:-3px;border-radius:var(--radius-sm) var(--radius-sm) 0 0;display:flex;align-items:center;gap:6px}
.tab-btn.active{color:var(--navy);background:var(--gold);border-bottom-color:var(--gold)}

.content{padding:12px;max-width:960px;margin:0 auto;width:100%;padding-bottom:calc(90px + env(safe-area-inset-bottom))}
@media(min-width:640px){.content{padding:16px 16px 90px}}

/* cards / stats */
.card{background:var(--card-bg);border-radius:var(--radius-md);border:1px solid var(--border);box-shadow:var(--shadow-sm)}
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
@media(min-width:640px){.stat-grid{grid-template-columns:repeat(4,1fr);gap:12px}}
.stat-card{background:var(--card-bg);border-radius:var(--radius-md);padding:10px 12px;border:1px solid var(--border);border-top:3px solid var(--gold);text-align:left;width:100%}
.stat-card .s-label{font-size:11.5px;color:var(--muted);font-weight:600}
.stat-card .s-value{font-size:22px;font-weight:700;line-height:1.2}
.stat-card.ok{border-top-color:var(--success)}.stat-card.ok .s-value{color:#1e8449}
.stat-card.warn{border-top-color:var(--warning)}.stat-card.warn .s-value{color:#a87800}
.stat-card.danger{border-top-color:var(--danger)}.stat-card.danger .s-value{color:#c0392b}
body.dark .stat-card.ok .s-value{color:#7be0a3}body.dark .stat-card.warn .s-value{color:#e8c86a}body.dark .stat-card.danger .s-value{color:#ff8a7e}
.stat-card.sel{outline:2px solid var(--gold)}

/* search */
.search-row{display:flex;gap:8px;margin-bottom:10px}
.search-wrap{position:relative;flex:1}
.search-input{width:100%;height:48px;border:1.5px solid var(--border);border-radius:24px;padding:0 40px 0 42px;background:var(--card-bg);outline:none}
.search-input:focus{border-color:var(--gold)}
.search-wrap .ti-search{position:absolute;left:15px;top:50%;transform:translateY(-50%);font-size:18px;color:var(--muted)}
.clear-btn{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;display:none;align-items:center;justify-content:center;color:var(--muted);font-size:18px}
.clear-btn.visible{display:flex}
.scan-btn{background:var(--navy);color:var(--gold);border-radius:24px;height:48px;padding:0 16px;display:flex;align-items:center;gap:6px;font-weight:700;font-size:14px;flex-shrink:0;box-shadow:var(--shadow-md)}
body.dark .scan-btn{border:1px solid var(--gold)}
.scan-btn .ti{font-size:22px}
.filters{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fsel{height:36px;border:1.5px solid var(--border);border-radius:18px;padding:0 10px;font-size:13.5px;background:var(--card-bg);flex-shrink:0;max-width:170px}
.fsel.on{border-color:var(--gold);background:var(--tint-gold);font-weight:600}
.listbar{display:flex;align-items:center;gap:8px;margin:4px 2px 8px;font-size:12.5px;color:var(--muted)}
.listbar .sp{flex:1}
.lnk{color:var(--text);font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:4px;padding:4px 6px;border-radius:6px}
.lnk:active{background:var(--tint-gold)}

/* asset rows */
.alist{display:flex;flex-direction:column;gap:6px}
.arow{background:var(--card-bg);border:1px solid var(--border);border-radius:10px;padding:8px 10px;display:flex;align-items:center;gap:10px;text-align:left;width:100%;min-height:60px}
.arow:active{background:var(--tint-gold)}
.arow.sel{border-color:var(--gold);box-shadow:0 0 0 1.5px var(--gold) inset}
.thumb{width:44px;height:44px;border-radius:8px;background:var(--tint-gold);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--gold);overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.arow .t{flex:1;min-width:0}
.arow .t .n{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arow .t .s{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.code{font-family:'Courier New',monospace;font-weight:700;letter-spacing:.3px}
.cb{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--muted);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:15px;color:transparent}
.arow.sel .cb{background:var(--gold);border-color:var(--gold);color:var(--navy)}
.more-btn{width:100%;padding:12px;margin-top:8px;border:1.5px dashed var(--border);border-radius:10px;font-weight:600;color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:40px 16px}
.empty .ti{font-size:42px;display:block;margin-bottom:8px;color:var(--gold)}

/* badges */
.badge{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:10px;font-size:11.5px;font-weight:600;white-space:nowrap}
.b-ok{background:#e8f7ee;color:#1e8449}.b-warn{background:#fef3d7;color:#a87800}.b-danger{background:#ffd5d0;color:#c0392b}.b-gray{background:#eceff5;color:#4a5570}.b-info{background:#e3f0fd;color:#1a6fb8}
body.dark .b-ok{background:#1a3a25;color:#7be0a3}body.dark .b-warn{background:#3a2e15;color:#e8c86a}body.dark .b-danger{background:#3a1a17;color:#ff8a7e}body.dark .b-gray{background:#1f2b45;color:#c9d2e8}body.dark .b-info{background:#14304d;color:#8cc4f5}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:10px;font-size:14px;font-weight:600;border:1.5px solid transparent;min-height:44px}
.btn:active{transform:scale(.97)}
.btn .ti{font-size:18px}
.btn-primary{background:var(--navy);color:#fff}
body.dark .btn-primary{background:var(--navy-light)}
.btn-gold{background:var(--gold);color:var(--navy)}
.btn-outline{background:var(--card-bg);border-color:var(--border)}
.btn-danger{background:var(--danger);color:#fff}
.btn-block{width:100%}
.btn:disabled{opacity:.5}
.big-btn{width:100%;background:var(--gold);color:var(--navy);border-radius:12px;padding:13px;font-weight:700;font-size:15.5px;display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;box-shadow:var(--shadow-gold)}
.big-btn .ti{font-size:22px}

/* detail */
.dhead{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px}
.dphoto{width:96px;height:96px;border-radius:12px;background:var(--tint-gold);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:40px;color:var(--gold);overflow:hidden;border:1px solid var(--border)}
.dphoto img{width:100%;height:100%;object-fit:cover}
.dtitle{font-size:18px;font-weight:700;line-height:1.3}
.dcode{font-size:15px;margin:2px 0 6px;color:var(--muted)}
.actions3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:12px}
.act{min-width:0;text-align:center;background:var(--card-bg);border:1px solid var(--border);border-radius:12px;padding:10px 4px;font-size:12.5px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:64px}
.act .ti{font-size:22px;color:var(--gold)}
.act.main{border:2px solid var(--gold);background:var(--tint-gold)}
.act:active{transform:scale(.97)}
.kv{display:grid;grid-template-columns:118px 1fr;row-gap:8px;column-gap:8px;padding:12px 14px;font-size:13.5px}
.kv .k{color:var(--muted)}
.kv .v{word-break:break-word}
.sec-title{font-size:12px;font-weight:700;color:var(--muted);margin:14px 2px 6px;letter-spacing:.3px;display:flex;align-items:center;gap:6px}
.tl{padding:6px 14px}
.tl-item{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px}
.tl-item:last-child{border-bottom:none}
.tl-item .when{color:var(--muted);font-size:12px}
.tl-item .tl-photo{width:54px;height:54px;border-radius:8px;object-fit:cover;flex-shrink:0;border:1px solid var(--border)}
.backbar{display:flex;align-items:center;gap:6px;margin:-2px 0 10px}

/* scanner */
.scan-status{background:var(--card-bg);border:1px solid var(--border);border-radius:10px;padding:10px 14px;margin-bottom:10px;font-size:13.5px;color:var(--muted);display:flex;align-items:center;gap:8px;min-height:44px}
.sdot{width:10px;height:10px;border-radius:50%;background:var(--muted);flex-shrink:0}
.sdot.loading{background:var(--gold);animation:pulse 1.2s ease-in-out infinite}.sdot.ok{background:var(--success)}.sdot.err{background:var(--danger)}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.85)}}
.scanner-wrap{background:#0a1430;border-radius:14px;overflow:hidden;margin-bottom:10px;position:relative;min-height:220px}
#qr-reader{width:100%;border:none!important}
#qr-reader video{width:100%!important;object-fit:cover;display:block}
#qr-reader img,#qr-reader__dashboard,#qr-reader__header_message{display:none!important}
.scanner-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:10}
.scanner-frame{width:min(280px,78%);aspect-ratio:1.6;position:relative}
.scanner-line{position:absolute;left:10px;right:10px;height:2px;background:var(--gold-light);animation:scanline 1.8s ease-in-out infinite}
@keyframes scanline{0%{top:6%}50%{top:92%}100%{top:6%}}
.scan-corner{position:absolute;width:22px;height:22px;border-color:var(--gold-light);border-style:solid;border-width:0}
.sc-tl{top:-2px;left:-2px;border-top-width:3px;border-left-width:3px;border-top-left-radius:6px}
.sc-tr{top:-2px;right:-2px;border-top-width:3px;border-right-width:3px;border-top-right-radius:6px}
.sc-bl{bottom:-2px;left:-2px;border-bottom-width:3px;border-left-width:3px;border-bottom-left-radius:6px}
.sc-br{bottom:-2px;right:-2px;border-bottom-width:3px;border-right-width:3px;border-bottom-right-radius:6px}
.scanner-controls{display:flex;gap:8px;margin-bottom:10px}
.torch-btn{background:var(--navy-mid);color:var(--gold-light);border:2px solid rgba(240,192,64,.3);border-radius:10px;padding:0 16px;font-weight:600;display:none;align-items:center;gap:6px;min-height:46px}
.torch-btn.on{background:#a07830;border-color:var(--gold-light)}
.manual-row{display:flex;gap:8px;margin-bottom:10px}
.manual-row input{flex:1;min-width:0}
.count-live{display:flex;align-items:center;gap:10px;padding:10px 14px;margin-bottom:10px}
.count-live .big{font-size:22px;font-weight:700}

/* progress */
.bar{height:10px;background:var(--border);border-radius:5px;overflow:hidden}
.bar>div{height:100%;background:var(--success);transition:width .3s}
.seg{display:flex;background:var(--border);border-radius:10px;padding:3px;gap:2px}
.seg button{flex:1;padding:8px 4px;border-radius:8px;font-size:13px;font-weight:500;color:var(--muted);min-height:38px}
.seg button.on{background:var(--card-bg);color:var(--text);font-weight:700;box-shadow:var(--shadow-sm)}

/* forms */
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field>label{font-size:12px;font-weight:700;color:var(--muted)}
.input{height:46px;padding:0 12px;border-radius:10px;border:1.5px solid var(--border);background:var(--card-bg);outline:none;width:100%}
.input:focus{border-color:var(--gold)}
textarea.input{height:auto;min-height:80px;padding:10px 12px;resize:vertical;line-height:1.45}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.chip{border:1.5px solid var(--border);border-radius:10px;padding:10px 4px;text-align:center;background:var(--card-bg);font-size:13.5px;font-weight:500;min-height:44px}
.chip.on{border-color:var(--gold);background:var(--tint-gold);font-weight:700}
.photo-pick{display:flex;align-items:center;gap:10px}
.photo-box{width:64px;height:64px;border:1.5px dashed var(--gold);border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--gold);font-size:26px;overflow:hidden;flex-shrink:0;background:var(--card-bg)}
.photo-box img{width:100%;height:100%;object-fit:cover}
.hint{font-size:12px;color:var(--muted)}
.err-text{color:var(--danger);font-size:13px;margin-top:4px}
.sw{position:relative;width:44px;height:26px;flex-shrink:0}
.sw input{opacity:0;width:0;height:0}
.sw span{position:absolute;inset:0;background:var(--border);border-radius:13px;transition:.2s}
.sw span::after{content:'';position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s;box-shadow:var(--shadow-sm)}
.sw input:checked+span{background:var(--gold)}
.sw input:checked+span::after{left:21px}
.optrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);font-size:14px}
.optrow:last-child{border-bottom:none}
.stepper{display:flex;align-items:center;border:1.5px solid var(--border);border-radius:10px;overflow:hidden}
.stepper button{width:38px;height:36px;font-size:18px}
.stepper span{min-width:30px;text-align:center;font-weight:700}

/* searchable dropdown */
.dd{position:relative}
.dd-trigger{width:100%;min-height:46px;padding:8px 12px;background:var(--card-bg);border:1.5px solid var(--border);border-radius:10px;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:15px}
.dd-trigger .ph{color:var(--muted)}
.dd-panel{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--card-bg);border:1.5px solid var(--border);border-radius:10px;z-index:600;box-shadow:var(--shadow-lg);max-height:280px;display:none;flex-direction:column}
.dd.open .dd-panel{display:flex}
.dd-search{padding:10px 12px;border:none;border-bottom:1px solid var(--border);background:transparent;outline:none;border-radius:10px 10px 0 0}
.dd-list{overflow-y:auto;flex:1;list-style:none;padding:4px 0}
.dd-list li{padding:9px 12px;cursor:pointer;font-size:14.5px;line-height:1.3}
.dd-list li small{display:block;color:var(--muted);font-size:12px}
.dd-list li:hover,.dd-list li.cur{background:var(--tint-gold)}
.dd-list li.none{color:var(--muted);cursor:default;font-style:italic}

/* modal (bottom sheet on phone) */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(13,27,62,.6);z-index:9000;align-items:flex-end;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:var(--bg);border-radius:18px 18px 0 0;width:100%;max-width:560px;max-height:94dvh;display:flex;flex-direction:column;border-top:4px solid var(--gold);animation:slideUp .22s ease}
@media(min-width:640px){.modal-overlay{align-items:center;padding:16px}.modal{border-radius:16px}}
.modal-head{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--border);background:var(--card-bg);border-radius:16px 16px 0 0}
.modal-head h3{font-size:16px;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.modal-close{width:36px;height:36px;border-radius:8px;font-size:22px;color:var(--muted);display:flex;align-items:center;justify-content:center}
.modal-body{padding:14px 16px;overflow-y:auto;flex:1}
.modal-foot{padding:10px 16px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--border);display:flex;gap:8px;background:var(--card-bg)}
.modal-foot .btn{flex:1}
@keyframes slideUp{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}

/* selection bar */
.selbar{position:fixed;left:0;right:0;bottom:0;z-index:150;background:var(--navy);color:#fff;padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:8px;border-top:3px solid var(--gold)}
.selbar .cnt{font-weight:700;flex:1}
.selbar .btn{min-height:40px;padding:8px 12px}
.selbar .btn-outline{background:transparent;border-color:rgba(255,255,255,.3);color:#fff}
.fab{position:fixed;right:16px;bottom:calc(20px + env(safe-area-inset-bottom));z-index:140;width:56px;height:56px;border-radius:50%;background:var(--gold);color:var(--navy);font-size:28px;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-gold)}

/* label preview */
.lp-wrap{background:#e3e8f3;border-radius:12px;padding:16px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;overflow:hidden;margin-bottom:12px}
body.dark .lp-wrap{background:#1a2440}
.lp-stage{position:relative}
.lp-nav{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--muted)}
.lp-nav button{width:32px;height:32px;border-radius:8px;border:1px solid var(--border);background:var(--card-bg);font-size:16px}

/* labels (mm) — shared by preview + print */
.lbl{background:#fff;color:#000;overflow:hidden;display:flex;font-family:'Sarabun',sans-serif;line-height:1.15;border:0.3mm solid #0d1b3e;border-radius:1.2mm;position:relative}
.lbl .qr svg{display:block;width:100%;height:100%}
.lbl .l{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:space-between}
.lbl .top{display:flex;align-items:center;gap:1mm;border-bottom:0.35mm solid #c9a84c}
.lbl .top img{display:block;flex-shrink:0}
.lbl .co b{display:block;font-weight:700;color:#0d1b3e}
.lbl .lcode{font-family:'Courier New',monospace;font-weight:700;color:#0d1b3e;white-space:nowrap;overflow:hidden;letter-spacing:.1mm}
.lbl .info{color:#222;overflow:hidden}
.lbl .info .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.lbl .warn{color:#c0392b;font-weight:700;white-space:nowrap;overflow:hidden}
.lbl .qcol{display:flex;flex-direction:column;align-items:center;justify-content:center}
.lbl .qcap{color:#444}
.lbl-60{width:60mm;height:40mm;padding:1.8mm 1.8mm 1.8mm 2.2mm;gap:1.5mm}
.lbl-60 .top{padding-bottom:.8mm}.lbl-60 .top img{width:6mm;height:6mm}.lbl-60 .co{font-size:2.2mm}.lbl-60 .co b{font-size:2.6mm}
.lbl-60 .lcode{font-size:4.3mm}.lbl-60 .info{font-size:2.5mm}.lbl-60 .info .nm{font-size:2.8mm}.lbl-60 .warn{font-size:2mm}
.lbl-60 .qcol{width:26mm;border-left:0.3mm dashed #c9a84c;padding-left:1.4mm}.lbl-60 .qr{width:24.5mm;height:24.5mm}.lbl-60 .qcap{font-size:1.9mm;margin-top:.4mm}
.lbl-100{width:100mm;height:50mm;padding:3mm 3mm 3mm 3.5mm;gap:2.5mm}
.lbl-100 .top{padding-bottom:1.2mm}.lbl-100 .top img{width:9mm;height:9mm}.lbl-100 .co{font-size:3mm}.lbl-100 .co b{font-size:3.6mm}
.lbl-100 .lcode{font-size:6.6mm}.lbl-100 .info{font-size:3.3mm}.lbl-100 .info .nm{font-size:3.8mm}.lbl-100 .warn{font-size:2.7mm}
.lbl-100 .qcol{width:40mm;border-left:0.35mm dashed #c9a84c;padding-left:2.2mm}.lbl-100 .qr{width:37mm;height:37mm}.lbl-100 .qcap{font-size:2.4mm;margin-top:.6mm}
.lbl-40{width:40mm;height:25mm;padding:1.3mm;gap:1.2mm;flex-direction:row-reverse}
.lbl-40 .qcol{width:18.5mm}.lbl-40 .qr{width:18.5mm;height:18.5mm}.lbl-40 .qcap{display:none}
.lbl-40 .top{border-bottom:none;padding-bottom:0}.lbl-40 .top img{width:3.6mm;height:3.6mm}.lbl-40 .co{font-size:1.7mm}.lbl-40 .co b{font-size:1.9mm}
.lbl-40 .lcode{font-size:2.55mm;letter-spacing:0}.lbl-40 .co b{white-space:nowrap;font-size:1.75mm}.lbl-40 .info{font-size:1.75mm}.lbl-40 .info .nm{font-size:1.9mm;white-space:normal;max-height:4.4mm}.lbl-40 .warn{font-size:1.5mm;white-space:normal}

/* toast / spinner / back to top */
#toastBox{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom));z-index:9999;display:flex;flex-direction:column;gap:6px;align-items:center;width:max-content;max-width:92vw;pointer-events:none}
.toast{padding:11px 18px;border-radius:12px;color:#fff;font-weight:500;box-shadow:var(--shadow-lg);font-size:14px;animation:slideUp .25s ease;text-align:center}
.toast-success{background:#1e8449}.toast-error{background:var(--danger)}.toast-warning{background:var(--warning);color:var(--navy)}.toast-info{background:var(--navy-mid);border-left:3px solid var(--gold)}
#spinner{display:none;position:fixed;inset:0;background:rgba(13,27,62,.55);align-items:center;justify-content:center;z-index:99999}
#spinner.show{display:flex}
.spinner-box{background:var(--card-bg);border-radius:16px;padding:28px 36px;text-align:center;border-top:4px solid var(--gold);min-width:220px}
.spinner-ring{width:46px;height:46px;border:5px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
#loadingBar{position:fixed;top:0;left:0;height:3px;background:var(--gold);width:0;transition:width .4s;z-index:10000}
#backToTop{position:fixed;bottom:calc(86px + env(safe-area-inset-bottom));right:16px;background:var(--gold);color:var(--navy);border-radius:50%;width:44px;height:44px;display:none;align-items:center;justify-content:center;box-shadow:var(--shadow-gold);z-index:90;font-size:20px}
#backToTop.show{display:flex}

/* login */
#loginScreen{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--navy)}
.login-card{background:var(--card-bg);border-radius:18px;padding:28px 22px;width:100%;max-width:380px;text-align:center;border-top:4px solid var(--gold)}
.login-card h1{font-size:22px;letter-spacing:1px}
.login-card h1 span{color:var(--gold)}
#gsiBtn{display:flex;justify-content:center;margin:18px 0 8px;min-height:44px}

/* print */
#printArea{display:none}
@media print{
  body{background:#fff!important}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important}
  .a4page{width:210mm;height:297mm;display:grid;page-break-after:always;break-after:page;overflow:hidden}
  .a4page:last-child{page-break-after:auto;break-after:auto}
  .a4page .lbl{border-color:#ddd}
  .rollpage{page-break-after:always;break-after:page;display:flex}
  .rollpage:last-child{page-break-after:auto}
  .rollpage .lbl{border:none;border-radius:0}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
<style id="pageStyle"></style>

const $ = id => document.getElementById(id);

const norm = s => String(s || '').toLowerCase().replace(/\s+/g, ' ').trim();
function lsGet(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function parseDate(v) {
  if (!v) return null;
  if (v instanceof Date) return isNaN(v) ? null : v;
  const s = String(v).trim();
  if (/^\d{4}-\d{2}-\d{2}/.test(s)) { const d = new Date(s); return isNaN(d) ? null : d; }
  const m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})(?:\s+(\d{1,2}):(\d{2}))?/);
  if (m) { // ชีตเป็น M/D/YYYY (Glide) — ถ้าตัวแรก > 12 ถือเป็น D/M
    let a = +m[1], b = +m[2], y = +m[3]; if (y > 2400) y -= 543;
    const [mo, d] = a > 12 ? [b, a] : [a, b];
    return new Date(y, mo - 1, d, +(m[4] || 0), +(m[5] || 0));
  }
  const d = new Date(s); return isNaN(d) ? null : d;
}
function fmtDate(v) { const d = parseDate(v); if (!d) return v ? esc(v) : '-'; return `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}/${d.getFullYear() + 543}`; }
function fmtTime(v) { const d = parseDate(v); if (!d) return ''; return `${String(d.getHours()).padStart(2, '0')}.${String(d.getMinutes()).padStart(2, '0')}`; }
function fmtDT(v) { const d = parseDate(v); return d ? `${fmtDate(d)} ${fmtTime(d)}` : (v ? esc(v) : '-'); }
function normSt(raw) {
  const s = String(raw || '').trim();
  if (!s) return 'ใช้งาน';
  if (STATUS[s]) return s;
  if (/ซ่อม/.test(s)) return 'ส่งซ่อม';
  if (/รอจำหน่าย|รอขาย|รอตัด/.test(s)) return 'รอจำหน่าย';
  if (/จำหน่าย|ขายแล้ว|ตัดบัญชี/.test(s)) return 'จำหน่ายแล้ว';
  if (/หาย|สูญ/.test(s)) return 'หาย';

}

/* =====================================================================
 * API — โหมดทดลอง → DemoServer, โหมดจริง → Google Apps Script
 * ===================================================================== */
const READ_ACTIONS = ['sync', 'history', 'countList', 'countRound'];
async function api(action, payload = {}, { silent = false } = {}) {
  if (!silent) setLoading(true);
  try {
    if (DEMO) {
      await new Promise(r => setTimeout(r, 180));
      try { return JSON.parse(JSON.stringify(DemoServer.call(action, payload))); }
      catch (e) { throw Object.assign(new Error(e.message), { code: e.code }); }
    }
    const tk = getIdToken();
    if (!tk) { showLogin(); throw Object.assign(new Error('กรุณาเข้าสู่ระบบ'), { code: 'AUTH' }); }
    const text = JSON.stringify({ action, payload, idToken: tk });
    const tries = READ_ACTIONS.includes(action) || action === 'countScan' ? 3 : 1; // countScan กันซ้ำฝั่งเซิร์ฟเวอร์แล้ว
    let j = null, lastErr = null;
    for (let i = 0; i < tries && !j; i++) {
      if (i) await new Promise(r => setTimeout(r, 800 * i));
      try {
        const res = await fetch(CONFIG.GAS_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: text });
        const raw = await res.text();
        try { j = JSON.parse(raw); } catch (_) { lastErr = Object.assign(new Error(`เซิร์ฟเวอร์ Google ไม่ตอบสนอง (HTTP ${res.status})`), { code: 'NETWORK' }); }
      } catch (_) { lastErr = Object.assign(new Error('เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ กรุณาตรวจสอบอินเทอร์เน็ต'), { code: 'NETWORK' }); }
    }
    if (!j) { if (tries === 1) lastErr.message += ' — การบันทึกอาจยังไม่สำเร็จ กรุณารีเฟรชแล้วตรวจสอบก่อนทำซ้ำ'; throw lastErr; }
    if (!j.ok) {
      const e = Object.assign(new Error(j.error || 'เกิดข้อผิดพลาด'), { code: j.code });
      if (e.code === 'AUTH' || e.code === 'NO_USER') { sessionStorage.removeItem(TOKEN_KEY); showLogin(e.message); }
      throw e;
    }
    return j.data;
  } finally { if (!silent) setLoading(false); }
}

/* ---------------- auth (Google ID token + Hub SSO hint) ---------------- */
function decodeJwtPayload(token) {
  let b64 = String(token || '').split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
  b64 += '='.repeat((4 - b64.length % 4) % 4);
  const bin = atob(b64), bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return JSON.parse(new TextDecoder('utf-8').decode(bytes));
}
function getIdToken() { try { const o = JSON.parse(sessionStorage.getItem(TOKEN_KEY)); if (o && o.exp - 60000 > Date.now()) return o.t; } catch (e) {} return null; }
function checkRattanaSession() { try { const p = JSON.parse(localStorage.getItem('rattana_session')); return p && p.data && p.data.email && Date.now() < p.exp ? p.data : null; } catch (e) { return null; } }
function loadGsi() {
  return new Promise((res, rej) => {
    if (window.google && google.accounts) return res();
    const s = document.createElement('script'); s.src = 'https://accounts.google.com/gsi/client'; s.async = true;
    s.onload = res; s.onerror = () => rej(new Error('โหลด Google Sign-In ไม่สำเร็จ กรุณาตรวจสอบอินเทอร์เน็ต')); document.head.appendChild(s);
  });
}
function showScreen(login) { $('appScreen').classList.toggle('hidden', login); $('loginScreen').classList.toggle('hidden', !login); }
async function showLogin(msg) {
  showScreen(true); $('loginError').textContent = msg || '';
  try {
    await loadGsi();
    const hub = checkRattanaSession();
    google.accounts.id.initialize({ client_id: CONFIG.GOOGLE_CLIENT_ID, callback: onCredential, auto_select: true, login_hint: hub ? hub.email : undefined, cancel_on_tap_outside: false });
    google.accounts.id.renderButton($('gsiBtn'), { theme: 'outline', size: 'large', text: 'signin_with', locale: 'th' });
    google.accounts.id.prompt();
  } catch (e) { $('loginError').textContent = e.message; }
}
async function onCredential(r) {
  try {
    const p = decodeJwtPayload(r.credential);
    sessionStorage.setItem(TOKEN_KEY, JSON.stringify({ t: r.credential, exp: p.exp * 1000 }));
    showScreen(false); await loadAll(true);
  } catch (e) { $('loginError').textContent = e.message || 'เข้าสู่ระบบไม่สำเร็จ'; }
}
function logout() {
  sessionStorage.removeItem(TOKEN_KEY);

  location.href = location.pathname;
}

  const tab = view === 'count' || view === 'round' || (view === 'scan' && S.scanMode === 'count') ? 'count' : 'home';
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));

  window.scrollTo(0, 0);
}
function goBack() {
  if ($('modal').classList.contains('open')) { closeModal(); return; }
  const prev = S.stack.pop();
  if (!prev) { show('home', false); renderHome(); return; }

  S._keepQ = false;

function openModal(title, body, foot, onClose) {

function closeModal(fromBtn) {

/** dropdown ค้นหาได้: items = [{v, t, s}] */
function makeDD(host, items, value, placeholder, onChange) {
  host.className = 'dd';
  const cur = items.find(i => i.v === value);
  host.innerHTML = `<button type="button" class="dd-trigger"><span class="${cur ? '' : 'ph'}">${esc(cur ? cur.t : (value || placeholder))}</span><i class="ti ti-chevron-down"></i></button>
    <div class="dd-panel"><input class="dd-search" placeholder="ค้นหา..." autocomplete="off"><ul class="dd-list"></ul></div>`;
  const list = host.querySelector('.dd-list'), inp = host.querySelector('.dd-search'), trig = host.querySelector('.dd-trigger');
  const draw = q => {
    const w = norm(q).split(' ').filter(Boolean);
    const hits = items.filter(i => !w.length || w.every(x => norm(i.t + ' ' + (i.s || '') + ' ' + i.v).includes(x))).slice(0, 150);
    list.innerHTML = hits.length ? hits.map(i => `<li data-v="${esc(i.v)}">${esc(i.t)}${i.s ? `<small>${esc(i.s)}</small>` : ''}</li>`).join('') : '<li class="none">ไม่พบ</li>';
  };
  trig.onclick = () => { const o = host.classList.toggle('open'); document.querySelectorAll('.dd.open').forEach(d => d !== host && d.classList.remove('open')); if (o) { inp.value = ''; draw(''); setTimeout(() => inp.focus(), 30); } };
  inp.oninput = () => draw(inp.value);
  list.onclick = e => { const li = e.target.closest('li[data-v]'); if (!li) return; const it = items.find(i => i.v === li.dataset.v); host.classList.remove('open'); trig.firstElementChild.textContent = it.t; trig.firstElementChild.className = ''; onChange(it.v, it); };
  return host;
}
document.addEventListener('click', e => { if (!e.target.closest('.dd')) document.querySelectorAll('.dd.open').forEach(d => d.classList.remove('open')); });
const empItems = () => [{ v: '', t: '— ไม่ระบุ —' }].concat(S.emps.map(e => ({ v: e.code, t: `${e.name}${e.nick ? ' (' + e.nick + ')' : ''}`, s: `${e.code} · ${e.wh}${e.dept ? ' · ' + e.dept : ''}${e.pos ? ' · ' + e.pos : ''}` })));

function labelHtml(a, o) {
  const sz = o.size.split('x')[0];
  const name = a.type || '';
  const place = [a.wh, a.pos].filter(Boolean).join(' · ');
  const warn = o.warn ? `ห้ามแกะ ห้ามลอก${o.phone ? ' · แจ้ง ' + o.phone : ''}` : '';
  const top = o.logo ? `<div class="top"><img src="${LOGO}" alt=""><div class="co"><b>ทรัพย์สินบริษัท</b>รัตนไพบูลย์</div></div>` : `<div class="top"><div class="co"><b>ทรัพย์สินบริษัท รัตนไพบูลย์</b></div></div>`;
  const info = o.info ? `<div class="info"><span class="nm">${esc(name)}</span>${sz !== '40' ? `${esc(place)}<br>ลงทะเบียน ${fmtDate(a.date)}` : esc(a.wh || '')}</div>` : '<div></div>';
  // ย่อฟอนต์รหัสให้พอดีความกว้างช่อง (Courier กว้าง ~0.62 ของความสูงฟอนต์)
  const code = a.code || '-', room = { 40: 17, 60: 27.5, 100: 50 }[sz], base = { 40: 2.6, 60: 4.3, 100: 6.6 }[sz], ls = sz === '40' ? 0 : 0.1;
  const fs = Math.min(base, (room / code.length - ls) / 0.62).toFixed(2);
  return `<div class="lbl lbl-${sz}"><div class="l">${top}<div class="lcode" style="font-size:${fs}mm">${esc(code)}</div>${info}${warn ? `<div class="warn">${esc(warn)}</div>` : ''}</div>
    <div class="qcol"><div class="qr">${qrSvg(assetUrl(a))}</div><div class="qcap">สแกนดูข้อมูล</div></div></div>`;
}

  const c = roundCalc(), pct = c.expected.length ? Math.round(c.found.length / c.expected.length * 100) : 0;
  const lists = { missing: c.missing, wrong: c.wrong, found: c.found };
  const cur = lists[S.roundSeg];
  $('vRound').innerHTML = `
    <div class="backbar"><button class="lnk" onclick="backBtn()"><i class="ti ti-arrow-left"></i> รอบตรวจนับ</button></div>
    <div class="card" style="padding:12px 14px;margin-bottom:10px">
      <div style="display:flex;align-items:center;gap:8px"><b style="flex:1;font-size:16px">${esc(r.name)}</b><span class="badge ${r.status === 'open' ? 'b-info' : 'b-gray'}">${r.status === 'open' ? 'กำลังนับ' : 'ปิดรอบแล้ว'}</span></div>
      <div style="display:flex;justify-content:space-between;margin:8px 0 6px"><span style="font-weight:700">นับแล้ว ${c.found.length} / ${c.expected.length}</span><span style="font-weight:700;color:#1e8449">${pct}%</span></div>
      <div class="bar"><div style="width:${pct}%"></div></div>
      <div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap"><span class="badge b-ok">พบตรงที่ ${c.found.length}</span><span class="badge b-warn">พบผิดที่ ${c.wrong.length}</span><span class="badge b-danger">ยังไม่พบ ${c.missing.length}</span></div>
      <div class="hint" style="margin-top:6px">คลัง ${esc(r.wh)} · เริ่ม ${fmtDT(r.at)} โดย ${esc(r.by)}${r.closedAt ? ` · ปิด ${fmtDT(r.closedAt)}` : ''}</div>
    </div>
    ${r.status === 'open' && canStatus() ? `<button class="big-btn" id="rScan" style="margin-bottom:6px"><i class="ti ti-scan"></i> สแกนต่อเนื่อง</button><p class="hint" style="text-align:center;margin-bottom:10px">สแกนรัวได้ ไม่ต้องกดกลับ · บันทึกเวลาและพิกัดทุกชิ้น</p>` : ''}
    <div class="seg" id="rSeg" style="margin-bottom:10px"><button data-k="missing">ยังไม่พบ (${c.missing.length})</button><button data-k="wrong">ผิดที่ (${c.wrong.length})</button><button data-k="found">พบแล้ว (${c.found.length})</button></div>
    <div class="alist" id="rList">${cur.length ? cur.slice(0, 300).map(a => `<button class="arow" data-id="${esc(a.id)}">${thumbHtml(a)}<div class="t"><div class="n">${esc(a.type)}</div><div class="s"><span class="code">${esc(a.code)}</span>${S.roundSeg === 'wrong' ? ` · ในระบบอยู่ ${esc(a.wh || '-')}` : (a.pos ? ' · ' + esc(a.pos) : '')}${a.rn ? ' · ' + esc(a.rn) : ''}</div></div>${S.roundSeg === 'wrong' && canStatus() ? `<span class="badge b-warn" data-move="${esc(a.id)}">ย้ายเข้า ${esc(r.wh)}</span>` : stBadge(a)}</button>`).join('') : `<div class="empty"><i class="ti ti-mood-smile"></i>ไม่มีรายการ</div>`}</div>
    ${cur.length > 300 ? `<p class="hint" style="padding:8px">แสดง 300 จาก ${cur.length} รายการ — ดูทั้งหมดใน Excel</p>` : ''}
    <div style="display:flex;gap:8px;margin-top:14px">
      <button class="btn btn-outline" style="flex:1" id="rExport"><i class="ti ti-file-spreadsheet"></i> Export</button>
      ${r.status === 'open' && canStatus() ? `<button class="btn btn-primary" style="flex:1" id="rClose"><i class="ti ti-lock"></i> ปิดรอบ</button>` : ''}
    </div>`;
  $('rSeg').querySelectorAll('button').forEach(b => { b.classList.toggle('on', b.dataset.k === S.roundSeg); b.onclick = () => { S.roundSeg = b.dataset.k; renderRound(); }; });
  $('rList').onclick = e => {
    const mv = e.target.closest('[data-move]');
    if (mv) { e.stopPropagation(); moveToRound(S.byId.get(mv.dataset.move)); return; }
    const b = e.target.closest('.arow'); if (b && S.byId.has(b.dataset.id)) openDetail(b.dataset.id);
  };
  if ($('rScan')) $('rScan').onclick = () => openScanner('count');
  if ($('rClose')) $('rClose').onclick = closeRound;
  $('rExport').onclick = () => exportRound(c);
}
async function moveToRound(a) {
  if (!a || !confirm(`ย้าย ${a.code} จากคลัง ${a.wh || '-'} เข้าคลัง ${S.round.wh}?`)) return;
  showSpinner('กำลังย้าย...');
  try { const row = await api('updateStatus', { id: a.id, r: a.r, status: a.stn === 'อื่นๆ' ? a.st : a.stn, wh: S.round.wh, note: `พบระหว่าง${S.round.name}` }); upsert(row); showToast(`ย้าย ${a.code} เข้า ${S.round.wh} แล้ว`, 'success'); renderRound(); }
  catch (e) { showToast(e.message, 'error'); } finally { hideSpinner(); }
}
async function closeRound() {
  const c = roundCalc();
  if (!confirm(`ปิดรอบ "${S.round.name}"?\nพบ ${c.found.length}/${c.expected.length} · ยังไม่พบ ${c.missing.length} · ผิดที่ ${c.wrong.length}\nปิดแล้วสแกนเพิ่มไม่ได้`)) return;
  showSpinner('กำลังปิดรอบ...');
  try { await api('countClose', { id: S.round.id }); S.round.status = 'closed'; S.round.closedAt = new Date().toISOString(); showToast('ปิดรอบแล้ว', 'success'); renderRound(); }
  catch (e) { showToast(e.message, 'error'); } finally { hideSpinner(); }
}

function loadXlsx() {
  return new Promise((res, rej) => { if (window.XLSX) return res(); const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; s.onload = res; s.onerror = () => rej(new Error('โหลดตัวสร้าง Excel ไม่สำเร็จ')); document.head.appendChild(s); });
}
const xRow = a => ({ 'รหัสทรัพย์สิน': a.code, 'ประเภท': a.type, 'หมวด': a.cat, 'คลัง': a.wh, 'ตำแหน่ง': a.pos, 'ที่เก็บ': a.store, 'รหัสผู้รับผิดชอบ': a.resp, 'ผู้รับผิดชอบ': a.rn, 'ชื่อเล่น': a.rk, 'สถานะ': a.st || 'ใช้งาน', 'วันที่จัดทำ': fmtDate(a.date), 'ใช้มาแล้ว': a.age, 'อายุการใช้งาน(ปี)': a.life, 'คงเหลือ': a.remain, 'ทะเบียนรถ': a.car, 'รายละเอียด': a.det, 'แถวในชีต': a.r });
async function exportExcel() {
  const list = S.selMode && S.sel.size ? S.filtered.filter(a => S.sel.has(a.id)) : S.filtered;
  if (!list.length) { showToast('ไม่มีรายการให้ Export', 'warning'); return; }
  try { showSpinner('กำลังสร้าง Excel...'); await loadXlsx(); const ws = XLSX.utils.json_to_sheet(list.map(xRow)), wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'ทรัพย์สิน'); XLSX.writeFile(wb, `Rattana Asset ${fmtDate(new Date()).replace(/\//g, '-')}.xlsx`); }
  catch (e) { showToast(e.message, 'error'); } finally { hideSpinner(); }
}
async function exportRound(c) {
  try {
    showSpinner('กำลังสร้าง Excel...'); await loadXlsx();
    const scanBy = new Map(S.roundScans.map(s => [s.id, s])), wb = XLSX.utils.book_new();
    const add = (name, arr, extra) => XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(arr.length ? arr.map(a => ({ ...xRow(a), ...(extra ? extra(a) : {}) })) : [{ 'ไม่มีรายการ': '' }]), name);
    const sc = a => { const s = scanBy.get(a.id); return { 'สแกนเมื่อ': s ? fmtDT(s.t) : '', 'สแกนโดย': s ? s.by : '' }; };
    add('ยังไม่พบ', c.missing); add('ผิดที่', c.wrong, sc); add('พบแล้ว', c.found, sc);
    XLSX.writeFile(wb, `${S.round.name}.xlsx`);
  } catch (e) { showToast(e.message, 'error'); } finally { hideSpinner(); }
}

/* =====================================================================
 * DEMO SERVER — ใช้เมื่อยังไม่ได้ใส่ GAS_URL (ข้อมูลตัวอย่างจากโครงสร้างชีตจริง)
 * ===================================================================== */
const DemoServer = (() => {
  const types = [['ตู้เย็น', 'A', 'A-101-001', 10], ['แอร์', 'A', 'A-101-002', 8], ['โน๊ตบุ๊ค Acer', 'A', 'A-101-005', 3], ['คอมพิวเตอร์ HP', 'A', 'A-101-010', 5], ['เครื่องสำรองไฟ', 'A', 'A-101-012', 3], ['กล้องวงจรปิด', 'A', 'A-101-013', 10], ['พัดลม', 'A', 'A-101-014', 5], ['ไมโครเวฟ', 'A', 'A-101-020', 5],
    ['เก้าอี้มีพนักพิง', 'B', 'B-201-003', 5], ['เครื่องปริ้น', 'B', 'B-201-014', 5], ['เครื่องปริ้นแบบเข็ม', 'B', 'B-201-015', 5], ['วิทยุสื่อสาร(แดง)', 'B', 'B-201-036', 5], ['เครื่องสแกนบาร์โค้ดเช็คสต๊อก', 'C', 'C-301-025', 3], ['ถังดับเพลิง', 'D', 'D-401-002', 5]]
    .map(([name, cat, id, life]) => ({ name, cat, id, life }));
  const emps = [['W1020101', 'W1', 'ธุรการ', 'สุภาพร รอดสังวาลย์', 'เกด'], ['W1040201', 'W1', 'คลัง', 'กฤตนัน เจตโพธิ์', 'จักร'], ['W2040201', 'W2', 'คลัง', 'ธนากร เขียวหวาน', 'โอ๋'], ['W2030302', 'W2', 'บัญชี', 'ยุพา บุญเรืองรอด', 'กล้วย'],
    ['W3020101', 'W3', 'ธุรการ', 'ประยงค์ ทวีผล', 'ออม'], ['W4040201', 'W4', 'คลัง', 'จตุพร ปิ่นเจริญพร', 'มิ้นท์'], ['C4100103', 'C4', 'หน้าร้าน', 'ศศินิภา นิลยา', 'ปาล์ม'], ['C4100308', 'C4', 'หน้าร้าน', 'อำภา ยอดแสง', 'แพน'], ['HQ010203', 'HQ', 'บริหาร', 'พีรพัฒน์ รัตนไพบูลย์', 'คุณพีท']]
    .map(([code, wh, dept, name, nick]) => ({ code, wh, dept, pos: '', name, nick }));
  const whs = ['W1', 'W2', 'W3', 'W4', 'C4'], poss = ['คลัง', 'หน้าร้าน', 'ออฟฟิต1', 'ออฟฟิต2', 'ห้องใจรัก'], sts = ['', '', '', '', '', '', '', '', '', 'ชำรุด', 'ส่งซ่อม', 'หาย'];
  let seed = 7; const rnd = n => { seed = (seed * 9301 + 49297) % 233280; return Math.floor(seed / 233280 * n); };
  const rid = () => { let s = ''; const c = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789'; for (let i = 0; i < 22; i++) s += c[rnd(c.length)]; return s; };
  const cnt = {}, rows = [];
  const mk = (t, wh, pos, resp, date, st, det) => {
    const key = t.name + wh + t.id; cnt[key] = (cnt[key] || 0) + 1;
    const e = emps.find(x => x.code === resp) || {};
    return [rows.length + 2, rid(), `${wh}${t.id}${cnt[key]}`, t.name, t.name, '', pos, '', date, 'พัชชา รักสนอง', wh, '', resp, e.name || '', e.nick || '', det || '', '', st, t.id, t.cat, '1 ปี 2 เดือน 3 วัน', String(t.life), '', st ? '5/10/2026' : ''];
  };
  for (let i = 0; i < 180; i++) {
    const t = types[rnd(types.length)], wh = whs[rnd(whs.length)], e = emps.filter(x => x.wh === wh), resp = e.length ? e[rnd(e.length)].code : '';
    const d = new Date(2023 + rnd(4), rnd(12), 1 + rnd(27));
    rows.push(mk(t, wh, poss[rnd(poss.length)], resp, d.toISOString(), sts[rnd(sts.length)], i % 9 === 0 ? 'S/N : 8080' + (6400 + i) + '\nที่ซื้อ : บจก. ตัวอย่าง' : ''));
  }
  const log = [], rounds = [], scans = [];
  const me = { email: 'demo@rattanaphaiboon.com', name: 'ผู้ทดลองใช้', role: 8, wh: 'W1', empId: '' };
  const K = ['r', 'id', 'code', 'type', 'tc', 'to', 'pos', 'img', 'date', 'by', 'wh', 'car', 'resp', 'rn', 'rk', 'det', 'store', 'st', 'tcode', 'cat', 'age', 'life', 'remain', 'dmg'];
  const ix = k => K.indexOf(k), find = id => rows.find(r => r[1] === id);
  const err = (m, c) => Object.assign(new Error(m), { code: c });
  const addLog = (r, action, from, to, detail, note, photo) => log.push({ id: r[1], t: new Date().toISOString(), action, from, to, detail, note, photo: photo || '', by: me.name });
  return {
    call(action, p) {
      switch (action) {
        case 'sync': return { keys: K, rows, types, emps, me, serverTime: new Date().toISOString() };
        case 'history': return log.filter(l => l.id === p.id).reverse();
        case 'updateStatus': {
          const r = find(p.id); if (!r) throw err('ไม่พบ', 'NOT_FOUND');
          const old = r[ix('st')] || 'ใช้งาน', ns = p.status === 'ใช้งาน' ? '' : p.status, ch = [];
          [['wh', 'คลัง'], ['pos', 'ตำแหน่ง'], ['store', 'ที่เก็บ'], ['resp', 'ผู้รับผิดชอบ']].forEach(([k, l]) => { if (p[k] != null && p[k] !== r[ix(k)]) { ch.push(`${l}: ${r[ix(k)] || '-'} → ${p[k] || '-'}`); r[ix(k)] = p[k]; } });
          const e = emps.find(x => x.code === r[ix('resp')]); r[ix('rn')] = e ? e.name : ''; r[ix('rk')] = e ? e.nick : '';
          r[ix('st')] = ns; addLog(r, ns !== (old === 'ใช้งาน' ? '' : old) ? 'เปลี่ยนสถานะ' : 'อัปเดตข้อมูล', old, ns || 'ใช้งาน', ch.join(' · '), p.note, p.photo);
          return r;
        }
        case 'editAsset': {
          const r = find(p.id); const ch = [];
          Object.entries(p.fields).forEach(([k, v]) => { if (k === 'photo') { r[ix('img')] = v; ch.push('เปลี่ยนรูป'); } else { ch.push(`${k}: ${r[ix(k)] || '-'} → ${v || '-'}`); r[ix(k)] = v; } });
          if (p.fields.tc) r[ix('type')] = p.fields.tc === 'อื่นๆ' ? r[ix('to')] : p.fields.tc;
          const e = emps.find(x => x.code === r[ix('resp')]); r[ix('rn')] = e ? e.name : ''; r[ix('rk')] = e ? e.nick : '';
          addLog(r, 'แก้ไขข้อมูล', '', '', ch.join(' · ')); return r;
        }
        case 'addAssets': {
          const t = types.find(x => x.name === p.tc) || { name: p.to || p.tc, cat: '', id: '', life: p.life }, out = [];
          for (let i = 0; i < p.qty; i++) { const r = mk(t, p.wh, p.pos, p.resp, new Date().toISOString(), '', p.det); r[ix('store')] = p.store; r[ix('car')] = p.car; r[ix('img')] = p.photo || ''; r[ix('by')] = me.name; rows.push(r); out.push(r); addLog(r, 'เพิ่มทรัพย์สิน', '', 'ใช้งาน', 'คลัง ' + p.wh); }
          return out;
        }
        case 'logPrint': p.ids.forEach(x => { const r = find(x.id); if (r) addLog(r, 'พิมพ์ป้าย', '', '', p.note); }); return { logged: p.ids.length };
        case 'countList': return rounds.map(r => ({ ...r, ok: scans.filter(s => s.round === r.id && s.res === 'ok').length, wrong: scans.filter(s => s.round === r.id && s.res === 'wrong').length })).reverse();
        case 'countRound': return scans.filter(s => s.round === p.id);
        case 'countCreate': { const r = { id: 'CR' + Date.now(), name: p.name, wh: p.wh, at: new Date().toISOString(), by: me.name, status: 'open', total: rows.filter(x => x[ix('wh')] === p.wh).length, ok: 0, wrong: 0 }; rounds.push(r); return r; }
        case 'countScan': { const d = scans.find(s => s.round === p.round && s.id === p.id); if (d) return { ...d, dup: true }; const r = rounds.find(x => x.id === p.round); const s = { round: p.round, id: p.id, code: p.code, t: new Date().toISOString(), by: me.name, res: p.wh === r.wh ? 'ok' : 'wrong', wh: p.wh }; scans.push(s); return s; }
        case 'countClose': { const r = rounds.find(x => x.id === p.id); r.status = 'closed'; r.closedAt = new Date().toISOString(); return { ok: true }; }
      }
      throw err('ไม่รู้จักคำสั่ง ' + action, 'BAD_ACTION');
    }
  };
})();
