<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- ไอคอนแอป "Rattana HR Chat" — ฟองแชทสีครีม (พนักงานทัก) + ฟองทอง (HR ตอบ) + เครื่องหมายถูก (ตอบแล้ว)
       พื้นเต็มกรอบ (iOS/Android ตัดมุมเอง) · ของสำคัญอยู่ในวงกลมรัศมี 205 (safe zone ของ maskable) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b3a78"/>
      <stop offset="1" stop-color="#0d1b3e"/>
    </linearGradient>
    <linearGradient id="gd" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8c86a"/>
      <stop offset="1" stop-color="#c9a84c"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- ฟองพนักงาน (ซ้ายบน) -->
  <path d="M96 128 a40 40 0 0 1 40 -40 h176 a40 40 0 0 1 40 40 v88 a40 40 0 0 1 -40 40 h-120 l-52 42 v-42 h-4 a40 40 0 0 1 -40 -40 z" fill="#f7f3e8"/>
  <circle cx="160" cy="172" r="15" fill="#0d1b3e"/>
  <circle cx="224" cy="172" r="15" fill="#0d1b3e"/>
  <circle cx="288" cy="172" r="15" fill="#0d1b3e"/>
  <!-- ฟอง HR (ขวาล่าง) -->
  <path d="M168 264 a40 40 0 0 1 40 -40 h168 a40 40 0 0 1 40 40 v92 a40 40 0 0 1 -40 40 h-4 v46 l-56 -46 h-108 a40 40 0 0 1 -40 -40 z" fill="url(#gd)"/>
  <text x="292" y="336" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" font-weight="900" font-size="86" fill="#0d1b3e">HR</text>
  <!-- ถูก = ตอบแล้ว -->
  <circle cx="392" cy="232" r="44" fill="#2ecc71" stroke="#0d1b3e" stroke-width="10"/>
  <path d="M372 233 l14 14 l26 -28" fill="none" stroke="#ffffff" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
