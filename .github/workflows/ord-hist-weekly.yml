name: Weekly order history (dq-ord-hist.json)

# ประวัติลำดับร้านที่คนขับวิ่งจริง (GPS Cartrack + D-MAN) สำหรับ delivery-queue-app
# ทุกวันจันทร์ 05:00 น. (เวลาไทย) = อาทิตย์ 22:00 UTC · กด Run workflow เองได้
on:
  schedule:
    - cron: '0 22 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: ord-hist
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build dq-ord-hist.json
        env:
          PYTHONIOENCODING: utf-8
        run: python tools/build_ord_hist.py
      - name: Commit if changed
        id: commit
        run: |
          if git diff --quiet -- dq-ord-hist.json; then
            echo "ไม่มีอะไรเปลี่ยน"; echo "changed=0" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dq-ord-hist.json
          git commit -m "auto: อัปเดตประวัติลำดับร้านวิ่งจริง (dq-ord-hist.json) รายสัปดาห์"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 10; done
          echo "changed=1" >> "$GITHUB_OUTPUT"
      # push จาก GITHUB_TOKEN ไม่ปลุก workflow อื่น → สั่ง deploy หน้าเว็บเอง
      - name: Deploy Pages
        if: steps.commit.outputs.changed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main
