<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- ไอคอนแอป "โซนรับผิดชอบ" (Rattana Zone) — หมุดโซนสีทอง + เครื่องหมายถูก + ประกายสะอาด
       พื้นเต็มกรอบ (iOS/Android ตัดมุมเอง) · ของสำคัญอยู่ในวงกลมรัศมี 205 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b3a78"/>
      <stop offset="1" stop-color="#0d1b3e"/>
    </linearGradient>
    <linearGradient id="pin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2d47c"/>
      <stop offset="1" stop-color="#c9a84c"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- กรอบโซน (เส้นประ) -->
  <ellipse cx="256" cy="392" rx="150" ry="44" fill="none" stroke="#e8c86a" stroke-width="10" stroke-dasharray="26 18" opacity=".85"/>
  <ellipse cx="256" cy="392" rx="70" ry="18" fill="#0a1430" opacity=".55"/>
  <!-- หมุด -->
  <path d="M256 392 C214 330 150 272 150 200 A106 106 0 0 1 362 200 C362 272 298 330 256 392 Z" fill="url(#pin)"/>
  <circle cx="256" cy="200" r="68" fill="#0d1b3e"/>
  <!-- เครื่องหมายถูก -->
  <path d="M222 202 L248 228 L294 176" fill="none" stroke="#2ecc71" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- ประกายสะอาด -->
  <path d="M392 96 L401 122 L427 131 L401 140 L392 166 L383 140 L357 131 L383 122 Z" fill="#ffffff"/>
  <path d="M128 112 L134 128 L150 134 L134 140 L128 156 L122 140 L106 134 L122 128 Z" fill="#ffffff" opacity=".8"/>
</svg>
