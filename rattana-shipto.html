<!doctype html>
<html lang="th" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F4F7FB">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Rattana ShipTo v1.0</title>
  <link rel="stylesheet" href="https://rattanaphaiboon.github.io/app/rattana-ui/rattana-ui.css">
  <script src="https://rattanaphaiboon.github.io/app/rattana-ui/rattana-ui.js" defer></script>
  <style>
    [hidden]{display:none!important}
    .stack{display:flex;flex-direction:column;gap:16px;padding-bottom:24px}
    .chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
    .chips::-webkit-scrollbar{display:none}
    .chips .rt-chip{flex:0 0 auto}
    .grid{grid-template-columns:repeat(auto-fill,minmax(min(100%,170px),1fr))}
    @media(max-width:520px){.grid{grid-template-columns:1fr 1fr;gap:10px}.grid .rt-product{padding:10px}.grid .rt-stepper button{width:30px;height:30px}.grid .rt-stepper output{min-width:22px}}
    .rt-product .meta{font-size:12px;color:var(--text-muted);margin:-4px 0 2px}
    .rt-product-media .noimg{display:grid;place-items:center;width:100%;height:100%;color:var(--text-muted);font-size:12px}
    .unit-row{display:flex;gap:6px;align-items:center;justify-content:space-between}
    .cart-bar{position:sticky;bottom:calc(12px + var(--safe-bottom));z-index:20}
    .cart-line{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
    .cart-line img,.cart-line .ph{width:48px;height:48px;object-fit:contain;border-radius:10px;background:var(--field);flex:0 0 48px}
    .cart-line .grow{flex:1;min-width:0}
    .cart-line .qtys{display:flex;flex-direction:column;gap:4px;align-items:flex-end}
    .cart-line .qtys label{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--text-muted)}
    .cart-line .rt-stepper button{width:30px;height:30px}
    .head-row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
    .deny{max-width:440px;margin:12vh auto 0;padding:28px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
    .count-note{font-size:12px;color:var(--text-muted)}
  </style>
</head>
<body class="rt-app" data-rt-login="Rattana ShipTo" data-rt-app-glyph="cart" data-rt-app-tone="navy">
  <script>
    // ทดสอบบนเครื่องตัวเอง (localhost เท่านั้น): ?as=อีเมล → ข้ามหน้าเข้าสู่ระบบ Google (ต้องรันก่อน rattana-ui.js)
    window.TEST_AS = /^(localhost|127\.0\.0\.1)$/.test(location.hostname) ? new URLSearchParams(location.search).get('as') : null;
    if (window.TEST_AS) document.body.removeAttribute('data-rt-login');
  </script>
  <div class="rt-bg"><div class="rt-bg-arc"></div><div class="rt-bg-arc"></div></div>
  <main class="rt-container rt-page stack">
    <header class="rt-glass rt-topbar rt-sticky-top">
      <a class="rt-app-brand" href="./"><span><b>Rattana ShipTo</b><small>v1.0</small></span></a>
      <div class="rt-topbar-end">
        <button class="rt-btn rt-btn-glass rt-btn-icon" id="btnRefresh" type="button" aria-label="โหลดข้อมูลใหม่"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5"/></svg></button>
        <button class="rt-btn rt-btn-glass rt-btn-icon" data-rt-theme-toggle aria-label="สลับธีม"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg></button>
        <button data-rt-user></button>
      </div>
    </header>

    <!-- ไม่มีสิทธิ์ -->
    <section class="rt-glass deny" id="deny" hidden>
      <span class="rt-tile rt-tile-red rt-tile-lg"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a10 10 0 1 0 0 20a10 10 0 1 0 0-20M4.9 4.9l14.2 14.2"/></svg></span>
      <h1 class="rt-h3" style="margin:0">ไม่มีสิทธิ์ใช้แอปนี้</h1>
      <p class="rt-body-sm rt-muted" style="margin:0">อีเมล <b id="denyEmail"></b> ไม่อยู่ในชีท Set คอลัมน์ E-mail<br>ติดต่อผู้ดูแลเพื่อเพิ่มสิทธิ์</p>
      <button class="rt-btn rt-btn-glass" id="btnDenyOut" type="button">ออกจากระบบ</button>
    </section>

    <div id="app" hidden class="stack" style="padding:0">
      <div class="rt-page-head">
        <div class="rt-date"><span class="rt-date-main"><span data-rt-date="long"></span></span><span class="rt-date-dot"></span><span class="rt-caption" id="vendorCap">กำลังโหลด…</span></div>
        <div class="head-row">
          <h1 class="rt-h1" style="margin:0" id="pageTitle">สินค้าของฉัน</h1>
          <div class="rt-seg" role="group" aria-label="หน้า" id="seg" style="--n:2"><button type="button" aria-pressed="true" data-v="shop">สินค้า</button><button type="button" aria-pressed="false" data-v="hist">ประวัติ</button></div>
        </div>
      </div>

      <!-- สินค้า -->
      <section id="vShop" class="stack" style="padding:0">
        <label class="rt-search" data-rt-scan>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 3a8 8 0 1 0 0 16a8 8 0 1 0 0-16M21 21l-4.3-4.3"/></svg>
          <input type="search" id="q" placeholder="ค้นหาชื่อสินค้า / บาร์โค้ด">
        </label>
        <div class="chips" id="chips"></div>
        <div class="count-note" id="countNote"></div>
        <div class="rt-grid-products grid" id="grid">
          <div class="rt-skeleton" style="height:280px"></div><div class="rt-skeleton" style="height:280px"></div><div class="rt-skeleton" style="height:280px"></div>
        </div>
      </section>

      <!-- ประวัติ -->
      <section id="vHist" hidden>
        <section class="rt-card rt-table-card">
          <header><div><div class="rt-caption" id="histCap"></div><h2 class="rt-h4">ออเดอร์ของฉัน</h2></div>
            <button class="rt-btn rt-btn-glass rt-btn-sm" id="btnExportAll" type="button">Excel ทั้งหมด</button></header>
          <div class="rt-table-wrap"><table class="rt-table" style="min-width:520px">
            <thead><tr><th>เลขที่ / วันที่</th><th>ลูกค้า</th><th class="rt-right">ยอดรวม</th><th>สถานะ</th></tr></thead>
            <tbody id="histBody"></tbody>
          </table></div>
        </section>
      </section>

      <div class="rt-actions rt-glass cart-bar" id="cartBar" hidden>
        <div class="rt-actions-info"><span class="rt-cell-main" id="cartSum"></span><span class="rt-cell-sub">ราคา S00 · ยังไม่รวมส่วนลด</span></div>
        <button class="rt-btn rt-btn-glass" id="btnClear" type="button">ล้าง</button>
        <button class="rt-btn rt-btn-gold" id="btnCart" type="button">ดูตะกร้า</button>
      </div>
    </div>
  </main>

<script>
/* ================= CONFIG ================= */
const CONFIG = {
  setSheetId:  '1xxjHIPHIZVJUhIyMxdWoT-VSs4Fw9ko9CcZ1gC2GZcU',  // ชีท Set: CAT VENDOR · ชื่อเซลล์ · E-mail
  pddtSheetId: '16mYDqAqqJma-_0vCIAajy6bcjdOZ7F6VagxkdkqAB2I',  // ชีท PDDT: สินค้า
  priceTier:   'S00',                                            // ราคาที่ใช้: PRICE S00 EA / PRICE S00 CS
  orderEndpoint: '',   // URL Apps Script Web App (apps-script/Code.gs) — ว่าง = เก็บออเดอร์ไว้ในเครื่องอย่างเดียว
  cacheMinutes: 5,
};
const APP_VERSION = '1.0';

/* ================= Sheets ================= */
const gviz = (id, sheet, tq) => `https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:csv&headers=1&sheet=${encodeURIComponent(sheet)}` + (tq ? `&tq=${encodeURIComponent(tq)}` : '');
function parseCsv(text) {
  if (!text) return [];
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch; }
    else if (ch === '"') q = true;
    else if (ch === ',') { row.push(cell); cell = ''; }
    else if (ch === '\r') {}
    else if (ch === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += ch;
  }
  if (cell.length || row.length) { row.push(cell); rows.push(row); }
  if (!rows.length) return [];
  const clean = s => String(s || '').replace(/[​‌‍﻿]/g, '').replace(/ /g, ' ').trim();
  const headers = rows[0].map(clean);
  return rows.slice(1).filter(r => r.some(c => clean(c))).map(r => Object.fromEntries(headers.map((k, i) => [k, clean(r[i])])));
}
const fetchText = async url => { const r = await fetch(url); if (!r.ok) throw new Error('โหลดชีทไม่ได้ (' + r.status + ')'); return r.text(); };
const normEmail = s => String(s || '').replace(/[​‌‍﻿\s]/g, '').toLowerCase();
const colLetter = i => { let s = ''; i++; while (i) { const r = (i - 1) % 26; s = String.fromCharCode(65 + r) + s; i = Math.floor((i - 1) / 26); } return s; };
const num = v => { const n = parseFloat(String(v || '').replace(/,/g, '')); return isNaN(n) ? 0 : n; };
const imgUrl = u => { const m = String(u || '').match(/[?&]id=([\w-]+)/) || String(u || '').match(/\/d\/([\w-]+)/); return m ? `https://lh3.googleusercontent.com/d/${m[1]}=w600` : ''; };

async function loadSet() {
  const rows = parseCsv(await fetchText(gviz(CONFIG.setSheetId, 'Set')));
  return rows.map(r => ({ vendor: r['CAT VENDOR'], sales: r['ชื่อเซลล์'], email: normEmail(r['E-mail']) })).filter(r => r.vendor && r.email);
}
/** PDDT กรองตาม CAT VENDOR ฝั่ง Google (ไม่โหลดทั้งชีท) · หาคอลัมน์จากชื่อหัว ไม่ใช่ตำแหน่ง */
async function loadProducts(vendors) {
  const head = await fetchText(gviz(CONFIG.pddtSheetId, 'PDDT', 'select * limit 0'));
  const headers = Object.keys(parseCsv(head.trim() + '\n"x"')[0] || {});
  const idx = headers.indexOf('CAT VENDOR');
  if (idx < 0) throw new Error('ไม่พบคอลัมน์ CAT VENDOR ในชีท PDDT');
  const L = colLetter(idx);
  const where = vendors.map(v => `${L}='${v.replace(/'/g, "\\'")}'`).join(' or ');
  const rows = parseCsv(await fetchText(gviz(CONFIG.pddtSheetId, 'PDDT', `select * where ${where}`)));
  const t = CONFIG.priceTier;
  return rows.map(r => ({
    name: r['PRODUCT NAME'], img: imgUrl(r['SKU_USAGE']),
    codeEA: String(r['CODE EA'] || ''), codeCS: String(r['CODE CS'] || ''),
    unitEA: r['UNIT EA'] || '', unitCS: r['UNIT CS'] || '',
    perCS: num(r['QTY CS']) || num(((r['UNIT CS'] || '').match(/x(\d+)/) || [])[1]) || 1,
    priceEA: num(r[`PRICE ${t} EA`]), priceCS: num(r[`PRICE ${t} CS`]),
    group: r['CAT GROUP'] || 'อื่นๆ', brand: r['CAT BRAND'] || '', vendor: r['CAT VENDOR'],
  })).filter(p => p.name).map((p, i) => ({ ...p, key: p.codeEA || p.codeCS || 'row' + i }));
}

/* ================= State ================= */
const S = { me: null, vendors: [], products: [], byKey: {}, group: 'ทั้งหมด', q: '', view: 'shop', cart: {}, customer: '', note: '' };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const money = n => RattanaUI.formatMoney(n);
const LS = { cart: () => 'rs-cart-' + S.me.email, orders: () => 'rs-orders-' + S.me.email, prod: () => 'rs-prod-' + S.vendors.join('|') };
const csPrice = p => p.priceCS || p.priceEA * p.perCS;
const lineTotal = (p, c) => (c.ea || 0) * p.priceEA + (c.cs || 0) * csPrice(p);
const cartKeys = () => Object.keys(S.cart).filter(k => S.byKey[k] && (S.cart[k].ea || S.cart[k].cs));
const cartTotal = () => cartKeys().reduce((s, k) => s + lineTotal(S.byKey[k], S.cart[k]), 0);
const saveCart = () => localStorage.setItem(LS.cart(), JSON.stringify({ cart: S.cart, customer: S.customer, note: S.note }));
const getOrders = () => { try { return JSON.parse(localStorage.getItem(LS.orders())) || []; } catch { return []; } };

/* ================= Render: สินค้า ================= */
function stepper(key, u, v) {
  return `<div class="rt-stepper"><button type="button" data-k="${esc(key)}" data-u="${u}" data-d="-1" aria-label="ลด">−</button><output>${v || 0}</output><button type="button" data-k="${esc(key)}" data-u="${u}" data-d="1" aria-label="เพิ่ม">+</button></div>`;
}
function renderShop() {
  const q = S.q.toLowerCase();
  const list = S.products.filter(p => (S.group === 'ทั้งหมด' || p.group === S.group) &&
    (!q || p.name.toLowerCase().includes(q) || p.codeEA.includes(q) || p.codeCS.includes(q) || p.brand.toLowerCase().includes(q)));
  $('countNote').textContent = `แสดง ${list.length} จาก ${S.products.length} รายการ`;
  $('grid').innerHTML = list.length ? list.map(p => {
    const c = S.cart[p.key] || {};
    return `<article class="rt-glass rt-lift rt-product">
      <div class="rt-product-media">${p.img ? `<img src="${p.img}" alt="${esc(p.name)}" loading="lazy">` : '<span class="noimg">ไม่มีรูป</span>'}
        ${(c.ea || c.cs) ? '<span class="rt-badge rt-badge-gold">ในตะกร้า</span>' : ''}</div>
      <h3 class="rt-product-name">${esc(p.name)}</h3>
      <div class="meta">${esc(p.codeEA || p.codeCS)} · ${esc(p.unitCS || p.unitEA)}</div>
      <div class="rt-price-row"><span class="rt-price">${p.priceEA ? money(p.priceEA) : '—'}</span><span class="rt-caption">/ชิ้น${p.priceCS ? ' · ลัง ' + money(p.priceCS) : ''}</span></div>
      <div class="unit-row"><span class="rt-caption">ลัง</span>${stepper(p.key, 'cs', c.cs)}</div>
      <div class="unit-row"><span class="rt-caption">ชิ้น</span>${stepper(p.key, 'ea', c.ea)}</div>
    </article>`;
  }).join('') : '<div class="rt-empty" style="grid-column:1/-1;padding:40px 0;text-align:center">ไม่พบสินค้าที่ค้นหา</div>';
  renderCartBar();
}
function renderCartBar() {
  const keys = cartKeys();
  $('cartBar').hidden = !keys.length || S.view !== 'shop';
  $('cartSum').textContent = `${keys.length} รายการ · ${money(cartTotal())}`;
}

/* ================= ตะกร้า ================= */
function cartBodyHtml() {
  const keys = cartKeys();
  if (!keys.length) return '<p class="rt-body-sm rt-muted">ตะกร้าว่าง</p>';
  return keys.map(k => { const p = S.byKey[k], c = S.cart[k]; return `
    <div class="cart-line">${p.img ? `<img src="${p.img}" alt="">` : '<span class="ph"></span>'}
      <div class="grow"><div class="rt-cell-main">${esc(p.name)}</div><div class="rt-cell-sub">${money(lineTotal(p, c))}</div></div>
      <div class="qtys"><label>ลัง ${stepper(k, 'cs', c.cs)}</label><label>ชิ้น ${stepper(k, 'ea', c.ea)}</label></div>
    </div>`; }).join('') + `<div class="rt-actions-info" style="margin-top:12px"><span class="rt-cell-main">รวม ${money(cartTotal())}</span><span class="rt-cell-sub">${keys.length} รายการ · ราคา ${CONFIG.priceTier}</span></div>`;
}
function openCart() {
  RattanaUI.popup({
    icon: 'gold', title: 'ตะกร้าสินค้า',
    content: `
      <label class="rt-field"><span class="rt-label">ลูกค้า / Ship-to <span class="rt-req">*</span></span><input class="rt-input" id="fCustomer" placeholder="ชื่อร้าน หรือรหัสลูกค้า" value="${esc(S.customer)}"></label>
      <label class="rt-field" style="margin-top:8px"><span class="rt-label">หมายเหตุ</span><input class="rt-input" id="fNote" placeholder="เช่น ส่งก่อน 10 โมง" value="${esc(S.note)}"></label>
      <div id="cartBody" style="margin-top:8px">${cartBodyHtml()}</div>`,
    actions: [{ label: 'ปิด', variant: 'glass', value: false }, { label: 'ส่งออเดอร์', variant: 'gold', value: true }],
  }).then(ok => { if (ok) submitOrder(); });
}

/* ================= ส่งออเดอร์ ================= */
async function submitOrder() {
  const keys = cartKeys();
  if (!keys.length) return RattanaUI.toast('ตะกร้าว่าง', { type: 'warning' });
  if (!S.customer.trim()) { RattanaUI.toast('กรุณาใส่ชื่อลูกค้า / Ship-to', { type: 'warning' }); return openCart(); }
  const now = new Date(), pad = n => String(n).padStart(2, '0');
  const order = {
    orderNo: `SO${now.getFullYear()}${pad(now.getMonth() + 1)}${pad(now.getDate())}-${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}-${S.me.empId || 'X'}`,
    createdAt: now.toISOString(), salesEmail: S.me.email, salesName: S.me.sales, empId: S.me.empId || '',
    customer: S.customer.trim(), note: S.note.trim(), priceTier: CONFIG.priceTier, appVersion: APP_VERSION,
    lines: keys.map(k => { const p = S.byKey[k], c = S.cart[k]; return {
      codeEA: p.codeEA, codeCS: p.codeCS, name: p.name, vendor: p.vendor, cs: c.cs || 0, ea: c.ea || 0,
      priceEA: p.priceEA, priceCS: csPrice(p), total: lineTotal(p, c) }; }),
  };
  order.total = order.lines.reduce((s, l) => s + l.total, 0);
  order.status = 'local';
  if (CONFIG.orderEndpoint) {
    try {
      // text/plain = ไม่ต้อง preflight กับ Apps Script
      const r = await fetch(CONFIG.orderEndpoint, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(order) });
      const j = await r.json().catch(() => ({}));
      order.status = j.ok ? 'sent' : 'failed';
    } catch { order.status = 'failed'; }
  }
  const orders = getOrders(); orders.unshift(order); localStorage.setItem(LS.orders(), JSON.stringify(orders));
  S.cart = {}; S.customer = ''; S.note = ''; saveCart(); renderShop();
  if (order.status === 'failed') RattanaUI.alert({ type: 'warning', title: 'ส่งเข้าระบบไม่สำเร็จ', message: `เก็บออเดอร์ ${order.orderNo} ไว้ในเครื่องแล้ว ส่งซ้ำได้จากหน้าประวัติ` });
  else RattanaUI.toast(`บันทึกออเดอร์ ${order.orderNo} แล้ว`, { type: 'success' });
}
async function resend(no) {
  const orders = getOrders(), o = orders.find(x => x.orderNo === no);
  if (!o || !CONFIG.orderEndpoint) return;
  try {
    const r = await fetch(CONFIG.orderEndpoint, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(o) });
    o.status = (await r.json()).ok ? 'sent' : 'failed';
  } catch { o.status = 'failed'; }
  localStorage.setItem(LS.orders(), JSON.stringify(orders)); renderHist();
  RattanaUI.toast(o.status === 'sent' ? 'ส่งสำเร็จ' : 'ยังส่งไม่ได้', { type: o.status === 'sent' ? 'success' : 'error' });
}

/* ================= ประวัติ ================= */
const STATUS = {
  sent:   '<span class="rt-badge rt-badge-success">✓ ส่งแล้ว</span>',
  local:  '<span class="rt-badge rt-badge-info">● เก็บในเครื่อง</span>',
  failed: '<span class="rt-badge rt-badge-danger">! ส่งไม่สำเร็จ</span>',
};
function renderHist() {
  const orders = getOrders().sort((a, b) => b.createdAt.localeCompare(a.createdAt));
  $('histCap').textContent = `${orders.length} ออเดอร์ · ใหม่สุดอยู่บน`;
  $('histBody').innerHTML = orders.length ? orders.map(o => `<tr data-no="${esc(o.orderNo)}" style="cursor:pointer">
    <td><div class="rt-cell-main">${esc(o.orderNo)}</div><div class="rt-cell-sub">${RattanaUI.formatDate(new Date(o.createdAt), 'short')} ${RattanaUI.formatTime(new Date(o.createdAt))}</div></td>
    <td><div class="rt-cell-main">${esc(o.customer)}</div><div class="rt-cell-sub">${o.lines.length} รายการ${o.note ? ' · ' + esc(o.note) : ''}</div></td>
    <td class="rt-right rt-cell-main">${money(o.total)}</td>
    <td>${STATUS[o.status] || ''}</td></tr>`).join('')
    : '<tr><td colspan="4"><div class="rt-empty" style="padding:32px;text-align:center">ยังไม่มีออเดอร์</div></td></tr>';
}
function showOrder(no) {
  const o = getOrders().find(x => x.orderNo === no); if (!o) return;
  const actions = [{ label: 'ปิด', variant: 'glass', value: '' }, { label: 'Excel', variant: 'glass', value: 'xls' }];
  if (o.status !== 'sent' && CONFIG.orderEndpoint) actions.push({ label: 'ส่งซ้ำ', variant: 'gold', value: 'resend' });
  RattanaUI.popup({
    title: o.orderNo,
    content: `<p class="rt-body-sm" style="margin:0 0 8px"><b>${esc(o.customer)}</b><br><span class="rt-muted">${RattanaUI.formatDate(new Date(o.createdAt), 'long')} ${RattanaUI.formatTime(new Date(o.createdAt))}${o.note ? ' · ' + esc(o.note) : ''}</span></p>
      ${o.lines.map(l => `<div class="cart-line"><div class="grow"><div class="rt-cell-main">${esc(l.name)}</div><div class="rt-cell-sub">${l.cs ? l.cs + ' ลัง ' : ''}${l.ea ? l.ea + ' ชิ้น' : ''}</div></div><b class="rt-num">${money(l.total)}</b></div>`).join('')}
      <div class="rt-actions-info" style="margin-top:12px"><span class="rt-cell-main">รวม ${money(o.total)}</span>${STATUS[o.status] || ''}</div>`,
    actions,
  }).then(v => { if (v === 'xls') exportExcel([o]); if (v === 'resend') resend(no); });
}

/* ================= Excel ================= */
function loadXlsx() {
  if (window.XLSX) return Promise.resolve();
  return new Promise((ok, no) => { const s = document.createElement('script'); s.src = 'https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js'; s.onload = ok; s.onerror = () => no(new Error('โหลดตัวสร้าง Excel ไม่ได้')); document.head.appendChild(s); });
}
async function exportExcel(orders) {
  if (!orders.length) return RattanaUI.toast('ยังไม่มีออเดอร์', { type: 'warning' });
  try {
    await loadXlsx();
    const rows = orders.flatMap(o => o.lines.map(l => ({
      'เลขที่': o.orderNo, 'วันที่': RattanaUI.formatDate(new Date(o.createdAt), 'short'), 'เวลา': RattanaUI.formatTime(new Date(o.createdAt)),
      'เซลล์': o.salesName, 'ลูกค้า/Ship-to': o.customer, 'หมายเหตุ': o.note,
      'CODE EA': l.codeEA, 'CODE CS': l.codeCS, 'PRODUCT NAME': l.name, 'ลัง': l.cs, 'ชิ้น': l.ea,
      'ราคา/ชิ้น': l.priceEA, 'ราคา/ลัง': l.priceCS, 'รวม': l.total })));
    const ws = XLSX.utils.json_to_sheet(rows), wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Orders');
    XLSX.writeFile(wb, `Rattana ShipTo ${orders.length === 1 ? orders[0].orderNo : 'ออเดอร์ทั้งหมด'}.xlsx`);
  } catch (e) { RattanaUI.toast(e.message, { type: 'error' }); }
}

/* ================= Boot ================= */
async function loadProductsCached(force) {
  const key = LS.prod();
  if (!force) { try { const c = JSON.parse(localStorage.getItem(key)); if (c && Date.now() - c.ts < CONFIG.cacheMinutes * 60000) return c.data; } catch {} }
  const data = await loadProducts(S.vendors);
  try { localStorage.setItem(key, JSON.stringify({ ts: Date.now(), data })); } catch {}
  return data;
}
function setProducts(list) {
  S.products = list; S.byKey = Object.fromEntries(list.map(p => [p.key, p]));
  $('vendorCap').textContent = `${S.vendors.join(', ')} · ${list.length} รายการ`;
  const groups = ['ทั้งหมด', ...new Set(list.map(p => p.group))];
  if (!groups.includes(S.group)) S.group = 'ทั้งหมด';
  $('chips').innerHTML = groups.map(g => `<button class="rt-chip" type="button" aria-pressed="${g === S.group}" data-g="${esc(g)}">${esc(g)}</button>`).join('');
  renderShop();
}
async function start(user) {
  try {
    const setRows = await loadSet();
    const email = normEmail(user.email);
    const mine = setRows.filter(r => r.email === email);
    if (!mine.length) { $('denyEmail').textContent = email; $('deny').hidden = false; return; }
    S.me = { email, sales: mine[0].sales || user.name || email, empId: user.empId || '' };
    S.vendors = [...new Set(mine.map(r => r.vendor))];
    try { const c = JSON.parse(localStorage.getItem(LS.cart())) || {}; S.cart = c.cart || {}; S.customer = c.customer || ''; S.note = c.note || ''; } catch {}
    $('app').hidden = false;
    setProducts(await loadProductsCached(false));
  } catch (e) {
    RattanaUI.alert({ type: 'error', title: 'โหลดข้อมูลไม่ได้', message: e.message });
  }
}

document.addEventListener('DOMContentLoaded', () => {
  if (window.TEST_AS) {
    start({ email: window.TEST_AS, name: '', empId: 'TEST' });
  } else {
    RattanaUI.user.ready.then(start);
  }
});

document.addEventListener('click', e => {
  const st = e.target.closest('.rt-stepper button[data-k]');
  if (st) {
    const c = S.cart[st.dataset.k] ||= { ea: 0, cs: 0 };
    c[st.dataset.u] = Math.max(0, (c[st.dataset.u] || 0) + +st.dataset.d);
    if (!c.ea && !c.cs) delete S.cart[st.dataset.k];
    saveCart(); renderShop();
    const body = document.getElementById('cartBody'); if (body) body.innerHTML = cartBodyHtml();
    return;
  }
  const ch = e.target.closest('.rt-chip[data-g]');
  if (ch) { S.group = ch.dataset.g; document.querySelectorAll('#chips .rt-chip').forEach(b => b.setAttribute('aria-pressed', b === ch)); renderShop(); return; }
  const tr = e.target.closest('#histBody tr[data-no]');
  if (tr) showOrder(tr.dataset.no);
});
document.addEventListener('input', e => {
  if (e.target.id === 'fCustomer') { S.customer = e.target.value; saveCart(); }
  if (e.target.id === 'fNote') { S.note = e.target.value; saveCart(); }
});
$('q').addEventListener('input', e => { S.q = e.target.value.trim(); renderShop(); });
$('q').addEventListener('rt:scan', e => { S.q = e.target.value.trim(); renderShop(); });
$('seg').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  S.view = b.dataset.v;
  [...$('seg').children].forEach((x, i) => { x.setAttribute('aria-pressed', x === b); if (x === b) $('seg').style.setProperty('--i', i); });
  $('vShop').hidden = S.view !== 'shop'; $('vHist').hidden = S.view !== 'hist';
  $('pageTitle').textContent = S.view === 'shop' ? 'สินค้าของฉัน' : 'ประวัติออเดอร์';
  if (S.view === 'hist') renderHist();
  renderCartBar();
});
$('btnCart').onclick = openCart;
$('btnClear').onclick = () => RattanaUI.confirm({ title: 'ล้างตะกร้า?', message: `${cartKeys().length} รายการจะถูกลบออก`, variant: 'reject', confirmText: 'ล้างตะกร้า' })
  .then(ok => { if (ok) { S.cart = {}; saveCart(); renderShop(); } });
$('btnExportAll').onclick = () => exportExcel(getOrders());
$('btnDenyOut').onclick = () => RattanaUI.user.signOut();
$('btnRefresh').onclick = async () => {
  if (!S.me) return;
  const b = $('btnRefresh'); RattanaUI.setLoading(b, true);
  try { setProducts(await loadProductsCached(true)); RattanaUI.toast('อัปเดตข้อมูลแล้ว', { type: 'success' }); }
  catch (e) { RattanaUI.toast(e.message, { type: 'error' }); }
  finally { RattanaUI.setLoading(b, false); }
};
</script>
