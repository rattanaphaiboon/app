<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d1b3e">
<title>Rattana ส่งเอกสารพนักงานใหม่ v1.0</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&display=swap">
<style>
:root{
 --navy:#0d1b3e;--gold:#c9a84c;--goldbg:#fff8e6;--goldline:#ecd48a;
 --bg:#e9edf5;--app:#f4f6fb;--card:#ffffff;--fg:#0d1b3e;--muted:#5f6b88;--line:#dde3f0;--soft:#eef1f8;
 --ok:#1e8449;--okbg:#e8f7ee;--warn:#946a00;--warnbg:#fff6dc;--bad:#c0392b;--badbg:#fdecea;--blue:#2563eb;--bluebg:#eef4ff;
 --ocr:#fffbea;--onnavy:#ffffff;--line-green:#06c755;
 --f:'Sarabun',system-ui,'Leelawadee UI','Tahoma',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --navy:#1a2b57;--gold:#d9b85c;--goldbg:#3a3020;--goldline:#7a6430;
 --bg:#0b1020;--app:#111830;--card:#18213d;--fg:#e8ecf6;--muted:#9aa6c4;--line:#2b375a;--soft:#222c4b;
 --ok:#4cc27a;--okbg:#153626;--warn:#e3bb4f;--warnbg:#3a3018;--bad:#f07a6c;--badbg:#3d1f1d;--blue:#6d9bff;--bluebg:#1b2a50;
 --ocr:#2e2918;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f);font-size:16px;padding:12px max(12px,env(safe-area-inset-right,0px)) 24px max(12px,env(safe-area-inset-left,0px))}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{border:none;cursor:pointer;background:none}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
[hidden]{display:none!important}
.app{max-width:460px;margin:0 auto;background:var(--app);border-radius:22px;overflow:hidden;border:1px solid var(--line);box-shadow:0 18px 40px rgba(13,27,62,.15);display:flex;flex-direction:column;min-height:calc(100vh - 36px)}
@media (max-width:480px){body{padding:0}.app{border-radius:0;border:none;min-height:100vh}}
.top{background:var(--navy);color:var(--onnavy);padding:12px 14px;padding-top:max(12px,env(safe-area-inset-top,0px));display:flex;align-items:center;gap:10px;border-bottom:3px solid var(--gold)}
.top .back{background:rgba(255,255,255,.14);color:var(--onnavy);width:40px;height:40px;border-radius:12px;font-size:22px;flex:0 0 40px}
.top .t{font-weight:800;font-size:17px;letter-spacing:.3px;min-width:0;line-height:1.2}.top .t span{color:var(--gold)}
.top .t small{display:block;font-size:11px;font-weight:500;opacity:.7;letter-spacing:0}
.top .r{margin-left:auto;font-size:13px;opacity:.9;white-space:nowrap;text-align:right}
.top .r button{color:var(--onnavy);background:rgba(255,255,255,.14);border-radius:10px;padding:6px 10px;font-size:13px;font-weight:700}
.demo{background:var(--warnbg);color:var(--warn);font-size:13px;font-weight:700;text-align:center;padding:6px 10px}
.prog{height:7px;background:var(--line)}.prog i{display:block;height:100%;background:var(--gold);transition:width .3s}
.scr{flex:1;padding:18px 16px 28px;display:flex;flex-direction:column;gap:12px}
.step{font-size:14px;font-weight:700;color:var(--warn)}
.q{font-size:24px;font-weight:800;line-height:1.3;margin:0;text-wrap:balance}
.qs{font-size:16px;color:var(--muted);line-height:1.5;margin:0}
.center{text-align:center}
.big{width:100%;min-height:60px;border-radius:16px;font-size:19px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px;color:#fff;padding:8px 12px;text-decoration:none}
.big:disabled{opacity:.4;cursor:not-allowed}
.g-green{background:linear-gradient(135deg,#1e8449,#2ecc71)}.g-blue{background:linear-gradient(135deg,#1a2f5e,#2563eb)}.g-gold{background:linear-gradient(135deg,#c9a84c,#e8c86a);color:#0d1b3e}
.g-white{background:var(--card);color:var(--fg);border:2px solid var(--line)}.g-red{background:var(--card);color:var(--bad);border:2px solid var(--line)}
.mini{min-height:50px;font-size:16px}
.card{background:var(--card);border-radius:16px;padding:14px;border:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.card h4{font-size:16px;margin:0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:15px}
.kv span{color:var(--muted)}.kv b{min-width:0;overflow-wrap:anywhere}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
.fld{display:flex;flex-direction:column;gap:4px}
.fld label{font-size:14px;font-weight:700}
.fld input,.fld select,.fld textarea{width:100%;min-height:50px;border:2px solid var(--line);border-radius:12px;padding:0 12px;font-size:17px;background:var(--card)}
.fld textarea{padding:10px 12px;min-height:84px;resize:vertical}
.fld.ocr input{background:var(--ocr);border-color:var(--goldline);border-left:6px solid var(--gold)}
.hint{font-size:13px}.ok{color:var(--ok)}.bad{color:var(--bad)}.req{color:var(--bad)}
.chk{display:flex;gap:12px;align-items:flex-start;font-size:15px;line-height:1.5;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px;cursor:pointer}
.chk input{width:24px;height:24px;flex:0 0 24px;margin-top:2px;accent-color:#1e8449}
.otp{display:flex;gap:10px;justify-content:center}
.otp input{width:58px;height:64px;text-align:center;font-size:28px;font-weight:800;border:2px solid var(--line);border-radius:14px;background:var(--card)}
.seg{display:flex;gap:8px}.seg button{flex:1;min-height:52px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-weight:800;font-size:16px}
.seg button.on{background:var(--navy);color:var(--onnavy);border-color:var(--navy)}
.tabs{display:flex;gap:6px}
.tabs button{flex:1;padding:10px 8px;border-radius:14px;background:var(--card);border:2px solid var(--line);font-size:15px;font-weight:800}
.tabs button.on{background:var(--navy);color:var(--onnavy);border-color:var(--navy)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chips button{padding:7px 12px;border-radius:20px;background:var(--card);border:2px solid var(--line);font-size:14px;font-weight:700;white-space:nowrap}
.chips button.on{border-color:var(--gold);background:var(--goldbg)}
.drop{border:3px dashed var(--gold);background:var(--goldbg);border-radius:18px;padding:16px;text-align:center;display:flex;flex-direction:column;gap:6px}
.drop .e{font-size:38px}.drop b{font-size:18px}.drop small{color:var(--muted);font-size:14px}
.drop.over{background:var(--bluebg);border-color:var(--blue)}
.pick{position:relative;overflow:hidden;cursor:pointer}
.pick input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0}
.sec{font-size:14px;font-weight:800;color:var(--muted);margin-top:4px}
.doc{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px}
.doc.done{border-color:#9fd8b4}
.num{width:40px;height:40px;border-radius:50%;background:var(--navy);color:var(--gold);font-weight:800;font-size:17px;display:flex;align-items:center;justify-content:center;flex:0 0 40px}
.doc.done .num{background:var(--ok);color:#fff}
.slot{display:flex;flex-direction:column;gap:8px}
.slot+.slot{border-top:1px dashed var(--line);padding-top:10px}
.sh{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:15px}
.bar2{height:10px;background:var(--line);border-radius:5px;overflow:hidden}.bar2 i{display:block;height:100%;background:linear-gradient(90deg,#1e8449,#2ecc71);transition:width .3s}
.doc .hd{display:flex;align-items:center;gap:12px}
.doc .ic{font-size:26px;width:44px;height:44px;border-radius:12px;background:var(--soft);display:flex;align-items:center;justify-content:center;flex:0 0 44px}
.doc .tx{flex:1;min-width:0}.doc .tx b{display:block;font-size:16px}.doc .tx small{font-size:13px;color:var(--muted)}
.snap{background:var(--navy);color:var(--onnavy);border-radius:12px;padding:10px 12px;font-size:14px;font-weight:700;white-space:nowrap}
.st{font-size:13px;font-weight:800;padding:5px 10px;border-radius:20px;white-space:nowrap}
.st.ok{background:var(--okbg);color:var(--ok)}.st.wait{background:var(--warnbg);color:var(--warn)}.st.need{background:var(--badbg);color:var(--bad)}.st.info{background:var(--bluebg);color:var(--blue)}.st.mute{background:var(--soft);color:var(--muted)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.th{position:relative;width:78px;height:78px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:12px;text-align:center;color:var(--muted)}
.th img{width:100%;height:100%;object-fit:cover;cursor:zoom-in}
.th .x{position:absolute;top:2px;right:2px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:14px;line-height:24px}
.th select{position:absolute;left:0;right:0;bottom:0;height:22px;font-size:11px;border:none;background:rgba(13,27,62,.85);color:#fff;padding:0 2px}
.reading{display:flex;align-items:center;gap:10px;background:var(--bluebg);color:var(--blue);border-radius:12px;padding:10px 12px;font-size:14px}
.spin{width:18px;height:18px;border:3px solid var(--line);border-top-color:var(--blue);border-radius:50%;animation:sp 1s linear infinite;flex:0 0 18px}
@keyframes sp{to{transform:rotate(360deg)}}
.sig{height:160px;border:2px dashed var(--line);border-radius:14px;background:#fff;position:relative;touch-action:none}
.sig canvas{width:100%;height:100%;display:block}
.sig .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#9aa6c4;font-size:16px;pointer-events:none}
.tl{display:flex;flex-direction:column;gap:16px;padding-left:36px;position:relative}
.tl .it{position:relative}
.tl .it:not(:last-child):after{content:'';position:absolute;left:-23px;top:30px;height:calc(100% - 14px);width:3px;background:var(--line)}
.tl .dot{position:absolute;left:-36px;top:0;width:28px;height:28px;border-radius:50%;background:var(--card);border:3px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800}
.tl .it.ok .dot{background:var(--ok);border-color:var(--ok);color:#fff}
.tl .it.now .dot{border-color:var(--gold);background:var(--goldbg)}
.tl b{font-size:16px;display:block}.tl small{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.hero{font-size:60px;text-align:center;line-height:1}
.qrbox{display:flex;justify-content:center}
#qr{background:#fff;padding:12px;border-radius:14px;border:1px solid var(--line)}
#qr img,#qr canvas{display:block;width:180px;height:180px}
.lnk{font-size:13px;background:var(--soft);border-radius:10px;padding:8px 10px;word-break:break-all;user-select:all}
.share{display:flex;gap:8px}.share>*{flex:1;min-height:54px;border-radius:14px;font-size:15px;font-weight:800;color:#fff;display:flex;align-items:center;justify-content:center;text-decoration:none}
.msg{font-size:15px;line-height:1.6;white-space:pre-line;background:var(--soft);border-radius:12px;padding:10px 12px}
.qi{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;width:100%;text-align:left}
.av{width:46px;height:46px;border-radius:50%;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:22px;flex:0 0 46px;overflow:hidden}
.qi .tx{flex:1;min-width:0}.qi .tx b{display:block;font-size:16px}.qi .tx small{font-size:13px;color:var(--muted)}
.item{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.item .hd{display:flex;gap:10px;align-items:flex-start}
.item .hd .tx{flex:1;min-width:0}.item .hd b{font-size:17px;display:block}.item .hd small{font-size:13px;color:var(--muted);line-height:1.5}
.links{display:flex;gap:8px;flex-wrap:wrap}
.links a,.links button{background:var(--soft);border-radius:10px;padding:8px 12px;font-size:14px;font-weight:700;color:var(--fg);text-decoration:none}
.codebig{font-size:36px;font-weight:800;letter-spacing:4px;text-align:center;background:var(--goldbg);border:2px solid var(--gold);border-radius:16px;padding:10px;font-variant-numeric:tabular-nums}
.note{font-size:13px;color:var(--muted);line-height:1.5;margin:0}
.empty{text-align:center;color:var(--muted);font-size:15px;padding:18px;border:2px dashed var(--line);border-radius:14px}
.err{background:var(--badbg);color:var(--bad);border-radius:12px;padding:12px;font-size:15px;line-height:1.5}
.viewer{position:fixed;inset:0;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.viewer img{max-width:100%;max-height:100%;border-radius:8px}
.overlay{position:fixed;inset:0;background:rgba(13,27,62,.6);display:flex;align-items:center;justify-content:center;z-index:70;padding:24px}
.overlay .box{background:var(--card);border-radius:18px;padding:22px;max-width:340px;width:100%;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.overlay .bar{width:100%;height:8px;background:var(--line);border-radius:4px;overflow:hidden}.overlay .bar i{display:block;height:100%;background:var(--gold);width:0;transition:width .3s}
.toast{position:fixed;left:50%;transform:translate(-50%,180%);bottom:calc(18px + env(safe-area-inset-bottom,0px));max-width:420px;width:calc(100% - 32px);background:#0d1b3e;color:#fff;border-radius:14px;padding:12px 14px;font-size:15px;box-shadow:0 10px 30px rgba(0,0,0,.3);transition:transform .3s;z-index:80}
.toast.on{transform:translate(-50%,0)}
.gsi{display:flex;justify-content:center;min-height:44px}
.foot{text-align:center;font-size:12px;color:var(--muted);padding:10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
 <div class="top">
  <button class="back" id="bk" onclick="goBack()" aria-label="ย้อนกลับ" style="visibility:hidden">‹</button>
  <div class="t">RATTANA <span id="ttl">ส่งเอกสารพนักงานใหม่</span><small>v1.0</small></div>
  <div class="r" id="tr"></div>
 </div>
 <div class="demo" id="demoBar" hidden>โหมดทดสอบ — ข้อมูลเก็บในเครื่องนี้เท่านั้น ยังไม่ส่งเข้าชีต</div>
 <div class="prog"><i id="pg" style="width:0"></i></div>
 <main class="scr" id="scr"><div class="empty">กำลังโหลด…</div></main>
 <div class="foot">ฝ่ายบุคคล · Rattana</div>
</div>
<div class="toast" id="toast"></div>
<div class="overlay" id="ov" hidden><div class="box"><div class="spin" style="width:34px;height:34px"></div><b id="ovT">กำลังทำงาน…</b><div class="bar"><i id="ovB"></i></div><small class="note" id="ovS"></small></div></div>

<script>
/*══════════════════════════════════════════════════════════════
  Rattana ส่งเอกสารพนักงานใหม่ v1.0
  หลังบ้าน: rattana-newhire-apps-script-v1.0.gs (ผูกกับชีต "รันเลขรหัสพนักงานใหม่" แท็บ APP ส่งรันรหัส)
  ?nh=รหัสลิงก์ = หน้าพนักงานใหม่ · ไม่มี = หน้าหัวหน้า/HR (ล็อกอิน Google)
══════════════════════════════════════════════════════════════*/
const APP_VERSION='1.0';
const CONFIG={
  gasUrl:'https://script.google.com/macros/s/AKfycbwEVTGLisAaxP3l4iP8sl3l7GPqQh56Z2V1GAGHsJnD1sReBjjFFpcxTcsjC1xHs5nR/exec',   /* หลังบ้าน v1.0 (โปรเจกต์ 1bLseggg6T8P… บัญชี Janjira) · ?demo=1 = โหมดทดสอบ */
  clientId:'615875645128-gasjjvkt6lu8g449cbnhl40k1pu25r0b.apps.googleusercontent.com',
  appUrl:'https://rattanaphaiboon.github.io/app/rattana-newhire.html',
  tessJs:'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js',
  tessLang:'https://tessdata.projectnaptha.com/4.0.0_fast',
  pdfJs:'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js',
  pdfWorker:'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js',
  jspdf:'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js',
  qr:'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js',
  gsi:'https://accounts.google.com/gsi/client',
  maxImgSide:1600, maxPdfMB:8
};
const WH=['HQ','W1','W2','W3','W4','C4'];
const PARAMS=new URLSearchParams(location.search);
const DEMO=!CONFIG.gasUrl || PARAMS.get('demo')==='1';

/*────────── helpers ──────────*/
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},del:k=>{try{localStorage.removeItem(k)}catch(e){}}};
const TH_M=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
function thDate(v){if(!v)return '-';const d=typeof v==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(v)?new Date(v+'T00:00:00'):new Date(v);if(isNaN(d))return String(v);return d.getDate()+' '+TH_M[d.getMonth()]+' '+(d.getFullYear()+543)}
function thDT(v){const d=new Date(v);return thDate(d)+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function fmtPhone(p){p=String(p||'').replace(/\D/g,'');return p.length===10?p.slice(0,3)+'-'+p.slice(3,6)+'-'+p.slice(6):p}
function toast(t,ms=2800){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),ms)}
function busy(on,title,sub,pct){$('ov').hidden=!on;if(!on)return;$('ovT').textContent=title||'กำลังทำงาน…';$('ovS').textContent=sub||'';$('ovB').style.width=(pct==null?0:Math.round(pct*100))+'%'}
function validThaiId(id){if(!/^\d{13}$/.test(id))return false;let s=0;for(let i=0;i<12;i++)s+=(+id[i])*(13-i);return ((11-(s%11))%10)===+id[12]}
function fmtId(s){const d=String(s||'').replace(/\D/g,'').slice(0,13);const p=[1,4,5,2,1];let o=[],i=0;for(const n of p){if(i>=d.length)break;o.push(d.substr(i,n));i+=n}return o.join('-')}
function fmtAcc(s){const d=String(s||'').replace(/\D/g,'').slice(0,10);const p=[3,1,5,1];let o=[],i=0;for(const n of p){if(i>=d.length)break;o.push(d.substr(i,n));i+=n}return o.join('-')}
function loadScript(src){return new Promise((res,rej)=>{if([...document.scripts].some(s=>s.src===src))return res();const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('โหลดไลบรารีไม่สำเร็จ ตรวจอินเทอร์เน็ต'));document.head.appendChild(s)})}
const readAsDataUrl=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(new Error('อ่านไฟล์ไม่ได้'));r.readAsDataURL(f)});
const loadImg=url=>new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('รูปเสียหาย'));i.src=url});
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
async function copyText(t,ok){try{await navigator.clipboard.writeText(t);toast(ok||'คัดลอกแล้ว')}catch(e){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast(ok||'คัดลอกแล้ว')}catch(x){toast('คัดลอกไม่ได้ กดค้างที่ข้อความเพื่อคัดลอก')}ta.remove()}}

/*────────── IndexedDB (เก็บรูปร่างไว้ในเครื่อง กันหายตอนรีโหลด) ──────────*/
const IDB={db:null,
 open(){return this.db?Promise.resolve(this.db):new Promise((res,rej)=>{const r=indexedDB.open('rattana_newhire',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>{this.db=r.result;res(this.db)};r.onerror=()=>rej(r.error)})},
 async get(k){try{const db=await this.open();return await new Promise(res=>{const q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>res(null)})}catch(e){return null}},
 async set(k,v){try{const db=await this.open();await new Promise(res=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=res;t.onerror=res})}catch(e){}},
 async del(k){try{const db=await this.open();await new Promise(res=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').delete(k);t.oncomplete=res;t.onerror=res})}catch(e){}}
};

/*══════════════════════ BACKEND ══════════════════════*/
async function api(action,payload={}){
  if(DEMO) return MOCK(action,payload);
  let res;
  try{res=await fetch(CONFIG.gasUrl,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,...payload})})}
  catch(e){throw new Error('เชื่อมต่อไม่ได้ ตรวจอินเทอร์เน็ตแล้วลองใหม่')}
  const text=await res.text();
  if(!text.trim().startsWith('{'))throw new Error('เซิร์ฟเวอร์ตอบผิดรูปแบบ — ตรวจการ deploy Apps Script (ต้องเป็น "ทุกคน")');
  const out=JSON.parse(text);
  if(!out.ok){const e=new Error(out.error||'เกิดข้อผิดพลาด');e.code=out.code||'';throw e}
  return out;
}
/* โหมดทดสอบ: จำลองหลังบ้านใน localStorage ให้ลองครบทุกขั้น */
function MOCK(a,p){
  const K='rattana_newhire_mock';let D;try{D=JSON.parse(LS.get(K)||'')}catch(e){}D=D||{inv:{},rows:[]};
  const save=()=>LS.set(K,JSON.stringify(D)), need=c=>{const i=D.inv[c];if(!i)throw new Error('ไม่พบลิงก์นี้');return i};
  const me={email:'tester@rattanaphaiboon.com',name:'ผู้ทดสอบ (หัวหน้าศูนย์)',hr:true,wh:'W2'};
  const pub=i=>({code:i.code,prefix:i.prefix,fname:i.fname,lname:i.lname,pos:i.pos,wh:i.wh,start:i.start,status:i.status,exp:i.exp,returnNote:i.returnNote||''});
  const hireOf=ht=>{const c=String(ht||'').replace(/^demo-/,'');return need(c)};
  const rowOf=i=>D.rows.find(r=>r.key===i.code);
  return new Promise(res=>setTimeout(()=>res(run()),250));
  function run(){
   switch(a){
    case 'ping':return {ok:true,me};
    case 'emps':return {ok:true,emps:[
      {c:'6703012',n:'ประยุทธ์ มั่นคง',k:'ยุทธ',w:'W2',p:'พนักงานขับรถ',s:'Inactive',o:'31/10/2026'},
      {c:'6801045',n:'วันเพ็ญ ศรีทอง',k:'เพ็ญ',w:'W2',p:'เด็กติดรถ',s:'Inactive',o:'25/10/2026'},
      {c:'6605009',n:'ธนากร แก้วมณี',k:'กร',w:'W1',p:'เซลล์ขาย',s:'Inactive',o:'20/10/2026'},
      {c:'6511033',n:'อำนาจ บุญเรือง',k:'นาจ',w:'W4',p:'เซลล์พรีส่ง',s:'Active',o:''},
      {c:'6707021',n:'จิราพร ใจงาม',k:'จิ',w:'W3',p:'จัดซื้อ',s:'Active',o:''}]};
    case 'create':{const c=Math.random().toString(36).slice(2,8).toUpperCase();const i={...p.inv,code:c,reqName:me.name,reqEmail:me.email,created:Date.now(),exp:Date.now()+7*864e5,status:'sent'};D.inv[c]=i;save();return {ok:true,code:c,exp:i.exp,url:CONFIG.appUrl+'?nh='+c}}
    case 'mine':return {ok:true,me,list:Object.values(D.inv).map(i=>{const r=rowOf(i);const o={...i};if(r){Object.assign(o,{cid:r.cid,nick:r.nick,bank:r.bank,pdf:r.pdf,face:r.face,empCode:r.code,mail:r.mail});if(r.code)o.status='coded'}return o}).sort((x,y)=>(y.submittedAt||y.created)-(x.submittedAt||x.created))};
    case 'invite':{const i=need(p.code);if(i.status==='cancelled')throw new Error('ลิงก์นี้ถูกยกเลิกแล้ว');return {ok:true,inv:pub(i)}}
    case 'verify':{const i=need(p.code);if(String(p.last4)!==String(i.phone).slice(-4))throw new Error('เบอร์ไม่ตรงกับที่หัวหน้าให้ไว้');return {ok:true,ht:'demo-'+i.code,exp:Date.now()+12*3600e3,inv:pub(i)}}
    case 'upload':{const i=hireOf(p.ht);i.pending=i.pending||{};(i.pending[p.kind]=i.pending[p.kind]||[]).push('https://drive.google.com/file/d/demo'+uid()+'/view');save();return {ok:true}}
    case 'submit':{const i=hireOf(p.ht);let r=rowOf(i);if(!r){r={key:i.code,pdf:[],face:[]};D.rows.push(r)}const pe=i.pending||{};r.pdf=r.pdf.concat(pe.pdf||[]);r.face=r.face.concat(pe.face||[]);Object.assign(r,{cid:p.data.cid,nick:p.data.nick,bank:p.data.bank});i.pending={};i.status='submitted';i.submittedAt=Date.now();delete i.returnNote;save();return {ok:true}}
    case 'status':{const i=hireOf(p.ht);const r=rowOf(i);return {ok:true,status:r&&r.code?'coded':i.status,empCode:r&&r.code||'',returnNote:i.returnNote||'',inv:pub(i)}}
    case 'setCode':{const i=need(p.code);const r=rowOf(i);r.code=p.empCode;r.mail='ส่งแล้ว (ทดสอบ)';i.status='coded';save();return {ok:true}}
    case 'return':{const i=need(p.code);i.status='returned';i.returnNote=p.note||'กรุณาแนบเอกสารเพิ่ม';save();return {ok:true}}
    case 'cancel':{const i=need(p.code);i.status='cancelled';save();return {ok:true}}
   }
   throw new Error('ไม่รู้จักคำสั่ง '+a);
  }
}

/*══════════════════════ ROUTER ══════════════════════*/
let cur='',hist=[],V={},AFTER={};
function go(k,push=true){if(push&&cur&&cur!==k)hist.push(cur);cur=k;render()}
function goBack(){if(hist.length){cur=hist.pop();render()}}
function render(){
  const v=V[cur];$('scr').innerHTML=v.html();
  $('ttl').textContent=v.ttl||'ส่งเอกสารพนักงานใหม่';$('tr').innerHTML=v.tr?v.tr():'';
  $('pg').style.width=(v.p||0)+'%';$('bk').style.visibility=(v.back!==false&&hist.length)?'visible':'hidden';
  window.scrollTo({top:0});if(v.after)v.after();
}

/*══════════════════════ ฝั่งหัวหน้า / HR ══════════════════════*/
const K_TOKEN='rattana_newhire_token';
let token='',ME=null,LIST=[],EMPS=null,filter='all';
let F={reason:'replace',replaceOf:'',addReason:'',prefix:'นาย',fname:'',lname:'',phone:'',pos:'',wh:'',start:'',_q:''};
let lastLink=null;
function loadToken(){try{const t=JSON.parse(LS.get(K_TOKEN)||'null');if(t&&t.exp>Date.now()){token=t.token;ME=t.me}}catch(e){}}
async function sapi(a,p={}){try{return await api(a,{token,...p})}catch(e){if(e.code==='AUTH'){LS.del(K_TOKEN);token='';ME=null;go('S0',false)}throw e}}
function onGoogle(r){(async()=>{busy(true,'กำลังเข้าสู่ระบบ…');try{const o=await api('login',{idToken:r.credential});token=o.token;ME=o.me;LS.set(K_TOKEN,JSON.stringify({token,exp:o.exp,me:o.me}));busy(false);startStaff()}catch(e){busy(false);$('loginErr').hidden=false;$('loginErr').textContent=e.message}})()}
async function startStaff(){hist=[];go('S1',false);refreshList(true);ensureEmps()}
async function refreshList(silent){try{const o=await sapi('mine');LIST=o.list||[];if(o.me)ME=o.me;if(cur==='S2'||cur==='S1')render()}catch(e){if(!silent)toast(e.message)}}
async function ensureEmps(){if(EMPS)return;try{EMPS=(await sapi('emps')).emps||[];if(cur==='S1')render()}catch(e){EMPS=[];}}
function logout(){LS.del(K_TOKEN);token='';ME=null;hist=[];go('S0',false)}
function staffTabs(){const n=LIST.filter(i=>i.status==='submitted').length;return `<div class="tabs"><button class="${cur==='S1'||cur==='S1b'?'on':''}" onclick="hist=[];go('S1',false)">➕ ขอรันรหัสพนักงานใหม่</button><button class="${cur==='S2'?'on':''}" onclick="hist=[];go('S2',false)">📋 รายการ${n&&ME&&ME.hr?' ('+n+')':''}</button></div>`}
function parseDMY(s){const m=String(s||'').match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);if(!m)return 0;let y=+m[3];if(y>2400)y-=543;return new Date(y,+m[2]-1,+m[1]).getTime()}
function empMatches(){const q=F._q.trim().toLowerCase();let L=(EMPS||[]).filter(e=>!q||(e.n+' '+e.k+' '+e.c+' '+e.w+' '+e.p).toLowerCase().includes(q));
  L.sort((a,b)=>(parseDMY(b.o)-parseDMY(a.o))||((a.s==='Active')-(b.s==='Active')));return L.slice(0,8)}
function repPicker(){
  if(F.replaceOf)return `<div class="fld"><label>ทดแทนพนักงาน</label><div class="qi" style="border:2px solid var(--ok)"><div class="av">👤</div><div class="tx"><b>${esc(F.replaceOf)}</b><small>เลือกแล้ว</small></div><button class="snap" onclick="F.replaceOf='';render()">เปลี่ยน</button></div></div>`;
  return `<div class="fld"><label for="f_q">ทดแทนพนักงานคนไหน <span class="req">*</span></label><input id="f_q" value="${esc(F._q)}" placeholder="พิมพ์ชื่อ ชื่อเล่น หรือรหัส" oninput="F._q=this.value;drawEmp()" autocomplete="off"></div><div id="empList" style="display:flex;flex-direction:column;gap:6px">${empListHtml()}</div>`}
function empListHtml(){if(!EMPS)return '<div class="reading"><div class="spin"></div>กำลังโหลดรายชื่อพนักงาน…</div>';const L=empMatches();
  return L.map(e=>`<button class="qi" onclick="pickRep('${esc(e.c)}','${esc(e.n)}')"><div class="av">👤</div><div class="tx"><b>${esc(e.n)}${e.k?' ('+esc(e.k)+')':''}</b><small>${esc(e.c)} · ${esc(e.w)} · ${esc(e.p)}${e.o?' · ออก '+esc(e.o):''}</small></div></button>`).join('')||'<div class="empty">ไม่พบชื่อนี้ ลองพิมพ์ส่วนอื่นของชื่อ</div>'}
function drawEmp(){const el=$('empList');if(el)el.innerHTML=empListHtml()}
function pickRep(c,n){const e=(EMPS||[]).find(x=>x.c===c&&x.n===n)||{c,n};F.replaceOf=e.n+' ('+e.c+')';if(e.w&&WH.includes(e.w))F.wh=e.w;if(e.p&&!F.pos)F.pos=e.p;F._q='';render();toast('เลือกแล้ว · เติมคลังและตำแหน่งตามคนเดิมให้ (แก้ได้)')}
async function createLink(){
  const err=[];if(F.reason==='replace'&&!F.replaceOf)err.push('เลือกชื่อพนักงานที่ทดแทน');if(F.reason==='add'&&F.addReason.trim().length<5)err.push('ใส่เหตุผลที่เพิ่มพนักงานใหม่');
  if(!F.fname.trim()||!F.lname.trim())err.push('ใส่ชื่อและสกุล');if(F.phone.length!==10)err.push('เบอร์มือถือ 10 หลัก');if(!F.pos.trim())err.push('ตำแหน่ง');if(!F.wh)err.push('คลัง');if(!F.start)err.push('วันเริ่มงาน');
  if(err.length){toast('ยังขาด: '+err.join(' · '),4000);return}
  busy(true,'กำลังสร้างลิงก์ขอรันรหัส…');
  try{const o=await sapi('create',{inv:{...F,_q:undefined}});lastLink={...F,code:o.code,url:o.url,exp:o.exp};busy(false);
    F={reason:'replace',replaceOf:'',addReason:'',prefix:'นาย',fname:'',lname:'',phone:'',pos:'',wh:F.wh,start:'',_q:''};go('S1b');refreshList(true)}
  catch(e){busy(false);toast(e.message,4000)}
}
function inviteMsg(i){return `สวัสดีค่ะคุณ${i.fname} 🎉 ยินดีต้อนรับสู่ Rattana\nตำแหน่ง ${i.pos} · คลัง ${i.wh}\nเริ่มงาน ${thDate(i.start)}\nกรุณาส่งเอกสารก่อนเริ่มงานที่ลิงก์นี้ (ใช้เวลาประมาณ 10 นาที)\n${i.url||CONFIG.appUrl+'?nh='+i.code}`}
const STATUS={sent:['รอพนักงานส่งเอกสาร','wait'],submitted:['ส่งแล้ว รอ HR ลงรหัส','info'],returned:['ขอเอกสารเพิ่ม','need'],coded:['ได้รหัสแล้ว','ok'],cancelled:['ยกเลิก','mute'],expired:['ลิงก์หมดอายุ','mute']};
function stOf(i){return i.status==='sent'&&i.exp<Date.now()?'expired':i.status}

async function shrinkImage(dataUrl,maxSide,q=.82){const img=await loadImg(dataUrl);let w=img.naturalWidth,h=img.naturalHeight;const k=Math.min(1,maxSide/Math.max(w,h));w=Math.max(1,Math.round(w*k));h=Math.max(1,Math.round(h*k));const cv=document.createElement('canvas');cv.width=w;cv.height=h;const cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,w,h);cx.drawImage(img,0,0,w,h);return cv.toDataURL('image/jpeg',q)}
async function fileToItem(file){
  const isPdf=file.type==='application/pdf'||/\.pdf$/i.test(file.name||'');
  if(isPdf){if(file.size>CONFIG.maxPdfMB*1048576)throw new Error(`PDF ใหญ่เกิน ${CONFIG.maxPdfMB} MB`);return {id:uid(),name:file.name,pdf:true,dataUrl:await readAsDataUrl(file)}}
  if(!/^image\//.test(file.type)&&!/\.(jpe?g|png|webp|heic|heif)$/i.test(file.name||''))throw new Error('รองรับเฉพาะรูปภาพหรือ PDF');
  let dataUrl;try{dataUrl=await shrinkImage(await readAsDataUrl(file),CONFIG.maxImgSide)}catch(e){throw new Error('เปิดรูปไม่ได้ (ถ้าเป็น HEIC ให้ตั้งกล้องเป็น "เข้ากันได้มากที่สุด" แล้วถ่ายใหม่)')}
  return {id:uid(),name:file.name||'image.jpg',dataUrl,thumb:await shrinkImage(dataUrl,240,.7)};
}

const thNum=s=>String(s||'').replace(/[๐-๙]/g,d=>'๐๑๒๓๔๕๖๗๘๙'.indexOf(d));
const DIGIT_FIX={O:'0',o:'0',D:'0',Q:'0',I:'1',l:'1','|':'1','!':'1',S:'5',s:'5',B:'8',Z:'2',z:'2'};
const looseDigits=s=>thNum(s).replace(/[A-Za-z|!]/g,c=>DIGIT_FIX[c]??' ');
function slidingIds(str){const ds=String(str||'').replace(/\D/g,''),o=[];for(let i=0;i+13<=ds.length;i++)o.push(ds.slice(i,i+13));return o}
function findCid(...texts){for(const fix of [false,true]){const all=[];for(const t of texts){if(!t)continue;const s=fix?looseDigits(t):thNum(t);s.split('\n').forEach(l=>all.push(...slidingIds(l)));all.push(...slidingIds(s))}const g=all.find(validThaiId);if(g)return g}return ''}
function findAcc(t){const T=thNum(t);const m=T.match(/(\d{3})[\s\-.]?(\d)[\s\-.]?(\d{5})[\s\-.]?(\d)(?!\d)/);return m?`${m[1]}-${m[2]}-${m[3]}-${m[4]}`:''}
function enhance(cv){const cx=cv.getContext('2d',{willReadFrequently:true});const im=cx.getImageData(0,0,cv.width,cv.height),d=im.data,h=new Uint32Array(256);
  for(let i=0;i<d.length;i+=4){const g=(d[i]*.299+d[i+1]*.587+d[i+2]*.114)|0;d[i]=d[i+1]=d[i+2]=g;h[g]++}
  const tot=cv.width*cv.height;let a=0,lo=0,hi=255;for(let g=0;g<256;g++){a+=h[g];if(a>=tot*.02){lo=g;break}}a=0;for(let g=0;g<256;g++){a+=h[g];if(a>=tot*.98){hi=g;break}}
  const sp=Math.max(1,hi-lo);for(let i=0;i<d.length;i+=4){const v=Math.max(0,Math.min(255,Math.round((d[i]-lo)*255/sp)));d[i]=d[i+1]=d[i+2]=v}cx.putImageData(im,0,0)}
async function ocrText(dataUrl){const w=await getWorker();const img=await loadImg(dataUrl);const k=1500/img.naturalWidth;const cv=document.createElement('canvas');cv.width=1500;cv.height=Math.round(img.naturalHeight*k);cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);enhance(cv);
  await w.setParameters({tessedit_pageseg_mode:'6'});return (await w.recognize(cv)).data.text||''}
function afterAdd(k){
  if(k==='id'&&!validThaiId(D.cid))queueOcr('id');
  if(k==='bank'&&!D.bank)queueOcr('bank');
}
function queueOcr(k){const f=(FILES[k]||[]).slice(-1)[0];if(!f||f.pdf||OCR[k]==='run')return;OCR[k]='run';drawOcrNote();
  ocrQ=ocrQ.then(async()=>{try{const t=await ocrText(f.dataUrl);
    if(k==='id'){const c=findCid(t);if(c){D.cid=c;OCR.id='ok'}else OCR.id='fail'}
    if(k==='bank'){const a=findAcc(t);if(a){D.bank=a;OCR.bank='ok'}else OCR.bank='fail'}
    saveD()}catch(e){OCR[k]='fail'}drawOcrNote();if(cur==='H3')render()})}
function drawOcrNote(){const el=$('ocrNote');if(!el)return;const run=Object.values(OCR).includes('run');
  el.innerHTML=run?'<div class="reading"><div class="spin"></div>กำลังอ่านเลขบัตร / เลขบัญชีจากรูป… แนบเอกสารอื่นต่อได้เลย</div>':(OCR.id==='ok'||OCR.bank==='ok')?'<div class="reading" style="color:var(--ok);background:var(--okbg)">✓ อ่านข้อมูลจากรูปแล้ว ตรวจอีกครั้งในขั้นถัดไป</div>':''}

 ${Object.values(OCR).includes('run')?'<div class="reading"><div class="spin"></div>กำลังอ่านเลขจากรูป รอสักครู่…</div>':''}
 <div class="card"><div class="kv"><span>ชื่อ - สกุล</span><b>${esc(INV.prefix+INV.fname+' '+INV.lname)}</b><span>ตำแหน่ง</span><b>${esc(INV.pos)} · ${esc(INV.wh)}</b></div><p class="note">ชื่อไม่ตรงบัตร? แจ้งหัวหน้างานให้แก้</p></div>
 <div class="card">
  <div class="fld ${D.cid?'ocr':''}"><label for="h_cid">เลขบัตรประชาชน 13 หลัก <span class="req">*</span></label><input id="h_cid" inputmode="numeric" value="${esc(fmtId(D.cid))}" placeholder="x-xxxx-xxxxx-xx-x" oninput="cidIn(this)">
   <div class="hint ${iv?'ok':'bad'}" id="cidh">${!D.cid?'ใส่ให้ครบ 13 หลัก':iv?'✓ เลขบัตรถูกต้อง':D.cid.length<13?'ใส่ให้ครบ 13 หลัก':'✗ เลขบัตรไม่ถูกต้อง ตรวจอีกครั้ง'}</div></div>

 </div>
 <h2 class="q" style="font-size:20px">เซ็นชื่อรับรอง</h2>
 <p class="qs">ข้าพเจ้ารับรองว่าข้อมูลและเอกสารที่ส่งเป็นความจริงทุกประการ</p>

 <button class="big g-green" id="h3go" disabled onclick="sendAll()">📨 ส่งเอกสารให้ฝ่ายบุคคล</button>`},
 after:()=>{initSig();chkH3()}};
function cidIn(el){const raw=el.value.replace(/\D/g,'').slice(0,13);D.cid=raw;saveD();el.value=fmtId(raw);const v=validThaiId(raw),h=$('cidh');h.className='hint '+(v?'ok':'bad');h.textContent=raw.length<13?'ใส่ให้ครบ 13 หลัก':v?'✓ เลขบัตรถูกต้อง':'✗ เลขบัตรไม่ถูกต้อง ตรวจอีกครั้ง';chkH3()}
function chkH3(){const b=$('h3go');if(b)b.disabled=!(validThaiId(D.cid)&&String(D.bank).replace(/\D/g,'').length===10&&D.nick.trim()&&sigOK)}
function initSig(){const c=$('sigc');const r=c.getBoundingClientRect();c.width=r.width*2;c.height=r.height*2;const x=c.getContext('2d');x.scale(2,2);x.lineWidth=2.6;x.lineCap='round';x.lineJoin='round';x.strokeStyle='#0d1b3e';let dn=false;
 if(sigData){const im=new Image();im.onload=()=>x.drawImage(im,0,0,r.width,r.height);im.src=sigData;$('sigph').hidden=true}
 const p=e=>{const b=c.getBoundingClientRect();return[e.clientX-b.left,e.clientY-b.top]};
 c.onpointerdown=e=>{dn=true;try{c.setPointerCapture(e.pointerId)}catch(_){}const[a,b]=p(e);x.beginPath();x.moveTo(a,b);$('sigph').hidden=true};
 c.onpointermove=e=>{if(!dn)return;const[a,b]=p(e);x.lineTo(a,b);x.stroke();sigOK=true};
 c.onpointerup=c.onpointercancel=()=>{if(dn){dn=false;if(sigOK){sigData=c.toDataURL('image/png');chkH3()}}}}

/*────────── รวม PDF + ส่ง ──────────*/
function textImage(lines,widthPx,fontPx,opts={}){const pad=opts.pad??0;const cv=document.createElement('canvas');const cx=cv.getContext('2d');const rows=[];
  for(const raw of lines){const o=(raw&&typeof raw==='object')?raw:{t:String(raw??'')};const size=o.size||fontPx;const font=`${o.b?'700':'400'} ${size}px Sarabun, Tahoma, sans-serif`;cx.font=font;let line='';
    if(!o.t){rows.push({t:'',font,lh:Math.round(size*.9)});continue}
    for(const ch of o.t){const t=line+ch;if(line&&cx.measureText(t).width>widthPx-pad*2){rows.push({t:line,font,lh:Math.round(size*1.5)});line=ch}else line=t}rows.push({t:line,font,lh:Math.round(size*1.5)})}
  cv.width=widthPx;cv.height=Math.max(10,rows.reduce((a,r)=>a+r.lh,0)+pad*2);cx.fillStyle=opts.bg||'#fff';cx.fillRect(0,0,cv.width,cv.height);cx.fillStyle=opts.color||'#0d1b3e';cx.textBaseline='top';
  let y=pad;for(const r of rows){cx.font=r.font;if(r.t)cx.fillText(r.t,pad,y+Math.round(r.lh*.14));y+=r.lh}return {dataUrl:cv.toDataURL('image/jpeg',.9),w:cv.width,h:cv.height}}
async function pdfToImages(dataUrl,max=12){await loadScript(CONFIG.pdfJs);pdfjsLib.GlobalWorkerOptions.workerSrc=CONFIG.pdfWorker;
  const b=atob(dataUrl.slice(dataUrl.indexOf(',')+1)),buf=new Uint8Array(b.length);for(let i=0;i<b.length;i++)buf[i]=b.charCodeAt(i);
  const pdf=await pdfjsLib.getDocument({data:buf}).promise,out=[];for(let p=1;p<=Math.min(pdf.numPages,max);p++){const pg=await pdf.getPage(p);const v0=pg.getViewport({scale:1});const vp=pg.getViewport({scale:Math.min(2.5,1400/v0.width)});const cv=document.createElement('canvas');cv.width=vp.width;cv.height=vp.height;await pg.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;out.push(cv.toDataURL('image/jpeg',.8))}return out}
async function buildPdf(onProg){
  await loadScript(CONFIG.jspdf);try{await document.fonts.load('700 32px Sarabun');await document.fonts.load('400 32px Sarabun')}catch(e){}
  const {jsPDF}=window.jspdf;const doc=new jsPDF({unit:'mm',format:'a4',compress:true});const W=210,H=297,M=10;
  const who=`${INV.prefix}${INV.fname} ${INV.lname}`;
  const groups=DOCS().filter(d=>has(d.k)).map(d=>({label:d.label,items:FILES[d.k]}));
  const L=[{t:RETURN()?'เอกสารแนบเพิ่ม — ขอรันรหัสพนักงานใหม่':'เอกสารขอรันรหัสพนักงานใหม่',b:1,size:38},{t:who+(D.nick?' ('+D.nick+')':''),b:1,size:48},'',
    `ตำแหน่ง: ${INV.pos} · คลัง: ${INV.wh} · เริ่มงาน: ${thDate(INV.start)}`,`เลขบัตรประชาชน: ${fmtId(D.cid)}`,`บัญชี ธ.กรุงเทพ: ${D.bank}`,...(needCrime()?[`ตรวจอาชญากรรม: ${D.crimeWait&&!has('crime')?'ยื่นแล้ว รอผล':has('crime')?'แนบผลแล้ว':'-'}`]:[]),`ส่งเมื่อ: ${thDT(Date.now())} · รหัสลิงก์ ${NH}`,'',
    {t:'ความยินยอม PDPA: ยินยอมแล้ว',size:28},{t:'คำรับรอง: ข้าพเจ้ารับรองว่าข้อมูลและเอกสารที่ส่งเป็นความจริงทุกประการ',size:28},'',{t:'เอกสารในชุดนี้',b:1,size:34}];
  groups.forEach(g=>L.push(`  • ${g.label} (${g.items.length} ไฟล์)`));
  const cover=textImage(L,1500,30,{pad:36});const face=(FILES.face||[])[0];const tw=face?W-2*M-44:W-2*M;const ch=Math.min(H-2*M-50,tw*cover.h/cover.w);
  doc.addImage(cover.dataUrl,'JPEG',M,M,tw,ch);
  if(face&&!face.pdf){try{const im=await loadImg(face.dataUrl);const pw=40;doc.addImage(face.dataUrl,'JPEG',W-M-pw,M+2,pw,Math.min(pw*im.naturalHeight/im.naturalWidth,54))}catch(e){}}
  if(sigData){const lab=textImage([{t:'ลายมือชื่อผู้ส่ง',size:26}],600,26,{pad:4});doc.addImage(lab.dataUrl,'JPEG',M,M+ch+4,60,60*lab.h/lab.w);doc.addImage(sigData,'PNG',M,M+ch+12,70,26)}
  let pages=1,tot=groups.reduce((a,g)=>a+g.items.length,0),done=0;
  for(const g of groups){for(let i=0;i<g.items.length;i++){const f=g.items[i];const imgs=f.pdf?await pdfToImages(f.dataUrl):[f.dataUrl];
    for(let p=0;p<imgs.length;p++){const img=await loadImg(imgs[p]);const land=img.naturalWidth>img.naturalHeight*1.15;doc.addPage('a4',land?'landscape':'portrait');pages++;const pw=land?H:W,ph=land?W:H;
      const hd=textImage([{t:`${who} · ${INV.pos} · ${INV.wh}`,size:24},{t:`${g.label} (${i+1}/${g.items.length})${imgs.length>1?' · หน้า '+(p+1)+'/'+imgs.length:''}`,b:1,size:32}],1600,24,{pad:14,bg:'#0d1b3e',color:'#ffffff'});
      const hh=(pw-2*M)*hd.h/hd.w;doc.addImage(hd.dataUrl,'JPEG',M,M,pw-2*M,hh);const top=M+hh+3,aw=pw-2*M,ah=ph-top-M-4;const k=Math.min(aw/img.naturalWidth,ah/img.naturalHeight);
      doc.addImage(imgs[p],'JPEG',M+(aw-img.naturalWidth*k)/2,top,img.naturalWidth*k,img.naturalHeight*k);doc.setFontSize(9);doc.setTextColor(120);doc.text(String(pages),pw-M,ph-4,{align:'right'})}
    done++;onProg&&onProg(done/tot)}}
  const raw=doc.output('datauristring');return 'data:application/pdf;base64,'+raw.slice(raw.indexOf('base64,')+7);
}
async function sendAll(){
  const b=$('h3go');b.disabled=true;
  try{
    busy(true,'กำลังรวมเอกสารเป็น PDF…','อย่าปิดหน้านี้',0);
    const pdf=await buildPdf(x=>busy(true,'กำลังรวมเอกสารเป็น PDF…','อย่าปิดหน้านี้',x*.5));
    const face=(FILES.face||[])[0];
    if(face&&!face.pdf){busy(true,'กำลังส่งรูปหน้าตรง…','อย่าปิดหน้านี้',.55);await retry(()=>hapi('upload',{kind:'face',data:face.dataUrl}))}
    busy(true,'กำลังส่งเอกสาร PDF…',`ขนาด ${(pdf.length*.75/1048576).toFixed(1)} MB · อย่าปิดหน้านี้`,.65);
    await retry(()=>hapi('upload',{kind:'pdf',data:pdf}));
    busy(true,'กำลังบันทึกข้อมูล…','',.92);
    await retry(()=>hapi('submit',{data:{cid:D.cid,nick:D.nick.trim(),bank:D.bank}}));
    STAT=await hapi('status');FILES={};await IDB.del('files_'+NH);sigOK=false;sigData=null;
    busy(false);hist=[];go('H5',false);toast('ส่งเอกสารเรียบร้อย ✓');
  }catch(e){busy(false);toast('ส่งไม่สำเร็จ: '+e.message+' — กดส่งอีกครั้งได้',5000);chkH3()}
}
async function retry(fn,n=2){for(let i=0;;i++){try{return await fn()}catch(e){if(i>=n||e.code==='AUTH')throw e;await new Promise(r=>setTimeout(r,1500*(i+1)))}}}
