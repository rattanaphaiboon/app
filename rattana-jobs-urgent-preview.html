<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ตัวอย่าง · ตำแหน่งรับด่วน</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#0d1b3e;--gold:#c9a84c;--gold-l:#e8c86a;--bg:#f4f6fb;--bd:#dde3f0;--mu:#6b7896;--red:#e74c3c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:Sarabun,sans-serif;color:var(--navy);font-size:15px}
button,select{font:inherit}
.demo{background:#fff6dc;border-bottom:1px solid #ecd9a0;color:#7a5d12;font-size:13px;padding:8px 16px;text-align:center}
.hd{background:var(--navy);border-bottom:3px solid var(--gold);color:#fff}.hd div{max-width:560px;margin:0 auto;padding:12px 16px;font-weight:800;letter-spacing:.08em}.hd span{color:var(--gold)}
.wrap{max-width:560px;margin:0 auto;padding:16px}
.hero{background:radial-gradient(120% 120% at 0% 0%,#2a4785 0%,#13254f 55%,#0a1530 100%);color:#fff;border-radius:20px;padding:18px}
.hero h1{margin:0;font-size:24px}.hero h1 span{color:var(--gold-l)}.hero p{margin:4px 0 0;opacity:.85;font-size:14px}
.urg{display:flex;align-items:center;gap:12px;margin-top:12px;background:rgba(231,76,60,.15);border:1px solid rgba(255,140,120,.45);border-radius:14px;padding:10px 12px}
.urg .n{font-size:30px;font-weight:800;color:#ffd0c8;line-height:1}.urg b{display:block;font-size:15px}.urg small{display:block;font-size:12px;opacity:.8}
.live{display:inline-flex;align-items:center;gap:5px}.live i{width:8px;height:8px;border-radius:50%;background:#2ecc71;box-shadow:0 0 0 3px rgba(46,204,113,.25)}
.sec{display:flex;align-items:center;gap:8px;font-weight:800;font-size:16.5px;margin:18px 0 10px}.sec small{margin-left:auto;font-weight:500;color:var(--mu);font-size:13px}
.provs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.prov{position:relative;border:2px solid var(--bd);background:#fff;border-radius:18px;padding:16px 14px 14px;text-align:left;color:var(--navy);border-top:6px solid var(--c);cursor:pointer}
.prov .pi{font-size:28px;display:block}.prov b{display:block;font-size:19px;margin-top:4px}.prov small{display:block;color:var(--mu);font-size:12.5px}
.badge{display:inline-flex;align-items:center;gap:4px;margin-top:8px;background:#fdeceb;color:#c0392b;border:1px solid #f3b4ad;border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:800}
.badge.ok{background:#eef1f6;color:var(--mu);border-color:var(--bd);font-weight:600}
.back{border:0;background:none;color:var(--mu);font-weight:700;padding:4px 0;margin:8px 0;cursor:pointer}
.bar{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--bd);border-left:6px solid var(--c);border-radius:14px;padding:12px 14px}
.bar .pi{font-size:26px}.bar small{display:block;color:var(--mu);font-size:12px}.bar b{font-size:19px}.bar .badge{margin:0 0 0 auto}
.gcards{display:grid;gap:10px}
.gcard{display:grid;grid-template-columns:auto 1fr;column-gap:14px;align-items:center;text-align:left;border:2px solid var(--bd);background:#fff;border-radius:18px;padding:16px;color:var(--navy);cursor:pointer}
.gcard .gi{grid-row:1/4;font-size:36px;width:60px;height:60px;border-radius:16px;background:#f1ead6;display:grid;place-items:center}
.gcard b{font-size:18px}.gcard small{color:var(--mu);font-size:13px}.gcard .badge{justify-self:start}
.dd{width:100%;border:2px solid var(--gold);background:#fffaf0;font-weight:700;font-size:16px;padding:14px 12px;border-radius:12px;color:var(--navy)}
.sel{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin-top:12px}
.sel .ic{font-size:26px}.sel b{display:block;font-size:16px}.sel small{color:var(--mu);font-size:13px}
.go{display:block;width:100%;margin-top:10px;border:0;border-radius:14px;padding:15px;font-weight:800;font-size:17px;color:var(--navy);background:linear-gradient(135deg,#f3dc93,#c9a84c);cursor:pointer}
.hrbox{background:#fff;border:1px solid var(--bd);border-radius:16px;padding:14px;margin-top:24px}
.hrbox h3{margin:0 0 4px;font-size:16px}.hrbox p{margin:0 0 10px;color:var(--mu);font-size:13px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{background:var(--navy);color:#fff;font-weight:600;padding:7px 8px;text-align:left;font-size:12.5px}
td{border-top:1px solid #eef1f6;padding:7px 8px}td.n{text-align:center;font-weight:800}td.v{color:#c0392b}
.note{font-size:13px;color:var(--mu);background:#fff;border:1px dashed var(--bd);border-radius:12px;padding:10px 12px;margin-top:12px;line-height:1.7}
</style>
</head>
<body>
<div class="demo">👀 <b>ตัวอย่าง “ตำแหน่งรับด่วน”</b> — ดึง<b>ข้อมูลจริง</b>จากชีตค่างาน (อัปเดตทุก ~5 นาที) · ยังไม่ได้ใส่ในแอป · กดสมัครยังไม่ไปไหน</div>
<div class="hd"><div>RATTANA <span>JOBS</span></div></div>
<div class="wrap" id="app"><div style="padding:40px;text-align:center;color:#6b7896">กำลังดึงข้อมูลค่างาน...</div></div>
<script>
const CSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRJJj0Ag4kOmzOwFgm7oVaX_-MsvWSfVissZQZAXZryrUauLQblx3WbhWkkvYEN3tCLUo6vL_Rcda1m/pub?gid=1639155684&single=true&output=csv';
/* รหัสศูนย์ → จังหวัด (ตามแอป HR Docs / กำลังคน) · สีประจำศูนย์ */
const PROV = [
  { k:'สมุทรสงคราม', codes:['W1','HQ'], ic:'🟡', c:'#d4a017', sub:'สำนักงานใหญ่ · คลังสินค้า · ปั๊มน้ำมัน' },
  { k:'สุพรรณบุรี',  codes:['W2'], ic:'🔵', c:'#2563eb', sub:'คลังสินค้า' },
  { k:'ราชบุรี',     codes:['W3'], ic:'🔴', c:'#dc2626', sub:'คลังสินค้า' },
  { k:'นครปฐม',     codes:['W4','C4'], ic:'🟢', c:'#16a34a', sub:'คลังสินค้า · รัตนมาร์ท' } ];
/* ไม่แสดงให้ผู้สมัคร : ผู้บริหาร / ฝึกงาน / คนพิการ (โควตา) */
const HIDE = /ประธาน|รองประธาน|ฝึกงาน|คนพิการ/;
const PUMP = ['พนักงานหน้าลาน (เติมน้ำมัน)','พนักงานแคชเชียร์','พนักงานประจำร้าน','ผู้ช่วยผู้จัดการสาขา','พนักงานขาย (บาริสต้า)'];
let ROWS = [], asOf = '', prov = '', grp = '', sel = '';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function parseCsv(t){ const out = []; let row = [], f = '', q = false;
  for(let i = 0; i < t.length; i++){ const c = t[i];
    if(q){ if(c === '"'){ if(t[i+1] === '"'){ f += '"'; i++; } else q = false; } else f += c; }
    else if(c === '"') q = true; else if(c === ','){ row.push(f); f = ''; } else if(c === '\n'){ row.push(f); out.push(row); row = []; f = ''; } else if(c !== '\r') f += c; }
  if(f || row.length){ row.push(f); out.push(row); } return out; }
const grpOf = r => r.code === 'C4' ? 'mart' : 'wh';
const GRP = { wh:{ t:'คลังสินค้า / สำนักงาน', ic:'🏢' }, pump:{ t:'ปั๊มน้ำมัน PTT', ic:'⛽' }, mart:{ t:'รัตนมาร์ท', ic:'🛒' } };
const rowsOf = (p, g) => ROWS.filter(r => p.codes.includes(r.code) && (!g || grpOf(r) === g));
const vac = L => L.reduce((s, r) => s + Math.max(0, r.need - r.have), 0);
const groupsOf = p => p.k === 'สมุทรสงคราม' ? ['wh','pump'] : p.k === 'นครปฐม' ? ['wh','mart'] : ['wh'];
function badge(n){ return n > 0 ? `<span class="badge">🔥 รับด่วน ${n} อัตรา</span>` : `<span class="badge ok">รับสมัครทั่วไป</span>`; }
/* รวมตำแหน่งชื่อเดียวกันในจังหวัด (เช่น HQ+W1) */
function posList(L){ const m = {}; L.forEach(r => { const o = m[r.pos] = m[r.pos] || { pos:r.pos, need:0, have:0 }; o.need += r.need; o.have += r.have; });
  return Object.values(m).map(o => ({ ...o, v:Math.max(0, o.need - o.have) })).sort((a, b) => b.v - a.v || a.pos.localeCompare(b.pos, 'th')); }
function paint(){
  const app = document.getElementById('app'), total = vac(ROWS);
  const hero = `<div class="hero"><h1>ร่วมงานกับ <span>รัตนไพบูลย์</span></h1><p>สมัครงานออนไลน์ง่าย ๆ ไม่ถึง 10 นาที</p>
    <div class="urg"><span class="n">${total}</span><div><b>🔥 อัตราที่รับด่วนตอนนี้</b><small class="live"><i></i>อัปเดตจากระบบอัตโนมัติ ${esc(asOf)}</small></div></div></div>`;
  if(!prov){
    app.innerHTML = hero + `<div class="sec">📍 ขั้นที่ 1 · เลือกจังหวัดที่อยากทำงาน</div>
      <div class="provs">${PROV.map(p => `<button class="prov" style="--c:${p.c}" onclick="prov='${p.k}';grp='';sel='';paint()"><span class="pi">${p.ic}</span><b>${p.k}</b><small>${p.sub}</small>${badge(vac(rowsOf(p)))}</button>`).join('')}</div>`;   /* ตาราง HR ไม่แสดงหน้าแรก — อยู่ในหลังบ้าน HR เท่านั้น */
    return;
  }
  const P = PROV.find(x => x.k === prov), gs = groupsOf(P);
  const bar = `<div class="bar" style="--c:${P.c}"><span class="pi">${P.ic}</span><div><small>จังหวัดที่เลือก</small><b>${P.k}</b></div>${badge(vac(rowsOf(P)))}</div>`;
  if(gs.length > 1 && !grp){
    app.innerHTML = `<button class="back" onclick="prov='';paint()">‹ เปลี่ยนจังหวัด</button>${bar}<div class="sec">🏷️ ขั้นที่ 2 · เลือกประเภทงาน</div>
      <div class="gcards">${gs.map(g => `<button class="gcard" onclick="grp='${g}';sel='';paint()"><span class="gi">${GRP[g].ic}</span><b>${GRP[g].t}</b>
        ${g === 'pump' ? '<small>หน้าลาน แคชเชียร์ ร้านสะดวกซื้อ ร้านกาแฟ</small><span class="badge ok">รับสมัครทั่วไป</span>' : badge(vac(rowsOf(P, g)))}</button>`).join('')}</div>`;
    return;
  }
  const g = grp || gs[0];
  let urgent = [], normal = [];
  if(g === 'pump') normal = PUMP.map(p => ({ pos:p, v:0 }));
  else { const L = posList(rowsOf(P, g)).filter(o => !HIDE.test(o.pos)); urgent = L.filter(o => o.v > 0); normal = L.filter(o => o.v === 0); }
  const cur = [...urgent, ...normal].find(o => o.pos === sel);
  app.innerHTML = `<button class="back" onclick="${gs.length > 1 ? "grp='';sel='';paint()" : "prov='';sel='';paint()"}">‹ ย้อนกลับ</button>${bar}
    <div class="sec">💼 เลือกตำแหน่ง${gs.length > 1 ? ' — ' + GRP[g].ic + ' ' + GRP[g].t : ''}</div>
    <select class="dd" onchange="sel=this.value;paint()"><option value="">— แตะเพื่อเลือกตำแหน่ง —</option>
      ${urgent.length ? `<optgroup label="🔥 รับด่วน · ยังว่าง">${urgent.map(o => `<option value="${esc(o.pos)}"${sel===o.pos?' selected':''}>${esc(o.pos)} · ว่าง ${o.v}</option>`).join('')}</optgroup>` : ''}
      ${normal.length ? `<optgroup label="รับสมัครทั่วไป (เก็บใบสมัครไว้พิจารณา)">${normal.map(o => `<option value="${esc(o.pos)}"${sel===o.pos?' selected':''}>${esc(o.pos)}</option>`).join('')}</optgroup>` : ''}
    </select>
    ${cur ? `<div class="sel"><span class="ic">${cur.v > 0 ? '🔥' : '💼'}</span><div><b>${esc(cur.pos)}</b><small>${cur.v > 0 ? `รับด่วน · ยังว่าง ${cur.v} อัตรา` : 'รับสมัครทั่วไป — เก็บใบสมัครไว้พิจารณาเมื่อมีตำแหน่งว่าง'}</small></div></div>
      <button class="go" onclick="alert('ตัวอย่าง: ไปหน้ากรอกใบสมัคร ตำแหน่ง ' + sel)">📝 สมัครตำแหน่งนี้ ›</button>` : ''}`;
}
function hrTable(){
  const byC = {}; ROWS.filter(r => !HIDE.test(r.pos) && r.need > r.have).forEach(r => (byC[r.code] = byC[r.code] || []).push(r));
  const name = { HQ:'สำนักงานใหญ่', W1:'W1 สมุทรสงคราม', W2:'W2 สุพรรณบุรี', W3:'W3 ราชบุรี', W4:'W4 นครปฐม', C4:'C4 รัตนมาร์ท' };
  return `<div class="hrbox"><h3>🖥️ (หลังบ้าน HR) ตำแหน่งว่าง เทียบกับใบสมัคร</h3><p>ในแอปจริงจะมีคอลัมน์ “ใบสมัคร” และ “นัดแล้ว” นับจากใบสมัครในระบบให้ด้วย</p>
    <table><tr><th>ศูนย์</th><th>ตำแหน่ง</th><th style="text-align:center">ต้องมี</th><th style="text-align:center">มี</th><th style="text-align:center">ว่าง</th></tr>
    ${Object.keys(byC).sort().map(c => byC[c].sort((a, b) => (b.need - b.have) - (a.need - a.have)).map((r, i) => `<tr><td>${i === 0 ? esc(name[c] || c) : ''}</td><td>${esc(r.pos)}</td><td class="n">${r.need}</td><td class="n">${r.have}</td><td class="n v">${r.need - r.have}</td></tr>`).join('')).join('')}</table></div>
    <div class="note">ไม่แสดงให้ผู้สมัคร: ประธาน / รองประธาน / ฝึกงาน / คนพิการ · ปั๊มน้ำมันยังไม่มีในชีตค่างาน (ขึ้นเป็นรับสมัครทั่วไป)</div>`;
}
fetch(CSV + '&t=' + Date.now()).then(r => r.text()).then(t => {
  const rows = parseCsv(t), h = rows[0] || [];
  const i = h.indexOf('ศูนย์');           /* ตารางสรุปเริ่มคอลัมน์ H */
  ROWS = rows.slice(1).map(r => ({ code:(r[i]||'').trim(), dept:(r[i+1]||'').trim(), pos:(r[i+2]||'').trim(), need:+r[i+3] || 0, have:+r[i+4] || 0 })).filter(r => r.code && r.pos);
  const o2 = (rows[1] || [])[14]; asOf = o2 ? '· ' + o2 : '';
  paint();
}).catch(e => { document.getElementById('app').innerHTML = '<div style="padding:30px;text-align:center">ดึงข้อมูลค่างานไม่ได้ — ' + esc(e.message) + '</div>'; });
</script>
</body>
</html>
