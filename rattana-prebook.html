<!doctype html>
<html lang="th" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eef3f9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="icons/rattana-prebook-32.png">
<link rel="apple-touch-icon" href="icons/rattana-prebook-180.png">
<title>Rattana Pre-Book v1.5</title>
<!-- หน้าตา: Rattana CI (เฉพาะแอปนี้ · Surat เคาะ 2026-11-21) -->
<link rel="stylesheet" href="https://rattanaphaiboon.github.io/app/rattana-ui/rattana-ui.css">
<script src="https://rattanaphaiboon.github.io/app/rattana-ui/rattana-ui.js" defer></script>
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://drive.google.com">
<link rel="preconnect" href="https://lh3.googleusercontent.com">
<style>
:root{--pad:16px;--gap:12px;--nav-space:110px;--card-r:22px}
body{padding-bottom:var(--nav-space)}
.wrap{max-width:760px;margin:0 auto;padding:0 var(--pad)}
.one{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
[hidden]{display:none!important}
.ico{width:20px;height:20px;flex:none}
button{font-family:inherit}

/* หัวแอป (แบบ ROO: โลโก้ซ้าย · ตะกร้าทองขวา) */
.top{position:sticky;top:8px;z-index:30;margin:10px var(--pad) 0;display:flex;align-items:center;gap:10px;padding:8px 8px 8px 12px;border-radius:22px}
.top .rt-logo{flex:none}.top .rt-logo img{height:28px}
.top__t{flex:1;min-width:0;line-height:1.15}
.top__t b{display:block;font-size:15px;color:var(--ink)}
.top__t small{display:block;font-size:11px;color:var(--text-subtle);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cartBtn{position:relative;height:44px;padding:0 14px 0 12px;gap:8px}
.cartBtn .rt-count{position:absolute;top:-6px;right:-4px;background:var(--reject);color:#fff}
.backBtn{width:40px;height:40px;padding:0;flex:none}
.hubBtn{height:40px;padding:0 14px;gap:6px}
.hubBtn img{width:20px;height:20px;border-radius:6px}

/* ร้าน + แคมเปญ */
.shop{display:flex;align-items:center;gap:12px;width:100%;margin-top:12px;padding:10px 12px;border-radius:18px;border:1px dashed var(--border);background:var(--field);color:var(--text);text-align:left;cursor:pointer}
.shop[data-set]{border-style:solid;border-color:rgba(252,183,15,.6);background:var(--gold-soft)}
.shop__l{font-size:11px;color:var(--text-muted)}
.shop__n{font-size:15px;font-weight:700;color:var(--ink)}
.hero{margin-top:12px;padding:16px;border-radius:var(--card-r);color:#fff;background:linear-gradient(150deg,var(--navy) 0%,var(--navy-700) 70%,#2a5288 100%);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,rgba(252,183,15,.45),transparent 70%);pointer-events:none}
.hero h2{margin:8px 0 4px;font-size:22px;line-height:1.2;color:#fff}
.hero p{margin:0 0 10px;font-size:14px;opacity:.92;line-height:1.5}
.hero__m{display:flex;flex-wrap:wrap;gap:6px}
.hero__m span{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);font-size:12px}
.hero__m .ico{width:14px;height:14px}
.camp{display:block;width:100%;text-align:left;border:0;padding:0;background:none;cursor:pointer;margin-top:12px}

/* ค้นหา (ROO: ช่องค้น · สแกน · หมวด) */
.sr{position:sticky;top:76px;z-index:20;display:flex;gap:8px;align-items:center;padding:10px 0;background:linear-gradient(var(--page) 70%,transparent)}
.sr .rt-search{flex:1}
.sr .rt-btn{height:46px;width:46px;padding:0;flex:none;min-width:0}

/* แถวแบรนด์ */
.tiles{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 12px;scrollbar-width:none}
.tiles::-webkit-scrollbar{display:none}
.tl{flex:none;width:72px;display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:none;cursor:pointer;font-size:11px;font-weight:600;color:var(--text-muted);padding:0}
.tl .rt-tile{width:60px;height:60px;border-radius:20px}
.tl[aria-pressed="true"]{color:var(--ink)}
.tl[aria-pressed="true"] .rt-tile{outline:2.5px solid var(--gold);outline-offset:2px}
.tl span.one{max-width:72px}

/* การ์ดสินค้า (ROO) */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--gap)}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(min-width:960px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.pc{position:relative;display:flex;flex-direction:column;gap:6px;padding:10px;border-radius:var(--card-r);transition:box-shadow .2s,transform .12s}
.pc.in{box-shadow:0 0 0 2.5px var(--gold),var(--shadow-gold);background:linear-gradient(180deg,var(--gold-soft) 0%,var(--surface) 45%)}
.pc__media{position:relative;height:118px;border-radius:16px;display:grid;place-items:center;background:#fff;overflow:hidden}
[data-theme="dark"] .pc__media{background:rgba(255,255,255,.92)}
.pc__media img{max-width:86%;max-height:90%;object-fit:contain}
.pc__media .rt-tile{width:60px;height:60px;border-radius:20px}
.pc__in{position:absolute;top:8px;right:8px;height:22px;padding:0 9px;border-radius:999px;font-size:11px;font-weight:700;color:var(--on-gold);background:var(--gold);display:inline-flex;align-items:center;gap:3px}
.pc__in .ico{width:12px;height:12px}
.pc__min{position:absolute;bottom:8px;left:8px;height:22px;padding:0 9px;border-radius:999px;font-size:11px;font-weight:700;color:#fff;background:var(--navy);display:inline-flex;align-items:center}
.pc__name{margin:2px 2px 0;font-size:13.5px;font-weight:600;line-height:1.35;color:var(--text);flex:1;word-break:break-word}
.pc__media{cursor:zoom-in}
.zoom{display:block;width:100%;max-height:62vh;object-fit:contain;border-radius:16px;background:#fff}
.zoom-ph{display:grid;place-items:center;height:220px;border-radius:16px;background:#fff}
.zoom-ph .rt-tile{width:120px;height:120px;border-radius:36px}
.shopimg{flex:none;width:44px;height:44px;border-radius:14px;object-fit:cover;background:var(--field)}
.lr .rt-cell-main.wrap{white-space:normal}
.pc__price{margin:0 2px;font-size:22px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.pill{display:flex;align-items:center;height:46px;margin-top:4px;padding:0 4px;border:0;border-radius:999px;background:var(--navy);color:#fff;cursor:pointer;width:100%}
[data-theme="dark"] .pill{background:#1c3b5c}
.pill__u{flex:1;text-align:center;font-size:14px;font-weight:700;white-space:nowrap}
.pill__s{flex:0 0 38px}
.pill__p,.pill__m{flex:0 0 38px;width:38px;height:38px;border:0;border-radius:50%;display:grid;place-items:center;cursor:pointer;padding:0}
.pill__p{background:linear-gradient(180deg,#ffd35a,var(--gold) 55%,var(--gold-hover));color:var(--on-gold);box-shadow:var(--shadow-gold)}
.pill__m{background:rgba(255,255,255,.12);color:#fff}
.pill__p:active,.pill__m:active{transform:scale(.86)}
.pill__q{flex:1;display:flex;flex-direction:column;align-items:center;line-height:1.05;border:0;background:none;color:#fff;cursor:pointer}
.pill__q b{font-size:18px}
.pill__q small{font-size:10.5px;opacity:.8}
.grpH{display:flex;align-items:baseline;gap:8px;margin:18px 2px 8px;font-size:16px;font-weight:700;color:var(--ink)}
.grpH small{font-size:12px;font-weight:500;color:var(--text-muted)}
.more{display:block;margin:16px auto 0}

/* ตะกร้า */
.h2row{display:flex;align-items:center;justify-content:space-between;margin:16px 2px 4px}
.h2row b{font-size:20px;color:var(--ink);border-left:4px solid var(--gold);padding-left:10px}
.box{margin-top:12px;padding:6px 14px;border-radius:var(--card-r)}
.ci{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.ci:last-child{border-bottom:0}
.thumb{flex:none;width:52px;height:52px;border-radius:16px;background:#fff;display:grid;place-items:center;overflow:hidden}
.thumb img{max-width:90%;max-height:90%;object-fit:contain}
.thumb .rt-tile{width:52px;height:52px;border-radius:16px}
.ci__m{flex:1;min-width:0}
.ci__n{font-size:13.5px;font-weight:600;color:var(--text);line-height:1.35}
.ci__w{font-size:12px;color:var(--reject-text);font-weight:600;margin-top:2px}
.ci__r{display:flex;align-items:center;gap:8px;margin-top:8px}
.ci__p{flex:1;text-align:right;line-height:1.2}
.ci__p b{font-size:16px;color:var(--ink);font-variant-numeric:tabular-nums}
.ci__p small{display:block;font-size:11px;color:var(--text-muted)}
.rt-stepper .plus{background:linear-gradient(180deg,#ffd35a,var(--gold));color:var(--on-gold)}
.delBtn{width:40px;height:40px;padding:0;color:var(--reject)}
.sumRow{display:flex;justify-content:space-between;padding:8px 0;font-size:14px;color:var(--text-muted)}
.sumTot{display:flex;justify-content:space-between;align-items:baseline;padding:10px 0;border-top:1px solid var(--line);margin-top:4px}
.sumTot span{font-size:15px;font-weight:700;color:var(--ink)}
.sumTot b{font-size:28px;color:var(--ink);font-variant-numeric:tabular-nums}
.why{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:12px;color:var(--reject-text);font-weight:600}
.cfm{margin-top:14px;width:100%;height:54px;font-size:16px}

/* ลิสต์ทั่วไป */
.secH{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:18px 2px 6px;font-size:13px;font-weight:700;color:var(--text-muted)}
.lr{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);width:100%;border-left:0;border-right:0;border-top:0;background:none;text-align:left;color:inherit}
button.lr{cursor:pointer}
.lr:last-child{border-bottom:0}
.lr__m{flex:1;min-width:0}
.lr__e{text-align:right;line-height:1.3;flex:none}
.lr__e b{font-size:15px;color:var(--ink);font-variant-numeric:tabular-nums}
.empty{margin-top:16px;padding:28px 20px;border-radius:22px;text-align:center}
.empty h3{margin:12px 0 4px;font-size:17px;color:var(--ink)}
.empty p{margin:0 0 12px;color:var(--text-muted);font-size:14px}
.skel{height:220px;border-radius:22px}
.foot{margin:24px 2px 0;font-size:12px;color:var(--text-subtle);display:flex;justify-content:space-between;gap:8px;align-items:center}

/* จัดซื้อ */
.stepH{display:flex;align-items:center;gap:10px;margin:20px 2px 8px;font-size:17px;font-weight:700;color:var(--ink)}
.stepH .rt-tile{width:28px;height:28px;border-radius:10px;font-size:13px}
.card{padding:16px;border-radius:var(--card-r);display:flex;flex-direction:column;gap:14px}
.row2{display:flex;flex-wrap:wrap;gap:10px}
.row2>.rt-field{flex:1 1 40%;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips .rt-chip small{font-weight:500;opacity:.75}
.cnt{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--text-muted)}
.cnt b{font-size:24px;color:var(--ink)}
.sku{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.sku:last-child{border-bottom:0}
.sku__m{flex:1;min-width:0}
.sku__m div{font-size:13px;font-weight:600;color:var(--text)}
.sku__m small{font-size:11px;color:var(--text-muted)}
.sku[data-off] .sku__m{opacity:.45}
.sku .rt-input{width:64px;height:40px;padding:0;text-align:center;flex:none}
.code{font-family:ui-monospace,Consolas,monospace;font-size:11.5px;line-height:1.5;white-space:pre;overflow:auto;max-height:240px;padding:12px;border-radius:14px;background:var(--field);color:var(--text)}
details summary{cursor:pointer;font-size:13px;font-weight:700;color:var(--ink);padding:8px 2px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap);margin-top:12px}
.kpis .wide{grid-column:1/-1}
.selSum{font-size:12px;color:var(--text-muted)}

/* ล็อกอิน */
.login{max-width:420px;margin:12vh auto 0;padding:28px 22px;border-radius:26px;text-align:center}
.login h1{font-size:22px;margin:16px 0 6px;color:var(--ink)}
.login p{color:var(--text-muted);font-size:14px;margin:0 0 18px}
.login .gbox{display:flex;justify-content:center;min-height:44px}
.login .err{color:var(--reject-text);font-size:13px;margin-top:12px;font-weight:600}
.or{display:flex;align-items:center;gap:10px;margin:18px 0 12px;font-size:12px;color:var(--text-muted)}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.telrow{display:flex;gap:8px}.telrow .rt-input{flex:1;min-width:0;font-size:16px}
.choose{display:flex;flex-direction:column;gap:8px;margin-top:12px;text-align:left}
.dwrap{position:relative;display:flex;align-items:center}
.dwrap .rt-input{flex:1;min-width:0;padding-right:48px}
.dwrap .dbtn{position:absolute;right:4px;width:40px;height:40px;padding:0;border:0;border-radius:12px;background:transparent;color:var(--ink);cursor:pointer;display:grid;place-items:center}
.dwrap .dbtn:hover{background:var(--hover)}
.dwrap input[type=date]{position:absolute;right:4px;bottom:0;width:40px;height:1px;opacity:0;pointer-events:none;border:0;padding:0}
</style>
</head>

const SESSION_KEYS = ['rattana_session', 'rattanaUser'];
function checkRattanaSession() { try { const p = JSON.parse(localStorage.getItem('rattana_session')); return p && p.data && p.data.email && p.exp && Date.now() < p.exp ? p.data : null; } catch (e) { return null; } }

/* ───── เรียกหลังบ้าน ───── */
async function gas(q, body) {
  const sig = getSig(), email = sig.split('|')[0] || '';
  let r;
  try {
    r = body ? await fetch(GAS_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ email, sig }, body)) })
      : await fetch(GAS_URL + '?' + q + '&email=' + encodeURIComponent(email) + '&sig=' + encodeURIComponent(sig) + '&t=' + Date.now(), { cache: 'no-store' });
  } catch (e) { throw new Error('ต่อหลังบ้านไม่ได้ ตรวจสัญญาณเน็ตแล้วลองใหม่'); }
  let j; try { j = await r.json(); } catch (e) { throw new Error('หลังบ้านตอบไม่ถูกต้อง (' + r.status + ')'); }
  if (!j.ok && j.needLogin) { setSig(''); showLogin('เข้าสู่ระบบใหม่อีกครั้ง'); throw new Error('ต้องเข้าสู่ระบบ'); }
  if (!j.ok) throw new Error(j.error || 'เกิดข้อผิดพลาด');
  return j;
}

  if (!itemsP[c.id]) itemsP[c.id] = gas('action=items&id=' + encodeURIComponent(c.id)).then(r => {
    S.items[c.id] = r.items;
    try { const m = JSON.parse(localStorage.getItem(ITEMS_KEY) || '{}'); Object.keys(m).forEach(k => { if (k.split('|')[0] === c.id || Date.now() - m[k].t > 864e5) delete m[k]; }); m[itemsKey(c)] = { t: Date.now(), items: r.items }; localStorage.setItem(ITEMS_KEY, JSON.stringify(m)); } catch (e) {}

/* v1.4 กดรูปสินค้า → ดูรูปใหญ่ */
function zoomProduct(id) {

  box.innerHTML = (big ? '<img class="zoom" src="' + esc(big) + '" alt="" referrerpolicy="no-referrer" onerror="this.outerHTML=\'<div class=zoom-ph>\' + tile(\'box\', \'navy\') + \'</div>\'">' : '<div class="zoom-ph">' + tile('box', toneOf(p.b)) + '</div>') +
    '<div style="margin-top:12px;font-size:15px;font-weight:600;color:var(--ink);line-height:1.4">' + esc(p.n) + '</div>' +
    '<div class="rt-cell-sub" style="margin-top:4px">' + esc(p.b) + ' · 1 ลัง = ' + p.q + ' ชิ้น · ' + esc(p.c) + '</div>' +

  UI().sheet({ content: box, actions: [{ label: 'ปิด', variant: 'glass', value: null }, { label: (S.qty[id] ? 'เพิ่มอีก 1 ลัง' : 'ใส่ตะกร้า'), variant: 'gold', value: 'add' }] })
    .then(v => { if (v === 'add') setQty(id, (S.qty[id] || 0) + (S.qty[id] ? 1 : (minOf(p) || 1))); });
}
function setBrand(k) { S.brand = k; S.show = 60; document.querySelectorAll('#tiles .tl').forEach(x => x.setAttribute('aria-pressed', x.dataset.b === k)); renderList(); }
function renderList() {
  const y = scrollY, ws = S.q.toLowerCase().split(/\s+/).filter(Boolean);
  const list = curItems().filter(p => (S.brand === 'ทั้งหมด' || p.b === S.brand) && ws.every(w => (p.n + ' ' + p.c + ' ' + p.b + ' ' + p.v + ' ' + p.s).toLowerCase().includes(w)));
  if (!list.length) { $('#plist').innerHTML = emptyBox('search', 'ไม่พบสินค้า', 'ลองค้นด้วยบาร์โค้ด หรือเลือกหมวด "ทั้งหมด"'); return; }
  let h = '', shown = 0;
  for (const V of grouped(list)) {
    if (shown >= S.show) break;
    h += '<div class="grpH"><span class="one">' + esc(V.key) + '</span><small>' + V.items.length + ' รายการ</small></div><div class="grid">';
    for (const B of V.brands) for (const Sz of B.sizes) for (const p of Sz.items) { if (shown >= S.show) break; h += card(p); shown++; }
    h += '</div>';
  }
  if (list.length > shown) h += '<button class="rt-btn rt-btn-glass more">ดูเพิ่มอีก ' + Math.min(60, list.length - shown) + ' รายการ (เหลือ ' + (list.length - shown) + ')</button>';

}
function card(p) {
  const n = S.qty[p.c] || 0, mn = minOf(p);

    '<div class="pc__media">' + (mn ? '<span class="pc__min">ขั้นต่ำ ' + mn + ' ลัง</span>' : '') + (n ? '<span class="pc__in">' + ic('check') + 'ในตะกร้า</span>' : '') + media(p) + '</div>' +

    (n ? '<div class="pill"><button class="pill__m" data-d="-1" aria-label="ลด">' + ic('minus') + '</button><button class="pill__q" aria-label="พิมพ์จำนวน"><b>' + n + '</b><small>ลัง x' + p.q + '</small></button><button class="pill__p" data-d="1" aria-label="เพิ่ม">' + ic('plus') + '</button></div>'
       : '<button class="pill" data-d="' + (mn || 1) + '"><span class="pill__s"></span><span class="pill__u">ลัง x' + p.q + '</span><span class="pill__p">' + ic('plus') + '</span></button>') +

function setQty(id, n) {

function typeQty(id) {

/* ───── เลือกร้าน ───── */
/* v1.4 รายชื่อร้าน: จำในเครื่อง 6 ชม. + โหลดล่วงหน้าตั้งแต่เปิดแอป */
let shopsP = null;
function loadShops() {
  if (S.shops) return Promise.resolve(S.shops);
  try { const c = JSON.parse(localStorage.getItem(SHOPS_KEY) || 'null'); if (c && c.sig === getSig() && Date.now() - c.t < 6 * 36e5) { S.shops = c.shops; return Promise.resolve(S.shops); } } catch (e) {}
  if (!shopsP) shopsP = gas('action=shops').then(r => { S.shops = r.f === 2 ? r.shops.map(x => ({ c: x[0], n: x[1], a: x[2], mine: !!x[3], img: x[4] ? 'https://drive.google.com/thumbnail?id=' + x[4] + '&sz=w160' : '' })) : r.shops; try { localStorage.setItem(SHOPS_KEY, JSON.stringify({ sig: getSig(), t: Date.now(), shops: S.shops })); } catch (e) {} return S.shops; }).finally(() => { shopsP = null; });
  return shopsP;
}
async function pickShop(after) {
  if (S.me && S.me.isCustomer) { S.shop = S.me.shop; if (typeof after === 'function') after(); return; }
  const box = document.createElement('div');
  box.innerHTML = '<label class="rt-search" style="margin-bottom:10px">' + ic('search') + '<input id="sq" placeholder="ชื่อร้าน · รหัส · ตำบล/อำเภอ" aria-label="ค้นหาร้าน"></label><div id="sl">' + skel(2) + '</div>';
  let api = null;
  UI().sheet({ title: 'เลือกร้านค้า', content: box, actions: [{ label: 'ปิด', variant: 'glass', value: null }], onOpen: a => { api = a; } });
  const sl = box.querySelector('#sl'), sq = box.querySelector('#sq');
  if (!S.shops) { try { await loadShops(); } catch (e) { sl.innerHTML = '<p class="why">' + ic('alert') + esc(e.message) + '</p>'; return; } }
  const draw = () => {
    const ws = sq.value.toLowerCase().split(/\s+/).filter(Boolean);
    const L = S.shops.filter(s => ws.every(w => (s.n + ' ' + s.c + ' ' + s.a + ' ' + s.w).toLowerCase().includes(w))).slice(0, 80);
    sl.innerHTML = L.length ? L.map(s => '<button class="lr" data-c="' + esc(s.c) + '" data-n="' + esc(s.n) + '">' + (s.img ? '<img class="shopimg" src="' + esc(s.img) + '" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.replaceWith(Object.assign(document.createElement(\'span\'),{className:\'shopimg\'}))">' : tile('store', S.shop && S.shop.c === s.c && S.shop.n === s.n ? 'gold' : (s.mine ? 'navy' : 'blue'), 'rt-tile-sm')) +
      '<div class="lr__m"><div class="rt-cell-main wrap">' + esc(s.n) + '</div><div class="rt-cell-sub one">' + esc(s.a || '') + '</div></div>' + (s.mine ? '<span class="rt-badge rt-badge-gold">ร้านของฉัน</span>' : '') + '</button>').join('')
      : '<p class="rt-muted" style="text-align:center;padding:16px 0">ไม่พบร้าน ลองค้นด้วยรหัสหรือชื่ออำเภอ</p>';
  };
  draw(); sq.addEventListener('input', draw);
  sl.addEventListener('click', e => {
    const b = e.target.closest('[data-c]'); if (!b) return;
    const s = S.shops.find(x => x.c === b.dataset.c && x.n === b.dataset.n); if (!s) return;
    S.shop = { c: s.c, n: s.n }; S.nonce = ''; saveCart();
    if (api) api.close(null);
    if ($('#shopBtn')) { const t = document.createElement('div'); t.innerHTML = shopBtn(); $('#shopBtn').replaceWith(t.firstChild); $('#shopBtn').onclick = () => pickShop(after); }
    updCart();
    if (typeof after === 'function') setTimeout(after, 300);
  });
}

/* ═════════ ตะกร้า / สรุปออเดอร์ (แบบ ROO) ═════════ */
function vCart() {

  const ps = picked(), amt = sum(ps, p => S.qty[p.c] * p.p), cs = sum(ps, p => S.qty[p.c]);

  $('#app').innerHTML = '<div class="h2row"><b>สรุปออเดอร์</b><button class="rt-btn rt-btn-link" id="more">เลือกสินค้าต่อ</button></div>' + shopBtn() +
    (ps.length ? '<div class="rt-glass box" id="lines">' + ps.map(p => {
      const mn = minOf(p), bad = mn && S.qty[p.c] < mn;
      return '<div class="ci" data-id="' + esc(p.c) + '"><div class="thumb">' + media(p) + '</div><div class="ci__m"><div class="ci__n">' + esc(p.n) + '</div>' + (bad ? '<div class="ci__w">ขั้นต่ำ ' + mn + ' ลัง</div>' : '') +
        '<div class="ci__r"><div class="rt-stepper"><button data-d="-1" aria-label="ลด">' + ic('minus') + '</button><span>' + S.qty[p.c] + '</span><button class="plus" data-d="1" aria-label="เพิ่ม">' + ic('plus') + '</button></div>' +
        '<div class="ci__p"><b>' + baht(S.qty[p.c] * p.p) + '</b><small>' + baht(p.p) + '/ลัง</small></div><button class="rt-btn rt-btn-ghost delBtn" data-x aria-label="ลบ">' + ic('trash') + '</button></div></div></div>';
    }).join('') + '</div>' : emptyBox('cart', 'ตะกร้ายังว่าง', 'กดปุ่มทอง + ที่การ์ดสินค้า', '<button class="rt-btn rt-btn-gold" onclick="go(\'present\')">เลือกสินค้า</button>')) +
    '<div class="rt-glass box" style="padding:14px"><div class="sumRow"><span>จำนวนรายการ</span><span>' + ps.length + ' รายการ</span></div><div class="sumRow"><span>จำนวนลังรวม</span><span>' + cs + ' ลัง</span></div>' +
    '<div class="sumTot"><span>ยอดรวมโดยประมาณ</span><b>' + baht(amt) + '</b></div>' +
    '<div class="sumRow" style="color:var(--ink);font-weight:600"><span style="display:flex;gap:6px;align-items:center">' + ic('truck') + 'ส่งของพร้อมกัน</span><span>' + esc(S.cur.deliverAt) + '</span></div>' +
    '<label class="rt-field" style="margin-top:8px"><span class="rt-field-label">หมายเหตุถึงจัดซื้อ (ถ้ามี)</span><textarea class="rt-textarea" id="note" rows="2" maxlength="300" placeholder="เช่น ขอส่งช่วงเช้า / โทรก่อนส่ง">' + esc(S.note) + '</textarea></label></div>' +
    (short.length ? '<div class="why">' + ic('alert') + 'มีสินค้าที่ยังไม่ถึงขั้นต่ำ แก้จำนวนก่อนยืนยัน</div>' : '') +
    (ps.length ? '<button class="rt-btn rt-btn-gold cfm" id="cfm"' + (short.length ? ' disabled' : '') + '>' + ic('check') + 'ยืนยัน take order · ' + baht(amt) + '</button>' : '');
  $('#more').onclick = () => go('present');
  $('#shopBtn').onclick = () => pickShop();

    if (e.target.closest('[data-x]')) { const old = S.qty[id]; S.qty[id] = 0; saveCart(); reCart(); UI().toast('เอาออกจากตะกร้าแล้ว', { type: 'info', duration: 5000, action: { label: 'เลิกทำ', onClick: () => { S.qty[id] = old; saveCart(); reCart(); } } }); return; }
    const b = e.target.closest('[data-d]'); if (b) { S.qty[id] = Math.max(0, (S.qty[id] || 0) + (+b.dataset.d)); S.nonce = ''; saveCart(); reCart(); }
  });
  if ($('#cfm')) $('#cfm').onclick = () => confirmOrder(ps, cs, amt);
}
function reCart() { const y = scrollY; vCart(); updCart(); scrollTo(0, y); }
function confirmOrder(ps, cs, amt) {
  if (!S.shop) { UI().toast('เลือกร้านก่อน take order', { type: 'warning' }); pickShop(() => { reCart(); confirmOrder(ps, cs, amt); }); return; }

  let res = null;
  UI().popup({ icon: 'question', title: 'ยืนยัน take order?', message: S.shop.n + ' · ' + ps.length + ' รายการ ' + cs + ' ลัง · ' + baht(amt) + ' · ส่งของ ' + S.cur.deliverAt,
    actions: [{ label: 'กลับไปแก้', variant: 'glass', value: false }, { label: 'ยืนยัน', variant: 'gold', value: true, onClick: async () => {
      const lines = {}; ps.forEach(p => lines[p.c] = String(S.qty[p.c]));
      try { res = await gas('', { action: 'submitOrder', campaignId: S.cur.id, shop: S.shop, lines, note: S.note, nonce: S.nonce }); return true; }
      catch (e) { UI().alert({ type: 'error', title: 'ส่งออเดอร์ไม่สำเร็จ', message: e.message + ' · ตะกร้ายังอยู่ ลองใหม่ได้' }); return false; }
    } }] })

}

async function vBooked() {

    $('#bk').innerHTML = '<div class="kpis"><div class="rt-glass rt-kpi wide"><div class="rt-kpi-head">' + tile('chart', 'gold', 'rt-tile-sm') + 'ยอดจองรวม · จบ ' + esc(c.closeAt) + '</div><span class="rt-kpi-value">' + baht(amt) + '</span></div>' +
      '<div class="rt-glass rt-kpi"><div class="rt-kpi-head">' + tile('store', 'blue', 'rt-tile-sm') + 'ร้าน / บิล</div><span class="rt-kpi-value">' + r.shops + ' / ' + r.bills + '</span></div>' +
      '<div class="rt-glass rt-kpi"><div class="rt-kpi-head">' + tile('box', 'navy', 'rt-tile-sm') + 'รวมลัง</div><span class="rt-kpi-value">' + cs.toLocaleString('en-US') + '</span></div></div>' +

      (items.length ? '<div class="rt-glass box">' + items.map(p => '<div class="lr"><div class="lr__m"><div class="rt-cell-main one" title="' + esc(p.n) + '">' + esc(p.n) + '</div><div class="rt-cell-sub one">' + esc(p.v) + ' · ' + esc(p.b) + ' · ' + esc(p.c) + '</div></div><div class="lr__e"><b>' + p.cs + ' ลัง</b><div class="rt-cell-sub">' + baht(p.amt) + '</div></div></div>').join('') + '</div>'
        : emptyBox('cart', 'ยังไม่มียอดจอง', 'เมื่อเซลล์ take order ยอดจะรวมขึ้นที่นี่'));

function exportCsv() {

async function phoneLogin(pick) {
  const tel = $('#tel').value.replace(/\D/g, ''), btn = $('#telBtn');
  if (tel.length < 9) { $('#lgErr').textContent = 'ใส่เบอร์โทร 9-10 หลัก'; return; }
  $('#lgErr').textContent = ''; UI().setLoading && UI().setLoading(btn, true);
  try {
    const r = await fetch(GAS_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 'loginPhone', phone: tel, pick: pick || '' }) }).then(x => x.json());
    if (!r.ok) throw new Error(r.error || 'เข้าใช้งานไม่สำเร็จ');
    if (r.choose) {
      $('#choose').innerHTML = '<div class="rt-cell-sub">เบอร์นี้มีหลายร้าน เลือกร้านที่จะสั่ง</div>' + r.choose.map(x => '<button class="rt-btn rt-btn-glass" data-id="' + esc(x.id) + '" style="justify-content:flex-start">' + ic('store') + '<span class="one">' + esc(x.n) + (x.a ? ' · ' + esc(x.a) : '') + '</span></button>').join('');
      $('#choose').querySelectorAll('[data-id]').forEach(b => b.onclick = () => phoneLogin(b.dataset.id));
      return;
    }
    setSig(r.sig); boot();
  } catch (e) { $('#lgErr').textContent = e.message; }
  finally { UI().setLoading && btn && UI().setLoading(btn, false); }
}
async function onGoogle(resp) {
  $('#lgErr').textContent = 'กำลังตรวจสอบ...';
  try {
    const r = await fetch(GAS_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 'login', credential: resp.credential }) }).then(x => x.json());
    if (!r.ok) throw new Error(r.error || 'เข้าสู่ระบบไม่สำเร็จ');
    setSig(r.sig);
    const u = r.me; saveSharedSession({ email: u.email, name: u.name, nickname: u.nickname, role: u.role, dept: u.dept, company: 'รัตนไพบูลย์', warehouse: u.warehouse, empId: u.empId, picture: '' });
    boot();
  } catch (e) { $('#lgErr').textContent = e.message; }
}
async function boot(force) {
  if (!getSig()) { showLogin(); return; }
  let shown = false;
  if (!S.me) {
    try { const c = JSON.parse(localStorage.getItem(INIT_KEY) || 'null'); if (c && c.sig === getSig() && c.r && c.r.me) { S.me = c.r.me; S.camps = c.r.campaigns; S.counts = c.r.counts; go('list'); shown = true; } } catch (e) {}
    if (!shown) $('#app').innerHTML = skel(3);
  }
  try {
    const r = await gas('action=init');
    try { localStorage.setItem(INIT_KEY, JSON.stringify({ sig: getSig(), r })); } catch (e) {}
    S.me = r.me; S.camps = r.campaigns; S.counts = r.counts;
    setTimeout(prefetchItems, 300);
    if (!S.me.isCustomer) setTimeout(() => loadShops().catch(() => {}), 1200);
    if (shown && !force) { if (S.page === 'list' || S.page === 'blist') go(S.page, true); return; }   /* v1.3 เปิดจากข้อมูลที่จำไว้ทันที แล้วค่อยอัปเดต */
    if (force) { S.items = {}; S.shops = null; S.catalog = null; UI().toast('โหลดข้อมูลใหม่แล้ว', { type: 'success', duration: 1500 }); }
    go(force && (S.page === 'list' || S.page === 'blist') ? S.page : 'list');
  } catch (e) { if (getSig()) $('#app').innerHTML = errBox(e.message, 'boot()'); }
}
$('#nav').addEventListener('click', e => { const a = e.target.closest('a'); if (!a) return; e.preventDefault(); if (a.dataset.p === 'create') { S.edit = S.edit || newCamp(); S.preview = S.edit.id || S.edit.vendors.length || S.edit.catbrands.length ? S.preview : null; } go(a.dataset.p); });
window.addEventListener('DOMContentLoaded', () => boot());
</script>
