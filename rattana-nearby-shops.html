<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Rattana ร้านใกล้ฉัน v1.5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{
  --navy:#0d1b3e;--navy-mid:#1a2f5e;--navy-light:#243b73;--gold:#c9a84c;--gold-light:#e8c86a;
  --success:#2ecc71;--danger:#e74c3c;--warning:#f39c12;--info:#3498db;
  --bg:#f4f6fb;--text:#0d1b3e;--card-bg:#fff;--border:#dde3f0;--muted:#6b7896;--row-alt:#fafbfd;
  --radius-sm:6px;--radius-md:12px;--radius-lg:16px;
  --shadow-md:0 2px 8px rgba(0,0,0,.08);--shadow-lg:0 8px 24px rgba(13,27,62,.12);--shadow-gold:0 4px 12px rgba(201,168,76,.35);
}
body.dark{--bg:#0a1020;--text:#e8eaf0;--card-bg:#111c35;--border:#243b73;--muted:#8a98b8;--row-alt:#0f1830}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Sarabun',sans-serif;font-size:14px;line-height:1.5;min-height:100dvh;overflow-x:hidden;background:var(--bg);color:var(--text);transition:background .25s,color .25s}
button{font-family:inherit;cursor:pointer;border:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
a{color:inherit}

/* header */
header{background:var(--navy);color:#fff;padding:10px 12px;position:sticky;top:0;z-index:1000;display:flex;align-items:center;gap:10px;border-bottom:3px solid var(--gold);padding-top:max(10px,env(safe-area-inset-top))}
header img{height:36px;width:36px;border-radius:50%;background:#fff}
.logo-text{font-weight:700;letter-spacing:.5px;font-size:16px;line-height:1.15}
.logo-text span{color:var(--gold)}
.logo-text small{display:block;font-weight:400;font-size:11px;color:rgba(255,255,255,.65);letter-spacing:0}
.hdr-sp{flex:1}
.icon-btn{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.2);width:38px;height:38px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-size:17px}
.icon-btn:hover{background:rgba(255,255,255,.12)}

/* layout */
.content{padding:12px;max-width:760px;margin:0 auto;width:100%}
.card{background:var(--card-bg);border-radius:var(--radius-md);border:1px solid var(--border);box-shadow:var(--shadow-md)}
.card-gold{border-top:3px solid var(--gold)}
.mb-12{margin-bottom:12px}
.txt-muted{color:var(--muted)}
.txt-sm{font-size:12px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;border:1px solid transparent;min-height:44px;transition:opacity .15s,transform .1s;text-decoration:none}
.btn:active{transform:scale(.97)}
.btn-gold{background:var(--gold);color:var(--navy)}
.btn-gold:hover{background:var(--gold-light)}
.btn-outline{background:transparent;color:var(--text);border-color:var(--border)}
.btn-primary{background:var(--navy);color:#fff}
body.dark .btn-primary{background:var(--navy-light)}
.btn-sm{padding:5px 10px;font-size:12px;min-height:34px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}

/* check-in */
.checkin{padding:16px;text-align:center}
.btn-checkin{width:100%;min-height:64px;font-size:18px;border-radius:var(--radius-lg);box-shadow:var(--shadow-gold)}
.pos-info{margin-top:10px;font-size:13px;color:var(--muted);min-height:20px}
.pos-info b{color:var(--text)}

/* shop cards */
.sec-title{font-size:15px;font-weight:700;margin:4px 2px 10px;display:flex;align-items:center;gap:8px}
.shop{display:flex;gap:12px;padding:14px;margin-bottom:10px;animation:fadeIn .25s ease both}
.rank{flex-shrink:0;width:34px;height:34px;border-radius:50%;background:var(--navy);color:var(--gold);font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center}
body.dark .rank{background:var(--navy-light)}
.shop.first .rank{background:var(--gold);color:var(--navy)}
.shop.first{border:2px solid var(--gold)}
.shop-main{flex:1;min-width:0}
.shop-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.shop-name{font-size:16px;font-weight:700;line-height:1.3;word-break:break-word}
.dist{flex-shrink:0;font-weight:700;font-size:15px;color:var(--gold);white-space:nowrap;text-align:right;line-height:1.25}
.shop-sub{font-size:12px;color:var(--muted);margin-top:2px;word-break:break-word}
.sales{margin-top:8px;display:flex;flex-direction:column;gap:6px}
.sale{background:var(--row-alt);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 10px}
.sale-name{font-weight:600;font-size:14px}
.sale-name .nick{color:var(--gold);font-weight:700}
.sale-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}

.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;white-space:nowrap}
.badge-ok{background:#e8f7ee;color:#1e8449}
.badge-warn{background:#fef3d7;color:#a87800}
.badge-danger{background:#ffd5d0;color:#c0392b}
.badge-info{background:#e3f0fd;color:#1a6fb8}
.badge-gold{background:rgba(201,168,76,.18);color:var(--text);border:1px solid rgba(201,168,76,.4)}
body.dark .badge-ok{background:#1a3a25;color:#7be0a3}
body.dark .badge-warn{background:#3a2e15;color:#e8c86a}
body.dark .badge-danger{background:#3a1a17;color:#ff8a7e}
body.dark .badge-info{background:#16304f;color:#8cc4f5}

.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.empty .big{font-size:40px;margin-bottom:6px}
.data-note{font-size:11px;color:var(--muted);text-align:center;margin:14px 0 80px}

/* login */
#loginScreen{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:16px;background:linear-gradient(160deg,var(--navy) 0%,var(--navy-mid) 100%)}
.login-box{background:var(--card-bg);border-radius:var(--radius-lg);border-top:4px solid var(--gold);padding:32px 24px;max-width:380px;width:100%;text-align:center;box-shadow:var(--shadow-lg)}
.login-box img{width:84px;height:84px;margin-bottom:10px}
.login-box h1{font-size:22px;margin-bottom:2px}
.login-box h1 span{color:var(--gold)}
.login-box p{color:var(--muted);font-size:13px;margin-bottom:20px}
.gsi-wrap{display:flex;justify-content:center;min-height:44px}
.login-err{background:#ffd5d0;color:#c0392b;border-radius:var(--radius-sm);padding:10px 12px;font-size:13px;margin-bottom:14px;display:none;text-align:left}
body.dark .login-err{background:#3a1a17;color:#ff8a7e}
.ver{margin-top:18px;font-size:11px;color:var(--muted)}

/* spinner / toast / top */
#spinner{display:none;position:fixed;inset:0;background:rgba(13,27,62,.6);align-items:center;justify-content:center;z-index:99999;backdrop-filter:blur(3px)}
#spinner.show{display:flex}
.spinner-box{background:#fff;border-radius:16px;padding:30px 40px;text-align:center;border-top:4px solid var(--gold);min-width:220px;color:var(--navy)}
body.dark .spinner-box{background:var(--card-bg);color:var(--text)}
.spinner-ring{width:48px;height:48px;border:5px solid #dde3f0;border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px}
#loadingBar{position:fixed;top:0;left:0;height:3px;background:var(--gold);width:0;transition:width .4s;z-index:10000}
.toast{position:fixed;bottom:max(24px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);padding:12px 20px;border-radius:var(--radius-md);color:#fff;z-index:99998;font-weight:500;box-shadow:var(--shadow-lg);max-width:92vw;font-size:13px;animation:fadeIn .3s ease}
.toast-success{background:#1e8449}.toast-error{background:var(--danger)}.toast-warning{background:var(--warning);color:var(--navy)}.toast-info{background:var(--navy-mid);border-left:3px solid var(--gold)}
#backToTop{position:fixed;bottom:max(24px,calc(16px + env(safe-area-inset-bottom)));right:max(16px,calc(12px + env(safe-area-inset-right)));background:var(--gold);color:var(--navy);border-radius:50%;width:46px;height:46px;display:none;align-items:center;justify-content:center;box-shadow:var(--shadow-gold);z-index:900;font-size:18px;font-weight:700}
#backToTop.show{display:flex}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.hidden{display:none!important}
</style>
</head>
<body>

<div id="loadingBar"></div>
<div id="spinner"><div class="spinner-box"><div class="spinner-ring"></div><p id="spinnerMsg">กำลังโหลด...</p></div></div>

<!-- ============ LOGIN ============ -->
<div id="loginScreen">
  <div class="login-box">
    <img id="loginLogo" alt="Rattana">
    <h1>Rattana <span>ร้านใกล้ฉัน</span></h1>
    <p>เช็คอินตำแหน่ง แล้วดูร้านค้าที่อยู่ใกล้ที่สุด 5 ร้าน<br>เฉพาะพนักงานรัตนไพบูลย์</p>
    <div class="login-err" id="loginErr"></div>
    <div class="gsi-wrap" id="gsiBtn"></div>
    <div class="ver" id="verLogin"></div>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="appScreen" class="hidden">
  <header>
    <img id="hdrLogo" alt="">
    <div class="logo-text">Rattana <span>ร้านใกล้ฉัน</span><small id="hdrUser"></small></div>
    <div class="hdr-sp"></div>
    <button class="icon-btn" id="btnRefresh" title="โหลดข้อมูลร้านใหม่" onclick="refreshData()">↻</button>
    <button class="icon-btn" title="โหมดมืด" onclick="toggleDark()">🌓</button>
    <button class="icon-btn" id="btnLogout" title="ออกจากระบบ" onclick="logout()">🚪</button>
  </header>

  <div class="content">
    <div class="card card-gold mb-12">
      <div class="checkin">
        <button class="btn btn-gold btn-checkin" id="btnCheckin" onclick="checkIn()">📍 เช็คอินตำแหน่งตอนนี้</button>
        <div class="pos-info" id="posInfo">กดปุ่มเพื่อหาร้านที่อยู่ใกล้คุณที่สุด 5 ร้าน (วัดตามถนนจริง)</div>
      </div>
    </div>

    <div id="results"></div>
    <div class="data-note" id="dataNote"></div>
  </div>
</div>

<button id="backToTop" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clean = s => String(s ?? '').replace(/[​‌‍﻿]/g, '').replace(/ /g, ' ').trim();
const normalizeEmail = s => String(s || '').replace(/[​‌‍﻿]/g, '').replace(/\s+/g, '').toLowerCase();

const normName = s => clean(s).replace(/^คุณ\s*/, '').replace(/\s+/g, ' ').toLowerCase();

const showSpinner = (m = 'กำลังโหลด...') => { $('spinnerMsg').textContent = m; $('spinner').classList.add('show'); };
const hideSpinner = () => $('spinner').classList.remove('show');

function showToast(msg, type = 'info') {
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const t = document.createElement('div'); t.className = `toast toast-${type}`; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 3500);
}
function formatThaiDateTime(d) {
  const p = n => String(n).padStart(2, '0');
  return `${p(d.getDate())}/${p(d.getMonth() + 1)}/${d.getFullYear() + 543} ${p(d.getHours())}.${p(d.getMinutes())}`;
}

/* ---------- storage: localStorage ของโดเมนนี้เต็มง่าย → IndexedDB เป็นตัวหลัก ---------- */
function lsSet(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }
let _db = null;
function idb() {
  if (_db) return _db;
  _db = new Promise((res, rej) => {
    try {
      const r = indexedDB.open('rattana_nearby', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('kv');
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    } catch (e) { rej(e); }
  });
  return _db;
}
async function idbGet(k) {
  try { const db = await idb(); return await new Promise(res => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => res(undefined); }); }
  catch (e) { return undefined; }
}
async function idbSet(k, v) {
  try { const db = await idb(); await new Promise(res => { const tx = db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(v, k); tx.oncomplete = res; tx.onerror = res; }); }
  catch (e) {}
}
async function idbDel(k) {
  try { const db = await idb(); await new Promise(res => { const tx = db.transaction('kv', 'readwrite'); tx.objectStore('kv').delete(k); tx.oncomplete = res; tx.onerror = res; }); }
  catch (e) {}
}

/* ---------- CSV ---------- */
function parseCsvRows(text) {
  if (!text) return [];
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch; }
    else if (ch === '"') q = true;
    else if (ch === ',') { row.push(cell); cell = ''; }
    else if (ch === '\r') {}
    else if (ch === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += ch;
  }
  if (cell.length || row.length) { row.push(cell); rows.push(row); }
  return rows;
}
function rowsToObjects(rows) {
  if (!rows.length) return [];
  const h = rows[0].map(clean);
  return rows.slice(1).filter(r => r.some(c => clean(c))).map(r => Object.fromEntries(h.map((k, i) => [k, clean(r[i])])));
}
async function fetchText(url) {
  const res = await fetch(url, { cache: 'no-store' });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const t = await res.text();
  if (/^\s*<!DOCTYPE html|<html/i.test(t.slice(0, 200))) throw new Error('ชีทไม่ได้เปิดแชร์ (ได้หน้า login กลับมา)');
  return t;
}
const exportCsvUrl = (id, gid) => `https://docs.google.com/spreadsheets/d/${id}/export?format=csv&gid=${gid}`;

/* =====================================================================
   AUTH — Google Sign-In + เช็ค E-mail ในชีท Users
   ===================================================================== */
let currentUser = null;

function decodeJwtPayload(token) {
  const parts = String(token || '').split('.');
  if (parts.length < 2) throw new Error('JWT format invalid');
  let b64 = parts[1].replace(/-/g, '+').replace(/_/g, '/');
  const pad = (4 - b64.length % 4) % 4; if (pad) b64 += '='.repeat(pad);
  const bin = atob(b64); const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return JSON.parse(new TextDecoder('utf-8').decode(bytes));
}

async function loadUsers() {
  return rowsToObjects(parseCsvRows(await fetchText(exportCsvUrl(CFG.usersSheetId, CFG.usersGid))));
}
// คืน {ok, user} หรือ {ok:false, msg}
function checkUser(users, email) {
  const u = users.find(x => normalizeEmail(x['E-mail']) === email);
  if (!u) return { ok: false, msg: `อีเมล ${email} ไม่มีในรายชื่อพนักงาน — ติดต่อแอดมินเพื่อเพิ่มสิทธิ์` };
  const st = clean(u['Status']).toLowerCase();
  if (st && st !== 'active') return { ok: false, msg: `บัญชี ${email} สถานะ "${clean(u['Status'])}" — ติดต่อแอดมิน` };
  return { ok: true, user: {
    email, name: clean(u['ชื่อ - สกุล']), nickname: clean(u['ชื่อเล่น']),
    warehouse: clean(u['W']), dept: clean(u['แผนก']), role: parseInt(u['User Role']) || 1,
  } };
}

async function handleGoogleLogin(resp) {
  showSpinner('กำลังตรวจสอบสิทธิ์...');
  try {
    const email = normalizeEmail(decodeJwtPayload(resp.credential).email);
    const r = checkUser(await loadUsers(), email);
    if (!r.ok) { showLoginError(r.msg); return; }
    await saveSession(r.user);
    enterApp(r.user);
  } catch (e) {
    showLoginError('ตรวจสอบสิทธิ์ไม่สำเร็จ ลองใหม่อีกครั้ง (' + e.message + ')');
  } finally { hideSpinner(); }
}
function showLoginError(m) { const el = $('loginErr'); el.textContent = m; el.style.display = 'block'; }

async function saveSession(u) {
  const s = { data: u, exp: Date.now() + CFG.sessionDays * 864e5 };
  lsSet('rnearby_user', JSON.stringify(s));
  await idbSet('session', s);
}
async function readSession() {
  let s = await idbGet('session');
  if (!s) { try { s = JSON.parse(lsGet('rnearby_user') || 'null'); } catch (e) { s = null; } }
  if (!s || !s.data || Date.now() > s.exp) return null;
  return s.data;
}
async function logout() {
  lsDel('rnearby_user'); await idbDel('session');
  try { google.accounts.id.disableAutoSelect(); } catch (e) {}
  location.reload();
}

function initGoogleButton() {
  if (!window.google || !google.accounts || !google.accounts.id) { setTimeout(initGoogleButton, 150); return; }
  google.accounts.id.initialize({ client_id: CFG.clientId, callback: handleGoogleLogin, auto_select: false, cancel_on_tap_outside: true });
  google.accounts.id.renderButton($('gsiBtn'), { type: 'standard', size: 'large', theme: 'filled_blue', text: 'signin_with', shape: 'pill', logo_alignment: 'left', width: 280 });
}

function enterApp(u) {
  currentUser = u;
  $('loginScreen').classList.add('hidden');
  $('appScreen').classList.remove('hidden');
  $('hdrUser').textContent = u.name + (u.nickname ? ` (${u.nickname})` : '');
  initApp();
}

// เปิดแอปด้วย session เดิม แต่ยังเช็คกับชีทซ้ำเบื้องหลัง — โดนถอดสิทธิ์/ลาออก = เด้งออก
async function revalidateSession() {
  try {
    const r = checkUser(await loadUsers(), currentUser.email);
    if (!r.ok) {
      lsDel('rnearby_user'); await idbDel('session');
      alert(r.msg); location.reload();
    } else await saveSession(r.user);
  } catch (e) { /* เน็ตหลุด = ใช้ session เดิมไปก่อน */ }
}

/* =====================================================================
   DATA — ร้านค้า (Customer) + เซลล์ (SLMN)
   ===================================================================== */
let SHOPS = [];          // [{name, code, addr, lat, lng, pending, sales:[{raw, wh, route, ship}]}]
let SLMN = new Map();    // normName → {code, name, nick}
let dataStamp = null;
let badLocCount = 0;

function parseLatLng(s) {
  const m = String(s || '').match(/(-?\d{1,3}\.\d{3,})\s*[, ]\s*(-?\d{1,3}\.\d{3,})/);
  if (!m) return null;
  const lat = +m[1], lng = +m[2];
  if (!(lat > 4 && lat < 22 && lng > 96 && lng < 107)) return null;   // นอกประเทศไทย = พิกัดพัง
  return { lat, lng };
}

async function fetchCustomers() {
  // ทางเร็ว: gviz เลือกเฉพาะคอลัมน์ที่ใช้ (~1.4MB แทน 2.5MB)
  try {
    const letters = Object.keys(CUST_COLS);
    const url = `https://docs.google.com/spreadsheets/d/${CFG.custSheetId}/gviz/tq?tqx=out:csv&headers=1&sheet=${encodeURIComponent(CFG.custSheet)}&tq=${encodeURIComponent('select ' + letters.join(','))}`;
    const rows = parseCsvRows(await fetchText(url));
    const head = (rows[0] || []).map(clean);
    const want = Object.values(CUST_COLS);
    if (want.every((h, i) => head[i] === h)) return rowsToObjects(rows);
    console.warn('หัวคอลัมน์ Customer เปลี่ยน → ดึงทั้งแท็บ', head);
  } catch (e) { console.warn('gviz Customer ล้ม → ดึงทั้งแท็บ', e); }
  // สำรอง: export ทั้งแท็บ แล้วอ่านตามชื่อหัวคอลัมน์
  return rowsToObjects(parseCsvRows(await fetchText(exportCsvUrl(CFG.custSheetId, CFG.custGid))));
}
async function fetchSlmn() {
  return rowsToObjects(parseCsvRows(await fetchText(exportCsvUrl(CFG.slmnSheetId, CFG.slmnGid))));
}

function buildData(custRows, slmnRows) {
  SLMN = new Map();
  for (const s of slmnRows) {
    const name = clean(s['SLMN_NAME']); if (!name) continue;
    const rec = { code: clean(s['SLMN_CODE']), name, nick: clean(s['NICKNAME']) };
    const k = normName(name);
    if (!SLMN.has(k) || (!SLMN.get(k).nick && rec.nick)) SLMN.set(k, rec);
  }
  // ร้านเดียวกัน (ชื่อ + พิกัดเดียวกัน) มีหลายแถวได้ = คนละเซลล์ดูแล → รวมเป็นการ์ดเดียว
  const groups = new Map(); badLocCount = 0;
  for (const r of custRows) {
    const name = clean(r['ชื่อร้านค้า']); if (!name) continue;
    const ll = parseLatLng(r['Location']);
    if (!ll) { if (clean(r['Location'])) badLocCount++; continue; }
    const key = name + '|' + ll.lat.toFixed(5) + ',' + ll.lng.toFixed(5);
    let g = groups.get(key);
    if (!g) {
      g = { name, code: clean(r['รหัส บีพลัส']), addr: clean(r['ต.,อ.,จ. ขอพร']),
            lat: ll.lat, lng: ll.lng, pending: false, sales: [] };
      groups.set(key, g);
    }
    if (!g.code) g.code = clean(r['รหัส บีพลัส']);
    if (clean(r['_status']) === 'pending-approval') g.pending = true;
    const s = { raw: clean(r['เซลล์ผู้ดูแล']), wh: clean(r['WH']), route: clean(r['ชื่อรูท']), ship: clean(r['วันส่ง']) };
    if (!g.sales.some(x => x.raw === s.raw && x.route === s.route && x.ship === s.ship)) g.sales.push(s);
  }
  SHOPS = [...groups.values()];
  // มีเซลล์ชื่อจริงแล้ว ไม่ต้องโชว์แถว "ไม่ระบุเซลล์" ซ้ำ
  for (const g of SHOPS) if (g.sales.some(x => x.raw)) g.sales = g.sales.filter(x => x.raw);
}

async function loadData(force = false) {
  const cached = await idbGet('data');
  if (cached && !force && Date.now() - cached.ts < CFG.cacheTTL) {
    buildData(cached.cust, cached.slmn); dataStamp = new Date(cached.ts); renderNote(); return;
  }
  setLoading(true);
  try {
    const [cust, slmn] = await Promise.all([fetchCustomers(), fetchSlmn()]);
    buildData(cust, slmn); dataStamp = new Date();
    idbSet('data', { ts: Date.now(), cust, slmn });
  } catch (e) {
    if (cached) { buildData(cached.cust, cached.slmn); dataStamp = new Date(cached.ts); showToast('โหลดข้อมูลใหม่ไม่ได้ ใช้ข้อมูลเดิมในเครื่องไปก่อน', 'warning'); }
    else throw e;
  } finally { setLoading(false); renderNote(); }
}
function renderNote() {
  $('dataNote').textContent = SHOPS.length
    ? `ข้อมูลร้าน ${SHOPS.length.toLocaleString()} จุดที่มีพิกัด · อัปเดต ${formatThaiDateTime(dataStamp)}` + (badLocCount ? ` · พิกัดอ่านไม่ออก ${badLocCount} แถว (ข้าม)` : '') + ` · ${APP_VER}`
    : APP_VER;
}
async function refreshData() {
  const b = $('btnRefresh'); b.disabled = true; b.style.transition = 'transform .6s'; b.style.transform = 'rotate(360deg)';
  try { await loadData(true); showToast('อัปเดตข้อมูลร้านเรียบร้อย ✓', 'success'); if (lastPos) findNearby(lastPos); }
  catch (e) { showToast('โหลดข้อมูลไม่สำเร็จ: ' + e.message, 'error'); }
  finally { b.disabled = false; setTimeout(() => { b.style.transform = ''; b.style.transition = ''; }, 600); }
}

/* =====================================================================
   CHECK-IN + หาร้านใกล้
   ===================================================================== */
let lastPos = null, _searchSeq = 0;

function haversine(a, b) {
  const R = 6371000, rad = x => x * Math.PI / 180;
  const dLat = rad(b.lat - a.lat), dLng = rad(b.lng - a.lng);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
const fmtDist = m => m < 1000 ? `${Math.round(m)} ม.` : `${(m / 1000).toFixed(m < 10000 ? 2 : 1)} กม.`;

/* ---------- ระยะตามถนนจริง (OSRM — ตัวเดียวกับ Route Optimizer) ---------- */
async function fetchWithTimeout(url, ms) {
  const ctrl = new AbortController(); const t = setTimeout(() => ctrl.abort(), ms);
  try { return await fetch(url, { signal: ctrl.signal }); } finally { clearTimeout(t); }
}
// ระยะจากเรา → ร้านผู้สมัคร (ยิง /table ครั้งเดียว) · คืน [{dist, dur}] หรือ null ถ้า OSRM ไม่ตอบ
async function osrmFromMe(pos, shops) {
  const coords = [[pos.lng, pos.lat], ...shops.map(s => [s.lng, s.lat])].map(c => c[0].toFixed(6) + ',' + c[1].toFixed(6)).join(';');
  try {
    const res = await fetchWithTimeout(`https://router.project-osrm.org/table/v1/driving/${coords}?sources=0&annotations=distance,duration`, 12000);
    if (!res.ok) throw new Error('OSRM ' + res.status);
    const d = await res.json();
    if (d.code !== 'Ok' || !d.distances) throw new Error('OSRM ไม่ตอบ Ok');
    return shops.map((_, i) => ({ dist: d.distances[0][i + 1], dur: d.durations ? d.durations[0][i + 1] : null }));
  } catch (e) { console.warn('OSRM table ล้ม → ใช้ระยะเส้นตรง', e); return null; }
}

// จับ GPS หลายค่าต่อเนื่อง แล้วเลือกค่าที่แม่นที่สุด (ค่าแรกของมือถือมักคลาด 50-500 ม. จนกว่า GPS จะล็อกดาวเทียมได้)
function checkIn() {
  if (!navigator.geolocation) { showToast('เครื่องนี้ไม่รองรับการหาตำแหน่ง', 'error'); return; }
  const btn = $('btnCheckin');
  btn.disabled = true; btn.textContent = '⏳ กำลังจับ GPS ให้แม่นที่สุด...';
  $('posInfo').textContent = 'กำลังจับสัญญาณ GPS...';
  $('results').innerHTML = '';
  let best = null, done = false, watchId = null, timer = null;
  const finish = () => {
    if (done) return; done = true;
    if (watchId != null) navigator.geolocation.clearWatch(watchId);
    clearTimeout(timer);
    btn.disabled = false; btn.textContent = '📍 เช็คอินอีกครั้ง';
    if (best) findNearby(best);
  };
  const fail = err => {
    if (done) return;
    if (best) { finish(); return; }            // เคยได้ค่าแล้ว ใช้ค่าที่ดีที่สุดที่มี
    done = true;
    if (watchId != null) navigator.geolocation.clearWatch(watchId);
    clearTimeout(timer);
    btn.disabled = false; btn.textContent = '📍 เช็คอินตำแหน่งตอนนี้';
    const msg = err && err.code === 1 ? 'ไม่ได้รับอนุญาตให้ใช้ตำแหน่ง — กดอนุญาต Location ของเบราว์เซอร์ แล้วลองใหม่'
              : 'หาตำแหน่งไม่ได้ — เปิด GPS/Location ของมือถือ แล้วลองกดใหม่';
    $('posInfo').textContent = msg; showToast(msg, 'error');
  };
  watchId = navigator.geolocation.watchPosition(p => {
    const c = p.coords;
    if (!best || c.accuracy < best.acc) best = { lat: c.latitude, lng: c.longitude, acc: c.accuracy, at: new Date() };
    $('posInfo').textContent = `กำลังจับ GPS ให้แม่นที่สุด... ตอนนี้ ±${Math.round(best.acc)} ม.`;
    if (best.acc <= CFG.gpsGoodAcc) finish();     // แม่นพอแล้ว ไม่ต้องรอ
  }, fail, { enableHighAccuracy: true, timeout: CFG.gpsMaxWait, maximumAge: 0 });
  // รอได้สูงสุด gpsMaxWait → ใช้ค่าที่แม่นที่สุดที่ได้มา
  timer = setTimeout(() => best ? finish() : fail({ code: 3 }), CFG.gpsMaxWait);
}

async function findNearby(pos) {
  lastPos = pos;
  if (!SHOPS.length) { showToast('ข้อมูลร้านยังโหลดไม่เสร็จ รอสักครู่แล้วกดใหม่', 'warning'); return; }
  const seq = ++_searchSeq;

  $('posInfo').innerHTML = `📍 <b>${pos.lat.toFixed(6)}, ${pos.lng.toFixed(6)}</b> · แม่นยำ ±${Math.round(pos.acc)} ม. · ${formatThaiDateTime(pos.at)}`
    + (pos.acc > 100 ? `<br><span class="badge badge-warn">GPS ยังไม่แม่น — ลองกดเช็คอินอีกครั้ง</span>` : '');
  $('results').innerHTML = `<div class="card empty"><div class="big">🚗</div>กำลังวัดระยะตามถนนจริง...</div>`;

  // คัดผู้สมัครด้วยเส้นตรงก่อน แล้ววัดตามถนนจริง (ร้านฝั่งตรงข้ามแม่น้ำ/ถนนอ้อม เส้นตรงใกล้แต่ขับไกล)
  const cand = SHOPS.map(s => ({ s, line: haversine(pos, s) })).sort((a, b) => a.line - b.line).slice(0, CFG.roadPool);
  const road = await osrmFromMe(pos, cand.map(c => c.s));
  if (seq !== _searchSeq) return;              // กดเช็คอินซ้ำระหว่างรอ → ทิ้งผลเก่า
  let list, byRoad = !!road;
  if (road) {
    cand.forEach((c, i) => { c.road = road[i].dist; c.dur = road[i].dur; c.key = c.line <= CFG.walkRadius ? c.line : c.road; });
    list = cand.filter(c => c.road != null).sort((a, b) => a.key - b.key).slice(0, CFG.topN);
    if (!list.length) { byRoad = false; list = cand.slice(0, CFG.topN); }
  } else list = cand.slice(0, CFG.topN);

  renderResults(list, byRoad);
  if (!byRoad) showToast('วัดระยะตามถนนไม่ได้ตอนนี้ — เรียงตามระยะเส้นตรงไปก่อน', 'warning');
}

function salesLabel(raw) {
  if (!raw) return { name: 'ไม่ระบุเซลล์', nick: '', code: '' };
  const s = SLMN.get(normName(raw));
  if (!s) return { name: raw, nick: '', code: '' };
  return { name: s.name, nick: s.nick, code: s.code };
}

function renderResults(list, byRoad) {
  if (!list.length) { $('results').innerHTML = `<div class="card empty"><div class="big">🏪</div>ไม่พบร้านที่มีพิกัด</div>`; return; }
  const html = list.map((c, i) => {
    const s = c.s;
    const sales = s.sales.map(x => {
      const sl = salesLabel(x.raw);
      return `<div class="sale">
        <div class="sale-name">👤 ${esc(sl.name)}${sl.nick ? ` <span class="nick">(${esc(sl.nick)})</span>` : ''}${sl.code ? ` <span class="txt-muted txt-sm">· ${esc(sl.code)}</span>` : ''}</div>
        <div class="sale-meta">
          <span class="badge ${x.route === 'ปิด' ? 'badge-danger' : x.route ? 'badge-gold' : 'badge-warn'}">📝 วันจด: ${esc(x.route || 'ไม่ระบุ')}</span>
          ${x.ship ? `<span class="badge badge-info">🚚 วันส่ง: ${esc(x.ship)}</span>` : ''}
          ${x.wh ? `<span class="badge badge-ok">${esc(x.wh)}</span>` : ''}
        </div>
      </div>`;
    }).join('');
    const main = byRoad ? fmtDist(c.key) : fmtDist(c.line);
    return `<div class="card shop${i ? '' : ' first'}" style="animation-delay:${i * 50}ms">
      <div class="rank">${i + 1}</div>
      <div class="shop-main">
        <div class="shop-top">
          <div class="shop-name">${esc(s.name)}</div>
          <div class="dist">${main}</div>
        </div>
        <div class="shop-sub">${s.code ? `รหัส ${esc(s.code)}` : 'ยังไม่มีรหัส'}${s.addr ? ` · ${esc(s.addr)}` : ''}
          ${s.pending ? ' <span class="badge badge-warn">ร้านใหม่ รออนุมัติ</span>' : ''}</div>
        <div class="sales">${sales}</div>
      </div>
    </div>`;
  }).join('');
  $('results').innerHTML = `<div class="sec-title">🏪 ร้านใกล้ที่สุด ${list.length} ร้าน <span class="badge ${byRoad ? 'badge-ok' : 'badge-warn'}">${byRoad ? 'วัดตามถนนจริง' : 'ระยะเส้นตรง'}</span></div>`
    + html;
}

/* =====================================================================
   BOOT
   ===================================================================== */
function toggleDark() {
  document.body.classList.toggle('dark');
  lsSet('rnearby_dark', document.body.classList.contains('dark') ? '1' : '0');
}
window.addEventListener('scroll', () => $('backToTop').classList.toggle('show', window.scrollY > 300));

let _inited = false;
async function initApp() {
  if (_inited) return; _inited = true;
  $('posInfo').textContent = `กดปุ่มเพื่อหาร้านที่อยู่ใกล้คุณที่สุด ${CFG.topN} ร้าน (วัดตามถนนจริง)`;
  $('results').innerHTML = '';
  try { await loadData(); }
  catch (e) { showToast('โหลดข้อมูลร้านไม่สำเร็จ: ' + e.message, 'error'); }
}

(async function boot() {
  if (lsGet('rnearby_dark') === '1') document.body.classList.add('dark');
  $('loginLogo').src = LOGO; $('hdrLogo').src = LOGO;
  $('verLogin').textContent = APP_VER;
  if (!LOGIN_ON) {
    $('btnLogout').classList.add('hidden');
    enterApp({ email: '', name: 'โหมดทดสอบ', nickname: 'ยังไม่เปิดล็อกอิน' });
    return;
  }
  const u = await readSession();
  if (u) { enterApp(u); revalidateSession(); return; }
  // Google ไม่ยอมให้ล็อกอินในเบราว์เซอร์ในแอป (LINE/Facebook) → 403 disallowed_useragent
  const ua = navigator.userAgent || '';
  if (/\bLine\//i.test(ua) && !/[?&]openExternalBrowser=1/.test(location.search)) {
    location.replace(location.href + (location.search ? '&' : '?') + 'openExternalBrowser=1');   // LINE เปิด Chrome/Safari ให้เอง
    return;
  }
  if (/FBAN|FBAV|FB_IAB|Instagram|Line\//i.test(ua)) {
    showLoginError('ล็อกอิน Google ในแอปนี้ไม่ได้ — กด ⋯ มุมขวาบน แล้วเลือก "เปิดในเบราว์เซอร์" (Chrome/Safari)');
  }
  initGoogleButton();
})();
</script>
