<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a8a33"/>
      <stop offset="1" stop-color="#005a00"/>
    </linearGradient>
    <linearGradient id="boxTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eaf5ec"/>
    </linearGradient>
    <linearGradient id="boxFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3faf4"/>
      <stop offset="1" stop-color="#d6ecda"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#00330f" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- app tile -->
  <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect x="0" y="0" width="512" height="512" rx="116" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="6"/>

  <!-- outgoing arrow (เช็คออก) -->
  <g opacity="0.9">
    <path d="M300 236 h96 M362 202 l40 34 -40 34" fill="none" stroke="#bff0c6" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- carton box -->
  <g filter="url(#sh)">
    <!-- top lid -->
    <path d="M120 196 L232 150 L360 196 L248 244 Z" fill="url(#boxTop)"/>
    <!-- left face -->
    <path d="M120 196 L248 244 L248 372 L120 320 Z" fill="url(#boxFront)"/>
    <!-- right face -->
    <path d="M360 196 L248 244 L248 372 L360 320 Z" fill="#c3e6c9"/>
    <!-- box seam -->
    <path d="M248 244 L248 372" stroke="#a9d7b1" stroke-width="4"/>
    <!-- tape on lid -->
    <path d="M232 150 L248 244" stroke="#9ccfa6" stroke-width="6" opacity="0.7"/>
  </g>

  <!-- barcode on left face -->
  <g transform="translate(150 268)" fill="#2f6b3c">
    <rect x="0" y="0" width="6" height="46"/>
    <rect x="12" y="0" width="4" height="46"/>
    <rect x="22" y="0" width="8" height="46"/>
    <rect x="36" y="0" width="4" height="46"/>
    <rect x="46" y="0" width="6" height="46"/>
    <rect x="60" y="0" width="4" height="46"/>
  </g>

  <!-- check badge -->
  <g transform="translate(338 300)">
    <circle cx="0" cy="0" r="70" fill="#ffffff" filter="url(#sh)"/>
    <circle cx="0" cy="0" r="70" fill="none" stroke="#eaf5ec" stroke-width="4"/>
    <path d="M-34 2 L-8 30 L38 -28" fill="none" stroke="#0a8a33" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
