<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Rattana Product v1.0</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0d1b3e; --navy-mid:#1a2f5e; --navy-light:#243b73;
  --gold:#c9a84c; --gold-light:#e8c86a;
  --success:#2ecc71; --danger:#e74c3c; --warning:#f39c12; --info:#3498db;
  --bg:#f4f6fb; --text:#0d1b3e; --card-bg:#ffffff; --border:#dde3f0;
  --muted:#6b7896; --row-alt:#fafbfd;
  --space-xs:4px; --space-sm:8px; --space-md:16px; --space-lg:24px; --space-xl:32px;
  --radius-sm:6px; --radius-md:12px; --radius-lg:16px; --radius-xl:20px;
  --shadow-sm:0 1px 4px rgba(0,0,0,.06); --shadow-md:0 2px 8px rgba(0,0,0,.08);
  --shadow-lg:0 8px 24px rgba(13,27,62,.12); --shadow-gold:0 4px 12px rgba(201,168,76,.35);
  --noimg-bg:repeating-linear-gradient(45deg,#f4f6fb,#f4f6fb 8px,#eaeff8 8px,#eaeff8 16px);
  --noimg-fg:#9aa6c2;
}
body.dark{
  --bg:#05080f; --text:#ffffff; --card-bg:#0d1b3e; --border:#1f3563;
  --muted:#b8c2dc; --row-alt:#0a1226;
  --noimg-bg:repeating-linear-gradient(45deg,#0a1226,#0a1226 8px,#101c3a 8px,#101c3a 16px);
  --noimg-fg:#8d9ab8;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Sarabun',sans-serif;font-size:14px;line-height:1.5;min-height:100dvh;
  overflow-x:hidden;background:var(--bg);color:var(--text);transition:background .25s,color .25s;
  -webkit-overflow-scrolling:touch}
button{font-family:inherit;cursor:pointer;border:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
input{font-family:inherit;font-size:16px}

/* ── header ── */
header{background:var(--navy);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:100;
  display:flex;align-items:center;gap:10px;border-bottom:3px solid var(--gold);
  padding-top:max(12px,env(safe-area-inset-top))}
.logo-text{font-weight:700;letter-spacing:1.5px;font-size:18px;color:#fff;white-space:nowrap}
.logo-text span{color:var(--gold)}
.hd-sp{margin-left:auto;display:flex;gap:6px;align-items:center}
.icon-btn{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.2);width:38px;height:38px;
  border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-size:17px;
  transition:background .15s}
.icon-btn:hover{background:rgba(255,255,255,.12)}
.hub-btn{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:var(--radius-sm);
  padding:5px 10px;font-size:13px;font-weight:600;text-decoration:none;cursor:pointer;
  transition:background .15s;white-space:nowrap;min-height:38px}
.hub-btn:hover{background:rgba(255,255,255,.18)}
.hub-btn-icon{width:22px;height:22px;border-radius:5px;flex-shrink:0;background-size:cover;
  background-position:center;display:inline-block}
.hub-btn-text{letter-spacing:.5px}

/* ── search ── */
.searchbar{position:sticky;top:var(--hdH,62px);z-index:90;background:var(--bg);
  padding:10px 12px 8px;border-bottom:1px solid var(--border)}
.sfield{position:relative;display:flex;align-items:center}
.sfield .ic{position:absolute;left:15px;color:var(--muted);font-size:17px;pointer-events:none}
#q{width:100%;height:48px;border-radius:24px;border:1.5px solid var(--border);background:var(--card-bg);
  color:var(--text);padding:0 46px 0 44px;font-size:16px;outline:none;transition:border-color .15s}
#q:focus{border-color:var(--gold)}
#q::placeholder{color:var(--muted)}
.clr{position:absolute;right:6px;width:36px;height:36px;border-radius:50%;background:transparent;
  color:var(--muted);font-size:19px;display:none;align-items:center;justify-content:center}
.clr.show{display:flex}
.countline{padding:7px 4px 0;font-size:12px;font-weight:600;color:var(--muted);
  display:flex;align-items:center;gap:10px}
.countline #cnt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.countline #stamp{flex:none;white-space:nowrap}
.freqclr{flex:none;background:transparent;color:var(--gold);font-size:12px;font-weight:700;
  padding:2px 0;text-decoration:underline;white-space:nowrap}
.freqclr[hidden]{display:none}

/* "ใช้บ่อย" marker on cards the app has floated to the top */
.pc.freq{border-color:var(--gold)}
.freqtag{position:absolute;top:9px;left:9px;background:var(--gold);color:var(--navy);
  font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:999px;letter-spacing:.3px;
  box-shadow:0 2px 6px rgba(13,27,62,.2)}
.pc-img{position:relative}

/* ── list ── */
.list{padding:12px;display:flex;flex-direction:column;gap:12px;max-width:640px;margin:0 auto;width:100%}
.pc{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius-lg);
  overflow:hidden;box-shadow:var(--shadow-md)}
.pc-img{height:170px;background:#fff;display:flex;align-items:center;justify-content:center;padding:8px}
.pc-img img{max-height:100%;max-width:70%;object-fit:contain}
.pc-img.none{background:var(--noimg-bg);color:var(--noimg-fg);flex-direction:column;gap:5px;
  font-size:12px;font-weight:700}
.pc-img.none .cam{font-size:26px;opacity:.75}
.pc-name{font-size:15px;font-weight:700;line-height:1.4;padding:10px 14px 11px;text-align:center;
  border-bottom:1px solid var(--border)}
.pc-unit{display:flex;align-items:center;gap:11px;padding:10px 13px;border-bottom:1px solid var(--row-alt)}
.pc-unit:last-child{border-bottom:0}
.uleft{flex:none;width:76px}
.uleft .uk{font-size:16px;font-weight:700;line-height:1.15;display:block}
.uleft .un{font-size:11.5px;font-weight:600;color:var(--muted);line-height:1.3;display:block}
.uright{flex:1;display:flex;justify-content:flex-end;min-width:0}
.bcbtn{background:#fff;border:0;padding:4px;border-radius:6px;display:block;line-height:0;
  max-width:100%;overflow:hidden}
.bcbtn svg{display:block;max-width:100%;height:auto}
.nobc{font-size:12px;color:var(--muted);font-style:italic}

.empty{text-align:center;padding:56px 24px;color:var(--muted)}
.empty .big{font-size:38px;margin-bottom:10px;opacity:.6}
.empty b{display:block;color:var(--text);font-size:16px;margin-bottom:5px}
#sentinel{height:1px}
.loadmore{text-align:center;padding:14px;color:var(--muted);font-size:13px;font-weight:600}

/* ── fullscreen barcode ── */
.fsbc{display:none;position:fixed;inset:0;z-index:9500;background:#fff;
  flex-direction:column;align-items:center;justify-content:center;padding:20px;gap:18px}
.fsbc.open{display:flex}
.fsbc .fname{color:#0d1b3e;font-size:16px;font-weight:700;text-align:center;max-width:90%}
.fsbc .funit{color:#5a6785;font-size:14px;font-weight:600;margin-top:-10px}
.fsbc .fwrap{width:100%;max-width:560px;display:flex;justify-content:center}
.fsbc svg{width:100%;height:auto;max-height:52vh}
.fsbc .fclose{background:var(--navy);color:#fff;border-radius:var(--radius-md);
  padding:13px 30px;font-size:15px;font-weight:700;min-height:50px}
.fsbc .ftip{color:#7a86a3;font-size:12.5px;text-align:center;max-width:340px;line-height:1.5}

/* ── chrome ── */
#backToTop{position:fixed;bottom:max(24px,calc(16px + env(safe-area-inset-bottom)));
  right:max(16px,calc(12px + env(safe-area-inset-right)));background:var(--gold);color:var(--navy);
  border-radius:50%;width:46px;height:46px;display:none;align-items:center;justify-content:center;
  box-shadow:var(--shadow-gold);z-index:90;font-size:18px;font-weight:700}
#backToTop.show{display:flex}
#loadingBar{position:fixed;top:0;left:0;height:3px;background:var(--gold);width:0;
  transition:width .4s;z-index:10000}
#spinner{display:none;position:fixed;inset:0;background:rgba(13,27,62,.55);align-items:center;
  justify-content:center;z-index:9999;backdrop-filter:blur(3px)}
#spinner.show{display:flex}
.spinner-box{background:#fff;border-radius:var(--radius-lg);padding:32px 40px;text-align:center;
  border-top:4px solid var(--gold);min-width:240px}
body.dark .spinner-box{background:var(--card-bg)}
.spinner-ring{width:48px;height:48px;border:5px solid #dde3f0;border-top-color:var(--gold);
  border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px}
#spinnerMsg{color:var(--text);font-size:14px}
.spinner-box #spinnerMsg{color:#0d1b3e}
body.dark .spinner-box #spinnerMsg{color:#fff}
.toast{position:fixed;bottom:max(24px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
  padding:12px 20px;border-radius:var(--radius-md);color:#fff;z-index:9999;font-weight:500;
  box-shadow:var(--shadow-lg);max-width:90vw;font-size:13px;animation:fadeIn .25s ease}
.toast-success{background:var(--success)}
.toast-error{background:var(--danger)}
.toast-info{background:var(--navy-mid);border-left:3px solid var(--gold)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeIn{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="loadingBar"></div>

<header>
  <span class="logo-text">RATTANA <span>PRODUCT</span></span>
  <span style="font-size:11px;font-weight:400;opacity:.7;color:#fff">v1.0</span>
  <span class="hd-sp">
    <button class="icon-btn" id="btnRefresh" onclick="refreshData()" title="โหลดข้อมูลใหม่">⟳</button>
    <button class="icon-btn" id="themeBtn" onclick="toggleTheme()" title="สลับโหมดสี">🌙</button>
    <a href="https://rattanaphaiboon.github.io/app/rattana-hub.html" class="hub-btn" title="กลับ Hub">
      <span class="hub-btn-icon" id="hubIcon"></span><span class="hub-btn-text">Hub</span></a>
  </span>
</header>

<div class="searchbar">
  <div class="sfield">
    <span class="ic">🔍</span>
    <input id="q" type="search" inputmode="search" autocomplete="off" autocorrect="off"
           spellcheck="false" placeholder="ค้นหาชื่อสินค้า หรือ บาร์โค้ด" aria-label="ค้นหาสินค้า">
    <button class="clr" id="clr" onclick="clearSearch()" aria-label="ล้างคำค้นหา">✕</button>
  </div>
  <div class="countline">
    <span id="cnt">กำลังโหลด…</span>
    <button class="freqclr" id="freqClr" onclick="clearUses()" hidden>ล้างที่ใช้บ่อย</button>
    <span id="stamp"></span>
  </div>
</div>

<main class="list" id="list" aria-live="polite"></main>
<div class="loadmore" id="loadmore" hidden>กำลังแสดงเพิ่ม…</div>
<div id="sentinel"></div>

<button id="backToTop" onclick="window.scrollTo({top:0,behavior:'smooth'})" aria-label="กลับขึ้นบนสุด">↑</button>

<div class="fsbc" id="fsbc" role="dialog" aria-modal="true" aria-label="บาร์โค้ดขยาย">
  <div class="fname" id="fsName"></div>
  <div class="funit" id="fsUnit"></div>
  <div class="fwrap" id="fsWrap"></div>
  <div class="ftip">เปิดความสว่างหน้าจอให้สูงสุด แล้วจ่อเครื่องยิงห่างจากจอประมาณ 10–20 ซม.</div>
  <button class="fclose" onclick="closeFS()">ปิด</button>
</div>

<div id="spinner"><div class="spinner-box"><div class="spinner-ring"></div><p id="spinnerMsg">กำลังโหลด…</p></div></div>

<script>
'use strict';

/* ══════════════════════════════════════════════════════════
   1. BARCODE ENGINE
   Draws EAN-13 / EAN-8 / UPC-A / ITF-14, and falls back to
   CODE 128 for anything that is not a valid GTIN (~7% of the
   sheet: wrong check digit, odd length, or non-numeric).
   Style: uniform bar height, digits spread beneath.
   ══════════════════════════════════════════════════════════ */
var BC = (function(){
  var L=['0001101','0011001','0010011','0111101','0100011','0110001','0101111','0111011','0110111','0001011'],
      G=['0100111','0110011','0011011','0100001','0011101','0111001','0000101','0010001','0001001','0010111'],
      R=['1110010','1100110','1101100','1000010','1011100','1001110','1010000','1000100','1001000','1110100'],
      PAR=['LLLLLL','LLGLGG','LLGGLG','LLGGGL','LGLLGG','LGGLLG','LGGGLL','LGLGLG','LGLGGL','LGGLGL'],
      ITF=['00110','10001','01001','11000','00101','10100','01100','00011','10010','01010'],
      C128=('212222,222122,222221,121223,121322,131222,122213,122312,132212,221213,221312,231212,112232,'+
        '122132,122231,113222,123122,123221,223211,221132,221231,213212,223112,312131,311222,321122,321221,'+
        '312212,322112,322211,212123,212321,232121,111323,131123,131321,112313,132113,132311,211313,231113,'+
        '231311,112133,112331,132131,113123,113321,133121,313121,211331,231131,213113,213311,213131,311123,'+
        '311321,331121,312113,312311,332111,314111,221411,431111,111224,111422,121124,121421,141122,141221,'+
        '112214,112412,122114,122411,142112,142211,241211,221114,413111,241112,134111,111242,121142,121241,'+
        '114212,124112,124211,411212,421112,421211,212141,214121,412121,111143,111341,131141,114113,114311,'+
        '411113,411311,113141,114131,311141,411131,211412,211214,211232,2331112').split(',');

  var QL13=11, QR=7, QL8=7, ITFQ=10, C128Q=10, WIDE=2.5;

  function gtinOK(c){
    if(!/^[0-9]+$/.test(c)) return false;
    var n=c.length; if(n!==8&&n!==12&&n!==13&&n!==14) return false;
    var s=0,m=3;
    for(var i=n-2;i>=0;i--){ s+=(+c.charAt(i))*m; m=(m===3)?1:3; }
    return ((10-(s%10))%10)===(+c.charAt(n-1));
  }
  function symbology(c){
    if(!gtinOK(c)) return 'C128';
    return c.length===13?'EAN13':c.length===14?'ITF14':c.length===12?'UPCA':'EAN8';
  }
  /* total width in narrow-module units, quiet zones included */
  function units(c,sym){
    if(sym==='EAN13'||sym==='UPCA') return QL13+95+QR;
    if(sym==='EAN8')  return QL8+67+QR;
    if(sym==='ITF14') return ITFQ*2 + 4 + (c.length/2)*(2*(2*WIDE+3)) + (WIDE+2);
    return C128Q*2 + (c.length+2)*11 + 13;
  }
  function runs(bits){
    var out=[],i=0,j;
    while(i<bits.length){
      if(bits.charAt(i)==='1'){ j=i; while(j<bits.length&&bits.charAt(j)==='1') j++; out.push([i,j-i]); i=j; }
      else i++;
    }
    return out;
  }
  function ean13bits(c){
    var p=PAR[+c.charAt(0)],s='101',i;
    for(i=1;i<=6;i++) s+=(p.charAt(i-1)==='L'?L:G)[+c.charAt(i)];
    s+='01010';
    for(i=7;i<=12;i++) s+=R[+c.charAt(i)];
    return s+'101';
  }
  function ean8bits(c){
    var s='101',i;
    for(i=0;i<4;i++) s+=L[+c.charAt(i)];
    s+='01010';
    for(i=4;i<8;i++) s+=R[+c.charAt(i)];
    return s+'101';
  }
  function esc(t){ return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  /* human-readable line, spread across the full symbol width */
  function label(text,W,fs){
    return '<text x="'+(W/2).toFixed(2)+'" y="'+(fs*0.92).toFixed(2)+'" text-anchor="middle" '+
      'textLength="'+(W*0.94).toFixed(2)+'" lengthAdjust="spacing" font-size="'+fs.toFixed(1)+
      '" font-family="\'Sarabun\',monospace" font-weight="600" fill="#000">'+esc(text)+'</text>';
  }
  function group(code,sym){
    if(sym==='EAN13') return code.charAt(0)+' '+code.slice(1,7)+' '+code.slice(7);
    if(sym==='UPCA')  return code.charAt(0)+' '+code.slice(1,6)+' '+code.slice(6,11)+' '+code.charAt(11);
    if(sym==='EAN8')  return code.slice(0,4)+' '+code.slice(4);
    return code;
  }

  /* returns {svg, width, height} — h = bar height in px */
  function build(code,mw,h){
    var sym=symbology(code), bars=[], W=units(code,sym)*mw, x, i, j, a, b, k, pat, p, w, isBar, bits, rs;

    if(sym==='EAN13'||sym==='UPCA'||sym==='EAN8'){
      var enc = (sym==='UPCA') ? '0'+code : code;
      bits = (sym==='EAN8') ? ean8bits(enc) : ean13bits(enc);
      var q = (sym==='EAN8') ? QL8 : QL13;
      rs = runs(bits);
      for(k=0;k<rs.length;k++) bars.push([(q+rs[k][0])*mw, rs[k][1]*mw]);
    } else if(sym==='ITF14'){
      x = ITFQ*mw;
      function push(wd,bar){ if(bar) bars.push([x,wd]); x+=wd; }
      push(mw,1); push(mw,0); push(mw,1); push(mw,0);
      for(i=0;i<code.length;i+=2){
        a=ITF[+code.charAt(i)]; b=ITF[+code.charAt(i+1)];
        for(j=0;j<5;j++){ push(a.charAt(j)==='1'?mw*WIDE:mw,1); push(b.charAt(j)==='1'?mw*WIDE:mw,0); }
      }
      push(mw*WIDE,1); push(mw,0); push(mw,1);
    } else {
      var vals=[104], sum=104, v;
      for(i=0;i<code.length;i++){
        v=code.charCodeAt(i)-32; if(v<0||v>94) v=0;
        vals.push(v); sum+=v*(i+1);
      }
      vals.push(sum%103); vals.push(106);
      x = C128Q*mw;
      for(k=0;k<vals.length;k++){
        pat=C128[vals[k]]; isBar=true;
        for(p=0;p<pat.length;p++){
          w=(+pat.charAt(p))*mw;
          if(isBar) bars.push([x,w]);
          x+=w; isBar=!isBar;
        }
      }
    }

    var fs=Math.max(9,Math.min(h*0.34,mw*7.2)), gap=Math.max(3,fs*0.28),
        H=h+gap+fs+2, body='';
    for(k=0;k<bars.length;k++)
      body+='<rect x="'+bars[k][0].toFixed(2)+'" y="0" width="'+bars[k][1].toFixed(2)+'" height="'+h.toFixed(2)+'"/>';

    var svg='<svg xmlns="http://www.w3.org/2000/svg" width="'+W.toFixed(1)+'" height="'+H.toFixed(1)+
      '" viewBox="0 0 '+W.toFixed(2)+' '+H.toFixed(2)+'" role="img" aria-label="บาร์โค้ด '+esc(code)+
      '"><rect width="'+W.toFixed(2)+'" height="'+H.toFixed(2)+'" fill="#fff"/>'+
      '<g fill="#000">'+body+'</g><g transform="translate(0,'+(h+gap).toFixed(2)+')">'+
      label(group(code,sym),W,fs)+'</g></svg>';
    return {svg:svg,width:W,height:H,sym:sym};
  }

  /* fit a code into a target pixel width */
  function toWidth(code,targetW,h){
    var mw = targetW/units(code,symbology(code));
    return build(code,mw,h);
  }
  return {build:build,toWidth:toWidth,symbology:symbology,gtinOK:gtinOK,units:units};
})();


/* ══════════════════════════════════════════════════════════
   2. DATA
   ══════════════════════════════════════════════════════════ */
var SHEET_ID = '16mYDqAqqJma-_0vCIAajy6bcjdOZ7F6VagxkdkqAB2I';
var GID = '635140262';
var COLS = 'A,B,D,F,H,J,K,L,M,N,O,P,Q,CV,BD,BB,BC'; /* + brand, category type, category group */
var CACHE_KEY = 'rattana_product_v2';
var USE_KEY = 'rattana_product_uses';
var TTL = 5*60*1000;
var PAGE = 24;
var FREQ_MIN = 2;    /* opened this many times before it counts as "ใช้บ่อย" */
var FREQ_MAX = 15;   /* at most this many float to the top */

var ALL = [], VIEW = [], shown = 0, io = null;
var USES = {}, usesDirty = false;

/* Snapshot of the sheet baked into this file. It is what makes the app work
   when opened directly from a phone or PC; online it is replaced by live data
   within a second or two. Regenerate it whenever the sheet changes a lot. */
var SEED_DATE = '19/08/2569';
var SEED = null;  /* เวอร์ชันเบา: ไม่ฝังข้อมูล ดึงสดจากชีตทุกครั้ง */

function sheetUrl(){
  return 'https://docs.google.com/spreadsheets/d/'+SHEET_ID+'/gviz/tq?tqx=out:csv&gid='+GID+
         '&tq='+encodeURIComponent('select '+COLS);
}

/* RFC-4180 CSV parser — quoted cells may contain commas and newlines */
function parseCsv(text){
  if(!text) return [];
  if(text.charCodeAt(0)===0xFEFF) text=text.slice(1);
  var rows=[], row=[], cell='', inQ=false, i, ch;
  for(i=0;i<text.length;i++){
    ch=text[i];
    if(inQ){
      if(ch==='"'){ if(text[i+1]==='"'){ cell+='"'; i++; } else inQ=false; }
      else cell+=ch;
    } else {
      if(ch==='"') inQ=true;
      else if(ch===','){ row.push(cell); cell=''; }
      else if(ch==='\r'){ /* skip */ }
      else if(ch==='\n'){ row.push(cell); rows.push(row); row=[]; cell=''; }
      else cell+=ch;
    }
  }
  if(cell.length||row.length){ row.push(cell); rows.push(row); }
  return rows;
}
function clean(s){
  return String(s==null?'':s).replace(/[​‌‍﻿]/g,'').replace(/ /g,' ').trim();
}
/* Barcodes get every space removed, not just the outer ones: 19 codes in the
   sheet are typed with their groups spaced out ("8 853820 002035"), and 10 of
   those are valid EAN-13/ITF-14 once the spaces are gone. Left in, they fall
   back to CODE 128 and scan back with the spaces still in the value. */
function cleanCode(s){
  return String(s==null?'':s).replace(/[\s​-‍]/g,'');
}
function driveId(raw){
  if(!raw) return '';
  var m = raw.match(/[?&]id=([-\w]{20,})/) || raw.match(/\/d\/([-\w]{20,})/) || raw.match(/([-\w]{25,})/);
  return m ? m[1] : '';
}
/* "ลังx72(CS)" → {name:'ลัง', qty:72} */
function parseUnit(u,qtyCol){
  u = clean(u);
  var m = u.match(/^(.+?)x(\d+)\(([A-Z]+)\)$/);
  if(m) return {name:m[1], qty:+m[2]};
  var q = parseInt(clean(qtyCol),10);
  return {name:u||'-', qty:isFinite(q)?q:0};
}

/* rows → compact product records */
function buildRecords(rows){
  var out=[], r, i, name, img, units, k;
  var CODE=[1,2,3,4], UNIT=[5,6,7,8], QTY=[9,10,11,12];
  for(i=1;i<rows.length;i++){
    r=rows[i]; if(!r) continue;
    name=clean(r[0]); if(!name) continue;
    img=driveId(clean(r[13]));
    units=[];
    for(k=0;k<4;k++){
      var code=cleanCode(r[CODE[k]]);
      if(!code || code==='0') continue;
      var u=parseUnit(r[UNIT[k]], r[QTY[k]]);
      units.push([code,u.name,u.qty]);
    }
    if(!units.length && !name) continue;
    /* brand + both category levels, searched but not displayed: people ask for
       "บะหมี่กึ่งสำเร็จรูป" or "ข้าวตราฉัตร", neither of which is in the name */
    out.push([name,img,units,(clean(r[14])+' '+clean(r[15])+' '+clean(r[16])).replace(/ +/g,' ').trim()]);
  }
  return out;
}

function getCache(){
  try{
    var raw=localStorage.getItem(CACHE_KEY); if(!raw) return null;
    var o=JSON.parse(raw);
    if(!o || !o.ts || !o.d) return null;
    return {fresh:(Date.now()-o.ts<TTL), ts:o.ts, d:o.d};
  }catch(e){ return null; }
}
function setCache(d){
  try{ localStorage.setItem(CACHE_KEY, JSON.stringify({ts:Date.now(),d:d})); }
  catch(e){ /* dataset can exceed the quota — running without cache is fine */ }
}

async function fetchSheet(){
  var res = await fetch(sheetUrl(), {cache:'no-store'});
  if(!res.ok) throw new Error('HTTP '+res.status);
  return buildRecords(parseCsv(await res.text()));
}

async function loadData(showSpin){
  var c=getCache(), haveSomething=false;

  /* 1. anything cached from a previous run */
  if(c){ ALL=c.d; indexAll(); applySearch(); stamp(c.ts); haveSomething=true; }
  /* 2. otherwise the snapshot built into this file, so the app is usable the
        instant it opens — including straight off the filesystem, where the
        browser refuses to call Google at all (file:// has no origin) */
  else if(window.SEED && SEED.length){
    ALL=SEED.slice(); indexAll(); applySearch();
    document.getElementById('stamp').textContent='ข้อมูล '+SEED_DATE;
    haveSomething=true;
  }
  if(c && c.fresh) return;

  /* 3. then quietly try for something newer */
  if(showSpin && !haveSomething) showSpinner('กำลังโหลดรายการสินค้า…');
  setLoading(true);
  try{
    var d=await fetchSheet();
    ALL=d; setCache(d); indexAll(); applySearch(); stamp(Date.now());
  }catch(e){
    if(!haveSomething){
      showEmpty('โหลดข้อมูลไม่สำเร็จ','ตรวจสอบอินเทอร์เน็ตแล้วกดปุ่ม ⟳ ที่มุมขวาบนอีกครั้ง');
      toast('โหลดข้อมูลไม่สำเร็จ','error');
    }
    /* with the snapshot in hand a failed refresh is not worth interrupting anyone over */
  }finally{ setLoading(false); hideSpinner(); }
}
function indexAll(){
  for(var i=0;i<ALL.length;i++){
    var p=ALL[i], s=p[0].toLowerCase();
    /* the brand is worth indexing on its own: "ข้าวตราฉัตร" never appears in
       the product name, which reads "ฉัตร ชากังราว เขียว 5กก." */
    if(p[3]) s+=' '+p[3].toLowerCase();
    for(var k=0;k<p[2].length;k++) s+=' '+p[2][k][0];
    p[4]=s;
    p[5]=i;            /* sheet order — the final tiebreak once uses reorder things */
  }
  resort();
}


/* ══════════════════════════════════════════════════════════
   2b. "ใช้บ่อย" — the app learns the order from real use.
   Opening a barcode is the one deliberate action in the flow,
   so that is what gets counted.
   ══════════════════════════════════════════════════════════ */
function useKey(p){ return (p[2].length ? p[2][0][0] : p[0]); }
function useCount(p){ return USES[useKey(p)] || 0; }

function loadUses(){
  try{ USES = JSON.parse(localStorage.getItem(USE_KEY)) || {}; }
  catch(e){ USES = {}; }
}
function bumpUse(p){
  var k=useKey(p);
  USES[k]=(USES[k]||0)+1;
  usesDirty=true;
  try{ localStorage.setItem(USE_KEY, JSON.stringify(USES)); }catch(e){}
}
function clearUses(){
  USES={}; usesDirty=true;
  try{ localStorage.removeItem(USE_KEY); }catch(e){}
  resort(); applySearch();
  toast('ล้างประวัติการใช้แล้ว','success');
}
/* most-used first, then sheet order. Array.sort is stable, so equal
   counts keep the order they already had. */
function resort(){
  var rank = {};
  var freq = ALL.filter(function(p){ return useCount(p)>=FREQ_MIN; })
                .sort(function(a,b){ return useCount(b)-useCount(a) || a[5]-b[5]; })
                .slice(0,FREQ_MAX);
  for(var i=0;i<freq.length;i++) rank[useKey(freq[i])]=i;
  ALL.sort(function(a,b){
    var ra=rank[useKey(a)], rb=rank[useKey(b)];
    if(ra===undefined) ra=9999;
    if(rb===undefined) rb=9999;
    if(ra!==rb) return ra-rb;
    return a[5]-b[5];
  });
  usesDirty=false;
}
function freqCount(){
  var n=0;
  for(var i=0;i<ALL.length && n<FREQ_MAX;i++) if(useCount(ALL[i])>=FREQ_MIN) n++;
  return n;
}
function stamp(ts){
  var d=new Date(ts);
  var hh=String(d.getHours()).padStart(2,'0'), mm=String(d.getMinutes()).padStart(2,'0');
  document.getElementById('stamp').textContent='ข้อมูล '+hh+'.'+mm+' น.';
}


/* ══════════════════════════════════════════════════════════
   3. SEARCH + RENDER
   ══════════════════════════════════════════════════════════ */
function applySearch(){
  var raw=document.getElementById('q').value.trim().toLowerCase();
  document.getElementById('clr').classList.toggle('show', !!raw);
  /* reorder only when a count actually changed, so typing stays cheap */
  if(usesDirty) resort();
  if(!raw){ VIEW=ALL; }
  else{
    var terms=raw.split(/\s+/).filter(Boolean);
    VIEW=ALL.filter(function(p){
      for(var t=0;t<terms.length;t++) if(p[4].indexOf(terms[t])<0) return false;
      return true;
    });
  }
  var nf=ALL.length?freqCount():0;
  document.getElementById('cnt').textContent = !ALL.length ? 'กำลังโหลด…'
    : raw ? 'พบ '+fmt(VIEW.length)+' รายการ'
    : 'ทั้งหมด '+fmt(ALL.length)+' รายการ'+(nf?' · ใช้บ่อย '+nf:'');
  var fc=document.getElementById('freqClr');
  fc.hidden = !!raw || !nf;
  resetList();
}
function fmt(n){ return n.toLocaleString('en-US'); }

function resetList(){
  var list=document.getElementById('list');
  list.innerHTML=''; shown=0;
  /* No data at all is a different problem from no match, and it must keep saying
     so. Previously typing anything wiped the load-failure notice and left a blank
     page, which reads exactly like "the product isn't in here". */
  if(!ALL.length){
    showEmpty('ยังไม่มีข้อมูลสินค้า','กดปุ่ม ⟳ มุมขวาบนเพื่อโหลดใหม่ ถ้ายังไม่ขึ้น แปลว่าเปิดไฟล์จากเครื่องโดยตรง ต้องเปิดผ่านลิงก์เว็บแทน');
    return;
  }
  if(!VIEW.length){
    showEmpty('ไม่พบสินค้าที่ค้นหา','ลองพิมพ์คำสั้นลง หรือพิมพ์เฉพาะชื่อยี่ห้อ เช่น "ตราฉัตร" หรือหมวดสินค้า เช่น "บะหมี่กึ่งสำเร็จรูป"');
    return;
  }
  renderMore();
}
function showEmpty(title,sub){
  document.getElementById('list').innerHTML =
    '<div class="empty"><div class="big">🔍</div><b>'+esc(title)+'</b>'+esc(sub)+'</div>';
  document.getElementById('loadmore').hidden=true;
}
function esc(t){
  return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* how wide a barcode may be inside a card, in CSS px */
function bcWidth(){
  var list=document.getElementById('list');
  var inner=Math.min(list.clientWidth||360, 640)-24;   /* minus list padding */
  return Math.max(150, inner-2-26-76-11-8);            /* border, card pad, unit col, gap, btn pad */
}

function renderMore(){
  var list=document.getElementById('list'), frag=document.createDocumentFragment();
  var end=Math.min(shown+PAGE, VIEW.length), W=bcWidth(), i, k;
  for(i=shown;i<end;i++){
    var p=VIEW[i], card=document.createElement('article'), isFreq=useCount(p)>=FREQ_MIN;
    card.className='pc'+(isFreq?' freq':'');
    var tag = isFreq ? '<span class="freqtag">ใช้บ่อย</span>' : '';
    var html='';
    /* onerror swaps only the <img>, so the "ใช้บ่อย" tag survives a broken image */
    if(p[1]) html+='<div class="pc-img">'+tag+'<img loading="lazy" decoding="async" alt="'+esc(p[0])+
      '" src="https://drive.google.com/thumbnail?id='+encodeURIComponent(p[1])+'&sz=w400"'+
      ' onerror="this.parentNode.className=\'pc-img none\';this.outerHTML='+
      '\'<span class=&quot;cam&quot;>📷</span><span>ยังไม่มีรูป</span>\'"></div>';
    else html+='<div class="pc-img none">'+tag+'<span class="cam">📷</span><span>ยังไม่มีรูป</span></div>';
    html+='<h2 class="pc-name">'+esc(p[0])+'</h2>';
    if(!p[2].length) html+='<div class="pc-unit"><span class="nobc">ไม่มีบาร์โค้ดในระบบ</span></div>';
    for(k=0;k<p[2].length;k++){
      var u=p[2][k], bar=BC.toWidth(u[0], W, 52);
      html+='<div class="pc-unit"><span class="uleft"><span class="uk">'+esc(u[1])+
        '</span><span class="un">'+(u[2]>0?fmt(u[2])+' ชิ้น':'&nbsp;')+'</span></span>'+
        '<span class="uright"><button class="bcbtn" data-i="'+i+'" data-u="'+k+'" '+
        'aria-label="ขยายบาร์โค้ด '+esc(u[0])+'">'+bar.svg+'</button></span></div>';
    }
    card.innerHTML=html;
    frag.appendChild(card);
  }
  list.appendChild(frag);
  shown=end;
  document.getElementById('loadmore').hidden = shown>=VIEW.length;
}

/* one delegated handler for every barcode button */
document.addEventListener('click',function(e){
  var b=e.target.closest && e.target.closest('.bcbtn');
  if(b) openFS(+b.dataset.i, +b.dataset.u);
});

function openFS(i,k){
  var p=VIEW[i]; if(!p) return;
  var u=p[2][k]; if(!u) return;
  /* this is the "I used this one" signal. The list is not reordered right now —
     that would yank the cards out from under the user — it happens on the next search. */
  bumpUse(p);
  var w=Math.min(window.innerWidth-40, 560);
  document.getElementById('fsName').textContent=p[0];
  document.getElementById('fsUnit').textContent=u[1]+(u[2]>0?' · '+fmt(u[2])+' ชิ้น':'');
  document.getElementById('fsWrap').innerHTML=BC.toWidth(u[0], w, 110).svg;
  document.getElementById('fsbc').classList.add('open');
  document.body.style.overflow='hidden';
}
function closeFS(){
  document.getElementById('fsbc').classList.remove('open');
  document.body.style.overflow='';
}
document.addEventListener('keydown',function(e){ if(e.key==='Escape') closeFS(); });


/* ══════════════════════════════════════════════════════════
   4. CHROME
   ══════════════════════════════════════════════════════════ */
var THEME_KEY='rattana_theme';
function applyTheme(t){
  document.body.classList.toggle('dark', t==='dark');
  var b=document.getElementById('themeBtn');
  if(b) b.textContent = (t==='dark') ? '☀️' : '🌙';
}
function toggleTheme(){
  var next = document.body.classList.contains('dark') ? 'light' : 'dark';
  try{ localStorage.setItem(THEME_KEY,next); }catch(e){}
  applyTheme(next);
}
function showSpinner(m){ document.getElementById('spinnerMsg').textContent=m||'กำลังโหลด…';
  document.getElementById('spinner').classList.add('show'); }
function hideSpinner(){ document.getElementById('spinner').classList.remove('show'); }
function setLoading(on){ document.getElementById('loadingBar').style.width = on?'85%':'0'; }
function toast(msg,type){
  var t=document.createElement('div');
  t.className='toast toast-'+(type||'info'); t.textContent=msg;
  document.body.appendChild(t); setTimeout(function(){ t.remove(); },3200);
}
async function refreshData(){
  var b=document.getElementById('btnRefresh');
  b.disabled=true; b.style.transform='rotate(360deg)'; b.style.transition='transform .6s';
  try{ localStorage.removeItem(CACHE_KEY); }catch(e){}
  await loadData(true);
  b.disabled=false;
  setTimeout(function(){ b.style.transform=''; b.style.transition=''; },600);
  toast('อัพเดทเรียบร้อย ✓','success');
}
function clearSearch(){
  var q=document.getElementById('q');
  q.value=''; applySearch(); q.focus();
}

/* header height drives the sticky offset of the search bar */
function syncHeader(){
  var h=document.querySelector('header').getBoundingClientRect().height;
  document.documentElement.style.setProperty('--hdH', h+'px');
}
window.addEventListener('scroll',function(){
  document.getElementById('backToTop').classList.toggle('show', window.scrollY>300);
});

/* debounce typing so 12k rows filter smoothly */
var tmr=null;
document.getElementById('q').addEventListener('input',function(){
  clearTimeout(tmr); tmr=setTimeout(applySearch,130);
});

/* infinite scroll */
io = new IntersectionObserver(function(en){
  if(en[0].isIntersecting && shown<VIEW.length) renderMore();
}, {rootMargin:'600px'});
io.observe(document.getElementById('sentinel'));

/* re-fit barcodes when the viewport width changes */
var rtmr=null, lastW=window.innerWidth;
window.addEventListener('resize',function(){
  if(Math.abs(window.innerWidth-lastW)<40) return;
  lastW=window.innerWidth;
  clearTimeout(rtmr); rtmr=setTimeout(function(){ syncHeader(); resetList(); },200);
});
