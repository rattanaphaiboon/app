/* ==========================================================================
   Rattana CI — components (v1.1) (uses the tokens in tokens.css)
   Prefix: rt-   ·   Themes: <html data-theme="light|dark">
   ========================================================================== */

/* ---------- Base ---------- */
.rt-app, .rt-app * { box-sizing: border-box; }
.rt-app {
  margin: 0; min-height: 100vh; isolation: isolate;
  font-family: var(--font-sans); font-size: 16px; line-height: 1.6;
  color: var(--text); background: var(--page);
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  transition: background-color .5s ease, color .4s ease;
}
.rt-app button, .rt-app input, .rt-app select, .rt-app textarea { font-family: inherit; }
:where(.rt-app a) { color: var(--gold-ink); }  /* zero specificity: component classes (nav items, buttons as links) keep their own colour */
.rt-app :focus-visible { outline: 3px solid var(--focus-ring); outline-offset: 2px; }
.rt-sr { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.rt-num { font-variant-numeric: tabular-nums; }
.rt-clamp2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.rt-container { width: 100%; max-width: var(--content-max); margin: 0 auto; padding: 0 var(--space-6); }
@media (max-width: 639px) { .rt-container { padding: 0 var(--space-4); } }

/* Type styles */
.rt-display { font-size: 48px; line-height: 1.15; font-weight: 700; letter-spacing: -0.015em; color: var(--ink); }
.rt-h1 { font-size: 36px; line-height: 1.2; font-weight: 700; letter-spacing: -0.01em; color: var(--ink); }
.rt-h2 { font-size: 28px; line-height: 1.25; font-weight: 600; color: var(--ink); }
.rt-h3 { font-size: 22px; line-height: 1.3; font-weight: 600; color: var(--ink); }
.rt-h4 { font-size: 18px; line-height: 1.35; font-weight: 600; color: var(--ink); }
.rt-body-sm { font-size: 14px; line-height: 1.5; }
.rt-label { font-size: 14px; line-height: 1.4; font-weight: 500; color: var(--text); }
.rt-caption { font-size: 12px; line-height: 1.4; font-weight: 500; color: var(--text-subtle); }
.rt-muted { color: var(--text-muted); }
.rt-subtle { color: var(--text-subtle); }
.rt-display, .rt-h1, .rt-h2, .rt-h3, .rt-h4 { margin: 0; }
@media (max-width: 639px) { .rt-display { font-size: 36px; } .rt-h1 { font-size: 30px; } .rt-h2 { font-size: 24px; } }

/* ---------- Ambient background (light orbs + gold light sweep) ---------- */
.rt-bg { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; background: var(--page); }
.rt-bg::before, .rt-bg::after { content: ""; position: absolute; border-radius: 999px; filter: blur(80px); }
.rt-bg::before { top: -160px; right: 4%; width: 560px; height: 420px; background: var(--ambient-1); animation: rt-float-a 18s ease-in-out infinite alternate; }
.rt-bg::after { bottom: -160px; left: -140px; width: 540px; height: 460px; background: var(--ambient-2); animation: rt-float-b 22s ease-in-out infinite alternate; }
.rt-bg-arc { position: absolute; top: -560px; left: -380px; width: 1600px; height: 980px; border-radius: 50%; border-top: 2px solid rgba(252,183,15,.5); animation: rt-wave 14s ease-in-out infinite alternate; }
.rt-bg-arc + .rt-bg-arc { top: -520px; border-top-color: rgba(252,183,15,.22); animation-duration: 18s; animation-direction: alternate-reverse; }

/* ---------- Surfaces ---------- */
.rt-glass {
  position: relative;
  background: linear-gradient(150deg, var(--surface-glass), color-mix(in srgb, var(--surface-glass) 80%, transparent));
  -webkit-backdrop-filter: blur(var(--blur-glass)) saturate(180%); backdrop-filter: blur(var(--blur-glass)) saturate(180%);
  border: 1px solid var(--glass-edge); box-shadow: var(--shadow-glass); border-radius: var(--radius-card);
}
.rt-glass::before { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; background: linear-gradient(180deg, rgba(255,255,255,.22), rgba(255,255,255,0) 36%); }
.rt-glass > * { position: relative; }
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) { .rt-glass { background: var(--surface); } }
.rt-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-card); box-shadow: var(--shadow-2); }
.rt-panel { border-radius: var(--radius-panel); }
.rt-pad { padding: var(--space-6); }
.rt-pad-sm { padding: var(--space-4); }
.rt-navy-panel { position: relative; overflow: hidden; color: #f7fcfe; border-radius: var(--radius-panel); background: linear-gradient(125deg, #0e2f55 0%, var(--navy) 55%, var(--navy-900) 100%); border: 1px solid rgba(255,255,255,.12); box-shadow: inset 0 1px 0 rgba(255,255,255,.2), 0 30px 60px -24px rgba(1,30,62,.6); }
.rt-navy-panel::after { content: ""; position: absolute; right: -60px; top: -80px; width: 340px; height: 340px; border-radius: 999px; background: radial-gradient(circle, rgba(252,183,15,.38), rgba(252,183,15,0) 65%); pointer-events: none; }
.rt-lift { transition: transform .25s cubic-bezier(.2,.8,.2,1), box-shadow .25s ease-out, border-color .25s; }
.rt-lift:hover { transform: translateY(-3px); box-shadow: var(--shadow-3); border-color: rgba(252,183,15,.45); }
.rt-sheen { overflow: hidden; }
.rt-sheen::after { content: ""; position: absolute; top: 0; left: 0; width: 24%; height: 100%; pointer-events: none; background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.3), rgba(255,255,255,0)); animation: rt-shine 7s ease-in-out infinite; }

/* ---------- Buttons ---------- */
.rt-btn {
  position: relative; display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2);
  height: 44px; padding: 0 18px; border: 1px solid transparent; border-radius: var(--radius-control);
  font-size: 15px; font-weight: 600; line-height: 1.2; white-space: nowrap; text-decoration: none; cursor: pointer;
  transition: transform .14s cubic-bezier(.2,.8,.2,1), box-shadow .2s, background .2s, color .2s, filter .2s;
}
.rt-btn:active:not(:disabled):not(.is-loading) { transform: scale(.97); }
.rt-btn svg { width: 18px; height: 18px; flex: none; }
.rt-btn-sm { height: 36px; padding: 0 12px; font-size: 14px; border-radius: var(--radius-sm); }
.rt-btn-sm svg { width: 16px; height: 16px; }
.rt-btn-lg { height: 52px; padding: 0 24px; font-size: 16px; border-radius: 16px; }
.rt-btn-pill { border-radius: var(--radius-pill); }
.rt-btn-block { width: 100%; }
/* v1.1: full width only on phones — on wider screens a block button stays compact and right-aligned, leaving room for other info */
@media (min-width: 640px) { .rt-btn-block { display: flex; width: fit-content; min-width: 160px; margin-left: auto; } }
.rt-btn-icon { width: 44px; padding: 0; }
.rt-btn-icon.rt-btn-sm { width: 36px; }

.rt-btn-gold { color: var(--on-gold); background: linear-gradient(180deg, #ffd35a 0%, var(--gold) 55%, var(--gold-hover) 100%); box-shadow: inset 0 1px 0 rgba(255,255,255,.7), inset 0 -2px 0 rgba(138,98,0,.25), var(--shadow-gold); }
.rt-btn-gold:hover { filter: brightness(1.04); box-shadow: inset 0 1px 0 rgba(255,255,255,.7), inset 0 -2px 0 rgba(138,98,0,.25), 0 14px 28px -8px rgba(234,163,0,.8); }
.rt-btn-approve { color: #fff; background: linear-gradient(180deg, var(--approve), #137538); box-shadow: inset 0 1px 0 rgba(255,255,255,.3), 0 10px 22px -8px rgba(22,163,74,.55); }
.rt-btn-approve:hover { background: var(--approve-hover); }
.rt-btn-reject { color: #fff; background: linear-gradient(180deg, var(--reject), #c81e1e); box-shadow: inset 0 1px 0 rgba(255,255,255,.3), 0 10px 22px -8px rgba(220,38,38,.5); }
.rt-btn-reject:hover { background: var(--reject-hover); }
.rt-btn-glass { color: var(--ink); background: var(--field); border-color: var(--border); box-shadow: inset 0 1px 0 rgba(255,255,255,.35); }
.rt-btn-glass:hover { background: var(--hover); }
.rt-btn-ghost { color: var(--ink); background: transparent; }
.rt-btn-ghost:hover { background: var(--hover); }
.rt-btn-link { height: auto; padding: 4px 2px; color: var(--text-muted); background: none; text-decoration: underline; text-underline-offset: 3px; font-size: 14px; }
.rt-btn-link:hover { color: var(--ink); }
.rt-btn-danger-soft { color: var(--reject); background: var(--reject-soft); }
.rt-btn:disabled, .rt-btn[aria-disabled="true"] { opacity: .5; cursor: not-allowed; box-shadow: none; filter: none; }
.rt-btn.is-loading { color: transparent !important; cursor: progress; }
.rt-btn.is-loading > * { visibility: hidden; }
.rt-btn.is-loading::after { content: ""; position: absolute; width: 18px; height: 18px; border-radius: 999px; border: 2.5px solid currentColor; border-color: var(--rt-spin, var(--on-gold)) transparent var(--rt-spin, var(--on-gold)) var(--rt-spin, var(--on-gold)); animation: rt-spin .8s linear infinite; }
.rt-btn-approve.is-loading, .rt-btn-reject.is-loading { --rt-spin: #fff; }
.rt-btn-glass.is-loading, .rt-btn-ghost.is-loading { --rt-spin: var(--ink); }
.rt-btn-group { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); }
.rt-btn-group-end { justify-content: flex-end; }
/* Action bar: summary/info on the left, compact buttons on the right */
.rt-actions { display: flex; align-items: center; justify-content: flex-end; flex-wrap: wrap; gap: 10px 12px; }
.rt-actions-info { flex: 1 1 180px; min-width: 0; margin-right: auto; display: flex; flex-direction: column; gap: 2px; }
.rt-actions > .rt-btn { flex: none; min-width: 112px; }
@media (max-width: 639px) { .rt-actions-info { flex-basis: 100%; } }

/* ---------- 3D icon tiles ---------- */
.rt-tile { flex: none; display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 14px; }
.rt-tile svg { width: 50%; height: 50%; }
.rt-tile-sm { width: 32px; height: 32px; border-radius: 10px; }
.rt-tile-lg { width: 52px; height: 52px; border-radius: 17px; }
.rt-tile-xl { width: 76px; height: 76px; border-radius: 24px; }
.rt-tile-navy { color: var(--gold); background: linear-gradient(150deg, #2a5079 0%, #0b2747 60%, var(--navy-900) 100%); border: 1px solid rgba(255,255,255,.18); box-shadow: inset 0 1px 0 rgba(255,255,255,.3), 0 12px 24px -8px rgba(1,30,62,.55); }
.rt-tile-gold { color: var(--on-gold); background: linear-gradient(150deg, #ffe7a0 0%, var(--gold) 45%, #c98a00 100%); box-shadow: inset 0 1px 0 rgba(255,255,255,.8), inset 0 -3px 6px rgba(138,98,0,.35), var(--shadow-gold); }
.rt-tile-blue { color: #fff; background: linear-gradient(150deg, #9cc2ff 0%, #2563eb 50%, #1e3a8a 100%); box-shadow: inset 0 1px 0 rgba(255,255,255,.6), inset 0 -3px 6px rgba(0,0,0,.25), 0 12px 26px -8px rgba(37,99,235,.55); }
.rt-tile-amber { color: var(--on-gold); background: linear-gradient(150deg, #fde68a 0%, #f59e0b 50%, #b45309 100%); box-shadow: inset 0 1px 0 rgba(255,255,255,.7), inset 0 -3px 6px rgba(0,0,0,.2), 0 12px 26px -8px rgba(217,119,6,.55); }
.rt-tile-green { color: #fff; background: linear-gradient(180deg, var(--approve), #137538); box-shadow: inset 0 1px 0 rgba(255,255,255,.3), 0 10px 22px -8px rgba(22,163,74,.55); }
.rt-tile-red { color: #fff; background: linear-gradient(180deg, var(--reject), #c81e1e); box-shadow: inset 0 1px 0 rgba(255,255,255,.3), 0 10px 22px -8px rgba(220,38,38,.5); }
.rt-tile-3d { transform: perspective(600px) rotateX(12deg) rotateY(-18deg); transition: transform .45s cubic-bezier(.3,1.3,.5,1); }
.rt-tile-float { animation: rt-bob 5s ease-in-out infinite; }

/* ---------- Badges & chips ---------- */
.rt-badge { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: var(--radius-pill); font-size: 12px; font-weight: 600; line-height: 1; white-space: nowrap; border: 1px solid transparent; }
.rt-badge svg { width: 13px; height: 13px; flex: none; }
.rt-badge-pending { background: var(--warning); color: var(--on-gold); }
.rt-badge-warning { background: var(--warning-soft); color: var(--warning-text); }
.rt-badge-info { background: var(--info-soft); color: var(--info-text); }
.rt-badge-success { background: var(--approve-soft); color: var(--approve-text); }
.rt-badge-danger { background: var(--reject-soft); color: var(--reject-text); }
.rt-badge-neutral { background: var(--hover); color: var(--ink); border-color: var(--line); }
.rt-badge-gold { color: var(--on-gold); background: linear-gradient(180deg, #ffd35a, var(--gold)); }
.rt-badge-sample { background: var(--info-soft); color: var(--info-text); border-color: color-mix(in srgb, var(--info) 30%, transparent); font-weight: 500; }
.rt-count { min-width: 18px; height: 18px; padding: 0 5px; border-radius: var(--radius-pill); display: inline-flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; color: var(--on-gold); background: var(--gold); }
.rt-chip { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 14px; border-radius: var(--radius-pill); border: 1px solid var(--border); background: var(--field); color: var(--ink); font-size: 13px; font-weight: 600; cursor: pointer; transition: background .2s, color .2s, transform .14s; }
.rt-chip:hover { background: var(--hover); }
.rt-chip[aria-pressed="true"] { color: var(--on-gold); border-color: transparent; background: linear-gradient(180deg, #ffd35a, var(--gold)); box-shadow: var(--shadow-gold); }

/* ---------- Forms ---------- */
.rt-field { display: flex; flex-direction: column; gap: 6px; }
.rt-field > label, .rt-field-label { font-size: 14px; font-weight: 500; color: var(--text); }
.rt-req { color: var(--reject); margin-left: 2px; }
.rt-input, .rt-select, .rt-textarea {
  width: 100%; min-height: 46px; padding: 0 14px; border-radius: var(--radius-input);
  border: 1px solid var(--border); background: var(--field); color: var(--text); font-size: 15px;
  box-shadow: inset 0 2px 6px rgba(1,30,62,.05); transition: border-color .2s, box-shadow .2s;
}
.rt-textarea { padding: 12px 14px; line-height: 1.55; resize: vertical; min-height: 88px; }
.rt-select { appearance: none; padding-right: 40px; background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%); background-position: calc(100% - 20px) 50%, calc(100% - 15px) 50%; background-size: 5px 5px; background-repeat: no-repeat; }
.rt-input::placeholder, .rt-textarea::placeholder { color: var(--text-subtle); }
.rt-input:focus, .rt-select:focus, .rt-textarea:focus { outline: none; border-color: var(--ink); box-shadow: 0 0 0 4px rgba(252,183,15,.35); }
.rt-input:disabled, .rt-select:disabled, .rt-textarea:disabled { opacity: .55; cursor: not-allowed; }
.rt-field.is-invalid .rt-input, .rt-field.is-invalid .rt-textarea, .rt-field.is-invalid .rt-select { border-color: var(--reject); }
.rt-field.is-valid .rt-input { border-color: var(--approve-mark); }
.rt-help { font-size: 12px; color: var(--text-subtle); }
.rt-error-text, .rt-success-text { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; }
.rt-error-text { color: var(--reject-text); }
.rt-success-text { color: var(--approve-text); }
.rt-error-text svg, .rt-success-text svg { width: 14px; height: 14px; flex: none; }
.rt-search { display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 16px; border-radius: var(--radius-pill); border: 1px solid var(--border); background: var(--field); color: var(--text-subtle); box-shadow: inset 0 2px 6px rgba(1,30,62,.05); }
.rt-search input { flex: 1; min-width: 0; height: 100%; border: 0; outline: none; background: transparent; color: var(--text); font-size: 15px; }
.rt-search:focus-within { border-color: var(--ink); box-shadow: 0 0 0 4px rgba(252,183,15,.35); }
.rt-search svg { width: 18px; height: 18px; flex: none; }
.rt-switch { position: relative; display: inline-flex; align-items: center; gap: 10px; cursor: pointer; font-size: 14px; }
.rt-switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.rt-switch-track { width: 48px; height: 28px; border-radius: 999px; background: var(--border); position: relative; transition: background .25s; flex: none; }
.rt-switch-track::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 999px; background: #fff; box-shadow: 0 2px 6px rgba(1,30,62,.3); transition: transform .3s cubic-bezier(.3,1.4,.5,1); }
.rt-switch input:checked + .rt-switch-track { background: linear-gradient(180deg, #ffd35a, var(--gold)); }
.rt-switch input:checked + .rt-switch-track::after { transform: translateX(20px); }
.rt-switch input:focus-visible + .rt-switch-track { outline: 3px solid var(--focus-ring); outline-offset: 2px; }
.rt-stepper { display: inline-flex; align-items: center; border-radius: var(--radius-pill); border: 1px solid var(--border); background: var(--field); }
.rt-stepper button { width: 36px; height: 36px; border: 0; background: transparent; border-radius: 999px; color: var(--ink); cursor: pointer; display: flex; align-items: center; justify-content: center; }
.rt-stepper button:hover { background: var(--hover); }
.rt-stepper output, .rt-stepper span { min-width: 28px; text-align: center; font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; }

/* ---------- Segmented control / tabs (liquid pill) ---------- */
.rt-seg { --i: 0; --n: 3; position: relative; display: inline-flex; padding: 4px; border-radius: var(--radius-pill); background: var(--field); border: 1px solid var(--border); }
.rt-seg::before { content: ""; position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc((100% - 8px) / var(--n)); border-radius: var(--radius-pill); background: linear-gradient(180deg, #ffd35a 0%, var(--gold) 55%, var(--gold-hover) 100%); box-shadow: inset 0 1px 0 rgba(255,255,255,.7), var(--shadow-gold); transform: translateX(calc(var(--i) * 100%)); transition: transform .4s cubic-bezier(.3,1.4,.5,1); }
.rt-seg > button { position: relative; flex: 1 1 0; min-width: 84px; height: 36px; padding: 0 14px; border: 0; background: transparent; border-radius: var(--radius-pill); color: var(--text); font-size: 13px; font-weight: 700; cursor: pointer; transition: color .25s; white-space: nowrap; }
.rt-seg > button[aria-pressed="true"], .rt-seg > button[aria-selected="true"] { color: var(--on-gold); }
.rt-seg-block { display: flex; }

/* ---------- Date context (mandatory: top-left) ---------- */
.rt-date { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; font-size: 14px; color: var(--text-muted); }
.rt-date-main { display: inline-flex; align-items: center; gap: 8px; font-weight: 500; }
.rt-date-main svg { width: 18px; height: 18px; }
.rt-date-dot { width: 4px; height: 4px; border-radius: 999px; background: var(--text-subtle); opacity: .5; }
.rt-page-head { display: flex; flex-direction: column; gap: 12px; }

/* ---------- KPI ---------- */
.rt-kpi { display: flex; flex-direction: column; gap: 12px; padding: 18px; }
.rt-kpi-head { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 500; color: var(--text-muted); }
.rt-kpi-value { font-size: 26px; line-height: 1.1; font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; }
.rt-kpi-trend { font-size: 12px; font-weight: 600; }
.rt-kpi-trend small { font-size: 12px; font-weight: 400; color: var(--text-subtle); }
.rt-up { color: var(--approve-text); }
.rt-down { color: var(--reject-text); }
.rt-grid-kpi { display: grid; grid-template-columns: repeat(auto-fit, minmax(196px, 1fr)); gap: 14px; }

/* ---------- Tables (two-line cells) ---------- */
.rt-table-wrap { overflow-x: auto; }
.rt-table { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
.rt-table th { height: 42px; padding: 0 12px; text-align: left; font-weight: 500; color: var(--text-muted); background: var(--hover); white-space: nowrap; }
.rt-table td { padding: 8px 12px; height: 52px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.rt-table th:first-child, .rt-table td:first-child { padding-left: 22px; }
.rt-table th:last-child, .rt-table td:last-child { padding-right: 22px; }
.rt-table tbody tr { transition: background .18s; }
.rt-table tbody tr:hover { background: var(--hover); }
.rt-table .rt-right { text-align: right; }
.rt-cell-main { font-weight: 600; color: var(--ink); }
.rt-cell-sub { font-size: 12px; color: var(--text-subtle); }
.rt-table-card { padding: 20px 0 8px; display: flex; flex-direction: column; gap: 12px; }
.rt-table-card > header { display: flex; justify-content: space-between; align-items: flex-end; gap: 8px; padding: 0 22px; }

/* ---------- Navigation ---------- */
.rt-sidebar { position: relative; overflow: hidden; width: 100%; max-width: var(--sidebar-width); display: flex; flex-direction: column; gap: 22px; padding: 22px 14px; border-radius: var(--radius-panel); color: #f7fcfe; background: linear-gradient(165deg, #0e2f55 0%, var(--navy) 45%, var(--navy-900) 100%); border: 1px solid rgba(255,255,255,.1); box-shadow: inset 0 1px 0 rgba(255,255,255,.18), 0 30px 60px -24px rgba(1,30,62,.6); }
.rt-sidebar::before { content: ""; position: absolute; top: -80px; left: -60px; width: 260px; height: 220px; border-radius: 999px; background: radial-gradient(circle, rgba(252,183,15,.22), rgba(252,183,15,0) 65%); pointer-events: none; }
.rt-nav { position: relative; display: flex; flex-direction: column; gap: 4px; }
.rt-nav-item { display: flex; align-items: center; gap: 12px; height: 46px; padding: 0 12px; border-radius: 14px; border: 1px solid transparent; color: #c7d2e0; font-size: 15px; font-weight: 500; text-decoration: none; transition: background .2s, color .2s; }
.rt-nav-item:hover { background: rgba(255,255,255,.08); color: #fff; }
.rt-nav-item svg { width: 20px; height: 20px; flex: none; }
.rt-nav-item .rt-nav-ico { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 10px; }
.rt-nav-item[aria-current="page"] { color: #fff; font-weight: 700; background: linear-gradient(180deg, rgba(252,183,15,.24), rgba(252,183,15,.08)); border-color: rgba(252,183,15,.4); box-shadow: inset 0 1px 0 rgba(255,255,255,.18), 0 0 26px rgba(252,183,15,.18); }
.rt-nav-item[aria-current="page"] .rt-nav-ico { color: var(--on-gold); background: linear-gradient(150deg, #ffe7a0, var(--gold) 45%, #c98a00); box-shadow: inset 0 1px 0 rgba(255,255,255,.8); }
.rt-nav-item .rt-count { margin-left: auto; }
.rt-topbar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; min-height: var(--topbar-height); padding: 10px 12px 10px 18px; border-radius: 24px; }
.rt-topbar-end { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.rt-navlink { position: relative; height: 40px; display: inline-flex; align-items: center; gap: 4px; padding: 0 12px; border-radius: 12px; color: var(--text); font-size: 15px; font-weight: 500; text-decoration: none; transition: background .2s; }
.rt-navlink:hover { background: var(--hover); color: var(--text); }
.rt-navlink[aria-current="page"] { color: var(--ink); font-weight: 700; }
.rt-navlink[aria-current="page"]::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: 2px; height: 3px; border-radius: 999px; background: linear-gradient(90deg, #ffd35a, var(--gold)); }
.rt-bottom-nav { position: fixed; left: 12px; right: 12px; bottom: 14px; z-index: 40; height: 70px; display: flex; align-items: center; justify-content: space-around; padding: 0 4px; border-radius: 28px; }
.rt-bottom-nav a { position: relative; width: 64px; height: 56px; border-radius: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--text-muted); font-size: 10px; font-weight: 500; text-decoration: none; }
.rt-bottom-nav a svg { width: 22px; height: 22px; }
.rt-bottom-nav a[aria-current="page"] { color: var(--gold-ink); font-weight: 700; background: linear-gradient(180deg, rgba(252,183,15,.28), rgba(252,183,15,.10)); border: 1px solid rgba(252,183,15,.45); }
.rt-bottom-nav .rt-count { position: absolute; top: 4px; right: 12px; }
.rt-logo-slot { display: inline-flex; align-items: center; justify-content: center; height: 40px; padding: 0 14px; border: 1.5px dashed var(--border); border-radius: 12px; font-size: 12px; font-weight: 600; color: var(--text-muted); }

/* ---------- Logo (approved artwork only: rattana-logo-navy.png / rattana-logo-transparent.png) ---------- */
.rt-logo { display: inline-flex; align-items: center; justify-content: center; flex: none; height: 56px; line-height: 0; text-decoration: none; }
.rt-logo img { display: block; width: auto; }
.rt-logo .rt-logo-light { height: 100%; border-radius: 12px; box-shadow: var(--shadow-1); }
.rt-logo .rt-logo-dark { height: 64%; display: none; }
[data-theme="dark"] .rt-logo .rt-logo-light { display: none; }
[data-theme="dark"] .rt-logo .rt-logo-dark { display: block; }
.rt-logo-sm { height: 44px; }
.rt-logo-lg { height: 96px; }
.rt-logo-on-navy { display: block; width: 100%; max-width: 200px; height: auto; margin: 0 auto; padding: 14px 18px; }

/* ---------- Commerce ---------- */
.rt-product { display: flex; flex-direction: column; gap: 12px; padding: 12px; border-radius: 26px; }
.rt-product-media { position: relative; aspect-ratio: 1 / 1; border-radius: 20px; overflow: hidden; display: flex; align-items: center; justify-content: center; background: linear-gradient(165deg, var(--surface) 0%, color-mix(in srgb, var(--page) 70%, var(--surface)) 55%, color-mix(in srgb, var(--page) 85%, #c4d2e4) 100%); box-shadow: inset 0 1px 0 rgba(255,255,255,.7); }
.rt-product-media img { width: 100%; height: 100%; object-fit: cover; }
.rt-product-media .rt-badge { position: absolute; top: 10px; left: 10px; }
.rt-product-media .rt-wish { position: absolute; top: 8px; right: 8px; }
.rt-product:hover .rt-tile-3d { transform: perspective(600px) rotateX(10deg) rotateY(-16deg) translateY(-8px); }
.rt-product-name { margin: 0; font-size: 15px; line-height: 1.45; font-weight: 600; color: var(--text); min-height: 43px; }
.rt-price-row { display: flex; align-items: baseline; gap: 8px; font-variant-numeric: tabular-nums; }
.rt-price { font-size: 20px; font-weight: 700; color: var(--ink); }
.rt-price-old { font-size: 13px; color: var(--text-subtle); text-decoration: line-through; }
.rt-wish { width: 40px; height: 40px; border-radius: 999px; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer; color: var(--ink); }
.rt-wish svg { width: 18px; height: 18px; transition: transform .3s cubic-bezier(.3,1.8,.5,1); }
.rt-wish[aria-pressed="true"] { color: #c98a00; }
.rt-wish[aria-pressed="true"] svg { fill: var(--gold); transform: scale(1.15); }
.rt-grid-products { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
@media (max-width: 639px) { .rt-grid-products { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; } .rt-product { padding: 8px; border-radius: 22px; } }

/* ---------- Lists, timeline, progress, empty, skeleton ---------- */
.rt-list-row { display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 18px; background: var(--hover); }
.rt-progress { height: 6px; border-radius: 999px; background: var(--line); overflow: hidden; }
.rt-progress > span { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #ffd35a, var(--gold)); box-shadow: 0 0 10px rgba(252,183,15,.45); transition: width .6s cubic-bezier(.2,.8,.2,1); }
.rt-progress.is-warning > span { background: var(--warning); box-shadow: none; }
.rt-progress.is-danger > span { background: var(--reject); box-shadow: none; }
.rt-timeline { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.rt-timeline li { position: relative; display: flex; gap: 12px; padding-bottom: 16px; }
.rt-timeline li::before { content: ""; position: absolute; left: 6px; top: 20px; bottom: 0; width: 2px; background: linear-gradient(180deg, var(--border), transparent); }
.rt-timeline li:last-child::before { display: none; }
.rt-timeline-dot { flex: none; width: 14px; height: 14px; margin-top: 3px; border-radius: 999px; background: var(--info); box-shadow: 0 0 10px currentColor, inset 0 1px 0 rgba(255,255,255,.5); color: var(--info); }
.rt-timeline-dot.is-success { background: var(--approve-mark); color: var(--approve-mark); }
.rt-timeline-dot.is-danger { background: var(--reject); color: var(--reject); }
.rt-timeline-dot.is-pending { background: var(--warning); color: var(--warning); }
.rt-empty { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 36px 20px; text-align: center; }
.rt-empty p { margin: 0; color: var(--text-muted); font-size: 14px; }
.rt-skeleton { position: relative; overflow: hidden; border-radius: 12px; background: var(--line); }
.rt-skeleton::after { content: ""; position: absolute; inset: 0; transform: translateX(-100%); background: linear-gradient(90deg, transparent, rgba(255,255,255,.45), transparent); animation: rt-skel 1.4s ease-in-out infinite; }

/* ---------- Motion ---------- */
.rt-rise { animation: rt-rise .55s cubic-bezier(.2,.8,.2,1) both; }
.rt-pop { animation: rt-pop .4s cubic-bezier(.3,1.3,.5,1) both; }
.rt-spin { animation: rt-spin .8s linear infinite; }
@keyframes rt-spin { to { transform: rotate(360deg); } }
@keyframes rt-rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
@keyframes rt-pop { from { opacity: 0; transform: translateY(12px) scale(.96); } to { opacity: 1; transform: translateY(0) scale(1); } }
@keyframes rt-fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes rt-shine { 0% { transform: translateX(-160%) skewX(-22deg); } 60%, 100% { transform: translateX(420%) skewX(-22deg); } }
@keyframes rt-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
@keyframes rt-float-a { 0% { transform: translate(0,0) scale(1); } 100% { transform: translate(70px,50px) scale(1.12); } }
@keyframes rt-float-b { 0% { transform: translate(0,0); } 100% { transform: translate(-80px,-40px) scale(1.1); } }
@keyframes rt-wave { 0% { transform: rotate(-9deg); } 100% { transform: rotate(-6deg) translateX(40px); } }
@keyframes rt-skel { to { transform: translateX(100%); } }
@media (prefers-reduced-motion: reduce) {
  .rt-app *, .rt-app *::before, .rt-app *::after, .rt-bg::before, .rt-bg::after { animation: none !important; transition: none !important; }
}
/* ---------- Overlays: popup, modal, sheet, drawer, menu, toast (v1.1) ---------- */
html.rt-locked, html.rt-locked body { overflow: hidden; }
html.rt-locked body { padding-right: var(--rt-sbw, 0px); }
.rt-overlay { position: fixed; inset: 0; z-index: 90; display: flex; align-items: center; justify-content: center; padding: max(16px, var(--safe-top)) max(16px, var(--safe-right)) max(16px, var(--safe-bottom)) max(16px, var(--safe-left)); }
.rt-scrim { position: absolute; inset: 0; background: var(--scrim); -webkit-backdrop-filter: blur(var(--blur-scrim)) saturate(120%); backdrop-filter: blur(var(--blur-scrim)) saturate(120%); animation: rt-fade var(--rt-dur-3) var(--rt-ease-out) both; }
.rt-overlay.is-closing .rt-scrim { animation: rt-fade-out var(--rt-dur-2) var(--rt-ease-in) both; }

/* Centered modal (desktop / laptop) — grows from where the user tapped */
.rt-modal { position: relative; width: 100%; max-width: 480px; max-height: calc(100dvh - 32px); overflow: auto; overscroll-behavior: contain; padding: 26px; border-radius: var(--radius-panel); display: flex; flex-direction: column; gap: 18px; animation: rt-modal-in var(--rt-dur-4) var(--rt-ease-spring) both; }
.rt-modal.is-settled { animation: none; }
.rt-overlay.is-closing .rt-modal, .rt-overlay.is-closing .rt-modal.is-settled { animation: rt-modal-out var(--rt-dur-2) var(--rt-ease-in) both; }
.rt-modal-head { display: flex; gap: 14px; align-items: flex-start; }
.rt-modal-head p { margin: 6px 0 0; font-size: 14px; line-height: 1.6; color: var(--text-muted); }
@keyframes rt-modal-in { 0% { opacity: 0; transform: translate(var(--rt-from-x, 0px), var(--rt-from-y, 14px)) scale(.84); filter: blur(8px); } 55% { opacity: 1; filter: blur(0); } 100% { opacity: 1; transform: none; filter: none; } }
@keyframes rt-modal-out { to { opacity: 0; transform: translateY(8px) scale(.94); filter: blur(4px); } }

/* Bottom sheet (phones) — floating, swipe down to close, lifts above the keyboard */
.rt-overlay.is-sheet { align-items: flex-end; padding: 0 max(8px, var(--safe-left)) calc(8px + var(--safe-bottom)) max(8px, var(--safe-right)); }
.rt-overlay.is-sheet .rt-modal { max-width: 640px; margin: 0 auto; border-radius: 30px; padding: 10px 20px 22px; margin-bottom: var(--rt-kb, 0px); max-height: calc(100dvh - var(--safe-top) - 24px - var(--rt-kb, 0px)); animation: rt-sheet-in var(--rt-dur-4) var(--rt-ease-emph) both; transition: margin-bottom var(--rt-dur-2) var(--rt-ease-out); }
.rt-overlay.is-sheet .rt-modal.is-settled { animation: none; }
.rt-overlay.is-sheet.is-closing .rt-modal, .rt-overlay.is-sheet.is-closing .rt-modal.is-settled { animation: rt-sheet-out var(--rt-dur-3) var(--rt-ease-in) both; }
.rt-overlay.is-sheet .rt-modal.is-dragging { transition: none; }
.rt-sheet-handle { flex: none; display: block; width: 44px; height: 5px; margin: 0 auto -4px; border-radius: 999px; background: color-mix(in srgb, var(--ink) 22%, transparent); }
.rt-sheet-handle, .rt-popup-head, .rt-popup-icon { touch-action: none; }
@keyframes rt-sheet-in { from { transform: translateY(110%); } to { transform: none; } }
@keyframes rt-sheet-out { to { transform: translateY(110%); } }

/* Drawer (side panel on tablets/laptops; becomes a sheet on phones) */
.rt-overlay.is-drawer { justify-content: flex-end; align-items: stretch; padding: max(12px, var(--safe-top)) max(12px, var(--safe-right)) max(12px, var(--safe-bottom)) 12px; }
.rt-overlay.is-drawer.is-left { justify-content: flex-start; padding-left: max(12px, var(--safe-left)); padding-right: 12px; }
.rt-overlay.is-drawer .rt-modal { max-width: 420px; height: 100%; max-height: none; animation: rt-drawer-in var(--rt-dur-4) var(--rt-ease-emph) both; }
.rt-overlay.is-drawer.is-left .rt-modal { animation-name: rt-drawer-in-left; }
.rt-overlay.is-drawer .rt-modal.is-settled { animation: none; }
.rt-overlay.is-drawer.is-closing .rt-modal, .rt-overlay.is-drawer.is-closing .rt-modal.is-settled { animation: rt-drawer-out var(--rt-dur-3) var(--rt-ease-in) both; }
.rt-overlay.is-drawer.is-left.is-closing .rt-modal { animation-name: rt-drawer-out-left; }
.rt-drawer { position: absolute; top: 12px; right: 12px; bottom: 12px; width: min(420px, calc(100% - 24px)); padding: 22px; border-radius: var(--radius-panel); display: flex; flex-direction: column; gap: 16px; animation: rt-drawer-in var(--rt-dur-4) var(--rt-ease-emph) both; }
@keyframes rt-drawer-in { from { transform: translateX(108%); } to { transform: none; } }
@keyframes rt-drawer-out { to { transform: translateX(108%); } }
@keyframes rt-drawer-in-left { from { transform: translateX(-108%); } to { transform: none; } }
@keyframes rt-drawer-out-left { to { transform: translateX(-108%); } }

/* Popup content */
.rt-popup { gap: 16px; }
.rt-popup > * { animation: rt-rise var(--rt-dur-4) var(--rt-ease-out) both; animation-delay: calc(90ms + var(--i, 0) * 55ms); }
.rt-popup.is-center { text-align: center; }
.rt-popup-head { display: flex; flex-direction: column; gap: 6px; }
.rt-popup-head .rt-h3 { margin: 0; }
.rt-popup-msg { margin: 0; font-size: 15px; line-height: 1.6; color: var(--text-muted); }
.rt-popup-body { font-size: 15px; color: var(--text); text-align: left; display: flex; flex-direction: column; gap: 14px; }
.rt-popup-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 10px; padding-top: 4px; }
.rt-popup.is-center .rt-popup-actions > .rt-btn, .rt-overlay.is-sheet .rt-popup-actions > .rt-btn { flex: 1 1 0; }
@media (min-width: 640px) { .rt-popup.is-center .rt-popup-actions { justify-content: center; } .rt-popup.is-center .rt-popup-actions > .rt-btn { max-width: 200px; } }
.rt-popup-actions.is-stacked { flex-direction: column-reverse; }
.rt-popup-actions.is-stacked > .rt-btn { width: 100%; flex: none; }
.rt-popup-icon { position: relative; width: 64px; height: 64px; border-radius: 22px; overflow: visible; }
.rt-popup.is-center .rt-popup-icon { margin: 6px auto 0; }
.rt-popup-icon svg { position: relative; z-index: 1; width: 30px; height: 30px; }
.rt-popup-icon::after { content: ""; position: absolute; inset: 0; border-radius: inherit; animation: rt-ring 1.2s var(--rt-ease-out) .35s both; }
.rt-tile-green { --rt-ring: rgba(22,163,74,.45); } .rt-tile-red { --rt-ring: rgba(220,38,38,.42); } .rt-tile-gold { --rt-ring: rgba(252,183,15,.5); } .rt-tile-blue { --rt-ring: rgba(37,99,235,.42); } .rt-tile-amber { --rt-ring: rgba(217,119,6,.45); }
@keyframes rt-ring { 0% { box-shadow: 0 0 0 0 var(--rt-ring, rgba(252,183,15,.5)); } 100% { box-shadow: 0 0 0 22px rgba(0,0,0,0); } }
.rt-draw path { stroke-dasharray: 1; stroke-dashoffset: 1; animation: rt-draw .6s var(--rt-ease-out) .3s forwards; }

<script>
'use strict';

/* ══════════════════════════════════════════════════════════
   1. BARCODE ENGINE
   Draws EAN-13 / EAN-8 / UPC-A / ITF-14, and falls back to
   CODE 128 for anything that is not a valid GTIN (~7% of the
   sheet: wrong check digit, odd length, or non-numeric).
   Style: uniform bar height, digits spread beneath.
   ══════════════════════════════════════════════════════════ */
var BC = (function(){
  var L=['0001101','0011001','0010011','0111101','0100011','0110001','0101111','0111011','0110111','0001011'],
      G=['0100111','0110011','0011011','0100001','0011101','0111001','0000101','0010001','0001001','0010111'],
      R=['1110010','1100110','1101100','1000010','1011100','1001110','1010000','1000100','1001000','1110100'],
      PAR=['LLLLLL','LLGLGG','LLGGLG','LLGGGL','LGLLGG','LGGLLG','LGGGLL','LGLGLG','LGLGGL','LGGLGL'],
      ITF=['00110','10001','01001','11000','00101','10100','01100','00011','10010','01010'],
      C128=('212222,222122,222221,121223,121322,131222,122213,122312,132212,221213,221312,231212,112232,'+
        '122132,122231,113222,123122,123221,223211,221132,221231,213212,223112,312131,311222,321122,321221,'+
        '312212,322112,322211,212123,212321,232121,111323,131123,131321,112313,132113,132311,211313,231113,'+
        '231311,112133,112331,132131,113123,113321,133121,313121,211331,231131,213113,213311,213131,311123,'+
        '311321,331121,312113,312311,332111,314111,221411,431111,111224,111422,121124,121421,141122,141221,'+
        '112214,112412,122114,122411,142112,142211,241211,221114,413111,241112,134111,111242,121142,121241,'+
        '114212,124112,124211,411212,421112,421211,212141,214121,412121,111143,111341,131141,114113,114311,'+
        '411113,411311,113141,114131,311141,411131,211412,211214,211232,2331112').split(',');

  var QL13=11, QR=7, QL8=7, ITFQ=10, C128Q=10, WIDE=2.5;

  function gtinOK(c){
    if(!/^[0-9]+$/.test(c)) return false;
    var n=c.length; if(n!==8&&n!==12&&n!==13&&n!==14) return false;
    var s=0,m=3;
    for(var i=n-2;i>=0;i--){ s+=(+c.charAt(i))*m; m=(m===3)?1:3; }
    return ((10-(s%10))%10)===(+c.charAt(n-1));
  }
  function symbology(c){
    if(!gtinOK(c)) return 'C128';
    return c.length===13?'EAN13':c.length===14?'ITF14':c.length===12?'UPCA':'EAN8';
  }
  /* total width in narrow-module units, quiet zones included */
  function units(c,sym){
    if(sym==='EAN13'||sym==='UPCA') return QL13+95+QR;
    if(sym==='EAN8')  return QL8+67+QR;
    if(sym==='ITF14') return ITFQ*2 + 4 + (c.length/2)*(2*(2*WIDE+3)) + (WIDE+2);
    return C128Q*2 + (c.length+2)*11 + 13;
  }
  function runs(bits){
    var out=[],i=0,j;
    while(i<bits.length){
      if(bits.charAt(i)==='1'){ j=i; while(j<bits.length&&bits.charAt(j)==='1') j++; out.push([i,j-i]); i=j; }
      else i++;
    }
    return out;
  }
  function ean13bits(c){
    var p=PAR[+c.charAt(0)],s='101',i;
    for(i=1;i<=6;i++) s+=(p.charAt(i-1)==='L'?L:G)[+c.charAt(i)];
    s+='01010';
    for(i=7;i<=12;i++) s+=R[+c.charAt(i)];
    return s+'101';
  }
  function ean8bits(c){
    var s='101',i;
    for(i=0;i<4;i++) s+=L[+c.charAt(i)];
    s+='01010';
    for(i=4;i<8;i++) s+=R[+c.charAt(i)];
    return s+'101';
  }
  function esc(t){ return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  /* human-readable line, spread across the full symbol width */
  function label(text,W,fs){
    return '<text x="'+(W/2).toFixed(2)+'" y="'+(fs*0.92).toFixed(2)+'" text-anchor="middle" '+
      'textLength="'+(W*0.94).toFixed(2)+'" lengthAdjust="spacing" font-size="'+fs.toFixed(1)+
      '" font-family="\'Sarabun\',monospace" font-weight="600" fill="#000">'+esc(text)+'</text>';
  }
  function group(code,sym){
    if(sym==='EAN13') return code.charAt(0)+' '+code.slice(1,7)+' '+code.slice(7);
    if(sym==='UPCA')  return code.charAt(0)+' '+code.slice(1,6)+' '+code.slice(6,11)+' '+code.charAt(11);
    if(sym==='EAN8')  return code.slice(0,4)+' '+code.slice(4);
    return code;
  }

  /* returns {svg, width, height} — h = bar height in px */
  function build(code,mw,h){
    var sym=symbology(code), bars=[], W=units(code,sym)*mw, x, i, j, a, b, k, pat, p, w, isBar, bits, rs;

    if(sym==='EAN13'||sym==='UPCA'||sym==='EAN8'){
      var enc = (sym==='UPCA') ? '0'+code : code;
      bits = (sym==='EAN8') ? ean8bits(enc) : ean13bits(enc);
      var q = (sym==='EAN8') ? QL8 : QL13;
      rs = runs(bits);
      for(k=0;k<rs.length;k++) bars.push([(q+rs[k][0])*mw, rs[k][1]*mw]);
    } else if(sym==='ITF14'){
      x = ITFQ*mw;
      function push(wd,bar){ if(bar) bars.push([x,wd]); x+=wd; }
      push(mw,1); push(mw,0); push(mw,1); push(mw,0);
      for(i=0;i<code.length;i+=2){
        a=ITF[+code.charAt(i)]; b=ITF[+code.charAt(i+1)];
        for(j=0;j<5;j++){ push(a.charAt(j)==='1'?mw*WIDE:mw,1); push(b.charAt(j)==='1'?mw*WIDE:mw,0); }
      }
      push(mw*WIDE,1); push(mw,0); push(mw,1);
    } else {
      var vals=[104], sum=104, v;
      for(i=0;i<code.length;i++){
        v=code.charCodeAt(i)-32; if(v<0||v>94) v=0;
        vals.push(v); sum+=v*(i+1);
      }
      vals.push(sum%103); vals.push(106);
      x = C128Q*mw;
      for(k=0;k<vals.length;k++){
        pat=C128[vals[k]]; isBar=true;
        for(p=0;p<pat.length;p++){
          w=(+pat.charAt(p))*mw;
          if(isBar) bars.push([x,w]);
          x+=w; isBar=!isBar;
        }
      }
    }

    var fs=Math.max(9,Math.min(h*0.34,mw*7.2)), gap=Math.max(3,fs*0.28),
        H=h+gap+fs+2, body='';
    for(k=0;k<bars.length;k++)
      body+='<rect x="'+bars[k][0].toFixed(2)+'" y="0" width="'+bars[k][1].toFixed(2)+'" height="'+h.toFixed(2)+'"/>';

    var svg='<svg xmlns="http://www.w3.org/2000/svg" width="'+W.toFixed(1)+'" height="'+H.toFixed(1)+
      '" viewBox="0 0 '+W.toFixed(2)+' '+H.toFixed(2)+'" role="img" aria-label="บาร์โค้ด '+esc(code)+
      '"><rect width="'+W.toFixed(2)+'" height="'+H.toFixed(2)+'" fill="#fff"/>'+
      '<g fill="#000">'+body+'</g><g transform="translate(0,'+(h+gap).toFixed(2)+')">'+
      label(group(code,sym),W,fs)+'</g></svg>';
    return {svg:svg,width:W,height:H,sym:sym};
  }

  /* fit a code into a target pixel width */
  function toWidth(code,targetW,h){
    var mw = targetW/units(code,symbology(code));
    return build(code,mw,h);
  }
  return {build:build,toWidth:toWidth,symbology:symbology,gtinOK:gtinOK,units:units};
})();


/* ══════════════════════════════════════════════════════════
   2. DATA
   ══════════════════════════════════════════════════════════ */
var SHEET_ID = '16mYDqAqqJma-_0vCIAajy6bcjdOZ7F6VagxkdkqAB2I';
var GID = '635140262';
var COLS = 'A,B,D,F,H,J,K,L,M,N,O,P,Q,CV,BD,BB,BC'; /* + brand, category type, category group */
var CACHE_KEY = 'rattana_product_v2';
var USE_KEY = 'rattana_product_uses';
var TTL = 5*60*1000;
var PAGE = 24;
var FREQ_MIN = 2;    /* opened this many times before it counts as "ใช้บ่อย" */
var FREQ_MAX = 15;   /* at most this many float to the top */

var ALL = [], VIEW = [], shown = 0, io = null;
var USES = {}, usesDirty = false;

/* Snapshot of the sheet baked into this file. It is what makes the app work
   when opened directly from a phone or PC; online it is replaced by live data
   within a second or two. Regenerate it whenever the sheet changes a lot. */
var SEED_DATE = '19/08/2569';
var SEED = null;  /* เวอร์ชันเบา: ไม่ฝังข้อมูล ดึงสดจากชีตทุกครั้ง */

function sheetUrl(){
  return 'https://docs.google.com/spreadsheets/d/'+SHEET_ID+'/gviz/tq?tqx=out:csv&gid='+GID+
         '&tq='+encodeURIComponent('select '+COLS);
}

/* RFC-4180 CSV parser — quoted cells may contain commas and newlines */
function parseCsv(text){
  if(!text) return [];
  if(text.charCodeAt(0)===0xFEFF) text=text.slice(1);
  var rows=[], row=[], cell='', inQ=false, i, ch;
  for(i=0;i<text.length;i++){
    ch=text[i];
    if(inQ){
      if(ch==='"'){ if(text[i+1]==='"'){ cell+='"'; i++; } else inQ=false; }
      else cell+=ch;
    } else {
      if(ch==='"') inQ=true;
      else if(ch===','){ row.push(cell); cell=''; }
      else if(ch==='\r'){ /* skip */ }
      else if(ch==='\n'){ row.push(cell); rows.push(row); row=[]; cell=''; }
      else cell+=ch;
    }
  }
  if(cell.length||row.length){ row.push(cell); rows.push(row); }
  return rows;
}
function clean(s){
  return String(s==null?'':s).replace(/[​‌‍﻿]/g,'').replace(/ /g,' ').trim();
}
/* Barcodes get every space removed, not just the outer ones: 19 codes in the
   sheet are typed with their groups spaced out ("8 853820 002035"), and 10 of
   those are valid EAN-13/ITF-14 once the spaces are gone. Left in, they fall
   back to CODE 128 and scan back with the spaces still in the value. */
function cleanCode(s){
  return String(s==null?'':s).replace(/[\s​-‍]/g,'');
}
function driveId(raw){
  if(!raw) return '';
  var m = raw.match(/[?&]id=([-\w]{20,})/) || raw.match(/\/d\/([-\w]{20,})/) || raw.match(/([-\w]{25,})/);
  return m ? m[1] : '';
}
/* "ลังx72(CS)" → {name:'ลัง', qty:72} */
function parseUnit(u,qtyCol){
  u = clean(u);
  var m = u.match(/^(.+?)x(\d+)\(([A-Z]+)\)$/);
  if(m) return {name:m[1], qty:+m[2]};
  var q = parseInt(clean(qtyCol),10);
  return {name:u||'-', qty:isFinite(q)?q:0};
}

/* rows → compact product records */
function buildRecords(rows){
  var out=[], r, i, name, img, units, k;
  var CODE=[1,2,3,4], UNIT=[5,6,7,8], QTY=[9,10,11,12];
  for(i=1;i<rows.length;i++){
    r=rows[i]; if(!r) continue;
    name=clean(r[0]); if(!name) continue;
    img=driveId(clean(r[13]));
    units=[];
    for(k=0;k<4;k++){
      var code=cleanCode(r[CODE[k]]);
      if(!code || code==='0') continue;
      var u=parseUnit(r[UNIT[k]], r[QTY[k]]);
      units.push([code,u.name,u.qty]);
    }
    if(!units.length && !name) continue;
    /* brand + both category levels, searched but not displayed: people ask for
       "บะหมี่กึ่งสำเร็จรูป" or "ข้าวตราฉัตร", neither of which is in the name */
    out.push([name,img,units,(clean(r[14])+' '+clean(r[15])+' '+clean(r[16])).replace(/ +/g,' ').trim()]);
  }
  return out;
}

function getCache(){
  try{
    var raw=localStorage.getItem(CACHE_KEY); if(!raw) return null;
    var o=JSON.parse(raw);
    if(!o || !o.ts || !o.d) return null;
    return {fresh:(Date.now()-o.ts<TTL), ts:o.ts, d:o.d};
  }catch(e){ return null; }
}
function setCache(d){
  try{ localStorage.setItem(CACHE_KEY, JSON.stringify({ts:Date.now(),d:d})); }
  catch(e){ /* dataset can exceed the quota — running without cache is fine */ }
}

async function fetchSheet(){
  var res = await fetch(sheetUrl(), {cache:'no-store'});
  if(!res.ok) throw new Error('HTTP '+res.status);
  return buildRecords(parseCsv(await res.text()));
}

async function loadData(showSpin){
  var c=getCache(), haveSomething=false;

  /* 1. anything cached from a previous run */
  if(c){ ALL=c.d; indexAll(); applySearch(); stamp(c.ts); haveSomething=true; }
  /* 2. otherwise the snapshot built into this file, so the app is usable the
        instant it opens — including straight off the filesystem, where the
        browser refuses to call Google at all (file:// has no origin) */
  else if(window.SEED && SEED.length){
    ALL=SEED.slice(); indexAll(); applySearch();
    document.getElementById('stamp').textContent='ข้อมูล '+SEED_DATE;
    haveSomething=true;
  }
  if(c && c.fresh) return;

  /* 3. then quietly try for something newer */
  if(showSpin && !haveSomething) showSpinner('กำลังโหลดรายการสินค้า…');
  setLoading(true);
  try{
    var d=await fetchSheet();
    ALL=d; setCache(d); indexAll(); applySearch(); stamp(Date.now());
  }catch(e){
    if(!haveSomething){
      showEmpty('โหลดข้อมูลไม่สำเร็จ','ตรวจสอบอินเทอร์เน็ตแล้วกดปุ่ม ⟳ ที่มุมขวาบนอีกครั้ง');
      toast('โหลดข้อมูลไม่สำเร็จ','error');
    }
    /* with the snapshot in hand a failed refresh is not worth interrupting anyone over */
  }finally{ setLoading(false); hideSpinner(); }
}
function indexAll(){
  for(var i=0;i<ALL.length;i++){
    var p=ALL[i], s=p[0].toLowerCase();
    /* the brand is worth indexing on its own: "ข้าวตราฉัตร" never appears in
       the product name, which reads "ฉัตร ชากังราว เขียว 5กก." */
    if(p[3]) s+=' '+p[3].toLowerCase();
    for(var k=0;k<p[2].length;k++) s+=' '+p[2][k][0];
    p[4]=s;
    p[5]=i;            /* sheet order — the final tiebreak once uses reorder things */
  }
  resort();
}


/* ══════════════════════════════════════════════════════════
   2b. "ใช้บ่อย" — the app learns the order from real use.
   Opening a barcode is the one deliberate action in the flow,
   so that is what gets counted.
   ══════════════════════════════════════════════════════════ */
function useKey(p){ return (p[2].length ? p[2][0][0] : p[0]); }
function useCount(p){ return USES[useKey(p)] || 0; }

function loadUses(){
  try{ USES = JSON.parse(localStorage.getItem(USE_KEY)) || {}; }
  catch(e){ USES = {}; }
}
function bumpUse(p){
  var k=useKey(p);
  USES[k]=(USES[k]||0)+1;
  usesDirty=true;
  try{ localStorage.setItem(USE_KEY, JSON.stringify(USES)); }catch(e){}
}
function clearUses(){
  USES={}; usesDirty=true;
  try{ localStorage.removeItem(USE_KEY); }catch(e){}
  resort(); applySearch();
  toast('ล้างประวัติการใช้แล้ว','success');
}
/* most-used first, then sheet order. Array.sort is stable, so equal
   counts keep the order they already had. */
function resort(){
  var rank = {};
  var freq = ALL.filter(function(p){ return useCount(p)>=FREQ_MIN; })
                .sort(function(a,b){ return useCount(b)-useCount(a) || a[5]-b[5]; })
                .slice(0,FREQ_MAX);
  for(var i=0;i<freq.length;i++) rank[useKey(freq[i])]=i;
  ALL.sort(function(a,b){
    var ra=rank[useKey(a)], rb=rank[useKey(b)];
    if(ra===undefined) ra=9999;
    if(rb===undefined) rb=9999;
    if(ra!==rb) return ra-rb;
    return a[5]-b[5];
  });
  usesDirty=false;
}
function freqCount(){
  var n=0;
  for(var i=0;i<ALL.length && n<FREQ_MAX;i++) if(useCount(ALL[i])>=FREQ_MIN) n++;
  return n;
}
function stamp(ts){
  var d=new Date(ts);
  var hh=String(d.getHours()).padStart(2,'0'), mm=String(d.getMinutes()).padStart(2,'0');
  document.getElementById('stamp').textContent='ข้อมูล '+hh+'.'+mm+' น.';
}


/* ══════════════════════════════════════════════════════════
   3. SEARCH + RENDER
   ══════════════════════════════════════════════════════════ */
function applySearch(){
  var raw=document.getElementById('q').value.trim().toLowerCase();
  document.getElementById('clr').classList.toggle('show', !!raw);
  /* reorder only when a count actually changed, so typing stays cheap */
  if(usesDirty) resort();
  if(!raw){ VIEW=ALL; }
  else{
    var terms=raw.split(/\s+/).filter(Boolean);
    VIEW=ALL.filter(function(p){
      for(var t=0;t<terms.length;t++) if(p[4].indexOf(terms[t])<0) return false;
      return true;
    });
  }
  var nf=ALL.length?freqCount():0;
  document.getElementById('cnt').textContent = !ALL.length ? 'กำลังโหลด…'
    : raw ? 'พบ '+fmt(VIEW.length)+' รายการ'
    : 'ทั้งหมด '+fmt(ALL.length)+' รายการ'+(nf?' · ใช้บ่อย '+nf:'');
  var fc=document.getElementById('freqClr');
  fc.hidden = !!raw || !nf;
  resetList();
}
function fmt(n){ return n.toLocaleString('en-US'); }

function resetList(){
  var list=document.getElementById('list');
  list.innerHTML=''; shown=0;
  /* No data at all is a different problem from no match, and it must keep saying
     so. Previously typing anything wiped the load-failure notice and left a blank
     page, which reads exactly like "the product isn't in here". */
  if(!ALL.length){
    showEmpty('ยังไม่มีข้อมูลสินค้า','กดปุ่ม ⟳ มุมขวาบนเพื่อโหลดใหม่ ถ้ายังไม่ขึ้น แปลว่าเปิดไฟล์จากเครื่องโดยตรง ต้องเปิดผ่านลิงก์เว็บแทน');
    return;
  }
  if(!VIEW.length){
    showEmpty('ไม่พบสินค้าที่ค้นหา','ลองพิมพ์คำสั้นลง หรือพิมพ์เฉพาะชื่อยี่ห้อ เช่น "ตราฉัตร" หรือหมวดสินค้า เช่น "บะหมี่กึ่งสำเร็จรูป"');
    return;
  }
  renderMore();
}
function showEmpty(title,sub){
  document.getElementById('list').innerHTML =
    '<div class="empty"><div class="big">🔍</div><b>'+esc(title)+'</b>'+esc(sub)+'</div>';
  document.getElementById('loadmore').hidden=true;
}
function esc(t){
  return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* how wide a barcode may be inside a card, in CSS px */
function bcWidth(){
  var list=document.getElementById('list');
  var inner=Math.min(list.clientWidth||360, 640)-24;   /* minus list padding */
  return Math.max(150, inner-2-26-76-11-8);            /* border, card pad, unit col, gap, btn pad */
}

function renderMore(){
  var list=document.getElementById('list'), frag=document.createDocumentFragment();
  var end=Math.min(shown+PAGE, VIEW.length), W=bcWidth(), i, k;
  for(i=shown;i<end;i++){
    var p=VIEW[i], card=document.createElement('article'), isFreq=useCount(p)>=FREQ_MIN;
    card.className='rt-card pc'+(isFreq?' freq':'');
    var tag = isFreq ? '<span class="freqtag">ใช้บ่อย</span>' : '';
    var html='';
    /* onerror swaps only the <img>, so the "ใช้บ่อย" tag survives a broken image */
    if(p[1]) html+='<div class="pc-img">'+tag+'<img loading="lazy" decoding="async" alt="'+esc(p[0])+
      '" src="https://drive.google.com/thumbnail?id='+encodeURIComponent(p[1])+'&sz=w400"'+
      ' onerror="this.parentNode.className=\'pc-img none\';this.outerHTML='+
      '\'<span class=&quot;cam&quot;>📷</span><span>ยังไม่มีรูป</span>\'"></div>';
    else html+='<div class="pc-img none">'+tag+'<span class="cam">📷</span><span>ยังไม่มีรูป</span></div>';
    html+='<h2 class="pc-name">'+esc(p[0])+'</h2>';
    if(!p[2].length) html+='<div class="pc-unit"><span class="nobc">ไม่มีบาร์โค้ดในระบบ</span></div>';
    for(k=0;k<p[2].length;k++){
      var u=p[2][k], bar=BC.toWidth(u[0], W, 52);
      html+='<div class="pc-unit"><span class="uleft"><span class="uk">'+esc(u[1])+
        '</span><span class="un">'+(u[2]>0?fmt(u[2])+' ชิ้น':'&nbsp;')+'</span></span>'+
        '<span class="uright"><button class="bcbtn" data-i="'+i+'" data-u="'+k+'" '+
        'aria-label="ขยายบาร์โค้ด '+esc(u[0])+'">'+bar.svg+'</button></span></div>';
    }
    card.innerHTML=html;
    frag.appendChild(card);
  }
  list.appendChild(frag);
  shown=end;
  document.getElementById('loadmore').hidden = shown>=VIEW.length;
}

/* one delegated handler for every barcode button */
document.addEventListener('click',function(e){
  var b=e.target.closest && e.target.closest('.bcbtn');
  if(b) openFS(+b.dataset.i, +b.dataset.u);
});

function openFS(i,k){
  var p=VIEW[i]; if(!p) return;
  var u=p[2][k]; if(!u) return;
  /* this is the "I used this one" signal. The list is not reordered right now —
     that would yank the cards out from under the user — it happens on the next search. */
  bumpUse(p);
  var w=Math.min(window.innerWidth-40, 560);
  document.getElementById('fsName').textContent=p[0];
  document.getElementById('fsUnit').textContent=u[1]+(u[2]>0?' · '+fmt(u[2])+' ชิ้น':'');
  document.getElementById('fsWrap').innerHTML=BC.toWidth(u[0], w, 110).svg;
  document.getElementById('fsbc').classList.add('open');
  document.body.style.overflow='hidden';
}
function closeFS(){
  document.getElementById('fsbc').classList.remove('open');
  document.body.style.overflow='';
}
document.addEventListener('keydown',function(e){ if(e.key==='Escape') closeFS(); });

/* ธีมมาจากระบบกลาง Rattana CI — ตั้ง data-theme บน <html> ไม่ใช่ class บน body
   เผื่อไฟล์กลางโหลดไม่ทันหรือออฟไลน์ ก็ยังสลับเองได้ */
var THEME_KEY='rattana_theme';
function currentTheme(){
  return document.documentElement.getAttribute('data-theme')==='dark' ? 'dark' : 'light';
}
function paintThemeBtn(){
  var b=document.getElementById('themeBtn');
  if(b) b.textContent = currentTheme()==='dark' ? '☀️' : '🌙';
}
function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t==='dark'?'dark':'light');
  paintThemeBtn();
}
function toggleTheme(){
  if(window.RattanaUI && RattanaUI.toggleTheme){ RattanaUI.toggleTheme(); setTimeout(paintThemeBtn,0); return; }
  var next = currentTheme()==='dark' ? 'light' : 'dark';
  try{ localStorage.setItem(THEME_KEY,next); }catch(e){}
  applyTheme(next);
}
function showSpinner(m){ document.getElementById('spinnerMsg').textContent=m||'กำลังโหลด…';
  document.getElementById('spinner').classList.add('show'); }
function hideSpinner(){ document.getElementById('spinner').classList.remove('show'); }
function setLoading(on){ document.getElementById('loadingBar').style.width = on?'85%':'0'; }
function toast(msg,type){
  /* ใช้ toast ของระบบกลางถ้ามี (ปัดทิ้งได้ รองรับปุ่มเลิกทำ) ไม่มีก็วาดเอง */
  if(window.RattanaUI && RattanaUI.toast){ RattanaUI.toast(msg,{type:type||'info'}); return; }
  var t=document.createElement('div'); t.textContent=msg;
  t.style.cssText='position:fixed;left:50%;transform:translateX(-50%);bottom:24px;z-index:9999;'+
    'padding:12px 20px;border-radius:12px;font-weight:600;font-size:13px;color:#fff;'+
    'background:'+(type==='error'?'#dc2626':type==='success'?'#15803d':'#011e3e');
  document.body.appendChild(t); setTimeout(function(){ t.remove(); },3200);
}
async function refreshData(){
  var b=document.getElementById('btnRefresh');
  b.disabled=true; b.style.transform='rotate(360deg)'; b.style.transition='transform .6s';
  try{ localStorage.removeItem(CACHE_KEY); }catch(e){}
  await loadData(true);
  b.disabled=false;
  setTimeout(function(){ b.style.transform=''; b.style.transition=''; },600);
  toast('อัพเดทเรียบร้อย ✓','success');
}
function clearSearch(){
  var q=document.getElementById('q');
  q.value=''; applySearch(); q.focus();
}

/* header height drives the sticky offset of the search bar */
window.addEventListener('scroll',function(){
  document.getElementById('backToTop').classList.toggle('show', window.scrollY>300);
});

/* debounce typing so 12k rows filter smoothly */
var tmr=null;
document.getElementById('q').addEventListener('input',function(){
  clearTimeout(tmr); tmr=setTimeout(applySearch,130);
});

/* Some Android in-app WebViews (LINE, Facebook, file managers) do not give an
   input focus from the implicit tap, so the keyboard never opens. Asking for
   focus explicitly costs nothing and fixes those cases. */
document.querySelector('.sfield').addEventListener('pointerup',function(e){
  if(e.target && e.target.closest && e.target.closest('.clr')) return;
  var el=document.getElementById('q');
  if(document.activeElement!==el) el.focus();
});

/* infinite scroll */
io = new IntersectionObserver(function(en){
  if(en[0].isIntersecting && shown<VIEW.length) renderMore();
}, {rootMargin:'600px'});
io.observe(document.getElementById('sentinel'));

/* re-fit barcodes when the viewport width changes */
var rtmr=null, lastW=window.innerWidth;
window.addEventListener('resize',function(){
  if(Math.abs(window.innerWidth-lastW)<40) return;
  lastW=window.innerWidth;
  clearTimeout(rtmr); rtmr=setTimeout(function(){ resetList(); },200);
});
