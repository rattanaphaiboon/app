<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ประกาศ ปจ. 09/2569 การตรวจสภาพยานพาหนะและอุปกรณ์ก่อนการใช้งาน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
/* เอกสารวาดขนาด 4 เท่าแล้วย่อ .25 — กันเบราว์เซอร์ดันฟอนต์ขั้นต่ำจนล้นกระดาษตอนพิมพ์ */
:root{--ink:#111;--navy:#0d1b3e;--line:#1f2937;--muted:#4b5563}
*{box-sizing:border-box}
html,body{margin:0;background:#e5e7eb;font-family:'Sarabun',sans-serif;color:var(--ink)}
.bar{position:sticky;top:0;z-index:5;background:#0d1b3e;color:#fff;padding:10px 14px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;font-size:14px}
.bar b{font-size:15px}
.bar label{display:inline-flex;gap:5px;align-items:center;cursor:pointer}
.bar button{font:inherit;font-weight:700;border:0;border-radius:8px;padding:8px 16px;background:#c9a84c;color:#0d1b3e;cursor:pointer}
.wrap{padding:16px 0 30px}
.sheet{width:196mm;height:281mm;margin:0 auto 8mm;background:#fff;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.p4{width:2964px;height:4248px;transform:scale(.25);transform-origin:top left;padding:150px 170px 110px;display:flex;flex-direction:column;
  font-size:52px;line-height:1.5;color:var(--ink)}
.p4 *{box-sizing:border-box}

/* หัวจดหมาย */
.lh{text-align:center;padding-bottom:26px;border-bottom:7px double var(--line)}
.lh .th{font-size:80px;font-weight:700;letter-spacing:1px;color:var(--navy);line-height:1.25}
.lh .en{font-size:46px;font-weight:600;letter-spacing:6px;color:var(--navy);margin-top:4px}
.lh .ad{font-size:40px;color:var(--muted);margin-top:10px;line-height:1.45}

/* หัวเรื่องประกาศ */
.hd{text-align:center;margin-top:60px}
.hd .t1{font-size:70px;font-weight:700;color:var(--navy)}
.hd .t2{font-size:56px;margin-top:6px}
.hd .t3{font-size:56px;margin-top:8px;line-height:1.45}
.hd .t3 b{font-weight:700}
.hd .rule{width:560px;height:5px;background:var(--line);margin:34px auto 0}

/* เนื้อความ */
.bd{margin-top:44px;text-align:justify;text-justify:inter-character}
.bd p{margin:0 0 20px}
.ind{text-indent:150px}
.cl{margin:0 0 20px}
.cl .h{font-weight:700;color:var(--navy)}
.cl .tx{text-indent:150px;margin:4px 0 0}
.cl .sub{display:grid;grid-template-columns:110px 1fr;margin:6px 0 0 150px}
.cl .sub span:first-child{font-weight:600}
.close{margin-top:28px;text-indent:150px}

/* ลงนาม */
.sg{margin-top:36px;display:flex;justify-content:flex-end}
.sg .box{width:1260px;text-align:center}
.sg .dt{margin-bottom:140px}
.sg .ln{border-top:4px dotted #6b7280;width:900px;margin:0 auto 14px}
.sg .nm{font-weight:600}

/* ท้ายกระดาษ */
.ft{margin-top:auto;padding-top:24px;border-top:4px solid #9ca3af;display:flex;justify-content:space-between;align-items:flex-end;gap:40px;font-size:38px;color:var(--muted);line-height:1.45}
.ft .qr{display:flex;gap:24px;align-items:center}
.ft .qr img{width:230px;height:230px;image-rendering:pixelated}
.ft .r{text-align:right}

/* แบบลงชื่อรับทราบ */
.fm .ttl{text-align:center;margin-top:50px}
.fm .ttl .a{font-size:68px;font-weight:700;color:var(--navy)}
.fm .ttl .b{font-size:48px;margin-top:6px;line-height:1.45}
.fm .unit{margin-top:26px;display:flex;justify-content:space-between;font-size:52px}
.fm .unit b{font-weight:700}
.fm .st{margin-top:22px;text-indent:150px;text-align:left;font-size:50px;line-height:1.5}
.fm table{width:100%;border-collapse:collapse;margin-top:28px;font-size:44px}
.fm th,.fm td{border:4px solid var(--line);padding:0 18px}
.fm th{background:#eef1f6;font-weight:700;height:108px;line-height:1.3}
.fm td{height:108px}
.fm td.n{text-align:center;width:150px}
.fm .cert{margin-top:40px;border:4px solid var(--line);padding:30px 44px;font-size:48px;line-height:1.5}
.fm .cert .h{font-weight:700;color:var(--navy)}
.fm .cert .tx{text-indent:150px;text-align:justify;margin-top:6px}
.fm .sgs{display:grid;grid-template-columns:1fr 1fr;gap:60px;margin-top:70px;text-align:center;font-size:46px}
.fm .sgs .ln{border-top:4px dotted #6b7280;width:820px;margin:0 auto 12px}

@media print{
  @page{size:A4 portrait;margin:6mm}
  html,body{background:#fff}
  .bar{display:none}
  .wrap{padding:0}
  .sheet{margin:0 auto;box-shadow:none;break-after:page}
  .sheet:last-child{break-after:auto}
  .sheet.off{display:none}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div class="bar">
  <b>ประกาศ ปจ. 09/2569</b>
  <span>พิมพ์แบบลงชื่อรับทราบของศูนย์:</span>
  <label><input type="checkbox" data-c="W1" checked> ศูนย์ 1</label>
  <label><input type="checkbox" data-c="W2" checked> ศูนย์ 2</label>
  <label><input type="checkbox" data-c="W3" checked> ศูนย์ 3</label>
  <label><input type="checkbox" data-c="W4" checked> ศูนย์ 4</label>
  <button onclick="window.print()">พิมพ์ / บันทึก PDF</button>
</div>
<div class="wrap" id="wrap"></div>

<script>
const CO = {
  th: 'บริษัท รัตนไพบูลย์ สมุทรสงคราม 2555 จำกัด',
  en: 'RATTANAPHAIBOON SAMUTSONGKHRAM 2555 CO., LTD.',
  addr: 'สำนักงานใหญ่ เลขที่ 9 หมู่ที่ 11 ตำบลลาดใหญ่ อำเภอเมืองสมุทรสงคราม จังหวัดสมุทรสงคราม 75000',
  tel: 'โทรศัพท์ 065-885-0724, 034-761-449',
  tax: 'เลขประจำตัวผู้เสียภาษีอากร 0755555000158'
};
const DOC = {
  no: 'ปจ. 09/2569',
  subject: 'การตรวจสภาพยานพาหนะและอุปกรณ์ก่อนการใช้งาน และความรับผิดชอบกรณีเกิดความเสียหาย',
  date: '27 ตุลาคม พ.ศ. 2569',
  trial: '28 ตุลาคม พ.ศ. 2569',
  effective: '1 พฤศจิกายน พ.ศ. 2569',
  signer: 'สุรัตน์ รัตนไพบูลย์',
  signerTitle: 'กรรมการผู้จัดการ',
  app: 'https://rattanaphaiboon.github.io/app/rattana-repair-doc.html'
};
const CENTERS = [
  { c: 'W1', name: 'ศูนย์ 1 สมุทรสงคราม', mgr: 'สุภาพร รอดสังวาลย์' },
  { c: 'W2', name: 'ศูนย์ 2 สุพรรณบุรี', mgr: 'วุฒินันท์ จันทร์สุขศรี' },
  { c: 'W3', name: 'ศูนย์ 3 ราชบุรี', mgr: 'ประยงค์ ทวีผล' },
  { c: 'W4', name: 'ศูนย์ 4 นครปฐม', mgr: 'วีรพล หอมวิเชียร' }
];
const ROWS = 18;

const lh = () => `<div class="lh"><div class="th">${CO.th}</div><div class="en">${CO.en}</div>
  <div class="ad">${CO.addr}<br>${CO.tel} · ${CO.tax}</div></div>`;
const qr = () => { try { const q = qrcode(0, 'M'); q.addData(DOC.app); q.make(); return q.createDataURL(8, 0); } catch (e) { return ''; } };

function noticePage(nPages) {
  return `<div class="sheet"><div class="p4">
  ${lh()}
  <div class="hd">
    <div class="t1">ประกาศ${CO.th}</div>
    <div class="t2">ที่ ${DOC.no}</div>
    <div class="t3"><b>เรื่อง</b>&nbsp; ${DOC.subject}</div>
    <div class="rule"></div>
  </div>
  <div class="bd">
    <p class="ind">เพื่อให้การปฏิบัติงานเป็นไปด้วยความปลอดภัย ป้องกันความเสียหายต่อทรัพย์สินของบริษัทฯ และสามารถตรวจสอบข้อเท็จจริงได้เมื่อเกิดเหตุ บริษัทฯ จึงออกประกาศกำหนดแนวปฏิบัติสำหรับพนักงานทุกคนที่ใช้ยานพาหนะหรืออุปกรณ์ในคลังสินค้าของบริษัทฯ ไว้ ดังต่อไปนี้</p>

    <div class="cl"><div class="tx"><span class="h">ข้อ 1 &nbsp;หน้าที่ในการตรวจสภาพ</span>&nbsp; พนักงานผู้ใช้ยานพาหนะหรืออุปกรณ์ในคลังสินค้า ต้องตรวจสภาพและบันทึกผลในระบบ “RATTANA คาร์เช็ค” ด้วยตนเองทุกครั้งก่อนการใช้งาน รวมถึงกรณียืมหรือสับเปลี่ยนชั่วคราว ทั้งนี้ ผู้ที่ระบุชื่อเป็นผู้ใช้งานในระบบ ถือเป็นผู้รับผิดชอบยานพาหนะหรืออุปกรณ์นั้นตลอดวัน</div></div>

    <div class="cl"><div class="tx"><span class="h">ข้อ 2 &nbsp;รายการที่ต้องตรวจสภาพ</span></div>
      <div class="sub"><span>2.1</span><span>ยานพาหนะ ได้แก่ รถบรรทุก 12 ล้อ 10 ล้อ 6 ล้อ 4 ล้อจัมโบ้ รถกระบะ และรถยนต์นั่ง ให้ตรวจน้ำมันเครื่อง ของเหลวในระบบ และไฟเตือนบนหน้าปัดทุกวัน และตรวจลมยางทุกล้อสัปดาห์ละ 1 ครั้ง</span></div>
      <div class="sub"><span>2.2</span><span>อุปกรณ์ในคลังสินค้า ได้แก่ รถโฟล์คลิฟท์ รถยกไฟฟ้า แฮนด์ลิฟท์ไฟฟ้า และรถลากพาเลท ให้ตรวจตามรายการของอุปกรณ์แต่ละประเภททุกครั้งก่อนการใช้งาน พร้อมถ่ายภาพให้เห็นหมายเลขเครื่อง</span></div>
    </div>

    <div class="cl"><div class="tx"><span class="h">ข้อ 3 &nbsp;หลักฐานการตรวจสภาพ</span>&nbsp; การบันทึกผลต้องถ่ายภาพจริง ณ เวลาที่ตรวจ ระบบจะจัดเก็บชื่อผู้ตรวจ วันและเวลา พิกัด และภาพถ่าย ไว้เป็นหลักฐานประกอบการพิจารณาความรับผิดชอบ</div></div>

    <div class="cl"><div class="tx"><span class="h">ข้อ 4 &nbsp;กรณีพบความผิดปกติ</span>&nbsp; ให้บันทึกในระบบ รายงานผู้บังคับบัญชา และแจ้งซ่อมทันที ห้ามนำออกใช้งานจนกว่าจะซ่อมแล้วเสร็จ หากไฟเตือนสีแดงปรากฏค้างบนหน้าปัด ให้ดับเครื่องยนต์และงดใช้งานทันที</div></div>

    <div class="cl"><div class="tx"><span class="h">ข้อ 5 &nbsp;ความรับผิดชอบกรณีเกิดความเสียหาย</span></div>
      <div class="sub"><span>5.1</span><span>กรณีเกิดความเสียหาย และไม่ปรากฏบันทึกการตรวจสภาพของวันนั้นในระบบ ผู้ใช้งานต้องรับผิดชอบชดใช้ค่าซ่อมแซมทั้งหมดด้วยตนเอง และอาจถูกพิจารณาโทษทางวินัย</span></div>
      <div class="sub"><span>5.2</span><span>กรณีมีบันทึกการตรวจสภาพครบถ้วน บริษัทฯ จะรับผิดชอบค่าซ่อมแซมตามระเบียบของบริษัทฯ และหากได้บันทึกความผิดปกติไว้ก่อนการใช้งาน ผู้ใช้งานไม่ต้องรับผิดชอบความเสียหายอันเกิดจากข้อบกพร่องนั้น</span></div>
      <div class="sub"><span>5.3</span><span>การบันทึกข้อมูลอันเป็นเท็จ ให้ถือว่าไม่ได้ตรวจสภาพ ผู้บันทึกต้องรับผิดชอบตามข้อ 5.1 และถือเป็นความผิดทางวินัย</span></div>
    </div>

    <div class="cl"><div class="tx"><span class="h">ข้อ 6 &nbsp;หน้าที่ของผู้จัดการฝ่ายขายประจำศูนย์</span>&nbsp; ชี้แจงประกาศฉบับนี้และให้พนักงานลงชื่อรับทราบครบทุกคน กำกับดูแลการตรวจสภาพทุกเช้า รายงานสรุปผลทางอีเมลทุกวันภายในเวลา 09.15 น. และสั่งงดใช้งานเมื่อพบความผิดปกติ ทั้งนี้ ผลการปฏิบัติตามประกาศนี้จะนำไปประกอบการประเมินผลการปฏิบัติงานประจำปี</div></div>

    <div class="cl"><div class="tx"><span class="h">ข้อ 7 &nbsp;การบังคับใช้</span>&nbsp; ให้พนักงานเริ่มทดลองใช้งานระบบ “RATTANA คาร์เช็ค” ตั้งแต่วันที่ ${DOC.trial} และให้ประกาศนี้มีผลบังคับใช้จริงตั้งแต่วันที่ ${DOC.effective} เป็นต้นไป กรณีที่มิได้กำหนดไว้ในประกาศนี้ ให้เป็นไปตามข้อบังคับเกี่ยวกับการทำงานของบริษัทฯ และกฎหมายที่เกี่ยวข้อง</div></div>

    <p class="close">จึงประกาศมาให้ทราบโดยทั่วกัน และถือปฏิบัติโดยเคร่งครัด</p>
  </div>
  <div class="sg"><div class="box">
    <div class="dt">ประกาศ ณ วันที่ ${DOC.date}</div>
    <div class="ln"></div>
    <div class="nm">( ${DOC.signer} )</div>
    <div>${DOC.signerTitle}</div>
  </div></div>
  <div class="ft">
    <div class="qr">${qr() ? `<img src="${qr()}" alt="">` : ''}<div>สแกนเพื่อเข้าสู่ระบบ<br>RATTANA คาร์เช็ค</div></div>
    <div class="r">สำเนาแจ้ง: ผู้จัดการฝ่ายขายทุกศูนย์ · ฝ่ายทรัพยากรบุคคล<br>ปิดประกาศ ณ ทุกศูนย์ · ประกาศที่ ${DOC.no} หน้า 1/${nPages}</div>
  </div>
  </div></div>`;
}

function formPage(ct, k, nPages) {
  const rows = Array.from({ length: ROWS }, (_, i) => `<tr><td class="n">${i + 1}</td><td></td><td></td><td></td><td></td><td></td></tr>`).join('');
  return `<div class="sheet" data-c="${ct.c}"><div class="p4 fm">
  ${lh()}
  <div class="ttl"><div class="a">แบบลงชื่อรับทราบประกาศ</div>
    <div class="b">แนบท้ายประกาศบริษัทฯ ที่ ${DOC.no} เรื่อง ${DOC.subject}</div></div>
  <div class="unit"><span>หน่วยงาน: <b>${ct.name}</b></span><span>ผู้จัดการฝ่ายขาย: <b>${ct.mgr}</b></span></div>
  <div class="st">ข้าพเจ้าผู้มีรายชื่อด้านล่างนี้ ได้รับทราบและเข้าใจเนื้อหาของประกาศฉบับดังกล่าวโดยตลอดแล้ว และตกลงจะตรวจสภาพผ่านระบบ “RATTANA คาร์เช็ค” ทุกครั้งก่อนการใช้งาน หากมิได้ตรวจสภาพแล้วเกิดความเสียหาย ข้าพเจ้ายินยอมรับผิดชอบชดใช้ค่าซ่อมแซมทั้งหมดด้วยตนเอง ตามข้อ 5.1 ของประกาศ</div>
  <table>
    <thead><tr><th style="width:150px">ลำดับ</th><th>ชื่อ - สกุล</th><th style="width:330px">รหัสพนักงาน</th><th style="width:440px">ทะเบียนรถ /<br>รหัสเครื่อง</th><th style="width:500px">ลายมือชื่อ</th><th style="width:330px">วันที่</th></tr></thead>
    <tbody>${rows}</tbody>
  </table>
  <div class="cert"><div class="h">คำรับรองของผู้จัดการฝ่ายขายประจำศูนย์</div>
    <div class="tx">ข้าพเจ้าขอรับรองว่าได้ชี้แจงประกาศฉบับนี้ และพนักงานในหน่วยงานได้ลงชื่อรับทราบครบทุกคนแล้ว ข้าพเจ้าจะกำกับดูแลให้มีการตรวจสภาพทุกเช้าก่อนการใช้งาน สั่งงดใช้งานและแจ้งซ่อมเมื่อพบความผิดปกติ และจะให้พนักงานใหม่หรือพนักงานที่ย้ายเข้าหน่วยงานลงชื่อรับทราบทุกครั้ง</div></div>
  <div class="sgs">
    <div><div style="height:120px"></div><div class="ln"></div>( ${ct.mgr} )<br>ผู้จัดการฝ่ายขายประจำ${ct.name}<br>วันที่ ........ / ........ / ............</div>
    <div><div style="height:120px"></div><div class="ln"></div>( ............................................ )<br>ฝ่ายทรัพยากรบุคคล ผู้รับเอกสาร<br>วันที่ ........ / ........ / ............</div>
  </div>
  <div class="ft"><div>แบบลงชื่อรับทราบ · ประกาศที่ ${DOC.no} · ${ct.name}</div><div class="r">หน้า ${k}/${nPages}</div></div>
  </div></div>`;
}

function render() {
  const on = [...document.querySelectorAll('.bar input')].filter(i => i.checked).map(i => i.dataset.c);
  const cs = CENTERS.filter(c => on.includes(c.c)), n = 1 + cs.length;
  document.getElementById('wrap').innerHTML = noticePage(n) + cs.map((c, i) => formPage(c, i + 2, n)).join('');
}
document.querySelectorAll('.bar input').forEach(i => i.addEventListener('change', render));
render();
</script>
</body>
