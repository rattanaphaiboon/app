/* ══ คุยกับหลังบ้าน ══ */
var SES = { token:'', uid:'' }, AUTH = null, LAST_FETCH = 0, refreshing = null;
function rawApi(action, p, ms){
  if (MODE === 'demo') return demoApi(action, p);
  var body = JSON.stringify(Object.assign({}, p || {}, { action:action }));
  var ctl = typeof AbortController !== 'undefined' ? new AbortController() : null;
  var t = setTimeout(function () { if (ctl) ctl.abort(); }, ms || 30000);
  /* text/plain = ไม่มี preflight (GAS ไม่รองรับ OPTIONS) */
  return fetch(CONFIG.GAS_URL, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body:body, signal:ctl ? ctl.signal : undefined })
    .then(function (r) { if (!r.ok) throw new Error('หลังบ้านตอบกลับผิดปกติ (' + r.status + ')'); return r.text(); })
    .then(function (txt) { try { return JSON.parse(txt); } catch (e) { throw new Error('หลังบ้านยังไม่พร้อมใช้งาน'); } })
    .catch(function (e) {
      if (e && e.name === 'AbortError') throw new Error('หลังบ้านตอบช้าเกินไป ลองอีกครั้ง');
      if (e instanceof TypeError) throw new Error('เชื่อมต่อหลังบ้านไม่ได้ — เช็คอินเทอร์เน็ต แล้วลองใหม่');
      throw e;
    })
    .then(function (j) { clearTimeout(t); return j; }, function (e) { clearTimeout(t); throw e; });
}
function api(action, p, retried){
  var body = Object.assign({ token:SES.token, vendor:VENDOR.code }, p || {});
  return rawApi(action, body, (action === 'bundle' || action === 'proposal') ? 60000 : 30000).then(function (res) {
    if (res && res.code === 'SESSION_EXPIRED' && !retried) return reauth().then(function () { return api(action, p, true); });
    if (res && res.code === 'PDPA_REQUIRED') {                   /* หลังบ้านไม่ให้ใช้ต่อจนกว่าจะรับทราบนโยบาย */
      AUTH = AUTH || {}; AUTH.pdpa = res.pdpa; AUTH.policy = res.pdpa; gate('pdpa', res.pdpa);
      throw new Error('ต้องรับทราบนโยบายความเป็นส่วนตัวก่อน');
    }
    if (!res || res.ok === false) throw new Error((res && res.error) || 'ทำรายการไม่สำเร็จ');
    return res;
  });
}
/* ทุกการบันทึกแนบเลขคำขอ (rid) — คำขอเดิมเป๊ะส่งซ้ำ (เน็ตช้าจนเลิกรอ แล้วกดใหม่) หลังบ้านตอบผลเดิม ไม่จอง/ไม่บันทึกซ้อน
   แก้อะไรในคำขอแล้วส่งใหม่ = เลขใหม่ · สำเร็จแล้วล้างเลข */
var RID = {};
function hashStr(s){ var h = 5381; for (var i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return (h >>> 0).toString(36); }
function ridFor(k){ return RID[k] || (RID[k] = Date.now().toString(36) + Math.random().toString(36).slice(2, 10)); }
/* WSEQ นับครั้งที่บันทึก — ข้อมูลที่เริ่มดึงก่อนการบันทึกล่าสุด = ของเก่า ห้ามเอามาทับ (คิวที่เพิ่งจองจะหาย)
   WANT = บริษัทที่ผู้ใช้เลือกล่าสุด — คำตอบของบริษัทเดิมที่มาช้าห้ามพลิกกลับ */
var WSEQ = 0, WANT = '', AUTH_W = 0;
function sendWith(action, payload){
  if (S.sending) return Promise.reject(new Error('busy'));
  S.sending = true; softRender();
  var rk = action + '|' + hashStr(JSON.stringify(payload));
  return api(action, Object.assign({ rid:ridFor(rk) }, payload)).then(function (res) { WSEQ++; delete RID[rk]; S.sending = false; return res; },
    function (e) { WSEQ++; S.sending = false; render(); toast(errText(e)); throw e; });
}
function clientInfo(extra){
  return Object.assign({ device:deviceLabel(), openedFrom:openedFromLabel(), appVersion:CONFIG.APP_VERSION }, extra || {});
}
function reauth(){
  if (MODE === 'demo') return Promise.resolve();
  var tok = safe(function () { return liff.getIDToken(); }, '');
  return rawApi('auth', clientInfo({ idToken:tok })).then(function (res) {
    if (!res || res.ok === false) throw new Error((res && res.error) || 'เข้าใช้งานใหม่ไม่สำเร็จ');
    if (res.status !== 'ok') { gate(res.status, res); throw new Error('บัญชียังไม่ได้ผูกกับบริษัท'); }
    SES.token = res.token;
  }).catch(function (e) {
    if (/ยืนยันตัวตนกับ LINE ไม่ผ่าน/.test(errText(e)) && canRelogin()) relogin();
    throw e;
  });
}
function hmNow(){ var d = new Date(); return pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ' น.'; }
function setBundle(b){
  applyBundle(b); S.syncedAt = hmNow(); S.stale = false; LAST_FETCH = Date.now();
  cacheWrite();
  if (!APP_ON) return startApp();
  if ($('gate').getAttribute('data-kind') === 'loading') hideGate();
  softRender();
}
var refreshW = -1, refreshAgain = false;
function refresh(silent, announce){
  if (refreshing) { if (refreshW !== WSEQ) refreshAgain = true; return refreshing; }   /* ตัวที่วิ่งอยู่เริ่มก่อนการบันทึก = ดึงใหม่อีกรอบหลังจบ */
  if (!SES.token || !VENDOR.code || (WANT && WANT !== VENDOR.code)) return Promise.resolve();   /* กำลังเปลี่ยนบริษัท = loadVendor ดึงให้อยู่แล้ว */
  var w = refreshW = WSEQ, code = VENDOR.code;
  refreshing = api('bundle', { fresh:true, vendor:code }).then(function (res) {
    if (w !== WSEQ || code !== VENDOR.code || (WANT && WANT !== code)) { refreshAgain = refreshAgain || w !== WSEQ; return; }
    setBundle(res.data);
    if (announce) toast('อัปเดตแล้ว ' + S.syncedAt);
  }).catch(function (e) {
    if (S.stale) { S.stale = false; softRender(); toast('อัปเดตข้อมูลไม่ได้ — แสดงข้อมูลล่าสุดที่เก็บไว้'); return; }   /* ไม่ค้าง "กำลังอัปเดต…" */
    if (!silent) toast('ดึงข้อมูลใหม่ไม่ได้ — ' + errText(e));
  }).then(function () { refreshing = null; if (refreshAgain) { refreshAgain = false; refresh(true); } });
  return refreshing;
}

/* ── จำข้อมูลล่าสุดไว้ในเครื่อง (ของ LINE คนนี้) → เปิดแอปครั้งถัดไปเห็นทันที แล้วค่อยอัปเดตเบื้องหลัง ── */
function cacheKey(){ return 'sl_cache_' + (SES.uid || 'x'); }
function cacheRead(){
  var c = null; try { c = JSON.parse(lsGet(cacheKey()) || 'null'); } catch (e) {}
  if (!c || !c.bundle || !c.at || Date.now() - c.at > CONFIG.CACHE_HOURS * 3600e3) return null;
  return c;
}
function cacheWrite(){
  if (MODE !== 'live' || !BUNDLE || !SES.uid) return;
  lsSet(cacheKey(), JSON.stringify({ at:Date.now(), vendor:VENDOR.code, vendors:VENDORS, contact:CONTACT, profile:PROFILE, bundle:BUNDLE }));
}
function cacheClear(){ lsDel(cacheKey()); }

/* ══ LINE ══ */
function withTimeout(p, ms, msg){ return Promise.race([p, new Promise(function (_, rej) { setTimeout(function () { rej(new Error(msg)); }, ms); })]); }
function inClient(){ return MODE === 'live' && safe(function () { return liff.isInClient(); }, false); }
function deviceLabel(){
  var ua = navigator.userAgent || '', m;
  if (/iPad/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1)) { m = ua.match(/OS (\d+)[_.](\d+)/); return 'iPad' + (m ? ' · iPadOS ' + m[1] + '.' + m[2] : ''); }
  if (/iPhone/.test(ua)) { m = ua.match(/OS (\d+)[_.](\d+)/); return 'iPhone' + (m ? ' · iOS ' + m[1] + '.' + m[2] : ''); }
  if (/Android/.test(ua)) { m = ua.match(/Android (\d+(?:\.\d+)?)/); return 'Android' + (m ? ' ' + m[1] : ''); }
  if (/Windows/.test(ua)) return 'Windows';
  if (/Mac OS X/.test(ua)) return 'Mac';
  return 'อื่นๆ';
}
function openedFromLabel(){
  if (MODE === 'demo') return 'ตัวอย่าง';

function routeFromUrl(){                               /* อ่าน URL ตอนนี้ (หลัง liff.init อาจพา ?r= กลับมาจาก liff.state) */

  var r = (sp && sp.get('r')) || QS.r || '';
  if (!r && sp && sp.get('liff.state')) { var m = /[?&]r=([^&#]+)/.exec(sp.get('liff.state')); if (m) { try { r = decodeURIComponent(m[1]); } catch (e) { r = ''; } } }
  var h = (location.hash || '').replace(/^#\/?/, '');
  r = String(r || h);
  if (r === 'line' && MODE !== 'demo') r = '';
  /* เฉพาะชื่อหน้าจริงของแอป — ?r=constructor / #/__proto__ ต้องไม่หลุดเป็นหน้าเปล่าหรือ [object Object] */

    if (lsGet('sl_demo_pdpa') !== PDPA_DEFAULT.version) { AUTH.pdpa = PDPA_DEFAULT; gate('pdpa', PDPA_DEFAULT); }   /* ใช้งานครั้งแรก = ต้องรับทราบก่อน */
    return;
  }
  if (MODE === 'setup') return gate('setup');
  gate('loading', 'กำลังเชื่อมต่อ LINE…');
  if (typeof liff === 'undefined') return gate('error', { t:'โหลด LINE ไม่สำเร็จ', d:'เช็คอินเทอร์เน็ต แล้วเปิดแอปใหม่อีกครั้ง' });
  withTimeout(liff.init({ liffId:CONFIG.LIFF_ID }), 20000, 'เชื่อมต่อ LINE นานเกินไป').then(function () {
    if (!liff.isLoggedIn()) {                                /* เปิดจากเบราว์เซอร์นอก LINE → ล็อกอิน LINE ก่อน */
      gate('loading', 'กำลังไปหน้าเข้าสู่ระบบ LINE…');
      liff.login({ redirectUri:location.href.split('#')[0] });
      return;
    }
    var dec = safe(function () { return liff.getDecodedIDToken(); }, null) || {};
    SES.uid = dec.sub || '';
    if (!inClient() && dec.exp && dec.exp * 1000 < Date.now() + 120000 && canRelogin()) return relogin();   /* ID token อายุ 1 ชม. */
    var c = cacheRead();
    if (c) {                                                   /* เห็นข้อมูลล่าสุดทันที แล้วค่อยอัปเดตเบื้องหลัง */
      c.bundle.now = bkkNow();

}
function signIn(vendorHint){

  return friendFlag().then(function (friend) {
    return rawApi('auth', clientInfo({ idToken:safe(function () { return liff.getIDToken(); }, ''), friend:friend, withBundle:true, vendor:vendorHint }), 60000);
  }).then(function (res) {
    if (!res || res.ok === false) throw new Error((res && res.error) || 'เข้าใช้งานไม่สำเร็จ');
    SES.token = res.token; AUTH = res; AUTH_W = w;
    PROFILE = res.profile || PROFILE; VENDORS = res.vendors || []; CONTACT = res.contact || CONTACT;

  }).catch(function (e) {

function afterAuth(){
  var res = AUTH || {}, b = res.bundle;

  if (b && b.vendor && AUTH_W === WSEQ && (!WANT || String(b.vendor.code) === WANT)) { WANT = String(b.vendor.code); return setBundle(b); }
  var codes = VENDORS.map(function (v) { return v.code; });

function readPhoto(file, i){
  var fr = new FileReader();
  fr.onload = function () {
    var img = new Image();
    img.onload = function () {
      var max = 1400, r = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      var c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * r); c.height = Math.round(img.naturalHeight * r);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      var url = c.toDataURL('image/jpeg', 0.82);
      S.files.photo[i] = { name:String(file.name || 'photo').replace(/\.[^.]+$/, '') + '.jpg', mime:'image/jpeg', b64:url.split(',')[1], url:url, size:Math.round(url.length * 0.75) };
      softRender();                                          /* รูปโหลดเสร็จระหว่างพิมพ์ช่องอื่น = ไม่ดึงโฟกัสหลุด */
    };
    img.onerror = function () { toast('เปิดรูปนี้ไม่ได้ ลองรูปอื่น'); };
    img.src = fr.result;
  };
  fr.readAsDataURL(file);
}
function readDoc(file, i){
  if (file.size > 8 * 1024 * 1024) return toast('ไฟล์ใหญ่เกิน 8 MB');

    softRender();
  };
  fr.readAsDataURL(file);
}

    try {
      myFs = getComputedStyle(selEl).fontSize;
      [].slice.call(selEl.querySelectorAll('*')).forEach(function (k) {
        var hasText = [].slice.call(k.childNodes).some(function (x) { return x.nodeType === 3 && x.textContent.trim(); });
        if (hasText && getComputedStyle(k).fontSize !== myFs) fixedKids++;
      });
    } catch (e) {}

    var deepOn = !!deepSel[picked];
    var dp = el('button', 'rkt-b' + (deepOn ? ' pri' : ''), (deepOn ? '✓ ' : '') + 'รวมตัวข้างในด้วย');
    dp.title = 'บังคับสี · ขนาด · ความหนาตัวอักษร ให้ของข้างในทุกชิ้นตามไปด้วย';
    dp.onclick = function () {
      if (deepSel[picked]) delete deepSel[picked]; else deepSel[picked] = 1;
      applyCards(); rebuild();
    };
    bd.appendChild(dp);
    if (fixedKids && !deepOn) {
      var wn = el('div', 'rkt-hint');
      wn.innerHTML = 'ข้างในมีตัวหนังสือที่ตั้งขนาดเองอยู่ <b>' + fixedKids + ' จุด</b> — ปรับตรงนี้มันจะไม่ขยับ ' +
        'กด <b>รวมตัวข้างในด้วย</b> ข้างบน หรือกด <b>↓ ตัวข้างใน</b> ลงไปปรับตัวจริง';
      bd.appendChild(wn);
    }

    bd.appendChild(el('div', 'rkt-gt', 'ปรับเฉพาะชนิดนี้'));
    bd.appendChild(cardRow('สีพื้นหลัง', 'background-color', 'color'));
    bd.appendChild(cardRow('สีตัวหนังสือ', 'color', 'color'));
    bd.appendChild(cardRow('ขนาดตัวอักษร', 'font-size', 'px'));
    bd.appendChild(cardRow('ความหนาตัวอักษร', 'font-weight', 'weight'));
    bd.appendChild(cardRow('สีขอบ', 'border-color', 'color'));
    bd.appendChild(cardRow('ความหนาขอบ', 'border-width', 'px'));
    bd.appendChild(cardRow('มุมโค้ง', 'border-radius', 'radius'));
    bd.appendChild(cardRow('ระยะขอบใน', 'padding', 'px'));

    var bt = el('div', 'rkt-btns');
    var sh = el('button', 'rkt-b', 'เงา เปิด/ปิด');
    sh.onclick = function () {
      var c = cards[picked] = cards[picked] || {};
      c['box-shadow'] = c['box-shadow'] === 'none' ? '0 2px 6px rgba(15,23,42,.14)' : 'none';
      applyCards();
    };
    var cl = el('button', 'rkt-b warn', 'ล้างตรงนี้');
    cl.onclick = function () { delete cards[picked]; applyCards(); rebuild(); };
    bt.appendChild(sh); bt.appendChild(cl);
    bd.appendChild(bt);

    /* โทเคนที่จุดนี้กินอยู่ — แก้ตรงนี้เปลี่ยนทั้งแอป ไม่ใช่แค่ตรงที่ชี้ */
    var toks = tokensOf(selEl);
    bd.appendChild(el('div', 'rkt-gt', 'โทเคนที่ตรงนี้ใช้อยู่ (' + toks.length + ')'));
    if (!toks.length) {
      bd.appendChild(el('div', 'rkt-hint', 'ตรงนี้ไม่ได้ใช้ค่าจาก :root ตรงๆ (อาจ hardcode ไว้) ปรับด้วยช่องข้างบนแทนได้'));
    } else {
      bd.appendChild(el('div', 'rkt-hint', 'แก้ตรงนี้ = เปลี่ยนทั้งแอปทุกที่ที่ใช้โทเคนตัวนั้น ไม่ใช่แค่จุดที่ชี้'));
      toks.forEach(function (t) {
        var r = tokenRow(t.name, orig[t.name]);
        var lbl = r.querySelector('.rkt-n');
        if (lbl) { lbl.textContent = t.name + '  (' + t.role + ')'; lbl.title = t.name + ' — ' + t.role; }
        bd.appendChild(r);
      });
    }
  }

  function buildPos(bd) {
    var sw = el('button', 'rkt-b pri', 'สลับที่ 2 ใบ (แตะทีละใบ)');
    sw.onclick = function () {
      stopMode(); mode = 'swap'; document.body.classList.add('rkt-swapmode');
      toast('แตะใบแรก แล้วแตะใบที่จะสลับด้วย');
    };
    bd.appendChild(sw);
    bd.appendChild(el('div', 'rkt-note', 'สลับได้เฉพาะของที่อยู่ในกล่องเดียวกัน · ใช้กับการ์ดในลิสต์เดียวกันได้เลย'));

    if (!blocks.length) blocks = scanBlocks();
    bd.appendChild(el('div', 'rkt-gt', 'บล็อกใหญ่ (' + blocks.length + ')'));
    if (!blocks.length) {
      bd.appendChild(el('div', 'rkt-note', 'หน้านี้ยังไม่มี element ที่ติด data-tweak="ชื่อบล็อก" บอก Claude ให้ติดให้ก่อน'));
      return;
    }
    blocks.forEach(function (b, i) {
      var d = el('div', 'rkt-sec');
      d.appendChild(el('span', 'nm', (i+1) + '. ' + b.name));
      var up = el('button', 'rkt-mini', '↑'), dn = el('button', 'rkt-mini', '↓');
      var ey = el('button', 'rkt-mini' + (b.hidden ? ' off' : ''), '👁');
      up.onclick = function () { if (i > 0) { blocks.splice(i-1, 0, blocks.splice(i,1)[0]); applyBlocks(); rebuild(); } };
      dn.onclick = function () { if (i < blocks.length-1) { blocks.splice(i+1, 0, blocks.splice(i,1)[0]); applyBlocks(); rebuild(); } };
      ey.onclick = function () { b.hidden = !b.hidden; applyBlocks(); rebuild(); };
      d.appendChild(up); d.appendChild(dn); d.appendChild(ey);
      bd.appendChild(d);
    });
  }

  /* ─────────── แผง ─────────── */
  function rebuild() {
    if (!panel) return;
    var bd = panel.querySelector('.rkt-bd');
    bd.innerHTML = '';
    panel.querySelectorAll('.rkt-tb').forEach(function (b) {
      b.className = 'rkt-tb' + (b.dataset.t === tab ? ' on' : '');
    });
    if (tab === 'pick') buildCard(bd);
    else if (tab === 'tone') buildTone(bd);
    else buildPos(bd);
  }

  function open() {
    if (panel) { panel.style.display = 'flex'; return; }
    orig = readTokens();
    if (!Object.keys(orig).length) { toast('แอปนี้ยังไม่ได้ใช้ CSS variable ปรับไม่ได้'); return; }
    if (!document.getElementById('rk-tweak-style')) {
      var st = el('style'); st.id = 'rk-tweak-style'; st.textContent = CSS; document.head.appendChild(st);
    }

    panel = el('div', 'rkt d-' + dock);
    var hd = el('div', 'rkt-hd'); hd.appendChild(el('b', null, 'ปรับหน้าตา'));

    /* ย้ายกล่องไปมุมที่ไม่บังของที่กำลังดู */
    var dk = el('div', 'rkt-dk');
    [['left','◧','ชิดซ้าย'], ['right','◨','ชิดขวา'], ['bottom','▤','ด้านล่าง'],
     ['float','❐','ลอย'], ['min','—','ย่อ']].forEach(function (d) {
      var b = el('button', dock === d[0] ? 'on' : '', d[1]); b.title = d[2];
      b.onclick = function () {
        dock = d[0];
        panel.className = 'rkt d-' + dock;
        try { localStorage.setItem(DOCKKEY, dock); } catch (e) {}
        dk.querySelectorAll('button').forEach(function (q, i) {
          q.className = (['left','right','bottom','float','min'][i] === dock) ? 'on' : '';
        });
      };
      dk.appendChild(b);
    });
    hd.appendChild(dk);
    var x = el('button', 'rkt-x', '✕'); x.onclick = close; hd.appendChild(x);
    panel.appendChild(hd);

    var tabs = el('div', 'rkt-tabs');
    [['pick','ชี้แล้วปรับ'], ['tone','โทนรวม'], ['pos','ตำแหน่ง']].forEach(function (t) {
      var b = el('button', 'rkt-tb', t[1]); b.dataset.t = t[0];
      b.onclick = function () { stopMode(); tab = t[0]; rebuild(); };
      tabs.appendChild(b);
    });
    panel.appendChild(tabs);
    panel.appendChild(el('div', 'rkt-bd'));

    var ft = el('div', 'rkt-ft');
    var out = el('textarea'); out.className = 'rkt-out'; out.readOnly = true;
    out.placeholder = 'ปรับเสร็จแล้วกดปุ่มเขียวข้างบน ข้อความจะมาอยู่ตรงนี้';

    /* ปุ่มเดียวจบ: เขียนข้อตกลงลงตัวไฟล์ mockup เอง ไม่สร้างไฟล์ชื่อใหม่ */
    var b1 = el('button', 'rkt-b go', 'เสร็จแล้ว · เซฟลง mockup');
    b1.title = 'เขียนหน้าตาที่ปรับไว้ลงในไฟล์ mockup ตัวนี้เลย';
    b1.onclick = function () { saveLocal(true); saveSelf(out); };

    var help = el('div', 'rkt-note');
    help.innerHTML = 'กดปุ่มเขียว → เลือกทับไฟล์เดิม <b>' + selfName() + '</b> → กด Save<br>' +
      'แล้ว<b>พิมพ์บอก Claude ว่า "ปรับไว้แล้ว"</b> พอเลย ไม่ต้องก๊อปอะไร';
    var b2 = el('button', 'rkt-b', 'ดู CSS');
    b2.onclick = function () { out.value = cssText(); out.focus(); out.select(); };
    var b3 = el('button', 'rkt-b', 'คัดลอกแทน');
    b3.onclick = function () { copy(agreedBlockText(), out, 'คัดลอกแล้ว วางในแชท กด Ctrl+V'); };
    var b4 = el('button', 'rkt-b warn', 'ล้างทั้งหมด'); b4.onclick = resetAll;
    var bs = el('div', 'rkt-btns');
    [b2, b3, b4].forEach(function (b) { bs.appendChild(b); });
    ft.appendChild(b1); ft.appendChild(help); ft.appendChild(out); ft.appendChild(bs);
    panel.appendChild(ft);

    document.body.appendChild(panel);
    document.addEventListener('click', onPageClick, true);
    document.addEventListener('mouseover', onPageOver, true);
    rebuild();
  }
  function close() {
    stopMode();
    document.removeEventListener('click', onPageClick, true);
    document.removeEventListener('mouseover', onPageOver, true);
    if (panel) { panel.remove(); panel = null; }
  }

  W.RK.tweak = { open: open, close: close, css: cssText, agreed: agreedBlockText,
                 html: buildSelfHtml, save: function () { saveSelf(null); }, reset: resetAll };

  document.addEventListener('keydown', function (e) {
    if (e.ctrlKey && e.shiftKey && (e.key === 'T' || e.key === 't')) { e.preventDefault(); panel ? close() : open(); }
    if (e.key === 'Escape' && mode) { stopMode(); rebuild(); }
  });

  function boot() {
    orig = readTokens();
    blocks = scanBlocks();
    /* 1) ข้อตกลงที่ฝังไว้ในไฟล์ (ของจริงต้องสร้างตามนี้) */
    var tag = document.getElementById('rk-tweak-agreed');
    if (tag) { try { applyAgreement(JSON.parse(tag.textContent)); } catch (e) {} }
    /* 2) ของที่ยังลองอยู่ในเครื่องนี้ ทับข้อตกลงได้ */
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) applyAgreement(JSON.parse(raw));
    } catch (e) {}
    if (/[?&]tweak=1/.test(location.search)) open();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>

</body>
</html>
