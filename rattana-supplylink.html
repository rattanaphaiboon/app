<!-- ══════════════════════════════════════════════════════════════════════════
     RK-BASE · Rattana UI Kit
     วางไว้ใน <head> "ก่อน" CSS อื่นของแอป (ให้ CSS แอปทับได้ถ้าต้องการ)
     ให้: บันได z-index กลาง · helper "บรรทัดเดียว" · sticky พื้นทึบ · RK.audit()
     กฎอ้างอิง: CLAUDE.md § UI Build Standards ข้อ 1️⃣ + 6️⃣
     ══════════════════════════════════════════════════════════════════════════ -->
<style id="rk-base">
:root{
  /* ── บันได z-index กลาง — ใช้ตัวแปรเท่านั้น ห้ามใส่เลขมั่วรายจุด ── */
  --rk-z-sticky-sub: 90;    /* แถบ tab / ฟิลเตอร์รอง (ชั้นที่ 2 ลงมา) */
  --rk-z-sticky:     100;   /* header หลัก */
  --rk-z-dropdown:   1000;  /* dropdown / popover / เมนู */
  --rk-z-modal:      2000;  /* modal / bottom sheet / scanner */
  --rk-z-toast:      3000;  /* toast / snackbar */

  --rk-navy:#0d1b3e; --rk-gold:#c9a84c;
  --rk-surface:   var(--card-bg, #ffffff);
  --rk-surface-2: var(--bg, #f1f5f9);
  --rk-text:      var(--text, #0f172a);
  --rk-muted:     var(--muted, #64748b);
  --rk-line:      var(--border, #e2e8f0);
  --rk-radius: 12px;

  --rk-hdr-h: 56px;   /* ⚠️ ตั้งให้ตรงความสูง header จริงของแอป — sticky ชั้น 2 ใช้ค่านี้เป็น top */
}

/* ── ข้อ 1️⃣ บรรทัดเดียว (ใช้ได้ทุกที่: label · การ์ด · ตัวเลือก) ── */
.rk-1line{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rk-row{display:flex;align-items:center;gap:8px;min-width:0}
.rk-row>*{min-width:0}                    /* ❗ ขาดบรรทัดนี้ ellipsis ใน flex จะไม่ทำงาน */
.rk-grow{flex:1 1 auto;min-width:0}
.rk-nogrow{flex:0 0 auto}
.rk-scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:thin}

/* ── ข้อ 6️⃣ sticky ที่ "พื้นทึบ + ไม่ทับ dropdown" ── */
.rk-sticky{
  position:sticky; top:0; z-index:var(--rk-z-sticky);
  background:var(--rk-surface);                       /* ทึบ 100% ห้าม transparent/rgba */
  padding-top:env(safe-area-inset-top);
  box-shadow:0 1px 0 var(--rk-line);
}
.rk-sticky-sub{
  position:sticky; top:var(--rk-hdr-h); z-index:var(--rk-z-sticky-sub);
  background:var(--rk-surface-2);
  box-shadow:0 1px 0 var(--rk-line);
}
.rk-sticky-bottom{
  position:sticky; bottom:0; z-index:var(--rk-z-sticky-sub);
  background:var(--rk-surface);
  padding-bottom:env(safe-area-inset-bottom);
  box-shadow:0 -1px 0 var(--rk-line);
}
/* ❗ ห้าม overflow:hidden / auto บน parent ของ sticky หรือของ dropdown — จะตัด popup ขาด */
</style>

<script id="rk-base-js">
window.RK = window.RK || {};

/* ── helper ── */
RK.esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
RK.num = v => { const n = parseFloat(String(v==null?'':v).replace(/,/g,'')); return isFinite(n) ? n : 0; };
RK.debounce = (fn, ms=120) => { let t; return function(){ clearTimeout(t); const a=arguments, s=this; t=setTimeout(()=>fn.apply(s,a), ms); }; };

/* ── ย่อตัวเลขให้อยู่ในบรรทัดเดียว (ข้อ 1️⃣) ── */
RK.shortNum = n => {
  n = RK.num(n); const a = Math.abs(n);
  if (a >= 1e9) return (n/1e9).toFixed(a>=1e10?0:1).replace(/\.0$/,'') + 'B';
  if (a >= 1e6) return (n/1e6).toFixed(a>=1e7?0:1).replace(/\.0$/,'') + 'M';
  if (a >= 1e4) return (n/1e3).toFixed(0) + 'K';
  return n.toLocaleString('th-TH', {maximumFractionDigits:0});
};

/* ══════════════════════════════════════════════════════════════════════════
   RK.audit() — เรียกใน console ก่อน push (ผูกกับ Pre-Deploy Bug Check ข้อ 5-7)
   ตรวจ 3 อย่างบนหน้าที่เปิดอยู่จริง:
     1. sticky/fixed ที่พื้นหลังใส  → เนื้อหาวิ่งทะลุ
     2. parent ที่ overflow ตัด dropdown / z-index ต่ำกว่า sticky ตัวอื่น
     3. ข้อความที่ตกมากกว่า 1 บรรทัดที่ความกว้างจอปัจจุบัน (ย่อจอเป็น 375px ก่อนเรียก)
   ══════════════════════════════════════════════════════════════════════════ */
RK.audit = function(opts){
  opts = opts || {};
  const oneLineSel = opts.oneLineSel || 'button,label,option,.chip,.tab,.badge,.pill,th,.rk-1line,[data-1line]';
  const out = {transparentSticky:[], clipRisk:[], wrapped:[], zTop:[]};
  const own = el => el.closest('#rkScan,.rk-dd,.rk-dd-backdrop');     /* ตัว kit เอง — ไม่ต้องเตือน */
  const alpha0 = c => {
    if (!c || c === 'transparent') return true;
    const m = /rgba?\(([^)]+)\)/.exec(c); if (!m) return false;
    const p = m[1].split(','); return p.length > 3 && parseFloat(p[3]) < 0.9;
  };
  /* นับบรรทัดจริงของ "ข้อความในตัวมันเอง" (ไม่นับลูกที่เป็น element) — padding ไม่หลอก */
  const lineCount = el => {
    const rng = document.createRange(); let n = 0;
    el.childNodes.forEach(nd => {
      if (nd.nodeType === 3 && nd.textContent.trim()){
        rng.selectNodeContents(nd);
        n = Math.max(n, rng.getClientRects().length);
      }
    });
    return n;
  };

  document.querySelectorAll('*').forEach(el=>{
    if (own(el)) return;
    const cs = getComputedStyle(el);
    if (cs.position==='sticky' || cs.position==='fixed'){
      if (alpha0(cs.backgroundColor) && !(cs.backdropFilter||'').includes('blur'))
        out.transparentSticky.push({el, bg:cs.backgroundColor, z:cs.zIndex});
      if (cs.position==='sticky' && cs.zIndex!=='auto' && +cs.zIndex >= 1000)
        out.zTop.push({el, z:cs.zIndex});   /* sticky ที่สูงถึงชั้น dropdown → จะไปทับเมนู */
    }
  });

  document.querySelectorAll('[data-rk-menu-anchor],.rk-dd-btn,select').forEach(el=>{
    if (own(el)) return;
    let p = el.parentElement;
    while (p && p!==document.body){
      const cs = getComputedStyle(p);
      if (/hidden|auto|scroll/.test(cs.overflow + cs.overflowX + cs.overflowY) && cs.position!=='static')
        { out.clipRisk.push({trigger:el, clippedBy:p}); break; }
      p = p.parentElement;
    }
  });

  document.querySelectorAll(oneLineSel).forEach(el=>{
    if (own(el) || !el.offsetParent || !el.textContent.trim()) return;
    const n = lineCount(el);
    if (n > 1) out.wrapped.push({el, lines:n, text:el.textContent.trim().slice(0,40)});
  });

  console.group('%cRK.audit @ ' + window.innerWidth + 'px', 'font-weight:700');
  console.log('❌ sticky พื้นใส:', out.transparentSticky.length, out.transparentSticky);
  console.log('⚠️ dropdown เสี่ยงโดนตัด/ทับ:', out.clipRisk.length, out.clipRisk);
  console.log('⚠️ sticky z-index ≥1000 (ทับ dropdown):', out.zTop.length, out.zTop);
  console.log('❌ ตกบรรทัด (>1 บรรทัด):', out.wrapped.length, out.wrapped);
  console.groupEnd();
  return out;
};
</script>
<style>
:root{
  --navy:#0A1F47; --navy-2:#122E63; --navy-3:#16357A; --navy-4:#1F4489;
  --gold:#E8BC42; --gold-ink:#8A6410; --gold-deep:#6B4E07; --gold-soft:#FAEBC4; --gold-tint:#FDF3D8;
  --paper:#FFFFFF; --card:#FFFFFF; --card-2:#FAFBFD;
  --line:#DDE3ED; --line-2:#E8EDF4; --line-3:#C8D0DE;
  --ink:#0A1F47; --ink-2:#33415B; --ink-3:#55617A; --ink-4:#6F7C93;
  --on-navy:#FFFFFF; --on-navy-2:#9BAFD2; --on-navy-3:#C0CEE8; --on-navy-fill:rgba(255,255,255,.12);
  --teal:#17635E; --teal-soft:#DBEBE8;
  --clay:#B03A22; --clay-soft:#F8E0D9; --clay-line:#EBC9BE; --clay-deep:#8A3620;
  --fill:#F3F5F9; --fill-2:#EDF0F6; --chat:#C3D2E8; --alert:#FF6B4A;
  --w1:#FBBF24; --w2:#0EA5E9; --w3:#EF4444; --w4:#15803D; --c4:#4ADE80; --hq:#C9A84C;

  --fs-xs:11px; --fs-sm:12.5px; --fs-md:14px; --fs-lg:16px; --fs-xl:19px; --fs-num:27px; --fs-hero:40px;
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px; --sp-6:26px;
  --gap-card:9px; --pad-card:13px; --pad-screen:16px;
  --r-sm:10px; --r-md:14px; --r-lg:18px; --r-xl:22px; --r-pill:999px;
  --tap:44px; --nav-h:62px;
  --shadow-1:0 1px 3px rgba(10,31,71,.07), 0 6px 18px rgba(10,31,71,.10);
  --shadow-2:0 2px 6px rgba(10,31,71,.08), 0 16px 34px rgba(10,31,71,.14);
  --shadow-nav:0 6px 22px rgba(10,31,71,.28);
  --z-sticky-sub:90; --z-sticky:100; --z-dropdown:1000; --z-modal:2000; --z-toast:3000;
}
:root[data-theme="dark"]{
  --paper:#0A1220; --card:#131E33; --card-2:#0F1829;
  --navy:#0A1F47; --navy-2:#16294F; --navy-3:#1E3564; --navy-4:#27407A;
  --fill:#1B2840; --fill-2:#16223A; --chat:#101A2B;
  --line:#25334F; --line-2:#1E2C46; --line-3:#2E3E5C;
  --ink:#E8EDF7; --ink-2:#C3CEE2; --ink-3:#9CAAC2; --ink-4:#8593AC;
  --gold-ink:#E8BC42; --gold-deep:#F0C95E; --gold-tint:#3A2E10; --gold-soft:#332809;
  --teal:#5FD0BE; --teal-soft:#123430;
  --clay:#F0907A; --clay-soft:#3C1B13; --clay-line:#5C2B1F; --clay-deep:#F4A793;
  --shadow-1:0 1px 3px rgba(0,0,0,.44); --shadow-2:0 8px 26px rgba(0,0,0,.52);
  --shadow-nav:0 6px 22px rgba(0,0,0,.6);
}
/* dark: เงาแทบไม่เห็นบนพื้นมืด เลยต้องมีเส้นขอบช่วยแยกชั้น */
:root[data-theme="dark"] .card,
:root[data-theme="dark"] .panel,
:root[data-theme="dark"] .sb{border:1px solid var(--line)}
:root[data-theme="dark"] .chip.gold{color:#2A1F04}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'Sarabun',sans-serif; background:var(--paper); color:var(--ink);
  -webkit-text-size-adjust:100%; overscroll-behavior-y:none;
}
button,input,select,textarea{font-family:inherit;color:inherit}
input,select,textarea{font-size:16px}           /* กัน iOS ซูมเองตอนแตะช่องกรอก */
a{color:var(--gold-ink);text-decoration:none}
button{cursor:pointer}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.one{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.grow{flex:1 1 auto;min-width:0}
.sp{flex:1 1 auto}
.muted{color:var(--ink-3)}
.dim{color:var(--ink-4)}
.b{font-weight:600}
.bb{font-weight:700}

#app{
  display:flex; flex-direction:column;
  height:100dvh; max-width:480px; margin:0 auto; background:var(--paper);
  position:relative; overflow:hidden;
}
.scr{display:none; flex-direction:column; height:100%; overflow:hidden}
.scr.on{display:flex}

/* ── header ───────────────────────────── */
.hdr{
  flex-shrink:0; background:var(--navy); color:var(--on-navy);
  padding:calc(env(safe-area-inset-top) + 14px) var(--pad-screen) 14px;
  display:flex; align-items:center; gap:var(--sp-3);
}
.hdr-t{font-size:var(--fs-lg);font-weight:700}
.iconbtn{
  width:38px;height:38px;flex-shrink:0;border:0;border-radius:var(--r-sm);
  background:rgba(255,255,255,.12);color:var(--on-navy);
  display:flex;align-items:center;justify-content:center;position:relative;
}
.iconbtn.gold{background:var(--gold);color:var(--navy)}
/* ปุ่มไอคอนเล็กกว่า 44px ตามสายตา แต่พื้นที่กดต้องครบ 44 เสมอ */
.sb button{position:relative}
.iconbtn::after,.sb button::after{content:'';position:absolute;left:50%;top:50%;
  width:var(--tap);height:var(--tap);transform:translate(-50%,-50%)}
.back{width:34px;height:34px;margin-left:-6px;background:none}
.dot-new{position:absolute;top:7px;right:8px;width:8px;height:8px;border-radius:var(--r-pill);background:var(--alert);border:2px solid var(--navy-2)}
.hero{
  flex-shrink:0;background:var(--navy);color:var(--on-navy);
  padding:calc(env(safe-area-inset-top) + 16px) var(--pad-screen) 58px;
}
.avatar{width:40px;height:40px;flex-shrink:0;border-radius:13px;background:var(--gold);color:var(--navy);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:var(--fs-lg)}

/* ── body ─────────────────────────────── */
.body{
  flex:1 1 auto; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch;
  padding:var(--sp-4) var(--pad-screen) var(--sp-5);
  display:flex; flex-direction:column; gap:var(--sp-5);
}
.body.pull{margin-top:-42px;padding-top:var(--sp-4);background:var(--paper);
  border-radius:22px 22px 0 0}     /* ต้องมีพื้น ไม่งั้นเนื้อหาที่เลื่อนผ่านทะลุไปเห็นบนหัวจอน้ำเงิน */
.body > *{flex-shrink:0}          /* กันลูกใน flex column โดนบีบจนเนื้อหาโดนตัด */
.sect{display:flex;flex-direction:column;gap:11px}
.sect-h{display:flex;align-items:baseline;gap:var(--sp-2);padding:0 2px}
.sect-h b{font-size:var(--fs-lg);font-weight:700}

/* ── cards ────────────────────────────── */
.panel{background:var(--card);border-radius:var(--r-lg);box-shadow:var(--shadow-1);padding:14px}
.card{background:var(--card);border-radius:var(--r-lg);box-shadow:var(--shadow-1);padding:var(--pad-card)}
.card.lift{border-radius:var(--r-xl);box-shadow:var(--shadow-2);padding:17px}
.card.flat{box-shadow:var(--shadow-1);border:0}
.card.acc-clay{border-left:4px solid var(--clay)}
.card.acc-gold{border-left:4px solid var(--gold)}
.card.acc-grey{border-left:4px solid var(--on-navy-3)}
.card.acc-teal{border-left:4px solid var(--teal)}
.card.acc-navy{border-left:4px solid var(--navy)}
.rowcard{display:flex;align-items:center;gap:var(--sp-3);text-align:left;width:100%;border:0;background:var(--card);min-height:74px}
.ic{width:40px;height:40px;flex-shrink:0;border-radius:13px;display:flex;align-items:center;justify-content:center}
.ic.clay{background:var(--clay-soft)} .ic.gold{background:var(--gold-tint)}
.ic.grey{background:var(--fill-2)} .ic.teal{background:var(--teal-soft)}
.thumb{width:56px;height:56px;flex-shrink:0;border-radius:15px;display:flex;align-items:center;justify-content:center}

/* ── bits ─────────────────────────────── */
.chip{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:var(--r-pill);
  font-size:var(--fs-xs);font-weight:700;white-space:nowrap;border:0}
.chip.teal{background:var(--teal-soft);color:var(--teal)}
.chip.clay{background:var(--clay);color:#fff}
.chip.gold{background:var(--gold);color:#3D2B04}
.chip.goldsoft{background:var(--gold-tint);color:var(--gold-deep)}
.chip.grey{background:var(--fill-2);color:var(--ink-2)}
.wh{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:var(--r-pill);
  background:var(--gold-tint);color:var(--gold-deep);font-size:var(--fs-xs);font-weight:700;white-space:nowrap}
.wh i{width:7px;height:7px;border-radius:var(--r-pill);display:block}
.tag{display:inline-flex;align-items:center;height:var(--tap);padding:0 14px;border-radius:var(--r-pill);
  border:0;background:var(--fill);font-size:var(--fs-sm);font-weight:600;white-space:nowrap;flex-shrink:0}
.tag[aria-pressed="true"]{background:var(--navy);color:#fff}
.tile{flex:1 1 0;min-width:0;padding:11px 12px;border-radius:15px;border:0;text-align:left;display:block}
.tile .n{font-size:23px;font-weight:700;line-height:1}
.tile .l{font-size:var(--fs-xs);margin-top:var(--sp-1)}
.tile.on-navy{background:rgba(255,255,255,.10);color:#fff}
.tile.on-navy .l{color:var(--on-navy-3)}
.tile.gold{background:var(--gold);color:var(--navy)}
.tile.gold .l{color:#5A4106}

.btn{display:flex;align-items:center;justify-content:center;gap:var(--sp-2);
  min-height:52px;border:0;border-radius:15px;font-size:15px;font-weight:700;width:100%}
.btn.gold{background:var(--gold);color:var(--navy)}
.btn.navy{background:var(--navy);color:#fff}
.btn.ghost{background:var(--fill-2);color:var(--ink-2)}
.btn.line{background:var(--fill);color:var(--gold-deep);border:0}
.btn.sm{min-height:var(--tap);width:auto;padding:0 16px;font-size:var(--fs-sm);border-radius:var(--r-sm)}

.fld{display:block}
.fld > span{display:block;font-size:var(--fs-xs);color:var(--ink-3);margin-bottom:5px}
.fld input,.fld select,.fld textarea{
  width:100%;min-height:var(--tap);padding:10px 12px;border:0;
  border-radius:11px;background:var(--fill)}
.fld textarea{resize:none;line-height:1.5}

.sb{display:flex;align-items:center;gap:var(--sp-2);height:46px;padding:0 12px;
  border-radius:15px;background:var(--card);box-shadow:var(--shadow-2)}
.sb input{flex:1 1 auto;min-width:0;border:0;outline:none;background:none;font-size:16px}
.sb .x{width:26px;height:26px;flex-shrink:0;border:0;border-radius:var(--r-pill);background:var(--fill-2);
  color:var(--ink-3);display:none;align-items:center;justify-content:center;font-size:13px}
.sb.has .x{display:flex}
.filters{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding:2px}
.filters::-webkit-scrollbar{display:none}

/* ── nav ──────────────────────────────── */
.nav{
  flex-shrink:0;margin:10px 14px calc(env(safe-area-inset-bottom) + 14px);
  height:var(--nav-h);border-radius:var(--r-xl);background:var(--navy);box-shadow:var(--shadow-nav);
  display:grid;grid-template-columns:repeat(5,minmax(0,1fr));
}
.nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  border:0;background:none;color:var(--on-navy-2);font-size:10px;font-weight:600;border-radius:var(--r-xl)}
.nav button[aria-current="page"]{color:var(--gold);font-weight:700}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.kpis.k2{grid-template-columns:repeat(2,minmax(0,1fr))}
.kpis.k3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpi{position:relative;overflow:hidden;padding:10px 9px 11px;border-radius:14px;
  border:0;text-align:left;display:flex;flex-direction:column;gap:5px;min-height:108px;
  box-shadow:var(--shadow-1);color:#fff}
.kpi::before{content:'';position:absolute;right:-20px;top:-20px;width:66px;height:66px;
  border-radius:99px;background:rgba(255,255,255,.13)}
.kpi > *{position:relative;z-index:1}
.kpi .ic{width:26px;height:26px;border-radius:8px;background:rgba(255,255,255,.2);

.kpi-n{font-size:26px;font-weight:700;line-height:1;letter-spacing:-.02em;margin-top:1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi-n.sm{font-size:17px}                            /* ตัวเลขยาว เช่น ยอดเงิน */
.kpi-l{font-size:10.5px;font-weight:700;line-height:1.3;

.kpi.k-green{background:#0C8058}
.kpi.k-blue{background:#1B72C4}
.kpi.k-red{background:#D6402C}
.kpi.k-orange{background:#BE5A07}                    /* ส้มเข้มพอให้ตัวหนังสือขาวอ่านชัด (AA 4.5) */
@media (min-width:430px){

.lnk{border:0;background:none;color:var(--gold-ink);font-size:12.5px;font-weight:700;
  min-height:30px;padding:0;position:relative;display:inline-flex;align-items:center}
.lnk::after{content:'';position:absolute;left:-8px;right:-8px;top:50%;height:var(--tap);transform:translateY(-50%)}
.chip[data-act]{position:relative}
.chip[data-act]::after{content:'';position:absolute;left:-6px;right:-6px;top:50%;height:var(--tap);transform:translateY(-50%)}
.stk{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.stk > span{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;
  border-radius:var(--r-pill);background:var(--fill-2);font-size:10.5px;font-weight:700;white-space:nowrap}
.stk i{width:6px;height:6px;border-radius:99px;display:block;flex-shrink:0}
.stk .zero{opacity:.42}
.pr{display:flex;gap:9px;flex-wrap:wrap;margin-top:7px;font-size:11.5px;color:var(--ink-3)}
.pr b{color:var(--ink);font-weight:700}
.tile .n,.tile .l{display:block}
.draft{flex-shrink:0;padding:9px var(--pad-screen) 11px;background:var(--navy-2);color:var(--on-navy-3)}
.dbar{height:5px;border-radius:99px;background:rgba(255,255,255,.16);overflow:hidden;margin-top:7px}
.dbar i{display:block;height:100%;background:var(--gold);border-radius:99px;transition:width .25s}
.sw{width:46px;height:27px;flex-shrink:0;border:0;border-radius:99px;background:var(--fill-2);position:relative}
.sw[aria-checked="true"]{background:var(--navy)}
.sw::after{content:'';position:absolute;left:0;right:0;top:50%;height:var(--tap);transform:translateY(-50%)}
.sw i{position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:99px;background:#fff;
  box-shadow:0 1px 3px rgba(10,31,71,.3);transition:.2s;display:block}
.sw[aria-checked="true"] i{left:22px;background:var(--gold)}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 34px);transform:translateX(-50%) translateY(14px);
  z-index:var(--z-toast);max-width:340px;padding:12px 18px;border-radius:var(--r-md);
  background:var(--navy);color:#fff;font-size:var(--fs-md);font-weight:600;
  box-shadow:var(--shadow-nav);opacity:0;pointer-events:none;transition:.22s}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--sp-2)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--sp-2)}
.flexrow{display:flex;align-items:center;gap:var(--sp-2)}
.btnrow{display:flex;gap:10px}
.btnrow > .btn{width:auto;flex:1 1 0;min-width:0;white-space:nowrap;padding:0 10px}
.btnrow > .btn.wide{flex:1.5 1 0}
.btn.off{background:var(--fill-2);color:var(--ink-4)}

.steps{flex-shrink:0;display:flex;gap:7px;padding:9px var(--pad-screen);background:var(--card);

.steps::-webkit-scrollbar{display:none}
.step{display:inline-flex;align-items:center;gap:6px;flex-shrink:0;height:28px;padding:0 12px 0 5px;

  display:flex;align-items:center;justify-content:center;font-size:10.5px}

.seg{display:flex;gap:7px}
.seg button{flex:1 1 0;min-width:0;min-height:var(--tap);border:1.5px solid var(--line-3);border-radius:11px;
  background:var(--card);font-size:13.5px;font-weight:700;color:var(--ink-3)}
.seg button.on{background:var(--teal-soft);border-color:var(--teal);color:var(--teal)}
.seg button.on.clay{background:var(--clay-soft);border-color:var(--clay);color:var(--clay)}

.nin{width:84px;min-height:var(--tap);padding:0 10px;border:1.5px solid var(--line-3);border-radius:10px;
  background:var(--card);font-weight:700;text-align:right}
.nin.ch{border-color:var(--clay);color:var(--clay);background:var(--clay-soft)}
.qrow{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:11px}
.qrow label{display:block;min-width:0}
.qrow label > span{display:block;font-size:10.5px;color:var(--ink-3);margin-bottom:4px}
.qrow .nin{width:100%}
.qamt{display:flex;align-items:center;gap:8px;margin-top:9px;font-size:12.5px}
.sellb{margin-top:10px;padding-top:9px;border-top:1px dashed var(--line-2)}
.sellb.bad{border-top-color:var(--clay-line)}
.conv{font-size:11px;color:var(--ink-4)}
.sells{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.sells > span{display:inline-flex;align-items:center;height:21px;padding:0 8px;border-radius:var(--r-pill);
  background:var(--fill-2);color:var(--ink-3);font-size:10.5px;font-weight:700;white-space:nowrap}
.sells > span.bad{background:var(--clay-soft);color:var(--clay)}
.lossb{margin-top:8px;padding:9px 11px;border-radius:10px;background:var(--clay-soft);
  border-left:3px solid var(--clay);color:var(--clay-deep)}
.lossb .lh{font-size:11px;font-weight:700;color:var(--clay);margin-bottom:6px}
.lossb .lr{display:flex;align-items:baseline;gap:8px;font-size:11.5px;font-weight:600}
.lossb .lr b{flex-shrink:0;color:var(--clay);font-weight:700}
.lossb .lx{font-size:10.5px;opacity:.85;margin:1px 0 7px}
.lossb .lx:last-child{margin-bottom:0}
.dchips{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.dchips > span{display:inline-flex;align-items:center;height:23px;padding:0 9px;border-radius:var(--r-pill);
  background:var(--clay-soft);color:var(--clay);font-size:11px;font-weight:600;white-space:nowrap}
.dchips b{font-weight:700;margin:0 1px}
.sel{width:100%;min-height:var(--tap);margin-top:8px;padding:0 10px;border:1px solid var(--line-3);
  border-radius:10px;background:var(--card-2);font-size:13px}

.ack{display:flex;align-items:center;gap:10px;margin-top:11px;min-height:var(--tap);padding:0 12px;
  border:1.5px solid var(--line-3);border-radius:12px;background:var(--card-2);
  font-size:13px;font-weight:600;color:var(--ink-2);cursor:pointer}
.ack input{width:21px;height:21px;flex-shrink:0;accent-color:var(--teal)}
.ack.on{border-color:var(--teal);background:var(--teal-soft);color:var(--teal)}

.iws{display:flex;flex-direction:column;margin-top:9px;border-radius:10px;background:var(--fill-2);overflow:hidden}
.iw{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:7px 10px;min-width:0}
.iw + .iw{border-top:1px solid var(--line-2)}
.iw i{width:7px;height:7px;border-radius:99px;display:block;flex-shrink:0}
.iw b{font-size:11px;font-weight:700;color:var(--ink-2);flex:0 1 auto;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iw-m{font-size:10.5px;color:var(--ink-4);flex:0 1 auto;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iw-c{margin-left:auto;flex-shrink:0;display:flex;gap:4px;flex-wrap:wrap}
.iw-c > span{display:inline-flex;align-items:center;height:19px;padding:0 7px;border-radius:var(--r-pill);
  font-size:10px;font-weight:700;white-space:nowrap}
.i-slow{background:var(--gold-tint);color:var(--gold-deep)}
.i-dead{background:var(--clay-soft);color:var(--clay)}
.i-def{background:var(--clay);color:#fff}
.miss{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.miss > span{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:var(--r-pill);
  background:var(--clay-soft);color:var(--clay);font-size:10.5px;font-weight:700;white-space:nowrap}

.slot2{padding:9px 6px;border:2px solid transparent;border-radius:12px;text-align:center;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  min-height:var(--tap);background:var(--fill);color:var(--ink)}
.slot2 .t{font-size:15px;font-weight:700;display:block;line-height:1.2}
.slot2 .c{font-size:10.5px;display:block;line-height:1.2}
.slot2.ok{background:#E7F5F1;border-color:#8FCDBF;color:#0E5A50}
.slot2.ok .c{color:#1C6B5E}
.slot2.tight{background:var(--gold-tint);border-color:#D9A93A;color:var(--gold-deep)}
.slot2.tight .c{color:var(--gold-deep)}
.slot2.off{background:var(--fill-2);color:var(--ink-4)}
.slot2.off .t{text-decoration:line-through;opacity:.8}
.slot2.on{background:var(--navy);border-color:var(--navy);color:#fff}
.slot2.on .c{color:var(--gold)}
.slot2.dur .t{font-size:17px}
.durs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
@media (max-width:359px){.durs{grid-template-columns:repeat(3,minmax(0,1fr))}}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--ink-3)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.lg{width:12px;height:12px;border-radius:4px;display:block;border:2px solid transparent;flex-shrink:0}
.lg.ok{background:#E7F5F1;border-color:#8FCDBF}
.lg.tight{background:var(--gold-tint);border-color:#D9A93A}
.lg.off{background:var(--fill-2)}
:root[data-theme="dark"] .slot2.ok{background:#11362F;border-color:#2E8577;color:#8FE3D2}
:root[data-theme="dark"] .slot2.ok .c{color:#5FD0BE}
:root[data-theme="dark"] .lg.ok{background:#11362F;border-color:#2E8577}
.slot{padding:10px 6px;border:0;border-radius:11px;background:var(--fill);text-align:center}
.slot .t{font-size:14.5px;font-weight:700;display:block}
.slot .c{font-size:10.5px;color:var(--ink-3);margin-top:2px;display:block}
.slot[aria-pressed="true"]{background:var(--navy);color:#fff}
.slot[aria-pressed="true"] .c{color:var(--gold)}
.slot:disabled{background:var(--fill-2);color:var(--ink-4)}
.slot:disabled .c{color:var(--ink-4)}
.slot.low{background:var(--gold-tint);color:var(--gold-deep)}
.slot.low .c{color:var(--gold-deep)}
.daycell{width:54px;flex-shrink:0;padding:9px 0 10px;border:0;
  border-radius:13px;background:var(--fill);text-align:center}
.daycell .d{font-size:var(--fs-xs);color:var(--ink-3);display:block}
.daycell .n{font-size:19px;font-weight:700;line-height:1.3;display:block}
.daycell .s{width:5px;height:5px;border-radius:var(--r-pill);margin:3px auto 0;display:block;background:var(--teal)}
.daycell[aria-pressed="true"]{background:var(--navy);color:#fff}
.daycell[aria-pressed="true"] .d{color:var(--on-navy-3)}
.daycell[aria-pressed="true"] .s{background:var(--gold)}
.daycell:disabled{background:var(--fill-2);color:var(--ink-4)}
.daycell:disabled .d,.daycell:disabled .n{color:var(--ink-4)}
.daycell:disabled .s{background:var(--line-3)}
.days .daycell{width:50px;padding:8px 0 9px}
.daycell .dot{width:22px;height:4px;border-radius:99px;margin:5px auto 0;display:block;background:var(--line-3)}
.dc-many .dot{background:#3EA98F}
.dc-few  .dot{background:#D9A93A}
.dc-many{background:#E7F5F1}
.dc-few{background:var(--gold-tint)}
.daycell[aria-pressed="true"] .dot{background:var(--gold)}
.iconbtn.sm2{width:32px;height:32px;border-radius:10px;background:var(--fill-2);color:var(--ink-2)}
.iconbtn.sm2:disabled{opacity:.35}
.warnbox{padding:11px 13px;border-radius:12px;background:var(--clay-soft);color:var(--clay-deep);
  border-left:4px solid var(--clay);font-size:12px;line-height:1.6;font-weight:600}
.strip{display:flex;gap:var(--sp-2);overflow-x:auto;scrollbar-width:none;padding:2px}
.strip::-webkit-scrollbar{display:none}
.foot{flex-shrink:0;background:var(--card);padding:var(--sp-3) var(--pad-screen) calc(env(safe-area-inset-bottom) + var(--sp-4));
  border-radius:var(--r-xl) var(--r-xl) 0 0;box-shadow:0 -2px 4px rgba(10,31,71,.04),0 -10px 26px rgba(10,31,71,.08)}
.prog{flex-shrink:0;height:3px;background:var(--navy-3)}
.prog i{display:block;height:100%;background:var(--gold)}
.lbl{display:flex;align-items:center;gap:var(--sp-3);min-height:56px;padding:11px var(--pad-card)}
.lbl.dis{opacity:.45}
.lbl input[type=checkbox],.lbl input[type=radio]{width:20px;height:20px;flex-shrink:0;accent-color:var(--navy)}
.divide > * + *{border-top:1px solid var(--line-2)}
.empty{padding:36px 20px;text-align:center;color:var(--ink-4);font-size:var(--fs-md)}

@media (max-width:359px){
  :root{--pad-screen:13px; --fs-hero:34px}
  .kpi{min-height:96px;padding:11px}
  .kpi-n{font-size:23px}
  .banner-h{font-size:18px}
  .nav button{font-size:9.5px}
}
/* ── แท็บเล็ต 768+ ────────────────────── */
@media (min-width:768px){
  #app{max-width:720px}
  .cols2{display:grid;grid-template-columns:1.05fr 1fr;gap:var(--sp-5);align-items:start}
  .nav{max-width:560px;margin-left:auto;margin-right:auto;height:70px}
  .nav button{font-size:11.5px}
}
/* ── LINE PC 1024+ : แถบล่าง → แถบข้าง ── */
@media (min-width:1024px){
  #app{max-width:none;flex-direction:row;height:100dvh}
  #app > .rail{display:flex}   /* เจาะจงกว่า .rail ด้านล่าง ไม่งั้นโดนทับ */
  .scr{flex:1 1 auto;min-width:0}
  .scr .body{max-width:1100px;width:100%;margin:0 auto;padding-left:var(--sp-6);padding-right:var(--sp-6)}
  .scr .hdr,.scr .hero{padding-left:var(--sp-6);padding-right:var(--sp-6)}
  .nav{display:none}
  .foot{max-width:1100px;width:100%;margin:0 auto}
}
.rail{display:none;width:232px;flex-shrink:0;flex-direction:column;gap:var(--sp-5);
  background:var(--navy);padding:22px 16px}
.rail .logo{display:flex;align-items:center;gap:10px;padding:0 6px;color:#fff;font-size:var(--fs-xl);font-weight:700}
.rail nav{display:flex;flex-direction:column;gap:3px}
.rail button{display:flex;align-items:center;gap:11px;min-height:var(--tap);padding:0 12px;
  border:0;border-radius:var(--r-sm);background:none;color:var(--on-navy-3);
  font-size:var(--fs-md);font-weight:600;text-align:left}
.rail button[aria-current="page"]{background:var(--gold);color:var(--navy);font-weight:700}
.rail .who{margin-top:auto;padding:12px;border-radius:var(--r-md);background:var(--navy-2);
  display:flex;align-items:center;gap:10px;color:#fff}

/* ── แอปจริง: ต่อจาก mockup — รูปจริง · จอก่อนเข้าแอป · แผ่นล่าง · ไฟล์แนบ · ui-kit ── */
:root{
  --overlay:rgba(10,31,71,.45);
  --rk-surface:var(--card); --rk-surface-2:var(--fill); --rk-text:var(--ink); --rk-muted:var(--ink-3);
  --rk-line:var(--line); --rk-gold:var(--gold); --rk-navy:var(--navy); --rk-radius:var(--r-md);
  --rk-z-sticky-sub:var(--z-sticky-sub); --rk-z-sticky:var(--z-sticky); --rk-z-dropdown:var(--z-dropdown);
  --rk-z-modal:var(--z-modal); --rk-z-toast:var(--z-toast);
}
.thumb{position:relative;overflow:hidden}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .2s}
.thumb img.ok{opacity:1;background:#fff}                  /* รูปยังโหลดไม่เสร็จ = เห็นภาพประกอบก่อน ไม่ใช่กล่องขาว */

/* ── รายละเอียดสินค้า (แบบ A หน้าเต็ม) ── */
.pd-card{width:100%;border:0;text-align:left;align-items:center}
.pd-card > svg{flex-shrink:0;align-self:center}
.pd-thumb{width:76px;height:76px;border-radius:var(--r-lg)}
.pd-name{font-size:var(--fs-xl);font-weight:700;line-height:1.3}
.pd-chips{display:flex;gap:6px;min-width:0;overflow:hidden}
.chip.onnavy{background:var(--on-navy-fill);color:var(--on-navy-3)}
.pd-stat{min-width:0}
.pd-stat .l{font-size:var(--fs-xs);color:var(--ink-4)}
.pd-stat .v{font-size:var(--fs-lg);font-weight:700;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.pd-stat .v small{font-size:var(--fs-sm);font-weight:600;color:var(--ink-3)}
.pd-list{padding:0}
.pd-row{display:flex;align-items:center;gap:10px;min-height:var(--tap);padding:var(--sp-3) var(--pad-card);min-width:0}
.pd-row .dot{width:9px;height:9px;border-radius:var(--r-pill);flex-shrink:0;display:block}
.pd-row .nm{display:block;font-size:var(--fs-md);font-weight:700}
.pd-row .sub{display:block;font-size:var(--fs-xs);color:var(--ink-4);margin-top:1px}
.pd-num{flex-shrink:0;text-align:right}
.pd-num b{display:block;font-size:var(--fs-md);font-weight:700;font-variant-numeric:tabular-nums}
.pd-num span{display:block;font-size:var(--fs-xs);color:var(--ink-3)}
.pd-row.out .sub,.pd-row.out .pd-num b,.pd-row.out .pd-num span{color:var(--clay)}
.pd-row.idle{opacity:.55}
.pd-row .chip{height:20px;padding:0 7px;font-size:10px;flex-shrink:0}
.pd-price{display:flex;flex-direction:column;gap:10px}
.pd-cost{display:flex;align-items:center;gap:var(--sp-2);min-width:0;padding:9px 11px;border-radius:var(--r-sm);background:var(--fill);font-size:var(--fs-sm)}
.pd-cost b{font-variant-numeric:tabular-nums}
.pd-tbl{display:grid;font-size:var(--fs-sm)}
.pd-tbl > span{min-width:0;padding:8px 4px;border-top:1px solid var(--line-2);text-align:right;font-variant-numeric:tabular-nums}
.pd-tbl > span.h{padding:6px 4px;border-top:0;font-size:var(--fs-xs);color:var(--ink-4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pd-tbl > span.t{text-align:left}
.pd-tbl b{display:block;font-weight:700;white-space:nowrap}
.pd-tbl i{display:block;font-style:normal;font-size:10.5px;color:var(--ink-4);white-space:nowrap}

<!-- ══════════════════════════════════════════════════════════════════════════
     RK-DROPDOWN · dropdown ที่ "พิมพ์ค้นได้ + ไม่มีวันโดน sticky ทับ"
     ต้องวาง rk-base.html ก่อน · วางบล็อกนี้ก่อน </body>
     กฎอ้างอิง: CLAUDE.md § UI Build Standards ข้อ 1️⃣ + 5️⃣ + 6️⃣(ข)

     ── ใช้ยังไง ──────────────────────────────────────────────────────────
     A) แปลง <select> เดิมทั้งหน้าให้ค้นหาได้ (retrofit แอปเก่า — บรรทัดเดียวจบ):
          RK.selectifyAll();                       // ทุก select ในหน้า
          RK.selectifyAll('#myScreen');            // เฉพาะบางส่วน
          <select data-rk-skip>…</select>          // ตัวไหนไม่อยากแปลง

     B) เรียกเมนูเองจากปุ่ม:
          RK.dropdown(btnEl, {
            title:'เลือกคลัง',
            items:[{v:'W1', label:'W1 · สมุทรสงคราม', color:'#FBBF24'}, …],
            value: cur,
            onPick: it => { cur = it.v; render(); }
          });
     ══════════════════════════════════════════════════════════════════════════ -->
<style id="rk-dropdown-css">
.rk-dd-backdrop{position:fixed;inset:0;z-index:calc(var(--rk-z-dropdown) - 1);background:rgba(15,23,42,.35);opacity:0;transition:opacity .14s;-webkit-tap-highlight-color:transparent}
.rk-dd-backdrop.on{opacity:1}
@media (min-width:481px){.rk-dd-backdrop{background:transparent}}

.rk-dd{position:fixed;z-index:var(--rk-z-dropdown);background:var(--rk-surface);color:var(--rk-text);
  border:1px solid var(--rk-line);border-radius:var(--rk-radius);box-shadow:0 12px 32px rgba(15,23,42,.22);
  display:none;flex-direction:column;overflow:hidden;max-height:min(70dvh,420px)}
.rk-dd.on{display:flex}
.rk-dd-head{display:none;align-items:center;gap:8px;padding:10px 12px 4px;font-weight:700;font-size:15px}
.rk-dd-grip{display:none}
.rk-dd-srch{display:flex;align-items:center;gap:6px;padding:8px;border-bottom:1px solid var(--rk-line);background:var(--rk-surface)}
.rk-dd-srch input{flex:1 1 auto;min-width:0;border:1px solid var(--rk-line);border-radius:9px;padding:9px 10px;
  font:inherit;font-size:15px;background:var(--rk-surface-2);color:var(--rk-text);outline:none}
.rk-dd-srch input:focus{border-color:var(--rk-gold)}
.rk-dd-srch .rk-dd-x{flex:0 0 auto;width:34px;height:34px;border:0;border-radius:9px;background:transparent;
  color:var(--rk-muted);font-size:17px;cursor:pointer;display:none}
.rk-dd-srch.has .rk-dd-x{display:block}
.rk-dd-list{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px;flex:1 1 auto}
.rk-dd-it{display:flex;align-items:center;gap:9px;min-width:0;padding:11px 10px;border-radius:9px;cursor:pointer;font-size:15px;line-height:1.25}
.rk-dd-it:hover,.rk-dd-it.act{background:var(--rk-surface-2)}
.rk-dd-it.sel{background:rgba(201,168,76,.16);font-weight:700}
.rk-dd-it .lb{flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rk-dd-it .dot{flex:0 0 auto;width:10px;height:10px;border-radius:50%}
.rk-dd-it .tick{flex:0 0 auto;color:var(--rk-gold);font-weight:700}
.rk-dd-none{padding:18px 12px;text-align:center;color:var(--rk-muted);font-size:14px}
.rk-dd-cnt{padding:6px 12px;font-size:12px;color:var(--rk-muted);border-top:1px solid var(--rk-line)}

/* มือถือ → bottom sheet (นิ้วโป้งถึง + ไม่มีทางโดน sticky ทับ) */
@media (max-width:480px){
  .rk-dd{left:0!important;right:0!important;top:auto!important;bottom:0!important;width:auto!important;
    max-height:min(78dvh,560px);border-radius:16px 16px 0 0;border-bottom:0;
    padding-bottom:env(safe-area-inset-bottom);transform:translateY(100%);transition:transform .18s ease-out}
  .rk-dd.on{transform:translateY(0)}
  .rk-dd-head{display:flex}
  .rk-dd-grip{display:block;width:38px;height:4px;border-radius:2px;background:var(--rk-line);margin:8px auto 0}
  .rk-dd-it{padding:13px 10px}
}

/* ปุ่มที่แทน <select> เดิม */
.rk-dd-btn{display:flex;align-items:center;gap:6px;min-width:0;max-width:100%;
  border:1px solid var(--rk-line);border-radius:10px;background:var(--rk-surface);color:var(--rk-text);
  padding:8px 10px;font:inherit;font-size:14px;cursor:pointer;text-align:left}

.rk-dd-btn:disabled{opacity:.5;cursor:not-allowed}
</style>

<script id="rk-dropdown-js">
(function(){
  window.RK = window.RK || {};
  let el, backdrop, inp, list, cntEl, headEl, st = null, act = -1;

  function build(){
    if (el) return;
    backdrop = document.createElement('div'); backdrop.className = 'rk-dd-backdrop';
    el = document.createElement('div'); el.className = 'rk-dd'; el.setAttribute('role','listbox');
    el.innerHTML =
      '<div class="rk-dd-grip"></div>'+
      '<div class="rk-dd-head"><span class="rk-1line rk-grow"></span></div>'+
      '<div class="rk-dd-srch"><input type="search" inputmode="search" autocomplete="off" placeholder="พิมพ์ค้นหา…"><button class="rk-dd-x" type="button" aria-label="ล้าง">✕</button></div>'+
      '<div class="rk-dd-list"></div><div class="rk-dd-cnt"></div>';
    document.body.appendChild(backdrop); document.body.appendChild(el);   /* ← portal ที่ body: sticky ตัวไหนก็ทับไม่ได้ */
    inp = el.querySelector('input'); list = el.querySelector('.rk-dd-list');
    cntEl = el.querySelector('.rk-dd-cnt'); headEl = el.querySelector('.rk-dd-head span');

    inp.addEventListener('input', paint);
    el.querySelector('.rk-dd-x').addEventListener('click', ()=>{ inp.value=''; paint(); inp.focus(); });
    backdrop.addEventListener('click', close);
    el.addEventListener('keydown', key);
    inp.addEventListener('keydown', key);
    list.addEventListener('click', e=>{
      const it = e.target.closest('.rk-dd-it'); if (!it) return;
      pick(st.view[+it.dataset.i]);
    });
    window.addEventListener('resize', close);
    window.addEventListener('scroll', e=>{ if (st && !el.contains(e.target)) close(); }, true);
  }

  const norm = s => String(s==null?'':s).toLowerCase().trim();
  /* ค้นแบบ "ทุกคำต้องเจอ" และเจอที่ไหนก็ได้ในตัวเลือก (ไม่ใช่แค่ขึ้นต้น) */
  function match(hay, q){
    const w = norm(q).split(/\s+/).filter(Boolean);
    return w.every(x => hay.indexOf(x) >= 0);
  }

  function paint(){
    const q = inp.value;
    st.view = st.items.filter(it => !q || match(it._s, q));
    act = st.view.findIndex(it => String(it.v) === String(st.value));
    el.querySelector('.rk-dd-srch').classList.toggle('has', !!q);
    list.innerHTML = st.view.length
      ? st.view.map((it,i)=>
          '<div class="rk-dd-it'+(String(it.v)===String(st.value)?' sel':'')+'" data-i="'+i+'" role="option">'+
          (it.color?'<span class="dot" style="background:'+RK.esc(it.color)+'"></span>':'')+
          '<span class="lb" title="'+RK.esc(it.label)+'">'+RK.esc(it.label)+'</span>'+
          (String(it.v)===String(st.value)?'<span class="tick">✓</span>':'')+'</div>').join('')
      : '<div class="rk-dd-none">ไม่พบ "'+RK.esc(q)+'"</div>';
    cntEl.textContent = st.view.length + ' / ' + st.items.length + ' รายการ';
    cntEl.style.display = st.items.length > 8 ? '' : 'none';
    const sel = list.querySelector('.sel'); if (sel) sel.scrollIntoView({block:'nearest'});
  }

  function key(e){
    if (!st) return;
    if (e.key === 'Escape'){ e.preventDefault(); close(); return; }
    if (e.key === 'Enter'){ e.preventDefault(); if (st.view[act]) pick(st.view[act]); else if (st.view.length===1) pick(st.view[0]); return; }
    if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
    e.preventDefault();
    act = Math.max(0, Math.min(st.view.length-1, act + (e.key==='ArrowDown'?1:-1)));
    [...list.children].forEach((c,i)=> c.classList.toggle('act', i===act));
    if (list.children[act]) list.children[act].scrollIntoView({block:'nearest'});
  }

  function place(anchor){
    if (window.innerWidth <= 480) return;                 /* มือถือ = bottom sheet (CSS จัดให้) */
    const r = anchor.getBoundingClientRect(), M = 8;
    const w = Math.min(Math.max(r.width, 220), window.innerWidth - M*2);
    el.style.width = w + 'px';
    el.style.left  = Math.round(Math.min(Math.max(M, r.left), window.innerWidth - w - M)) + 'px';
    const below = window.innerHeight - r.bottom - M, above = r.top - M;
    const h = Math.min(el.scrollHeight || 320, 420);
    if (below >= Math.min(h, 220) || below >= above){ el.style.top = Math.round(r.bottom + 4) + 'px'; el.style.maxHeight = (below - 4) + 'px'; }
    else { el.style.top = Math.round(Math.max(M, r.top - 4 - Math.min(h, above))) + 'px'; el.style.maxHeight = (above - 4) + 'px'; }
  }

  function pick(it){ if (!it) return; const cb = st.onPick; close(); if (cb) cb(it); }

  function close(){
    if (!st) return;
    const a = st.anchor; st = null;
    el.classList.remove('on'); backdrop.classList.remove('on');
    backdrop.style.display = 'none';
    if (a && a.focus) try{ a.focus({preventScroll:true}); }catch(e){}
  }

  /* ── API หลัก ── */
  RK.dropdown = function(anchor, o){
    build(); if (st) close();
    const items = (o.items||[]).map(it => {
      const x = (typeof it === 'string') ? {v:it, label:it} : Object.assign({}, it);
      x.label = x.label==null ? String(x.v) : String(x.label);
      x._s = norm(x.label + ' ' + x.v + ' ' + (x.search||''));
      return x;
    });
    st = {anchor, items, view:items, value:o.value, onPick:o.onPick};
    headEl.textContent = o.title || 'เลือก';
    const searchable = o.search !== false && (o.search === true || items.length > 10);
    el.querySelector('.rk-dd-srch').style.display = searchable ? '' : 'none';
    inp.value = ''; inp.placeholder = o.placeholder || 'พิมพ์ค้นหา…';
    backdrop.style.display = ''; backdrop.classList.add('on');
    el.classList.add('on');
    paint(); place(anchor);
    if (searchable && window.innerWidth > 480) setTimeout(()=>inp.focus(), 30);
    return {close};
  };
  RK.closeDropdown = close;

  /* ── retrofit: <select> เดิม → ปุ่มที่ค้นหาได้ (ค่ายังอยู่ใน select เดิม แอปเดิมไม่ต้องแก้) ── */
  RK.selectify = function(sel, o){
    o = o || {};
    if (!sel || sel.dataset.rkDone || sel.hasAttribute('data-rk-skip') || sel.multiple) return;
    sel.dataset.rkDone = '1';
    const btn = document.createElement('button');
    btn.type = 'button'; btn.className = 'rk-dd-btn ' + (o.cls||'');
    btn.innerHTML = '<span class="lb"></span><span class="cv">▾</span>';
    btn.setAttribute('data-rk-menu-anchor','1');
    sel.style.display = 'none';
    sel.insertAdjacentElement('afterend', btn);

    const opts = () => [...sel.options].filter(op=>!op.disabled || op.value!=='')
                    .map(op => ({v:op.value, label:(op.textContent||'').trim(), color:op.dataset.color}));
    const sync = () => {
      const cur = sel.options[sel.selectedIndex];
      const t = cur ? (cur.textContent||'').trim() : (o.placeholder || 'เลือก…');
      btn.querySelector('.lb').textContent = t; btn.title = t;
      btn.disabled = sel.disabled;
    };
    btn.addEventListener('click', ()=> RK.dropdown(btn, {
      title: o.title || sel.getAttribute('aria-label') || sel.dataset.title || 'เลือก',
      items: opts(), value: sel.value,
      onPick: it => { sel.value = it.v; sync(); sel.dispatchEvent(new Event('change', {bubbles:true})); }
    }));
    sel.addEventListener('change', sync);
    new MutationObserver(sync).observe(sel, {childList:true, subtree:true, attributes:true, attributeFilter:['disabled','value']});
    sync();
    return btn;
  };

  RK.selectifyAll = function(root, o){
    (typeof root === 'string' ? document.querySelector(root) : (root || document))
      .querySelectorAll('select:not([data-rk-done]):not([data-rk-skip])')
      .forEach(s => RK.selectify(s, o));
  };
})();
</script>

  background:#000;color:#fff;height:100dvh;overscroll-behavior:contain}
#rkScan.on{display:flex}
#rkScan .rk-sc-top{flex:0 0 auto;display:flex;align-items:center;gap:10px;min-width:0;
  padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;background:rgba(0,0,0,.72)}
#rkScan .rk-sc-top .t{flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700;font-size:16px}
#rkScan .rk-sc-btn{flex:0 0 auto;width:40px;height:40px;border:0;border-radius:12px;
  background:rgba(255,255,255,.16);color:#fff;font-size:18px;cursor:pointer}
#rkScan .rk-sc-torch{width:auto;padding:0 12px;font-size:13px;font-weight:600}
#rkScan .rk-sc-stage{flex:1 1 auto;position:relative;min-height:0;background:#000;overflow:hidden}
#rkScan #rkScanReader{position:absolute;inset:0}
#rkScan #rkScanReader video{width:100%!important;height:100%!important;object-fit:cover}
#rkScan #rkScanReader img{display:none}
#rkScan .rk-sc-frame{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(78vw,320px);height:180px;border-radius:16px;box-shadow:0 0 0 100vmax rgba(0,0,0,.45);
  border:2px solid rgba(255,255,255,.9);pointer-events:none}
#rkScan .rk-sc-frame::after{content:'';position:absolute;left:8px;right:8px;top:50%;height:2px;background:#ef4444;opacity:.9}
#rkScan .rk-sc-hint{position:absolute;left:0;right:0;bottom:14px;text-align:center;font-size:13px;color:#e2e8f0;
  text-shadow:0 1px 3px #000;padding:0 16px}
#rkScan .rk-sc-bottom{flex:0 0 auto;background:rgba(0,0,0,.86);padding:10px 14px calc(env(safe-area-inset-bottom) + 12px)}
#rkScan .rk-sc-manual{display:flex;gap:8px;min-width:0}
#rkScan .rk-sc-manual input{flex:1 1 auto;min-width:0;border:1px solid rgba(255,255,255,.25);border-radius:10px;
  background:rgba(255,255,255,.10);color:#fff;font:inherit;font-size:16px;padding:11px 12px;outline:none}
#rkScan .rk-sc-manual input::placeholder{color:#94a3b8}
#rkScan .rk-sc-manual button{flex:0 0 auto;border:0;border-radius:10px;background:var(--rk-gold,#c9a84c);
  color:#0d1b3e;font:inherit;font-weight:700;padding:0 16px;cursor:pointer}
#rkScan .rk-sc-err{color:#fca5a5;font-size:13px;padding:8px 2px 0;display:none}
#rkScan .rk-sc-err.on{display:block}
</style>

<script id="rk-scanner-js">
(function(){
  window.RK = window.RK || {};
  const CDN = 'https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js';
  const UNITS = [                                    /* ใหญ่ → เล็ก (ชนกันให้หน่วยใหญ่ชนะ) */
    {u:'CS', code:'CODE CS', qty:'QTY CS', th:'ลัง'},
    {u:'BP', code:'CODE BP', qty:'QTY BP', th:'Big Pack'},
    {u:'PA', code:'CODE PA', qty:'QTY PA', th:'แพ็ค'},
    {u:'EA', code:'CODE EA', qty:'QTY EA', th:'ชิ้น'}
  ];
  let sc = null, el = null, busy = false, opt = {}, IDX = {};

  const clean = v => String(v==null?'':v).replace(/[\s'"]/g,'').trim();

  /* ── index: บาร์โค้ดทุกหน่วยของทุก SKU → {product, unit, eaPerUnit} ── */
  RK.scan = RK.scan || {};
  RK.scan.index = function(products, o){
    o = o || {}; IDX = {};
    (products||[]).forEach(p=>{
      UNITS.forEach(U=>{
        const bc = clean(p[U.code] || p[o[U.u]] || '');
        if (!bc || bc === '0') return;
        if (!IDX[bc]) IDX[bc] = {product:p, unit:U.u, unitTh:U.th, eaPerUnit: Math.max(1, RK.num(p[U.qty]) || 1)};
      });
    });
    return Object.keys(IDX).length;
  };
  RK.scan.lookup = function(code){
    const bc = clean(code);
    const hit = IDX[bc] || IDX[bc.replace(/^0+/,'')] || null;
    if (!hit) return {code:bc, product:null, unit:null, eaPerUnit:1, label:''};
    return {code:bc, product:hit.product, unit:hit.unit, unitTh:hit.unitTh, eaPerUnit:hit.eaPerUnit,
            label: hit.unit === 'EA' ? '1 ชิ้น' : ('1 ' + hit.unitTh + ' = ' + hit.eaPerUnit.toLocaleString('th-TH') + ' ชิ้น')};
  };
  /* จำนวนที่ผู้ใช้กรอกในหน่วยที่สแกนได้ → EA */
  RK.scan.toEA = (r, qty) => Math.round((RK.num(qty)||0) * (r && r.eaPerUnit ? r.eaPerUnit : 1));

  function build(){
    if (el) return;
    el = document.createElement('div'); el.id = 'rkScan';
    el.innerHTML =
      '<div class="rk-sc-top"><span class="t"></span>'+
        '<button class="rk-sc-btn rk-sc-torch" type="button" style="display:none">ไฟฉาย</button>'+
        '<button class="rk-sc-btn rk-sc-close" type="button" aria-label="ปิด">✕</button></div>'+
      '<div class="rk-sc-stage"><div id="rkScanReader"></div><div class="rk-sc-frame"></div>'+
        '<div class="rk-sc-hint">เล็งบาร์โค้ดให้อยู่ในกรอบ · สแกนติดแล้วกล้องจะปิดเอง</div></div>'+
      '<div class="rk-sc-bottom"><div class="rk-sc-manual">'+
        '<input type="text" inputmode="numeric" autocomplete="off" placeholder="อ่านไม่ออก → พิมพ์เลขบาร์โค้ด">'+
        '<button type="button">ตกลง</button></div><div class="rk-sc-err"></div></div>';
    document.body.appendChild(el);
    el.querySelector('.rk-sc-close').addEventListener('click', ()=>RK.scan.close());
    el.querySelector('.rk-sc-manual button').addEventListener('click', manual);
    el.querySelector('.rk-sc-manual input').addEventListener('keydown', e=>{ if (e.key==='Enter') manual(); });
    el.querySelector('.rk-sc-torch').addEventListener('click', torch);
  }

  function err(msg){ const e = el.querySelector('.rk-sc-err'); e.textContent = msg||''; e.classList.toggle('on', !!msg); }

  function manual(){
    const i = el.querySelector('.rk-sc-manual input'), v = clean(i.value);
    if (!v) return; i.value = '';
    done(v, true);
  }

  function load(cb){
    if (typeof Html5Qrcode !== 'undefined') return cb();
    const s = document.createElement('script'); s.src = CDN;
    s.onload = cb; s.onerror = ()=>err('โหลดตัวสแกนไม่ได้ — เช็คเน็ต แล้วพิมพ์เลขบาร์โค้ดแทนได้');
    document.head.appendChild(s);
  }

  async function release(){
    if (sc){ try{ await sc.stop(); }catch(e){} try{ sc.clear(); }catch(e){} sc = null; }
    /* html5-qrcode บางเคสไม่ปล่อย track จริง — บังคับปิดซ้ำ ไม่งั้นไฟกล้องค้าง */
    try{ const st = await navigator.mediaDevices.getUserMedia({video:true}); st.getTracks().forEach(t=>t.stop()); }catch(e){}
  }

  function done(code, isManual){
    if (busy) return; busy = true;
    try{ navigator.vibrate && navigator.vibrate(60); }catch(e){}
    const r = RK.scan.lookup(code); r.manual = !!isManual;
    RK.scan.close();                                   /* ← ติดแล้วปิดกล้องทันที แล้วค่อยโชว์ผล */
    setTimeout(()=>{ busy = false; if (opt.onResult) opt.onResult(r); }, 60);
  }

  async function torch(){
    try{
      const t = sc && sc.getRunningTrackSettings ? sc.getRunningTrackSettings() : null;
      const on = t && t.torch;
      await sc.applyVideoConstraints({advanced:[{torch:!on}]});
    }catch(e){ err('เครื่องนี้เปิดไฟฉายไม่ได้'); }
  }

  RK.scan.open = function(o){
    build(); opt = o || {}; busy = false; err('');
    el.querySelector('.rk-sc-manual input').value = '';   /* เปิดใหม่ = ไม่ค้างค่าเก่า */
    el.querySelector('.t').textContent = opt.title || 'สแกนบาร์โค้ด';
    el.classList.add('on');
    document.body.style.overflow = 'hidden';
    load(async ()=>{
      try{
        await release();
        sc = new Html5Qrcode('rkScanReader', {
          verbose:false,
          experimentalFeatures:{ useBarCodeDetectorIfSupported:true },      /* native BarcodeDetector = เร็วกว่ามาก */
          formatsToSupport:[
            Html5QrcodeSupportedFormats.EAN_13, Html5QrcodeSupportedFormats.EAN_8,
            Html5QrcodeSupportedFormats.UPC_A,  Html5QrcodeSupportedFormats.UPC_E,
            Html5QrcodeSupportedFormats.CODE_128, Html5QrcodeSupportedFormats.CODE_39,
            Html5QrcodeSupportedFormats.CODE_93, Html5QrcodeSupportedFormats.ITF,
            Html5QrcodeSupportedFormats.QR_CODE
          ]
        });
        await sc.start(
          {facingMode:'environment'},                                       /* กล้องหลังเสมอ */
          {fps:25, qrbox:{width:Math.min(320, Math.round(window.innerWidth*0.78)), height:180},
           aspectRatio:window.innerHeight/window.innerWidth,
           videoConstraints:{facingMode:'environment', width:{ideal:1920}, height:{ideal:1080}}},
          txt => done(txt, false),
          ()=>{}                                                            /* frame ที่อ่านไม่ออก = เงียบไว้ */
        );
        try{ await sc.applyVideoConstraints({advanced:[{zoom:1.5}]}); }catch(e){}   /* บาร์โค้ดเล็กอ่านง่ายขึ้น */
        const cap = sc.getRunningTrackCapabilities ? sc.getRunningTrackCapabilities() : {};
        if (cap && 'torch' in cap) el.querySelector('.rk-sc-torch').style.display = '';
      }catch(e){
        err('เปิดกล้องไม่ได้ (' + (e && e.name ? e.name : 'error') + ') — เช็คสิทธิ์กล้องในเบราว์เซอร์ หรือพิมพ์เลขบาร์โค้ดแทน');
        setTimeout(()=>{ const i = el.querySelector('.rk-sc-manual input'); i && i.focus(); }, 100);
      }
    });
  };

  RK.scan.close = function(){
    if (!el || !el.classList.contains('on')) return;
    const cancelled = !busy;                          /* ปิดเองทั้งที่ยังไม่ติด = "กดย้อนกลับ" */
    el.classList.remove('on');
    document.body.style.overflow = '';
    release();
    if (cancelled && opt.onCancel) opt.onCancel();    /* ให้แอปเคลียร์ผลสแกนรอบก่อนทิ้ง */
  };
})();
</script>

function defectRows(){                                         /* [{p, n, wh, why, choice, status}] ใช้ทั้งจอ dead และการ์ดสินค้า */

}

/* คลังนี้มีปัญหาอะไรบ้าง — ขายช้า (เก็บได้เกิน 30 วัน) · ไม่ขายเลย · มีของเสีย */
function whIssues(p, wh){
  var st = (p.st || {})[wh] || 0;
  var avg = (AVG60[p.id] || {})[wh] || 0;
  var def = ((DEFECT[p.id] || {})[wh] || {}).n || 0;
  var out = [];
  if (def) out.push({ k:'def', t:'ของเสีย ' + fmtN(def) + ' ลัง' });
  if (st > 0 && !avg) out.push({ k:'dead', t:'ไม่ขายเลย' });
  else if (st > 0 && avg) {
    var cover = Math.round(st * p.ea / avg);                   /* AVERAGE 60D = ชิ้น/วัน อยู่แล้ว ห้ามหาร 60 */
    if (cover > 30) out.push({ k:'slow', t:'ขายช้า ' + cover + ' วัน' });
  }
  return out;
}
function prodIssues(p){
  var rows = [];
  Object.keys(WH).forEach(function (w) {
    var is = whIssues(p, w);
    if (is.length) rows.push({ wh:w, st:(p.st || {})[w] || 0, iss:is, ib:daysSince((IBAT[p.id] || {})[w]) });
  });
  return rows.sort(function (a, b) { return b.st - a.st; });   /* คลังที่มีของค้างมากสุดขึ้นก่อน */
}

   เพิ่งรับเข้าไม่ถึง 60 วัน ไม่นับ — ยอดขายเฉลี่ยยังไม่ทันขึ้น ไม่ใช่ของค้าง */
function stuckStock(p){
  var n = 0;
  Object.keys(WH).forEach(function (w) {

    if ((p.st[w] || 0) > 0 && !((AVG60[p.id] || {})[w]) && (age == null || age > 60)) n += p.st[w];

}

  if (u === 'EA') return 1;
  if (u === 'CS') return p.ea || 0;

  return x || (u === 'PA' ? p.pa : 0) || 0;

function lossList(p, csCost){
  var out = [];
  TIERS.forEach(function (r) {
    var tbl = p[r.k] || {};
    ['CS','PA','EA'].forEach(function (u) {
      var sell = tbl[u]; if (!sell) return;
      var cost = costPer(p, u, csCost); if (!cost) return;
      if (sell < cost - 0.005) out.push({ tier:r.t, code:r.c, unit:UNIT_TH[u], sell:sell, cost:cost, gap:cost - sell });
    });

/* ราคาในใบสั่งซื้อ (หน่วยตามบรรทัด · ก่อน VAT) → ต้นทุนต่อลังที่ใช้เทียบกับราคาขาย

function csCostOf(p, u, price){

  var n = perCS(p, u);

/* ══ ตารางคิวลงสินค้า — คิดจาก "ช่องจอด (bay) × เวลา" ไม่ใช่ช่องเวลาตายตัว ══
   คลังมี bay จำกัด · งานแต่ละเที่ยวกินเวลาไม่เท่ากัน
   เวลาเริ่มจะกดได้ก็ต่อเมื่อ ตลอดช่วงที่จะลง มี bay ว่างครบทุกนาที
   ค่าทุกตัวมาจากแท็บ Booking Config ในชีทของแอป (ปรับในชีทได้ไม่ต้องแก้โค้ด)                 */
var BOOKCFG = {}, BUSY = {};
var TODAY = { y:2569, m:1, d:1 }, NOWMIN = 0, NOW_AT = Date.now();
var CFG_DEF = { bays:4, open:360, close:960, slotMin:30, breakStart:720, breakEnd:780, daysClosed:['อา.'],
                maxDur:180, aheadDays:14, leadHours:12, cancelFreeHours:6, noShowLimit:3 };
function mins(t){ var a = String(t).split(':'); return +a[0] * 60 + +a[1]; }
function cfgOf(res){
  var c = BOOKCFG[res] || (/-DEF$/.test(res) ? BOOKCFG['W1-DEF'] : BOOKCFG.W1) || CFG_DEF;
  return { bays:c.bays || 1, open:c.open != null ? c.open : 360, close:c.close != null ? c.close : 960,
           bkFrom:c.breakStart != null ? c.breakStart : -1, bkTo:c.breakEnd != null ? c.breakEnd : -1,
           slot:c.slotMin || 30, closed:c.daysClosed || [], maxDur:c.maxDur || 180,
           ahead:c.aheadDays != null ? c.aheadDays : 14, leadH:c.leadHours || 0,
           cancelH:c.cancelFreeHours != null ? c.cancelFreeHours : 6, noShow:c.noShowLimit || 3 };
}
function slotMin(){ return cfgOf(resOf()).slot; }
/* งานหนึ่งเที่ยวกินกี่ช่อง — ปัดขึ้นเสมอ เช่น แจ้ง 45 นาที ช่องละ 30 = กิน 2 ช่อง */
function slotsFor(dur){ return Math.max(1, Math.ceil(dur / slotMin())); }

function hhmm(m){ m = ((m % 1440) + 1440) % 1440; return pad2(Math.floor(m / 60)) + ':' + pad2(m % 60); }
/* คิวที่ทุกเจ้าจองไว้แล้ว (หลังบ้านบอกแค่ช่วงเวลา ไม่บอกว่าใคร) — [เริ่ม(นาที), กี่นาที] */
function busyList(res, day){ return BUSY[res + '|' + isoOf(S.by, S.bm, +day)] || []; }

/* ช่องเวลาที่เปิดให้เลือกของวันนั้น — ข้ามช่วงพัก */
function slotStarts(res){
  var c = cfgOf(res), out = [];
  for (var t = c.open; t + c.slot <= c.close; t += c.slot) {
    if (c.bkFrom >= 0 && t >= c.bkFrom && t < c.bkTo) continue;
    out.push(t);
  }
  return out;
}
/* มีกี่คันจองทับช่วง [t, t+ช่อง) ไว้แล้ว — นับตามช่วงเวลาจริง (คิวเก่าที่จองตอนช่องยังยาวไม่เท่านี้ก็นับถูก) · ตรงกับหลังบ้าน */
function usedAt(res, day, t){
  var n = 0, t2 = t + cfgOf(res).slot;
  busyList(res, day).forEach(function (b) { if (b[0] < t2 && b[0] + b[1] > t) n++; });
  return n;
}
/* เริ่ม start แล้วกินกี่ช่องตามเวลาที่แจ้ง ลงได้ไหม — ทุกช่องต้องมีที่ว่าง */
function fits(res, day, start, dur){
  var c = cfgOf(res), need = Math.max(1, Math.ceil(dur / c.slot)), tight = false;
  for (var i = 0; i < need; i++) {
    var t = start + i * c.slot;
    if (t + c.slot > c.close) return 'closed';
    if (c.bkFrom >= 0 && t < c.bkTo && t + c.slot > c.bkFrom) return 'break';
    var u = usedAt(res, day, t);
    if (u >= c.bays) return 'full';
    if (u === c.bays - 1) tight = true;
  }
  return tight ? 'tight' : 'free';
}
function blockMin(dur){ return slotsFor(dur) * slotMin(); }   /* คลังกันช่องถึงนาทีนี้ */
/* แนะนำเวลาจากจำนวนพาเลท — เอกสาร 15 นาที + 5 นาทีต่อพาเลท ปัดขึ้นทีละ 15 */
var DURS = [30, 45, 60, 90, 120, 150, 180];
function maxDur(){ return cfgOf(resOf()).maxDur; }
function rawDur(pallets){ return Math.ceil((15 + pallets * 5) / 15) * 15; }
function suggestDur(pallets){
  var m = rawDur(pallets), list = DURS.filter(function (x) { return x <= maxDur(); });
  for (var i = 0; i < list.length; i++) if (list[i] >= m) return list[i];
  return list[list.length - 1] || 30;                  /* เกินสุด = ต้องแบ่งเที่ยว */
}
function needSplit(pallets){ return pallets > 0 && rawDur(pallets) > maxDur(); }

/* ══ นัดหมาย 2 ประเภท ══
   load = ลงสินค้า (ใช้ช่องจอดที่คลัง)
   meet = นัดอื่นๆ — จัดซื้อ · บัญชี · ของเสีย (ใช้โต๊ะ/จุดรับที่ต่างกัน)   */
var TOPICS = {
  buy:    { n:'จัดซื้อ', s:'คุยราคา · เสนอสินค้าใหม่ · โปรโมชั่น', at:'HQ' },
  acct:   { n:'บัญชี',   s:'วางบิล · รับเช็ค · ภาษี',              at:'HQ' },
  defect: { n:'ของเสีย', s:'ส่งคืน · รับกลับ · ออกใบ CN',          at:'wh' }
};
var DURS_MEET = [30, 60, 90];

function gDate(y, m, d){ return new Date(y - 543, m - 1, d); }
function dowOf(y, m, d){ return gDate(y, m, d).getDay(); }
function daysIn(y, m){ return new Date(y - 543, m, 0).getDate(); }
function dayGap(y, m, d){                         /* ห่างจากวันนี้กี่วัน */
  return Math.round((gDate(y, m, d) - gDate(TODAY.y, TODAY.m, TODAY.d)) / 86400000);
}
function thDate(y, m, d){ return d + ' ' + MON_TH[m - 1] + ' ' + y; }
function addDays(y, m, d, n){                     /* บวกวันแล้วข้ามเดือนให้ถูก */
  var g = gDate(y, m, d); g.setDate(g.getDate() + n);
  return { y:g.getFullYear() + 543, m:g.getMonth() + 1, d:g.getDate() };
}

function isMeet(){ return S.bkType === 'meet'; }
function topic(){ return TOPICS[S.topic] || TOPICS.buy; }
function resOf(){                                  /* ทรัพยากรที่ถูกจอง */
  if (!isMeet()) return lockWh() || S.wh;           /* ลงสินค้า = คลังของใบสั่งซื้อที่เลือกเสมอ (กันสลับไปนัดของเสียแล้วคลังเพี้ยน) */
  return topic().at === 'HQ' ? ('HQ-' + S.topic) : (meetWh() + '-DEF');
}
/* จุดรับของเสียมีเฉพาะ 5 คลังหลัก — เคยเลือก PO คลังฝาก (เช่น SD) มาก่อน ไม่ให้กลายเป็นนัด SD-DEF ที่ไม่มีจริง */
function meetWh(){ return WH[S.wh] ? S.wh : Object.keys(WH)[0]; }
function placeName(){ return (isMeet() && topic().at === 'HQ') ? 'HQ สำนักงานใหญ่' : whName(isMeet() ? meetWh() : resOf()); }
function durList(){ var mx = maxDur(); return (isMeet() ? DURS_MEET : DURS).filter(function (x) { return x <= mx; }); }
function rules(){ var c = cfgOf(resOf()); return { ahead:c.ahead, lead:c.leadH, cancelH:c.cancelH, noShow:c.noShow }; }
function leadMin(){ return rules().lead * 60; }
/* เวลาเริ่มที่เร็วที่สุดของวันที่ห่างไป gap วัน — ติดลบ = ทั้งวันจองได้ */
function earliest(gap){ return nowMin() + leadMin() - gap * 1440; }

function freeStarts(y, m, d){
  var res = resOf(), gap = dayGap(y, m, d), lo = earliest(gap), dd = pad2(d);
  return slotStarts(res).filter(function (t) {
    if (t < lo) return false;
    var f = fits(res, dd, t, S.dur);
    return f === 'free' || f === 'tight';
  });
}
function dayInfo(y, m, d){
  var gap = dayGap(y, m, d);
  if (gap < 0) return { st:'past', n:0 };
  if (gap > rules().ahead) return { st:'far', n:0 };
  if (cfgOf(resOf()).closed.indexOf(DOW_TH[dowOf(y, m, d)]) >= 0) return { st:'closed', n:0 };
  var saveBy = S.by, saveBm = S.bm; S.by = y; S.bm = m;          /* busyList อ่านเดือน/ปีจาก S */
  var n = freeStarts(y, m, d).length;
  S.by = saveBy; S.bm = saveBm;
  return { st: n === 0 ? 'full' : (n >= 6 ? 'many' : 'few'), n:n };
}
function pickedGap(){ return dayGap(S.by, S.bm, +S.day); }
/* ยกเลิกฟรีถึงเมื่อไร — สูตรเดียวกับหลังบ้าน: ก่อนเวลานัด cancelH ชม. · จองเข้ามาหลังเส้นนั้น = ได้ 30 นาทีหลังจอง (ไม่เกินเวลาเริ่ม) */
function freeCancel(){
  var start = (S.slotM != null ? S.slotM : 510) + pickedGap() * 1440;
  var abs = Math.min(start, Math.max(start - rules().cancelH * 60, nowMin() + 30));
  var off = Math.floor(abs / 1440), m = ((abs % 1440) + 1440) % 1440;
  var t = addDays(TODAY.y, TODAY.m, TODAY.d, off);
  return t.d + ' ' + MON_TH[t.m - 1] + ' ' + hhmm(m) + ' น.';
}
function lastDay(){ return addDays(TODAY.y, TODAY.m, TODAY.d, rules().ahead); }

/* ใบสั่งซื้อที่จองคิวได้ = ยืนยันแล้ว (หรือส่งบางส่วน) และยังไม่มีคิว · เลือกได้หลายใบ แต่ต้องคลังเดียวกัน */
function poBookable(){ return POS.filter(function (p) { return p.bookable; }); }
function poPicked(){ return poBookable().filter(function (p) { return S.poSel[p.id]; }); }
function bookPal(){ var t = 0; poPicked().forEach(function (p) { t += palOf(p); }); return t; }
function lockWh(){ var a = poPicked(); return a.length ? a[0].wh : null; }   /* คลังถูกล็อกโดยใบแรกที่เลือก */
function palOf(p){ return +p.pallets || 1; }

V.book = function () {
  var res = resOf(), c = cfgOf(res), cap = c.bays;
  var pal = bookPal(), sug = suggestDur(pal), need = slotsFor(S.dur);
  var gap = pickedGap(), lo = earliest(gap);
  var starts = slotStarts(res);
  var am = starts.filter(function (t) { return t < 12 * 60; });
  var pm = starts.filter(function (t) { return t >= 12 * 60; });
  var dSt = dayInfo(S.by, S.bm, +S.day).st, dayOff = dSt === 'past' || dSt === 'far' || dSt === 'closed';
  if (S.slotM != null) {                             /* ช่องที่เคยเลือก เต็ม/กระชั้น/เลยเวลาไปแล้ว = ล้างทิ้ง ไม่ค้าง "เลือกอยู่" ให้กดถัดไปได้ */
    var st0 = dayOff ? 'dayoff' : S.slotM < lo ? 'lead' : starts.indexOf(S.slotM) < 0 ? 'gone' : fits(res, pad2(+S.day), S.slotM, S.dur);
    if (st0 !== 'free' && st0 !== 'tight') { S.slotM = null; S.slot = ''; }
  }
  var okCount = dayOff ? 0 : freeStarts(S.by, S.bm, +S.day).length;
  var nDays = daysIn(S.by, S.bm);
  var ld = lastDay(), ym = S.by * 12 + S.bm;
  var pos = poBookable(), picked = poPicked(), lw = lockWh();
  var ready = isMeet() ? true : picked.length > 0;
  var brk = c.bkFrom >= 0 ? '<span class="chip grey">พัก ' + hhmm(c.bkFrom) + '–' + hhmm(c.bkTo) + '</span>' : '';

  function slot(t){
    var st = dayOff ? 'dayoff' : t < lo ? 'lead' : fits(res, pad2(+S.day), t, S.dur);
    var on = S.slotM === t && !dayOff;
    var dead = (st === 'full' || st === 'closed' || st === 'break' || st === 'lead' || st === 'dayoff');
    var cls = 'slot2' + (on ? ' on' : dead ? ' off' : st === 'tight' ? ' tight' : ' ok');
    var sub = on ? 'เลือกอยู่'
            : st === 'dayoff' ? (dSt === 'closed' ? 'วันหยุด' : 'จองไม่ได้')
            : st === 'lead' ? 'กระชั้นไป'
            : st === 'closed' ? 'เลยเวลาปิด'
            : st === 'break' ? 'ชนพักเที่ยง'
            : st === 'full' ? 'คิวเต็ม'
            : '→ ' + hhmm(t + need * c.slot);
    return '<button class="' + cls + '"' + (dead ? ' disabled' : '') + ' aria-pressed="' + on + '" data-act="slotm:' + t + '">'+
      '<span class="t">' + hhmm(t) + '</span><span class="c">' + sub + '</span></button>';
  }

  var days = [];
  for (var d = 1; d <= nDays; d++) {
    var inf = dayInfo(S.by, S.bm, d), on = (+S.day === d);
    var dead = inf.st === 'past' || inf.st === 'far' || inf.st === 'closed' || inf.st === 'full';
    days.push('<button class="daycell dc-' + inf.st + (on ? ' on' : '') + '"' + (dead ? ' disabled' : '')+
      ' aria-pressed="' + on + '" data-act="day:' + pad2(d) + '"'+
      ' title="' + thDate(S.by, S.bm, d) + (dead ? '' : ' · ว่าง ' + inf.n + ' ช่วง') + '">'+
      '<span class="d">' + DOW_TH[dowOf(S.by, S.bm, d)] + '</span>'+
      '<span class="n">' + d + '</span>'+
      '<span class="dot"></span></button>');

/* ══ ใบสั่งซื้อ ══ */
var POF = {
  all:     function () { return true; },
  pending: function (p) { return p.state === 'รอยืนยัน'; },
  review:  function (p) { return p.state === 'รอจัดซื้อตรวจ'; },
  nobook:  function (p) { return p.bookable; },
  going:   function (p) { return !p.bookable && (p.state === 'จองคิวแล้ว' || p.state === 'ส่งบางส่วน'); },
  done:    function (p) { return p.state === 'ส่งครบแล้ว'; }
};
V.po = function () {
  var f = POF[S.filter] ? S.filter : 'all', words = S.q.trim().toLowerCase().split(/\s+/).filter(Boolean);
  var list = POS.filter(POF[f]);                  /* หลังบ้านเรียงให้แล้ว: กำหนดส่งเร็วสุดก่อน · ส่งครบแล้วอยู่ท้าย */
  if (words.length) list = list.filter(function (p) { var h = hay(p); return words.every(function (w) { return h.indexOf(w) >= 0; }); });
  function n(k){ return POS.filter(POF[k]).length; }
  var chips = [['all','ทั้งหมด '+POS.length],['pending','รอยืนยัน '+n('pending')]];
  if (n('review')) chips.push(['review','รอจัดซื้อตรวจ '+n('review')]);
  chips.push(['nobook','ยังไม่จองคิว '+n('nobook')],['going','กำลังส่ง '+n('going')],['done','ส่งครบ '+n('done')]);
  return '<div class="scr" id="s-po">'+
    hdr('ใบสั่งซื้อ','home')+

      '<div class="sb'+(S.q?' has':'')+'">'+ic('search',18,'var(--ink-4)')+

      '<button class="x" data-act="clearq" aria-label="ล้างการค้นหาและฟิลเตอร์">✕</button></div>'+
      '<div class="filters" style="margin-top:10px">'+chips.map(function (c) {
        return '<button class="tag" style="border-color:#3D64A8;background:'+(f===c[0]?'#fff':'transparent')+';color:'+(f===c[0]?'var(--navy)':'var(--on-navy-3)')+'" aria-pressed="'+(f===c[0])+'" data-act="filter:'+c[0]+'">'+c[1]+'</button>';
      }).join('')+'</div>'+
    '</div>'+
    '<div class="body" data-tweak="ลิสต์ใบสั่งซื้อ" style="gap:var(--gap-card)">'+
      (list.length ? list.map(poCard).join('')
        : '<div class="empty">'+(POS.length ? 'ไม่พบใบสั่งซื้อที่ตรงกับที่ค้น' : 'ยังไม่มีใบสั่งซื้อใน 120 วันที่ผ่านมา')+'</div>')+
    '</div></div>';
};
/* ค้นได้ทุกช่องของใบสั่งซื้อ — เลข · สถานะ · คลัง · วันที่ · หมายเหตุ · ชื่อ/รหัส/บาร์โค้ดสินค้า */
function hay(p){
  if (p._hay) return p._hay;
  var parts = [p.id, p.state, p.wh, whName(p.wh), p.dueTh, thLong(p.due), thLong(p.date), p.remark];
  p.lines.concat(p.free || []).forEach(function (l) {
    var x = P[l.p] || {};
    parts.push(x.name, x.full, x.brand, x.size, x.cs, (x.codes || []).join(' '), l.code, l.name);
  });
  return (p._hay = parts.join(' ').toLowerCase());
}

}

/* ══ ยืนยัน PO — ช่องจำนวน/ราคาขึ้นมาให้เลย แก้ได้ทันที
   ตัวเลขตั้งต้น = ของที่จัดซื้อเปิดบิลไว้ · แก้ตรงไหน ต้องเลือกเหตุผล + ติ๊กยืนยันตรงนั้น
   ที่แก้จะถูกส่งไปเก็บแยก (แท็บ PO Reply Lines) ไม่ทับใบสั่งซื้อเดิมในระบบ          ══ */
function poDiffs(po){
  var out = [];
  po.lines.forEach(function (l) {
    var p = P[l.p], k = ckey(po, l), q = lineQty(po, l), pr = linePrice(po, l);
    if (q !== l.qty) out.push({ k:k, l:l, name:p.name, f:'จำนวน', from:fmtN(l.qty) + ' ' + l.u, to:fmtN(q) + ' ' + l.u });
    if (pr !== l.up) out.push({ k:k, l:l, name:p.name, f:'ราคา',  from:baht2(l.up) + '/' + l.u, to:baht2(pr) + '/' + l.u });
  });
  return out;
}
function poEdited(po){
  var seen = {}, out = [];
  poDiffs(po).forEach(function (d) { if (!seen[d.k]) { seen[d.k] = 1; out.push(d.k); } });
  return out;
}
function noteOf(po){ return String(S.note[po.id] || ''); }
/* ของแถม: ติ๊กว่าถูกต้อง หรือ ไม่ติ๊กแต่เขียนหมายเหตุ (= แถมไม่ตรง → หลังบ้านส่งให้จัดซื้อตรวจ ไม่ยืนยันทันที) */
function confSteps(po){
  var s = poSums(po), ed = poEdited(po);
  return [ { t:'จำนวน · ราคา', done: ed.every(function (k) { return S.lineOk[k] === true && !!S.why[k]; }) },
           { t:'ยอดรวม VAT',   done: S.ack[po.id+'|amt'] === s.gross },
           { t:'ของแถม',       done: !!S.ack[po.id+'|free'] || (poFree(po).length > 0 && !!noteOf(po).trim()) } ];
}
function ackBox(id, k, label, on){
  return '<label class="ack'+(on?' on':'')+'"><input type="checkbox" id="'+id+'" '+(on?'checked':'')+' data-ack="'+k+'">'+
    '<span class="one">'+esc(label)+'</span></label>';
}
function bahtP(n){ return (Math.round(n * 100) % 100) ? baht2(n) : baht(n); }
/* ราคาที่รัตนขายต่อ + เตือนถ้าต้นทุนใหม่ทำให้ขายขาดทุน */
function sellBlock(p, csCost){
  if (!hasSell(p)) return '';
  var loss = lossList(p, csCost);
  var conv = '1 ลัง = ' + p.ea + ' ชิ้น' + (p.pa ? ' · ' + fmtN(perCS(p,'PA')) + ' แพ็ค (แพ็คละ ' + p.pa + ' ชิ้น)' : ' · ไม่มีแพ็ค');
  return '<div class="sellb'+(loss.length ? ' bad' : '')+'">'+
    '<div class="one conv">'+conv+' · ต้นทุน/ชิ้น'+(LOSS_INC_VAT ? ' รวม VAT ' : ' ก่อน VAT ')+(csCost ? baht2(csCost / (p.ea || 1)) : '—')+'</div>'+
    '<div class="sells">'+TIERS.map(function (r) {
      var v = (p[r.k] || {}).CS; if (!v) return '';
      var bad = v < csCost - 0.005;
      return '<span'+(bad ? ' class="bad"' : '')+'>'+r.c+' '+bahtP(v)+'/ลัง</span>';
    }).join('')+'</div>'+
    (loss.length
      ? '<div class="lossb">'+
          '<div class="lh">ราคานี้รัตนขายขาดทุน '+loss.length+' จุด</div>'+
          loss.map(function (x) {
            return '<div class="lr"><span class="grow one">'+x.tier+' '+x.code+' · '+x.unit+'</span>'+
              '<b>ขาดทุน '+baht2(x.gap)+'</b></div>'+
              '<div class="lx">ขาย '+baht2(x.sell)+' · ต้นทุน '+baht2(x.cost)+'</div>';
          }).join('')+'</div>'
      : '')+
  '</div>';
}
function lineLoss(po, l){ return lossList(P[l.p], lossCost(P[l.p], l, linePrice(po, l))); }
function poLossCount(po){
  var n = 0;
  po.lines.forEach(function (l) { if (lineLoss(po, l).length) n++; });
  return n;
}
function applyFix(attr, value){
  var a = attr.split('|'), fld = a.pop(), k = +a.pop(), pid = a.join('|');
  var po = poById(pid); if (!po) return null;
  var line = po.lines[k]; if (!line) return null;
  var key = ckey(po, line);
  var head = (fld === 'qty') ? line.qty : line.up;
  var v = Number(String(value).replace(/,/g, ''));
  if (!isFinite(v) || v < 0) v = 0;
  if (fld === 'price') v = round2(v);
  if (v === head) {
    if (S.fixes[key]) { delete S.fixes[key][fld]; if (!Object.keys(S.fixes[key]).length) delete S.fixes[key]; }
  } else {
    S.fixes[key] = S.fixes[key] || {}; S.fixes[key][fld] = v;
  }
  if (!S.fixes[key]) { delete S.lineOk[key]; delete S.why[key]; }   /* กลับมาตรงแล้ว ไม่ต้องยืนยัน */
  return po;
}

/* อัปเดตยอดสดตอนพิมพ์ ไม่ re-render จะได้ไม่หลุดโฟกัส · การ์ดจะอัปเดตเต็มตอนออกจากช่อง */
function paintSums(po){
  var s = poSums(po);
  var set = function (id, v) { var e = document.getElementById(id); if (e) e.textContent = v; };
  set('sumnet', baht2(s.net)); set('sumvat', baht2(s.vat));
  set('sumgross', baht2(s.gross)); set('fixtotal', baht2(s.gross));
  po.lines.forEach(function (l) { set('amt-' + l.k, baht2(lineAmt(po, l))); });
  if (S.ack[po.id+'|amt'] != null && S.ack[po.id+'|amt'] !== s.gross) {   /* ยอดเปลี่ยน = ที่ติ๊กไว้ใช้ไม่ได้ */
    delete S.ack[po.id+'|amt'];
    var c = document.getElementById('ackamt');
    if (c) { c.checked = false; c.parentNode.classList.remove('on'); }
  }
  paintSteps(po);
}
function paintSteps(po){                                       /* แถบ "ยังขาด" + ปุ่มส่ง อัปเดตสดโดยไม่วาดจอใหม่ */
  var left = confSteps(po).filter(function (x) { return !x.done; });
  var n = document.getElementById('needline');
  if (n) {
    n.textContent = left.length ? 'ยังขาด · '+left.map(function (x) { return x.t; }).join(' · ') : 'ตอบครบ 3 ข้อแล้ว ส่งได้เลย';
    n.style.color = left.length ? 'var(--clay)' : 'var(--teal)';
  }
  var b = document.getElementById('sendbtn');
  if (b) { b.classList.toggle('off', !!left.length); b.classList.toggle('gold', !left.length); }
}

/* ══ สินค้าของฉัน ══ */
function prodHay(p){
  if (p._hay) return p._hay;
  return (p._hay = [p.name, p.full, p.brand, p.size, p.cs, p.id, (p.codes || []).join(' '), p.status, p.unitCs, (p.miss || []).join(' ')]
    .join(' ').toLowerCase());
}
V.products = function () {
  var words = S.pq.trim().toLowerCase().split(/\s+/).filter(Boolean);
  var real = PRODUCTS.filter(function (p) { return !p.stub; });
  var missN = real.filter(function (p) { return p.miss.length; }).length;
  var badN  = real.filter(function (p) { return prodIssues(p).length; }).length;
  var list = PRODUCTS.filter(function (p) {
    if (S.pfilter === 'miss' && !(p.miss.length && !p.stub)) return false;
    if (S.pfilter === 'bad'  && (p.stub || !prodIssues(p).length)) return false;
    var h = prodHay(p);
    return words.every(function (w) { return h.indexOf(w) >= 0; });
  });
  var bad = S.pfilter === 'bad';
  /* หน้านี้เรื่องของค้าง → จัดอันดับด้วยสต็อกที่มีปัญหา · หน้าอื่นใช้มูลค่าขาย */
  function val(p){ return bad ? issueStock(p) : p.val; }
  var groups = brandGroups(list, function (p) { return p; }, val);
  var sales = 0; real.forEach(function (p) { sales += p.val; });
  return '<div class="scr" id="s-products">'+
    '<div class="hero" style="padding-bottom:34px">'+
      '<div class="flexrow">'+

function fmtK(n){                                             /* ตัวเลขยาวย่อหน่วยให้อยู่บรรทัดเดียว เช่น 12.5K */
  n = +n || 0; var a = Math.abs(n);

  if (a >= 1e4) return round1(n / 1e3) + 'K';

}

  var n = 0;
  po.lines.forEach(function (l) { if (l.p === p.id) n += toCS(p, l.u, l.qty); });
  (po.free || []).forEach(function (f) { if (f.p === p.id) n += toCS(p, unitCode(f.unit), f.qty); });

}

   วางหน้ากัน 1 ชั้นใน history ไว้เสมอเมื่อไม่ได้อยู่หน้าแรก · อยู่หน้าแรกแล้วกดย้อน = ออกจากแอปตามปกติ */
var TRAP = false, SKIP_POP = false;
function atRoot(){ return (S.route === 'home' || S.route === 'line') && !S.hist.length; }
function syncTrap(){
  if (!APP_ON) return;

    if (!atRoot() && !TRAP) { history.pushState({ slTrap:1 }, '', location.href); TRAP = true; }

}
window.addEventListener('popstate', function () {

  else if (scan && scan.classList.contains('on') && window.RK && RK.scan) RK.scan.close();
