/* ══ ของค้างสต็อก · ของเสีย — แยก 3 หน้า (แบบในผืน "SupplyLink ของค้างสต็อก · ของเสีย" · Surat ให้ทำ 2026-09-24) ══ */
function statHdr(title, stats, cap){
  return '<div class="hdr stack" data-tweak="หัวจอ">'+
    '<div class="flexrow" style="gap:var(--sp-3)"><button class="iconbtn back" data-act="back:home" aria-label="ย้อนกลับ">'+ic('back',21)+'</button>'+
      '<span class="grow one hdr-t">'+esc(title)+'</span></div>'+
    '<div class="hstats">'+stats.map(function (t) {
      return '<div class="hstat"><span class="l">'+esc(t[0])+'</span><span class="v">'+esc(t[1])+(t[2] ? ' <small>'+esc(t[2])+'</small>' : '')+'</span></div>';
    }).join('')+'</div>'+
    '<div class="one hcap" title="'+esc(cap)+'">'+esc(cap)+'</div></div>';
}
function agingChip(x, k){
  if (x.cover == null) return k === 'risk' ? '<span class="chip clay">ไม่มียอดขาย</span>' : '<span class="chip grey">ยังไม่มียอดขาย</span>';
  if (k === 'risk') return x.cover > 365 ? '<span class="chip clay">พอขายเกิน 1 ปี</span>' : '<span class="chip claysoft">พอขาย '+fmtN(x.cover)+' วัน</span>';
  return '<span class="chip goldsoft">พอขาย '+fmtN(x.cover)+' วัน</span>';
}
function agingMeta(x){                                        /* ค้างเท่าไร อยู่คลังไหน — หลายคลังบอกจำนวนแต่ละคลัง */
  var p = x.p, ws = Object.keys(WH).filter(function (w) { return (p.stEA[w] || 0) > 0; })
    .sort(function (a, b) { return p.stEA[b] - p.stEA[a]; });
  return qtyCS(x.ea, p.ea) + ' · ' + (ws.length === 1 ? whName(ws[0])
    : ws.map(function (w) { return whName(w) + ' ' + fmtQ(round1(p.stEA[w] / p.ea)); }).join(' · '));
}
function agingScreen(k){
  var risk = k === 'risk', list = agingList(k), tot = 0;
  list.forEach(function (x) { tot += x.cs; });
  var groups = brandGroups(list, function (x) { return x.p; }, function (x) { return x.cs; });
  return '<div class="scr" id="s-'+k+'">'+
    statHdr(risk ? 'เสี่ยงหมดอายุ' : 'สินค้าไม่ขยับ · ไม่ขาย', [['รายการ', String(list.length)], ['ค้างในคลัง', csSum(tot), 'ลัง']],
      risk ? 'พอขายเกิน 90 วัน หรือรับเข้าเกิน 90 วันแล้วยังไม่มีขาย' : 'พอขายอีก 61–90 วัน หรือยังไม่มียอดขายตั้งแต่รับเข้า')+
    '<div class="body" data-tweak="'+(risk ? 'เสี่ยงหมดอายุ' : 'สินค้าไม่ขยับ')+'">'+
      (groups.length ? groups.map(function (g) {
        return '<div class="grp"><div class="grp-h"><b class="grow one">'+esc(g.brand === '-' ? 'อื่นๆ' : g.brand)+'</b>'+
            '<span class="t">'+csSum(g.total)+' ลัง</span></div>'+
          '<div class="rows">'+g.items.map(function (x) {
            var meta = agingMeta(x);
            return '<button class="agrow" data-act="prod:'+esc(x.p.id)+'" data-tweak-card="แถวสินค้าค้าง">'+
              '<span class="thumb" style="background:'+x.p.bg+'">'+art(x.p,20)+'</span>'+
              '<span class="grow"><span class="one r-nm" title="'+esc(x.p.full || x.p.name)+'">'+esc(x.p.name)+'</span>'+
              '<span class="one r-mt" title="'+esc(meta)+'">'+esc(meta)+'</span></span>'+agingChip(x, k)+'</button>';
          }).join('')+'</div></div>';
      }).join('') : '<div class="empty">'+(risk ? 'ไม่มีสินค้าเสี่ยงหมดอายุ' : 'ไม่มีสินค้าไม่ขยับ')+'</div>')+
    '</div></div>';
}

/* ── ของเสีย: ติ๊กหลายรายการ (ลากติ๊กได้) → เลือกวิธีเดียว + วันที่จะเข้ามา → ส่งนัด ── */
function keyParts(k){ k = String(k); var i = k.lastIndexOf('|'); return { p:k.slice(0, i), w:k.slice(i + 1) }; }
function defOf(k){ var kp = keyParts(k); return (DEFECT[kp.p] || {})[kp.w] || null; }
function tickBtn(state, act, label){                          /* ช่องติ๊ก 44px — ของแถว = ที่จับลาก (ไม่มี data-act) · ทั้งคลัง/ทั้งหมด = ปุ่มกดปกติ */
  return '<button class="tick" type="button" aria-pressed="'+state+'" aria-label="'+esc(label)+'"'+(act ? ' data-act="'+esc(act)+'"' : ' data-tick')+'>'+
    '<i><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg><b class="mx"></b></i></button>';
}
function dselWhs(){                                          /* คลังของรายการที่ติ๊ก · ยังไม่ติ๊ก = ทุกคลังที่มีของรอเลือกวิธี */
  var all = [], sel = [];
  defIn('pending').forEach(function (d) {
    if (all.indexOf(d.wh) < 0) all.push(d.wh);
    if (S.dsel[d.key] && sel.indexOf(d.wh) < 0) sel.push(d.wh);
  });
  return sel.length ? sel : all;
}
function closedDays(whs){                                     /* วันปิดของจุดรับของเสีย (แท็บ Booking Config) · ไม่ได้ตั้ง = วันอาทิตย์ */
  var off = {};
  (whs && whs.length ? whs : ['W1']).forEach(function (w) { (cfgOf(w + '-DEF').closed || []).forEach(function (d) { off[d] = 1; }); });
  return off;
}
/* วันหยุดนักขัตที่คลังที่ติ๊กไว้ไม่รับเคลียร์ของเสีย (ชื่อวันหยุด · ว่าง = รับ) */
function defHol(whs, iso){ var n = ''; (whs && whs.length ? whs : ['W1']).forEach(function (w) { n = n || holOn(w + '-DEF', iso); }); return n; }
function quickDates(whs){                                     /* 3 วันทำการถัดไป เริ่มพรุ่งนี้ (ข้ามเสาร์-อาทิตย์ วันที่คลังปิด และวันหยุดนักขัต) */
  var off = closedDays(whs), out = [], t = todayIso();
  for (var i = 1; out.length < 3 && i < 40; i++) {
    var iso = isoAdd(t, i), dw = dowShort(iso);
    if (dw === 'ส.' || dw === 'อา.' || off[dw] || defHol(whs, iso)) continue;
    out.push(iso);
  }
  return out;
}
function howOpts(sel, act){
  return '<div class="optgrid c3">'+[['swap','เปลี่ยนสินค้า'],['cn','CN'],['none','ไม่รับคืน']].map(function (m) {
    return '<button class="opt" type="button" aria-pressed="'+(sel === m[0])+'" data-act="'+act+':'+m[0]+'">'+m[1]+'</button>';
  }).join('')+'</div>';
}
function dateOpts(sel, whs, act){
  var q = quickDates(whs), custom = !!sel && q.indexOf(sel) < 0;
  return '<div class="optgrid c4">'+q.map(function (iso) {
      return '<button class="opt" type="button" aria-pressed="'+(sel === iso)+'" data-act="'+act+':'+iso+'" title="'+esc(dayFull(iso))+'">'+esc(dayTh(iso))+'</button>';
    }).join('')+
    '<button class="opt" type="button" aria-pressed="'+custom+'" data-act="'+act+':pick"'+(custom ? ' title="'+esc(dayFull(sel))+'"' : '')+'>'+(custom ? esc(dayTh(sel)) : 'เลือกวัน')+'</button></div>';
}
function dayFull(iso){ var a = isoParts(iso); return a.y ? DOW_FULL[new Date(Date.UTC(a.y, a.m - 1, a.d)).getUTCDay()] + ' ' + thLong(iso) : ''; }
function sendBtn(ready, act, date, hint){
  if (S.sending) return '<button class="btn off" type="button" disabled>กำลังบันทึก…</button>';

  var late = apptGroups('late'), booked = apptGroups('booked'), pend = defIn('pending'), groups = defByWh(pend);

/* ── ส่งนัดแล้ว: สรุป + การ์ดที่เข้าแชท LINE กับ RTNPurchase ── */
function apptFacts(a){
  return [['วันนัด', dayTh(a.date) + ' ' + (isoParts(a.date).y + 543)], ['วิธีคืน', a.how],
          ['ของเสีย', a.n + ' รายการ · ' + csSum(a.cs) + ' ลัง'], ['คลัง', (a.wh || []).map(whDefName).join(' · ') || '—']];
}
function apptText(a){                                          /* ข้อความสำรอง (เปิดแชทพร้อมพิมพ์ไว้ให้) · ไม่มี emoji */
  return ['นัดเคลียร์ของเสีย', VENDOR.name + ' · ' + VENDOR.code].concat(apptFacts(a).map(function (f) { return f[0] + ': ' + f[1]; }), ['เลขนัด: ' + a.id]).join('\n');
}
function apptFlex(a){
  function row(k, v){ return { type:'box', layout:'baseline', spacing:'md', contents:[
    { type:'text', text:k, size:'sm', color:'#6F7C93', flex:2 },
    { type:'text', text:String(v || '—'), size:'sm', weight:'bold', color:'#0A1F47', flex:5, wrap:true } ] }; }
  return { type:'flex', altText:('นัดเคลียร์ของเสีย ' + dayTh(a.date) + ' · ' + a.how + ' · ' + a.n + ' รายการ').slice(0, 400),
    contents:{ type:'bubble', size:'kilo',
      header:{ type:'box', layout:'vertical', backgroundColor:'#0A1F47', paddingAll:'14px', spacing:'xs', contents:[
        { type:'text', text:'นัดเคลียร์ของเสีย', weight:'bold', size:'md', color:'#FFFFFF' },
        { type:'text', text:VENDOR.name + ' · ' + VENDOR.code, size:'xs', color:'#C0CEE8', wrap:true } ] },
      body:{ type:'box', layout:'vertical', spacing:'sm', paddingAll:'14px', contents:apptFacts(a).map(function (f) { return row(f[0], f[1]); }) },
      footer:{ type:'box', layout:'vertical', paddingAll:'10px', contents:[

/* ส่งการ์ดนัดเข้าแชท RTNPurchase ในชื่อของซัพ (liff.sendMessages · ต้องติ๊ก scope chat_message.write ใน LIFF)
   ส่งเองเฉพาะเปิดแอปจากเมนูในแชท RTNPurchase (ลิงก์เมนูมี ?src=menu) — LINE ไม่บอกว่าแชท 1:1 ที่เปิดอยู่เป็นของใคร เปิดจากแชทอื่นแล้วส่ง = การ์ดโผล่ผิดห้อง
   ส่งไม่ได้ = ปุ่มเปิดแชท RTNPurchase พร้อมพิมพ์ข้อความไว้ให้ ซัพกดส่งเอง */
function fromOaMenu(){
  var sp = null; try { sp = new URLSearchParams(location.search); } catch (e) {}
  if (/^(menu|oa)$/.test(QS.src || '') || (sp && /^(menu|oa)$/.test(sp.get('src') || ''))) return true;
  var st = sp && sp.get('liff.state');
  return !!(st && /[?&]src=(menu|oa)(&|$)/.test(st));
}
function sendApptLine(a){
  if (MODE === 'demo') return Promise.resolve('sent');
  if (ADMIN) return Promise.resolve('skip');
  var ctx = safe(function () { return liff.getContext(); }, null) || {};
  if (!inClient() || !fromOaMenu() || ctx.type !== 'utou') return Promise.resolve('manual');
  return withTimeout(liff.sendMessages([apptFlex(a)]), 10000, 'x').then(function () { return 'sent'; }, function () { return 'manual'; });
}
function apptChatUrl(a){ return 'https://line.me/R/oaMessage/' + encodeURIComponent(CONFIG.OA_ID) + '/?' + encodeURIComponent(apptText(a)); }

/* ── ปฏิทินเลือกวันนัด (ซ้อนบนแผ่นอื่นได้) · 6 สัปดาห์นับจากวันนี้ · วันที่คลังปิดกดไม่ได้ ── */
function openCal(target, whs, sel){ S.cal = { f:target, whs:whs || [], sel:sel || '' }; paintCal(); }
function paintCal(){
  var c = S.cal; if (!c) return;
  var off = closedDays(c.whs), t = todayIso(), lead = new Date(Date.parse(t + 'T00:00:00Z')).getUTCDay(), cells = [], shutAny = false, hols = [];
  for (var i = 0; i < lead; i++) cells.push('<span></span>');
  for (var j = 0; j < 42; j++) {
    var iso = isoAdd(t, j), a = isoParts(iso), dw = (lead + j) % 7, hol = defHol(c.whs, iso), shut = !!off[DOW_TH[dw]] || !!hol;
    if (shut) shutAny = true;
    if (hol) hols.push(thShort(iso) + ' ' + hol);
    cells.push('<button class="calc'+(j === 0 ? ' today' : '')+(hol ? ' hol' : '')+'" type="button"'+(shut ? ' disabled' : '')+' aria-pressed="'+(c.sel === iso)+'" data-act="calpick:'+iso+'"'+
      ' aria-label="'+esc(DOW_FULL[dw] + ' ' + thLong(iso) + (hol ? ' หยุด' + hol : ''))+'"'+(hol ? ' title="'+esc('หยุด' + hol)+'"' : '')+'>'+
      (a.d === 1 || j === 0 ? '<small>'+MON_TH[a.m - 1]+'</small>' : '')+a.d+'</button>');
  }
  var html = '<div class="sheet" role="dialog" aria-modal="true" aria-label="เลือกวันที่จะเข้ามาเคลียร์">'+
    '<div class="flexrow"><b class="grow one" style="font-size:var(--fs-lg)">เลือกวันที่จะเข้ามาเคลียร์</b>'+
      '<button class="iconbtn sm2" type="button" data-act="calx" aria-label="ปิด">'+ic('x',16)+'</button></div>'+
    '<div class="calg">'+DOW_TH.map(function (d) { return '<span class="dw">'+d+'</span>'; }).join('')+cells.join('')+'</div>'+
    (shutAny ? '<div class="one dim" style="font-size:var(--fs-sm);text-align:center">วันที่จาง = คลังไม่รับเคลียร์ของเสีย</div>' : '')+
    (hols.length ? '<div class="one" style="font-size:var(--fs-sm);text-align:center;color:var(--clay-deep)" title="'+esc('หยุดนักขัต ' + hols.join(' · '))+'">หยุดนักขัต '+esc(hols.join(' · '))+'</div>' : '')+'</div>';
  var bg = $('calsheet');
  if (!bg) {
    bg = document.createElement('div'); bg.className = 'sheet-bg over'; bg.id = 'calsheet';
    bg.addEventListener('click', function (e) { if (e.target === bg) closeCal(); });
    document.body.appendChild(bg);
  }
  bg.innerHTML = html;
}
function closeCal(){ var b = $('calsheet'); if (b) b.remove(); S.cal = null; }

/* ── นัดวันใหม่ (เลยนัด / เปลี่ยนวัน) — แผ่นล่าง เลือกวิธี + วัน แล้วส่งทั้งนัดเดิม ── */
var HOW_KEY = { 'เปลี่ยนสินค้า':'swap', 'CN':'cn', 'ไม่รับคืน':'none' };
function openResched(k){
  var g = apptGroups('late').concat(apptGroups('booked')).filter(function (x) { return x.k === k; })[0];
  if (!g) return toast('ไม่พบนัดนี้แล้ว — ลองดึงข้อมูลใหม่');

  paintRs();
}
function paintRs(){

  var html = '<div class="sheet" role="dialog" aria-modal="true" aria-label="นัดวันใหม่">'+
    '<div class="flexrow"><b class="grow one" style="font-size:var(--fs-lg)">นัดวันใหม่</b>'+
      '<button class="iconbtn sm2" type="button" data-sheet="x" aria-label="ปิด">'+ic('x',16)+'</button></div>'+

    '<div class="dopt"><span class="olbl">วันที่จะเข้ามาเคลียร์ของเสีย</span>'+dateOpts(r.date, r.whs, 'rsdate')+'</div>'+
    sendBtn(r.how && r.date, 'rssend', r.date, !r.how ? 'เลือกวิธีคืนก่อน' : 'เลือกวันที่จะเข้ามาก่อน')+'</div>';
  var bg = $('sheet');
  if (!bg) {
    bg = document.createElement('div'); bg.className = 'sheet-bg'; bg.id = 'sheet';
    bg.addEventListener('click', function (e) {
      var b = e.target.closest('[data-sheet]');

/* บันทึกนัด → หน้า "ส่งนัดแล้ว" ทันที แล้วส่งข้อความ LINE ตามหลัง (ไม่ให้รอ) */
function submitAppt(keys, how, date, done){
  var list = keys.map(defOf).filter(Boolean);
  var items = keys.map(function (k) { var kp = keyParts(k); return { sku:kp.p, wh:kp.w }; });
  var pr = sendWith('defectAppt', { items:items, how:how, date:date }).then(function (res) {
    var a = res.appt || {}, now = new Date();
    list.forEach(function (d) { d.st = 'booked'; d.ap = { id:a.id || '', date:a.date || date, how:a.how || HOW_TH[how], ea:d.ea, at:a.at || '' }; });
    DEAD = stockRows();
    S.lastAppt = { id:a.id || '', date:a.date || date, how:a.how || HOW_TH[how], n:a.n || list.length, cs:a.cs != null ? a.cs : defCs(list),
                   wh:a.wh || [], line:'sending', hm:pad2(now.getHours()) + ':' + pad2(now.getMinutes()) };
    if (done) done();
    go('defsent');
    var mine = S.lastAppt;
    sendApptLine(mine).then(function (r) { mine.line = r; if (S.route === 'defsent' && S.lastAppt === mine) render(); });
    refresh(true);
  });
  pr.catch(function () { if (S.rs) paintRs(); });
  return pr;
}

/* ══ ตารางคิวลงสินค้า — คิดจาก "ช่องจอด (bay) × เวลา" ไม่ใช่ช่องเวลาตายตัว ══
   คลังมี bay จำกัด · งานแต่ละเที่ยวกินเวลาไม่เท่ากัน
   เวลาเริ่มจะกดได้ก็ต่อเมื่อ ตลอดช่วงที่จะลง มี bay ว่างครบทุกนาที
   ค่าทุกตัวมาจากแท็บ Booking Config ในชีทของแอป (ปรับในชีทได้ไม่ต้องแก้โค้ด)                 */
var BOOKCFG = {}, BUSY = {}, HOL = {};                        /* HOL = วันหยุดนักขัต { 'YYYY-MM-DD':'ชื่อวัน' } จากชีทวันหยุด */
var TODAY = { y:2569, m:1, d:1 }, NOWMIN = 0, NOW_AT = Date.now();
var CFG_DEF = { bays:4, open:360, close:960, slotMin:30, breakStart:720, breakEnd:780, daysClosed:['อา.'],
                maxDur:180, aheadDays:14, leadHours:12, cancelFreeHours:6, noShowLimit:3 };
function mins(t){ var a = String(t).split(':'); return +a[0] * 60 + +a[1]; }
function cfgOf(res){
  var c = BOOKCFG[res] || (/-DEF$/.test(res) ? BOOKCFG['W1-DEF'] : /^BUY-/.test(res) ? BOOKCFG['HQ-buy'] : BOOKCFG.W1) || CFG_DEF;
  return { bays:c.bays || 1, open:c.open != null ? c.open : 360, close:c.close != null ? c.close : 960,
           bkFrom:c.breakStart != null ? c.breakStart : -1, bkTo:c.breakEnd != null ? c.breakEnd : -1,
           slot:c.slotMin || 30, closed:c.daysClosed || [], maxDur:c.maxDur || 180,
           ahead:c.aheadDays != null ? c.aheadDays : 14, leadH:c.leadHours || 0,
           cancelH:c.cancelFreeHours != null ? c.cancelFreeHours : 6, noShow:c.noShowLimit || 3,
           holOpen:!!c.holidayOpen, name:c.name || '', place:c.place || '', note:c.note || '', buyer:!!c.buyer, mine:!!c.mine, off:c.offDays || [] };
}
/* วันหยุดนักขัตของวันนั้น (ว่าง = ไม่หยุด หรือจุดนี้ตั้งให้เปิดวันหยุด) */
function holOn(res, iso){ return cfgOf(res).holOpen ? '' : (HOL[iso] || ''); }
/* ผู้ซื้อที่บริษัทนี้นัดได้ (แท็บ Buyers) — คนที่ดูแลบริษัทนี้ขึ้นก่อน ที่เหลือตามลำดับในชีท */
function buyerList(){
  var mine = [], rest = [];
  Object.keys(BOOKCFG).forEach(function (k) { var c = BOOKCFG[k]; if (c && c.buyer) (c.mine ? mine : rest).push(Object.assign({ res:k }, c)); });
  return mine.concat(rest);
}
function needBuyer(){ return isMeet() && S.topic === 'buy' && buyerList().length > 0; }
function buyerSel(){ var bl = buyerList(); return bl.length === 1 ? bl[0] : (bl.filter(function (b) { return b.res === S.buyer; })[0] || null); }
function slotMin(){ return cfgOf(resOf()).slot; }
/* งานหนึ่งเที่ยวกินกี่ช่อง — ปัดขึ้นเสมอ เช่น แจ้ง 45 นาที ช่องละ 30 = กิน 2 ช่อง */
function slotsFor(dur){ return Math.max(1, Math.ceil(dur / slotMin())); }

function hhmm(m){ m = ((m % 1440) + 1440) % 1440; return pad2(Math.floor(m / 60)) + ':' + pad2(m % 60); }
/* คิวที่ทุกเจ้าจองไว้แล้ว (หลังบ้านบอกแค่ช่วงเวลา ไม่บอกว่าใคร) — [เริ่ม(นาที), กี่นาที] */
function busyList(res, day){ return BUSY[res + '|' + isoOf(S.by, S.bm, +day)] || []; }

/* ช่องเวลาที่เปิดให้เลือกของวันนั้น — ข้ามช่วงพัก */
function slotStarts(res){
  var c = cfgOf(res), out = [];
  for (var t = c.open; t + c.slot <= c.close; t += c.slot) {
    if (c.bkFrom >= 0 && t >= c.bkFrom && t < c.bkTo) continue;
    out.push(t);
  }
  return out;
}
/* มีกี่คันจองทับช่วง [t, t+ช่อง) ไว้แล้ว — นับตามช่วงเวลาจริง (คิวเก่าที่จองตอนช่องยังยาวไม่เท่านี้ก็นับถูก) · ตรงกับหลังบ้าน */
function usedAt(res, day, t){
  var n = 0, t2 = t + cfgOf(res).slot;
  busyList(res, day).forEach(function (b) { if (b[0] < t2 && b[0] + b[1] > t) n++; });
  return n;
}
/* เริ่ม start แล้วกินกี่ช่องตามเวลาที่แจ้ง ลงได้ไหม — ทุกช่องต้องมีที่ว่าง */
function fits(res, day, start, dur){
  var c = cfgOf(res), need = Math.max(1, Math.ceil(dur / c.slot)), tight = false;
  for (var i = 0; i < need; i++) {
    var t = start + i * c.slot;
    if (t + c.slot > c.close) return 'closed';
    if (c.bkFrom >= 0 && t < c.bkTo && t + c.slot > c.bkFrom) return 'break';
    var u = usedAt(res, day, t);
    if (u >= c.bays) return 'full';
    if (u === c.bays - 1) tight = true;
  }
  return tight ? 'tight' : 'free';
}
function blockMin(dur){ return slotsFor(dur) * slotMin(); }   /* คลังกันช่องถึงนาทีนี้ */
/* แนะนำเวลาจากจำนวนพาเลท — เอกสาร 15 นาที + 5 นาทีต่อพาเลท ปัดขึ้นทีละ 15 */
var DURS = [30, 45, 60, 90, 120, 150, 180];
function maxDur(){ return cfgOf(resOf()).maxDur; }
function rawDur(pallets){ return Math.ceil((15 + pallets * 5) / 15) * 15; }
function suggestDur(pallets){
  var m = rawDur(pallets), list = DURS.filter(function (x) { return x <= maxDur(); });
  for (var i = 0; i < list.length; i++) if (list[i] >= m) return list[i];
  return list[list.length - 1] || 30;                  /* เกินสุด = ต้องแบ่งเที่ยว */
}
function needSplit(pallets){ return pallets > 0 && rawDur(pallets) > maxDur(); }

/* ══ นัดหมาย 2 ประเภท ══
   load = ลงสินค้า (ใช้ช่องจอดที่คลัง)
   meet = นัดอื่นๆ — จัดซื้อ · บัญชี · ของเสีย (ใช้โต๊ะ/จุดรับที่ต่างกัน)   */
var TOPICS = {
  buy:    { n:'จัดซื้อ', s:'คุยราคา · เสนอสินค้าใหม่ · โปรโมชั่น', at:'HQ' },
  acct:   { n:'บัญชี',   s:'วางบิล · รับเช็ค · ภาษี',              at:'HQ' },
  defect: { n:'ของเสีย', s:'ส่งคืน · รับกลับ · ออกใบ CN',          at:'wh' }
};
var DURS_MEET = [30, 60, 90];

function gDate(y, m, d){ return new Date(y - 543, m - 1, d); }
function dowOf(y, m, d){ return gDate(y, m, d).getDay(); }
function daysIn(y, m){ return new Date(y - 543, m, 0).getDate(); }
function dayGap(y, m, d){                         /* ห่างจากวันนี้กี่วัน */
  return Math.round((gDate(y, m, d) - gDate(TODAY.y, TODAY.m, TODAY.d)) / 86400000);
}
function thDate(y, m, d){ return d + ' ' + MON_TH[m - 1] + ' ' + y; }
function addDays(y, m, d, n){                     /* บวกวันแล้วข้ามเดือนให้ถูก */
  var g = gDate(y, m, d); g.setDate(g.getDate() + n);
  return { y:g.getFullYear() + 543, m:g.getMonth() + 1, d:g.getDate() };
}

function isMeet(){ return S.bkType === 'meet'; }
function topic(){ return TOPICS[S.topic] || TOPICS.buy; }
function resOf(){                                  /* ทรัพยากรที่ถูกจอง */
  if (!isMeet()) return lockWh() || S.wh;           /* ลงสินค้า = คลังของใบสั่งซื้อที่เลือกเสมอ (กันสลับไปนัดของเสียแล้วคลังเพี้ยน) */
  if (needBuyer()) { var b = buyerSel(); return (b || buyerList()[0]).res; }   /* นัดจัดซื้อ = นัดกับคน (ยังไม่เลือก = ยังไม่ขึ้นวันเวลา) */
  return topic().at === 'HQ' ? ('HQ-' + S.topic) : (meetWh() + '-DEF');
}
/* จุดรับของเสียมีเฉพาะ 5 คลังหลัก — เคยเลือก PO คลังฝาก (เช่น SD) มาก่อน ไม่ให้กลายเป็นนัด SD-DEF ที่ไม่มีจริง */
function meetWh(){ return WH[S.wh] ? S.wh : Object.keys(WH)[0]; }
function placeName(){
  if (isMeet() && topic().at === 'HQ') return cfgOf(resOf()).place || 'HQ สำนักงานใหญ่';
  return whName(isMeet() ? meetWh() : resOf());
}
function durList(){ var mx = maxDur(); return (isMeet() ? DURS_MEET : DURS).filter(function (x) { return x <= mx; }); }
function rules(){ var c = cfgOf(resOf()); return { ahead:c.ahead, lead:c.leadH, cancelH:c.cancelH, noShow:c.noShow }; }
function leadMin(){ return rules().lead * 60; }
/* เวลาเริ่มที่เร็วที่สุดของวันที่ห่างไป gap วัน — ติดลบ = ทั้งวันจองได้ */
function earliest(gap){ return nowMin() + leadMin() - gap * 1440; }

function freeStarts(y, m, d){
  var res = resOf(), gap = dayGap(y, m, d), lo = earliest(gap), dd = pad2(d);
  return slotStarts(res).filter(function (t) {
    if (t < lo) return false;
    var f = fits(res, dd, t, S.dur);
    return f === 'free' || f === 'tight';
  });
}
function dayInfo(y, m, d){
  var gap = dayGap(y, m, d);
  if (gap < 0) return { st:'past', n:0 };
  if (gap > rules().ahead) return { st:'far', n:0 };
  var hol = holOn(resOf(), isoOf(y, m, d));
  if (hol) return { st:'closed', n:0, hol:hol };
  if (cfgOf(resOf()).off.indexOf(isoOf(y, m, d)) >= 0) return { st:'closed', n:0, off:true };   /* ผู้ซื้อลา/ไม่อยู่ (แท็บ Buyers ช่อง ไม่รับนัดวันที่) */
  if (cfgOf(resOf()).closed.indexOf(DOW_TH[dowOf(y, m, d)]) >= 0) return { st:'closed', n:0 };
  var saveBy = S.by, saveBm = S.bm; S.by = y; S.bm = m;          /* busyList อ่านเดือน/ปีจาก S */
  var n = freeStarts(y, m, d).length;
  S.by = saveBy; S.bm = saveBm;
  return { st: n === 0 ? 'full' : (n >= 6 ? 'many' : 'few'), n:n };
}
function pickedGap(){ return dayGap(S.by, S.bm, +S.day); }
/* ยกเลิกฟรีถึงเมื่อไร — สูตรเดียวกับหลังบ้าน: ก่อนเวลานัด cancelH ชม. · จองเข้ามาหลังเส้นนั้น = ได้ 30 นาทีหลังจอง (ไม่เกินเวลาเริ่ม) */
function freeCancel(){
  var start = (S.slotM != null ? S.slotM : 510) + pickedGap() * 1440;
  var abs = Math.min(start, Math.max(start - rules().cancelH * 60, nowMin() + 30));
  var off = Math.floor(abs / 1440), m = ((abs % 1440) + 1440) % 1440;
  var t = addDays(TODAY.y, TODAY.m, TODAY.d, off);
  return t.d + ' ' + MON_TH[t.m - 1] + ' ' + hhmm(m) + ' น.';
}
function lastDay(){ return addDays(TODAY.y, TODAY.m, TODAY.d, rules().ahead); }

/* ใบสั่งซื้อที่จองคิวได้ = ยืนยันแล้ว (หรือส่งบางส่วน) และยังไม่มีคิว · เลือกได้หลายใบ แต่ต้องคลังเดียวกัน */
function poBookable(){ return POS.filter(function (p) { return p.bookable; }); }
function poPicked(){ return poBookable().filter(function (p) { return S.poSel[p.id]; }); }
function bookPal(){ var t = 0; poPicked().forEach(function (p) { t += palOf(p); }); return t; }
function lockWh(){ var a = poPicked(); return a.length ? a[0].wh : null; }   /* คลังถูกล็อกโดยใบแรกที่เลือก */
function palOf(p){ return +p.pallets || 1; }

V.book = function () {
  var res = resOf(), c = cfgOf(res), cap = c.bays;
  var pal = bookPal(), sug = suggestDur(pal), need = slotsFor(S.dur);
  var gap = pickedGap(), lo = earliest(gap);
  var starts = slotStarts(res);
  var am = starts.filter(function (t) { return t < 12 * 60; });
  var pm = starts.filter(function (t) { return t >= 12 * 60; });
  var dInf = dayInfo(S.by, S.bm, +S.day), dSt = dInf.st, dayOff = dSt === 'past' || dSt === 'far' || dSt === 'closed';
  if (S.slotM != null) {                             /* ช่องที่เคยเลือก เต็ม/กระชั้น/เลยเวลาไปแล้ว = ล้างทิ้ง ไม่ค้าง "เลือกอยู่" ให้กดถัดไปได้ */
    var st0 = dayOff ? 'dayoff' : S.slotM < lo ? 'lead' : starts.indexOf(S.slotM) < 0 ? 'gone' : fits(res, pad2(+S.day), S.slotM, S.dur);
    if (st0 !== 'free' && st0 !== 'tight') { S.slotM = null; S.slot = ''; }
  }

  var pos = poBookable(), picked = poPicked(), lw = lockWh();

            (c.closed.length ? '<span class="chip grey">หยุด ' + esc(c.closed.join(' ')) + '</span>' : '');
  var monHol = Object.keys(HOL).filter(function (iso) { var a = isoParts(iso); return a.y + 543 === S.by && a.m === S.bm && holOn(res, iso); }).sort()
    .map(function (iso) { return thShort(iso) + ' ' + HOL[iso]; }).join(' · ');

  function slot(t){
    var st = dayOff ? 'dayoff' : t < lo ? 'lead' : fits(res, pad2(+S.day), t, S.dur);
    var on = S.slotM === t && !dayOff;
    var dead = (st === 'full' || st === 'closed' || st === 'break' || st === 'lead' || st === 'dayoff');
    var cls = 'slot2' + (on ? ' on' : dead ? ' off' : st === 'tight' ? ' tight' : ' ok');
    var sub = on ? 'เลือกอยู่'
            : st === 'dayoff' ? (dSt === 'closed' ? (dInf.hol ? 'หยุดนักขัต' : dInf.off ? 'ไม่อยู่' : 'วันหยุด') : 'จองไม่ได้')
            : st === 'lead' ? 'กระชั้นไป'
            : st === 'closed' ? 'เลยเวลาปิด'
            : st === 'break' ? 'ชนพักเที่ยง'
            : st === 'full' ? 'คิวเต็ม'
            : '→ ' + hhmm(t + need * c.slot);
    return '<button class="' + cls + '"' + (dead ? ' disabled' : '') + ' aria-pressed="' + on + '" data-act="slotm:' + t + '">'+
      '<span class="t">' + hhmm(t) + '</span><span class="c">' + sub + '</span></button>';
  }

  var days = [];
  for (var d = 1; d <= nDays; d++) {
    var inf = dayInfo(S.by, S.bm, d), on = (+S.day === d);
    var dead = inf.st === 'past' || inf.st === 'far' || inf.st === 'closed' || inf.st === 'full';
    days.push('<button class="daycell dc-' + inf.st + (inf.hol ? ' dc-hol' : '') + (on ? ' on' : '') + '"' + (dead ? ' disabled' : '')+
      ' aria-pressed="' + on + '" data-act="day:' + pad2(d) + '"'+
      ' title="' + thDate(S.by, S.bm, d) + (inf.hol ? ' · หยุด' + esc(inf.hol) : inf.off ? ' · ผู้ซื้อไม่รับนัด' : dead ? '' : ' · ว่าง ' + inf.n + ' ช่วง') + '">'+
      '<span class="d">' + DOW_TH[dowOf(S.by, S.bm, d)] + '</span>'+
      '<span class="n">' + d + '</span>'+
      '<span class="dot"></span></button>');
  }

  /* ── ขั้นเลือกใบสั่งซื้อ (เฉพาะลงสินค้า) ── */
  var poBlock = '<div class="sect panel" style="gap:9px">'+
    '<div class="flexrow"><b style="font-size:13px;color:var(--ink-2)">ส่งใบสั่งซื้อไหนบ้าง</b><span class="sp"></span>'+
      '<span class="one dim" style="font-size:12px">' + (picked.length ? 'เลือกแล้ว ' + picked.length + ' ใบ · ' + pal + ' พาเลท' : 'เลือกได้หลายใบ') + '</span></div>'+
    (pos.length
      ? '<div class="one dim" style="font-size:11.5px;margin-top:-3px">เฉพาะใบที่ยืนยันแล้ว · คลังเดียวกันรวมเที่ยวเดียวได้</div>'+
        '<div class="card flat divide" style="padding:0">' + pos.map(function (p) {
          var on = !!S.poSel[p.id], off = lw && p.wh !== lw;

          var sub = (part ? 'ส่วนที่ขาด · ' : '') + whName(p.wh) + (p.dueTh ? ' · ส่ง ' + p.dueTh : '') + ' · ' + baht(part && p.remainVal != null ? p.remainVal : p.total);

                (off ? 'คนละคลัง — จองแยกเที่ยว' : esc(sub)) + '</span></span>'+
            '<span class="bb" style="flex-shrink:0;font-size:13px;color:var(--ink-2)">' + palOf(p) + ' พาเลท</span></label>';
        }).join('') + '</div>'+
        (lw ? '<div class="flexrow" style="gap:8px;flex-wrap:wrap">'+
          '<span class="chip teal">ส่งที่ ' + esc(whName(lw)) + '</span>'+
          '<span class="chip grey">รวม ' + pal + ' พาเลท</span>'+
          (picked.length > 1 ? '<button class="lnk" data-act="clearpo">ล้างที่เลือก</button>' : '') + '</div>' : '')
      : '<div class="card flat empty" style="padding:22px;line-height:1.6">ยังไม่มีใบสั่งซื้อที่จองคิวได้<br>'+
        '<span style="font-size:12px">ยืนยันใบสั่งซื้อก่อน ถึงจะจองคิวลงของได้</span></div>'+
        '<button class="btn line sm" style="align-self:flex-start" data-act="tab:po">ไปดูใบสั่งซื้อ</button>')+
  '</div>';

  /* ── ขั้นเลือกเรื่อง + สถานที่ (เฉพาะนัดอื่นๆ) · นัดจัดซื้อ = เลือกคนก่อน (แท็บ Buyers) ── */
  var buyerBlock = !bl.length ? '' : '<div class="sect panel" style="gap:9px">'+
    '<div class="flexrow"><b style="font-size:13px;color:var(--ink-2)">นัดกับใคร</b><span class="sp"></span>'+
      '<span class="one dim" style="font-size:12px">' + (bsel ? 'เลือกแล้ว' : 'เลือก 1 คน') + '</span></div>'+
    '<div class="card flat divide" style="padding:0">' + bl.map(function (b) {
      var away = (b.offDays || []).filter(function (x) { return x >= todayIso() && x <= isoAdd(todayIso(), b.aheadDays != null ? b.aheadDays : 14); });
      var on = !!bsel && bsel.res === b.res, sub = (away.length ? 'ไม่อยู่ ' + thShort(away[0]) + (away.length > 1 ? ' +' + (away.length - 1) + ' วัน' : '') + ' · ' : '') + (b.note || 'ฝ่ายจัดซื้อ') + ' · ' + hhmm(b.open) + '–' + hhmm(b.close) + ' น.';
      return '<label class="lbl" data-tweak-card="แถวผู้ซื้อ">'+
        '<input type="radio" name="buyer" ' + (on ? 'checked ' : '') + 'data-buyer="' + esc(b.res) + '" aria-label="นัดกับ ' + esc(b.name) + '">'+
        '<span class="grow" style="min-width:0"><span class="one bb" style="display:block;font-size:13.5px" title="' + esc(b.name) + '">' + esc(b.name) + '</span>'+
          '<span class="one dim" style="display:block;font-size:11.5px;margin-top:2px" title="' + esc((b.mine ? 'ดูแลบริษัทคุณ · ' : '') + sub) + '">'+
            (b.mine ? '<b style="color:var(--teal)">ดูแลบริษัทคุณ</b> · ' : '') + esc(sub) + '</span></span></label>';
    }).join('') + '</div></div>';
  var meetBlock = buyerBlock + ((bl.length && !bsel) ? '' : '<div class="sect panel" style="gap:9px">'+
    '<b style="font-size:13px;color:var(--ink-2)">' + (topic().at === 'HQ' ? 'เข้าพบที่' : 'ไปที่คลังไหน') + '</b>'+
    (topic().at === 'HQ'
      ? '<div class="flexrow" style="gap:7px;min-width:0"><span class="wh one" title="' + esc(placeName()) + '"><i style="background:var(--hq)"></i>' + esc(placeName()) + '</span></div>'
      : '<div class="strip">' + Object.keys(WH).map(function (k) {
          return '<button class="tag" style="border-radius:12px;gap:6px" aria-pressed="' + (meetWh() === k) + '" data-act="wh:' + k + '">'+
            '<i style="width:8px;height:8px;border-radius:99px;background:' + whInfo(k).c + ';display:block"></i>' + esc(whName(k)) + '</button>';
        }).join('') + '</div>')+
    '<div class="flexrow" style="gap:8px;flex-wrap:wrap">'+
      '<span class="chip grey">' + (bsel && cap <= 1 ? 'ครั้งละ 1 ราย' : 'พร้อมกันได้ ' + cap + ' ราย') + '</span>'+
      '<span class="chip grey">' + hhmm(c.open) + '–' + hhmm(c.close) + ' น.</span>'+ brk + '</div>'+
  '</div>');

  return '<div class="scr" id="s-book">'+
    hdr('จองนัดหมาย','home','<span class="bb" style="font-size:12.5px;color:var(--on-navy-2)">1 / 3</span>')+
    '<div class="prog"><i style="width:33.3%"></i></div>'+
    '<div class="body" data-tweak="เลือกวันเวลา">'+

      '<div class="sect panel" style="gap:9px">'+
        '<b style="font-size:13px;color:var(--ink-2)">นัดเรื่องอะไร</b>'+
        '<div class="seg">'+
          '<button class="' + (!isMeet() ? 'on' : '') + '" data-act="bktype:load">ลงสินค้า</button>'+
          '<button class="' + (isMeet() ? 'on' : '') + '" data-act="bktype:meet">นัดอื่นๆ</button></div>'+
        (isMeet()
          ? '<div class="strip" style="margin-top:2px">' + Object.keys(TOPICS).map(function (k) {
              return '<button class="tag" style="border-radius:12px" aria-pressed="' + (S.topic === k) + '" data-act="topic:' + k + '">' + TOPICS[k].n + '</button>';
            }).join('') + '</div>'+
            '<div class="one dim" style="font-size:12px">' + esc(topic().s) + '</div>'

/* รอจัดซื้อตรวจ = ดูคำตอบที่ส่งไปก่อน ต้องกด "แก้คำตอบ" ถึงเข้าโหมดแก้ (กดยืนยันทีเดียวห้ามทับคำตอบเดิมที่รอตรวจอยู่) */

function vatOn(){ return S.vatView === 'inc'; }

function viewAmt(l, ex){ return vatOn() ? incOf(l, ex) : round2(ex); }
function lineIncVal(po, l){ var f = S.fixes[ckey(po, l)] || {}; return f.inc != null ? f.inc : incOf(l, linePrice(po, l)); }
function fkey(po, i){ return po.id + '|f' + i; }

function freeUnit(f){ return f.u || unitCode(f.unit); }
function discOf(po){ return S.disc[po.id] || { mode:'pct', raw:'' }; }

function discBasis(d){ return d.basis || (vatOn() ? 'inc' : 'ex'); }

/* ยอดทั้งใบตามที่ซัพแจ้ง — ส่วนลดท้ายบิลหักจากยอดก่อน VAT แล้วค่อยคิด VAT (สูตรเดียวกับหลังบ้าน) */

/* รัตนขายขาดทุนไหม — เทียบราคาขายที่ซัพเห็นกับทุนต่อหน่วยจากราคาในใบนี้ หลังหักส่วนลดท้ายบิล (ก่อน VAT ทั้งคู่) */

           cap:edits ? 'แก้แล้ว → จัดซื้อตรวจก่อน แล้วแจ้งผลทาง LINE' : 'ถูกต้องทั้งหมด → จองคิวส่งของต่อได้ทันที' };

  if (!po) return emptyScr('s-podetail', 'ใบสั่งซื้อ', 'ไม่พบใบสั่งซื้อนี้แล้ว', 'tab:po', 'ไปที่ใบสั่งซื้อ');
  return '<div class="scr" id="s-podetail">'+poHero(po)+
    '<div class="body pull" style="gap:var(--sp-4)" data-tweak="รายละเอียด PO">'+poInfo(po)+
      (poEditable(po) ? poEditBody(po) : poReadBody(po))+
    '</div></div>';
};
V.poconfirm = function () { return V.podetail(); };          /* ลิงก์/ประวัติเก่าที่ชี้หน้ายืนยัน → หน้าเดียวกันแล้ว */

/* ── รอยืนยัน · รอจัดซื้อตรวจ: แก้ในหน้านี้ ── */
function poEditBody(po){
  var st = poState(po), t = st.t, v = vatOn(), free = poFree(po);
  var groups = brandGroups(po.lines, function (l) { return P[l.p]; }, function (l) { return l.base; });
  return (po.state === 'รอจัดซื้อตรวจ'
      ? '<div class="panel flexrow" style="padding:8px 8px 8px 13px;gap:10px;background:var(--gold-tint)" data-tweak-card="แก้คำตอบใหม่">'+
          '<span class="grow one" style="color:var(--gold-deep);font-size:var(--fs-sm);font-weight:600">คำตอบใหม่จะแทนอันที่ส่งไป'+(po.reply && po.reply.time ? ' '+esc(thDT(po.reply.time)) : '')+'</span>'+
          '<button class="btn sm ghost" style="flex-shrink:0" data-act="reeditoff">ยกเลิก</button></div>' : '')+
    '<div class="sect" style="gap:6px">'+
      '<div class="flexrow" style="gap:10px;min-width:0"><b class="grow one" style="font-size:var(--fs-lg)">'+po.lines.length+' รายการ</b>'+
        '<div class="seg" role="group" aria-label="ดูราคาแบบไหน">'+
          '<button type="button" aria-pressed="'+!v+'" data-act="vatview:ex">ก่อน VAT</button>'+
          '<button type="button" aria-pressed="'+v+'" data-act="vatview:inc">รวม VAT</button></div></div>'+
      '<div class="flexrow" style="gap:8px;min-width:0"><span class="grow one dim" style="font-size:var(--fs-meta)">ตัวเลขตั้งต้น = ที่จัดซื้อเปิดบิล · ไม่ตรงแตะช่องแก้ได้เลย</span>'+
        (st.edits ? '<button class="lnk" style="flex-shrink:0;font-size:var(--fs-meta)" data-act="resetfix">คืนค่าเดิม</button>' : '')+'</div></div>'+
    (st.loss.length ? '<div class="warnbox one">รัตนขายขาดทุน '+st.loss.length+' รายการ — ใส่ราคาแนะนำใต้แต่ละตัว</div>' : '')+
    groups.map(function (g) {
      var gt = 0; g.items.forEach(function (l) { gt += viewAmt(l, lineAmt(po, l)); });
      return '<div class="sect" style="gap:9px">'+
        '<div class="flexrow" style="padding:0 4px;min-width:0"><b class="one" style="font-size:13px;color:var(--ink-2)">'+esc(g.brand === '-' ? 'อื่นๆ' : g.brand)+'</b>'+
          '<span class="dim" style="font-size:var(--fs-meta);flex-shrink:0">'+g.items.length+' รายการ</span><span class="sp"></span>'+
          '<span class="bb" style="font-size:13px;color:var(--ink-2);flex-shrink:0">'+baht2(gt)+'</span></div>'+
        g.items.map(function (l) { return poLineCard(po, l, t); }).join('')+'</div>';
    }).join('')+
    (free.length ? poFreeEdit(po, free) : '')+
    poDiscCard(po, t)+
    poTotCard(po, t, st.edits)+
    '<div class="panel" style="display:flex;flex-direction:column;gap:12px">'+
      '<label class="fld"><span style="font-weight:600;color:var(--ink-2);font-size:var(--fs-sm)">หมายเหตุถึงจัดซื้อ <span style="font-weight:400;color:var(--ink-4)">(ไม่บังคับ)</span></span>'+
        '<textarea rows="2" data-note placeholder="เช่น ซื้อ 10 แถม 1 เฉพาะรอบนี้ ถึง 30 ก.ย.">'+esc(noteOf(po))+'</textarea></label>'+
      '<label class="fld"><span style="font-weight:600;color:var(--ink-2);font-size:var(--fs-sm)">ชื่อผู้ยืนยัน</span>'+
        '<input value="'+esc(S.signer)+'" data-signer autocomplete="name" placeholder="ชื่อ-นามสกุล"></label>'+
      '<div class="one dim" style="font-size:var(--fs-meta)">ยืนยันผ่านบัญชี LINE '+esc(PROFILE.name || '—')+' · ระบบบันทึกวันเวลาให้เอง</div></div>'+
    '<div class="psend">'+
      '<button class="btn '+(st.block || S.sending ? 'off' : 'gold')+'" id="sendbtn" data-act="sendpo"'+(st.block || S.sending ? ' disabled' : '')+'>'+
        (S.sending ? 'กำลังส่ง…' : (st.block ? '' : ic('check',19,'var(--navy)'))+esc(st.label))+'</button>'+
      '<div class="one" id="sendcap" style="text-align:center;font-size:var(--fs-meta);color:'+(st.edits ? 'var(--clay-deep)' : 'var(--ink-4)')+'">'+esc(st.cap)+'</div></div>';
}
function poLineCard(po, l, t){
  var p = P[l.p], q = lineQty(po, l), pr = linePrice(po, l), v = vatOn();
  var dq = q !== l.qty, dp = pr !== l.up, uth = unitTh(l.u), loss = lineLoss(po, l, t.rate);
  var bq = S.bad[ckey(po, l) + '|qty'], bp = S.bad[ckey(po, l) + '|price'];   /* ช่องที่พิมพ์ไม่ใช่ตัวเลข = โชว์ตามที่พิมพ์ สีแดง */
  var meta = [p.cs || l.code, uth + ' ' + fmtN(eaOf(p, l.u) || 1) + ' ชิ้น', lvat(l) ? '' : 'ไม่มี VAT',
              l.list > l.up + 0.005 ? 'ก่อนลด ' + baht2(v ? incOf(l, l.list) : l.list) : ''].filter(Boolean).join(' · ');
  var pHint = dp ? 'เดิม ' + baht2(viewAmt(l, l.up)) : v ? 'ก่อน VAT ' + baht2(pr) : lvat(l) ? 'รวม VAT ' + baht2(incOf(l, pr)) : 'ไม่มี VAT';
  return '<div class="card pline" data-tweak-card="แถวสินค้าใน PO">'+
    '<div class="ph"><span class="thumb" style="width:44px;height:44px;background:'+p.bg+'">'+art(p,23)+'</span>'+
      '<span class="grow" style="min-width:0"><span class="one bb" style="display:block;font-size:var(--fs-md)" title="'+esc(p.full || p.name)+'">'+esc(p.name)+'</span>'+
      '<span class="one dim" style="display:block;font-size:var(--fs-meta);margin-top:2px" title="'+esc(meta)+'">'+esc(meta)+'</span></span></div>'+
    '<div class="pgrid">'+
      '<label class="pf"><span>จำนวน ('+esc(uth)+')</span>'+
        '<input class="pin'+(bq != null ? ' bad' : dq ? ' ch' : '')+'" inputmode="decimal" value="'+esc(bq != null ? bq : String(round2(q)))+'" data-fix="'+esc(ckey(po, l))+'|qty" aria-label="จำนวน'+esc(uth)+'ที่ส่งได้ของ '+esc(p.name)+'"'+(bq != null ? ' aria-invalid="true"' : '')+'>'+
        '<i class="'+(bq != null || dq ? 'ch' : '')+'">'+(bq != null ? 'ใส่เป็นตัวเลข' : dq ? 'เดิม '+fmtN(l.qty)+' '+esc(uth) : 'ตามใบสั่งซื้อ')+'</i></label>'+
      '<label class="pf"><span>ราคา / '+esc(uth)+' · '+(v ? 'รวม VAT' : 'ก่อน VAT')+'</span>'+
        '<input class="pin'+(bp != null ? ' bad' : dp ? ' ch' : '')+'" inputmode="decimal" value="'+esc(bp != null ? bp : (v ? lineIncVal(po, l) : pr).toFixed(2))+'" data-fix="'+esc(ckey(po, l))+'|price" aria-label="ราคาต่อ'+esc(uth)+' '+(v ? 'รวม VAT' : 'ก่อน VAT')+' ของ '+esc(p.name)+'"'+(bp != null ? ' aria-invalid="true"' : '')+'>'+
        '<i class="'+(bp != null || dp ? 'ch' : '')+'">'+(bp != null ? 'ใส่เป็นตัวเลข' : esc(pHint))+'</i></label>'+
    '</div>'+
    '<div class="pamt"><span class="grow one dim">รวมรายการนี้ · '+(v ? 'รวม VAT' : 'ก่อน VAT')+'</span>'+
      (dq || dp ? '<s>'+baht2(viewAmt(l, l.base))+'</s>' : '')+
      '<b id="amt-'+l.k+'"'+(dq || dp ? ' class="ch"' : '')+'>'+baht2(viewAmt(l, lineAmt(po, l)))+'</b></div>'+
    (loss.length ? poLossBox(po, l, p, loss, t) : '')+
  '</div>';
}
function poLossBox(po, l, p, loss, t){
  var k = ckey(po, l), a = advOf(po, l), x = loss[0], m = vatOn() && lvat(l) ? 1 + VAT_RATE : 1, mi = lvat(l) ? 1 + VAT_RATE : 1, done = advDone(po, l);
  var nowEA = p.s03 && p.s03.EA ? 'ตอนนี้รัตนขาย ' + baht2(p.s03.EA * mi) : 'บาทต่อชิ้น';
  var nowCS = p.s00 && p.s00.CS ? 'ตอนนี้ ' + baht2(p.s00.CS * mi) : 'บาทต่อลัง';
  return '<div class="plb" data-tweak-card="กล่องรัตนขายขาดทุน">'+
    '<div class="flexrow" style="gap:8px;min-width:0"><b class="grow one plh">รัตนขายขาดทุน '+baht2(x.gap * m)+'/'+esc(perUnit(x.u))+'</b>'+
      '<span class="pdone'+(done ? ' ok' : '')+'" id="advok-'+l.k+'">'+advTxt(po, l)+'</span></div>'+
    '<div class="one pls" title="'+esc(x.tier + ' ' + x.unit)+'">'+esc(x.tier + ' ' + x.unit)+' '+baht2(x.sell * m)+' · ทุน '+baht2(x.cost * m)+
      (t.rate > 0 ? ' หลังหักส่วนลด' : '')+(loss.length > 1 ? ' · อีก '+(loss.length - 1)+' หน่วย' : '')+'</div>'+
    '<div class="one plq">ช่วยรัตนตั้งราคาขาย · ราคารวม VAT</div>'+
    '<label class="pf"><span>ราคาแนะนำขายปลีก / ชิ้น</span><input class="pin" inputmode="decimal" value="'+esc(a.rec || '')+'" data-adv="'+esc(k)+'|rec" placeholder="'+esc(nowEA)+'" aria-label="ราคาแนะนำขายปลีกต่อชิ้น รวม VAT"></label>'+
    '<div class="pgrid" style="grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)">'+
      '<label class="pf"><span>ราคาต่ำสุด / ลัง</span><input class="pin" inputmode="decimal" value="'+esc(a.low || '')+'" data-adv="'+esc(k)+'|low" placeholder="'+esc(nowCS)+'" aria-label="ราคาต่ำสุดต่อลัง รวม VAT"></label>'+
      '<label class="pf"><span>ต้องซื้อขั้นต่ำ (ลัง)</span><input class="pin r" inputmode="numeric" value="'+esc(a.min || '')+'" data-adv="'+esc(k)+'|min" placeholder="กี่ลัง" aria-label="ต้องซื้อขั้นต่ำกี่ลังถึงได้ราคาต่ำสุด"></label>'+
    '</div></div>';
}
function poFreeEdit(po, free){
  return '<div class="sect" style="gap:9px">'+
    '<div class="flexrow" style="padding:0 4px;min-width:0"><b style="font-size:13px;color:var(--gold-deep)">ของแถม</b>'+
      '<span class="dim" style="font-size:var(--fs-meta)">'+free.length+' รายการ</span><span class="sp"></span>'+
      '<b style="font-size:13px;color:var(--gold-deep);flex-shrink:0">ไม่คิดเงิน</b></div>'+
    free.map(function (f, i) {
      var p = P[f.p], u = freeUnit(f), uth = unitTh(u), q = freeQty(po, f, i), ch = q !== f.qty, bf = S.bad[fkey(po, i)];
      return '<div class="card pfree" data-tweak-card="แถวของแถม">'+
        '<span class="thumb" style="width:44px;height:44px;background:'+p.bg+'">'+art(p,23)+'</span>'+
        '<span class="grow" style="min-width:0"><span class="one bb" style="display:block;font-size:var(--fs-md)" title="'+esc(p.full || p.name)+'">'+esc(p.name)+'</span>'+
          '<span class="one" style="display:block;font-size:var(--fs-meta);color:'+(bf != null ? 'var(--clay)' : 'var(--gold-deep)')+';margin-top:2px">'+
            (bf != null ? 'ใส่เป็นตัวเลข · ' : ch ? 'เดิม ' : 'ตามใบสั่งซื้อ ')+'แถม '+fmtN(f.qty)+' '+esc(uth)+'</span></span>'+
        '<label class="pf" style="width:92px;flex-shrink:0"><span>แถม ('+esc(uth)+')</span>'+
          '<input class="pin'+(bf != null ? ' bad' : ch ? ' ch' : '')+'" inputmode="decimal" value="'+esc(bf != null ? bf : String(round2(q)))+'" data-ff="'+esc(fkey(po, i))+'" aria-label="ของแถม '+esc(p.name)+' เป็น'+esc(uth)+'"'+(bf != null ? ' aria-invalid="true"' : '')+'></label>'+
      '</div>';
    }).join('')+'</div>';
}
function poDiscHint(t){ return t.discBad ? 'ใส่เป็นตัวเลขเท่านั้น เช่น 2 หรือ 1,500' : t.disc > 0 ? '= ลด ' + baht2(t.disc) + ' ก่อน VAT · ' + baht2(t.discInc) + ' รวม VAT' : 'หักจากยอดก่อน VAT แล้วค่อยคิด VAT'; }
function discHintCol(t){ return t.discBad ? 'var(--clay)' : t.disc > 0 ? 'var(--teal)' : 'var(--ink-4)'; }
function poDiscCard(po, t){
  var d = discOf(po), pct = d.mode !== 'baht';
  return '<div class="panel pdisc" data-tweak-card="ส่วนลดท้ายบิล">'+
    '<div class="flexrow" style="gap:10px;min-width:0"><span class="grow" style="min-width:0">'+
      '<b class="one" style="display:block;font-size:15px">ส่วนลดท้ายบิล</b><span class="one dim" style="display:block;font-size:var(--fs-meta)">ไม่มีเว้นว่าง</span></span>'+
      '<div class="seg" role="group" aria-label="ส่วนลดเป็นเปอร์เซ็นต์หรือบาท">'+
        '<button type="button" aria-pressed="'+pct+'" data-act="dmode:pct">%</button>'+
        '<button type="button" aria-pressed="'+!pct+'" data-act="dmode:baht">บาท</button></div></div>'+
    '<label class="fin"><input inputmode="decimal" value="'+esc(d.raw || '')+'" data-disc="'+esc(po.id)+'" placeholder="0" aria-label="ส่วนลดท้ายบิล">'+
      '<span id="discunit">'+esc(discUnit(d))+'</span></label>'+
    '<span class="one" id="dischint" style="font-size:var(--fs-meta);color:'+discHintCol(t)+'">'+esc(poDiscHint(t))+'</span></div>';
}
function poTotCard(po, t, edits){
  var head = poBaseSums(po);
  return '<div class="panel ptot" data-tweak-card="ยอดรวมใบสั่งซื้อ">'+
    '<div class="prow" id="headrow"'+(edits ? '' : ' style="display:none"')+'><span>ยอดตามใบสั่งซื้อ</span><s>'+baht2(head.gross)+'</s></div>'+
    '<div class="prow"><span>รวมก่อน VAT</span><b id="sumsub">'+baht2(t.sub)+'</b></div>'+
    '<div class="prow" id="discrow"'+(t.disc > 0 ? '' : ' style="display:none"')+'><span id="disclbl">ส่วนลดท้ายบิล'+(t.pct ? ' '+t.pct+'%' : '')+'</span><b class="c" id="sumdisc">−'+baht2(t.disc)+'</b></div>'+
    '<div class="prow" id="netrow"'+(t.disc > 0 ? '' : ' style="display:none"')+'><span>หลังหักส่วนลด</span><b id="sumnet">'+baht2(t.net)+'</b></div>'+
    '<div class="prow"><span>VAT 7%</span><b id="sumvat">'+baht2(t.vat)+'</b></div>'+
    '<div class="prow big"><b>รวมทั้งสิ้น (รวม VAT)</b><b id="sumgross">'+baht2(t.gross)+'</b></div></div>';
}
/* พิมพ์ในช่อง = อัปเดตยอด ปุ่มส่ง และป้าย "ใส่ครบแล้ว" สด ไม่วาดจอใหม่ (ช่องที่กำลังพิมพ์ไม่หลุดโฟกัส) · ออกจากช่องแล้วค่อยวาดเต็ม */
function paintSums(po){
  if (!po || !poEditable(po)) return;
  var st = poState(po), t = st.t;
  var set = function (id, v) { var e = $(id); if (e) e.textContent = v; };
  po.lines.forEach(function (l) { set('amt-' + l.k, baht2(viewAmt(l, lineAmt(po, l)))); });
  set('sumsub', baht2(t.sub)); set('sumdisc', '−' + baht2(t.disc)); set('sumnet', baht2(t.net));
  set('sumvat', baht2(t.vat)); set('sumgross', baht2(t.gross));
  set('disclbl', 'ส่วนลดท้ายบิล' + (t.pct ? ' ' + t.pct + '%' : ''));
  ['discrow', 'netrow'].forEach(function (id) { var e = $(id); if (e) e.style.display = t.disc > 0 ? '' : 'none'; });
  var hr = $('headrow'); if (hr) hr.style.display = st.edits ? '' : 'none';
  var dh = $('dischint'); if (dh) { dh.textContent = poDiscHint(t); dh.style.color = discHintCol(t); }
  set('discunit', discUnit(discOf(po)));
  po.lines.forEach(function (l) {
    var e = $('advok-' + l.k); if (!e) return;
    var ok = advDone(po, l); e.textContent = advTxt(po, l); e.classList.toggle('ok', ok);
  });
  var b = $('sendbtn');
  if (b && !S.sending) {
    b.disabled = !!st.block; b.classList.toggle('off', !!st.block); b.classList.toggle('gold', !st.block);
    b.innerHTML = (st.block ? '' : ic('check',19,'var(--navy)')) + esc(st.label);
  }
  var c = $('sendcap'); if (c) { c.textContent = st.cap; c.style.color = st.edits ? 'var(--clay-deep)' : 'var(--ink-4)'; }
}

/* ── ยืนยันแล้ว / จองคิวแล้ว / ส่งแล้ว: ดูอย่างเดียว · ยอดกับปุ่มอยู่ท้ายหน้า ── */
/* รอจัดซื้อตรวจ: สรุปคำตอบที่ส่งไป + ปุ่มแก้คำตอบอยู่บนสุด (กดแล้วอยู่ตำแหน่งเดิม ไม่ต้องเลื่อนหา) */
function poReplyPanel(po){
  var r = po.reply || {};
  var sum = [r.edits ? 'แก้ ' + fmtN(r.edits) + ' จุด' : '', r.gross ? 'แจ้งยอด ' + baht2(r.gross) : ''].filter(Boolean).join(' · ') || 'รอผลทาง LINE';
  var sub = (r.time ? 'ส่ง ' + thDT(r.time) + ' · ' : '') + 'ด้านล่าง = ตัวเลขตามใบสั่งซื้อเดิม';
  return '<div class="panel" style="display:flex;flex-direction:column;gap:8px;padding:12px 12px 12px 14px;background:var(--gold-tint)" data-tweak-card="คำตอบที่รอตรวจ">'+
    '<div class="flexrow" style="gap:10px;min-width:0"><span class="grow" style="min-width:0">'+
      '<b class="one" style="display:block;color:var(--gold-deep);font-size:var(--fs-md)">จัดซื้อกำลังตรวจคำตอบของคุณ</b>'+
      '<span class="one" style="display:block;font-size:var(--fs-meta);color:var(--ink-2);margin-top:2px" title="'+esc(sum)+'">'+esc(sum)+'</span></span>'+
      '<button class="btn sm navy" style="flex-shrink:0" data-act="reedit:'+esc(po.id)+'">แก้คำตอบ</button></div>'+
    '<div class="one dim" style="font-size:var(--fs-meta)" title="'+esc(sub)+'">'+esc(sub)+'</div></div>';
}
function poReadBody(po){
  var sums = poBaseSums(po), free = poFree(po);
  var groups = brandGroups(po.lines, function (l) { return P[l.p]; }, function (l) { return l.base; });
  return (po.state === 'รอจัดซื้อตรวจ' ? poReplyPanel(po) : '')+
    '<div class="flexrow" style="padding:0 2px"><b style="font-size:var(--fs-lg)">'+po.lines.length+' รายการ</b><span class="sp"></span>'+
      '<span class="dim" style="font-size:var(--fs-meta)">เรียงแบรนด์ → ขนาด → มูลค่า</span></div>'+
    groups.map(function (g) {
      return '<div class="sect" style="gap:9px">'+
        '<div class="flexrow" style="padding:0 4px"><b class="one" style="font-size:13px;color:var(--ink-2)">'+esc(g.brand === '-' ? 'อื่นๆ' : g.brand)+'</b>'+
        '<span class="dim" style="font-size:var(--fs-meta);flex-shrink:0">'+g.items.length+' รายการ</span><span class="sp"></span>'+
        '<span class="bb" style="font-size:13px;color:var(--ink-2);flex-shrink:0">'+baht(g.total)+'</span></div>'+

/* ══ รายละเอียดสินค้า — กดการ์ดสินค้าแล้วเปิดหน้าเต็ม (แบบ A · Surat ให้ทำ 2026-09-23) ══ */
function fmtK(n){                                             /* ตัวเลขยาวย่อหน่วยให้อยู่บรรทัดเดียว เช่น 12.5K */
  n = +n || 0; var a = Math.abs(n);
  if (a >= 1e6) return round1(n / 1e6) + 'M';
  if (a >= 1e4) return round1(n / 1e3) + 'K';
  return fmtN(n);
}
function thAuto(iso){ return Math.abs(daysFromToday(iso)) > 180 ? thLong(iso) : thShort(iso); }   /* เกินครึ่งปี = ใส่ปีด้วย */
function fmtR(n){ n = +n || 0; return Math.abs(n) >= 10 ? fmtK(Math.round(n)) : fmtN(round1(n)); }   /* 10 ขึ้นไปไม่ต้องมีทศนิยม */
function prodPOs(p){                                          /* ใบสั่งซื้อที่มีสินค้านี้ (รวมของแถม) · ลำดับตาม POS = กำหนดส่ง เลยกำหนดขึ้นก่อน */
  return POS.filter(function (po) {
    return po.lines.some(function (l) { return l.p === p.id; }) || (po.free || []).some(function (f) { return f.p === p.id; });
  });
}
function prodPoCS(po, p){                                     /* สินค้านี้ในใบนี้กี่ลัง — บรรทัดชิ้น/แพ็คแปลงเป็นลังก่อน */
  var n = 0;
  po.lines.forEach(function (l) { if (l.p === p.id) n += toCS(p, l.u, l.qty); });
  (po.free || []).forEach(function (f) { if (f.p === p.id) n += toCS(p, unitCode(f.unit), f.qty); });
  return round1(n);
}
function lastCost(p){                                         /* ทุน/ลัง จากใบรับสินค้าล่าสุดที่มีมูลค่า (VALUE รวม VAT แล้ว) */
  var b = null;
  Object.keys(p.ib || {}).forEach(function (w) { var x = p.ib[w]; if (x && x.value > 0 && (!b || x.date > b.date)) b = x; });
  return b ? { inc:b.value, ex:p.vat === false ? b.value : b.value / (1 + VAT_RATE), date:b.date } : null;
}
/* คลังที่มีของก่อน (มาก→น้อย) → ของหมดแต่ยังขายอยู่ → ไม่มีขายเลย */
function prodWhRows(p){
  var rank = function (r) { return r.st > 0 ? 0 : r.avg > 0 ? 1 : 2; };
  return Object.keys(WH).map(function (w) {
    var ea = p.stEA[w] || 0, avg = p.avg[w] || 0, ib = p.ib[w];
    return { w:w, st:p.st[w] || 0, avg:avg, cover:avg > 0 && ea > 0 ? Math.round(ea / avg) : null,   /* AVERAGE 60D = ชิ้น/วัน อยู่แล้ว */
             ib:ib ? ib.date : '', def:p.defEA[w] || Math.round((p.def[w] || 0) * p.ea), per:p.ea };
  }).sort(function (a, b) { return rank(a) - rank(b) || b.st - a.st || b.avg - a.avg; });
}
function pdStat(label, val, unit){
  return '<div class="pd-stat"><div class="l">'+label+'</div><div class="v">'+val+(unit ? ' <small>'+unit+'</small>' : '')+'</div></div>';
}
function pdWhRow(r){
  var out = r.st <= 0 && r.avg > 0, idle = r.st <= 0 && r.avg <= 0;
  var sub = out ? 'ของหมด · ยังขาย ' + fmtR(r.avg) + ' ชิ้น/วัน' + (r.ib ? ' · รับล่าสุด ' + thAuto(r.ib) : '')
          : idle ? 'ไม่มีขาย' + (r.ib ? ' · รับล่าสุด ' + thAuto(r.ib) : ' · ยังไม่เคยรับเข้า')
          : (r.avg > 0 ? 'ขาย ' + fmtR(r.avg) + ' ชิ้น/วัน' : 'ไม่มียอดขาย 60 วัน') + (r.ib ? ' · รับเข้า ' + thAuto(r.ib) : '');
  var right = r.cover != null ? 'พอ ' + fmtN(r.cover) + ' วัน' : out ? 'หมดแล้ว' : '';
  return '<div class="pd-row'+(out ? ' out' : idle ? ' idle' : '')+'">'+
    '<i class="dot" style="background:'+whInfo(r.w).c+'"></i>'+
    '<span class="grow" style="min-width:0"><span class="one nm">'+esc(whName(r.w))+'</span>'+
      '<span class="one sub" title="'+esc(sub)+'">'+esc(sub)+'</span></span>'+
    '<span class="pd-num"><b>'+fmtQ(r.st)+'</b>'+(right ? '<span>'+esc(right)+'</span>' : '')+'</span>'+
    (r.def > 0 ? '<span class="chip clay" title="ของเสียในคลัง '+esc(DEF_E[r.w] || 'E')+'">เสีย '+esc(qtyCE(r.def, r.per))+'</span>' : '')+
  '</div>';
}
/* ราคาขายของรัตนที่ซัพเห็น เป็นช่องเรียงแถวเดียว (แบบย่อ · Surat เคาะ 2026-09-24) · ตัวเล็กใต้ราคา = กำไรต่อหน่วยจากทุนล่าสุด (ก่อน VAT ทั้งคู่) */
function pdPrice(p){
  var cost = lastCost(p), list = shownPrices(p), sent = !!(PDATA[p.id] || {}).cost || costAcked(p);
  if (!list.length) return '<div class="card flat pd-price" data-tweak-card="ตารางราคาขาย"><div class="one dim" style="font-size:var(--fs-sm)">ยังไม่มีราคาขายของสินค้านี้ในระบบ</div></div>';
  var retail = list.filter(function (x) { return x.k === 's03'; }), whole = list.filter(function (x) { return x.k === 's00'; });
  var neg = {};
  function tile(x){
    var cu = cost ? costPer(p, x.u, cost.ex) : 0, gap = cu ? x.sell - cu : null, bad = gap != null && gap < -0.005;
    if (bad) neg[x.k] = 1;
    var m = gap == null ? '' : bad ? (sent ? '<i class="ok">ส่งทุนจริงแล้ว</i>' : '<i class="dn" title="ต่ำกว่าทุน">−'+Math.abs(gap).toFixed(2)+'</i>')
                                   : '<i class="up">+'+gap.toFixed(2)+'</i>';
    return '<div class="ptile '+(x.k === 's00' ? 'pt-w' : 'pt-r')+(bad ? ' neg' : '')+'"><span class="u">'+esc(unitLabel(p, x.u))+'</span><b title="'+bahtP(x.sell)+'">'+bahtP(x.sell)+'</b>'+m+'</div>';
  }
  var tiles = retail.map(tile).join('') + whole.map(tile).join('');
  return '<div class="card flat pd-price" data-tweak-card="ตารางราคาขาย">'+
    (cost ? '<div class="pd-cost"><span class="muted" style="flex-shrink:0">ทุนล่าสุด</span><b>'+baht2(cost.ex)+'</b><span class="muted" style="flex-shrink:0">/ลัง</span>'+
              '<span class="sp"></span><span class="one dim" style="font-size:var(--fs-xs)">'+(p.vat === false ? 'ไม่มี VAT' : 'รวม VAT '+baht2(cost.inc))+' · '+esc(thAuto(cost.date))+'</span></div>'
          : '<div class="pd-cost"><span class="one muted">ยังไม่มีทุนจากใบรับสินค้า — โชว์เฉพาะราคาขาย</span></div>')+
    '<div class="ptiles" style="grid-template-columns:repeat('+list.length+',minmax(0,1fr))">'+
      (retail.length ? '<span class="pg pt-r'+(neg.s03 ? ' neg' : '')+'" style="grid-column:span '+retail.length+'">ราคาปลีก</span>' : '')+
      (whole.length ? '<span class="pg pt-w'+(neg.s00 ? ' neg' : '')+'">ส่งร้านซื้อเยอะ</span>' : '')+
      tiles+'</div>'+
    (cost ? '<div class="one dim" style="font-size:var(--fs-xs)">ตัวเล็ก = กำไรต่อหน่วยจากทุนล่าสุด · แดง = ต่ำกว่าทุน</div>' : '')+
  '</div>';
}
/* ราคาเลขยาวในช่องแคบ → ย่อตัวเลขลงทีละ 1px จนพอดีช่อง (ต่ำสุด --fs-price-min) ไม่ตัดเลขทิ้ง
   ย่อสุดแล้วยังไม่พอ (ครบ 4 หน่วย + ราคาหลักพัน) → "ส่งร้านซื้อเยอะ" ลงแถวที่ 2 ช่องปลีกกว้างขึ้น */
function fitTiles(host){
  var g = host.querySelector('.ptiles'); if (!g) return;
  var min = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--fs-price-min')) || 12;
  function fit(){
    var ok = true;
    [].forEach.call(g.querySelectorAll('.ptile b'), function (b) {
      b.style.fontSize = '';
      var fs = parseFloat(getComputedStyle(b).fontSize);
      while (b.scrollWidth > b.clientWidth + 0.5 && fs > min) { fs -= 1; b.style.fontSize = fs + 'px'; }
      if (b.scrollWidth > b.clientWidth + 0.5) ok = false;
    });
    return ok;
  }
  var nr = g.querySelectorAll('.ptile.pt-r').length;
  if (!fit() && nr && g.querySelector('.ptile.pt-w')) {
    g.classList.add('two'); g.style.gridTemplateColumns = 'repeat(' + nr + ',minmax(0,1fr))';
    fit();
  }
}
function pdPOs(p){
  var all = prodPOs(p), open = all.filter(function (po) { return po.state !== 'ส่งครบแล้ว'; }), show = open.slice(0, 3);
  var done = all.length - open.length;
  return '<div class="sect" style="gap:10px">'+
    '<div class="sect-h"><b>ใบสั่งซื้อที่มีสินค้านี้</b><span class="sp"></span>'+
      (all.length > show.length ? '<button class="lnk" data-act="prodpo:'+esc(p.id)+'">ดูทั้งหมด '+all.length+' ใบ</button>' : '')+'</div>'+
    (show.length ? show.map(function (po) {
      var meta = [po.state, whName(po.wh), po.dueTh ? 'ส่ง ' + po.dueTh : ''].filter(Boolean).join(' · ');
      return '<button class="card pd-po" data-act="openpo:'+esc(po.id)+'" data-tweak-card="การ์ด PO ในสินค้า">'+
        '<span class="grow" style="min-width:0"><span class="flexrow" style="gap:7px;min-width:0"><b class="one" style="font-size:var(--fs-md)">'+esc(po.id)+'</b>'+
          (po.over ? '<span class="chip clay">เลยกำหนด '+po.over+' วัน</span>' : '')+'</span>'+
          '<span class="one dim" style="display:block;font-size:var(--fs-xs);margin-top:2px" title="'+esc(meta)+'">'+esc(meta)+'</span></span>'+
        '<span class="pd-num"><b>'+fmtQ(prodPoCS(po, p))+'</b><span>ลัง</span></span>'+ic('chev',18,'var(--ink-4)')+'</button>';
    }).join('') : '<div class="card flat empty" style="padding:18px">ไม่มีใบสั่งซื้อที่ยังไม่ปิด</div>')+
    (done ? '<div class="flexrow dim" style="font-size:var(--fs-sm);padding:0 4px">'+ic('check',15,'var(--teal)')+
      '<span class="one">ส่งครบแล้ว '+done+' ใบใน 30 วันที่ผ่านมา</span></div>' : '')+
  '</div>';
}
function pdBarcodes(p){
  var units = ['EA','PA','BP','CS'].filter(function (u) { return p.units[u] && p.units[u].code; });
  var rows = units.length || !p.stub ? ['EA','PA','BP','CS'].map(function (u) {
      var x = p.units[u];
      if (!x || !x.code) return '<div class="pd-bc none"><b>'+u+'</b><span class="grow">ไม่มีหน่วยนี้</span></div>';
      return '<button class="pd-bc" data-act="copy:'+esc(x.code)+'" aria-label="คัดลอกบาร์โค้ดหน่วย'+UNIT_TH[u]+' '+esc(x.code)+'">'+
        '<b>'+u+'</b><code>'+esc(x.code)+'</code><span>'+fmtN(eaOf(p, u))+' ชิ้น</span></button>';
    })
    : (p.codes || []).map(function (c) {                     /* สินค้าที่มีแค่ในใบสั่งซื้อ — มีรหัสเดียวจาก PO */
      return '<button class="pd-bc" data-act="copy:'+esc(c)+'" aria-label="คัดลอกรหัส '+esc(c)+'"><b>รหัส</b><code>'+esc(c)+'</code></button>';
    });
  return '<div class="sect" style="gap:10px">'+
    '<div class="sect-h"><b>บาร์โค้ดทุกหน่วย</b><span class="sp"></span><span class="dim" style="font-size:var(--fs-xs)">แตะเพื่อคัดลอก</span></div>'+
    '<div class="card flat divide pd-list" data-tweak-card="บาร์โค้ดทุกหน่วย">'+rows.join('')+'</div></div>';
}
function pdInfo(p){
  var rows = [['แบรนด์ · ขนาด', [p.brand !== '-' ? p.brand : '', p.size].filter(Boolean).join(' · ') || '—']];
  if (p.full && p.full !== p.name) rows.push(['ชื่อเต็ม', p.full]);
  rows.push(['อายุสินค้า', p.life ? fmtN(p.life) + ' วัน' : '—'], ['ลัง / พาเลท', p.csPallet ? fmtN(p.csPallet) + ' ลัง' : '—'],
            ['ขายได้ ~60 วัน', bahtS(p.val)]);
  var nd = needsOf(p), miss = nd.filter(isMiss);
  return '<div class="sect" style="gap:10px">'+
    '<div class="sect-h"><b>ข้อมูลสินค้า</b><span class="sp"></span>'+
      '<span class="chip '+(miss.length ? 'clay' : 'teal')+'" style="height:21px">'+(miss.length ? 'ขาด '+miss.length+' อย่าง' : nd.length ? 'ส่งแล้ว รอลงระบบ' : 'ข้อมูลครบ')+'</span></div>'+
    '<div class="card flat pd-info" data-tweak-card="ข้อมูลสินค้า">'+rows.map(function (r) {
      return '<div class="pd-kv"><span>'+esc(r[0])+'</span><span title="'+esc(r[1])+'">'+esc(r[1])+'</span></div>';
    }).join('')+
    (miss.length ? '<div class="pd-kv"><span>ยังขาด</span><button class="lnk" style="min-width:0" data-act="fill:'+esc(p.id)+'">'+
        '<span class="one">'+esc(miss.map(function (n) { return n.short; }).join(' · '))+' · ใส่ข้อมูล</span></button></div>' : '')+
  '</div></div>';
}
V.product = function () {
  var p = P[S.prodId];
  if (!p) return emptyScr('s-product', 'สินค้า', 'ไม่พบสินค้านี้แล้ว', 'tab:products', 'ไปที่สินค้าของฉัน');
  var tot = 0, totEA = 0, avg = 0;
  Object.keys(WH).forEach(function (w) { tot += p.st[w] || 0; totEA += p.stEA[w] || 0; avg += p.avg[w] || 0; });
  var cover = avg > 0 && totEA > 0 ? Math.round(totEA / avg) : null;
  var bcEA = (p.units.EA || {}).code || '';
  var chips = '<span class="chip '+(p.stub ? 'grey' : p.status === 'ขายอยู่' ? 'teal' : 'goldsoft')+'">'+esc(p.status)+'</span>'+
    (p.stub ? '' : '<span class="chip onnavy">'+fmtN(p.ea)+' ชิ้น/ลัง'+(p.vat === false ? ' · ไม่มี VAT' : '')+'</span>')+
    (bcEA ? '<button class="chip onnavy bc" type="button" data-act="copy:'+esc(bcEA)+'" aria-label="คัดลอกบาร์โค้ด EA '+esc(bcEA)+'"><span>EA</span>'+esc(bcEA)+'</button>' : '');
  return '<div class="scr" id="s-product">'+
    '<div class="hero">'+
      '<div class="flexrow">'+
        '<button class="iconbtn back" data-act="back:products" aria-label="ย้อนกลับ">'+ic('back',21)+'</button>'+
        '<span class="grow one" style="font-size:13px;color:var(--on-navy-2)">สินค้าของฉัน'+(p.brand && p.brand !== '-' ? ' · '+esc(p.brand) : '')+'</span></div>'+
      '<div class="flexrow" style="gap:14px;margin-top:12px;align-items:flex-start">'+
        '<span class="thumb pd-thumb" style="background:'+p.bg+'">'+art(p,40)+'</span>'+
        '<span class="grow" style="min-width:0;display:flex;flex-direction:column;gap:9px">'+
          '<span class="pd-name">'+esc(p.full || p.name)+'</span>'+
          '<span class="pd-chips">'+chips+'</span></span></div>'+
    '</div>'+
    '<div class="body pull" style="gap:var(--sp-5)" data-tweak="รายละเอียดสินค้า">'+
      (p.stub ? '' : pdNeeds(p))+
      (p.stub
        ? '<div class="panel"><div class="one dim" style="font-size:var(--fs-sm)">ยังไม่อยู่ในทะเบียนสินค้า — มีแค่ในใบสั่งซื้อ</div></div>'
        : '<div class="card lift grid3" style="padding:14px 16px;gap:10px" data-tweak-card="ตัวเลขสินค้า">'+
            pdStat('สต็อกรวม', fmtR(tot), 'ลัง')+
            pdStat('ขายเฉลี่ย/วัน', fmtR(avg), 'ชิ้น')+
            pdStat('พอขายอีก', cover != null ? '~'+fmtK(cover) : '—', cover != null ? 'วัน' : '')+'</div>'+
          '<div class="sect" style="gap:10px">'+
            '<div class="sect-h"><b>สต็อกรายคลัง</b><span class="sp"></span><span class="dim" style="font-size:var(--fs-xs)">ลัง · พอขายกี่วัน</span></div>'+
            '<div class="card flat divide pd-list" data-tweak-card="สต็อกรายคลัง">'+prodWhRows(p).map(pdWhRow).join('')+'</div></div>'+
          '<div class="sect" style="gap:10px">'+
            '<div class="sect-h"><b>ราคาขายของรัตน</b><span class="sp"></span><span class="dim" style="font-size:var(--fs-xs)">ก่อน VAT · เทียบทุน</span></div>'+
            pdPrice(p)+'</div>')+
      pdPOs(p)+
      pdBarcodes(p)+
      (p.stub ? '' : pdInfo(p))+
    '</div></div>';
};

/* ══ ข้อมูลสินค้าที่ขาด — ปุ่มในหน้าสินค้า + ฟอร์มเฉพาะที่ขาด + รายการจากหน้าแรก (แบบในผืน "SupplyLink ใส่ข้อมูลสินค้าที่ขาด" · Surat ให้ทำ 2026-09-24) ══
   ขาด = น้ำหนัก/ลัง · ขนาดลัง · รูปด้านหน้า (จากทะเบียนสินค้า) + ราคาที่ซัพเห็นตัวไหนต่ำกว่าทุน → ให้ซัพใส่ทุนจริง + เหตุผล
   ส่งแล้วรอจัดซื้อลงระบบ = st 'sent' ไม่นับเป็นงานค้าง ไม่ถามซ้ำ · ของพรีเมียม/ของแถมไม่นับ */
function needsOf(p){
  if (!p || p.stub || p.prem) return [];
  var s = PDATA[p.id] || {}, m = p.miss || [], out = [];
  if (m.indexOf('น้ำหนัก') >= 0) out.push({ k:'w', t:'น้ำหนัก 1 ลัง', short:'น้ำหนัก', st:s.w ? 'sent' : 'miss' });
  if (m.indexOf('ก×ย×ส') >= 0) out.push({ k:'d', t:'ขนาดลัง กว้าง × ยาว × สูง', short:'ขนาดลัง', st:s.d ? 'sent' : 'miss' });
  if (m.indexOf('รูปสินค้า') >= 0) out.push({ k:'img', t:'รูปด้านหน้าสินค้า', short:'รูป', st:s.img ? 'sent' : 'miss' });
  var c = lastCost(p), loss = c ? lossList(p, c.ex) : [];
  if (loss.length && (s.cost || !costAcked(p))) out.push({ k:'cost', t:loss.length === 1 ? loss[0].tier + ' ต่ำกว่าทุน' : 'ราคาขาย ' + loss.length + ' หน่วยต่ำกว่าทุน',
                               short:'ต่ำกว่าทุน', st:s.cost ? 'sent' : 'miss', loss:loss, cost:c });
  return out;
}
/* ซัพตอบเรื่องต่ำกว่าทุนแล้ว + จัดซื้อปิดแถวแล้ว + ทุนล่าสุดยังเท่าตอนตอบ = ไม่ถามซ้ำ · ทุนเปลี่ยน (รับของรอบใหม่) = ถามใหม่ */
function costAcked(p){
  var a = (PDATA[p.id] || {}).costAck, c = lastCost(p);
  return !!(a && c && Math.abs(+a - c.inc) < 0.01);
}
function isMiss(n){ return n.st === 'miss'; }
function perUnit(u){ return u === 'EA' ? 'ชิ้น' : UNIT_TH[u]; }
function lossGap(n){ var x = n.loss[0]; return (n.loss.length > 1 ? 'มากสุด ' : '') + '−' + baht2(x.gap) + '/' + perUnit(x.u); }
function sentText(k, s){
  if (k === 'w') return s.w ? s.w.v + ' กก.' : '—';
  if (k === 'd') return s.d ? s.d.v + ' ซม.' : '—';
  if (k === 'img') return s.img ? 'ด้านหน้า 1 รูป' : '—';
  if (!s.cost) return '—';
  return [s.cost.v ? '฿' + s.cost.v : '', s.cost.why].filter(Boolean).join(' · ') || 'ส่งคำอธิบายแล้ว';
}
var NEED_KV = { w:'น้ำหนัก 1 ลัง', d:'ขนาดลัง', img:'รูปสินค้า', cost:'ทุนจริง/ลัง' };
/* การ์ดบนสุดของหน้าสินค้า: ยังขาด = แดง + ปุ่มใส่ข้อมูล · ส่งครบแล้ว = เขียว รอจัดซื้อลงระบบ */
function pdNeeds(p){
  var nd = needsOf(p); if (!nd.length) return '';
  var miss = nd.filter(isMiss), s = PDATA[p.id] || {};
  if (miss.length) return '<div class="needc" data-tweak-card="การ์ดข้อมูลที่ขาด">'+
      '<div class="flexrow" style="gap:var(--sp-3)"><span class="ic sol">'+ic('list',20,'#fff')+'</span>'+
        '<span class="grow"><b class="one nt">ข้อมูลสินค้ายังไม่ครบ '+miss.length+' อย่าง</b>'+
        '<span class="one ns">จัดซื้อใช้ข้อมูลนี้ตอนสั่ง ตอนรับของ และตั้งราคา</span></span></div>'+
      '<div class="needl">'+nd.map(function (n) {
        var r = n.st === 'sent' ? '<span class="nr ok">ส่งแล้ว</span>' : n.k === 'cost' ? '<span class="nr bad">'+esc(lossGap(n))+'</span>' : '<span class="nr">ยังไม่มี</span>';
        return '<div><span class="grow one" title="'+esc(n.t)+'">'+esc(n.t)+'</span>'+r+'</div>';
      }).join('')+'</div>'+
      '<button class="btn gold" type="button" data-act="fill:'+esc(p.id)+'">'+ic('edit',18)+'ใส่ข้อมูลที่ขาด</button></div>';
  return '<div class="needc ok" data-tweak-card="การ์ดข้อมูลที่ขาด">'+
      '<div class="flexrow" style="gap:var(--sp-3)"><span class="ic sol">'+ic('check',20,'#fff')+'</span>'+
        '<span class="grow"><b class="one nt">ส่งข้อมูลแล้ว · รอจัดซื้อลงระบบ</b>'+
        '<span class="one ns">'+(s.at ? 'ส่งเมื่อ '+esc(thDT(s.at))+' · ' : '')+nd.length+' อย่าง</span></span></div>'+
      '<div class="needl kv">'+nd.map(function (n) {

function photoSlot(i, label){

  return '<button class="photo add" data-act="addphoto:'+i+'">'+ic('plus',22,'var(--gold-ink)')+
    '<span class="bb" style="font-size:var(--fs-xs);color:var(--gold-deep)">'+esc(label)+'</span></button>';

/* ลากติ๊กของเสียหลายแถว (ui-kit RK.multiselect) — จับที่ช่องติ๊กเท่านั้น ส่วนอื่นของแถวกดเปิดสินค้าได้ปกติ */
var DMS = null;                                                /* ตัวลากติ๊กที่ใช้อยู่ — วาดจอใหม่ต้องปิดตัวเก่าก่อน ไม่งั้นตัวฟังที่ document ค้างสะสม */
function bindDefectPick(host){
  if (DMS) { S.dmsLast = DMS.last(); DMS.destroy(); DMS = null; }
  var list = host.querySelector('#dlist');
  if (!list || !window.RK || !RK.multiselect) return;
  if (S.dmsLast != null) list.__rkLast = S.dmsLast;           /* Shift+คลิกเลือกเป็นช่วง ต่อจากแถวที่แตะล่าสุด */
  var ms = RK.multiselect(list, {
    row:'[data-ms]', handle:'[data-tick]', scroller:host.querySelector('.body'),

    apply:function (k, on) {
      if (on) S.dsel[k] = true; else delete S.dsel[k];
      [].forEach.call(list.querySelectorAll('[data-ms]'), function (r) {

  });

/* ปุ่มย้อนกลับของมือถือ (Android ใน LINE) — ยังอยู่หน้าลึก = ย้อนทีละหน้า ไม่ใช่ปิดแอปทิ้ง
   วางหน้ากัน 1 ชั้นใน history ไว้เสมอเมื่อไม่ได้อยู่หน้าแรก · อยู่หน้าแรกแล้วกดย้อน = ออกจากแอปตามปกติ */
var TRAP = false, SKIP_POP = false;
function atRoot(){ return (S.route === 'home' || S.route === 'line') && !S.hist.length; }
function syncTrap(){
  if (!APP_ON) return;
  try {
    if (!atRoot() && !TRAP) { history.pushState({ slTrap:1 }, '', location.href); TRAP = true; }
    else if (atRoot() && TRAP) { SKIP_POP = true; TRAP = false; history.back(); }
  } catch (e) {}
}
window.addEventListener('popstate', function () {
  if (SKIP_POP) { SKIP_POP = false; return; }
  TRAP = false;
  var scan = $('rkScan'), g = $('gate');
  if ($('calsheet') || $('sheet')) closeSheet();
  else if (scan && scan.classList.contains('on') && window.RK && RK.scan) RK.scan.close();
  else if (document.querySelector('.rk-dd.on') && window.RK && RK.closeDropdown) RK.closeDropdown();
  else if (APP_ON && g.classList.contains('on') && /^(policy|pickvendor)$/.test(g.getAttribute('data-kind') || '')) hideGate();
  else if (APP_ON && !atRoot()) {
    var r = S.hist.pop(); S.route = (r && V[r]) ? r : 'home';
    try { history.replaceState(null, '', '#/' + S.route); } catch (e) {}
    return render();
  }
  syncTrap();
});

/* ══ คุยกับหลังบ้าน ══ */
var SES = { token:'', uid:'' }, AUTH = null, LAST_FETCH = 0, refreshing = null;
function rawApi(action, p, ms){
  if (MODE === 'demo') return demoApi(action, p);
  var body = JSON.stringify(Object.assign({}, p || {}, { action:action }));
  var ctl = typeof AbortController !== 'undefined' ? new AbortController() : null;
  var t = setTimeout(function () { if (ctl) ctl.abort(); }, ms || 30000);
  /* text/plain = ไม่มี preflight (GAS ไม่รองรับ OPTIONS) */
  return fetch(CONFIG.GAS_URL, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body:body, signal:ctl ? ctl.signal : undefined })
    .then(function (r) { if (!r.ok) throw new Error('หลังบ้านตอบกลับผิดปกติ (' + r.status + ')'); return r.text(); })
    .then(function (txt) { try { return JSON.parse(txt); } catch (e) { throw new Error('หลังบ้านยังไม่พร้อมใช้งาน'); } })
    .catch(function (e) {
      if (e && e.name === 'AbortError') throw new Error('หลังบ้านตอบช้าเกินไป ลองอีกครั้ง');
      if (e instanceof TypeError) throw new Error('เชื่อมต่อหลังบ้านไม่ได้ — เช็คอินเทอร์เน็ต แล้วลองใหม่');
      throw e;
    })
    .then(function (j) { clearTimeout(t); return j; }, function (e) { clearTimeout(t); throw e; });
}
function api(action, p, retried){
  var body = Object.assign({ token:SES.token, vendor:VENDOR.code }, p || {});

    if (res && res.code === 'SESSION_EXPIRED' && !retried) return reauth().then(function () { return api(action, p, true); });
    if (res && res.code === 'PDPA_REQUIRED') {                   /* หลังบ้านไม่ให้ใช้ต่อจนกว่าจะรับทราบนโยบาย */
      AUTH = AUTH || {}; AUTH.pdpa = res.pdpa; AUTH.policy = res.pdpa; gate('pdpa', res.pdpa);
      throw new Error('ต้องรับทราบนโยบายความเป็นส่วนตัวก่อน');
    }

  });
}
/* ทุกการบันทึกแนบเลขคำขอ (rid) — คำขอเดิมเป๊ะส่งซ้ำ (เน็ตช้าจนเลิกรอ แล้วกดใหม่) หลังบ้านตอบผลเดิม ไม่จอง/ไม่บันทึกซ้อน
   แก้อะไรในคำขอแล้วส่งใหม่ = เลขใหม่ · สำเร็จแล้วล้างเลข */
var RID = {};

/* WSEQ นับครั้งที่บันทึก — ข้อมูลที่เริ่มดึงก่อนการบันทึกล่าสุด = ของเก่า ห้ามเอามาทับ (คิวที่เพิ่งจองจะหาย)

  return api(action, Object.assign({ rid:ridFor(rk) }, payload)).then(function (res) { WSEQ++; delete RID[rk]; S.sending = false; return res; },
    function (e) { WSEQ++; S.sending = false; render(); toast(errText(e)); throw e; });
}
function clientInfo(extra){

}
function reauth(){

    if (!res || res.ok === false) throw new Error((res && res.error) || 'เข้าใช้งานใหม่ไม่สำเร็จ');
    if (res.status !== 'ok') { gate(res.status, res); throw new Error('บัญชียังไม่ได้ผูกกับบริษัท'); }

var refreshW = -1, refreshAgain = false;
function refresh(silent, announce){
  if (refreshing) { if (refreshW !== WSEQ) refreshAgain = true; return refreshing; }   /* ตัวที่วิ่งอยู่เริ่มก่อนการบันทึก = ดึงใหม่อีกรอบหลังจบ */
  if (!SES.token || !VENDOR.code || (WANT && WANT !== VENDOR.code)) return Promise.resolve();   /* กำลังเปลี่ยนบริษัท = loadVendor ดึงให้อยู่แล้ว */
  var w = refreshW = WSEQ, code = VENDOR.code;
  refreshing = api('bundle', { fresh:true, vendor:code }).then(function (res) {
    if (w !== WSEQ || code !== VENDOR.code || (WANT && WANT !== code)) { refreshAgain = refreshAgain || w !== WSEQ; return; }
    setBundle(res.data);
    if (announce) toast('อัปเดตแล้ว ' + S.syncedAt);
  }).catch(function (e) {
    if (S.stale) { S.stale = false; softRender(); toast('อัปเดตข้อมูลไม่ได้ — แสดงข้อมูลล่าสุดที่เก็บไว้'); return; }   /* ไม่ค้าง "กำลังอัปเดต…" */

}

/* ── จำข้อมูลล่าสุดไว้ในเครื่อง (ของ LINE คนนี้) → เปิดแอปครั้งถัดไปเห็นทันที แล้วค่อยอัปเดตเบื้องหลัง ── */

    document.body.classList.add('is-demo');
    PROFILE = { name:'Napa (ตัวอย่าง)', picture:'' };
    SES.token = 'demo';
    setBundle(demoBundle());
    VENDORS = [{ code:'DEMO-001', name:'บริษัท ตัวอย่าง จำกัด' }];
    AUTH = { policy:PDPA_DEFAULT };
    if (lsGet('sl_demo_pdpa') !== PDPA_DEFAULT.version) { AUTH.pdpa = PDPA_DEFAULT; gate('pdpa', PDPA_DEFAULT); }   /* ใช้งานครั้งแรก = ต้องรับทราบก่อน */
    return;
  }
  if (MODE === 'setup') return gate('setup');
  /* เคยเข้าแล้ว = โชว์ข้อมูลล่าสุดที่เก็บในเครื่องทันที ไม่ต้องรอ LINE/หลังบ้าน · เช็คตัวตนกับ LINE ตามหลัง ถ้าคนละบัญชีล้างทิ้ง */
  var lastUid = lsGet('sl_last_uid'), early = null;
  if (lastUid) { SES.uid = lastUid; early = cacheRead(); if (early) { useCache(early); startApp(); } }
  if (!early) gate('loading', 'กำลังเชื่อมต่อ LINE…');
  withTimeout(waitLiff(), 15000, 'โหลด LINE ไม่สำเร็จ — เช็คอินเทอร์เน็ต').then(function () {
    return withTimeout(liff.init({ liffId:CONFIG.LIFF_ID }), 20000, 'เชื่อมต่อ LINE นานเกินไป');
  }).then(function () {
    if (!liff.isLoggedIn()) {                                /* เปิดจากเบราว์เซอร์นอก LINE → ล็อกอิน LINE ก่อน */
      gate('loading', 'กำลังไปหน้าเข้าสู่ระบบ LINE…');
      liff.login({ redirectUri:location.href.split('#')[0] });
      return;
    }
    var dec = safe(function () { return liff.getDecodedIDToken(); }, null) || {};
    var uid = dec.sub || '';
