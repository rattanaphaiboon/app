    const s = JSON.parse(localStorage.getItem('hrc_session') || 'null');
    if (s && s.token && s.exp > Date.now() + 60000) return s;
  } catch (_) {}
  try {   // แอปมือถือในเบราว์เซอร์เดียวกัน (โดเมนเดียวกัน) — กุญแจ S2 ตัวเดียวกันใช้ได้เลย
    const s = JSON.parse(localStorage.getItem('rfc3_session') || 'null');
    if (s && s.token && String(s.token).indexOf('S2.') === 0 && s.exp > Date.now() + 60000 && s.u) return { token: s.token, exp: s.exp, u: s.u, fromApp: true };
  } catch (_) {}
  return null;
}
function sessSave() { try { localStorage.setItem('hrc_session', JSON.stringify({ token: S.token, exp: S.exp, u: S.u })); } catch (_) {} }
function isHrUser(u) { return !!(u && (u.role === 'hr' || /ทรัพยากรบุคคล/.test(String(u.department || '')))); }

async function post(body) {
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 90000);
  try {
    const r = await fetch(CFG.api, { method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body), signal: ctl.signal });
    const txt = (await r.text()).trim();
    if (txt[0] !== '{' && txt[0] !== '[') throw new Error('เซิร์ฟเวอร์ตอบไม่เป็นข้อมูล (' + r.status + ')');
    return JSON.parse(txt);
  } finally { clearTimeout(t); }
}
async function api(action, payload) {
  const j = await post(Object.assign({ action, idToken: S.token }, payload || {}));
  if (!j.ok) {
    if (/^session_/.test(String(j.code || '')) || /^Unauthorized/.test(String(j.error || ''))) { toast('กุญแจเข้าระบบหมดอายุ — กรุณาเข้าสู่ระบบใหม่', 'warn'); try { localStorage.removeItem('hrc_session'); } catch (_) {} setTimeout(() => location.reload(), 1500); }
    const e = new Error(j.error || 'เกิดข้อผิดพลาด'); e.code = j.code; e.srv = true; throw e;
  }
  return j;
}

function parseCsv(text) {
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true;
    else if (c === ',') { row.push(cur); cur = ''; }
    else if (c === '\n') { row.push(cur); rows.push(row); row = []; cur = ''; }
    else if (c !== '\r') cur += c;
  }
  if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
  return rows;
}

              position: ix(/^ตำแหน่ง$/, -1), employType: ix(/^ประเภทการจ้าง$/, -1), resignNotice: ix(/^วันที่แจ้งลาออก$/, -1), lastDay: ix(/^วันสิ้นสุดการทำงาน$/, -1), resignReason: ix(/^เหตุผลลาออก$/, -1), prevId: ix(/^เคยเป็นรหัส$/, -1), hrNote: ix(/^หมายเหตุ HR$/, -1), updatedAt: ix(/^แก้ไขล่าสุด$/, -1),   // v1.19 คอลัมน์เพิ่ม (Apps Script 9.82 สร้างต่อท้ายชีท)
              idCard: ix(/^เลขบัตรประชาชน$/, -1), ssoNo: ix(/^เลขประกันสังคม$/, -1), passportNo: ix(/^เลขหนังสือเดินทาง$/, -1), workPermitNo: ix(/^เลขใบอนุญาตทำงาน$/, -1), marital: ix(/^สถานะสมรส$/, -1), nameEn: ix(/^ชื่อ-สกุล \(ENG\)$/, -1), nickEn: ix(/^ชื่อเล่น \(ENG\)$/, -1) };   // v1.26 (Apps Script 9.95)

      phone: norm(r[C.phone]), photo: /^https?:/.test(norm(r[C.photo])) ? norm(r[C.photo]) : '', company: norm(r[C.company]), klang: norm(r[C.w]), src: 'users',

/* ══════════ v1.25 โหลดไว: จำข้อมูลพนักงาน + งวดล่าสุดไว้ในเครื่อง (แสดงทันที แล้วดึงใหม่เบื้องหลัง) · ออกจากระบบ = ล้าง ══════════ */
const HRC_CACHE = 'hrc_cache_v1', HRC_CACHE_MAX_AGE = 12 * 3600e3;
function cacheLoad_() {
  try {
    const c = JSON.parse(localStorage.getItem(HRC_CACHE) || 'null');
    if (!c || !S.u || c.who !== S.u.empId || Date.now() - c.at > HRC_CACHE_MAX_AGE) return false;
    if (Array.isArray(c.users) && c.users.length) S.users = c.users;
    if (Array.isArray(c.ptt)) S.ptt = c.ptt;
    rebuildIndex();
    if (c.hr && c.hr.period) { S.hr = c.hr; S.period = c.hr.period; S.hrFromCache = true; periodChip_(); }
    S.cacheAt = c.at;
    return true;
  } catch (e) { return false; }
}
function cacheSave_() {
  try {
    if (!S.u || !S.users.length) return;
    const c = { who: S.u.empId, at: Date.now(), users: S.users, ptt: S.ptt, hr: S.hrFromCache ? null : S.hr };
    let txt = JSON.stringify(c);
    if (txt.length > 3500000) { c.hr = null; txt = JSON.stringify(c); }   // ใหญ่เกิน = เก็บแค่รายชื่อ
    localStorage.setItem(HRC_CACHE, txt);

}

/* ══════════ v1.4 การมาทำงานประจำวัน (RATTANA แยกสาขา) — getDailyAttendance (Apps Script 9.59) ══════════
   แบบเดียวกับข้อความ HumanSoft Notify: มาทำงาน · วันหยุด · ลาแต่ละประเภท (A อนุมัติ / N รออนุมัติ) · ขาดงาน (ไม่มีสแกน)

async function loadAtt_(force) {
  const el = () => $('#attBody');
  if (!el()) return;
  const iso = S.attDate || todayIso(), c = S.att;
  if (!force && c && c.iso === iso && Date.now() - c.at < 3 * 60000) { el().innerHTML = attHtml_(c.d); return; }
  el().innerHTML = '<div class="muted"><span class="spin"></span> กำลังสรุปการมาทำงาน…</div>';
  try {
    const d = await api('getDailyAttendance', { date: iso });
    S.att = { iso, at: Date.now(), d };
    if (el() && (S.attDate || todayIso()) === iso) el().innerHTML = attHtml_(d);
  } catch (e) {
    const old = /Unknown action/i.test(String(e.message));
    if (el()) el().innerHTML = `<div class="alert ${old ? '' : 'bad'}">${old ? 'ต้อง Deploy Apps Script 9.59 ก่อน ถึงจะสรุปการมาทำงานได้' : h(e.message)}</div>`;
  }
}
function attSetDate_(v) { S.attDate = v || todayIso(); loadAtt_(true); }
function attHtml_(d) {
  if (!d || !d.ok) return `<div class="alert bad">${h((d && d.error) || 'โหลดไม่ได้')}</div>`;
  const nm = (arr, st) => arr.map(p => `<a href="#" onclick="openEmp('${h(p.id)}','time');return false" title="${h(p.name)} (${h(p.id)})">${h(p.label)}</a>${st ? `<span class="sm muted">(${h(p.st)})</span>` : ''}`).join(', ');
  const line = (label, n, names, color) => `<div class="dl"><div style="width:170px${color ? ';color:' + color : ''}">${h(label)}</div><div class="b" style="width:64px${color ? ';color:' + color : ''}">${n} คน</div><div style="flex:1;min-width:0">${names || ''}</div></div>`;
  const t = d.totals || {};
  let x = `<div class="sm muted" style="margin:-4px 0 10px">วัน${h(d.dow)}ที่ ${h(d.dmyBE)}${d.live ? ' · ข้อมูล ณ ' + h(d.at) + ' น. — คนที่มาสแกนทีหลังจะหายจากรายชื่อขาดเมื่อกด ↻' : ''}${d.sunday ? ' · วันอาทิตย์' : ''}${d.holiday ? ' · วันหยุด: ' + h(d.holiday) : ''}</div>
    <div class="grid g4" style="margin-bottom:12px">
      <div class="kpi"><div class="n">${t.total || 0}</div><div class="l">พนักงาน (สาขา ${h((d.branchesCfg || []).join(' · '))})</div></div>
      <div class="kpi"><div class="n ok">${t.present || 0}</div><div class="l">มาทำงาน (มีสแกน)</div></div>
      <div class="kpi"><div class="n info">${(t.leave || 0) + (t.off || 0)}</div><div class="l">ลา / วันหยุด</div></div>
      <div class="kpi"><div class="n ${t.absent ? 'bad' : 'ok'}">${t.absent || 0}</div><div class="l">ขาดงาน (ไม่มีสแกน)</div></div></div>`;
  (d.branches || []).forEach(g => {
    x += `<div style="border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:10px">
      <div class="b" style="margin-bottom:4px">สาขา ${h(g.w)} · ${h(g.company)} <span class="sm muted" style="font-weight:400">${g.total} คน</span></div>
      ${line('มาทำงาน', g.present, '', 'var(--ok)')}
      ${g.off.length ? line('วันหยุด', g.off.length, nm(g.off, true)) : ''}
      ${g.leaves.map(l => line(l.type, l.people.length, nm(l.people, true), 'var(--info)')).join('')}
      ${line('ขาดงาน (ไม่มีสแกน)', g.absent.length, nm(g.absent, false) || '<span class="muted">—</span>', g.absent.length ? 'var(--bad)' : 'var(--ok)')}
    </div>`;

}

async function reimbDecide_(i, decision) {

  if (decision === 'rejected') { note = prompt(`เหตุผลที่ไม่อนุมัติ (พนักงานจะเห็น) — ${d.name} · ${d.type} · ถูกหัก ${d.deductDate}`) || ''; if (!note.trim()) return; }
  else {
    const hasReq = rbHas(d.reqAmount), def = hasReq ? d.reqAmount : (rbHas(d.amount) ? Number(d.amount) : '');
    const s = prompt(`อนุมัติขอตกเบิกของ ${d.name} · ${String(d.type || '').replace(/^ขอตกเบิก\s*-\s*/, '')} · ถูกหัก ${d.deductDate}\n\nยอดอนุมัติคืน (บาท) — พนักงานขอ ${hasReq ? rbMoney(d.reqAmount) + ' บาท' : '— (ใบเดิม ไม่ได้ระบุ)'}${rbHas(d.amount) ? ' · ค่าแรงตามระบบ ' + d.amount + ' บาท' : ''}\nแก้ตัวเลขได้ถ้ายอดไม่ถูกต้อง`, def === '' ? '' : String(def));
    if (s === null) return;
    approvedAmount = s.trim() === '' ? '' : Math.round(parseFloat(s.replace(/,/g, '')) * 100) / 100;
    if (approvedAmount !== '' && !(approvedAmount > 0)) { toast('ยอดอนุมัติต้องมากกว่า 0 บาท', 'warn'); return; }
    if (approvedAmount !== '' && hasReq && Math.abs(approvedAmount - d.reqAmount) > 0.004) {

      if (!note) { toast('ปรับยอดต้องระบุเหตุผล', 'warn'); return; }
    }
  }
  try {
    const r = await api('approveAny', { sheet: d.sheet, row: d.row, decision, note, approverName: S.u.name, empId: d.empId, info: d.ainfo, ...(approvedAmount !== undefined ? { approvedAmount } : {}) });

}

    <div class="card"><h3>จุดสแกน / สาขา (แท็บ Locations)</h3><div class="tw" style="max-height:360px"><table><thead><tr><th class="l">รหัส</th><th class="l">ชื่อ</th><th>พิกัด</th><th>รัศมี (ม.)</th><th>QR</th></tr></thead><tbody>${(S.locations || []).map(l => `<tr><td class="l">${h(l.code)}</td><td class="l">${h(l.name)}</td><td class="sm">${Number(l.lat).toFixed(5)}, ${Number(l.lng).toFixed(5)}</td><td>${h(l.radius)}</td><td>${l.qr ? '✓' : ''}</td></tr>`).join('') || '<tr><td colspan="5" class="empty">ไม่มี</td></tr>'}</tbody></table></div></div>
    <div class="card"><h3>ลิงก์</h3><div class="dl"><a target="_blank" rel="noopener" href="https://docs.google.com/spreadsheets/d/${CFG.attendanceSheetId}/edit">ชีทหลักแอปลงเวลา (สรุปวัน · ลงเวลาAuto · การลาApp · โควต้าลา)</a></div><div class="dl"><a target="_blank" rel="noopener" href="https://docs.google.com/spreadsheets/d/${CFG.usersSheetId}/edit">ชีท Users (ทะเบียนพนักงาน RATTANA)</a></div><div class="dl"><a href="rattana-attendance.html">แอปมือถือ HR Rattana</a></div><div class="sm muted" style="padding-top:8px">หลังบ้าน HR v${CFG.ver} · เซิร์ฟเวอร์: <span id="pingV">…</span></div></div>
  </div>`;
  fetch(CFG.api + '?action=ping').then(r => r.json()).then(j => { const el = $('#pingV'); if (el) el.textContent = 'Apps Script ' + (j.v || '?'); }).catch(() => {});
  loadPerf_();
}
/* v1.1: เวลาจริงจากเซิร์ฟเวอร์ (Apps Script 9.56 getPerfStats) — ลงเวลา (ckperf: รอคิว/อยู่ในคิว/ทั้งคำขอ) + เปิดแอป/ฟีด (rqperf)
   ดูหลังช่วงคนเข้างาน/เลิกงาน ว่าช้าตรงไหน · เซิร์ฟเวอร์เก็บ ~300–400 ครั้งล่าสุดภายใน 6 ชม. */
async function loadPerf_() {
  const el = $('#perfBody'); if (!el) return;
  el.innerHTML = '<span class="spin"></span> กำลังโหลด…';
  try { const r = await api('getPerfStats', {}); if ($('#perfBody')) $('#perfBody').innerHTML = perfHtml_(r); }
  catch (e) { if ($('#perfBody')) $('#perfBody').innerHTML = '<div class="alert">' + (/Unknown action/.test(e.message) ? 'ต้อง Deploy Apps Script 9.56 ก่อน' : h(e.message)) + '</div>'; }
}
function perfHtml_(r) {
  const q = (a, p) => a.length ? a[Math.min(a.length - 1, Math.floor(a.length * p))] : NaN;
  const sec = (ms) => isFinite(ms) ? (ms / 1000).toFixed(1) + ' วิ' : '–';
  const hm = (t) => { const d = new Date(t); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
  const st = (arr) => { const s = arr.filter(x => isFinite(x)).sort((a, b) => a - b); return { n: s.length, p50: q(s, .5), p90: q(s, .9), max: s[s.length - 1] }; };
  const ck = (r.checkin || []).filter(x => Array.isArray(x)), rq = (r.req || []).filter(x => Array.isArray(x));
  if (!ck.length && !rq.length) return '<div class="empty">ยังไม่มีข้อมูล — รอให้มีคนใช้งานสักพัก (เก็บเฉพาะหลัง Deploy 9.56)</div>';
  const row = (label, s, extra) => '<tr><td class="l b">' + label + '</td><td>' + s.n + '</td><td>' + sec(s.p50) + '</td><td class="' + (s.p90 > 10000 ? 'abs' : '') + '">' + sec(s.p90) + '</td><td>' + sec(s.max) + '</td><td class="l sm muted">' + (extra || '') + '</td></tr>';
  let t = '<div class="tw" style="max-height:none;margin-bottom:12px"><table><thead><tr><th class="l">งาน</th><th>ครั้ง</th><th>กลาง</th><th>90% ไม่เกิน</th><th>ช้าสุด</th><th class="l">หมายเหตุ</th></tr></thead><tbody>';
  if (ck.length) {
    // ckperf: [เวลา, ชนิด, ก่อนเข้าคิว, รอคิว, อยู่ในคิว, ทั้งคำขอ, ได้คิว]
    const nolock = ck.filter(x => !x[6]).length;
    t += row('ลงเวลา (ทั้งคำขอ)', st(ck.map(x => +x[5])), hm(ck[0][0]) + '–' + hm(ck[ck.length - 1][0]) + (nolock ? ' · ⚠ รอคิวเกิน 25 วิ ' + nolock + ' ครั้ง' : ''));
    t += row('　รอคิวบันทึก', st(ck.map(x => +x[3])), 'คนสแกนพร้อมกันต้องต่อคิวเขียนชีท');
    t += row('　อยู่ในคิว', st(ck.map(x => +x[4])), 'อ่าน/เขียนชีท CheckinLog');
    t += row('　ก่อนเข้าคิว', st(ck.map(x => +x[2])), 'ตรวจหน้า + อัปรูป');
  }
  const NAME = { getBootstrap: 'เปิดแอป (ข้อมูลบูต)', getHomeBundle: 'ฟีดหน้าแรก + แจ้งเตือน', getCheckinLog: 'ประวัติสแกน', getPendingAll: 'คิวอนุมัติ', getFaceData: 'ข้อมูลใบหน้า' };
  Object.keys(NAME).forEach(a => {
    const xs = rq.filter(x => x[1] === a); if (!xs.length) return;
    t += row(NAME[a], st(xs.map(x => +x[3])), 'ตรวจกุญแจ กลาง ' + sec(st(xs.map(x => +x[2])).p50));
  });
  t += '</tbody></table></div>';
  // ราย 15 นาที — เห็นช่วงคนเยอะชัด
  const B = {};
  ck.forEach(x => { const k = Math.floor(x[0] / 900000); (B[k] = B[k] || { ck: [], bt: [] }).ck.push(+x[5]); });
  rq.filter(x => x[1] === 'getBootstrap').forEach(x => { const k = Math.floor(x[0] / 900000); (B[k] = B[k] || { ck: [], bt: [] }).bt.push(+x[3]); });
  const ks = Object.keys(B).map(Number).sort((a, b) => a - b);
  if (ks.length > 1) {
    t += '<div class="sm muted" style="margin-bottom:6px">ราย 15 นาที (จำนวนครั้ง · 90% ไม่เกิน)</div><div class="tw" style="max-height:320px"><table><thead><tr><th class="l">ช่วงเวลา</th><th>ลงเวลา</th><th>เปิดแอป</th></tr></thead><tbody>' +
      ks.map(k => { const b = B[k], a = st(b.ck), c = st(b.bt);
        return '<tr><td class="l">' + hm(k * 900000) + '–' + hm(k * 900000 + 900000) + '</td><td class="' + (a.p90 > 10000 ? 'abs' : '') + '">' + (a.n ? a.n + ' · ' + sec(a.p90) : '·') + '</td><td class="' + (c.p90 > 10000 ? 'abs' : '') + '">' + (c.n ? c.n + ' · ' + sec(c.p90) : '·') + '</td></tr>'; }).join('') +
      '</tbody></table></div>';
  }
  return t;
}
/* ══════════ ส่งออก Excel (HTML ที่ Excel เปิดได้ · เก็บสี) ══════════ */
function toXls(fname, title, headers, rows, colors) {
  const cell = (v, i, head) => `<t${head ? 'h' : 'd'} style="border:1px solid #999;padding:3px 6px;${head ? 'font-weight:bold;background:' + ((colors && colors[i]) || '#dbe8fb') + ';color:' + (colors && /^#(990000|7030a0|4472c4)$/i.test(colors[i]) ? '#fff' : '#000') : ''}${!head && typeof v === 'number' ? ';mso-number-format:\\@' : ''}">${h(v == null ? '' : v)}</t${head ? 'h' : 'd'}>`;
  const html = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="utf-8"><!--[if gte mso 9]><xml><x:ExcelWorkbook><x:ExcelWorksheets><x:ExcelWorksheet><x:Name>รายงาน</x:Name><x:WorksheetOptions><x:DisplayGridlines/></x:WorksheetOptions></x:ExcelWorksheet></x:ExcelWorksheets></x:ExcelWorkbook></xml><![endif]--></head><body><table><tr><td colspan="${headers.length}" style="font-weight:bold;font-size:14pt">${h(title)}</td></tr><tr>${headers.map((x, i) => cell(x, i, true)).join('')}</tr>${rows.map(r => '<tr>' + r.map((v, i) => cell(v, i, false)).join('') + '</tr>').join('')}</table></body></html>`;
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + html], { type: 'application/vnd.ms-excel;charset=utf-8' })); a.download = fname.replace(/[\\/:*?"<>|]/g, '_') + '.xls';
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 800);
  toast('⬇ ' + a.download, 'ok');
}
boot();
</script>
