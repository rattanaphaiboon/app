<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>หลังบ้าน HR · Rattana</title>
<!-- ============================================================
     หลังบ้าน HR (จอคอม) — v1.0 · 30/09/2026
     surat ส่งภาพหลังบ้าน HumanSoft 3 หน้ามาให้ทำแบบเดียวกัน: แถบเมนูซ้าย · การ์ดพนักงาน + ตารางเวลาทำงานรายวัน ·
     Dashboard ข้อมูลพนักงาน (เพศ/สัญชาติ/สาขา) · รายงานบันทึกการสแกนพร้อมรูป + ส่งออก Excel
     ► ใช้ Apps Script ตัวเดียวกับแอปมือถือ (9.55+) · เข้าสู่ระบบด้วยรหัส/รหัสผ่านเดียวกับแอป (กุญแจ S2 อายุ 7 วัน)
       เปิดแอปมือถือในเบราว์เซอร์เดียวกันอยู่แล้ว = เข้าได้เลย (อ่านกุญแจจาก localStorage rfc3_session ของแอป)
     ► ตัวเลขลงเวลาทั้งหมดอ่านจากแท็บ สรุปวัน / ลงเวลาAuto / การลาApp (สูตรที่ HR ใช้คิดเงินเดือน) — ไม่คำนวณซ้ำ
     ► เฉพาะ HR — ฝั่งเซิร์ฟเวอร์ตรวจสิทธิ์ทุกคำขออีกชั้น (hraDenied_) หน้านี้แค่ซ่อน/บอก
     ► ไม่มีความลับในไฟล์นี้ (URL/ID ชีทชุดเดียวกับที่อยู่ในแอปมือถืออยู่แล้ว)
     ============================================================ -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&display=swap">
<style>
:root { --navy:#0d1b3e; --navy2:#1a2f5e; --navy3:#243b73; --gold:#c9a84c; --gold2:#e8c86a; --blue:#4a8de6; --blue2:#dbe8fb;
  --bg:#f3f5f9; --card:#fff; --line:#e6eaf2; --text:#1a2230; --muted:#6b7590; --ok:#27ae87; --warn:#e6a23c; --bad:#e2574c; --info:#3b87c9; }
* { box-sizing:border-box; }
html, body { margin:0; height:100%; }
body { font-family:'Sarabun', 'Noto Sans Thai', system-ui, -apple-system, sans-serif; background:var(--bg); color:var(--text); font-size:14px; }
button, input, select, textarea { font:inherit; color:inherit; }
a { color:var(--info); }
[hidden] { display:none !important; }
.app { display:flex; min-height:100vh; }
/* ── แถบเมนูซ้าย ── */
.sb { width:236px; flex-shrink:0; background:linear-gradient(180deg, var(--navy) 0%, var(--navy2) 100%); color:#fff; display:flex; flex-direction:column; position:sticky; top:0; height:100vh; }
.sb .brand { padding:18px 18px 12px; display:flex; align-items:center; gap:10px; }
.sb .brand .lg { width:38px; height:38px; border-radius:11px; background:var(--gold); color:var(--navy); font-weight:800; display:flex; align-items:center; justify-content:center; font-size:15px; }
.sb .brand b { display:block; font-size:15px; } .sb .brand small { color:rgba(255,255,255,.7); font-size:11.5px; }
.sb nav { padding:6px 10px; flex:1; overflow-y:auto; }
.sb .lbl { font-size:10.5px; letter-spacing:.06em; color:rgba(255,255,255,.45); padding:12px 10px 4px; text-transform:uppercase; }
.sb .it { display:flex; align-items:center; gap:10px; width:100%; padding:10px 12px; border:0; background:none; color:rgba(255,255,255,.85); border-radius:10px; cursor:pointer; text-align:left; font-size:13.5px; font-weight:500; }
.sb .it:hover { background:rgba(255,255,255,.08); }
.sb .it.on { background:#fff; color:var(--navy); font-weight:700; }
.sb .it .ic { width:20px; height:20px; flex-shrink:0; display:flex; align-items:center; justify-content:center; }
.sb .it .bd { margin-left:auto; background:var(--bad); color:#fff; font-size:10.5px; font-weight:700; padding:2px 7px; border-radius:10px; }
.sb .it.on .bd { background:var(--bad); }
.sb .sub { padding-left:22px; }
.sb .ft { padding:12px 16px; font-size:11.5px; color:rgba(255,255,255,.55); border-top:1px solid rgba(255,255,255,.1); }
.sb .ft a { color:var(--gold2); text-decoration:none; }
/* ── ส่วนบน + เนื้อหา ── */
.wrap { flex:1; min-width:0; display:flex; flex-direction:column; }
.top { background:#fff; border-bottom:1px solid var(--line); padding:10px 22px; display:flex; align-items:center; gap:14px; position:sticky; top:0; z-index:20; }
.top .crumb { font-size:12px; color:var(--muted); } .top .ttl { font-size:18px; font-weight:800; }
.top .sp { flex:1; }
.top .chip { background:var(--blue2); color:var(--navy); border-radius:20px; padding:6px 12px; font-size:12.5px; font-weight:600; display:flex; align-items:center; gap:8px; }
.top .chip b { color:#1d4f9c; }
.top .usr { display:flex; align-items:center; gap:10px; }
.top .av { width:36px; height:36px; border-radius:50%; background:var(--gold); color:var(--navy); font-weight:800; display:flex; align-items:center; justify-content:center; }
.top .usr small { display:block; color:var(--muted); font-size:11px; }
main { padding:18px 22px 40px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px 18px; margin-bottom:14px; }
.card h3 { margin:0 0 10px; font-size:14.5px; font-weight:800; display:flex; align-items:center; gap:8px; }
.card h3 .sp { flex:1; }
.grid { display:grid; gap:12px; } .g4 { grid-template-columns:repeat(4,1fr); } .g3 { grid-template-columns:repeat(3,1fr); } .g2 { grid-template-columns:repeat(2,1fr); }
.kpi { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 16px; }
.kpi .n { font-size:26px; font-weight:800; color:var(--navy); line-height:1.1; } .kpi .l { font-size:12px; color:var(--muted); margin-top:4px; }
.kpi .n.bad { color:var(--bad); } .kpi .n.warn { color:#b45309; } .kpi .n.ok { color:var(--ok); } .kpi .n.info { color:var(--info); }
.tabs { display:flex; gap:0; border-bottom:2px solid var(--line); margin-bottom:14px; overflow-x:auto; }
.tabs button { background:none; border:0; border-bottom:3px solid transparent; margin-bottom:-2px; padding:10px 16px; cursor:pointer; color:var(--muted); font-weight:600; white-space:nowrap; }
.tabs button.on { color:var(--navy); border-bottom-color:var(--blue); background:var(--blue2); border-radius:8px 8px 0 0; }
.btn { border:1px solid var(--line); background:#fff; border-radius:9px; padding:8px 13px; cursor:pointer; font-weight:600; font-size:13px; display:inline-flex; align-items:center; gap:6px; }
.btn:hover { border-color:var(--gold); } .btn:disabled { opacity:.5; cursor:default; }
.btn.p { background:var(--navy); color:#fff; border-color:var(--navy); } .btn.g { background:var(--gold); color:var(--navy); border-color:var(--gold); }
.btn.ok { background:var(--ok); color:#fff; border-color:var(--ok); } .btn.bad { background:#fff; color:var(--bad); border-color:var(--bad); }
.btn.xls { background:#1e7f4a; color:#fff; border-color:#1e7f4a; }
.btn.sm { padding:5px 9px; font-size:12px; }
.fl { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:12px; }
.fl input[type=text], .fl input[type=date], .fl input[type=month], .fl select { padding:8px 11px; border:1.5px solid var(--line); border-radius:9px; background:#fff; min-width:140px; }
.fl input[type=text] { min-width:220px; }
.fl label.ck { font-size:12.5px; color:var(--muted); display:flex; align-items:center; gap:5px; }
.tw { overflow:auto; border:1px solid var(--line); border-radius:12px; background:#fff; max-height:72vh; }
table { border-collapse:collapse; width:100%; font-size:13px; white-space:nowrap; }
th { background:var(--blue); color:#fff; font-weight:700; padding:10px 10px; text-align:center; position:sticky; top:0; z-index:2; font-size:12.5px; }
td { padding:8px 10px; border-bottom:1px solid var(--line); text-align:center; vertical-align:middle; }
td.l, th.l { text-align:left; } td.r, th.r { text-align:right; }
tbody tr:hover td { background:#f7f9fd; }
tbody tr.click { cursor:pointer; }
td.z { color:#b8bfcc; } td.abs { color:var(--bad); font-weight:700; } td.iss { color:#b45309; font-weight:700; }
.st { display:inline-block; padding:3px 9px; border-radius:20px; font-size:11.5px; font-weight:700; color:#1a2230; white-space:nowrap; }
.tag { display:inline-block; padding:3px 9px; border-radius:20px; font-size:11.5px; font-weight:700; }
.t-pending { background:rgba(214,137,16,.14); color:#b26a00; } .t-approved { background:rgba(39,174,135,.14); color:#1e8e5a; }
.t-rejected { background:rgba(226,87,76,.14); color:#c0392b; } .t-cancelled, .t-other { background:rgba(114,124,147,.16); color:#5b6478; }
.pen { border:0; background:none; cursor:pointer; color:var(--info); font-size:14px; padding:2px 5px; }
.muted { color:var(--muted); } .sm { font-size:12px; } .b { font-weight:700; }
.empty { text-align:center; color:var(--muted); padding:28px 10px; }
/* ข้อมูลพนักงาน: 2 คอลัมน์ */
.two { display:grid; grid-template-columns:320px 1fr; gap:14px; align-items:start; }
.list { background:#fff; border:1px solid var(--line); border-radius:14px; overflow:hidden; }
.list .sr { padding:10px; border-bottom:1px solid var(--line); display:flex; flex-direction:column; gap:6px; }
.list .sr input, .list .sr select { padding:8px 10px; border:1.5px solid var(--line); border-radius:9px; width:100%; }
.list .rows { max-height:66vh; overflow-y:auto; }
.list .row { display:flex; align-items:center; gap:10px; padding:9px 12px; border-bottom:1px solid var(--line); cursor:pointer; }
.list .row:hover { background:#f7f9fd; } .list .row.on { background:var(--blue2); }
.av2 { width:34px; height:34px; border-radius:50%; background:#e8ecf3; color:var(--navy); font-weight:700; display:flex; align-items:center; justify-content:center; font-size:12.5px; flex-shrink:0; overflow:hidden; }
.av2 img { width:100%; height:100%; object-fit:cover; }
.list .row .nm { font-weight:600; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } .list .row .sb2 { font-size:11.5px; color:var(--muted); }
.prof { display:flex; gap:18px; }
.prof .ph { width:110px; height:110px; border-radius:14px; background:#e8ecf3; display:flex; align-items:center; justify-content:center; font-size:34px; font-weight:800; color:var(--navy); overflow:hidden; flex-shrink:0; }
.prof .ph img { width:100%; height:100%; object-fit:cover; }
.prof .hd { font-size:18px; font-weight:800; margin-bottom:8px; }
.prof .cols { display:grid; grid-template-columns:repeat(3,1fr); gap:4px 22px; font-size:13px; }
.prof .cols div { padding:2px 0; } .prof .cols span { color:var(--muted); }
.dl { display:flex; gap:12px; padding:8px 0; border-bottom:1px solid var(--line); }
/* modal */
.mo { position:fixed; inset:0; background:rgba(9,14,30,.55); z-index:200; display:flex; align-items:center; justify-content:center; padding:20px; }
.mo .bx { background:#fff; border-radius:16px; width:100%; max-width:640px; max-height:92vh; display:flex; flex-direction:column; box-shadow:0 20px 60px rgba(0,0,0,.3); }
.mo .hd { padding:14px 18px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px; font-weight:800; font-size:15px; }
.mo .hd .x { margin-left:auto; border:0; background:none; font-size:22px; cursor:pointer; color:var(--muted); }
.mo .bd { padding:16px 18px; overflow-y:auto; }
.mo .ft { padding:12px 18px; border-top:1px solid var(--line); display:flex; gap:8px; justify-content:flex-end; }
.fld { margin-bottom:10px; } .fld label { display:block; font-size:12px; color:var(--muted); margin-bottom:4px; font-weight:600; }
.fld input, .fld select, .fld textarea { width:100%; padding:9px 11px; border:1.5px solid var(--line); border-radius:9px; }
.toast { position:fixed; right:18px; bottom:18px; z-index:300; display:flex; flex-direction:column; gap:8px; }
.toast div { background:var(--navy); color:#fff; padding:10px 14px; border-radius:10px; font-size:13px; box-shadow:0 6px 20px rgba(0,0,0,.2); max-width:380px; }
.toast div.ok { background:var(--ok); } .toast div.bad { background:var(--bad); } .toast div.warn { background:#b45309; }
.bar { height:8px; background:#e8ecf3; border-radius:4px; overflow:hidden; } .bar i { display:block; height:100%; background:var(--blue); }
.alert { background:rgba(230,162,60,.12); border:1px solid rgba(230,162,60,.4); color:#7a4a00; padding:10px 12px; border-radius:10px; font-size:13px; }
.alert.bad { background:rgba(226,87,76,.08); border-color:rgba(226,87,76,.35); color:#8e2a20; }
.thumb { width:44px; height:44px; border-radius:8px; object-fit:cover; cursor:zoom-in; border:1px solid var(--line); }
/* login */
.login { min-height:100vh; display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg, var(--navy), var(--navy3)); padding:20px; }
.login .bx { background:#fff; border-radius:18px; padding:28px 26px; width:100%; max-width:400px; }
.login h1 { margin:0 0 4px; font-size:20px; } .login p { margin:0 0 16px; color:var(--muted); font-size:13px; }
.spin { display:inline-block; width:14px; height:14px; border:2px solid rgba(0,0,0,.15); border-top-color:var(--navy); border-radius:50%; animation:sp .8s linear infinite; vertical-align:-2px; }
@keyframes sp { to { transform:rotate(360deg); } }
@media (max-width: 900px) {
  html, body { overflow-x:hidden; max-width:100vw; }
  .app { flex-direction:column; } .sb { width:100%; height:auto; position:static; } .sb nav { display:flex; flex-wrap:wrap; gap:4px; padding:4px 10px 10px; } .sb .lbl, .sb .ft { display:none; }
  .sb .it { width:auto; padding:7px 11px; font-size:12.5px; border-radius:20px; background:rgba(255,255,255,.08); } .sb .sub { padding-left:11px; }
  .sb .brand { padding:12px 14px 8px; }
  .wrap { overflow-x:hidden; } .card { overflow:hidden; } .dl { flex-wrap:wrap; }
  .g4 { grid-template-columns:repeat(2,1fr); } .g3 { grid-template-columns:1fr; } .two { grid-template-columns:1fr; } .prof { flex-direction:column; } .prof .cols { grid-template-columns:1fr; }
  main { padding:12px; } .top { padding:10px 12px; flex-wrap:wrap; } .top .chip { flex-wrap:wrap; }
}
@media print { .sb, .top, .fl, .btn { display:none !important; } main { padding:0; } .tw { max-height:none; overflow:visible; } }
</style>
</head>
<body>
<div id="login" class="login" hidden>
  <form class="bx" onsubmit="doLogin(event)">
    <h1>🗂 หลังบ้าน HR</h1>
    <p>เข้าสู่ระบบด้วยรหัสพนักงานและรหัสผ่านเดียวกับแอป HR Rattana (เฉพาะฝ่ายบุคคล)</p>
    <div class="fld"><label>รหัสพนักงาน</label><input id="lgUser" autocomplete="username" required></div>
    <div class="fld"><label>รหัสผ่าน</label><input id="lgPass" type="password" autocomplete="current-password" required></div>
    <div id="lgMsg" class="alert bad" hidden></div>
    <button class="btn p" id="lgBtn" style="width:100%;justify-content:center;padding:11px">เข้าสู่ระบบ</button>
    <div class="sm muted" style="margin-top:12px;text-align:center">ถ้าเปิดแอปมือถือในเบราว์เซอร์นี้อยู่แล้ว หน้านี้จะเข้าให้เองโดยไม่ถามรหัส</div>
  </form>
</div>

<div id="app" class="app" hidden>
  <aside class="sb">
    <div class="brand"><div class="lg">HR</div><div><b>Rattana · หลังบ้าน HR</b><small id="sbCo">บริษัท รัตนไพบูลย์</small></div></div>
    <nav id="nav"></nav>
    <div class="ft"><span id="sbVer">v1.0</span> · <a href="rattana-attendance.html">เปิดแอปมือถือ</a> · <a href="#" onclick="logout();return false">ออกจากระบบ</a></div>
  </aside>
  <div class="wrap">
    <header class="top">
      <div><div class="crumb" id="crumb">หลังบ้าน HR</div><div class="ttl" id="ttl">Dashboard</div></div>
      <div class="sp"></div>
      <div class="chip" id="periodChip" title="ช่วงวันที่ในแท็บ สรุปวัน (B1/D1)">งวด <b>…</b> <button class="btn sm" onclick="openPeriod()">เปลี่ยน</button></div>
      <button class="btn sm" onclick="reloadAll()" title="ดึงข้อมูลใหม่ทั้งหมด">⟳</button>
      <div class="usr"><div class="av" id="uAv">?</div><div><b id="uName">—</b><small id="uSub">HR</small></div></div>
    </header>
    <main id="main"></main>
  </div>
</div>
<div id="modalRoot"></div>
<div class="toast" id="toast"></div>

<script>
/* ══════════ ค่าตั้ง (ชุดเดียวกับแอปมือถือ — ไม่มีความลับ) ══════════ */
const CFG = {
  api: 'https://script.google.com/macros/s/AKfycbzyZsYY9R3WAhy7LUiaIF_xPTK50vVgggrv6Ua5WYCdKOUHGNd_PjDcSojI39OSiRU/exec',
  usersSheetId: '1M6HdISsLN684qRWyQ73CA4AmUzmYtZaOlffDJXZZIXQ', usersTab: 'Sheet1',
  attendanceSheetId: '1aywVdJ5-zw70__3BHjE3itjZotiubaRUAMjWOzgCAts',
  ver: '1.3',
};
const S = { token: '', exp: 0, u: null, users: [], ptt: [], byId: {}, period: null, hr: null, settings: null, holidays: null, locations: null,
            faces: null, docs: null, docsRange: '', view: 'dashboard', sub: '', emp: null, empTab: 'time', empDays: {}, shifts: {}, audit: {}, quotaAll: null, busy: {} };
const $ = (s, r) => (r || document).querySelector(s);
const h = (s) => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const TH_M = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
const TH_D = ['อาทิตย์', 'จันทร์', 'อังคาร', 'พุธ', 'พฤหัส', 'ศุกร์', 'เสาร์'];
const isoOf = (d) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const todayIso = () => isoOf(new Date());
const dmy = (iso) => iso ? String(iso).split('-').reverse().join('/') : '';
const isoFromDmy = (s) => { const m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})/.exec(String(s || '')); return m ? m[3] + '-' + m[2].padStart(2, '0') + '-' + m[1].padStart(2, '0') : ''; };
const dowTh = (iso) => { try { return TH_D[new Date(iso + 'T00:00:00').getDay()]; } catch (_) { return ''; } };
const thDate = (iso) => { if (!iso) return ''; const [y, m, d] = iso.split('-'); return (+d) + ' ' + TH_M[+m - 1] + ' ' + y; };
const num = (v) => (v == null || v === '' || isNaN(Number(v)) || Number(v) === 0) ? '' : String(Math.round(Number(v) * 100) / 100);
const norm = (s) => String(s || '').replace(/\s+/g, ' ').trim();
const ST_BG = [['ทำงานเต็มวัน', '#c9f5ee'], ['ทำงาน (ลาบางส่วน)', '#b8e6cf'], ['ทำงานวันหยุด', '#ffd9a0'], ['ไม่ครบคู่ (วันหยุด)', '#ffe3b3'], ['ผิด', '#f8c7c4'], ['วันอาทิตย์', '#fff2a8'], ['วันนักขัตฯ', '#c8f7c5'], ['ลา', '#cfe2f3']];
const stBg = (st) => { const s = String(st || ''); for (const [k, c] of ST_BG) if (s.indexOf(k) === 0) return c; return '#e8ecf3'; };
const stChip = (st) => st ? `<span class="st" style="background:${stBg(st)}">${h(st)}</span>` : '';
const DOC_ST = { pending: 'รออนุมัติ', approved: 'อนุมัติ', rejected: 'ไม่อนุมัติ', cancelled: 'ยกเลิก', other: 'อื่นๆ' };
const docTag = (st) => `<span class="tag t-${st}">${DOC_ST[st] || st}</span>`;
const TA_WHY = ['ลืมลงเวลา', 'ระบบมีปัญหา', 'เครื่องลงเวลาใช้งานไม่ได้', 'ไฟฟ้าดับ', 'ทำงานนอกสถานที่', 'ทำงานเกินเวลา'];
function methodLabel(sb) {
  const s = String(sb || '');

function sessLoad() {
  try {   // ของหลังบ้านเอง
    const s = JSON.parse(localStorage.getItem('hrc_session') || 'null');
    if (s && s.token && s.exp > Date.now() + 60000) return s;
  } catch (_) {}
  try {   // แอปมือถือในเบราว์เซอร์เดียวกัน (โดเมนเดียวกัน) — กุญแจ S2 ตัวเดียวกันใช้ได้เลย
    const s = JSON.parse(localStorage.getItem('rfc3_session') || 'null');
    if (s && s.token && String(s.token).indexOf('S2.') === 0 && s.exp > Date.now() + 60000 && s.u) return { token: s.token, exp: s.exp, u: s.u, fromApp: true };
  } catch (_) {}
  return null;
}
function sessSave() { try { localStorage.setItem('hrc_session', JSON.stringify({ token: S.token, exp: S.exp, u: S.u })); } catch (_) {} }
function isHrUser(u) { return !!(u && (u.role === 'hr' || /ทรัพยากรบุคคล/.test(String(u.department || '')))); }
function logout() { try { localStorage.removeItem('hrc_session'); } catch (_) {} S.token = ''; S.u = null; location.reload(); }
async function post(body) {
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 90000);
  try {
    const r = await fetch(CFG.api, { method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body), signal: ctl.signal });
    const txt = (await r.text()).trim();
    if (txt[0] !== '{' && txt[0] !== '[') throw new Error('เซิร์ฟเวอร์ตอบไม่เป็นข้อมูล (' + r.status + ')');
    return JSON.parse(txt);
  } finally { clearTimeout(t); }
}
async function api(action, payload) {
  const j = await post(Object.assign({ action, idToken: S.token }, payload || {}));
  if (!j.ok) {
    if (/^session_/.test(String(j.code || '')) || /^Unauthorized/.test(String(j.error || ''))) { toast('กุญแจเข้าระบบหมดอายุ — กรุณาเข้าสู่ระบบใหม่', 'warn'); try { localStorage.removeItem('hrc_session'); } catch (_) {} setTimeout(() => location.reload(), 1500); }
    const e = new Error(j.error || 'เกิดข้อผิดพลาด'); e.code = j.code; e.srv = true; throw e;
  }
  return j;
}

/* ══════════ ข้อมูลพนักงาน: ชีท Users (gviz สาธารณะ ชุดเดียวกับแอป) + ทะเบียน PTT (API) ══════════ */
function parseCsv(text) {
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true;
    else if (c === ',') { row.push(cur); cur = ''; }
    else if (c === '\n') { row.push(cur); rows.push(row); row = []; cur = ''; }
    else if (c !== '\r') cur += c;
  }
  if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
  return rows;
}
async function loadUsers() {
  const url = `https://docs.google.com/spreadsheets/d/${CFG.usersSheetId}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(CFG.usersTab)}`;
  const r = await fetch(url); if (!r.ok) throw new Error('HTTP ' + r.status);
  const rows = parseCsv(await r.text()); if (rows.length < 2) throw new Error('ชีทว่าง');
  const head = rows[0].map(x => norm(x));
  const ix = (re, fb) => { const i = head.findIndex(x => re.test(x)); return i >= 0 ? i : fb; };
  const C = { company: ix(/^บริษัท/, 0), w: ix(/^W$/, 1), id: ix(/^รหัสพนักงาน/, 2), prefix: ix(/^คำนำหน้า/, 3), name: ix(/^ชื่อ - สกุล$|^ชื่อ-สกุล$|^ชื่อ - สกุล(?! \()/, 4), nat: ix(/^สัญชาติ/, 5), nick: ix(/^ชื่อเล่น/, 6), gender: ix(/^เพศ/, 7), email: ix(/^E-?mail/i, 8), birth: ix(/^วันเดือนปีเกิด/, 9), start: ix(/^เริ่มงาน|^วันเริ่มงาน/, 10), status: ix(/^Status$/i, 11), jobCode: ix(/^รหัสค่างาน/, 12), sup: ix(/^ชื่อหัวหน้างาน/, 13), role: ix(/^User Role/i, 15), stage: ix(/^Approval Stage/i, 16), dept: ix(/^แผนก/, 17), posCode: ix(/^คลังและรหัสแผนก/, 18), phone: ix(/^เบอร์โทร/, 31), photo: ix(/^รูปพนักงาน/, 32) };
  const users = [];
  for (let i = 1; i < rows.length; i++) {
    const r = rows[i]; const id = norm(r[C.id]); if (!id || !norm(r[C.name])) continue;
    users.push({ empId: id, name: norm(r[C.name]), nick: norm(r[C.nick]), prefix: norm(r[C.prefix]), gender: norm(r[C.gender]), nat: norm(r[C.nat]), email: norm(r[C.email]), birth: norm(r[C.birth]),
      start: norm(r[C.start]), status: norm(r[C.status]), jobCode: norm(r[C.jobCode]), sup: norm(r[C.sup]), role: norm(r[C.role]), stage: norm(r[C.stage]), dept: norm(r[C.dept]), posCode: norm(r[C.posCode]),
      phone: norm(r[C.phone]), photo: /^https?:/.test(norm(r[C.photo])) ? norm(r[C.photo]) : '', company: norm(r[C.company]), klang: norm(r[C.w]), src: 'users' });
  }
  S.users = users; rebuildIndex();
}

function perfHtml_(r) {
  const q = (a, p) => a.length ? a[Math.min(a.length - 1, Math.floor(a.length * p))] : NaN;
  const sec = (ms) => isFinite(ms) ? (ms / 1000).toFixed(1) + ' วิ' : '–';

  if (!ck.length && !rq.length) return '<div class="empty">ยังไม่มีข้อมูล — รอให้มีคนใช้งานสักพัก (เก็บเฉพาะหลัง Deploy 9.56)</div>';
  const row = (label, s, extra) => '<tr><td class="l b">' + label + '</td><td>' + s.n + '</td><td>' + sec(s.p50) + '</td><td class="' + (s.p90 > 10000 ? 'abs' : '') + '">' + sec(s.p90) + '</td><td>' + sec(s.max) + '</td><td class="l sm muted">' + (extra || '') + '</td></tr>';
  let t = '<div class="tw" style="max-height:none;margin-bottom:12px"><table><thead><tr><th class="l">งาน</th><th>ครั้ง</th><th>กลาง</th><th>90% ไม่เกิน</th><th>ช้าสุด</th><th class="l">หมายเหตุ</th></tr></thead><tbody>';
  if (ck.length) {
    // ckperf: [เวลา, ชนิด, ก่อนเข้าคิว, รอคิว, อยู่ในคิว, ทั้งคำขอ, ได้คิว]
    const nolock = ck.filter(x => !x[6]).length;
    t += row('ลงเวลา (ทั้งคำขอ)', st(ck.map(x => +x[5])), hm(ck[0][0]) + '–' + hm(ck[ck.length - 1][0]) + (nolock ? ' · ⚠ รอคิวเกิน 25 วิ ' + nolock + ' ครั้ง' : ''));
    t += row('　รอคิวบันทึก', st(ck.map(x => +x[3])), 'คนสแกนพร้อมกันต้องต่อคิวเขียนชีท');
    t += row('　อยู่ในคิว', st(ck.map(x => +x[4])), 'อ่าน/เขียนชีท CheckinLog');
    t += row('　ก่อนเข้าคิว', st(ck.map(x => +x[2])), 'ตรวจหน้า + อัปรูป');
  }
  const NAME = { getBootstrap: 'เปิดแอป (ข้อมูลบูต)', getHomeBundle: 'ฟีดหน้าแรก + แจ้งเตือน', getCheckinLog: 'ประวัติสแกน', getPendingAll: 'คิวอนุมัติ', getFaceData: 'ข้อมูลใบหน้า' };
  Object.keys(NAME).forEach(a => {
    const xs = rq.filter(x => x[1] === a); if (!xs.length) return;
    t += row(NAME[a], st(xs.map(x => +x[3])), 'ตรวจกุญแจ กลาง ' + sec(st(xs.map(x => +x[2])).p50));
  });
  t += '</tbody></table></div>';
  // ราย 15 นาที — เห็นช่วงคนเยอะชัด
  const B = {};
  ck.forEach(x => { const k = Math.floor(x[0] / 900000); (B[k] = B[k] || { ck: [], bt: [] }).ck.push(+x[5]); });
  rq.filter(x => x[1] === 'getBootstrap').forEach(x => { const k = Math.floor(x[0] / 900000); (B[k] = B[k] || { ck: [], bt: [] }).bt.push(+x[3]); });
  const ks = Object.keys(B).map(Number).sort((a, b) => a - b);
  if (ks.length > 1) {
    t += '<div class="sm muted" style="margin-bottom:6px">ราย 15 นาที (จำนวนครั้ง · 90% ไม่เกิน)</div><div class="tw" style="max-height:320px"><table><thead><tr><th class="l">ช่วงเวลา</th><th>ลงเวลา</th><th>เปิดแอป</th></tr></thead><tbody>' +

function toXls(fname, title, headers, rows, colors) {
  const cell = (v, i, head) => `<t${head ? 'h' : 'd'} style="border:1px solid #999;padding:3px 6px;${head ? 'font-weight:bold;background:' + ((colors && colors[i]) || '#dbe8fb') + ';color:' + (colors && /^#(990000|7030a0|4472c4)$/i.test(colors[i]) ? '#fff' : '#000') : ''}${!head && typeof v === 'number' ? ';mso-number-format:\\@' : ''}">${h(v == null ? '' : v)}</t${head ? 'h' : 'd'}>`;
  const html = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="utf-8"><!--[if gte mso 9]><xml><x:ExcelWorkbook><x:ExcelWorksheets><x:ExcelWorksheet><x:Name>รายงาน</x:Name><x:WorksheetOptions><x:DisplayGridlines/></x:WorksheetOptions></x:ExcelWorksheet></x:ExcelWorksheets></x:ExcelWorkbook></xml><![endif]--></head><body><table><tr><td colspan="${headers.length}" style="font-weight:bold;font-size:14pt">${h(title)}</td></tr><tr>${headers.map((x, i) => cell(x, i, true)).join('')}</tr>${rows.map(r => '<tr>' + r.map((v, i) => cell(v, i, false)).join('') + '</tr>').join('')}</table></body></html>`;
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + html], { type: 'application/vnd.ms-excel;charset=utf-8' })); a.download = fname.replace(/[\\/:*?"<>|]/g, '_') + '.xls';
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 800);
  toast('⬇ ' + a.download, 'ok');
}
boot();
</script>
</body>
</html>
