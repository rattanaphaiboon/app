<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Rattana ทีมงาน v1.4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{
  --navy:#0d1b3e;--navy-mid:#1a2f5e;--navy-light:#243b73;--gold:#c9a84c;--gold-light:#e8c86a;
  --success:#1e9e5a;--danger:#d63a2c;
  --bg:#f4f6fb;--text:#0d1b3e;--card-bg:#ffffff;--border:#dde3f0;--muted:#5f6b88;--soft:#eef1f7;
  --radius-sm:6px;--radius-md:14px;--radius-lg:20px;
  --shadow-md:0 2px 10px rgba(13,27,62,.08);--shadow-lg:0 14px 34px rgba(13,27,62,.16);
  --c-W1:#f1c40f;--c-W2:#3498db;--c-W3:#e74c3c;--c-W4:#27ae60;--c-C4:#16a085;--c-HQ:#5d6d7e;
}
body.dark{--bg:#05080f;--text:#fff;--card-bg:#0d1b3e;--border:#1f3563;--muted:#b8c2dc;--soft:#0a1226;--shadow-md:0 2px 10px rgba(0,0,0,.4);--shadow-lg:0 14px 34px rgba(0,0,0,.5);--c-HQ:#9aa9bd}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Sarabun',Tahoma,sans-serif;font-size:15px;line-height:1.5;min-height:100dvh;overflow-x:hidden;background:var(--bg);color:var(--text)}
button,input{font-family:inherit;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{cursor:pointer;border:none;background:none;color:inherit}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

/* header */
header{background:var(--navy);color:#fff;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:8px;border-bottom:3px solid var(--gold)}
.logo-text{font-weight:800;letter-spacing:1.2px;font-size:18px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo-text span{color:var(--gold)}
.logo-text small{font-size:11px;font-weight:500;letter-spacing:0;color:rgba(255,255,255,.55);margin-left:6px}
.hbtn{color:#fff;border:1px solid rgba(255,255,255,.25);height:38px;min-width:38px;padding:0 10px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;gap:5px;font-size:13.5px;font-weight:700;text-decoration:none;white-space:nowrap}
.hbtn:hover{background:rgba(255,255,255,.12)}
.hub-icon{width:22px;height:22px;border-radius:5px;background:var(--gold);color:var(--navy);display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
@media(max-width:440px){.logo-text small,.lbl{display:none}.logo-text{font-size:16px;letter-spacing:.4px}}

.wrap{max-width:1120px;margin:0 auto;padding:16px;padding-bottom:max(48px,env(safe-area-inset-bottom));display:grid;gap:18px}

/* animations */
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.6)}70%{transform:scale(1.06)}100%{opacity:1;transform:scale(1)}}
@keyframes shimmer{0%{background-position:0% 50%}100%{background-position:200% 50%}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes spin{to{transform:rotate(360deg)}}
.rise{animation:rise .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 60ms)}
.pop{animation:pop .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 35ms)}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:var(--radius-lg);padding:26px 22px 22px;color:#fff;
  background:radial-gradient(120% 140% at 0% 0%,#243b73 0%,#0d1b3e 55%,#081229 100%);box-shadow:var(--shadow-lg)}
.hero::before{content:"";position:absolute;inset:-40% -10% auto auto;width:340px;height:340px;border-radius:50%;
  background:radial-gradient(circle,rgba(201,168,76,.35),transparent 65%);animation:float 7s ease-in-out infinite}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;
  background:linear-gradient(90deg,transparent,var(--gold),var(--gold-light),var(--gold),transparent);background-size:200% 100%;animation:shimmer 3.5s linear infinite}
.hero .k{position:relative;font-size:15px;font-weight:700;color:var(--gold-light);letter-spacing:.3px}
.hero h1{position:relative;font-size:clamp(26px,6vw,36px);font-weight:800;line-height:1.2;margin:2px 0 10px}
.hero .big{position:relative;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.hero .big b{font-size:clamp(56px,15vw,84px);font-weight:800;line-height:1;background:linear-gradient(180deg,#fff,#e8c86a);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .big span{font-size:22px;font-weight:700}
.hero .sub{position:relative;font-size:14px;color:rgba(255,255,255,.75);margin-top:8px;display:flex;align-items:center;gap:8px}
.live-dot{width:9px;height:9px;border-radius:50%;background:#2ecc71;box-shadow:0 0 0 0 rgba(46,204,113,.6);animation:ping 2s infinite}
@keyframes ping{70%{box-shadow:0 0 0 8px rgba(46,204,113,0)}100%{box-shadow:0 0 0 0 rgba(46,204,113,0)}}
.hero.center{background:radial-gradient(120% 140% at 0% 0%,color-mix(in srgb,var(--c) 70%,#0d1b3e) 0%,#0d1b3e 60%,#081229 100%)}
.back{position:relative;display:inline-flex;align-items:center;gap:6px;font-size:15px;font-weight:700;color:#fff;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-radius:99px;padding:6px 14px;margin-bottom:12px;min-height:40px}
.back:hover{background:rgba(255,255,255,.2)}

/* search */
.search{position:relative}
.search input{width:100%;min-height:52px;border-radius:99px;border:2px solid var(--border);background:var(--card-bg);color:var(--text);font-size:16px;padding:0 20px 0 48px;box-shadow:var(--shadow-md);outline:none;transition:border-color .2s}
.search input:focus{border-color:var(--gold)}
.search::before{content:"🔍";position:absolute;left:18px;top:50%;transform:translateY(-50%);font-size:18px}

/* center cards */
.centers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media(min-width:760px){.centers{grid-template-columns:repeat(3,minmax(0,1fr))}}
.ccard{position:relative;text-align:left;background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;box-shadow:var(--shadow-md);overflow:hidden;display:grid;gap:10px;min-width:0;transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s}
.ccard::before{content:"";position:absolute;inset:0 0 auto 0;height:6px;background:var(--c)}
.ccard::after{content:"";position:absolute;right:-40px;top:-40px;width:140px;height:140px;border-radius:50%;background:var(--c);opacity:.12;transition:transform .4s}
.ccard:hover{transform:translateY(-5px);box-shadow:var(--shadow-lg)}
.ccard:hover::after{transform:scale(1.35)}
.ccard:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.ccard .code{position:relative;display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:13px;color:var(--muted)}
.ccard .nm{position:relative;font-size:18px;font-weight:800;line-height:1.25}
.ccard .cnt{position:relative;display:flex;align-items:baseline;gap:6px}
.ccard .cnt b{font-size:40px;font-weight:800;line-height:1}
.ccard .cnt span{font-size:15px;font-weight:700;color:var(--muted)}
.ccard .meta{position:relative;font-size:13.5px;color:var(--muted);font-weight:600}
.stack{position:relative;display:flex;align-items:center}
.stack .av{width:34px;height:34px;margin-left:-10px;border:2.5px solid var(--card-bg);font-size:13px}
.stack .av:first-child{margin-left:0}
.stack .more{margin-left:6px;font-size:13px;font-weight:800;color:var(--muted)}
@media(max-width:420px){.ccard .cnt b{font-size:34px}.ccard .nm{font-size:16px}.stack .av:nth-child(n+5){display:none}}

/* avatar */
.av{position:relative;flex:none;border-radius:50%;overflow:hidden;background:var(--c,var(--gold));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .4s}
.av img.ok{opacity:1}
.av .ini{text-shadow:0 1px 2px rgba(0,0,0,.25)}

/* dept chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none;position:sticky;top:61px;z-index:50;background:var(--bg);margin:0 -16px;padding-left:16px;padding-right:16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:42px;padding:0 14px;border-radius:99px;border:2px solid var(--border);background:var(--card-bg);font-size:14.5px;font-weight:700;display:flex;align-items:center;gap:6px;white-space:nowrap}
.chip b{color:var(--c);filter:saturate(1.2)}
.chip:hover{border-color:var(--c)}

/* dept section */
.dept{display:grid;gap:12px;scroll-margin-top:120px}
.dhead{display:flex;align-items:center;gap:10px}
.dhead .ic{width:42px;height:42px;border-radius:12px;background:color-mix(in srgb,var(--c) 18%,var(--card-bg));display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}
.dhead h2{font-size:20px;font-weight:800;line-height:1.2}
.dhead h2 small{display:block;font-size:13.5px;font-weight:600;color:var(--muted)}
.dhead .n{margin-left:auto;font-size:15px;font-weight:800;padding:4px 12px;border-radius:99px;background:color-mix(in srgb,var(--c) 16%,var(--card-bg));white-space:nowrap}
.posgrp{display:grid;gap:10px;padding:12px;border-radius:var(--radius-md);background:color-mix(in srgb,var(--c) 6%,transparent);border:1px dashed color-mix(in srgb,var(--c) 35%,var(--border))}
.phead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pname{font-size:16px;font-weight:800;min-width:0}
.pname.lead{color:color-mix(in srgb,var(--gold) 80%,var(--text))}
.posgrp .mcard .pos{display:none}
.pn{flex:none;font-size:13.5px;font-weight:800;padding:3px 10px;border-radius:99px;background:var(--card-bg);border:1px solid var(--border)}
.natbar{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;background:var(--card-bg);border:1px solid var(--border);border-radius:99px;padding:5px;box-shadow:var(--shadow-md)}
.nat{min-height:44px;border-radius:99px;font-size:15.5px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:7px;transition:background .25s,color .25s}
.nat b{font-weight:800;color:var(--muted)}
.nat.on{background:var(--navy);color:#fff}
.nat.on b{color:var(--gold-light)}
body.dark .nat.on{background:var(--gold);color:var(--navy)}
body.dark .nat.on b{color:var(--navy)}
.nat:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.nd{display:inline-block;width:11px;height:11px;border-radius:50%;flex:none;vertical-align:-1px}
.nd.th{background:#2457b5}.nd.mm{background:#2e9e5b}.nd.ot{background:#a0a7b8}
.nsrow{position:relative;display:flex;flex-wrap:wrap;gap:4px 12px}
.ns{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:700;color:var(--muted);margin-right:10px}
.ns b{color:var(--text)}
.natp{font-size:11.5px;font-weight:800;padding:1px 9px;border-radius:99px;color:#fff;background:#2e9e5b}
.natp.ot{background:#7a8296}
.mcard.vac{border:2px dashed color-mix(in srgb,var(--danger) 55%,var(--border));background:color-mix(in srgb,var(--danger) 5%,var(--card-bg));box-shadow:none;cursor:default}
.mcard.vac:hover{transform:none;box-shadow:none}
.mcard .vav{background:transparent;border:2.5px dashed color-mix(in srgb,var(--danger) 60%,var(--border));box-shadow:none;color:color-mix(in srgb,var(--danger) 75%,var(--text))}
.mcard.vac .nick{color:color-mix(in srgb,var(--danger) 80%,var(--text))}
.pn em{font-style:normal;color:var(--danger)}
.vbadge{display:inline-flex;align-items:center;font-size:12.5px;font-weight:800;padding:1px 9px;border-radius:99px;color:#fff;background:var(--danger)}
.members{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
@media(max-width:420px){.members{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}}
.mcard{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius-md);padding:16px 10px 14px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;box-shadow:var(--shadow-md);transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s,border-color .25s;min-width:0}
.mcard:hover{transform:translateY(-4px) rotate(-.4deg);box-shadow:var(--shadow-lg);border-color:var(--c)}
.mcard:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.mcard .av{width:84px;height:84px;font-size:28px;box-shadow:0 0 0 3px var(--card-bg),0 0 0 6px var(--c);margin-bottom:8px}
.mcard .nick{font-size:18px;font-weight:800;line-height:1.2;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mcard .full{font-size:13px;color:var(--muted);line-height:1.3;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mcard .pos{margin-top:6px;font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--soft);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mcard .pos.lead{background:linear-gradient(90deg,var(--gold),var(--gold-light));color:var(--navy)}
.mcard .cc{font-size:12px;font-weight:700;color:var(--muted)}

/* modal */
.modal{position:fixed;inset:0;z-index:9000;display:flex;align-items:center;justify-content:center;padding:18px;background:rgba(5,10,25,.6);backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .25s}
.modal.open{opacity:1;pointer-events:auto}
.mbox{position:relative;width:100%;max-width:400px;background:var(--card-bg);border-radius:24px;overflow:hidden;box-shadow:var(--shadow-lg);transform:translateY(24px) scale(.96);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.modal.open .mbox{transform:none}
.mtop{height:110px;background:linear-gradient(135deg,var(--c),#0d1b3e)}
.mbody{padding:0 22px 22px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;margin-top:-62px}
.mbody .av{width:124px;height:124px;font-size:42px;box-shadow:0 0 0 5px var(--card-bg),0 10px 24px rgba(0,0,0,.25)}
.mbody .nick{font-size:26px;font-weight:800;margin-top:10px}
.mbody .full{font-size:15.5px;color:var(--muted)}
.mbody .info{width:100%;display:grid;gap:8px;margin-top:14px;text-align:left}
.mbody .row{display:flex;justify-content:space-between;gap:12px;padding:10px 14px;border-radius:12px;background:var(--soft);font-size:15px}
.mbody .row span{color:var(--muted);font-weight:600}
.mbody .row b{text-align:right}
.mclose{position:absolute;top:10px;right:10px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.2);color:#fff;font-size:22px;display:flex;align-items:center;justify-content:center}

/* misc */
.empty{padding:30px;text-align:center;color:var(--muted);font-size:15px}
.loading{display:flex;flex-direction:column;align-items:center;gap:14px;padding:60px 0;color:var(--muted);font-weight:600}
.loading i{width:46px;height:46px;border-radius:50%;border:5px solid var(--border);border-top-color:var(--gold);animation:spin .8s linear infinite}
.note{font-size:13px;color:var(--muted);text-align:center}
.err{background:#fde8e6;color:#c0392b;border:1.5px solid #c0392b;border-radius:var(--radius-md);padding:12px 14px;font-weight:600}

/* login */
.login{min-height:calc(100dvh - 64px);display:flex;align-items:center;justify-content:center;padding:20px}
.lbox{max-width:380px;width:100%;background:var(--card-bg);border-radius:24px;padding:28px 22px;text-align:center;box-shadow:var(--shadow-lg);border-top:5px solid var(--gold);display:grid;gap:12px;justify-items:center}
.lbox .ico{font-size:52px;animation:float 4s ease-in-out infinite}
.lbox h2{font-size:22px;font-weight:800}
.lbox p{color:var(--muted);font-size:14.5px}
.lerr{color:#c0392b;font-weight:700;font-size:14px}
#backToTop{position:fixed;bottom:max(24px,calc(16px + env(safe-area-inset-bottom)));right:16px;background:var(--gold);color:var(--navy);border-radius:50%;width:46px;height:46px;display:none;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(201,168,76,.35);z-index:90;font-size:18px;font-weight:800}
#backToTop.show{display:flex}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <span class="logo-text">RATTANA <span>ทีมงาน</span><small>v1.4</small></span>
  <a class="hbtn" href="rattana-manpower.html" title="ดูตำแหน่งที่ขาด">📊<span class="lbl">ตำแหน่งที่ขาด</span></a>
  <button class="hbtn" id="themeBtn" type="button" title="สลับโหมดสว่าง/มืด">🌙</button>
  <a class="hbtn" href="https://rattanaphaiboon.github.io/app/rattana-hub.html" title="กลับ Hub"><span class="hub-icon">R</span><span class="lbl">Hub</span></a>
</header>

<section class="login" id="loginScreen" hidden>
  <div class="lbox">
    <div class="ico">👥</div>
    <h2>ทีมงานรัตนไพบูลย์</h2>
    <p>เข้าสู่ระบบด้วยอีเมลที่ลงทะเบียนไว้กับบริษัท เพื่อดูรายชื่อและรูปพนักงาน</p>
    <div id="g_id_onload" data-client_id="615875645128-gasjjvkt6lu8g449cbnhl40k1pu25r0b.apps.googleusercontent.com" data-callback="handleGoogleLogin" data-auto_prompt="false"></div>
    <div class="g_id_signin" data-type="standard" data-size="large" data-theme="outline" data-text="sign_in_with" data-shape="pill"></div>
    <div class="lerr" id="loginErr"></div>
  </div>
</section>

<main class="wrap" id="app" hidden></main>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="ข้อมูลพนักงาน">
  <div class="mbox" id="mbox"></div>
</div>
<button id="backToTop" type="button" aria-label="กลับด้านบน">↑</button>

<script>
const USERS_URL='https://docs.google.com/spreadsheets/d/1M6HdISsLN684qRWyQ73CA4AmUzmYtZaOlffDJXZZIXQ/gviz/tq?tqx=out:csv&sheet=Sheet1';
const LINE_URL='https://docs.google.com/spreadsheets/d/1M6HdISsLN684qRWyQ73CA4AmUzmYtZaOlffDJXZZIXQ/gviz/tq?tqx=out:csv&sheet=LINE_USERS';
const POS_URL='https://docs.google.com/spreadsheets/d/e/2PACX-1vRJJj0Ag4kOmzOwFgm7oVaX_-MsvWSfVissZQZAXZryrUauLQblx3WbhWkkvYEN3tCLUo6vL_Rcda1m/pub?gid=1639155684&single=true&output=csv';
const REFRESH_MIN=5;
const CENTERS={
  W1:{n:'ศูนย์สมุทรสงคราม',e:'🟡'},W2:{n:'ศูนย์สุพรรณบุรี',e:'🔵'},W3:{n:'ศูนย์ราชบุรี',e:'🔴'},
  W4:{n:'ศูนย์นครปฐม',e:'🟢'},C4:{n:'รัตนมาร์ท ดอนตูม',e:'🟩'},HQ:{n:'สำนักงานใหญ่',e:'⬛'}
};
const ORDER=['HQ','W1','W2','W3','W4','C4'];
const DEPT_ICON={'บริหาร':'👔','บัญชีและการเงิน':'💰','ทรัพยากรบุคคล':'🤝','จัดซื้อ':'🛒','พัฒนาธุรกิจ':'📈','ขาย':'💼','ธุรการขาย':'🗂️','คลังและขนส่ง':'🚚','แม่บ้าน':'🧹','รัตนมาร์ท':'🏪','ฝึกงาน':'🎓','คนพิการ':'♿'};
const DEPT_ORDER=['บริหาร','ขาย','ธุรการขาย','คลังและขนส่ง','บัญชีและการเงิน','ทรัพยากรบุคคล','จัดซื้อ','พัฒนาธุรกิจ','รัตนมาร์ท','แม่บ้าน','ฝึกงาน','คนพิการ'];
const TH_MON=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];

const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clean=s=>String(s??'').replace(/[​‌‍﻿]/g,'').replace(/ /g,' ').replace(/\s+/g,' ').trim();
const cName=k=>CENTERS[k]?CENTERS[k].n:(k||'ไม่ระบุศูนย์');
const cEmoji=k=>CENTERS[k]?CENTERS[k].e:'⬜';
const cColor=k=>CENTERS[k]?`var(--c-${k})`:'var(--gold)';
const isLead=p=>/ประธาน|ผู้จัดการ|หัวหน้า/.test(p||'');
const normalizeEmail=s=>String(s||'').replace(/[​‌‍﻿]/g,'').replace(/\s+/g,'').toLowerCase();

function parseCsv(text){
  if(text.charCodeAt(0)===0xFEFF)text=text.slice(1);
  const out=[];let row=[],cell='',q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){cell+='"';i++}else q=false}else cell+=ch}
    else if(ch==='"')q=true;else if(ch===','){row.push(cell);cell=''}else if(ch==='\r'){}else if(ch==='\n'){row.push(cell);out.push(row);row=[];cell=''}else cell+=ch}
  if(cell.length||row.length){row.push(cell);out.push(row)}
  return out;
}
function driveId(u){const m=/[?&]id=([\w-]{20,})/.exec(u||'')||/\/d\/([\w-]{20,})/.exec(u||'');return m?m[1]:''}
function parseStart(s){
  s=clean(s);let m=/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(s);
  if(m){let a=+m[1],b=+m[2],y=+m[3];if(y>2400)y-=543;const [mo,d]=a>12?[b,a]:[a,b];const dt=new Date(y,mo-1,d);return isNaN(dt)?null:dt}
  m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s);if(m){let y=+m[1];if(y>2400)y-=543;return new Date(y,+m[2]-1,+m[3])}
  return null;
}
function tenure(d){
  if(!d)return '';const n=new Date();let mo=(n.getFullYear()-d.getFullYear())*12+n.getMonth()-d.getMonth();if(n.getDate()<d.getDate())mo--;
  if(mo<0)return '';const y=Math.floor(mo/12),m=mo%12;return y?`${y} ปี${m?` ${m} เดือน`:''}`:`${m} เดือน`;
}
const thDate=d=>d?`${d.getDate()} ${TH_MON[d.getMonth()]} ${d.getFullYear()+543}`:'-';

/* ---------- avatar ---------- */
function avatar(p,cls=''){
  const base=(p.nick||p.name||'?').replace(/^(คุณ)/,'').trim();
  const ini=esc((base.match(/[^เ-ไ\s]/)||['?'])[0]);   // ข้ามสระหน้า เ แ โ ใ ไ
  const id=p.photo;
  const img=id?`<img alt="" loading="lazy" decoding="async" data-id="${esc(id)}"${p.photoUrl?` data-alt="${esc(p.photoUrl)}"`:''} src="https://drive.google.com/thumbnail?id=${esc(id)}&sz=w240">`
    :p.photoUrl?`<img alt="" loading="lazy" decoding="async" data-url="1" referrerpolicy="no-referrer" src="${esc(p.photoUrl)}">`:'';
  return `<span class="av ${cls}" style="--c:${cColor(p.c)}"><span class="ini">${ini}</span>${img}</span>`;
}
document.addEventListener('load',e=>{const t=e.target;if(t.tagName==='IMG'&&(t.dataset.id||t.dataset.url))t.classList.add('ok')},true);
document.addEventListener('error',e=>{const t=e.target;if(t.tagName!=='IMG')return;if(t.dataset.url){t.remove();return}if(!t.dataset.id)return;
  if(!t.dataset.fb){t.dataset.fb=1;t.src=`https://lh3.googleusercontent.com/d/${t.dataset.id}=w240`}
  else if(t.dataset.alt&&!t.dataset.fb2){t.dataset.fb2=1;t.src=t.dataset.alt}else t.remove()},true);

/* ---------- data ---------- */
let PEOPLE=[],USERS=[],VAC={},loaded=false;
async function loadData(){
  const [ut,lt,pt]=await Promise.all([
    fetch(USERS_URL+'&t='+Date.now()).then(r=>{if(!r.ok)throw new Error('users '+r.status);return r.text()}),
    fetch(LINE_URL+'&t='+Date.now()).then(r=>r.ok?r.text():'').catch(()=>''),
    fetch(POS_URL+'&t='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.text():'').catch(()=>'')
  ]);
  // ทะเบียนพนักงาน (RATTANA User) — ใช้ตรวจล็อกอิน + หารูป/วันเริ่มงาน
  const v=parseCsv(ut);const H=(v[0]||[]).map(clean);const col=n=>H.indexOf(n);
  const iW=col('W'),iPre=col('คำนำหน้าชื่อ'),iN=col('ชื่อ - สกุล'),iK=col('ชื่อเล่น'),iS=col('Status'),
        iJ=col('รหัสค่างาน'),iPh=col('รูปพนักงาน'),iSt=col('เริ่มงาน'),iE=col('E-mail'),iEmp=col('รหัสพนักงาน');
  const nameKey=s=>clean(s).replace(/\s+/g,'');
  const byCode={},byName={};USERS=[];
  v.slice(1).forEach(r=>{
    const u={email:normalizeEmail(r[iE]),active:clean(r[iS]).toLowerCase()==='active',name:clean(r[iN]),nick:clean(r[iK]),c:clean(r[iW]).toUpperCase(),empId:clean(r[iEmp]),
      pre:clean(r[iPre]),photo:driveId(r[iPh]),start:parseStart(r[iSt])};
    if(u.email)USERS.push(u);
    if(!u.active)return;
    const code=clean(r[iJ]);if(code&&!byCode[code])byCode[code]=u;
    const nk=nameKey(u.name);if(nk&&!byName[nk])byName[nk]=u;
  });
  // รูปสำรองจากแท็บ LINE_USERS: รูปที่ส่ง (Drive) ก่อน แล้วรูปโปรไฟล์ LINE
  const lineByName={},lineByEmp={};
  if(lt){const lv=parseCsv(lt);const LH=(lv[0]||[]).map(clean);const lc=n=>LH.indexOf(n);
    const jE=lc('รหัสพนักงาน'),jN=lc('ชื่อพนักงาน'),jK=lc('ชื่อเล่น'),jD=lc('รูปที่ส่ง (Drive)'),jL=lc('รูปโปรไฟล์ LINE');
    lv.slice(1).forEach(r=>{const o={photo:driveId(r[jD]),url:/^https:\/\//.test(clean(r[jL]))?clean(r[jL]):'',nick:clean(r[jK])};
      if(!o.photo&&!o.url)return;
      const nk=nameKey(r[jN]);if(nk&&!lineByName[nk])lineByName[nk]=o;
      const e=clean(r[jE]);if(e&&!lineByEmp[e])lineByEmp[e]=o;});}
  // ตำแหน่งว่าง (เปิดอยู่แต่ค่างานยังขึ้น "ขาด") จากตารางสรุป H:L
  VAC={};
  {const pv0=parseCsv(pt);const H0=(pv0[0]||[]).map(clean);const j=H0.indexOf('ศูนย์');
    if(j>=0)pv0.slice(1).forEach(r=>{const c=clean(r[j]).toUpperCase(),d=clean(r[j+1]),p=clean(r[j+2]),need=+clean(r[j+3])||0,have=+clean(r[j+4])||0;
      if(c&&p&&need>have)VAC[c+'\t'+d+'\t'+p]=need-have;});}
  // รายชื่อจริง = ตำแหน่งที่มีคนอยู่ใน Update ค่างาน (แท็บ แอปกำลังคน คอลัมน์ Q:V)
  PEOPLE=[];
  if(!pt)throw new Error('อ่านรายชื่อจากค่างานไม่ได้');
  const pv=parseCsv(pt);const PH=(pv[0]||[]).map(clean);const i=PH.indexOf('รหัสค่างาน');
  if(i<0)throw new Error('ไม่พบคอลัมน์ รหัสค่างาน');
  pv.slice(1).forEach(r=>{
    const code=clean(r[i]),name=clean(r[i+4]);if(!code||!name)return;
    const u=byName[nameKey(name)]||byCode[code]||{};
    const ln=(!u.photo&&(lineByName[nameKey(name)]||(u.empId&&lineByEmp[u.empId])))||{};
    PEOPLE.push({c:clean(r[i+1]).toUpperCase(),d:clean(r[i+2])||'ไม่ระบุแผนก',p:clean(r[i+3]),name,nick:clean(r[i+5])||u.nick||'',
      pre:u.pre||'',photo:u.photo||ln.photo||'',photoUrl:u.photo?'':(ln.url||''),start:u.start||null,nat:clean(r[i+6])||'ไม่ระบุ'});
  });
  loaded=true;
}

/* ---------- routing ---------- */
function route(){
  if(!loaded)return;
  const h=decodeURIComponent(location.hash.slice(1));
  const m=/^c=(.+)$/.exec(h);
  if(m&&PEOPLE.some(p=>p.c===m[1]))renderCenter(m[1]);else renderHome();
}
window.addEventListener('hashchange',()=>{route();window.scrollTo({top:0})});

function countUp(el,to){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){el.textContent=to.toLocaleString('th-TH');return}
  const t0=performance.now(),dur=900;
  const step=t=>{const k=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-k,3);el.textContent=Math.round(to*e).toLocaleString('th-TH');if(k<1)requestAnimationFrame(step)};
  requestAnimationFrame(step);
  setTimeout(()=>{el.textContent=to.toLocaleString('th-TH')},dur+150);   // กันกรณีแท็บอยู่เบื้องหลัง rAF ไม่ทำงาน
}
/* ---------- สัญชาติ ---------- */
let NAT='all';try{NAT=localStorage.getItem('rattana_team_nat')||'all'}catch(e){}
const inNat=p=>NAT==='all'||p.nat===NAT;
function natKinds(list){const s=[...new Set(list.map(p=>p.nat))];return ['ไทย','พม่า',...s.filter(x=>x!=='ไทย'&&x!=='พม่า')].filter(x=>s.includes(x))}
const natCls=n=>n==='ไทย'?'th':n==='พม่า'?'mm':'ot';
function natBar(list){
  const ks=natKinds(list);
  return `<div class="natbar rise" role="group" aria-label="แยกตามสัญชาติ">${[['all','ทั้งหมด'],...ks.map(k=>[k,k])].map(([k,t])=>{
    const c=k==='all'?list.length:list.filter(p=>p.nat===k).length;
    return `<button type="button" class="nat${NAT===k?' on':''}" data-nat="${esc(k)}" aria-pressed="${NAT===k}">${k==='all'?'':`<i class="nd ${natCls(k)}"></i>`}${esc(t)} <b class="num">${c}</b></button>`}).join('')}</div>`;
}
function natSplit(list){
  return natKinds(list).map(k=>`<span class="ns"><i class="nd ${natCls(k)}"></i>${esc(k)} <b class="num">${list.filter(p=>p.nat===k).length}</b></span>`).join('');
}
const vacOf=(c,d,p)=>NAT!=='all'?0:Object.entries(VAC).filter(([k])=>{const [a,b,x]=k.split('\t');return a===c&&(d==null||b===d)&&(p==null||x===p)}).reduce((s,[,v])=>s+v,0);
function vacCard(i){return `<div class="mcard vac pop" style="--i:${Math.min(i,24)}" aria-label="ตำแหน่งว่าง"><span class="av vav"><span class="ini">?</span></span><span class="nick">ตำแหน่งว่าง</span><span class="full">รอสรรหา</span></div>`}
const byLead=(a,b)=>(isLead(b.p)-isLead(a.p))||a.p.localeCompare(b.p,'th')||(a.nick||a.name).localeCompare(b.nick||b.name,'th');

function renderHome(q){
  const ALL=PEOPLE,VIS=ALL.filter(inNat);
  const keys=[...ORDER,...new Set(VIS.map(p=>p.c).filter(k=>!ORDER.includes(k)))].filter(k=>VIS.some(p=>p.c===k));
  $('app').innerHTML=`
    <section class="hero rise">
      <div class="k">กำลังคน ณ ตอนนี้</div>
      <h1>ทีมงานรัตนไพบูลย์</h1>
      <div class="big"><b class="num" id="heroN">0</b><span>คน${NAT==='all'?'':` · สัญชาติ${esc(NAT)}`}</span></div>
      <div class="sub"><i class="live-dot"></i>อัปเดตสดจากชีทค่างาน · ${keys.length} ศูนย์</div>
    </section>
    ${natBar(ALL)}
    <div class="search rise" style="--i:1"><input id="q" type="search" placeholder="ค้นหาชื่อ ชื่อเล่น หรือตำแหน่ง" autocomplete="off" aria-label="ค้นหาพนักงาน"></div>
    <section id="homeBody"></section>
    <p class="note">รายชื่อและตำแหน่งจากชีท Update ค่างาน (เฉพาะตำแหน่งที่มีคน) · รูปจาก RATTANA User</p>`;
  countUp($('heroN'),VIS.length);
  const input=$('q');input.value=q||'';
  input.addEventListener('input',()=>homeBody(keys,input.value));
  homeBody(keys,q||'');
}
function homeBody(keys,q){
  q=clean(q).toLowerCase();
  if(q){
    const res=PEOPLE.filter(inNat).filter(p=>[p.name,p.nick,p.p,p.d,cName(p.c),p.nat].join(' ').toLowerCase().includes(q)).sort(byLead);
    $('homeBody').innerHTML=res.length?`<div class="members">${res.slice(0,120).map((p,i)=>memberCard(p,i,true)).join('')}</div>`:'<div class="empty">ไม่พบพนักงานที่ค้นหา</div>';
    return;
  }
  $('homeBody').innerHTML=`<div class="centers">${keys.map((k,i)=>{
    const ps=PEOPLE.filter(p=>p.c===k&&inNat(p));const depts=new Set(ps.map(p=>p.d)).size;
    const faces=[...ps.filter(p=>p.photo),...ps.filter(p=>!p.photo)].slice(0,5);
    return `<button class="ccard rise" style="--c:${cColor(k)};--i:${i+2}" data-c="${esc(k)}" type="button" aria-label="${esc(cName(k))} ${ps.length} คน">
      <span class="code">${cEmoji(k)} ${esc(k)}</span>
      <span class="nm">${esc(cName(k))}</span>
      <span class="cnt"><b class="num" data-n="${ps.length}">0</b><span>คน</span></span>
      <span class="meta">${depts} แผนก</span>
      ${NAT==='all'?`<span class="nsrow">${natSplit(ps)}${vacOf(k)?`<span class="vbadge">ว่าง ${vacOf(k)}</span>`:''}</span>`:''}
      <span class="stack">${faces.map(p=>avatar(p)).join('')}${ps.length>faces.length?`<span class="more">+${ps.length-faces.length}</span>`:''}</span>
    </button>`}).join('')}</div>`;
  document.querySelectorAll('.ccard .cnt b').forEach(b=>countUp(b,+b.dataset.n));
}
$('app').addEventListener('click',e=>{
  const c=e.target.closest('.ccard');if(c){location.hash='c='+encodeURIComponent(c.dataset.c);return}
  const m=e.target.closest('.mcard');if(m){openPerson(+m.dataset.ix);return}
  const ch=e.target.closest('.chip');if(ch){const el=document.getElementById(ch.dataset.t);if(el)el.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});return}
  if(e.target.closest('.back'))location.hash='';
  const nb=e.target.closest('.nat');if(nb){NAT=nb.dataset.nat;try{localStorage.setItem('rattana_team_nat',NAT)}catch(_){}
    const q=$('q')?.value||'';const y=scrollY;if(location.hash.slice(1))route();else renderHome(q);scrollTo(0,y);}
});

function memberCard(p,i,showCenter){
  const ix=PEOPLE.indexOf(p);
  return `<button class="mcard pop" type="button" style="--c:${cColor(p.c)};--i:${Math.min(i,24)}" data-ix="${ix}" aria-label="${esc(p.nick||p.name)}">
    ${avatar(p)}
    <span class="nick">${esc(p.nick||p.name.split(' ')[0])}</span>
    <span class="full">${esc(p.name)}</span>
    ${NAT==='all'&&p.nat!=='ไทย'?`<span class="natp ${natCls(p.nat)}">${esc(p.nat)}</span>`:''}
    ${p.p?`<span class="pos${isLead(p.p)?' lead':''}">${esc(p.p)}</span>`:''}
    ${showCenter?`<span class="cc">${cEmoji(p.c)} ${esc(p.c)}</span>`:''}
  </button>`;
}

// แยกสมาชิกในแผนกตามตำแหน่ง: หัวหน้า/ผู้จัดการขึ้นก่อน แล้วตำแหน่งที่คนเยอะ
function posGroups(list,c,d){
  const g={};list.forEach(p=>(g[p.p||'ไม่ระบุตำแหน่ง']=g[p.p||'ไม่ระบุตำแหน่ง']||[]).push(p));
  if(NAT==='all')Object.keys(VAC).forEach(k=>{const [a,b,x]=k.split('\t');if(a===c&&b===d&&!g[x])g[x]=[]});
  const vc=pos=>NAT==='all'?(VAC[c+'\t'+d+'\t'+pos]||0):0;
  const rank=p=>/^ประธาน/.test(p)?0:/^รองประธาน/.test(p)?1:/^ผู้จัดการ/.test(p)?2:/^ผู้ช่วยผู้จัดการ/.test(p)?3:/^หัวหน้า/.test(p)?4:/^ผู้ช่วยหัวหน้า/.test(p)?5:9;
  const keys=Object.keys(g).sort((a,b)=>rank(a)-rank(b)||g[b].length-g[a].length||a.localeCompare(b,'th'));
  return keys.map(pos=>`<div class="posgrp">
      <div class="phead rise"><span class="pname${isLead(pos)?' lead':''}">${isLead(pos)?'⭐ ':''}${esc(pos)}</span><span class="pn num">${g[pos].length} คน${vc(pos)?` · <em>ว่าง ${vc(pos)}</em>`:''}</span></div>
      <div class="members">${g[pos].sort((a,b)=>(a.nick||a.name).localeCompare(b.nick||b.name,'th')).map((p,j)=>memberCard(p,j,false)).join('')}${Array.from({length:vc(pos)},(_,j)=>vacCard(g[pos].length+j)).join('')}</div>
    </div>`).join('');
}

function renderCenter(k){
  const ALL=PEOPLE.filter(p=>p.c===k),ps=ALL.filter(inNat);
  const groups={};ps.forEach(p=>(groups[p.d]=groups[p.d]||[]).push(p));
  if(NAT==='all')Object.keys(VAC).forEach(key=>{const [a,b]=key.split('\t');if(a===k&&!groups[b])groups[b]=[]});
  const cv=vacOf(k);
  const depts=Object.keys(groups).sort((a,b)=>{const ia=DEPT_ORDER.indexOf(a),ib=DEPT_ORDER.indexOf(b);return (ia<0?99:ia)-(ib<0?99:ib)||groups[b].length-groups[a].length});
  $('app').innerHTML=`
    <section class="hero center rise" style="--c:${cColor(k)}">
      <button class="back" type="button">← ทุกศูนย์</button>
      <div class="k">${cEmoji(k)} ${esc(k)}</div>
      <h1>${esc(cName(k))}</h1>
      <div class="big"><b class="num" id="heroN">0</b><span>คน · ${depts.length} แผนก${cv?` · ว่าง ${cv} ตำแหน่ง`:''}</span></div>
    </section>
    ${natBar(ALL)}
    ${ps.length?'':'<div class="empty">ศูนย์นี้ไม่มีพนักงานสัญชาติที่เลือก</div>'}
    <nav class="chips" aria-label="ไปยังแผนก">${depts.map((d,i)=>`<button class="chip rise" type="button" style="--c:${cColor(k)};--i:${i}" data-t="d${i}">${DEPT_ICON[d]||'👥'} ${esc(d)} <b class="num">${groups[d].length}</b></button>`).join('')}</nav>
    ${depts.map((d,i)=>`<section class="dept" id="d${i}" style="--c:${cColor(k)}">
      <div class="dhead rise"><span class="ic">${DEPT_ICON[d]||'👥'}</span><h2>${esc(d)}<small>${NAT==='all'?natSplit(groups[d]):esc(cName(k))}</small></h2><span class="n num">${groups[d].length} คน${vacOf(k,d)?` · ว่าง ${vacOf(k,d)}`:''}</span></div>
      ${posGroups(groups[d],k,d)}
    </section>`).join('')}`;
  countUp($('heroN'),ps.length);
}

/* ---------- person modal ---------- */

  const p=PEOPLE[ix];if(!p)return;
  $('mbox').style.setProperty('--c',cColor(p.c));
  $('mbox').innerHTML=`<div class="mtop"></div><button class="mclose" type="button" aria-label="ปิด">×</button>
    <div class="mbody">${avatar(p)}
      <div class="nick">${esc(p.nick?('คุณ'+p.nick.replace(/^คุณ/,'')):p.name)}</div>
      <div class="full">${esc([p.pre,p.name].filter(Boolean).join(' '))}</div>
      <div class="info">
        <div class="row"><span>ตำแหน่ง</span><b>${esc(p.p||'-')}</b></div>
        <div class="row"><span>แผนก</span><b>${esc(p.d)}</b></div>
        <div class="row"><span>สัญชาติ</span><b>${esc(p.nat)}</b></div>
        <div class="row"><span>ศูนย์</span><b>${cEmoji(p.c)} ${esc(cName(p.c))}</b></div>
        ${p.start?`<div class="row"><span>เริ่มงาน</span><b>${thDate(p.start)}</b></div><div class="row"><span>อายุงาน</span><b>${tenure(p.start)||'-'}</b></div>`:''}
      </div></div>`;
  $('modal').classList.add('open');
  $('mbox').querySelector('.mclose').focus();
}
const closeModal=()=>$('modal').classList.remove('open');
$('modal').addEventListener('click',e=>{if(e.target.id==='modal'||e.target.closest('.mclose'))closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});

/* ---------- login (ใช้ร่วมกับ Rattana Hub) ---------- */
function decodeJwtPayload(token){
  const parts=String(token||'').split('.');if(parts.length<2)throw new Error('JWT');
  let b64=parts[1].replace(/-/g,'+').replace(/_/g,'/');const pad=(4-b64.length%4)%4;if(pad)b64+='='.repeat(pad);
  const bin=atob(b64);const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  return JSON.parse(new TextDecoder('utf-8').decode(bytes));
}
function checkRattanaSession(){
  try{const raw=localStorage.getItem('rattana_session');if(!raw)return null;const p=JSON.parse(raw);
    if(!p?.data?.email||!p.exp||Date.now()>p.exp)return null;return p.data}catch(e){return null}
}
function saveSharedSession(d){const payload={data:d,exp:Date.now()+30*24*60*60*1000};
  try{localStorage.setItem('rattana_session',JSON.stringify(payload));localStorage.setItem('rattanaUser',JSON.stringify(payload))}catch(e){}}
async function handleGoogleLogin(r){
  $('loginErr').textContent='กำลังตรวจสอบ…';
  try{
    const g=decodeJwtPayload(r.credential);const email=normalizeEmail(g.email);
    if(!loaded)await loadData();
    const u=USERS.find(x=>x.email===email);
    if(!u){$('loginErr').textContent='ไม่พบอีเมลนี้ในทะเบียนพนักงาน กรุณาติดต่อ HR';return}
    if(!u.active){$('loginErr').textContent='บัญชีนี้ไม่ได้อยู่ในสถานะ Active';return}
    saveSharedSession({email,name:u.name,nickname:u.nick,warehouse:u.c,empId:u.empId,picture:g.picture||''});
    showApp();
  }catch(e){$('loginErr').textContent='เข้าสู่ระบบไม่สำเร็จ ลองใหม่อีกครั้ง'}
}
window.handleGoogleLogin=handleGoogleLogin;

async function showApp(){
  $('loginScreen').hidden=true;$('app').hidden=false;
  if(!loaded){
    $('app').innerHTML='<div class="loading"><i></i>กำลังโหลดรายชื่อทีมงาน…</div>';
    try{await loadData()}catch(e){$('app').innerHTML=`<div class="err">โหลดข้อมูลไม่สำเร็จ (${esc(e.message)}) · ลองรีเฟรชหน้าอีกครั้ง</div>`;return}
  }
  route();
  setInterval(async()=>{if(document.hidden||$('modal').classList.contains('open'))return;
    const q=$('q')?.value||'';const y=scrollY;try{await loadData();if(!location.hash.slice(1))renderHome(q);else route();scrollTo(0,y)}catch(e){}},REFRESH_MIN*60*1000);
}

/* ---------- theme / misc ---------- */
const THEME_KEY='rattana_theme';
function applyTheme(t){document.body.classList.toggle('dark',t==='dark');$('themeBtn').textContent=t==='dark'?'☀️':'🌙'}
$('themeBtn').addEventListener('click',()=>{const n=document.body.classList.contains('dark')?'light':'dark';try{localStorage.setItem(THEME_KEY,n)}catch(e){}applyTheme(n)});
try{applyTheme(localStorage.getItem(THEME_KEY)||'light')}catch(e){applyTheme('light')}
window.addEventListener('scroll',()=>$('backToTop').classList.toggle('show',scrollY>400),{passive:true});
$('backToTop').addEventListener('click',()=>scrollTo({top:0,behavior:'smooth'}));

if(checkRattanaSession())showApp();else $('loginScreen').hidden=false;
</script>
