<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Rattana Fleet v1.2</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0d1b3e;--navy-mid:#1a2f5e;--navy-light:#243b73;--gold:#c9a84c;--gold-light:#e8c86a;
  --success:#2ecc71;--danger:#e74c3c;--warning:#f39c12;--info:#3498db;
  --bg:#f4f6fb;--text:#0d1b3e;--card-bg:#ffffff;--border:#dde3f0;--muted:#6b7896;--row-alt:#fafbfd;
  --radius-sm:6px;--radius-md:12px;--radius-lg:16px;
  --shadow-md:0 2px 8px rgba(0,0,0,.08);--shadow-gold:0 4px 12px rgba(201,168,76,.35);
  --stop-bg:#fff1ef;--stop-text:#c0392b;--ok-bg:#e8f7ee;--ok-text:#1e8449;--warn-bg:#fef3d7;--warn-text:#a87800;
}
body.dark{
  --bg:#05080f;--text:#ffffff;--card-bg:#0d1b3e;--border:#1f3563;--muted:#b8c2dc;--row-alt:#0a1226;
  --stop-bg:transparent;--stop-text:#ff8a7e;--ok-bg:transparent;--ok-text:#7be0a3;--warn-bg:transparent;--warn-text:#e8c86a;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Sarabun',sans-serif;font-size:14px;line-height:1.5;min-height:100dvh;overflow-x:hidden;background:var(--bg);color:var(--text);transition:background .25s,color .25s}
button{font-family:inherit;cursor:pointer;border:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
input{font-family:inherit;font-size:16px}
.app{max-width:520px;margin:0 auto;min-height:100dvh;background:var(--bg)}

header{background:var(--navy);color:#fff;padding:12px 14px;padding-top:max(12px,env(safe-area-inset-top));position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:10px;border-bottom:3px solid var(--gold)}
.logo-text{font-weight:700;letter-spacing:1.5px;font-size:17px;color:#fff;white-space:nowrap}
.logo-text span{color:var(--gold)}
.ver{font-size:11px;color:rgba(255,255,255,.55);margin-left:2px}
.hdr-right{margin-left:auto;display:flex;gap:6px;align-items:center}
.icon-btn{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.2);width:38px;height:38px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-size:17px}
.icon-btn:hover{background:rgba(255,255,255,.12)}
.hub-btn{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:var(--radius-sm);padding:5px 10px;font-size:13px;font-weight:600;text-decoration:none;min-height:38px}
.back-btn{background:transparent;color:#fff;font-size:22px;width:38px;height:38px;display:flex;align-items:center;justify-content:center;border-radius:var(--radius-sm)}
.back-btn:hover{background:rgba(255,255,255,.12)}

.filter{background:var(--card-bg);border-bottom:1px solid var(--border);padding:12px 14px;position:sticky;top:65px;z-index:50}
.date-row{display:flex;gap:8px;margin-bottom:10px}
.chip{flex:1;min-height:40px;border-radius:var(--radius-sm);border:1.5px solid var(--border);background:var(--card-bg);color:var(--text);font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px}
.chip.gold{background:var(--gold);border-color:var(--gold);color:var(--navy)}
.search{position:relative}
.search input{width:100%;height:46px;border-radius:23px;border:1.5px solid var(--border);background:var(--bg);color:var(--text);padding:0 44px 0 42px;outline:none}
.search input:focus{border-color:var(--gold)}
.search .ico{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:16px}
.search .clr{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:50%;background:transparent;color:var(--muted);font-size:18px;display:none}
.sort-row{display:flex;gap:6px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.sort-row::-webkit-scrollbar{display:none}
.sort{flex-shrink:0;min-height:32px;padding:4px 12px;border-radius:16px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:13px;font-weight:600}
.sort.on{background:var(--navy);border-color:var(--navy);color:#fff}
body.dark .sort.on{background:var(--gold);border-color:var(--gold);color:var(--navy)}

.content{padding:12px 14px 90px}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat-card{background:var(--card-bg);border-radius:var(--radius-md);padding:10px 8px;border:1px solid var(--border);border-top:3px solid var(--gold);text-align:center}
.stat-card.danger{border-top-color:var(--danger)}
.s-label{font-size:11px;color:var(--muted);font-weight:600}
.s-value{font-size:20px;font-weight:700;line-height:1.25;font-variant-numeric:tabular-nums}
.stat-card.danger .s-value{color:var(--danger)}
.s-sub{font-size:11px;color:var(--muted)}

.list{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--shadow-md)}
.vrow{display:flex;align-items:center;gap:12px;padding:12px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .12s}
.vrow:last-child{border-bottom:none}
.vrow:hover{background:rgba(201,168,76,.08)}
.vrow:active{background:rgba(201,168,76,.15)}
.plate{min-width:82px;text-align:center;border:2px solid var(--text);border-radius:6px;padding:3px 6px;font-weight:700;font-size:14px;background:var(--card-bg);line-height:1.3}
.plate small{display:block;font-size:10px;font-weight:500;color:var(--muted);border-top:1px solid var(--border);margin-top:2px}
.vinfo{flex:1;min-width:0}
.vdrv{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vmeta{font-size:12px;color:var(--muted)}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;white-space:nowrap}
.badge-stop{background:var(--stop-bg);color:var(--stop-text);border:1px solid rgba(231,76,60,.35)}
.badge-ok{background:var(--ok-bg);color:var(--ok-text);border:1px solid rgba(46,204,113,.35)}
.badge-warn{background:var(--warn-bg);color:var(--warn-text);border:1px solid rgba(243,156,18,.45)}
.badge-mute{background:transparent;color:var(--muted);border:1px solid var(--border)}
.rs{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px dashed var(--border)}
.rs:last-child{border-bottom:none}
.rs-ico{width:24px;height:24px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;margin-top:1px}
.rs-ico.ok{background:var(--success);color:#fff}
.rs-ico.no{background:var(--danger);color:#fff}
.rs-ico.off{background:var(--warning);color:var(--navy)}
.rs-body{flex:1;min-width:0}
.rs-name{font-size:13px;font-weight:600}
.rs-sub{font-size:12px;color:var(--muted)}
.sec-title{font-size:12px;font-weight:700;color:var(--muted);margin:14px 0 2px}
.chev{color:var(--muted);font-size:18px}
.empty{text-align:center;padding:48px 20px;color:var(--muted)}

/* detail */
.card{background:var(--card-bg);border-radius:var(--radius-md);border:1px solid var(--border);box-shadow:var(--shadow-md);margin-bottom:12px}
.card-gold{border-top:3px solid var(--gold)}
.card-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--border);font-weight:700}
.card-body{padding:14px}
.drv{display:flex;align-items:center;gap:12px}
.avatar{width:46px;height:46px;border-radius:50%;background:var(--navy);color:var(--gold);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;flex-shrink:0;border:2px solid var(--gold)}
.tl{position:relative;padding-left:30px;padding-bottom:16px}
.tl:last-child{padding-bottom:0}
.tl::before{content:"";position:absolute;left:10px;top:20px;bottom:-2px;width:2px;background:var(--border)}
.tl:last-child::before{display:none}
.tl.move::before{background:repeating-linear-gradient(var(--gold) 0 6px,transparent 6px 10px)}
.dot{position:absolute;left:2px;top:3px;width:18px;height:18px;border-radius:50%;border:4px solid var(--gold);background:var(--card-bg)}
.dot.stop{border-color:var(--danger)}
.dot.end{background:var(--gold);border-color:var(--navy)}
body.dark .dot.end{border-color:#fff}
.tl-time{font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.tl-title{font-size:13px}
.tl-sub{font-size:12px;color:var(--muted)}
.tl-dur{display:inline-block;margin-top:4px}
.tl-row{display:flex;gap:8px;justify-content:space-between;align-items:flex-start}
.map-btn{flex-shrink:0;display:inline-flex;align-items:center;gap:4px;padding:5px 10px;border-radius:var(--radius-sm);border:1px solid var(--border);color:var(--text);font-size:12px;font-weight:600;text-decoration:none;min-height:32px;background:var(--card-bg)}
.map-btn:hover{border-color:var(--gold)}
.kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--border);font-size:13px}
.kv:last-child{border-bottom:none}
.kv span:first-child{color:var(--muted)}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:12px 16px;border-radius:var(--radius-md);font-size:15px;font-weight:700;min-height:50px}
.btn-gold{background:var(--gold);color:var(--navy)}
.btn-gold:hover{background:var(--gold-light)}
.mock-note{font-size:11px;color:var(--muted);text-align:center;margin-top:10px}

#backToTop{position:fixed;bottom:max(24px,calc(16px + env(safe-area-inset-bottom)));right:max(16px,calc(12px + env(safe-area-inset-right)));background:var(--gold);color:var(--navy);border-radius:50%;width:46px;height:46px;display:none;align-items:center;justify-content:center;box-shadow:var(--shadow-gold);z-index:90;font-size:18px;font-weight:700}
#backToTop.show{display:flex}
.toast{position:fixed;bottom:max(24px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);padding:12px 20px;border-radius:var(--radius-md);color:#fff;z-index:9999;font-weight:500;font-size:13px;background:var(--navy-mid);border-left:3px solid var(--gold);animation:fadeIn .3s ease;max-width:90vw}
@keyframes fadeIn{from{opacity:0;transform:translate(-50%,6px)}to{opacity:1;transform:translate(-50%,0)}}
.view{animation:fadeIn2 .2s ease}
@keyframes fadeIn2{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.hidden{display:none!important}

/* login */
.login{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;gap:14px}
.login-card{background:var(--card-bg);border:1px solid var(--border);border-top:4px solid var(--gold);border-radius:var(--radius-lg);padding:28px 22px;width:100%;max-width:360px;box-shadow:var(--shadow-md)}
.login-err{color:var(--danger);font-size:13px;min-height:18px;margin-top:10px}
/* loading */
#loadingBar{position:fixed;top:0;left:0;height:3px;background:var(--gold);width:0;transition:width .4s;z-index:10000}
.spin-wrap{text-align:center;padding:48px 20px;color:var(--muted)}
.spinner-ring{width:42px;height:42px;border:4px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.warn{background:var(--stop-bg);color:var(--stop-text);border:1px solid rgba(231,76,60,.35);border-radius:var(--radius-md);padding:10px 12px;font-size:12px;margin-bottom:12px}
.updated{font-size:11px;color:var(--muted);text-align:center;margin:-4px 0 10px}
#datePick{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px}
.chip:disabled{opacity:.35;cursor:not-allowed}
@media(max-width:400px){header .icon-btn{width:34px;height:34px;font-size:15px}.hub-btn{padding:5px 8px;min-height:34px}.hub-t{display:none}.logo-text{font-size:15px;letter-spacing:1px}}
</style>
</head>
<body>
<div id="loadingBar"></div>
<div class="app">

<!-- ===== เข้าสู่ระบบ ===== -->
<div id="loginView" class="login hidden">
  <div class="login-card">
    <div class="logo-text" style="color:var(--text);font-size:22px">RATTANA <span>FLEET</span></div>
    <div style="color:var(--muted);margin:6px 0 18px">สรุปการวิ่งรถรายวันจาก Cartrack</div>
    <div id="gsiBtn" style="display:flex;justify-content:center"></div>
    <div class="login-err" id="loginErr"></div>
  </div>
  <a href="https://rattanaphaiboon.github.io/app/rattana-hub.html" style="color:var(--muted);font-size:13px">🏠 กลับ Hub</a>
</div>

<!-- ===== หน้า 1: รายการรถ ===== -->
<div id="listView" class="view hidden">
  <header>
    <span class="logo-text">RATTANA <span>FLEET</span></span><span class="ver">v1.2</span>
    <div class="hdr-right">
      <button class="icon-btn" id="btnRefresh" onclick="loadDay(true)" title="ดึงข้อมูลล่าสุด">⟳</button>
      <button class="icon-btn" id="themeBtn" onclick="toggleTheme()" title="สลับธีม">🌙</button>
      <button class="icon-btn" id="btnLogout" onclick="logout()" title="ออกจากระบบ">⎋</button>
      <a href="https://rattanaphaiboon.github.io/app/rattana-hub.html" class="hub-btn" title="กลับ Hub">🏠<span class="hub-t"> Hub</span></a>
    </div>
  </header>

  <div class="filter">
    <div class="date-row">
      <button class="chip" onclick="shiftDate(-1)" aria-label="วันก่อนหน้า">‹</button>
      <button class="chip gold" style="flex:4;position:relative" onclick="openPicker()">📅 <span id="dateLabel"></span>
        <input type="date" id="datePick" onchange="pickDate(this.value)" tabindex="-1"></button>
      <button class="chip" id="btnNext" onclick="shiftDate(1)" aria-label="วันถัดไป">›</button>
    </div>
    <div class="search">
      <span class="ico">🔍</span>
      <input id="q" type="search" placeholder="ค้นหาทะเบียน หรือชื่อคนขับ" autocomplete="off">
      <button class="clr" id="clr" onclick="clearSearch()" aria-label="ล้างคำค้นหา">✕</button>
    </div>
    <div class="sort-row">
      <button class="sort on" data-s="km">กม. มาก → น้อย</button>
      <button class="sort" data-s="stop">จอดนานเยอะสุด</button>
      <button class="sort" data-s="start">ออกรถเช้าสุด</button>
      <button class="sort" data-s="miss">ขาดร้านในรูท</button>
      <button class="sort" data-s="reg">ทะเบียน</button>
    </div>
  </div>

  <div class="content">
    <div class="updated" id="updated"></div>
    <div id="warn"></div>
    <div class="stat-grid">
      <div class="stat-card"><div class="s-label">รถที่วิ่ง</div><div class="s-value" id="sCars">-</div><div class="s-sub">คัน</div></div>
      <div class="stat-card"><div class="s-label">ระยะทางรวม</div><div class="s-value" id="sKm">-</div><div class="s-sub">กม.</div></div>
      <div class="stat-card danger"><div class="s-label">จอดเกิน 1 ชม.</div><div class="s-value" id="sStops">-</div><div class="s-sub">ครั้ง</div></div>
    </div>
    <div class="list" id="list"></div>
  </div>
</div>

<!-- ===== หน้า 2: รายละเอียด ===== -->
<div id="detailView" class="view hidden">
  <header>
    <button class="back-btn" onclick="showList()" aria-label="กลับ">←</button>
    <span class="logo-text" id="dTitle"></span>
    <div class="hdr-right">
      <a href="https://rattanaphaiboon.github.io/app/rattana-hub.html" class="hub-btn" title="กลับ Hub">🏠 Hub</a>
    </div>
  </header>
  <div class="content" id="detail"></div>
</div>

</div>
<button id="backToTop" onclick="window.scrollTo({top:0,behavior:'smooth'})" aria-label="กลับด้านบน">↑</button>

<script>
// ---------- ตั้งค่า ----------
const CONFIG = {
  GAS_URL: 'https://script.google.com/macros/s/AKfycbxKMKKXBe6uYp-4Mbbc5w7V8CK7qU59JmmyDtWfhA9jZZxSIsfPdmrSFqi_LLL7pVq3/exec',   // Rattana Fleet backend (Apps Script)
  GOOGLE_CLIENT_ID: '615875645128-gasjjvkt6lu8g449cbnhl40k1pu25r0b.apps.googleusercontent.com',
};
// โหมดตัวอย่าง: ยังไม่ใส่ GAS_URL หรือเปิดด้วย ?demo=1 → อ่านจาก mock-data.js
const DEMO = !CONFIG.GAS_URL || new URLSearchParams(location.search).has('demo');
const TOKEN_KEY = 'rattana_fleet_token';

let DATA = { days: [], stops: [] };
let stopsByReg = {};
let sortBy = 'km';
let curDate = '';

// ---------- รูปแบบวันที่/เวลาแบบไทย ----------
function formatThaiDate(ymd) {
  const [y, m, d] = ymd.split('-');
  return `${d}/${m}/${+y + 543}`;
}
const t = hhmm => (hhmm || '-').replace(':', '.');
const fmtKm = n => Number(n).toLocaleString('th-TH', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const durTh = s => { const [h, m] = s.split(':'); return `${+h} ชม. ${+m} นาที`; };
const mapUrl = c => c ? `https://www.google.com/maps?q=${c.latitude},${c.longitude}` : '#';
const cleanPlace = p => (p || '-').replace(/^\d{6,}#/, '').replace(/, ประเทศไทย$/, '');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const initials = n => n ? n.trim().charAt(0).toUpperCase() : '?';

// ---------- วันที่ ----------
const bkkToday = () => new Date().toLocaleDateString('sv-SE', { timeZone: 'Asia/Bangkok' });
function addDays(ymd, n) {
  const d = new Date(ymd + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n);
  return d.toISOString().slice(0, 10);
}
function shiftDate(n) { const next = addDays(curDate, n); if (next <= bkkToday()) setDate(next); }
function pickDate(v) { if (v && v <= bkkToday()) setDate(v); }
function openPicker() {
  const el = document.getElementById('datePick');
  el.max = bkkToday(); el.value = curDate;
  try { el.showPicker(); } catch (e) { el.focus(); el.click(); }
}
function setDate(ymd) {
  if (DEMO) { showToast('โหมดตัวอย่างมีข้อมูลแค่วันที่ 28/10/2569'); return; }
  curDate = ymd;
  try { history.replaceState(null, '', `?${DEMO && CONFIG.GAS_URL ? 'demo=1&' : ''}date=${ymd}`); } catch (e) {}
  loadDay(false);
}
function renderDateBar() {
  const today = bkkToday();
  document.getElementById('dateLabel').textContent = (curDate === today ? 'วันนี้ ' : '') + formatThaiDate(curDate);
  document.getElementById('btnNext').disabled = curDate >= today;
}

// ---------- โหลดข้อมูล ----------
async function loadDay(refresh) {
  renderDateBar();
  const list = document.getElementById('list');
  list.innerHTML = '<div class="spin-wrap"><div class="spinner-ring"></div>กำลังดึงข้อมูลจาก Cartrack…</div>';
  ['sCars', 'sKm', 'sStops'].forEach(id => document.getElementById(id).textContent = '-');
  document.getElementById('updated').textContent = '';
  document.getElementById('warn').innerHTML = '';
  const btn = document.getElementById('btnRefresh'); btn.disabled = true;
  const want = curDate;
  try {
    const data = await api('day', { date: want, refresh });
    if (want !== curDate) return;   // ผู้ใช้เปลี่ยนวันระหว่างรอ
    setData(data);
  } catch (e) {
    if (want !== curDate) return;
    if (e.code !== 'AUTH' && e.code !== 'NO_USER') list.innerHTML = `<div class="empty">ดึงข้อมูลไม่สำเร็จ<br><small>${esc(e.message)}</small><br><br><button class="sort on" onclick="loadDay(true)">ลองใหม่</button></div>`;
  } finally { btn.disabled = false; }
}
function setData(data) {
  DATA = data;
  stopsByReg = {};
  DATA.stops.forEach(s => (stopsByReg[s.reg] ||= []).push(s));
  const at = data.generatedAt ? new Date(data.generatedAt).toLocaleTimeString('th-TH', { timeZone: 'Asia/Bangkok', hour: '2-digit', minute: '2-digit' }).replace(':', '.') : '';
  document.getElementById('updated').textContent = DEMO ? 'โหมดตัวอย่าง (ข้อมูลวันที่ 28/10/2569)' : data.isToday ? `ข้อมูลถึงเวลา ${at} น. · วันยังไม่จบ ตัวเลขยังเปลี่ยนได้` : (at ? `ดึงข้อมูลเมื่อ ${at} น.` : '');
  document.getElementById('warn').innerHTML = data.errors && data.errors.length
    ? `<div class="warn">⚠️ ดึงข้อมูลไม่ได้ ${data.errors.length} คัน: ${esc(data.errors.map(x => x.split(':')[0]).join(', '))} — กด ⟳ เพื่อลองใหม่</div>` : '';
  renderSummary();
  renderList();
  const reg = decodeURIComponent(location.hash.slice(1));
  if (reg && DATA.days.some(d => d.reg === reg)) showDetail(reg, true);
}

// ---------- API ----------
function setLoading(on) { document.getElementById('loadingBar').style.width = on ? '85%' : '0'; }
let demoData = null;
function loadDemo() {
  if (demoData) return Promise.resolve(demoData);
  return new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = 'mock-data.js';
    s.onload = () => { const d = window.FLEET_DATA; demoData = { date: d.from, days: d.days, stops: d.stops, errors: [] }; res(demoData); };
    s.onerror = () => rej(new Error('ไม่พบไฟล์ mock-data.js'));
    document.head.appendChild(s);
  });
}
async function api(action, payload = {}) {
  setLoading(true);
  try {
    if (DEMO) { const d = await loadDemo(); return action === 'day' ? d : {}; }
    const tk = getIdToken();
    if (!tk) { showLogin(); throw Object.assign(new Error('กรุณาเข้าสู่ระบบ'), { code: 'AUTH' }); }
    const text = JSON.stringify({ action, payload, idToken: tk });
    // script.google.com ตอบหน้า HTML แบบสุ่มได้ — อ่านอย่างเดียวจึงลองซ้ำได้ 3 ครั้ง
    let j = null, lastErr = null;
    for (let i = 0; i < 3 && !j; i++) {
      if (i) await new Promise(r => setTimeout(r, 800 * i));
      try {
        const res = await fetch(CONFIG.GAS_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: text });
        const raw = await res.text();
        try { j = JSON.parse(raw); } catch (_) { lastErr = Object.assign(new Error(`เซิร์ฟเวอร์ Google ไม่ตอบสนอง (HTTP ${res.status})`), { code: 'NETWORK' }); }
      } catch (_) { lastErr = Object.assign(new Error('เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ กรุณาตรวจสอบอินเทอร์เน็ต'), { code: 'NETWORK' }); }
    }
    if (!j) throw lastErr;
    if (!j.ok) {
      const e = Object.assign(new Error(j.error || 'เกิดข้อผิดพลาด'), { code: j.code });
      if (e.code === 'AUTH' || e.code === 'NO_USER') { sessionStorage.removeItem(TOKEN_KEY); showLogin(e.message); }
      throw e;
    }
    return j.data;
  } finally { setLoading(false); }
}

// ---------- เข้าสู่ระบบ (Google) ----------
function decodeJwtPayload(token) {
  let b64 = String(token || '').split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
  b64 += '='.repeat((4 - b64.length % 4) % 4);
  const bin = atob(b64), bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return JSON.parse(new TextDecoder('utf-8').decode(bytes));
}
function getIdToken() { try { const o = JSON.parse(sessionStorage.getItem(TOKEN_KEY)); if (o && o.exp - 60000 > Date.now()) return o.t; } catch (e) {} return null; }
function checkRattanaSession() { try { const p = JSON.parse(localStorage.getItem('rattana_session')); return p && p.data && p.data.email && Date.now() < p.exp ? p.data : null; } catch (e) { return null; } }
function loadGsi() {
  return new Promise((res, rej) => {
    if (window.google && google.accounts) return res();
    const s = document.createElement('script'); s.src = 'https://accounts.google.com/gsi/client'; s.async = true;
    s.onload = res; s.onerror = () => rej(new Error('โหลด Google Sign-In ไม่สำเร็จ กรุณาตรวจสอบอินเทอร์เน็ต')); document.head.appendChild(s);
  });
}
function showScreen(name) {
  document.getElementById('loginView').classList.toggle('hidden', name !== 'login');
  document.getElementById('listView').classList.toggle('hidden', name !== 'list');
  document.getElementById('detailView').classList.toggle('hidden', name !== 'detail');
}
async function showLogin(msg) {
  showScreen('login');
  document.getElementById('loginErr').textContent = msg || '';
  try {
    await loadGsi();
    const hub = checkRattanaSession();
    google.accounts.id.initialize({ client_id: CONFIG.GOOGLE_CLIENT_ID, callback: onCredential, auto_select: true, login_hint: hub ? hub.email : undefined, cancel_on_tap_outside: false });
    google.accounts.id.renderButton(document.getElementById('gsiBtn'), { theme: 'outline', size: 'large', text: 'signin_with', locale: 'th' });
    google.accounts.id.prompt();
  } catch (e) { document.getElementById('loginErr').textContent = e.message; }
}
function onCredential(r) {
  try {
    const p = decodeJwtPayload(r.credential);
    sessionStorage.setItem(TOKEN_KEY, JSON.stringify({ t: r.credential, exp: p.exp * 1000 }));
    showScreen('list');
    loadDay(false);
  } catch (e) { document.getElementById('loginErr').textContent = 'เข้าสู่ระบบไม่สำเร็จ'; }
}
function logout() {
  if (DEMO) { showToast('โหมดตัวอย่าง ไม่ต้องออกจากระบบ'); return; }
  sessionStorage.removeItem(TOKEN_KEY);
  if (window.google && google.accounts) google.accounts.id.disableAutoSelect();
  showLogin();
}

// ---------- หน้า 1 ----------
function renderSummary() {
  document.getElementById('sCars').textContent = DATA.days.length;
  document.getElementById('sKm').textContent = Math.round(DATA.days.reduce((s, d) => s + +d.km, 0)).toLocaleString('th-TH');
  document.getElementById('sStops').textContent = DATA.stops.length;
}

function renderList() {
  const q = document.getElementById('q').value.trim().toLowerCase();
  document.getElementById('clr').style.display = q ? 'block' : 'none';
  let rows = DATA.days.filter(d => `${d.reg} ${d.driver} ${d.name}`.toLowerCase().includes(q));
  const cmp = {
    km: (a, b) => b.km - a.km,
    stop: (a, b) => b.stops - a.stops || b.km - a.km,
    start: (a, b) => a.start.localeCompare(b.start),
    miss: (a, b) => missOf(b) - missOf(a) || offOf(b) - offOf(a) || !!b.route - !!a.route,
    reg: (a, b) => a.reg.localeCompare(b.reg, 'th'),
  }[sortBy];
  rows.sort(cmp);

  const el = document.getElementById('list');
  if (!rows.length) { el.innerHTML = `<div class="empty">ไม่พบรถที่ค้นหา "${esc(q)}"</div>`; return; }
  el.innerHTML = rows.map(d => `
    <div class="vrow" onclick="showDetail('${esc(d.reg)}')">
      <div class="plate">${esc(d.reg)}<small>${t(d.start)}–${t(d.end)}</small></div>
      <div class="vinfo">
        <div class="vdrv">${esc(d.driver) || '<span style="color:var(--muted)">ไม่ระบุคนขับ</span>'}</div>
        <div class="vmeta">${fmtKm(d.km)} กม. · ${d.trips} เที่ยว</div>
        <div style="margin-top:3px;display:flex;flex-wrap:wrap;gap:4px">${d.stops ? `<span class="badge badge-stop">จอดเกิน 1 ชม. ${d.stops} จุด</span>` : `<span class="badge badge-ok">ไม่มีจอดนาน</span>`}${routeBadges(d)}</div>
      </div>
      <span class="chev">›</span>
    </div>`).join('');
}
const missOf = d => d.route ? d.route.planned - d.route.visited : 0;
const offOf = d => d.route ? d.route.off.length : 0;
function routeBadges(d) {
  if (!d.route) return '';
  const r = d.route, miss = r.planned - r.visited;
  return `<span class="badge ${miss ? 'badge-warn' : 'badge-ok'}">รูท ${r.visited}/${r.planned} ร้าน</span>`
    + (r.off.length ? `<span class="badge badge-warn">จอดนอกรูท ${r.off.length}</span>` : '');
}
const minTh = m => m == null ? '' : m >= 60 ? `${Math.floor(m / 60)} ชม. ${m % 60} นาที` : `${m} นาที`;
function routeCard(d) {
  if (!d.route) return `<div class="card"><div class="card-head">เทียบกับรูท</div><div class="card-body tl-sub">${DATA.routeError ? esc(DATA.routeError) : 'ยังไม่ได้กำหนดรูทของรถคันนี้สำหรับวันนี้ (ชีท Rattana Fleet รูทวิ่งรถ)'}</div></div>`;
  const r = d.route;
  return `<div class="card">
    <div class="card-head">เทียบกับรูท <span class="badge ${r.planned - r.visited ? 'badge-warn' : 'badge-ok'}">ถึง ${r.visited}/${r.planned} ร้าน</span></div>
    <div class="card-body" style="padding-top:6px">
      <div class="tl-sub">${r.routes.map(x => esc(x.code + (x.name ? ' ' + x.name : ''))).join(' · ')}</div>
      ${r.stores.map(s => `
        <div class="rs">
          <div class="rs-ico ${s.visited ? 'ok' : 'no'}">${s.visited ? '✓' : '✕'}</div>
          <div class="rs-body">
            <div class="rs-name">${s.seq}. ${esc(s.name || '(ไม่มีชื่อในแท็บร้านค้า)')}</div>
            <div class="rs-sub">${esc(s.code)} · ${s.visited ? `ถึง ${t(s.arrive)}${s.leave ? ` ออก ${t(s.leave)} · จอด ${minTh(s.minutes)}` : ' · จุดสุดท้ายของวัน'}` : s.noCoord ? 'ไม่ได้ไป (ร้านนี้ไม่มีพิกัดใน Cartrack ตรวจไม่ได้)' : 'ไม่ได้ไป'}</div>
          </div>
          ${s.visited ? `<a class="map-btn" href="${mapUrl(s.coords)}" target="_blank" rel="noopener">📍</a>` : ''}
        </div>`).join('')}
      ${r.off.length ? `<div class="sec-title">จอดนอกรูท (ตั้งแต่ 10 นาที)</div>` + r.off.map(o => `
        <div class="rs">
          <div class="rs-ico off">!</div>
          <div class="rs-body">
            <div class="rs-name">${esc(cleanPlace(o.place))}</div>
            <div class="rs-sub">${o.code ? 'ร้านลูกค้าที่ไม่อยู่ในรูท' : 'ไม่ใช่ร้านลูกค้า'} · ${t(o.arrive)}–${t(o.leave)} · จอด ${minTh(o.minutes)}</div>
          </div>
          <a class="map-btn" href="${mapUrl(o.coords)}" target="_blank" rel="noopener">📍</a>
        </div>`).join('') : `<div class="sec-title" style="color:var(--ok-text)">ไม่มีจอดนอกรูทเกิน 10 นาที</div>`}
    </div>
  </div>`;
}

// ---------- หน้า 2 ----------
function showDetail(reg, noPush) {
  const d = DATA.days.find(x => x.reg === reg);
  if (!d) return;
  const stops = stopsByReg[reg] || [];
  document.getElementById('dTitle').innerHTML = `<span>${esc(d.reg)}</span>`;

  const tl = [
    { cls: 'move', dot: '', time: `${t(d.start)} ออกรถ`, title: cleanPlace(d.startPlace), c: d.startCoords },
    ...stops.map(s => ({ cls: 'move', dot: 'stop', time: `${t(s.arrive)} – ${t(s.leave)}`, title: cleanPlace(s.place), dur: durTh(s.duration), c: s.coords })),
    { cls: '', dot: 'end', time: `${t(d.end)} จบวัน`, title: cleanPlace(d.endPlace), c: d.endCoords },
  ];

  document.getElementById('detail').innerHTML = `
    <div class="card card-gold"><div class="card-body">
      <div class="drv">
        <div class="avatar">${esc(initials(d.driver))}</div>
        <div style="min-width:0">
          <div style="font-weight:700;font-size:16px">${esc(d.driver) || 'ไม่ระบุคนขับ'}</div>
          <div class="tl-sub">ทะเบียน ${esc(d.reg)} · ${formatThaiDate(d.date)}</div>
        </div>
      </div>
    </div></div>

    <div class="stat-grid">
      <div class="stat-card"><div class="s-label">ระยะทาง</div><div class="s-value">${fmtKm(d.km)}</div><div class="s-sub">กม.</div></div>
      <div class="stat-card"><div class="s-label">จำนวนเที่ยว</div><div class="s-value">${d.trips}</div><div class="s-sub">เที่ยว</div></div>
      <div class="stat-card ${stops.length ? 'danger' : ''}"><div class="s-label">จอดเกิน 1 ชม.</div><div class="s-value">${stops.length}</div><div class="s-sub">จุด</div></div>
    </div>

    ${routeCard(d)}

    <div class="card">
      <div class="card-head">ไทม์ไลน์ของวัน <span class="tl-sub" style="font-weight:500">${t(d.start)} – ${t(d.end)}</span></div>
      <div class="card-body">
        ${tl.map(x => `
          <div class="tl ${x.cls}">
            <div class="dot ${x.dot}"></div>
            <div class="tl-row">
              <div style="min-width:0">
                <div class="tl-time">${x.time}</div>
                <div class="tl-title">${esc(x.title)}</div>
                ${x.dur ? `<span class="badge badge-stop tl-dur">จอดนาน ${x.dur}</span>` : ''}
              </div>
              <a class="map-btn" href="${mapUrl(x.c)}" target="_blank" rel="noopener">📍 แผนที่</a>
            </div>
          </div>`).join('')}
      </div>
    </div>

    <div class="card">
      <div class="card-head">ข้อมูลเพิ่มเติม</div>
      <div class="card-body">
        <div class="kv"><span>ชื่อรถใน Cartrack</span><span>${esc(d.name)}</span></div>
        <div class="kv"><span>ใช้เวลาตั้งแต่ออกจนจบ</span><span>${spanTime(d.start, d.end)}</span></div>
        <div class="kv"><span>เวลาจอดนานรวม</span><span>${stops.length ? totalStop(stops) : '-'}</span></div>
        <div class="kv"><span>พิกัดเริ่ม</span><span>${coordTxt(d.startCoords)}</span></div>
        <div class="kv"><span>พิกัดจบ</span><span>${coordTxt(d.endCoords)}</span></div>
      </div>
    </div>

    <div class="mock-note">${DEMO ? 'โหมดตัวอย่าง · ' : ''}ข้อมูลจาก Cartrack วันที่ ${formatThaiDate(d.date)}</div>`;

  showScreen('detail');
  window.scrollTo(0, 0);
  if (!noPush) history.pushState({ reg }, '', location.search + '#' + encodeURIComponent(reg));
}

function showList() {
  showScreen('list');
  if (location.hash) history.pushState({}, '', location.pathname + location.search);
}
window.addEventListener('popstate', () => {
  const reg = decodeURIComponent(location.hash.slice(1));
  if (reg && DATA.days.some(d => d.reg === reg)) showDetail(reg, true);
  else if (document.getElementById('loginView').classList.contains('hidden')) showScreen('list');
});

const toMin = s => { const [h, m] = s.split(':'); return +h * 60 + +m; };
const minTxt = m => `${Math.floor(m / 60)} ชม. ${m % 60} นาที`;
const spanTime = (a, b) => minTxt(toMin(b) - toMin(a));
const totalStop = st => minTxt(st.reduce((s, x) => s + toMin(x.duration), 0));
const coordTxt = c => c ? `${c.latitude.toFixed(5)}, ${c.longitude.toFixed(5)}` : '-';

// ---------- อื่นๆ ----------
function clearSearch() { const q = document.getElementById('q'); q.value = ''; renderList(); q.focus(); }
function showToast(msg) {
  const el = document.createElement('div'); el.className = 'toast'; el.textContent = msg;
  document.body.appendChild(el); setTimeout(() => el.remove(), 2500);
}

const THEME_KEY = 'rattana_theme';
function applyTheme(th) {
  document.body.classList.toggle('dark', th === 'dark');
  document.getElementById('themeBtn').textContent = th === 'dark' ? '☀️' : '🌙';
}
function toggleTheme() {
  const next = document.body.classList.contains('dark') ? 'light' : 'dark';
  try { localStorage.setItem(THEME_KEY, next); } catch {}
  applyTheme(next);
}
try { applyTheme(localStorage.getItem(THEME_KEY) || 'light'); } catch { applyTheme('light'); }

window.addEventListener('scroll', () => document.getElementById('backToTop').classList.toggle('show', window.scrollY > 300));
document.getElementById('q').addEventListener('input', renderList);
document.querySelectorAll('.sort').forEach(b => b.onclick = () => {
  document.querySelectorAll('.sort').forEach(x => x.classList.remove('on'));
  b.classList.add('on'); sortBy = b.dataset.s; renderList();
});

// ---------- เริ่มแอป ----------
(function init() {
  const qd = new URLSearchParams(location.search).get('date');
  curDate = DEMO ? '2026-10-28' : (qd && /^\d{4}-\d{2}-\d{2}$/.test(qd) && qd <= bkkToday() ? qd : bkkToday());
  if (!DEMO && !getIdToken()) { showLogin(); return; }
  showScreen('list');
  loadDay(false);
})();
</script>
