<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Rattana Fleet v1.9</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0d1b3e;--navy-mid:#1a2f5e;--navy-light:#243b73;--gold:#c9a84c;--gold-light:#e8c86a;
  --success:#2ecc71;--danger:#e74c3c;--warning:#f39c12;--info:#3498db;
  --bg:#f4f6fb;--text:#0d1b3e;--card-bg:#ffffff;--border:#dde3f0;--muted:#6b7896;--row-alt:#fafbfd;
  --radius-sm:6px;--radius-md:12px;--radius-lg:16px;
  --shadow-md:0 2px 8px rgba(0,0,0,.08);--shadow-gold:0 4px 12px rgba(201,168,76,.35);
  --stop-bg:#fff1ef;--stop-text:#c0392b;--ok-bg:#e8f7ee;--ok-text:#1e8449;--warn-bg:#fef3d7;--warn-text:#a87800;
}
body.dark{
  --bg:#05080f;--text:#ffffff;--card-bg:#0d1b3e;--border:#1f3563;--muted:#b8c2dc;--row-alt:#0a1226;
  --stop-bg:transparent;--stop-text:#ff8a7e;--ok-bg:transparent;--ok-text:#7be0a3;--warn-bg:transparent;--warn-text:#e8c86a;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Sarabun',sans-serif;font-size:14px;line-height:1.5;min-height:100dvh;overflow-x:hidden;background:var(--bg);color:var(--text);transition:background .25s,color .25s}
button{font-family:inherit;cursor:pointer;border:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
input{font-family:inherit;font-size:16px}
.app{max-width:520px;margin:0 auto;min-height:100dvh;background:var(--bg)}

header{background:var(--navy);color:#fff;padding:12px 14px;padding-top:max(12px,env(safe-area-inset-top));position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:10px;border-bottom:3px solid var(--gold)}
.logo-text{font-weight:700;letter-spacing:1.5px;font-size:17px;color:#fff;white-space:nowrap}
.logo-text span{color:var(--gold)}
.ver{font-size:11px;color:rgba(255,255,255,.55);margin-left:2px}
.hdr-right{margin-left:auto;display:flex;gap:6px;align-items:center}
.icon-btn{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.2);width:38px;height:38px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-size:17px}
.icon-btn:hover{background:rgba(255,255,255,.12)}
.hub-btn{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:var(--radius-sm);padding:5px 10px;font-size:13px;font-weight:600;text-decoration:none;min-height:38px}
.back-btn{background:transparent;color:#fff;font-size:22px;width:38px;height:38px;display:flex;align-items:center;justify-content:center;border-radius:var(--radius-sm)}
.back-btn:hover{background:rgba(255,255,255,.12)}

.filter{background:var(--card-bg);border-bottom:1px solid var(--border);padding:12px 14px;position:sticky;top:65px;z-index:50}
.date-row{display:flex;gap:8px;margin-bottom:10px}
.chip{flex:1;min-height:40px;border-radius:var(--radius-sm);border:1.5px solid var(--border);background:var(--card-bg);color:var(--text);font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px}
.chip.gold{background:var(--gold);border-color:var(--gold);color:var(--navy)}
.search{position:relative}
.search input{width:100%;height:46px;border-radius:23px;border:1.5px solid var(--border);background:var(--bg);color:var(--text);padding:0 44px 0 42px;outline:none}
.search input:focus{border-color:var(--gold)}
.search .ico{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:16px}
.search .clr{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:50%;background:transparent;color:var(--muted);font-size:18px;display:none}
.sort-row{display:flex;gap:6px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.sort-row::-webkit-scrollbar{display:none}
.sort{flex-shrink:0;min-height:32px;padding:4px 12px;border-radius:16px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:13px;font-weight:600}
.sort.on{background:var(--navy);border-color:var(--navy);color:#fff}
body.dark .sort.on{background:var(--gold);border-color:var(--gold);color:var(--navy)}

.content{padding:12px 14px 90px}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat-card{background:var(--card-bg);border-radius:var(--radius-md);padding:10px 8px;border:1px solid var(--border);border-top:3px solid var(--gold);text-align:center}
.stat-card.danger{border-top-color:var(--danger)}
.s-label{font-size:11px;color:var(--muted);font-weight:600}
.s-value{font-size:20px;font-weight:700;line-height:1.25;font-variant-numeric:tabular-nums}
.stat-card.danger .s-value{color:var(--danger)}
.s-sub{font-size:11px;color:var(--muted)}

.list{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--shadow-md)}
.vrow{display:flex;align-items:center;gap:12px;padding:12px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .12s}
.vrow:last-child{border-bottom:none}
.vrow:hover{background:rgba(201,168,76,.08)}
.vrow:active{background:rgba(201,168,76,.15)}
.plate{min-width:82px;text-align:center;border:2px solid var(--text);border-radius:6px;padding:3px 6px;font-weight:700;font-size:14px;background:var(--card-bg);line-height:1.3}
.plate small{display:block;font-size:10px;font-weight:500;color:var(--muted);border-top:1px solid var(--border);margin-top:2px}
.vinfo{flex:1;min-width:0}
.vdrv{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vmeta{font-size:12px;color:var(--muted)}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;white-space:nowrap}
.badge-stop{background:var(--stop-bg);color:var(--stop-text);border:1px solid rgba(231,76,60,.35)}
.badge-ok{background:var(--ok-bg);color:var(--ok-text);border:1px solid rgba(46,204,113,.35)}
.badge-warn{background:var(--warn-bg);color:var(--warn-text);border:1px solid rgba(243,156,18,.45)}
.badge-mute{background:transparent;color:var(--muted);border:1px solid var(--border)}
.rs{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px dashed var(--border)}
.rs:last-child{border-bottom:none}
.rs-ico{width:24px;height:24px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;margin-top:1px}
.rs-ico.ok{background:var(--success);color:#fff}
.rs-ico.no{background:var(--danger);color:#fff}
.rs-ico.off{background:var(--warning);color:var(--navy)}
.rs-ico.mute{background:var(--border);color:var(--muted)}
.rc-tabs{display:flex;gap:4px;margin-top:10px;background:var(--row-alt);border:1px solid var(--border);border-radius:var(--radius-sm);padding:3px}
.rc-tabs button{flex:1;min-height:36px;border-radius:5px;background:transparent;color:var(--muted);font-size:12px;font-weight:700;padding:4px 6px}
.rc-tabs button.on{background:var(--navy);color:#fff}
body.dark .rc-tabs button.on{background:var(--gold);color:var(--navy)}
.pager{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
.pager button{min-height:38px;padding:6px 12px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--card-bg);color:var(--text);font-size:13px;font-weight:600}
.pager button:disabled{opacity:.35;cursor:not-allowed}
.pager span{font-size:12px;color:var(--muted);text-align:center}
.fleet-map{height:360px;border-top:1px solid var(--border);border-bottom:1px solid var(--border);background:var(--row-alt);z-index:1}
.map-legend{display:flex;flex-wrap:wrap;gap:10px;padding:10px 14px;font-size:11px;color:var(--muted)}
.map-legend i{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-2px;margin-right:4px}
.mk{display:flex;align-items:center;justify-content:center;border-radius:50%;font:700 12px 'Sarabun',sans-serif;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.mk-stop{width:24px;height:24px;background:#fff;color:#0d1b3e;border:2px solid #0d1b3e}
.mk-long{border-color:#e74c3c;color:#e74c3c}
.mk-start{width:26px;height:26px;background:#2ecc71;color:#fff;border:2px solid #fff}
.mk-end{width:26px;height:26px;background:#0d1b3e;color:#c9a84c;border:2px solid #c9a84c}
.mk-live{width:34px;height:34px;background:#c9a84c;border:3px solid #fff;font-size:17px;box-shadow:0 0 0 0 rgba(201,168,76,.7);animation:livePulse 1.8s infinite}
.mk-live.moving{background:#2ecc71;box-shadow:0 0 0 0 rgba(46,204,113,.7)}
@keyframes livePulse{0%{box-shadow:0 0 0 0 rgba(201,168,76,.65)}70%{box-shadow:0 0 0 14px rgba(201,168,76,0)}100%{box-shadow:0 0 0 0 rgba(201,168,76,0)}}
.mk-ok{width:14px;height:14px;background:#2ecc71;border:2px solid #fff;border-radius:3px}
.mk-miss{width:14px;height:14px;background:#e74c3c;border:2px solid #fff;border-radius:3px}
.leaflet-popup-content{font-family:'Sarabun',sans-serif;font-size:13px;line-height:1.5;margin:10px 12px;color:#0d1b3e}
.map-toggle{background:#fff;color:#0d1b3e;border:2px solid rgba(0,0,0,.2);border-radius:6px;padding:6px 10px;font:700 12px 'Sarabun',sans-serif;min-height:34px;cursor:pointer}
.map-toggle.on{background:#0d1b3e;color:#c9a84c;border-color:#0d1b3e}
.map-tools{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.map-hint{background:rgba(13,27,62,.85);color:#fff;font:600 11px 'Sarabun',sans-serif;padding:3px 8px;border-radius:10px;animation:popIn .25s ease}

/* ===== v1.8 ตกแต่ง + เอฟเฟคตอนกด ===== */
header{background:linear-gradient(135deg,var(--navy) 0%,var(--navy-mid) 100%);box-shadow:0 2px 10px rgba(13,27,62,.25)}
.card,.stat-card,.q-link{border-radius:14px}
.card{box-shadow:0 2px 10px rgba(13,27,62,.06)}
.card-head{background:linear-gradient(to right,rgba(201,168,76,.10),transparent 70%)}
body.dark .card-head{background:transparent}
.stat-card{position:relative;overflow:hidden;box-shadow:0 2px 8px rgba(13,27,62,.05)}
.stat-card[data-ico]::before{content:attr(data-ico);display:block;font-size:16px;line-height:1;margin-bottom:3px}
.s-value{font-size:22px}
/* แถวรถ = การ์ดแยกใบ มีแถบสีซ้ายบอกสถานะ */
.list{background:transparent;border:none;box-shadow:none;overflow:visible;display:flex;flex-direction:column;gap:8px}
.vrow{position:relative;overflow:hidden;background:var(--card-bg);border:1px solid var(--border);border-radius:14px;padding:12px 12px 12px 16px;box-shadow:0 1px 6px rgba(13,27,62,.05);animation:rowIn .32s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 28ms)}
.vrow:last-child{border-bottom:1px solid var(--border)}
.vrow::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--success)}
.vrow.st-warn::before{background:var(--warning)}
.vrow.st-bad::before{background:var(--danger)}
.vrow:hover{background:var(--card-bg);border-color:var(--gold)}
.plate{border-radius:8px;box-shadow:inset 0 0 0 1px var(--border)}
.chev{transition:transform .2s}
.vrow:hover .chev{transform:translateX(3px)}
/* เอฟเฟคตอนกด: ยุบเล็กน้อย + วงกระเพื่อม */
button,.vrow,.q-link,.map-btn,.hub-btn,.chip,.sort{-webkit-tap-highlight-color:transparent;transition:transform .12s ease,background-color .15s,box-shadow .15s,border-color .15s}
button:active:not(:disabled),.map-btn:active,.hub-btn:active,.q-link:active{transform:scale(.95)}
.vrow:active{transform:scale(.985);box-shadow:0 0 0 2px var(--gold)}
.fx{position:relative;overflow:hidden}
.ripple{position:absolute;border-radius:50%;pointer-events:none;background:currentColor;opacity:.18;transform:scale(0);animation:ripple .55s ease-out forwards}
@keyframes ripple{to{transform:scale(2.6);opacity:0}}
@keyframes rowIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes popIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
@keyframes slideIn{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
#detailView,#qualityView{animation:slideIn .28s cubic-bezier(.2,.8,.2,1)}
#listView{animation:fadeIn2 .2s ease}
.rc-tabs button{transition:background .2s,color .2s,transform .12s}
.rs{animation:rowIn .25s ease both}
/* โหลดรายการ: แถบโครงร่างกระพริบแทนวงหมุน */
.skel{height:74px;border-radius:14px;background:linear-gradient(90deg,var(--card-bg) 25%,var(--row-alt) 50%,var(--card-bg) 75%);background-size:200% 100%;border:1px solid var(--border);animation:shimmer 1.2s infinite linear}
@keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}
.load-note{text-align:center;font-size:12px;color:var(--muted);margin:4px 0 8px}
.avatar{box-shadow:0 0 0 4px rgba(201,168,76,.18)}
.q-link{box-shadow:0 2px 8px rgba(13,27,62,.05)}
.q-link:hover{border-color:var(--gold)}
.leaflet-tooltip.lb{font:600 10px/1.25 'Sarabun',sans-serif;padding:0 4px;border-radius:3px;box-shadow:0 1px 2px rgba(0,0,0,.2);white-space:nowrap;max-width:120px;overflow:hidden;text-overflow:ellipsis;opacity:.92}
.leaflet-tooltip.lb::before{display:none}
@media(max-width:480px){.leaflet-tooltip.lb{font-size:9px;max-width:96px;padding:0 3px}}
.leaflet-tooltip.lb-stop{background:#0d1b3e;color:#fff;border-color:#0d1b3e}
.leaflet-tooltip.lb-ok{background:#e8f7ee;color:#1e8449;border-color:#2ecc71}
.leaflet-tooltip.lb-miss{background:#fff1ef;color:#c0392b;border-color:#e74c3c}
.q-link{width:100%;display:flex;justify-content:space-between;align-items:center;background:var(--card-bg);border:1px solid var(--border);border-left:4px solid var(--gold);border-radius:var(--radius-md);padding:12px 14px;margin-bottom:12px;font-size:14px;font-weight:600;color:var(--text);min-height:46px}
.q-link span{color:var(--muted);font-size:18px}
.q-tbl{width:100%;border-collapse:collapse;font-size:12px}
.q-tbl th{text-align:left;color:var(--muted);font-weight:600;padding:6px 4px;border-bottom:1px solid var(--border)}
.q-tbl td{padding:8px 4px;border-bottom:1px dashed var(--border);vertical-align:top}
.q-tbl td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.q-tbl tr.click{cursor:pointer}
.q-tbl tr.click:hover{background:rgba(201,168,76,.08)}
.q-note{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.6}
.q-btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.q-more{width:100%;margin-top:8px;min-height:38px;border:1px dashed var(--border);background:transparent;color:var(--muted);border-radius:var(--radius-sm);font-size:13px}
.rs-body{flex:1;min-width:0}
.rs-name{font-size:13px;font-weight:600}
.rs-sub{font-size:12px;color:var(--muted)}
.sec-title{font-size:12px;font-weight:700;color:var(--muted);margin:14px 0 2px}
.chev{color:var(--muted);font-size:18px}
.empty{text-align:center;padding:48px 20px;color:var(--muted)}

/* detail */
.card{background:var(--card-bg);border-radius:var(--radius-md);border:1px solid var(--border);box-shadow:var(--shadow-md);margin-bottom:12px}
.card-gold{border-top:3px solid var(--gold)}
.card-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--border);font-weight:700}
.card-body{padding:14px}
.drv{display:flex;align-items:center;gap:12px}
.avatar{width:46px;height:46px;border-radius:50%;background:var(--navy);color:var(--gold);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;flex-shrink:0;border:2px solid var(--gold)}
.tl{position:relative;padding-left:30px;padding-bottom:16px}
.tl:last-child{padding-bottom:0}
.tl::before{content:"";position:absolute;left:10px;top:20px;bottom:-2px;width:2px;background:var(--border)}
.tl:last-child::before{display:none}
.tl.move::before{background:repeating-linear-gradient(var(--gold) 0 6px,transparent 6px 10px)}
.dot{position:absolute;left:2px;top:3px;width:18px;height:18px;border-radius:50%;border:4px solid var(--gold);background:var(--card-bg)}
.dot.stop{border-color:var(--danger)}
.dot.end{background:var(--gold);border-color:var(--navy)}
body.dark .dot.end{border-color:#fff}
.tl-time{font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.tl-title{font-size:13px}
.tl-sub{font-size:12px;color:var(--muted)}
.tl-dur{display:inline-block;margin-top:4px}
.tl-row{display:flex;gap:8px;justify-content:space-between;align-items:flex-start}
.map-btn{flex-shrink:0;display:inline-flex;align-items:center;gap:4px;padding:5px 10px;border-radius:var(--radius-sm);border:1px solid var(--border);color:var(--text);font-size:12px;font-weight:600;text-decoration:none;min-height:32px;background:var(--card-bg)}
.map-btn:hover{border-color:var(--gold)}
.kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--border);font-size:13px}
.kv:last-child{border-bottom:none}
.kv span:first-child{color:var(--muted)}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:12px 16px;border-radius:var(--radius-md);font-size:15px;font-weight:700;min-height:50px}
.btn-gold{background:var(--gold);color:var(--navy)}
.btn-gold:hover{background:var(--gold-light)}
.mock-note{font-size:11px;color:var(--muted);text-align:center;margin-top:10px}

#backToTop{position:fixed;bottom:max(24px,calc(16px + env(safe-area-inset-bottom)));right:max(16px,calc(12px + env(safe-area-inset-right)));background:var(--gold);color:var(--navy);border-radius:50%;width:46px;height:46px;display:none;align-items:center;justify-content:center;box-shadow:var(--shadow-gold);z-index:90;font-size:18px;font-weight:700}
#backToTop.show{display:flex}
.toast{position:fixed;bottom:max(24px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);padding:12px 20px;border-radius:var(--radius-md);color:#fff;z-index:9999;font-weight:500;font-size:13px;background:var(--navy-mid);border-left:3px solid var(--gold);animation:fadeIn .3s ease;max-width:90vw}
@keyframes fadeIn{from{opacity:0;transform:translate(-50%,6px)}to{opacity:1;transform:translate(-50%,0)}}
.view{animation:fadeIn2 .2s ease}
@keyframes fadeIn2{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.hidden{display:none!important}

/* login */
.login{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;gap:14px}
.login-card{background:var(--card-bg);border:1px solid var(--border);border-top:4px solid var(--gold);border-radius:var(--radius-lg);padding:28px 22px;width:100%;max-width:360px;box-shadow:var(--shadow-md)}
.login-err{color:var(--danger);font-size:13px;min-height:18px;margin-top:10px}
/* loading */
#loadingBar{position:fixed;top:0;left:0;height:3px;background:var(--gold);width:0;transition:width .4s;z-index:10000}
.spin-wrap{text-align:center;padding:48px 20px;color:var(--muted)}
.spinner-ring{width:42px;height:42px;border:4px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.warn{background:var(--stop-bg);color:var(--stop-text);border:1px solid rgba(231,76,60,.35);border-radius:var(--radius-md);padding:10px 12px;font-size:12px;margin-bottom:12px}
.updated{font-size:11px;color:var(--muted);text-align:center;margin:-4px 0 10px}
#datePick{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px}
.chip:disabled{opacity:.35;cursor:not-allowed}
@media(max-width:400px){header .icon-btn{width:34px;height:34px;font-size:15px}.hub-btn{padding:5px 8px;min-height:34px}.hub-t{display:none}.logo-text{font-size:15px;letter-spacing:1px}}
</style>
</head>
<body>
<div id="loadingBar"></div>
<div class="app">

<!-- ===== เข้าสู่ระบบ ===== -->
<div id="loginView" class="login hidden">
  <div class="login-card">
    <div class="logo-text" style="color:var(--text);font-size:22px">RATTANA <span>FLEET</span></div>

<script>
// ---------- ตั้งค่า ----------
const CONFIG = {
  GAS_URL: 'https://script.google.com/macros/s/AKfycbxKMKKXBe6uYp-4Mbbc5w7V8CK7qU59JmmyDtWfhA9jZZxSIsfPdmrSFqi_LLL7pVq3/exec',   // Rattana Fleet backend (Apps Script)
  GOOGLE_CLIENT_ID: '615875645128-gasjjvkt6lu8g449cbnhl40k1pu25r0b.apps.googleusercontent.com',
};
// โหมดตัวอย่าง: ยังไม่ใส่ GAS_URL หรือเปิดด้วย ?demo=1 → อ่านจาก mock-data.js
const DEMO = !CONFIG.GAS_URL || new URLSearchParams(location.search).has('demo');
const TOKEN_KEY = 'rattana_fleet_token';

let DATA = { days: [], stops: [] };
let stopsByReg = {};
let sortBy = 'km';
let curDate = '';

// ---------- รูปแบบวันที่/เวลาแบบไทย ----------
function formatThaiDate(ymd) {
  const [y, m, d] = ymd.split('-');
  return `${d}/${m}/${+y + 543}`;
}
const t = hhmm => (hhmm || '-').replace(':', '.');
const fmtKm = n => Number(n).toLocaleString('th-TH', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const durTh = s => { const [h, m] = s.split(':'); return `${+h} ชม. ${+m} นาที`; };
const mapUrl = c => c ? `https://www.google.com/maps?q=${c.latitude},${c.longitude}` : '#';
const cleanPlace = p => (p || '-').replace(/^\d{6,}#/, '').replace(/, ประเทศไทย$/, '');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const initials = n => n ? n.trim().charAt(0).toUpperCase() : '?';

// ---------- วันที่ ----------
const bkkToday = () => new Date().toLocaleDateString('sv-SE', { timeZone: 'Asia/Bangkok' });
function addDays(ymd, n) {
  const d = new Date(ymd + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n);
  return d.toISOString().slice(0, 10);
}
function shiftDate(n) { const next = addDays(curDate, n); if (next <= bkkToday()) setDate(next); }
function pickDate(v) { if (v && v <= bkkToday()) setDate(v); }
function openPicker() {
  const el = document.getElementById('datePick');
  el.max = bkkToday(); el.value = curDate;
  try { el.showPicker(); } catch (e) { el.focus(); el.click(); }
}
function setDate(ymd) {
  if (DEMO) { showToast('โหมดตัวอย่างมีข้อมูลแค่วันที่ 28/10/2569'); return; }
  curDate = ymd;
  try { history.replaceState(null, '', `?${DEMO && CONFIG.GAS_URL ? 'demo=1&' : ''}date=${ymd}`); } catch (e) {}
  loadDay(false);
}
function renderDateBar() {
  const today = bkkToday();
  document.getElementById('dateLabel').textContent = (curDate === today ? 'วันนี้ ' : '') + formatThaiDate(curDate);
  document.getElementById('btnNext').disabled = curDate >= today;
}

// ---------- โหลดข้อมูล ----------
async function loadDay(refresh) {
  renderDateBar();
  const list = document.getElementById('list');
  list.innerHTML = '<div class="load-note">กำลังดึงข้อมูลจาก Cartrack…</div>' + '<div class="skel"></div>'.repeat(6);
  ['sCars', 'sKm', 'sStops'].forEach(id => document.getElementById(id).textContent = '-');
  document.getElementById('updated').textContent = '';
  document.getElementById('warn').innerHTML = '';
  const btn = document.getElementById('btnRefresh'); btn.disabled = true;
  const want = curDate;
  try {
    const data = await api('day', { date: want, refresh });
    if (want !== curDate) return;   // ผู้ใช้เปลี่ยนวันระหว่างรอ
    setData(data);
  } catch (e) {
    if (want !== curDate) return;
    if (e.code !== 'AUTH' && e.code !== 'NO_USER') list.innerHTML = `<div class="empty">ดึงข้อมูลไม่สำเร็จ<br><small>${esc(e.message)}</small><br><br><button class="sort on" onclick="loadDay(true)">ลองใหม่</button></div>`;
  } finally { btn.disabled = false; }
}
function setData(data) {
  DATA = data;
  stopsByReg = {};
  DATA.stops.forEach(s => (stopsByReg[s.reg] ||= []).push(s));
  const at = data.generatedAt ? new Date(data.generatedAt).toLocaleTimeString('th-TH', { timeZone: 'Asia/Bangkok', hour: '2-digit', minute: '2-digit' }).replace(':', '.') : '';
  document.getElementById('updated').textContent = DEMO ? 'โหมดตัวอย่าง (ข้อมูลวันที่ 28/10/2569)' : data.isToday ? `ข้อมูลถึงเวลา ${at} น. · วันยังไม่จบ ตัวเลขยังเปลี่ยนได้` : (at ? `ดึงข้อมูลเมื่อ ${at} น.` : '');
  document.getElementById('warn').innerHTML = data.errors && data.errors.length
    ? `<div class="warn">⚠️ ดึงข้อมูลไม่ได้ ${data.errors.length} คัน: ${esc(data.errors.map(x => x.split(':')[0]).join(', '))} — กด ⟳ เพื่อลองใหม่</div>` : '';
  renderSummary();
  renderList();
  const reg = decodeURIComponent(location.hash.slice(1));
  if (reg && DATA.days.some(d => d.reg === reg)) showDetail(reg, true);
}

// ---------- API ----------
function setLoading(on) { document.getElementById('loadingBar').style.width = on ? '85%' : '0'; }
let demoData = null;
function loadDemo() {
  if (demoData) return Promise.resolve(demoData);
  return new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = 'mock-data.js';
    s.onload = () => { const d = window.FLEET_DATA; demoData = { date: d.from, days: d.days, stops: d.stops, errors: [] }; res(demoData); };
    s.onerror = () => rej(new Error('ไม่พบไฟล์ mock-data.js'));
    document.head.appendChild(s);
  });
}
async function api(action, payload = {}) {
  setLoading(true);
  try {
    if (DEMO) { const d = await loadDemo(); return action === 'day' ? d : {}; }
    const tk = getIdToken();
    if (!tk) { showLogin(); throw Object.assign(new Error('กรุณาเข้าสู่ระบบ'), { code: 'AUTH' }); }
    const text = JSON.stringify({ action, payload, idToken: tk });
    // script.google.com ตอบหน้า HTML แบบสุ่มได้ — อ่านอย่างเดียวจึงลองซ้ำได้ 3 ครั้ง
    let j = null, lastErr = null;
    for (let i = 0; i < 3 && !j; i++) {
      if (i) await new Promise(r => setTimeout(r, 800 * i));
      try {
        const res = await fetch(CONFIG.GAS_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: text });
        const raw = await res.text();
        try { j = JSON.parse(raw); } catch (_) { lastErr = Object.assign(new Error(`เซิร์ฟเวอร์ Google ไม่ตอบสนอง (HTTP ${res.status})`), { code: 'NETWORK' }); }
      } catch (_) { lastErr = Object.assign(new Error('เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ กรุณาตรวจสอบอินเทอร์เน็ต'), { code: 'NETWORK' }); }
    }
    if (!j) throw lastErr;
    if (!j.ok) {
      const e = Object.assign(new Error(j.error || 'เกิดข้อผิดพลาด'), { code: j.code });
      if (e.code === 'AUTH' || e.code === 'NO_USER') { sessionStorage.removeItem(TOKEN_KEY); showLogin(e.message); }
      throw e;
    }
    return j.data;
  } finally { setLoading(false); }
}

// ---------- เข้าสู่ระบบ (Google) ----------
function decodeJwtPayload(token) {
  let b64 = String(token || '').split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
  b64 += '='.repeat((4 - b64.length % 4) % 4);
  const bin = atob(b64), bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return JSON.parse(new TextDecoder('utf-8').decode(bytes));
}
function getIdToken() { try { const o = JSON.parse(sessionStorage.getItem(TOKEN_KEY)); if (o && o.exp - 60000 > Date.now()) return o.t; } catch (e) {} return null; }
function checkRattanaSession() { try { const p = JSON.parse(localStorage.getItem('rattana_session')); return p && p.data && p.data.email && Date.now() < p.exp ? p.data : null; } catch (e) { return null; } }
function loadGsi() {
  return new Promise((res, rej) => {
    if (window.google && google.accounts) return res();
    const s = document.createElement('script'); s.src = 'https://accounts.google.com/gsi/client'; s.async = true;
    s.onload = res; s.onerror = () => rej(new Error('โหลด Google Sign-In ไม่สำเร็จ กรุณาตรวจสอบอินเทอร์เน็ต')); document.head.appendChild(s);
  });
}
function showScreen(name) {
  document.getElementById('loginView').classList.toggle('hidden', name !== 'login');
  document.getElementById('listView').classList.toggle('hidden', name !== 'list');
  document.getElementById('detailView').classList.toggle('hidden', name !== 'detail');
  document.getElementById('qualityView').classList.toggle('hidden', name !== 'quality');
}
async function showLogin(msg) {
  showScreen('login');
  document.getElementById('loginErr').textContent = msg || '';
  try {
    await loadGsi();
    const hub = checkRattanaSession();
    google.accounts.id.initialize({ client_id: CONFIG.GOOGLE_CLIENT_ID, callback: onCredential, auto_select: true, login_hint: hub ? hub.email : undefined, cancel_on_tap_outside: false });
    google.accounts.id.renderButton(document.getElementById('gsiBtn'), { theme: 'outline', size: 'large', text: 'signin_with', locale: 'th' });
    google.accounts.id.prompt();
  } catch (e) { document.getElementById('loginErr').textContent = e.message; }
}
function onCredential(r) {
  try {
    const p = decodeJwtPayload(r.credential);
    sessionStorage.setItem(TOKEN_KEY, JSON.stringify({ t: r.credential, exp: p.exp * 1000 }));
    showScreen('list');
    loadDay(false);
  } catch (e) { document.getElementById('loginErr').textContent = 'เข้าสู่ระบบไม่สำเร็จ'; }
}
function logout() {
  if (DEMO) { showToast('โหมดตัวอย่าง ไม่ต้องออกจากระบบ'); return; }
  sessionStorage.removeItem(TOKEN_KEY);
  if (window.google && google.accounts) google.accounts.id.disableAutoSelect();
  showLogin();
}

// ---------- หน้า 1 ----------
/** ตัวเลขวิ่งขึ้นจาก 0 ถึงค่าจริง */
function countUp(id, to) {
  const el = document.getElementById(id), t0 = performance.now(), dur = 600;
  const step = now => {
    const p = Math.min(1, (now - t0) / dur), v = Math.round(to * (1 - Math.pow(1 - p, 3)));
    el.textContent = v.toLocaleString('th-TH');
    if (p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
function renderSummary() {
  countUp('sCars', DATA.days.length);
  countUp('sKm', Math.round(DATA.days.reduce((s, d) => s + +d.km, 0)));
  countUp('sStops', DATA.stops.length);
}

function renderList() {
  const q = document.getElementById('q').value.trim().toLowerCase();
  document.getElementById('clr').style.display = q ? 'block' : 'none';
  let rows = DATA.days.filter(d => `${d.reg} ${d.driver} ${d.name}`.toLowerCase().includes(q));
  const cmp = {
    km: (a, b) => b.km - a.km,
    stop: (a, b) => b.stops - a.stops || b.km - a.km,
    start: (a, b) => a.start.localeCompare(b.start),
    miss: (a, b) => missOf(b) - missOf(a) || offOf(b) - offOf(a) || !!b.route - !!a.route,
    reg: (a, b) => a.reg.localeCompare(b.reg, 'th'),
  }[sortBy];
  rows.sort(cmp);

  const el = document.getElementById('list');
  if (!rows.length) { el.innerHTML = `<div class="empty">ไม่พบรถที่ค้นหา "${esc(q)}"</div>`; return; }
  const stCls = d => d.route && d.route.checkinAway ? 'st-bad' : (d.stops || missOf(d) || offOf(d)) ? 'st-warn' : 'st-ok';
  el.innerHTML = rows.map((d, i) => `
    <div class="vrow ${stCls(d)}" style="--i:${Math.min(i, 14)}" onclick="showDetail('${esc(d.reg)}')">
      <div class="plate">${esc(d.reg)}<small>${t(d.start)}–${t(d.end)}</small></div>
      <div class="vinfo">
        <div class="vdrv">${esc(d.driver) || '<span style="color:var(--muted)">ไม่ระบุคนขับ</span>'}</div>
        <div class="vmeta">${fmtKm(d.km)} กม. · ${d.trips} เที่ยว</div>
        <div style="margin-top:3px;display:flex;flex-wrap:wrap;gap:4px">${d.stops ? `<span class="badge badge-stop">จอดเกิน 1 ชม. ${d.stops} จุด</span>` : `<span class="badge badge-ok">ไม่มีจอดนาน</span>`}${routeBadges(d)}</div>
      </div>
      <span class="chev">›</span>
    </div>`).join('');
}
const missOf = d => d.route ? d.route.planned - d.route.visited + (d.route.checkinAway || 0) * 2 : 0;
const offOf = d => d.route ? d.route.off.length : 0;
function routeBadges(d) {
  if (!d.route) return '';
  const r = d.route, miss = r.planned - r.visited;
  return (r.planned ? `<span class="badge ${miss ? 'badge-warn' : 'badge-ok'}">รูท ${r.visited}/${r.planned} ร้าน</span>` : '')
    + (r.checkinAway ? `<span class="badge badge-stop">เช็คอินไม่ตรงรถ ${r.checkinAway}</span>` : '')
    + (r.off.length ? `<span class="badge badge-warn">จอดนอกรูท ${r.off.length}</span>` : '');
}
const kmOrM = m => m >= 1000 ? `${(m / 1000).toFixed(1)} กม.` : `${m} ม.`;
const CI = {
  at: ['ok', '✓', 'รถจอดที่ร้าน'],
  passing: ['off', '!', 'รถขับผ่าน ไม่ได้จอด'],
  moving: ['no', '✕', 'รถกำลังวิ่งอยู่'],
  away: ['no', '✕', 'รถจอดอยู่ที่อื่น'],
  remote: ['mute', '–', 'จดแบบไม่ได้เยี่ยม (เซลล์ระบุเอง)'],
  nodata: ['mute', '?', 'ตรวจไม่ได้ (ร้านไม่มีพิกัด)'],
};
const minTh = m => m == null ? '' : m >= 60 ? `${Math.floor(m / 60)} ชม. ${m % 60} นาที` : `${m} นาที`;

// การ์ดเทียบรูท: แบ่งเป็นแท็บ (เช็คอิน / ร้านในรูท / จอดนอกรูท) + ตัวกรอง + แบ่งหน้าทีละ 10 รายการ
const RC_PAGE = 10;
const CI_FILTERS = [
  ['all', 'ทั้งหมด', null],
  ['at', 'จอดที่ร้าน', ['at']],
  ['away', 'จอดอยู่ที่อื่น', ['away']],
  ['moving', 'รถกำลังวิ่ง', ['moving']],
  ['passing', 'ขับผ่าน ไม่ได้จอด', ['passing']],
  ['remote', 'ไม่ได้เยี่ยม (เซลล์ระบุเอง)', ['remote']],
  ['nodata', 'ตรวจไม่ได้', ['nodata']],
];
const ST_FILTERS = [['all', 'ทั้งหมด'], ['yes', 'ถึง'], ['no', 'ไม่ได้ไป']];
let RC = { d: null, tab: 'ci', filter: 'all', page: 0 };
function routeCard(d) {
  if (!d.route) return `<div class="card"><div class="card-head">เทียบกับรูท</div><div class="card-body tl-sub">${DATA.routeError ? esc(DATA.routeError) : 'ยังไม่ได้กำหนดรูทของรถคันนี้สำหรับวันนี้ (ชีท Rattana Fleet รูทวิ่งรถ)'}</div></div>`;
  RC = { d, tab: d.route.checkins && d.route.checkins.length ? 'ci' : 'stores', filter: 'all', page: 0 };
  return `<div class="card" id="rcCard">${rcBody()}</div>`;
}
function rcSet(k, v) {
  RC[k] = v;
  if (k !== 'page') RC.page = 0;
  if (k === 'tab') RC.filter = 'all';
  const el = document.getElementById('rcCard');
  if (!el) return;
  el.innerHTML = rcBody();
  if (k === 'page') el.scrollIntoView({ block: 'start', behavior: 'smooth' });
}
function chip(key, label, n, on) {
  return `<button class="sort${on ? ' on' : ''}" onclick="rcSet('filter','${key}')"${n === 0 && key !== 'all' ? ' style="opacity:.45"' : ''}>${label} ${n}</button>`;
}
function rcBody() {
  const d = RC.d, r = d.route, ci = r.checkins || [];
  const head = r.kind === 'sales' ? `${esc(r.routes[0].code)} · เซลล์ ${esc(r.reps.join(', '))}` : r.routes.map(x => esc(x.code + (x.name ? ' ' + x.name : ''))).join(' · ');
  const tabs = [];
  if (ci.length) tabs.push(['ci', `เช็คอิน ${ci.length}`]);
  tabs.push(['stores', `ร้านในรูท ${r.visited}/${r.planned}`]);
  tabs.push(['off', `จอดนอกรูท ${r.off.length}`]);

  let filters = '', items = [];

    filters = ST_FILTERS.map(([k, label]) => {

    }).join('');
    items = r.stores.filter(s => RC.filter === 'all' || s.visited === (RC.filter === 'yes')).map(s => `
      <div class="rs">
        <div class="rs-ico ${s.visited ? 'ok' : 'no'}">${s.visited ? '✓' : '✕'}</div>
        <div class="rs-body">
          <div class="rs-name">${s.seq}. ${esc(s.name || '(ไม่มีชื่อในแท็บร้านค้า)')}</div>
          <div class="rs-sub">${esc(s.code)} · ${s.visited ? `ถึง ${t(s.arrive)}${s.leave ? ` ออก ${t(s.leave)} · จอด ${minTh(s.minutes)}` : ' · จุดสุดท้ายของวัน'}` : s.noCoord ? 'ไม่ได้ไป (ร้านนี้ไม่มีพิกัด ตรวจไม่ได้)' : 'ไม่ได้ไป'}</div>
        </div>
        ${s.visited ? `<a class="map-btn" href="${mapUrl(s.coords)}" target="_blank" rel="noopener">📍</a>` : ''}
      </div>`);
  } else {
    items = r.off.map(o => `
      <div class="rs">
        <div class="rs-ico off">!</div>
        <div class="rs-body">
          <div class="rs-name">${esc(cleanPlace(o.place))}</div>
          <div class="rs-sub">${o.code ? 'ร้านลูกค้าที่ไม่อยู่ในรูท' : 'ไม่ใช่ร้านลูกค้า'} · ${t(o.arrive)}–${t(o.leave)} · จอด ${minTh(o.minutes)}</div>
        </div>
        <a class="map-btn" href="${mapUrl(o.coords)}" target="_blank" rel="noopener">📍</a>
      </div>`);
  }

  const pages = Math.max(1, Math.ceil(items.length / RC_PAGE)), pg = Math.min(RC.page, pages - 1);
  const empty = { ci: 'ไม่มีเช็คอินในกลุ่มนี้', stores: 'ไม่มีร้านในกลุ่มนี้', off: 'ไม่มีจอดนอกรูทเกิน 10 นาที' }[RC.tab];
  return `
    <div class="card-head">เทียบกับรูท <span class="badge ${r.planned - r.visited ? 'badge-warn' : 'badge-ok'}">ถึง ${r.visited}/${r.planned} ร้าน</span></div>
    <div class="card-body" style="padding-top:8px">
      <div class="tl-sub">${head}${r.checkinAway ? ` · เช็คอินไม่ตรงกับรถ <b style="color:var(--danger)">${r.checkinAway}</b>` : ''}</div>
      <div class="rc-tabs">${tabs.map(([k, label]) => `<button class="${RC.tab === k ? 'on' : ''}" onclick="rcSet('tab','${k}')">${label}</button>`).join('')}</div>
      ${filters ? `<div class="sort-row" style="margin:8px 0 2px">${filters}</div>` : ''}
      ${items.slice(pg * RC_PAGE, pg * RC_PAGE + RC_PAGE).join('') || `<div class="q-note" style="padding:14px 0">${empty}</div>`}
      ${pages > 1 ? `<div class="pager">
        <button onclick="rcSet('page',${pg - 1})"${pg === 0 ? ' disabled' : ''}>‹ ก่อนหน้า</button>
        <span>หน้า ${pg + 1}/${pages} · ${items.length} รายการ</span>
        <button onclick="rcSet('page',${pg + 1})"${pg >= pages - 1 ? ' disabled' : ''}>ถัดไป ›</button>
      </div>` : ''}
    </div>`;
}

// ---------- แผนที่ (Leaflet + OpenStreetMap) ----------
let fleetMap = null, mapSeq = 0;
function loadLeaflet() {
  if (window.L) return Promise.resolve();
  return new Promise((res, rej) => {
    const css = document.createElement('link'); css.rel = 'stylesheet'; css.href = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css'; document.head.appendChild(css);
    const s = document.createElement('script'); s.src = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
    s.onload = res; s.onerror = () => rej(new Error('โหลดแผนที่ไม่สำเร็จ')); document.head.appendChild(s);
  });
}
const icon = (cls, txt, size) => L.divIcon({ className: '', html: `<div class="mk ${cls}">${txt}</div>`, iconSize: [size, size], iconAnchor: [size / 2, size / 2], popupAnchor: [0, -size / 2] });
const llOf = c => c && (c.latitude ?? c.lat) != null ? [c.latitude ?? c.lat, c.longitude ?? c.lng] : null;
async function drawMap(d) {
  const seq = ++mapSeq, info = document.getElementById('mapInfo');
  try {
    await loadLeaflet();
    let track = { points: [], stops: [] };
    if (!DEMO) track = await api('track', { date: DATA.date || curDate, reg: d.reg });
    if (seq !== mapSeq || !document.getElementById('fleetMap')) return;   // เปลี่ยนรถไประหว่างรอ
    if (fleetMap) { fleetMap.remove(); fleetMap = null; }
    fleetMap = L.map('fleetMap', { zoomControl: true, attributionControl: true });
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap' }).addTo(fleetMap);
    const bounds = [];
    if (track.points.length > 1) {
      const line = track.points.map(p => [p[0], p[1]]);
      L.polyline(line, { color: '#3d3d3d', weight: 4, opacity: .85 }).addTo(fleetMap);
      bounds.push(...line);
    }
    const labeled = [];   // หมุดที่มีชื่อร้าน ไว้เปิด/ปิดป้ายชื่อทั้งหมดทีเดียว
    // ร้านในรูท (ปักก่อน ให้อยู่ใต้หมุดจุดจอด)
    (d.route ? d.route.stores : []).forEach(s => {
      const p = llOf(s.store); if (!p) return;
      const m = L.marker(p, { icon: icon(s.visited ? 'mk-ok' : 'mk-miss', '', 14), zIndexOffset: -100 }).addTo(fleetMap)
        .bindPopup(`<b>${esc(s.name || s.code)}</b><br>รหัส ${esc(s.code)} · ลำดับ ${s.seq}<br>${s.visited ? `✓ ถึง ${t(s.arrive)}${s.leave ? ' ออก ' + t(s.leave) : ''}` : '✕ ไม่ได้ไป'}`);
      labeled.push([m, s.name || s.code, s.visited ? 'lb-ok' : 'lb-miss']);
      bounds.push(p);
    });
    // ร้านที่ส่ง/เช็คอินที่จุดจอดแต่ละจุด: ร้านในรูทที่ถึงตอนจุดนั้น + เช็คอินในช่วงเวลาที่จอด
    const namesAt = s => {
      const a = toMin(s.arrive) - 5, l = (s.leave ? toMin(s.leave) : 24 * 60) + 5, out = [];
      (d.route ? d.route.stores : []).forEach(x => { if (x.visited && x.arrive === s.arrive) out.push(x.name || x.code); });
      (d.route && d.route.checkins || []).forEach(c => { const m = toMin(c.tin); if (m >= a && m <= l && c.status !== 'remote') out.push(c.name || c.code); });
      return [...new Set(out)];
    };
    const start = llOf(d.startCoords);
    if (start) { L.marker(start, { icon: icon('mk-start', 'S', 26), zIndexOffset: 500 }).addTo(fleetMap).bindPopup(`<b>ออกรถ ${t(d.start)}</b><br>${esc(cleanPlace(d.startPlace))}`); bounds.push(start); }
    const stopsList = DEMO ? (stopsByReg[d.reg] || []).map(s => ({ arrive: s.arrive, leave: s.leave, minutes: toMinutes(s.duration), place: s.place, coords: s.coords })) : track.stops;
    stopsList.forEach((s, i) => {
      const p = llOf(s.coords); if (!p) return;
      const last = !s.leave, names = namesAt(s), place = cleanPlace(s.place);
      const cls = last ? 'mk-end' : 'mk-stop' + (s.minutes >= 60 ? ' mk-long' : '');
      const endLabel = track.live ? 'จอดล่าสุด' : 'จบวัน';   // วันนี้ วันยังไม่จบ
      const m = L.marker(p, { icon: icon(cls, last ? 'E' : i + 1, last ? 26 : 24), zIndexOffset: 400 + i }).addTo(fleetMap)
        .bindPopup(`<b>${last ? endLabel : 'จุดที่ ' + (i + 1)} · ${t(s.arrive)}${s.leave ? '–' + t(s.leave) : ''}</b>${s.minutes != null ? ` · จอด ${minTh(s.minutes)}` : ''}`
          + (names.length ? `<br>🏪 <b>${names.map(esc).join('<br>🏪 ')}</b>` : '')
          + `<br><span style="color:#6b7896">${esc(place)}</span><br><a href="${mapUrl(s.coords)}" target="_blank" rel="noopener">เปิดใน Google Maps</a>`);
      // ป้ายชื่อของจุดจอด: ชื่อร้าน ถ้าไม่มีใช้ชื่อสถานที่จาก Cartrack (เช่น บริษัทรัตน W1)
      const lb = names.length ? names[0] + (names.length > 1 ? ` +${names.length - 1}` : '') : (/^บริษัทรัตน|^\d+#/.test(s.place || '') ? place : '');
      if (lb) labeled.push([m, lb, 'lb-stop']);
      bounds.push(p);
    });
    // ตำแหน่งตอนนี้ (เฉพาะวันนี้)
    const lv = track.live;
    if (lv) {
      const p = [lv.lat, lv.lng], moving = lv.speed > 3;
      const state = moving ? `กำลังวิ่ง ${lv.speed} กม./ชม.` : lv.ignition ? 'จอดติดเครื่อง' : 'ดับเครื่องจอดอยู่';
      L.marker(p, { icon: icon('mk-live' + (moving ? ' moving' : ''), '🚚', 34), zIndexOffset: 1000 }).addTo(fleetMap)
        .bindPopup(`<b>📍 ตำแหน่งตอนนี้ · ${t(String(lv.ts).slice(11, 16))} น.</b><br>${state}<br><span style="color:#6b7896">${esc(lv.place)}</span><br><a href="${mapUrl({ latitude: lv.lat, longitude: lv.lng })}" target="_blank" rel="noopener">เปิดใน Google Maps</a>`);
      bounds.push(p);
    }
    // ปุ่มเปิด/ปิดป้ายชื่อร้าน: โชว์เฉพาะตอนซูมใกล้พอ (จอมือถือเล็ก ป้ายจะได้ไม่ทับกัน)
    const LABEL_ZOOM = 14;
    let labelsOn = false, labelsShown = false, hint = null;
    const syncLabels = () => {
      const want = labelsOn && fleetMap.getZoom() >= LABEL_ZOOM;
      if (hint) hint.style.display = labelsOn && !want ? '' : 'none';
      if (want === labelsShown) return;
      labelsShown = want;
      labeled.forEach(([mk, txt, cls]) => {
        if (want) mk.bindTooltip(esc(txt), { permanent: true, direction: 'top', offset: [0, -9], className: 'lb ' + cls }).openTooltip();
        else mk.unbindTooltip();
      });
    };
    const Toggle = L.Control.extend({
      onAdd() {
        const box = L.DomUtil.create('div', 'map-tools');
        const b = L.DomUtil.create('button', 'map-toggle', box);
        b.textContent = '🏷 ชื่อร้าน';
        hint = L.DomUtil.create('div', 'map-hint', box);
        hint.textContent = 'ซูมเข้าเพื่อดูชื่อ';
        hint.style.display = 'none';
        L.DomEvent.disableClickPropagation(box);
        b.onclick = () => {
          labelsOn = b.classList.toggle('on');
          if (labelsOn && fleetMap.getZoom() < LABEL_ZOOM && labeled.length < 12) fleetMap.setZoom(LABEL_ZOOM);
          syncLabels();
        };
        return box;
      },
    });
    if (labeled.length) { new Toggle({ position: 'topright' }).addTo(fleetMap); fleetMap.on('zoomend', syncLabels); }
    if (bounds.length) fleetMap.fitBounds(bounds, { padding: [24, 24], maxZoom: 16 }); else fleetMap.setView([13.5, 100], 9);
    setTimeout(() => fleetMap && fleetMap.invalidateSize(), 50);
    info.textContent = DEMO ? 'โหมดตัวอย่าง: ไม่มีเส้นทาง GPS' : `${stopsList.length} จุดจอด · ${track.points.length.toLocaleString('th-TH')} จุด GPS`
      + (lv ? ` · สด ${t(String(lv.ts).slice(11, 16))} น.` : '');
    const lg = document.getElementById('legendEnd'), lgLive = document.getElementById('legendLive');
    if (lg) lg.textContent = lv ? 'จอดล่าสุด' : 'จบวัน';
    if (lgLive) lgLive.style.display = lv ? '' : 'none';
  } catch (e) {
    if (seq === mapSeq && info) info.textContent = 'โหลดแผนที่ไม่สำเร็จ: ' + e.message;
  }
}
const toMinutes = s => { const [h, m] = String(s || '0:0').split(':'); return +h * 60 + +m; };

function showList() {
  showScreen('list');
  if (location.hash) history.pushState({}, '', location.pathname + location.search);
}
window.addEventListener('popstate', () => {
  const reg = decodeURIComponent(location.hash.slice(1));
  if (reg === 'quality') showQuality(false, true);
  else if (reg && DATA.days.some(d => d.reg === reg)) showDetail(reg, true);
  else if (document.getElementById('loginView').classList.contains('hidden')) showScreen('list');
});

// ---------- หน้า 3: ตรวจคุณภาพข้อมูล ----------
let QDATA = null, qShow = { mis: 30, far: 30 };
async function showQuality(refresh, noPush) {
  showScreen('quality');
  window.scrollTo(0, 0);
  if (!noPush) history.pushState({ q: 1 }, '', location.search + '#quality');
  const el = document.getElementById('quality');
  if (DEMO) { el.innerHTML = '<div class="empty">หน้านี้ใช้ได้เฉพาะข้อมูลจริง (โหมดตัวอย่างไม่มีข้อมูลเช็คอิน)</div>'; return; }
  if (!refresh && QDATA && QDATA.date === curDate) { renderQuality(); return; }
  el.innerHTML = '<div class="spin-wrap"><div class="spinner-ring"></div>กำลังรวบรวมข้อมูล…</div>';
  const want = curDate;
  try {
    const q = await api('quality', { date: want });
    if (want !== curDate) return;
    QDATA = q; qShow = { mis: 30, far: 30 };
    renderQuality();
  } catch (e) {
    if (e.code !== 'AUTH' && e.code !== 'NO_USER') el.innerHTML = `<div class="empty">ดึงข้อมูลไม่สำเร็จ<br><small>${esc(e.message)}</small></div>`;
  }
}
const pct = (a, b) => b ? Math.round(100 * a / b) + '%' : '-';
function renderQuality() {
  const q = QDATA, c = q.checkin, T = c.totals, bad = (T.passing || 0) + (T.moving || 0) + (T.away || 0), judged = (T.at || 0) + bad;
  const html = [];
  html.push(`<div class="updated">${formatThaiDate(q.date)}${q.isToday ? ' · วันยังไม่จบ ตัวเลขยังเปลี่ยนได้' : ''}</div>`);
  if (q.routeError) html.push(`<div class="warn">⚠️ ${esc(q.routeError)}</div>`);

  // 1) สรุปเช็คอิน
  html.push(`<div class="card card-gold"><div class="card-head">เช็คอินของเซลล์ เทียบตำแหน่งรถ</div><div class="card-body">
    <div class="stat-grid" style="margin-bottom:6px">
      <div class="stat-card"><div class="s-label">ตรวจได้</div><div class="s-value">${judged}</div><div class="s-sub">จาก ${T.checkins} ครั้ง</div></div>
      <div class="stat-card success"><div class="s-label">รถอยู่ที่ร้าน</div><div class="s-value">${pct(T.at || 0, judged)}</div><div class="s-sub">${T.at || 0} ครั้ง</div></div>
      <div class="stat-card danger"><div class="s-label">ไม่ตรง</div><div class="s-value">${pct(bad, judged)}</div><div class="s-sub">${bad} ครั้ง</div></div>
    </div>
    <div class="q-note">ไม่ตรง = ขับผ่าน ${T.passing || 0} · รถกำลังวิ่ง ${T.moving || 0} · จอดที่อื่น ${T.away || 0}<br>
      ไม่นับ: จดแบบไม่ได้เยี่ยม ${T.remote || 0} · ร้านไม่มีพิกัด ${T.nodata || 0}<br>
      เกณฑ์: รถอยู่ห่างร้านไม่เกิน ${c.nearMeters} ม. และเคยจอดนิ่งในช่วง ±${c.slackMin} นาทีจากเวลาเช็คอิน</div>
    ${c.vehicles.length ? `<table class="q-tbl" style="margin-top:10px"><tr><th>รถ / เซลล์</th><th class="n">รูท</th><th class="n">เช็คอิน</th><th class="n">ไม่ตรง</th></tr>
      ${c.vehicles.map(v => `<tr class="click" onclick="openFromQuality('${esc(v.reg)}')"><td><b>${esc(v.reg)}</b><br><span class="tl-sub">${esc(v.reps.join(', '))}</span></td>
        <td class="n">${v.planned ? `${v.visited}/${v.planned}` : '-'}</td><td class="n">${v.at}/${v.at + v.bad}</td>
        <td class="n" style="color:${v.bad ? 'var(--danger)' : 'var(--ok-text)'};font-weight:700">${v.bad}</td></tr>`).join('')}</table>` : '<div class="q-note">ไม่มีรถเซลล์ที่มีรูทในวันนี้</div>'}
  </div></div>`);

  // 2) รายการไม่ตรง ไว้สุ่มตรวจ
  const mis = c.mismatches;
  html.push(`<div class="card"><div class="card-head">เช็คอินที่ไม่ตรง ${mis.length} ครั้ง <span class="tl-sub" style="font-weight:500">สุ่มตรวจ</span></div><div class="card-body">
    <div class="q-note" style="margin:0 0 6px">กด 🚚 ดูว่ารถอยู่ตรงไหนตอนเช็คอิน · 🏪 ดูพิกัดร้านในชีท ถ้าสองจุดอยู่ใกล้กันมาก พิกัดร้านอาจผิด</div>
    ${mis.slice(0, qShow.mis).map(m => { const [cls, ico, label] = CI[m.status] || CI.nodata; return `<div class="rs">
      <div class="rs-ico ${cls}">${ico}</div>
      <div class="rs-body"><div class="rs-name">${t(m.tin)} · ${esc(m.name || m.code)}</div>
        <div class="rs-sub">${esc(m.reg)} · ${esc(m.rep)} · ${label}${m.meters != null ? ' ห่าง ' + kmOrM(m.meters) : ''}${m.speed > 5 ? ` · ${m.speed} กม./ชม.` : ''}</div></div>
      <div style="display:flex;gap:4px">${m.coords ? `<a class="map-btn" href="${mapUrl(m.coords)}" target="_blank" rel="noopener" title="ตำแหน่งรถ">🚚</a>` : ''}${m.store ? `<a class="map-btn" href="https://www.google.com/maps?q=${m.store.lat},${m.store.lng}" target="_blank" rel="noopener" title="พิกัดร้าน">🏪</a>` : ''}</div>
    </div>`; }).join('') || '<div class="q-note">ไม่มี 🎉</div>'}
    ${mis.length > qShow.mis ? `<button class="q-more" onclick="qShow.mis+=50;renderQuality()">ดูเพิ่ม (${mis.length - qShow.mis})</button>` : ''}
    ${mis.length ? `<div class="q-btns"><button class="sort" onclick="exportMismatch()">⬇ ส่งออก CSV</button></div>` : ''}
  </div></div>`);

  // 3) พิกัดร้านไม่ตรงกัน
  const g = q.coord;
  html.push(`<div class="card"><div class="card-head">พิกัดร้านในชีทกับ Cartrack ไม่ตรงกัน <span class="badge ${g.far.length ? 'badge-warn' : 'badge-ok'}">${g.far.length} ร้าน</span></div><div class="card-body">
    <div class="q-note" style="margin:0 0 6px">ร้านในรูทเซลล์ ${g.stores.toLocaleString('th-TH')} ร้าน · เทียบได้ ${g.compared.toLocaleString('th-TH')} ร้าน · ห่างกันเกิน ${g.threshold} ม. ${g.far.length} ร้าน (แก้ที่ชีท Customer คอลัมน์ Location หรือใน Cartrack ให้ตรงกับร้านจริง)</div>
    ${g.far.slice(0, qShow.far).map(f => `<div class="rs">
      <div class="rs-ico off">!</div>
      <div class="rs-body"><div class="rs-name">${esc(f.name)}</div><div class="rs-sub">${esc(f.code)} · ${esc(f.rep)} · ห่างกัน ${kmOrM(f.meters)}</div></div>
      <div style="display:flex;gap:4px"><a class="map-btn" href="https://www.google.com/maps?q=${f.sheet.lat},${f.sheet.lng}" target="_blank" rel="noopener" title="พิกัดในชีท">ชีท</a><a class="map-btn" href="https://www.google.com/maps?q=${f.cartrack.lat},${f.cartrack.lng}" target="_blank" rel="noopener" title="พิกัดใน Cartrack">CT</a></div>
    </div>`).join('')}
    ${g.far.length > qShow.far ? `<button class="q-more" onclick="qShow.far+=50;renderQuality()">ดูเพิ่ม (${g.far.length - qShow.far})</button>` : ''}
    ${g.far.length ? `<div class="q-btns"><button class="sort" onclick="exportFar()">⬇ ส่งออก CSV</button></div>` : ''}
  </div></div>`);

  // 4) ร้านที่ไม่มีพิกัด
  html.push(`<div class="card"><div class="card-head">ร้านที่ตรวจไม่ได้ เพราะไม่มีพิกัด</div><div class="card-body">
    <div class="kv"><span>ไม่มี Location ในชีท Customer</span><span><b>${g.noLoc.length}</b> ร้าน</span></div>
    <div class="kv"><span>ยังไม่มีขอบเขตร้าน (geofence) ใน Cartrack</span><span><b>${g.noGeo.length}</b> ร้าน</span></div>
    <div class="q-note">ร้านที่ไม่มี Location ในชีทจะตรวจเช็คอินไม่ได้เลย ส่วนร้านที่ไม่มีใน Cartrack ยังตรวจได้จากพิกัดในชีท แต่ถ้าพิกัดในชีทผิด ระบบจะไม่มีอะไรไว้เทียบ</div>
    <div class="q-btns"><button class="sort" onclick="exportNoLoc()">⬇ ไม่มีพิกัดในชีท (CSV)</button><button class="sort" onclick="exportNoGeo()">⬇ ไม่มีใน Cartrack (CSV)</button></div>
  </div></div>`);
  document.getElementById('quality').innerHTML = html.join('');
}
function openFromQuality(reg) {
  if (DATA.date === QDATA.date && DATA.days.some(d => d.reg === reg)) showDetail(reg);
}
function downloadCsv(name, header, rows) {
  const e = v => { const s = String(v ?? ''); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const body = '﻿' + [header, ...rows].map(r => r.map(e).join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([body], { type: 'text/csv;charset=utf-8' }));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
}
const ll = p => p ? `${p.lat ?? p.latitude},${p.lng ?? p.longitude}` : '';
function exportMismatch() {
  downloadCsv(`เช็คอินไม่ตรง_${QDATA.date}.csv`, ['วันที่', 'เวลาเช็คอิน', 'ทะเบียน', 'เซลล์', 'รหัสร้าน', 'ชื่อร้าน', 'ผล', 'ห่างร้าน (ม.)', 'ความเร็วรถ', 'ตำแหน่งรถ', 'พิกัดร้าน'],
    QDATA.checkin.mismatches.map(m => [QDATA.date, m.tin, m.reg, m.rep, m.code, m.name, (CI[m.status] || [])[2], m.meters, m.speed, ll(m.coords), ll(m.store)]));
}
function exportFar() {
  downloadCsv(`พิกัดร้านไม่ตรงกัน_${QDATA.date}.csv`, ['รหัสร้าน', 'ชื่อร้าน', 'เซลล์ผู้ดูแล', 'ห่างกัน (ม.)', 'พิกัดในชีท', 'พิกัดใน Cartrack'],
    QDATA.coord.far.map(f => [f.code, f.name, f.rep, f.meters, ll(f.sheet), ll(f.cartrack)]));
}
function exportNoLoc() {
  downloadCsv('ร้านไม่มีพิกัดในชีท.csv', ['รหัสร้าน', 'ชื่อร้าน', 'เซลล์ผู้ดูแล', 'มีใน Cartrack'], QDATA.coord.noLoc.map(f => [f.code, f.name, f.rep, f.inCartrack ? 'มี' : 'ไม่มี']));
}
function exportNoGeo() {
  downloadCsv('ร้านไม่มีใน Cartrack.csv', ['รหัสร้าน', 'ชื่อร้าน', 'เซลล์ผู้ดูแล'], QDATA.coord.noGeo.map(f => [f.code, f.name, f.rep]));
}

const toMin = s => { const [h, m] = s.split(':'); return +h * 60 + +m; };
const minTxt = m => `${Math.floor(m / 60)} ชม. ${m % 60} นาที`;
const spanTime = (a, b) => minTxt(toMin(b) - toMin(a));
const totalStop = st => minTxt(st.reduce((s, x) => s + toMin(x.duration), 0));
const coordTxt = c => c ? `${c.latitude.toFixed(5)}, ${c.longitude.toFixed(5)}` : '-';

// ---------- อื่นๆ ----------
function clearSearch() { const q = document.getElementById('q'); q.value = ''; renderList(); q.focus(); }
function showToast(msg) {
  const el = document.createElement('div'); el.className = 'toast'; el.textContent = msg;
  document.body.appendChild(el); setTimeout(() => el.remove(), 2500);
}

const THEME_KEY = 'rattana_theme';
function applyTheme(th) {
  document.body.classList.toggle('dark', th === 'dark');
  document.getElementById('themeBtn').textContent = th === 'dark' ? '☀️' : '🌙';
}
function toggleTheme() {
  const next = document.body.classList.contains('dark') ? 'light' : 'dark';
  try { localStorage.setItem(THEME_KEY, next); } catch {}
  applyTheme(next);
}
try { applyTheme(localStorage.getItem(THEME_KEY) || 'light'); } catch { applyTheme('light'); }

window.addEventListener('scroll', () => document.getElementById('backToTop').classList.toggle('show', window.scrollY > 300));
document.getElementById('q').addEventListener('input', renderList);
document.querySelectorAll('.sort').forEach(b => b.onclick = () => {
  document.querySelectorAll('.sort').forEach(x => x.classList.remove('on'));
  b.classList.add('on'); sortBy = b.dataset.s; renderList();
});

// ---------- เอฟเฟคกด: วงกระเพื่อมตรงจุดที่นิ้วแตะ + สั่นเบาๆ (Android) ----------
const FX_SEL = '.vrow,.q-link,.sort,.chip,.rc-tabs button,.pager button,.map-btn,.icon-btn,.back-btn,.hub-btn,.map-toggle';
document.addEventListener('pointerdown', e => {
  const el = e.target.closest(FX_SEL);
  if (!el || el.disabled) return;
  el.classList.add('fx');
  const r = el.getBoundingClientRect(), size = Math.max(r.width, r.height);
  const s = document.createElement('span');
  s.className = 'ripple';
  s.style.cssText = `width:${size}px;height:${size}px;left:${e.clientX - r.left - size / 2}px;top:${e.clientY - r.top - size / 2}px`;
  el.appendChild(s);
  setTimeout(() => s.remove(), 600);
  if (el.classList.contains('vrow') && navigator.vibrate) { try { navigator.vibrate(8); } catch (_) {} }
}, { passive: true });

// ---------- เริ่มแอป ----------
(function init() {
  const qd = new URLSearchParams(location.search).get('date');
  curDate = DEMO ? '2026-10-28' : (qd && /^\d{4}-\d{2}-\d{2}$/.test(qd) && qd <= bkkToday() ? qd : bkkToday());
  if (!DEMO && !getIdToken()) { showLogin(); return; }
  showScreen('list');
  loadDay(false);
})();
</script>
