<!-- ══════════════════════════════════════════════════════════════════════════
     RK-BASE · Rattana UI Kit
     วางไว้ใน <head> "ก่อน" CSS อื่นของแอป (ให้ CSS แอปทับได้ถ้าต้องการ)
     ให้: บันได z-index กลาง · helper "บรรทัดเดียว" · sticky พื้นทึบ · RK.audit()
     กฎอ้างอิง: CLAUDE.md § UI Build Standards ข้อ 1️⃣ + 6️⃣
     ══════════════════════════════════════════════════════════════════════════ -->
<style id="rk-base">
:root{
  /* ── บันได z-index กลาง — ใช้ตัวแปรเท่านั้น ห้ามใส่เลขมั่วรายจุด ── */
  --rk-z-sticky-sub: 90;    /* แถบ tab / ฟิลเตอร์รอง (ชั้นที่ 2 ลงมา) */
  --rk-z-sticky:     100;   /* header หลัก */
  --rk-z-dropdown:   1000;  /* dropdown / popover / เมนู */
  --rk-z-modal:      2000;  /* modal / bottom sheet / scanner */
  --rk-z-toast:      3000;  /* toast / snackbar */

  --rk-navy:#0d1b3e; --rk-gold:#c9a84c;
  --rk-surface:   var(--card-bg, #ffffff);
  --rk-surface-2: var(--bg, #f1f5f9);
  --rk-text:      var(--text, #0f172a);
  --rk-muted:     var(--muted, #64748b);
  --rk-line:      var(--border, #e2e8f0);
  --rk-radius: 12px;

  --rk-hdr-h: 56px;   /* ⚠️ ตั้งให้ตรงความสูง header จริงของแอป — sticky ชั้น 2 ใช้ค่านี้เป็น top */
}

/* ── ข้อ 1️⃣ บรรทัดเดียว (ใช้ได้ทุกที่: label · การ์ด · ตัวเลือก) ── */
.rk-1line{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rk-row{display:flex;align-items:center;gap:8px;min-width:0}
.rk-row>*{min-width:0}                    /* ❗ ขาดบรรทัดนี้ ellipsis ใน flex จะไม่ทำงาน */
.rk-grow{flex:1 1 auto;min-width:0}
.rk-nogrow{flex:0 0 auto}
.rk-scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:thin}

/* ── ข้อ 6️⃣ sticky ที่ "พื้นทึบ + ไม่ทับ dropdown" ── */
.rk-sticky{
  position:sticky; top:0; z-index:var(--rk-z-sticky);
  background:var(--rk-surface);                       /* ทึบ 100% ห้าม transparent/rgba */
  padding-top:env(safe-area-inset-top);
  box-shadow:0 1px 0 var(--rk-line);
}
.rk-sticky-sub{
  position:sticky; top:var(--rk-hdr-h); z-index:var(--rk-z-sticky-sub);
  background:var(--rk-surface-2);
  box-shadow:0 1px 0 var(--rk-line);
}
.rk-sticky-bottom{
  position:sticky; bottom:0; z-index:var(--rk-z-sticky-sub);
  background:var(--rk-surface);
  padding-bottom:env(safe-area-inset-bottom);
  box-shadow:0 -1px 0 var(--rk-line);
}
/* ❗ ห้าม overflow:hidden / auto บน parent ของ sticky หรือของ dropdown — จะตัด popup ขาด */
</style>

<script id="rk-base-js">
window.RK = window.RK || {};

/* ── helper ── */
RK.esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
RK.num = v => { const n = parseFloat(String(v==null?'':v).replace(/,/g,'')); return isFinite(n) ? n : 0; };
RK.debounce = (fn, ms=120) => { let t; return function(){ clearTimeout(t); const a=arguments, s=this; t=setTimeout(()=>fn.apply(s,a), ms); }; };

/* ── ย่อตัวเลขให้อยู่ในบรรทัดเดียว (ข้อ 1️⃣) ── */
RK.shortNum = n => {
  n = RK.num(n); const a = Math.abs(n);
  if (a >= 1e9) return (n/1e9).toFixed(a>=1e10?0:1).replace(/\.0$/,'') + 'B';
  if (a >= 1e6) return (n/1e6).toFixed(a>=1e7?0:1).replace(/\.0$/,'') + 'M';
  if (a >= 1e4) return (n/1e3).toFixed(0) + 'K';
  return n.toLocaleString('th-TH', {maximumFractionDigits:0});
};

/* ══════════════════════════════════════════════════════════════════════════
   RK.audit() — เรียกใน console ก่อน push (ผูกกับ Pre-Deploy Bug Check ข้อ 5-7)
   ตรวจ 3 อย่างบนหน้าที่เปิดอยู่จริง:
     1. sticky/fixed ที่พื้นหลังใส  → เนื้อหาวิ่งทะลุ
     2. parent ที่ overflow ตัด dropdown / z-index ต่ำกว่า sticky ตัวอื่น
     3. ข้อความที่ตกมากกว่า 1 บรรทัดที่ความกว้างจอปัจจุบัน (ย่อจอเป็น 375px ก่อนเรียก)
   ══════════════════════════════════════════════════════════════════════════ */
RK.audit = function(opts){
  opts = opts || {};
  const oneLineSel = opts.oneLineSel || 'button,label,option,.chip,.tab,.badge,.pill,th,.rk-1line,[data-1line]';
  const out = {transparentSticky:[], clipRisk:[], wrapped:[], zTop:[]};
  const own = el => el.closest('#rkScan,.rk-dd,.rk-dd-backdrop');     /* ตัว kit เอง — ไม่ต้องเตือน */
  const alpha0 = c => {
    if (!c || c === 'transparent') return true;
    const m = /rgba?\(([^)]+)\)/.exec(c); if (!m) return false;
    const p = m[1].split(','); return p.length > 3 && parseFloat(p[3]) < 0.9;
  };
  /* นับบรรทัดจริงของ "ข้อความในตัวมันเอง" (ไม่นับลูกที่เป็น element) — padding ไม่หลอก */
  const lineCount = el => {
    const rng = document.createRange(); let n = 0;
    el.childNodes.forEach(nd => {
      if (nd.nodeType === 3 && nd.textContent.trim()){
        rng.selectNodeContents(nd);
        n = Math.max(n, rng.getClientRects().length);
      }
    });
    return n;
  };

  document.querySelectorAll('*').forEach(el=>{
    if (own(el)) return;
    const cs = getComputedStyle(el);
    if (cs.position==='sticky' || cs.position==='fixed'){
      if (alpha0(cs.backgroundColor) && !(cs.backdropFilter||'').includes('blur'))
        out.transparentSticky.push({el, bg:cs.backgroundColor, z:cs.zIndex});
      if (cs.position==='sticky' && cs.zIndex!=='auto' && +cs.zIndex >= 1000)
        out.zTop.push({el, z:cs.zIndex});   /* sticky ที่สูงถึงชั้น dropdown → จะไปทับเมนู */
    }
  });

  document.querySelectorAll('[data-rk-menu-anchor],.rk-dd-btn,select').forEach(el=>{
    if (own(el)) return;
    let p = el.parentElement;
    while (p && p!==document.body){
      const cs = getComputedStyle(p);
      if (/hidden|auto|scroll/.test(cs.overflow + cs.overflowX + cs.overflowY) && cs.position!=='static')
        { out.clipRisk.push({trigger:el, clippedBy:p}); break; }
      p = p.parentElement;
    }
  });

  document.querySelectorAll(oneLineSel).forEach(el=>{
    if (own(el) || !el.offsetParent || !el.textContent.trim()) return;
    const n = lineCount(el);
    if (n > 1) out.wrapped.push({el, lines:n, text:el.textContent.trim().slice(0,40)});
  });

  console.group('%cRK.audit @ ' + window.innerWidth + 'px', 'font-weight:700');
  console.log('❌ sticky พื้นใส:', out.transparentSticky.length, out.transparentSticky);
  console.log('⚠️ dropdown เสี่ยงโดนตัด/ทับ:', out.clipRisk.length, out.clipRisk);
  console.log('⚠️ sticky z-index ≥1000 (ทับ dropdown):', out.zTop.length, out.zTop);
  console.log('❌ ตกบรรทัด (>1 บรรทัด):', out.wrapped.length, out.wrapped);
  console.groupEnd();
  return out;
};
</script>

<style>
/* v1.1 (Surat 23/10: "ทำให้สวย เข้ากับ iOS 27 และ responsive")
   โลก iOS: พื้น grouped (เทาอ่อน) · การ์ดกลุ่มมุม 20 · เส้นคั่นบาง inset · ตัวเลขชิดขวาแบบตาราง (tabular)
   แบรนด์อยู่ที่ navy + ทองของรัตน (ปุ่มที่เลือก · ตัวเลขยอด) · จอกว้าง ≥ 1024 = แถบรายชื่อผู้สั่งซ้าย (split view) */
:root{
  --navy:#0d1b3e; --navy-2:#16295a; --gold:#c9a84c; --gold-hi:#e6c768; --gold-soft:#fbf3dc;
  --bg:#f2f2f7; --surface:#ffffff; --surface-2:#f7f7fa; --fill:rgba(118,118,128,.12); --fill-2:rgba(118,118,128,.20);
  --sep:rgba(60,60,67,.16); --text:#11131a; --muted:#5d6272; --muted-2:#8a8f9c;
  --bar:#f6f6f9; --bar-line:rgba(60,60,67,.18);
  --sel:#0d1b3e; --sel-text:#ffffff; --sel-num:#f4e3a6;
  --val:#c2372c; --val-pos:#0f7a3d;
  --w1:#FBBF24; --w2:#0EA5E9; --w3:#EF4444; --w4:#15803D; --c4:#4ADE80; --hq:#C9A84C;
  --fs-xs:12px; --fs-sm:13px; --fs-md:15px; --fs-lg:17px; --fs-xl:22px; --fs-title:30px;
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px; --sp-6:28px; --pad-card:14px; --gap-list:14px; --side-w:300px;
  --r-sm:8px; --r-md:12px; --r-lg:20px; --r-pill:999px;
  --hdr-h:56px; --rk-hdr-h:56px;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 6px 20px rgba(16,24,40,.06);
  --card-bg:var(--surface); --border:var(--sep); --rk-surface-2:var(--surface-2);
}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#1c1c1e; --surface-2:#2c2c2e; --fill:rgba(118,118,128,.24); --fill-2:rgba(118,118,128,.36);
  --sep:rgba(84,84,88,.6); --text:#f5f5f7; --muted:#aeb1ba; --muted-2:#8c8f99; --bar:#121214; --bar-line:rgba(84,84,88,.7);
  --sel:#e6c768; --sel-text:#0d1b3e; --sel-num:#0d1b3e; --gold-soft:#2a2414; --val:#ff6b5e; --shadow:none;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#000000; --surface:#1c1c1e; --surface-2:#2c2c2e; --fill:rgba(118,118,128,.24); --fill-2:rgba(118,118,128,.36);
  --sep:rgba(84,84,88,.6); --text:#f5f5f7; --muted:#aeb1ba; --muted-2:#8c8f99; --bar:#121214; --bar-line:rgba(84,84,88,.7);
  --sel:#e6c768; --sel-text:#0d1b3e; --sel-num:#0d1b3e; --gold-soft:#2a2414; --val:#ff6b5e; --shadow:none;
}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:400 var(--fs-md)/1.45 "Noto Sans Thai",-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
::selection{background:var(--gold-hi);color:var(--navy)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:var(--r-sm)}
.one{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
svg.ic{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* login */
#login{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:var(--sp-4);background:var(--navy)}
.lg{width:100%;max-width:360px;background:var(--surface);border-radius:var(--r-lg);padding:var(--sp-6) var(--sp-5);text-align:center}
.lg h1{margin:var(--sp-3) 0 0;font-size:var(--fs-xl)}
.lg p{margin:var(--sp-1) 0 var(--sp-5);color:var(--muted);font-size:var(--fs-sm)}
.lg .g{display:flex;justify-content:center;min-height:44px}
#lgMsg{margin-top:var(--sp-3);font-size:var(--fs-sm);color:var(--muted)}
#lgErr{margin-top:var(--sp-3);font-size:var(--fs-sm);color:var(--val)}
.lg .ver{margin-top:var(--sp-5);font-size:var(--fs-xs);color:var(--muted-2)}

/* แถบบน (ทึบ 100% ทั้งสว่าง/มืด) */
.hd{position:sticky;top:0;z-index:var(--rk-z-sticky);background:var(--bar);border-bottom:.5px solid var(--bar-line);
  padding:env(safe-area-inset-top) var(--sp-4) 0;height:calc(var(--hdr-h) + env(safe-area-inset-top));display:flex;align-items:center;gap:var(--sp-3)}
.hd .tt{flex:1;min-width:0;display:flex;align-items:baseline;gap:var(--sp-2)}
.hd .tt b{font-size:var(--fs-xl);font-weight:700;letter-spacing:-.01em}
.hd .tt span{font-size:var(--fs-xs);color:var(--muted)}
.me{flex:none;width:34px;height:34px;border-radius:50%;border:0;background:var(--fill);color:var(--text);font-weight:700;cursor:pointer}
.hub{flex:none;display:inline-flex;align-items:center;gap:4px;height:34px;background:var(--gold);color:var(--navy);border-radius:var(--r-pill);padding:0 14px;font-size:var(--fs-sm);font-weight:700;text-decoration:none}
.hub svg{width:14px;height:14px}

/* โครงหน้า */
.shell{display:block}
.side{display:none}
.main{min-width:0}
@media (min-width:1024px){
  .shell{display:grid;grid-template-columns:var(--side-w) minmax(0,1fr);align-items:start}
  .side{display:block;position:sticky;top:calc(var(--hdr-h) + env(safe-area-inset-top));height:calc(100dvh - var(--hdr-h) - env(safe-area-inset-top));
    overflow:auto;padding:var(--sp-4) var(--sp-3) var(--sp-6);border-right:.5px solid var(--sep);background:var(--bg)}
  .ctl .whoRow{display:none}
}

/* แถบควบคุม (sticky ชั้น 2 · ทึบ) */
.ctl{position:sticky;top:calc(var(--hdr-h) + env(safe-area-inset-top));z-index:var(--rk-z-sticky-sub);background:var(--bar);
  border-bottom:.5px solid var(--bar-line);padding:var(--sp-2) var(--sp-4) var(--sp-3);display:flex;flex-direction:column;gap:var(--sp-2)}
.row{display:flex;gap:var(--sp-2);align-items:center;min-width:0}
.who{flex:1;min-width:0;display:flex;align-items:center;gap:var(--sp-2);height:40px;border:0;background:var(--surface);box-shadow:inset 0 0 0 .5px var(--sep);
  border-radius:var(--r-md);padding:0 var(--sp-3);font-weight:600;cursor:pointer;text-align:left}
.who .n{flex:1}
.who .c{flex:none;color:var(--muted);font-weight:500;font-size:var(--fs-sm)}
.btn{flex:none;height:40px;border:0;background:var(--surface);box-shadow:inset 0 0 0 .5px var(--sep);border-radius:var(--r-md);padding:0 14px;font-weight:600;font-size:var(--fs-sm);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.ctl .rk-search{height:40px;border:0;background:var(--fill);border-radius:var(--r-md)}
.ctl .rk-search input{font-size:16px}
/* segmented control แบบ iOS (เลื่อนได้เมื่อจอแคบ) */
.seg{display:flex;gap:2px;padding:2px;background:var(--fill);border-radius:var(--r-md);overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.seg::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;border:0;background:none;color:var(--text);border-radius:10px;padding:6px 12px;font-size:var(--fs-sm);font-weight:500;white-space:nowrap;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;min-height:32px}
.tab b{font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.tab.on{background:var(--sel);color:var(--sel-text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.tab.on b{color:var(--sel-num)}
.tab.zero{opacity:.45}
.chips{display:flex;gap:var(--sp-2);overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.fchip{flex:none;max-width:60vw;display:inline-flex;align-items:center;gap:6px;height:32px;border:0;background:var(--surface);box-shadow:inset 0 0 0 .5px var(--sep);
  border-radius:var(--r-pill);padding:0 12px;font-size:var(--fs-sm);cursor:pointer;color:var(--text)}
.fchip .l{color:var(--muted)}
.fchip .v{font-weight:600;min-width:0}
.fchip.on{background:var(--gold-soft);box-shadow:inset 0 0 0 1px var(--gold)}
.fchip svg{width:12px;height:12px}

/* แถบรายชื่อด้านซ้าย (จอกว้าง) */
.side h2{font-size:var(--fs-sm);font-weight:600;color:var(--muted);margin:var(--sp-2) var(--sp-3) var(--sp-2)}
.plist{background:var(--surface);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow)}
.pit{display:flex;align-items:center;gap:var(--sp-3);width:100%;border:0;background:none;text-align:left;padding:11px var(--sp-4);cursor:pointer;position:relative}
.pit + .pit::before{content:"";position:absolute;left:var(--sp-4);right:0;top:0;border-top:.5px solid var(--sep)}
.pit .n{flex:1;font-weight:500}
.pit .c{flex:none;color:var(--muted);font-size:var(--fs-sm)}
.pit.on{background:var(--sel);color:var(--sel-text)}
.pit.on .c{color:var(--sel-num)}
.pit.on::before,.pit.on + .pit::before{border-color:transparent}

/* เนื้อหา */
.content{padding:var(--sp-4);display:flex;flex-direction:column;gap:var(--gap-list);max-width:980px;margin:0 auto}
.meta{font-size:var(--fs-xs);color:var(--muted-2);padding:0 var(--sp-1)}
.hero{display:flex;align-items:flex-end;gap:var(--sp-3);padding:var(--sp-2) var(--sp-1) 0}
.hero h1{flex:1;min-width:0;margin:0;font-size:var(--fs-title);line-height:1.15;font-weight:700;letter-spacing:-.02em}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:var(--sp-2)}
.st{background:var(--surface);border-radius:var(--r-lg);padding:var(--pad-card);box-shadow:var(--shadow);min-width:0;border:0;text-align:left;cursor:pointer}
.st .k{font-size:var(--fs-xs);color:var(--muted)}
.st .v{font-size:var(--fs-xl);font-weight:700;margin-top:2px}
.st .s{font-size:var(--fs-xs);color:var(--muted-2)}
.st.on{box-shadow:inset 0 0 0 2px var(--gold),var(--shadow)}
.sec{display:flex;align-items:baseline;gap:var(--sp-2);margin:var(--sp-3) var(--sp-1) 0}
.sec .one{flex:1;font-weight:700;font-size:var(--fs-lg)}
.sec small{flex:none;color:var(--muted);font-size:var(--fs-sm)}
.group{background:var(--surface);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow)}
.gh{display:flex;gap:var(--sp-2);padding:10px var(--pad-card);font-weight:600;font-size:var(--fs-sm);color:var(--muted);background:var(--surface-2)}
.gh .one{flex:1}
.gh span:last-child{flex:none;color:var(--text)}
.it{display:grid;grid-template-columns:auto minmax(0,1fr) auto;column-gap:var(--sp-3);row-gap:3px;padding:12px var(--pad-card);position:relative;align-items:baseline}
.it + .it::before,.gh + .it::before{content:"";position:absolute;left:var(--pad-card);right:0;top:0;border-top:.5px solid var(--sep)}
.it .rk{grid-row:1 / span 3;color:var(--muted-2);font-size:var(--fs-sm);min-width:1.6em;text-align:right;font-variant-numeric:tabular-nums}
.it .pn{font-weight:600}
.it .val{font-weight:700;color:var(--val);text-align:right;font-variant-numeric:tabular-nums}
.it .l2{grid-column:2 / span 2;font-size:var(--fs-xs);color:var(--muted)}
.it .l2 b{color:var(--text);font-weight:600}
.it .tags{grid-column:2 / span 2;display:flex;gap:4px;overflow:hidden}
.wh{flex:none;display:inline-flex;align-items:center;gap:4px;border-radius:var(--r-pill);padding:1px 8px;font-size:var(--fs-xs);background:var(--fill);white-space:nowrap}
.wh i{width:7px;height:7px;border-radius:50%;display:inline-block}
.more{border:0;background:var(--surface);box-shadow:var(--shadow);border-radius:var(--r-lg);padding:12px;color:var(--navy);font-weight:600;cursor:pointer}
:root[data-theme="dark"] .more{color:var(--gold-hi)}
.empty{text-align:center;color:var(--muted);padding:var(--sp-6) var(--sp-3)}
.foot{font-size:var(--fs-xs);color:var(--muted-2);text-align:center;padding:var(--sp-2) 0 calc(var(--sp-6) + env(safe-area-inset-bottom))}
.load{display:flex;align-items:center;justify-content:center;gap:var(--sp-2);padding:var(--sp-6);color:var(--muted)}
.spin{width:16px;height:16px;border:2px solid var(--fill-2);border-top-color:var(--gold);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
#toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:var(--rk-z-toast);background:var(--navy);color:#fff;border-radius:var(--r-md);padding:10px 16px;font-size:var(--fs-sm);display:none;max-width:calc(100vw - 32px)}
@media (max-width:480px){ :root{ --fs-title:26px; } .content{padding:var(--sp-3)} .ctl{padding-left:var(--sp-3);padding-right:var(--sp-3)} }
/* มือถือ: การ์ดสรุปเรื่องเป็นแถบเลื่อนแนวนอน ไม่กินพื้นที่แนวตั้ง */
@media (max-width:720px){ .stats{display:flex;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1 * var(--sp-3));padding:2px var(--sp-3) 6px;scroll-snap-type:x proximity}
  .stats::-webkit-scrollbar{display:none} .st{flex:0 0 150px;scroll-snap-align:start;padding:10px 12px} .st .v{font-size:var(--fs-lg)} }
</style>
</head>
<body>

<div id="login" hidden>
  <div class="lg" data-tweak="หน้าเข้าสู่ระบบ">
    <svg width="56" height="56" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#0d1b3e"/><path d="M14 46V30m12 16V22m12 24V28m12 18V16" stroke="#e8c86a" stroke-width="6" stroke-linecap="round"/></svg>
    <h1>สรุปจัดซื้อ</h1>
    <p>รัตนไพบูลย์ · รายละเอียดรายคนจากสรุปไลน์ 07:00</p>
    <div id="g_id_onload" data-client_id="615875645128-gasjjvkt6lu8g449cbnhl40k1pu25r0b.apps.googleusercontent.com" data-callback="onGoogle" data-auto_prompt="false"></div>
    <div class="g"><div class="g_id_signin" data-type="standard" data-size="large" data-theme="filled_blue" data-text="sign_in_with" data-shape="pill"></div></div>
    <div id="lgMsg"></div><div id="lgErr"></div>
    <div class="ver" id="lgVer"></div>
  </div>
</div>

<div id="app" hidden>
  <header class="hd" data-tweak="หัวแอป">
    <div class="tt one"><b>สรุปจัดซื้อ</b><span class="one" id="ver"></span></div>
    <button class="me" id="meBtn" type="button" title="บัญชี"></button>
    <a class="hub" href="https://rattanaphaiboon.github.io/app/rattana-hub.html" title="กลับ Hub"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>Hub</a>
  </header>
  <div class="shell">
    <aside class="side" data-tweak="รายชื่อผู้สั่ง (จอกว้าง)">
      <h2>ผู้สั่ง</h2>
      <div class="plist" id="plist"></div>
    </aside>
    <div class="main">
      <div class="ctl" data-tweak="แถบค้นหา เรื่อง ตัวกรอง">
        <div class="row whoRow">
          <button class="who" id="whoBtn" type="button" data-tweak-card="ตัวเลือกผู้สั่ง"><span class="n one" id="whoName">-</span><span class="c num" id="whoCnt"></span><svg class="ic" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
        </div>
        <div class="row">
          <div class="rk-search" style="flex:1;min-width:0"><input id="q" type="search" placeholder="ค้นชื่อสินค้า บาร์โค้ด บริษัท แบรนด์ ขนาด คลัง" autocomplete="off"><button class="rk-search-x" type="button" aria-label="ล้างทั้งหมด">✕</button></div>
          <button class="btn" id="xlsBtn" type="button" title="ดาวน์โหลด Excel ตามที่กรองอยู่"><svg class="ic" viewBox="0 0 24 24"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 21h14"/></svg>Excel</button>
        </div>
        <div class="seg" id="tabs" role="tablist"></div>
        <div class="chips" id="fchips"></div>
      </div>
      <div class="content" id="main"><div class="load"><span class="spin"></span>กำลังโหลด…</div></div>
    </div>
  </div>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
const APP_VER = 'v1.2', APP_DATE = '2026-10-23';
const EXEC = 'https://script.google.com/macros/s/AKfycbyD49DDSPZBCXcFeQWBXMhs3F6fdEKTHrcHnLW5BgEtigX3ypCjSqk7r07qLdUkjCSeyg/exec';
const SESSION_TTL = 30 * 24 * 60 * 60 * 1000, THEME_KEY = 'pdg_theme', PICK_KEY = 'pdg_pick', SORT_KEY = 'pdg_sort';
const ALL = '*';   // "รวมทุกคน"
const WH_COLOR = { W1: 'var(--w1)', W2: 'var(--w2)', W3: 'var(--w3)', W4: 'var(--w4)', C4: 'var(--c4)', HQ: 'var(--hq)' };
/* หัวข้อเรื่อง (ชื่อในแอป) + ค่าที่ใช้เรียง (Surat: สั่งซื้อ = ยอดขายเยอะ+ขาดเยอะขึ้นก่อน · สต็อก/ไม่ขาย = มูลค่าสต็อกขึ้นก่อน) */
const TOPIC = {
  'ขายขาดทุน': { title: 'ขายขาดทุน', valLbl: 'ขาดทุน/วัน' },
  'SMP2 ยังไม่สั่ง': { title: 'SMP2 ให้สั่งแต่ยังไม่สั่ง', valLbl: 'ยอดขาย/วัน' },
  'เซลล์สั่งเกินสต็อก': { title: 'เซลล์สั่งเกินสต็อก', valLbl: 'มูลค่าที่ขาด' },
  'ของขาด 24 ชม.': { title: 'ของขาด 24 ชม.', valLbl: 'ครั้ง' },
  'ขาดส่ง': { title: 'ขาดส่ง (ร้านสั่งแล้วไม่ได้ของ)', valLbl: 'มูลค่าที่ขาด' },
  'ไม่มียอดขาย': { title: 'ไม่มียอดขาย มูลค่าสต็อกสูง', valLbl: 'มูลค่าสต็อก' }
};
const PAGE = 60;
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtN = v => Math.round(v || 0).toLocaleString('en-US');
function fmtVal(v, unit) {
  if (unit === 'ครั้ง') return fmtN(v) + ' ครั้ง';
  const a = Math.abs(v || 0), t = a >= 1e6 ? (a / 1e6).toFixed(a >= 1e7 ? 0 : 1) + 'M' : a >= 1e4 ? (a / 1e3).toFixed(a >= 1e5 ? 0 : 1) + 'K' : fmtN(a);
  return '฿' + t + (unit === '฿/วัน' ? '/วัน' : '');
}
function toast(m) { const t = $('toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(toast._t); toast._t = setTimeout(() => t.style.display = 'none', 2600); }
const noOwner = b => /^ไม่มีผู้สั่ง|^ไม่พบ/.test(b) ? 1 : 0;

/* ── theme ── */
function applyTheme(t) { if (t) document.documentElement.setAttribute('data-theme', t); else document.documentElement.removeAttribute('data-theme'); try { localStorage.setItem(THEME_KEY, t || ''); } catch (e) {} }
(function () { let t = ''; try { t = localStorage.getItem(THEME_KEY) || ''; } catch (e) {} if (t) document.documentElement.setAttribute('data-theme', t); })();

/* ── login (SSO กับ Hub: rattana_session) · สิทธิ์จริงหลังบ้านเช็ค (จัดซื้อ / Role ≥ 5) ── */
let user = null;
function session() {
  try { const p = JSON.parse(localStorage.getItem('rattana_session') || localStorage.getItem('rattanaUser') || 'null');
    return p && p.data && p.data.email && p.exp && Date.now() < p.exp ? p.data : null; } catch (e) { return null; }
}
function jwt(tok) {
  let b = String(tok || '').split('.')[1] || ''; b = b.replace(/-/g, '+').replace(/_/g, '/'); b += '='.repeat((4 - b.length % 4) % 4);
  const bin = atob(b), u8 = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  return JSON.parse(new TextDecoder().decode(u8));
}
window.onGoogle = function (res) {
  try {
    const p = jwt(res.credential), email = String(p.email || '').trim().toLowerCase();
    if (!email) throw new Error('ไม่พบอีเมล');
    user = { email: email, name: p.name || email, picture: p.picture || '' };
    try { const pl = JSON.stringify({ data: user, exp: Date.now() + SESSION_TTL }); localStorage.setItem('rattana_session', pl); localStorage.setItem('rattanaUser', pl); } catch (e) {}
    enter();
  } catch (e) { $('lgErr').textContent = 'เข้าสู่ระบบไม่สำเร็จ: ' + e.message; }
};
function logout() {
  if (!confirm('ออกจากระบบใช่ไหม')) return;
  try { localStorage.removeItem('rattana_session'); localStorage.removeItem('rattanaUser'); } catch (e) {}
  location.reload();
}

/* ── data ── */
const S = { snap: null, buyer: '', topic: '', q: '', f: { v: '', br: '', sz: '' }, sort: 'value', shown: {} };
try { S.sort = localStorage.getItem(SORT_KEY) === 'company' ? 'company' : 'value'; } catch (e) {}
async function load() {
  $('main').innerHTML = '<div class="load"><span class="spin"></span>กำลังโหลดรอบส่งล่าสุด…</div>';
  try {
    const r = await fetch(EXEC + '?action=digestData&email=' + encodeURIComponent(user.email), { cache: 'no-store' });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || 'โหลดไม่ได้');
    S.snap = j.snap;
    S.snap.topics.forEach(t => {
      t.meta = TOPIC[t.key] || { title: String(t.name).split(' — ')[0], valLbl: '' };
      t.rows.forEach(x => {
        x.t = t.key; x.br = x.br || ''; x.sz = x.sz || '';
        x.hay = [x.n, x.sn, x.c, x.v, x.br, x.sz, x.b, x.d, (x.s || []).map(s => s.join(' ')).join(' '), t.label].join(' ').toLowerCase();
      });
    });
    $('ver').textContent = APP_VER + ' · รอบ ' + S.snap.at.slice(8, 10) + '/' + S.snap.at.slice(5, 7) + ' ' + S.snap.at.slice(11);
    pickDefault();
    render();
  } catch (e) {
    $('main').innerHTML = '<div class="empty">' + esc(e.message) + '<br><br><button class="btn" type="button" onclick="load()">ลองใหม่</button></div>';
  }
}
function buyersList() {
  const tot = {};
  S.snap.topics.forEach(t => t.rows.forEach(r => { tot[r.b] = (tot[r.b] || 0) + (t.sum ? r.val : 1); }));
  return Object.keys(tot).sort((a, b) => noOwner(a) - noOwner(b) || tot[b] - tot[a]).map(b => ({ b: b, n: tot[b] }));
}
function grand() { return buyersList().reduce((s, x) => s + x.n, 0); }
function pickDefault() {
  const list = buyersList();
  let saved = ''; try { saved = localStorage.getItem(PICK_KEY) || ''; } catch (e) {}
  if (saved === ALL) { S.buyer = ALL; return; }
  const mine = list.find(x => user.name && x.b.indexOf(user.name) === 0);
  S.buyer = (list.find(x => x.b === saved) || mine || { b: ALL }).b;
}
function setBuyer(b) {
  S.buyer = b; S.shown = {}; S.f = { v: '', br: '', sz: '' };
  try { localStorage.setItem(PICK_KEY, b); } catch (e) {}
  render(true);
}
const cnt = (t, rows) => t.sum ? rows.reduce((s, r) => s + r.val, 0) : rows.length;
/* แถวของคน/ทุกคน + ค้นหา (ทุก field · หลายคำ = AND) + ตัวกรอง บริษัท/แบรนด์/ขนาด */
function rowsOf(t, skip) {
  const words = S.q.toLowerCase().split(/\s+/).filter(Boolean);
  return t.rows.filter(r => (S.buyer === ALL || r.b === S.buyer)
    && (skip === 'v' || !S.f.v || r.v === S.f.v) && (skip === 'br' || !S.f.br || r.br === S.f.br) && (skip === 'sz' || !S.f.sz || r.sz === S.f.sz)
    && words.every(w => r.hay.indexOf(w) >= 0));
}
function visibleTopics() { return S.snap.topics.filter(t => !S.topic || t.key === S.topic); }

/* ── render ── */
function render(keepTop) {
  if (!S.snap) return;
  const list = buyersList(), me = S.buyer === ALL ? { n: grand() } : list.find(x => x.b === S.buyer);
  const whoTxt = S.buyer === ALL ? 'รวมทุกคน' : S.buyer;
  $('whoName').textContent = whoTxt; $('whoName').title = whoTxt;
  $('whoCnt').textContent = me ? fmtN(me.n) : '';
  $('plist').innerHTML = '<button class="pit' + (S.buyer === ALL ? ' on' : '') + '" type="button" data-b="' + ALL + '"><span class="n one">รวมทุกคน</span><span class="c num">' + fmtN(grand()) + '</span></button>'
    + list.map(x => '<button class="pit' + (S.buyer === x.b ? ' on' : '') + '" type="button" data-b="' + esc(x.b) + '" title="' + esc(x.b) + '"><span class="n one">' + esc(x.b) + '</span><span class="c num">' + fmtN(x.n) + '</span></button>').join('');

  const per = S.snap.topics.map(t => ({ t: t, rows: rowsOf(t) }));
  const all = per.reduce((s, x) => s + cnt(x.t, x.rows), 0);
  $('tabs').innerHTML = '<button class="tab' + (!S.topic ? ' on' : '') + '" type="button" role="tab" data-t="">ทั้งหมด<b>' + fmtN(all) + '</b></button>'
    + per.map(x => { const c = cnt(x.t, x.rows);
      return '<button class="tab' + (S.topic === x.t.key ? ' on' : '') + (c ? '' : ' zero') + '" type="button" role="tab" data-t="' + esc(x.t.key) + '">' + esc(x.t.label) + '<b>' + fmtN(c) + '</b></button>'; }).join('');
  paintChips();

  const shown = per.filter(x => (!S.topic || x.t.key === S.topic) && x.rows.length);
  let h = '<div class="hero"><h1 class="one" title="' + esc(whoTxt) + '">' + esc(whoTxt) + '</h1></div>';
  /* การ์ดสรุปต่อเรื่อง — แตะ = เปิดเรื่องนั้น */
  h += '<div class="stats" data-tweak="การ์ดสรุปเรื่อง">' + per.map(x => {
    const c = cnt(x.t, x.rows), sum = x.rows.reduce((s, r) => s + r.val, 0);
    return '<button class="st' + (S.topic === x.t.key ? ' on' : '') + '" type="button" data-t="' + esc(x.t.key) + '" data-tweak-card="การ์ดสรุป">'
      + '<div class="k one">' + esc(x.t.meta.title) + '</div><div class="v num">' + fmtN(c) + '</div>'
      + '<div class="s one">' + (x.t.unit === 'ครั้ง' ? fmtN(x.rows.length) + ' สินค้า' : fmtVal(sum, x.t.unit)) + '</div></button>';
  }).join('') + '</div>';
  h += '<div class="meta one">รอบส่ง ' + esc(S.snap.at) + ' · ตัวเลขตรงกับที่ส่งเข้ากลุ่มไลน์ · เรียง' + (S.sort === 'value' ? 'ตามมูลค่า' : 'ตามบริษัท') + '</div>';
  if (!shown.length) h += '<div class="empty">' + (S.q || S.f.v || S.f.br || S.f.sz ? 'ไม่พบรายการตามที่ค้น/กรอง' : 'ไม่มีรายการ') + '</div>';
  shown.forEach(x => { h += section(x.t, x.rows); });
  h += '<div class="foot">' + APP_VER + ' · ' + APP_DATE + '</div>';
  const y = window.scrollY;
  $('main').innerHTML = h;
  window.scrollTo(0, keepTop ? Math.min(y, 0) : y);
}
function stockTags(r) {
  return r.s && r.s.length ? '<div class="tags">' + r.s.map(s => '<span class="wh"><i style="background:' + (WH_COLOR[s[0]] || 'var(--muted-2)') + '"></i>' + esc(s[0]) + ' ' + esc(s[1]) + '</span>').join('') + '</div>' : '';
}
function itemHtml(r, t, rank) {
  const who = S.buyer === ALL ? '<b>' + esc(r.b) + '</b> · ' : '';
  const ctx = S.sort === 'value' ? esc(r.v) + ' · ' : '';
  return '<div class="it" data-tweak-card="แถวสินค้า"><span class="rk">' + rank + '</span>'
    + '<span class="pn one" title="' + esc(r.n) + '">' + esc(r.n) + '</span><span class="val">' + fmtVal(r.val, t.unit) + '</span>'
    + '<div class="l2 one" title="' + esc((S.buyer === ALL ? r.b + ' · ' : '') + r.v + ' · ' + r.d) + '">' + who + ctx + esc(r.d) + '</div>'
    + stockTags(r) + '</div>';
}
function section(t, rows) {
  const key = t.key, lim = S.shown[key] || PAGE, total = rows.reduce((s, r) => s + r.val, 0);
  let out = '<div class="sec"><span class="one">' + esc(t.meta.title) + '</span><small class="num">' + fmtN(cnt(t, rows)) + (t.unit !== 'ครั้ง' ? ' · ' + fmtVal(total, t.unit) : '') + '</small></div>';
  if (t.note) out += '<div class="meta one">' + esc(t.note) + '</div>';
  if (S.sort === 'value') {
    /* เรียงตามมูลค่าล้วน (Surat 23/10) — ขาดทุน/วัน · ยอดขาย/วัน · มูลค่าที่ขาด · มูลค่าสต็อก · ครั้ง */
    const list = rows.slice().sort((a, b) => b.val - a.val);
    out += '<div class="group">' + list.slice(0, lim).map((r, i) => itemHtml(r, t, i + 1)).join('') + '</div>';
  } else {
    const vend = {};
    rows.forEach(r => (vend[r.v] = vend[r.v] || []).push(r));
    const groups = Object.keys(vend).map(v => ({ v: v, list: vend[v].sort((a, b) => b.val - a.val), tot: vend[v].reduce((s, r) => s + r.val, 0) })).sort((a, b) => b.tot - a.tot);
    let n = 0;
    for (const g of groups) {
      if (n >= lim) break;
      out += '<div class="group" data-tweak-card="กลุ่มบริษัท"><div class="gh"><span class="one" title="' + esc(g.v) + '">' + esc(g.v) + '</span><span class="num">' + fmtVal(g.tot, t.unit) + '</span></div>';
      for (const r of g.list) { if (n >= lim) break; n++; out += itemHtml(r, t, n); }
      out += '</div>';
    }
  }
  if (rows.length > lim) out += '<button class="more" type="button" data-more="' + esc(key) + '">แสดงเพิ่ม (' + fmtN(rows.length - lim) + ' รายการ)</button>';
  return out;
}

/* ── ตัวกรอง บริษัท · แบรนด์ · ขนาด (dropdown พิมพ์ค้นได้) + เรียง ── */
const FDEF = { v: 'บริษัท', br: 'แบรนด์', sz: 'ขนาด' };
function paintChips() {
  const chip = (k, lbl, val) => '<button class="fchip' + (val ? ' on' : '') + '" type="button" data-f="' + k + '" title="' + esc(val || lbl) + '"><span class="l">' + lbl + '</span>'
    + (val ? '<span class="v one">' + esc(val) + '</span>' : '') + '<svg class="ic" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>';
  $('fchips').innerHTML = chip('sort', 'เรียง', S.sort === 'value' ? 'มูลค่า' : 'บริษัท') + Object.keys(FDEF).map(k => chip(k, FDEF[k], S.f[k])).join('')
    + (S.f.v || S.f.br || S.f.sz ? '<button class="fchip" type="button" data-f="clear">ล้างตัวกรอง</button>' : '');
}
function openFilter(k, el) {
  if (k === 'clear') { S.f = { v: '', br: '', sz: '' }; S.shown = {}; render(); return; }
  if (k === 'sort') {
    RK.dropdown(el, { title: 'เรียงรายการ', value: S.sort, items: [{ v: 'value', label: 'มูลค่ามาก → น้อย' }, { v: 'company', label: 'แยกตามบริษัท (ยอดรวมบริษัท)' }],
      onPick: it => { S.sort = it.v; S.shown = {}; try { localStorage.setItem(SORT_KEY, it.v); } catch (e) {} render(); } });
    return;
  }
  /* ตัวเลือก = ค่าที่มีในรายการตอนนี้ (ตามคน · เรื่อง · ค้นหา · ตัวกรองอื่น) เรียงตามมูลค่ารวมมาก → น้อย */
  const agg = {};
  visibleTopics().forEach(t => rowsOf(t, k).forEach(r => { const v = r[k] || '(ไม่ระบุ)'; (agg[v] = agg[v] || { n: 0, val: 0 }); agg[v].n++; agg[v].val += r.val; }));
  const items = [{ v: '', label: 'ทั้งหมด' }].concat(Object.keys(agg).sort((a, b) => agg[b].val - agg[a].val || agg[b].n - agg[a].n)
    .map(v => ({ v: v === '(ไม่ระบุ)' ? '' : v, label: v + ' · ' + fmtN(agg[v].n) })));
  RK.dropdown(el, { title: 'เลือก' + FDEF[k], search: true, placeholder: 'พิมพ์ค้นหา' + FDEF[k] + '…', value: S.f[k], items: items,
    onPick: it => { S.f[k] = it.v; S.shown = {}; render(); } });
}

/* ── events ── */
document.addEventListener('click', e => {
  const tb = e.target.closest('.tab,.st');
  if (tb) { S.topic = tb.dataset.t === S.topic && tb.classList.contains('st') ? '' : tb.dataset.t; S.shown = {}; render(); return; }
  const mo = e.target.closest('[data-more]');
  if (mo) { const k = mo.dataset.more; S.shown[k] = (S.shown[k] || PAGE) + PAGE * 2; render(); return; }
  const pi = e.target.closest('.pit');
  if (pi) { setBuyer(pi.dataset.b); return; }
  const fc = e.target.closest('.fchip');
  if (fc) { openFilter(fc.dataset.f, fc); return; }
});
$('whoBtn').addEventListener('click', () => {

  });
});

  RK.dropdown($('meBtn'), {
    title: user.email, items: [{ v: 'reload', label: 'โหลดรอบส่งล่าสุดใหม่' }, { v: 'theme', label: dark ? 'โหมดสว่าง' : 'โหมดมืด' }, { v: 'out', label: 'ออกจากระบบ' }],
    onPick: it => { if (it.v === 'reload') load(); else if (it.v === 'theme') applyTheme(dark ? 'light' : 'dark'); else logout(); }
  });

$('xlsBtn').addEventListener('click', exportXlsx);

function loadXlsx() {
  if (window.XLSX) return Promise.resolve();
  return new Promise((ok, no) => { const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; s.onload = ok; s.onerror = () => no(new Error('โหลดตัวสร้าง Excel ไม่ได้')); document.head.appendChild(s); });
}
async function exportXlsx() {
  if (!S.snap) return;
  try {
    await loadXlsx();
    const wb = XLSX.utils.book_new();
    visibleTopics().forEach(t => {
      const rows = rowsOf(t);
      if (!rows.length) return;
      const vt = {}; rows.forEach(r => vt[r.v] = (vt[r.v] || 0) + r.val);
      rows.sort((a, b) => S.sort === 'value' ? b.val - a.val : (vt[b.v] - vt[a.v]) || (b.val - a.val));
      const aoa = [['ผู้สั่ง', 'บริษัท', 'แบรนด์', 'ขนาด', 'สินค้า', 'บาร์โค้ด', t.meta.valLbl || t.unit || 'ค่า', 'รายละเอียด', 'สต็อก']]
        .concat(rows.map(r => [r.b, r.v, r.br, r.sz, r.n, String(r.c || ''), String(Math.round(r.val * 100) / 100), r.d, (r.s || []).map(s => s.join(' ')).join(' · ')]));
      const ws = XLSX.utils.aoa_to_sheet(aoa);
      Object.keys(ws).forEach(k => { if (k[0] !== '!') { ws[k].t = 's'; ws[k].v = String(ws[k].v); ws[k].z = '@'; } });
      ws['!cols'] = [{ wch: 30 }, { wch: 34 }, { wch: 20 }, { wch: 24 }, { wch: 40 }, { wch: 16 }, { wch: 12 }, { wch: 60 }, { wch: 40 }];
      XLSX.utils.book_append_sheet(wb, ws, String(t.label).slice(0, 31));
    });
    if (!wb.SheetNames.length) { toast('ไม่มีรายการให้ดาวน์โหลด'); return; }
    XLSX.writeFile(wb, 'สรุปจัดซื้อ ' + S.snap.at.slice(0, 10) + ' ' + (S.buyer === ALL ? 'รวมทุกคน' : S.buyer).replace(/[\\/:*?"<>|]/g, '') + '.xlsx');
  } catch (e) { toast(e.message); }
}

function enter() {
  $('login').hidden = true; $('app').hidden = false;
  $('meBtn').textContent = (user.name || user.email || '?').trim().charAt(0);

(function boot() {
  $('ver').textContent = APP_VER; $('lgVer').textContent = APP_VER + ' · ' + APP_DATE;
  user = session();
  if (user) enter(); else $('login').hidden = false;
})();

<script id="rk-dropdown-js">
(function(){
  window.RK = window.RK || {};
  let el, backdrop, inp, list, cntEl, headEl, st = null, act = -1;

  function build(){
    if (el) return;
    backdrop = document.createElement('div'); backdrop.className = 'rk-dd-backdrop';
    el = document.createElement('div'); el.className = 'rk-dd'; el.setAttribute('role','listbox');
    el.innerHTML =
      '<div class="rk-dd-grip"></div>'+
      '<div class="rk-dd-head"><span class="rk-1line rk-grow"></span></div>'+
      '<div class="rk-dd-srch"><input type="search" inputmode="search" autocomplete="off" placeholder="พิมพ์ค้นหา…"><button class="rk-dd-x" type="button" aria-label="ล้าง">✕</button></div>'+
      '<div class="rk-dd-list"></div><div class="rk-dd-cnt"></div>';
    document.body.appendChild(backdrop); document.body.appendChild(el);   /* ← portal ที่ body: sticky ตัวไหนก็ทับไม่ได้ */
    inp = el.querySelector('input'); list = el.querySelector('.rk-dd-list');
    cntEl = el.querySelector('.rk-dd-cnt'); headEl = el.querySelector('.rk-dd-head span');

    inp.addEventListener('input', paint);
    el.querySelector('.rk-dd-x').addEventListener('click', ()=>{ inp.value=''; paint(); inp.focus(); });
    backdrop.addEventListener('click', close);
    el.addEventListener('keydown', key);
    inp.addEventListener('keydown', key);
    list.addEventListener('click', e=>{
      const it = e.target.closest('.rk-dd-it'); if (!it) return;
      pick(st.view[+it.dataset.i]);
    });
    window.addEventListener('resize', close);
    window.addEventListener('scroll', e=>{ if (st && !el.contains(e.target)) close(); }, true);
  }

  const norm = s => String(s==null?'':s).toLowerCase().trim();
  /* ค้นแบบ "ทุกคำต้องเจอ" และเจอที่ไหนก็ได้ในตัวเลือก (ไม่ใช่แค่ขึ้นต้น) */
  function match(hay, q){
    const w = norm(q).split(/\s+/).filter(Boolean);
    return w.every(x => hay.indexOf(x) >= 0);
  }

  function paint(){
    const q = inp.value;
    st.view = st.items.filter(it => !q || match(it._s, q));
    act = st.view.findIndex(it => String(it.v) === String(st.value));
    el.querySelector('.rk-dd-srch').classList.toggle('has', !!q);
    list.innerHTML = st.view.length
      ? st.view.map((it,i)=>
          '<div class="rk-dd-it'+(String(it.v)===String(st.value)?' sel':'')+'" data-i="'+i+'" role="option">'+
          (it.color?'<span class="dot" style="background:'+RK.esc(it.color)+'"></span>':'')+
          '<span class="lb" title="'+RK.esc(it.label)+'">'+RK.esc(it.label)+'</span>'+
          (String(it.v)===String(st.value)?'<span class="tick">✓</span>':'')+'</div>').join('')
      : '<div class="rk-dd-none">ไม่พบ "'+RK.esc(q)+'"</div>';
    cntEl.textContent = st.view.length + ' / ' + st.items.length + ' รายการ';
    cntEl.style.display = st.items.length > 8 ? '' : 'none';
    const sel = list.querySelector('.sel'); if (sel) sel.scrollIntoView({block:'nearest'});
  }

  function key(e){
    if (!st) return;
    if (e.key === 'Escape'){ e.preventDefault(); close(); return; }
    if (e.key === 'Enter'){ e.preventDefault(); if (st.view[act]) pick(st.view[act]); else if (st.view.length===1) pick(st.view[0]); return; }
    if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
    e.preventDefault();
    act = Math.max(0, Math.min(st.view.length-1, act + (e.key==='ArrowDown'?1:-1)));
    [...list.children].forEach((c,i)=> c.classList.toggle('act', i===act));
    if (list.children[act]) list.children[act].scrollIntoView({block:'nearest'});
  }

  function place(anchor){
    if (window.innerWidth <= 480) return;                 /* มือถือ = bottom sheet (CSS จัดให้) */
    const r = anchor.getBoundingClientRect(), M = 8;
    const w = Math.min(Math.max(r.width, 220), window.innerWidth - M*2);
    el.style.width = w + 'px';
    el.style.left  = Math.round(Math.min(Math.max(M, r.left), window.innerWidth - w - M)) + 'px';
    const below = window.innerHeight - r.bottom - M, above = r.top - M;
    const h = Math.min(el.scrollHeight || 320, 420);
    if (below >= Math.min(h, 220) || below >= above){ el.style.top = Math.round(r.bottom + 4) + 'px'; el.style.maxHeight = (below - 4) + 'px'; }
    else { el.style.top = Math.round(Math.max(M, r.top - 4 - Math.min(h, above))) + 'px'; el.style.maxHeight = (above - 4) + 'px'; }
  }

  function pick(it){ if (!it) return; const cb = st.onPick; close(); if (cb) cb(it); }

  function close(){
    if (!st) return;
    const a = st.anchor; st = null;
    el.classList.remove('on'); backdrop.classList.remove('on');
    backdrop.style.display = 'none';
    if (a && a.focus) try{ a.focus({preventScroll:true}); }catch(e){}
  }

  /* ── API หลัก ── */
  RK.dropdown = function(anchor, o){
    build(); if (st) close();
    const items = (o.items||[]).map(it => {
      const x = (typeof it === 'string') ? {v:it, label:it} : Object.assign({}, it);
      x.label = x.label==null ? String(x.v) : String(x.label);
      x._s = norm(x.label + ' ' + x.v + ' ' + (x.search||''));
      return x;
    });
    st = {anchor, items, view:items, value:o.value, onPick:o.onPick};
    headEl.textContent = o.title || 'เลือก';
    const searchable = o.search !== false && (o.search === true || items.length > 10);
    el.querySelector('.rk-dd-srch').style.display = searchable ? '' : 'none';
    inp.value = ''; inp.placeholder = o.placeholder || 'พิมพ์ค้นหา…';
    backdrop.style.display = ''; backdrop.classList.add('on');
    el.classList.add('on');
    paint(); place(anchor);
    if (searchable && window.innerWidth > 480) setTimeout(()=>inp.focus(), 30);
    return {close};
  };
  RK.closeDropdown = close;

  /* ── retrofit: <select> เดิม → ปุ่มที่ค้นหาได้ (ค่ายังอยู่ใน select เดิม แอปเดิมไม่ต้องแก้) ── */
  RK.selectify = function(sel, o){
    o = o || {};
    if (!sel || sel.dataset.rkDone || sel.hasAttribute('data-rk-skip') || sel.multiple) return;
    sel.dataset.rkDone = '1';
    const btn = document.createElement('button');
    btn.type = 'button'; btn.className = 'rk-dd-btn ' + (o.cls||'');
    btn.innerHTML = '<span class="lb"></span><span class="cv">▾</span>';
    btn.setAttribute('data-rk-menu-anchor','1');
    sel.style.display = 'none';
    sel.insertAdjacentElement('afterend', btn);

    const opts = () => [...sel.options].filter(op=>!op.disabled || op.value!=='')
                    .map(op => ({v:op.value, label:(op.textContent||'').trim(), color:op.dataset.color}));
    const sync = () => {
      const cur = sel.options[sel.selectedIndex];
      const t = cur ? (cur.textContent||'').trim() : (o.placeholder || 'เลือก…');
      btn.querySelector('.lb').textContent = t; btn.title = t;
      btn.disabled = sel.disabled;
    };
    btn.addEventListener('click', ()=> RK.dropdown(btn, {
      title: o.title || sel.getAttribute('aria-label') || sel.dataset.title || 'เลือก',
      items: opts(), value: sel.value,
      onPick: it => { sel.value = it.v; sync(); sel.dispatchEvent(new Event('change', {bubbles:true})); }
    }));
    sel.addEventListener('change', sync);
    new MutationObserver(sync).observe(sel, {childList:true, subtree:true, attributes:true, attributeFilter:['disabled','value']});
    sync();
    return btn;
  };

  RK.selectifyAll = function(root, o){
    (typeof root === 'string' ? document.querySelector(root) : (root || document))
      .querySelectorAll('select:not([data-rk-done]):not([data-rk-skip])')
      .forEach(s => RK.selectify(s, o));
  };
})();
</script>

<!-- ══════════════════════════════════════════════════════════════════════════
     RK-SEARCHBAR · ช่องค้นหาที่ "ค้นได้ทุก field + X ล้างทั้งหมด + sticky"
     ต้องวาง rk-base.html ก่อน · วางบล็อกนี้ก่อน </body>
     กฎอ้างอิง: CLAUDE.md § UI Build Standards ข้อ 4️⃣ (+ App Standards: sticky + X)

     ── ใช้ยังไง ──────────────────────────────────────────────────────────
     1) HTML (วางบนสุดของหน้าจอนั้น):
        <div class="rk-sticky rk-searchwrap">
          <div class="rk-search">
            <input id="q" type="search" placeholder="ค้นหา ชื่อ · รหัส · บาร์โค้ด · แบรนด์ …">

     2) JS:

          onQuery: q => render(),                 // เรียกทุกครั้งที่พิมพ์ (debounce ให้แล้ว)

     3) กรองข้อมูล — ค้น "ทุก field" อัตโนมัติ ไม่ต้องไล่เขียนทีละคอลัมน์:

        const rows = RK.filter(products, q, ['PRODUCT NAME','CODE EA','CAT BRAND']);  // เจาะจง
     ══════════════════════════════════════════════════════════════════════════ -->
<style id="rk-searchbar-css">

.rk-search:focus-within{border-color:var(--rk-gold);background:var(--rk-surface)}
.rk-search input{flex:1 1 auto;min-width:0;border:0;background:transparent;color:var(--rk-text);
  font:inherit;font-size:16px;padding:11px 2px;outline:none}          /* 16px = iOS ไม่ zoom ตอนโฟกัส */
.rk-search input::-webkit-search-cancel-button{display:none}

</style>

<script id="rk-searchbar-js">
(function(){
  window.RK = window.RK || {};
  const norm = s => String(s==null?'':s).toLowerCase().trim();

      el.value = ''; paintX();

      if (o.onQuery) o.onQuery('');

      window.scrollTo({top:y});
    }
    if (x) x.addEventListener('click', clear);
    paintX();
    return {clear, value:()=>el.value};
  };
})();
</script>

    var n = cardTargets(picked).length;
    var info = el('div', 'rkt-note');
    info.innerHTML = 'เลือกอยู่ <span class="rkt-tag">' + picked + '</span> · ' +
      'ปรับแล้วมีผลกับของชนิดเดียวกัน <b>' + n + ' ชิ้น</b> ในหน้านี้';
    bd.appendChild(info);

    /* ไล่ชั้น DOM — ชี้โดนตัวที่ห่ออยู่บ่อยมาก ปรับแล้วเลยดูเหมือนไม่มีอะไรเกิดขึ้น */
    var nav = el('div', 'rkt-fb');
    var up = el('button', null, '↑ ตัวแม่');
    up.title = 'ขึ้นไปตัวที่ห่ออยู่';
    up.onclick = function () {
      var p = selEl && selEl.parentElement;
      if (!p || p === root) return toast('บนสุดแล้ว');
      reselect(p);
    };
    var dn = el('button', null, '↓ ตัวข้างใน');
    dn.title = 'ลงไปตัวข้างในตัวแรก (ตัวที่มีตัวหนังสือจริง)';
    dn.onclick = function () {
      var k = selEl && selEl.firstElementChild;
      while (k && /^(script|style|link)$/i.test(k.tagName)) k = k.nextElementSibling;
      if (!k) return toast('ข้างในไม่มีอะไรแล้ว');
      reselect(k);
    };
    nav.appendChild(up); nav.appendChild(dn);
    bd.appendChild(nav);

    /* ข้างในมีตัวหนังสือที่ตั้งขนาด/สีเองอยู่กี่จุด — ตัวการที่ทำให้ "ปรับแล้วไม่เปลี่ยน" */
    var fixedKids = 0, myFs = '';
    try {
      myFs = getComputedStyle(selEl).fontSize;
      [].slice.call(selEl.querySelectorAll('*')).forEach(function (k) {
        var hasText = [].slice.call(k.childNodes).some(function (x) { return x.nodeType === 3 && x.textContent.trim(); });
        if (hasText && getComputedStyle(k).fontSize !== myFs) fixedKids++;
      });
    } catch (e) {}

    var deepOn = !!deepSel[picked];
    var dp = el('button', 'rkt-b' + (deepOn ? ' pri' : ''), (deepOn ? '✓ ' : '') + 'รวมตัวข้างในด้วย');
    dp.title = 'บังคับสี · ขนาด · ความหนาตัวอักษร ให้ของข้างในทุกชิ้นตามไปด้วย';
    dp.onclick = function () {
      if (deepSel[picked]) delete deepSel[picked]; else deepSel[picked] = 1;
      applyCards(); rebuild();
    };
    bd.appendChild(dp);
    if (fixedKids && !deepOn) {
      var wn = el('div', 'rkt-hint');
      wn.innerHTML = 'ข้างในมีตัวหนังสือที่ตั้งขนาดเองอยู่ <b>' + fixedKids + ' จุด</b> — ปรับตรงนี้มันจะไม่ขยับ ' +
        'กด <b>รวมตัวข้างในด้วย</b> ข้างบน หรือกด <b>↓ ตัวข้างใน</b> ลงไปปรับตัวจริง';
      bd.appendChild(wn);
    }

    bd.appendChild(el('div', 'rkt-gt', 'ปรับเฉพาะชนิดนี้'));
    bd.appendChild(cardRow('สีพื้นหลัง', 'background-color', 'color'));
    bd.appendChild(cardRow('สีตัวหนังสือ', 'color', 'color'));
    bd.appendChild(cardRow('ขนาดตัวอักษร', 'font-size', 'px'));
    bd.appendChild(cardRow('ความหนาตัวอักษร', 'font-weight', 'weight'));
    bd.appendChild(cardRow('สีขอบ', 'border-color', 'color'));
    bd.appendChild(cardRow('ความหนาขอบ', 'border-width', 'px'));
    bd.appendChild(cardRow('มุมโค้ง', 'border-radius', 'radius'));
    bd.appendChild(cardRow('ระยะขอบใน', 'padding', 'px'));

    var bt = el('div', 'rkt-btns');
    var sh = el('button', 'rkt-b', 'เงา เปิด/ปิด');
    sh.onclick = function () {
      var c = cards[picked] = cards[picked] || {};
      c['box-shadow'] = c['box-shadow'] === 'none' ? '0 2px 6px rgba(15,23,42,.14)' : 'none';
      applyCards();
    };
    var cl = el('button', 'rkt-b warn', 'ล้างตรงนี้');
    cl.onclick = function () { delete cards[picked]; applyCards(); rebuild(); };
    bt.appendChild(sh); bt.appendChild(cl);
    bd.appendChild(bt);

    /* โทเคนที่จุดนี้กินอยู่ — แก้ตรงนี้เปลี่ยนทั้งแอป ไม่ใช่แค่ตรงที่ชี้ */
    var toks = tokensOf(selEl);
    bd.appendChild(el('div', 'rkt-gt', 'โทเคนที่ตรงนี้ใช้อยู่ (' + toks.length + ')'));
    if (!toks.length) {
      bd.appendChild(el('div', 'rkt-hint', 'ตรงนี้ไม่ได้ใช้ค่าจาก :root ตรงๆ (อาจ hardcode ไว้) ปรับด้วยช่องข้างบนแทนได้'));
    } else {
      bd.appendChild(el('div', 'rkt-hint', 'แก้ตรงนี้ = เปลี่ยนทั้งแอปทุกที่ที่ใช้โทเคนตัวนั้น ไม่ใช่แค่จุดที่ชี้'));
      toks.forEach(function (t) {
        var r = tokenRow(t.name, orig[t.name]);
        var lbl = r.querySelector('.rkt-n');
        if (lbl) { lbl.textContent = t.name + '  (' + t.role + ')'; lbl.title = t.name + ' — ' + t.role; }
        bd.appendChild(r);
      });
    }
  }

  function buildPos(bd) {
    var sw = el('button', 'rkt-b pri', 'สลับที่ 2 ใบ (แตะทีละใบ)');
    sw.onclick = function () {
      stopMode(); mode = 'swap'; document.body.classList.add('rkt-swapmode');
      toast('แตะใบแรก แล้วแตะใบที่จะสลับด้วย');
    };
    bd.appendChild(sw);
    bd.appendChild(el('div', 'rkt-note', 'สลับได้เฉพาะของที่อยู่ในกล่องเดียวกัน · ใช้กับการ์ดในลิสต์เดียวกันได้เลย'));

    if (!blocks.length) blocks = scanBlocks();
    bd.appendChild(el('div', 'rkt-gt', 'บล็อกใหญ่ (' + blocks.length + ')'));
    if (!blocks.length) {
      bd.appendChild(el('div', 'rkt-note', 'หน้านี้ยังไม่มี element ที่ติด data-tweak="ชื่อบล็อก" บอก Claude ให้ติดให้ก่อน'));
      return;
    }
    blocks.forEach(function (b, i) {
      var d = el('div', 'rkt-sec');
      d.appendChild(el('span', 'nm', (i+1) + '. ' + b.name));
      var up = el('button', 'rkt-mini', '↑'), dn = el('button', 'rkt-mini', '↓');
      var ey = el('button', 'rkt-mini' + (b.hidden ? ' off' : ''), '👁');
      up.onclick = function () { if (i > 0) { blocks.splice(i-1, 0, blocks.splice(i,1)[0]); applyBlocks(); rebuild(); } };
      dn.onclick = function () { if (i < blocks.length-1) { blocks.splice(i+1, 0, blocks.splice(i,1)[0]); applyBlocks(); rebuild(); } };
      ey.onclick = function () { b.hidden = !b.hidden; applyBlocks(); rebuild(); };
      d.appendChild(up); d.appendChild(dn); d.appendChild(ey);
      bd.appendChild(d);
    });
  }

  /* ─────────── แผง ─────────── */
  function rebuild() {
    if (!panel) return;
    var bd = panel.querySelector('.rkt-bd');
    bd.innerHTML = '';
    panel.querySelectorAll('.rkt-tb').forEach(function (b) {
      b.className = 'rkt-tb' + (b.dataset.t === tab ? ' on' : '');
    });
    if (tab === 'pick') buildCard(bd);
    else if (tab === 'tone') buildTone(bd);
    else buildPos(bd);
  }

  function open() {
    if (panel) { panel.style.display = 'flex'; return; }
    orig = readTokens();
    if (!Object.keys(orig).length) { toast('แอปนี้ยังไม่ได้ใช้ CSS variable ปรับไม่ได้'); return; }
    if (!document.getElementById('rk-tweak-style')) {
      var st = el('style'); st.id = 'rk-tweak-style'; st.textContent = CSS; document.head.appendChild(st);
    }

    panel = el('div', 'rkt d-' + dock);
    var hd = el('div', 'rkt-hd'); hd.appendChild(el('b', null, 'ปรับหน้าตา'));

    /* ย้ายกล่องไปมุมที่ไม่บังของที่กำลังดู */
    var dk = el('div', 'rkt-dk');
    [['left','◧','ชิดซ้าย'], ['right','◨','ชิดขวา'], ['bottom','▤','ด้านล่าง'],
     ['float','❐','ลอย'], ['min','—','ย่อ']].forEach(function (d) {
      var b = el('button', dock === d[0] ? 'on' : '', d[1]); b.title = d[2];
      b.onclick = function () {
        dock = d[0];
        panel.className = 'rkt d-' + dock;
        try { localStorage.setItem(DOCKKEY, dock); } catch (e) {}
        dk.querySelectorAll('button').forEach(function (q, i) {
          q.className = (['left','right','bottom','float','min'][i] === dock) ? 'on' : '';
        });
      };
      dk.appendChild(b);
    });
    hd.appendChild(dk);
    var x = el('button', 'rkt-x', '✕'); x.onclick = close; hd.appendChild(x);
    panel.appendChild(hd);

    var tabs = el('div', 'rkt-tabs');
    [['pick','ชี้แล้วปรับ'], ['tone','โทนรวม'], ['pos','ตำแหน่ง']].forEach(function (t) {
      var b = el('button', 'rkt-tb', t[1]); b.dataset.t = t[0];
      b.onclick = function () { stopMode(); tab = t[0]; rebuild(); };
      tabs.appendChild(b);
    });
    panel.appendChild(tabs);
    panel.appendChild(el('div', 'rkt-bd'));

    var ft = el('div', 'rkt-ft');
    var out = el('textarea'); out.className = 'rkt-out'; out.readOnly = true;
    out.placeholder = 'ปรับเสร็จแล้วกดปุ่มเขียวข้างบน ข้อความจะมาอยู่ตรงนี้';

    /* ปุ่มเดียวจบ: เขียนข้อตกลงลงตัวไฟล์ mockup เอง ไม่สร้างไฟล์ชื่อใหม่ */
    var b1 = el('button', 'rkt-b go', 'เสร็จแล้ว · เซฟลง mockup');
    b1.title = 'เขียนหน้าตาที่ปรับไว้ลงในไฟล์ mockup ตัวนี้เลย';
    b1.onclick = function () { saveLocal(true); saveSelf(out); };

    var help = el('div', 'rkt-note');
    help.innerHTML = 'กดปุ่มเขียว → เลือกทับไฟล์เดิม <b>' + selfName() + '</b> → กด Save<br>' +
      'แล้ว<b>พิมพ์บอก Claude ว่า "ปรับไว้แล้ว"</b> พอเลย ไม่ต้องก๊อปอะไร';
    var b2 = el('button', 'rkt-b', 'ดู CSS');
    b2.onclick = function () { out.value = cssText(); out.focus(); out.select(); };
    var b3 = el('button', 'rkt-b', 'คัดลอกแทน');
    b3.onclick = function () { copy(agreedBlockText(), out, 'คัดลอกแล้ว วางในแชท กด Ctrl+V'); };
    var b4 = el('button', 'rkt-b warn', 'ล้างทั้งหมด'); b4.onclick = resetAll;
    var bs = el('div', 'rkt-btns');
    [b2, b3, b4].forEach(function (b) { bs.appendChild(b); });
    ft.appendChild(b1); ft.appendChild(help); ft.appendChild(out); ft.appendChild(bs);
    panel.appendChild(ft);

    document.body.appendChild(panel);
    document.addEventListener('click', onPageClick, true);
    document.addEventListener('mouseover', onPageOver, true);
    rebuild();
  }
  function close() {
    stopMode();
    document.removeEventListener('click', onPageClick, true);
    document.removeEventListener('mouseover', onPageOver, true);
    if (panel) { panel.remove(); panel = null; }
  }

  W.RK.tweak = { open: open, close: close, css: cssText, agreed: agreedBlockText,
                 html: buildSelfHtml, save: function () { saveSelf(null); }, reset: resetAll };

  document.addEventListener('keydown', function (e) {
    if (e.ctrlKey && e.shiftKey && (e.key === 'T' || e.key === 't')) { e.preventDefault(); panel ? close() : open(); }
    if (e.key === 'Escape' && mode) { stopMode(); rebuild(); }
  });

  function boot() {
    orig = readTokens();
    blocks = scanBlocks();
    /* 1) ข้อตกลงที่ฝังไว้ในไฟล์ (ของจริงต้องสร้างตามนี้) */
    var tag = document.getElementById('rk-tweak-agreed');
    if (tag) { try { applyAgreement(JSON.parse(tag.textContent)); } catch (e) {} }
    /* 2) ของที่ยังลองอยู่ในเครื่องนี้ ทับข้อตกลงได้ */
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) applyAgreement(JSON.parse(raw));
    } catch (e) {}
    if (/[?&]tweak=1/.test(location.search)) open();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>

</body>
</html>
