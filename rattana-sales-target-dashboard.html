function renderOnTop() {
  const el = document.getElementById('onTopContent');
  if (!el) return;
  const rows = state.onTopRaw || [];
  if (!rows.length) { el.innerHTML = '<p class="txt-muted" style="padding:16px">ไม่มีข้อมูล On Top</p>'; return; }

  const dataMonth = (state.rows||[]).find(r=>r.month)?.month || '';
  const wd = getWorkingDaysInfo(dataMonth);
  const timeUsedPct = wd.pct;

  const fmtN = v => (v !== null && v !== undefined && v !== '') ? Number(String(v).replace(/,/g,'')).toLocaleString() : '<span style="color:var(--muted)">-</span>';
  const fmtTon = v => (v !== null && v !== undefined && v !== '') ? parseFloat(String(v).replace(/,/g,'')).toFixed(2) : '<span style="color:var(--muted)">-</span>';
  const fmtAch = (actual, target) => {
    const a = parseFloat(String(actual||'').replace(/,/g,''));
    if (actual === null || actual === undefined || actual === '' || isNaN(a)) return '<span style="color:var(--muted)">-</span>';
    return a.toLocaleString();
  };
  const fmtTonAch = (actual, target) => {
    const a = typeof actual === 'number' ? actual : parseFloat(String(actual||'').replace(/,/g,''));
    if (actual === null || actual === undefined || isNaN(a)) return '<span style="color:var(--muted)">-</span>';
    return a.toFixed(2);
  };

  // build ทำได้ (ตัน) และ ทำได้ (บาท) index from BP: filter Cat_Vendor = บจก.ซี.พี.ฟู้ดสโตร์
  const acTonIdx = new Map();
  const acBahtIdx = new Map();
  const acStrIdx = new Map();
  const acTonIdxC = new Map();   // fallback: no-space lowercase key
  const acBahtIdxC = new Map();
  const acStrIdxC = new Map();
  const compressName = s => normalizeName(s).replace(/\s+/g,'').toLowerCase();
  (state.bpRaw || []).forEach(r => {
    const vendor = String(r['Cat_Vendor']||'').trim();
    if (vendor !== 'บจก.ซี.พี.ฟู้ดสโตร์') return;
    const nm = normalizeName(r['Sale NO ROO']);
    const nmc = compressName(r['Sale NO ROO']);
    if (!nm) return;
    acTonIdx.set(nm, (acTonIdx.get(nm)||0) + parseNum(r['Sales_CSxValue']));
    acBahtIdx.set(nm, (acBahtIdx.get(nm)||0) + parseNum(r['EXVat+CN*2']));
    if (!acStrIdx.has(nm)) acStrIdx.set(nm, new Set());
    const cust = String(r['Customer_Code']||'').trim();
    if (cust) acStrIdx.get(nm).add(cust);
    acTonIdxC.set(nmc, (acTonIdxC.get(nmc)||0) + parseNum(r['Sales_CSxValue']));
    acBahtIdxC.set(nmc, (acBahtIdxC.get(nmc)||0) + parseNum(r['EXVat+CN*2']));
    if (!acStrIdxC.has(nmc)) acStrIdxC.set(nmc, new Set());
    if (cust) acStrIdxC.get(nmc).add(cust);
  });
  const getTon  = nm => acTonIdx.has(nm)  ? acTonIdx.get(nm)  : acTonIdxC.get(compressName(nm));
  const getBaht = nm => acBahtIdx.has(nm) ? acBahtIdx.get(nm) : acBahtIdxC.get(compressName(nm));
  const getStr  = nm => acStrIdx.has(nm)  ? acStrIdx.get(nm)  : acStrIdxC.get(compressName(nm));

  // flexible column key finder
  const allKeys = rows.length ? Object.keys(rows[0]) : [];
  const nk = s => s.replace(/\s+/g,'').toLowerCase();
  const findKey = (...terms) => allKeys.find(k => terms.every(t => nk(k).includes(t))) || '';
  const kAoTon  = findKey('เป้า','ตัน');
  const kAcTon  = findKey('ทำได้','ตัน');
  const kAoBaht = findKey('เป้า','บาท');
  const kAcBaht = findKey('ทำได้','บาท');
  const kAoStr  = findKey('เป้า','ร้านค้า');
  const kAcStr  = findKey('ทำได้','ร้านค้า');
  const kCh   = allKeys.find(k => nk(k).includes('ช่องทาง')) || 'ช่องทาง';
  const kWh   = allKeys.find(k => nk(k).includes('ศูนย์'))    || 'ศูนย์';
  const kName = allKeys.find(k => nk(k).includes('ชื่อพนักงานขาย')) || 'ชื่อพนักงานขาย';
  const kCode = allKeys.find(k => nk(k).includes('รหัส'))     || 'รหัส';

  // group by ช่องทาง, carry forward empty cells
  let lastCh = '';
  const grouped = [];
  rows.forEach(r => {
    const ch = String(r[kCh]||'').trim() || lastCh;
    lastCh = ch;
    grouped.push({...r, _ch: ch});
  });

  // compute rowspans for ช่องทาง
  const chSpan = {};
  grouped.forEach(r => { chSpan[r._ch] = (chSpan[r._ch]||0) + 1; });
  const chSeen = new Set();

  let html = `<style>
.ottbl{width:auto;border-collapse:collapse;font-size:12px;white-space:nowrap}
.ottbl th,.ottbl td{padding:6px 8px;border:1px solid #000;text-align:center;vertical-align:middle}
.ottbl thead tr:first-child th{background:#FFD9B0;color:#3a2000;font-weight:700;font-size:13px}
.ottbl thead tr:nth-child(2) th{background:#FFE4C4;color:#3a2000;font-weight:700}
.ottbl thead tr:nth-child(3) th{background:#FFF0E0;color:#3a2000;font-size:11px;line-height:1.3}
.ottbl tbody tr:hover{background:rgba(201,168,76,.07)}
.ottbl .col-ch{background:rgba(243,156,18,.1);font-weight:700}
.ottbl td.num{text-align:center;font-variant-numeric:tabular-nums}
</style>
<div class="tbl-wrap">
<table class="ottbl">
<thead>
<tr>
  <th rowspan="3">ช่องทาง</th>
  <th rowspan="3">ศูนย์</th>
  <th rowspan="3" style="text-align:left;min-width:140px">ชื่อพนักงานขาย</th>
  <th rowspan="3">รหัส</th>
  <th colspan="6">บจก.ซี.พี.ฟู้ดสโตร์</th>
</tr>
<tr>
  <th colspan="4">ข้าวตราฉัตร</th>
  <th colspan="2">กระจายร้าน</th>
</tr>
<tr>
  <th>เป้า<br>(ตัน)</th><th>ทำได้<br>(ตัน)</th>
  <th>เป้า<br>(บาท)</th><th>ทำได้<br>(บาท)</th>
  <th>เป้า<br>(ร้านค้า)</th><th>ทำได้<br>(ร้านค้า)</th>
</tr>
</thead>
<tbody>`;

  grouped.forEach(r => {
    const ch = r._ch;
    const isFirst = !chSeen.has(ch);
    if (isFirst) chSeen.add(ch);
    const aoTon  = r[kAoTon];
    const aoBaht = r[kAoBaht];
    const aoStr  = r[kAoStr];
    const acStr  = r[kAcStr];
    const nm = normalizeName(r[kName]);
    const acTonVal = getTon(nm) != null ? getTon(nm) / 1000 : null;
    const wh = String(r[kWh]||'').trim();
    const whBg = wh==='W1' ? 'background:rgba(255,220,50,.18)' : wh==='W3' ? 'background:rgba(255,80,80,.18)' : wh==='W4' ? 'background:rgba(46,204,113,.15)' : '';
    html += `<tr style="${whBg}">
      ${isFirst ? `<td rowspan="${chSpan[ch]}" class="col-ch">${ch}</td>` : ''}
      <td>${wh}</td>
      <td style="text-align:left">${String(r[kName]||'').trim()}</td>
      <td>${r[kCode]||''}</td>
      <td class="num">${fmtTon(aoTon)}</td>
      <td class="num">${fmtTonAch(acTonVal, aoTon)}</td>
      <td class="num">${fmtN(aoBaht)}</td>
      <td class="num">${fmtAch(getBaht(nm) != null ? Math.round(getBaht(nm)) : null, aoBaht)}</td>
      <td class="num">${fmtN(aoStr)}</td>
      <td class="num">${fmtAch(getStr(nm) != null ? getStr(nm).size : null, aoStr)}</td>
    </tr>`;
  });

  html += `</tbody></table></div>
<p class="txt-sm txt-muted" style="margin-top:8px">* ทำได้: สีเขียว ≥ Time Used (${timeUsedPct.toFixed(1)}%) · สีแดง น้อยกว่า</p>`;
  el.innerHTML = html;
}

/* ================= ROO ================= */
function renderROO() {
  const el = document.getElementById('rooContent');
  if (!el) return;
  const rows = state.rooRaw || [];
  if (!rows.length) { el.innerHTML = '<p class="txt-muted" style="padding:16px">ไม่มีข้อมูล ROO</p>'; return; }

  const wd = getWorkingDaysInfo(getWdMonth());

  // fixed brand columns from sheet
  const buCols = ['Bplus FMCG','Bplus Thaibev Al','Bplus บุหรี่','ข้าว','F&N','House Brand','Nissin']
    .filter(b => rows[0] && b in rows[0]);
  const totalCols = 3 + 3 + buCols.length; // ศูนย์+ชื่อ+รหัส + Store+Exvat+SKU + brands

  const fmtN = v => {
    const n = parseNum(v);
    return (n !== 0) ? Math.round(n).toLocaleString() : '-';
  };

  // build Store + Exvat + SKU + brand (Cat_BU) index: BP Salesman_Name contains "(ROO)"
  const storeIdx = new Map();
  const exvatIdx = new Map();
  const skuIdx = new Map();
  const buIdx = new Map(); // sn → Map(Cat_BU → sum EXVat+CN*2)
  (state.bpRaw || []).forEach(r => {
    const sn = String(r['Salesman_Name']||'').trim();
    if (!sn.includes('(ROO)')) return;
    const cust = String(r['Customer_Code']||'').trim();
    if (cust) { if (!storeIdx.has(sn)) storeIdx.set(sn, new Set()); storeIdx.get(sn).add(cust); }
    exvatIdx.set(sn, (exvatIdx.get(sn)||0) + parseNum(r['EXVat+CN*2']));
    const prod = String(r['Product_Name']||'').trim();
    if (prod) { if (!skuIdx.has(sn)) skuIdx.set(sn, new Set()); skuIdx.get(sn).add(prod); }
    const bu = String(r['Cat_BU']||'').trim().toLowerCase();
    if (bu) {
      if (!buIdx.has(sn)) buIdx.set(sn, new Map());
      const m = buIdx.get(sn);
      m.set(bu, (m.get(bu)||0) + parseNum(r['EXVat+CN*2']));
    }
  });

  const getGroup = code => {
    const c = String(code||'').toUpperCase();
    return (c.includes('HSW') || c.includes('GP')) ? 'ส่ง' : 'ปลีก';
  };

  // separate sum rows from data rows
  const dataRows = rows.filter(r => String(r['รหัส']||'').trim() !== '');
  const groups = { 'ส่ง': [], 'ปลีก': [] };
  dataRows.forEach(r => {
    const g = getGroup(r['รหัส']);
    if (groups[g]) groups[g].push(r);
  });

  let html = `<style>
.rtbl{width:auto;border-collapse:collapse;font-size:12px}
.rtbl th,.rtbl td{padding:6px 8px;border:1px solid #000;text-align:center;vertical-align:middle;white-space:nowrap;font-weight:700;color:#000}
.rtbl thead .r-title th{background:#b3d9f8;color:#0d1b3e;font-size:15px;font-weight:700}
.rtbl thead .r-info th{background:#e8f0fe;color:var(--navy);font-weight:700}
.rtbl thead .r-h1 th{background:#b3d9f8;color:#000;font-weight:700}
.rtbl tbody tr:hover{background:rgba(201,168,76,.07)}
.rtbl .grp-head td{background:var(--navy);color:var(--gold);font-weight:700;text-align:left;padding:6px 12px}
.rtbl .sum-row td{background:#b3d9f8;color:#0d1b3e;font-weight:700}
.rtbl .wh-w1{background:rgba(255,220,50,.18)}
.rtbl .wh-w3{background:rgba(255,80,80,.18)}
.rtbl .wh-w4{background:rgba(46,204,113,.15)}
</style>
<div class="tbl-wrap"><table class="rtbl">
<thead>
<tr class="r-title">
  <th colspan="${totalCols}" style="font-size:16px;letter-spacing:.5px">Rattana Online Order (ROO)</th>
</tr>
<tr class="r-h1">
  <th>ศูนย์</th>
  <th style="text-align:left">ชื่อพนักงานขาย</th>
  <th>รหัส</th>
  <th>Store</th><th>Exvat</th><th>SKU</th>
  ${buCols.map(b => `<th>${b.startsWith('Bplus ') ? 'Bplus<br>'+b.slice(6) : b}</th>`).join('')}
</tr>
</thead>
<tbody>`;

  const renderGroup = (label, grpRows) => {
    if (!grpRows.length) return '';
    let out = ``;
    let sStore=0, sExvat=0, sSku=0;
    const sBu = {};
    buCols.forEach(b => sBu[b] = 0);
    grpRows.forEach(r => {
      const wh = String(r['ศูนย์']||'').trim();
      const whCls = wh==='W1'?'wh-w1':wh==='W3'?'wh-w3':wh==='W4'?'wh-w4':'';
      const empName = String(r['ชื่อพนักงานขาย']||'').trim();
      const storeCount = storeIdx.has(empName) ? storeIdx.get(empName).size : 0;
      const exvatVal = exvatIdx.has(empName) ? exvatIdx.get(empName) : 0;
      const skuCount = skuIdx.has(empName) ? skuIdx.get(empName).size : 0;
      sStore += storeCount; sExvat += exvatVal; sSku += skuCount;
      const empBu = buIdx.get(empName) || new Map();
      buCols.forEach(b => sBu[b] += empBu.get(b.toLowerCase())||0);
      out += `<tr class="${whCls}">
        <td>${wh}</td>
        <td style="text-align:left">${empName}</td>
        <td>${r['รหัส']||''}</td>
        <td>${storeCount || '-'}</td>
        <td>${exvatVal ? Math.round(exvatVal).toLocaleString() : '-'}</td>
        <td>${skuCount || '-'}</td>
        ${buCols.map(b => { const v = empBu.get(b.toLowerCase())||0; return `<td>${v ? Math.round(v).toLocaleString() : '-'}</td>`; }).join('')}
      </tr>`;
    });
    out += `<tr class="sum-row">
      <td colspan="3">รวมช่องทาง${label}</td>
      <td>${Math.round(sStore).toLocaleString()}</td>
      <td>${Math.round(sExvat).toLocaleString()}</td>
      <td>${Math.round(sSku).toLocaleString()}</td>
      ${buCols.map(b => `<td>${Math.round(sBu[b]).toLocaleString()}</td>`).join('')}
    </tr>`;
    return out;
  };

  html += renderGroup('ส่ง', groups['ส่ง']);
  html += renderGroup('ปลีก', groups['ปลีก']);
  html += `</tbody></table></div>`;
  el.innerHTML = html;
}

/* ================= ROO SUMMARY ================= */
function renderROOSummary() {
  const el = document.getElementById('rooSummaryContent');
  if (!el) return;
  const rows = state.onlineRaw || [];
  if (!rows.length) { el.innerHTML = ''; return; }

  const wd = getWorkingDaysInfo(getWdMonth());
  const timeUsedPct = wd.pct;
  const daysUsed = Math.max(1, wd.totalWork - wd.remaining);

  // find column keys
  const allKeys = Object.keys(rows[0] || {});
  const nk = s => s.replace(/\s+/g,'').toLowerCase();
  const findKey = (...terms) => allKeys.find(k => terms.every(t => nk(k).includes(nk(t)))) || '';
  const kName = findKey('ชื่อ') || allKeys[0];
  const kTgt  = findKey('เป้าหมาย') || findKey('เป้า');

  // data rows = all except "รวม" row (compute total ourselves)
  const dataRows = rows.filter(r => nk(String(r[kName]||'')) !== 'รวม' && String(r[kName]||'').trim() !== '');

  // build BP indexes
  const nameSet = new Set(dataRows.map(r => String(r[kName]||'').trim()));
  const sStore = new Map(), sExvat = new Map(), sSku = new Map(), sSkuPt = new Map();
  const sCustSkuIdx = new Map(); // Salesman_Name → Map(Customer_Code → Set(Product_Name))
  const saleNoDocIdx    = new Map(); // Sale NO ROO → Set(Doc_No) สำหรับนับ Outlet
  const saleNoSkuIdx    = new Map(); // Sale NO ROO → Set(Product_Name) สำหรับนับ All SKU
  const saleNoDateIdx   = new Map(); // Sale NO ROO → Set(Doc_Date) สำหรับนับวัน
  const saleNoDocSkuIdx  = new Map(); // Sale NO ROO → Map(Doc_No → Set(Product_Name)) สำหรับ SKU/ร้าน (legacy)
  const saleNoCustSkuIdx = new Map(); // Sale NO ROO → Map(Customer_Code → Set(Product_Name)) สำหรับ SKU/ร้าน
  const docDateIdx   = new Map(); // Salesman_Name → Set(Doc_Date) สำหรับนับวัน
  const rooAll    = { store: new Set(), exvat: 0, sku: new Set(), skuPt: 0 };
  const rooPleek  = { store: new Set(), exvat: 0, sku: new Set(), skuPt: 0 }; // ROW
  const rooSong   = { store: new Set(), exvat: 0, sku: new Set(), skuPt: 0 }; // ROH
  const rooDateCustMap       = new Map();
  const rooPleekDateCustMap  = new Map();
  const rooSongDateCustMap   = new Map();
  const rooCustSkuMap        = new Map();
  const rooPleekCustSkuMap   = new Map();
  const rooSongCustSkuMap    = new Map();

  (state.bpRaw || []).forEach(r => {
    const sn      = String(r['Salesman_Name']||'').trim();
    const saleNo  = String(r['Sale NO ROO']||'').trim();
    const cust    = String(r['Customer_Code']||'').trim();
    const prod    = String(r['Product_Name']||'').trim();
    const docNo   = String(r['Doc_No']||'').trim();
    const docDate = String(r['Doc_Date']||'').trim();
    const exv     = parseNum(r['EXVat+CN*2']);
    const sp      = parseNum(r['SKU Point']);
    if (nameSet.has(sn)) {
      if (cust) { if (!sStore.has(sn)) sStore.set(sn, new Set()); sStore.get(sn).add(cust); }
      sExvat.set(sn, (sExvat.get(sn)||0) + exv);
      if (prod) { if (!sSku.has(sn)) sSku.set(sn, new Set()); sSku.get(sn).add(prod); }
      sSkuPt.set(sn, (sSkuPt.get(sn)||0) + sp);
      if (cust && prod) {
        if (!sCustSkuIdx.has(sn)) sCustSkuIdx.set(sn, new Map());
        const cm = sCustSkuIdx.get(sn);
        if (!cm.has(cust)) cm.set(cust, new Set());
        cm.get(cust).add(prod);
      }
      // นับ Doc_Date ไม่ซ้ำ (ใช้เป็นตัวหารของ ร้าน/วัน)
      if (docDate) { if (!docDateIdx.has(sn)) docDateIdx.set(sn, new Set()); docDateIdx.get(sn).add(docDate); }
    }
    // Outlet + SKU via Sale NO ROO
    if (nameSet.has(saleNo)) {
      if (docNo)   { if (!saleNoDocIdx.has(saleNo))  saleNoDocIdx.set(saleNo,  new Set()); saleNoDocIdx.get(saleNo).add(docNo); }
      if (prod)    { if (!saleNoSkuIdx.has(saleNo))  saleNoSkuIdx.set(saleNo,  new Set()); saleNoSkuIdx.get(saleNo).add(prod); }
      if (docDate) { if (!saleNoDateIdx.has(saleNo)) saleNoDateIdx.set(saleNo, new Set()); saleNoDateIdx.get(saleNo).add(docDate); }
      if (docNo && prod) {
        if (!saleNoDocSkuIdx.has(saleNo)) saleNoDocSkuIdx.set(saleNo, new Map());
        const dm = saleNoDocSkuIdx.get(saleNo);
        if (!dm.has(docNo)) dm.set(docNo, new Set());
        dm.get(docNo).add(prod);
      }
      if (cust && prod) {
        if (!saleNoCustSkuIdx.has(saleNo)) saleNoCustSkuIdx.set(saleNo, new Map());
        const cm = saleNoCustSkuIdx.get(saleNo);
        if (!cm.has(cust)) cm.set(cust, new Set());
        cm.get(cust).add(prod);
      }
    }
    if (sn.includes('(ROO)')) {
      const sc = String(r['Salesman_Code']||'').trim().toUpperCase();
      const isPleek = sc.startsWith('ROW');
      const isSong  = sc.startsWith('ROH');
      const addToAgg = (agg, dcMap, csMap) => {
        if (cust) agg.store.add(cust);
        agg.exvat += exv;
        if (prod) agg.sku.add(prod);
        agg.skuPt += sp;
        if (cust && prod) { if (!csMap.has(cust)) csMap.set(cust, new Set()); csMap.get(cust).add(prod); }
        if (docDate && cust) { if (!dcMap.has(docDate)) dcMap.set(docDate, new Set()); dcMap.get(docDate).add(cust); }
      };
      addToAgg(rooAll, rooDateCustMap, rooCustSkuMap);
      if (isPleek) addToAgg(rooPleek, rooPleekDateCustMap, rooPleekCustSkuMap);
      if (isSong)  addToAgg(rooSong,  rooSongDateCustMap,  rooSongCustSkuMap);
    }
  });

  // SKU Point สำหรับ (ROO) aggregate = Σ(Product_Name ไม่ซ้ำต่อร้าน)
  const rooSkuPtVal       = Array.from(rooCustSkuMap.values()).reduce((s, st) => s + st.size, 0);
  const rooPleekSkuPtVal  = Array.from(rooPleekCustSkuMap.values()).reduce((s, st) => s + st.size, 0);
  const rooSongSkuPtVal   = Array.from(rooSongCustSkuMap.values()).reduce((s, st) => s + st.size, 0);

  const fmtPct = (a, t) => {
    if (!t) return '<span style="color:var(--muted)">-</span>';
    const p = a / t * 100;
    return `<span style="color:#000;font-weight:700">${p.toFixed(2)}%</span>`;
  };
  const pctBg = (a, t) => {
    if (!t) return '';
    return (a / t * 100) >= timeUsedPct ? 'background:#d4f4e1' : 'background:#ffcccc';
  };

  let totTgt=0, totActual=0, totOutlet=0, totRanVan=0, totSkuPerStoreSum=0, totAllSku=0, totSkuPt=0;
  let bodyHtml = '';

  dataRows.forEach(r => {
    const nm  = String(r[kName]||'').trim();
    const tgt = kTgt ? parseNum(r[kTgt]) : 0;
    let storeSet, exvat, skuSet, skuPt;
    if (sStore.has(nm) || sExvat.has(nm)) {
      storeSet = sStore.get(nm) || new Set();
      exvat    = sExvat.get(nm) || 0;
      skuSet   = sSku.get(nm)   || new Set();
      skuPt    = sSkuPt.get(nm) || 0;
      if (sCustSkuIdx.has(nm)) {
        const cm = sCustSkuIdx.get(nm);
        skuPt = Array.from(cm.values()).reduce((s, st) => s + st.size, 0);
      }
    } else {
      // fallback: aggregate by Salesman_Code prefix (ROW=ปลีก, ROH=ส่ง, else all)
      const usesPleek = nm.includes('ปลีก');
      const usesSong  = nm.includes('ส่ง');
      if (usesPleek) { storeSet = rooPleek.store; exvat = rooPleek.exvat; skuSet = rooPleek.sku; skuPt = rooPleekSkuPtVal; }
      else if (usesSong) { storeSet = rooSong.store; exvat = rooSong.exvat; skuSet = rooSong.sku; skuPt = rooSongSkuPtVal; }
      else { storeSet = rooAll.store; exvat = rooAll.exvat; skuSet = rooAll.sku; skuPt = rooSkuPtVal; }
    }
    const usesRooAll  = !(sStore.has(nm) || sExvat.has(nm));
    const usesPleekAgg = usesRooAll && nm.includes('ปลีก');
    const usesSongAgg  = usesRooAll && nm.includes('ส่ง');
    const activeDcMap  = usesPleekAgg ? rooPleekDateCustMap : usesSongAgg ? rooSongDateCustMap : rooDateCustMap;
    const activeCsMap  = usesPleekAgg ? rooPleekCustSkuMap  : usesSongAgg ? rooSongCustSkuMap  : rooCustSkuMap;
    const outletSet   = saleNoDocIdx.has(nm) ? saleNoDocIdx.get(nm) : storeSet;
    const outlet      = outletSet.size;
    const allSku      = saleNoSkuIdx.has(nm) ? saleNoSkuIdx.get(nm).size : skuSet.size;
    let ranVan = null;
    if (saleNoDocIdx.has(nm)) {
      const uniqueDocs  = saleNoDocIdx.get(nm).size;
      const uniqueDates = saleNoDateIdx.has(nm) ? saleNoDateIdx.get(nm).size : 1;
      ranVan = uniqueDates > 0 ? uniqueDocs / uniqueDates : 0;
    } else if (usesRooAll && activeDcMap.size > 0) {
      const sumPerDay = Array.from(activeDcMap.values()).reduce((s, st) => s + st.size, 0);
      ranVan = sumPerDay / activeDcMap.size;
    } else if (docDateIdx.has(nm)) {
      // ลูกค้าหน้าร้าน (ROO): Customer_Code / Doc_Date ไม่ซ้ำ
      const custCount = (sStore.get(nm) || new Set()).size;
      ranVan = custCount / docDateIdx.get(nm).size;
    } else {
      ranVan = outlet > 0 ? outlet / daysUsed : 0;
    }
    let skuPerStore = 0, skuPerStoreRoundUp = false;
    if (saleNoCustSkuIdx.has(nm)) {
      // unique Product_Name / unique Doc_No (Outlet) — ปัดขึ้นเป็นจำนวนเต็ม
      skuPerStore = outlet > 0 ? Math.ceil(allSku / outlet) : 0;
      // SKU Point = Σ(unique Product_Name ต่อ Doc_No) ยังใช้จาก saleNoDocSkuIdx
      if (saleNoDocSkuIdx.has(nm)) {
        const docSkuMap = saleNoDocSkuIdx.get(nm);
        skuPt = Array.from(docSkuMap.values()).reduce((s, st) => s + st.size, 0);
      }
    } else if (usesRooAll && activeCsMap.size > 0) {
      const sumSkuPerCust = Array.from(activeCsMap.values()).reduce((s, st) => s + st.size, 0);
      skuPerStore = activeCsMap.size > 0 ? sumSkuPerCust / activeCsMap.size : 0;
    } else if (sCustSkuIdx.has(nm)) {
      const cm = sCustSkuIdx.get(nm);
      const sumSkuPerCust = Array.from(cm.values()).reduce((s, st) => s + st.size, 0);
      skuPerStore = cm.size > 0 ? sumSkuPerCust / cm.size : 0;
    } else {
      skuPerStore = outlet > 0 ? allSku / outlet : 0;
    }
    totTgt += tgt; totActual += exvat; totOutlet += outlet;
    totAllSku += allSku; totSkuPt += skuPt;
    if (ranVan !== null) totRanVan += Math.round(ranVan);
    const skuPerStoreDisplay = skuPerStore ? (skuPerStoreRoundUp ? Math.ceil(skuPerStore) : parseFloat(skuPerStore.toFixed(1))) : 0;
    totSkuPerStoreSum += skuPerStoreDisplay;
    bodyHtml += `<tr>
      <td style="text-align:left">${nm}</td>
      <td>${tgt ? Math.round(tgt).toLocaleString() : '-'}</td>
      <td>${exvat ? Math.round(exvat).toLocaleString() : '-'}</td>
      <td style="${pctBg(exvat, tgt)}">${fmtPct(exvat, tgt)}</td>
      <td>${outlet || '-'}</td>
      <td>${(ranVan === null || Math.round(ranVan) < 1) ? 1 : Math.round(ranVan).toLocaleString()}</td>
      <td>${skuPerStore ? Math.max(1, Math.round(skuPerStore)).toLocaleString() : '-'}</td>
      <td>${allSku || '-'}</td>
      <td>${skuPt ? Math.round(skuPt).toLocaleString() : '-'}</td>
    </tr>`;
  });

  // totRanVan สะสมจาก forEach แล้ว
  const totSkuPerStore = totSkuPerStoreSum;
  bodyHtml += `<tr class="sum-row">
    <td style="text-align:left"><b>รวม</b></td>
    <td>${totTgt ? Math.round(totTgt).toLocaleString() : '-'}</td>
    <td>${totActual ? Math.round(totActual).toLocaleString() : '-'}</td>
    <td style="${pctBg(totActual, totTgt)}">${fmtPct(totActual, totTgt)}</td>
    <td>${totOutlet.toLocaleString()}</td>
    <td>${totRanVan ? Math.round(totRanVan).toLocaleString() : '-'}</td>
    <td>${totSkuPerStore ? Math.round(totSkuPerStore).toLocaleString() : '-'}</td>
    <td>${totAllSku.toLocaleString()}</td>
    <td>${totSkuPt ? Math.round(totSkuPt).toLocaleString() : '-'}</td>
  </tr>`;

  el.innerHTML = `<div class="tbl-wrap"><table class="rtbl">
<thead>
<tr class="r-title">
  <th colspan="4" style="text-align:left;font-size:15px">Rattana Online Order (ROO)</th>
  <th style="font-size:12px">Time Used</th><th style="font-size:12px">Week</th><th style="font-size:12px">วันที่</th><th style="font-size:12px">วันทำงาน<br>ทั้งหมด</th><th style="font-size:12px">วันทำงาน<br>เหลือ</th>
</tr>
<tr style="background:#e8f0fe;color:var(--navy);font-weight:700;text-align:center">
  <td colspan="4"></td>
  <td>${wd.pct.toFixed(0)}%</td>
  <td>${wd.weekOfMonth}</td>
  <td>${wd.dateStr}</td>
  <td>${wd.totalWork}</td>
  <td>${wd.remaining}</td>
</tr>
<tr class="r-h1">
  <th style="text-align:left"></th>
  <th>เป้าหมาย</th><th>ทำได้</th><th>%</th>
  <th>Outlet</th><th>ร้าน/วัน</th><th>SKU/ร้าน</th><th>All SKU</th><th>SKU Point</th>
</tr>
</thead>
<tbody>${bodyHtml}</tbody>
</table></div>`;
}

/* ================= W1 SALES RSP TABLE ================= */
function renderW1() {
  const el = document.getElementById('w1Content');
  if (!el) return;
  const w1Raw = state.w1Raw || [];
  const bpRaw = state.bpRaw || [];
  if (!w1Raw.length) { el.innerHTML = ''; return; }

  const lbp = state.latestBpMonth;
  const wd  = getWorkingDaysInfo(getWdMonth());

  // Build BP index by Sale NO ROO — matched against ชื่อ-นามสกุล in W1 sheet
  const bpIdx = new Map(); // saleNo → {exvat, prodSet, dates}
  const bpOutletIdx = new Map(); // saleNo → {custs:Set, custSkuMap:Map, prodRankMap:Map}
  bpRaw.forEach(r => {
    if (!lbp) return;
    const d = bpMonthYear(r['Doc_Date']);
    if (!d || d.mm !== lbp.mm || d.yyyy !== lbp.yyyy) return;
    const saleNo   = normalizeText(String(r['Sale NO ROO']||'').trim()).toLowerCase();
    const custCode = String(r['Customer_Code']||'').trim();
    const prod     = String(r['Product_Name']||'').trim();
    const date     = String(r['Doc_Date']||'').trim();
    const exvat    = parseNum(r['EXVat+CN*2']);
    const skuRank  = String(r['SKU Point']||'').trim();
    if (!saleNo) return;
    // index ทำได้/dates by Sale NO ROO
    if (!bpIdx.has(saleNo)) bpIdx.set(saleNo, {exvat:0, prodSet:new Set(), dates:new Set()});
    const e = bpIdx.get(saleNo);
    e.exvat += exvat;
    if (prod) e.prodSet.add(prod);
    if (date) e.dates.add(date);
    // index Outlet/SKU by Sale NO ROO
    if (!bpOutletIdx.has(saleNo)) bpOutletIdx.set(saleNo, {custs:new Set(), custSkuMap:new Map(), prodRankMap:new Map(), rankCountMap:new Map()});
    const oe = bpOutletIdx.get(saleNo);
    if (custCode) oe.custs.add(custCode); // no exvat filter for outlet
    if (custCode && prod) {
      if (!oe.custSkuMap.has(custCode)) oe.custSkuMap.set(custCode, new Map());
      const cm = oe.custSkuMap.get(custCode);
      if (!cm.has(prod) || (!cm.get(prod) && skuRank)) cm.set(prod, skuRank);
    }
    if (exvat > 0) {
      if (prod && skuRank && !oe.prodRankMap.has(prod)) oe.prodRankMap.set(prod, skuRank);
      // COUNTA per rank (ทุก row ไม่ deduplicate)
      if (skuRank) oe.rankCountMap.set(skuRank, (oe.rankCountMap.get(skuRank) || 0) + 1);
    }
  });

  const SKU_SCORE = {A:1,B:5,C:10,D:20,E:30,F:30,New:50};

  // Enrich W1 rows
  const dataRows = w1Raw.filter(r => String(r['ชื่อ-นามสกุล']||'').trim());
  const enriched = dataRows.map(r => {
    const name   = String(r['ชื่อ-นามสกุล']||'').trim();
    const norm   = normalizeText(name).toLowerCase();
    const tgt    = parseNum(r['เป้าหมาย']);
    const bp     = bpIdx.get(norm) || {exvat:0, prodSet:new Set(), dates:new Set()};
    const actual = bp.exvat;
    const oe     = bpOutletIdx.get(norm) || {custs:new Set(), custSkuMap:new Map(), prodRankMap:new Map()};
    const outlet = oe.custs.size;
    const allSku = bp.prodSet.size;
    const daysUsed     = Math.max(1, wd.totalWork - wd.remaining);
    const ranVan       = outlet > 0 ? outlet / daysUsed : 0;
    // SKU/ร้าน = Σ(unique prod per cust) / จำนวน cust ที่มี SKU
    const sumSkuPerCust= Array.from(oe.custSkuMap.values()).reduce((s,m)=>s+m.size,0);
    const skuPerStore  = oe.custSkuMap.size > 0 ? sumSkuPerCust / oe.custSkuMap.size : 0;
    // SKU Point = Σ (COUNTA per rank × score) (A=1,B=5,C=10,D=20,E=30,F=30,New=50)
    let skuPt = 0;
    oe.rankCountMap.forEach((count, rank) => { skuPt += count * (SKU_SCORE[rank] || 0); });
    const pct    = tgt > 0 ? actual / tgt * 100 : 0;
    return { ...r, _actual:actual, _outlet:outlet, _ranVan:ranVan, _skuPerStore:skuPerStore, _allSku:allSku, _skuPt:skuPt, _pct:pct, _tgt:tgt };
  });

  // RANK per warehouse+Channal by % desc
  const whRankGroups = new Map();
  enriched.forEach(r => {
    const w = String(r['คลัง']||'').trim() + '|' + String(r['Channal']||'').trim();
    if (!whRankGroups.has(w)) whRankGroups.set(w, []);
    whRankGroups.get(w).push(r);
  });
  whRankGroups.forEach(rows => {
    const byPct = [...rows].sort((a,b) => b._pct - a._pct);
    byPct.forEach((r,i) => r._rank = i+1);
  });

  // Display order: group by Channal, sort by รหัสเซลล์
  const channalGroups = {};
  enriched.forEach(r => { const ch = String(r['Channal']||'').trim(); if(!channalGroups[ch]) channalGroups[ch]=[]; channalGroups[ch].push(r); });
  const sortedEnriched = [];
  Object.values(channalGroups).forEach(grp => {
    const byCode = [...grp].sort((a,b) => String(a['รหัสเซลล์']||'').localeCompare(String(b['รหัสเซลล์']||'')));
    byCode.forEach(r => sortedEnriched.push(r));
  });

  const GOLD='#c9a84c', NAVY='#0d1b3e', TEAL='#1B9EB5', TEAL_DARK='#000', COL_HDR='#b2e4ef', BORDER='#000';
  const pctColor = p => '#000';
  const pctBg    = p => p >= wd.pct ? '#d4f4e1' : '#fde8e8';
  const rankColor= r => r===1?'#155724':r===2?'#856404':r===3?'#721c24':r===4?'#0d4a8a':r===5?'#5b2d8e':r===6?'#9b2458':r===7?'#721c24':r===8?'#0a3d1f':'#555';
  const rankBg   = r => r===1?'#c8ecd4':r===2?'#fff3cd':r===3?'#fdd9d7':r===4?'#d0e8ff':r===5?'#e8d5f5':r===6?'#fde0ec':r===7?'#f5b7b1':r===8?'#a8d5b5':'transparent';
  const fmtN = v => v ? Math.round(v).toLocaleString() : '-';
  const th = (txt, extra='') => `<th style="background:${COL_HDR};color:${NAVY};font-weight:700;text-align:center;padding:7px 8px;border:1px solid ${BORDER};white-space:nowrap${extra}">${txt}</th>`;
  const thHdr = (txt, extra='') => `<th style="background:${TEAL};color:#000;font-weight:600;font-size:12px;text-align:center;padding:6px 8px;border:1px solid ${TEAL_DARK}${extra}">${txt}</th>`;
  const tdVal = (txt, extra='') => `<td style="background:${TEAL};color:#000;font-weight:700;font-size:13px;text-align:center;padding:6px 8px;border:1px solid ${TEAL_DARK}${extra}">${txt}</td>`;

  let bodyHtml = '', lastCh = '';
  sortedEnriched.forEach(r => {
    const ch = String(r['Channal']||'').trim();
    if (ch !== lastCh) {
      lastCh = ch;
    }
    bodyHtml += `<tr style="border-bottom:1px solid #000">
      <td style="text-align:center;padding:7px 8px;border:1px solid #000">${r['ลำดับ']||''}</td>
      <td style="padding:7px 8px;border:1px solid #000">${r['Channal']||''}</td>
      <td style="padding:7px 8px;border:1px solid #000">${r['ผู้ดูแล']||''}</td>
      <td style="text-align:left;padding:7px 8px;border:1px solid #000">${r['ชื่อ-นามสกุล']||''}</td>
      <td style="font-family:monospace;font-weight:400;text-align:center;padding:7px 8px;border:1px solid #000">${r['รหัสเซลล์']||''}</td>
      <td style="text-align:center;padding:7px 8px;border:1px solid #000">${r['BU']||''}</td>
      <td style="text-align:center;padding:7px 8px;border:1px solid #000">${r['คลัง']||''}</td>
      <td style="text-align:right;padding:7px 8px;border:1px solid #000">${r._tgt ? Math.round(r._tgt).toLocaleString() : '-'}</td>
      <td style="text-align:right;padding:7px 8px;border:1px solid #000">${fmtN(r._actual)}</td>
      <td style="text-align:center;padding:7px 8px;border:1px solid #000;background:${pctBg(r._pct)};color:${pctColor(r._pct)};font-weight:700">${r._tgt ? r._pct.toFixed(2)+'%' : '-'}</td>
      <td style="text-align:right;padding:7px 8px;border:1px solid #000">${r._outlet || '-'}</td>
      <td style="text-align:right;padding:7px 8px;border:1px solid #000">${r._ranVan ? r._ranVan.toFixed(1) : '-'}</td>
      <td style="text-align:right;padding:7px 8px;border:1px solid #000">${r._skuPerStore ? r._skuPerStore.toFixed(1) : '-'}</td>
      <td style="text-align:right;padding:7px 8px;border:1px solid #000">${r._allSku || '-'}</td>
      <td style="text-align:right;padding:7px 8px;border:1px solid #000">${r._skuPt ? Math.round(r._skuPt).toLocaleString() : '-'}</td>
      <td style="text-align:center;padding:7px 8px;border:1px solid #000;background:${rankBg(r._rank)};color:${rankColor(r._rank)};font-weight:700">${r._rank||''}</td>
    </tr>`;
  });

  el.innerHTML = `<div class="tbl-wrap"><table style="width:100%;border-collapse:collapse;font-size:12px;white-space:nowrap">
<thead>
  <tr>
    <th colspan="11" rowspan="2" style="background:${GOLD};color:${NAVY};font-weight:700;font-size:18px;padding:10px 14px;border:1px solid #000;letter-spacing:1px;vertical-align:middle">SALES RSP สำนักงานใหญ่</th>
    ${thHdr('Time Used')}${thHdr('Week')}${thHdr('วันที่')}${thHdr('วันทำงาน<br>ทั้งหมด')}${thHdr('วันทำงาน<br>เหลือ')}
  </tr>
  <tr>
    ${tdVal(fmtNum(wd.pct,0)+'%')}${tdVal(wd.weekOfMonth)}${tdVal(wd.dateStr||'')}${tdVal(wd.totalWork)}${tdVal(wd.remaining)}
  </tr>
  <tr>
    ${th('ลำดับ')}${th('Channal')}${th('ผู้ดูแล')}${th('ชื่อ-นามสกุล',';text-align:left')}${th('รหัสเซลล์')}${th('BU')}${th('คลัง')}
    ${th('เป้าหมาย',';text-align:right')}${th('ทำได้',';text-align:right')}${th('%')}${th('Outlet',';text-align:right')}
    ${th('ร้าน/วัน',';text-align:right')}${th('SKU/ร้าน',';text-align:right')}${th('All SKU',';text-align:right')}${th('SKU Point',';text-align:right')}${th('RANK')}
  </tr>
</thead>
<tbody>${bodyHtml}</tbody>
</table></div>`;
}

/* ================= RSP ส่ง TABLE ================= */
function renderRSP() {
  const el = document.getElementById('rspContent');
  if (!el) return;
  const rspRaw = state.rspRaw || [];
  const bpRaw  = state.bpRaw  || [];
  if (!rspRaw.length) { el.innerHTML = `<div style="padding:24px;color:#b00">ไม่พบข้อมูล sheet "${RSP_SHEET_NAME}" (rspRaw=0 rows)</div>`; return; }
  const dataRows0 = rspRaw.filter(r => String(r['ชื่อ-นามสกุล']||'').trim());
  if (!dataRows0.length) { el.innerHTML = `<div style="padding:24px;color:#b00">โหลดได้ ${rspRaw.length} แถว แต่ไม่พบคอลัมน์ "ชื่อ-นามสกุล" — columns: ${Object.keys(rspRaw[0]||{}).join(', ')}</div>`; return; }

  const lbp = state.latestBpMonth;
  const wd  = getWorkingDaysInfo(getWdMonth());

  // Build NL SKU/ร้าน + All SKU index: Salesman Code → {skuPerStore, allSku}
  const nlSkuIdx = new Map();
  (state.nlSkuRaw || []).forEach(r => {
    const code        = String(r['Salesman Code']||'').trim().toUpperCase();
    const skuPerStore = parseNum(r['SKU/ร้าน']||'');
    const vals        = Object.values(r);
    const allSkuVal   = parseNum(vals[vals.length - 2] || ''); // AH = second-to-last col
    if (code && code !== '-') nlSkuIdx.set(code, {skuPerStore, allSku: allSkuVal});
  });

  // Build CG SKU/ร้าน + All SKU index: SalesRep → {skuPerStore, allSku}
  const cgSkuIdx = new Map();
  (state.cgSkuRaw || []).forEach(r => {
    const code       = String(r['SalesRep']||'').trim().toUpperCase();
    const skuPerStore= parseNum(r['SKU/ร้าน']||'');
    const allSkuVal  = parseNum(Object.values(r).slice(-1)[0]||''); // BI = last col = COUNTUNIQUE Material
    if (code && code !== '-') cgSkuIdx.set(code, {skuPerStore, allSku: allSkuVal});
  });

  // Build NL index: Salesman Code → บาท
  const nlRaw2 = state.nlRaw || [];
  const nlIdx = new Map(); // code → {baht, store, ranVan, sku}
  nlRaw2.forEach(r => {
    const code        = String(r['Salesman Code']||'').trim().toUpperCase();
    const baht        = parseNum(r['บาท']||'');
    const store       = parseNum(r['ร้าน']||'');
    const sku         = parseNum(r['sku']||r['SKU']||'');
    const skuPerStore = parseNum(r['SKU/ร้าน']||'');
    if (code && code !== '-' && code !== '–') nlIdx.set(code, {baht, store, ranVan:0, sku, skuPerStore});
  });

  // Build CG index: SalesRep → {baht, store, ranVan, sku}
  const cgIdx = new Map();
  (state.cgRaw || []).forEach(r => {
    const code   = String(r['SalesRep']||'').trim().toUpperCase();
    const ranVan = parseNum(r['ร้าน/วัน']||'');
    const baht   = parseNum(r['SUM ของ Net Val']||r['SUM of Net Val']||Object.values(r)[3]||'');
    const store  = parseNum(r['ร้าน']||'');
    const sku    = parseNum(r['sku']||r['SKU']||'');
    if (code && code !== '-' && code !== '–') cgIdx.set(code, {baht, store, ranVan, sku});
  });

  // Build BP index by Sale NO ROO (same logic as renderW1)
  const bpIdx      = new Map(); // norm → {exvat, dates}
  const bpOutletIdx= new Map(); // norm → {custs, custSkuMap, prodRankMap}
  const SKU_SCORE  = {A:1,B:5,C:10,D:20,E:30,F:30,New:50};

  bpRaw.forEach(r => {
    if (!lbp) return;
    const d = bpMonthYear(r['Doc_Date']);
    if (!d || d.mm !== lbp.mm || d.yyyy !== lbp.yyyy) return;
    const sn      = String(r['Salesman_Name']||'').trim();
    const norm    = normalizeText(sn).toLowerCase();
    const saleNo  = normalizeText(String(r['Sale NO ROO']||'').trim()).toLowerCase();
    const custCode= String(r['Customer_Code']||'').trim();
    const prod    = String(r['Product_Name']||'').trim();
    const date    = String(r['Doc_Date']||'').trim();
    const exvat   = parseNum(r['EXVat']);
    const skuRank = String(r['SKU Point']||'').trim();
    if (saleNo) {
      if (!bpIdx.has(saleNo)) bpIdx.set(saleNo, {exvat:0, dates:new Set()});
      const e = bpIdx.get(saleNo);
      e.exvat += exvat;
      if (date) e.dates.add(date);
    }
    if (saleNo) {
      if (!bpOutletIdx.has(saleNo)) bpOutletIdx.set(saleNo, {custs:new Set(), custSkuMap:new Map(), prodSet:new Set(), rankCountMap:new Map()});
      const oe = bpOutletIdx.get(saleNo);
      if (custCode) oe.custs.add(custCode);
      if (custCode && prod) {
        if (!oe.custSkuMap.has(custCode)) oe.custSkuMap.set(custCode, new Set());
        oe.custSkuMap.get(custCode).add(prod);
      }
      if (prod) oe.prodSet.add(prod);
      if (exvat > 0 && skuRank) oe.rankCountMap.set(skuRank, (oe.rankCountMap.get(skuRank)||0) + 1);
    }
  });

  const dataRows = rspRaw.filter(r => String(r['ชื่อ-นามสกุล']||'').trim());
  const daysUsed = Math.max(1, wd.totalWork - wd.remaining);
  const enriched = dataRows.map(r => {
    const name    = String(r['ชื่อ-นามสกุล']||'').trim();
    const norm    = normalizeText(name).toLowerCase();
    const tgt     = parseNum(r['เป้าหมาย']);
    const rscode  = String(r['รหัสเซลล์']||'').trim().toUpperCase();
    const bp      = bpIdx.get(norm) || {exvat:0, dates:new Set()};
    const oe      = bpOutletIdx.get(norm) || {custs:new Set(), custSkuMap:new Map(), prodRankMap:new Map()};
    const nlEntry = nlIdx.get(rscode) || {baht:0, store:0};
    const cgEntry = cgIdx.get(rscode) || {baht:0, store:0};
    const extSrc  = nlEntry.baht > 0 ? nlEntry : cgEntry.baht > 0 ? cgEntry : {baht:0, store:0};
    const actual  = bp.exvat > 0 ? bp.exvat : extSrc.baht;
    const outlet= oe.custs.size > 0 ? oe.custs.size : extSrc.store;
    const allSku= oe.prodSet && oe.prodSet.size > 0 ? oe.prodSet.size : extSrc.sku;
    const ranVan= outlet > 0 ? outlet / daysUsed
                : extSrc.ranVan > 0 ? extSrc.ranVan
                : 0;
    const sumSkuPerCust = Array.from(oe.custSkuMap.values()).reduce((s,st)=>s+st.size,0);
    const custWithSku   = oe.custSkuMap.size;
    const bpSkuPerStore = custWithSku > 0 ? sumSkuPerCust / custWithSku : 0;
    const nlSkuEntry    = nlSkuIdx.get(rscode);
    const cgSkuEntry    = cgSkuIdx.get(rscode);
    const skuPerStore   = nlSkuEntry?.skuPerStore > 0       ? nlSkuEntry.skuPerStore
                        : cgSkuEntry?.skuPerStore > 0       ? cgSkuEntry.skuPerStore
                        : bpSkuPerStore;
    const nlAllSku      = nlIdx.get(rscode)?.sku || 0;
    const allSkuFinal   = nlAllSku > 0            ? nlAllSku
                        : cgSkuEntry?.allSku > 0  ? cgSkuEntry.allSku
                        : allSku;
    const allSkuBp      = oe.prodSet ? oe.prodSet.size : 0;
    let skuPt = 0;
    if (oe.rankCountMap) oe.rankCountMap.forEach((count, rank) => { skuPt += count * (SKU_SCORE[rank]||0); });
    const pct = tgt > 0 ? actual / tgt * 100 : 0;
    return { ...r, _actual:actual, _outlet:outlet, _ranVan:ranVan, _skuPerStore:skuPerStore, _allSku:allSkuFinal, _skuPt:skuPt, _pct:pct, _tgt:tgt };
  });

  // RANK per warehouse+Channal by % desc
  const whGroups = new Map();
  enriched.forEach(r => {
    const w = String(r['คลัง']||'').trim() + '|' + String(r['Channal']||'').trim();
    if (!whGroups.has(w)) whGroups.set(w, []);
    whGroups.get(w).push(r);
  });
  whGroups.forEach(rows => {
    const byPct = [...rows].sort((a,b) => b._pct - a._pct);
    byPct.forEach((r,i) => r._rank = i+1);
  });

  const GOLD='#c9a84c', NAVY='#0d1b3e', TEAL='#1B9EB5', TEAL_DARK='#000', COL_HDR='#b2e4ef', BORDER='#000';
  const pctColor = p => p>=wd.pct?'#155724':'#721c24';
  const pctBg    = p => p>=wd.pct?'#d4edda':'#f8d7da';
  const rankColor= r => r===1?'#155724':r===2?'#856404':r===3?'#721c24':r===4?'#0d4a8a':r===5?'#5b2d8e':r===6?'#9b2458':r===7?'#721c24':r===8?'#0a3d1f':'#555';
  const rankBg   = r => r===1?'#c8ecd4':r===2?'#fff3cd':r===3?'#fdd9d7':r===4?'#d0e8ff':r===5?'#e8d5f5':r===6?'#fde0ec':r===7?'#f5b7b1':r===8?'#a8d5b5':'transparent';
  const th = (txt,extra='') => `<th style="background:${COL_HDR};color:${NAVY};font-weight:700;text-align:center;padding:7px 8px;border:1px solid ${BORDER};white-space:nowrap${extra}">${txt}</th>`;
  const thHdr=(txt,extra='')=>`<th style="background:${TEAL};color:#000;font-weight:600;font-size:12px;text-align:center;padding:6px 8px;border:1px solid ${TEAL_DARK}${extra}">${txt}</th>`;
  const tdVal=(txt,extra='')=>`<td style="background:${TEAL};color:#000;font-weight:700;font-size:13px;text-align:center;padding:6px 8px;border:1px solid ${TEAL_DARK}${extra}">${txt}</td>`;
  const fmtN = v => v ? Math.round(v).toLocaleString() : '-';

  const whRowColor = wh => wh==='W1'?'rgba(255,220,50,.07)':wh==='W2'?'rgba(100,180,255,.07)':wh==='W3'?'rgba(255,120,80,.06)':wh==='W4'?'rgba(46,204,113,.06)':'';
  let bodyHtml = '';
  enriched.forEach(r => {
    const p = r._pct, outlet = r._outlet;
    const rowBg = whRowColor(String(r['คลัง']||'').trim());
    bodyHtml += `<tr style="border-bottom:1px solid #000;font-weight:400;${rowBg?`background:${rowBg}`:''}">
      <td style="text-align:center;padding:7px 8px;border:1px solid #000">${r['ลำดับ']||''}</td>
      <td style="text-align:left;padding:7px 8px;border:1px solid #000">${r['Channal']||''}</td>
      <td style="text-align:left;padding:7px 8px;border:1px solid #000">${r['ผู้ดูแล']||''}</td>
      <td style="text-align:left;padding:7px 8px;border:1px solid #000">${r['ชื่อ-นามสกุล']||''}</td>
      <td style="text-align:center;padding:7px 8px;border:1px solid #000">${r['รหัสเซลล์']||''}</td>
      <td style="text-align:center;padding:7px 8px;border:1px solid #000">${r['BU']||''}</td>
      <td style="text-align:center;padding:7px 8px;border:1px solid #000">${r['คลัง']||''}</td>
      <td style="text-align:right;padding:7px 8px;border:1px solid #000">${r._tgt?Math.round(r._tgt).toLocaleString():'-'}</td>
      <td style="text-align:right;padding:7px 8px;border:1px solid #000">${r._actual?Math.round(r._actual).toLocaleString():'-'}</td>
      <td style="text-align:center;padding:7px 8px;border:1px solid #000;font-weight:400;color:${pctColor(p)};background:${pctBg(p)}">${p?p.toFixed(2)+'%':'-'}</td>
      <td style="text-align:center;padding:7px 8px;border:1px solid #000">${outlet||'-'}</td>
      <td style="text-align:center;padding:7px 8px;border:1px solid #000">${r._ranVan?r._ranVan.toFixed(1):'-'}</td>
      <td style="text-align:center;padding:7px 8px;border:1px solid #000">${r._skuPerStore?Math.round(r._skuPerStore):'-'}</td>
      <td style="text-align:center;padding:7px 8px;border:1px solid #000">${r._allSku||'-'}</td>
      <td style="text-align:center;padding:7px 8px;border:1px solid #000">${r._skuPt?Math.round(r._skuPt).toLocaleString():'-'}</td>
      <td style="text-align:center;padding:7px 8px;border:1px solid #000;font-weight:700;color:${rankColor(r._rank)};background:${rankBg(r._rank)}">${r._rank||'-'}</td>
    </tr>`;
  });

  el.innerHTML = `<style>.rtbl-thin tbody td{font-weight:400!important}</style><div class="tbl-wrap"><table class="rtbl rtbl-thin" style="width:100%">
<thead>
<tr>
  <th colspan="11" rowspan="2" style="background:${GOLD};color:${NAVY};font-weight:700;font-size:15px;text-align:center;padding:10px 16px;border:1px solid #000">SALES RSP (ร้านค้าส่ง)</th>
  ${thHdr('Time Used')}${thHdr('Week')}${thHdr('วันที่')}${thHdr('วันทำงาน<br>ทั้งหมด')}${thHdr('วันทำงาน<br>เหลือ')}
</tr>
<tr>
  ${tdVal(fmtN(wd.pct)+'%')}${tdVal(wd.weekOfMonth)}${tdVal(wd.dateStr||'')}${tdVal(wd.totalWork)}${tdVal(wd.remaining)}
</tr>
<tr>
  ${th('ลำดับ')}${th('Channal')}${th('ผู้ดูแล')}${th('ชื่อ-นามสกุล','text-align:left')}${th('รหัสเซลล์')}${th('BU')}${th('คลัง')}${th('เป้าหมาย')}${th('ทำได้')}${th('%')}${th('ร้านค้า')}${th('ร้าน/วัน')}${th('SKU/ร้าน')}${th('All SKU')}${th('SKU Point')}${th('RANK')}
</tr>
</thead>
<tbody>${bodyHtml}</tbody>
</table></div>`;
}

/* ================= SUP TAB ================= */
function renderSup() {
  const el = document.getElementById('supContent');
  if (!el) return;
  const supRaw = state.supRaw || [];
  const bpRaw  = state.bpRaw  || [];
  if (!supRaw.length) { el.innerHTML = '<p class="txt-muted" style="padding:16px">ไม่มีข้อมูล Sup</p>'; return; }

  const lbp = state.latestBpMonth;
  const thaiMonths = ['','มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
  const dataMonth = lbp ? ((thaiMonths[lbp.mm]||'')+' '+(lbp.yyyy+543)) : '';
  const wd = getWorkingDaysInfo(dataMonth);

  const TEAL      = '#1B9EB5';
  const TEAL_DARK = '#000';
  const TEAL_LIGHT= '#d0f0f7';
  const COL_HDR   = '#b2e4ef';
  const BORDER    = '#000';

  const S = {
    tbl:   'border-collapse:collapse;font-size:13px;white-space:nowrap',
    thHdr: `background:${TEAL};color:#000;font-weight:700;font-size:15px;padding:10px 14px;border:1px solid ${TEAL_DARK}`,
    thHdrMeta: `background:${TEAL};color:#000;font-weight:600;font-size:12px;text-align:center;padding:6px 8px;border:1px solid ${TEAL_DARK}`,
    thHdrMetaVal: `background:${TEAL};color:#000;font-weight:700;font-size:13px;text-align:center;padding:6px 8px;border:1px solid ${TEAL_DARK}`,
    thCol:  `background:${COL_HDR};color:#0d1b3e;font-weight:700;text-align:center;padding:8px 10px;border:1px solid ${BORDER}`,
    tdMain: `background:${TEAL_LIGHT};color:#0d1b3e;font-weight:700;text-align:center;padding:8px 10px;border:1px solid ${BORDER};vertical-align:middle`,
    tdCh:   `background:#fff;color:#0d1b3e;text-align:center;padding:8px 10px;border:1px solid ${BORDER};vertical-align:middle`,
    tdBu:   `color:#0d1b3e;padding:8px 10px;border:1px solid ${BORDER}`,
    tdNum:  `color:#0d1b3e;text-align:right;padding:8px 10px;border:1px solid ${BORDER}`,
    tdFoot: `background:${TEAL_LIGHT};color:#000;font-weight:700;text-align:center;padding:9px 10px;border:1px solid ${TEAL_DARK}`,
    tdFootNum: `background:${TEAL_LIGHT};color:#000;font-weight:700;text-align:right;padding:9px 10px;border:1px solid ${TEAL_DARK}`,
    tdNote: `background:#e8e8e8;color:#555;text-align:center;font-style:italic;font-size:12px;padding:6px;border:1px solid #ccc`,
  };

  // build BP index: wh||ch||bu for sales/custs; saleRooIdx for SKU/ร้าน per person
  const bpIdx = new Map();
  const saleRooIdx = new Map(); // Sale NO ROO → { custs: Set, custSkuMap: Map(cust→Set(prod)) }
  bpRaw.forEach(r => {
    if (!lbp) return;
    const d = bpMonthYear(r['Doc_Date']);
    if (!d || d.mm !== lbp.mm || d.yyyy !== lbp.yyyy) return;
    const wh   = String(r['WS']||'').trim().toUpperCase();
    const ch   = String(r['Channal']||r['Channel']||'').trim();
    const bu   = String(r['Cat_BU']||'').trim();
    const roo  = String(r['Sale NO ROO']||'').trim();
    const cust = String(r['Customer_Code']||'').trim();
    const prod = String(r['Product_Name']||'').trim();
    if (wh && ch && bu) {
      const addTo = key => {
        if (!bpIdx.has(key)) bpIdx.set(key, {sales:0, custs:new Set()});
        const e = bpIdx.get(key);
        e.sales += parseNum(r['EXVat']);
        if (cust) e.custs.add(cust);
      };
      addTo(wh + '||' + ch + '||' + bu);
    }
    // SKU/ร้าน per Sale NO ROO
    if (roo && cust && prod) {
      if (!saleRooIdx.has(roo)) saleRooIdx.set(roo, { custs: new Set(), custSkuMap: new Map() });
      const e = saleRooIdx.get(roo);
      e.custs.add(cust);
      if (!e.custSkuMap.has(cust)) e.custSkuMap.set(cust, new Set());
      e.custSkuMap.get(cust).add(prod);
    }
  });

  // parse sup rows: r[''] = section code, forward-fill Main CH and CH
  const whMap = new Map();
  let lastMainCh = '', lastCh = '';
  supRaw.forEach(r => {
    const sec    = String(r['']||'').trim();                   // "ST","W1","W3","W4"
    const mainCh = String(r['Main CH']||'').trim() || lastMainCh;
    const ch     = String(r['CH']||'').trim() || lastCh;
    const bu     = String(r['BU']||'').trim();
    const target = parseNum(r['Target']||0);
    if (mainCh) lastMainCh = mainCh;
    if (ch)     lastCh     = ch;
    if (!sec || !bu) return;
    if (!whMap.has(sec)) whMap.set(sec, []);
    whMap.get(sec).push({mainCh, ch, bu, target});
  });

  // combine all sections into one enriched list (preserve order)
  const allEnriched = [];
  whMap.forEach((rows, sec) => {
    rows.forEach(r => {
      const key    = sec + '||' + r.ch + '||' + r.bu;
      const bp     = bpIdx.get(key) || {sales:0, custs:new Set()};
      const actual = bp.sales;
      const custs  = bp.custs.size;
      const pct    = r.target > 0 ? actual/r.target*100 : (actual > 0 ? 100 : 0);
      allEnriched.push({...r, actual, custs, pct});
    });
  });

  const totalTarget = allEnriched.reduce((s,r)=>s+r.target, 0);
  const totalActual = allEnriched.reduce((s,r)=>s+r.actual, 0);
  const totalPct    = totalTarget > 0 ? totalActual/totalTarget*100 : null;
  const totalCusts  = allEnriched.reduce((s,r)=>s+r.custs, 0);

  // build Sale NO ROO table: per person SKU/ร้าน = Σ(unique prod per cust) / unique cust count
  const saleRooRows = [];
  saleRooIdx.forEach((e, roo) => {
    let totalSku = 0;
    e.custSkuMap.forEach(skuSet => { totalSku += skuSet.size; });
    const custCount  = e.custSkuMap.size;
    const skuPerStore = custCount > 0 ? totalSku / custCount : 0;
    saleRooRows.push({ roo, custCount, totalSku, skuPerStore });
  });
  saleRooRows.sort((a,b) => b.skuPerStore - a.skuPerStore);

  // group mainCh -> ch -> [buRows]
  const mainChMap = new Map();
  allEnriched.forEach(r => {
    if (!mainChMap.has(r.mainCh)) mainChMap.set(r.mainCh, new Map());
    const chMap = mainChMap.get(r.mainCh);
    if (!chMap.has(r.ch)) chMap.set(r.ch, []);
    chMap.get(r.ch).push(r);
  });

  let bodyHtml = '';
  mainChMap.forEach((chMap, mainCh) => {
    let mainChSpan = 0;
    chMap.forEach(rows => mainChSpan += rows.length);
    let firstMainCh = true;
    chMap.forEach((buRows, ch) => {
      let firstCh = true;
      buRows.forEach(r => {
        const pctColor = r.pct >= wd.pct ? '#155724' : '#721c24';
        const pctBg    = r.pct >= wd.pct ? '#d4edda' : '#f8d7da';
        bodyHtml += `<tr>
          ${firstMainCh ? `<td rowspan="${mainChSpan}" style="${S.tdMain}">${mainCh}</td>` : ''}
          ${firstCh     ? `<td rowspan="${buRows.length}" style="${S.tdCh}">${ch}</td>` : ''}
          <td style="${S.tdBu}">${r.bu}</td>
          <td style="${S.tdNum}">${r.target > 0 ? fmtNum(r.target) : ''}</td>
          <td style="${S.tdNum}">${r.actual > 0 ? fmtNum(Math.round(r.actual)) : ''}</td>
          <td style="${S.tdNum};background:${pctBg};color:${pctColor};font-weight:600">${r.target > 0 ? fmtNum(r.pct,2)+'%' : ''}</td>
          <td style="${S.tdNum}">${r.custs > 0 ? r.custs : ''}</td>
        </tr>`;
        firstMainCh = false;
        firstCh = false;
      });
    });
  });

  const totPctColor = totalPct === null ? '#fff' : totalPct >= 100 ? '#90ffbe' : totalPct >= wd.pct ? '#ffe082' : '#ff8a8a';
  const whKeys = [...whMap.keys()].filter(k => k !== 'ST');
  const title  = whKeys.length ? 'RSP ' + whKeys.join('/') : 'RSP';

  el.innerHTML = `
  <div style="overflow-x:auto;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.1)">
    <table style="${S.tbl}">
      <thead>
        <tr>
          <th colspan="3" rowspan="2" style="${S.thHdr};font-size:20px;letter-spacing:1px">${title}</th>
          <th style="${S.thHdrMeta}">Time Used</th>
          <th style="${S.thHdrMeta}">Week</th>
          <th style="${S.thHdrMeta}">วันที่</th>
          <th style="${S.thHdrMeta}">วันทำงานทั้งหมด</th>
        </tr>
        <tr>
          <td style="${S.thHdrMetaVal}">${fmtNum(wd.pct,0)}%</td>
          <td style="${S.thHdrMetaVal}">${wd.weekOfMonth}</td>
          <td style="${S.thHdrMetaVal}">${wd.dateStr||''}</td>
          <td style="${S.thHdrMetaVal}">${wd.totalWork}</td>
        </tr>
        <tr>
          <th style="${S.thCol}">Main CH</th>
          <th style="${S.thCol}">CH</th>
          <th style="${S.thCol}">BU</th>
          <th style="${S.thCol}">Target</th>
          <th style="${S.thCol}">Actual</th>
          <th style="${S.thCol}">%</th>
          <th style="${S.thCol}">ร้านค้า</th>
        </tr>
      </thead>
      <tbody>
        ${bodyHtml}
        <tr>
          <td colspan="3" style="${S.tdFoot}">รวม</td>
          <td style="${S.tdFootNum}">${fmtNum(totalTarget)}</td>
          <td style="${S.tdFootNum}">${fmtNum(Math.round(totalActual))}</td>
          <td style="${S.tdFootNum}">${totalPct!==null?fmtNum(totalPct,2)+'%':'-'}</td>
          <td style="${S.tdFootNum}">${totalCusts||0}</td>
        </tr>
        <tr><td colspan="7" style="${S.tdNote}">* รวมยอดขาย ROO *</td></tr>
      </tbody>
    </table>
  </div>
`;
}

/* ================= RSP ปลีก TABLE ================= */
function renderRSPPlik() {
  const el = document.getElementById('rspPlikContent');
  if (!el) return;
  const raw    = state.rspPlikRaw || [];
  const bpRaw  = state.bpRaw || [];
  if (!raw.length) { el.innerHTML = `<div style="padding:24px;color:#b00">ไม่พบข้อมูล sheet "${RSP_PLIK_SHEET_NAME}"</div>`; return; }
  const dataRows0 = raw.filter(r => String(r['ชื่อ-นามสกุล']||'').trim());
  if (!dataRows0.length) { el.innerHTML = `<div style="padding:24px;color:#b00">โหลดได้ ${raw.length} แถว แต่ไม่พบคอลัมน์ "ชื่อ-นามสกุล" — columns: ${Object.keys(raw[0]||{}).join(', ')}</div>`; return; }

  const lbp = state.latestBpMonth;
  const wd  = getWorkingDaysInfo(getWdMonth());
  const SKU_SCORE = {A:1,B:5,C:10,D:20,E:30,F:30,New:50};

  const bpIdx       = new Map();
  const bpOutletIdx = new Map();

  bpRaw.forEach(r => {
    if (!lbp) return;
    const d = bpMonthYear(r['Doc_Date']);
    if (!d || d.mm !== lbp.mm || d.yyyy !== lbp.yyyy) return;
    const saleNo   = normalizeText(String(r['Sale NO ROO']||'').trim()).toLowerCase();
    const custName = String(r['Customer_Name']||'').trim();
    const prod     = String(r['Product_Name']||'').trim();
    const date     = String(r['Doc_Date']||'').trim();
    const exvat    = parseNum(r['EXVat+CN*2']);
    const skuRank  = String(r['SKU Point']||'').trim();
    if (saleNo) {
      if (!bpIdx.has(saleNo)) bpIdx.set(saleNo, {exvat:0, dates:new Set()});
      const e = bpIdx.get(saleNo);
      e.exvat += exvat;
      if (date) e.dates.add(date);
    }
    if (saleNo && exvat > 0) {
      if (!bpOutletIdx.has(saleNo)) bpOutletIdx.set(saleNo, {custs:new Set(), custSkuMap:new Map(), prodRankMap:new Map()});
      const oe = bpOutletIdx.get(saleNo);
      if (custName) oe.custs.add(custName);
      if (prod && skuRank && !oe.prodRankMap.has(prod)) oe.prodRankMap.set(prod, skuRank);
      if (custName && prod) {
        if (!oe.custSkuMap.has(custName)) oe.custSkuMap.set(custName, new Map());
        const cm = oe.custSkuMap.get(custName);
        if (!cm.has(prod) || (!cm.get(prod) && skuRank)) cm.set(prod, skuRank);
      }
    }
  });

  // Build NL/CG SKU indexes (same as renderRSP)
  const nlAllSkuMap = new Map();
  (state.nlRaw || []).forEach(r => {
    const code = String(r['Salesman Code']||'').trim().toUpperCase();
    const sku  = parseNum(r['sku']||r['SKU']||'');
    const baht = parseNum(r['บาท']||'');
    const store= parseNum(r['ร้าน']||'');
    if (code && code !== '-') nlAllSkuMap.set(code, {sku, baht, store});
  });

  const cgBahtMap = new Map();
  (state.cgRaw || []).forEach(r => {
    const code  = String(r['SalesRep']||'').trim().toUpperCase();
    const baht  = parseNum(r['SUM ของ Net Val']||r['SUM of Net Val']||Object.values(r)[3]||'');
    const store = parseNum(r['ร้าน']||'');
    if (code && code !== '-') cgBahtMap.set(code, {baht, store});
  });
  const nlSkuIdx2 = new Map();
  (state.nlSkuRaw || []).forEach(r => {
    const code        = String(r['Salesman Code']||'').trim().toUpperCase();
    const skuPerStore = parseNum(r['SKU/ร้าน']||'');
    const vals        = Object.values(r);
    const allSkuVal   = parseNum(vals[vals.length - 2] || '');
    if (code && code !== '-') nlSkuIdx2.set(code, {skuPerStore, allSku: allSkuVal});
  });
  const cgSkuIdx2 = new Map();
  (state.cgSkuRaw || []).forEach(r => {
    const code        = String(r['SalesRep']||'').trim().toUpperCase();
    const skuPerStore = parseNum(r['SKU/ร้าน']||'');
    const allSkuVal   = parseNum(Object.values(r).slice(-1)[0]||'');
    if (code && code !== '-') cgSkuIdx2.set(code, {skuPerStore, allSku: allSkuVal});
  });

  const dataRows = raw.filter(r => String(r['ชื่อ-นามสกุล']||'').trim());
  const enriched = dataRows.map(r => {
    const name   = String(r['ชื่อ-นามสกุล']||'').trim();
    const norm   = normalizeText(name).toLowerCase();
    const tgt    = parseNum(r['เป้าหมาย']);
    const rscode = String(r['รหัสเซลล์']||'').trim().toUpperCase();
    const bp     = bpIdx.get(norm) || {exvat:0, dates:new Set()};
    const oe     = bpOutletIdx.get(norm) || {custs:new Set(), custSkuMap:new Map(), prodRankMap:new Map()};
    const nlMapEntry    = nlAllSkuMap.get(rscode);
    const cgBahtEntry   = cgBahtMap.get(rscode);
    const actual        = bp.exvat > 0        ? bp.exvat
                        : nlMapEntry?.baht > 0 ? nlMapEntry.baht
                        : cgBahtEntry?.baht    || 0;
    const outlet        = oe.custs.size > 0        ? oe.custs.size
                        : nlMapEntry?.store > 0     ? nlMapEntry.store
                        : cgBahtEntry?.store        || 0;
    const allSku        = oe.prodRankMap.size;
    const daysUsed      = Math.max(1, wd.totalWork - wd.remaining);
    const ranVan        = outlet > 0 ? outlet / daysUsed : 0;
    const sumSkuPerCust = Array.from(oe.custSkuMap.values()).reduce((s,m)=>s+m.size,0);
    const bpSkuPerStore = outlet > 0 ? sumSkuPerCust / outlet : 0;
    const nlEntry2      = nlSkuIdx2.get(rscode);
    const cgEntry2      = cgSkuIdx2.get(rscode);
    const skuPerStore   = nlEntry2?.skuPerStore > 0        ? nlEntry2.skuPerStore
                        : cgEntry2?.skuPerStore > 0        ? cgEntry2.skuPerStore
                        : bpSkuPerStore;
    const nlAllSku2     = nlMapEntry?.sku || 0;
    const allSkuFinal   = nlAllSku2 > 0           ? nlAllSku2
                        : cgEntry2?.allSku > 0    ? cgEntry2.allSku
                        : allSku;
    let skuPt = 0;
    oe.custSkuMap.forEach(pm => { pm.forEach(rank => { skuPt += SKU_SCORE[rank]||0; }); });
    const pct = tgt > 0 ? actual / tgt * 100 : 0;
    return { ...r, _actual:actual, _outlet:outlet, _ranVan:ranVan, _skuPerStore:skuPerStore, _allSku:allSkuFinal, _skuPt:skuPt, _pct:pct, _tgt:tgt };
  });

  // RANK per warehouse+Channal by % desc
  const whGroups2 = new Map();
  enriched.forEach(r => {
    const w = String(r['คลัง']||'').trim() + '|' + String(r['Channal']||'').trim();
    if (!whGroups2.has(w)) whGroups2.set(w, []);
    whGroups2.get(w).push(r);
  });
  whGroups2.forEach(rows => {
    const byPct = [...rows].sort((a,b) => b._pct - a._pct);
    byPct.forEach((r,i) => r._rank = i+1);
  });

  const GOLD='#c9a84c', NAVY='#0d1b3e', TEAL='#1B9EB5', TEAL_DARK='#000', COL_HDR='#b2e4ef', BORDER='#000';
  const pctColor = p => p>=wd.pct?'#155724':'#721c24';
  const pctBg    = p => p>=wd.pct?'#d4edda':'#f8d7da';
  const rankColor= r => r===1?'#155724':r===2?'#856404':r===3?'#721c24':r===4?'#0d4a8a':r===5?'#5b2d8e':r===6?'#9b2458':r===7?'#721c24':r===8?'#0a3d1f':'#555';
  const rankBg   = r => r===1?'#c8ecd4':r===2?'#fff3cd':r===3?'#fdd9d7':r===4?'#d0e8ff':r===5?'#e8d5f5':r===6?'#fde0ec':r===7?'#f5b7b1':r===8?'#a8d5b5':'transparent';
  const th    = (txt,extra='') => `<th style="background:${COL_HDR};color:${NAVY};font-weight:700;text-align:center;padding:7px 8px;border:1px solid ${BORDER};white-space:nowrap${extra}">${txt}</th>`;
  const thHdr = (txt,extra='') => `<th style="background:${TEAL};color:#fff;font-weight:600;font-size:12px;text-align:center;padding:6px 8px;border:1px solid ${TEAL_DARK}${extra}">${txt}</th>`;
  const tdVal = (txt,extra='') => `<td style="background:${TEAL};color:#fff;font-weight:700;font-size:13px;text-align:center;padding:6px 8px;border:1px solid ${TEAL_DARK}${extra}">${txt}</td>`;
  const fmtN  = v => v ? Math.round(v).toLocaleString() : '-';

  const whRowBg = wh => wh==='W1'?'rgba(255,220,50,.07)':wh==='W2'?'rgba(173,216,230,.10)':wh==='W3'?'rgba(255,80,80,.06)':wh==='W4'?'rgba(46,204,113,.06)':'';
  const BD = '#000';

  let bodyHtml = '';
  enriched.forEach(r => {
    const p  = r._pct;
    const wh = String(r['คลัง']||'').trim().toUpperCase();
    const rb = whRowBg(wh);
    const bs = `background:${rb}`;
    bodyHtml += `<tr style="border-bottom:1px solid ${BD};font-weight:400;${rb?bs:''}">
      <td style="text-align:center;padding:7px 8px;border:1px solid ${BD};${rb?bs:''}">${r['ลำดับ']||''}</td>
      <td style="text-align:left;padding:7px 8px;border:1px solid ${BD};${rb?bs:''}">${r['Channal']||''}</td>
      <td style="text-align:left;padding:7px 8px;border:1px solid ${BD};${rb?bs:''}">${r['ผู้ดูแล']||''}</td>
      <td style="text-align:left;padding:7px 8px;border:1px solid ${BD};${rb?bs:''}">${r['ชื่อ-นามสกุล']||''}</td>
      <td style="text-align:center;padding:7px 8px;border:1px solid ${BD};font-weight:700;${rb?bs:''}">${r['รหัสเซลล์']||''}</td>
      <td style="text-align:center;padding:7px 8px;border:1px solid ${BD};${rb?bs:''}">${r['BU']||''}</td>
      <td style="text-align:center;padding:7px 8px;border:1px solid ${BD};${rb?bs:''}">${r['คลัง']||''}</td>
      <td style="text-align:right;padding:7px 8px;border:1px solid ${BD};${rb?bs:''}">${r._tgt?Math.round(r._tgt).toLocaleString():'-'}</td>
      <td style="text-align:right;padding:7px 8px;border:1px solid ${BD};${rb?bs:''}">${r._actual?Math.round(r._actual).toLocaleString():'-'}</td>
      <td style="text-align:center;padding:7px 8px;border:1px solid ${BD};font-weight:700;color:${pctColor(p)};background:${pctBg(p)}">${p?p.toFixed(2)+'%':'-'}</td>
      <td style="text-align:center;padding:7px 8px;border:1px solid ${BD};${rb?bs:''}">${r._outlet||'-'}</td>
      <td style="text-align:center;padding:7px 8px;border:1px solid ${BD};${rb?bs:''}">${r._ranVan?r._ranVan.toFixed(1):'-'}</td>
      <td style="text-align:center;padding:7px 8px;border:1px solid ${BD};${rb?bs:''}">${r._skuPerStore?r._skuPerStore.toFixed(1):'-'}</td>
      <td style="text-align:center;padding:7px 8px;border:1px solid ${BD};${rb?bs:''}">${r._allSku||'-'}</td>
      <td style="text-align:center;padding:7px 8px;border:1px solid ${BD};${rb?bs:''}">${r._skuPt?Math.round(r._skuPt).toLocaleString():'-'}</td>
      <td style="text-align:center;padding:7px 8px;border:1px solid ${BD};font-weight:700;color:${rankColor(r._rank)};background:${rankBg(r._rank)}">${r._rank||'-'}</td>
    </tr>`;
  });

  el.innerHTML = `<div class="tbl-wrap"><table class="rtbl" style="width:auto;table-layout:auto">
<thead>
<tr>
  <th colspan="11" rowspan="2" style="background:${GOLD};color:${NAVY};font-weight:700;font-size:15px;text-align:center;padding:10px 16px;border:1px solid #b8963c">SALES RSP (ร้านค้าปลีก)</th>
  ${thHdr('Time Used')}${thHdr('Week')}${thHdr('วันที่')}${thHdr('วันทำงาน<br>ทั้งหมด')}${thHdr('วันทำงาน<br>เหลือ')}
</tr>
<tr>
  ${tdVal(fmtN(wd.pct)+'%')}${tdVal(wd.weekOfMonth)}${tdVal(wd.dateStr||'')}${tdVal(wd.totalWork)}${tdVal(wd.remaining)}
</tr>
<tr>
  ${th('ลำดับ')}${th('Channal')}${th('ผู้ดูแล')}${th('ชื่อ-นามสกุล','text-align:left')}${th('รหัสเซลล์')}${th('BU')}${th('คลัง')}${th('เป้าหมาย')}${th('ทำได้')}${th('%')}${th('Outlet')}${th('ร้าน/วัน')}${th('SKU/ร้าน')}${th('All SKU')}${th('SKU Point')}${th('RANK')}
</tr>
</thead>
<tbody>${bodyHtml}</tbody>
</table></div>`;
}

function renderBirdy() {
  const el = document.getElementById('birdyContent');
  if (!el) return;
  const raw = state.birdyRaw || [];
  if (!raw.length) { el.innerHTML = '<p style="padding:16px;color:#b00">ไม่มีข้อมูล sheet เบอร์ดี้</p>'; return; }

  const wd = getWorkingDaysInfo(getWdMonth());
  const dataRows = raw.filter(r => String(r['ชื่อพนักงานขาย']||'').trim());
  if (!dataRows.length) { el.innerHTML = '<p style="padding:16px;color:#b00">ไม่พบข้อมูลในชีต เบอร์ดี้</p>'; return; }

  const BIRDY_27 = new Set([
    'เบอร์ดี้ 3อิน1 ครีมมี่ 13.2ก.27ซอง',
    'เบอร์ดี้ 3อิน1 ริชลาเต้ 11.5ก.27ซอง',
    'เบอร์ดี้ 3อิน1 โรบัสต้า 15ก.27ซอง',
    'เบอร์ดี้ 3อิน1 เอสเปรสโซ 12.1ก.27ซอง',
    'เบอร์ดี้ 3อิน1 ริชเบลนด์ 7ก.27ซอง',
  ]);
  const BIRDY_60 = new Set([
    'เบอร์ดี้ 3อิน1 ครีมมี่ 13.2ก.60ซอง',
    'เบอร์ดี้ 3อิน1 โรบัสต้า 15ก.60ซอง',
    'เบอร์ดี้ 3อิน1 เอสเปรสโซ 12.1ก.60ซอง',
  ]);
  const lbp = state.latestBpMonth;
  const bpRaw = state.bpRaw || [];
  const birdy27Idx = new Map();
  const birdy60Idx = new Map();
  bpRaw.forEach(r => {
    if (!lbp) return;
    const d = bpMonthYear(r['Doc_Date']);
    if (!d || d.mm !== lbp.mm || d.yyyy !== lbp.yyyy) return;
    const prod = String(r['Product_Name']||'').trim();
    const saleNo = normalizeName(r['Sale NO ROO']);
    if (!saleNo) return;
    const csx = parseNum(r['Sales_CSxValue']);
    if (BIRDY_27.has(prod)) birdy27Idx.set(saleNo, (birdy27Idx.get(saleNo)||0) + csx);
    if (BIRDY_60.has(prod)) birdy60Idx.set(saleNo, (birdy60Idx.get(saleNo)||0) + csx);
  });

  const BD = '#000';
  const C_HDR = '#1a3a55';
  const C_HDR2 = '#eef4f8';
  const C_TOT = '#e6eff5';
  const pctBg = p => p >= wd.pct ? '#c8ecd4' : '#fdd9d7';
  const fmtN = v => v ? Math.round(v).toLocaleString() : '-';
  const fmtD = v => v ? v.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}) : '-';
  const tdS = `padding:8px 12px;border:1px solid ${BD};text-align:right;white-space:nowrap;color:#000`;

  let totalTarget = 0, total27 = 0, total60 = 0;
  const rows = dataRows.map(r => {
    const wh = String(r['WH']||r['']||'').trim();
    const name = String(r['ชื่อพนักงานขาย']||'').trim();
    const code = String(r['รหัส']||'').trim();
    const target = parseNum(r['เป้าหมาย']||'');
    const normN = normalizeName(name);
    const a27 = birdy27Idx.get(normN) || 0;
    const a60 = birdy60Idx.get(normN) || 0;
    totalTarget += target;
    total27 += a27;
    total60 += a60;
    return { wh, name, code, target, a27, a60 };
  });

  const thS = `background:${C_HDR};color:#fff;padding:8px 12px;border:1px solid ${BD}`;
  let html = `<div style="display:flex;gap:12px;margin-top:12px;flex-wrap:wrap;align-items:flex-start">
  <div class="card card-gold" style="flex:1;min-width:480px">
  <div class="card-head"><b>☕ เบอร์ดี้ 3 in 1</b>
    <span class="txt-sm txt-muted">Time Used: ${wd.pct.toFixed(2)}% (สัปดาห์ที่ ${wd.weekOfMonth})</span>
  </div>
  <div class="card-body" style="padding:0;overflow-x:auto">
  <table style="width:100%;border-collapse:collapse;font-size:13px">
  <thead>
    <tr>
      <th style="${thS};text-align:center;width:50px">WH</th>
      <th style="${thS};white-space:nowrap">ชื่อพนักงานขาย</th>
      <th style="${thS};text-align:center;width:80px">รหัส</th>
      <th style="${thS};text-align:right;width:90px">เป้าหมาย</th>
      <th style="${thS};text-align:right;white-space:nowrap">เบอร์ดี้ 3 in 1 27 ซอง</th>
      <th style="${thS};text-align:right;white-space:nowrap">เบอร์ดี้ 3 in 1 60 ซอง</th>
    </tr>
  </thead><tbody>`;

  rows.forEach((r, i) => {
    const bg = i % 2 === 0 ? '#fff' : '#fafbfd';
    html += `<tr style="background:${bg}">
      <td style="${tdS};text-align:center;font-weight:600">${r.wh}</td>
      <td style="padding:8px 12px;border:1px solid ${BD};color:#000;font-weight:600">${r.name}</td>
      <td style="${tdS};text-align:center;font-family:monospace;font-weight:600">${r.code}</td>
      <td style="${tdS}">${fmtN(r.target)}</td>
      <td style="${tdS}">${fmtD(r.a27)}</td>
      <td style="${tdS}">${fmtD(r.a60)}</td>
    </tr>`;
  });

  html += `<tr style="background:${C_TOT};font-weight:700">
    <td colspan="3" style="padding:8px 12px;border:1px solid ${BD};color:#000;text-align:center;font-weight:700">รวมทุกช่องทาง</td>
    <td style="${tdS};font-weight:700">${fmtN(totalTarget)}</td>
    <td style="${tdS};font-weight:700">${fmtD(total27)}</td>
    <td style="${tdS};font-weight:700">${fmtD(total60)}</td>
  </tr>`;

  html += `</tbody></table></div></div>`;

  // --- Line chart: ยอดซื้อเบอร์ดี้รายวัน (รวม 27+60 ซอง เส้นเดียว) ---
  const dailyAll = new Map();
  bpRaw.forEach(r => {
    if (!lbp) return;
    const ds = String(r['Doc_Date']||'').trim();
    const p = ds.split('/');
    if (p.length !== 3) return;
    const dd = parseInt(p[0],10), mm = parseInt(p[1],10), yyyy = parseInt(p[2],10);
    if (mm !== lbp.mm || yyyy !== lbp.yyyy) return;
    const prod = String(r['Product_Name']||'').trim();
    const csx = parseNum(r['Sales_CSxValue']);
    if (BIRDY_27.has(prod) || BIRDY_60.has(prod)) dailyAll.set(dd, (dailyAll.get(dd)||0) + csx);
  });

  const daysArr = [...dailyAll.keys()].sort((a,b) => a - b);
  const labels = daysArr.map(d => d + '');
  const dataAll = daysArr.map(d => +(dailyAll.get(d)||0).toFixed(2));

  html += `<div class="card card-gold" style="flex:1;min-width:480px">
    <div class="card-head"><b>📈 กราฟยอดซื้อเบอร์ดี้รายวัน</b></div>
    <div class="card-body"><canvas id="birdyChart" height="350"></canvas></div>
  </div>
  </div>
  <p class="txt-sm txt-muted" style="margin-top:8px">* ทำได้: สีเขียว ≥ Time Used (${wd.pct.toFixed(1)}%) · สีแดง น้อยกว่า</p>`;

  el.innerHTML = html;

  if (typeof Chart !== 'undefined') {
    const ctx = document.getElementById('birdyChart');
    if (ctx) {
      if (window._birdyChart) window._birdyChart.destroy();
      window._birdyChart = new Chart(ctx, {
        type: 'line',
        plugins: [ChartDataLabels],
        data: {
          labels,
          datasets: [
            { label: 'เบอร์ดี้ 3 in 1 (รวม 27+60 ซอง)', data: dataAll, borderColor: '#c9a84c', backgroundColor: 'rgba(201,168,76,0.12)', tension: 0.3, pointRadius: 5, pointHoverRadius: 7, borderWidth: 2.5, fill: true }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { position: 'bottom', labels: { font: { family: 'Sarabun', size: 13 }, usePointStyle: true, padding: 20 } },
            tooltip: { callbacks: { label: c => c.dataset.label + ': ' + c.parsed.y.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}) } },
            datalabels: { anchor: 'end', align: 'top', font: { family: 'Sarabun', size: 10, weight: 600 }, color: '#1a3a55', formatter: v => v > 0 ? v.toFixed(2) : '' }
          },
          scales: {
            x: { title: { display: true, text: 'วันที่', font: { family: 'Sarabun', size: 12 } }, ticks: { font: { family: 'Sarabun', size: 11 } } },
            y: { beginAtZero: true, title: { display: true, text: 'Sales_CSxValue', font: { family: 'Sarabun', size: 12 } }, ticks: { font: { size: 11 } } }
          },
          interaction: { mode: 'index', intersect: false }
        }
      });
    }
  }
}

function renderLoveza() {
  const el = document.getElementById('lovezaContent');
  if (!el) return;
  const raw = state.lovezaRaw || [];
  if (!raw.length) { el.innerHTML = '<p style="padding:16px;color:#b00">ไม่มีข้อมูล sheet LoveZa</p>'; return; }

  const keys = Object.keys(raw[0] || {});
  const nameCol = keys.find(k => k.includes('Sale NO ROO')) || 'Sale NO ROO';
  const wsCol = keys.find(k => k.trim().match(/^WS$|^WH$/)) || 'WS';

  const dataRows = raw.filter(r => String(r[nameCol]||'').trim());
  if (!dataRows.length) { el.innerHTML = '<p style="padding:16px;color:#b00">ไม่พบข้อมูลในชีต LoveZa</p>'; return; }

  const LOVEZA_PRODS = [
    { key: 'linchi', name: 'เลิฟซ่า ลิ้นจี่ 330มล.', match: s => s.includes('เลิฟซ่า') && s.includes('ลิ้นจี่') && s.includes('330') },
    { key: 'grape',  name: 'เลิฟซ่า องุ่น 330มล.',   match: s => s.includes('เลิฟซ่า') && s.includes('องุ่น') && s.includes('330') },
    { key: 'honey',  name: 'เลิฟซ่า ฮันนี่เลม่อน 330มล.', match: s => s.includes('เลิฟซ่า') && (s.includes('เลม่อน') || s.includes('ฮันนี่')) && s.includes('330') }
  ];

  const lbp = state.latestBpMonth;
  const bpRaw = state.bpRaw || [];
  // saleNo → { linchi:{csx,custs}, grape:{csx,custs}, honey:{csx,custs} }
  const idx = new Map();
  bpRaw.forEach(r => {
    if (!lbp) return;
    const d = bpMonthYear(r['Doc_Date']);
    if (!d || d.mm !== lbp.mm || d.yyyy !== lbp.yyyy) return;
    const prod = String(r['Product_Name']||'').trim();
    const saleNo = normalizeName(r['Sale NO ROO']);
    if (!saleNo) return;
    const csx = parseNum(r['Sales_CSxValue']);
    const cust = String(r['Customer_Code']||'').trim();
    LOVEZA_PRODS.forEach(lp => {
      if (!lp.match(prod)) return;
      if (!idx.has(saleNo)) idx.set(saleNo, {});
      const entry = idx.get(saleNo);
      if (!entry[lp.key]) entry[lp.key] = { csx: 0, custs: new Set() };
      entry[lp.key].csx += csx;
      if (cust) entry[lp.key].custs.add(cust);
    });
  });

  const BD = '#000';
  const C_HDR = '#1a3a55';
  const C_TOT = '#e6eff5';
  const fmtD = v => v ? v.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}) : '-';
  const fmtN = v => v ? Math.round(v).toLocaleString() : '-';
  const tdS = `padding:8px 10px;border:1px solid ${BD};text-align:right;white-space:nowrap;color:#000`;
  const thS = `background:${C_HDR};color:#fff;padding:8px 10px;border:1px solid ${BD};text-align:center;white-space:nowrap`;

  const totals = {};
  LOVEZA_PRODS.forEach(lp => { totals[lp.key] = { csx: 0, custs: new Set() }; });

  const rows = dataRows.map(r => {
    const ws = String(r[wsCol]||'').trim();
    const name = String(r[nameCol]||'').trim();
    const normN = normalizeName(name);
    const entry = idx.get(normN) || {};
    const vals = LOVEZA_PRODS.map(lp => {
      const e = entry[lp.key] || { csx: 0, custs: new Set() };
      totals[lp.key].csx += e.csx;
      e.custs.forEach(c => totals[lp.key].custs.add(c));
      return { csx: e.csx, store: e.custs.size };
    });
    return { ws, name, vals };
  });

  const prodColors = ['#fce4ec','#ede7f6','#fff3e0'];

function renderDeedo() {
  const el = document.getElementById('deedoContent');
  if (!el) return;
  const raw = state.deedoRaw || [];
  if (!raw.length) { el.innerHTML = '<p style="padding:16px;color:#b00">ไม่มีข้อมูล sheet ดีโด้ มิกกุ 300</p>'; return; }

  const keys = Object.keys(raw[0] || {});
  const nameCol = keys.find(k => k.includes('ชื่อพนักงานขาย')) || 'ชื่อพนักงานขาย';
  const codeCol = keys.find(k => k.includes('รหัส')) || 'รหัส';
  const targetCol = keys.find(k => k.trim() === 'Target') || 'Target';
  const actualCol = keys.find(k => k.trim() === 'Actual') || 'Actual';

  const dataRows = raw.filter(r => String(r[nameCol]||'').trim());

  const DEEDO_PRODS = [
    { key: 'mikku300', name: 'ดีโด้ มิกกุ 300', match: s => s.includes('ดีโด้') && s.includes('มิกกุ') && s.includes('300') }
  ];

  const lbp = state.latestBpMonth;
  const bpRaw = state.bpRaw || [];
  const idx = new Map();
  bpRaw.forEach(r => {
    if (!lbp) return;
    const d = bpMonthYear(r['Doc_Date']);
    if (!d || d.mm !== lbp.mm || d.yyyy !== lbp.yyyy) return;
    const prod = String(r['Product_Name']||'').trim();
    const saleNo = normalizeName(r['Sale NO ROO']);
    if (!saleNo) return;
    const csx = parseNum(r['Sales_CSxValue'] || r['Sales_CS']);
    const cust = String(r['Customer_Code']||'').trim();
    const isDeedo = prod.includes('ดีโด้') && prod.includes('มิกกุ') && prod.includes('300');
    if (!isDeedo) return;
    if (!idx.has(saleNo)) idx.set(saleNo, { totalCsx: 0, custs: new Set(), prods: {} });
    const entry = idx.get(saleNo);
    entry.totalCsx += csx;
    if (cust) entry.custs.add(cust);
    DEEDO_PRODS.forEach(dp => {
      if (!dp.match(prod)) return;
      if (!entry.prods[dp.key]) entry.prods[dp.key] = { csx: 0, custs: new Set() };
      entry.prods[dp.key].csx += csx;
      if (cust) entry.prods[dp.key].custs.add(cust);
    });
  });

  const BD = '#000';
  const C_HDR = '#1a3a55';
  const C_TOT = '#e6eff5';
  const fmtD = v => v ? v.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}) : '-';
  const fmtN = v => v ? Math.round(v).toLocaleString() : '-';
  const tdS = `padding:8px 10px;border:1px solid ${BD};text-align:right;white-space:nowrap;color:#000`;
  const thS = `background:${C_HDR};color:#fff;padding:8px 10px;border:1px solid ${BD};text-align:center;white-space:nowrap`;

  const wsCol = keys.find(k => k.trim().match(/^WS$|^WH$/)) || 'WS';

  const totals = {};
  DEEDO_PRODS.forEach(dp => { totals[dp.key] = { csx: 0, custs: new Set() }; });

  const rows = dataRows.map(r => {
    const ws = String(r[wsCol]||'').trim() || String(r[codeCol]||'').trim();
    const name = String(r[nameCol]||'').trim();
    const normN = normalizeName(name);
    const entry = idx.get(normN) || { totalCsx: 0, custs: new Set(), prods: {} };
    const vals = DEEDO_PRODS.map(dp => {
      const e = entry.prods[dp.key] || { csx: 0, custs: new Set() };
      totals[dp.key].csx += e.csx;
      e.custs.forEach(c => totals[dp.key].custs.add(c));
      return { csx: e.csx, store: e.custs.size };
    });
    return { ws, name, vals };
  });

  const prodColors = ['#fff8e1','#e8f5e9','#fff3e0','#e3f2fd','#fce4ec','#f3e5f5','#e0f7fa'];
  let html = `<div style="display:flex;gap:12px;margin-top:12px;flex-wrap:nowrap;align-items:stretch;overflow-x:auto">
