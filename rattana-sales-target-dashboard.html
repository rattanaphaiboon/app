  <table style="border-collapse:collapse;font-size:14px;width:100%">
  <thead>
    <tr>
      <th rowspan="2" style="${thS}">WS</th>
      <th rowspan="2" style="${thS};text-align:left">Sale NO ROO</th>
      ${DEEDO_PRODS.map((dp,i) => `<th colspan="2" style="${thS};background:${prodColors[i%prodColors.length]};color:#000">${dp.name}</th>`).join('')}
    </tr>
    <tr>
      ${DEEDO_PRODS.map((dp,i) => `<th style="${thS};background:${prodColors[i%prodColors.length]};color:#000">ลัง</th><th style="${thS};background:${prodColors[i%prodColors.length]};color:#000">ร้าน</th>`).join('')}
    </tr>
  </thead><tbody>`;

  rows.forEach((r, i) => {
    const bg = i % 2 === 0 ? '#fff' : '#fafbfd';
    html += `<tr style="background:${bg}">
      <td style="${tdS};text-align:center;font-weight:600">${r.ws}</td>
      <td style="padding:8px 10px;border:1px solid ${BD};color:#000;font-weight:600">${r.name}</td>
      ${r.vals.map(v => `<td style="${tdS}">${fmtD(v.csx)}</td><td style="${tdS}">${fmtN(v.store)}</td>`).join('')}
    </tr>`;
  });

  html += `<tr style="background:${C_TOT};font-weight:700">
    <td colspan="2" style="padding:8px 10px;border:1px solid ${BD};color:#000;text-align:center;font-weight:700">ผลรวม</td>
    ${DEEDO_PRODS.map(dp => {
      const t = totals[dp.key];
      return `<td style="${tdS};font-weight:700">${fmtD(t.csx)}</td><td style="${tdS};font-weight:700">${fmtN(t.custs.size)}</td>`;
    }).join('')}
  </tr>`;

  html += `</tbody></table></div></div>`;

  // --- Line chart: ยอดดีโด้ มิกกุ 300 รายวัน ---
  const dailyAll = new Map();
  bpRaw.forEach(r => {
    if (!lbp) return;
    const ds = String(r['Doc_Date']||'').trim();
    const p = ds.split('/');
    if (p.length !== 3) return;
    const dd = parseInt(p[0],10), mm = parseInt(p[1],10), yyyy = parseInt(p[2],10);
    if (mm !== lbp.mm || yyyy !== lbp.yyyy) return;
    const prod = String(r['Product_Name']||'').trim();
    const csx = parseNum(r['Sales_CSxValue'] || r['Sales_CS']);
    if (prod.includes('ดีโด้') && prod.includes('มิกกุ') && prod.includes('300')) dailyAll.set(dd, (dailyAll.get(dd)||0) + csx);
  });
  const daysArr = [...dailyAll.keys()].sort((a,b) => a - b);
  const chartLabels = daysArr.map(d => d + '');
  const dataAll = daysArr.map(d => +(dailyAll.get(d)||0).toFixed(2));

  html += `<div class="card card-gold" style="flex:0 0 calc(50% - 6px);min-width:0;display:flex;flex-direction:column">
    <div class="card-head"><b>📈 กราฟยอดดีโด้ มิกกุ 300 รายวัน</b></div>
    <div class="card-body" style="position:relative;flex:1;min-height:260px"><canvas id="deedoChart"></canvas></div>
  </div>
  </div>`;

  el.innerHTML = html;

  if (typeof Chart !== 'undefined') {
    const ctx = document.getElementById('deedoChart');
    if (ctx) {
      if (window._deedoChart) window._deedoChart.destroy();
      window._deedoChart = new Chart(ctx, {
        type: 'line',
        plugins: [ChartDataLabels],
        data: {
          labels: chartLabels,
          datasets: [
            { label: 'ดีโด้ มิกกุ 300 (รวม)', data: dataAll, borderColor: '#8e44ad', backgroundColor: 'rgba(142,68,173,0.12)', tension: 0.3, pointRadius: 5, pointHoverRadius: 7, borderWidth: 2.5, fill: true }
          ]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          layout: { padding: { top: 25 } },
          plugins: {
            legend: { position: 'bottom', labels: { font: { family: 'Sarabun', size: 12 }, usePointStyle: true, padding: 16 } },
            tooltip: { callbacks: { label: c => c.dataset.label + ': ' + c.parsed.y.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}) } },
            datalabels: { anchor: 'end', align: 'top', font: { family: 'Sarabun', size: 11, weight: 700 }, color: '#1a3a55', formatter: v => v > 0 ? v.toFixed(2) : '' }
          },
          scales: {
            x: { title: { display: true, text: 'วันที่', font: { family: 'Sarabun', size: 12 } }, ticks: { font: { family: 'Sarabun', size: 11 } } },
            y: { beginAtZero: true, grace: '15%', title: { display: true, text: 'ลัง', font: { family: 'Sarabun', size: 12 } }, ticks: { font: { size: 11 } } }
          },
          interaction: { mode: 'index', intersect: false }
        }
      });
    }
  }

function renderPlanTB() {
  const el = document.getElementById('plantbContent');
  if (!el) return;
  const raw = state.plantbRaw || [];
  if (!raw.length) { el.innerHTML = '<p style="padding:16px;color:#b00">ไม่มีข้อมูล sheet แพลนTB</p>'; return; }
  const K = Object.keys(raw[0]).slice(1, 14);
  const title = K[0].replace(/ลำดับ\s*$/, '').trim();
  const prodK = K.slice(4, 12);
  const prodName = k => k.replace(/^ยอดขาย\s*เบียร์\s*/, '');
  const rows = raw.filter(r => String(r[K[1]]||'').trim());
  const body = rows.filter(r => String(r[K[1]]).trim() !== 'ผลรวม');
  const total = rows.find(r => String(r[K[1]]).trim() === 'ผลรวม');
  const span = body.map(() => 1);
  for (let i = body.length - 1; i > 0; i--) {
    if (!String(body[i][K[2]]||'').trim() && !String(body[i][K[3]]||'').trim()) { span[i-1] += span[i]; span[i] = 0; }
  }
  const BD = '#000';
  const th = (bg, extra='') => `background:${bg};color:#000;padding:6px 8px;border:1px solid ${BD};text-align:center;font-weight:700;${extra}`;
  const td = `padding:5px 8px;border:1px solid ${BD};color:#000;text-align:center;white-space:nowrap`;
  const v = x => { const t = String(x||'').trim(); return t; };
  let html = `<div class="card card-gold" style="margin-top:12px;display:inline-block;max-width:100%">
  <div class="card-head" style="justify-content:center"><b style="font-size:18px">${title}</b></div>

  <table style="border-collapse:collapse;font-size:13px">

    <tr>

      <th rowspan="2" style="${th('#c6e0b4','min-width:240px')}">รายชื่อ Sup</th>
      <th rowspan="2" style="${th('#f4b183')}">เป้าหมาย</th>
      <th rowspan="2" style="${th('#9dc3e6')}">ทำได้</th>
      <th colspan="${prodK.length}" style="${th('#c6e0b4')}">ยอดขาย เบียร์</th>
      <th rowspan="2" style="${th('#c6e0b4')}">แพลนขายเพิ่ม</th>
    </tr>
    <tr>${prodK.map(k => `<th style="${th('#c6e0b4','font-size:12px;min-width:70px')}">${prodName(k)}</th>`).join('')}</tr>
  </thead><tbody>`;
  body.forEach((r, i) => {
    const bg = i % 2 ? '#e2efda' : '#fff';
    const merged = span[i] > 1 ? ` rowspan="${span[i]}"` : '';
    html += `<tr style="background:${bg}">
      <td style="${td}">${v(r[K[0]])}</td>
      <td style="${td};text-align:left">${v(r[K[1]])}</td>
      ${span[i] ? `<td${merged} style="${td};background:#fce4d6;vertical-align:middle">${v(r[K[2]])}</td><td${merged} style="${td};background:#ddebf7;vertical-align:middle">${v(r[K[3]])}</td>` : ''}
      ${prodK.map(k => `<td style="${td}">${v(r[k])}</td>`).join('')}
      <td style="${td}">${v(r[K[12]])}</td>
    </tr>`;
  });
  if (total) html += `<tr style="background:#c6e0b4;font-weight:700">
      <td style="${td}"></td><td style="${td}">ผลรวม</td>
      <td style="${td}">${v(total[K[2]])}</td><td style="${td}">${v(total[K[3]])}</td>
      ${prodK.map(k => `<td style="${td}">${v(total[k])}</td>`).join('')}
      <td style="${td}">${v(total[K[12]])}</td></tr>`;
  html += `</tbody></table></div></div>`;
  el.innerHTML = html;
}

    ['W1','คุณ นพดล พุทธรักษา','HSW104'],['W1','คุณ วิรชัย หัตถกรรม','HSW105'],
    ['W4','คุณ วิภา ยิ่งคุ้ม','HSW403'],['W4','คุณ รุ่งฟ้า ธรรมรักษ์ษา','HSW404'],['W4','คุณ สมคิด คุ้มวงค์','HSW405'],
    ['W1','คุณ ชัยสิทธิ์ มีศิริ','PMW101'],['W1','คุณ จารุพัฒน์ หอมวิเชียร','PMW102'],['W1','คุณ ดวงหทัย แสงแก้ว','PMW103'],
    ['W1','คุณ จิรายุ วันจันทร์','PMW104'],['W1','คุณ สุกรี สรสิทธิ์','PMW105'],
    ['W3','คุณ วรพันธ์ เพ็งจันทร์','PMW301'],['W3','คุณ ปวริศ ทองก้อน','PMW304'],['W3','คุณ อภิชญา พัวนิรันดร์','PMW303'],
    ['W4','คุณ ชลรดาณัชช์ เอมอิ่ม','PMW402'],['W4','คุณ ธนปกร เทพทอง','PMW404']];
  const LIST = SALES.filter(x => wh === 'ALL' || x[0] === wh);
  const CATS = ['แนะนำ-ขายดี', 'แนะนำ-กระจาย'];
  const pcore = s => { s = normalizeText(String(s||'')).replace(/\s+/g,' '); return s.includes('@') ? s.split('@').slice(1).join('@').trim() : s; };
  const bpAct = new Map();
  (state.bpRaw||[]).forEach(r => {
    const my = bpMonthYear(r['Doc_Date']);
    if (!my || my.mm !== m.mm || my.yyyy !== m.yyyy) return;
    const k = String(r['Customer_Code']||'').trim() + '|' + pcore(r['Product_Name']);
    const a = bpAct.get(k) || { cs: 0, baht: 0 };
    a.cs += parseNum(r['Sales_CS']); a.baht += parseNum(r['EXVat+CN*2']);
    bpAct.set(k, a);
  });
  const mk = () => Object.fromEntries(CATS.map(c => [c, { order: 0, billed: 0, cs: 0, baht: 0 }]));
  const idx = new Map(LIST.map(x => [x[2], mk()]));
  const tot = mk();
  const billedList = [];
  (state.recRaw||[]).forEach(r => {
    const cat = String(r['อยู่ในคำแนะนำ']||'').trim();
    if (!CATS.includes(cat)) return;
    if (String(r['ยกเลิก']||'').trim()) return;
    const sc = String(r['รหัสเซลล์']||'').trim().toUpperCase();
    const g = idx.get(sc);
    if (!g) return;
    const k = String(r['รหัสร้าน']||'').trim() + '|' + pcore(r['ชื่อสินค้า']);
    const a = bpAct.get(k);
    [g, tot].forEach(o => { o[cat].order++; if (a) { o[cat].billed++; o[cat].cs += a.cs; o[cat].baht += a.baht; } });
    if (a) billedList.push({ cat, sc, sale: (LIST.find(x => x[2] === sc)||[])[1] || sc, cust: String(r['รหัสร้าน']||'').trim(), custName: String(r['ชื่อร้าน']||'').trim(), prod: String(r['ชื่อสินค้า']||'').trim(), cs: a.cs, baht: a.baht });
  });
  const BD = '#000';
  const th = `background:#1a3a55;color:#fff;padding:10px 12px;border:1px solid ${BD};text-align:center;white-space:nowrap`;
  const td = `padding:8px 12px;border:1px solid ${BD};color:#000;text-align:right;white-space:nowrap`;
  const f0 = v => Math.round(v).toLocaleString();
  const f1 = v => v.toLocaleString(undefined,{minimumFractionDigits:1,maximumFractionDigits:1});
  const TARGET = 40000;
  const tu = getWorkingDaysInfo(getWdMonth()).pct;
  const dash = `<td style="${td};color:#999">-</td>`;
  const cells = (g, tgt) => {
    const sum = CATS.reduce((s,c) => s + g[c].baht, 0);
    const pct = tgt ? sum / tgt * 100 : 0;
    return `<td style="${td}">${f0(tgt)}</td>` + CATS.map(c => { const o = g[c]; return o.billed ? `<td style="${td}">${f0(o.baht)}</td>` : dash; }).join('')
      + `<td style="${td};font-weight:700">${sum ? f0(sum) : '-'}</td>`
      + `<td style="${td};font-weight:700;background:${pct >= tu ? '#d4edda' : '#f8d7da'};color:${pct >= tu ? '#155724' : '#721c24'}">${pct.toFixed(2)}%</td>`;
  };
  const mn = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'][m.mm-1] + ' ' + (m.yyyy+543);
  el.innerHTML = `<div class="card card-gold" style="margin-top:12px;display:inline-block;max-width:100%">
    <div class="card-head" style="gap:12px;flex-wrap:wrap"><b>ขายดี-กระจายดี</b><span>${['ALL','W1','W3','W4'].map(w => `<button class="btn btn-sm ${w===wh?'btn-gold':'btn-outline'}" onclick="renderBestSell('${w}')">${w==='ALL'?'ทั้งหมด':w}</button>`).join(' ')}</span><span class="txt-sm txt-muted">ออเดอร์จากชีต ${state.recSheet||''} + ชีต Order (คอลัมน์ "อยู่ในคำแนะนำ") เทียบยอดจริงจากชีต BP · จับคู่ รหัสร้าน + สินค้า</span></div>
    <div class="card-body" style="padding:0;overflow-x:auto">
    <table style="border-collapse:collapse;font-size:15px">
    <thead><tr><th style="${th}">WH</th><th style="${th}">ชื่อพนักงานขาย</th><th style="${th}">รหัส</th><th style="${th}">Target<br>(บาท)</th>
      <th style="${th};background:#c9a84c;color:#0d1b3e">แนะนำ-ขายดี<br>(บาท)</th><th style="${th};background:#3498db">แนะนำ-กระจาย<br>(บาท)</th>
      <th style="${th}">ยอดจริงรวม<br>(บาท)</th><th style="${th}">%</th></tr></thead>
    <tbody>${LIST.map((x,i) => `<tr style="background:${i%2?'#fafbfd':'#fff'}">
      <td style="${td};text-align:center;font-weight:700">${x[0]}</td>
      <td style="${td};text-align:left">${x[1]}</td>
      <td style="${td};text-align:center;font-weight:700">${x[2]}</td>
      ${cells(idx.get(x[2]), TARGET)}</tr>`).join('')}
    <tr style="background:#e6eff5;font-weight:700"><td colspan="3" style="${td};text-align:center">${wh === 'ALL' ? 'รวมทุกช่องทาง' : 'รวม ' + wh}</td>${cells(tot, TARGET * LIST.length)}</tr>
    </tbody></table></div></div>
    <div class="card card-gold" style="margin-top:12px;display:block;max-width:100%">
    <div class="card-head"><b>รายการที่เปิดบิลจริง (${billedList.length} รายการ)</b></div>
    <div class="card-body" style="padding:0;overflow-x:auto">
    ${billedList.length ? `<table style="border-collapse:collapse;font-size:14px">
    <thead><tr><th style="${th}">#</th><th style="${th}">กลุ่ม</th><th style="${th}">รหัส</th><th style="${th}">ชื่อพนักงานขาย</th><th style="${th}">รหัสร้าน</th><th style="${th}">ชื่อร้าน</th><th style="${th}">สินค้า</th><th style="${th}">ลัง</th><th style="${th}">ยอดจริง (บาท)</th></tr></thead>
    <tbody>${billedList.sort((a,b) => a.sc.localeCompare(b.sc) || a.cat.localeCompare(b.cat)).map((b,i) => `<tr style="background:${i%2?'#fafbfd':'#fff'}">
      <td style="${td};text-align:center">${i+1}</td>
      <td style="${td};text-align:center;font-weight:700;color:${b.cat==='แนะนำ-ขายดี'?'#a87800':'#1a6fb8'}">${b.cat}</td>
      <td style="${td};text-align:center">${b.sc}</td>
      <td style="${td};text-align:left">${b.sale}</td>
      <td style="${td};text-align:center;font-family:monospace">${b.cust}</td>
      <td style="${td};text-align:left">${b.custName}</td>
      <td style="${td};text-align:left">${b.prod}</td>
      <td style="${td}">${f1(b.cs)}</td>
      <td style="${td}">${f0(b.baht)}</td></tr>`).join('')}</tbody></table>` : '<p style="padding:16px;color:var(--muted)">ยังไม่มีรายการที่เปิดบิลจริง</p>'}
    </div></div>`;
}

      <tbody>${rows}</tbody></table>` : '<p style="padding:16px;color:var(--muted)">ไม่พบเป้า KPI-ลูกหนี้-วัน ในชีต Target</p>'}

function renderChannel() {
  const el = document.getElementById('channelContent');
  if (!el) return;
  const channelRaw  = state.channelRaw || [];
  if (!channelRaw.length) { el.innerHTML = '<p style="padding:16px;color:#b00">ไม่มีข้อมูล sheet Channal</p>'; return; }

  const lbp = state.latestBpMonth;
  const wd  = getWorkingDaysInfo(getWdMonth());

  // parseCsvDedup gives: r[''] = WH, r['_2'] = Location
  // r['BPlus Mom&Pop Target'], r['Actual']   = BPlus Mom&Pop target/actual
  // r['BPlus Wholesales Target'], r['Actual_2'] = BPlus Wholesales target/actual
  // r['Distributor Target'], r['Actual_3']   = Distributor target/actual
  const COLS = ['BPlus Mom&Pop', 'BPlus Wholesales', 'Distributor'];
  const COL_TGT = {'BPlus Mom&Pop':'BPlus Mom&Pop Target','BPlus Wholesales':'BPlus Wholesales Target','Distributor':'Distributor Target'};
  const COL_ACT = {'BPlus Mom&Pop':'Actual','BPlus Wholesales':'Actual_2','Distributor':'Actual_3'};

  const tgtMap = new Map();
  const actMap = new Map();
  const locMap = new Map();
  channelRaw.forEach(r => {
    const sec = String(r['']||'').trim().toUpperCase();
    if (!sec) return;
    const loc = String(r['_2']||'').trim();
    if (loc) locMap.set(sec, loc);
    if (!tgtMap.has(sec)) tgtMap.set(sec, new Map());
    if (!actMap.has(sec)) actMap.set(sec, new Map());
    COLS.forEach(mc => {
      const t = parseNum(r[COL_TGT[mc]]||'');
      const a = parseNum(r[COL_ACT[mc]]||'');
      if (t) tgtMap.get(sec).set(mc, (tgtMap.get(sec).get(mc)||0) + t);
      if (a) actMap.get(sec).set(mc, (actMap.get(sec).get(mc)||0) + a);
    });
  });

  const getTgt = (wh,mc) => (tgtMap.get(wh)||new Map()).get(mc)||0;
  const getAct = (wh,mc) => (actMap.get(wh)||new Map()).get(mc)||0;

  const ROWS = ['ST','W1','W2','W3','W4'].map(k => ({
    key: k,
    label: locMap.get(k) || {ST:'Ship to',W1:'สมุทรสงคราม',W2:'สุพรรณบุรี',W3:'ราชบุรี',W4:'นครปฐม'}[k] || k,
  }));

  const BD='#000';
  const C_HDR1 = '#dce8f0';   // column group header
  const C_HDR2 = '#eef4f8';   // sub-header (Target/Actual/%)
  const C_TOT  = '#e6eff5';   // grand-total row
  const C_META = '#4a90b8';   // Time Used / Week header cells
  const C_TITL = '#1a3a55';   // title bar background
  const pctBg = p => p>=wd.pct?'#c8ecd4':'#fdd9d7';  // lighter green/red
  const fmtN   = v => v ? Math.round(v).toLocaleString() : '-';
  const tdPct  = (a,t,base) => t>0
    ? `<td style="${base};text-align:center;background:${pctBg(a/t*100)};color:#000;font-weight:700">${(a/t*100).toFixed(2)}%</td>`
    : `<td style="${base};text-align:center;color:#000">-</td>`;

  const tdS = `padding:8px 12px;border:1px solid ${BD};text-align:right;white-space:nowrap;color:#000`;
  const tdL = `padding:8px 12px;border:1px solid ${BD};font-weight:700;color:#000`;

  // Build grand total
  const allWh = ROWS.map(r=>r.key);
  const sumTgt = mc => allWh.reduce((s,wh) => s+getTgt(wh,mc), 0);
  const sumAct = mc => allWh.reduce((s,wh) => s+getAct(wh,mc), 0);
  const totalTgt = COLS.reduce((s,mc) => s+sumTgt(mc), 0);
  const totalAct = COLS.reduce((s,mc) => s+sumAct(mc), 0);

  // Header: colspan per col group = 3 (target, actual, %)
  let colHeaders = COLS.map(mc =>
    `<th colspan="3" style="background:${C_HDR1};color:#000;font-weight:700;text-align:center;padding:8px;border:1px solid ${BD}">${mc}</th>`
  ).join('');
  colHeaders += `<th colspan="3" style="background:${C_HDR1};color:#000;font-weight:700;text-align:center;padding:8px;border:1px solid ${BD}">Total</th>`;

  let subHeaders = COLS.map(() =>
    ['Target','Actual','%'].map(h =>
      `<th style="background:${C_HDR2};color:#000;font-weight:600;text-align:center;padding:6px 8px;border:1px solid ${BD};font-size:12px">${h}</th>`
    ).join('')
  ).join('');
  subHeaders += ['Target','Actual','%'].map(h =>
    `<th style="background:${C_HDR2};color:#000;font-weight:600;text-align:center;padding:6px 8px;border:1px solid ${BD};font-size:12px">${h}</th>`
  ).join('');

  // Grand total row
  let totalRow = `<tr style="background:${C_TOT};font-weight:700">
    <td colspan="2" style="${tdL};background:${C_HDR1};text-align:center">รวมทั้งหมด</td>`;
  COLS.forEach(mc => {
    const t=sumTgt(mc), a=sumAct(mc);
    totalRow += `<td style="${tdS}">${fmtN(t)}</td><td style="${tdS}">${fmtN(a)}</td>${tdPct(a,t,tdS)}`;
  });
  totalRow += `<td style="${tdS}">${fmtN(totalTgt)}</td><td style="${tdS}">${fmtN(totalAct)}</td>${tdPct(totalAct,totalTgt,tdS)}`;
  totalRow += '</tr>';

  const whBg = wh => wh==='ST'?'rgba(255,220,50,.10)':wh==='W1'?'rgba(255,220,50,.10)':wh==='W2'?'rgba(100,180,255,.10)':wh==='W3'?'rgba(255,120,80,.09)':wh==='W4'?'rgba(46,204,113,.09)':'';

  // Data rows
  let bodyHtml = totalRow;
  ROWS.forEach(row => {
    const rowTgt = COLS.reduce((s,mc)=>s+getTgt(row.key,mc),0);
    const rowAct = COLS.reduce((s,mc)=>s+getAct(row.key,mc),0);
    const rbg = whBg(row.key);
    bodyHtml += `<tr style="${rbg?'background:'+rbg:''}">
      <td style="${tdL};background:${C_HDR2};text-align:center">${row.key}</td>
      <td style="${tdL}${rbg?';background:'+rbg:''}">${row.label}</td>`;
    COLS.forEach(mc => {
      const t=getTgt(row.key,mc), a=getAct(row.key,mc);
      bodyHtml += `<td style="${tdS}${rbg?';background:'+rbg:''}">${fmtN(t)}</td><td style="${tdS}${rbg?';background:'+rbg:''}">${fmtN(a)}</td>${tdPct(a,t,tdS+(rbg?';background:'+rbg:''))}`;
    });
    bodyHtml += `<td style="${tdS}${rbg?';background:'+rbg:''}">${fmtN(rowTgt)}</td><td style="${tdS}${rbg?';background:'+rbg:''}">${fmtN(rowAct)}</td>${tdPct(rowAct,rowTgt,tdS+(rbg?';background:'+rbg:''))}`;
    bodyHtml += '</tr>';
  });

  const metaStyle = `background:${C_META};color:#fff;font-weight:700;text-align:center;padding:7px 10px;border:1px solid ${BD}`;
  const numCols = COLS.length * 3 + 3 + 2;

  el.innerHTML = `<div class="tbl-wrap"><table style="border-collapse:collapse;font-size:13px;white-space:nowrap;width:auto;table-layout:auto">
  <thead>
    <tr>
      <th colspan="${numCols - 5}" style="background:${C_TITL};padding:12px 16px;border:1px solid ${BD}">
        <span style="color:#f5c842;font-size:18px;font-weight:700">Rattana Sales Performance (RSP)</span>
      </th>
      <th style="${metaStyle}">Time Used</th>
      <th style="${metaStyle}">Week</th>
      <th style="${metaStyle}">วันที่</th>
      <th style="${metaStyle}">วันทำงานทั้งหมด</th>
      <th style="${metaStyle}">วันทำงานเหลือ</th>
    </tr>
    <tr>
      <th colspan="${numCols - 5}" style="background:${C_TITL};border:1px solid ${BD}"></th>
      <th style="${metaStyle};font-size:15px">${Math.round(wd.pct)}%</th>
      <th style="${metaStyle};font-size:15px">${wd.weekOfMonth||'-'}</th>
      <th style="${metaStyle};font-size:15px">${wd.dateStr}</th>
      <th style="${metaStyle};font-size:15px">${wd.totalWork}</th>
      <th style="${metaStyle};font-size:15px">${wd.remaining}</th>
    </tr>
    <tr>
      <th style="background:${C_HDR1};color:#000;border:1px solid ${BD};padding:8px">WH</th>
      <th style="background:${C_HDR1};color:#000;border:1px solid ${BD};padding:8px">จังหวัด</th>
      ${colHeaders}
    </tr>
    <tr>
      <th style="background:#daedf5;border:1px solid ${BD}"></th>
      <th style="background:#daedf5;border:1px solid ${BD}"></th>
      ${subHeaders}
    </tr>
  </thead>
  <tbody>${bodyHtml}</tbody>
</table></div>`;
}

  document.body.appendChild(t); setTimeout(()=>t.remove(),3500);

const ONTOP_SAVE_URL = 'https://script.google.com/macros/s/AKfycbw0UBLrnlIIaHKOc6B6MrHKprspYEC0mZ7-GTFeDqPdKC7NC9HiKPeRhWLlc8QnXkmx_w/exec';

function tableToGrid(tbl) {
  const grid = [];
  [...tbl.rows].forEach((tr, ri) => {
    grid[ri] = grid[ri] || [];
    let ci = 0;
    [...tr.cells].forEach(td => {
      while (grid[ri][ci] !== undefined) ci++;
      const txt = td.innerText.replace(/\s*\n\s*/g, ' ').trim();
      for (let r = 0; r < td.rowSpan; r++) for (let c = 0; c < td.colSpan; c++) {
        grid[ri + r] = grid[ri + r] || [];
        grid[ri + r][ci + c] = (r === 0 && c === 0) ? txt : '';
      }
      ci += td.colSpan;
    });
  });
  return grid.map(r => Array.from(r, v => v === undefined ? '' : v));
}

async function saveOnTopToSheet() {
  if (!ONTOP_SAVE_URL) { showToast('ยังไม่ได้ตั้งค่า URL ของ Apps Script', 'warning'); return; }
  const tbls = document.querySelectorAll('#onTopContent table');
  if (!tbls.length) { showToast('ยังไม่มีข้อมูล On Top', 'warning'); return; }
  if (!confirm('บันทึกค่า "ทำได้" ลงชีต Ontop?')) return;
  showSpinner('กำลังบันทึก...');
  try {
    const n = s => { const v = parseFloat(String(s).replace(/,/g,'')); return isNaN(v) ? '' : v; };
    const items = [];
    tbls.forEach(t => tableToGrid(t).forEach(g => {
      const code = String(g[3]||'').trim();
      if (/^[A-Z]{2,4}\d{2,4}$/i.test(code)) items.push({ code, ton: n(g[5]), baht: n(g[7]), str: n(g[9]) });
    }));
    const rows = items;
    const BATCH = 20;
    for (let i = 0; i < items.length; i += BATCH) {
      const lm = state.latestBpMonth;
      const month = lm ? ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'][lm.mm-1] + ' ' + (lm.yyyy + 543) : '';
      const payload = { target: 'ontop', month, items: items.slice(i, i + BATCH) };
      await new Promise(resolve => {
        const s = document.createElement('script');
        s.src = ONTOP_SAVE_URL + '?payload=' + encodeURIComponent(JSON.stringify(payload));
        s.onerror = () => { s.remove(); resolve(); };
        s.onload = () => { s.remove(); resolve(); };
        document.body.appendChild(s);
      });
    }
    hideSpinner();
    showToast('บันทึกลงชีต Ontop สำเร็จ ' + rows.length + ' คน', 'success');
  } catch (e) {
    hideSpinner();
    showToast('บันทึกไม่สำเร็จ: ' + e.message, 'error');
  }
}
async function sendOnTopToLine() {
  const el = document.querySelector('#onTopContent .tbl-wrap') || document.getElementById('onTopContent');
  if (!el || !el.querySelector('table')) { showToast('ยังไม่มีข้อมูล On Top', 'warning'); return; }
  if (typeof html2canvas === 'undefined') { showToast('โหลดตัวแคปหน้าจอไม่สำเร็จ ลองรีเฟรช', 'error'); return; }
  const tbl = el.querySelector('table');
  const lm = state.latestBpMonth;
  const mn = lm ? ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'][lm.mm-1] + ' ' + (lm.yyyy + 543) : '';
  const text = `On Top ยอดขายเดือน ${mn}\nข้อมูล ณ ${formatThaiDateTimeSave(new Date())} น.`;
  const blobP = html2canvas(tbl, { backgroundColor: '#ffffff', scale: 2 }).then(c => new Promise(res => c.toBlob(res, 'image/png')));
  const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  try {
    if (isMobile && navigator.canShare) {
      const file = new File([await blobP], 'ontop.png', { type: 'image/png' });
      if (navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], text }); return; }
    }
    if (navigator.clipboard && window.ClipboardItem) {
      await navigator.clipboard.write([new ClipboardItem({ 'image/png': blobP })]);
      showToast('คัดลอกรูปแล้ว เปิด LINE เข้ากลุ่ม แล้วกด Ctrl+V เพื่อวางรูป', 'success');
      return;
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(await blobP);
    a.download = 'ontop.png';
    a.click();
    showToast('บันทึกรูปแล้ว ลากรูปไปวางในกลุ่ม LINE ได้เลย', 'success');
  } catch (e) {
    if (e && e.name === 'AbortError') return;
    showToast('แชร์ไม่สำเร็จ: ' + e.message, 'error');
  }
}
function formatThaiDateTimeSave(d) {
  const p = n => String(n).padStart(2, '0');
  return `${p(d.getDate())}/${p(d.getMonth()+1)}/${d.getFullYear()+543} ${p(d.getHours())}.${p(d.getMinutes())}`;
}

const SAVE_ACTUAL_URL = 'https://script.google.com/macros/s/AKfycbw0UBLrnlIIaHKOc6B6MrHKprspYEC0mZ7-GTFeDqPdKC7NC9HiKPeRhWLlc8QnXkmx_w/exec';

async function saveActualToSheet() {
  if (!state.rows || !state.rows.length) { showToast('ยังไม่มีข้อมูล', 'warning'); return; }
  if (!confirm('บันทึกค่า "ทำได้" ลงชีต สรุปยอดขาย?')) return;
  showSpinner('กำลังบันทึก...');
  try {
    const noDecUnit = new Set(['บาท','ร้าน','SKU','%บาท']);
    const allRows = state.rows.filter(r => r.supported).map(r => {
      const act = r.actual != null ? (noDecUnit.has(r.unit) ? Math.round(r.actual) : Math.round(r.actual * 100) / 100) : null;
      return { name: r.name, goalName: r.goalName, actual: act,
        pct: r.pct !== null ? Math.round(r.pct * 100) / 100 : null };
    });
    const BATCH = 20;
    let totalUpdated = 0;
    for (let i = 0; i < allRows.length; i += BATCH) {
      const batch = allRows.slice(i, i + BATCH);
      const p = encodeURIComponent(JSON.stringify({ rows: batch }));
      const u = SAVE_ACTUAL_URL + '?payload=' + p;
      await new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = u;
        s.onload = () => { s.remove(); resolve(); };
        s.onerror = () => { s.remove(); resolve(); };
        document.body.appendChild(s);
      });
      totalUpdated += batch.length;
    }
    hideSpinner();
    showToast('บันทึกสำเร็จ ' + totalUpdated + ' รายการ', 'success');
  } catch (e) {
    hideSpinner();
    showToast('บันทึกไม่สำเร็จ: ' + e.message, 'error');
  }
}
