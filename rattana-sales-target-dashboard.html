<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Rattana ยอดขายเทียบเป้าหมาย</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root {
  --navy:        #0d1b3e;
  --navy-mid:    #1a2f5e;
  --navy-light:  #243b73;
  --gold:        #c9a84c;
  --gold-light:  #e8c86a;
  --success:  #2ecc71;
  --danger:   #e74c3c;
  --warning:  #f39c12;
  --info:     #3498db;
  --bg:       #f4f6fb;
  --text:     #0d1b3e;
  --card-bg:  #ffffff;
  --border:   #dde3f0;
  --muted:    #6b7896;
  --row-alt:  #fafbfd;
  --space-xs:  4px; --space-sm:  8px; --space-md:  16px; --space-lg:  24px; --space-xl:  32px;
  --radius-sm:  6px; --radius-md:  12px; --radius-lg:  16px; --radius-xl:  20px;
  --shadow-sm:  0 1px 4px rgba(0,0,0,.06);
  --shadow-md:  0 2px 8px rgba(0,0,0,.08);
  --shadow-lg:  0 8px 24px rgba(13,27,62,.12);
  --shadow-gold: 0 4px 12px rgba(201,168,76,.35);
}
body.dark {
  --bg:       #0a1020;
  --text:     #e8eaf0;
  --card-bg:  #111c35;
  --border:   #243b73;
  --muted:    #8a98b8;
  --row-alt:  #0f1830;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Sarabun',sans-serif;font-size:14px;line-height:1.5;min-height:100dvh;overflow-x:hidden;background-color:var(--bg);color:var(--text);transition:background-color .25s,color .25s}
button{font-family:inherit;cursor:pointer;border:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
input,select,textarea{font-family:inherit;font-size:16px}

header{background:var(--navy);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:12px;border-bottom:3px solid var(--gold);padding-top:max(12px,env(safe-area-inset-top))}
.logo-text{font-weight:700;letter-spacing:1px;font-size:16px;color:#fff;line-height:1.25}
.logo-text span{color:var(--gold)}
.logo-text small{display:block;font-weight:400;font-size:11px;color:rgba(255,255,255,.65);letter-spacing:.3px}
.icon-btn{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.2);width:38px;height:38px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-size:18px;transition:background .15s;flex-shrink:0}
.icon-btn:hover{background:rgba(255,255,255,.12)}

.tab-nav{display:flex;background:var(--navy);border-bottom:3px solid var(--gold);padding:0 8px;gap:4px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tab-nav::-webkit-scrollbar{display:none}
.tab-btn{background:transparent;border:none;color:rgba(255,255,255,.6);padding:12px 18px;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;flex-shrink:0;transition:all .18s;margin-bottom:-3px;border-radius:var(--radius-sm) var(--radius-sm) 0 0}
.tab-btn:hover{color:#fff;background:rgba(255,255,255,.06)}
.tab-btn.active{color:var(--navy);background:var(--gold);border-bottom-color:var(--gold);font-weight:700;box-shadow:0 -2px 8px rgba(201,168,76,.3)}

.card{background:var(--card-bg);border-radius:var(--radius-md);border:1px solid var(--border);box-shadow:var(--shadow-md)}
.card-gold{border-top:3px solid var(--gold)}
.card-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border);background:linear-gradient(to right,rgba(201,168,76,.07),transparent);gap:8px;flex-wrap:wrap}
.card-head h3{font-size:15px;font-weight:700}
.card-body{padding:16px}

.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;border:1px solid transparent;min-height:40px;transition:opacity .15s,transform .1s;-webkit-tap-highlight-color:transparent}
.btn:hover{opacity:.88}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn-gold{background:var(--gold);color:var(--navy);border-color:var(--gold)}
.btn-gold:hover{background:var(--gold-light)}
.btn-outline{background:transparent;color:var(--text);border-color:var(--border)}
.btn-sm{padding:5px 10px;font-size:12px;min-height:30px}

.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;white-space:nowrap}
.badge-ok{background:#e8f7ee;color:#1e8449}
.badge-warn{background:#fef3d7;color:#a87800}
.badge-danger{background:#ffd5d0;color:#c0392b}
.badge-info{background:#e3f0fd;color:#1a6fb8}
.badge-gold{background:rgba(201,168,76,.18);color:var(--navy);border:1px solid rgba(201,168,76,.4)}
.badge-muted{background:rgba(107,120,150,.15);color:var(--muted)}
body.dark .badge-ok{background:#1a3a25;color:#7be0a3}
body.dark .badge-warn{background:#3a2e15;color:#e8c86a}
body.dark .badge-danger{background:#3a1a17;color:#ff8a7e}
body.dark .badge-info{background:#132a42;color:#7fc4f7}

.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl{width:100%;border-collapse:collapse;min-width:820px}
.tbl thead{background:var(--navy);color:#fff;position:sticky;top:0;z-index:5}
.tbl thead th{padding:10px 10px;text-align:left;font-size:12px;font-weight:600;letter-spacing:.3px;white-space:nowrap;border-bottom:2px solid var(--gold);cursor:pointer;user-select:none}
.tbl thead th:hover{background:var(--navy-mid)}
.tbl thead th .sort-ind{font-size:10px;color:var(--gold);margin-left:4px;font-weight:700}
.tbl tbody tr{border-bottom:1px solid var(--border);transition:background .12s}
.tbl tbody tr:nth-child(even){background:var(--row-alt)}
.tbl tbody tr:hover{background:rgba(201,168,76,.07)}
.tbl td{padding:9px 10px;font-size:13px;vertical-align:middle}
.tbl td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:500}
.tbl .empty-row td{text-align:center;padding:48px 20px;color:var(--muted);font-size:14px}

.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.3px;text-transform:uppercase}
.input{height:44px;padding:0 14px;border-radius:var(--radius-sm);border:1.5px solid var(--border);background:var(--card-bg);color:var(--text);font-size:16px;font-family:inherit;outline:none;width:100%;transition:border-color .15s}
.input:focus{border-color:var(--gold)}

.toast{position:fixed;bottom:max(24px,env(safe-area-inset-bottom));right:16px;padding:12px 20px;border-radius:var(--radius-md);color:#fff;z-index:9999;animation:slideIn .3s ease;font-weight:500;box-shadow:var(--shadow-lg);max-width:90vw;font-size:13px}
.toast-success{background:var(--success)}
.toast-error{background:var(--danger)}
.toast-warning{background:var(--warning);color:var(--navy)}
.toast-info{background:var(--navy-mid);border-left:3px solid var(--gold)}

.spinner-overlay{display:none;position:fixed;inset:0;background:rgba(13,27,62,.55);align-items:center;justify-content:center;z-index:99999;backdrop-filter:blur(3px)}
.spinner-overlay.show{display:flex}
.spinner-box{background:#fff;border-radius:var(--radius-lg);padding:32px 40px;text-align:center;border-top:4px solid var(--gold);min-width:240px}
.spinner-ring{width:48px;height:48px;border:5px solid #dde3f0;border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px}
body.dark .spinner-box{background:var(--card-bg)}
#loadingBar{position:fixed;top:0;left:0;height:3px;background:var(--gold);width:0;transition:width .4s;z-index:10000}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes slideIn{from{transform:translateX(120%);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

.flex{display:flex}.flex-center{display:flex;align-items:center;justify-content:center}.flex-between{display:flex;align-items:center;justify-content:space-between}.gap-4{gap:4px}.gap-8{gap:8px}.gap-12{gap:12px}.gap-16{gap:16px}
.mt-8{margin-top:8px}.mt-12{margin-top:12px}.mt-16{margin-top:16px}.mb-8{margin-bottom:8px}.mb-12{margin-bottom:12px}.mb-16{margin-bottom:16px}
.txt-sm{font-size:12px}.txt-muted{color:var(--muted)}.txt-gold{color:var(--gold)}.txt-danger{color:var(--danger)}.txt-success{color:var(--success)}.txt-bold{font-weight:700}.txt-center{text-align:center}.txt-right{text-align:right}
.num{font-variant-numeric:tabular-nums;font-weight:500}
.w-full{width:100%}.rounded{border-radius:var(--radius-md)}.hidden{display:none !important}
.flex-wrap{flex-wrap:wrap}

.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:640px){.stat-grid{grid-template-columns:repeat(4,1fr);gap:14px}}
.stat-card{background:var(--card-bg);border-radius:var(--radius-md);padding:16px;border:1px solid var(--border);border-top:3px solid var(--gold)}
.stat-card .s-label{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.4px;text-transform:uppercase;margin-bottom:6px}
.stat-card .s-value{font-size:22px;font-weight:700;line-height:1.2}
.stat-card .s-sub{font-size:11px;color:var(--muted);margin-top:4px}
.stat-card.danger{border-top-color:var(--danger)}.stat-card.danger .s-value{color:var(--danger)}
.stat-card.success{border-top-color:var(--success)}.stat-card.success .s-value{color:var(--success)}
@media(min-width:640px){.stat-card .s-value{font-size:26px}}

.page{min-height:100dvh;display:flex;flex-direction:column}
.content{flex:1;padding:12px;max-width:1200px;margin:0 auto;width:100%}
@media(min-width:640px){.content{padding:16px}}
@media(min-width:1024px){.content{padding:20px}}

.filter-bar{position:sticky;top:0;z-index:60;background:var(--bg);padding:10px 0;display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}

.chip-group{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:7px 14px;border-radius:20px;border:1.5px solid var(--border);background:var(--card-bg);color:var(--text);font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;min-height:36px}
.chip:hover{border-color:var(--gold)}
.chip.active{background:var(--navy);color:#fff;border-color:var(--navy)}

.dd-wrap{position:relative;min-width:220px;flex:1}
.dd-trigger{width:100%;min-height:44px;padding:10px 14px;background:var(--card-bg);border:1.5px solid var(--border);border-radius:10px;color:var(--text);font-family:'Sarabun',sans-serif;font-size:14px;text-align:left;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:6px}
.dd-panel{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--card-bg);border:1.5px solid var(--border);border-radius:10px;z-index:500;box-shadow:0 8px 24px rgba(0,0,0,.15);max-height:280px;display:none;flex-direction:column}
.dd-panel.open{display:flex}
.dd-search{padding:10px 14px;font-size:16px;border:none;border-bottom:1px solid var(--border);background:transparent;color:var(--text);outline:none;border-radius:10px 10px 0 0;font-family:'Sarabun',sans-serif}
.dd-list{overflow-y:auto;flex:1;list-style:none;padding:4px 0;margin:0}
.dd-list li{padding:10px 14px;cursor:pointer;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dd-list li:hover{background:var(--navy-light);color:#fff}
.dd-list li.no-result{color:#999;cursor:default;font-style:italic}

.perf-row{display:grid;grid-template-columns:1fr;gap:6px;padding:12px 0;border-bottom:1px solid var(--border)}
.perf-row:last-child{border-bottom:none}
.perf-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.perf-name{font-weight:600;font-size:13px}
.perf-bar-track{height:10px;border-radius:5px;background:var(--border);overflow:hidden;width:100%}
.perf-bar-fill{height:100%;border-radius:5px;transition:width .5s ease}
.perf-nums{font-size:11px;color:var(--muted)}

#backToTop{position:fixed;bottom:max(24px,calc(16px + env(safe-area-inset-bottom)));right:max(16px,calc(12px + env(safe-area-inset-right)));background:var(--gold);color:var(--navy);border:none;border-radius:50%;width:46px;height:46px;display:none;align-items:center;justify-content:center;box-shadow:var(--shadow-gold);z-index:90;font-size:18px;font-weight:700;cursor:pointer}
#backToTop.show{display:flex}

#loginScreen{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(160deg,var(--navy) 0%,#152449 60%,var(--navy-mid) 100%)}
.login-card{background:var(--card-bg);border-radius:var(--radius-xl);padding:36px 30px;max-width:380px;width:100%;text-align:center;border-top:4px solid var(--gold);box-shadow:var(--shadow-lg)}
.login-card h1{font-size:19px;margin:16px 0 4px;color:var(--text)}
.login-card p{font-size:13px;color:var(--muted);margin-bottom:22px}
#loginErr{color:var(--danger);font-size:12px;margin-top:14px;display:none}

/* ── Pivot table ── */
.info-bar{display:flex;gap:20px;align-items:center;flex-wrap:wrap;background:var(--navy);color:#fff;padding:10px 16px;border-radius:var(--radius-md);margin-bottom:14px;border-bottom:3px solid var(--gold)}
.info-bar-title{font-size:14px;font-weight:700;margin-right:auto;letter-spacing:.5px}
.info-bar-item{display:flex;flex-direction:column;align-items:center;gap:1px}
.info-bar-label{font-size:10px;color:rgba(255,255,255,.6);letter-spacing:.4px;text-transform:uppercase;white-space:nowrap}
.info-bar-val{font-size:15px;font-weight:700;color:var(--gold)}
.ptbl-block{margin-bottom:14px;border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border);box-shadow:var(--shadow-sm)}
.ptbl-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.ptbl{border-collapse:collapse;font-size:12px;min-width:500px;width:100%}
.ptbl-name-cell{padding:9px 12px;text-align:left;white-space:nowrap;background:var(--navy);border-right:2px solid var(--gold);vertical-align:middle;min-width:130px;position:sticky;left:0;z-index:2}
.ptbl-person-name{font-size:12px;font-weight:700;color:#fff;line-height:1.3}
.ptbl-person-wh{font-size:10px;color:var(--gold);margin-top:2px}
.ptbl-th{padding:5px 8px;text-align:center;background:var(--navy-mid);border:1px solid rgba(255,255,255,.12);border-bottom:2px solid var(--gold);min-width:80px;max-width:110px}
.ptbl-th-val{font-size:11px;font-weight:600;color:#fff}
.ptbl-th-unit{font-size:10px;color:var(--gold-light);margin-top:1px}
.ptbl-label{padding:7px 10px;font-size:11px;font-weight:600;color:var(--muted);background:var(--row-alt);border-right:2px solid var(--gold);white-space:nowrap;text-align:left;position:sticky;left:0;z-index:1;min-width:130px}
.ptbl tbody tr:nth-child(even) .ptbl-label{background:var(--card-bg)}
.ptbl-td{padding:6px 8px;text-align:right;font-variant-numeric:tabular-nums;border:1px solid var(--border);font-size:12px}
.ptbl tbody tr:hover{background:rgba(201,168,76,.05)}
.ptbl-ok{background:#d4edda !important;color:#155724;font-weight:700}
.ptbl-warn{background:#fff3cd !important;color:#856404;font-weight:700}
.ptbl-danger{background:#f8d7da !important;color:#721c24;font-weight:700}
.ptbl-muted{color:var(--muted);background:transparent !important}
body.dark .ptbl-ok{background:#1a3a25 !important;color:#7be0a3}
body.dark .ptbl-warn{background:#3a2e15 !important;color:#e8c86a}
body.dark .ptbl-danger{background:#3a1a17 !important;color:#ff8a7e}
body.dark .ptbl-name-cell{background:var(--navy)}
body.dark .ptbl-th{background:var(--navy-mid)}
body.dark .ptbl-label{background:var(--row-alt)}
body.dark .ptbl-td{border-color:var(--border)}
</style>
</head>
<body>

<div id="loadingBar"></div>
<div class="spinner-overlay" id="spinner">
  <div class="spinner-box">
    <div class="spinner-ring"></div>
    <p id="spinnerMsg">กำลังโหลด...</p>
  </div>
</div>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-card">
    <div style="width:64px;height:64px;margin:0 auto;border-radius:50%;background:var(--navy);border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--gold);font-size:20px;letter-spacing:1px">RP</div>
    <h1>Rattana ยอดขายเทียบเป้าหมาย</h1>
    <p>เข้าสู่ระบบด้วยบัญชี Google ของบริษัท</p>
    <div id="g_id_onload"
      data-client_id="615875645128-gasjjvkt6lu8g449cbnhl40k1pu25r0b.apps.googleusercontent.com"
      data-callback="handleGoogleLogin"
      data-auto_prompt="false">
    </div>
    <div class="g_id_signin flex-center" data-type="standard" data-size="large" data-theme="outline" data-text="sign_in_with"></div>
    <p id="loginErr"></p>
  </div>
</div>

<!-- APP -->
<div class="page hidden" id="appScreen">
  <header>
    <div class="logo-text">RATTANA<span>·</span>SALES
      <small>ยอดขายเทียบเป้าหมาย v1.69</small>
    </div>
    <div class="flex gap-8" style="margin-left:auto">
      <button class="icon-btn" id="btnRefresh" onclick="refreshData()" title="รีเฟรช">⟳</button>
      <button class="icon-btn" onclick="toggleDark()" title="โหมดมืด">🌙</button>
      <button class="icon-btn" onclick="logout()" title="ออกจากระบบ">⏻</button>
    </div>
  </header>

  <div class="tab-nav">
    <button class="tab-btn active" data-tab="detail" onclick="switchTab('detail')">รายละเอียดเป้าหมาย</button>
    <button class="tab-btn" data-tab="outlets" onclick="switchTab('outlets')">Outlets</button>
    <button class="tab-btn" data-tab="ontop" onclick="switchTab('ontop')">On Top</button>
    <button class="tab-btn" data-tab="roo" onclick="switchTab('roo')">ROO</button>
  </div>

  <div class="content">
    <div class="filter-bar">
      <div class="field" style="min-width:170px">
        <label>คลัง</label>
        <div class="chip-group" id="whChips"></div>
      </div>
      <div class="field" style="flex:1;min-width:220px">
        <label>ชื่อ สกุล (เซลล์)</label>
        <div class="dd-wrap" id="nameDDWrap">
          <button class="dd-trigger" type="button" onclick="toggleDD('nameDDWrap')">
            <span id="nameDDLabel">ทั้งหมด</span> <span>▾</span>
          </button>
          <div class="dd-panel" id="nameDDPanel">
            <input class="dd-search" type="text" placeholder="🔍 ค้นหาชื่อ..." oninput="filterDD(this,'nameDDList')" autocomplete="off">
            <ul class="dd-list" id="nameDDList"></ul>
          </div>
        </div>
      </div>
      <div class="txt-sm txt-muted" id="dataMonthLabel" style="align-self:center;padding-bottom:10px"></div>
    </div>

    <!-- DETAIL TAB -->
    <div id="tab-detail">
      <div id="pivotInfoBar"></div>
      <div class="flex-between mb-12 flex-wrap gap-8" style="align-items:center">
        <span class="txt-sm txt-muted" id="pivotMonthLabel"></span>
        <button class="btn btn-outline btn-sm" onclick="exportDetailExcel()">⭳ Excel</button>
      </div>
      <div id="pivotContainer"></div>
    </div>
    <div id="tab-outlets" class="hidden">
      <div id="outletContent"></div>
    </div>
    <div id="tab-ontop" class="hidden">
      <div id="onTopContent"></div>
    </div>
    <div id="tab-roo" class="hidden">
      <div id="rooContent"></div>
    </div>
  </div>
</div>

<button id="backToTop" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>

<script>
/* ================= CONFIG ================= */
const TARGET_SHEET_ID = '1dAxF4Mz-zhJIVbuJ_Ql126gt08qvVS1wndJD50pqCZI';
const TARGET_SHEET_NAME = 'Target';
const BP_SHEET_ID = '1NxFkxiQev0xxGir93-qt0flNfzHz848-KuE7jDRSxQE';
const BP_SHEET_NAME = 'BP';
const CN_SHEET_ID = '1WNJFRUTMZg4lGftUJRLyTuLczhobmFb6jsOrm9l_TYg';
const CN_SHEET_NAME = 'incentive CN หัวข้อเซลล์';

/* ================= CSV / SHEETS ================= */
function parseCsv(text) {
  if (!text) return [];
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  const rows = []; let row = [], cell = '', inQuote = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (inQuote) {
      if (ch === '"') { if (text[i+1]==='"'){cell+='"';i++;}else inQuote=false; }
      else cell += ch;
    } else {
      if (ch==='"') inQuote=true;
      else if (ch===',') { row.push(cell); cell=''; }
      else if (ch==='\r') { /* skip */ }
      else if (ch==='\n') { row.push(cell); rows.push(row); row=[]; cell=''; }
      else cell += ch;
    }
  }
  if (cell.length||row.length) { row.push(cell); rows.push(row); }
  if (!rows.length) return [];
  const clean = s => String(s||'').replace(/[​‌‍﻿]/g,'').replace(/ /g,' ').trim();
  const headers = rows[0].map(clean);
  return rows.slice(1).filter(r=>r.some(c=>clean(c))).map(r=>{
    const obj = {};
    headers.forEach((k,i)=>{ if(!(k in obj)) obj[k]=clean(r[i]); });
    return obj;
  });
}

async function loadFromSheets(sheetId, sheetName) {
  const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(sheetName)}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error('fetch failed: ' + sheetName);
  return parseCsv(await res.text());
}

/* ================= AUTH ================= */
function decodeJwtPayload(token) {
  const parts = String(token||'').split('.');
  if (parts.length < 2) throw new Error('JWT format invalid');
  let b64 = parts[1].replace(/-/g, '+').replace(/_/g, '/');
  const pad = (4 - b64.length % 4) % 4;
  if (pad) b64 += '='.repeat(pad);
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return JSON.parse(new TextDecoder('utf-8').decode(bytes));
}

/* ================= HELPERS ================= */
const parseNum = s => { const n = parseFloat(String(s||'').replace(/,/g,'')); return isNaN(n)?0:n; };
const normalizeText = s => String(s||'').replace(/\s+/g,' ').trim();
const normalizeName = s => normalizeText(String(s||'').replace(/^คุณ\s*/,''));
const fmtNum = (n, digits=0) => Number(n||0).toLocaleString('th-TH', {minimumFractionDigits:digits, maximumFractionDigits:digits});

function parseTargetName(name) {
  const parts = String(name||'').split('-');
  if (parts.length < 3) return null;
  return { dim: parts[0].trim(), value: parts.slice(1,-1).join('-').trim(), unit: parts[parts.length-1].trim() };
}
function parseThaiMonthYear(s) {
  const m = normalizeText(s).match(/^(\S+)\s+(\d{4})$/);
  if (!m) return null;
  const mm = THAI_MONTHS[m[1]];
  if (!mm) return null;
  return { mm, yyyy: parseInt(m[2],10) - 543 };
}
function bpMonthYear(dateStr) {
  const p = String(dateStr||'').split('/');
  if (p.length !== 3) return null;
  const mm = parseInt(p[1],10), yyyy = parseInt(p[2],10);
  if (!mm || !yyyy) return null;
  return { mm, yyyy };
}
function statusOf(pct, supported) {
  if (!supported || pct === null) return { label: 'ไม่รองรับการคำนวณ', cls: 'badge-muted' };
  if (pct >= 100) return { label: 'ผ่านเป้า', cls: 'badge-ok' };
  if (pct >= 80)  return { label: 'ใกล้เป้า', cls: 'badge-warn' };
  return { label: 'ต่ำกว่าเป้า', cls: 'badge-danger' };
}
function colorOf(pct) {
  if (pct >= 100) return 'var(--success)';
  if (pct >= 80) return 'var(--warning)';
  return 'var(--danger)';
}

/* ================= DATA PIPELINE ================= */
function buildBpIndex(bpRaw) {
  const idx = new Map();
  bpRaw.forEach(r => {
    const my = bpMonthYear(r['Doc_Date']);
    if (!my) return;
    const normName = normalizeName(r['Sale NO ROO']);
    if (!normName) return;
    const key = normName + '||' + my.mm + '/' + my.yyyy;
    r._exvatcn2 = parseNum(r['EXVat+CN*2']);
    r._csx = parseNum(r['Sales_CSxValue']);
    if (!idx.has(key)) idx.set(key, []);
    idx.get(key).push(r);
  });
  return idx;
}

function buildDebtorActualIndex(targetRaw) {
  const idx = new Map();
  targetRaw.forEach(t => {
    const rawName = String(t['ชื่อเซลล์ + คุณ'] || '').trim().replace(/^คุณ\s*/, '');
    const v = parseNum(t['SUM ของ จำนวนวันที่จ่ายเกิน']);
    if (!rawName || !v) return;
    const key = normalizeName(rawName);
    if (!idx.has(key)) idx.set(key, v);
  });
  return idx;
}

function buildCnIndex(cnRaw) {
  const idx = new Map();
  (cnRaw || []).forEach(r => {
    const rawName = String(r['Sale no Roo'] || '').trim().replace(/^-*คุณ\s*/, '');
    const colKey = Object.keys(r).find(k => k.includes('COUNTUNIQUE') || k.includes('บิลรับคืน'));
    const v = colKey ? parseNum(r[colKey]) : 0;
    if (!rawName || !v) return;
    const key = normalizeName(rawName);
    if (!idx.has(key)) idx.set(key, v);
  });
  return idx;
}

function buildBudgetIndex(budgetRaw) {
  const idx = new Map();
  (budgetRaw || []).forEach(r => {
    const code = normalizeText(String(r['SLMN_CODE'] || ''));
    const v = parseNum(r['Budget']);
    if (!code || !v) return;
    if (!idx.has(code)) idx.set(code, v);
  });
  return idx;
}

function buildNewSkuIndex(newSkuRaw) {
  const idx = new Map();
  if (!newSkuRaw || !newSkuRaw.length) return idx;
  const cols = Object.keys(newSkuRaw[0]);
  const nameCol = cols.find(k => normalizeText(k).replace(/\s+/g,'').toUpperCase().includes('SALENOROO'));
  const valCol  = cols.find(k => normalizeText(k).includes('จำนวนร้าน'));
  if (!nameCol || !valCol) return idx;
  newSkuRaw.forEach(r => {
    const rawName = String(r[nameCol] || '').trim();
    const v = parseNum(r[valCol]);
    if (!rawName) return;
    const key = normalizeName(rawName);
    if (!idx.has(key)) idx.set(key, v);
  });
  return idx;
}

function computeAll(targetRaw, bpRaw, cnRaw, budgetRaw, newSkuRaw) {
  const bpIndex = buildBpIndex(bpRaw);
  const debtorActualIndex = buildDebtorActualIndex(targetRaw);
  const cnIndex = buildCnIndex(cnRaw);
  const newSkuIndex = buildNewSkuIndex(newSkuRaw);
  const budgetIndex = buildBudgetIndex(budgetRaw);
  const rows = [];
  targetRaw.forEach(t => {
    const name = t['ชื่อ สกุล'];
    const goalName = t['ชื่อเป้าหมาย'];
    const targetValRaw = t['เป้าหมายขาย'];
    const parsed0 = parseTargetName(goalName);
    const isSpecialKpi = parsed0 && parsed0.dim.toUpperCase() === 'KPI' && ['ลูกหนี้','Budget'].includes(parsed0.value);
    if (!name || !goalName || (!targetValRaw && !isSpecialKpi)) return;
    const parsed = parseTargetName(goalName);
    if (!parsed) return;
    const dimKey = parsed.dim.toUpperCase();
    const bpCol = DIM_MAP[dimKey];
    let targetVal = parseNum(targetValRaw);
    const monthInfo = parseThaiMonthYear(t['เดือน']);
    const wh = normalizeText(t['คลัง']);
    const normName = normalizeName(name);

    const empCode = normalizeText(t['รหัสเซลล์'] || '');
    let actual = null, stores = 0, supported = false;

    const isDebtor = parsed.dim.toUpperCase() === 'KPI' && parsed.value === 'ลูกหนี้' && parsed.unit === 'วัน';
    if (isDebtor && monthInfo) {
      const thresh = debtorThreshold(empCode);
      if (thresh !== null) {
        supported = true;
        const key = normName + '||' + monthInfo.mm + '/' + monthInfo.yyyy;
        const bucket = bpIndex.get(key) || [];
        const custMap = new Map();
        bucket.forEach(r => { if (r['Customer_Code']) custMap.set(r['Customer_Code'], (custMap.get(r['Customer_Code'])||0) + r._exvatcn2); });
        const qualifyingCount = [...custMap.values()].filter(s => s >= thresh).length;
        targetVal = Math.round(qualifyingCount / 2);
        actual = debtorActualIndex.get(normName) ?? null;
        supported = actual !== null;
      }
    } else if (parsed.dim.toUpperCase() === 'KPI' && normalizeText(parsed.value).toLowerCase() === 'รวมbplus' && monthInfo) {
      const key = normName + '||' + monthInfo.mm + '/' + monthInfo.yyyy;
      const bucket = bpIndex.get(key) || [];
      actual = bucket.reduce((s, r) => s + r._exvatcn2, 0);
      supported = true;
    } else if (parsed.dim.toUpperCase() === 'KPI' && normalizeText(parsed.value).toUpperCase() === 'CN') {
      actual = cnIndex.get(normName) ?? null;
      supported = actual !== null;
    } else if (parsed.dim.toUpperCase() === 'KPI' && normalizeText(parsed.value).toUpperCase() === 'EFFECTIVE OUTLET' && monthInfo) {
      const thresh = debtorThreshold(empCode);
      if (thresh !== null) {
        const key = normName + '||' + monthInfo.mm + '/' + monthInfo.yyyy;
        const bucket = bpIndex.get(key) || [];
        const custMap = new Map();
        bucket.forEach(r => { if (r['Customer_Code']) custMap.set(r['Customer_Code'], (custMap.get(r['Customer_Code'])||0) + r._exvatcn2); });
        actual = [...custMap.values()].filter(s => s >= thresh).length;
        supported = true;
      }
    } else if (parsed.dim.toUpperCase() === 'KPI' && parsed.value === 'Budget' && monthInfo) {
      const key = normName + '||' + monthInfo.mm + '/' + monthInfo.yyyy;
      const bucket = bpIndex.get(key) || [];
      const filtered = bucket.filter(r => !r['Budget'] || String(r['Budget']).trim() === '');
      const sumExvat = filtered.reduce((s, r) => s + r._exvatcn2, 0);
      targetVal = sumExvat * 0.002;
      actual = budgetIndex.get(empCode) ?? null;
      supported = actual !== null;
    } else if (parsed.dim.toUpperCase() === 'KPI' && (()=>{ const pv=normalizeText(parsed.value).replace(/\s+/g,'').toLowerCase(); return pv.includes('sku') && pv.includes('ใหม่'); })() && monthInfo) {
      actual = newSkuIndex.get(normName) ?? null;
      supported = actual !== null;
    } else if (parsed.dim.toUpperCase() === 'KPI' && normalizeText(parsed.value).toUpperCase() === 'ร้าน ROO' && monthInfo) {
      const key = normName + '||' + monthInfo.mm + '/' + monthInfo.yyyy;
      const bucket = bpIndex.get(key) || [];
      const filtered = bucket.filter(r => normalizeText(String(r['Channal'] || '')).toLowerCase() === 'online');
      actual = new Set(filtered.map(r => r['Customer_Code']).filter(Boolean)).size;
      supported = true;
    } else if (parsed.dim.toUpperCase() === 'KPI' && normalizeText(parsed.value).toUpperCase() === 'ACTIVE OUTLET' && monthInfo) {
      const key = normName + '||' + monthInfo.mm + '/' + monthInfo.yyyy;
      const bucket = bpIndex.get(key) || [];
      actual = new Set(bucket.map(r => r['Customer_Code']).filter(Boolean)).size;
      supported = true;
    } else if (parsed.dim.toUpperCase() === 'KPI' && normalizeText(parsed.value).replace(/\s+/g,'').toUpperCase() === 'SKU/OUTLET' && monthInfo) {
      const key = normName + '||' + monthInfo.mm + '/' + monthInfo.yyyy;
      const bucket = bpIndex.get(key) || [];
      const custSkuMap = new Map();
      bucket.forEach(r => {
        const cust = r['Customer_Code'];
        const prod = r['Product_Name'];
        if (!cust || !prod) return;
        if (!custSkuMap.has(cust)) custSkuMap.set(cust, new Set());
        custSkuMap.get(cust).add(prod);
      });
      const custCount = custSkuMap.size;
      if (custCount > 0) {
        const totalSkus = [...custSkuMap.values()].reduce((s, set) => s + set.size, 0);
        actual = Math.round(totalSkus / custCount);
      } else {
        actual = 0;
      }
      supported = true;
    } else if (parsed.dim.toUpperCase() === 'KPI' && normalizeText(parsed.value).toUpperCase() === 'ALL SKU' && monthInfo) {
      const key = normName + '||' + monthInfo.mm + '/' + monthInfo.yyyy;
      const bucket = bpIndex.get(key) || [];
      actual = new Set(bucket.map(r => r['Product_Name']).filter(Boolean)).size;
      supported = true;
    } else if (parsed.dim.toUpperCase() === 'KPI' && normalizeText(parsed.value).toUpperCase().includes('FMCG') && monthInfo) {
      const key = normName + '||' + monthInfo.mm + '/' + monthInfo.yyyy;
      const bucket = bpIndex.get(key) || [];
      const EXCLUDE_CAT_BU_FMCG = ['bplus บุหรี่', 'bplus thaibev al'];
      const filtered = bucket.filter(r => {
        const prathan = normalizeText(String(r['ประเภทตัวแทน'] || '')).toLowerCase();
        const catBu = normalizeText(String(r['Cat_BU'] || '')).toLowerCase();
        return prathan !== 'ตัวแทน' && !EXCLUDE_CAT_BU_FMCG.includes(catBu);
      });
      actual = filtered.reduce((s, r) => s + r._exvatcn2, 0);
      supported = true;
    } else if (parsed.dim.toUpperCase() === 'KPI' && normalizeText(parsed.value).startsWith('สินค้าตัวแทน') && monthInfo) {
      const key = normName + '||' + monthInfo.mm + '/' + monthInfo.yyyy;
      const bucket = bpIndex.get(key) || [];
      const EXCLUDE_CAT_BU = ['bplus บุหรี่', 'bplus thaibev al', 'ไม่กำหนดประเภท'];
      const filtered = bucket.filter(r => {
        const prathan = normalizeText(String(r['ประเภทตัวแทน'] || '')).toLowerCase();
        const catBu = normalizeText(String(r['Cat_BU'] || '')).toLowerCase();
        return prathan === 'ตัวแทน' && !EXCLUDE_CAT_BU.includes(catBu);
      });
      actual = filtered.reduce((s, r) => s + r._exvatcn2, 0);
      supported = true;
    } else if (parsed.dim.toUpperCase() === 'KPI' && normalizeText(parsed.value).includes('บุหรี่') && normalizeText(parsed.value).includes('สินค้าตัวแทน') && monthInfo) {
      const key = normName + '||' + monthInfo.mm + '/' + monthInfo.yyyy;
      const bucket = bpIndex.get(key) || [];
      const filtered = bucket.filter(r => {
        const prathan = normalizeText(String(r['ประเภทตัวแทน'] || '')).toLowerCase();
        const catBu = normalizeText(String(r['Cat_BU'] || '')).toLowerCase();
        return catBu === 'bplus บุหรี่' && prathan !== 'ตัวแทน';
      });
      actual = filtered.reduce((s, r) => s + r._exvatcn2, 0);
      supported = true;
    } else if (bpCol && monthInfo) {
      supported = true;
      const key = normName + '||' + monthInfo.mm + '/' + monthInfo.yyyy;
      const bucket = bpIndex.get(key) || [];
      const wantVal = normalizeText(parsed.value).toUpperCase();
      const matches = bucket.filter(r => normalizeText(r[bpCol]).toUpperCase() === wantVal);
      stores = new Set(matches.map(r=>r['Customer_Code'])).size;
      if (parsed.unit === 'บาท' || parsed.unit === '%บาท') actual = matches.reduce((s,r)=>s+r._exvatcn2, 0);
      else if (parsed.unit === 'ตัน') actual = matches.reduce((s,r)=>s+r._csx, 0) / 1000;
      else if (parsed.unit === 'ลัง') actual = matches.reduce((s,r)=>s+r._csx, 0);
      else if (parsed.unit === 'ร้าน') actual = new Set(matches.map(r=>r['Customer_Code'])).size;
      else supported = false;
    }
    const pct = (supported && targetVal > 0) ? (actual/targetVal*100) : null;
    const st = statusOf(pct, supported);
    rows.push({
      wh, name, nickname: t['ชื่อเล่น']||'', month: t['เดือน']||'', empCode,
      dim: parsed.dim, dimLabel: DIM_LABEL[dimKey] || parsed.dim,
      value: parsed.value, unit: parsed.unit,
      target: targetVal, actual, stores, pct, supported,
      statusLabel: st.label, statusCls: st.cls,
    });
  });
  return rows;
}

async function loadData(showSpin) {
  if (showSpin) showSpinner('กำลังโหลดข้อมูลยอดขาย...');
  setLoading(true);
  try {
    const [targetRaw, bpRaw, cnRaw, budgetRaw, newSkuRaw, outletRaw, eoRaw, customerRaw, onTopRaw, rooRaw] = await Promise.all([
      loadFromSheets(TARGET_SHEET_ID, TARGET_SHEET_NAME),
      loadFromSheets(BP_SHEET_ID, BP_SHEET_NAME),
      loadFromSheets(CN_SHEET_ID, CN_SHEET_NAME),
      loadFromSheets(BUDGET_SHEET_ID, BUDGET_SHEET_NAME),
      loadFromSheets(NEWSKU_SHEET_ID, NEWSKU_SHEET_NAME),
      loadFromSheets(OUTLET_SHEET_ID, OUTLET_SHEET_NAME),
      loadFromSheets(EO_SHEET_ID, EO_SHEET_NAME),
      loadFromSheets(CUSTOMER_SHEET_ID, CUSTOMER_SHEET_NAME),
      loadFromSheets(OUTLET_SHEET_ID, ON_TOP_SHEET_NAME),
      loadFromSheets(OUTLET_SHEET_ID, ROO_SHEET_NAME),
    ]);
    state.targetRaw = targetRaw;
    state.bpRaw = bpRaw;
    state.cnRaw = cnRaw;
    state.budgetRaw = budgetRaw;
    state.newSkuRaw = newSkuRaw;
    state.outletRaw = outletRaw;
    state.eoRaw = eoRaw;
    state.customerRaw = customerRaw;
    state.onTopRaw = onTopRaw;
    state.rooRaw = rooRaw;
    setCache('targetCache', targetRaw);
    state.rows = computeAll(targetRaw, bpRaw, cnRaw, budgetRaw, newSkuRaw);
    buildFilterControls();
    renderAll();
  } catch (e) {
    console.error(e);
    showToast('โหลดข้อมูลไม่สำเร็จ ลองรีเฟรชอีกครั้ง', 'error');
  } finally {
    setLoading(false);
    if (showSpin) hideSpinner();
  }
}

/* ================= WORKING DAYS ================= */
function getHolidayCount(dataMonthStr) {
  if (!state.targetRaw || !dataMonthStr) return 0;
  const p = parseThaiMonthYear(dataMonthStr);
  if (!p) return 0;
  const holidays = new Set();
  state.targetRaw.forEach(t => {
    const tMonth = normalizeText(t['เดือน'] || '');
    const tm = parseThaiMonthYear(tMonth);
    if (!tm || tm.mm !== p.mm || tm.yyyy !== p.yyyy) return;
    const h = normalizeText(String(t['Holiday'] || ''));
    if (h) holidays.add(h);
  });
  return holidays.size;
}

function getWorkingDaysInfo(dataMonthStr) {
  let year, month;
  if (dataMonthStr) {
    const p = parseThaiMonthYear(dataMonthStr);
    if (p) { year = p.yyyy; month = p.mm - 1; }
  }
  if (!year) { const n = new Date(); year = n.getFullYear(); month = n.getMonth(); }
  const now = new Date();
  const isCurrentMonth = (now.getFullYear() === year && now.getMonth() === month);
  const today = isCurrentMonth ? now.getDate() : new Date(year, month + 1, 0).getDate();
  const lastDay = new Date(year, month + 1, 0).getDate();
  let totalWork = 0, doneWork = 0, futureWork = 0;
  for (let d = 1; d <= lastDay; d++) {
    const dow = new Date(year, month, d).getDay();
    if (dow !== 0) {
      totalWork++;
      if (d < today) doneWork++;
      else futureWork++;
    }
  }
  const holidays = getHolidayCount(dataMonthStr);
  totalWork = Math.max(0, totalWork - holidays);
  const remaining = isCurrentMonth ? Math.max(0, futureWork - holidays) : 0;
  const pct = totalWork > 0 ? Math.round((totalWork - remaining) / totalWork * 100) : 0;
  const weekOfMonth = Math.ceil(today / 7);
  const nd = now.getDate(), nm = now.getMonth()+1, ny = now.getFullYear()+543;
  const dateStr = `${String(nd).padStart(2,'0')}/${String(nm).padStart(2,'0')}/${ny}`;
  return { totalWork, doneWork, remaining, pct, weekOfMonth, dateStr };
}

/* ================= OUTLETS TAB ================= */
function getChannelGroup(empCode) {
  const c = String(empCode||'').toUpperCase();
  if (c.startsWith('HSW') || c.startsWith('GP')) return 'ส่ง';
  return 'ปลีก';
}

function renderOutlets() {
  const el = document.getElementById('outletContent');
  if (!el) return;

  // get Time Used %
  const dataMonth = (state.rows||[]).find(r=>r.month)?.month || '';
  const wd = getWorkingDaysInfo(dataMonth);
  const timeUsedPct = wd.pct;

  // build AO target index from outlet sheet: normName → target
  const aoTargetIdx = new Map();
  (state.outletRaw || []).forEach(r => {
    const nm = normalizeName(r['ชื่อพนักงานขาย']);
    const t = parseNum(r['Target']);
    if (nm) aoTargetIdx.set(nm, t);
  });

  // build EO target index: normName → Target 70%(Outlet)
  const eoTargetIdx = new Map();
  (state.eoRaw || []).forEach(r => {
    const nm = normalizeName(r['ชื่อพนักงานขาย']);
    if (!nm) return;
    // ลอง key ต่างๆ เผื่อ CSV parse ชื่อคอลัมน์ต่างกัน
    const tKey = Object.keys(r).find(k => k.replace(/\s+/g,'').toLowerCase().includes('target') && k.includes('70'));
    const t = tKey ? parseNum(r[tKey]) : 0;
    eoTargetIdx.set(nm, t);
  });

  // build inRouth index: normName(เซลล์ผู้ดูแล) → count unique รหัส บีพลัส
  const inRouthIdx = new Map();
  if ((state.customerRaw||[]).length > 0) {
    const sample = state.customerRaw[0];
    const keys = Object.keys(sample);
    const bpKey = keys.find(k => k.replace(/\s/g,'').includes('รหัสบีพลัส') || k.replace(/\s/g,'').includes('รหัสbplus'));
    const selKey = keys.find(k => k.replace(/\s/g,'').includes('เซลล์ผู้ดูแล') || k.replace(/\s/g,'').includes('เซลล์'));
    (state.customerRaw).forEach(r => {
      const rawSel = String(r[selKey]||'').trim();
      const bp = String(r[bpKey]||'').trim();
      if (!rawSel || !bp) return;
      const nm = normalizeName(rawSel);
      if (!nm) return;
      if (!inRouthIdx.has(nm)) inRouthIdx.set(nm, new Set());
      inRouthIdx.get(nm).add(bp);
    });
  }

  // build empCode lookup from EO sheet: normName → empCode
  const eoEmpCodeIdx = new Map();
  (state.eoRaw || []).forEach(r => {
    const nm = normalizeName(r['ชื่อพนักงานขาย']);
    const code = String(r['รหัส']||'').trim();
    if (nm && code) eoEmpCodeIdx.set(nm, code);
  });

  // build BP sales map: normName → Map(Customer_Code → sum EXVat+CN*2)
  const bpSalesIdx = new Map();
  (state.bpRaw || []).forEach(r => {
    const nm = normalizeName(r['Sale NO ROO']);
    const cust = r['Customer_Code'];
    if (!nm || !cust) return;
    if (!bpSalesIdx.has(nm)) bpSalesIdx.set(nm, new Map());
    const custMap = bpSalesIdx.get(nm);
    custMap.set(cust, (custMap.get(cust)||0) + parseNum(r['EXVat+CN*2']));
  });

  // compute aoActual, eoActual, zeroBath per employee
  const aoActualIdx = new Map();
  const eoActualIdx = new Map();
  const zeroBathIdx = new Map();
  bpSalesIdx.forEach((custMap, nm) => {
    aoActualIdx.set(nm, custMap.size);
    const empCode = eoEmpCodeIdx.get(nm) || '';
    const thresh = debtorThreshold(empCode) ?? 2500;
    eoActualIdx.set(nm, [...custMap.values()].filter(v => v >= thresh).length);
  });
  // zeroBath = In Routh - AO Actual
  inRouthIdx.forEach((bpSet, nm) => {
    const aoA = aoActualIdx.get(nm) ?? 0;
    zeroBathIdx.set(nm, Math.max(0, bpSet.size - aoA));
  });

  // build empCode lookup from state.rows for wh
  const empInfoIdx = new Map();
  (state.rows || []).forEach(r => {
    const nm = normalizeName(r.name);
    if (!empInfoIdx.has(nm)) empInfoIdx.set(nm, { empCode: r.empCode, wh: r.wh });
  });

  // build empMap from Outlet sheet (primary source)
  const empMap = new Map();
  (state.outletRaw || []).forEach(r => {
    const rawName = String(r['ชื่อพนักงานขาย']||'').trim();
    if (!rawName) return;
    const nm = normalizeName(rawName);
    const info = empInfoIdx.get(nm) || {};
    empMap.set(nm, {
      name: rawName.replace(/^คุณ\s*/,''),
      empCode: r['รหัส'] || info.empCode || '',
      wh: info.wh || '',
      aoActual: aoActualIdx.get(nm) ?? null,
      eoTarget: eoTargetIdx.get(nm) ?? null,
      eoActual: eoActualIdx.get(nm) ?? null,
      inRouth: inRouthIdx.has(nm) ? inRouthIdx.get(nm).size : null,
      zeroBath: zeroBathIdx.has(nm) ? zeroBathIdx.get(nm) : null,
    });
  });

  // group by channel
  const groups = { 'ส่ง': [], 'ปลีก': [] };
  empMap.forEach(e => {
    const g = getChannelGroup(e.empCode);
    if (groups[g]) groups[g].push(e);
  });

  const fmtPct = (a, t) => {
    if (a === null || a === undefined || !t) return '<span style="color:var(--muted)">-</span>';
    const p = (a / t * 100);
    const col = p >= timeUsedPct ? 'var(--success)' : 'var(--danger)';
    return `<span style="color:${col};font-weight:700">${p.toFixed(2)}%</span>`;
  };
  const fmtN = v => v !== null && v !== undefined ? Number(v).toLocaleString() : '<span style="color:var(--muted)">-</span>';

  let html = `<style>
.otbl{width:100%;border-collapse:collapse;font-size:13px}
.otbl th,.otbl td{padding:8px 10px;border:1px solid #aab;text-align:center}
.otbl thead tr:first-child th{background:var(--navy);color:#fff;font-weight:700;font-size:13px}
.otbl thead tr:nth-child(2) th{background:var(--navy-mid);color:#fff;font-size:12px}
.otbl .col-ao{background:rgba(52,152,219,.12)}
.otbl .col-eo{background:rgba(46,204,113,.12)}
.otbl .col-s0{background:rgba(243,156,18,.12)}
.otbl thead .col-ao{background:rgba(52,152,219,.85);color:#fff}
.otbl thead .col-eo{background:rgba(46,204,113,.85);color:#fff}
.otbl thead .col-s0{background:rgba(243,156,18,.85);color:#fff}
.otbl tbody tr:hover{background:rgba(201,168,76,.07)}
.otbl .grp-head td{background:var(--navy);color:var(--gold);font-weight:700;text-align:left}
.otbl .sum-row td{background:var(--navy-light);color:#fff;font-weight:700}
.otbl .seq{color:var(--muted);font-size:12px;width:32px}
</style>
<div class="tbl-wrap">
<table class="otbl">
<thead>
<tr>
  <th rowspan="2" style="width:32px">ลำดับ</th>
  <th rowspan="2" style="text-align:left;min-width:160px">ชื่อพนักงานขาย</th>
  <th rowspan="2">รหัส</th>
  <th colspan="3" class="col-ao">Active Outlet</th>
  <th colspan="3" class="col-eo">Effective Outlet</th>
  <th colspan="3" class="col-s0">Store 0 Bath</th>
</tr>
<tr>
  <th class="col-ao">Target</th><th class="col-ao">Actual</th><th class="col-ao">%</th>
  <th class="col-eo">Target 70%</th><th class="col-eo">Actual</th><th class="col-eo">%</th>
  <th class="col-s0">In Routh</th><th class="col-s0">0 Bath</th><th class="col-s0">%</th>
</tr>
</thead>
<tbody>`;

  const renderGroup = (label, rows) => {
    if (!rows.length) return '';
    let out = `<tr class="grp-head"><td colspan="12" style="padding:6px 12px">📦 ช่องทาง${label}</td></tr>`;
    let sumAoT=0, sumAoA=0, sumEoT=0, sumEoA=0, sumInRouth=0, sumZeroBath=0;
    rows = rows.filter(e => aoTargetIdx.size === 0 || aoTargetIdx.has(normalizeName(e.name)));
    rows.forEach((e, i) => {
      const aoT = aoTargetIdx.size > 0
        ? (aoTargetIdx.has(normalizeName(e.name)) ? aoTargetIdx.get(normalizeName(e.name)) : null)
        : (e.aoTarget ?? 0);
      const aoA = e.aoActual ?? null;
      const eoT = e.eoTarget ?? (aoT ? Math.round(aoT * 0.7) : null);
      const eoA = e.eoActual ?? null;
      sumAoT += aoT; sumAoA += (aoA||0); sumEoT += (eoT||0); sumEoA += (eoA||0);
      sumInRouth += (e.inRouth||0); sumZeroBath += (e.zeroBath||0);
      out += `<tr>
        <td class="seq">${i+1}</td>
        <td style="text-align:left">คุณ ${e.name}</td>
        <td>${e.empCode}</td>
        <td class="col-ao">${fmtN(aoT)}</td>
        <td class="col-ao">${fmtN(aoA)}</td>
        <td class="col-ao">${fmtPct(aoA, aoT)}</td>
        <td class="col-eo">${fmtN(eoT)}</td>
        <td class="col-eo">${fmtN(eoA)}</td>
        <td class="col-eo">${fmtPct(eoA, eoT)}</td>
        <td class="col-s0">${e.inRouth !== null ? e.inRouth.toLocaleString() : '<span style="color:var(--muted)">-</span>'}</td>
        <td class="col-s0">${e.zeroBath !== null ? e.zeroBath.toLocaleString() : '<span style="color:var(--muted)">-</span>'}</td>
        <td class="col-s0">${(e.inRouth && e.zeroBath !== null) ? fmtPct(e.zeroBath, e.inRouth) : '<span style="color:var(--muted)">-</span>'}</td>
      </tr>`;
    });
    const eoTShow = sumEoT || Math.round(sumAoT * 0.7);
    out += `<tr class="sum-row">
      <td colspan="3">รวมช่องทาง${label}</td>
      <td>${sumAoT.toLocaleString()}</td><td>${sumAoA.toLocaleString()}</td><td>${fmtPct(sumAoA, sumAoT)}</td>
      <td>${eoTShow.toLocaleString()}</td><td>${sumEoA.toLocaleString()}</td><td>${fmtPct(sumEoA, eoTShow)}</td>
      <td>${sumInRouth.toLocaleString()}</td><td>${sumZeroBath.toLocaleString()}</td><td>${sumInRouth ? fmtPct(sumZeroBath, sumInRouth) : '<span style="color:rgba(255,255,255,.4)">-</span>'}</td>
    </tr>`;
    return out;
  };

  html += renderGroup('ส่ง', groups['ส่ง']);
  html += renderGroup('ปลีก', groups['ปลีก']);
  html += `</tbody></table></div>
<p class="txt-sm txt-muted" style="margin-top:8px">* Effective Outlet: ร้านส่ง ≥ 40,000 บาท/เดือน · ร้านปลีก ≥ 2,500 บาท/เดือน &nbsp;|&nbsp; Store 0 Bath: รอข้อมูลชีตใหม่</p>`;

  el.innerHTML = html;
}

/* ================= ON TOP ================= */
function renderOnTop() {
  const el = document.getElementById('onTopContent');
  if (!el) return;
  const rows = state.onTopRaw || [];
  if (!rows.length) { el.innerHTML = '<p class="txt-muted" style="padding:16px">ไม่มีข้อมูล On Top</p>'; return; }

  const dataMonth = (state.rows||[]).find(r=>r.month)?.month || '';
  const wd = getWorkingDaysInfo(dataMonth);
  const timeUsedPct = wd.pct;

  const fmtN = v => (v !== null && v !== undefined && v !== '') ? Number(String(v).replace(/,/g,'')).toLocaleString() : '<span style="color:var(--muted)">-</span>';
  const fmtTon = v => (v !== null && v !== undefined && v !== '') ? parseFloat(String(v).replace(/,/g,'')).toFixed(2) : '<span style="color:var(--muted)">-</span>';
  const fmtAch = (actual, target) => {
    const a = parseFloat(String(actual||'').replace(/,/g,''));
    if (actual === null || actual === undefined || actual === '' || isNaN(a)) return '<span style="color:var(--muted)">-</span>';
    return a.toLocaleString();
  };
  const fmtTonAch = (actual, target) => {
    const a = typeof actual === 'number' ? actual : parseFloat(String(actual||'').replace(/,/g,''));
    if (actual === null || actual === undefined || isNaN(a)) return '<span style="color:var(--muted)">-</span>';
    return a.toFixed(2);
  };

  // build ทำได้ (ตัน) และ ทำได้ (บาท) index from BP: filter Cat_Vendor = บจก.ซี.พี.ฟู้ดสโตร์
  const acTonIdx = new Map();
  const acBahtIdx = new Map();
  const acStrIdx = new Map();
  (state.bpRaw || []).forEach(r => {
    const vendor = String(r['Cat_Vendor']||'').trim();
    if (vendor !== 'บจก.ซี.พี.ฟู้ดสโตร์') return;
    const nm = normalizeName(r['Sale NO ROO']);
    if (!nm) return;
    acTonIdx.set(nm, (acTonIdx.get(nm)||0) + parseNum(r['Sales_CSxValue']));
    acBahtIdx.set(nm, (acBahtIdx.get(nm)||0) + parseNum(r['EXVat+CN*2']));
    if (!acStrIdx.has(nm)) acStrIdx.set(nm, new Set());
    const cust = String(r['Customer_Code']||'').trim();
    if (cust) acStrIdx.get(nm).add(cust);
  });

  // flexible column key finder
  const allKeys = rows.length ? Object.keys(rows[0]) : [];
  const nk = s => s.replace(/\s+/g,'').toLowerCase();
  const findKey = (...terms) => allKeys.find(k => terms.every(t => nk(k).includes(t))) || '';
  const kAoTon  = findKey('เป้า','ตัน');
  const kAcTon  = findKey('ทำได้','ตัน');
  const kAoBaht = findKey('เป้า','บาท');
  const kAcBaht = findKey('ทำได้','บาท');
  const kAoStr  = findKey('เป้า','ร้านค้า');
  const kAcStr  = findKey('ทำได้','ร้านค้า');
  const kCh   = allKeys.find(k => nk(k).includes('ช่องทาง')) || 'ช่องทาง';
  const kWh   = allKeys.find(k => nk(k).includes('ศูนย์'))    || 'ศูนย์';
  const kName = allKeys.find(k => nk(k).includes('ชื่อพนักงานขาย')) || 'ชื่อพนักงานขาย';
  const kCode = allKeys.find(k => nk(k).includes('รหัส'))     || 'รหัส';

  // group by ช่องทาง, carry forward empty cells
  let lastCh = '';
  const grouped = [];
  rows.forEach(r => {
    const ch = String(r[kCh]||'').trim() || lastCh;
    lastCh = ch;
    grouped.push({...r, _ch: ch});
  });

  // compute rowspans for ช่องทาง
  const chSpan = {};
  grouped.forEach(r => { chSpan[r._ch] = (chSpan[r._ch]||0) + 1; });
  const chSeen = new Set();

  let html = `<style>
.ottbl{width:100%;border-collapse:collapse;font-size:12px}
.ottbl th,.ottbl td{padding:6px 8px;border:1px solid #aab;text-align:center;vertical-align:middle}
.ottbl thead tr:first-child th{background:var(--navy);color:#fff;font-weight:700;font-size:13px}
.ottbl thead tr:nth-child(2) th{background:rgba(52,152,219,.85);color:#fff;font-weight:700}
.ottbl thead tr:nth-child(3) th{background:rgba(52,152,219,.55);color:#fff;font-size:11px;line-height:1.3}
.ottbl tbody tr:hover{background:rgba(201,168,76,.07)}
.ottbl .col-ch{background:rgba(243,156,18,.1);font-weight:700}
.ottbl td.num{text-align:center;font-variant-numeric:tabular-nums}
</style>
<div class="tbl-wrap">
<table class="ottbl">
<thead>
<tr>
  <th rowspan="3">ช่องทาง</th>
  <th rowspan="3">ศูนย์</th>
  <th rowspan="3" style="text-align:left;min-width:140px">ชื่อพนักงานขาย</th>
  <th rowspan="3">รหัส</th>
  <th colspan="6">บจก.ซี.พี.ฟู้ดสโตร์</th>
</tr>
<tr>
  <th colspan="4">ข้าวตราฉัตร</th>
  <th colspan="2">กระจายร้าน</th>
</tr>
<tr>
  <th>เป้า<br>(ตัน)</th><th>ทำได้<br>(ตัน)</th>
  <th>เป้า<br>(บาท)</th><th>ทำได้<br>(บาท)</th>
  <th>เป้า<br>(ร้านค้า)</th><th>ทำได้<br>(ร้านค้า)</th>
</tr>
</thead>
<tbody>`;

  grouped.forEach(r => {
    const ch = r._ch;
    const isFirst = !chSeen.has(ch);
    if (isFirst) chSeen.add(ch);
    const aoTon  = r[kAoTon];
    const aoBaht = r[kAoBaht];
    const aoStr  = r[kAoStr];
    const acStr  = r[kAcStr];
    const nm = normalizeName(r[kName]);
    const acTonVal = acTonIdx.has(nm) ? acTonIdx.get(nm) / 1000 : null;
    const wh = String(r[kWh]||'').trim();
    const whBg = wh==='W1' ? 'background:rgba(255,220,50,.18)' : wh==='W3' ? 'background:rgba(255,105,180,.15)' : wh==='W4' ? 'background:rgba(46,204,113,.15)' : '';
    html += `<tr style="${whBg}">
      ${isFirst ? `<td rowspan="${chSpan[ch]}" class="col-ch">${ch}</td>` : ''}
      <td>${wh}</td>
      <td style="text-align:left">${String(r[kName]||'').trim()}</td>
      <td>${r[kCode]||''}</td>
      <td class="num">${fmtTon(aoTon)}</td>
      <td class="num">${fmtTonAch(acTonVal, aoTon)}</td>
      <td class="num">${fmtN(aoBaht)}</td>
      <td class="num">${fmtAch(acBahtIdx.has(nm) ? Math.round(acBahtIdx.get(nm)) : null, aoBaht)}</td>
      <td class="num">${fmtN(aoStr)}</td>
      <td class="num">${fmtAch(acStrIdx.has(nm) ? acStrIdx.get(nm).size : null, aoStr)}</td>
    </tr>`;
  });

  html += `</tbody></table></div>
<p class="txt-sm txt-muted" style="margin-top:8px">* ทำได้: สีเขียว ≥ Time Used (${timeUsedPct.toFixed(1)}%) · สีแดง น้อยกว่า</p>`;
  el.innerHTML = html;
}

/* ================= ROO ================= */
function renderROO() {
  const el = document.getElementById('rooContent');
  if (!el) return;
  const rows = state.rooRaw || [];
  if (!rows.length) { el.innerHTML = '<p class="txt-muted" style="padding:16px">ไม่มีข้อมูล ROO</p>'; return; }

  const dataMonth = (state.rows||[]).find(r=>r.month)?.month || '';
  const wd = getWorkingDaysInfo(dataMonth);

  // fixed brand columns from sheet
  const buCols = ['Bplus FMCG','Bplus Thaibev Al','Bplus บุหรี่','ข้าว','F&N','House Brand','Nissin']
    .filter(b => rows[0] && b in rows[0]);
  const totalCols = 3 + 3 + buCols.length; // ศูนย์+ชื่อ+รหัส + Store+Exvat+SKU + brands

  const fmtN = v => {
    const n = parseNum(v);
    return (n !== 0) ? Math.round(n).toLocaleString() : '-';
  };

  // build Store + Exvat + SKU + brand (Cat_BU) index: BP Salesman_Name contains "(ROO)"
  const storeIdx = new Map();
  const exvatIdx = new Map();
  const skuIdx = new Map();
  const buIdx = new Map(); // sn → Map(Cat_BU → sum EXVat+CN*2)
  (state.bpRaw || []).forEach(r => {
    const sn = String(r['Salesman_Name']||'').trim();
    if (!sn.includes('(ROO)')) return;
    const cust = String(r['Customer_Code']||'').trim();
    if (cust) { if (!storeIdx.has(sn)) storeIdx.set(sn, new Set()); storeIdx.get(sn).add(cust); }
    exvatIdx.set(sn, (exvatIdx.get(sn)||0) + parseNum(r['EXVat+CN*2']));
    const prod = String(r['Product_Name']||'').trim();
    if (prod) { if (!skuIdx.has(sn)) skuIdx.set(sn, new Set()); skuIdx.get(sn).add(prod); }
    const bu = String(r['Cat_BU']||'').trim().toLowerCase();
    if (bu) {
      if (!buIdx.has(sn)) buIdx.set(sn, new Map());
      const m = buIdx.get(sn);
      m.set(bu, (m.get(bu)||0) + parseNum(r['EXVat+CN*2']));
    }
  });

  const getGroup = code => {
    const c = String(code||'').toUpperCase();
    return (c.includes('HSW') || c.includes('GP')) ? 'ส่ง' : 'ปลีก';
  };

  // separate sum rows from data rows
  const dataRows = rows.filter(r => String(r['รหัส']||'').trim() !== '');
  const groups = { 'ส่ง': [], 'ปลีก': [] };
  dataRows.forEach(r => {
    const g = getGroup(r['รหัส']);
    if (groups[g]) groups[g].push(r);
  });

  let html = `<style>
.rtbl{width:100%;border-collapse:collapse;font-size:12px}
.rtbl th,.rtbl td{padding:6px 8px;border:1px solid #aab;text-align:center;vertical-align:middle;white-space:nowrap}
.rtbl thead .r-title th{background:var(--navy);color:#fff;font-size:15px;font-weight:700}
.rtbl thead .r-info th{background:#e8f0fe;color:var(--navy);font-weight:700}
.rtbl thead .r-h1 th{background:rgba(52,152,219,.85);color:#fff;font-weight:700}
.rtbl tbody tr:hover{background:rgba(201,168,76,.07)}
.rtbl .grp-head td{background:var(--navy);color:var(--gold);font-weight:700;text-align:left;padding:6px 12px}
.rtbl .sum-row td{background:var(--navy-light);color:#fff;font-weight:700}
.rtbl .wh-w1{background:rgba(255,220,50,.18)}
.rtbl .wh-w3{background:rgba(255,105,180,.15)}
.rtbl .wh-w4{background:rgba(46,204,113,.15)}
</style>
<div class="tbl-wrap"><table class="rtbl">
<thead>
<tr class="r-title">
  <th colspan="${totalCols}" style="font-size:16px;letter-spacing:.5px">Rattana Online Order (ROO)</th>
</tr>
<tr class="r-h1">
  <th>ศูนย์</th>
  <th style="text-align:left;min-width:140px">ชื่อพนักงานขาย</th>
  <th>รหัส</th>
  <th>Store</th><th>Exvat</th><th>SKU</th>
  ${buCols.map(b => `<th>${b.startsWith('Bplus ') ? 'Bplus<br>'+b.slice(6) : b}</th>`).join('')}
</tr>
</thead>
<tbody>`;

  const renderGroup = (label, grpRows) => {
    if (!grpRows.length) return '';
    let out = `<tr class="grp-head"><td colspan="${totalCols+5}">📦 ช่องทาง${label}</td></tr>`;
    let sStore=0, sExvat=0, sSku=0;
    const sBu = {};
    buCols.forEach(b => sBu[b] = 0);
    grpRows.forEach(r => {
      const wh = String(r['ศูนย์']||'').trim();
      const whCls = wh==='W1'?'wh-w1':wh==='W3'?'wh-w3':wh==='W4'?'wh-w4':'';
      const empName = String(r['ชื่อพนักงานขาย']||'').trim();
      const storeCount = storeIdx.has(empName) ? storeIdx.get(empName).size : 0;
      const exvatVal = exvatIdx.has(empName) ? exvatIdx.get(empName) : 0;
      const skuCount = skuIdx.has(empName) ? skuIdx.get(empName).size : 0;
      sStore += storeCount; sExvat += exvatVal; sSku += skuCount;
      const empBu = buIdx.get(empName) || new Map();
      buCols.forEach(b => sBu[b] += empBu.get(b.toLowerCase())||0);
      out += `<tr class="${whCls}">
        <td>${wh}</td>
        <td style="text-align:left">${empName}</td>
        <td>${r['รหัส']||''}</td>
        <td>${storeCount || '-'}</td>
        <td>${exvatVal ? Math.round(exvatVal).toLocaleString() : '-'}</td>
        <td>${skuCount || '-'}</td>
        ${buCols.map(b => { const v = empBu.get(b.toLowerCase())||0; return `<td>${v ? Math.round(v).toLocaleString() : '-'}</td>`; }).join('')}
      </tr>`;
    });
    out += `<tr class="sum-row">
      <td colspan="3">รวมช่องทาง${label}</td>
      <td>${Math.round(sStore).toLocaleString()}</td>
      <td>${Math.round(sExvat).toLocaleString()}</td>
      <td>${Math.round(sSku).toLocaleString()}</td>
      ${buCols.map(b => `<td>${Math.round(sBu[b]).toLocaleString()}</td>`).join('')}
    </tr>`;
    return out;
  };

  html += renderGroup('ส่ง', groups['ส่ง']);
  html += renderGroup('ปลีก', groups['ปลีก']);
  html += `</tbody></table></div>`;

  // === Summary Table (ด้านล่าง) ===
  console.log('[ROO sumDebug] total rows:', rows.length, '| keys:', Object.keys(rows[0]||{}));
  rows.forEach((r,i) => { if(i<5) console.log('[ROO row'+i+']', JSON.stringify(r)); });
  const sumRows = rows.filter(r => String(r['รหัส']||'').trim() === '' && String(r['ชื่อพนักงานขาย']||'').trim() !== '');
  if (sumRows.length > 0) {
    const allRooKeys = Object.keys(rows[0] || {});
    const nkr = s => s.replace(/\s+/g,'').toLowerCase();
    const findRooKey = (...terms) => allRooKeys.find(k => terms.every(t => nkr(k).includes(nkr(t)))) || '';
    const kTgt = findRooKey('เป้าหมาย') || findRooKey('เป้า');

    const daysUsed = Math.max(1, wd.totalWork - wd.remaining);

    const sumNameSet = new Set(sumRows.map(r => String(r['ชื่อพนักงานขาย']||'').trim()));
    const sStore2 = new Map(), sExvat2 = new Map(), sSku2 = new Map(), sSkuPt2 = new Map();
    const rooAll = { store: new Set(), exvat: 0, sku: new Set(), skuPt: 0 };

    (state.bpRaw || []).forEach(r => {
      const sn = String(r['Salesman_Name']||'').trim();
      const cust = String(r['Customer_Code']||'').trim();
      const prod = String(r['Product_Name']||'').trim();
      const exv = parseNum(r['EXVat+CN*2']);
      const sp = parseNum(r['SKU Point']);
      if (sumNameSet.has(sn)) {
        if (cust) { if (!sStore2.has(sn)) sStore2.set(sn, new Set()); sStore2.get(sn).add(cust); }
        sExvat2.set(sn, (sExvat2.get(sn)||0) + exv);
        if (prod) { if (!sSku2.has(sn)) sSku2.set(sn, new Set()); sSku2.get(sn).add(prod); }
        sSkuPt2.set(sn, (sSkuPt2.get(sn)||0) + sp);
      }
      if (sn.includes('(ROO)')) {
        if (cust) rooAll.store.add(cust);
        rooAll.exvat += exv;
        if (prod) rooAll.sku.add(prod);
        rooAll.skuPt += sp;
      }
    });

    const fmtPctSum = (a, t) => {
      if (!t) return '<span style="color:var(--muted)">-</span>';
      const p = a / t * 100;
      const col = p >= timeUsedPct ? 'var(--success)' : 'var(--danger)';
      return `<span style="color:${col};font-weight:700">${p.toFixed(2)}%</span>`;
    };

    let sumHtml = `<div class="tbl-wrap" style="margin-top:24px"><table class="rtbl">
<thead>
<tr class="r-title">
  <th colspan="4" style="text-align:left;font-size:15px">Rattana Online Order (ROO)</th>
  <th>Time Used</th><th>Week</th><th>วันที่</th><th>วันทำงาน<br>ทั้งหมด</th><th>วันทำงาน<br>เหลือ</th>
</tr>
<tr style="background:#e8f0fe;color:var(--navy);font-weight:700;text-align:center">
  <td colspan="4"></td>
  <td>${wd.pct.toFixed(0)}%</td>
  <td>${wd.weekOfMonth}</td>
  <td>${wd.dateStr}</td>
  <td>${wd.totalWork}</td>
  <td>${wd.remaining}</td>
</tr>
<tr class="r-h1">
  <th style="text-align:left;min-width:180px"></th>
  <th>เป้าหมาย</th><th>ทำได้</th><th>%</th>
  <th>Outlet</th><th>ร้าน/วัน</th><th>SKU/ร้าน</th><th>All SKU</th><th>SKU Point</th>
</tr>
</thead><tbody>`;

    let totTgt=0, totActual=0, totOutlet=0, totAllSku=0, totSkuPt=0;

    sumRows.forEach(r => {
      const nm = String(r['ชื่อพนักงานขาย']||'').trim();
      const tgt = kTgt ? parseNum(r[kTgt]) : 0;
      let storeSet, exvat, skuSet, skuPt;
      if (sStore2.has(nm) || sExvat2.has(nm)) {
        storeSet = sStore2.get(nm) || new Set();
        exvat = sExvat2.get(nm)||0;
        skuSet = sSku2.get(nm) || new Set();
        skuPt = sSkuPt2.get(nm)||0;
      } else {
        storeSet = rooAll.store; exvat = rooAll.exvat;
        skuSet = rooAll.sku; skuPt = rooAll.skuPt;
      }
      const outlet = storeSet.size;
      const allSku = skuSet.size;
      const ranVan = outlet > 0 ? outlet / daysUsed : 0;
      const skuPerStore = outlet > 0 ? allSku / outlet : 0;
      totTgt += tgt; totActual += exvat; totOutlet += outlet;
      totAllSku += allSku; totSkuPt += skuPt;
      sumHtml += `<tr>
        <td style="text-align:left">${nm}</td>
        <td>${tgt ? Math.round(tgt).toLocaleString() : '-'}</td>
        <td>${exvat ? Math.round(exvat).toLocaleString() : '-'}</td>
        <td>${fmtPctSum(exvat, tgt)}</td>
        <td>${outlet || '-'}</td>
        <td>${ranVan ? ranVan.toFixed(1) : '-'}</td>
        <td>${skuPerStore ? skuPerStore.toFixed(1) : '-'}</td>
        <td>${allSku || '-'}</td>
        <td>${skuPt ? Math.round(skuPt).toLocaleString() : '-'}</td>
      </tr>`;
    });

    const totRanVan = daysUsed > 0 ? totOutlet / daysUsed : 0;
    const totSkuPerStore = totOutlet > 0 ? totAllSku / totOutlet : 0;
    sumHtml += `<tr class="sum-row">
      <td style="text-align:left"><b>รวม</b></td>
      <td>${totTgt ? Math.round(totTgt).toLocaleString() : '-'}</td>
      <td>${totActual ? Math.round(totActual).toLocaleString() : '-'}</td>
      <td>${fmtPctSum(totActual, totTgt)}</td>
      <td>${totOutlet.toLocaleString()}</td>
      <td>${totRanVan ? totRanVan.toFixed(1) : '-'}</td>
      <td>${totSkuPerStore ? totSkuPerStore.toFixed(1) : '-'}</td>
      <td>${totAllSku.toLocaleString()}</td>
      <td>${totSkuPt ? Math.round(totSkuPt).toLocaleString() : '-'}</td>
    </tr>`;
    sumHtml += `</tbody></table></div>`;
    html += sumHtml;
  }

  el.innerHTML = html;
}

/* ================= TABS / UI ================= */
function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
  document.getElementById('tab-detail').classList.toggle('hidden', tab!=='detail');
  document.getElementById('tab-outlets').classList.toggle('hidden', tab!=='outlets');
  document.getElementById('tab-ontop').classList.toggle('hidden', tab!=='ontop');
  document.getElementById('tab-roo').classList.toggle('hidden', tab!=='roo');
}
function toggleDark() {
  document.body.classList.toggle('dark');
  localStorage.setItem('rattanaDark', document.body.classList.contains('dark') ? '1':'0');
}
if (localStorage.getItem('rattanaDark')==='1') document.body.classList.add('dark');

const showSpinner = (m='กำลังโหลด...') => { document.getElementById('spinnerMsg').textContent=m; document.getElementById('spinner').classList.add('show'); };
const hideSpinner = () => document.getElementById('spinner').classList.remove('show');
const setLoading  = on => document.getElementById('loadingBar').style.width = on?'85%':'0';
function showToast(msg, type='info') {
  const t=document.createElement('div'); t.className=`toast toast-${type}`; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(),3500);
}
window.addEventListener('scroll', () => {
  document.getElementById('backToTop').classList.toggle('show', window.scrollY > 300);
});
</script>
