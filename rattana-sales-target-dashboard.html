function initPlanData() {
  if (window.planData) return;
  window.planData = {};
  PLAN_CATS.forEach(c => { window.planData[c.id] = {...c.init}; });
}

function planFmt(v, unit) {
  const n = isNaN(v) ? 0 : v;
  if (unit==='บาท') return Math.round(n).toLocaleString();
  return Number.isInteger(n) ? n.toLocaleString() : parseFloat(n.toFixed(2)).toLocaleString();
}

function planPct(v, target) {
  if (!target) return '-';
  return (v/target*100).toFixed(2)+'%';
}

function planPctColor(v, target) {
  if (!target) return '#555';
  const p = v/target*100;
  if (p > 100) return '#c0392b';
  if (p < 10) return '#999';
  if (p < 40) return '#c0392b';
  return '#155724';
}

function buildPlanCatRows(cat) {
  const d = window.planData[cat.id];
  const needBuy = d.planBuy - d.bought;
  const stockRem = d.stockNow + needBuy - d.planSell;
  const rows = [
    {key:'target',  label:'เป้าหมาย',     val:d.target,   editable:true,  cls:''},
    {key:'planbuy', label:'แผนซื้อปิด',   val:d.planBuy,  editable:true,  cls:'plan-row-planbuy'},
    {key:'bought',  label:'ซื้อแล้ว',      val:d.bought,   editable:true,  cls:''},
    {key:'needbuy', label:'ต้องซื้อเพิ่ม',val:needBuy,    editable:false, cls:''},
    {key:'sold',    label:'ขายแล้ว',       val:d.sold,     editable:true,  cls:''},
    {key:'plansell',label:'แผนขายเพิ่ม',  val:d.planSell, editable:true,  cls:'plan-row-plansell'},
    {key:'stocknow',label:'สต็อกปัจจุบัน',val:d.stockNow, editable:true,  cls:''},
    {key:'stockrem',label:'สต็อกคงเหลือ', val:stockRem,   editable:false, cls:'plan-row-stockrem'},
  ];
  let h = '';
  rows.forEach((row, i) => {
    const pColor = i===0 ? '#333' : planPctColor(row.val, d.target);
    h += `<tr class="${row.cls}">`;
    if (i===0) h += `<td rowspan="3" class="plan-cat-cell" style="background:${cat.c1}">${cat.name}</td>`;
    else if (i===3) h += `<td rowspan="5" class="plan-cat-cell" style="background:${cat.c2}">${cat.scope}</td>`;
    h += `<td class="plan-row-label">${row.label}</td>`;
    if (row.editable) {
      h += `<td class="plan-num"><input class="plan-input" id="plan-v-${cat.id}-${row.key}" type="text" value="${planFmt(row.val,cat.unit)}" onchange="planUpdate('${cat.id}','${row.key}',this.value)"></td>`;
    } else {
      h += `<td class="plan-num" id="plan-v-${cat.id}-${row.key}">${planFmt(row.val,cat.unit)}</td>`;
    }
    h += `<td class="plan-unit">${cat.unit}</td>`;
    h += `<td class="plan-pct" id="plan-p-${cat.id}-${row.key}" style="color:${pColor}">${planPct(row.val,d.target)}</td>`;
    h += '</tr>';
  });
  return h;
}

function renderPlan() {
  const fb = document.querySelector('.filter-bar');
  if (fb) fb.style.cssText += ';display:none!important';
  initPlanData();
  const buildHalf = cats => {
    let h = `<table class="plan-tbl"><thead><tr>
      <th colspan="2">Cat / หัวข้อ</th>
      <th>จำนวน</th><th>หน่วย</th><th>%</th>
    </tr></thead><tbody>`;
    cats.forEach(cat => { h += buildPlanCatRows(cat); });
    return h + '</tbody></table>';
  };
  document.getElementById('planContent').innerHTML = `
    <div class="plan-wrap">
      <div class="plan-title-wrap"><div class="plan-title">Plan ปิดตัวเลข</div></div>
      <div class="plan-layout">
        <div class="plan-half">${buildHalf(PLAN_CATS.filter(c=>c.side==='L'))}</div>
        <div class="plan-half">${buildHalf(PLAN_CATS.filter(c=>c.side==='R'))}</div>
      </div>
    </div>`;
}

function planUpdate(catId, field, rawVal) {
  if (!window.planData || !window.planData[catId]) return;
  const d = window.planData[catId];
  const numVal = parseFloat(String(rawVal).replace(/,/g,'')) || 0;
  const map = {target:'target',planbuy:'planBuy',bought:'bought',sold:'sold',plansell:'planSell',stocknow:'stockNow'};
  if (map[field]) d[map[field]] = numVal;
  const cat = PLAN_CATS.find(c=>c.id===catId);
  const unit = cat ? cat.unit : '';
  const needBuy = d.planBuy - d.bought;
  const stockRem = d.stockNow + needBuy - d.planSell;
  const setV = (id,v) => { const e=document.getElementById(id); if(e) e.textContent=planFmt(v,unit); };
  const setP = (id,v) => { const e=document.getElementById(id); if(!e) return; e.textContent=planPct(v,d.target); e.style.color=planPctColor(v,d.target); };
  setV(`plan-v-${catId}-needbuy`, needBuy);
  setV(`plan-v-${catId}-stockrem`, stockRem);
  ['target','planbuy','bought','needbuy','sold','plansell','stocknow','stockrem'].forEach(k => {
    const kv = {target:d.target,planbuy:d.planBuy,bought:d.bought,needbuy:needBuy,sold:d.sold,plansell:d.planSell,stocknow:d.stockNow,stockrem:stockRem}[k];
    setP(`plan-p-${catId}-${k}`, kv);
  });
  const inp = document.getElementById(`plan-v-${catId}-${field}`);
  if (inp && inp.tagName==='INPUT') inp.value = planFmt(numVal, unit);
}

function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
  document.getElementById('tab-detail').classList.toggle('hidden', tab!=='detail');
  document.getElementById('tab-outlets').classList.toggle('hidden', tab!=='outlets');
  document.getElementById('tab-ontop').classList.toggle('hidden', tab!=='ontop');
  document.getElementById('tab-roo').classList.toggle('hidden', tab!=='roo');
  document.getElementById('tab-sup').classList.toggle('hidden', tab!=='sup');
  document.getElementById('tab-rsp').classList.toggle('hidden', tab!=='rsp');
  document.getElementById('tab-rsp-plik').classList.toggle('hidden', tab!=='rsp-plik');
  document.getElementById('tab-channel').classList.toggle('hidden', tab!=='channel');
  document.getElementById('tab-plan').classList.toggle('hidden', tab!=='plan');
  if (tab==='plan') renderPlan();
  document.body.classList.toggle('tab-plan', tab==='plan');
  document.querySelector('.filter-bar').style.display = (tab === 'detail') ? '' : 'none';
  requestAnimationFrame(updateStickyOffsets);
}
function toggleDark() {
  document.body.classList.toggle('dark');
  localStorage.setItem('rattanaDark', document.body.classList.contains('dark') ? '1':'0');
}
if (localStorage.getItem('rattanaDark')==='1') document.body.classList.add('dark');

const showSpinner = (m='กำลังโหลด...') => { document.getElementById('spinnerMsg').textContent=m; document.getElementById('spinner').classList.add('show'); };
const hideSpinner = () => document.getElementById('spinner').classList.remove('show');
const setLoading  = on => document.getElementById('loadingBar').style.width = on?'85%':'0';
function showToast(msg, type='info') {
  const t=document.createElement('div'); t.className=`toast toast-${type}`; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(),3500);
}
window.addEventListener('scroll', () => {
  document.getElementById('backToTop').classList.toggle('show', window.scrollY > 300);
});
</script>
