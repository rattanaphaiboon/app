﻿﻿﻿﻿<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Rattana ยอดขายเทียบเป้าหมาย v9.64</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-datalabels/2.2.0/chartjs-plugin-datalabels.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root {
  --navy:        #0d1b3e;
  --navy-mid:    #1a2f5e;
  --navy-light:  #243b73;
  --gold:        #c9a84c;
  --gold-light:  #e8c86a;
  --success:  #2ecc71;
  --danger:   #e74c3c;
  --warning:  #f39c12;
  --info:     #3498db;
  --bg:       #f4f6fb;
  --text:     #0d1b3e;
  --card-bg:  #ffffff;
  --border:   #dde3f0;
  --muted:    #6b7896;
  --row-alt:  #fafbfd;
  --space-xs:  4px; --space-sm:  8px; --space-md:  16px; --space-lg:  24px; --space-xl:  32px;
  --radius-sm:  6px; --radius-md:  12px; --radius-lg:  16px; --radius-xl:  20px;
  --shadow-sm:  0 1px 4px rgba(0,0,0,.06);
  --shadow-md:  0 2px 8px rgba(0,0,0,.08);
  --shadow-lg:  0 8px 24px rgba(13,27,62,.12);
  --shadow-gold: 0 4px 12px rgba(201,168,76,.35);
}
body.dark {
  --bg:       #0a1020;
  --text:     #e8eaf0;
  --card-bg:  #111c35;
  --border:   #243b73;
  --muted:    #8a98b8;
  --row-alt:  #0f1830;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Sarabun',sans-serif;font-size:14px;line-height:1.5;min-height:100dvh;overflow-x:hidden;background-color:var(--bg);color:var(--text);transition:background-color .25s,color .25s}
button{font-family:inherit;cursor:pointer;border:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
input,select,textarea{font-family:inherit;font-size:16px}

header{background:var(--navy);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:12px;border-bottom:3px solid var(--gold);padding-top:max(12px,env(safe-area-inset-top))}
.logo-text{font-weight:700;letter-spacing:1px;font-size:16px;color:#fff;line-height:1.25}
.logo-text span{color:var(--gold)}
.logo-text small{display:block;font-weight:400;font-size:11px;color:rgba(255,255,255,.65);letter-spacing:.3px}
.icon-btn{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.2);width:38px;height:38px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-size:18px;transition:background .15s;flex-shrink:0}
.icon-btn:hover{background:rgba(255,255,255,.12)}

.tab-nav{display:flex;background:var(--navy);border-bottom:3px solid var(--gold);padding:0 8px;gap:4px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;position:sticky;top:var(--hdr-h,63px);z-index:95}
.tab-nav::-webkit-scrollbar{display:none}
.tab-btn{background:transparent;border:none;color:rgba(255,255,255,.6);padding:12px 18px;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;flex-shrink:0;transition:all .18s;margin-bottom:-3px;border-radius:var(--radius-sm) var(--radius-sm) 0 0}
.tab-btn:hover{color:#fff;background:rgba(255,255,255,.06)}
.tab-btn.active{color:var(--navy);background:var(--gold);border-bottom-color:var(--gold);font-weight:700;box-shadow:0 -2px 8px rgba(201,168,76,.3)}

.card{background:var(--card-bg);border-radius:var(--radius-md);border:1px solid var(--border);box-shadow:var(--shadow-md)}
.card-gold{border-top:3px solid var(--gold)}
.card-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border);background:linear-gradient(to right,rgba(201,168,76,.07),transparent);gap:8px;flex-wrap:wrap}
.card-head h3{font-size:15px;font-weight:700}
.card-body{padding:16px}

.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;border:1px solid transparent;min-height:40px;transition:opacity .15s,transform .1s;-webkit-tap-highlight-color:transparent}
.btn:hover{opacity:.88}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn-gold{background:var(--gold);color:var(--navy);border-color:var(--gold)}
.btn-gold:hover{background:var(--gold-light)}
.btn-outline{background:transparent;color:var(--text);border-color:var(--border)}
.btn-sm{padding:5px 10px;font-size:12px;min-height:30px}

.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;white-space:nowrap}
.badge-ok{background:#e8f7ee;color:#1e8449}
.badge-warn{background:#fef3d7;color:#a87800}
.badge-danger{background:#ffd5d0;color:#c0392b}
.badge-info{background:#e3f0fd;color:#1a6fb8}
.badge-gold{background:rgba(201,168,76,.18);color:var(--navy);border:1px solid rgba(201,168,76,.4)}
.badge-muted{background:rgba(107,120,150,.15);color:var(--muted)}
body.dark .badge-ok{background:#1a3a25;color:#7be0a3}
body.dark .badge-warn{background:#3a2e15;color:#e8c86a}
body.dark .badge-danger{background:#3a1a17;color:#ff8a7e}
body.dark .badge-info{background:#132a42;color:#7fc4f7}

.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl{width:100%;border-collapse:collapse;min-width:0}
.tbl thead{background:var(--navy);color:#fff;position:sticky;top:var(--tbl-top,175px);z-index:5}
.tbl thead th{padding:4px 5px;text-align:center;font-size:10px;font-weight:600;letter-spacing:.2px;white-space:normal;border-bottom:2px solid var(--gold);cursor:pointer;user-select:none;min-width:52px;max-width:90px;word-break:break-word;line-height:1.2}
.tbl thead th:hover{background:var(--navy-mid)}
.tbl thead th .sort-ind{font-size:10px;color:var(--gold);margin-left:4px;font-weight:700}
.tbl tbody tr{border-bottom:1px solid var(--border);transition:background .12s}
.tbl tbody tr:nth-child(even){background:var(--row-alt)}
.tbl tbody tr:hover{background:rgba(201,168,76,.07)}
.tbl td{padding:4px 5px;font-size:10px;vertical-align:middle}
.tbl td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:500}
.tbl .empty-row td{text-align:center;padding:48px 20px;color:var(--muted);font-size:14px}

.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.3px;text-transform:uppercase}
.input{height:44px;padding:0 14px;border-radius:var(--radius-sm);border:1.5px solid var(--border);background:var(--card-bg);color:var(--text);font-size:16px;font-family:inherit;outline:none;width:100%;transition:border-color .15s}
.input:focus{border-color:var(--gold)}

.toast{position:fixed;bottom:max(24px,env(safe-area-inset-bottom));right:16px;padding:12px 20px;border-radius:var(--radius-md);color:#fff;z-index:9999;animation:slideIn .3s ease;font-weight:500;box-shadow:var(--shadow-lg);max-width:90vw;font-size:13px}
.toast-success{background:var(--success)}
.toast-error{background:var(--danger)}
.toast-warning{background:var(--warning);color:var(--navy)}
.toast-info{background:var(--navy-mid);border-left:3px solid var(--gold)}

.spinner-overlay{display:none;position:fixed;inset:0;background:rgba(13,27,62,.55);align-items:center;justify-content:center;z-index:99999;backdrop-filter:blur(3px)}
.spinner-overlay.show{display:flex}
.spinner-box{background:#fff;border-radius:var(--radius-lg);padding:32px 40px;text-align:center;border-top:4px solid var(--gold);min-width:240px}
.spinner-ring{width:48px;height:48px;border:5px solid #dde3f0;border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px}
body.dark .spinner-box{background:var(--card-bg)}
#loadingBar{position:fixed;top:0;left:0;height:3px;background:var(--gold);width:0;transition:width .4s;z-index:10000}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes slideIn{from{transform:translateX(120%);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

.flex{display:flex}.flex-center{display:flex;align-items:center;justify-content:center}.flex-between{display:flex;align-items:center;justify-content:space-between}.gap-4{gap:4px}.gap-8{gap:8px}.gap-12{gap:12px}.gap-16{gap:16px}
.mt-8{margin-top:8px}.mt-12{margin-top:12px}.mt-16{margin-top:16px}.mb-8{margin-bottom:8px}.mb-12{margin-bottom:12px}.mb-16{margin-bottom:16px}
.txt-sm{font-size:12px}.txt-muted{color:var(--muted)}.txt-gold{color:var(--gold)}.txt-danger{color:var(--danger)}.txt-success{color:var(--success)}.txt-bold{font-weight:700}.txt-center{text-align:center}.txt-right{text-align:right}
.num{font-variant-numeric:tabular-nums;font-weight:500}
.w-full{width:100%}.rounded{border-radius:var(--radius-md)}.hidden{display:none !important}
.flex-wrap{flex-wrap:wrap}

.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:640px){.stat-grid{grid-template-columns:repeat(4,1fr);gap:14px}}
.stat-card{background:var(--card-bg);border-radius:var(--radius-md);padding:16px;border:1px solid var(--border);border-top:3px solid var(--gold)}
.stat-card .s-label{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.4px;text-transform:uppercase;margin-bottom:6px}
.stat-card .s-value{font-size:22px;font-weight:700;line-height:1.2}
.stat-card .s-sub{font-size:11px;color:var(--muted);margin-top:4px}
.stat-card.danger{border-top-color:var(--danger)}.stat-card.danger .s-value{color:var(--danger)}
.stat-card.success{border-top-color:var(--success)}.stat-card.success .s-value{color:var(--success)}
@media(min-width:640px){.stat-card .s-value{font-size:26px}}

.page{min-height:100dvh;display:flex;flex-direction:column}
.content{flex:1;padding:12px;max-width:100%;margin:0 auto;width:100%}
@media(min-width:640px){.content{padding:16px}}
@media(min-width:1024px){.content{padding:20px}}

.filter-bar{position:sticky;top:var(--filter-top,110px);z-index:60;background:var(--bg);padding:10px 0;display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}

.chip-group{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:7px 14px;border-radius:20px;border:1.5px solid var(--border);background:var(--card-bg);color:var(--text);font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;min-height:36px}
.chip:hover{border-color:var(--gold)}
.chip.active{background:var(--navy);color:#fff;border-color:var(--navy)}

.dd-wrap{position:relative;min-width:220px;flex:1}
.dd-trigger{width:100%;min-height:44px;padding:10px 14px;background:var(--card-bg);border:1.5px solid var(--border);border-radius:10px;color:var(--text);font-family:'Sarabun',sans-serif;font-size:14px;text-align:left;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:6px}
.dd-panel{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--card-bg);border:1.5px solid var(--border);border-radius:10px;z-index:500;box-shadow:0 8px 24px rgba(0,0,0,.15);max-height:280px;display:none;flex-direction:column}
.dd-panel.open{display:flex}
.dd-search{padding:10px 14px;font-size:16px;border:none;border-bottom:1px solid var(--border);background:transparent;color:var(--text);outline:none;border-radius:10px 10px 0 0;font-family:'Sarabun',sans-serif}
.dd-list{overflow-y:auto;flex:1;list-style:none;padding:4px 0;margin:0}
.dd-list li{padding:10px 14px;cursor:pointer;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dd-list li:hover{background:var(--navy-light);color:#fff}
.dd-list li.no-result{color:#999;cursor:default;font-style:italic}

.perf-row{display:grid;grid-template-columns:1fr;gap:6px;padding:12px 0;border-bottom:1px solid var(--border)}
.perf-row:last-child{border-bottom:none}
.perf-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.perf-name{font-weight:600;font-size:13px}
.perf-bar-track{height:10px;border-radius:5px;background:var(--border);overflow:hidden;width:100%}
.perf-bar-fill{height:100%;border-radius:5px;transition:width .5s ease}
.perf-nums{font-size:11px;color:var(--muted)}

#backToTop{position:fixed;bottom:max(24px,calc(16px + env(safe-area-inset-bottom)));right:max(16px,calc(12px + env(safe-area-inset-right)));background:var(--gold);color:var(--navy);border:none;border-radius:50%;width:46px;height:46px;display:none;align-items:center;justify-content:center;box-shadow:var(--shadow-gold);z-index:90;font-size:18px;font-weight:700;cursor:pointer}
#backToTop.show{display:flex}

#loginScreen{display:flex;min-height:100dvh;align-items:center;justify-content:center;padding:20px;background:linear-gradient(160deg,var(--navy) 0%,#152449 60%,var(--navy-mid) 100%)}
.login-card{background:var(--card-bg);border-radius:var(--radius-xl);padding:36px 30px;max-width:380px;width:100%;text-align:center;border-top:4px solid var(--gold);box-shadow:var(--shadow-lg)}
.login-card h1{font-size:19px;margin:16px 0 4px;color:var(--text)}
.login-card p{font-size:13px;color:var(--muted);margin-bottom:22px}
#loginErr{color:var(--danger);font-size:12px;margin-top:14px;display:none}

/* ── Pivot table ── */
#pivotInfoBar{position:sticky;top:var(--infobar-top,175px);z-index:55;background:var(--bg);padding-bottom:4px}
.info-bar{display:flex;gap:20px;align-items:center;flex-wrap:wrap;background:var(--navy);color:#fff;padding:10px 16px;border-radius:var(--radius-md);margin-bottom:0;border-bottom:3px solid var(--gold)}
.info-bar-title{font-size:14px;font-weight:700;margin-right:auto;letter-spacing:.5px}
.info-bar-item{display:flex;flex-direction:column;align-items:center;gap:1px}
.info-bar-label{font-size:10px;color:rgba(255,255,255,.6);letter-spacing:.4px;text-transform:uppercase;white-space:nowrap}
.info-bar-val{font-size:15px;font-weight:700;color:var(--gold)}
.ptbl-block{margin-bottom:14px;border-radius:var(--radius-md);overflow:hidden;border:1px solid #000;box-shadow:var(--shadow-sm);position:relative}
.ptbl-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.ptbl-blk-bar{padding:3px 6px;background:#f0f0f0;border-bottom:1px solid #ccc;display:flex;align-items:center;gap:6px;font-size:11px;color:#555}
.ptbl-blk-btn{width:16px;height:16px;border:2px solid #555;border-radius:2px;background:#fff;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:10px;line-height:1;padding:0;transition:background .15s;flex-shrink:0}
.ptbl-blk-btn.on{background:#111;border-color:#000;color:#fff}
.ptbl-block.blacked tbody tr td,.ptbl-block.blacked tbody tr th{background:#111 !important;color:#111 !important;border-color:#333 !important}
.ptbl{border-collapse:collapse;font-size:12px;min-width:100%;width:max-content;table-layout:auto}
.ptbl-name-cell{padding:9px 12px;text-align:left;white-space:nowrap;background:#FFF4C7;border:1px solid #000;border-right:2px solid #000;border-bottom:2px solid #000;vertical-align:middle;min-width:130px;position:sticky;left:0;z-index:2}
.ptbl-person-name{font-size:15px;font-weight:700;color:#000;line-height:1.3}
.ptbl-person-wh{font-size:15px;color:#333;margin-top:2px;font-weight:700}
.ptbl-th{padding:4px 6px;text-align:center;background:#FFF4C7;border:1px solid #000;border-bottom:2px solid #000;min-width:80px;max-width:130px;white-space:normal;word-break:normal;overflow-wrap:break-word}
.ptbl-th-val{font-size:15px;font-weight:700;color:#000;line-height:1.3}
.ptbl-th-unit{font-size:15px;color:#555;margin-top:0px;line-height:1.3}
.ptbl-label{padding:7px 10px;font-size:13px;font-weight:700;color:#000;background:var(--row-alt);border-right:2px solid #000;border-bottom:1px solid #000;white-space:nowrap;text-align:left;position:sticky;left:0;z-index:1;min-width:130px}
.ptbl tbody tr:nth-child(even) .ptbl-label{background:var(--card-bg)}
.ptbl-td{padding:6px 8px;text-align:center;font-variant-numeric:tabular-nums;border:1px solid #000;font-size:16px;font-weight:700;white-space:nowrap}
.ptbl tbody tr:hover{background:rgba(201,168,76,.05)}
.ptbl-ok{background:#d4edda !important;color:#155724;font-weight:700}
.ptbl-warn{background:#fff3cd !important;color:#856404;font-weight:700}
.ptbl-danger{background:#f8d7da !important;color:#721c24;font-weight:700}
.ptbl-muted{color:var(--muted);background:transparent !important}
body.dark .ptbl-ok{background:#1a3a25 !important;color:#7be0a3}
body.dark .ptbl-warn{background:#3a2e15 !important;color:#e8c86a}
body.dark .ptbl-danger{background:#3a1a17 !important;color:#ff8a7e}
body.dark .ptbl-name-cell{background:#FFF4C7}
body.dark .ptbl-th{background:#FFF4C7}
body.dark .ptbl-label{background:var(--row-alt)}
body.dark .ptbl-td{border-color:var(--border)}
</style>
</head>
<body>

<div id="loadingBar"></div>
<div class="spinner-overlay" id="spinner">
  <div class="spinner-box">
    <div class="spinner-ring"></div>
    <p id="spinnerMsg">กำลังโหลด...</p>
  </div>
</div>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-card">
    <div style="font-size:36px;margin-bottom:4px">🔒</div>
    <h1>RATTANA<span style="color:var(--gold)">·</span>SALES</h1>
    <p>ยอดขายเทียบเป้าหมาย — เข้าสู่ระบบด้วย Google</p>
    <div id="g_id_onload"
         data-client_id="615875645128-gasjjvkt6lu8g449cbnhl40k1pu25r0b.apps.googleusercontent.com"
         data-callback="handleGoogleLogin"
         data-auto_prompt="false"></div>
    <div class="g_id_signin"
         data-type="standard"
         data-shape="rectangular"
         data-theme="outline"
         data-text="signin_with"
         data-size="large"
         data-logo_alignment="left"
         data-width="300"></div>
    <div id="loginErr"></div>
  </div>
</div>

<!-- APP -->
<div class="page hidden" id="appScreen">
  <header>
    <div class="logo-text">RATTANA<span>·</span>SALES
      <small>ยอดขายเทียบเป้าหมาย v9.64</small>
    </div>
    <div class="flex gap-8" style="margin-left:auto">

      <button class="btn btn-gold btn-sm" onclick="saveActualToSheet()" title="บันทึกทำได้ลงชีต">⭱ บันทึก</button>
      <button class="icon-btn" id="btnRefresh" onclick="refreshData()" title="รีเฟรช">⟳</button>
      <button class="icon-btn" onclick="toggleDark()" title="โหมดมืด">🌙</button>
      <button class="icon-btn" onclick="logout()" title="ออกจากระบบ">⏻</button>
    </div>
  </header>

  <div class="tab-nav">
    <button class="tab-btn active" data-tab="ontop" onclick="switchTab('ontop')">On Top</button>
    <button class="tab-btn" data-tab="outlets" onclick="switchTab('outlets')">Outlets</button>
    <button class="tab-btn" data-tab="roo" onclick="switchTab('roo')">ROO</button>
    <button class="tab-btn" data-tab="detail" onclick="switchTab('detail')">รายละเอียดเป้าหมาย</button>
    <button class="tab-btn" data-tab="sup" onclick="switchTab('sup')">Sup</button>
    <button class="tab-btn" data-tab="rsp" onclick="switchTab('rsp')">RSP ส่ง</button>
    <button class="tab-btn" data-tab="rsp-plik" onclick="switchTab('rsp-plik')">RSP ปลีก</button>
    <button class="tab-btn" data-tab="channel" onclick="switchTab('channel')">Channel</button>
    <button class="tab-btn" data-tab="birdy" onclick="switchTab('birdy')">เบอร์ดี้ 3 in 1</button>
    <button class="tab-btn" data-tab="loveza" onclick="switchTab('loveza')">เลิฟซ่า</button>
    <button class="tab-btn" data-tab="deedo" onclick="switchTab('deedo')">ดีโด้ มิกกุ 300</button>

function parseCsvDedup(text) {
  // Like parseCsv but appends _2 _3 ... to duplicate header names
  if (!text) return [];
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  const rows = []; let row = [], cell = '', inQuote = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (inQuote) {
      if (ch === '"') { if (text[i+1]==='"'){cell+='"';i++;}else inQuote=false; }
      else cell += ch;
    } else {
      if (ch==='"') inQuote=true;
      else if (ch===',') { row.push(cell); cell=''; }
      else if (ch==='\r') { /* skip */ }
      else if (ch==='\n') { row.push(cell); rows.push(row); row=[]; cell=''; }
      else cell += ch;
    }
  }
  if (cell.length||row.length) { row.push(cell); rows.push(row); }
  if (!rows.length) return [];
  const clean = s => String(s||'').replace(/[​‌‍﻿]/g,'').replace(/ /g,' ').trim();
  const seen = {};
  const headers = rows[0].map(s => {
    const k = clean(s);
    if (k in seen) { seen[k]++; return k + '_' + seen[k]; }
    seen[k] = 1; return k;
  });
  return rows.slice(1).filter(r=>r.some(c=>clean(c))).map(r=>{
    const obj = {};
    headers.forEach((k,i)=>{ obj[k]=clean(r[i]); });
    return obj;
  });
}

      else if (ch==='\r') { /* skip */ }
      else if (ch==='\n') { row.push(cell); rows.push(row); row=[]; cell=''; }
      else cell += ch;
    }
  }
  if (cell.length||row.length) { row.push(cell); rows.push(row); }
  if (!rows.length) return [];
  const clean = s => String(s||'').replace(/[​‌‍﻿]/g,'').replace(/ /g,' ').trim();

function decodeJwtPayload(token) {
  const parts = String(token||'').split('.');
  if (parts.length < 2) throw new Error('JWT format invalid');
  let b64 = parts[1].replace(/-/g, '+').replace(/_/g, '/');
  const pad = (4 - b64.length % 4) % 4;
  if (pad) b64 += '='.repeat(pad);
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return JSON.parse(new TextDecoder('utf-8').decode(bytes));
}
const normalizeEmail = s => String(s||'').replace(/[​‌‍﻿]/g,'').replace(/\s+/g,'').toLowerCase();

async function handleGoogleLogin(r) {
  showSpinner('กำลังตรวจสอบสิทธิ์...');
  try {
    const email = normalizeEmail(decodeJwtPayload(r.credential).email);
    const users = await loadFromSheets(AUTH_CONFIG.usersSheetId, AUTH_CONFIG.usersSheetName);
    const user  = users.find(u => normalizeEmail(u['E-mail']) === email);
    if (!user) { showLoginError('ไม่พบอีเมลนี้ในระบบ กรุณาติดต่อ Admin'); return; }
    if (String(user['Status']||'').trim().toLowerCase() !== 'active') { showLoginError('บัญชีถูกระงับ กรุณาติดต่อ Admin'); return; }
    currentUser = {
      email, name:user['ชื่อ - สกุล'], nickname:user['ชื่อเล่น'],
      role:parseInt(user['User Role'])||1, dept:user['แผนก'],
      company:user['บริษัท'], warehouse:user['W'], empId:user['รหัสพนักงาน'],
    };
    localStorage.setItem('rattanaUser', JSON.stringify({ data: currentUser, exp: Date.now() + 30*24*60*60*1000 }));
    document.getElementById('loginScreen').style.display='none';
    document.getElementById('appScreen').classList.remove('hidden');
    initApp();
  } catch(e) { console.error(e); showLoginError('เกิดข้อผิดพลาด กรุณาลองใหม่'); }
  finally { hideSpinner(); }
}

/* ================= HELPERS ================= */
const parseNum = s => { const n = parseFloat(String(s||'').replace(/,/g,'')); return isNaN(n)?0:n; };
const normalizeText = s => String(s||'').replace(/\s+/g,' ').trim();
const normalizeName = s => normalizeText(String(s||'').replace(/^-+\s*/,'').replace(/^คุณ\s*/,''));
const fmtNum = (n, digits=0) => Number(n||0).toLocaleString('th-TH', {minimumFractionDigits:digits, maximumFractionDigits:digits});

function parseTargetName(name) {
  const s = String(name||'');
  const parts = s.split('-');
  if (parts.length < 3) return null;
  // unit อาจมี - ในตัว เช่น "Check-in" → ลองจับ unit 2 ส่วนท้ายก่อน
  if (parts.length >= 4) {
    const lastTwo = (parts[parts.length-2] + '-' + parts[parts.length-1]).trim();
    const knownCompound = ['check-in'];
    if (knownCompound.includes(lastTwo.toLowerCase())) {
      return { dim: parts[0].trim(), value: parts.slice(1,-2).join('-').trim(), unit: lastTwo };
    }
  }
  return { dim: parts[0].trim(), value: parts.slice(1,-1).join('-').trim(), unit: parts[parts.length-1].trim() };
}
function parseThaiMonthYear(s) {
  const m = normalizeText(s).match(/^(\S+)\s+(\d{4})$/);
  if (!m) return null;
  const mm = THAI_MONTHS[m[1]];
  if (!mm) return null;
  return { mm, yyyy: parseInt(m[2],10) - 543 };
}
function bpMonthYear(dateStr) {
  const p = String(dateStr||'').split('/');
  if (p.length !== 3) return null;
  const mm = parseInt(p[1],10), yyyy = parseInt(p[2],10);
  if (!mm || !yyyy) return null;
  return { mm, yyyy };
}

function buildBpIndex(bpRaw) {
  const idx = new Map();
  bpRaw.forEach(r => {
    const my = bpMonthYear(r['Doc_Date']);
    if (!my) return;
    const normName = normalizeName(r['Sale NO ROO']);
    if (!normName) return;
    const key = normName + '||' + my.mm + '/' + my.yyyy;
    r._exvatcn2 = parseNum(r['EXVat+CN*2']);
    r._csx = parseNum(r['Sales_CSxValue']);
    if (!idx.has(key)) idx.set(key, []);
    idx.get(key).push(r);
  });
  return idx;
}

function buildCnIndex(cnRaw) {
  const idx = new Map();
  (cnRaw || []).forEach(r => {
    const rawName = String(r['Sale no Roo'] || '').trim().replace(/^-*คุณ\s*/, '');
    const colKey = Object.keys(r).find(k => k.includes('COUNTUNIQUE') || k.includes('บิลรับคืน'));
    const v = colKey ? parseNum(r[colKey]) : 0;
    if (!rawName || !v) return;
    const key = normalizeName(rawName);
    if (!idx.has(key)) idx.set(key, v);
  });
  return idx;

function buildBudgetIndex(budgetRaw) {
  const idx = new Map();
  (budgetRaw || []).forEach(r => {
    const keys = Object.keys(r);
    const codeCol = keys.find(k => k.includes('SLMN_CODE'));
    const nameCol = keys.find(k => k.includes('Sale NO ROO') || k.includes('Sale_NO_ROO'));
    const budgetCol = keys.find(k => k.trim() === 'Budget');
    const v = budgetCol ? parseNum(r[budgetCol]) : 0;
    if (!v) return;
    if (codeCol) {
      const code = normalizeText(String(r[codeCol] || ''));
      if (code && !idx.has(code)) idx.set(code, v);
    }
    if (nameCol) {
      const name = normalizeName(String(r[nameCol] || ''));
      if (name && !idx.has(name)) idx.set(name, v);
    }
  });
  return idx;
}

      stores = uniqueDates > 0 ? Math.round(custCount / uniqueDates) : 0;
      supported = true;
    } else if (parsed.dim.toUpperCase() === 'KPI' && normalizeText(parsed.value).toUpperCase() === 'ALL SKU' && effectiveMonth) {
      const key = normName + '||' + (effectiveMonth||monthInfo).mm + '/' + (effectiveMonth||monthInfo).yyyy;
      const bucket = bpIndex.get(key) || [];
      actual = new Set(bucket.map(r => r['Product_Name']).filter(Boolean)).size;
      stores = new Set(bucket.map(r => r['Customer_Code']).filter(Boolean)).size;
      supported = true;
    } else if (parsed.dim.toUpperCase() === 'KPI' && normalizeText(parsed.value).toUpperCase().includes('FMCG') && effectiveMonth) {
      const key = normName + '||' + (effectiveMonth||monthInfo).mm + '/' + (effectiveMonth||monthInfo).yyyy;
      const bucket = bpIndex.get(key) || [];
      const EXCLUDE_CAT_BU_FMCG = ['bplus บุหรี่', 'bplus thaibev al'];
      const filtered = bucket.filter(r => {
        const prathan = normalizeText(String(r['ประเภทตัวแทน'] || '')).toLowerCase();
        const catBu = normalizeText(String(r['Cat_BU'] || '')).toLowerCase();
        return prathan !== 'ตัวแทน' && !EXCLUDE_CAT_BU_FMCG.includes(catBu);
      });
      actual = filtered.reduce((s, r) => s + r._exvatcn2, 0);
      stores = new Set(filtered.map(r => r['Customer_Code']).filter(Boolean)).size;
      supported = true;
    } else if (parsed.dim.toUpperCase() === 'KPI' && normalizeText(parsed.value).startsWith('สินค้าตัวแทน') && effectiveMonth) {
      const key = normName + '||' + (effectiveMonth||monthInfo).mm + '/' + (effectiveMonth||monthInfo).yyyy;
      const bucket = bpIndex.get(key) || [];
      const EXCLUDE_CAT_BU = ['bplus บุหรี่', 'bplus thaibev al', 'ไม่กำหนดประเภท'];
      const filtered = bucket.filter(r => {
        const prathan = normalizeText(String(r['ประเภทตัวแทน'] || '')).toLowerCase();
        const catBu = normalizeText(String(r['Cat_BU'] || '')).toLowerCase();
        return prathan === 'ตัวแทน' && !EXCLUDE_CAT_BU.includes(catBu);
      });
      actual = filtered.reduce((s, r) => s + r._exvatcn2, 0);
      stores = new Set(filtered.map(r => r['Customer_Code']).filter(Boolean)).size;
      supported = true;
    } else if (parsed.dim.toUpperCase() === 'KPI' && normalizeText(parsed.value).includes('บุหรี่') && normalizeText(parsed.value).includes('สินค้าตัวแทน') && effectiveMonth) {
      const key = normName + '||' + (effectiveMonth||monthInfo).mm + '/' + (effectiveMonth||monthInfo).yyyy;
      const bucket = bpIndex.get(key) || [];
      const filtered = bucket.filter(r => {
        const prathan = normalizeText(String(r['ประเภทตัวแทน'] || '')).toLowerCase();
        const catBu = normalizeText(String(r['Cat_BU'] || '')).toLowerCase();
        return catBu === 'bplus บุหรี่' && prathan !== 'ตัวแทน';
      });
      actual = filtered.reduce((s, r) => s + r._exvatcn2, 0);
      stores = new Set(filtered.map(r => r['Customer_Code']).filter(Boolean)).size;
      supported = true;
    } else if (bpCol && effectiveMonth) {
      supported = true;
      const key = normName + '||' + (effectiveMonth||monthInfo).mm + '/' + (effectiveMonth||monthInfo).yyyy;
      const bucket = bpIndex.get(key) || [];
      const wantVal = normalizeText(parsed.value).toUpperCase();
      const matches = bucket.filter(r => normalizeText(r[bpCol]).toUpperCase() === wantVal);
      stores = new Set(matches.map(r=>r['Customer_Code'])).size;
      if (parsed.unit === 'บาท' || parsed.unit === '%บาท') actual = matches.reduce((s,r)=>s+r._exvatcn2, 0);
      else if (parsed.unit === 'ตัน') actual = matches.reduce((s,r)=>s+r._csx, 0) / 1000;
      else if (parsed.unit === 'ลัง') actual = matches.reduce((s,r)=>s+r._csx, 0);
      else if (parsed.unit === 'ร้าน') actual = new Set(matches.map(r=>r['Customer_Code'])).size;
      else supported = false;
    }
    if (!supported) console.warn('[UNSUPPORTED]', normName, empCode, 'goalName=', goalName, 'dim=', JSON.stringify(parsed.dim), 'dimKey=', dimKey, 'supported=', supported);
    const pct = (supported && targetVal > 0) ? (actual/targetVal*100) : null;
    const st = statusOf(pct, supported);
    const prevActual = calcBpActualForMonth(parsed, normName, prevSaleMonth, prevBpIndex, empCode);
    rows.push({
      wh, name, nickname: t['ชื่อเล่น']||'', month: t['เดือน']||'', empCode,
      goalName,
      dim: parsed.dim, dimLabel: DIM_LABEL[dimKey] || parsed.dim,
      value: parsed.value, unit: parsed.unit,
      target: targetVal, actual, prevActual, stores, pct, supported,
      statusLabel: st.label, statusCls: st.cls,
    });
  });
  return rows;
}

async function refreshData() {

  showSpinner('กำลังรีเฟรชข้อมูล...');
  await loadData(false);

  b.disabled = false; setTimeout(() => { b.style.transform = ''; b.style.transition = ''; }, 600);
  showToast('อัพเดทเรียบร้อย ✓', 'success');
}

function startAutoRefresh(sec=600) {
  if (state.autoTimer) clearInterval(state.autoTimer);
  state.autoTimer = setInterval(async () => { await loadData(false); }, sec*1000);
}

function initApp() {
  const cachedTarget = getCached('targetCache');
  if (cachedTarget) { state.targetRaw = cachedTarget; }
  applyTabPermissions();
  loadData(true);
  startAutoRefresh(600);
  requestAnimationFrame(updateStickyOffsets);
}
function applyTabPermissions() {
  const w = currentUser && currentUser.warehouse;
  const role = currentUser && currentUser.role || 0;
  const W1_TABS = new Set(['detail','outlets','ontop','sup','roo']);
  const W3W4_TABS = new Set(['detail','outlets','ontop','roo']);
  document.querySelectorAll('.tab-btn').forEach(b => {
    if (role > 4) {
      b.style.display = '';
    } else if (w === 'W1') {
      b.style.display = W1_TABS.has(b.dataset.tab) ? '' : 'none';
    } else if (w === 'W3' || w === 'W4') {
      b.style.display = W3W4_TABS.has(b.dataset.tab) ? '' : 'none';
    } else {
      b.style.display = '';
    }
  });
}

function buildFilterControls() {
  const role = currentUser && currentUser.role || 0;
  const userW = currentUser && currentUser.warehouse;
  const isHighRole = role > 4;
  const whAll = ['ALL', ...Array.from(new Set(state.rows.map(r=>r.wh))).filter(Boolean).sort()];
  const whChips = document.getElementById('whChips');

  if (isHighRole && userW && userW !== 'HQ' && !state._whLocked) {
    state.filters.wh = userW;
    state._whLocked = true;
  }
  if (isHighRole && userW && userW !== 'HQ') {
    whChips.innerHTML = `<button class="chip active">${userW}</button>`;
    whChips.style.pointerEvents = 'none';
    whChips.style.opacity = '0.7';
  } else {
    whChips.innerHTML = whAll.map(w => `<button class="chip ${state.filters.wh===w?'active':''}" onclick="setWhFilter('${w}')">${w==='ALL'?'ทั้งหมด':w}</button>`).join('');
    whChips.style.pointerEvents = '';
    whChips.style.opacity = '';
  }
  document.getElementById('typeChips').innerHTML = TYPE_FILTERS.map(t => `<button class="chip ${state.filters.type===t.key?'active':''}" onclick="setTypeFilter('${t.key}')">${t.label}</button>`).join('');

  const names = Array.from(new Set(state.rows.map(r=>r.name))).filter(Boolean).sort((a,b)=>a.localeCompare(b,'th'));
  const list = document.getElementById('nameDDList');
  const isSale = currentUser && !isHighRole && names.includes(currentUser.name);
  if (isSale && !state._saleLocked) {
    state.filters.name = currentUser.name;
    document.getElementById('nameDDLabel').textContent = currentUser.name;
    state._saleLocked = true;
  }
  if (isSale) {
    list.innerHTML = `<li>${currentUser.name}</li>`;
    document.getElementById('nameDDWrap').style.pointerEvents = 'none';
    document.getElementById('nameDDWrap').style.opacity = '0.7';
  } else {
    list.innerHTML = '<li onclick="setNameFilter(\'\')">ทั้งหมด</li>' + names.map(n=>`<li onclick="setNameFilter('${n.replace(/'/g,"\\'")}')">${n}</li>`).join('');
    document.getElementById('nameDDWrap').style.pointerEvents = '';
    document.getElementById('nameDDWrap').style.opacity = '';
  }
}

function renderOverview() {

  const buBaht = rows.filter(r => r.dim.toUpperCase()==='CAT BU' && r.unit==='บาท' && r.supported);
  const targetSum = buBaht.reduce((s,r)=>s+r.target,0);
  const actualSum = buBaht.reduce((s,r)=>s+(r.actual||0),0);
  const overallPct = targetSum>0 ? (actualSum/targetSum*100) : 0;
  const supportedAll = rows.filter(r=>r.supported);
  const passCount = supportedAll.filter(r=>r.pct>=100).length;

  const grid = document.getElementById('statGrid');
  const pctClass = overallPct>=100?'success':(overallPct<80?'danger':'');
  grid.innerHTML = `
    <div class="stat-card"><div class="s-label">เป้าหมายรวม (BU · บาท)</div><div class="s-value">${fmtNum(targetSum)}</div><div class="s-sub">บาท</div></div>
    <div class="stat-card"><div class="s-label">ยอดขายจริงรวม (BU · บาท)</div><div class="s-value">${fmtNum(actualSum)}</div><div class="s-sub">บาท</div></div>

    <div class="stat-card"><div class="s-label">เป้าหมายที่ผ่าน (ทุกหน่วย)</div><div class="s-value">${passCount}/${supportedAll.length}</div><div class="s-sub">รายการที่คำนวณได้</div></div>
  `;

  const perNameMap = new Map();
  buBaht.forEach(r => {
    if (!perNameMap.has(r.name)) perNameMap.set(r.name, {name:r.name, target:0, actual:0});
    const o = perNameMap.get(r.name); o.target += r.target; o.actual += (r.actual||0);
  });
  const perf = Array.from(perNameMap.values()).map(o => ({...o, pct: o.target>0 ? o.actual/o.target*100 : 0}));
  perf.sort((a,b)=>a.pct-b.pct);

  const list = document.getElementById('perfList');
  list.innerHTML = perf.length ? perf.map(o => `
    <div class="perf-row">
      <div class="perf-top">
        <div class="perf-name">${o.name}</div>
        <span class="badge ${o.pct>=100?'badge-ok':(o.pct>=80?'badge-warn':'badge-danger')}">${fmtNum(o.pct,1)}%</span>
      </div>
      <div class="perf-bar-track"><div class="perf-bar-fill" style="width:${Math.min(o.pct,100)}%;background:${colorOf(o.pct)}"></div></div>
      <div class="perf-nums">${fmtNum(o.actual)} / ${fmtNum(o.target)} บาท</div>
    </div>
  `).join('') : '<div class="txt-muted txt-center" style="padding:24px">ไม่มีข้อมูลในตัวกรองนี้</div>';

  const months = Array.from(new Set(state.rows.map(r=>r.month))).filter(Boolean);
  const _thm = ['','มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
  const _grm = state.globalRefMonth;
  const _bpMonthStr = _grm ? (_thm[_grm.mm]||'') + ' ' + (_grm.yyyy+543) : '';
  document.getElementById('dataMonthLabel').textContent = _bpMonthStr ? 'ข้อมูลเดือน: ' + _bpMonthStr : (months.length ? 'ข้อมูลเดือน: ' + months.join(', ') : '');
}

/* ================= WORKING DAYS ================= */
function getHolidayCount(dataMonthStr) {
  if (!state.targetRaw || !dataMonthStr) return 0;
  const p = parseThaiMonthYear(dataMonthStr);
  if (!p) return 0;
  const holidays = new Set();
  state.targetRaw.forEach(t => {
    const tMonth = normalizeText(t['เดือน'] || '');
    const tm = parseThaiMonthYear(tMonth);
    if (!tm || tm.mm !== p.mm || tm.yyyy !== p.yyyy) return;
    const h = normalizeText(String(t['Holiday'] || ''));
    if (h) holidays.add(h);
  });
  return holidays.size;
}

function getWdMonth() {
  const dataMonth = (state.rows||[]).find(r=>r.month)?.month || '';
  const lbp = state.latestBpMonth;
  if (!lbp) return dataMonth;
  const thaiMonthNames = ['','มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
  return (thaiMonthNames[lbp.mm] || '') + ' ' + (lbp.yyyy + 543);
}

function getWorkingDaysInfo(dataMonthStr) {
  let year, month;
  if (dataMonthStr) {
    const p = parseThaiMonthYear(dataMonthStr);
    if (p) { year = p.yyyy; month = p.mm - 1; }
  }
  if (!year) { const n = new Date(); year = n.getFullYear(); month = n.getMonth(); }
  const now = new Date();
  const isCurrentMonth = (now.getFullYear() === year && now.getMonth() === month);
  const today = isCurrentMonth ? now.getDate() : new Date(year, month + 1, 0).getDate();
  const lastDay = new Date(year, month + 1, 0).getDate();
  let totalWork = 0, doneWork = 0, futureWork = 0;
  for (let d = 1; d <= lastDay; d++) {
    const dow = new Date(year, month, d).getDay();
    if (dow !== 0) {
      totalWork++;
      if (d < today) doneWork++;
      else futureWork++;
    }
  }
  const holidays = getHolidayCount(dataMonthStr);
  totalWork = Math.max(0, totalWork - holidays);
  const todayIsWorkday = isCurrentMonth && new Date(year, month, today).getDay() !== 0;
  const remaining = isCurrentMonth ? Math.max(todayIsWorkday ? 1 : 0, futureWork - holidays) : 0;
  const pct = totalWork > 0 ? Math.round((totalWork - remaining) / totalWork * 100) : 0;
  const weekOfMonth = Math.ceil(today / 7);
  const nd = now.getDate(), nm = now.getMonth()+1, ny = now.getFullYear()+543;
  const dateStr = `${String(nd).padStart(2,'0')}/${String(nm).padStart(2,'0')}/${ny}`;
  return { totalWork, doneWork, remaining, pct, weekOfMonth, dateStr };
}

function renderPivot() {
  const rows = filteredRows();
  const months = Array.from(new Set(state.rows.map(r=>r.month))).filter(Boolean);
  const dataMonth = months[0] || '';
  document.getElementById('pivotMonthLabel').textContent = dataMonth ? 'ข้อมูลเดือน: ' + dataMonth : '';

  // ใช้เดือนล่าสุดจาก BP คำนวณ TIME USED ถ้า BP อัปเดตเดือนใหม่แล้ว
  const wdMonth = (() => {
    const lbp = state.latestBpMonth;
    if (!lbp) return dataMonth;
    const thaiMonthNames = ['','มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
    return (thaiMonthNames[lbp.mm] || '') + ' ' + (lbp.yyyy + 543);
  })();
  const wd = getWorkingDaysInfo(wdMonth);
  document.getElementById('pivotInfoBar').innerHTML = `
    <div class="info-bar">
      <span class="info-bar-title">ยอดขายเทียบเป้าหมาย</span>
      <div class="info-bar-item"><div class="info-bar-label">Time Used</div><div class="info-bar-val">${wd.pct}%</div></div>
      <div class="info-bar-item"><div class="info-bar-label">สัปดาห์ที่</div><div class="info-bar-val">${wd.weekOfMonth}</div></div>
      <div class="info-bar-item"><div class="info-bar-label">วันที่</div><div class="info-bar-val">${wd.dateStr}</div></div>
      <div class="info-bar-item"><div class="info-bar-label">วันทำงานทั้งหมด</div><div class="info-bar-val">${wd.totalWork}</div></div>
      <div class="info-bar-item"><div class="info-bar-label">วันทำงานเหลือ</div><div class="info-bar-val">${wd.remaining}</div></div>
    </div>`;

  const personMap = new Map();
  const personOrder = []; // เก็บลำดับตามที่ปรากฏใน sheet
  rows.forEach(r => {
    if (!personMap.has(r.name)) {
      personMap.set(r.name, { name: r.name, wh: r.wh, empCode: r.empCode, cols: [], _sheetIdx: personOrder.length });
      personOrder.push(r.name);
    }
    personMap.get(r.name).cols.push(r);
  });
  // เรียงตาม WH ก่อน แล้วตามลำดับใน sheet (ไม่ sort empCode)
  const whOrder = { W1: 1, W3: 2, W4: 3 };
  const sortedPersons = Array.from(personMap.values()).sort((a, b) => {
    const wa = whOrder[a.wh] ?? 9, wb = whOrder[b.wh] ?? 9;
    if (wa !== wb) return wa - wb;
    return a._sheetIdx - b._sheetIdx;
  });

  const container = document.getElementById('pivotContainer');
  if (personMap.size === 0) {
    container.innerHTML = '<div class="txt-muted txt-center" style="padding:40px">ไม่มีข้อมูลในตัวกรองนี้</div>';
    return;
  }

  const fmtC = (r, n) => {
    if (n === null || n === undefined || n === '') return '-';
    if (r && (r.unit === 'ตัน' || r.unit === 'ลัง')) return Number.isInteger(n) ? fmtNum(n, 0) : fmtNum(n, 2);
    return fmtNum(Math.round(n), 0);
  };

  const maxCols = 25;
  const EMPTY_COL = { target: null, actual: null, pct: null, stores: null, supported: false, _empty: true, value: '', unit: '' };

  let html = '';
  sortedPersons.forEach(person => {
    const cols = [...person.cols];
    while (cols.length < maxCols) cols.push({ ...EMPTY_COL });

    const colHdr = cols.map(c => c._empty
      ? `<th class="ptbl-th"></th>`
      : `<th class="ptbl-th"><div class="ptbl-th-val">${c.value}</div><div class="ptbl-th-unit">(${c.unit})</div></th>`
    ).join('');

    const mkRow = (label, fn) => `<tr><td class="ptbl-label">${label}</td>${cols.map(fn).join('')}</tr>`;

    const _whHdrBg  = person.wh==='W1'?'#FFF4C7':person.wh==='W3'?'#f8d7da':person.wh==='W4'?'#d4edda':'#FFF4C7';
    const _whHdrBrd = '#000';
    const colHdrWh = cols.map(c => c._empty
      ? `<th class="ptbl-th" style="background:${_whHdrBg};border-color:${_whHdrBrd}"></th>`
      : `<th class="ptbl-th" style="background:${_whHdrBg};border-color:${_whHdrBrd}"><div class="ptbl-th-val">${c.value}</div><div class="ptbl-th-unit">(${c.unit})</div></th>`
    ).join('');
    html += `<div class="ptbl-block"><div class="ptbl-blk-bar"><button class="ptbl-blk-btn" onclick="toggleBlack(this)" title="ปิด/เปิดข้อมูล"></button></div><div class="ptbl-scroll"><table class="ptbl">
      <thead><tr>
        <th class="ptbl-name-cell" style="background:${_whHdrBg};border-right-color:${_whHdrBrd}"><div class="ptbl-person-name">${person.name}</div><div class="ptbl-person-wh">${person.empCode ? person.empCode+' · ' : ''}${person.wh}</div></th>
        ${colHdrWh}
      </tr></thead>
      <tbody>
        ${mkRow('เป้าหมาย', c => `<td class="ptbl-td">${c._empty ? '' : (c.target === null ? '-' : fmtNum(Math.round(c.target), 0))}</td>`)}
        ${mkRow('ทำได้', c => `<td class="ptbl-td">${c._empty ? '' : (c.supported ? fmtC(c, c.actual) : '<span class="ptbl-muted">-</span>')}</td>`)}
        <tr><td class="ptbl-label">%</td>${cols.map(c => {
          if (c._empty) return `<td class="ptbl-td"></td>`;
          if (c.pct === null) return `<td class="ptbl-td ptbl-muted">-</td>`;
          const isDebtor = normalizeText(c.value) === 'ลูกหนี้' || normalizeText(c.value).toLowerCase().startsWith('budget') || normalizeText(c.value).toUpperCase() === 'CN';
          const cl = isDebtor ? (c.pct <= 100 ? 'ptbl-ok' : 'ptbl-danger') : (c.pct >= wd.pct ? 'ptbl-ok' : 'ptbl-danger');
          return `<td class="ptbl-td ${cl}">${fmtNum(c.pct,2)}%</td>`;
        }).join('')}</tr>
        ${mkRow('กระจายร้านค้า', c => `<td class="ptbl-td">${c._empty ? '' : (c.supported ? fmtNum(c.stores) : '<span class="ptbl-muted">-</span>')}</td>`)}
        ${mkRow('ต้องทำเพิ่ม', c => {
          if (c._empty) return `<td class="ptbl-td"></td>`;
          if (!c.supported || c.pct === null) return `<td class="ptbl-td ptbl-muted">-</td>`;
          return `<td class="ptbl-td">${fmtC(c, Math.max(0, c.target - (c.actual||0)))}</td>`;
        })}
        ${mkRow('ต้องขายต่อวัน', c => {
          if (c._empty) return `<td class="ptbl-td"></td>`;
          if (!c.supported || c.pct === null || wd.remaining <= 0) return `<td class="ptbl-td ptbl-muted">-</td>`;
          const need = Math.max(0, c.target - (c.actual||0));
          return `<td class="ptbl-td">${fmtC(c, need / wd.remaining)}</td>`;
        })}
        ${mkRow('ทำได้เดือนที่แล้ว', c => `<td class="ptbl-td">${c._empty ? '' : (c.prevActual !== null ? fmtC(c, c.prevActual) : '<span class="ptbl-muted">-</span>')}</td>`)}
      </tbody>
    </table></div></div>`;
  });
  container.innerHTML = html;
  requestAnimationFrame(() => {
    const tables = [...container.querySelectorAll('.ptbl-scroll table')];
    if (!tables.length) return;
    // ยึดความกว้าง column จากตารางแรก
    const firstThs = [...tables[0].querySelectorAll('thead th')];
    const colWidths = firstThs.map(th => th.offsetWidth);
    tables.forEach(table => {
      let cg = table.querySelector('colgroup');
      if (!cg) { cg = document.createElement('colgroup'); table.prepend(cg); }
      cg.innerHTML = colWidths.map(w => `<col style="width:${w}px;min-width:${w}px">`).join('');
      table.style.tableLayout = 'fixed';
      // zoom ถ้ายังเกิน
      const scroll = table.parentElement;
      table.style.zoom = 1;
      if (table.scrollWidth > scroll.offsetWidth) {
        table.style.zoom = scroll.offsetWidth / table.scrollWidth;
      }
    });
  });
}

function getChannelGroup(empCode) {
  const c = String(empCode||'').toUpperCase();
  if (c.startsWith('HSW') || c.startsWith('GP')) return 'ส่ง';
  return 'ปลีก';
}

function renderOutlets() {
  const el = document.getElementById('outletContent');
  if (!el) return;

  // get Time Used %
  const dataMonth = (state.rows||[]).find(r=>r.month)?.month || '';
  const wd = getWorkingDaysInfo(dataMonth);
  const timeUsedPct = wd.pct;

  // build AO target index from outlet sheet: normName → target
  const aoTargetIdx = new Map();
  (state.outletRaw || []).forEach(r => {
    const nm = normalizeName(r['ชื่อพนักงานขาย']);
    const t = parseNum(r['Target']);
    if (nm) aoTargetIdx.set(nm, t);
  });

  // build EO target index: normName → Target 70%(Outlet)
  const eoTargetIdx = new Map();
  (state.eoRaw || []).forEach(r => {
    const nm = normalizeName(r['ชื่อพนักงานขาย']);
    if (!nm) return;
    // ลอง key ต่างๆ เผื่อ CSV parse ชื่อคอลัมน์ต่างกัน
    const tKey = Object.keys(r).find(k => k.replace(/\s+/g,'').toLowerCase().includes('target') && k.includes('70'));
    const t = tKey ? parseNum(r[tKey]) : 0;
    eoTargetIdx.set(nm, t);
  });

  // build inRouth index: normName(เซลล์ผู้ดูแล) → count unique รหัส บีพลัส
  const inRouthIdx = new Map();
  if ((state.customerRaw||[]).length > 0) {
    const sample = state.customerRaw[0];
    const keys = Object.keys(sample);
    const bpKey = keys.find(k => k.replace(/\s/g,'').includes('รหัสบีพลัส') || k.replace(/\s/g,'').includes('รหัสbplus'));
    const selKey = keys.find(k => k.replace(/\s/g,'').includes('เซลล์ผู้ดูแล') || k.replace(/\s/g,'').includes('เซลล์'));
    (state.customerRaw).forEach(r => {
      const rawSel = String(r[selKey]||'').trim();
      const bp = String(r[bpKey]||'').trim();
      if (!rawSel || !bp) return;
      const nm = normalizeName(rawSel);
      if (!nm) return;
      if (!inRouthIdx.has(nm)) inRouthIdx.set(nm, new Set());
      inRouthIdx.get(nm).add(bp);
    });
  }

  // build empCode lookup from EO sheet: normName → empCode
  const eoEmpCodeIdx = new Map();
  (state.eoRaw || []).forEach(r => {
    const nm = normalizeName(r['ชื่อพนักงานขาย']);
    const code = String(r['รหัส']||'').trim();
    if (nm && code) eoEmpCodeIdx.set(nm, code);
  });

  // build BP sales map: normName → Map(Customer_Code → sum EXVat+CN*2)
  const bpSalesIdx = new Map();
  (state.bpRaw || []).forEach(r => {
    const nm = normalizeName(r['Sale NO ROO']);
    const cust = r['Customer_Code'];
    if (!nm || !cust) return;
    if (!bpSalesIdx.has(nm)) bpSalesIdx.set(nm, new Map());
    const custMap = bpSalesIdx.get(nm);
    custMap.set(cust, (custMap.get(cust)||0) + parseNum(r['EXVat+CN*2']));
  });

  // compute aoActual, eoActual, zeroBath per employee
  const aoActualIdx = new Map();
  const eoActualIdx = new Map();
  const zeroBathIdx = new Map();
  bpSalesIdx.forEach((custMap, nm) => {
    aoActualIdx.set(nm, custMap.size);
    const empCode = eoEmpCodeIdx.get(nm) || '';
    const thresh = debtorThreshold(empCode) ?? 2500;
    eoActualIdx.set(nm, [...custMap.values()].filter(v => v >= thresh).length);
  });
  // zeroBath = In Routh - AO Actual
  inRouthIdx.forEach((bpSet, nm) => {
    const aoA = aoActualIdx.get(nm) ?? 0;
    zeroBathIdx.set(nm, Math.max(0, bpSet.size - aoA));
  });

  // build empCode lookup from state.rows for wh
  const empInfoIdx = new Map();
  (state.rows || []).forEach(r => {
    const nm = normalizeName(r.name);
    if (!empInfoIdx.has(nm)) empInfoIdx.set(nm, { empCode: r.empCode, wh: r.wh });
  });

  // build empMap from Outlet sheet (primary source)
  const empMap = new Map();
  (state.outletRaw || []).forEach(r => {
    const rawName = String(r['ชื่อพนักงานขาย']||'').trim();
    if (!rawName) return;
    const nm = normalizeName(rawName);
    const info = empInfoIdx.get(nm) || {};
    empMap.set(nm, {
      name: rawName.replace(/^คุณ\s*/,''),
      empCode: r['รหัส'] || info.empCode || '',
      wh: info.wh || '',
      aoActual: aoActualIdx.get(nm) ?? null,
      eoTarget: eoTargetIdx.get(nm) ?? null,
      eoActual: eoActualIdx.get(nm) ?? null,
      inRouth: inRouthIdx.has(nm) ? inRouthIdx.get(nm).size : null,
      zeroBath: zeroBathIdx.has(nm) ? zeroBathIdx.get(nm) : null,
    });
  });

  // group by channel
  const groups = { 'ส่ง': [], 'ปลีก': [] };
  empMap.forEach(e => {
    const g = getChannelGroup(e.empCode);
    if (groups[g]) groups[g].push(e);
  });

  const pctBg = (a, t) => {
    if (a === null || a === undefined || !t) return '';
    return (a / t * 100) >= timeUsedPct ? 'background:#d4edda;color:#1b5e20' : 'background:#ef9a9a;color:#7f0000';
  };
  const fmtPct = (a, t) => {
    if (a === null || a === undefined || !t) return '-';
    const p = (a / t * 100);
    return `<span style="font-weight:700">${p.toFixed(2)}%</span>`;
  };
  const fmtN = v => v !== null && v !== undefined ? Number(v).toLocaleString() : '<span style="color:var(--muted)">-</span>';

  let html = `<style>
.otbl{width:auto;border-collapse:collapse;font-size:13px;border:2px solid #000;white-space:nowrap}
.otbl th,.otbl td{padding:8px 10px;border:1px solid #000;text-align:center}
.otbl thead tr:first-child th{background:#FFE0B2;color:#3a2000;font-weight:700;font-size:13px}
.otbl thead tr:nth-child(2) th{background:#FFF8E1;color:#3a2000;font-weight:600;font-size:12px}
.otbl thead .col-ao{background:#FFE0B2;color:#3a2000}
.otbl thead .col-eo{background:#FFE0B2;color:#3a2000}
.otbl thead .col-s0{background:#FFE0B2;color:#3a2000}
.otbl tbody tr:hover{filter:brightness(.95)}
.otbl .grp-head td{background:var(--navy);color:var(--gold);font-weight:700;text-align:left;border-color:#243b73}
.otbl .sum-row td{background:#FFE0B2;color:#3a2000 !important;font-weight:700;border:2px solid #000}
.otbl .sum-row td *{color:#3a2000 !important}
.otbl .seq{color:var(--muted);font-size:12px;width:32px}
</style>
<div class="tbl-wrap">
<table class="otbl">
<thead>
<tr>
  <th rowspan="2" style="width:32px">ลำดับ</th>
  <th rowspan="2" style="text-align:left;min-width:160px">ชื่อพนักงานขาย</th>
  <th rowspan="2">รหัส</th>
  <th colspan="3" class="col-ao">Active Outlet</th>
  <th colspan="3" class="col-eo">Effective Outlet</th>
  <th colspan="3" class="col-s0">Store 0 Bath</th>
</tr>
<tr>
  <th class="col-ao">Target</th><th class="col-ao">Actual</th><th class="col-ao">%</th>
  <th class="col-eo">Target 70%</th><th class="col-eo">Actual</th><th class="col-eo">%</th>
  <th class="col-s0">In Routh</th><th class="col-s0">0 Bath</th><th class="col-s0">%</th>
</tr>
</thead>
<tbody>`;

  const whRowBg = code => {
    const c = String(code||'').toUpperCase();
    if (c.startsWith('HSW1') || c.startsWith('PMW1')) return 'background:#fffde7;font-weight:700'; // W1 เหลืองพาสเทล
    if (c.startsWith('GP')   || c.startsWith('PMW2') || c.startsWith('19GP')) return 'background:#e3f2fd;font-weight:700'; // W2 น้ำเงินพาสเทล
    if (c.startsWith('TH60') || c.startsWith('PMW3')) return 'background:#fce4ec;font-weight:700'; // W3 ชมพูพาสเทล (Outlets)
    if (c.startsWith('HSW4') || c.startsWith('PMW4')) return 'background:#e8f5e9;font-weight:700'; // W4 เขียวพาสเทล
    return '';
  };

  const renderGroup = (label, rows) => {
    if (!rows.length) return '';
    let out = ``;
    let sumAoT=0, sumAoA=0, sumEoT=0, sumEoA=0, sumInRouth=0, sumZeroBath=0;
    rows = rows.filter(e => aoTargetIdx.size === 0 || aoTargetIdx.has(normalizeName(e.name)));
    rows.forEach((e, i) => {
      const aoT = aoTargetIdx.size > 0
        ? (aoTargetIdx.has(normalizeName(e.name)) ? aoTargetIdx.get(normalizeName(e.name)) : null)
        : (e.aoTarget ?? 0);
      const aoA = e.aoActual ?? null;
      const eoT = e.eoTarget ?? (aoT ? Math.round(aoT * 0.7) : null);
      const eoA = e.eoActual ?? null;
      sumAoT += aoT; sumAoA += (aoA||0); sumEoT += (eoT||0); sumEoA += (eoA||0);
      sumInRouth += (e.inRouth||0); sumZeroBath += (e.zeroBath||0);
      const rowBg = whRowBg(e.empCode);
      out += `<tr style="${rowBg}">
        <td class="seq">${i+1}</td>
        <td style="text-align:left">คุณ ${e.name}</td>
        <td>${e.empCode}</td>
        <td class="col-ao">${fmtN(aoT)}</td>
        <td class="col-ao">${fmtN(aoA)}</td>
        <td class="col-ao" style="${pctBg(aoA, aoT)}">${fmtPct(aoA, aoT)}</td>
        <td class="col-eo">${fmtN(eoT)}</td>
        <td class="col-eo">${fmtN(eoA)}</td>
        <td class="col-eo" style="${pctBg(eoA, eoT)}">${fmtPct(eoA, eoT)}</td>
        <td class="col-s0">${e.inRouth !== null ? e.inRouth.toLocaleString() : '<span style="color:var(--muted)">-</span>'}</td>
        <td class="col-s0">${e.zeroBath !== null ? e.zeroBath.toLocaleString() : '<span style="color:var(--muted)">-</span>'}</td>
        <td class="col-s0" style="${(e.inRouth && e.zeroBath !== null) ? pctBg(e.zeroBath, e.inRouth) : ''}">${(e.inRouth && e.zeroBath !== null) ? fmtPct(e.zeroBath, e.inRouth) : '<span style="color:var(--muted)">-</span>'}</td>
      </tr>`;
    });
    const eoTShow = sumEoT || Math.round(sumAoT * 0.7);
    out += `<tr class="sum-row">
      <td colspan="3">รวมช่องทาง${label}</td>
      <td>${sumAoT.toLocaleString()}</td><td>${sumAoA.toLocaleString()}</td><td>${fmtPct(sumAoA, sumAoT)}</td>
      <td>${eoTShow.toLocaleString()}</td><td>${sumEoA.toLocaleString()}</td><td>${fmtPct(sumEoA, eoTShow)}</td>
      <td>${sumInRouth.toLocaleString()}</td><td>${sumZeroBath.toLocaleString()}</td><td>${sumInRouth ? fmtPct(sumZeroBath, sumInRouth) : '<span style="color:rgba(255,255,255,.4)">-</span>'}</td>
    </tr>`;
    return out;
  };

  html += renderGroup('ส่ง', groups['ส่ง']);
  html += renderGroup('ปลีก', groups['ปลีก']);
  html += `</tbody></table></div>
<p class="txt-sm txt-muted" style="margin-top:8px">* Effective Outlet: ร้านส่ง ≥ 40,000 บาท/เดือน · ร้านปลีก ≥ 2,500 บาท/เดือน &nbsp;|&nbsp; Store 0 Bath: รอข้อมูลชีตใหม่</p>`;

  el.innerHTML = html;
}
