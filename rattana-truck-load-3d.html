<style>
:root{--navy:#0d1b3e;--navy-mid:#1a2f5e;--navy-light:#243b73;--gold:#c9a84c;--gold-light:#e8c86a;--success:#2ecc71;--danger:#e74c3c;--warning:#f39c12;--bg:#f4f6fb;--text:#0d1b3e;--card-bg:#ffffff;--border:#dde3f0;--muted:#6b7896;--shadow-md:0 2px 8px rgba(0,0,0,.08);--radius-md:12px}
body.dark{--bg:#0a1020;--text:#e8eaf0;--card-bg:#111c35;--border:#243b73;--muted:#8a98b8}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Sarabun',sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;overflow-x:hidden}
button{font-family:inherit;cursor:pointer;border:none;-webkit-tap-highlight-color:transparent}
header{background:var(--navy);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:10px;border-bottom:3px solid var(--gold);position:sticky;top:0;z-index:100}
.logo-text{font-weight:700;font-size:15px;color:#fff}.logo-text span{color:var(--gold)}
.icon-btn{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.2);width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer}
.icon-btn:hover{background:rgba(255,255,255,.12)}
.ctrl-bar{background:var(--card-bg);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;position:sticky;top:58px;z-index:50}
.sel{height:40px;padding:0 12px;border:1.5px solid var(--border);border-radius:8px;background:var(--card-bg);color:var(--text);font-family:inherit;font-size:13px}
.sel:focus{border-color:var(--gold);outline:none}
.btn{display:inline-flex;align-items:center;gap:5px;padding:8px 13px;border-radius:8px;font-size:12px;font-weight:600;font-family:inherit;cursor:pointer;border:1px solid transparent;min-height:36px;transition:opacity .15s}
.btn:hover{opacity:.85}.btn-gold{background:var(--gold);color:var(--navy)}.btn-navy{background:var(--navy);color:#fff}.btn-out{background:transparent;color:var(--text);border-color:var(--border)}
#canvas-wrap{position:relative;background:#050912}
#threeCanvas{display:block;width:100%}
.cam-hint{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.55);color:rgba(255,255,255,.65);font-size:10px;padding:3px 10px;border-radius:8px;pointer-events:none;white-space:nowrap;font-family:'Sarabun',sans-serif}
.reset-btn{position:absolute;top:8px;right:8px;background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.3);padding:5px 11px;border-radius:7px;font-size:11px;cursor:pointer;font-family:inherit}
.reset-btn:hover{background:rgba(255,255,255,.25)}
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:10px 14px;background:var(--card-bg);border-bottom:1px solid var(--border)}
.stat-box{text-align:center;padding:8px;background:var(--bg);border-radius:10px}
.s-val{font-size:20px;font-weight:700;line-height:1.1}
.s-lbl{font-size:10px;color:var(--muted);margin-top:2px}
.s-sub{font-size:10px;color:var(--muted)}
.pbar-wrap{height:5px;background:var(--border);border-radius:3px;margin-top:3px;overflow:hidden}
.pbar{height:100%;border-radius:3px;transition:width .4s;width:0}
.bottom{display:flex;flex-direction:column}
@media(min-width:640px){.bottom{flex-direction:row}}
.legend-panel{padding:12px 14px;border-right:1px solid var(--border);min-width:180px;background:var(--card-bg)}
.legend-panel h4,.items-panel h4{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;margin-bottom:8px}
.legend-item{display:flex;align-items:center;gap:8px;padding:3px 0;font-size:12px}
.ldot{width:12px;height:12px;border-radius:3px;flex-shrink:0}
.items-panel{flex:1;padding:12px 14px;overflow-x:auto;background:var(--card-bg)}
.itbl{width:100%;border-collapse:collapse;font-size:12px;min-width:480px}
.itbl th{background:var(--navy);color:#fff;padding:6px 8px;text-align:left;white-space:nowrap}
.itbl td{padding:5px 8px;border-bottom:1px solid var(--border)}
.itbl tr:nth-child(even) td{background:var(--bg)}
.modal-ov{display:none;position:fixed;inset:0;background:rgba(13,27,62,.65);z-index:9000;align-items:center;justify-content:center;padding:16px}
.modal-ov.open{display:flex}
.modal{background:var(--card-bg);border-radius:14px;max-width:400px;width:100%;border-top:4px solid var(--gold);overflow:hidden}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-bottom:1px solid var(--border)}
.modal-head h3{font-size:14px;font-weight:700}
.mclose{background:transparent;border:none;font-size:22px;color:var(--muted);cursor:pointer;padding:0 4px;line-height:1}
.modal-body{padding:16px;display:flex;flex-direction:column;gap:10px}
.field label{font-size:10px;font-weight:700;color:var(--muted);display:block;margin-bottom:3px;letter-spacing:.3px;text-transform:uppercase}
.inp{width:100%;height:40px;padding:0 12px;border:1.5px solid var(--border);border-radius:8px;background:var(--card-bg);color:var(--text);font-family:inherit;font-size:14px}
.inp:focus{border-color:var(--gold);outline:none}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toast{position:fixed;bottom:20px;right:16px;padding:11px 18px;border-radius:10px;color:#fff;z-index:9999;font-weight:600;font-size:13px;font-family:'Sarabun',sans-serif;box-shadow:0 4px 16px rgba(0,0,0,.25)}
@keyframes slideIn{from{transform:translateX(120%);opacity:0}to{transform:translateX(0);opacity:1}}
.toast{animation:slideIn .3s ease}
#srcNote:empty{display:none}
</style>
</head>

// ─── DATA ─────────────────────────────────────────────────────────────────────
// w=กว้าง, l=ยาว, h=สูง (ซม. จากชีท Car จริง) · maxV=m³ · maxW=kg

const COLORS = ['#3B82F6','#10B981','#F59E0B','#EF4444','#8B5CF6','#EC4899','#14B8A6','#F97316','#6366F1','#84CC16','#06B6D4','#D946EF','#78716C','#0EA5E9'];
let custColorMap = {}, colorIdx = 0;
function custColor(id){ if(!custColorMap[id]){custColorMap[id]=COLORS[colorIdx%COLORS.length];colorIdx++;} return custColorMap[id]; }

let currentTruck = null;
let items = [];      // {name,vol,wt,cust,qty}
let packed = [];     // expanded individual boxes with 3D positions

// ─── THREE.JS ─────────────────────────────────────────────────────────────────
let scene, camera, renderer, controls, truckGrp, boxGrp;

function initThree(){
  const canvas = document.getElementById('threeCanvas');
  renderer = new THREE.WebGLRenderer({canvas, antialias:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.shadowMap.enabled = true;

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x050912);
  scene.fog = new THREE.FogExp2(0x050912, 0.03);

  camera = new THREE.PerspectiveCamera(45,1,0.01,200);
  camera.position.set(6,5,10);

  scene.add(new THREE.AmbientLight(0xffffff,0.6));
  const dir = new THREE.DirectionalLight(0xffffff,0.9);
  dir.position.set(8,15,8); dir.castShadow=true;
  dir.shadow.mapSize.set(1024,1024);
  scene.add(dir);
  const fill = new THREE.DirectionalLight(0x6699ff,0.3);
  fill.position.set(-5,3,-8); scene.add(fill);

  const grid = new THREE.GridHelper(60,60,0x1a2f5e,0x1a2f5e);
  grid.position.y=-0.005; scene.add(grid);

  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping=true; controls.dampingFactor=0.07;
  controls.minDistance=1; controls.maxDistance=50;
  controls.maxPolarAngle=Math.PI*0.88;

  truckGrp = new THREE.Group(); boxGrp = new THREE.Group();
  scene.add(truckGrp); scene.add(boxGrp);

  resizeThree();
  window.addEventListener('resize', resizeThree);
  (function loop(){ requestAnimationFrame(loop); controls.update(); renderer.render(scene,camera); })();
}

function resizeThree(){
  const w = document.getElementById('canvas-wrap').clientWidth;
  const h = Math.min(Math.max(w*0.52,260),520);
  document.getElementById('canvas-wrap').style.height = h+'px';
  renderer.setSize(w,h);
  camera.aspect = w/h;
  camera.updateProjectionMatrix();
}

// ─── TRUCK DIMENSIONS ─────────────────────────────────────────────────────────
// ใช้มิติจริงจากชีท Car (ซม. → เมตร) · fallback ประมาณจาก maxV ถ้าไม่มีข้อมูล
function truckDims(t){
  if(t.w && t.l && t.h){
    return {W:t.w/100, H:t.h/100, L:t.l/100};
  }
  // fallback
  const V=t.maxV, tp=t.type;
  let W,H;
  if(tp.includes('กระบะ'))      {W=1.5;H=0.75;}
  else if(tp.includes('4 ล้อ')) {W=2.0;H=1.8;}
  else if(tp.includes('6 ล้อ')) {W=2.1;H=2.1;}
  else if(tp.includes('10 ล้อ')){W=2.2;H=2.2;}
  else if(tp.includes('12 ล้อ')){W=2.3;H=2.3;}
  else                           {W=2.0;H=2.0;}
  return {W, H, L:V/(W*H)};
}

// ─── BOX DIMS FROM VOLUME (liters) ────────────────────────────────────────────
// Proportion h:w:d ≈ 1:1.2:1.5 → V = 1.8h³
const AIR=()=>+(document.getElementById('airSel')?.value||0);
function boxDims(vol_L){
  const V = vol_L * 0.001; // m³
  const h = Math.cbrt(V/1.8);
  return {bw: h*1.2, bh: h, bd: h*1.5};
}

// ─── PACKING ──────────────────────────────────────────────────────────────────
function packAll(boxList, dims){
  const {W,H,L} = dims;
  const EPS = 0.002;
  // Sort largest first
  // ร้านส่งทีหลัง (order มาก) เข้าไปลึกสุดก่อน · ร้านแรกอยู่ท้ายตู้หยิบง่าย · ลำดับเท่ากัน = ลังใหญ่ก่อน
  // ในร้านเดียวกันเรียงลังสูงก่อน → แถวเดียวกันสูงใกล้กัน ไม่เสียที่ด้านบนแถว
  const sorted = [...boxList].sort((a,b)=>((b.order||0)-(a.order||0)) || (b.bh-a.bh) || (b.bd-a.bd));
  // "แผนที่ความลึก": มองหน้าตัดตู้ (กว้าง×สูง) เป็นตาราง ช่องละ C เมตร · D[j][i] = ลังดันเข้าไปถึงความลึกเท่าไรแล้ว
  // z=0 = ชิดหัวรถ · ร้านส่งหลังสุดวางก่อนจึงอยู่ลึก ร้านแรกอยู่ติดประตูท้าย ไม่โดนทับ
  // แต่ละลังเลือกตำแหน่ง (และหมุน 90° ได้) ที่ดันเข้าไปได้ลึกสุด โดยต้องมีลังข้างล่างรองรับ ≥70% ของความกว้าง
  const C=0.05, NX=Math.floor((W+EPS)/C), NY=Math.floor((H+EPS)/C);
  const D=Array.from({length:NY},()=>new Float64Array(NX));
  // ปัดเศษปกติ (ไม่ปัดขึ้น) — ปัดขึ้นทำเสียที่ ~10%/ด้าน · เกินได้ไม่เกิน C/2 ซึ่งอยู่ในช่องอากาศอยู่แล้ว
  const cells=v=>Math.max(1,Math.round(v/C));
  for(const b of sorted){
    let best=null;
    for(const rot of [false,true]){
      const bw=rot?b.bd:b.bw, bd=rot?b.bw:b.bd, nx=cells(bw), ny=cells(b.bh);
      if(nx>NX||ny>NY) continue;
      for(let j=0;j+ny<=NY;j++){
        for(let i=0;i+nx<=NX;i++){
          let z=0;
          for(let jj=j;jj<j+ny&&z<L;jj++){const row=D[jj]; for(let ii=i;ii<i+nx;ii++) if(row[ii]>z) z=row[ii];}
          if(z+bd>L+EPS) continue;
          if(best&&z>best.z+1e-6) continue;
          if(j>0){ // ต้องมีของรองข้างล่างลึกพอ ไม่ลอย
            const below=D[j-1]; let sup=0;
            for(let ii=i;ii<i+nx;ii++) if(below[ii]>=z+bd*0.5) sup++;
            if(sup<nx*0.7) continue;
          }
          if(!best||z<best.z-1e-6||(Math.abs(z-best.z)<1e-6&&(j<best.j||(j===best.j&&i<best.i))))
            best={z,i,j,nx,ny,bw,bd,rot};
        }
      }
    }
    if(!best){ b.ok=false; continue; }
    if(best.rot){ b.bw=best.bw; b.bd=best.bd; }
    for(let jj=best.j;jj<best.j+best.ny;jj++) for(let ii=best.i;ii<best.i+best.nx;ii++) D[jj][ii]=best.z+best.bd;
    b.px=best.i*C+b.bw/2; b.py=best.j*C+b.bh/2; b.pz=best.z+b.bd/2; b.ok=true;
  }
  return sorted;
}

// ─── RENDER TRUCK ─────────────────────────────────────────────────────────────
function renderTruck(dims){
  truckGrp.clear();
  const {W,H,L}=dims;

  // Wireframe shell
  const geo = new THREE.BoxGeometry(W,H,L);
  const mat = new THREE.MeshBasicMaterial({color:0xc9a84c,wireframe:true,transparent:true,opacity:0.35});
  const shell = new THREE.Mesh(geo,mat);
  shell.position.set(W/2,H/2,L/2);
  truckGrp.add(shell);

  // Floor
  const fl = new THREE.Mesh(new THREE.PlaneGeometry(W,L),
    new THREE.MeshStandardMaterial({color:0x1a2a4a,transparent:true,opacity:0.6}));
  fl.rotation.x=-Math.PI/2; fl.position.set(W/2,0,L/2);
  fl.receiveShadow=true; truckGrp.add(fl);

  // Back + side walls (semi-transparent)
  const wm = new THREE.MeshStandardMaterial({color:0x152040,transparent:true,opacity:0.22,side:THREE.DoubleSide});
  const bk=new THREE.Mesh(new THREE.PlaneGeometry(W,H),wm);
  bk.position.set(W/2,H/2,0); truckGrp.add(bk);
  const lw=new THREE.Mesh(new THREE.PlaneGeometry(L,H),wm);
  lw.rotation.y=Math.PI/2; lw.position.set(0,H/2,L/2); truckGrp.add(lw);
  const rw=new THREE.Mesh(new THREE.PlaneGeometry(L,H),wm);
  rw.rotation.y=-Math.PI/2; rw.position.set(W,H/2,L/2); truckGrp.add(rw);

  truckGrp.position.set(-W/2,0,-L/2);

  // Camera aim
  const md=Math.max(W,H,L);
  camera.position.set(md*1.6, md*0.9, md*2.2);
  controls.target.set(0,H/2,0);
  controls.update();
}

function renderBoxes(boxes, dims){
  boxGrp.clear();
  const {W,L}=dims;
  // ลังขนาด/สีเดียวกันใช้ geometry+material ร่วมกัน (หลายพันลังยังลื่น)
  const geoC={}, edgeC={}, matC={};
  const lineMat=new THREE.LineBasicMaterial({color:0x000000,transparent:true,opacity:0.25});
  for(const b of boxes){
    if(!b.ok) continue;
    const gk=[b.bw,b.bh,b.bd].map(v=>v.toFixed(4)).join();
    const geo=geoC[gk]||(geoC[gk]=new THREE.BoxGeometry(b.bw*b.sc,b.bh*b.sc,b.bd*b.sc));
    const eg=edgeC[gk]||(edgeC[gk]=new THREE.EdgesGeometry(geo));
    const col=custColor(b.cust);
    const mat=matC[col]||(matC[col]=new THREE.MeshStandardMaterial({color:new THREE.Color(col),roughness:0.55,metalness:0.08}));
    const m=new THREE.Mesh(geo,mat);
    m.position.set(b.px-W/2, b.py, b.pz-L/2);
    m.castShadow=true; m.receiveShadow=true;
    boxGrp.add(m);
    const el=new THREE.LineSegments(eg,lineMat);
    el.position.copy(m.position); boxGrp.add(el);
  }
}

// ─── MAIN ACTION ──────────────────────────────────────────────────────────────
function packAndRender(quiet){
  if(!currentTruck){showToast('เลือกรถก่อนครับ','warning');return;}
  if(!items.length){ if(!quiet) showToast('ยังไม่มีสินค้า','warning'); return; }

  const dims=truckDims(currentTruck);
  // Expand items × qty
  const boxes=[];
  for(const it of items){
    const bd=boxDims(it.vol*(1+AIR()));   // ลังกินที่จริง = ปริมาตรสินค้า + ช่องอากาศ
    bd.sc=Math.cbrt(1/(1+AIR()))*0.97;     // วาดลังเท่าขนาดสินค้า ช่องว่างรอบลัง = อากาศ
    for(let i=0;i<it.qty;i++) boxes.push({...bd,vol:it.vol,wt:it.wt,cust:it.cust,name:it.name,order:it.order||0});
  }
  packed=packAll(boxes,dims);

  renderTruck(dims);
  renderBoxes(packed,dims);
  updateStats(dims);
  renderTable();
  renderLegend();

  const bad=packed.filter(b=>!b.ok).length;
  if(!quiet) showToast(bad?`⚠ วางไม่ได้ ${bad} ลัง`:`✓ จัดได้ครบ ${packed.length} ลัง`, bad?'warning':'success');
}

function updateStats(dims){
  if(!currentTruck) return;
  const placed=packed.filter(b=>b.ok);
  const goodsV=placed.reduce((s,b)=>s+b.vol,0)/1000, totV=goodsV*(1+AIR());   // ปริมาตรรวมช่องอากาศ
  const totW=placed.reduce((s,b)=>s+b.wt,0);
  const pV=currentTruck.maxV>0?totV/currentTruck.maxV*100:0;
  const pW=currentTruck.maxW>0?totW/currentTruck.maxW*100:0;
  const vc=pV>100?'var(--danger)':pV>85?'var(--warning)':'var(--success)';
  const wc=pW>100?'var(--danger)':pW>85?'var(--warning)':'var(--success)';

  const setV=(id,v,c)=>{document.getElementById(id).textContent=v;document.getElementById(id).style.color=c;};
  setV('sVol',Math.round(pV)+'%',vc);
  setV('sWt',Math.round(pW)+'%',wc);
  document.getElementById('bVol').style.cssText=`width:${Math.min(pV,100)}%;background:${vc}`;
  document.getElementById('bWt').style.cssText=`width:${Math.min(pW,100)}%;background:${wc}`;
  document.getElementById('sVolN').textContent=`${goodsV.toFixed(2)} + อากาศ ${Math.round(AIR()*100)}% = ${totV.toFixed(2)} / ${currentTruck.maxV} m³`;
  document.getElementById('sWtN').textContent=`${totW.toLocaleString()} / ${currentTruck.maxW.toLocaleString()} kg`;
  document.getElementById('sBoxes').textContent=packed.length;
  document.getElementById('sPlaced').textContent=`${placed.length} / ${packed.length} วาง`;
}

// ─── KEEPDATA (แผนจัดรถที่บันทึกจากแอปจัดรถ) ─────────────────────────────────
// ชีทมีแค่ปริมาตร/น้ำหนักรวมต่อบิล ไม่มีรายการสินค้า → แตกเป็นลังมาตรฐาน STD_BOX_L ลิตร
const SHEET_ID='1OvXga8M0XuUEMYqWPj_AIcBHTEI_vA_WXXNJpqUk0aQ';
const STD_BOX_L=20;
let keepRows=[];
function parseCSV(t){
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){ if(c=='"'){ if(t[i+1]=='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if(c=='"') q=true;
    else if(c==','){row.push(f);f='';}
    else if(c=='\n'){row.push(f);rows.push(row);row=[];f='';}
    else if(c!='\r') f+=c;
  }
  if(f||row.length){row.push(f);rows.push(row);}
  const h=rows.shift()||[];
  return rows.map(r=>Object.fromEntries(h.map((k,i)=>[k.trim(),r[i]||''])));
}
function dateKey(s){ // → YYYY-MM-DD ใช้เรียง/เทียบ
  s=String(s||'').trim(); let m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if(m){let y=+m[3]; if(y>2400)y-=543; return `${y}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;}
  m=s.match(/^(\d{4})-(\d{2})-(\d{2})/); return m?`${m[1]}-${m[2]}-${m[3]}`:'';
}
function thDate(k){const [y,m,d]=k.split('-');return `${d}/${m}/${+y+543}`;}
async function loadKeepdata(){
  try{
    const u=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&headers=1&sheet=Keepdata`;
    const r=await fetch(u,{cache:'no-store'}); if(!r.ok) throw new Error(r.status);
    keepRows=parseCSV(await r.text()).map(r=>({
      date:dateKey(r['วันที่ส่ง']), plate:String(r['ทะเบียนรถ']||'').trim(), trip:parseInt(r['เที่ยว'])||1,
      ref:r['เลขบิล']||'', code:r['รหัสร้านค้า']||'', name:r['ชื่อร้านค้า']||'',
      wt:parseFloat(r['น้ำหนัก (กก.)'])||0, vol:parseFloat(r['ปริมาตร (m³)'])||0, seq:parseInt(r['ลำดับร้าน'])||0
    })).filter(r=>r.plate&&r.date&&String(r.ref).indexOf('PU-')!==0);
    fillDates();
  }catch(e){ console.warn('Keepdata',e); showToast('โหลดแผนจัดรถ (Keepdata) ไม่ได้','error'); }
}
function fillDates(){
  const sel=document.getElementById('dateSel'), cur=sel.value;
  const p=currentTruck?.plate;
  const ds=[...new Set(keepRows.filter(r=>!p||r.plate===p).map(r=>r.date))].sort().reverse();
  sel.innerHTML='<option value="">📅 วันที่ส่ง...</option>'+ds.map(d=>`<option value="${d}">📅 ${thDate(d)}</option>`).join('');
  const today=new Date(Date.now()+7*3600e3).toISOString().slice(0,10);
  // วันที่เลือกไว้ → วันนี้ → วันส่งถัดไปที่ใกล้สุด → วันล่าสุด
  sel.value=ds.includes(cur)?cur:(ds.filter(d=>d>=today).pop()||ds[0]||'');
  fillTrips();
}
function fillTrips(){
  const sel=document.getElementById('tripSel'), cur=sel.value, d=document.getElementById('dateSel').value;
  const ts=[...new Set(keepRows.filter(r=>r.plate===currentTruck?.plate&&r.date===d).map(r=>r.trip))].sort((a,b)=>a-b);
  sel.innerHTML='<option value="">ทุกเที่ยว</option>'+ts.map(t=>`<option value="${t}">เที่ยว ${t}</option>`).join('');
  sel.value=ts.includes(+cur)?cur:(ts.length?String(ts[0]):'');
}
function onPlanChange(e){
  if(document.activeElement?.id==='dateSel') fillTrips();
  loadPlanItems();
}
// ─── รายการสินค้าในบิล (ชีท Order) + ขนาดลัง (ชีท Product) ──────────────────────
// สูตรเดียวกับแอปจัดรถ: ชิ้น = (TRD_QTY+TRD_Q_FREE) × เลขหลัง x ใน TRD_UTQNAME · ลัง = ชิ้น ÷ QTY CS
// GOODS_VOLUME = ลิตร/ลัง · GOODS_WEIGHT = กก./ลัง · สินค้าที่ไม่มีขนาด → เติมส่วนที่ขาดจากปริมาตรบิลใน Keepdata
const ORDER_SHEET_ID='1NO8sHyDxwHTRqgcLFCxq_g_Rr09lfe4gt_odwkIgiB0';
const PRODUCT_SHEET_ID='16mYDqAqqJma-_0vCIAajy6bcjdOZ7F6VagxkdkqAB2I';
const gviz=(id,sh,tq)=>fetch(`https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:csv&headers=1&sheet=${encodeURIComponent(sh)}&tq=${encodeURIComponent(tq)}`,{cache:'no-store'})
  .then(r=>{if(!r.ok)throw new Error(r.status);return r.text();}).then(parseCSV);
const packOf=u=>{const m=/x\s*(\d+)/.exec(u||'');return m?(+m[1]||1):1;};
let products=null, _prodP=null;
const billLines={};          // เลขบิล → [{sku,utq,qty,free}] (โหลดแล้วเก็บไว้)
function loadProducts(){
  return _prodP||(_prodP=gviz(PRODUCT_SHEET_ID,'Sheet1','SELECT A, Q, DS, DV WHERE DV > 0 OR DS > 0').then(rows=>{
    products={};
    rows.forEach(p=>{const n=String(p['PRODUCT NAME']||'').trim(); if(n) products[n]={cs:+p['QTY CS']||0,kg:+p['GOODS_WEIGHT']||0,L:+p['GOODS_VOLUME']||0};});
  }).catch(e=>{_prodP=null;throw e;}));
}
async function loadBillLines(refs){
  const need=refs.filter(r=>r&&!billLines[r]&&!/'/.test(r));
  for(let i=0;i<need.length;i+=25){
    const part=need.slice(i,i+25), where=part.map(r=>`B = '${r}'`).join(' OR ');
    // ใบจอง BK/BV อยู่แท็บ BK_BV · บิลเปิดแล้ว DS/DC อยู่แท็บ DS_DC (คอลัมน์ชุดเดียวกัน)
    const res=await Promise.all(['BK_BV','DS_DC'].map(t=>gviz(ORDER_SHEET_ID,t,`SELECT B, I, J, K, L WHERE ${where}`).catch(()=>[])));
    part.forEach(r=>billLines[r]=[]);
    res.flat().forEach(l=>{const r=l['DI_REF']; if(billLines[r]) billLines[r].push({sku:String(l['SKU_NAME']||'').trim(),utq:l['TRD_UTQNAME'],qty:+l['TRD_QTY']||0,free:+l['TRD_Q_FREE']||0});});
  }
}
function planRows(){
  const d=document.getElementById('dateSel').value, t=document.getElementById('tripSel').value;
  // ลำดับส่ง: เที่ยว แล้วลำดับร้าน (ไม่มีลำดับ = ต่อท้าย)
  return keepRows.filter(r=>r.plate===currentTruck.plate&&r.date===d&&(!t||r.trip===+t))
    .sort((a,b)=>(a.trip-b.trip)||((a.seq||999)-(b.seq||999)));
}
function stdBoxes(list,label,L,kg,cust,order){ // แตกปริมาตรเป็นลังมาตรฐาน
  if(L<=0) return;
  const qty=Math.max(1,Math.round(L/STD_BOX_L));
  list.push({name:label,vol:L/qty,wt:+(kg/qty).toFixed(2),cust,qty,order,est:true});
}
function buildItems(rows){
  const out=[]; let skuHit=0, skuAll=0;
  rows.forEach((r,i)=>{
    const cust=r.name||r.code||'ไม่ระบุ', order=i+1, lines=billLines[r.ref];
    if(!products||!lines||!lines.length){ stdBoxes(out,r.ref+' (ประมาณจากปริมาตรบิล)',r.vol*1000,r.wt,cust,order); return; }
    let gotL=0, gotKg=0, miss=[];
    lines.forEach(l=>{
      const ea=(l.qty+l.free)*packOf(l.utq); if(ea<=0) return;
      const p=products[l.sku]; skuAll++;
      if(!p||!(p.L>0)){ miss.push(l.sku); return; }
      skuHit++;
      const cases=p.cs>0?ea/p.cs:(l.qty+l.free), full=Math.floor(cases+1e-6), rem=cases-full;
      const kgCS=p.kg||0;
      if(full>0) out.push({name:l.sku,vol:p.L,wt:+kgCS.toFixed(2),cust,qty:full,order,bill:r.ref});
      if(rem>0.01) out.push({name:l.sku+' (เศษลัง)',vol:Math.max(1,p.L*rem),wt:+(kgCS*rem).toFixed(2),cust,qty:1,order,bill:r.ref});
      gotL+=p.L*cases; gotKg+=kgCS*cases;
    });
    // สินค้าที่ชีท Product ไม่มีขนาด → เติมส่วนที่ยังขาดจากปริมาตร/น้ำหนักบิล
    const gapL=r.vol*1000-gotL;
    if(miss.length&&gapL>1) stdBoxes(out,`${r.ref} · ไม่มีขนาด ${miss.length} รายการ`,gapL,Math.max(0,r.wt-gotKg),cust,order);
  });
  return {out,skuHit,skuAll};
}
let _planGen=0;
async function loadPlanItems(){
  if(!currentTruck) return;
  const gen=++_planGen, rows=planRows();
  items=[]; custColorMap={}; colorIdx=0; packed=[]; boxGrp.clear();
  if(!rows.length){ renderTable(); renderLegend(); updateStats(truckDims(currentTruck));
    if(document.getElementById('dateSel').value) showToast('รถคันนี้ไม่มีแผนในวันที่เลือก','warning'); return; }
  // วาดแบบประมาณก่อน (ทันที) แล้วค่อยแทนด้วยรายการสินค้าจริงเมื่อโหลดเสร็จ
  const apply=()=>{ const b=buildItems(rows); items=b.out; custColorMap={}; colorIdx=0; rows.forEach(r=>custColor(r.name||r.code||'ไม่ระบุ'));
    renderTable(); renderLegend(); packAndRender(true); return b; };
  apply();
  const st=document.getElementById('srcNote'); st.textContent='⏳ กำลังดึงรายการสินค้าจากชีท Order...';
  try{
    await Promise.all([loadProducts(), loadBillLines(rows.map(r=>r.ref))]);
    if(gen!==_planGen) return;   // ผู้ใช้เปลี่ยนรถ/วันระหว่างรอ
    const b=apply();
    st.textContent=`📦 ขนาดลังจริง ${b.skuHit}/${b.skuAll} รายการ · ที่เหลือประมาณจากปริมาตรบิล (ลัง ${STD_BOX_L} ลิตร)`;
    const bad=packed.filter(x=>!x.ok).length;
    showToast(bad?`⚠ วางไม่ได้ ${bad} ลัง`:`✓ จัดได้ครบ ${packed.length} ลัง`, bad?'warning':'success');
  }catch(e){
    console.warn('order lines',e);
    if(gen===_planGen) st.textContent=`⚠ ดึงรายการสินค้าไม่ได้ — แสดงแบบประมาณ (ลัง ${STD_BOX_L} ลิตร)`;
  }
}

function onTruckChange(){
  const p=document.getElementById('truckSel').value;
  currentTruck=TRUCKS.find(t=>t.plate===p)||null;
  if(!currentTruck) return;
  if(keepRows.length && !_fromParams){ fillDates(); setTimeout(loadPlanItems,0); }
  const d=truckDims(currentTruck);
  renderTruck(d);
  boxGrp.clear();
  packed=[];
  updateStats(d);
  // reset stat display
  ['sVol','sWt'].forEach(id=>{document.getElementById(id).textContent='0%';document.getElementById(id).style.color='var(--success)';});
  ['bVol','bWt'].forEach(id=>document.getElementById(id).style.cssText='width:0;background:var(--success)');
  document.getElementById('sVolN').textContent=`0 / ${currentTruck.maxV} m³`;
  document.getElementById('sWtN').textContent=`0 / ${currentTruck.maxW.toLocaleString()} kg`;
  document.getElementById('sBoxes').textContent='0';
  document.getElementById('sPlaced').textContent='0 / 0 วาง';
}

// ─── ITEMS ────────────────────────────────────────────────────────────────────
function openAddModal(){ document.getElementById('addModal').classList.add('open'); document.getElementById('aName').focus(); }
function closeModal(){ document.getElementById('addModal').classList.remove('open'); }

function addItem(){
  const name=document.getElementById('aName').value.trim()||'สินค้า';
  const vol=parseFloat(document.getElementById('aVol').value);
  const wt=parseFloat(document.getElementById('aWt').value)||0;
  const cust=document.getElementById('aCust').value.trim()||'ไม่ระบุ';
  const qty=parseInt(document.getElementById('aQty').value)||1;
  if(!vol||vol<=0){showToast('กรอกปริมาตร (ลิตร) ให้ถูกต้อง','error');return;}
  items.push({name,vol,wt,cust,qty});
  custColor(cust);
  closeModal();
  renderTable(); renderLegend();
  showToast('เพิ่มสินค้าแล้ว','success');
  // clear form
  ['aName','aVol','aWt','aCust'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('aQty').value='1';
}

function removeItem(i){
  items.splice(i,1); packed=[];
  boxGrp.clear();
  renderTable(); renderLegend();
  if(currentTruck) updateStats(truckDims(currentTruck));
}

function clearAll(){
  if(!confirm('ล้างรายการทั้งหมด?')) return;
  items=[]; packed=[]; custColorMap={}; colorIdx=0; document.getElementById('srcNote').textContent='';
  boxGrp.clear();
  renderTable(); renderLegend();
  if(currentTruck) updateStats(truckDims(currentTruck));
}

// ─── CAMERA ───────────────────────────────────────────────────────────────────
function resetCam(){
  if(!currentTruck) return;
  const d=truckDims(currentTruck), md=Math.max(d.W,d.H,d.L);
  camera.position.set(md*1.6,md*0.9,md*2.2);
  controls.target.set(0,d.H/2,0);
  controls.update();
}

// ─── URL PARAMS (receive from delivery-queue) ──────────────────────────────────
function loadParams(){
  try{
    const p=new URLSearchParams(location.search);
    const plate=p.get('plate')||p.get('p');
    const raw=p.get('items');
    // sessionStorage fallback
    let ssData=null;
    try{ssData=JSON.parse(sessionStorage.getItem('truckLoad'));}catch{}

    const usePlate=plate||(ssData?.plate)||'';
    if(usePlate){
      document.getElementById('truckSel').value=usePlate;
      onTruckChange();
    }

    const rawItems=raw?(JSON.parse(decodeURIComponent(raw))):ssData?.items||[];
    if(rawItems.length){
      _fromParams=true;
      rawItems.forEach(it=>{ items.push({name:it.name||it.sku||'สินค้า',vol:+it.vol||1,wt:+it.wt||0,cust:String(it.cust||'ไม่ระบุ'),qty:+it.qty||1}); custColor(String(it.cust||'ไม่ระบุ')); });
      renderTable(); renderLegend();
    }
  }catch(e){console.warn('loadParams',e);}
}

// ─── THEME / TOAST ────────────────────────────────────────────────────────────
function toggleDark(){document.body.classList.toggle('dark');}

function showToast(msg,type='info'){
  const t=document.createElement('div');
  t.className='toast';
  const bg={success:'#2ecc71',error:'#e74c3c',warning:'#f39c12',info:'#1a2f5e'}[type]||'#1a2f5e';
  t.style.cssText=`background:${bg};color:${type==='warning'?'#0d1b3e':'#fff'}`;
  t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),3200);
}

// close modal on backdrop click
document.getElementById('addModal').addEventListener('click',e=>{if(e.target===document.getElementById('addModal')) closeModal();});

// ─── INIT ─────────────────────────────────────────────────────────────────────
let _fromParams=false;   // ส่งสินค้ามาทาง URL/sessionStorage = ใช้ของที่ส่งมา ไม่ดึงแผนจากชีททับ
populateTrucks();
initThree();
loadParams();
renderTable();
if(_fromParams && currentTruck) packAndRender();
loadKeepdata().then(()=>{
  if(!keepRows.length) return;
  if(!currentTruck){ // ยังไม่เลือกรถ → เลือกคันแรกที่มีแผนวันส่งใกล้สุดให้เลย
    const today=new Date(Date.now()+7*3600e3).toISOString().slice(0,10);
    const ds=[...new Set(keepRows.map(r=>r.date))].sort().reverse();
    const d=ds.filter(x=>x>=today).pop()||ds[0];
    const r=keepRows.find(r=>r.date===d&&TRUCKS.some(t=>t.plate===r.plate));
    if(r){ document.getElementById('truckSel').value=r.plate; onTruckChange(); }
  } else if(!_fromParams){ fillDates(); loadPlanItems(); }
});
</script>
